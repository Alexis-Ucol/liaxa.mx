<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Causas y Consecuencias de la Primera Guerra Mundial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Causas y Consecuencias de la Primera Guerra Mundial</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Causas y Consecuencias de la Primera Guerra Mundial</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c54', primaryDark:'#182a3b', primaryBg:'#eaeef3',
  accent:'#24549c', accentBg:'#e2ebf8',
  darkPrimary:'#5e85ab', darkPrimaryDark:'#8badce', darkPrimaryBg:'#152331',

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'his2_t05_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function startLesson() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('fillboth'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0;
  correctCount  = 0;
  var att = nextAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

   ================================================ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;

         { es:'Ejército muy reducido, sin aviación militar ni submarinos, y frontera del Rin desmilitarizada', en:'Sharply reduced army, no military aviation or submarines, and a demilitarized Rhine border' },
         { es:'Alemania se queda sin ejército ni policía de ningún tipo', en:'Germany is left with no army and no police of any kind' } ],

function mE_build(rng){
  MANIP.E = { v:[ Math.floor(rng()*2), Math.floor(rng()*2), Math.floor(rng()*2) ], tries:0, done:false, fb:'', fbk:'' };
}
function mE_mood(w){
  if (w <= 2) return { es:'Con condiciones tan suaves, los países vencedores, que habían perdido millones de vidas, difícilmente habrían firmado.', en:'With such mild terms, the victorious countries, which had lost millions of lives, would hardly have signed.' };
  if (w <= 4) return { es:'Un acuerdo negociado: en Alemania se viviría como una paz dura pero aceptable.', en:'A negotiated settlement: in Germany it would feel like a hard but acceptable peace.' };
  if (w <= 6) return { es:'Condiciones severas: buena parte de la sociedad alemana las rechazaría y hablaría de humillación.', en:'Severe terms: much of German society would reject them and speak of humiliation.' };
  return { es:'Un peso enorme: en Alemania se hablaría de un dictado impuesto, y ese resentimiento sería aprovechado años después por grupos autoritarios.', en:'An enormous weight: in Germany people would speak of an imposed dictate, and years later authoritarian groups would use that resentment.' };
}
function mE_paint(){
  var E = MANIP.E; if (!E) return;
  var w = E.v[0] + E.v[1] + E.v[2], k;
  for (k=0;k<3;k++){
    var el = document.getElementById('vsVal' + k);
    if (el) el.textContent = L(VSCTL[k].lv[E.v[k]]);
  }
  var beam = document.getElementById('vsBeam');
  if (beam) beam.style.transform = 'rotate(' + ((w - 4.5) * 3.1).toFixed(2) + 'deg)';
  var pr = document.getElementById('vsPanR');
  if (pr) pr.innerHTML = L({ es:'Peso de las condiciones', en:'Weight of the terms' }) + '<br><strong>' + w + '/9</strong>';
  var mood = document.getElementById('vsMood');
  if (mood) mood.textContent = L(mE_mood(w));
}
function mE_render(){
  var E = MANIP.E, z = document.getElementById('mzE');
  if (!E || !z) return;
  var ctls = VSCTL.map(function(c, k){
    return '<div class="vsctl">' +
             '<div class="vslbl"><span>' + L(c.lbl) + '</span><span class="vsval" id="vsVal' + k + '"></span></div>' +
             '<input class="mzsl" type="range" min="0" max="3" step="1" value="' + E.v[k] + '" oninput="mE_slide(' + k + ',this.value)">' +
           '</div>';
  }).join('');
  z.innerHTML =
    '<div class="mztitle">' + L({ es:'Reconstruye el tratado que se firmó en 1919', en:'Rebuild the treaty signed in 1919' }) + '</div>' +
    '<div class="mzq">' + L({ es:'Mueve los tres controles hasta dejar las condiciones que los vencedores impusieron realmente a Alemania. La barra se inclina con cada cambio.', en:'Move the three controls until you reach the terms the victors really imposed on Germany. The bar tilts with every change.' }) + '</div>' +
    '<div class="vsbeamwrap">' +
      '<div class="vsbeam" id="vsBeam">' +
        '<div class="vspan l">' + L({ es:'Lo que Alemania podía sostener', en:'What Germany could bear' }) + '</div>' +
        '<div class="vspan r" id="vsPanR"></div>' +
      '</div>' +
      '<div class="vspivot"></div>' +
    '</div>' +
    ctls +
    '<div class="vsmood" id="vsMood"></div>' +
    '<div class="mzrow">' +
      (E.done ? '' : '<button class="mzbtn" onclick="mE_check()">' + L({ es:'Firmar así el tratado', en:'Sign the treaty like this' }) + '</button>') +
    '</div>' +
    '<div class="mzfb' + (E.fbk ? ' ' + E.fbk : '') + '">' + E.fb + '</div>';
  mE_paint();
}
function mE_slide(k, val){
  var E = MANIP.E; if (!E) return;
  E.v[k] = parseInt(val, 10) || 0;
  mE_paint();
}
function mE_check(){
  var E = MANIP.E; if (!E || E.done) return;
  var k, miss = -1;
  for (k=0;k<3;k++) if (E.v[k] !== VSCTL[k].target){ miss = k; break; }
  if (miss < 0){
    E.done = true; E.fbk = 'ok';
    E.fb = L({ es:'Eso firmaron en 1919: pagos altos, pérdida de territorios y de todas las colonias, y un ejército muy reducido. Alemania lo llamó un dictado, y ese malestar acompañó a toda una generación.',
               en:'That is what was signed in 1919: high payments, loss of territories and of every colony, and a sharply reduced army. Germany called it a dictate, and that bitterness stayed with a whole generation.' });
    mE_render(); return;
  }
  E.tries++;
  if (E.tries >= 3){
    for (k=0;k<3;k++) E.v[k] = VSCTL[k].target;
    E.done = true; E.fbk = 'warn';
    E.fb = L({ es:'Esta fue la balanza real de 1919: pagos altos durante años, pérdida de Alsacia y Lorena, de tierras en el este y de todas las colonias, y un ejército sin aviación ni submarinos.',
               en:'This was the real balance of 1919: high payments over years, loss of Alsace and Lorraine, of lands in the east and of every colony, and an army without aviation or submarines.' });
    mE_render(); return;
  }
  E.fbk = 'bad';
  E.fb = L({ es:'Todavía no es el tratado de 1919. ', en:'That is not yet the 1919 treaty. ' }) +
         L(E.v[miss] < VSCTL[miss].target ? VSCTL[miss].up : VSCTL[miss].dn);
  mE_render();
}

/* ================================================
   buildLesson
   ================================================ */
function buildLesson(rng) {
  injectManipStyles();
  MANIP = {};
  mA_build(rng); mB_build(rng); mC_build(rng); mD_build(rng); mE_build(rng);

  /* ══════════════════ CONCEPTO 1 ══════════════════ */
  addSection(L({ es:'Concepto 1', en:'Concept 1' }), L({ es:'Europa antes del primer disparo', en:'Europe before the first shot' }),
    L({ es:'<p>A comienzos del siglo XX, Europa parecía vivir su mejor momento: ciudades iluminadas con electricidad, ferrocarriles que cruzaban el continente, fábricas enormes y colonias repartidas por casi todo el mundo. Debajo de esa superficie brillante se acumulaban tensiones que llevaban décadas creciendo. Cuando la guerra estalló en 1914, ninguna de esas tensiones era nueva: lo nuevo fue que todas actuaron al mismo tiempo.</p>' +
              '<p>El nacionalismo empujaba a cada pueblo a exaltar lo propio y a reclamar territorios. Francia no olvidaba Alsacia y Lorena, perdidas frente a Alemania en 1871; en los Balcanes, Serbia quería reunir bajo una sola bandera a los pueblos eslavos que vivían dentro de Austria-Hungría. El imperialismo enfrentaba a las potencias por colonias, materias primas y mercados: entre 1905 y 1911, Alemania y Francia estuvieron dos veces al borde de la guerra por el control de Marruecos. El militarismo llenó los presupuestos de acorazados y cañones y llevó a los estados mayores a preparar planes de invasión listos para usarse. Y el sistema de alianzas ató a las grandes potencias en dos bloques, de modo que un pleito entre dos países dejaba de ser asunto de dos.</p>',
          en:'<p>At the start of the twentieth century, Europe seemed to be at its best: cities lit by electricity, railways crossing the continent, huge factories and colonies spread across almost the whole world. Under that shining surface, tensions had been building for decades. When war broke out in 1914, none of those tensions was new: what was new was that they all acted at the same time.</p>' +
              '<p>Nationalism pushed each people to exalt its own and to claim territories. France had not forgotten Alsace and Lorraine, lost to Germany in 1871; in the Balkans, Serbia wanted to gather under one flag the Slavic peoples living inside Austria-Hungary. Imperialism set the powers against each other over colonies, raw materials and markets: between 1905 and 1911, Germany and France came twice to the brink of war over control of Morocco. Militarism filled budgets with battleships and guns and led general staffs to prepare invasion plans ready for use. And the alliance system tied the great powers into two blocs, so that a quarrel between two countries stopped being the business of two.</p>' }) +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + L({ es:'Nacionalismo', en:'Nationalism' }) + '</div><div class="rform">' + L({ es:'lo nuestro primero', en:'ours first' }) + '</div><div class="rnote">' + L({ es:'Cada pueblo reclama territorios y desconfía del vecino.', en:'Each people claims territory and distrusts its neighbour.' }) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L({ es:'Imperialismo', en:'Imperialism' }) + '</div><div class="rform">' + L({ es:'colonias y mercados', en:'colonies and markets' }) + '</div><div class="rnote">' + L({ es:'La competencia fuera de Europa tensa las relaciones dentro de Europa.', en:'Competition outside Europe strains relations inside Europe.' }) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L({ es:'Militarismo', en:'Militarism' }) + '</div><div class="rform">' + L({ es:'armarse y planear', en:'arm and plan' }) + '</div><div class="rnote">' + L({ es:'Presupuestos enormes y planes de guerra escritos con años de anticipación.', en:'Huge budgets and war plans written years in advance.' }) + '</div></div>' +
      '<div class="rcard"><div class="rname">' + L({ es:'Alianzas', en:'Alliances' }) + '</div><div class="rform">' + L({ es:'dos bloques', en:'two blocs' }) + '</div><div class="rnote">' + L({ es:'Quien ataca a uno se enfrenta a todos los que firmaron con él.', en:'Whoever attacks one faces everyone who signed with it.' }) + '</div></div>' +
    '</div>' +
    '<div class="mzone" id="mzA"></div>');
  mA_render();

  /* ── graded 1 ── */
  var p1v = [
    { q:{ es:'En 1914 las grandes potencias europeas estaban unidas por acuerdos firmados años antes: unas se comprometían a apoyarse en caso de ataque y otras a no dejar sola a su socia. ¿Qué efecto tuvo ese sistema de compromisos sobre un choque entre dos países?',
          en:'In 1914 the great European powers were bound by agreements signed years earlier: some promised support in case of attack and others promised not to leave their partner alone. What effect did that system of commitments have on a clash between two countries?' },
      o:{ es:['Convirtió un conflicto entre dos países en una guerra que arrastró a las grandes potencias del continente.',
              'Obligó a los gobiernos a llevar sus diferencias a un tribunal internacional antes de declarar la guerra.',
              'Permitió que cada potencia redujera su ejército porque sus socias le prestaban tropas.',
              'Aisló a cada potencia, de manera que cada una resolvió su conflicto por separado.'],
          en:['It turned a conflict between two countries into a war that dragged in the great powers of the continent.',
              'It forced governments to take their differences to an international court before declaring war.',
              'It allowed each power to shrink its army because its partners lent it troops.',
              'It isolated each power, so that each one settled its own conflict separately.'] }, c:0,
      h:{ es:'Piensa en qué pasa cuando dos países pelean y cada uno tiene socios comprometidos a defenderlo.',
          en:'Think about what happens when two countries fight and each one has partners committed to defend it.' },
      e:{ es:'Las alianzas no crearon el conflicto, pero le dieron tamaño: al comprometerse a defenderse entre sí, un enfrentamiento local obligó a entrar a los socios de cada bando y en pocas semanas media Europa estaba en guerra.',
          en:'The alliances did not create the conflict, but they gave it size: by committing to defend one another, a local clash forced the partners of each side to join, and within weeks half of Europe was at war.' } },
    { q:{ es:'Italia había firmado en 1882 un pacto con Alemania y Austria-Hungría, pero en 1915 entró en la guerra del lado contrario, después de negociar ventajas territoriales. ¿Qué muestra este cambio sobre el sistema de alianzas?',
          en:'Italy had signed a pact with Germany and Austria-Hungary in 1882, but in 1915 it entered the war on the opposite side, after negotiating territorial gains. What does this shift show about the alliance system?' },
      o:{ es:['Que las alianzas no funcionaban solas: cada gobierno las sostenía o las abandonaba según sus propios intereses.',
              'Que los tratados de alianza obligaban por igual a todos los firmantes y no admitían ninguna salida.',
              'Que las alianzas eran acuerdos comerciales sin ninguna consecuencia militar.',
              'Que ningún país europeo llegó a cumplir los compromisos de alianza que había firmado.'],
          en:['That alliances did not work by themselves: each government kept or dropped them according to its own interests.',
              'That alliance treaties bound every signatory equally and allowed no way out.',
              'That alliances were trade agreements with no military consequence at all.',
              'That no European country ever honoured the alliance commitments it had signed.'] }, c:0,
      h:{ es:'Compara lo que Italia había firmado con lo que hizo, y pregúntate qué ganó al cambiar de bando.',
          en:'Compare what Italy had signed with what it did, and ask what it gained by switching sides.' },
      e:{ es:'El caso italiano muestra que un tratado no obliga por sí mismo: los gobiernos calculaban qué les convenía. Aun así, la mayoría de las alianzas sí se cumplieron en 1914, y por eso el conflicto creció tan rápido.',
          en:'The Italian case shows that a treaty does not bind by itself: governments calculated what suited them. Even so, most alliances were honoured in 1914, and that is why the conflict grew so fast.' } }
  ];
  var v1 = pickVariant(p1v, rng);
  addProblem({ title:L({ es:'El peso de las alianzas', en:'The weight of the alliances' }), questionText:L(v1.q), options:L(v1.o), correct:v1.c, hint:L(v1.h), explanation:L(v1.e) }, rng);

  /* ── graded 2 ── */
  var p2v = [
    { q:{ es:'Francia no aceptaba la pérdida de Alsacia y Lorena, ocurrida en 1871, y Serbia quería reunir a los pueblos eslavos que vivían dentro de Austria-Hungría. ¿Qué raíz común tienen estas dos situaciones?',
          en:'France did not accept the loss of Alsace and Lorraine in 1871, and Serbia wanted to gather the Slavic peoples living inside Austria-Hungary. What common root do these two situations share?' },
      o:{ es:['El nacionalismo, que llevaba a cada pueblo a reclamar territorios y a ver al vecino como una amenaza.',
              'La escasez de alimentos, que obligaba a los países a buscar tierras de cultivo fuera de sus fronteras.',
              'La falta de ejércitos, que dejaba a esos países sin manera de defender lo que ya tenían.',
              'La ausencia de fronteras dibujadas en los mapas europeos de aquellos años.'],
          en:['Nationalism, which led each people to claim territory and to see the neighbour as a threat.',
              'Food shortages, which forced countries to look for farmland beyond their borders.',
              'The lack of armies, which left those countries unable to defend what they already had.',
              'The absence of borders drawn on the European maps of those years.'] }, c:0,
      h:{ es:'Fíjate en qué reclaman los dos casos: no piden dinero ni comida, sino algo relacionado con la identidad y el territorio.',
          en:'Look at what both cases demand: not money or food, but something tied to identity and territory.' },
      e:{ es:'En los dos casos un pueblo considera que ciertos territorios y ciertas personas le pertenecen por historia o por lengua. Ese sentimiento, el nacionalismo, alimentó reclamos que ningún gobierno podía ignorar sin perder apoyo interno.',
          en:'In both cases a people believes that certain territories and certain persons belong to it by history or by language. That feeling, nationalism, fed claims no government could ignore without losing support at home.' } },
    { q:{ es:'Entre 1905 y 1911, Alemania y Francia se enfrentaron dos veces por el control de Marruecos sin llegar a declararse la guerra. ¿Qué muestran esas dos crisis sobre la Europa anterior a 1914?',
          en:'Between 1905 and 1911, Germany and France clashed twice over control of Morocco without declaring war. What do those two crises show about Europe before 1914?' },
      o:{ es:['Que la competencia por colonias tensaba las relaciones entre potencias y las acostumbraba a negociar al borde de la guerra.',
              'Que las potencias europeas ya habían renunciado a tener colonias fuera de su continente.',
              'Que los conflictos coloniales se resolvían siempre en tribunales aceptados por todos los países.',
              'Que Alemania y Francia eran aliadas y coordinaban juntas el reparto de África.'],
          en:['That competition for colonies strained relations between powers and got them used to bargaining on the brink of war.',
              'That the European powers had already given up holding colonies outside their continent.',
              'That colonial disputes were always settled in courts accepted by every country.',
              'That Germany and France were allies and jointly coordinated the partition of Africa.'] }, c:0,
      h:{ es:'Pregúntate qué se estaba disputando y en qué estado quedaban las relaciones entre esos dos países después de cada crisis.',
          en:'Ask what was being disputed and what state relations between those two countries were left in after each crisis.' },
      e:{ es:'Marruecos no era el problema de fondo: lo que estaba en juego era el reparto del mundo entre potencias industriales. Cada crisis se cerró con un acuerdo, pero dejó más desconfianza y más prisa por armarse.',
          en:'Morocco was not the underlying problem: what was at stake was the division of the world among industrial powers. Each crisis ended in a deal, but left more distrust and more haste to arm.' } }
  ];
  var v2 = pickVariant(p2v, rng);
  addProblem({ title:L({ es:'Raíces del conflicto', en:'Roots of the conflict' }), questionText:L(v2.q), options:L(v2.o), correct:v2.c, hint:L(v2.h), explanation:L(v2.e) }, rng);

  /* ══════════════════ CONCEPTO 2 ══════════════════ */
  addSection(L({ es:'Concepto 2', en:'Concept 2' }), L({ es:'Sarajevo y el efecto dominó', en:'Sarajevo and the domino effect' }),
    L({ es:'<p>El 28 de junio de 1914, en Sarajevo, capital de Bosnia, un joven nacionalista serbobosnio disparó contra el archiduque Francisco Fernando, heredero del trono de Austria-Hungría, y contra su esposa. Bosnia había sido anexada por ese imperio en 1908, pese a la protesta de Serbia y de Rusia, y muchos de sus habitantes eslavos querían formar parte de Serbia.</p>' +
              '<p>Lo que vino después fue una cadena de decisiones tomadas en pocas semanas, cada una respondiendo a la anterior. Austria-Hungría, segura del apoyo alemán, envió a Serbia un ultimátum durísimo; la respuesta serbia no la satisfizo y le declaró la guerra. Rusia, que se presentaba como protectora de los pueblos eslavos, movilizó su ejército. Alemania exigió que esa movilización se detuviera y, al no conseguirlo, declaró la guerra a Rusia y a Francia; para atacar a Francia por sorpresa invadió Bélgica, un país neutral. Esa invasión llevó al Reino Unido a declarar la guerra a Alemania. En poco más de un mes, un atentado en una ciudad balcánica había puesto en guerra a las mayores potencias del planeta.</p>',
          en:'<p>On 28 June 1914, in Sarajevo, the capital of Bosnia, a young Serbian Bosnian nationalist shot Archduke Franz Ferdinand, heir to the throne of Austria-Hungary, and his wife. Bosnia had been annexed by that empire in 1908, despite protests from Serbia and Russia, and many of its Slavic inhabitants wanted to be part of Serbia.</p>' +
              '<p>What followed was a chain of decisions taken in a few weeks, each answering the one before. Austria-Hungary, sure of German support, sent Serbia a very harsh ultimatum; the Serbian reply did not satisfy it and it declared war. Russia, which presented itself as protector of the Slavic peoples, mobilized its army. Germany demanded that the mobilization stop and, failing to get that, declared war on Russia and on France; to attack France by surprise it invaded Belgium, a neutral country. That invasion led the United Kingdom to declare war on Germany. In little more than a month, an attack in a Balkan city had put the greatest powers on the planet at war.</p>' }) +
    '<div class="callout"><p><strong>' + L({ es:'Fíjate: ', en:'Notice: ' }) + '</strong>' + L({ es:'ninguna potencia planeaba exactamente la guerra que obtuvo. Cada gobierno tomó una decisión que le parecía prudente y que, sumada a las demás, cerró todas las salidas.', en:'no power planned exactly the war it got. Each government took a decision that seemed prudent and that, added to the others, closed off every way out.' }) + '</p></div>' +
    '<div class="mzone" id="mzB"></div>');
  mB_render();

  /* ── graded 3 ── */
  var p3v = [
    { q:{ es:'Cuando Austria-Hungría declaró la guerra a Serbia, Rusia comenzó de inmediato a movilizar su ejército, aunque el conflicto no la tocaba directamente. ¿Qué explica mejor esa reacción rusa?',
          en:'When Austria-Hungary declared war on Serbia, Russia at once began mobilizing its army, although the conflict did not touch it directly. What best explains that Russian reaction?' },
      o:{ es:['Se consideraba protectora de los pueblos eslavos y no aceptaba que Austria-Hungría dominara los Balcanes.',
              'Había firmado con Serbia un acuerdo comercial que la obligaba a comprarle toda su producción agrícola.',
              'Necesitaba una salida al mar del Norte que solo podía obtener atravesando el territorio serbio.',
              'Buscaba impedir que el Reino Unido ocupara Bosnia antes que ella.'],
          en:['It saw itself as protector of the Slavic peoples and would not accept Austro Hungarian control of the Balkans.',
              'It had signed a trade agreement with Serbia obliging it to buy all its farm output.',
              'It needed an outlet to the North Sea that it could only get by crossing Serbian territory.',
              'It sought to stop the United Kingdom from occupying Bosnia before it did.'] }, c:0,
      h:{ es:'Recuerda con qué papel se presentaba Rusia en los Balcanes y qué perdía si Austria-Hungría se imponía allí.',
          en:'Recall the role Russia claimed in the Balkans and what it stood to lose if Austria-Hungary prevailed there.' },
      e:{ es:'Rusia sostenía desde hacía décadas que defendía a los pueblos eslavos y quería influencia en los Balcanes. Dejar caer a Serbia habría significado perder prestigio y ceder la región a su rival, así que movilizó, y esa movilización obligó a responder a Alemania.',
          en:'For decades Russia had claimed to defend the Slavic peoples and wanted influence in the Balkans. Letting Serbia fall would have meant losing prestige and handing the region to its rival, so it mobilized, and that mobilization forced Germany to respond.' } },
    { q:{ es:'El Reino Unido no tenía alianza militar firmada con Serbia ni con Rusia para ese caso, y sin embargo declaró la guerra a Alemania el 4 de agosto de 1914. ¿Qué razón explica mejor su entrada?',
          en:'The United Kingdom had no signed military alliance with Serbia or Russia for that case, and yet it declared war on Germany on 4 August 1914. What reason best explains its entry?' },
      o:{ es:['Alemania invadió Bélgica, un país neutral cuya independencia el Reino Unido se había comprometido a respaldar, y esa costa quedaba frente a sus puertos.',
              'Alemania había ocupado varias islas británicas del mar del Norte durante los meses anteriores.',
              'Serbia le había prometido entregarle su flota de guerra a cambio de apoyo militar.',
              'El gobierno británico buscaba anexar los territorios de Austria-Hungría en los Balcanes.'],
          en:['Germany invaded Belgium, a neutral country whose independence the United Kingdom had pledged to back, and that coast lay opposite its ports.',
              'Germany had occupied several British islands in the North Sea in the previous months.',
              'Serbia had promised to hand over its war fleet in exchange for military support.',
              'The British government wanted to annex the Austro Hungarian lands in the Balkans.'] }, c:0,
      h:{ es:'Piensa en qué país neutral fue invadido y por qué su costa preocupaba tanto a una potencia naval.',

      e:{ es:'La invasión de Bélgica dio al gobierno británico un motivo legal y una razón estratégica: un compromiso previo con la neutralidad belga y el temor de que Alemania controlara la costa situada frente a Inglaterra. Con esa entrada, el conflicto ya involucraba a todo el continente.',

  addSection(L({ es:'Concepto 3', en:'Concept 3' }), L({ es:'Lo profundo y lo inmediato', en:'The deep and the immediate' }),
    L({ es:'<p>Quien estudia historia no se conforma con saber qué pasó: quiere saber por qué pasó, y para eso separa las causas según su peso y su ritmo. Las causas profundas son procesos largos, de años o décadas, que preparan el terreno; por sí solas casi nunca bastan para provocar un hecho, pero sin ellas ese hecho no se entiende. La causa inmediata, o detonante, es el suceso concreto que enciende la mecha en cuestión de días o semanas.</p>' +
              '<p>Confundir las dos lleva a explicaciones pobres. Si solo miras el detonante, la guerra parece un accidente; si solo miras las causas profundas, parece inevitable y no se entiende por qué estalló en ese verano y no en otro. Además, cada afirmación que hagas sobre el pasado necesita apoyarse en pruebas que hablen realmente del asunto que discutes: una prueba que suena convincente pero se refiere a otra región o a otro periodo no sostiene nada.</p>',
          en:'<p>Anyone who studies history is not satisfied with knowing what happened: they want to know why it happened, and for that they separate causes by weight and by pace. Deep causes are long processes, over years or decades, that prepare the ground; on their own they are almost never enough to bring about an event, but without them the event cannot be understood. The immediate cause, or trigger, is the concrete event that lights the fuse in a matter of days or weeks.</p>' +
              '<p>Confusing the two leads to poor explanations. If you look only at the trigger, the war looks like an accident; if you look only at the deep causes, it looks inevitable and it is unclear why it broke out in that summer and not another. Besides, every claim you make about the past needs to rest on evidence that really speaks about the matter under discussion: evidence that sounds convincing but refers to another region or another period supports nothing.</p>' }) +
    '<table class="dtable"><tr><th>' + L({ es:'Pregunta que te haces', en:'Question you ask' }) + '</th><th>' + L({ es:'Causa profunda', en:'Deep cause' }) + '</th><th>' + L({ es:'Detonante', en:'Trigger' }) + '</th></tr>' +
      '<tr><td>' + L({ es:'¿Cuánto tiempo llevaba formándose?', en:'How long had it been forming?' }) + '</td><td>' + L({ es:'Años o décadas', en:'Years or decades' }) + '</td><td>' + L({ es:'Días o semanas', en:'Days or weeks' }) + '</td></tr>' +
      '<tr><td>' + L({ es:'¿Bastaría por sí sola?', en:'Would it be enough on its own?' }) + '</td><td>' + L({ es:'No, prepara el terreno', en:'No, it prepares the ground' }) + '</td><td>' + L({ es:'No, necesita el terreno preparado', en:'No, it needs the ground prepared' }) + '</td></tr>' +
      '<tr><td>' + L({ es:'¿Qué explica?', en:'What does it explain?' }) + '</td><td>' + L({ es:'Por qué era posible', en:'Why it was possible' }) + '</td><td>' + L({ es:'Por qué ocurrió justo entonces', en:'Why it happened just then' }) + '</td></tr>' +
    '</table>' +
    '<div class="mzone" id="mzC"></div>');

  addSection(L({ es:'Concepto 4', en:'Concept 4' }), L({ es:'Trincheras y frente interno', en:'Trenches and the home front' }),
    L({ es:'<p>Todos los planes suponían una guerra corta y de movimiento, resuelta en unas semanas. En septiembre de 1914 el avance alemán se detuvo cerca del río Marne y los ejércitos se enterraron: cientos de kilómetros de trincheras cruzaron el frente occidental desde el mar del Norte hasta la frontera suiza. Las armas nacidas de la industria, sobre todo la ametralladora y la artillería pesada, favorecían a quien esperaba protegido; salir a campo abierto costaba miles de vidas por unos cientos de metros de terreno. Batallas como las de Verdún y el Somme, en 1916, mostraron ese límite con toda crudeza. El gas, los submarinos, los aviones y los primeros tanques aparecieron para romper el estancamiento, y aun así el frente apenas se movía.</p>' +
              '<p>Detrás del frente militar existía otro frente. Los gobiernos dirigieron la economía: convirtieron fábricas civiles en fábricas de armas, racionaron alimentos y combustible, controlaron la prensa mediante la censura, sostuvieron el ánimo con propaganda y llamaron a filas a millones de civiles. Miles de mujeres ocuparon empleos en fábricas, tranvías, oficinas y hospitales. A esa manera de pelear se le llama guerra total, porque el país entero, y no solo su ejército, queda puesto al servicio del conflicto. En 1917 dos hechos cambiaron el equilibrio: la revolución en Rusia, que terminó sacándola de la guerra, y la entrada de Estados Unidos con sus recursos y sus soldados. El armisticio se firmó el 11 de noviembre de 1918.</p>',
          en:'<p>Every plan assumed a short war of movement, settled in a few weeks. In September 1914 the German advance halted near the river Marne and the armies dug in: hundreds of kilometres of trenches crossed the western front from the North Sea to the Swiss border. Weapons born of industry, above all the machine gun and heavy artillery, favoured whoever waited under cover; moving into the open cost thousands of lives for a few hundred metres of ground. Battles such as Verdun and the Somme, in 1916, showed that limit in the harshest way. Gas, submarines, aircraft and the first tanks appeared to break the deadlock, and still the front barely moved.</p>' +
              '<p>Behind the military front there was another front. Governments directed the economy: they turned civilian factories into weapons plants, rationed food and fuel, controlled the press through censorship, kept up morale with propaganda and called millions of civilians to the ranks. Thousands of women took jobs in factories, streetcars, offices and hospitals. That way of fighting is called total war, because the whole country, and not only its army, is placed at the service of the conflict. In 1917 two events changed the balance: the revolution in Russia, which ended by taking it out of the war, and the entry of the United States with its resources and its soldiers. The armistice was signed on 11 November 1918.</p>' }) +
    '<div class="mzone" id="mzD"></div>');
  mD_render();

  addSection(L({ es:'Concepto 5', en:'Concept 5' }), L({ es:'Lo que dejó la guerra', en:'What the war left behind' }),
    L({ es:'<p>Cuando callaron los cañones, el continente era otro. Cerca de diez millones de soldados habían muerto y otros tantos quedaron heridos o mutilados; a esa cifra se suman las víctimas civiles, el hambre y una epidemia de gripe que recorrió el mundo en 1918. Cuatro imperios desaparecieron del mapa: el alemán, el austrohúngaro, el ruso y el otomano. Sobre sus restos nacieron o volvieron a nacer países como Polonia, Checoslovaquia, Yugoslavia, Austria y Hungría, con fronteras dibujadas en las conferencias de paz a partir de la idea de que cada pueblo debía decidir su propio destino.</p>' +
              '<p>El tratado de Versalles, firmado en 1919, dejó por escrito que Alemania era responsable de la guerra, le exigió pagos elevados durante años, le quitó Alsacia y Lorena, tierras en el este y todas sus colonias, y redujo su ejército de manera drástica. En esos mismos acuerdos se creó la Sociedad de Naciones, un organismo pensado para resolver los conflictos mediante la negociación. La sociedad también cambió: varios países reconocieron el voto femenino, los Estados se acostumbraron a intervenir en la economía y el centro financiero del mundo se desplazó de Londres a Nueva York.</p>',
          en:'<p>When the guns fell silent, the continent was another. Close to ten million soldiers had died and as many were wounded or maimed; to that figure must be added civilian victims, hunger and a flu epidemic that swept the world in 1918. Four empires vanished from the map: the German, the Austro Hungarian, the Russian and the Ottoman. On their remains countries such as Poland, Czechoslovakia, Yugoslavia, Austria and Hungary were born or reborn, with borders drawn at the peace conferences from the idea that each people should decide its own destiny.</p>' +
              '<p>The Treaty of Versailles, signed in 1919, put in writing that Germany was responsible for the war, demanded high payments over years, took from it Alsace and Lorraine, lands in the east and all its colonies, and cut its army drastically. Those same agreements created the League of Nations, a body meant to settle conflicts through negotiation. Society changed too: several countries recognized votes for women, states grew used to intervening in the economy and the financial centre of the world shifted from London to New York.</p>' }) +
    '<div class="mzone" id="mzE"></div>');
