            en:'The equal reading indicates that in both containers the particles are equally agitated on average. Thermal energy, by contrast, is the sum of the movement of all of them, and the pot has eight times more water. Same temperature and different total thermal energy coexist without contradiction.' }
    }
  ]);
}

/* ── 3 ── el termómetro necesita alcanzar el equilibrio ── */
function mkP3(rng){
  return build(rng, { es:'Dos lecturas del mismo vaso', en:'Two readings of the same glass' }, [
    {
      q:{ es:'Un termómetro que estaba sobre la mesa se mete en un vaso con agua caliente y se saca de inmediato: marca 26 °C. Se vuelve a meter en el mismo vaso y se deja tres minutos: marca 41 °C y ya no se mueve. ¿Qué lectura corresponde a la temperatura del agua?',
          en:'A thermometer lying on the table is dipped into a glass of hot water and pulled out at once: it reads 26 °C. It is dipped into the same glass again and left for three minutes: it reads 41 °C and stops moving. Which reading corresponds to the temperature of the water?' },
      options:[

        { es:'Que la lata empezó a devolver al aire más energía de la que recibe y por eso deja de subir', en:'That the can started returning to the air more energy than it receives and that is why it stops rising' },
        { es:'Que el termómetro de la lata dejó de responder después de tantos minutos de medición', en:'That the can thermometer stopped responding after so many minutes of measurement' }

      hint:{ es:'Fíjate en el detalle de que el tramo plano coincide exactamente con el valor de la otra curva, no con cualquier valor.',

      exp:{ es:'Mientras la lata estuvo más fría que el aire, la energía entró en ella y su curva subió. El ascenso se fue frenando porque la diferencia de temperaturas se hacía menor. Cuando las dos curvas coinciden y se quedan planas, la diferencia desapareció: ya no hay transferencia neta y las dos temperaturas se mantienen. Eso es el equilibrio térmico.',
            en:'While the can was colder than the air, energy entered it and its curve rose. The rise slowed down because the temperature difference was getting smaller. When both curves coincide and stay flat, the difference is gone: there is no net transfer any more and both temperatures hold. That is thermal equilibrium.' }
    },
    {
      q:{ es:'Se registra cada minuto la temperatura de una taza de té caliente en un salón. La curva baja mucho en los primeros minutos y después baja cada vez más despacio, hasta acercarse a la temperatura del aire. ¿Qué explica que el descenso sea rápido al principio y lento al final?',
          en:'The temperature of a cup of hot tea in a room is recorded every minute. The curve drops a lot in the first minutes and then falls more and more slowly, until it approaches the air temperature. What explains the drop being fast at the start and slow at the end?' },
      options:[
        { es:'La transferencia es más rápida cuando la diferencia de temperaturas es grande, y se va frenando conforme esa diferencia se reduce', en:'Transfer is faster when the temperature difference is large, and it slows down as that difference shrinks' },

        { es:'El aire del salón se satura de calor y por eso deja de admitir la energía que suelta el té', en:'The room air becomes saturated with heat and therefore stops admitting the energy the tea releases' },

      exp:{ es:'La rapidez con que pasa energía depende de qué tan distintas son las temperaturas de los dos cuerpos. Al principio el té está muy por encima del aire y cede energía deprisa, por eso la curva cae con fuerza. Conforme se acerca a la temperatura del aire, la diferencia se reduce y el descenso se vuelve lento, hasta detenerse cuando alcanzan el equilibrio.',
            en:'How fast energy passes depends on how different the temperatures of the two bodies are. At first the tea is well above the air and gives energy away quickly, which is why the curve falls steeply. As it approaches the air temperature, the difference shrinks and the fall becomes slow, until it stops when they reach equilibrium.' }
    }
  ]);
}

/* ── 10 ── poner a prueba una afirmación ── */
function mkP10(rng){
  return build(rng, { es:'Poner la afirmación a prueba', en:'Putting the claim to the test' }, [
    {
      q:{ es:'Alguien sostiene que una cobija calienta las cosas. Para ponerlo a prueba envuelve un vaso con agua helada en una cobija, deja otro vaso igual destapado en el mismo cuarto y mide los dos media hora después. ¿Qué resultado apoyaría la idea de que la cobija no calienta, sino que retrasa el paso de energía?',
          en:'Someone claims that a blanket warms things up. To test it they wrap a glass of ice cold water in a blanket, leave another identical glass uncovered in the same room and measure both half an hour later. Which result would support the idea that the blanket does not warm, but slows down the passage of energy?' },
      options:[
        { es:'Que el vaso envuelto marque menos que el destapado, y los dos por encima de su temperatura inicial', en:'That the wrapped glass reads lower than the uncovered one, and both above their starting temperature' },
        { es:'Que el vaso envuelto marque más que el destapado, porque la cobija le entregó su propio calor', en:'That the wrapped glass reads higher than the uncovered one, because the blanket gave it its own heat' },
        { es:'Que los dos vasos marquen exactamente la misma temperatura que al inicio del experimento', en:'That both glasses read exactly the same temperature as at the start of the experiment' },
        { es:'Que el vaso envuelto termine por encima de la temperatura del aire del cuarto', en:'That the wrapped glass ends up above the temperature of the room air' }
      ],
      correct:0,
      hint:{ es:'La cobija no tiene fuente propia de energía. Piensa qué le pasaría a cada vaso si lo único que hace la cobija es hacer más lento el paso de energía desde el aire.',
             en:'The blanket has no energy source of its own. Think about what would happen to each glass if all the blanket does is slow the passage of energy from the air.' },
      exp:{ es:'Los dos vasos están más fríos que el cuarto, así que los dos reciben energía del aire y los dos suben. Si la cobija solo frena ese paso, el vaso envuelto tiene que ir más atrasado, es decir marcar menos que el destapado, sin llegar nunca por encima del aire. Ese resultado apoya la idea de retraso y no la de que la cobija produzca calor.',
            en:'Both glasses are colder than the room, so both receive energy from the air and both rise. If the blanket only slows that passage, the wrapped glass has to lag behind, that is, read lower than the uncovered one, never going above the air. That result supports the idea of delay and not that the blanket produces heat.' }
    },
    {
      q:{ es:'Un estudiante afirma que un suéter produce calor por sí mismo. Su compañera propone envolver un termómetro en un suéter y dejarlo una hora en el salón, con otro termómetro igual afuera del suéter. ¿Qué resultado permitiría rechazar la afirmación del estudiante?',
          en:'A student claims that a sweater produces heat by itself. His classmate proposes wrapping a thermometer in a sweater and leaving it for an hour in the classroom, with an identical thermometer outside the sweater. Which result would allow the student claim to be rejected?' },
      options:[
        { es:'Que después de la hora los dos termómetros marquen la temperatura del salón', en:'That after the hour both thermometers read the classroom temperature' },
        { es:'Que el termómetro envuelto marque unos grados más que el de afuera al terminar la hora', en:'That the wrapped thermometer reads a few degrees more than the outside one at the end of the hour' },
        { es:'Que el termómetro envuelto suba durante los primeros minutos y luego se quede quieto', en:'That the wrapped thermometer rises during the first minutes and then stays still' },
        { es:'Que los dos termómetros bajen por debajo de la temperatura del salón durante la hora', en:'That both thermometers drop below the classroom temperature during the hour' }
      ],
      correct:0,
      hint:{ es:'Un termómetro no genera energía. Pregúntate qué debería marcar si el suéter solo lo rodea y no aporta nada.',
             en:'A thermometer does not generate energy. Ask yourself what it should read if the sweater merely surrounds it and contributes nothing.' },
      exp:{ es:'Si el suéter produjera calor, el termómetro envuelto tendría que terminar por encima del salón. Que los dos terminen marcando la temperatura del salón muestra que el suéter no aporta energía: solo retarda el intercambio, y con tiempo suficiente todo el conjunto llega al mismo equilibrio térmico. Con un cuerpo que sí produce energía, como una persona, el suéter conserva ese calor en lugar de crearlo.',
            en:'If the sweater produced heat, the wrapped thermometer would have to end up above the room. Both ending at the room temperature shows the sweater contributes no energy: it only delays the exchange, and given enough time the whole set reaches the same thermal equilibrium. With a body that does produce energy, such as a person, the sweater keeps that heat instead of creating it.' }
    }
  ]);
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Temperatura y Equilibrio Térmico';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
