<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relaciones Afectivas y Familiares a través de la Historia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Relaciones Afectivas y Familiares a través de la Historia</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Relaciones Afectivas y Familiares a través de la Historia</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c3c84', primaryDark:'#05224e', primaryBg:'#e5edf7',
  accent:'#fc0c0c', accentBg:'#ffdbdb',
  darkPrimary:'#3575d4', darkPrimaryDark:'#679ff3', darkPrimaryBg:'#061d3f',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'his2_t07_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
/* ════════════════════════════════════════════════════════════════════════
   AYUDAS DE CONSTRUCCIÓN (bilingües, con semilla)
   ════════════════════════════════════════════════════════════════════════ */
function S(es, en){ return LANG === 'es' ? es : en; }
function L(o){ if (o === null || o === undefined) return ''; if (typeof o === 'string') return o; return (o[LANG] !== undefined ? o[LANG] : o.es); }

function shufflePerm(n, rng){
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  var sorted = true;
  for (i = 0; i < n; i++) if (a[i] !== i) sorted = false;
  if (sorted && n > 1) { t = a[0]; a[0] = a[1]; a[1] = t; }
  return a;
}
function pickSome(n, k, rng){
  var all = [], i, j, t;
  for (i = 0; i < n; i++) all.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = all[i]; all[i] = all[j]; all[j] = t; }
  var out = all.slice(0, k);
  out.sort(function(a, b){ return a - b; });
  return out;
}
function pickV(list, rng){ return list[Math.floor(rng() * list.length)]; }

function addSection(tag, title, body){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + body;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function wgtHead(title, sub){
  return '<div class="iw-tag">' + title + '<div class="iw-sub">' + sub + '</div></div>';
}

/* Baraja las opciones (Rule 7) conservando el índice correcto y construye la
   tarjeta inline inmediatamente después del push (Rule 1 / Rule 5). */
function addProblem(v, rng){
  var langOpts = L(v.options), n = langOpts.length, idx = shufflePerm(n, rng);
  var p = {
    title:        L(v.title),
    questionText: L(v.stmt),
    fn:           '',
    hint:         L(v.hint),
    explanation:  L(v.explanation),
    options:      idx.map(function(k){ return langOpts[k]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(p);
  buildOneCard(p, problems.length - 1);
}

function hgBuild(rng){
  var set = HG_SETS[Math.floor(rng() * HG_SETS.length)];
  HG = { it:set, ord:shufflePerm(set.length, rng), i:0, tries:0, ok:0, done:false, fb:'', fbk:'' };
  return '<div class="wgt" data-widget="classify" id="wHogares">' +
    wgtHead(S('¿Quiénes duermen bajo este techo?', 'Who sleeps under this roof?'),
            S('Cada hogar llega descrito, sin nombre. Decide qué forma tiene contando quiénes viven ahí y cuántas personas adultas lo sostienen.',
              'Each household arrives described, with no name. Decide its form by counting who lives there and how many adults support it.')) +
    '<div id="hgBox"></div></div>';
}
function hgRender(){
  var z = document.getElementById('hgBox');
  if (!HG || !z) return;
  if (HG.done){
    z.innerHTML = '<div class="cl-done">🎉 ' + HG.ok + '/' + HG.it.length + '</div>' +
      '<div class="iw-fb ok">' + S('Las tres formas convivieron en la misma época y en la misma calle. Lo que las hace cambiar no es la moda, sino dónde está el trabajo, qué permite la ley y quién falta o sobra en la casa.',

  }
  var it = HG.it[HG.ord[HG.i]];
  z.innerHTML =
    '<div class="iw-prog">' + (HG.i + 1) + ' / ' + HG.it.length + '</div>' +
    '<div class="cl-card">' + L(it.t) + '</div>' +
    '<div class="cl-bins">' + L(HG_BINS).map(function(b, bi){
        return '<button class="cl-bin" onclick="hgPick(' + bi + ')">' + b + '</button>';
      }).join('') + '</div>' +
    '<div class="iw-fb' + (HG.fbk ? ' ' + HG.fbk : '') + '">' + HG.fb + '</div>';
}
function hgPick(bi){
  if (!HG || HG.done) return;
  var it = HG.it[HG.ord[HG.i]];
  if (bi === it.b){
    HG.ok++; HG.tries = 0; HG.i++;
    HG.fbk = 'ok'; HG.fb = L(it.w);
    if (HG.i >= HG.it.length) HG.done = true;
    hgRender(); return;
  }
  HG.tries++;
  if (HG.tries >= 3){
    var keep = S('Era ', 'It was ') + L(HG_BINS)[it.b].toLowerCase() + '. ' + L(it.w);
    HG.tries = 0; HG.i++;
    if (HG.i >= HG.it.length){ HG.done = true; hgRender(); return; }
    HG.fbk = 'warn'; HG.fb = keep;
    hgRender();
    var box = document.querySelector('#hgBox .iw-fb');
    if (box){ box.className = 'iw-fb warn'; box.innerHTML = keep; }
    return;

  HG.fbk = 'bad';
  HG.fb = S('Vuelve a contar: ¿duerme ahí alguien más que la pareja y sus hijos? ¿Hay una o dos personas adultas sosteniendo la casa?',
            'Count again: does anyone besides the couple and their children sleep there? Are there one or two adults supporting the house?');
  hgRender();
}

function bdBuild(rng){

function bdRender(){

    else if (BD.sel.indexOf(ai) >= 0) cls += ' sel';

function bdTap(ai){
  if (!BD || BD.done || BD.reveal) return;
  var k = BD.sel.indexOf(ai);
  if (k >= 0) BD.sel.splice(k, 1); else BD.sel.push(ai);
  BD.fbk = ''; BD.fb = '';
  bdRender();
}
function bdAdvance(){
  BD.r++; BD.tries = 0; BD.sel = []; BD.reveal = false;
  if (BD.r >= BD_ROUNDS.length) BD.done = true;
  BD.fbk = ''; BD.fb = '';
  bdRender();

function bdCheck(){
  if (!BD || BD.done || BD.reveal) return;
  var rd = BD_ROUNDS[BD.r];
  var missing = rd.ok.filter(function(a){ return BD.sel.indexOf(a) < 0; });
  var extra   = BD.sel.filter(function(a){ return rd.ok.indexOf(a) < 0; });
  if (missing.length === 0 && extra.length === 0){
    BD.reveal = true; BD.fbk = 'ok'; BD.fb = '🎉 ' + L(rd.why);
    bdRender();
    setTimeout(bdAdvance, 2600);
    return;
  }
  BD.tries++;
  if (BD.tries >= 3){
    BD.reveal = true; BD.fbk = 'warn';
    BD.fb = S('Esta era la mesa completa. ', 'This was the complete table. ') + L(rd.why);

              'You marked one too many. Was their approval really necessary for the wedding to be valid there?');
  }
  bdRender();
}

];

function tlBuild(rng){
  var idxs = pickSome(TL_EVENTS.length, 5, rng);
  var ev = idxs.map(function(k){ return TL_EVENTS[k]; });
  TL = { ev:ev, ord:shufflePerm(ev.length, rng), sel:null, tries:0, done:false, fb:'', fbk:'' };
  return '<div class="wgt" data-widget="timeline" id="wLinea">' +
    wgtHead(S('La línea de la vida familiar', 'The line of family life'),
            S('Las tarjetas llegan revueltas y sin fecha. Acomódalas del cambio más antiguo al más reciente tocando dos tarjetas para intercambiarlas.',
              'The cards arrive shuffled and without dates. Arrange them from the oldest change to the most recent by tapping two cards to swap them.')) +
    '<div id="tlBox"></div></div>';
}
function tlRender(){
  var z = document.getElementById('tlBox');
  if (!TL || !z) return;
  var chips = TL.ord.map(function(ei, pos){
    var cls = 'tl-chip' + (TL.sel === pos ? ' sel' : '') + (TL.done ? ' locked' : '');
    var yr = TL.done ? '<span class="tl-year">' + L(TL.ev[ei].y) + '</span>' : '';
    return '<div class="' + cls + '" onclick="tlTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span>' + L(TL.ev[ei].t) + yr + '</div>';
  }).join('');
  z.innerHTML =
    '<div class="tl-list">' + chips + '</div>' +
    (TL.done ? '' : '<div class="iw-row"><button class="iw-btn" onclick="tlCheck()">' + S('Verificar', 'Check') + '</button></div>') +
    '<div class="iw-fb' + (TL.fbk ? ' ' + TL.fbk : '') + '">' + TL.fb + '</div>';
}
function tlTap(pos){
  if (!TL || TL.done) return;
  if (TL.sel === null) TL.sel = pos;
  else if (TL.sel === pos) TL.sel = null;
  else { var t = TL.ord[TL.sel]; TL.ord[TL.sel] = TL.ord[pos]; TL.ord[pos] = t; TL.sel = null; }
  tlRender();
}
function tlCheck(){
  if (!TL || TL.done) return;
  var ok = true, first = -1, i;
  for (i = 0; i < TL.ord.length; i++) if (TL.ord[i] !== i){ ok = false; if (first < 0) first = i; }
  if (ok){
    TL.done = true; TL.sel = null; TL.fbk = 'ok';
    TL.fb = '🎉 ' + S('Orden correcto. Mira los años que aparecieron: cada uno cambió algo que se podía hacer dentro de una casa.',
                      'Correct order. Look at the years that appeared: each one changed something that could be done inside a house.');
    tlRender(); return;
  }
  TL.tries++;
  if (TL.tries >= 3){
    TL.ord = TL.ev.map(function(_, k){ return k; });
    TL.done = true; TL.sel = null; TL.fbk = 'warn';
    TL.fb = S('Este es el orden, ahora con sus años. Primero el Estado toma el registro de manos de la parroquia, después la ley permite deshacer el vínculo, y al final amplía quiénes pueden formar una familia.',
              'This is the order, now with its years. First the State takes the register from the parish, then the law allows the bond to be undone, and in the end it widens who can form a family.');
    tlRender(); return;
  }
  TL.fbk = 'bad';
  TL.fb = S('Aún no. Revisa la tarjeta número ' + (first + 1) + ': ¿ese cambio pudo ocurrir antes o después del que tiene encima?',
            'Not yet. Check card number ' + (first + 1) + ': could that change happen before or after the one above it?');
  tlRender();
}

    w:{ es:'Un testamento se escribe para repartir. Busca la respuesta que habla de lo que se tiene y de quién lo recibe.',
        en:'A will is written in order to divide. Look for the answer that speaks of what is owned and who receives it.' } },
  { s:{ es:'Entrevista grabada a una abuela, 2020', en:'Recorded interview with a grandmother, 2020' },
    a:{ es:'Los recuerdos de la vida diaria que nadie puso por escrito en su momento',
        en:'The memories of daily life that nobody wrote down at the time' },

        en:'Here the person speaking remembers many years later. Its strength lies in whatever no paper recorded.' } }
];

function fuBuild(rng){
  var idxs = pickSome(FU_PAIRS.length, 4, rng);
  var pr = idxs.map(function(k){ return FU_PAIRS[k]; });
  FU = { pr:pr, sOrd:shufflePerm(pr.length, rng), aOrd:shufflePerm(pr.length, rng),
         sel:null, linked:{}, tries:0, n:0, done:false, fb:'', fbk:'' };
  return '<div class="wgt" data-widget="match" id="wFuentes">' +
    wgtHead(S('Cada rastro responde una pregunta', 'Each trace answers one question'),
            S('Toca una fuente de la izquierda y después aquello que permite saber. Si no coincide, la pista te dice quién produjo el documento y para qué.',
              'Tap a source on the left and then what it lets you know. If it does not match, the hint tells you who produced the document and what for.')) +
    '<div id="fuBox"></div></div>';
}
function fuRender(){
  var z = document.getElementById('fuBox');
  if (!FU || !z) return;
  if (FU.done){
    z.innerHTML = '<div class="cl-done">🎉 ' + FU.n + '/' + FU.pr.length + '</div>' +
      '<div class="iw-fb ok">' + S('Los registros dan hechos que alguien tenía que asentar: fechas, nombres, bienes. Las cartas, las fotos y las entrevistas dan sentido: motivos, afectos y versiones. Quien investiga la vida familiar necesita cruzar los dos.',
                                   'Registers give facts someone was obliged to record: dates, names, goods. Letters, photos and interviews give meaning: motives, affections and versions. Whoever researches family life needs to cross the two.') + '</div>';
    return;
  }
  var src = FU.sOrd.map(function(k){
    var done = !!FU.linked[k];
    var cls = 'fu-item' + (done ? ' ok' : (FU.sel === k ? ' sel' : ''));
    return '<button class="' + cls + '" onclick="fuTapS(' + k + ')"><span class="fu-badge">' + (done ? '✓' : '?') + '</span>' + L(FU.pr[k].s) + '</button>';
  }).join('');
  var ans = FU.aOrd.map(function(k){
    var done = !!FU.linked[k];
    var cls = 'fu-item' + (done ? ' ok' : '');
    return '<button class="' + cls + '" onclick="fuTapA(' + k + ')"><span class="fu-badge">' + (done ? '✓' : '·') + '</span>' + L(FU.pr[k].a) + '</button>';
  }).join('');
  z.innerHTML =
    '<div class="fu-grid">' +
      '<div><div class="fu-lbl">' + S('La fuente', 'The source') + '</div>' + src + '</div>' +
      '<div><div class="fu-lbl">' + S('Lo que permite saber', 'What it lets you know') + '</div>' + ans + '</div>' +
    '</div>' +
    '<div class="iw-fb' + (FU.fbk ? ' ' + FU.fbk : '') + '">' + FU.fb + '</div>';
}
function fuTapS(k){
  if (!FU || FU.done || FU.linked[k]) return;
  FU.sel = (FU.sel === k ? null : k);
  FU.tries = 0; FU.fbk = ''; FU.fb = '';
  fuRender();
}
function fuTapA(k){
  if (!FU || FU.done || FU.linked[k]) return;
  if (FU.sel === null){
    FU.fbk = 'warn';
    FU.fb = S('Empieza por la izquierda: elige primero una fuente.', 'Start on the left: choose a source first.');
    fuRender(); return;
  }
  var sel = FU.sel;
  if (k === sel){
    FU.linked[sel] = true; FU.n++; FU.sel = null; FU.tries = 0;
    FU.fbk = 'ok'; FU.fb = '✓ ' + L(FU.pr[sel].w);
    if (FU.n >= FU.pr.length) FU.done = true;
    fuRender(); return;
  }
  FU.tries++;
  if (FU.tries >= 3){
    FU.linked[sel] = true; FU.n++;
    FU.fbk = 'warn'; FU.fb = S('Le correspondía esta: ', 'It matched this one: ') + L(FU.pr[sel].a) + '. ' + L(FU.pr[sel].w);
    FU.sel = null; FU.tries = 0;
    if (FU.n >= FU.pr.length) FU.done = true;
    fuRender(); return;
  }
  FU.fbk = 'bad';
  FU.fb = L(FU.pr[sel].w);
  fuRender();
}

function rfTab(which, btn){
  ['type', 'draw'].forEach(function(k){
    var el = document.getElementById('rf_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var w = document.getElementById('wCuaderno');

}

/* ════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto, manipulable, problema (Rule 1)
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  injectGuideStyles();

  /* ══════════ CONCEPTO 1 ══════════ */
  addSection(S('Concepto 1', 'Concept 1'),
    S('Bajo un mismo techo', 'Under one roof'),
    S('<p>La palabra familia nombra cosas muy distintas según la época. En una casa rural del siglo XIX podían vivir el matrimonio, sus hijos, la abuela, una tía soltera y hasta jóvenes que trabajaban a cambio de techo y comida. Ese hogar tan poblado no era un capricho: la casa era también el lugar de trabajo, y para la milpa, el ganado y el cuidado de los pequeños hacían falta muchas manos.</p>' +
      '<p>Cuando el trabajo se mudó a las fábricas, a los talleres y a las oficinas, y las ciudades crecieron, los hogares se hicieron más pequeños. La pareja y sus hijos empezaron a vivir aparte, a veces a cientos de kilómetros de los abuelos. Y en todas las épocas hubo casas sostenidas por una sola persona adulta: viudas, hombres cuyas esposas habían salido a trabajar lejos, madres solas. La familia no es una forma fija que se repita igual desde siempre: es un arreglo que cambia con el trabajo, con la ley y con las condiciones de vida.</p>' +
      '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Hogar extenso', 'Extended household') + '</div><div class="rform">' + S('varias generaciones', 'several generations') + '</div><div class="rnote">' + S('Abuelos, tíos, nietos o yernos comparten techo, comida y trabajo.', 'Grandparents, aunts, grandchildren or in laws share roof, food and work.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Hogar nuclear', 'Nuclear household') + '</div><div class="rform">' + S('la pareja y sus hijos', 'the couple and their children') + '</div><div class="rnote">' + S('Se vuelve común cuando el trabajo sale de la casa y la vivienda se achica.', 'It becomes common when work leaves the house and the dwelling shrinks.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Una sola persona al frente', 'A single adult at the head') + '</div><div class="rform">' + S('sostiene y decide', 'supports and decides') + '</div><div class="rnote">' + S('Viudez, separación o la salida de alguien a trabajar lejos dejan a un adulto a cargo.', 'Widowhood, separation or someone leaving to work far away leave one adult in charge.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Parentesco elegido', 'Chosen kinship') + '</div><div class="rform">' + S('padrinos y madrinas', 'godparents') + '</div><div class="rnote">' + S('El compadrazgo suma parientes que no lo son por sangre y que apoyan en lo difícil.', 'Godparenthood adds relatives who are not so by blood and who help in hard times.') + '</div></div>' +
      '</div>',
    '<p>The word family names very different things depending on the period. In a rural house of the 19th century there could live the married couple, their children, the grandmother, an unmarried aunt and even young people who worked in exchange for room and board. That crowded household was not a whim: the house was also the workplace, and the cornfield, the cattle and the care of the little ones needed many hands.</p>' +
      '<p>When work moved to the factories, the workshops and the offices, and the cities grew, households became smaller. The couple and their children began to live apart, sometimes hundreds of kilometres from the grandparents. And in every period there were houses supported by a single adult: widows, men whose wives had left to work far away, mothers on their own. The family is not a fixed form repeated identically since forever: it is an arrangement that changes with work, with the law and with living conditions.</p>' +
      '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">Extended household</div><div class="rform">several generations</div><div class="rnote">Grandparents, aunts, grandchildren or in laws share roof, food and work.</div></div>' +
      '<div class="rcard"><div class="rname">Nuclear household</div><div class="rform">the couple and their children</div><div class="rnote">It becomes common when work leaves the house and the dwelling shrinks.</div></div>' +
      '<div class="rcard"><div class="rname">A single adult at the head</div><div class="rform">supports and decides</div><div class="rnote">Widowhood, separation or someone leaving to work far away leave one adult in charge.</div></div>' +
      '<div class="rcard"><div class="rname">Chosen kinship</div><div class="rform">godparents</div><div class="rnote">Godparenthood adds relatives who are not so by blood and who help in hard times.</div></div>' +
      '</div>') +
    hgBuild(rng));
  hgRender();

  /* ── graded 1 ── */
  addProblem(pickV([
    { title:{ es:'Leer un hogar', en:'Reading a household' },
      stmt:{ es:'En una casa de campo de 1890 duermen un matrimonio, sus cuatro hijos, la abuela materna, una hermana soltera del esposo y dos jóvenes del rancho vecino que trabajan y comen ahí. ¿Cuál es la mejor descripción de ese hogar?',
             en:'In a country house of 1890 there sleep a married couple, their four children, the grandmother, an unmarried sister of the husband and two young people from the neighbouring ranch who work and eat there. What is the best description of that household?' },
      options:{ es:['Un hogar extenso: bajo el mismo techo viven la pareja, sus hijos y parientes de más de una generación.',
                    'Un hogar nuclear: la pareja y sus hijos son la casa y los demás solo están de paso.',
                    'Un hogar con una sola persona adulta al frente, porque la abuela es la de mayor edad.',
                    'Una familia formada por integrantes de dos uniones anteriores que ahora viven juntos.'],
                en:['An extended household: under the same roof live the couple, their children and relatives of more than one generation.',
                    'A nuclear household: the couple and their children are the house and the rest are only passing through.',
                    'A household with a single adult at the head, because the grandmother is the oldest person there.',
                    'A family made up of members of two previous unions who now live together.'] },
      correct:0, showWork:false,
      hint:{ es:'Cuenta cuántas generaciones distintas duermen ahí y si hay parientes además de la pareja y de sus hijos.',
             en:'Count how many different generations sleep there and whether there are relatives besides the couple and their children.' },
      explanation:{ es:'Conviven tres generaciones y parientes que no son hijos de la pareja. Esa era la forma habitual cuando la casa era además el lugar de trabajo y hacían falta muchas manos.',
                    en:'Three generations live together with relatives who are not children of the couple. That was the usual form when the house was also the workplace and many hands were needed.' } },
    { title:{ es:'Leer un hogar', en:'Reading a household' },
      stmt:{ es:'En 1975, en un departamento de una colonia obrera, viven un matrimonio y sus dos hijos. Los abuelos se quedaron en el pueblo y los visitan en vacaciones. ¿Cuál es la mejor descripción de ese hogar?',
             en:'In 1975, in an apartment of a working class neighbourhood, live a married couple and their two children. The grandparents stayed in the village and visit them on holidays. What is the best description of that household?' },
      options:{ es:['Un hogar nuclear: viven ahí solo la pareja y sus hijos, y los abuelos tienen su propia casa.',
                    'Un hogar extenso, porque los abuelos siguen formando parte de la familia aunque vivan lejos.',
                    'Un hogar con una sola persona adulta al frente, ya que uno de los dos trabaja fuera.',
                    'Un hogar sin forma definida, porque la familia quedó repartida en dos lugares.'],
                en:['A nuclear household: only the couple and their children live there, and the grandparents have their own house.',
                    'An extended household, because the grandparents are still part of the family even if they live far away.',
                    'A household with a single adult at the head, since one of the two works outside.',
                    'A household with no defined form, because the family ended up split between two places.'] },
      correct:0, showWork:false,
      hint:{ es:'La forma del hogar se decide por quiénes comparten techo y gasto, no por quiénes se quieren.',
             en:'The form of the household is decided by who shares roof and expenses, not by who loves whom.' },
      explanation:{ es:'Los abuelos siguen siendo familia, pero no comparten techo ni gasto: el hogar lo forman la pareja y sus hijos. Esta forma se volvió común al crecer las ciudades y salir el trabajo de la casa.',
                    en:'The grandparents are still family, but they share neither roof nor expenses: the household is the couple and their children. This form became common as cities grew and work left the house.' } }
  ], rng), rng);

  /* ── graded 2 ── */
  addProblem(pickV([
    { title:{ es:'Lo que cambia y lo que permanece', en:'What changes and what stays' },
      stmt:{ es:'Después de comparar hogares de distintas épocas, ¿cuál de estas afirmaciones queda mejor sostenida por lo que revisaste?',
             en:'After comparing households from different periods, which of these statements is best supported by what you reviewed?' },
      options:{ es:['Las formas de convivir cambian según el trabajo, la ley y las condiciones de vida, y varias de ellas coexisten en la misma época.',
                    'Antes todos los hogares eran extensos y hoy todos son nucleares, sin excepciones.',
                    'El hogar nuclear existió siempre igual y las demás formas son excepciones recientes.',
                    'La forma del hogar depende únicamente del cariño que se tengan sus integrantes.'],
                en:['Ways of living together change with work, the law and living conditions, and several of them coexist in the same period.',
                    'Before, all households were extended and today all are nuclear, with no exceptions.',
                    'The nuclear household always existed unchanged and the other forms are recent exceptions.',
                    'The form of the household depends only on the affection its members feel for each other.'] },
      correct:0, showWork:false,
      hint:{ es:'Fíjate en si los hogares que clasificaste pertenecían todos a épocas distintas o si algunos convivían en la misma.',
             en:'Look at whether the households you sorted all belonged to different periods or whether some coexisted in the same one.' },
      explanation:{ es:'En una misma calle del siglo XIX había casas extensas, nucleares y sostenidas por una sola persona. Lo que empuja el cambio es dónde está el trabajo, qué permite la ley y quién falta en la casa.',
                    en:'On the same 19th century street there were extended, nuclear and single adult households. What drives the change is where the work is, what the law allows and who is missing in the house.' } },
    { title:{ es:'Lo que cambia y lo que permanece', en:'What changes and what stays' },
      stmt:{ es:'Un compañero escribe en su cuaderno: "Antes todas las familias eran extensas; luego apareció la familia nuclear y desde entonces es la única forma que existe". ¿Cuál es el error principal de esa afirmación?',
             en:'A classmate writes in his notebook: "Before, all families were extended; then the nuclear family appeared and since then it is the only form that exists". What is the main error in that statement?' },
      options:{ es:['Presenta como sucesivas dos formas que en realidad convivieron, junto con los hogares sostenidos por una sola persona adulta.',
                    'Confunde las fechas: la familia nuclear apareció mucho antes que la extensa, no después.',
                    'Llama familia a un hogar donde viven parientes que no son hijos de la pareja.',
                    'Afirma que la familia extensa desapareció en el siglo XIX, cuando desapareció en el siglo XX.'],
                en:['It presents as successive two forms that in fact coexisted, together with households supported by a single adult.',
                    'It confuses the dates: the nuclear family appeared long before the extended one, not after.',
                    'It calls family a household where relatives who are not children of the couple live.',
                    'It claims the extended family disappeared in the 19th century, when it disappeared in the 20th.'] },
      correct:0, showWork:false,
      hint:{ es:'Revisa si los hogares que clasificaste se pueden ordenar en una sola fila de antes y después.',
             en:'Check whether the households you sorted can be lined up in a single row of before and after.' },
      explanation:{ es:'Las tres formas aparecen a la vez en cada época: cambia cuál predomina, no cuál existe. Ninguna desapareció, y hoy siguen conviviendo hogares extensos, nucleares y de una sola persona adulta.',
                    en:'The three forms appear at the same time in every period: what changes is which one predominates, not which one exists. None disappeared, and extended, nuclear and single adult households still coexist today.' } }
  ], rng), rng);

  /* ══════════ CONCEPTO 2 ══════════ */
  addSection(S('Concepto 2', 'Concept 2'),
    S('Casarse: de la alianza entre familias al acuerdo de dos', 'Marrying: from an alliance between families to an agreement between two'),
    S('<p>Durante siglos, casarse fue sobre todo un asunto de familias. La boda juntaba tierras, oficios, apellidos y protección, y por eso los padres opinaban, negociaban y a veces se oponían. La ceremonia la celebraba el párroco, que anotaba nombres, edades, padres y testigos en los libros de la parroquia: durante la época colonial esos libros fueron el único registro de quién nacía, se casaba o moría.</p>' +
      '<p>Eso no quiere decir que no hubiera amor. Los archivos guardan cientos de expedientes de jóvenes que pelearon ante la autoridad para casarse pese a la oposición de sus padres, porque el consentimiento de los dos novios era un requisito. Lo que cambió con el tiempo no fue la existencia del afecto, sino su peso y quién tenía la última palabra: el gusto de la pareja pasó de ser una condición entre varias a ser la razón principal para casarse.</p>',
    '<p>For centuries, marrying was above all a matter of families. The wedding joined land, trades, surnames and protection, and that is why parents gave opinions, negotiated and sometimes objected. The ceremony was celebrated by the parish priest, who wrote names, ages, parents and witnesses into the parish books: during the colonial period those books were the only record of who was born, married or died.</p>' +
      '<p>That does not mean there was no love. The archives keep hundreds of files of young people who fought before the authorities in order to marry despite the opposition of their parents, because the consent of both spouses was a requirement. What changed over time was not the existence of affection, but its weight and who had the last word: the preference of the couple went from being one condition among several to being the main reason to marry.</p>') +
    bdBuild(rng));
  bdRender();

  /* ── graded 3 ── */
  addProblem(pickV([
    { title:{ es:'Quién decidía la boda', en:'Who decided the wedding' },
      stmt:{ es:'En un pueblo de 1790, un joven quiere casarse con una vecina y su padre se opone porque la familia de ella no aporta tierras. ¿Qué explica mejor el peso de esa oposición?',
             en:'In a village of 1790, a young man wants to marry a neighbour and his father objects because her family brings no land. What best explains the weight of that objection?' },
      options:{ es:['El matrimonio era ante todo una alianza entre familias que ponía en juego tierras, oficio y prestigio, así que la decisión no era solo de la pareja.',
                    'La ley prohibía casarse a quien no tuviera tierras propias registradas a su nombre.',
                    'El afecto entre los novios no era tomado en cuenta por nadie antes del siglo XX.',
                    'Sin la aprobación del padre, la pareja tenía prohibido verse y hablar en público.'],
                en:['Marriage was above all an alliance between families that put land, trade and prestige at stake, so the decision did not belong to the couple alone.',
                    'The law forbade marrying to anyone without land registered in their own name.',
                    'The affection between the couple was taken into account by nobody before the 20th century.',
                    'Without the approval of the father, the couple was forbidden to see each other and speak in public.'] },
      correct:0, showWork:false,
      hint:{ es:'Pregúntate qué se unía además de dos personas cuando se celebraba una boda en esa época.',
             en:'Ask yourself what else was joined besides two people when a wedding was celebrated in that period.' },
      explanation:{ es:'La boda comprometía el patrimonio y el nombre de las dos casas, por eso los padres negociaban. El afecto existía y de hecho el consentimiento de los novios era requisito, pero no bastaba para cerrar el trato.',

  addSection(S('Concepto 3', 'Concept 3'),
    S('Cuando la ley entra a la casa', 'When the law enters the house'),
    S('<p>En 1859 el matrimonio se volvió un contrato civil y nació el registro civil: desde entonces el Estado, y no la parroquia, lleva la cuenta de los nacimientos, los matrimonios y las defunciones. En 1917 una nueva ley familiar reconoció el divorcio con derecho a volver a casarse y amplió las facultades de la esposa sobre los bienes y sobre los hijos. Lo que antes solo podía terminar con la muerte, ahora podía deshacerse en vida.</p>' +
      '<p>El siglo XX siguió moviendo el piso de la vida doméstica. En 1953 se reconoció el derecho de las mujeres a votar en las elecciones federales. En 1974 la Constitución declaró iguales ante la ley al varón y a la mujer. Entre 1942 y 1964, además, un programa de trabajo temporal llevó a cientos de miles de trabajadores mexicanos al campo estadounidense y dejó a muchas esposas al frente de la casa, de la parcela y de los trámites. Ya en el siglo XXI, la Ciudad de México reconoció en 2010 el matrimonio entre personas del mismo sexo y en 2015 la Suprema Corte estableció que negarlo es discriminatorio.</p>',
    '<p>In 1859 marriage became a civil contract and the civil registry was created: since then the State, and not the parish, keeps count of births, marriages and deaths. In 1917 a new family law recognized divorce with the right to marry again and widened the powers of the wife over property and over the children. What before could only end with death could now be undone in life.</p>' +
      '<p>The 20th century went on moving the ground of domestic life. In 1953 the right of women to vote in federal elections was recognized. In 1974 the Constitution declared men and women equal before the law. Between 1942 and 1964, moreover, a temporary work program took hundreds of thousands of Mexican workers to United States agriculture and left many wives in charge of the house, the plot and the paperwork. Already in the 21st century, Mexico City recognized in 2010 marriage between people of the same sex and in 2015 the Supreme Court established that denying it is discriminatory.</p>') +
    tlBuild(rng));
  tlRender();

  addSection(S('Concepto 4', 'Concept 4'),
    S('Los rastros del afecto', 'The traces of affection'),
    S('<p>¿Cómo se estudia algo tan íntimo como el cariño de hace doscientos años? Con dos clases de rastros. Los registros dejan hechos que alguien tenía la obligación de asentar: un acta de matrimonio da la fecha, las edades, los nombres de los padres y los testigos; un testamento dice qué tenía la familia y a quién decidió heredarlo. Antes de 1859 esos registros están en los libros de la parroquia; después, en el registro civil.</p>' +
      '<p>La otra clase de rastro guarda lo que la gente sintió o quiso mostrar: las cartas entre quien se fue y quien se quedó, las fotografías de estudio en las que la familia posaba con su mejor ropa, los diarios y las entrevistas que se hacen hoy a quienes vivieron aquello. Una carta no prueba que el dinero haya llegado, pero prueba lo que quien escribió quiso decirle a la otra persona en esa fecha. Quien investiga la vida familiar cruza los dos rastros: uno da los hechos, el otro da el sentido.</p>',
    '<p>How do you study something as intimate as affection from two hundred years ago? With two kinds of traces. Registers leave facts someone was obliged to record: a marriage record gives the date, the ages, the names of the parents and the witnesses; a will says what the family owned and to whom it decided to leave it. Before 1859 those registers are in the parish books; afterwards, in the civil registry.</p>' +
      '<p>The other kind of trace keeps what people felt or wanted to show: the letters between the one who left and the one who stayed, the studio photographs in which the family posed in its best clothes, the diaries and the interviews made today with those who lived through it. A letter does not prove the money arrived, but it proves what the writer wanted to say to the other person on that date. Whoever researches family life crosses the two traces: one gives the facts, the other gives the meaning.</p>') +
    fuBuild(rng));
  fuRender();

                    'Que quienes se quedaron perdieron toda capacidad de decisión sobre el dinero de la casa.',
                    'Que el vínculo entre ambas partes se mantenía solo mientras durara el envío de dinero.'],
                en:['That the family went on working as a single unit, even though its members lived in different places and shared out the tasks in another way.',
                    'That the family dissolved and each part formed an independent household with no relation to the other.',
                    'That those who stayed lost all decision making power over the money of the house.',
                    'That the bond between the two parts held only as long as the money transfers lasted.'] },

      explanation:{ es:'Cartas y envíos sostenían una economía y una vida familiar compartidas a distancia. Quienes se quedaron decidían el gasto diario, así que la unidad se mantuvo con otro reparto de tareas.',
                    en:'Letters and transfers sustained an economy and a family life shared at a distance. Those who stayed decided the daily spending, so the unit held together with a different sharing of tasks.' } }
  ], rng), rng);

  /* ── graded 10 ── */
  addProblem(pickV([
    { title:{ es:'Sostener una afirmación', en:'Holding up a claim' },
      stmt:{ es:'Un compañero sostiene: "la familia siempre ha sido igual, lo único que cambia son las costumbres de cada época". ¿Cuál es la mejor respuesta apoyada en evidencia histórica?',
             en:'A classmate maintains: "the family has always been the same, the only thing that changes is the customs of each period". What is the best answer supported by historical evidence?' },
      options:{ es:['En menos de dos siglos cambiaron quién decide la boda, quién registra los nacimientos, si el vínculo puede deshacerse y quién encabeza el hogar, y todo eso está documentado.',
                    'Tiene razón: las leyes cambian, pero la vida dentro de las casas ha sido siempre la misma.',
                    'Se equivoca porque en el pasado no existía el afecto entre padres e hijos ni entre esposos.',
                    'Se equivoca porque la familia extensa desapareció por completo durante el siglo XX.'],
                en:['In less than two centuries there changed who decides the wedding, who registers births, whether the bond can be undone and who heads the household, and all of that is documented.',
                    'He is right: laws change, but life inside houses has always been the same.',

                    'He is wrong because the extended family disappeared completely during the 20th century.'] },
      correct:0, showWork:true,
      hint:{ es:'Anota los cambios concretos que revisaste, con su fecha, y elige la opción que se apoye en ellos sin exagerar.',
             en:'Write down the concrete changes you reviewed, with their date, and choose the option that leans on them without exaggerating.' },
      explanation:{ es:'La respuesta firme nombra cambios verificables: 1859, 1917, 1953, 1974 y el siglo XXI. Las otras exageran, negando el afecto en el pasado o dando por desaparecida una forma de hogar que aún existe.',
                    en:'The firm answer names verifiable changes: 1859, 1917, 1953, 1974 and the 21st century. The others exaggerate, denying affection in the past or declaring extinct a household form that still exists.' } },
    { title:{ es:'Sostener una afirmación', en:'Holding up a claim' },
      stmt:{ es:'Una investigadora quiere mostrar que la vida familiar mexicana cambió entre 1850 y 1980. ¿Qué conjunto de pruebas sostiene mejor esa afirmación?',
             en:'A researcher wants to show that Mexican family life changed between 1850 and 1980. Which set of evidence best supports that claim?' },
      options:{ es:['Actas parroquiales y civiles, leyes sobre matrimonio y divorcio, y entrevistas a quienes vivieron esos años, comparadas entre sí.',
                    'Solo las leyes, porque son el documento más confiable y no dependen de la memoria de nadie.',
                    'Solo las entrevistas, porque los documentos oficiales nunca registran lo que la gente sentía.',
                    'Solo las fotografías familiares, porque muestran de manera directa cómo era cada hogar.'],
                en:['Parish and civil records, laws on marriage and divorce, and interviews with those who lived through those years, compared with one another.',
                    'Only the laws, because they are the most reliable document and do not depend on the memory of anyone.',
                    'Only the interviews, because official documents never record what people felt.',
                    'Only the family photographs, because they show directly what each household was like.'] },
      correct:0, showWork:true,
      hint:{ es:'Recuerda qué puede probar cada rastro por separado y qué le falta a cada uno cuando se usa solo.',
             en:'Remember what each trace can prove on its own and what each one lacks when used alone.' },
      explanation:{ es:'Las leyes dicen qué se permitía, las actas muestran lo que en efecto ocurría y las entrevistas explican cómo se vivió. Cruzar las tres es lo que vuelve sólida la afirmación; ninguna basta por sí sola.',
                    en:'Laws say what was allowed, records show what actually happened and interviews explain how it was lived. Crossing the three is what makes the claim solid; none is enough on its own.' } }
  ], rng), rng);

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Relaciones Afectivas y Familiares a través de la Historia';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
