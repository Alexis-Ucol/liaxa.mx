      stmt:{ es:'Una autoridad aceptó por escrito una recomendación que le pedía reparar el daño y capacitar a su personal. Ocho meses después no ha entregado ninguna prueba de haberlo hecho. ¿Qué corresponde hacer al organismo que la emitió?',
             en:'An authority accepted in writing a recommendation asking it to repair the harm and to train its staff. Eight months later it has delivered no proof of having done so. What should the body that issued it do?' },
      options:{ es:[
        'Mantener el seguimiento, calificar el cumplimiento como parcial o insuficiente, informarlo públicamente y, según el caso, pedir la comparecencia de la autoridad o dar vista a las instancias que sí sancionan.',
        'Ejecutar la recomendación por la fuerza pública, ya que la aceptación por escrito la convirtió en una resolución obligatoria equiparable a una sentencia judicial.',
        'Cerrar el expediente de manera automática, porque la aceptación de la recomendación agota la actuación del organismo y concluye formalmente el caso.',
        'Imponer una multa económica a la autoridad incumplida y descontarla del presupuesto que le corresponde para el ejercicio del año siguiente.' ],
        en:[
        'Keep the follow up, rate compliance as partial or insufficient, report it publicly and, depending on the case, request the appearance of the authority or refer the matter to the instances that do sanction.',
        'Enforce the recommendation with public force, since the written acceptance turned it into a binding resolution equivalent to a court ruling.',
        'Close the file automatically, because accepting the recommendation exhausts the action of the body and formally ends the case.',
        'Impose a financial fine on the non complying authority and deduct it from the budget it is allocated for the following year.' ] },
      correct:0,
      hint:{ es:'Aceptar y cumplir son dos momentos distintos. Piensa en qué herramientas conserva el organismo entre uno y otro.',
             en:'Accepting and complying are two different moments. Think about which tools the body keeps between one and the other.' },
      explanation:{ es:'La aceptación es apenas el compromiso; el cumplimiento se prueba con hechos y documentos. Por eso el expediente no se cierra al aceptarse: entra en seguimiento, y el organismo califica el grado de cumplimiento y lo publica en sus informes, de modo que el incumplimiento queda registrado y a la vista de cualquiera. Cuando corresponde, puede pedir que la autoridad comparezca ante el órgano legislativo o dar vista a los órganos de control, porque el organismo no ejecuta por la fuerza ni impone multas.',
                    en:'Acceptance is only the commitment; compliance is proved with facts and documents. That is why the file does not close upon acceptance: it enters follow up, and the body rates the degree of compliance and publishes it in its reports, so non compliance is recorded and visible to anyone. When appropriate, it can ask the authority to appear before the legislative body or refer the matter to control offices, because the body does not enforce by force and does not impose fines.' } },
    { title:{ es:'Por qué se publica', en:'Why it is published' },
      stmt:{ es:'Una estudiante pregunta por qué las recomendaciones se hacen públicas, si de todos modos la autoridad puede rechazarlas. ¿Cuál respuesta explica mejor el sentido de esa publicidad?',
             en:'A student asks why recommendations are made public, if the authority can reject them anyway. Which answer best explains the point of that publicity?' },
      options:{ es:[
        'Porque convierte el caso en información verificable que cualquiera puede citar: sostiene la exigencia social, tiene costo político para quien la rechaza y sirve como prueba documentada ante otras instancias, incluidas las internacionales.',
        'Porque la ley obliga a difundir todos los documentos que produce cualquier organismo autónomo, sin que esa difusión persiga un efecto distinto al de la transparencia.',
        'Porque al publicarse la recomendación adquiere fuerza obligatoria, de modo que la autoridad que la rechaza después de su publicación queda impedida para insistir en su negativa.',
        'Porque la publicación sirve para que la población identifique a las personas servidoras públicas señaladas y pueda reclamarles de manera directa en su lugar de trabajo.' ],
        en:[
        'Because it turns the case into verifiable information anyone can cite: it sustains social demand, carries a political cost for whoever rejects it and serves as documented evidence before other instances, including international ones.',
        'Because the law requires publishing every document produced by any autonomous body, without that publication seeking an effect other than transparency.',
        'Because upon publication the recommendation acquires binding force, so the authority that rejects it after publication is barred from insisting on its refusal.',
        'Because publication helps the population identify the public servants named and claim from them directly at their workplace.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué puede hacer con ese documento alguien que no es la autoridad señalada.',
             en:'Ask yourself what somebody who is not the authority named can do with that document.' },
      explanation:{ es:'La publicidad es la forma en que un documento sin fuerza ejecutiva adquiere consecuencias. Una recomendación publicada deja de ser un asunto entre dos oficinas: se vuelve un hecho verificable que la prensa, las organizaciones, los congresos y las propias comunidades pueden citar, y que después sostiene una petición internacional porque prueba que el Estado conoció el caso y qué hizo con él. Ese es su efecto, y no el de convertirse en obligatoria ni el de exponer a nadie en su lugar de trabajo.',
                    en:'Publicity is the way a document without enforcement power gains consequences. A published recommendation stops being a matter between two offices: it becomes a verifiable fact that the press, organizations, legislatures and the communities themselves can cite, and that later sustains an international petition because it proves the State knew the case and what it did with it. That is its effect, and not becoming binding or exposing anyone at their workplace.' } }
  ], rng), rng);

  /* ── CONCEPTO 4 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Cuando el país no repara: el mapa internacional','When the country does not repair: the international map') + '</h2>' +
    '<p>' + S('Al firmar un tratado, un Estado acepta dos cosas: obligarse por su contenido y dejarse revisar por instancias que no controla. De ahí nacen dos sistemas que funcionan al mismo tiempo. El sistema universal se articula en la Organización de las Naciones Unidas, con comités que examinan a cada Estado sobre el tratado que vigilan, relatorías que investigan temas específicos y una oficina del alto comisionado que da seguimiento en el terreno.',
              'By signing a treaty, a State accepts two things: to be bound by its content and to be reviewed by bodies it does not control. From there two systems arise that work at the same time. The universal system is organized in the United Nations, with committees that examine each State on the treaty they oversee, special rapporteurs that investigate specific topics and an office of the high commissioner that follows up on the ground.') + '</p>' +
    '<p>' + S('El sistema regional funciona dentro de la Organización de los Estados Americanos y tiene dos órganos con papeles distintos. La Comisión Interamericana recibe peticiones de personas y organizaciones, decide si son admisibles, investiga, puede dictar medidas cautelares y emite informes; si el Estado no cumple, puede llevar el caso ante la Corte Interamericana. La Corte es un tribunal: dicta sentencias definitivas y obligatorias para el Estado que aceptó su competencia, como lo hizo México desde 1998.',
              'The regional system works inside the Organization of American States and has two bodies with different roles. The Inter-American Commission receives petitions from people and organizations, decides whether they are admissible, investigates, can issue precautionary measures and produces reports; if the State does not comply, it can take the case before the Inter-American Court. The Court is a tribunal: it issues final and binding rulings for the State that accepted its jurisdiction, as Mexico did back in 1998.') + '</p>' +
    '<p>' + S('Estas instancias no sustituyen a las nacionales, y esa es la regla que ordena todo el mapa. El sistema internacional es subsidiario: actúa cuando el propio Estado ya tuvo la oportunidad de resolver y no lo hizo. Por eso una petición pide que se hayan agotado los recursos internos, que se presente dentro del plazo posterior a la última resolución y que los hechos se atribuyan al Estado. Hay excepciones razonables, como cuando no existe el recurso, se impide llegar a él o el retardo es injustificado.',
              'These instances do not replace national ones, and that is the rule that organizes the whole map. The international system is subsidiary: it acts when the State itself already had the chance to solve the matter and did not. That is why a petition asks that internal remedies have been exhausted, that it be filed within the deadline following the last resolution and that the facts be attributable to the State. There are reasonable exceptions, such as when the remedy does not exist, access to it is blocked or the delay is unjustified.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Dos palabras que conviene no mezclar: ','Two words worth not mixing: ') + '</strong>' +
      S('la Comisión Interamericana recibe, investiga y recomienda, y puede llevar un caso ante el tribunal. La Corte Interamericana juzga y dicta sentencias que obligan al Estado, incluso a modificar prácticas y normas para que el hecho no se repita.',
        'the Inter-American Commission receives, investigates and recommends, and can take a case before the tribunal. The Inter-American Court judges and issues rulings that bind the State, even to change practices and rules so the fact does not repeat.') + '</p></div>' +
    buildEscalera(rng));
  esRender();

  /* ── P7 ─────────────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Empezar por la puerta de al lado', en:'Starting at the door next door' },
      stmt:{ es:'Un colectivo lleva meses reclamando que una obra pública dejó a su comunidad sin acceso al agua. Deciden llevar el caso directamente a una instancia internacional, sin haber presentado queja ante ningún organismo del país ni haber acudido a tribunales. ¿Qué respuesta les corresponde esperar y por qué?',
             en:'A collective has spent months claiming that a public work left their community without access to water. They decide to take the case directly to an international instance, without having filed a complaint before any national body or gone to court. What answer should they expect and why?' },
      options:{ es:[
        'Que la petición no se admita todavía, porque el sistema internacional es subsidiario y exige que el Estado haya tenido antes la oportunidad de resolver mediante sus propias instancias.',
        'Que la petición se admita de inmediato, porque la gravedad del daño a un derecho como el agua desplaza cualquier requisito de trámite previo en el país.',
        'Que la petición se admita únicamente si el colectivo demuestra que las instancias nacionales le resultan demasiado lentas o costosas para su situación económica.',
        'Que la petición no se admita nunca, porque las instancias internacionales solo revisan informes de los Estados y no reciben reclamos presentados por personas u organizaciones.' ],
        en:[
        'That the petition not be admitted yet, because the international system is subsidiary and requires that the State first had the chance to solve the matter through its own instances.',
        'That the petition be admitted immediately, because the seriousness of harm to a right such as water displaces any requirement of prior procedure in the country.',
        'That the petition be admitted only if the collective proves that national instances are too slow or too expensive for their economic situation.',
        'That the petition never be admitted, because international instances only review reports from States and do not receive claims filed by people or organizations.' ] },
      correct:0,
      hint:{ es:'Recuerda para qué existe el requisito de agotar lo interno y qué prueba deja el paso por las instancias del país.',
             en:'Recall why the requirement of exhausting internal remedies exists and what evidence the passage through national instances leaves.' },
      explanation:{ es:'El sistema internacional se diseñó como último recurso, no como atajo. El Estado es el primer obligado a reparar, y solo cuando falla se justifica que otra instancia lo revise; además, el recorrido interno deja el expediente que después prueba la falla. Por eso la petición sería inadmisible por ahora. El requisito no es absoluto y admite excepciones cuando no existe el recurso, se impide el acceso a él o hay un retardo injustificado, pero ninguna de esas situaciones se ha presentado todavía en este caso.',
                    en:'The international system was designed as a last resort, not as a shortcut. The State is the first one obliged to repair, and only when it fails is it justified for another instance to review it; besides, the internal path leaves the file that later proves the failure. That is why the petition would be inadmissible for now. The requirement is not absolute and admits exceptions when the remedy does not exist, access to it is blocked or there is unjustified delay, but none of those situations has arisen yet in this case.' } },
    { title:{ es:'Lo que sostiene la subsidiariedad', en:'What sustains subsidiarity' },
      stmt:{ es:'En un debate escolar alguien sostiene que exigir el agotamiento de los recursos internos es solo un obstáculo burocrático que protege a los Estados. ¿Qué argumento responde mejor a esa afirmación?',
             en:'In a school debate somebody argues that requiring the exhaustion of internal remedies is only a bureaucratic obstacle that protects States. Which argument best answers that claim?' },
      options:{ es:[
        'Que el Estado es el primer obligado a reparar y debe tener la oportunidad de hacerlo, y que el recorrido interno construye el expediente que después demuestra que no reparó.',
        'Que el requisito existe para reducir el número de casos que llegan a las instancias internacionales, ya que su capacidad de trabajo es limitada y deben priorizar.',
        'Que el requisito protege a las personas peticionarias de gastar en un litigio internacional cuyo resultado sería incierto y tardaría varios años en llegar.',
        'Que el requisito garantiza que ninguna instancia internacional pueda contradecir lo que ya resolvieron los tribunales nacionales de cada país sobre el mismo caso.' ],
        en:[
        'That the State is the first one obliged to repair and must have the chance to do so, and that the internal path builds the file that later proves it did not repair.',
        'That the requirement exists to reduce the number of cases reaching international instances, since their working capacity is limited and they must prioritize.',
        'That the requirement protects petitioners from spending on international litigation whose result would be uncertain and would take several years to arrive.',
        'That the requirement guarantees that no international instance can contradict what the national courts of each country already decided on the same case.' ] },
      correct:0,
      hint:{ es:'Piensa en quién tiene la obligación principal frente a la persona afectada y qué queda registrado al recorrer las instancias del país.',
             en:'Think about who holds the main obligation toward the affected person and what is recorded by going through the national instances.' },
      explanation:{ es:'La subsidiariedad no protege al Estado: le exige cumplir primero. Si un país repara el daño con sus propias instituciones, el caso se resuelve donde ocurrió y sin que nadie tenga que salir a buscar justicia lejos de su comunidad. Y si no lo hace, el recorrido no fue tiempo perdido: las respuestas, las negativas y los silencios quedan documentados, y ese expediente es precisamente la prueba que sostiene la petición internacional. Las otras respuestas confunden un principio de responsabilidad con la carga de trabajo o con la protección de los tribunales nacionales.',
                    en:'Subsidiarity does not protect the State: it demands that the State comply first. If a country repairs the harm with its own institutions, the case is solved where it happened and without anyone having to look for justice far from their community. And if it does not, the path was not wasted time: the answers, refusals and silences are documented, and that file is precisely the evidence sustaining the international petition. The other answers confuse a principle of responsibility with workload or with protecting national courts.' } }
  ], rng), rng);

  /* ── CONCEPTO 5 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('Quién más empuja: organizaciones y personas','Who else pushes: organizations and people') + '</h2>' +
    '<p>' + S('Junto a las instituciones públicas trabajan organizaciones civiles, colectivos, personas defensoras y equipos universitarios. No forman parte del Estado, no reciben quejas oficiales ni dictan resoluciones, y esa distancia es justamente su ventaja: pueden decir en voz alta lo que una oficina pública tarda en reconocer. Su instrumento principal es la documentación paciente, es decir, reunir casos, fechas, cifras y testimonios hasta que un problema aislado se vuelve un patrón demostrable.',
              'Alongside public institutions work civil organizations, collectives, human rights defenders and university teams. They are not part of the State, they do not receive official complaints and do not issue resolutions, and that distance is precisely their advantage: they can say out loud what a public office takes time to acknowledge. Their main instrument is patient documentation, that is, gathering cases, dates, figures and testimonies until an isolated problem becomes a demonstrable pattern.') + '</p>' +
    '<p>' + S('Con ese material hacen varias cosas. Acompañan a las personas afectadas en el trámite de su queja y en el juicio, para que nadie enfrente sola una ventanilla. Eligen casos que representan a muchos otros y los litigan hasta el final, de manera que una sola sentencia cambie una práctica completa. Y cuando un comité internacional examina al país, envían un informe alternativo con su propia versión de los hechos, que el comité contrasta con el informe oficial antes de formular sus observaciones.',
              'With that material they do several things. They accompany affected people in the procedure of their complaint and in the trial, so nobody faces a service window alone. They choose cases that represent many others and litigate them to the end, so that a single ruling changes an entire practice. And when an international committee examines the country, they send an alternative report with their own version of the facts, which the committee contrasts with the official report before issuing its observations.') + '</p>' +
    '<p>' + S('Conviene ser precisos sobre su alcance. Una organización no puede sancionar a nadie, no anula actos de autoridad y sus informes no obligan; lo que hace es sostener la exigencia en el tiempo y colocar información donde antes había silencio. Esa es también la manera en que muchas peticiones llegan al sistema interamericano: alguien acompañó el caso durante años, guardó cada respuesta y cada negativa, y revisó que se reunieran los requisitos antes de presentarlo.',
              'It is worth being precise about their scope. An organization cannot sanction anyone, does not annul acts of authority and its reports are not binding; what it does is sustain the demand over time and place information where there was silence before. That is also how many petitions reach the Inter-American system: somebody accompanied the case for years, kept every answer and every refusal, and checked that the requirements were met before filing it.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Documentar','Document') + '</div><div class="rform">' + S('reunir pruebas','gather evidence') + '</div><div class="rnote">' + S('Casos, fechas y testimonios que muestran un patrón.','Cases, dates and testimonies that show a pattern.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Acompañar','Accompany') + '</div><div class="rform">' + S('no dejar sola','not leave alone') + '</div><div class="rnote">' + S('Apoyo en la queja, en el juicio y en el seguimiento.','Support in the complaint, in the trial and in the follow up.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Informar','Inform') + '</div><div class="rform">' + S('informe alternativo','alternative report') + '</div><div class="rnote">' + S('Su versión llega al comité que examina al país.','Their version reaches the committee that examines the country.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Su límite','Their limit') + '</div><div class="rform">' + S('no sancionan','they do not sanction') + '</div><div class="rnote">' + S('No anulan actos ni imponen consecuencias por sí mismas.','They do not annul acts or impose consequences by themselves.') + '</div></div>' +
    '</div>' +
    buildFiltro(rng));
  faRender();

  /* ── P8 ─────────────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Dos órganos, dos alcances', en:'Two bodies, two scopes' },
      stmt:{ es:'La Comisión Interamericana admitió una petición, investigó y concluyó que el Estado violó derechos; le dirigió recomendaciones y le dio un plazo. El plazo venció sin que el Estado cumpliera. ¿Qué puede seguir y qué efecto tendría?',
             en:'The Inter-American Commission admitted a petition, investigated and concluded that the State violated rights; it addressed recommendations to it and gave it a deadline. The deadline expired without the State complying. What can follow and what effect would it have?' },
      options:{ es:[
        'La Comisión puede someter el caso a la Corte Interamericana, cuya sentencia sí obliga al Estado y puede ordenarle reparar y modificar las prácticas que hicieron posible el hecho.',
        'La Comisión puede ejecutar por sí misma sus recomendaciones dentro del territorio del Estado, apoyándose en las autoridades locales para hacerlas cumplir.',
        'El caso se cierra sin más, porque una vez vencido el plazo de las recomendaciones el sistema interamericano ya no conserva ninguna vía abierta.',
        'La Comisión puede imponer al Estado una sanción económica y suspender su participación en los órganos de la organización regional.' ],
        en:[
        'The Commission can submit the case to the Inter-American Court, whose ruling does bind the State and can order it to repair and to change the practices that made the fact possible.',
        'The Commission can enforce its own recommendations inside the territory of the State, relying on local authorities to have them obeyed.',
        'The case simply closes, because once the deadline of the recommendations expires the Inter-American system keeps no route open.',
        'The Commission can impose a financial sanction on the State and suspend its participation in the bodies of the regional organization.' ] },
      correct:0,
      hint:{ es:'Uno de los dos órganos investiga y recomienda; el otro es un tribunal. Piensa cuál de los dos dicta algo obligatorio.',
             en:'One of the two bodies investigates and recommends; the other is a tribunal. Think about which one issues something binding.' },
      explanation:{ es:'La Comisión no es un tribunal: recibe, admite, investiga, dicta medidas cautelares y recomienda. Cuando el Estado no cumple, su siguiente instrumento es llevar el caso ante la Corte Interamericana, que sí juzga y dicta sentencias definitivas y obligatorias para los Estados que aceptaron su competencia. Esas sentencias suelen ordenar reparar a las víctimas y también garantías de no repetición, como capacitar personal o cambiar una norma, porque buscan que el hecho no vuelva a ocurrir.',
                    en:'The Commission is not a tribunal: it receives, admits, investigates, issues precautionary measures and recommends. When the State does not comply, its next instrument is to take the case before the Inter-American Court, which does judge and issues final and binding rulings for the States that accepted its jurisdiction. Those rulings usually order reparation for the victims and also guarantees of non repetition, such as training staff or changing a rule, because they seek that the fact does not happen again.' } },
    { title:{ es:'Qué hace un tribunal internacional', en:'What an international tribunal does' },
      stmt:{ es:'Cuatro afirmaciones circulan en un grupo escolar sobre la Corte Interamericana de Derechos Humanos. ¿Cuál de ellas describe correctamente lo que hace ese tribunal?',
             en:'Four claims circulate in a school group about the Inter-American Court of Human Rights. Which one of them correctly describes what that tribunal does?' },
      options:{ es:[
        'Dicta sentencias definitivas y obligatorias que declaran la responsabilidad del Estado y ordenan reparar el daño y adoptar garantías de no repetición.',
        'Juzga y encarcela a las personas servidoras públicas que cometieron la violación, sustituyendo a los tribunales penales del país donde ocurrió el hecho.',
        'Recibe directamente las quejas de cualquier persona del continente y las resuelve sin que ninguna otra instancia haya revisado antes el caso.',
        'Emite opiniones sobre los tratados que los Estados pueden seguir o no, ya que ninguna de sus resoluciones tiene carácter obligatorio para ellos.' ],
        en:[
        'It issues final and binding rulings that declare the responsibility of the State and order reparation of the harm and guarantees of non repetition.',
        'It tries and imprisons the public servants who committed the violation, replacing the criminal courts of the country where the fact happened.',
        'It directly receives complaints from any person on the continent and settles them without any other instance having reviewed the case before.',
        'It issues opinions on treaties that States may follow or not, since none of its resolutions is binding for them.' ] },
      correct:0,
      hint:{ es:'Fíjate en quién es la parte demandada ante ese tribunal y por dónde tuvo que pasar el caso antes de llegar ahí.',
             en:'Notice who the respondent party before that tribunal is and where the case had to pass before arriving there.' },
      explanation:{ es:'Ante la Corte Interamericana el demandado es el Estado, no una persona: por eso sus sentencias declaran responsabilidad estatal y ordenan medidas de reparación y de no repetición, mientras que juzgar y encarcelar a personas sigue correspondiendo a los tribunales del país. Tampoco recibe quejas directas: el caso llega después de pasar por las instancias internas y por la Comisión Interamericana. Y sus sentencias no son opiniones optativas, son definitivas y obligan al Estado que aceptó su competencia.',
                    en:'Before the Inter-American Court the respondent is the State, not a person: that is why its rulings declare State responsibility and order reparation and non repetition measures, while trying and imprisoning individuals still corresponds to the courts of the country. It does not receive direct complaints either: the case arrives after passing through internal instances and through the Inter-American Commission. And its rulings are not optional opinions, they are final and bind the State that accepted its jurisdiction.' } }
  ], rng), rng);

  /* ── CIERRE ─────────────────────────────────────────────────── */
  addSection(S('CIERRE','CLOSING'),
    '<h2>' + S('El mapa completo, en tus manos','The whole map, in your hands') + '</h2>' +
    '<p>' + S('Los últimos dos casos llegan sin pistas previas. Usa lo que ya recorriste: quién está obligado, qué mandato tiene cada institución, qué instrumento abre cada puerta y hasta dónde llega cada respuesta.',
              'The last two cases arrive with no previous clues. Use what you already covered: who is obliged, what mandate each institution holds, which instrument opens each door and how far each answer reaches.') + '</p>');

  /* ── P9 ─────────────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El informe que llega desde fuera del gobierno', en:'The report arriving from outside government' },
      stmt:{ es:'Antes de que un comité internacional examine al país, tres organizaciones envían un documento con doscientos casos documentados durante cuatro años, que contradice varias cifras del informe oficial. ¿Qué efecto tiene ese envío?',
             en:'Before an international committee examines the country, three organizations send a document with two hundred cases documented over four years, which contradicts several figures of the official report. What effect does that submission have?' },
      options:{ es:[
        'El comité contrasta esa información con el informe oficial y con ella formula preguntas y observaciones al Estado, aunque las organizaciones no pueden imponerle ninguna consecuencia.',
        'El comité sustituye el informe oficial por el de las organizaciones, ya que proviene de quienes vivieron los hechos y por ello tiene mayor valor probatorio.',
        'El comité no puede tomar en cuenta ese documento, porque en el examen de un Estado solo participan los gobiernos y los propios órganos internacionales.',
        'El comité impone al Estado una sanción proporcional al número de casos documentados y ordena su reparación inmediata a través de sus tribunales.' ],
        en:[
        'The committee contrasts that information with the official report and uses it to pose questions and observations to the State, although the organizations cannot impose any consequence on it.',
        'The committee replaces the official report with the one from the organizations, since it comes from those who lived the facts and therefore carries greater evidentiary value.',
        'The committee cannot take that document into account, because only governments and the international bodies themselves take part in the examination of a State.',
        'The committee imposes on the State a sanction proportional to the number of documented cases and orders their immediate reparation through its courts.' ] },
      correct:0,
      hint:{ es:'Separa dos cosas: qué puede aportar una organización al examen y qué consecuencias puede imponer por sí misma.',
             en:'Separate two things: what an organization can contribute to the examination and what consequences it can impose by itself.' },
      explanation:{ es:'El examen de un Estado no se hace solo con lo que el propio Estado dice de sí mismo. El informe alternativo aporta una versión independiente que el comité contrasta con la oficial, y de ese contraste salen las preguntas incómodas y las observaciones finales. Pero la fuerza del documento está en la información, no en un poder que las organizaciones no tienen: no sustituyen el informe oficial, no sancionan y no ordenan reparaciones. Quien queda obligado a responder es el Estado.',
                    en:'The examination of a State is not done only with what the State says about itself. The alternative report contributes an independent version that the committee contrasts with the official one, and from that contrast come the uncomfortable questions and the final observations. But the force of the document lies in the information, not in a power the organizations do not have: they do not replace the official report, they do not sanction and they do not order reparations. The one obliged to answer is the State.' } },
    { title:{ es:'Lo que una organización puede y no puede', en:'What an organization can and cannot do' },
      stmt:{ es:'Una organización acompaña a una familia durante tres años: documenta el caso, la asesora en la queja, litiga el juicio y publica un informe con otros veinte casos parecidos. Un vecino comenta que entonces la organización ya puede ordenar la reparación del daño. ¿Qué corrección corresponde?',
             en:'An organization accompanies a family for three years: it documents the case, advises them in the complaint, litigates the trial and publishes a report with twenty similar cases. A neighbor comments that the organization can then order the reparation of the harm. Which correction fits?' },
      options:{ es:[
        'La organización sostiene el caso y coloca información pública, pero ordenar la reparación corresponde a las instituciones del Estado o a un tribunal, nacional o internacional.',
        'El comentario es correcto, porque al haber acompañado el caso durante todo el proceso la organización adquiere la representación legal para exigir el cumplimiento.',
        'El comentario es correcto solo si la organización cuenta con registro oficial ante el organismo público de derechos humanos que conoció la queja.',
        'La organización tampoco puede documentar ni litigar el caso, porque esas tareas corresponden de manera exclusiva a las instituciones públicas del país.' ],
        en:[
        'The organization sustains the case and places public information, but ordering reparation corresponds to the institutions of the State or to a court, national or international.',
        'The comment is correct, because having accompanied the case throughout the process the organization gains legal standing to demand compliance.',
        'The comment is correct only if the organization holds an official registration before the public human rights body that heard the complaint.',
        'The organization cannot document or litigate the case either, because those tasks correspond exclusively to the public institutions of the country.' ] },
      correct:0,
      hint:{ es:'Pregúntate quién tiene la facultad de ordenar algo y quién tiene la capacidad de sostener y hacer visible un reclamo.',
             en:'Ask yourself who holds the power to order something and who holds the capacity to sustain and make a claim visible.' },
      explanation:{ es:'Documentar, asesorar, litigar y publicar son tareas que cualquier organización puede hacer, y son decisivas: sin ellas muchos casos no llegarían a ninguna ventanilla. Lo que no puede hacer es ordenar. Una reparación se ordena en una recomendación aceptada y cumplida, en una sentencia nacional o en una sentencia internacional, y en todos esos casos quien la dicta es una institución del Estado o un tribunal. Confundir el empuje con la facultad de mandar lleva a esperar de una organización algo que solo una institución puede dar.',
                    en:'Documenting, advising, litigating and publishing are tasks any organization can perform, and they are decisive: without them many cases would never reach any window. What it cannot do is order. Reparation is ordered in an accepted and fulfilled recommendation, in a national ruling or in an international ruling, and in all those cases the one issuing it is a State institution or a tribunal. Confusing the push with the power to command leads to expecting from an organization something only an institution can give.' } }
  ], rng), rng);

  /* ── P10 ────────────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Armar la ruta completa', en:'Building the whole route' },
      stmt:{ es:'En una oficina pública municipal la única ventanilla de trámites está en un segundo piso sin elevador ni rampa. Varias personas con discapacidad llevan meses sin poder realizar sus trámites y ya lo plantearon de palabra sin resultado. ¿Cuál es la ruta más adecuada para exigir que se aplique la norma?',
             en:'In a municipal public office the only service window is on a second floor with no elevator and no ramp. Several people with disabilities have spent months unable to complete their procedures and already raised it verbally with no result. Which is the most adequate route to demand that the rule be applied?' },
      options:{ es:[
        'Documentar las fechas y las respuestas recibidas, presentar la queja ante la comisión de derechos humanos del estado señalando a la autoridad municipal y solicitar medidas cautelares para atender los trámites mientras se resuelve.',
        'Presentar de una vez la petición ante la Comisión Interamericana, porque se trata de una barrera que afecta un derecho reconocido en tratados internacionales firmados por el país.',
        'Reunir firmas de las personas afectadas y entregarlas al consejo nacional que previene la discriminación para que dicte una sentencia obligatoria contra el municipio.',
        'Esperar a que el organismo público de derechos humanos detecte la barrera en alguna visita de supervisión, ya que las quejas solo pueden presentarlas las personas afectadas por escrito y con abogado.' ],
        en:[
        'Document the dates and the answers received, file the complaint before the state human rights commission naming the municipal authority and request precautionary measures so the procedures are attended while the matter is resolved.',
        'File the petition before the Inter-American Commission right away, because it is a barrier affecting a right recognized in international treaties signed by the country.',
        'Gather signatures from the affected people and deliver them to the national council that prevents discrimination so it issues a binding ruling against the municipality.',
        'Wait for the public human rights body to detect the barrier in some supervision visit, since complaints can only be filed by the affected people in writing and with a lawyer.' ] },
      correct:0,
      hint:{ es:'Revisa tres cosas antes de elegir: de qué nivel es la autoridad, qué instancia corresponde primero y qué hacer con el daño que sigue corriendo.',
             en:'Check three things before choosing: which level the authority belongs to, which instance comes first and what to do with the harm that keeps running.' },
      explanation:{ es:'La autoridad señalada es municipal, de modo que la queja corresponde al organismo del estado; el trámite es gratuito y no exige abogado, y puede presentarlo cualquier persona, incluso a favor de otra. Documentar antes lo ya reclamado da sustento al expediente, y las medidas cautelares atienden lo urgente mientras la investigación avanza. Acudir de entrada a la instancia internacional sería inadmisible por no haber agotado lo interno, y el consejo que previene la discriminación no dicta sentencias, porque no es un tribunal.',
                    en:'The authority named is municipal, so the complaint corresponds to the state body; the procedure is free and requires no lawyer, and anyone can file it, even on behalf of another person. Documenting beforehand what was already claimed gives support to the file, and precautionary measures address the urgent part while the investigation moves forward. Going straight to the international instance would be inadmissible for not having exhausted internal remedies, and the council that prevents discrimination does not issue rulings, because it is not a tribunal.' } },
    { title:{ es:'Elegir entre cuatro planes', en:'Choosing among four plans' },
      stmt:{ es:'En una comunidad hablante de una lengua originaria, una oficina federal atiende solo en español y ha rechazado durante un año las solicitudes de las familias por errores de llenado que nadie les explicó. La asamblea discute qué hacer. ¿Cuál plan usa mejor las instituciones disponibles?',
             en:'In a community that speaks an original language, a federal office serves only in Spanish and has rejected the families applications for a year over form errors nobody explained to them. The assembly discusses what to do. Which plan makes the best use of the available institutions?' },
      options:{ es:[
        'Reunir los rechazos con sus fechas, presentar la queja ante la Comisión Nacional por tratarse de una oficina federal, pedir intérprete y medidas cautelares, y dar seguimiento público a la recomendación que se emita.',
        'Enviar el caso directamente a un comité internacional, ya que el derecho a usar la propia lengua está reconocido en tratados y eso permite saltar cualquier instancia del país.',
        'Presentar la queja ante la comisión de derechos humanos del estado donde vive la comunidad, porque ahí ocurrieron los hechos y ahí residen las familias afectadas.',
        'Solicitar a una organización civil que emita una resolución obligatoria contra la oficina federal, porque documentó el problema durante todo el año que duró el rechazo.' ],
        en:[
        'Gather the rejections with their dates, file the complaint before the National Commission since it is a federal office, ask for an interpreter and precautionary measures, and publicly follow up the recommendation issued.',
        'Send the case directly to an international committee, since the right to use ones own language is recognized in treaties and that allows skipping any instance in the country.',
        'File the complaint before the human rights commission of the state where the community lives, because the facts happened there and the affected families reside there.',
        'Ask a civil organization to issue a binding resolution against the federal office, because it documented the problem throughout the year the rejection lasted.' ] },
      correct:0,
      hint:{ es:'Fíjate en de qué nivel depende la oficina y en cuál de los planes conserva algo que hacer después de que se emita el documento.',
             en:'Notice which level the office depends on and which of the plans keeps something to do after the document is issued.' },
      explanation:{ es:'Como la oficina es federal, la queja corresponde al organismo nacional y no al estatal, aunque los hechos ocurran dentro de un estado. Reunir los rechazos con sus fechas convierte un malestar en un patrón demostrable; pedir intérprete atiende el origen del problema, y las medidas cautelares evitan que las familias pierdan otro año mientras se investiga. El seguimiento público es la parte que decide si la recomendación se cumple. Las otras opciones saltan instancias internas, eligen la ventanilla equivocada o piden a una organización una facultad que no tiene.',
                    en:'Since the office is federal, the complaint corresponds to the national body and not to the state one, even though the facts happen inside a state. Gathering the rejections with their dates turns discomfort into a demonstrable pattern; asking for an interpreter addresses the origin of the problem, and precautionary measures prevent the families from losing another year while the matter is investigated. Public follow up is the part that decides whether the recommendation is fulfilled. The other options skip internal instances, choose the wrong window or ask an organization for a power it does not hold.' } }
  ], rng), rng);
}
