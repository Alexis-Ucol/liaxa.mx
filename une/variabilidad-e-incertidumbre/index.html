<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variabilidad e Incertidumbre</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE WIDGETS (variabilidad e incertidumbre) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.5rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:130px; accent-color:var(--green); height:34px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:52px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem; color:var(--green); min-width:38px; text-align:right; }
.readrow { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.8rem; }
.readcell { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.readlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.readnum { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green-dark); }
.statline { margin-top:.5rem; font-size:.84rem; color:var(--text3); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.85rem; text-align:center; font-weight:600; font-size:.9rem; margin:.6rem 0; color:var(--text); }
.cls-bins { display:flex; gap:.5rem; flex-wrap:wrap; }
.cls-bin { flex:1; min-width:104px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }
.simbtns { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.7rem; }
.simbtn { min-height:44px; padding:.5rem .85rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.83rem; font-weight:600; font-family:inherit; cursor:pointer; }
.simbtn:hover { border-color:var(--green); color:var(--green); }
.simbtn.rst { color:var(--bad); }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.5rem .7rem; margin:.5rem 0; }
.reflect-prompt { font-size:.92rem; color:var(--text2); margin:.5rem 0 .8rem; }
@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }
  .cls-bins { flex-direction:column; }
  .gcanvas { height:230px; }
  .readrow { grid-template-columns:1fr 1fr; }
  .klbl { min-width:44px; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Variabilidad e Incertidumbre</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático I · Sem 1</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_pm1_t01_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_pm1_t01_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_pm1_t01_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }

  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

    if (saved.texts) {
      saved.texts.forEach(function(text, i) {

        if (ta) ta.value = text;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  for (var i = 0; i < problems.length; i++) {

    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;

    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });

    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);

      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);

      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {

      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,

  doc.save('pm1_t01_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
/* ================================================
   buildLesson: Variabilidad e incertidumbre (Pensamiento Matematico I, Sem 1)
   Interleaved: idea -> manipulativo -> problema(s). Cards built inline.
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 240;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
  function fmt2(x){ return (Math.round(x*100)/100).toFixed(2); }
  function fmt3(x){ return (Math.round(x*1000)/1000).toFixed(3); }
  function mean(a){ var s=0,i; for(i=0;i<a.length;i++) s+=a[i]; return s/a.length; }
  function rangeOf(a){ return Math.max.apply(null,a) - Math.min.apply(null,a); }
  function madOf(a){ var m=mean(a), s=0, i; for(i=0;i<a.length;i++) s += Math.abs(a[i]-m); return s/a.length; }
  function lst(a){ return a.join(', '); }
  function opts4(correct, cands){
    var out = [String(correct)], i, s;
    for (i=0;i<cands.length && out.length<4;i++){
      s = String(cands[i]);
      if (out.indexOf(s) < 0) out.push(s);
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES CON SEMILLA (se extraen una sola vez, en orden fijo)
     ============================================================ */
  var vP1 = Math.floor(rng()*2), vP2 = Math.floor(rng()*2), vP4 = Math.floor(rng()*2);
  var vP6 = Math.floor(rng()*2), vP8 = Math.floor(rng()*2), vP3 = Math.floor(rng()*2);

  /* manipulativo 2: rondas */
  var mR1 = 2*ri(3,5);                       /* rango objetivo, ronda 1 */
  var mM2 = ri(8,12);                        /* media objetivo, ronda 2 */
  var mM3 = ri(9,12), mR3 = 2*ri(3,4);       /* media y rango objetivo, ronda 3 */
  var mStart = [
    [ri(4,6), ri(6,8), ri(8,10), ri(9,11), ri(11,13)],
    [ri(3,5), ri(5,7), ri(7,9),  ri(9,11), ri(12,15)],
    [ri(5,7), ri(7,9), ri(9,11), ri(10,12), ri(13,16)]
  ];

  /* manipulativo 3: simulador */
  var simIdx = Math.floor(rng()*3);
  var simSeed = Math.floor(rng()*1000000);

  /* P3: rango de un conjunto de tiempos */
  var p3lo = ri(6,11), p3R = ri(7,13), p3hi = p3lo + p3R;
  var p3data = shufA([p3lo, p3hi, p3lo+ri(1,3), p3hi-ri(1,3), p3lo+Math.floor(p3R/2)]);
  var p3wrong = p3R + ri(2,4);

  /* P4: dos conjuntos con la misma media */
  var p4M = ri(14,20), p4s = ri(2,3), p4t = ri(5,7);
  var p4A = [p4M-p4s, p4M, p4M, p4M, p4M+p4s];
  var p4B = [p4M-p4t, p4M-1, p4M, p4M+1, p4M+p4t];

  /* P5: desviación media de cuatro mediciones */
  var p5m = ri(2,4), p5M = ri(20,30);
  var p5a = ri(1, 2*p5m-1); if (p5a === p5m) p5a = p5m + 1;
  var p5b = 2*p5m - p5a;
  var p5c = ri(1, 2*p5m-1); if (p5c === p5m) p5c = p5m - 1;
  var p5d = 2*p5m - p5c;
  var p5data = shufA([p5M-p5a, p5M-p5b, p5M+p5c, p5M+p5d]);
  var p5rango = Math.max(p5a,p5b) + Math.max(p5c,p5d);

  /* P7: frecuencia relativa observada */
  var p7pct = ri(15,45), p7n = 100*ri(2,4);
  if (p7pct*(p7n+100) === 10000) p7pct = p7pct + 1;
  var p7k = p7pct*p7n/100;

  /* P9: cuanto debe subir el maximo */
  var p9lo = ri(5,9), p9R = ri(6,10), p9hi = p9lo + p9R;
  var p9data = shufA([p9lo, p9hi, p9lo+ri(1,3), p9hi-ri(1,3), p9lo+Math.floor(p9R/2)]);
  var p9T = p9R + 2*ri(2,4);
  var p9ans = p9T - p9R;

  /* P10: proyeccion con la misma frecuencia relativa */
  var p10n = 100*ri(3,5), p10pct = 5*ri(5,13), p10n2 = 100*ri(9,14);
  if (p10pct === 50) p10pct = 55;
  if (p10n2 === 2*p10n) p10n2 = p10n2 + 100;
  var p10ans = p10pct*p10n2/100;
  var p10obs = p10pct*p10n/100;
  var p10comp = p10n2 - p10ans;
  var p10extra = p10pct*(p10n2-p10n)/100;

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Lo que se repite igual y lo que no', en:'What repeats identically and what does not'}),
      '<p>'+T({
        es:'Un fenómeno es determinista cuando sus condiciones iniciales fijan por completo el resultado: si la situación se repite con exactamente las mismas condiciones, el valor obtenido vuelve a ser el mismo. Por eso un modelo determinista se escribe como una función, en la que a cada entrada le corresponde una sola salida.',
        en:'A phenomenon is deterministic when its initial conditions completely fix the outcome: if the situation is repeated under exactly the same conditions, the value obtained comes out the same again. That is why a deterministic model is written as a function, where each input corresponds to a single output.'
      })+'</p>'+
      '<p>'+T({
        es:'Un fenómeno es aleatorio cuando, aun controlando las condiciones, el resultado individual cambia de una repetición a otra. Esto no significa que no haya estructura: el conjunto de resultados posibles suele conocerse con precisión. Lo que no se conoce es cuál de ellos ocurrirá, y a ese desconocimiento del resultado individual se le llama incertidumbre.',
        en:'A phenomenon is random when, even with the conditions under control, the individual outcome changes from one repetition to the next. This does not mean there is no structure: the set of possible outcomes is usually known precisely. What is not known is which one will occur, and that lack of knowledge about the individual outcome is called uncertainty.'
      })+'</p>'+
      '<p>'+T({
        es:'Distinguir los dos casos es la primera decisión de cualquier análisis. Si el fenómeno es determinista basta con calcular; si es aleatorio hay que registrar muchas repeticiones y describir cómo se comportan en conjunto.',
        en:'Telling the two cases apart is the first decisión in any analysis. If the phenomenon is deterministic it is enough to compute; if it is random you have to record many repetitions and describe how they behave as a whole.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Fenómeno determinista',en:'Deterministic phenomenon'})+'</div><div class="deftxt">'+T({es:'Mismas condiciones iniciales, mismo resultado en cada repetición.',en:'Same initial conditions, same outcome in every repetition.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Fenómeno aleatorio',en:'Random phenomenon'})+'</div><div class="deftxt">'+T({es:'Mismas condiciones iniciales, resultados que cambian entre repeticiones.',en:'Same initial conditions, outcomes that change between repetitions.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Espacio de resultados',en:'Outcome space'})+'</div><div class="deftxt">'+T({es:'Conjunto de todos los resultados que el fenómeno puede arrojar.',en:'The set of all outcomes the phenomenon can produce.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Incertidumbre',en:'Uncertainty'})+'</div><div class="deftxt">'+T({es:'Desconocimiento del resultado individual, aun conociendo los posibles.',en:'Not knowing the individual outcome, even when the possible ones are known.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 1: clasificador determinista / aleatorio ---- */
  (function(){
    var wrap = widget('classify');
    var BINS = {es:['Determinista','Aleatorio'], en:['Deterministic','Random']};
    var ITEMS = [
      { es:'Soltar un objeto desde una altura fija en el vacío y medir su tiempo de caída',
        en:'Dropping an object from a fixed height in a vacuum and measuring its fall time', bin:0,
        wes:'La altura y la gravedad determinan el tiempo; repetir el experimento devuelve el mismo valor.',
        wen:'Height and gravity determine the time; repeating the experiment returns the same value.' },
      { es:'Registrar cuántos mensajes llegarán a un teléfono durante la próxima hora',
        en:'Recording how many messages will arrive on a phone during the next hour', bin:1,
        wes:'El conteo cambia de una hora a otra aunque las condiciones sean parecidas.',
        wen:'The count changes from one hour to the next even when conditions are similar.' },
      { es:'Calcular el total a pagar cuando los precios y las cantidades ya están definidos',
        en:'Computing the total to pay when prices and quantities are already fixed', bin:0,
        wes:'Con los mismos precios y cantidades el total siempre resulta idéntico.',
        wen:'With the same prices and quantities the total always comes out identical.' },
      { es:'Girar una ruleta de sectores iguales y anotar el color que sale',
        en:'Spinning a wheel with equal sectors and writing down the colour that comes up', bin:1,
        wes:'Se conocen los colores posibles, pero no cuál saldrá en cada giro.',
        wen:'The possible colours are known, but not which one each spin will give.' },
      { es:'Determinar el voltaje en una resistencia conocida cuando se fija la corriente',
        en:'Determining the voltage across a known resistor when the current is fixed', bin:0,
        wes:'La relación entre corriente y voltaje asigna un único valor a cada entrada.',
        wen:'The relation between current and voltage assigns a single value to each input.' },
      { es:'Anotar la cara que queda arriba al lanzar una moneda equilibrada',
        en:'Writing down which face lands up when a fair coin is tossed', bin:1,
        wes:'El lanzamiento se repite igual y aun así la cara cambia.',
        wen:'The toss is repeated the same way and the face still changes.' },
      { es:'Medir el volumen final de un tanque después de verter una cantidad medida de agua',
        en:'Measuring the final volume of a tank after pouring in a measured amount of water', bin:0,
        wes:'El volumen inicial y el vertido fijan el resultado sin margen de variación.',
        wen:'The initial volume and the poured amount fix the result with no room for variation.' },
      { es:'Contar cuántos clientes entrarán a una tienda en la siguiente media hora',
        en:'Counting how many customers will walk into a shop in the next half hour', bin:1,
        wes:'El conteo varía entre periodos aunque el horario y el lugar sean los mismos.',
        wen:'The count varies between periods even when the time slot and place are the same.' }
    ];
    var seq = shufA([0,1,2,3,4,5,6,7]);
    var st = { i:0, tries:0, hits:0, done:false, lock:false };

    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Clasifica el fenómeno', en:'Classify the phenomenon'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Actividad completa: ',en:'Activity complete: '})+st.hits+' / '+ITEMS.length+'</div>'+
          '<div class="rfb">'+T({
            es:'La pregunta que resuelve cada caso es siempre la misma: si repites la situación con las mismas condiciones, el resultado se repite igual o cambia.',
            en:'The question that settles every case is always the same: if you repeat the situation under the same conditions, does the outcome repeat or change.'
          })+'</div></div>';
        return;
      }
      var it = ITEMS[seq[st.i]];
      var bins = T(BINS).map(function(b, bi){
        return '<button class="cls-bin" onclick="clsPick('+bi+')">'+b+'</button>';
      }).join('');
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Clasifica el fenómeno', en:'Classify the phenomenon'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Lee cada situación y decide si el resultado queda fijado por las condiciones iniciales o si cambia entre repeticiones.',
            en:'Read each situation and decide whether the outcome is fixed by the initial conditions or changes between repetitions.'
          })+'</div>'+
          '<div class="cls-prog">'+(st.i+1)+' / '+ITEMS.length+'</div>'+
          '<div class="cls-card">'+T(it)+'</div>'+
          '<div class="cls-bins">'+bins+'</div>'+
          '<div class="rfb" id="clsFb"></div>'+
        '</div>';
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.lock = false; st.tries = 0; st.i++;
        if (st.i >= ITEMS.length) st.done = true;
        render();
      }, ms);
    }
    window.clsPick = function(bi){
      if (st.done || st.lock) return;
      var it = ITEMS[seq[st.i]];
      var fb = document.getElementById('clsFb'); if (!fb) return;
      if (bi === it.bin){
        st.hits++;
        fb.innerHTML = '<span class="okmsg">'+T({es:'Correcto. ',en:'Correct. '})+'</span>'+T({es:it.wes,en:it.wen});
        adv(1500); return;
      }
      st.tries++;
      if (st.tries >= 3){
        fb.innerHTML = T({es:'Era <b>',en:'It was <b>'})+T(BINS)[it.bin]+'</b>. '+T({es:it.wes,en:it.wen});
        adv(2200); return;
      }
      fb.textContent = T({
        es:'Todavía no. Imagina que repites la situación tres veces con las mismas condiciones: el resultado se repite igual o cambia.',
        en:'Not yet. Imagine repeating the situation three times under the same conditions: does the outcome repeat or change.'
      });
    };
    render();
  })();

  /* ---- P1 ---- */

  /* ---- MANIPULATIVO 2: laboratorio de dispersión ---- */
  (function(){
    var wrap = widget('spread');
    var MAXV = 20;
    var GOALS = [
      { kind:'rango', r:mR1 },
      { kind:'media', m:mM2 },
      { kind:'ambos', m:mM3, r:mR3 }
    ];
    var st = { r:0, v:mStart[0].slice(), tries:0, done:false, lock:false };

    function goal(){ return GOALS[st.r]; }
    function solution(){
      var g = goal();
      if (g.kind === 'rango') return [4, 5, 6, 6, 4+g.r];
      if (g.kind === 'media') return [g.m-2, g.m-1, g.m, g.m+1, g.m+2];
      return [g.m - g.r/2, g.m, g.m, g.m, g.m + g.r/2];
    }
    function goalTxt(){
      var g = goal();
      if (g.kind === 'rango') return T({es:'Ajusta los cinco valores para que el rango del conjunto sea exactamente ', en:'Adjust the five values so that the range of the set is exactly '})+g.r+'.';
      if (g.kind === 'media') return T({es:'Ajusta los cinco valores para que la media del conjunto sea exactamente ', en:'Adjust the five values so that the mean of the set is exactly '})+g.m+'.';
      return T({es:'Ajusta los cinco valores para que la media sea ', en:'Adjust the five values so that the mean is '})+g.m+
             T({es:' y el rango sea ', en:' and the range is '})+g.r+T({es:' al mismo tiempo.',en:' at the same time.'});
    }
    function spDraw(){
      var cv = document.getElementById('spCv'); if (!cv) return;
      var g2 = fitCv(cv), ctx = g2.ctx, w = g2.w, h = g2.h;
      var x0 = 22, x1 = w - 22, yl = h - 44;
      var col = cssv('--green'), acc = cssv('--gold'), bd = cssv('--border'), sub = cssv('--text3'), dk = cssv('--green-dark');
      function px(v){ return x0 + (x1-x0)*v/MAXV; }
      var i, v;
      ctx.strokeStyle = bd; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0,yl); ctx.lineTo(x1,yl); ctx.stroke();
      ctx.fillStyle = sub; ctx.font = '500 10px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
      for (v=0; v<=MAXV; v+=4){
        ctx.beginPath(); ctx.moveTo(px(v), yl-4); ctx.lineTo(px(v), yl+4); ctx.stroke();
        ctx.fillText(String(v), px(v), yl+17);
      }
      var m = mean(st.v), mn = Math.min.apply(null, st.v), mx = Math.max.apply(null, st.v);
      ctx.strokeStyle = dk; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(px(mn), yl+28); ctx.lineTo(px(mx), yl+28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(mn), yl+24); ctx.lineTo(px(mn), yl+32); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(mx), yl+24); ctx.lineTo(px(mx), yl+32); ctx.stroke();
      ctx.fillStyle = dk; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      ctx.fillText(T({es:'rango ',en:'range '})+(mx-mn), (px(mn)+px(mx))/2, yl+42);
      ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(px(m), 16); ctx.lineTo(px(m), yl); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = acc; ctx.font = '600 11px "IBM Plex Sans", sans-serif';
      ctx.fillText(T({es:'media ',en:'mean '})+fmt1(m), Math.max(38, Math.min(w-38, px(m))), 12);
      var counts = {};
      for (i=0;i<st.v.length;i++){
        v = st.v[i]; counts[v] = (counts[v]||0)+1;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(px(v), yl-11-(counts[v]-1)*15, 6.5, 0, Math.PI*2); ctx.fill();
      }
    }
    function spRead(){
      var m = mean(st.v), rg = rangeOf(st.v), md = madOf(st.v), e;
      e = document.getElementById('spMed'); if (e) e.textContent = fmt1(m);
      e = document.getElementById('spRan'); if (e) e.textContent = String(rg);
      e = document.getElementById('spMad'); if (e) e.textContent = fmt1(md);
      var i;
      for (i=0;i<5;i++){ e = document.getElementById('spV'+i); if (e) e.textContent = String(st.v[i]); }
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Laboratorio de dispersión', en:'Spread lab'})+'</div>'+
          '<div class="iw-box"><div class="rfb"><span class="okmsg">'+T({
            es:'Actividad terminada. Moviste el centro y la dispersión por separado: la media dice dónde está el conjunto y el rango dice qué tan abierto está.',
            en:'Activity finished. You moved the centre and the spread separately: the mean says where the set sits and the range says how wide it is.'
          })+'</span></div></div>';
        return;
      }
      var sliders = '', i;
      for (i=0;i<5;i++){
        sliders += '<div class="krow"><span class="klbl">'+T({es:'dato ',en:'value '})+(i+1)+'</span>'+
          '<input type="range" min="0" max="'+MAXV+'" value="'+st.v[i]+'" oninput="spSet('+i+',this.value)">'+
          '<span class="kval" id="spV'+i+'">'+st.v[i]+'</span></div>';
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Laboratorio de dispersión', en:'Spread lab'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Mueve cada valor sobre la recta y observa cómo responden la media, el rango y la desviación media.',
            en:'Move each value along the line and watch how the mean, the range and the mean deviation respond.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="goalbar">'+goalTxt()+'</div>'+
          '<canvas class="gcanvas" id="spCv"></canvas>'+
          sliders+
          '<div class="readrow">'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Media',en:'Mean'})+'</div><div class="readnum" id="spMed">'+fmt1(mean(st.v))+'</div></div>'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Rango',en:'Range'})+'</div><div class="readnum" id="spRan">'+rangeOf(st.v)+'</div></div>'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Desv. media',en:'Mean dev.'})+'</div><div class="readnum" id="spMad">'+fmt1(madOf(st.v))+'</div></div>'+
          '</div>'+
          '<button class="rverify-btn" onclick="spChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="spFb"></div>'+
        '</div>';
      spDraw();
      setTimeout(spDraw, 160);
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.lock = false; st.r++; st.tries = 0;
        if (st.r >= 3) { st.done = true; }
        else { st.v = mStart[st.r].slice(); }
        render();
      }, ms);
    }
    window.spSet = function(i, val){
      if (st.done || st.lock) return;
      st.v[i] = parseInt(val,10) || 0;
      spDraw(); spRead();
    };
    window.spChk = function(){
      if (st.done || st.lock) return;
      var fb = document.getElementById('spFb'); if (!fb) return;
      var g = goal(), m = mean(st.v), rg = rangeOf(st.v);
      var okM = (g.m === undefined) || (Math.abs(m - g.m) < 0.001);
      var okR = (g.r === undefined) || (rg === g.r);
      if (okM && okR){
        fb.innerHTML = '<span class="okmsg">'+T({
          es:'Correcto. Fíjate en la desviación media: cambia junto con el rango porque las dos miden dispersión, aunque la desviación media usa los cinco datos.',
          en:'Correct. Look at the mean deviation: it moves together with the range because both measure spread, although the mean deviation uses all five values.'
        })+'</span>';
        adv(2100); return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.v = solution().slice();
        spDraw(); spRead();
        fb.innerHTML = T({
          es:'Esta configuración cumple la meta. Observa que los valores centrales controlan la media, mientras que el menor y el mayor controlan el rango.',
          en:'This configuration meets the goal. Notice that the middle values control the mean, while the smallest and the largest control the range.'
        });
        adv(3000); return;
      }
      var msg = [];
      if (!okR) msg.push(T({es:'El rango es ',en:'The range is '})+rg+
        (rg < g.r ? T({es:', menor que el objetivo: separa más el valor mayor del menor.',en:', below the target: pull the largest and smallest values further apart.'})
                  : T({es:', mayor que el objetivo: acerca el valor mayor al menor.',en:', above the target: bring the largest and smallest values closer.'})));
      if (!okM) msg.push(T({es:'La media es ',en:'The mean is '})+fmt1(m)+
        (m < g.m ? T({es:', por debajo del objetivo: sube alguno de los valores centrales.',en:', below the target: raise one of the middle values.'})
                 : T({es:', por encima del objetivo: baja alguno de los valores centrales.',en:', above the target: lower one of the middle values.'})));
      fb.textContent = msg.join(' ');
    };
    render();
  })();

  /* ---- MANIPULATIVO 3: simulador de repeticiones ---- */
  (function(){
    var wrap = widget('frecuencia');
    var EVENTS = [
      { es:'lanzar un dado equilibrado y obtener un número mayor que cuatro', en:'rolling a fair die and getting a number greater than four', p:1/3 },
      { es:'lanzar una moneda equilibrada y obtener águila', en:'tossing a fair coin and getting heads', p:1/2 },
      { es:'girar una ruleta de cuatro sectores iguales y caer en el sector azul', en:'spinning a wheel with four equal sectors and landing on the blue one', p:1/4 }
    ];
    var EV = EVENTS[simIdx];
    var resets = 0;
    var srng = seededRng('sim' + simSeed + resets);
    var st = { n:0, k:0, hist:[], tries:0, done:false };

    function run(batch){
      var i;
      for (i=0;i<batch;i++){
        st.n++;
        if (srng() < EV.p) st.k++;
        if (st.n <= 60 || st.n % 5 === 0) st.hist.push([st.n, st.k/st.n]);
      }
    }
    function frDraw(){
      var cv = document.getElementById('frCv'); if (!cv) return;
      var g = fitCv(cv), ctx = g.ctx, w = g.w, h = g.h;
      var x0 = 38, x1 = w - 12, yt = 14, yb = h - 22;
      var col = cssv('--green'), acc = cssv('--gold'), bd = cssv('--border'), sub = cssv('--text3');
      var i, yy, xx;
      ctx.strokeStyle = bd; ctx.lineWidth = 1;
      ctx.fillStyle = sub; ctx.font = '500 10px "IBM Plex Mono", monospace'; ctx.textAlign = 'right';
      for (i=0;i<=4;i++){
        yy = yb - (yb-yt)*i/4;
        ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke();
        ctx.fillText((i/4).toFixed(2), x0-6, yy+3);
      }
      ctx.beginPath(); ctx.moveTo(x0, yt); ctx.lineTo(x0, yb); ctx.stroke();
      var nmax = Math.max(20, st.n);
      ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
      var yp = yb - (yb-yt)*EV.p;
      ctx.beginPath(); ctx.moveTo(x0, yp); ctx.lineTo(x1, yp); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = acc; ctx.textAlign = 'left'; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      ctx.fillText(T({es:'valor teórico ',en:'theoretical value '})+fmt2(EV.p), x0+8, yp-5);
      if (st.hist.length > 1){
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
        for (i=0;i<st.hist.length;i++){
          xx = x0 + (x1-x0)*st.hist[i][0]/nmax;
          yy = yb - (yb-yt)*st.hist[i][1];
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.fillStyle = sub; ctx.textAlign = 'right'; ctx.font = '500 10px "IBM Plex Mono", monospace';
      ctx.fillText('n = '+st.n, x1, yb+16);
    }
    function frRead(){
      var fr = st.n ? st.k/st.n : 0, e;
      e = document.getElementById('frN'); if (e) e.textContent = String(st.n);
      e = document.getElementById('frK'); if (e) e.textContent = String(st.k);
      e = document.getElementById('frF'); if (e) e.textContent = st.n ? fmt3(fr) : '-';
      e = document.getElementById('frStat');
      if (e) e.textContent = st.n === 0
        ? T({es:'Todavía no hay repeticiones registradas.', en:'No repetitions recorded yet.'})
        : T({es:'Distancia de la frecuencia relativa al valor teórico: ', en:'Distance from the relative frequency to the theoretical value: '})+fmt3(Math.abs(fr-EV.p));
    }
    function render(){
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Simulador de repeticiones', en:'Repetition simulator'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Repite el experimento por tandas y observa la trayectoria de la frecuencia relativa frente al valor teórico.',
            en:'Repeat the experiment in batches and watch the path of the relative frequency against the theoretical value.'
          })+'</div>'+
          '<div class="goalbar">'+T({es:'Experimento: ',en:'Experiment: '})+T(EV)+'. '+
            T({es:'Meta: dejar la frecuencia relativa a menos de 0.03 del valor teórico con al menos 200 repeticiones.',
               en:'Goal: leave the relative frequency within 0.03 of the theoretical value using at least 200 repetitions.'})+'</div>'+
          '<canvas class="gcanvas" id="frCv"></canvas>'+
          '<div class="simbtns">'+
            '<button class="simbtn" onclick="frRun(10)">+10</button>'+
            '<button class="simbtn" onclick="frRun(50)">+50</button>'+
            '<button class="simbtn" onclick="frRun(200)">+200</button>'+
            '<button class="simbtn rst" onclick="frReset()">'+T({es:'Reiniciar',en:'Reset'})+'</button>'+
          '</div>'+
          '<div class="readrow">'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Repeticiones',en:'Repetitions'})+'</div><div class="readnum" id="frN">'+st.n+'</div></div>'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Ocurrencias',en:'Occurrences'})+'</div><div class="readnum" id="frK">'+st.k+'</div></div>'+
            '<div class="readcell"><div class="readlbl">'+T({es:'Frec. relativa',en:'Rel. frequency'})+'</div><div class="readnum" id="frF">-</div></div>'+
          '</div>'+
          '<div class="statline" id="frStat"></div>'+
          '<button class="rverify-btn" onclick="frChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="frFb"></div>'+
        '</div>';
      frDraw(); frRead();
      setTimeout(frDraw, 160);
    }
    window.frRun = function(b){
      if (st.done) return;
      run(b); frDraw(); frRead();
    };
    window.frReset = function(){
      if (st.done) return;
      resets++;
      srng = seededRng('sim' + simSeed + resets);
      st.n = 0; st.k = 0; st.hist = []; st.tries = 0;
      frDraw(); frRead();
      var fb = document.getElementById('frFb');
      if (fb) fb.textContent = T({es:'Serie reiniciada. Empieza otra vez con tandas pequeñas y compara la trayectoria.',
                                  en:'Series restarted. Begin again with small batches and compare the path.'});
    };
    window.frChk = function(){
      if (st.done) return;
      var fb = document.getElementById('frFb'); if (!fb) return;
      var fr = st.n ? st.k/st.n : 0, d = Math.abs(fr - EV.p);
      if (st.n >= 200 && d <= 0.03){
        st.done = true;
        fb.innerHTML = '<span class="okmsg">'+T({
          es:'Lograste la meta. Cada repetición sigue siendo impredecible, pero la proporción acumulada ya se movió muy poco en las últimas tandas.',
          en:'Goal reached. Each repetition is still unpredictable, yet the accumulated proportion has barely moved over the last batches.'
        })+'</span>';
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        run(1200); frDraw(); frRead();
        st.done = true;
        fb.innerHTML = T({
          es:'Se agregaron muchas repeticiones de golpe. Con n = '+st.n+' la frecuencia relativa quedó en '+fmt3(st.k/st.n)+', frente al valor teórico '+fmt2(EV.p)+'. Al principio la proporción saltaba entre valores muy distintos: lo que disminuye al crecer n es la variabilidad de la proporción, no la incertidumbre de cada repetición.',
          en:'A large block of repetitions was added at once. With n = '+st.n+' the relative frequency ended at '+fmt3(st.k/st.n)+', against the theoretical value '+fmt2(EV.p)+'. At the start the proportion jumped between very different values: what shrinks as n grows is the variability of the proportion, not the uncertainty of each repetition.'
        });
        return;
      }
      if (st.n < 200){
        fb.textContent = T({es:'Con n = ',en:'With n = '})+st.n+T({
          es:' la proporción todavía salta bastante. Agrega más repeticiones antes de juzgar.',
          en:' the proportion still jumps quite a bit. Add more repetitions before judging.'});
        return;
      }
      fb.textContent = T({es:'Vas bien: con n = ',en:'Getting there: with n = '})+st.n+
        T({es:' la distancia al valor teórico es ',en:' the distance to the theoretical value is '})+fmt3(d)+
        T({es:'. Sigue agregando tandas para reducirla.', en:'. Keep adding batches to bring it down.'});
    };
    render();
  })();

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyjbSUYDHwe-0Hl5GnZC6mP3_iKPYnLqeUgbuhxARkW2-keCAAV6sSg0wYWJnJBhY7lUQ/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
