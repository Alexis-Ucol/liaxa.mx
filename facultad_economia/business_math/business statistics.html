<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descriptive Statistics for Business · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_estadistica_desc.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── DATA TABLE ── */
.dtab { width:100%; border-collapse:collapse; margin:.9rem 0; font-size:.82rem; }
.dtab th { background:var(--surface2); color:var(--text3); font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; font-weight:600; padding:.45rem .6rem; text-align:left; border-bottom:1px solid var(--border); }
.dtab td { padding:.42rem .6rem; border-bottom:1px solid var(--border); color:var(--text2); }
.dtab td.n { font-family:'IBM Plex Mono',monospace; text-align:right; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
  .dtab { font-size: .76rem; }
  .dtab th, .dtab td { padding: .35rem .4rem; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Descriptive Statistics for Business</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Descriptive Statistics for Business</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxSJnnHSGtMSBcK4ggFvfN2DtEdTSK_yn57GA0OgOI1kJqHufnIsr5lOGAJZkQro_8G/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {

function getAttemptKey(name, group) {

}
function nextAttempt(name, group) {

  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}

  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

   NUMBER HELPERS
   ════════════════════════════════════════════════════════════════════════ */
function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function dec1(x)   { return x.toFixed(1); }
function dec2(x)   { return nfD(x, 2); }
/* Percentage with one decimal, identical in both languages. */
function pct1(x)   { return (Math.round(x * 1000) / 10).toFixed(1); }
/* Percentage with two decimals, used for option values. */
function pct2(x)   { return (x * 100).toFixed(2) + '%'; }
function intN(x)   { return nf(Math.round(x)); }
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ── THE MODELS THIS GUIDE RUNS ON ────────────────────────────────────────
   Descriptive statistics is the craft of replacing a list nobody can read
   with three or four numbers a manager can act on: where the data sits,
   how far it spreads, and where any single figure stands among the rest.
   Every routine below is written once and reused by the concepts, by the
   manipulatives and by the graded items, so the guide can never quote a
   figure that disagrees with the picture next to it.                      */
function sum(xs) { var s = 0; for (var i = 0; i < xs.length; i++) s += xs[i]; return s; }
function mean(xs) { return sum(xs) / xs.length; }
function sortedCopy(xs) { return xs.slice().sort(function(a, b) { return a - b; }); }
function median(xs) {
  var s = sortedCopy(xs), n = s.length, h = Math.floor(n / 2);
  return n % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
}
/* The only honest way to average figures that summarise groups of unequal
   size: each group counts as heavily as the number of cases behind it.    */
function weightedMean(vals, wts) {
  var num = 0, den = 0;
  for (var i = 0; i < vals.length; i++) { num += vals[i] * wts[i]; den += wts[i]; }
  return num / den;
}
/* Sum of squared deviations: the raw material of every dispersion measure. */
function ssd(xs) {
  var m = mean(xs), s = 0;
  for (var i = 0; i < xs.length; i++) s += (xs[i] - m) * (xs[i] - m);
  return s;
}
/* n − 1 for a sample, n for a whole population. The divisor is not a piece
   of ceremony: a sample always sits closer to its own mean than to the mean
   of the population it came from, so dividing by n reports less spread than
   the business actually faces.                                            */
function variance(xs, isSample) { return ssd(xs) / (xs.length - (isSample ? 1 : 0)); }
function stdev(xs, isSample) { return Math.sqrt(variance(xs, isSample)); }
function meanAbsDev(xs) {
  var m = mean(xs), s = 0;
  for (var i = 0; i < xs.length; i++) s += Math.abs(xs[i] - m);
  return s / xs.length;
}
/* Spread measured in units of its own mean, which is what finally allows a
   peso figure and a much smaller peso figure to be compared for risk.     */
function cvar(xs) { return stdev(xs, true) / mean(xs); }
/* Position rule used everywhere in this guide: the value that leaves a
   fraction p of the data below it sits at position p(n + 1) of the ordered
   list, and lands between two figures when that position is not whole.    */
function quantileAt(xs, p) {
  var s = sortedCopy(xs), n = s.length, pos = p * (n + 1);
  if (pos <= 1) return s[0];
  if (pos >= n) return s[n - 1];
  var lo = Math.floor(pos), fr = pos - lo;
  return s[lo - 1] + fr * (s[lo] - s[lo - 1]);
}
function q1Of(xs)  { return quantileAt(xs, 0.25); }
function q3Of(xs)  { return quantileAt(xs, 0.75); }
function iqrOf(xs) { return q3Of(xs) - q1Of(xs); }
/* The usual review threshold: a figure beyond one and a half interquartile
   ranges from the box is far enough from the crowd to deserve a look.     */
function upperFence(xs) { return q3Of(xs) + 1.5 * iqrOf(xs); }
function lowerFence(xs) { return q1Of(xs) - 1.5 * iqrOf(xs); }
function outliersOf(xs) {
  var hi = upperFence(xs), lo = lowerFence(xs);
  return xs.filter(function(v) { return v > hi || v < lo; });
}
/* ── grouped data: the table a point of sale system actually hands you ── */
function classMarks(width, k) {
  var m = [];
  for (var i = 0; i < k; i++) m.push(width / 2 + i * width);
  return m;
}
function classLowers(width, k) {
  var l = [];
  for (var i = 0; i < k; i++) l.push(i * width);
  return l;
}
function groupedMean(marks, freqs) { return weightedMean(marks, freqs); }
/* Inside the class that holds the middle case, the median is placed in
   proportion to how far into that class the middle case falls.            */
function groupedMedian(width, freqs) {
  var N = sum(freqs), half = N / 2, cf = 0, i;
  for (i = 0; i < freqs.length; i++) {
    if (cf + freqs[i] >= half) return i * width + (half - cf) / freqs[i] * width;
    cf += freqs[i];
  }
  return (freqs.length - 1) * width;
}
function modalIndex(freqs) {
  var bi = 0;
  for (var i = 1; i < freqs.length; i++) if (freqs[i] > freqs[bi]) bi = i;
  return bi;
}
/* ── the data sets the business scenarios are built from ── */
/* Ten people on five pay steps plus one director: the shape of almost every
   small payroll, and the reason the mean and the median part company.     */
function payrollOf(base, step, top) {
  var xs = [], i;
  for (i = 0; i < 5; i++) { xs.push(base + i * step); xs.push(base + i * step); }
  xs.push(base + top * step);
  return xs;
}
/* Ten routine claims and one large one. */
function claimsOf(base, step, top) {
  var xs = [], i;
  for (i = 0; i < 10; i++) xs.push(base + i * step);
  xs.push(base + top * step);
  return xs;
}
function seriesOf(center, devs, scale) {
  return devs.map(function(d) { return center + d * scale; });
}

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers rendered by fmt, aligned across languages. */
function valOpts(correct, wrongs, fmt, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmt(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.12 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.37);
  return shuffleOpts(vals, vals, rng);
}
function intOpts(correct, wrongs, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v) || v < 1) return;
    var s = intN(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) add(Math.round(correct * (1 + j * 0.13 * (j % 2 ? 1 : -1))));
  return shuffleOpts(vals, vals, rng);
}

  setTimeout(function() {

    });

      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';

      if (pz) pz.style.opacity = '0.4';

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS
   ════════════════════════════════════════════════════════════════════════ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('pp' + idx);
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('pz' + idx).style.opacity = '0.4';
    saveSession();
  };
  reader.readAsDataURL(input.files[0]);
}
function toggleHint(idx) { document.getElementById('hint' + idx).classList.toggle('show'); }
function showResults() {
  /* ── Silent score reporting ── */
  if (SCORE_ENDPOINT) {
    try {
      fetch(SCORE_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          name:      studentData.name,
          group:     studentData.group,
          correct:   correctCount,
          score:     Math.round(correctCount / problems.length * 100),
          timestamp: new Date().toLocaleString('es-MX'),
          guide:     SCHOOL.guideTitle ? (SCHOOL.guideTitle['es'] || SCHOOL.guideTitle['en'] || '') : document.title.split('·')[0].trim()
        })
      });
    } catch(e) {}
  }

  var rb = document.getElementById('s_results');
  if (!rb) return;
  rb.style.display = 'block';
  setTimeout(function() {
    rb.classList.add('vis');
    rb.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 50);
}

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

   SECTION REGISTRY  (concept text is re-rendered on language switch)

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  return P.dark;
}
/* A labelled vertical rule: how every centre and every threshold is named
   on the pictures below. */
function vRule(ctx, P, x, yTop, yBot, color, label, side) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.setLineDash([5, 3]);
  ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBot); ctx.stroke();
  ctx.restore();
  if (!label) return;
  ctx.fillStyle = color; ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  var w = ctx.measureText(label).width;
  ctx.fillText(label, side === 'left' ? x - w - 3 : x + 3, yTop + 8);
}

/* ── DOT PLOT ── every case as one dot, with the two centres drawn on top.
   Dots that land on the same spot stack upward, so the reader sees where
   the crowd is and how far the loner sits from it.                        */
function drawDotPlot(g, values, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  opts = opts || {};
  var padL = 14, padR = 14, padT = 26, padB = 30;
  var s = sortedCopy(values);
  var lo = s[0], hi = s[s.length - 1];
  if (hi - lo < 1) hi = lo + 1;
  var pad = (hi - lo) * 0.10; lo -= pad; hi += pad;
  function X(v) { return padL + (v - lo) / (hi - lo) * (W - padL - padR); }
  var fmt = opts.fmt || intN;
  var baseY = H - padB;

  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, baseY); ctx.lineTo(W - padR, baseY); ctx.stroke();

  var r = 5.2, lastX = -1e9, level = 0;
  for (i = 0; i < s.length; i++) {
    var px = X(s[i]);
    if (px - lastX < r * 2.1) { level++; } else { level = 0; }
    lastX = px;
    var py = baseY - r - 2 - level * (r * 2.1);
    ctx.fillStyle = (typeof opts.flagAbove === 'number' && s[i] > opts.flagAbove) ? P.bad : P.green;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  }
  if (typeof opts.median === 'number') {
    vRule(ctx, P, X(opts.median), padT - 12, baseY, P.dark, opts.medianLabel, 'left');
  }
  if (typeof opts.mean === 'number') {
    vRule(ctx, P, X(opts.mean), padT - 12, baseY, P.gold, opts.meanLabel, 'right');
  }
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [lo + (hi - lo) * 0.02, (lo + hi) / 2, hi - (hi - lo) * 0.02].forEach(function(v) {
    var lab = fmt(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), baseY + 14);
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    ctx.fillText(opts.xLabel, padL, H - 3);
  }
}

/* ── PAIRED STRIPS ── two data sets, one per row, each with the stretch
   that reaches one standard deviation either side of its own mean painted
   behind the dots. Given a common axis the rows compare pesos; given each
   row its own axis they compare variability relative to their own size,
   which is exactly what the coefficient of variation measures.            */
function drawStrips(g, rows, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  opts = opts || {};
  var padL = 16, padR = 16, padT = 14;
  var rowH = (H - padT - 10) / rows.length;
  var shared = opts.shared === true;
  var gLo = null, gHi = null;
  rows.forEach(function(rw) {
    var s = sortedCopy(rw.values);
    if (gLo === null || s[0] < gLo) gLo = s[0];
    if (gHi === null || s[s.length - 1] > gHi) gHi = s[s.length - 1];
  });
  rows.forEach(function(rw, ri) {
    var yTop = padT + ri * rowH, yMid = yTop + rowH * 0.56;
    var s = sortedCopy(rw.values), m = mean(rw.values), sd = stdev(rw.values, true);
    var lo, hi;
    if (shared) { lo = Math.min(0, gLo); hi = gHi; }
    else        { lo = 0; hi = m * 2; }
    if (hi - lo < 1) hi = lo + 1;
    var span = hi - lo;
    lo -= span * 0.04; hi += span * 0.04;
    function X(v) { return padL + (v - lo) / (hi - lo) * (W - padL - padR); }

    ctx.fillStyle = P.text3; ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
    ctx.fillText(rw.label, padL, yTop + 10);

    ctx.save();
    ctx.fillStyle = P.tint;
    var bx = X(m - sd), bw = X(m + sd) - bx;
    ctx.fillRect(bx, yMid - 13, Math.max(2, bw), 26);
    ctx.restore();
    ctx.strokeStyle = P.border; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, yMid); ctx.lineTo(W - padR, yMid); ctx.stroke();

    ctx.fillStyle = P.green;
    for (var i = 0; i < s.length; i++) {
      ctx.beginPath(); ctx.arc(X(s[i]), yMid, 4.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(X(m), yMid - 15); ctx.lineTo(X(m), yMid + 15); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
    var ml = rw.meanLabel || '';
    if (ml) ctx.fillText(ml, Math.min(X(m) + 4, W - padR - ctx.measureText(ml).width), yMid + 25);
    if (rw.note) {
      ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
      var nw = ctx.measureText(rw.note).width;
      ctx.fillText(rw.note, W - padR - nw, yTop + 10);
    }
  });
}

/* ── BOX PLOT ── the box holds the middle half of the data, the whiskers
   reach the furthest figure that is still ordinary, and anything past the
   dashed line is far enough out to be worth a phone call.                 */
function drawBox(g, values, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  opts = opts || {};
  var padL = 16, padR = 16, padT = 30, padB = 32;
  var s = sortedCopy(values);
  var q1 = q1Of(values), q2 = median(values), q3 = q3Of(values);
  var fenceHi = upperFence(values), fenceLo = lowerFence(values);
  var inside = s.filter(function(v) { return v <= fenceHi && v >= fenceLo; });
  var wLo = inside.length ? inside[0] : s[0];
  var wHi = inside.length ? inside[inside.length - 1] : s[s.length - 1];
  var lo = Math.min(s[0], fenceLo), hi = Math.max(s[s.length - 1], fenceHi);
  if (hi - lo < 1) hi = lo + 1;
  var pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  function X(v) { return padL + (v - lo) / (hi - lo) * (W - padL - padR); }
  var fmt = opts.fmt || intN;
  var yMid = (padT + (H - padB)) / 2, boxH = 34;

  /* the middle half, painted first */
  ctx.fillStyle = P.tint;
  ctx.fillRect(X(q1), yMid - boxH / 2, Math.max(2, X(q3) - X(q1)), boxH);
  ctx.strokeStyle = P.dark; ctx.lineWidth = 1.6;
  ctx.strokeRect(X(q1), yMid - boxH / 2, Math.max(2, X(q3) - X(q1)), boxH);
  /* whiskers */
  ctx.beginPath();
  ctx.moveTo(X(wLo), yMid); ctx.lineTo(X(q1), yMid);
  ctx.moveTo(X(q3), yMid); ctx.lineTo(X(wHi), yMid);
  ctx.moveTo(X(wLo), yMid - 10); ctx.lineTo(X(wLo), yMid + 10);
  ctx.moveTo(X(wHi), yMid - 10); ctx.lineTo(X(wHi), yMid + 10);
  ctx.stroke();
  /* the middle figure */
  ctx.strokeStyle = P.green; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(X(q2), yMid - boxH / 2); ctx.lineTo(X(q2), yMid + boxH / 2); ctx.stroke();
  /* the review threshold */
  vRule(ctx, P, X(fenceHi), padT - 16, H - padB, P.gold, opts.fenceLabel, 'left');
  /* anything past it */
  for (i = 0; i < s.length; i++) {
    if (s[i] <= fenceHi && s[i] >= fenceLo) continue;
    ctx.fillStyle = P.bad;
    ctx.beginPath(); ctx.arc(X(s[i]), yMid, 5.4, 0, Math.PI * 2); ctx.fill();
  }
  /* labels under the five figures that define the box */
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [[q1, opts.q1Label], [q2, opts.medLabel], [q3, opts.q3Label]].forEach(function(pr) {
    if (!pr[1]) return;
    var lab = pr[1] + ' ' + fmt(pr[0]), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(pr[0]) - lw / 2), W - lw - 1), H - padB + 20);
  });
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    ctx.fillText(opts.xLabel, padL, H - 4);
  }
}

/* ── HISTOGRAM ── the frequency table drawn as a shape, with the two
   centres marked on the same axis so the direction of the tail can be
   read off rather than guessed.                                          */
function drawHistogram(g, width, freqs, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  opts = opts || {};
  var padL = 34, padR = 12, padT = 26, padB = 30;
  var k = freqs.length, hiF = 0;
  for (i = 0; i < k; i++) if (freqs[i] > hiF) hiF = freqs[i];
  if (hiF <= 0) hiF = 1;
  var lo = 0, hi = k * width;
  function X(v) { return padL + (v - lo) / (hi - lo) * (W - padL - padR); }
  function Y(f) { return (H - padB) - f / (hiF * 1.12) * (H - padT - padB); }
  var fmt = opts.fmt || intN;
  var mi = modalIndex(freqs);

  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 2; i++) {
    var gv = hiF * i / 2;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = intN(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  for (i = 0; i < k; i++) {
    var x0 = X(i * width), x1 = X((i + 1) * width);
    ctx.fillStyle = (i === mi) ? P.gold : P.green;
    ctx.globalAlpha = (i === mi) ? 0.85 : 0.62;
    ctx.fillRect(x0 + 1, Y(freqs[i]), Math.max(2, x1 - x0 - 2), (H - padB) - Y(freqs[i]));
    ctx.globalAlpha = 1;
    ctx.strokeStyle = P.border;
    ctx.strokeRect(x0 + 1, Y(freqs[i]), Math.max(2, x1 - x0 - 2), (H - padB) - Y(freqs[i]));
  }
  if (typeof opts.median === 'number') {

  if (typeof opts.mean === 'number') {

  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [0, Math.floor(k / 2), k].forEach(function(ci) {
    var v = ci * width, lab = fmt(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 14);

  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';

          : 'Two product lines of a distributor, six months of sales each. The dots are the months and the green band covers one standard deviation either side of the mean of that line. Start in the peso mode: the large line looks far more scattered and anyone would call it the unstable one. Now switch to the first mode, where each line is drawn in proportion to its own mean, and watch the impression reverse. That is exactly what the coefficient of variation does, dividing the standard deviation by the mean and leaving spread on a comparable scale. Raise the mean of the small line without touching its spread and you will see its coefficient fall while the standard deviation does not change by a single peso.') + '</div>' +

      { label: nameB, values: B, meanLabel: (es ? 'media ' : 'mean ') + intN(state.mB),
        note: (es ? 'desv ' : 'sd ') + dec2(sB) + '  ·  cv ' + pct2(cB) }
    ], { shared: state.view === 'shared' });

    host.querySelector('#k2read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> la línea mayor vende ' + intN(state.mA) + ' unidades al mes en promedio y se desvía ' + dec2(sA) + ' unidades, lo que equivale al ' + pct2(cA) + ' de su propia media. La menor vende ' + intN(state.mB) + ' y se desvía ' + dec2(sB) + ', el ' + pct2(cB) + ' de la suya. ' +
        (flip
          ? 'Fíjate en lo que acaba de pasar: la línea con la desviación más grande en unidades resulta ser la más predecible en proporción. Las dos medidas ordenan a las líneas al revés, y ninguna de las dos está equivocada porque responden a preguntas distintas. '
          : 'Aquí las dos medidas coinciden en el orden, que es el caso cómodo y también el menos instructivo. Mueve las medias hasta separarlas mucho y verás que dejan de coincidir. ') +
        'Cada medida sirve para una decisión distinta y conviene tenerlo claro antes de citarlas. La desviación estándar está en unidades de venta, así que es la que sirve para dimensionar un inventario de seguridad o una reserva de caja: se necesita saber cuántas unidades pueden faltar, no qué porcentaje. El coeficiente de variación no tiene unidades, y por eso es el único que permite comparar la estabilidad de una línea grande contra una chica, o la de un negocio en pesos contra otro en toneladas. Usar la desviación para comparar productos de tamaños distintos es el error más frecuente de este tema, y siempre castiga al producto más grande.'
      : '<strong>Business reading:</strong> the larger line sells ' + intN(state.mA) + ' units a month on average and deviates by ' + dec2(sA) + ' units, which comes to ' + pct2(cA) + ' of its own mean. The smaller one sells ' + intN(state.mB) + ' and deviates by ' + dec2(sB) + ', or ' + pct2(cB) + ' of its own. ' +
        (flip
          ? 'Notice what just happened: the line with the larger deviation in units turns out to be the more predictable one in proportion. The two measures rank the lines in opposite orders, and neither is wrong, because they answer different questions. '
          : 'Here the two measures agree on the order, which is the comfortable case and also the least instructive one. Pull the two means far apart and you will see them stop agreeing. ') +
        'Each measure serves a different decision and it pays to be clear about that before quoting either. The standard deviation is in units of sales, so it is the one that sizes a safety stock or a cash reserve: what is needed is how many units may be missing, not what percentage. The coefficient of variation carries no units, and so it is the only one that lets the stability of a large line be compared against a small one, or a business measured in pesos against one measured in tonnes. Using the standard deviation to compare products of different sizes is the most common error in this topic, and it always penalises the bigger product.';
  }

/* Five classes whose heights tilt as the slider moves, so the tail can be
   sent to either side without ever producing an empty table. */
function shapeFreqs(skew, scale) {
  var f = [], peak = 2 - skew * 0.42, i;
  for (i = 0; i < 5; i++) {
    var d = i - peak;
    f.push(Math.max(3, Math.round(scale * Math.exp(-d * d / 2.2))));
  }
  return f;
}

        'Conviene fijar el significado de esa diferencia porque es la manera más rápida de leer una distribución sin graficarla: cuando la media supera a la mediana hay pocos importes grandes tirando del promedio hacia arriba, y cuando queda por debajo pasa lo contrario. ' +

      : '<strong>Business reading:</strong> with this table the grouped mean is ' + money2(mu) + ' and the grouped median is ' + money2(md) + ', a difference of ' + money2(gap) + '. The busiest class has its midpoint at ' + money(marks[mi]) + ' and the tail points ' + dir.toLowerCase() + '. ' +

function frac(a, b) {
  return '<span class="mf-outer"><span class="mf-num">' + a + '</span><span class="mf-den">' + b + '</span></span>';

/* A frequency table rendered as a table, which is how a business receives it. */
function freqTable(width, freqs, headEs, headEn, es) {
  var rows = '', i;
  for (i = 0; i < freqs.length; i++) {
    rows += '<tr><td>' + money(i * width) + ' ' + (es ? 'a' : 'to') + ' ' + money((i + 1) * width) + '</td>' +
            '<td class="n">' + intN(width / 2 + i * width) + '</td>' +
            '<td class="n">' + intN(freqs[i]) + '</td></tr>';
  }
  return '<table class="dtab"><thead><tr>' +
    '<th>' + (es ? headEs[0] : headEn[0]) + '</th>' +
    '<th>' + (es ? headEs[1] : headEn[1]) + '</th>' +
    '<th>' + (es ? headEs[2] : headEn[2]) + '</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

      '<p>Un reporte con cuatrocientos renglones no se lee, se resume. La estadística descriptiva es el oficio de sustituir esa lista por unas cuantas cifras que conserven lo que importa para decidir, y la primera de todas responde a la pregunta de dónde se sitúa el conjunto. El problema es que hay tres respuestas distintas a esa pregunta y en español y en inglés las tres se llaman a veces promedio, lo que ha costado más de un malentendido caro en una junta de consejo.</p>' +

      '<p>Dos proveedores prometen entregar en diez días en promedio. Uno entrega siempre entre nueve y once, el otro entrega a veces en dos días y a veces en veinte. El promedio no distingue entre ellos y la operación sí: con el primero se puede firmar un compromiso con el cliente, con el segundo hay que cargar inventario de seguridad. Todo lo que separa a esos dos proveedores vive en la segunda pregunta de la estadística descriptiva, que es cuánto se alejan los datos de su propio centro.</p>' +
      '<p>La respuesta más simple es el <strong>rango</strong>, la distancia entre el dato mayor y el menor. Es fácil de calcular y casi inútil, porque usa exactamente dos datos y descarta todos los demás: un solo caso raro lo dispara. La medida seria parte de otra idea, la de mirar cuánto se aleja del centro cada dato. Como esas distancias suman cero por construcción, hay que quitarles el signo, y elevarlas al cuadrado resulta más manejable que tomar valores absolutos. El promedio de esos cuadrados es la <strong>varianza</strong>, y su raíz cuadrada es la <strong>desviación estándar</strong>, que devuelve la medida a las unidades del negocio y por eso es la que se cita.</p>' +
      '<p>Aquí aparece el detalle que más calificaciones cuesta y que no es una formalidad. Cuando los datos son toda la población que interesa, el promedio de los cuadrados se toma dividiendo entre el número de casos. Cuando son una <strong>muestra</strong> con la que se quiere hablar de algo más grande, se divide entre uno menos. La razón tiene sentido de negocio: una muestra se acomoda alrededor de su propia media, que ya fue calculada con ella misma, así que queda más apretada de lo que estaría alrededor de la media verdadera del mercado. Dividir entre el número de casos reportaría menos variabilidad de la que la empresa realmente enfrenta, y ese sesgo va siempre en la dirección peligrosa.</p>' +
      '<p>Falta un problema práctico. Una desviación de cien unidades es enorme para una línea que vende ciento cincuenta al mes y despreciable para otra que vende diez mil, de modo que la desviación estándar no sirve para comparar productos, sucursales o inversiones de tamaños distintos. El <strong>coeficiente de variación</strong> resuelve eso dividiendo la desviación entre la media: al ser un cociente entre dos cantidades con las mismas unidades, el resultado no tiene unidades y se lee como porcentaje. Es la herramienta estándar para comparar riesgo relativo, y la única condición para usarla es que la media sea positiva y tenga sentido como referencia.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Rango</div><div class="rform">máx − mín</div><div class="rnote">Solo usa dos datos de la lista.</div></div>' +
        '<div class="rcard"><div class="rname">Varianza muestral</div><div class="rform">' + frac('Σ(x − x̄)²', 'n − 1') + '</div><div class="rnote">En unidades al cuadrado.</div></div>' +
        '<div class="rcard"><div class="rname">Desviación estándar</div><div class="rform">√varianza</div><div class="rnote">Regresa a las unidades del negocio.</div></div>' +
        '<div class="rcard"><div class="rname">Coeficiente de variación</div><div class="rform">' + frac('s', 'x̄') + '</div><div class="rnote">Sin unidades, por fin comparable.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una comercializadora revisa seis meses de ventas de dos líneas. La línea mayor vendió ' + c2A.map(intN).join(', ') + ' unidades, y la línea menor vendió ' + c2B.map(intN).join(', ') + '. El área de compras quiere saber cuál de las dos es más difícil de planear.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> La media de la línea mayor es ' + intN(c2mA) + ' unidades y su rango es ' + intN(c2rng) + ' unidades.<br>' +
      '<strong>Paso 2.</strong> Se resta la media a cada mes, se elevan al cuadrado esas seis diferencias y se suman: el total es ' + intN(c2ss) + '.<br>' +
      '<strong>Paso 3.</strong> Como los seis meses son una muestra del comportamiento de la línea, se divide entre cinco y queda una varianza de ' + dec2(c2var) + ' unidades al cuadrado, cuya raíz da una desviación estándar de ' + dec2(c2sA) + ' unidades. Si esos seis meses se tomaran como la población completa, la desviación bajaría a ' + dec2(c2pop) + ', que es la cifra optimista.<br>' +
      '<strong>Paso 4.</strong> La línea menor tiene una desviación de ' + dec2(c2sB) + ' unidades, bastante menor. Pero relativa a su propia media, su coeficiente de variación es ' + pct2(c2cB) + ' contra ' + pct2(c2cA) + ' de la línea mayor.<br>' +
      '<strong>Lectura de negocio.</strong> Las dos medidas contestan preguntas distintas y las dos hacen falta. Para dimensionar el inventario de seguridad manda la desviación en unidades, porque el almacén guarda piezas y no porcentajes: la línea mayor exige más colchón. Para decidir cuál de las dos líneas es más difícil de pronosticar manda el coeficiente, y ahí la línea menor es claramente la inestable. Confundirlas lleva a castigar siempre al producto grande solo por ser grande.</p></div>';
    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Spread: two businesses with the same average and different risk</h2>' +
      '<p>Two suppliers promise delivery in ten days on average. One always delivers between nine and eleven, the other sometimes in two days and sometimes in twenty. The average cannot tell them apart and operations certainly can: with the first a commitment to the customer can be signed, with the second safety stock has to be carried. Everything that separates those two suppliers lives in the second question of descriptive statistics, which is how far the data stray from their own centre.</p>' +
      '<p>The simplest answer is the <strong>range</strong>, the distance from the largest figure to the smallest. It is easy to compute and nearly useless, because it uses exactly two figures and throws away all the rest: a single odd case sends it flying. The serious measure starts from a different idea, looking at how far each figure sits from the centre. Since those distances add to zero by construction, the sign has to go, and squaring them turns out to be more workable than taking absolute values. The average of those squares is the <strong>variance</strong>, and its square root is the <strong>standard deviation</strong>, which brings the measure back into the units of the business and is therefore the one that gets quoted.</p>' +
      '<p>Here comes the detail that costs the most marks, and it is not a formality. When the data are the entire population of interest, the average of the squares is taken by dividing by the number of cases. When they are a <strong>sample</strong> used to say something about something larger, the division is by one less. The reason makes business sense: a sample arranges itself around its own mean, which was computed from that very sample, so it sits tighter than it would around the true mean of the market. Dividing by the number of cases would report less variability than the company actually faces, and that bias always runs in the dangerous direction.</p>' +
      '<p>One practical problem remains. A deviation of a hundred units is enormous for a line selling a hundred and fifty a month and negligible for one selling ten thousand, so the standard deviation cannot compare products, branches or investments of different sizes. The <strong>coefficient of variation</strong> solves that by dividing the deviation by the mean: being a ratio of two quantities carrying the same units, the result has no units at all and reads as a percentage. It is the standard tool for comparing relative risk, and the only condition for using it is that the mean be positive and meaningful as a reference.</p>' +

        '<div class="rcard"><div class="rname">Range</div><div class="rform">max − min</div><div class="rnote">Uses only two figures on the list.</div></div>' +
        '<div class="rcard"><div class="rname">Sample variance</div><div class="rform">' + frac('Σ(x − x̄)²', 'n − 1') + '</div><div class="rnote">In squared units.</div></div>' +

      '<strong>Step 4.</strong> The smaller line has a deviation of ' + dec2(c2sB) + ' units, considerably less. But relative to its own mean, its coefficient of variation is ' + pct2(c2cB) + ' against ' + pct2(c2cA) + ' for the larger line.<br>' +

  addSection(function(L) {

    if (es) return '' +
      '<div class="stag">Concepto 3</div>' +
      '<h2>La posición: dónde cae un dato respecto de todos los demás</h2>' +
      '<p>Las dos primeras preguntas resumen al conjunto. La tercera es de otra naturaleza y es la que más se usa en la operación diaria: dado un dato concreto, qué tan común o qué tan raro es dentro de su grupo. Un tiempo de entrega de dieciocho días no dice nada por sí solo; que sea el peor de cada veinte entregas dice mucho, y esa es una afirmación de posición.</p>' +
      '<p>La herramienta son los <strong>cuantiles</strong>, valores que parten los datos ordenados en pedazos con la misma cantidad de casos. Los <strong>cuartiles</strong> los parten en cuatro: el primero deja una cuarta parte por debajo, el segundo es la mediana y el tercero deja tres cuartas partes por debajo. Los <strong>percentiles</strong> hacen lo mismo con cien pedazos y son el lenguaje de los acuerdos de servicio, donde una promesa se redacta como entregar dentro de cierto plazo en el noventa por ciento de los casos. En esta guía la posición del cuantil se toma como la fracción multiplicada por el número de datos más uno, que es la convención más extendida en los cursos de administración; conviene saber que existen otras y que un mismo conjunto puede dar cuartiles ligeramente distintos según cuál se use.</p>' +
      '<p>La distancia entre el tercer cuartil y el primero se llama <strong>rango intercuartil</strong> y mide el ancho de la mitad central de los datos. Es una medida de dispersión igual que la desviación estándar, pero con una diferencia que decide en qué casos se usa cada una: el rango intercuartil ignora por completo los extremos, así que un dato disparatado no lo mueve. Cuando el diagrama de caja dibuja esos cinco números, la caja es esa mitad central y los bigotes llegan hasta el dato más lejano que todavía se considera ordinario.</p>' +
      '<p>De ahí sale el criterio práctico para señalar <strong>valores atípicos</strong>: se considera atípico un dato que se aleja del borde de la caja más de una vez y media el ancho de la caja. La cifra no es una ley de la naturaleza sino un umbral convencional que funciona bien, y lo importante es entender por qué se construye sobre cuartiles y no sobre la media. Un dato suficientemente grande infla la desviación estándar hasta volverse aceptable para su propio criterio, mientras que los cuartiles no se enteran de su tamaño. Un atípico tampoco es un dato para borrar: es un dato para investigar, y puede resultar el fraude, el error de captura o el mejor cliente del año.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Posición del cuantil</div><div class="rform">p·(n + 1)</div><div class="rnote">Lugar en la lista ordenada.</div></div>' +

        '<div class="rcard"><div class="rname">Los cinco números</div><div class="rform">mín · Q1 · Q2 · Q3 · máx</div><div class="rnote">Lo que dibuja la caja.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una aseguradora pagó once siniestros de automóvil en el mes: diez montos ordinarios que van de ' + money(c3base) + ' a ' + money(c3base + 9 * c3step) + ' de ' + money(c3step) + ' en ' + money(c3step) + ', y uno de ' + money(c3big) + '. Control interno quiere una regla para decidir cuáles pasan a revisión.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Con once montos ordenados, el primer cuartil ocupa el tercer lugar y vale ' + money(c3q1) + ', la mediana ocupa el sexto y vale ' + money(c3q2) + ', y el tercer cuartil ocupa el noveno y vale ' + money(c3q3) + '.<br>' +

      '<strong>Lectura de negocio.</strong> Conviene ver el efecto de ese único monto sobre las cifras que se reportan. La media del mes es ' + money(c3mu) + ', y sin ese siniestro habría sido ' + money(c3muNo) + '. La mediana, en cambio, sería exactamente la misma. Si la aseguradora fija su reserva con la media de un mes con un siniestro excepcional, reserva de más todos los meses siguientes; si la fija con la mediana, ignora un riesgo que sí ocurrió. La salida profesional no es elegir una y callar la otra, es reportar las dos junto con el número de casos señalados.</p></div>';
    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>Position: where one figure falls relative to all the others</h2>' +
      '<p>The first two questions summarise the whole set. The third is of a different nature and is the one most used in daily operations: given one particular figure, how common or how rare is it inside its group. A delivery time of eighteen days says nothing on its own; that it is the worst of every twenty deliveries says a great deal, and that is a statement about position.</p>' +
      '<p>The tools are <strong>quantiles</strong>, values that cut the ordered data into pieces holding the same number of cases. <strong>Quartiles</strong> cut it into four: the first leaves a quarter below it, the second is the median, and the third leaves three quarters below. <strong>Percentiles</strong> do the same with a hundred pieces and are the language of service level agreements, where a promise is written as delivering within a given time in ninety percent of cases. In this guide the position of a quantile is taken as the fraction multiplied by the number of figures plus one, which is the convention most common in management courses; it is worth knowing that others exist and that the same data set can yield slightly different quartiles depending on which is used.</p>' +

      '<p>Hasta aquí se ha supuesto que se tiene la lista completa de datos. En la práctica casi nunca ocurre: lo que un sistema entrega es una <strong>tabla de frecuencias</strong>, es decir cuántos casos cayeron en cada rango. Trabajar con esa tabla exige un supuesto explícito, y conviene enunciarlo en voz alta porque después se olvida. Cada rango se representa por su <strong>marca de clase</strong>, el punto medio entre sus dos límites, como si todos los casos de ese rango valieran eso. Es tanto como suponer que dentro del rango los datos se reparten de manera pareja.</p>' +

/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.questionText;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {

}
