<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Géneros Literarios como Propuesta de Solución Comunitaria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Géneros Literarios como Propuesta de Solución Comunitaria</div>
    <div class="wcourse" id="wcourse-el">Español · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Géneros Literarios como Propuesta de Solución Comunitaria</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a3a6b', primaryDark:'#0f2444', primaryBg:'#e8edf5',
  accent:'#c9a84c', accentBg:'#f7f1e3',
  darkPrimary:'#4a78bf', darkPrimaryDark:'#7aa2e0', darkPrimaryBg:'#0e1f38',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

function getAttemptKey(name, group){ return 'esp3_t08_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }

function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'esp3_t08_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'esp3_t08_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });

      });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB

  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;

    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp3_t08_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

  /* ───────── indexado y render de los textos ───────── */
  function indexText(tx) {
    tx.figs = [];
    tx.paras.forEach(function (p) {
      p.forEach(function (ch) {
        if (ch.r) { ch.k = tx.figs.length; tx.figs.push(ch); }
      });
    });
  }
  indexText(C.poema);
  indexText(C.micro);
  indexText(C.escena);

  function textHTML(tx, mode, marks, tapfn) {
    return tx.paras.map(function (p) {
      return '<span class="dpara">' + p.map(function (ch) {
        var txt = L(ch);
        if (!ch.r) return txt;
        if (mode === 'hunt') {
          return '<span class="xchip' + ((marks && marks[ch.k]) ? marks[ch.k] : '') + '" onclick="' + tapfn + '(' + ch.k + ')">' + txt + '</span>';
        }
        return '<span class="xmark">' + txt + '</span>';
      }).join('') + '</span>';
    }).join('');
  }
  function textBlock(tx, label, scene) {
    return '<div class="dtext' + (scene ? ' dscene' : '') + '"><div class="dtitle">' + label + ' · ' + L(tx.title) + ' · ' + L(tx.meta) + '</div>' +
           textHTML(tx, 'plain', null, '') + '</div>';
  }
  function figOf(tx, key) {
    var i;
    for (i = 0; i < tx.figs.length; i++) { if (tx.figs[i].r === key) return tx.figs[i]; }
    return tx.figs[0];
  }
  function otherFigs(tx, key, n) {
    var all = shuffle(tx.figs, rng), out = [], i;
    for (i = 0; i < all.length && out.length < n; i++) { if (all[i].r !== key) out.push(all[i]); }
    return out;
  }
  function otherEstrat(key, n) {
    var ks = shuffle(EKEYS, rng), out = [], i;
    for (i = 0; i < ks.length && out.length < n; i++) { if (ks[i] !== key) out.push(ESTRAT[ks[i]].n); }
    return out;
  }
  function otherGen(key, n) {
    var ks = shuffle(GKEYS, rng), out = [], i;
    for (i = 0; i < ks.length && out.length < n; i++) { if (ks[i] !== key) out.push(GENEROS[ks[i]].n); }
    return out;
  }
  function proseTx() { return (rng() < 0.5) ? C.poema : C.micro; }

  /* ═════════ WIDGET 1 · mesa de géneros ═════════ */
  function widgetGeneros() {

      .concat(shuffle(C.micro.figs, rng).slice(0, 2).map(function (f) { return { es:f.es, en:f.en, g:'narrativo' }; }))
      .concat(shuffle(C.escena.figs.filter(function (f) { return f.r !== 'imagen_sensorial'; }), rng)
        .map(function (f) { return { es:f.es, en:f.en, g:'dramatico' }; }))
      .concat(shuffle(C.ensayo, rng).slice(0, 2).map(function (e) { return { es:e.es, en:e.en, g:'ensayistico' }; }));
    var items = shuffle(pool, rng).slice(0, 6);
    var st = { i:0, tries:0, hits:0, done:false };
    var w = widgetBox('wGeneros', 'classify');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Mesa de géneros', 'Genre table') + '</div>' +
          '<div class="iw-sub">' + T('Repartiste las seis fichas de esta ronda.', 'You dealt out the six cards of this round.') + '</div>' +
          '<div class="iw-fb"><span class="iw-ok">' + st.hits + ' / ' + items.length +
          T(' a la primera.', ' on the first try.') + '</span></div>';
        return;
      }
      w.innerHTML =
        '<div class="iw-tag">' + T('Mesa de géneros', 'Genre table') + '</div>' +
        '<div class="iw-sub">' + T('Cada ficha salió de una de las páginas del expediente. Decide de qué género viene.',
                                   'Each card came out of one of the pages of the file. Decide which genre it comes from.') + '</div>' +
        '<div class="iw-prog">' + (st.i + 1) + ' / ' + items.length + '</div>' +
        '<div class="clscard">' + Q(items[st.i]) + '</div>' +
        '<div class="binrow">' + GKEYS.map(function (k, bi) {
          return '<button class="binbtn" onclick="gnPick(' + bi + ')">' + L(GENEROS[k].n) + '</button>';
        }).join('') + '</div>' +
        '<div class="iw-fb" id="gnFb">' + (fb || '') + '</div>';
    }
    window.gnPick = function (bi) {
      if (st.done) return;
      var it = items[st.i], key = GKEYS[bi];
      if (key === it.g) {
        if (st.tries === 0) st.hits++;
        st.tries = 0; st.i++;
        if (st.i >= items.length) { st.done = true; paint(''); return; }
        paint('<span class="iw-ok">' + T('Correcto: un texto ', 'Correct: a ') + L(GENEROS[it.g].n).toLowerCase() +
              T(' ', ' ') + L(GENEROS[it.g].d) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var sol = T('Venía del género ', 'It came from the ') + L(GENEROS[it.g].n).toLowerCase() +
                  T(', que ', ' genre, which ') + L(GENEROS[it.g].d) + '.';
        st.tries = 0; st.i++;
        if (st.i >= items.length) { st.done = true; paint(''); return; }
        paint(sol);
        return;
      }
      document.getElementById('gnFb').textContent =
        T('Todavía no. Un texto ', 'Not yet. A ') + L(GENEROS[key].n).toLowerCase() + T(' ', ' ') + L(GENEROS[key].d) +
        T(', y esta ficha no hace eso. Fíjate en quién habla y en qué forma tiene la línea.',
          ', and this card does not do that. Look at who is speaking and at the shape of the line.');
    };
    paint('');
  }

  /* ═════════ WIDGET 2 · rastreo de estrategias ═════════ */
  function widgetRastreo() {
    var TX = proseTx();
    var order = shuffle(TX.figs, rng).slice(0, 3);
    var st = { r:0, tries:0, marks:{}, done:false };
    var w = widgetBox('wRastreo', 'hunt');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Rastreo de estrategias', 'Strategy hunt') + '</div>' +
          '<div class="iw-sub">' + T('Recorriste las tres marcas de esta ronda dentro del texto.',
                                     'You worked through the three marks of this round inside the text.') + '</div>' +
          '<div class="iw-fb">' + (fb || '') + '</div>';
        return;
      }
      var tp = ESTRAT[order[st.r].r];
      w.innerHTML =
        '<div class="iw-tag">' + T('Rastreo de estrategias', 'Strategy hunt') + '</div>' +
        '<div class="iw-sub">' + T('En este texto hay fragmentos subrayados. Toca aquel en el que quien escribe ',
                                   'This text has underlined fragments. Tap the one where the writer ') + L(tp.d) + '.</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + order.length + '</div>' +
        '<div class="dtext"><div class="dtitle">' + L(TX.title) + '</div>' + textHTML(TX, 'hunt', st.marks, 'rsTap') + '</div>' +
        '<div class="iw-fb" id="rsFb">' + (fb || '') + '</div>';
    }
    function advance(fb) {
      st.r++; st.tries = 0; st.marks = {};
      if (st.r >= order.length) st.done = true;
      if (st.done) { paint(''); return; }
      st.locked = true;
      var _fe = document.getElementById('viFb');
      if (_fe) _fe.innerHTML = (fb || '') + '<br><button onclick="viSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.binbtn');
      if (_bs) _bs.forEach(function(b){ b.style.opacity='0.35'; b.style.pointerEvents='none'; });
    }
    window.rsTap = function (k) {
      if (st.done) return;
      var want = order[st.r], got = TX.figs[k];
      if (k === want.k) {
        st.marks[k] = ' hit';
        advance('<span class="iw-ok">' + Q(want) + ': ' + L(want.eff) + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.marks[want.k] = ' rev';
        advance(T('El fragmento que buscabas era ', 'The fragment you were after was ') + Q(want) + ': ' + L(want.eff));
        return;
      }
      st.marks[k] = ' miss';
      paint(T('Ese fragmento ', 'That fragment ') + L(ESTRAT[got.r].d) +
            T('. Busca el que ', '. Look for the one where the writer ') + L(ESTRAT[want.r].d) + '.');
      st.marks[k] = '';
    };
    paint('');
  }

  /* ═════════ WIDGET 3 · del fragmento al efecto ═════════ */
  function widgetEfecto() {
    var use = shuffle(C.poema.figs, rng).slice(0, 2)
      .concat(shuffle(C.micro.figs, rng).slice(0, 1))
      .concat(shuffle(C.escena.figs, rng).slice(0, 1));
    var lo = perm(use.length), ro = perm(use.length);
    while (ro.every(function (v, k) { return v === lo[k]; })) { ro.push(ro.shift()); }
    var st = { sel:null, done:{}, tries:0, over:false };
    var w = widgetBox('wEfecto', 'match');

    function paint(fb) {
      var left = lo.map(function (i) {
        var cls = 'mtchip' + (st.done[i] ? ' done' : (st.sel === i ? ' sel' : ''));
        return '<button class="' + cls + '" onclick="efLeft(' + i + ')">' + Q(use[i]) + '</button>';
      }).join('');
      var right = ro.map(function (i) {
        return '<button class="mtchip' + (st.done[i] ? ' done' : '') + '" onclick="efRight(' + i + ')">' + L(use[i].eff) + '</button>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('Del fragmento al efecto', 'From fragment to effect') + '</div>' +
        '<div class="iw-sub">' + T('Toca un fragmento y después lo que produce en quien lo recibe. Una estrategia no se reconoce por su nombre: se reconoce por el trabajo que hace.',
                                   'Tap a fragment and then what it produces in whoever receives it. A strategy is not recognised by its name: it is recognised by the work it does.') + '</div>' +
        '<div class="mtcols">' +
          '<div><div class="mthead">' + T('Fragmento', 'Fragment') + '</div>' + left + '</div>' +
          '<div><div class="mthead">' + T('Lo que produce', 'What it produces') + '</div>' + right + '</div>' +
        '</div>' +
        '<div class="iw-fb" id="efFb">' + (fb || '') + '</div>';
    }
    function allDone() {
      var i;
      for (i = 0; i < use.length; i++) { if (!st.done[i]) return false; }
      return true;
    }
    window.efLeft = function (i) {
      if (st.over || st.done[i]) return;
      st.sel = (st.sel === i) ? null : i;
      paint('');
    };
    window.efRight = function (i) {
      if (st.over || st.done[i]) return;
      if (st.sel === null) { paint(T('Elige primero un fragmento de la columna izquierda.', 'Choose a fragment from the left column first.')); return; }
      if (st.sel === i) {
        st.done[i] = true; st.sel = null; st.tries = 0;
        if (allDone()) {
          st.over = true;
          paint('<span class="iw-ok">' + T('Las cuatro parejas quedaron completas: cada estrategia deja una huella distinta en quien recibe la propuesta.',
                                           'All four pairs are complete: each strategy leaves a different trace on whoever receives the proposal.') + '</span>');
          return;
        }
        paint('<span class="iw-ok">' + T('Pareja correcta. Ahí quien escribe ', 'Correct pair. There the writer ') + L(ESTRAT[use[i].r].d) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var k;
        for (k = 0; k < use.length; k++) { st.done[k] = true; }
        st.over = true; st.sel = null;
        paint(T('Estas son las parejas correctas. Fíjate en que el efecto siempre dice, con otras palabras, el trabajo que hace el fragmento.',
                'These are the correct pairs. Notice how the effect always says, in other words, the work the fragment does.'));
        return;
      }
      var mine = st.sel;
      st.sel = null;
      paint(T('Ese efecto pertenece a otro fragmento. En el que elegiste, quien escribe ', 'That effect belongs to a different fragment. In the one you chose, the writer ') +
            L(ESTRAT[use[mine].r].d) + T('; busca el efecto que diga eso mismo.', '; look for the effect that says exactly that.'));
    };
    paint('');
  }

  /* ═════════ WIDGET 4 · secuencia del relato ═════════ */
  function widgetSecuencia() {
    var st = { order: perm(C.sec.length), sel:null, tries:0, done:false };
    var w = widgetBox('wSecuencia', 'timeline');

    function paint(fb) {
      var chips = st.order.map(function (ei, pos) {
        var cls = 'tchip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' lock' : '');
        return '<div class="' + cls + '" onclick="sqTap(' + pos + ')"><span class="tnum">' + (pos + 1) + '</span> ' + L(C.sec[ei]) + '</div>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('Secuencia del relato', 'Story sequence') + '</div>' +
        '<div class="iw-sub">' + T('Estas son las escenas de ', 'These are the scenes of ') + Q(C.micro.title) +
          T(', revueltas. Ponlas en el orden en el que cada una hace posible la siguiente. Toca dos tarjetas para intercambiarlas.',
            ', shuffled. Put them in the order in which each one makes the next possible. Tap two cards to swap them.') + '</div>' +
        '<div class="tlist">' + chips + '</div>' +
        '<button class="iwbtn" onclick="sqCheck()">' + T('Comprobar', 'Check') + '</button>' +
        '<div class="iw-fb" id="sqFb">' + (fb || '') + '</div>';
    }
    window.sqTap = function (pos) {
      if (st.done) return;
      if (st.sel === null) st.sel = pos;
      else if (st.sel === pos) st.sel = null;
      else { var t = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t; st.sel = null; }
      paint('');
    };
    window.sqCheck = function () {
      if (st.done) return;
      var ok = st.order.every(function (ei, pos) { return ei === pos; });
      if (ok) {
        st.done = true;
        paint('<span class="iw-ok">' + T('Ese es el orden. El relato podía elegir cualquier otro, y si eligió este es porque cada escena vuelve creíble la que sigue.',
                                         'That is the order. The story could have chosen any other, and if it chose this one it is because each scene makes the next believable.') + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.order = C.sec.map(function (_, i) { return i; });
        st.done = true;
        paint(T('Este es el orden correcto. Observa que la última tarjeta no resuelve nada: el relato se detiene justo ahí.',
                'This is the correct order. Notice that the last card resolves nothing: the story stops exactly there.'));
        return;
      }
      var bad = 0, i;
      for (i = 0; i < st.order.length; i++) { if (st.order[i] !== i) { bad = i; break; } }
      paint(T('Todavía no. Revisa la tarjeta número ', 'Not yet. Look at card number ') + (bad + 1) +
            T(': ¿pudo ocurrir antes de la que está encima de ella?', ': could it have happened before the one above it?'));
    };
    paint('');
  }

  function widgetConsola() {
    var ronda = shuffle(SITUACIONES, rng).slice(0, 3);
    var st = { r:0, g:null, e:null, d:null, tries:0, done:false, ajuste:'· · ·' };
    var w = widgetBox('wConsola', 'console');

    function nom(dim) {
      if (dim === 'g') return st.g ? L(GENEROS[st.g].n) : T('género', 'genre');
      if (dim === 'e') return st.e ? L(ESTRAT[st.e].n).toLowerCase() : T('estrategia', 'strategy');
      return (st.d === null) ? T('destinatario', 'audience') : L(DEST[st.d]).toLowerCase();
    }
    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Consola de la propuesta', 'Proposal console') + '</div>' +
          '<div class="iw-sub">' + T('Armaste una ficha para cada una de las tres situaciones de esta ronda.',
                                     'You built a card for each of the three situations of this round.') + '</div>' +
          '<div class="iw-fb">' + (fb || '') + '</div>';
        return;
      }
      var S = ronda[st.r];
      w.innerHTML =
        '<div class="iw-tag">' + T('Consola de la propuesta', 'Proposal console') + '</div>' +
        '<div class="iw-sub">' + T('Arma la ficha de la propuesta para esta situación y después compruébala. Puedes cambiar cualquier pieza las veces que quieras antes de comprobar.',
                                   'Build the proposal card for this situation and then check it. You can change any piece as often as you like before checking.') + '</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + ronda.length + '</div>' +
        '<div class="cnsit">' + L(S.s) + '</div>' +
        '<div class="cnlbl">' + T('Género', 'Genre') + '</div>' +
        '<div class="binrow">' + GKEYS.map(function (k) {
          return '<button class="binbtn' + (st.g === k ? ' on' : '') + '" onclick="cnPick(\'g\',\'' + k + '\')">' + L(GENEROS[k].n) + '</button>';
        }).join('') + '</div>' +
        '<div class="cnlbl">' + T('Estrategia creativa', 'Creative strategy') + '</div>' +
        '<div class="binrow">' + EKEYS.map(function (k) {
          return '<button class="binbtn' + (st.e === k ? ' on' : '') + '" onclick="cnPick(\'e\',\'' + k + '\')">' + L(ESTRAT[k].n) + '</button>';
        }).join('') + '</div>' +
        '<div class="cnlbl">' + T('Destinatario', 'Audience') + '</div>' +
        '<div class="binrow">' + DEST.map(function (o, di) {
          return '<button class="binbtn' + (st.d === di ? ' on' : '') + '" onclick="cnPick(\'d\',' + di + ')">' + L(o) + '</button>';
        }).join('') + '</div>' +
        '<div class="cnficha">' + T('Escribiría un texto ', 'I would write a ') + '<b>' + nom('g') + '</b>' +
          T(' con ', ' text using ') + '<b>' + nom('e') + '</b>' + T(', dirigido a ', ', addressed to ') + '<b>' + nom('d') + '</b>.</div>' +
        '<div class="cnout">' +
          '<div class="cnocell"><div class="cnolbl">' + T('Piezas elegidas', 'Pieces chosen') + '</div><div class="cnoval">' +
            ((st.g ? 1 : 0) + (st.e ? 1 : 0) + (st.d !== null ? 1 : 0)) + ' / 3</div></div>' +
          '<div class="cnocell"><div class="cnolbl">' + T('Ajuste con la situación', 'Fit with the situation') + '</div><div class="cnoval" id="cnAj">' + st.ajuste + '</div></div>' +
        '</div>' +
        '<button class="iwbtn" onclick="cnCheck()">' + T('Comprobar', 'Check') + '</button>' +
        '<div class="iw-fb" id="cnFb">' + (fb || '') + '</div>';
    }
    function nextRound(fb) {
      st.r++; st.g = null; st.e = null; st.d = null; st.tries = 0; st.ajuste = '· · ·';
      if (st.r >= ronda.length) st.done = true;
      if (st.done) { paint(''); return; }
      st.locked = true;
      var _fe = document.getElementById('lbFb');
      if (_fe) _fe.innerHTML = (fb || '') + '<br><button onclick="lbSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.binbtn');
      if (_bs) _bs.forEach(function(b){ b.style.opacity='0.35'; b.style.pointerEvents='none'; });
    }
    window.cnPick = function (dim, val) {
      if (st.done) return;
      st[dim] = (st[dim] === val) ? null : val;
      st.ajuste = '· · ·';
      paint('');
    };
    window.cnCheck = function () {
      if (st.done) return;
      var S = ronda[st.r];
      if (!st.g || !st.e || st.d === null) { paint(T('Falta una pieza de la ficha. Elige género, estrategia y destinatario antes de comprobar.',
                                                     'A piece of the card is missing. Choose genre, strategy and audience before checking.')); return; }
      var okG = (st.g === S.g), okE = (st.e === S.e), okD = (st.d === S.d);
      var n = (okG ? 1 : 0) + (okE ? 1 : 0) + (okD ? 1 : 0);
      if (n === 3) {
        st.ajuste = T('Adecuada', 'Fits');
        nextRound('<span class="iw-ok">' + L(S.why) + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.g = S.g; st.e = S.e; st.d = S.d; st.ajuste = T('Adecuada', 'Fits');
        var sol = T('La ficha que pedía esta situación era: ', 'The card this situation called for was: ') +
          L(GENEROS[S.g].n).toLowerCase() + T(', con ', ', with ') + L(ESTRAT[S.e].n).toLowerCase() +
          T(', para ', ', for ') + L(DEST[S.d]).toLowerCase() + '. ' + L(S.why);
        nextRound(sol);
        return;
      }
      st.ajuste = n + ' / 3';
      var pista;
      if (!okG) {
        pista = T('El género que elegiste sirve sobre todo para ', 'The genre you chose is mainly good for ') + L(GENEROS[st.g].s) +
                T(', y no es eso lo que aquí tiene que ocurrir. Relee la situación y pregúntate qué necesita hacer el texto.',
                  ', and that is not what has to happen here. Read the situation again and ask what the text needs to do.');
      } else if (!okE) {
        pista = T('La estrategia que elegiste ', 'The strategy you chose ') + L(ESTRAT[st.e].d) +
                T(', y esta situación pide otro trabajo. El género ya está bien elegido.',
                  ', and this situation asks for a different job. The genre is already the right one.');
      } else {
        pista = T('El género y la estrategia ya están bien. Pregúntate quién tiene que quedar cambiado cuando termine la lectura: ese es el destinatario.',
                  'The genre and the strategy are already right. Ask yourself who has to be left changed when the reading ends: that is the audience.');
      }
      paint(pista);
    };
    paint('');
  }

  /* ═════════ constructor de tarjetas ═════════ */
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: false,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

  /* ═════════ banco de preguntas ═════════ */

  function q1() {

                en:'For each line ask who is speaking and in what shape: whether there is an I that feels in verse, a narrator telling what happened to someone, a character answering another, or someone holding up an idea with reasons.' },
        exp: { es:'La línea correcta viene de un texto que ' + L(GENEROS[gk].d) + '. Las otras tres salieron de las otras páginas del mismo expediente, y las cuatro hablan del mismo problema con formas distintas.',
               en:'The correct line comes from a text that ' + L(GENEROS[gk].d) + '. The other three came from the other pages of the same file, and all four speak about the same problem in different shapes.' },

           en:'The text ' + Q(C.escena.title) + ' tells a conflict between two neighbours, just as a story might tell it. Determine which feature makes it belong to the dramatic genre and not the narrative one.' },

              en:'Look for who is handing the information to the reader. In one genre that voice exists and picks what is seen; in the other there is nobody between the characters and the audience.' },
      exp: { es:'Ni el conflicto entre dos personas, ni los nombres propios, ni la lectura en voz alta separan a los dos géneros: un relato admite las tres cosas. Lo que separa a la escena es que no hay narrador: la información llega solo por los parlamentos y las acotaciones.',
             en:'Neither the conflict between two people, nor the proper names, nor reading aloud tells the two genres apart: a story allows all three. What sets the scene apart is that there is no narrator: the information arrives only through the speeches and the stage directions.' },

               en:'There the writer ' + L(ESTRAT[f.r].d) + ', and that is why it is called ' + L(ESTRAT[f.r].n).toLowerCase() + '. Its effect on whoever receives the proposal is that it ' + L(f.eff) + '.' },

        hint: { es:'Comprueba primero qué tendría que aparecer en la línea para que la anotación fuera cierta, y solo después mira qué es lo que la línea hace en realidad.',
                en:'First check what would have to appear in the line for the note to be true, and only then look at what the line actually does.' },
        exp: { es:'La anotación no se sostiene: ' + L(ESTRAT[wrong].n).toLowerCase() + ' es cuando quien escribe ' + L(ESTRAT[wrong].d) + ', y aquí no ocurre nada de eso. En esta línea quien escribe ' + L(ESTRAT[f.r].d) + ', y su efecto es que ' + L(f.eff) + '.',
               en:'The note does not hold up: ' + L(ESTRAT[wrong].n).toLowerCase() + ' is when the writer ' + L(ESTRAT[wrong].d) + ', and none of that happens here. In this line the writer ' + L(ESTRAT[f.r].d) + ', and its effect is that it ' + L(f.eff) + '.' },
        options: [ESTRAT[f.r].why].concat(GEN.errD),
        correct: ESTRAT[f.r].why
      };
    }
    return {
      title: { es:'Una clasificación equivocada', en:'A mistaken classification' },
      q: { es:'Al ordenar el expediente, alguien colocó ' + Q(C.micro.title) + ' entre las páginas argumentativas, porque el texto menciona cifras. Determina por qué esa clasificación es incorrecta.',
           en:'While sorting the file, someone placed ' + Q(C.micro.title) + ' among the argumentative pages, because the text mentions figures. Determine why that classification is wrong.' },
      hint: { es:'Un dato no decide el género. Fíjate en qué está haciendo el texto con ese dato: si lo usa para sostener una idea o si lo usa dentro de algo que le va ocurriendo a alguien.',
              en:'A figure does not decide the genre. Look at what the text is doing with that figure: whether it uses it to hold up an idea or inside something that is happening to someone.' },
      exp: { es:'Las cifras pueden aparecer en cualquier género y no lo cambian. Ese texto las pone dentro de lo que le va pasando a un personaje y avanza con él en el tiempo, y eso lo vuelve narrativo. Un texto argumentativo no cuenta lo que le pasa a nadie: expone una idea y la defiende con razones.',
             en:'Figures can appear in any genre and do not change it. That text places them inside what is happening to a character and moves forward in time with them, and that makes it narrative. An argumentative text tells nothing that happens to anyone: it sets out an idea and defends it with reasons.' },
      options: [GEN.clasErr.c].concat(GEN.clasErr.d),
      correct: GEN.clasErr.c
    };
  }

  function q6() {

    if (rng() < 0.5) {
      return {
        title: { es:'La página que no es literaria', en:'The page that is not literary' },
        q: { es:'Además de los tres textos literarios, el expediente de ' + L(C.lugar) + ' incluye esta página: ' + Q(e) + '. Determina qué hace ese texto que ninguno de los tres literarios hace.',
             en:'Besides the three literary texts, the file on ' + L(C.lugar) + ' includes this page: ' + Q(e) + '. Determine what that text does that none of the three literary ones does.' },
        hint: { es:'Pregúntate qué se le puede hacer a cada texto para rebatirlo: a uno se le contesta con otra razón o con otro dato, y a los otros no hay nada que contestarles de esa manera.',
                en:'Ask what can be done to each text in order to refute it: one can be answered with another reason or another figure, and the others cannot be answered that way at all.' },
        exp: { es:'Los tres textos literarios trabajan sobre lo que quien lee ve y siente, y por eso no se les puede llevar la contraria dato por dato. Esta página sí: afirma algo, lo apoya en razones verificables y queda abierta a que alguien las revise. Los cuatro textos son útiles, pero no para lo mismo.',
               en:'The three literary texts work on what the reader sees and feels, which is why they cannot be contradicted figure by figure. This page can: it states something, backs it with checkable reasons and stays open to being reviewed. All four texts are useful, but not for the same thing.' },
        options: [GEN.arg.c].concat(GEN.arg.d),
        correct: GEN.arg.c
      };

    return {
      title: { es:'Qué poner al frente', en:'What to put at the front' },

           en:'The complete file on ' + L(C.lugar) + ' is going to be handed in at the desk where the year’s works budget is decided. Determine which page should go at the front and why.' },
      hint: { es:'La elección no depende de qué texto es mejor, sino de quién lo va a recibir y con qué criterios está obligado a decidir.',
              en:'The choice does not depend on which text is better, but on who is going to receive it and by which criteria they are obliged to decide.' },
      exp: { es:'Ningún género es superior a otro: cada uno sirve para un destinatario. En una ventanilla se decide comparando razones y costos, de modo que ahí manda la página argumentativa. Los textos literarios acompañan al expediente y hacen su trabajo con los vecinos, que son quienes tienen que sostener la propuesta.',
             en:'No genre is superior to another: each serves a different audience. At a public desk decisions are made by comparing reasons and costs, so the argumentative page leads there. The literary texts go with the file and do their work on the neighbours, who are the ones who have to keep the proposal alive.' },
      options: [GEN.vent.c].concat(GEN.vent.d),
      correct: GEN.vent.c
    };
  }

  function q7() {
    var f = figOf(C.escena, 'dialogo_confrontado');
    if (rng() < 0.5) {
      return {
        title: { es:'La razón del que se opone', en:'The objector’s reason' },
        q: { es:'En ' + Q(C.escena.title) + ', quien se opone dice: ' + Q(f) + '. Determina para qué le dio quien escribe una razón tan sólida a ese personaje.',
             en:'In ' + Q(C.escena.title) + ', the one who objects says: ' + Q(f) + '. Determine why the writer gave that character such a solid reason.' },
        hint: { es:'La escena no se representa ante un público cualquiera: se representa ante la asamblea donde están, sentados, quienes piensan igual que ese personaje.',
                en:'The scene is not staged before just any audience: it is staged before the assembly where the people who think like that character are sitting.' },
        exp: { es:'Una objeción débil se derriba en un segundo, y quien la sostiene en la vida real se levanta y se va. Al darle su mejor argumento, la escena consigue que esas personas se reconozcan y se queden, que es la única condición para que escuchen lo que sigue.',
               en:'A weak objection is knocked down in a second, and whoever really holds it stands up and leaves. By giving it their best argument, the scene gets those people to recognise themselves and stay, which is the only condition for them to hear what comes next.' },
        options: [GEN.razon.c].concat(GEN.razon.d),
        correct: GEN.razon.c
      };
    }
    return {
      title: { es:'Si el personaje se callara', en:'If the character said nothing' },
      q: { es:'Alguien propone corregir ' + Q(C.escena.title) + ' para que el personaje que se opone diga solamente «no estoy de acuerdo» y se quede callado el resto de la escena. Determina qué le pasaría a la propuesta.',
           en:'Someone proposes correcting ' + Q(C.escena.title) + ' so that the character who objects says only “I do not agree” and stays silent for the rest of the scene. Determine what would happen to the proposal.' },
      hint: { es:'Recuerda ante quién se representa la escena y qué tiene que ocurrirle a esa parte del público para que la asamblea sirva de algo.',
              en:'Remember who the scene is staged for and what has to happen to that part of the audience for the assembly to be of any use.' },
      exp: { es:'La escena parecería más fácil de ganar, pero dejaría de hacer su trabajo. Si la objeción real no suena en el escenario, quienes la sostienen no se ven representados, se sienten retratados como necios y se marchan de la discusión con su objeción intacta.',
             en:'The scene would look easier to win, but it would stop doing its job. If the real objection never sounds on stage, those who hold it do not see themselves represented, they feel painted as stubborn and they leave the discussion with their objection intact.' },
      options: [GEN.mudo.c].concat(GEN.mudo.d),
      correct: GEN.mudo.c
    };
  }

  function q8() {
    var TX = proseTx();
    var f = figOf(TX, 'final_abierto');
    if (rng() < 0.5) {
      var op = [f.eff].concat(otherFigs(TX, 'final_abierto', 3).map(function (o) { return o.eff; }));
      return {
        title: { es:'Terminar sin resolver', en:'Ending without resolving' },
        q: { es:Q(TX.title) + ' termina así: ' + Q(f) + '. Determina qué consigue quien escribe al detener ahí el texto.',
             en:Q(TX.title) + ' ends like this: ' + Q(f) + '. Determine what the writer achieves by stopping the text there.' },
        hint: { es:'Pregúntate quién tiene que hacer algo después de la última línea, y compara eso con lo que ocurriría si el texto ya hubiera dicho cómo termina todo.',
                en:'Ask who has to do something after the last line, and compare that with what would happen if the text had already said how it all ends.' },
        exp: { es:'El texto se detiene un paso antes de la solución, y por eso ' + L(f.eff) + '. Las otras opciones describen lo que consiguen otras líneas del mismo texto.',
               en:'The text stops one step before the solution, and that is why it ' + L(f.eff) + '. The other options describe what other lines of the same text achieve.' },
        options: op,
        correct: op[0]
      };
    }
    var op2 = [qo(f),
      { es:'«Al día siguiente llegó la cuadrilla del municipio y el problema quedó resuelto para siempre.»',
        en:'“The next day the council crew arrived and the problem was solved for good.”' },
      { es:'«La conclusión es clara: quien no cumpla con lo acordado tendrá que pagar una multa.»',
        en:'“The conclusion is clear: whoever fails to keep the agreement will have to pay a fine.”' },
      { es:'«Y así fue como el barrio entero entendió que la solución dependía de todos.»',
        en:'“And that was how the whole neighbourhood understood that the solution depended on everyone.”' }];
    return {
      title: { es:'Cuatro maneras de terminar', en:'Four ways of ending' },
      q: { es:'Estos cuatro finales podrían cerrar un texto sobre el problema de ' + L(C.lugar) + '. Identifica cuál de ellos deja la decisión en manos de quien lo recibe.',
           en:'These four endings could close a text about the problem in ' + L(C.lugar) + '. Identify which of them leaves the decision in the hands of whoever receives it.' },
      hint: { es:'Lee cada final y pregúntate qué le queda por hacer a quien escucha. Si el texto ya dijo cómo termina la historia, no le queda nada.',
              en:'Read each ending and ask what is left for the listener to do. If the text has already said how the story ends, nothing is left.' },
      exp: { es:'Tres de los finales cierran el asunto: uno lo resuelve, otro dicta la conclusión y otro reparte la lección ya aprendida. Solo uno se detiene antes, y por eso obliga a quien escucha a poner la parte que falta.',
             en:'Three of the endings close the matter: one resolves it, another dictates the conclusion and another hands out the lesson already learned. Only one stops earlier, and that is why it forces the listener to supply the missing part.' },
      options: op2,
      correct: op2[0]
    };
  }

  function q9() {
    var TX = proseTx();
    var f = figOf(TX, 'voz_colectiva');
    if (rng() < 0.5) {
      return {
        title: { es:'De nosotros a ellos', en:'From us to them' },
        q: { es:'En ' + Q(TX.title) + ' se lee ' + Q(f) + '. Alguien propone cambiar ese nosotros por «fueron ellos, los de la calle de atrás». Determina qué cambiaría en la propuesta.',
             en:'In ' + Q(TX.title) + ' we read ' + Q(f) + '. Someone proposes changing that we into “it was them, the people from the back street”. Determine what would change in the proposal.' },
        hint: { es:'Ponte en el lugar de quien está escuchando el texto en la asamblea, y pregúntate qué hará con las manos y con la boca al oír cada una de las dos versiones.',
                en:'Put yourself in the place of someone hearing the text at the assembly, and ask what they will do with their hands and their mouth on hearing each of the two versions.' },
        exp: { es:'El hecho descrito sería el mismo, pero el texto haría lo contrario de lo que se propuso. Un nosotros deja a quien escucha dentro del problema, y desde ahí puede actuar; un ellos lo deja fuera, y desde fuera lo primero que hace cualquiera es defenderse.',
               en:'The fact described would be the same, but the text would do the opposite of what it set out to do. A we leaves the listener inside the problem, and from there they can act; a them leaves them outside, and from outside the first thing anyone does is defend themselves.' },
        options: [GEN.ellos.c].concat(GEN.ellos.d),
        correct: GEN.ellos.c
      };

    return {
      title: { es:'La línea que reparte la culpa', en:'The line that shares out the blame' },
      q: { es:'Estas cuatro líneas pertenecen a ' + Q(TX.title) + '. Identifica en cuál de ellas el problema deja de tener culpables ajenos.',
           en:'These four lines belong to ' + Q(TX.title) + '. Identify the one in which the problem stops having outside culprits.' },
      hint: { es:'No busques la línea que menciona a más gente, sino aquella en la que quien escribe se incluye a sí mismo y, con él, a quien está escuchando.',
              en:'Do not look for the line that mentions the most people, but for the one in which the writer includes themselves and, with them, whoever is listening.' },
      exp: { es:'Solo una de las cuatro habla desde un nosotros que abarca a quien escucha, y por eso ' + L(f.eff) + '. Las otras tres describen el problema desde fuera de quien lo padece.',
             en:'Only one of the four speaks from a we that takes in the listener, and that is why it ' + L(f.eff) + '. The other three describe the problem from outside whoever suffers it.' },
      options: op,
      correct: op[0]
    };
  }

  function q10() {
    if (rng() < 0.5) {
      var N = NUEVOS[Math.floor(rng() * NUEVOS.length)];
      return {
        title: { es:'Un problema nuevo', en:'A new problem' },
        q: { es:'Fuera del expediente que trabajaste, se presenta este caso. ' + L(N.p) + ' Determina qué propuesta se adecúa mejor.',
             en:'Outside the file you have been working on, this case comes up. ' + L(N.p) + ' Determine which proposal fits best.' },
        hint: { es:'Empieza por el final: decide qué tiene que quedar cambiado y en quién. Solo un género produce ese cambio, y el destinatario tiene que ser justamente quien debe cambiar.',
                en:'Start from the end: decide what has to be left changed and in whom. Only one genre produces that change, and the audience has to be exactly the one that must change.' },
        exp: { es:'Las cuatro propuestas están bien escritas, y por eso la elección no se hace por calidad sino por adecuación: hay que preguntarse quién recibe el texto y qué tiene que ocurrirle. Solo una de ellas coloca el género, la estrategia y el destinatario que ese cambio exige.',
               en:'All four proposals are well written, which is why the choice is not made by quality but by fit: you have to ask who receives the text and what has to happen to them. Only one of them places the genre, the strategy and the audience that this change demands.' },
        options: [N.c].concat(N.d),
