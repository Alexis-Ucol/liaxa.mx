      es:'Lleva el barco a la franja que se llama ' + L(R[rd].n) + '.',

    });
    elS.value = cur;
    elSh.style.left = (cur / 260 * 100) + '%';

    if (rd >= 3){

      say(host, 'good', L({
        es:'Ya distingues las franjas del mar mexicano. Cada una da derechos distintos, y juntas forman un espacio más grande que todo el territorio continental del país.',

  say(host, '', L({ es:'Mueve el barco y observa el nombre de la franja donde queda.', en:'Move the ship and watch the name of the band where it lands.' }));

  if (vi === 0){

    return numSpec({
      title:{ es:'Los pozos del valle', en:'The wells of the valley' },
      q:{ es:'Un acuífero recibe cada año una recarga de ' + R + ' hm³ y los pozos del valle extraen ' + E + ' hm³ en el mismo periodo. ¿Cuántos hm³ se extraen de más cada año?',
          en:'An aquifer receives a recharge of ' + R + ' hm³ each year and the wells of the valley take out ' + E + ' hm³ in the same period. How many hm³ too many are taken out each year?' },
      hint:{ es:'Compara lo que sale con lo que entra: el exceso es la resta de esas dos cantidades.',
             en:'Compare what goes out with what comes in: the excess is the subtraction of those two amounts.' },
      exp:{ es:'Se resta la recarga de la extracción: ' + E + ' − ' + R + ' = ' + D,
            en:'The recharge is subtracted from the extraction: ' + E + ' − ' + R + ' = ' + D }
    }, vals);
  }
  if (vi === 1){
    var R1, R2, def;
    for (g = 0; g < 80; g++){
      R1 = 10 * ri(rng, 8, 20); R2 = 10 * ri(rng, 5, 15); D = 10 * ri(rng, 3, 12); E = R1 + R2 + D;
      def = E - R1 - R2;
      vals = [def, R1 + R2, E, E + R1];
      if (distinct4(vals)) break;
    }
    return numSpec({
      title:{ es:'Dos zonas de recarga', en:'Two recharge areas' },
      q:{ es:'Un acuífero se recarga por dos zonas: una aporta ' + R1 + ' hm³ al año y la otra ' + R2 + ' hm³. En ese mismo año se extraen ' + E + ' hm³ para riego y para las casas. ¿Cuántos hm³ pierde el acuífero en el año?',
          en:'An aquifer is recharged through two areas: one contributes ' + R1 + ' hm³ a year and the other ' + R2 + ' hm³. In that same year ' + E + ' hm³ are taken out for irrigation and for homes. How many hm³ does the aquifer lose during the year?' },
      hint:{ es:'Junta primero las dos recargas en un solo total y compáralo con lo que se extrae.',
             en:'First put the two recharges into a single total and compare it with what is taken out.' },
      exp:{ es:'La extracción menos la recarga total: ' + E + ' − (' + R1 + ' + ' + R2 + ') = ' + def,
            en:'The extraction minus the total recharge: ' + E + ' − (' + R1 + ' + ' + R2 + ') = ' + def }
    }, vals);
  }
  var n;
  for (g = 0; g < 80; g++){
    D = 10 * ri(rng, 3, 12); n = ri(rng, 3, 6);
    vals = [D * n, D * (n + 1), D * (n - 1), D + n];
    if (distinct4(vals)) break;
  }
  return numSpec({
    title:{ es:'La cuenta de varios años', en:'The count over several years' },
    q:{ es:'En una región se extraen cada año ' + D + ' hm³ más de los que el acuífero alcanza a recargar, y el ritmo se ha mantenido igual durante ' + n + ' años. ¿Cuántos hm³ ha perdido el acuífero en ese periodo?',
        en:'In one region ' + D + ' hm³ more than the aquifer manages to recharge are taken out every year, and the pace has stayed the same for ' + n + ' years. How many hm³ has the aquifer lost over that period?' },
    hint:{ es:'La misma pérdida se repite cada año, así que basta multiplicarla por el número de años.',
           en:'The same loss repeats every year, so it is enough to multiply it by the number of years.' },
    exp:{ es:'La pérdida anual se multiplica por los años transcurridos: ' + D + ' × ' + n + ' = ' + (D * n),
          en:'The yearly loss is multiplied by the years that have passed: ' + D + ' × ' + n + ' = ' + (D * n) }
  }, vals);
}

function mkP8(rng){

          en:'A factory set up in the upper part of a basin dumps its waste into a small stream. The people living at the mouth, ninety kilometres away, file a complaint. Why does something happening so far away affect them?' },
      opts:{ es:['Porque toda el agua de la cuenca escurre hacia el mismo cauce y sale por la desembocadura',

      exp:{ es:'En una cuenca los escurrimientos convergen en un solo río principal y salen por una única desembocadura, así que lo que entra aguas arriba llega necesariamente aguas abajo.',

    { title:{ es:'La tala en la parte alta', en:'The logging in the upper part' },

      exp:{ es:'Al quitar el bosque de la cuenca alta, la lluvia se infiltra menos y escurre de golpe cargada de sedimento, de modo que la parte baja recibe avenidas más fuertes y más azolve.',
            en:'When the forest of the upper basin is removed, rain soaks in less and runs off all at once loaded with sediment, so the lower part gets stronger floods and more silt.' } },
    { title:{ es:'Administrar por cuenca', en:'Managing by basin' },
      q:{ es:'Una comisión propone que las decisiones sobre el agua de una región se tomen por cuenca y no siguiendo los límites de cada municipio. ¿Qué argumento sostiene esa propuesta?',
          en:'A commission proposes that decisions about the water of a region be taken by basin and not following the limits of each municipality. Which argument supports that proposal?' },
      opts:{ es:['El agua escurre siguiendo el relieve y no las fronteras administrativas',
                 'Los municipios pequeños no tienen ríos dentro de su superficie',
                 'Cada cuenca coincide exactamente con un solo municipio del país',
                 'Las cuencas cambian de forma cada temporada de lluvias'],
             en:['Water runs following the relief and not administrative borders',
                 'Small municipalities have no rivers inside their surface',
                 'Each basin matches exactly one single municipality of the country',
                 'Basins change shape every rainy season'] }, ci:0,
      hint:{ es:'Compara qué determina el recorrido del agua con lo que determina el límite de un municipio.',
             en:'Compare what determines the path of the water with what determines the limit of a municipality.' },
      exp:{ es:'El límite de una cuenca lo marca el parteaguas, es decir el relieve, y suele atravesar varios municipios, así que administrar el agua por cuenca respeta el camino real que sigue.',
            en:'The limit of a basin is marked by the divide, that is by the relief, and it usually crosses several municipalities, so managing water by basin respects the real path it follows.' } }
  ];
  return mcSpec(pickV(rng, V));

function mkP9(rng){
  var vi = Math.floor(rng() * 3);
  if (vi === 0){
    var a = 10 * ri(rng, 3, 17);
    if (a === 100) a = 110;
    return numSpec({
      title:{ es:'Rumbo al límite de la zona', en:'Heading for the limit of the zone' },
      q:{ es:'Un barco pesquero navega a ' + a + ' millas náuticas de la costa mexicana y avanza en línea recta mar adentro. La zona económica exclusiva del país termina a las 200 millas náuticas. ¿Cuántas millas náuticas más puede avanzar sin salir de ella?',
          en:'A fishing boat sails ' + a + ' nautical miles from the Mexican coast and moves straight out to sea. The exclusive economic zone of the country ends at 200 nautical miles. How many more nautical miles can it advance without leaving it?' },
      hint:{ es:'Al límite de la zona réstale la distancia a la que ya se encuentra el barco.',
             en:'From the limit of the zone subtract the distance the boat has already covered.' },
      exp:{ es:'Se resta la distancia recorrida al límite de la zona: 200 − ' + a + ' = ' + (200 - a),
            en:'The distance already covered is subtracted from the limit of the zone: 200 − ' + a + ' = ' + (200 - a) }
    }, [200 - a, 200 + a, a, 188 - a]);
  }
  if (vi === 1){
    var b = ri(rng, 3, 9);
    if (b === 6) b = 7;
    return numSpec({
      title:{ es:'La lancha de vigilancia', en:'The patrol boat' },
      q:{ es:'Una lancha de vigilancia se encuentra a ' + b + ' millas náuticas de la costa y avanza mar adentro. El mar territorial de México termina a las 12 millas náuticas. ¿Cuántas millas náuticas más puede avanzar sin salir del mar territorial?',
          en:'A patrol boat is ' + b + ' nautical miles from the coast and moves out to sea. The territorial sea of Mexico ends at 12 nautical miles. How many more nautical miles can it advance without leaving the territorial sea?' },
      hint:{ es:'Al límite del mar territorial réstale la distancia a la que ya está la lancha.',
             en:'From the limit of the territorial sea subtract the distance the boat is already at.' },
      exp:{ es:'Se resta la distancia actual al límite del mar territorial: 12 − ' + b + ' = ' + (12 - b),
            en:'The current distance is subtracted from the limit of the territorial sea: 12 − ' + b + ' = ' + (12 - b) }
    }, [12 - b, 24 - b, b, 12 + b]);
  }
  var c = ri(rng, 3, 9);
  return numSpec({
    title:{ es:'La boya anclada', en:'The anchored buoy' },
    q:{ es:'Una boya de medición está anclada a ' + c + ' millas náuticas de la costa. Cada milla náutica equivale a 1852 metros. ¿A cuántos metros de la costa se encuentra la boya?',
        en:'A measuring buoy is anchored ' + c + ' nautical miles from the coast. Each nautical mile equals 1852 metres. How many metres from the coast is the buoy?' },
    hint:{ es:'Cada milla náutica aporta la misma cantidad de metros, así que se multiplica el valor de una por el número de millas.',
           en:'Each nautical mile contributes the same number of metres, so the value of one is multiplied by the number of miles.' },
    exp:{ es:'Se multiplica el valor de una milla náutica por las millas de distancia: 1852 × ' + c + ' = ' + (1852 * c),
          en:'The value of one nautical mile is multiplied by the miles of distance: 1852 × ' + c + ' = ' + (1852 * c) }
  }, [1852 * c, 1852 * (c + 1), 1852 * (c - 1), 1000 * c]);
}

            en:'The 150 nautical miles fall inside the exclusive economic zone, which reaches 200: there Mexico does not hold full sovereignty, but it does have the exclusive right to use the fishing and the other resources.' } },
    { title:{ es:'El yacimiento del fondo', en:'The deposit on the sea floor' },

          en:'A survey finds a usable deposit on the sea floor, 120 nautical miles off the coast of Tamaulipas. What does that location mean for the country?' },
      opts:{ es:['Que está en la zona económica exclusiva y su aprovechamiento corresponde a México',
                 'Que está en aguas internacionales y cualquier país puede explotarlo',
                 'Que está en el mar territorial y por eso no puede explotarse nunca',
                 'Que está en la zona contigua, donde solo se permite la pesca'],
             en:['That it is in the exclusive economic zone and its use belongs to Mexico',
                 'That it is in international waters and any country may exploit it',
                 'That it is in the territorial sea and therefore can never be exploited',
                 'That it is in the contiguous zone, where only fishing is allowed'] }, ci:0,
      hint:{ es:'Compara la distancia del hallazgo con el límite de cada franja del mar mexicano.',
             en:'Compare the distance of the find with the limit of each band of the Mexican sea.' },
      exp:{ es:'A 120 millas náuticas el yacimiento queda dentro de la zona económica exclusiva, donde el país tiene el derecho exclusivo de explorar y aprovechar los recursos del fondo marino.',
            en:'At 120 nautical miles the deposit lies inside the exclusive economic zone, where the country has the exclusive right to explore and use the resources of the sea floor.' } },
    { title:{ es:'Un mar más grande que la tierra', en:'A sea larger than the land' },
      q:{ es:'Al comparar superficies se observa que la zona económica exclusiva de México es mayor que todo su territorio continental. ¿Qué implicación tiene ese dato para el país?',
          en:'When surfaces are compared it turns out that the exclusive economic zone of Mexico is larger than its whole continental territory. What does that fact imply for the country?' },
      opts:{ es:['Que dispone de un enorme patrimonio marino que debe conocer, aprovechar y cuidar',
                 'Que puede dejar de proteger sus ríos y lagos porque el mar los sustituye',
                 'Que su superficie continental dejó de contar para el desarrollo económico',
                 'Que las decisiones sobre ese mar corresponden a los países vecinos'],
             en:['That it holds an enormous marine heritage it must know, use and look after',
                 'That it can stop protecting its rivers and lakes because the sea replaces them',
                 'That its continental surface no longer counts for economic development',
                 'That decisions about that sea belong to the neighbouring countries'] }, ci:0,
      hint:{ es:'Piensa qué responsabilidades y qué oportunidades trae un espacio marino tan extenso.',
             en:'Think about what responsibilities and what opportunities such a wide marine space brings.' },
      exp:{ es:'De ese mar salen alimento, energía y trabajo, y su tamaño obliga a conocerlo y protegerlo: eso es lo que fortalece la conciencia marítima del país.',
            en:'Food, energy and work come out of that sea, and its size makes knowing and protecting it necessary: that is what strengthens the maritime awareness of the country.' } }
  ];
  return mcSpec(pickV(rng, V));
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';

    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
