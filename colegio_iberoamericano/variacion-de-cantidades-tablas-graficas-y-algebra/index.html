             en:'The charge made only once does not depend on x, so it takes the place of the constant term; the amount repeated for each part is the one multiplying x.'},
      explanation: {es:'Por cada refacción se suman '+thou(porPieza)+' pesos, así que ese número multiplica a x, y la revisión de '+thou(fijo)+' pesos se paga una sola vez: y = '+porPieza+'x + '+fijo+'.',
                    en:'Each part adds '+thou(porPieza)+' pesos, so that number multiplies x, and the '+thou(fijo)+'-peso inspection is paid only once: y = '+porPieza+'x + '+fijo+'.'},
      options: ['y = '+porPieza+'x + '+fijo, 'y = '+fijo+'x + '+porPieza, 'y = '+(fijo+porPieza)+'x', 'y = '+fijo+'x '+MIN+' '+porPieza],
      correct: 'y = '+porPieza+'x + '+fijo,
      showWork: false
    });
  } else {
    var lit0 = ri(60,95)*10, salen = ri(6,10)*5;
    addP({
      title: {es:'La regla de la alberca', en:'The pool rule'},
      questionText: {es:'Una alberca contiene '+thou(lit0)+' litros de agua y una bomba le saca '+salen+' litros cada minuto. Si x son los minutos que lleva encendida la bomba y y son los litros que quedan, ¿cuál regla representa esta variación?',
                     en:'A pool holds '+thou(lit0)+' liters of water and a pump removes '+salen+' liters every minute. If x is the number of minutes the pump has been running and y is the number of liters left, which rule represents this variation?'},
      hint: {es:'Cuando la cantidad disminuye, el término que depende de x se resta al valor inicial, y el valor inicial es el que aparece cuando x vale 0.',
             en:'When the quantity decreases, the term that depends on x is subtracted from the starting value, and the starting value is the one that appears when x equals 0.'},
      explanation: {es:'Cada minuto se pierden '+salen+' litros, así que ese término se resta, y al inicio (x = 0) quedan '+thou(lit0)+' litros: y = '+lit0+' '+MIN+' '+salen+'x.',
                    en:'Each minute '+salen+' liters are lost, so that term is subtracted, and at the start (x = 0) there are '+thou(lit0)+' liters: y = '+lit0+' '+MIN+' '+salen+'x.'},
      options: ['y = '+lit0+' '+MIN+' '+salen+'x', 'y = '+salen+'x '+MIN+' '+lit0, 'y = '+lit0+' + '+salen+'x', 'y = '+salen+'x + '+lit0],
      correct: 'y = '+lit0+' '+MIN+' '+salen+'x',
      showWork: false
    });
  }

  /* ════════════════════════════════════════════════════════════
     SECCION 3: la grafica de la variacion
     ════════════════════════════════════════════════════════════ */
  sec(
    '<div class="stag">'+L({es:'La gráfica',en:'The graph'})+'</div>'+
    '<h2>'+L({es:'Leer la variación en la gráfica',en:'Reading a variation on the graph'})+'</h2>'+
    '<p>'+L({es:'Si cada pareja de la tabla se dibuja como un punto en el plano, los puntos de una variación constante quedan alineados. La inclinación de esa recta es el cambio de y por cada unidad de x: sube de izquierda a derecha cuando ese cambio es positivo y baja cuando es negativo.',
             en:'If each pair from the table is drawn as a point on the plane, the points of a constant variation line up. The slope of that line is the change in y per unit of x: it rises from left to right when that change is positive and falls when it is negative.'})+'</p>'+
    '<p>'+L({es:'El punto donde la recta cruza el eje vertical es el valor de y cuando x es 0. Si la recta pasa justo por el origen, la variación es proporcional; si cruza más arriba o más abajo, hay un valor inicial distinto de cero.',
             en:'The point where the line crosses the vertical axis is the value of y when x is 0. If the line passes right through the origin, the variation is proportional; if it crosses higher or lower, there is a starting value different from zero.'})+'</p>'+

    '<div class="mwrap">'+
      '<div class="mhead"><div class="mtitle">'+L({es:'Rastreador sobre la recta',en:'Tracker on the line'})+'</div></div>'+
      '<div class="mtask" id="m3task"></div>'+
      '<canvas class="gcanvas" id="m3cv"></canvas>'+
      '<div class="mrow">'+
        '<button class="stepbtn" onclick="m3Step(-0.5)">&#9664;</button>'+
        '<input type="range" id="m3s" min="0" max="8" step="0.5" value="0" oninput="m3Upd()" style="flex:1;min-width:140px;accent-color:var(--green)">'+
        '<button class="stepbtn" onclick="m3Step(0.5)">&#9654;</button>'+
      '</div>'+
      '<div class="mrow"><span class="readout" id="m3out">x = 0</span></div>'+
      '<div class="mrow"><button class="mbtn" id="m3btn" onclick="m3Check()">'+L({es:'Marcar este punto',en:'Mark this point'})+'</button></div>'+
      '<div class="mfb" id="m3fb"></div>'+
    '</div>'
  );

  /* ── manipulativo 3: rastreador de puntos sobre la recta ── */
  var t3m = px([2,3,4,-2,-3]);
  var t3b = t3m < 0 ? ri(10,20) : ri(-6,10);
  var t3xt = ri(2,7);
  var M3 = { m:t3m, b:t3b, xt:t3xt, yt:t3m*t3xt + t3b, x:0, tries:0, solved:false };
  function m3Draw(){
    var cv = document.getElementById('m3cv'); if (!cv) return;
    var g = gsetup(cv, -1, 8, -25, 45, 10);
    gline(g, M3.m, M3.b, -1, 8, cvar('--green'), 2.6);
    gclip(g, function(){
      var ctx = g.ctx; ctx.strokeStyle = cvar('--gold'); ctx.lineWidth = 1.6; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(g.X(-1), g.Y(M3.yt)); ctx.lineTo(g.X(8), g.Y(M3.yt)); ctx.stroke();
      ctx.setLineDash([]);
    });
    gdot(g, M3.x, M3.m*M3.x + M3.b, cvar('--green'), 6.5);
  }
  function m3Task(){
    document.getElementById('m3task').innerHTML =
      L({es:'La recta dibujada es '+rule(M3.m,M3.b)+'. Arrastra el punto verde sobre ella hasta que su valor de y sea exactamente '+nm(M3.yt)+' (la línea dorada) y márcalo.',
         en:'The drawn line is '+rule(M3.m,M3.b)+'. Slide the green point along it until its y value is exactly '+nm(M3.yt)+' (the golden line) and mark it.'});
  }
  window.m3Upd = function(){
    M3.x = parseFloat(document.getElementById('m3s').value);
    var y = M3.m*M3.x + M3.b;
    document.getElementById('m3out').textContent = 'x = ' + dec(M3.x) + '   ·   y = ' + dec(y);
    m3Draw();
    if (M3.solved) return;
    var fb = document.getElementById('m3fb');
    var falta = M3.yt - y;
    if (falta === 0){
      fb.className = 'mfb good';
      fb.innerHTML = L({es:'El punto ya está sobre la línea dorada. Márcalo para confirmarlo.',en:'The point is on the golden line now. Mark it to confirm.'});
    } else {
      var derecha = (falta / M3.m) > 0;
      fb.className = 'mfb near';
      fb.innerHTML = L({es:'y va '+(falta>0?'por debajo':'por encima')+' de '+nm(M3.yt)+' por '+dec(Math.abs(falta))+': muévete hacia la '+(derecha?'derecha':'izquierda')+'.',
                        en:'y is '+(falta>0?'below':'above')+' '+nm(M3.yt)+' by '+dec(Math.abs(falta))+': move to the '+(derecha?'right':'left')+'.'});
    }
  };
  window.m3Step = function(d){
    var s = document.getElementById('m3s');
    s.value = Math.min(8, Math.max(0, parseFloat(s.value) + d));
    window.m3Upd();
  };
  window.m3Check = function(){
    var fb = document.getElementById('m3fb');
    var y = M3.m*M3.x + M3.b;
    if (y === M3.yt){
      M3.solved = true;
      fb.className = 'mfb good';
      fb.innerHTML = L({es:'Correcto: el punto ('+dec(M3.x)+', '+nm(M3.yt)+') pertenece a la recta, porque '+M3.m+' × '+dec(M3.x)+bTail(M3.b)+' da '+nm(M3.yt)+'.',
                        en:'Right: the point ('+dec(M3.x)+', '+nm(M3.yt)+') belongs to the line, because '+M3.m+' × '+dec(M3.x)+bTail(M3.b)+' gives '+nm(M3.yt)+'.'});
      document.getElementById('m3btn').disabled = true;
      return;
    }
    M3.tries++;
    if (M3.tries >= 3){
      M3.solved = true;
      document.getElementById('m3s').value = M3.xt;
      M3.x = M3.xt; m3Draw();
      document.getElementById('m3out').textContent = 'x = ' + dec(M3.xt) + '   ·   y = ' + nm(M3.yt);
      fb.className = 'mfb rev';
      fb.innerHTML = L({es:'Ocurre en x = '+M3.xt+'. Para hallarlo sin buscar: quita el valor inicial, '+nm(M3.yt)+bTail(-M3.b)+' = '+nm(M3.yt-M3.b)+', y divide entre el cambio por unidad, '+nm(M3.yt-M3.b)+' ÷ '+nm(M3.m)+' = '+M3.xt+'.',
                        en:'It happens at x = '+M3.xt+'. To find it without searching: remove the starting value, '+nm(M3.yt)+bTail(-M3.b)+' = '+nm(M3.yt-M3.b)+', and divide by the change per unit, '+nm(M3.yt-M3.b)+' ÷ '+nm(M3.m)+' = '+M3.xt+'.'});
      document.getElementById('m3btn').disabled = true;
      return;
    }
    fb.className = 'mfb near';
    document.getElementById('m3s').value = 0; M3.x = 0; m3Draw();
    document.getElementById('m3out').textContent = 'x = 0   ·   y = ' + nm(M3.b);
    fb.innerHTML = L({es:'Ese punto no llega a la línea dorada. El rastreador volvió al inicio: avanza de nuevo y fíjate cuánto sube o baja y en cada paso.',
                      en:'That point does not reach the golden line. The tracker went back to the start: move again and watch how much y rises or falls at each step.'});
  };

  /* ── problema 5 ── */
  var v5 = Math.floor(rng()*2);
  if (v5 === 0){
    var sube = ri(3,5), horas = ri(4,6), ansT = ri(5,12), T0 = ansT - sube*horas;
    if (T0 > -2){ T0 = -ri(2,6); ansT = T0 + sube*horas; }
    var hIni = 5, hFin = hIni + horas;
    var fmtT = function(v){ return nm(v) + ' °C'; };
    var o7 = opts4(ansT, [T0 - sube*horas, sube*horas, ansT - sube], fmtT);
    addP({
      title: {es:'El termómetro del invernadero', en:'The greenhouse thermometer'},
      questionText: {es:'A las '+hIni+' de la mañana el termómetro de un invernadero marca '+nm(T0)+' °C y la temperatura sube '+sube+' °C cada hora. ¿Qué temperatura marcará el termómetro a las '+hFin+' de la mañana?',
                     en:'At '+hIni+' in the morning the thermometer in a greenhouse reads '+nm(T0)+' °C and the temperature rises '+sube+' °C every hour. What temperature will the thermometer read at '+hFin+' in the morning?'},
      hint: {es:'Cuenta las horas transcurridas, multiplícalas por el aumento de cada hora y suma ese total a la temperatura inicial, que es negativa: y = '+sube+'x '+MIN+' '+Math.abs(T0)+'.',
             en:'Count the hours that pass, multiply them by the rise each hour and add that total to the starting temperature, which is negative: y = '+sube+'x '+MIN+' '+Math.abs(T0)+'.'},
      explanation: {es:'De las '+hIni+' a las '+hFin+' pasan '+horas+' horas y la temperatura sube '+sube+' × '+horas+' = '+(sube*horas)+' °C, así que '+nm(T0)+' + '+(sube*horas)+' = '+ansT,
                    en:'From '+hIni+' to '+hFin+' there are '+horas+' hours and the temperature rises '+sube+' × '+horas+' = '+(sube*horas)+' °C, so '+nm(T0)+' + '+(sube*horas)+' = '+ansT},
      options: o7.list, correct: o7.correct
    });
  } else {
    var sube2 = ri(4,6), horas2 = ri(5,7), ansC = ri(4,14), C0 = ansC - sube2*horas2;
    if (C0 > -6){ C0 = -ri(6,16); ansC = C0 + sube2*horas2; }
    var fmtC = function(v){ return nm(v) + ' °C'; };
    var o8 = opts4(ansC, [C0 - sube2*horas2, sube2*horas2, ansC + sube2], fmtC);
    addP({
      title: {es:'El congelador apagado', en:'The freezer switched off'},
      questionText: {es:'Un congelador industrial está a '+nm(C0)+' °C y, al quedarse sin electricidad, su temperatura sube '+sube2+' °C cada hora. ¿Qué temperatura tendrá el congelador '+horas2+' horas después del corte?',
                     en:'An industrial freezer is at '+nm(C0)+' °C and, after a power cut, its temperature rises '+sube2+' °C every hour. What temperature will the freezer have '+horas2+' hours after the cut?'},
      hint: {es:'La temperatura crece a ritmo constante desde un valor negativo: multiplica el aumento por hora por las horas y suma el resultado a la temperatura inicial.',
             en:'The temperature grows at a constant rate from a negative value: multiply the hourly rise by the number of hours and add the result to the starting temperature.'},
      explanation: {es:'En '+horas2+' horas la temperatura sube '+sube2+' × '+horas2+' = '+(sube2*horas2)+' °C, así que '+nm(C0)+' + '+(sube2*horas2)+' = '+ansC,
                    en:'In '+horas2+' hours the temperature rises '+sube2+' × '+horas2+' = '+(sube2*horas2)+' °C, so '+nm(C0)+' + '+(sube2*horas2)+' = '+ansC},
      options: o8.list, correct: o8.correct
    });
  }

  /* ── problema 6 ── */
  var v6 = Math.floor(rng()*2);
  if (v6 === 0){
    var mm = ri(2,5), bb = ri(-6,8), xa = -ri(1,4), xb = ri(1,4);
    var ya = mm*xa + bb, yb = mm*xb + bb;
    var o9 = opts4(mm, [yb - ya, xb - xa, mm + 2], nm);
    addP({
      title: {es:'Cambio por unidad entre dos puntos', en:'Change per unit between two points'},
      questionText: {es:'Una recta pasa por los puntos A('+nm(xa)+', '+nm(ya)+') y B('+nm(xb)+', '+nm(yb)+'). ¿Cuánto cambia y por cada unidad que aumenta x?',
                     en:'A line passes through the points A('+nm(xa)+', '+nm(ya)+') and B('+nm(xb)+', '+nm(yb)+'). How much does y change for each unit that x increases?'},
      fn: 'A('+nm(xa)+', '+nm(ya)+')   ·   B('+nm(xb)+', '+nm(yb)+')',
      hint: {es:'Divide el cambio de y entre el cambio de x: m = (y de B '+MIN+' y de A) ÷ (x de B '+MIN+' x de A). Restar un número negativo equivale a sumar.',
             en:'Divide the change in y by the change in x: m = (y of B '+MIN+' y of A) ÷ (x of B '+MIN+' x of A). Subtracting a negative number is the same as adding.'},
      explanation: {es:'De A a B, y cambia '+nm(yb)+bTail(-ya)+' = '+nm(yb-ya)+' y x cambia '+nm(xb)+bTail(-xa)+' = '+(xb-xa)+', así que '+nm(yb-ya)+' ÷ '+(xb-xa)+' = '+nm(mm),
                    en:'From A to B, y changes '+nm(yb)+bTail(-ya)+' = '+nm(yb-ya)+' and x changes '+nm(xb)+bTail(-xa)+' = '+(xb-xa)+', so '+nm(yb-ya)+' ÷ '+(xb-xa)+' = '+nm(mm)},
      options: o9.list, correct: o9.correct
    });
  } else {
    var mt = ri(3,6), bt = ri(-8,6), xt1 = ri(2,4), sp = ri(4,6);
    var xsT = [xt1, xt1+sp, xt1+2*sp], ysT = xsT.map(function(x){ return mt*x + bt; });
    var o10 = opts4(mt, [ysT[1]-ysT[0], sp, mt+3], nm);
    addP({
      title: {es:'El ritmo de la tabla', en:'The rhythm of the table'},
      questionText: {es:'La tabla registra una variación constante, pero los valores de x no van de uno en uno.'+tbl(xsT,ysT)+'¿Cuánto cambia y por cada unidad que aumenta x?',
                     en:'The table records a constant variation, but the x values do not go one by one.'+tbl(xsT,ysT)+'How much does y change for each unit that x increases?'},
      hint: {es:'Toma dos columnas, calcula cuánto avanzó x y cuánto avanzó y entre ellas, y divide el avance de y entre el avance de x.',
             en:'Take two columns, work out how much x advanced and how much y advanced between them, and divide the advance of y by the advance of x.'},
      explanation: {es:'De x = '+xsT[0]+' a x = '+xsT[1]+' hay '+sp+' unidades y y pasa de '+nm(ysT[0])+' a '+nm(ysT[1])+', es decir cambia '+nm(ysT[1]-ysT[0])+'. Por cada unidad: '+nm(ysT[1]-ysT[0])+' ÷ '+sp+' = '+nm(mt),
                    en:'From x = '+xsT[0]+' to x = '+xsT[1]+' there are '+sp+' units and y goes from '+nm(ysT[0])+' to '+nm(ysT[1])+', that is a change of '+nm(ysT[1]-ysT[0])+'. Per unit: '+nm(ysT[1]-ysT[0])+' ÷ '+sp+' = '+nm(mt)},
      options: o10.list, correct: o10.correct
    });
  }

  /* ════════════════════════════════════════════════════════════
     SECCION 4: reparto proporcional
     ════════════════════════════════════════════════════════════ */
  sec(
    '<div class="stag">'+L({es:'Reparto proporcional',en:'Proportional sharing'})+'</div>'+
    '<h2>'+L({es:'Repartir un total en partes proporcionales',en:'Splitting a total into proportional parts'})+'</h2>'+
    '<p>'+L({es:'A veces la variación aparece al repartir: un total se divide entre varias personas, pero no en partes iguales, sino de acuerdo con lo que cada una aportó, con las horas que trabajó o con los puntos que consiguió. Cada cantidad recibida varía de forma proporcional a la cantidad aportada.',
             en:'Sometimes variation shows up when sharing: a total is divided among several people, not into equal parts, but according to what each one contributed, the hours each one worked or the points each one earned. Every amount received varies proportionally with the amount contributed.'})+'</p>'+
    '<p>'+L({es:'La idea clave es imaginar el total dividido en partes iguales, tantas como indica la suma de las cantidades aportadas. El valor de una parte es la constante de la variación, y cada persona recibe tantas partes como aportó.',
             en:'The key idea is to picture the total split into equal parts, as many as the sum of the contributed amounts indicates. The value of one part is the constant of the variation, and each person receives as many parts as they contributed.'})+'</p>'+
    '<div class="callout"><p>'+L({es:'<strong>Comprobación rápida:</strong> al terminar un reparto, la suma de las cantidades repartidas debe dar exactamente el total, y la razón entre dos cantidades repartidas debe ser la misma que la razón entre lo que aportaron.',
             en:'<strong>Quick check:</strong> when a share-out is finished, the amounts handed out must add up exactly to the total, and the ratio between two of those amounts must equal the ratio between the contributions.'})+'</p></div>'+

    '<div class="mwrap">'+
      '<div class="mhead"><div class="mtitle">'+L({es:'Bandeja de reparto',en:'Sharing tray'})+'</div><div class="mrnd" id="m4rnd"></div></div>'+
      '<div class="mtask" id="m4task"></div>'+
      '<div class="mrow">'+
        '<button class="stepbtn" onclick="m4Step(-10)">'+MIN+'10</button>'+
        '<input type="range" id="m4s" min="0" max="100" step="10" value="0" oninput="m4Upd()" style="flex:1;min-width:140px;accent-color:var(--green)">'+
        '<button class="stepbtn" onclick="m4Step(10)">+10</button>'+
      '</div>'+
      '<div class="barwrap"><div class="barlbl"><span>Ana</span><span id="m4av">$0</span></div><div class="bartrack"><div class="bar" id="m4ab" style="width:0%"></div></div></div>'+
      '<div class="barwrap"><div class="barlbl"><span>Beto</span><span id="m4bv">$0</span></div><div class="bartrack"><div class="bar alt" id="m4bb" style="width:100%"></div></div></div>'+
      '<div class="chips" id="m4chips"></div>'+
      '<div class="mrow">'+
        '<button class="mbtn" id="m4btn" onclick="m4Check()">'+L({es:'Cerrar el reparto',en:'Close the share-out'})+'</button>'+
        '<button class="mbtn ghost" id="m4next" onclick="m4Next()" style="display:none">'+L({es:'Siguiente reparto',en:'Next share-out'})+'</button>'+
      '</div>'+
      '<div class="mfb" id="m4fb"></div>'+
    '</div>'
  );

  /* ── manipulativo 4: bandeja de reparto proporcional, 3 rondas ── */
  var M4 = { r:0, tries:0, rounds:[], finished:false, amt:0 };
  var razones = shuffle([[2,3],[3,5],[1,4],[3,4],[2,5],[4,5]], rng);
  for (var q4 = 0; q4 < 3; q4++){
    var par = razones[q4], un = ri(3,9)*10;
    M4.rounds.push({ a:par[0], b:par[1], unit:un, total:(par[0]+par[1])*un });
  }
  function m4D(){ return M4.rounds[M4.r]; }
  window.m4Render = function(){
    var d = m4D();
    M4.amt = 0;
    var s = document.getElementById('m4s');
    s.max = d.total; s.value = 0; s.disabled = false;
    document.getElementById('m4rnd').textContent = L({es:'Reparto ',en:'Share-out '}) + (M4.r+1) + L({es:' de 3',en:' of 3'});
    document.getElementById('m4task').innerHTML =
      L({es:'Ana y Beto deben repartirse '+mny(d.total)+' en razón '+d.a+' a '+d.b+' (Ana : Beto). Mueve el control hasta que las dos cantidades guarden esa razón y cierra el reparto.',
         en:'Ana and Beto have to share '+mny(d.total)+' in a ratio of '+d.a+' to '+d.b+' (Ana : Beto). Move the control until the two amounts hold that ratio and close the share-out.'});
    document.getElementById('m4btn').style.display = ''; document.getElementById('m4btn').disabled = false;
    document.getElementById('m4next').style.display = 'none';
    window.m4Upd();
  };
  window.m4Upd = function(){
    var d = m4D();
    M4.amt = parseInt(document.getElementById('m4s').value, 10);
    var otro = d.total - M4.amt;
    document.getElementById('m4av').textContent = mny(M4.amt);
    document.getElementById('m4bv').textContent = mny(otro);
    document.getElementById('m4ab').style.width = (M4.amt / d.total * 100) + '%';
    document.getElementById('m4bb').style.width = (otro / d.total * 100) + '%';
    var razonAct = otro === 0 ? null : M4.amt / otro;
    var razonMeta = d.a / d.b;
    document.getElementById('m4chips').innerHTML =
      '<span class="chip'+(razonAct === razonMeta ? '' : ' hot')+'">'+L({es:'razón actual: ',en:'current ratio: '})+(razonAct === null ? '?' : dec(razonAct))+'</span>'+
      '<span class="chip">'+L({es:'razón buscada: ',en:'target ratio: '})+dec(razonMeta)+'</span>';
    var fb = document.getElementById('m4fb');
    if (M4.finished && M4.r >= 2) return;
    if (razonAct === razonMeta){
      fb.className = 'mfb good';
      fb.innerHTML = L({es:'Las dos razones coinciden. Cierra el reparto para confirmarlo.',en:'The two ratios match. Close the share-out to confirm it.'});
    } else {
      fb.className = 'mfb near';
      var alta = (razonAct === null) ? false : (razonAct > razonMeta);
      fb.innerHTML = L({es:'Todavía no: '+(razonAct === null ? 'Beto se quedó sin nada, dale menos a Ana' : (alta ? 'la parte de Ana es demasiado grande frente a la de Beto, quítale dinero' : 'la parte de Ana es demasiado pequeña frente a la de Beto, dale más dinero'))+'.',
                        en:'Not yet: '+(razonAct === null ? 'Beto has nothing left, give Ana less' : (alta ? 'Ana’s share is too big compared with Beto’s, take money from her' : 'Ana’s share is too small compared with Beto’s, give her more money'))+'.'});
    }
  };
  window.m4Step = function(d){
    var s = document.getElementById('m4s');
    s.value = Math.min(parseInt(s.max,10), Math.max(0, parseInt(s.value,10) + d));
    window.m4Upd();
  };
  window.m4Check = function(){
    var d = m4D(), fb = document.getElementById('m4fb');
    if (M4.amt === d.a*d.unit){
      fb.className = 'mfb good';
      fb.innerHTML = L({es:'Reparto correcto: '+(d.a+d.b)+' partes iguales de '+mny(d.unit)+' cada una, '+d.a+' para Ana y '+d.b+' para Beto.',
                        en:'Correct share-out: '+(d.a+d.b)+' equal parts of '+mny(d.unit)+' each, '+d.a+' for Ana and '+d.b+' for Beto.'});
      m4Adv(); return;
    }
    M4.tries++;
    if (M4.tries >= 3){
      document.getElementById('m4s').value = d.a*d.unit;
      window.m4Upd();
      fb.className = 'mfb rev';
      fb.innerHTML = L({es:'La razón '+d.a+' a '+d.b+' son '+(d.a+d.b)+' partes iguales: '+mny(d.total)+' ÷ '+(d.a+d.b)+' = '+mny(d.unit)+' por parte. Entonces Ana recibe '+d.a+' × '+mny(d.unit)+' = '+mny(d.a*d.unit)+' y Beto '+mny(d.b*d.unit)+'.',
                        en:'A ratio of '+d.a+' to '+d.b+' means '+(d.a+d.b)+' equal parts: '+mny(d.total)+' ÷ '+(d.a+d.b)+' = '+mny(d.unit)+' per part. So Ana gets '+d.a+' × '+mny(d.unit)+' = '+mny(d.a*d.unit)+' and Beto '+mny(d.b*d.unit)+'.'});
      m4Adv(); return;
    }
    document.getElementById('m4s').value = 0;
    window.m4Upd();
    fb.className = 'mfb near';
    fb.innerHTML = L({es:'Ese reparto no guarda la razón pedida. La bandeja volvió a cero: piensa primero en cuántas partes iguales hay en total.',
                      en:'That share-out does not hold the requested ratio. The tray went back to zero: think first about how many equal parts there are in total.'});
  };
  function m4Adv(){
    document.getElementById('m4btn').disabled = true;
    document.getElementById('m4s').disabled = true;
    if (M4.r >= 2){
      M4.finished = true;
      document.getElementById('m4fb').innerHTML += '<br><br>' +
        L({es:'En los tres repartos el camino fue el mismo: sumar las partes, dividir el total entre esa suma y multiplicar por las partes de cada uno.',
           en:'In all three share-outs the path was the same: add the parts, divide the total by that sum and multiply by each one’s parts.'});
      return;
    }
    document.getElementById('m4next').style.display = '';
  }
  window.m4Next = function(){ M4.r++; M4.tries = 0; window.m4Render(); };

  /* ── problema 7 ── */
  var v7 = Math.floor(rng()*2);
  if (v7 === 0){
    var pr = px([[3,5],[2,3],[3,7],[4,5],[2,7]]);
    var un7 = ri(8,18)*10, tot7 = (pr[0]+pr[1])*un7, mayor = pr[1]*un7;
    var fmtM = function(v){ return mny(v); };
    var o11 = opts4(mayor, [pr[0]*un7, tot7/2, mayor - un7], fmtM);
    addP({
      title: {es:'La ganancia del puesto', en:'The stall earnings'},
      questionText: {es:'Ana y Beto pusieron dinero para un puesto de aguas frescas en razón '+pr[0]+' a '+pr[1]+'. Al terminar el día repartieron una ganancia de '+thou(tot7)+' pesos en esa misma razón. ¿Cuánto dinero le corresponde a Beto?',
                     en:'Ana and Beto put money into a fresh-water drinks stall in a ratio of '+pr[0]+' to '+pr[1]+'. At the end of the day they shared earnings of '+thou(tot7)+' pesos in that same ratio. How much money does Beto get?'},
      hint: {es:'Suma las dos partes de la razón para saber en cuántas partes iguales se divide el total, obtén el valor de una parte dividiendo, y multiplícalo por las partes que le tocan a Beto.',
             en:'Add the two parts of the ratio to find how many equal parts the total is divided into, get the value of one part by dividing, and multiply it by the parts Beto receives.'},
      explanation: {es:'La razón '+pr[0]+' a '+pr[1]+' son '+(pr[0]+pr[1])+' partes iguales: '+thou(tot7)+' ÷ '+(pr[0]+pr[1])+' = '+thou(un7)+' pesos por parte. A Beto le tocan '+pr[1]+' partes: '+pr[1]+' × '+thou(un7)+' = '+mayor,
                    en:'A ratio of '+pr[0]+' to '+pr[1]+' means '+(pr[0]+pr[1])+' equal parts: '+thou(tot7)+' ÷ '+(pr[0]+pr[1])+' = '+thou(un7)+' pesos per part. Beto receives '+pr[1]+' parts: '+pr[1]+' × '+thou(un7)+' = '+mayor},
      options: o11.list, correct: o11.correct
    });
  } else {
    var pr2 = px([[2,5],[3,4],[1,3],[3,8],[4,7]]);
    var un8 = ri(9,20)*10, tot8 = (pr2[0]+pr2[1])*un8, menor = pr2[0]*un8;
    var fmtM2 = function(v){ return mny(v); };
    var o12 = opts4(menor, [pr2[1]*un8, tot8/2, menor + un8], fmtM2);
    addP({
      title: {es:'El premio del torneo', en:'The tournament prize'},
      questionText: {es:'Un premio de '+thou(tot8)+' pesos se reparte entre dos equipos según los puntos que consiguieron: el equipo azul obtuvo '+pr2[0]+' puntos por cada '+pr2[1]+' del equipo verde. ¿Cuánto dinero recibe el equipo azul?',
                     en:'A prize of '+thou(tot8)+' pesos is shared between two teams according to the points they earned: the blue team got '+pr2[0]+' points for every '+pr2[1]+' the green team got. How much money does the blue team receive?'},
      hint: {es:'Trata los puntos como partes: suma '+pr2[0]+' y '+pr2[1]+', divide el premio entre esa suma para obtener el valor de una parte y multiplícalo por las partes del equipo azul.',
             en:'Treat the points as parts: add '+pr2[0]+' and '+pr2[1]+', divide the prize by that sum to get the value of one part and multiply it by the blue team parts.'},
      explanation: {es:'Hay '+(pr2[0]+pr2[1])+' partes iguales: '+thou(tot8)+' ÷ '+(pr2[0]+pr2[1])+' = '+thou(un8)+' pesos por parte. El equipo azul tiene '+pr2[0]+' partes: '+pr2[0]+' × '+thou(un8)+' = '+menor,
                    en:'There are '+(pr2[0]+pr2[1])+' equal parts: '+thou(tot8)+' ÷ '+(pr2[0]+pr2[1])+' = '+thou(un8)+' pesos per part. The blue team has '+pr2[0]+' parts: '+pr2[0]+' × '+thou(un8)+' = '+menor},
      options: o12.list, correct: o12.correct
    });
  }

  /* ── problema 8 ── */
  var v8 = Math.floor(rng()*2);
  if (v8 === 0){
    var h1 = ri(3,5), h2 = ri(6,8), h3 = ri(9,12), sumH = h1+h2+h3;
    var porHora = ri(5,12)*5, totalPago = sumH*porHora, tocaMara = h2*porHora;
    var fmtP = function(v){ return mny(v); };
    var o13 = opts4(tocaMara, [h1*porHora, h3*porHora, Math.round(totalPago/3)], fmtP);
    addP({
      title: {es:'El pago por pintar la barda', en:'Pay for painting the wall'},
      questionText: {es:'Tres jóvenes pintaron una barda: Luis trabajó '+h1+' horas, Mara '+h2+' horas y Sofía '+h3+' horas. Por el trabajo les pagaron '+thou(totalPago)+' pesos y acordaron repartirlos en proporción a las horas de cada uno. ¿Cuánto dinero le corresponde a Mara?',
                     en:'Three young people painted a wall: Luis worked '+h1+' hours, Mara '+h2+' hours and Sofía '+h3+' hours. They were paid '+thou(totalPago)+' pesos for the job and agreed to share it in proportion to each one’s hours. How much money does Mara get?'},
      hint: {es:'Suma las horas de los tres para saber en cuántas partes iguales se divide el pago, divide el pago entre esa suma para hallar el valor de una hora y multiplícalo por las horas de Mara.',
             en:'Add the three sets of hours to find how many equal parts the payment splits into, divide the payment by that sum to find the value of one hour and multiply it by Mara’s hours.'},
      explanation: {es:'Entre los tres trabajaron '+h1+' + '+h2+' + '+h3+' = '+sumH+' horas y '+thou(totalPago)+' ÷ '+sumH+' = '+thou(porHora)+' pesos por hora. Mara trabajó '+h2+' horas: '+h2+' × '+thou(porHora)+' = '+tocaMara,
                    en:'Together they worked '+h1+' + '+h2+' + '+h3+' = '+sumH+' hours and '+thou(totalPago)+' ÷ '+sumH+' = '+thou(porHora)+' pesos per hour. Mara worked '+h2+' hours: '+h2+' × '+thou(porHora)+' = '+tocaMara},
      options: o13.list, correct: o13.correct
    });
  } else {
    var c1 = ri(10,20), c2 = ri(21,30), c3 = 100 - c1 - c2;
    var porPeso = ri(20,45), premio = 100*porPeso, tocaKarla = c2*porPeso;
    var fmtK = function(v){ return mny(v); };
    var o14 = opts4(tocaKarla, [c1*porPeso, c3*porPeso, Math.round(premio/3)], fmtK);
    addP({
      title: {es:'El boleto compartido', en:'The shared ticket'},
      questionText: {es:'Tres compañeros juntaron dinero para un boleto de rifa: Diego dio '+c1+' pesos, Karla '+c2+' pesos y Omar '+c3+' pesos. Ganaron un premio de '+thou(premio)+' pesos y lo repartieron en proporción a lo que aportó cada uno. ¿Cuánto dinero le corresponde a Karla?',
                     en:'Three classmates put money together for a raffle ticket: Diego gave '+c1+' pesos, Karla '+c2+' pesos and Omar '+c3+' pesos. They won a prize of '+thou(premio)+' pesos and shared it in proportion to what each one contributed. How much money does Karla get?'},
      hint: {es:'Las aportaciones suman una cantidad que sirve como número de partes iguales: divide el premio entre esa suma para saber cuánto corresponde por cada peso aportado y multiplícalo por la aportación de Karla.',
             en:'The contributions add up to an amount that works as the number of equal parts: divide the prize by that sum to see how much corresponds to each peso contributed and multiply it by Karla’s contribution.'},
      explanation: {es:'Entre los tres aportaron '+c1+' + '+c2+' + '+c3+' = 100 pesos y '+thou(premio)+' ÷ 100 = '+thou(porPeso)+' pesos de premio por cada peso aportado. Karla puso '+c2+' pesos: '+c2+' × '+thou(porPeso)+' = '+tocaKarla,
                    en:'Together they contributed '+c1+' + '+c2+' + '+c3+' = 100 pesos and '+thou(premio)+' ÷ 100 = '+thou(porPeso)+' pesos of prize per peso contributed. Karla put in '+c2+' pesos: '+c2+' × '+thou(porPeso)+' = '+tocaKarla},
      options: o14.list, correct: o14.correct
    });
  }

  /* ════════════════════════════════════════════════════════════
     CIERRE: sin explicacion previa
     ════════════════════════════════════════════════════════════ */
  sec('<div class="stag">'+L({es:'Cierre',en:'Wrap-up'})+'</div>'+
      '<h2>'+L({es:'Tablas, gráficas, reglas y repartos',en:'Tables, graphs, rules and share-outs'})+'</h2>');

  /* ── problema 9 ── */
  var v9 = Math.floor(rng()*2);
  if (v9 === 0){
    var m9 = ri(4,8), x9 = ri(3,8), b9 = -ri(6,20), y9 = m9*x9 + b9;
    if (y9 <= 2){ b9 = -ri(2,6); y9 = m9*x9 + b9; }
    var o15 = opts4(x9, [Math.round((y9 - Math.abs(b9))/m9), Math.round(y9/m9), x9 + 2], String);
    addP({
      title: {es:'Halla el valor de x', en:'Find the value of x'},
      questionText: {es:'Dada la regla '+rule(m9,b9)+', ¿cuál es el valor de x cuando y = '+y9+'?',
                     en:'Given the rule '+rule(m9,b9)+', what is the value of x when y = '+y9+'?'},
      fn: rule(m9,b9) + '   ·   y = ' + y9,
      hint: {es:'Despeja x: primero cancela el término constante sumándolo o restándolo en los dos lados y después divide entre el número que multiplica a x.',
             en:'Solve for x: first cancel the constant term by adding or subtracting it on both sides, then divide by the number multiplying x.'},
      explanation: {es:y9+' + '+Math.abs(b9)+' = '+(y9 - b9)+' y luego '+(y9 - b9)+' ÷ '+m9+' = '+x9,
                    en:y9+' + '+Math.abs(b9)+' = '+(y9 - b9)+' and then '+(y9 - b9)+' ÷ '+m9+' = '+x9},
      options: o15.list, correct: o15.correct
    });
  } else {
    var m10 = ri(4,9), x10 = ri(4,9), b10 = ri(3,12), y10 = m10*x10 + b10;
    var o16 = opts4(x10, [Math.round((y10 + b10)/m10), Math.round(y10/m10), x10 - 2], String);
    addP({
      title: {es:'¿Para qué valor de x?', en:'For which value of x?'},
      questionText: {es:'En la variación '+rule(m10,b10)+', ¿para qué valor de x se obtiene y = '+y10+'?',
                     en:'In the variation '+rule(m10,b10)+', for which value of x do you get y = '+y10+'?'},
      fn: rule(m10,b10) + '   ·   y = ' + y10,
      hint: {es:'Quita primero el valor inicial al resultado y después reparte lo que queda entre el cambio por unidad, es decir divide entre el coeficiente de x.',
             en:'First remove the starting value from the result and then divide what is left by the change per unit, that is, by the coefficient of x.'},
      explanation: {es:y10+' '+MIN+' '+b10+' = '+(y10 - b10)+' y luego '+(y10 - b10)+' ÷ '+m10+' = '+x10,
                    en:y10+' '+MIN+' '+b10+' = '+(y10 - b10)+' and then '+(y10 - b10)+' ÷ '+m10+' = '+x10},
      options: o16.list, correct: o16.correct
    });
  }

  /* ── problema 10 ── */
  var v10 = Math.floor(rng()*2);
  if (v10 === 0){
    var rz = ri(4,9)*5, minutos = ri(8,22), Vi = ri(20,60)*10, Vf = Vi + rz*minutos;
    var o17 = opts4(minutos, [minutos + 2, minutos - 3, Math.round(Vf/rz)], String);
    addP({
      title: {es:'La alberca inflable', en:'The inflatable pool'},
      questionText: {es:'Una alberca inflable tiene '+thou(Vi)+' litros de agua y una manguera le agrega '+rz+' litros cada minuto. ¿En cuántos minutos la alberca tendrá '+thou(Vf)+' litros?',
                     en:'An inflatable pool holds '+thou(Vi)+' liters of water and a hose adds '+rz+' liters every minute. In how many minutes will the pool hold '+thou(Vf)+' liters?'},
      hint: {es:'Averigua cuántos litros faltan por entrar y reparte esa cantidad entre los litros que entran cada minuto; es lo mismo que despejar x en y = '+rz+'x + '+thou(Vi)+'.',
             en:'Work out how many liters are still missing and divide that amount by the liters coming in each minute; it is the same as solving for x in y = '+rz+'x + '+thou(Vi)+'.'},
      explanation: {es:'Faltan '+thou(Vf)+' '+MIN+' '+thou(Vi)+' = '+thou(rz*minutos)+' litros y cada minuto entran '+rz+', así que '+thou(rz*minutos)+' ÷ '+rz+' = '+minutos,
                    en:'There are '+thou(Vf)+' '+MIN+' '+thou(Vi)+' = '+thou(rz*minutos)+' liters missing and '+rz+' come in each minute, so '+thou(rz*minutos)+' ÷ '+rz+' = '+minutos},
      options: o17.list, correct: o17.correct
    });
  } else {
    var rc = ri(5,12)*5, dias = ri(6,15), Cf = ri(20,50)*10, Ci = Cf + rc*dias;
    var o18 = opts4(dias, [dias + 3, dias - 2, Math.round(Ci/rc)], String);
    addP({
      title: {es:'Las cajas del almacén', en:'The boxes in the warehouse'},
      questionText: {es:'Un almacén tiene '+thou(Ci)+' cajas y cada día salen '+rc+' cajas para su reparto. ¿En cuántos días quedarán '+thou(Cf)+' cajas en el almacén?',
                     en:'A warehouse holds '+thou(Ci)+' boxes and '+rc+' boxes leave for delivery each day. In how many days will there be '+thou(Cf)+' boxes left in the warehouse?'},
      hint: {es:'Calcula cuántas cajas deben salir en total y reparte esa cantidad entre las cajas que salen cada día; es lo mismo que despejar x en y = '+thou(Ci)+' '+MIN+' '+rc+'x.',
             en:'Work out how many boxes must leave in total and divide that amount by the boxes leaving each day; it is the same as solving for x in y = '+thou(Ci)+' '+MIN+' '+rc+'x.'},
      explanation: {es:'Deben salir '+thou(Ci)+' '+MIN+' '+thou(Cf)+' = '+thou(rc*dias)+' cajas y cada día salen '+rc+', así que '+thou(rc*dias)+' ÷ '+rc+' = '+dias,
                    en:thou(rc*dias)+' boxes must leave, since '+thou(Ci)+' '+MIN+' '+thou(Cf)+' = '+thou(rc*dias)+', and '+rc+' leave each day, so '+thou(rc*dias)+' ÷ '+rc+' = '+dias},
      options: o18.list, correct: o18.correct
    });
  }

  /* ── arranque de los manipulativos que usan canvas ── */
  setTimeout(function(){
    var s = document.getElementById('m1m');
    if (s) window.m1Upd();
    var s3 = document.getElementById('m3s');
    if (s3){ m3Task(); window.m3Upd(); }
    if (document.getElementById('m4s')) window.m4Render();
  }, 130);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Variación de Cantidades: Tablas, Gráficas y Álgebra';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
