/* Places a statistic a safe distance away from the boundary so the verdict is
   never borderline, even after the count of favourable cases is rounded to a
   whole number of files, tickets or visits. */
function offBoundary(crit, rng, wantReject) {
  var d = pick([0.45, 0.72, 1.05], rng);
  return wantReject ? crit + d : crit - d;
}
function roundTo(v, step) { return Math.round(v / step) * step; }

  /* ═══════════════════════ CONCEPTO 1 ═══════════════════════ */
  var c1se   = seProp(c1p0, c1n);

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>Cuando lo que se discute es un porcentaje</h2>' +
      '<p>Buena parte de las cifras que mueven un negocio no son promedios sino porcentajes: la tasa de conversión de una tienda en línea, el porcentaje de clientes que renueva, la proporción de entregas a tiempo, la participación de mercado que declara un competidor. Todas comparten la misma estructura: cada caso de la muestra solo puede caer en una de dos categorías, y lo que interesa es qué fracción cae en la primera. Esa fracción observada se llama proporción muestral y se escribe con un acento circunflejo para distinguirla de la proporción real de la población.</p>' +
      '<p>El procedimiento es el mismo de siempre, con una sola pieza nueva. Primero se escriben las hipótesis, con la igualdad del lado de la nula. Segundo se fija el nivel de significancia. Tercero se calcula el <strong>error estándar de la proporción</strong> y con él el estadístico. Cuarto se compara contra el valor crítico. Quinto se enuncia la conclusión en el idioma del negocio. Lo nuevo aparece en el tercer paso: la variabilidad de una proporción no se estima aparte, porque el propio valor afirmado ya la determina.</p>' +
      '<p>Ese es el punto que conviene entender bien. Cuando se prueba una media hacen falta dos datos independientes, el promedio y la desviación. En una proporción basta uno: si la proporción real fuera ' + pct1(c1p0) + ' por ciento, entonces la variabilidad de cada caso queda fijada por esa misma cifra, y el error estándar vale la raíz cuadrada del producto de la proporción afirmada por su complemento, dividido entre el tamaño de muestra. Por eso el error estándar de la prueba se construye siempre con la <strong>proporción afirmada</strong> y no con la observada: todo el cálculo se hace de pie dentro del mundo donde la afirmación es cierta.</p>' +
      '<p>Queda una condición que no se puede saltar. El estadístico se lee con la campana normal, pero el número real de casos favorables sigue una distribución binomial, que es un conteo y no una curva continua. La aproximación funciona bien cuando se esperan al menos diez casos favorables y al menos diez desfavorables, es decir cuando el tamaño de muestra por la proporción afirmada y el tamaño de muestra por su complemento llegan ambos a diez. Con muestras chicas o proporciones extremas la aproximación se rompe y hay que calcular la probabilidad exacta con el modelo binomial.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Proporción muestral</div><div class="rform">p̂ = ' + frac('x', 'n') + '</div><div class="rnote">Casos favorables entre casos revisados.</div></div>' +
        '<div class="rcard"><div class="rname">Error estándar</div><div class="rform">√( p₀(1 − p₀) / n )</div><div class="rnote">Sale de la proporción afirmada.</div></div>' +
        '<div class="rcard"><div class="rname">Estadístico</div><div class="rform">z = ' + frac('p̂ − p₀', '√( p₀(1 − p₀)/n )') + '</div><div class="rnote">La brecha medida en errores estándar.</div></div>' +
        '<div class="rcard"><div class="rname">Condiciones</div><div class="rform">n·p₀ ≥ 10 y n(1 − p₀) ≥ 10</div><div class="rnote">Sin esto la campana no aplica.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una tienda en línea tiene registrada una tasa de conversión de ' + pct1(c1p0) + ' por ciento, es decir esa fracción de las visitas termina en compra. Después de rediseñar la ficha de producto, el área comercial sospecha que la conversión real subió y revisa una muestra aleatoria de ' + intN(c1n) + ' visitas, de las cuales ' + intN(c1x) + ' terminaron en compra. La revisión se hará con un nivel de significancia de ' + pct1(c1al) + ' por ciento.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> La nula defiende la cifra registrada: la conversión real es de ' + pct1(c1p0) + ' por ciento o menos. La alternativa recoge la sospecha: la conversión real es mayor. La prueba es de una cola por la derecha.<br>' +
      '<strong>Paso 2.</strong> El nivel de significancia queda en ' + pr(c1al) + ', que es el riesgo aceptado de celebrar una mejora que no existe.<br>' +

      '<strong>Paso 5.</strong> ' + (c1R
        ? 'El estadístico ' + dec3(c1z) + ' rebasa el valor crítico ' + dec3(c1zc) + ', así que se rechaza la nula: la evidencia respalda que la conversión real subió.'
        : 'El estadístico ' + dec3(c1z) + ' no alcanza el valor crítico ' + dec3(c1zc) + ', así que no se rechaza la nula: con esta muestra no se puede sostener que la conversión real haya subido.') + '<br>' +

        : 'El rediseño no queda descartado, simplemente no quedó probado: la muestra habría necesitado una conversión superior a ' + pct2(c1crit) + ' para sostenerlo, y conviene decidir si vale la pena acumular más visitas antes de anunciar el resultado.') + '</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>When the figure under discussion is a percentage</h2>' +
      '<p>A good share of the figures that move a business are not averages but percentages: the conversion rate of an online store, the share of customers who renew, the proportion of deliveries on time, the market share a competitor claims. They all share the same structure: each case in the sample can only fall into one of two categories, and what matters is which fraction falls into the first. That observed fraction is called the sample proportion and carries a circumflex to tell it apart from the true proportion of the population.</p>' +
      '<p>The procedure is the usual one, with a single new piece. First the hypotheses are written, with the equality on the side of the null. Second the significance level is fixed. Third the <strong>standard error of the proportion</strong> is computed and with it the statistic. Fourth it is compared against the critical value. Fifth the conclusion is stated in the language of the business. What is new appears in the third step: the variability of a proportion is not estimated separately, because the claimed value already determines it.</p>' +
      '<p>That is the point worth getting right. Testing a mean needs two independent figures, the average and the deviation. A proportion needs only one: if the true proportion were ' + pct1(c1p0) + ' percent, then the variability of each case is pinned down by that same figure, and the standard error is the square root of the claimed proportion times its complement, divided by the sample size. That is why the standard error of the test is always built with the <strong>claimed proportion</strong> and not with the observed one: the whole computation is carried out standing inside the world where the claim is true.</p>' +
      '<p>One condition cannot be skipped. The statistic is read against the normal bell, but the actual number of favourable cases follows a binomial distribution, which is a count and not a continuous curve. The approximation works well when at least ten favourable and at least ten unfavourable cases are expected, that is when the sample size times the claimed proportion and the sample size times its complement both reach ten. With small samples or extreme proportions the approximation breaks and the probability has to be computed exactly with the binomial model.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Sample proportion</div><div class="rform">p̂ = ' + frac('x', 'n') + '</div><div class="rnote">Favourable cases over cases reviewed.</div></div>' +
        '<div class="rcard"><div class="rname">Standard error</div><div class="rform">√( p₀(1 − p₀) / n )</div><div class="rnote">It comes from the claimed proportion.</div></div>' +
        '<div class="rcard"><div class="rname">Statistic</div><div class="rform">z = ' + frac('p̂ − p₀', '√( p₀(1 − p₀)/n )') + '</div><div class="rnote">The gap measured in standard errors.</div></div>' +
        '<div class="rcard"><div class="rname">Conditions</div><div class="rform">n·p₀ ≥ 10 and n(1 − p₀) ≥ 10</div><div class="rnote">Without these the bell does not apply.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> An online store has a conversion rate of ' + pct1(c1p0) + ' percent on record, meaning that fraction of visits ends in a purchase. After redesigning the product page, the commercial team suspects the real conversion went up and reviews a random sample of ' + intN(c1n) + ' visits, of which ' + intN(c1x) + ' ended in a purchase. The review will run at a significance level of ' + pct1(c1al) + ' percent.</p>' +

  var q1i = {
    title: { es: 'La frontera de la decisión en conversión', en: 'The decision boundary in conversion' },

  };
  var d1 = mk(q1i, o1.correctIdx, true);
  problems.push({ i18n: d1.i18n, title: d1.title, questionText: d1.questionText, options: d1.options, correctIdx: d1.correctIdx, explanation: d1.explanation, hint: d1.hint, showWork: true, fn: 'frontera = p₀ + z꜀ · √( p₀(1 − p₀)/n )', studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Item 2 ── */

     'El estadístico vale ' + dec3(s2z) + ' y el valor crítico ' + dec3(-s2zc) + ', así que ' + (s2R ? 'no se rechaza la hipótesis nula y la cifra anunciada queda confirmada.' : 'se rechaza la hipótesis nula y la cifra anunciada queda desmentida.'),

  var q2i = {
    title: { es: 'Veredicto y redacción en una cola izquierda', en: 'Verdict and wording in a left tail' },

    exp: { es: 'La proporción observada es ' + intN(s2x) + ' entre ' + intN(p2n) + ', o sea ' + pct2(s2ph) + '. El error estándar bajo la nula vale ' + pr(s2se) + ', de modo que el estadístico vale ' + dec3(s2z) + ' y el valor crítico de una cola por la izquierda es ' + dec3(-s2zc) + '. ' + (s2R ? 'El estadístico queda por debajo de esa frontera, así que se rechaza la nula y la empresa cliente tiene una base cuantitativa para reclamar el nivel de servicio.' : 'El estadístico no baja de esa frontera, así que no se rechaza la nula: la diferencia observada cabe dentro del ruido normal del muestreo.') + ' Comparar directamente la proporción muestral contra la anunciada no sirve, porque casi ninguna muestra coincide con el parámetro y esa diferencia sola no prueba nada. Y la opción que dice que se acepta la nula y que la cifra queda demostrada es incorrecta en cualquier escenario: no rechazar significa que los datos son compatibles con la afirmación, no que la afirmación esté probada, y muchas proporciones cercanas serían igual de compatibles con esta misma muestra.',

  var c2se = seProp(c2p0, c2n);

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>El valor p y las pruebas de dos colas</h2>' +
      '<p>La regla del valor crítico entrega un veredicto, pero no dice por cuánto. Dos estudios pueden rechazar la misma nula, uno raspando la frontera y otro barriéndola, y el reporte los presentaría igual. El <strong>valor p</strong> resuelve ese problema: mide qué tan raro sería observar una proporción al menos tan alejada como la observada en un mundo donde la afirmación fuera cierta. Es una medida continua de sorpresa, y por eso se ha vuelto la forma estándar de reportar.</p>' +
      '<p>Su regla de decisión es directa: se rechaza la nula si el valor p no supera el nivel de significancia. Y esa regla nunca contradice a la del valor crítico, porque el valor crítico es precisamente el estadístico cuyo valor p vale exactamente alfa. Son la misma frontera vista desde dos lados, uno en la escala del estadístico y otro en la escala de la probabilidad.</p>' +
      '<p>Cuando la pregunta de negocio no tiene dirección, la prueba es de <strong>dos colas</strong> y el cálculo cambia en dos puntos. El valor crítico se toma con alfa repartido entre las dos colas, de modo que cada lado recibe la mitad, y el valor p se duplica, porque una proporción igual de alejada del otro lado también contaría como evidencia contra la afirmación. Por eso una misma muestra siempre produce un valor p mayor en dos colas que en una: la prueba sin dirección exige más evidencia, y renunciar a la dirección tiene un precio que conviene pagar solo cuando el negocio realmente no tiene una sospecha previa.</p>' +
      '<p>Falta la advertencia que más errores provoca en los reportes. El valor p <strong>no</strong> es la probabilidad de que la afirmación sea cierta, ni la probabilidad de haberse equivocado. Es una probabilidad calculada suponiendo que la nula es cierta, así que no puede a la vez medir la credibilidad de esa suposición. Tampoco mide el tamaño de lo que está en juego: con una muestra suficientemente grande, una diferencia de dos décimas de punto porcentual produce valores p diminutos sin que a nadie le cambie una decisión.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Valor p</div><div class="rform">P( evidencia | H₀ )</div><div class="rnote">La rareza del resultado bajo la nula.</div></div>' +
        '<div class="rcard"><div class="rname">Regla</div><div class="rform">p ≤ α → se rechaza</div><div class="rnote">Equivale a comparar contra el valor crítico.</div></div>' +
        '<div class="rcard"><div class="rname">Dos colas</div><div class="rform">p = 2 · P( z ≥ |z| )</div><div class="rnote">El riesgo se reparte entre los dos lados.</div></div>' +

      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una empresa de telefonía tiene registrado que ' + pct1(c2p0) + ' por ciento de sus clientes renueva el contrato al vencimiento. Después de cambiar el esquema de puntos, el área de retención no sospecha una dirección: quiere saber si la proporción real cambió, en cualquier sentido. Revisa ' + intN(c2n) + ' cuentas al azar y encuentra ' + intN(c2x) + ' renovaciones. El nivel de significancia es ' + pct1(c2al) + ' por ciento.</p>' +

      '<strong>Paso 2.</strong> La proporción observada es ' + pct2(c2ph) + ', el error estándar bajo la nula vale ' + pr(c2se) + ' y el estadístico ' + dec3(c2z) + '.<br>' +

        ? 'La tasa de renovación registrada quedó desactualizada y el área tiene evidencia suficiente para revisarla, aunque el valor p no dice cuánto dinero hay en juego: eso lo dice la diferencia de ' + dec1(Math.abs(c2ph - c2p0) * 100) + ' puntos porcentuales multiplicada por la base de clientes y por el valor de cada contrato.'
        : 'La tasa de renovación registrada sobrevive la revisión, pero eso no prueba que sea exacta: la diferencia observada de ' + dec1(Math.abs(c2ph - c2p0) * 100) + ' puntos porcentuales sigue siendo compatible con el azar, y con más cuentas la misma diferencia podría volverse significativa.') + '</p></div>';
    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>The p value and two tailed tests</h2>' +
      '<p>The critical value rule delivers a verdict, but it does not say by how much. Two studies can reject the same null, one scraping the boundary and one sweeping past it, and the report would present them alike. The <strong>p value</strong> fixes that: it measures how rare it would be to observe a proportion at least as far off as the observed one in a world where the claim were true. It is a continuous measure of surprise, and that is why it has become the standard way of reporting.</p>' +
      '<p>Its decision rule is direct: reject the null if the p value does not exceed the significance level. And that rule never contradicts the critical value rule, because the critical value is precisely the statistic whose p value equals alpha. They are the same boundary seen from two sides, one on the scale of the statistic and one on the scale of probability.</p>' +
      '<p>When the business question has no direction, the test is <strong>two tailed</strong> and the computation changes in two places. The critical value is taken with alpha split between the two tails, so each side gets half, and the p value doubles, because an equally distant proportion on the other side would also count as evidence against the claim. That is why the same sample always produces a larger p value with two tails than with one: the test without a direction demands more evidence, and giving up the direction has a cost worth paying only when the business genuinely has no prior suspicion.</p>' +
      '<p>One warning remains, the one that causes most mistakes in reports. The p value is <strong>not</strong> the probability that the claim is true, nor the probability of having made a mistake. It is a probability computed assuming the null is true, so it cannot at the same time measure how credible that assumption is. Neither does it measure the size of what is at stake: with a large enough sample, a gap of two tenths of a percentage point produces tiny p values without changing anybody decision.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">p value</div><div class="rform">P( evidence | H₀ )</div><div class="rnote">How rare the result is under the null.</div></div>' +
        '<div class="rcard"><div class="rname">Rule</div><div class="rform">p ≤ α → reject</div><div class="rnote">Same as comparing against the critical value.</div></div>' +
        '<div class="rcard"><div class="rname">Two tails</div><div class="rform">p = 2 · P( z ≥ |z| )</div><div class="rnote">The risk is split between both sides.</div></div>' +
        '<div class="rcard"><div class="rname">What it is not</div><div class="rform">p ≠ P( H₀ true )</div><div class="rnote">Nor does it measure importance.</div></div>' +

      '<p>La prueba de hipótesis y el intervalo de confianza para una proporción son casi el mismo cálculo con dos presentaciones. Ambos parten de la proporción observada, ambos usan un valor crítico de dos colas y ambos miden en errores estándar. La prueba pregunta si una cifra concreta es compatible con la muestra; el intervalo entrega de una vez todas las cifras que lo son, y por eso quien presenta un intervalo ya presentó implícitamente el resultado de infinitas pruebas.</p>' +

/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');
    if (st) st.innerHTML = p.questionText + '<span class="pfn">' + (p.fn || '') + '</span>';
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);

    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');

  });
})();

    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
