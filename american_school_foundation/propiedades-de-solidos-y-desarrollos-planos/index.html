<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propiedades de Sólidos y Desarrollos Planos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.mcv { display:block; width:100%; height:260px; touch-action:none; background:var(--surface); }
.mrow { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-top:.7rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .9rem; font-size:.82rem; cursor:pointer; color:var(--text2); font-family:inherit; min-height:44px; transition:all .14s; }
.mbtn:hover { border-color:var(--green); color:var(--green); }
.mbtn.on { background:var(--green-bg); border-color:var(--green); color:var(--green-dark); font-weight:600; }
.mbtn.go { background:var(--green); color:#fff; border-color:var(--green); }
.mbtn.go:hover { background:var(--green-dark); color:#fff; }
.mfb { margin-top:.7rem; padding:.6rem .85rem; border-radius:8px; font-size:.84rem; background:var(--surface2); color:var(--text2); border-left:3px solid var(--border); }
.mfb.good { background:var(--ok-bg); color:var(--ok); border-left-color:var(--ok); }
.mfb.near { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.mstat { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.mtile { background:var(--surface2); border-radius:8px; padding:.55rem .35rem; text-align:center; border:1.5px solid var(--border); }
.mtile.hit { border-color:var(--ok); background:var(--ok-bg); }
.mtile .tl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.mtile .tv { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--text); }
.mhead { display:flex; justify-content:space-between; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.4rem; }
.mtitle { font-weight:600; font-size:.95rem; }
.mround { font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.mgoal { background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.55rem .8rem; font-size:.85rem; color:var(--text2); margin-bottom:.6rem; }
.mnote { font-size:.76rem; color:var(--text3); margin-top:.5rem; }
@media (max-width:600px){ .mstat { grid-template-columns:1fr 1fr; } .mcv { height:230px; } .mbtn { font-size:.78rem; padding:.5rem .6rem; } }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Propiedades de Sólidos y Desarrollos Planos</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Propiedades de Sólidos y Desarrollos Planos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }

  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {

  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)

  function pdfText(html) {

    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')

function L(es, en){ return LANG === 'en' ? en : es; }
function cssv(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
function nf(v){ return String(Math.round(v * 1000) / 1000); }
function n2(v){ return (Math.round(v * 100) / 100).toFixed(2); }
function frac(n, d){ return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>'; }

  d.className = 'section';

function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return { options: a, correctIdx: a.indexOf(correct) };
}
function pushProb(spec, rng){
  var s = shuffleOpts(spec.options, spec.correct, rng);
  var prob = {
    title: spec.title, questionText: spec.questionText, fn: spec.fn || '',
    hint: spec.hint || '', explanation: spec.explanation || '',
    options: s.options, correctIdx: s.correctIdx, showWork: !!spec.showWork,
    studentChoice: null, pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ---------- canvas helpers ---------- */
function cvFit(id){
  var cv = document.getElementById(id);
  if (!cv) return null;
  var dpr = window.devicePixelRatio || 1;
  var r = cv.getBoundingClientRect();
  var w = Math.max(240, Math.round(r.width));
  var h = Math.max(190, Math.round(r.height));
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.font = '600 12px "IBM Plex Sans", sans-serif';
  return { ctx: ctx, w: w, h: h };
}
function pathPoly(ctx, pts, col, width, fill){
  ctx.save();
  ctx.beginPath();
  pts.forEach(function(p, i){ if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  ctx.strokeStyle = col; ctx.lineWidth = width; ctx.stroke();
  ctx.restore();
}
function dotsAt(ctx, pts, col){
  ctx.save(); ctx.fillStyle = col;
  pts.forEach(function(p){ ctx.beginPath(); ctx.arc(p.x, p.y, 3.1, 0, 2 * Math.PI); ctx.fill(); });
  ctx.restore();
}
function cvText(ctx, txt, x, y, col, align, size){
  ctx.save();
  ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.font = '500 ' + (size || 12) + 'px "IBM Plex Sans", sans-serif';
  ctx.fillText(txt, x, y);
  ctx.restore();
}
function setFb(id, txt, cls){
  var e = document.getElementById(id);
  if (!e) return;
  e.innerHTML = txt;
  e.className = 'mfb' + (cls ? ' ' + cls : '');
}

/* ================================================
   MANIPULATIVE 1 : Taller de poliedros
   The student picks the family (prisma / pirámide) and the number of
   sides of the base until caras, aristas and vértices hit the target.
   Live counters with directional arrows. Pattern B: 3 rounds.
   ================================================ */
var M1 = null;
function m1Counts(fam, n){
  return fam === 'prisma' ? { c:n + 2, a:3 * n, v:2 * n } : { c:n + 1, a:2 * n, v:n + 1 };
}
function m1Build(rng){
  var rounds = [], used = {}, guard = 0;
  while (rounds.length < 3 && guard++ < 60){
    var fam = rng() < 0.5 ? 'prisma' : 'piramide';
    var n = 3 + Math.floor(rng() * 6);
    var k = fam + n;
    if (used[k]) continue;
    used[k] = 1; rounds.push({ fam:fam, n:n });
  }
  while (rounds.length < 3) rounds.push({ fam:'prisma', n:3 + rounds.length });
  M1 = { rounds:rounds, round:0, tries:0, done:false, fam:'prisma', n:4 };
}
function m1Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Taller de poliedros', 'Polyhedron workshop') + '</div>' +
    '<div class="mround" id="m1r">' + L('Ronda 1 de 3', 'Round 1 of 3') + '</div></div>' +
    '<div class="mgoal" id="m1goal"></div>' +
    '<div class="cvwrap"><canvas class="mcv" id="m1cv"></canvas></div>' +
    '<div class="mrow">' +
      '<button class="mbtn" id="m1fp" onclick="m1Fam(\'prisma\')">' + L('Prisma', 'Prism') + '</button>' +
      '<button class="mbtn" id="m1fy" onclick="m1Fam(\'piramide\')">' + L('Pirámide', 'Pyramid') + '</button>' +
    '</div>' +
    '<div class="cgrid" style="margin-top:.7rem">' +
      '<div class="cg"><label>' + L('Lados de la base', 'Sides of the base') + ': <span class="cval" id="m1ln"></span></label>' +
        '<input type="range" id="m1n" min="3" max="8" step="1" oninput="m1Input()"></div>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile" id="m1tc"><div class="tl">' + L('Caras', 'Faces') + '</div><div class="tv" id="m1tvc">·</div></div>' +
      '<div class="mtile" id="m1ta"><div class="tl">' + L('Aristas', 'Edges') + '</div><div class="tv" id="m1tva">·</div></div>' +
      '<div class="mtile" id="m1tv"><div class="tl">' + L('Vértices', 'Vertices') + '</div><div class="tv" id="m1tvv">·</div></div>' +
    '</div>' +
    '<div class="mrow"><button class="mbtn go" onclick="m1Check()">' + L('Comprobar', 'Check') + '</button></div>' +
    '<div class="mfb" id="m1fb"></div>' +
  '</div>';
}
function m1Init(){ if (!document.getElementById('m1cv')) return; m1Round(); }
function m1Round(){
  if (!M1) return;
  var r = M1.rounds[M1.round], t = m1Counts(r.fam, r.n);
  var rr = document.getElementById('m1r'); if (!rr) return;
  rr.textContent = L('Ronda ' + (M1.round + 1) + ' de 3', 'Round ' + (M1.round + 1) + ' of 3');
  document.getElementById('m1goal').innerHTML = L(
    'Arma un cuerpo con <strong>' + t.c + '</strong> caras, <strong>' + t.a + '</strong> aristas y <strong>' + t.v + '</strong> vértices.',
    'Build a solid with <strong>' + t.c + '</strong> faces, <strong>' + t.a + '</strong> edges and <strong>' + t.v + '</strong> vertices.');
  document.getElementById('m1n').value = M1.n;
  setFb('m1fb', L('Cambia la familia o el número de lados y observa cómo responden los tres contadores.',
                  'Change the family or the number of sides and watch how the three counters respond.'), '');
  m1Input();
}
function m1Fam(f){ if (!M1 || M1.done) return; M1.fam = f; m1Input(); }
function m1Input(){
  var sl = document.getElementById('m1n'); if (!sl || !M1) return;
  M1.n = parseInt(sl.value, 10);
  document.getElementById('m1ln').textContent = M1.n;
  document.getElementById('m1fp').classList.toggle('on', M1.fam === 'prisma');
  document.getElementById('m1fy').classList.toggle('on', M1.fam === 'piramide');
  var cur = m1Counts(M1.fam, M1.n), r = M1.rounds[M1.round], tg = m1Counts(r.fam, r.n);
  var few = L('pocas', 'too few'), many = L('muchas', 'too many');
  function tile(id, tid, c, t){
    var el = document.getElementById(id), tv = document.getElementById(tid);
    if (!el) return;
    if (c === t){ el.classList.add('hit'); tv.textContent = c + ' ✓'; }
    else { el.classList.remove('hit'); tv.textContent = c + (c < t ? ' ▲ ' + few : ' ▼ ' + many); }
  }
  tile('m1tc', 'm1tvc', cur.c, tg.c);
  tile('m1ta', 'm1tva', cur.a, tg.a);
  tile('m1tv', 'm1tvv', cur.v, tg.v);
  m1Draw();
}
function m1Draw(){
  var f = cvFit('m1cv'); if (!f || !M1) return;
  var ctx = f.ctx, n = M1.n;
  var cx = f.w / 2, R = Math.min(f.w * 0.24, 78), ky = 0.40;
  var H = Math.min(f.h * 0.40, 92);
  var topY = f.h / 2 - H / 2 + 8, botY = f.h / 2 + H / 2 + 8;
  function poly(cy){
    var ps = [];
    for (var i = 0; i < n; i++){
      var a = -Math.PI / 2 + 2 * Math.PI * i / n;
      ps.push({ x:cx + R * Math.cos(a), y:cy + R * ky * Math.sin(a) });
    }
    return ps;
  }
  var base = poly(botY), col = cssv('--green'), tint = cssv('--green-bg');
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2.1;
  if (M1.fam === 'prisma'){
    var top = poly(topY);
    for (var i = 0; i < n; i++){ ctx.beginPath(); ctx.moveTo(base[i].x, base[i].y); ctx.lineTo(top[i].x, top[i].y); ctx.stroke(); }
    ctx.restore();
    pathPoly(ctx, base, col, 2.4, tint);
    pathPoly(ctx, top, col, 2.4, tint);
    dotsAt(ctx, base.concat(top), cssv('--gold'));
  } else {
    var ap = { x:cx, y:topY - 14 };
    for (var j = 0; j < n; j++){ ctx.beginPath(); ctx.moveTo(base[j].x, base[j].y); ctx.lineTo(ap.x, ap.y); ctx.stroke(); }
    ctx.restore();
    pathPoly(ctx, base, col, 2.4, tint);
    dotsAt(ctx, base.concat([ap]), cssv('--gold'));
  }
  var nm = M1.fam === 'prisma' ? L('prisma', 'prism') : L('pirámide', 'pyramid');
  cvText(ctx, nm + ' · ' + L('base de ' + n + ' lados', 'base with ' + n + ' sides'), 12, 18, cssv('--text3'), 'left', 12);
}
function m1Next(d){ setTimeout(function(){ if (M1 && !M1.done && M1.round < 3) m1Round(); }, d); }
function m1Check(){
  if (!M1 || M1.done) return;
  var r = M1.rounds[M1.round], tg = m1Counts(r.fam, r.n), cur = m1Counts(M1.fam, M1.n);
  if (cur.c === tg.c && cur.a === tg.a && cur.v === tg.v){
    M1.tries = 0; M1.round++;
    if (M1.round >= 3){
      M1.done = true;
      setFb('m1fb', L('Los tres cuerpos armados. 🎉 Fíjate en algo que se repitió siempre: caras más vértices te dio dos más que las aristas.',
                      'All three solids built. 🎉 Notice something that happened every time: faces plus vertices gave you two more than the edges.'), 'good');
      return;
    }
    setFb('m1fb', L('Justo ese. 🎉 Ahora otro cuerpo.', 'That is the one. 🎉 Now another solid.'), 'good');
    m1Next(1000);
    return;
  }
  M1.tries++;
  if (M1.tries >= 3){
    M1.fam = r.fam; M1.n = r.n;
    document.getElementById('m1n').value = r.n;
    m1Input();
    var nm = r.fam === 'prisma' ? L('un prisma', 'a prism') : L('una pirámide', 'a pyramid');
    setFb('m1fb', L('Era ' + nm + ' con base de ' + r.n + ' lados. Míralo armado y cuenta sus piezas con calma.',
                    'It was ' + nm + ' with a base of ' + r.n + ' sides. Look at it built and count its pieces calmly.'), 'near');
    M1.tries = 0; M1.round++;
    if (M1.round >= 3){ M1.done = true; return; }
    m1Next(1800);
    return;
  }
  var msg = [];
  if (cur.c !== tg.c) msg.push(L('caras', 'faces') + ': ' + (cur.c < tg.c ? L('faltan ', 'need ') : L('sobran ', 'extra ')) + Math.abs(tg.c - cur.c));
  if (cur.a !== tg.a) msg.push(L('aristas', 'edges') + ': ' + (cur.a < tg.a ? L('faltan ', 'need ') : L('sobran ', 'extra ')) + Math.abs(tg.a - cur.a));
  if (cur.v !== tg.v) msg.push(L('vértices', 'vertices') + ': ' + (cur.v < tg.v ? L('faltan ', 'need ') : L('sobran ', 'extra ')) + Math.abs(tg.v - cur.v));
  var extra = (cur.v === tg.v && cur.c !== tg.c) ? L(' Los vértices ya coinciden, prueba con la otra familia.', ' The vertices already match, try the other family.') : '';
  setFb('m1fb', L('Aún no: ', 'Not yet: ') + msg.join(' · ') + '.' + extra, 'near');
}

/* ================================================
   MANIPULATIVE 2 : Torno de revolución
   A plane profile is spun around the vertical axis; the sweep is drawn
   live as the student moves the angle. Pattern B: 3 rounds.
   ================================================ */
var M2 = null;
var M2SOLID = { rect:'cilindro', tri:'cono', semi:'esfera', trap:'tronco' };
function m2Prof(fig){
  if (fig === 'rect') return [[0, 0], [1, 0], [1, -1], [0, -1]];
  if (fig === 'tri')  return [[0, 0], [1, 0], [0, -1]];
  if (fig === 'trap') return [[0, 0], [1, 0], [0.45, -1], [0, -1]];
  var pts = [];
  for (var i = 0; i <= 12; i++){
    var t = -Math.PI / 2 + Math.PI * i / 12;
    pts.push([0.5 * Math.cos(t), -0.5 + 0.5 * Math.sin(t)]);
  }
  return pts;
}
function m2Name(s){
  if (s === 'cilindro') return L('un cilindro', 'a cylinder');
  if (s === 'cono') return L('un cono', 'a cone');
  if (s === 'esfera') return L('una esfera', 'a sphere');
  return L('un tronco de cono', 'a truncated cone');
}
function m2FigName(f){
  if (f === 'rect') return L('el rectángulo', 'the rectangle');
  if (f === 'tri') return L('el triángulo rectángulo', 'the right triangle');
  if (f === 'semi') return L('el semicírculo', 'the semicircle');
  return L('el trapecio', 'the trapezium');
}
function m2Build(rng){
  var order = shuffle(['cilindro', 'cono', 'esfera', 'tronco'], rng).slice(0, 3);
  M2 = { targets:order, round:0, tries:0, done:false, fig:'rect', ang:0 };
}
function m2Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Torno de revolución', 'Revolution lathe') + '</div>' +
    '<div class="mround" id="m2r">' + L('Ronda 1 de 3', 'Round 1 of 3') + '</div></div>' +
    '<div class="mgoal" id="m2goal"></div>' +
    '<div class="cvwrap"><canvas class="mcv" id="m2cv"></canvas></div>' +
    '<div class="mrow">' +
      '<button class="mbtn" id="m2brect" onclick="m2Fig(\'rect\')">' + L('Rectángulo', 'Rectangle') + '</button>' +
      '<button class="mbtn" id="m2btri" onclick="m2Fig(\'tri\')">' + L('Triángulo rectángulo', 'Right triangle') + '</button>' +
      '<button class="mbtn" id="m2bsemi" onclick="m2Fig(\'semi\')">' + L('Semicírculo', 'Semicircle') + '</button>' +
      '<button class="mbtn" id="m2btrap" onclick="m2Fig(\'trap\')">' + L('Trapecio', 'Trapezium') + '</button>' +
    '</div>' +
    '<div class="cgrid" style="margin-top:.7rem">' +
      '<div class="cg"><label>' + L('Giro alrededor del eje', 'Turn around the axis') + ': <span class="cval" id="m2la"></span>°</label>' +
        '<input type="range" id="m2a" min="0" max="360" step="10" oninput="m2Input()"></div>' +
    '</div>' +
    '<div class="mrow"><button class="mbtn go" onclick="m2Check()">' + L('Comprobar', 'Check') + '</button></div>' +
    '<div class="mfb" id="m2fb"></div>' +
  '</div>';
}
function m2Init(){ if (!document.getElementById('m2cv')) return; m2Round(); }
function m2Round(){
  if (!M2) return;
  var rr = document.getElementById('m2r'); if (!rr) return;
  rr.textContent = L('Ronda ' + (M2.round + 1) + ' de 3', 'Round ' + (M2.round + 1) + ' of 3');
  document.getElementById('m2goal').innerHTML = L(
    'Genera <strong>' + m2Name(M2.targets[M2.round]) + '</strong>: elige la figura plana y hazla girar.',
    'Generate <strong>' + m2Name(M2.targets[M2.round]) + '</strong>: pick the plane figure and spin it.');
  M2.ang = 0;
  document.getElementById('m2a').value = 0;
  setFb('m2fb', L('La línea punteada es el eje. Mueve el control y mira qué va dejando la figura al girar.',
                  'The dashed line is the axis. Move the control and watch what the figure leaves behind as it turns.'), '');

}
function m2Fig(f){ if (!M2 || M2.done) return; M2.fig = f; m2Input(); }
function m2Input(){
  var sl = document.getElementById('m2a'); if (!sl || !M2) return;
  M2.ang = parseInt(sl.value, 10);
  document.getElementById('m2la').textContent = M2.ang;
  ['rect', 'tri', 'semi', 'trap'].forEach(function(k){
    var b = document.getElementById('m2b' + k);
    if (b) b.classList.toggle('on', M2.fig === k);
  });
  m2Draw();
}
function m2Draw(){
  var f = cvFit('m2cv'); if (!f || !M2) return;
  var ctx = f.ctx, prof = m2Prof(M2.fig);
  var cx = f.w / 2, S = Math.min(f.w * 0.26, f.h * 0.36), ky = 0.42;
  var yb = f.h / 2 + S * 0.55;
  function P(r, y, phi){ return { x:cx + r * S * Math.cos(phi), y:yb + y * S + r * S * ky * Math.sin(phi) }; }
  ctx.save();
  ctx.strokeStyle = cssv('--text3'); ctx.setLineDash([5, 5]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(cx, yb - S * 1.35); ctx.lineTo(cx, yb + S * 0.55); ctx.stroke();
  ctx.restore();
  var A = M2.ang * Math.PI / 180;
  var steps = Math.max(0, Math.round(M2.ang / 9));
  ctx.save(); ctx.globalAlpha = 0.20; ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 1.5;
  for (var i = 1; i <= steps; i++){
    var phi = A * i / steps;
    ctx.beginPath();
    prof.forEach(function(pt, k){ var q = P(pt[0], pt[1], phi); if (k === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y); });
    ctx.stroke();
  }
  ctx.restore();
  if (A > 0.01){
    ctx.save(); ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 1.7; ctx.globalAlpha = 0.85;
    var every = Math.max(1, Math.ceil(prof.length / 4));
    prof.forEach(function(pt, k){
      if (pt[0] <= 0.03 || (k % every !== 0 && k !== prof.length - 1)) return;
      ctx.beginPath();
      ctx.ellipse(cx, yb + pt[1] * S, pt[0] * S, pt[0] * S * ky, 0, 0, A);
      ctx.stroke();
    });
    ctx.restore();
  }
  ctx.save(); ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 3;
  ctx.beginPath();
  prof.forEach(function(pt, k){ var q = P(pt[0], pt[1], 0); if (k === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y); });
  ctx.closePath(); ctx.stroke(); ctx.restore();
  cvText(ctx, m2FigName(M2.fig), 12, 18, cssv('--green'), 'left', 12);
  cvText(ctx, M2.ang + '° ' + L('de giro', 'turned'), f.w - 12, 18, cssv('--gold'), 'right', 12);
}
function m2Next(d){ setTimeout(function(){ if (M2 && !M2.done && M2.round < 3) m2Round(); }, d); }
function m2Check(){
  if (!M2 || M2.done) return;
  var tgt = M2.targets[M2.round], got = M2SOLID[M2.fig];

    setFb('m2fb', L('La figura es la correcta, pero solo llevas ' + M2.ang + '° de giro: lleva el control hasta 360° para cerrar el cuerpo.',
                    'The figure is right, but you have only turned ' + M2.ang + '°: take the control to 360° to close the solid.'), 'near');
    return;
  }
  if (got === tgt){
    M2.tries = 0; M2.round++;
    if (M2.round >= 3){
      M2.done = true;
      setFb('m2fb', L('Tres cuerpos generados. 🎉 En todos, cada punto de la figura dibujó una circunferencia alrededor del eje.',
                      'Three solids generated. 🎉 In all of them, every point of the figure traced a circle around the axis.'), 'good');
      return;
    }
    setFb('m2fb', L('Cerrado y completo. 🎉 Va el siguiente.', 'Closed and complete. 🎉 Next one.'), 'good');
    m2Next(1000);
    return;
  }
  M2.tries++;
  if (M2.tries >= 3){
    var right = 'rect';
    Object.keys(M2SOLID).forEach(function(k){ if (M2SOLID[k] === tgt) right = k; });
    M2.fig = right; M2.ang = 360;
    document.getElementById('m2a').value = 360;
    m2Input();
    setFb('m2fb', L('Para ' + m2Name(tgt) + ' hacía falta ' + m2FigName(right) + '. Ahí lo tienes girado por completo.',
                    'For ' + m2Name(tgt) + ' you needed ' + m2FigName(right) + '. There it is, fully spun.'), 'near');
    M2.tries = 0; M2.round++;
    if (M2.round >= 3){ M2.done = true; return; }
    m2Next(1900);
    return;
  }
  setFb('m2fb', L('Con esa figura sale ' + m2Name(got) + ', no ' + m2Name(tgt) + '. Fíjate en cómo toca el eje: si termina en punta sale un vértice, si el lado es paralelo al eje sale una pared recta y si el borde es curvo sale una superficie redonda.',
                  'That figure gives ' + m2Name(got) + ', not ' + m2Name(tgt) + '. Look at how it meets the axis: a point gives a vertex, a side parallel to the axis gives a straight wall and a curved edge gives a round surface.'), 'near');
}

/* ================================================
   MANIPULATIVE 3 : Ajusta el desarrollo del cilindro

var M3 = null;
function m3Build(rng){

  var rounds = rs.map(function(r){ return { r:r, h:6 + Math.floor(rng() * 6) }; });

}
function m3Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Ajusta el desarrollo de la lata', 'Adjust the net of the can') + '</div>' +

      '<div class="cg"><label>' + L('Largo del rectángulo', 'Length of the rectangle') + ': <span class="cval" id="m3lw"></span> cm</label>' +

    '</div>' +

      '<div class="mtile" id="m3t1"><div class="tl">' + L('Contorno de la tapa', 'Lid contour') + '</div><div class="tv" id="m3v1">·</div></div>' +
      '<div class="mtile" id="m3t2"><div class="tl">' + L('Largo elegido', 'Chosen length') + '</div><div class="tv" id="m3v2">·</div></div>' +
      '<div class="mtile" id="m3t3"><div class="tl">' + L('Cobertura', 'Coverage') + '</div><div class="tv" id="m3v3">·</div></div>' +

function m3Init(){ if (!document.getElementById('m3cv')) return; m3Round(); }
function m3Round(){

  var rr = document.getElementById('m3r'); if (!rr) return;

  rr.textContent = L('Ronda ' + (M3.round + 1) + ' de 3', 'Round ' + (M3.round + 1) + ' of 3');
  document.getElementById('m3goal').innerHTML = L(
    'Prepara el desarrollo de una lata de <strong>' + t.r + ' cm</strong> de radio y <strong>' + t.h + ' cm</strong> de altura, sin traslapes ni huecos.',
    'Prepare the net of a can with radius <strong>' + t.r + ' cm</strong> and height <strong>' + t.h + ' cm</strong>, with no overlap and no gap.');

                  'The green arc on the lid shows how far the rectangle manages to wrap around it.'), '');

function m3Input(){

  document.getElementById('m3lr').textContent = M3.r;
  document.getElementById('m3lw').textContent = n2(M3.W);

  var t = M3.rounds[M3.round];
  var e1 = document.getElementById('m3t1'), e2 = document.getElementById('m3t2'), e3 = document.getElementById('m3t3');

function m3Draw(){
  var f = cvFit('m3cv'); if (!f || !M3) return;
  var ctx = f.ctx, r = M3.r, W = M3.W, h = M3.rounds[M3.round].h;
  var totW = Math.max(W, 2 * r + 2), totH = h + 4 * r;
  var sc = Math.min((f.w - 40) / totW, (f.h - 26) / totH);
  var rw = W * sc, rh = h * sc, cr = r * sc;
  var cx = f.w / 2, x0 = cx - rw / 2, y0 = f.h / 2 - rh / 2;
  ctx.save();
  ctx.fillStyle = cssv('--green-bg'); ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.rect(x0, y0, rw, rh); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.fillStyle = cssv('--gold-bg'); ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, y0 - cr - 3, cr, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, y0 + rh + cr + 3, cr, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  ctx.restore();
  var C = 6.28 * r, fr = W / C;
  ctx.save(); ctx.lineWidth = 4.2; ctx.strokeStyle = cssv('--green');
  ctx.beginPath(); ctx.arc(cx, y0 - cr - 3, cr, -Math.PI / 2, -Math.PI / 2 + Math.min(fr, 1) * 2 * Math.PI); ctx.stroke();
  if (fr > 1){
    ctx.strokeStyle = cssv('--bad');
    ctx.beginPath(); ctx.arc(cx, y0 - cr - 3, cr + 6, -Math.PI / 2, -Math.PI / 2 + Math.min(fr - 1, 1) * 2 * Math.PI); ctx.stroke();
  }
  ctx.restore();
  cvText(ctx, n2(W) + ' cm', cx, y0 + rh + 3 + cr * 2 + 12, cssv('--text3'), 'center', 11);
  cvText(ctx, h + ' cm', x0 - 8, y0 + rh / 2, cssv('--text3'), 'right', 11);
  cvText(ctx, 'r = ' + r + ' cm', 12, 18, cssv('--gold'), 'left', 12);
}
function m3Next(d){ setTimeout(function(){ if (M3 && !M3.done && M3.round < 3) m3Round(); }, d); }
function m3Check(){
  if (!M3 || M3.done) return;
  var t = M3.rounds[M3.round], C = 6.28 * t.r, d = M3.W - 6.28 * M3.r;
  if (M3.r === t.r && Math.abs(M3.W - C) <= 0.16){
    M3.tries = 0; M3.round++;
    if (M3.round >= 3){
      M3.done = true;
      setFb('m3fb', L('Las tres latas quedaron perfectas. 🎉 En todas, el largo del rectángulo resultó ser el contorno de la tapa.',
                      'All three cans came out perfect. 🎉 In all of them, the length of the rectangle turned out to be the contour of the lid.'), 'good');
      return;
    }
    setFb('m3fb', L('Cierra exacto. 🎉 Va otra lata.', 'It closes exactly. 🎉 Another can now.'), 'good');
    m3Next(1000);
    return;
  }
  M3.tries++;
  if (M3.tries >= 3){
    var Wr = Math.round(C / 0.2) * 0.2;
    M3.r = t.r; M3.W = Wr;
    document.getElementById('m3rr').value = t.r;

   A net is drawn on the canvas and the student names the solid it folds

var M4 = null;
function m4Build(rng){
  M4 = { kinds:shuffle(['cilindro', 'cono', 'piramide', 'prisma'], rng).slice(0, 3), round:0, tries:0, done:false, pickd:null };
}
function m4Name(k){
  if (k === 'cilindro') return L('un cilindro', 'a cylinder');
  if (k === 'cono') return L('un cono', 'a cone');
  if (k === 'piramide') return L('una pirámide de base cuadrada', 'a square based pyramid');
  return L('un prisma de base triangular', 'a triangular prism');
}
function m4Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('¿Qué se arma con este desarrollo?', 'What folds up from this net?') + '</div>' +
    '<div class="mround" id="m4r">' + L('Ronda 1 de 3', 'Round 1 of 3') + '</div></div>' +
    '<div class="mgoal">' + L('Observa las piezas del recorte y decide qué cuerpo se forma al doblarlo.',
                              'Look at the pieces of the cut-out and decide which solid is formed when it is folded.') + '</div>' +
    '<div class="cvwrap"><canvas class="mcv" id="m4cv"></canvas></div>' +
    '<div class="mrow">' +
      '<button class="mbtn" onclick="m4Pick(\'cilindro\')">' + L('Cilindro', 'Cylinder') + '</button>' +
      '<button class="mbtn" onclick="m4Pick(\'cono\')">' + L('Cono', 'Cone') + '</button>' +
      '<button class="mbtn" onclick="m4Pick(\'piramide\')">' + L('Pirámide de base cuadrada', 'Square based pyramid') + '</button>' +
      '<button class="mbtn" onclick="m4Pick(\'prisma\')">' + L('Prisma de base triangular', 'Triangular prism') + '</button>' +
    '</div>' +
    '<div class="mfb" id="m4fb"></div>' +
  '</div>';
}
function m4Init(){ if (!document.getElementById('m4cv')) return; m4Round(); }
function m4Round(){
  if (!M4) return;
  var rr = document.getElementById('m4r'); if (!rr) return;
  rr.textContent = L('Ronda ' + (M4.round + 1) + ' de 3', 'Round ' + (M4.round + 1) + ' of 3');
  setFb('m4fb', L('Cuenta las piezas y fíjate en cuáles tienen borde curvo.',
                  'Count the pieces and notice which ones have a curved edge.'), '');
  m4Draw();
}
function m4Draw(){
  var f = cvFit('m4cv'); if (!f || !M4) return;
  var ctx = f.ctx, k = M4.kinds[M4.round];
  var sc = Math.min(f.w / 330, f.h / 255);
  var col = cssv('--green'), tint = cssv('--green-bg'), col2 = cssv('--gold'), tint2 = cssv('--gold-bg');
  ctx.save();
  ctx.translate(f.w / 2, f.h / 2); ctx.scale(sc, sc); ctx.lineWidth = 2 / sc;
  function poly(pts, c, fill){
    ctx.beginPath();
    pts.forEach(function(p, i){ if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = c; ctx.stroke();
  }
  if (k === 'cilindro'){
    poly([[-85, -45], [85, -45], [85, 45], [-85, 45]], col, tint);
    ctx.beginPath(); ctx.arc(0, -75, 28, 0, 2 * Math.PI); ctx.fillStyle = tint2; ctx.fill(); ctx.strokeStyle = col2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 75, 28, 0, 2 * Math.PI); ctx.fillStyle = tint2; ctx.fill(); ctx.strokeStyle = col2; ctx.stroke();
  } else if (k === 'cono'){
    ctx.beginPath();
    ctx.moveTo(0, -100);
    ctx.arc(0, -100, 112, 25 * Math.PI / 180, 155 * Math.PI / 180);
    ctx.closePath();
    ctx.fillStyle = tint; ctx.fill(); ctx.strokeStyle = col; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 82, 30, 0, 2 * Math.PI); ctx.fillStyle = tint2; ctx.fill(); ctx.strokeStyle = col2; ctx.stroke();
  } else if (k === 'piramide'){
    poly([[-45, -45], [45, -45], [45, 45], [-45, 45]], col, tint);
    poly([[-45, -45], [45, -45], [0, -112]], col2, tint2);
    poly([[-45, 45], [45, 45], [0, 112]], col2, tint2);
    poly([[-45, -45], [-45, 45], [-112, 0]], col2, tint2);
    poly([[45, -45], [45, 45], [112, 0]], col2, tint2);
  } else {
    poly([[-105, -35], [105, -35], [105, 35], [-105, 35]], col, tint);
    ctx.beginPath(); ctx.moveTo(-35, -35); ctx.lineTo(-35, 35); ctx.moveTo(35, -35); ctx.lineTo(35, 35);
    ctx.strokeStyle = col; ctx.stroke();
    poly([[-35, -35], [35, -35], [0, -96]], col2, tint2);
    poly([[-35, 35], [35, 35], [0, 96]], col2, tint2);
  }
  ctx.restore();
}
function m4Next(d){ setTimeout(function(){ if (M4 && !M4.done && M4.round < 3) m4Round(); }, d); }
function m4Pick(sel){
  if (!M4 || M4.done) return;
  var k = M4.kinds[M4.round];
  if (sel === k){
    M4.tries = 0; M4.round++;
    if (M4.round >= 3){
      M4.done = true;
      setFb('m4fb', L('Los tres identificados. 🎉 Las piezas curvas delatan a los cuerpos redondos y los polígonos a los poliedros.',
                      'All three identified. 🎉 Curved pieces give away round solids and polygons give away polyhedra.'), 'good');
      return;
    }
    setFb('m4fb', L('Correcto. 🎉 Ahí va otro recorte.', 'Correct. 🎉 Here comes another cut-out.'), 'good');
    m4Next(1000);
    return;
  }
  M4.tries++;
  if (M4.tries >= 3){
    setFb('m4fb', L('Este recorte arma ' + m4Name(k) + '. Repasa sus piezas antes de pasar al siguiente.',
                    'This cut-out folds into ' + m4Name(k) + '. Go over its pieces before moving on.'), 'near');
    M4.tries = 0; M4.round++;
    if (M4.round >= 3){ M4.done = true; return; }
    m4Next(1900);
    return;
  }
  var tips = {
    cilindro: L('Ese cuerpo no llevaría dos piezas redondas iguales unidas a un rectángulo.',
                'That solid would not carry two equal round pieces joined to a rectangle.'),
    cono: L('Ese cuerpo no llevaría una pieza en forma de abanico con una sola tapa redonda.',
            'That solid would not carry a fan shaped piece with a single round lid.'),
    piramide: L('Ese cuerpo no llevaría cuatro triángulos iguales alrededor de un solo cuadrado.',
                'That solid would not carry four equal triangles around a single square.'),
    prisma: L('Ese cuerpo no llevaría tres rectángulos en fila con un triángulo en cada extremo.',
              'That solid would not carry three rectangles in a row with a triangle at each end.')
  };
  setFb('m4fb', L('Todavía no. ', 'Not yet. ') + tips[k], 'near');
}
