<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potencias, Raíces y Notación Científica · Matemáticas Básicas · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/matematicas_basicas/mat_potencias.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }
sup { font-size:.68em; line-height:0; vertical-align:super; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:var(--green);line-height:1">ALEXIS</div>
    </div>
    </div>
    <div class="wtitle" id="wtitle-el">Potencias, Raíces y Notación Científica</div>
    <div class="wcourse" id="wcourse-el">Matemáticas Básicas</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Potencias, Raíces y Notación Científica</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Descargar resultados en PDF</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',

function getAttemptKey(name, group) {
  return 'fac_econ_mat__mat_potencias__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function dec1(x)   { return x.toFixed(1); }
function dec2(x)   { return x.toFixed(2); }
function dec3(x)   { return x.toFixed(3); }
function dec4(x)   { return x.toFixed(4); }
/* Rate as an option value, always two decimals so four choices stay distinct. */
function pct2(x)   { return nfD(x * 100, 2) + '%'; }
function pct1(x)   { return nfD(x * 100, 1) + '%'; }
function pct0(x)   { return nf(Math.round(x * 100)) + '%'; }
function intN(x)   { return nf(Math.round(x)); }
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
/* Money on a chart axis, where the value may legitimately be negative. */
function moneyAx(v) { return v < 0 ? '−$' + nf(Math.round(-v)) : '$' + nf(Math.round(v)); }

/* Periods and counts, named in the language of the reader. */
function yearsEs(x)  { return intN(x) + (Math.round(x) === 1 ? ' año'  : ' años'); }
function yearsEn(x)  { return intN(x) + (Math.round(x) === 1 ? ' year' : ' years'); }
function monthsEs(x) { return intN(x) + (Math.round(x) === 1 ? ' mes'   : ' meses'); }
function monthsEn(x) { return intN(x) + (Math.round(x) === 1 ? ' month' : ' months'); }
function homesEs(x)  { return intN(x) + ' hogares'; }
function homesEn(x)  { return intN(x) + ' households'; }
/* A power written the way a report writes it, with a real exponent. */
function powHtml(base, ex) { return base + '<sup>' + ex + '</sup>'; }
function facHtml(ex)       { return '(1 + i)<sup>' + ex + '</sup>'; }
/* Scientific notation: HTML for the page, caret form for the canvas. */
function sciHtml(m, e) { return dec2(m) + ' × 10<sup>' + intN(e) + '</sup>'; }
function sciTxt(m, e)  { return dec2(m) + ' x 10^' + intN(e); }
function sciOf(v) {
  var e = Math.floor(Math.log(Math.abs(v)) / Math.LN10);
  return { m: v / Math.pow(10, e), e: e };
}
function sciAuto(v) { var s = sciOf(v); return sciHtml(s.m, s.e); }
/* A change named by its direction, so no minus sign ever meets a percent sign. */
function moveEs(v) { return v >= 0 ? pct2(v) + ' de aumento' : pct2(-v) + ' de caída'; }
function moveEn(v) { return v >= 0 ? pct2(v) + ' of growth'  : pct2(-v) + ' of decline'; }
function moveEs1(v) { return v >= 0 ? pct1(v) + ' de aumento' : pct1(-v) + ' de caída'; }
function moveEn1(v) { return v >= 0 ? pct1(v) + ' of growth'  : pct1(-v) + ' of decline'; }

/* ── 1 · POWERS AND THE LAWS OF EXPONENTS ────────────────────────────────
   In business the base of a power is almost never a plain number: it is a
   factor, one peso plus the rate. Multiplying two horizons of the same
   factor adds their exponents, which is why compound growth is a power and
   never a multiplication of the rate by the number of periods. */
function growFactor(i, n)   { return Math.pow(1 + i, n); }
function futureValue(V, i, n) { return V * growFactor(i, n); }
/* What a simple, non compounding reading of the same rate would give. */
function simpleValue(V, i, n) { return V * (1 + i * n); }
/* The slip of raising the rate instead of the factor. */
function rateAsBase(V, i, n)  { return V * (1 + Math.pow(i, n)); }

/* ── 2 · ROOTS, FRACTIONAL EXPONENTS AND THE AVERAGE RATE ────────────────
   A root undoes a power, so it is the exponent written as a fraction. The
   average annual growth of a business is a root and not a division, because
   the periods multiply each other instead of adding up. */
function totalFactor(V0, Vn) { return V0 <= 0 ? null : Vn / V0; }
function cagr(V0, Vn, n)     { return (V0 <= 0 || n <= 0) ? null : Math.pow(Vn / V0, 1 / n) - 1; }
/* The report that spreads the whole change over the years by dividing. */
function flatSplit(V0, Vn, n) { return (V0 <= 0 || n <= 0) ? null : (Vn / V0 - 1) / n; }
/* The rate of a shorter period that compounds to the same annual figure. */
function subRate(i, k)  { return Math.pow(1 + i, 1 / k) - 1; }
function effAnnual(r, k) { return Math.pow(1 + r, k) - 1; }
/* Two periods chained, and the constant rate that would replace them. */
function chainChange(up, down) { return (1 + up) * (1 - down) - 1; }
function geoMean2(net)         { return Math.sqrt(1 + net) - 1; }

/* ── 3 · ZERO AND NEGATIVE EXPONENTS: THE VALUE OF TODAY ─────────────────
   A negative exponent is the reciprocal of the same power, so discounting
   divides where growing multiplies. The zero exponent is today, and it is
   worth one because nothing has happened yet. */
function pvFactor(i, n)      { return Math.pow(1 + i, -n); }
function presentValue(F, i, n) { return F * pvFactor(i, n); }
/* Taking the rate off by subtraction, which is not the same as dividing. */
function flatDiscount(F, i, n) { return F * (1 - i * n); }
function ratioDiscount(F, i, n) { return F / (1 + i * n); }

/* ── 4 · SCIENTIFIC NOTATION AND ORDERS OF MAGNITUDE ─────────────────────
   Normalized notation puts one digit before the point and hands the size of
   the figure to the exponent, so that a product adds exponents and a
   quotient subtracts them, exactly as in the first block. */
function sciValue(m, e)     { return m * Math.pow(10, e); }
function sciQuotient(m1, e1, m2, e2) { return (m1 / m2) * Math.pow(10, e1 - e2); }
function sciProduct(m1, e1, m2, e2)  { return (m1 * m2) * Math.pow(10, e1 + e2); }
function magnitudeGap(a, b) { return Math.round(Math.log(a / b) / Math.LN10); }

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers, each rendered once per language and kept aligned.
   The key is always the first value handed in. */
function valOpts2(correct, wrongs, fmtEs, fmtEn, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmtEn(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(v);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.11 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.41);
  return shuffleOpts(vals.map(fmtEs), vals.map(fmtEn), rng);
}
function valOpts(correct, wrongs, fmt, rng) {
  return valOpts2(correct, wrongs, fmt, fmt, rng);
}

function restoreSession() {

  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };

  var att = currentAttempt(name, group);

  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;

    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {

      if (!dataUrl) return;

      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';

   CANVAS / TABS / PHOTO / HINT / RESULTS
   ════════════════════════════════════════════════════════════════════════ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  return P.dark;
}
/* Plots any curve given as a function of a horizon, a rate or a count.
   A compounded amount, the value of a future peso and the path of an
   average rate are all the same picture to this routine.
     opts.marks  points worth naming, such as the horizon in force today
     opts.band   the stretch of the horizontal axis worth highlighting
     opts.hline  a reference amount drawn as a horizontal line
     opts.asym   the limit a curve approaches without reaching
     opts.at     where the student is standing right now                     */
function drawCurveChart(g, xMin, xMax, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 58, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var fmtY  = opts.fmtY || function(v) { return intN(v); };
  var fmtX  = opts.fmtX || function(v) { return intN(v); };
  var STEPS = 140;
  var yLo = null, yHi = null;
  function note(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (yLo === null || v < yLo) yLo = v;
    if (yHi === null || v > yHi) yHi = v;
  }
  series.forEach(function(s) {
    for (i = 0; i <= STEPS; i++) note(s.f(xMin + (xMax - xMin) * i / STEPS));
  });
  note(opts.yFloor); note(opts.yCeil);
  if (opts.hline) note(opts.hline.y);
  if (opts.asym)  note(opts.asym.y);
  if (yLo === null) { yLo = 0; yHi = 1; }
  if (yHi - yLo < 1e-9) yHi = yLo + 1;
  var pd = (yHi - yLo) * 0.10;
  yLo -= pd; yHi += pd;
  function X(v) { return padL + (v - xMin) / (xMax - xMin) * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }
  function Yc(v) { return Math.max(padT - 10, Math.min(H - padB + 10, Y(v))); }

  if (opts.band && opts.band.to > opts.band.from) {
    var b1 = X(Math.max(xMin, opts.band.from)), b2 = X(Math.min(xMax, opts.band.to));
    if (b2 > b1) {
      ctx.save();
      ctx.fillStyle = P.tint;
      ctx.fillRect(b1, padT - 8, b2 - b1, H - padB - padT + 8);
      ctx.restore();
    }
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  if (opts.asym) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.asym.y)); ctx.lineTo(W - padR, Y(opts.asym.y)); ctx.stroke();
    ctx.restore();
    if (opts.asym.label) {
      ctx.fillStyle = P.bad; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      ctx.fillText(opts.asym.label, padL + 4, Math.max(10, Y(opts.asym.y) - 4));
    }
  }
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  series.forEach(function(s) {
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = 2.2;
    if (s.dash) { ctx.save(); ctx.setLineDash([5, 4]); }
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= STEPS; i++) {
      var xv = xMin + (xMax - xMin) * i / STEPS;
      var yv = s.f(xv);
      if (typeof yv !== 'number' || !isFinite(yv)) { started = false; continue; }
      var px = X(xv), py = Yc(yv);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
    if (s.dash) ctx.restore();
  });
  (opts.marks || []).forEach(function(m) {
    if (typeof m.x !== 'number' || !isFinite(m.x) || m.x < xMin || m.x > xMax) return;
    var cx = X(m.x), cy = Yc(m.y);
    ctx.save();
    ctx.strokeStyle = kindColor(P, m.kind || 'gold'); ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = kindColor(P, m.kind || 'gold');
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (m.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var mw = ctx.measureText(m.label).width;
      ctx.fillText(m.label, Math.min(Math.max(2, cx - mw / 2), W - mw - 2), Math.max(10, cy - 9));
    }
  });
  if (typeof opts.at === 'number' && opts.at >= xMin && opts.at <= xMax) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(opts.at), H - padB); ctx.lineTo(X(opts.at), padT - 6); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [xMin, (xMin + xMax) / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}
/* A ladder of powers of ten, where every quantity stands at the place its
   exponent gives it. Two figures that look close on a page can sit whole
   rungs apart here, and that distance is the order of magnitude.          */
function drawMagnitudeLadder(g, items, eMin, eMax, xLabel) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 22, padR = 16, base = H - 34;
  function X(e) { return padL + (e - eMin) / (eMax - eMin) * (W - padL - padR); }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, base); ctx.lineTo(W - padR, base); ctx.stroke();
  ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = eMin; i <= eMax; i++) {
    var px = X(i);
    ctx.strokeStyle = P.border; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, base - 5); ctx.lineTo(px, base + 5); ctx.stroke();
    var lab = '10^' + i;
    ctx.fillStyle = P.text3;
    ctx.fillText(lab, Math.min(Math.max(1, px - ctx.measureText(lab).width / 2), W - 20), base + 17);
  }
  items.forEach(function(it, k) {
    if (typeof it.value !== 'number' || !isFinite(it.value) || it.value <= 0) return;
    var e = Math.log(it.value) / Math.LN10;
    if (e < eMin) e = eMin;
    if (e > eMax) e = eMax;
    var px = X(e), col = kindColor(P, it.kind || 'green');
    var stem = 20 + (k % 3) * 26;
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(px, base); ctx.lineTo(px, base - stem); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(px, base - stem, 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
    var lw = ctx.measureText(it.label).width;
    ctx.fillText(it.label, Math.min(Math.max(2, px - lw / 2), W - lw - 2), base - stem - 7);
  });
  if (xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    ctx.fillText(xLabel, W - padR - ctx.measureText(xLabel).width, H - 3);
  }
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · the exponent is the horizon, and it never adds up
   ════════════════════════════════════════════════════════════════════════ */
function widgetPower(V0, gp0, n0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'compuesto', V: V0, gp: gp0, n: n0 };
  function mount() {

      { id: 'compuesto', es: 'La potencia contra la multiplicación', en: 'The power against the multiplication' },
      { id: 'leyes',     es: 'Dos horizontes seguidos',              en: 'Two horizons one after the other' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="potencias-crecimiento-compuesto">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El exponente es el horizonte' : 'The exponent is the horizon') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Planeación comercial de Distribuidora del Pacífico proyecta las ventas de la línea blanca a varios años con una sola tasa anual. La primera vista pone frente a frente las dos lecturas posibles de esa tasa: la curva verde aplica la tasa sobre las ventas que ya crecieron, es decir eleva el factor al número de años, y la línea gris aplica la tasa siempre sobre las ventas de hoy, que es multiplicar la tasa por los años. Mueve el horizonte y observa cómo la distancia entre las dos no crece parejo sino cada vez más rápido: esa separación es toda la diferencia entre una potencia y una multiplicación, y es la cifra que se pierde una empresa cuando presupuesta en línea recta. La segunda vista parte el horizonte en dos tramos. El primer tramo deja un factor, el segundo deja otro, y al multiplicarlos aparece exactamente el factor del horizonte completo: los exponentes se suman porque los factores se multiplican. Ahí verás también que duplicar el horizonte no duplica el crecimiento acumulado, sino que eleva el factor al cuadrado.'
          : 'Commercial planning at Distribuidora del Pacífico projects appliance sales several years out with a single annual rate. The first view sets the two possible readings of that rate against each other: the green curve applies the rate to sales that have already grown, which is raising the factor to the number of years, and the grey line applies the rate to today’s sales every time, which is multiplying the rate by the years. Move the horizon and watch how the gap between them does not grow evenly but faster and faster: that separation is the whole difference between a power and a multiplication, and it is the figure a company loses when it budgets in a straight line. The second view splits the horizon into two stretches. The first stretch leaves one factor, the second leaves another, and multiplying them gives exactly the factor of the whole horizon: the exponents add because the factors multiply. There you will also see that doubling the horizon does not double the accumulated growth, it squares the factor.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Ventas del año en curso' : 'Sales in the current year') + ': <span class="cval" id="w1Vl"></span></label>' +
          '<input type="range" min="1000000" max="6000000" step="200000" id="w1V" value="' + state.V + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Tasa anual de crecimiento' : 'Annual growth rate') + ': <span class="cval" id="w1gl"></span></label>' +
          '<input type="range" min="2" max="20" step="1" id="w1g" value="' + state.gp + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Horizonte de la proyección' : 'Horizon of the projection') + ': <span class="cval" id="w1nl"></span></label>' +

        '</div><div class="cg">' +
          '<label>' + (es ? 'Corte del primer tramo' : 'Cut of the first stretch') + ': <span class="cval" id="w1al"></span></label>' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Ventas al final' : 'Sales at the end') + '</div><div class="mnum ts" id="w1end"></div></div>' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Factor al doble de años' : 'Factor at twice the years') + '</div><div class="mnum ts" id="w1dbl"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w1read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#w1V').addEventListener('input', function() { state.V = parseInt(this.value, 10); update(); });
    host.querySelector('#w1g').addEventListener('input', function() { state.gp = parseInt(this.value, 10); update(); });
    host.querySelector('#w1n').addEventListener('input', function() { state.n = parseInt(this.value, 10); update(); });
    host.querySelector('#w1a').addEventListener('input', function() { update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var V = state.V, g = state.gp / 100, n = state.n;
    var aEl = host.querySelector('#w1a');
    var a = Math.max(1, Math.min(n - 1, parseInt(aEl.value, 10) || 1));
    if (n < 2) a = 1;
    var b = Math.max(0, n - a);
    var fac  = growFactor(g, n);
    var end  = futureValue(V, g, n);
    var lin  = simpleValue(V, g, n);
    var gap  = end - lin;
    var facA = growFactor(g, a), facB = growFactor(g, b);
    host.querySelector('#w1Vl').textContent = money(V);
    host.querySelector('#w1gl').textContent = pct0(g);
    host.querySelector('#w1nl').textContent = es ? yearsEs(n) : yearsEn(n);
    host.querySelector('#w1al').textContent = es ? yearsEs(a) : yearsEn(a);
    host.querySelector('#w1fac').textContent = dec4(fac);
    host.querySelector('#w1end').textContent = money(end);
    host.querySelector('#w1lin').textContent = money(lin);
    host.querySelector('#w1gap').textContent = money(gap);
    host.querySelector('#w1acc').textContent = pct1(fac - 1);
    host.querySelector('#w1dbl').textContent = dec4(fac * fac);
    host.querySelector('#w1steps').innerHTML = es
      ? 'Un año de crecimiento multiplica las ventas por ' + dec4(1 + g) + '  ·  ' +
        yearsEs(a) + ' dejan un factor de ' + dec4(facA) + '  ·  ' +
        'los ' + yearsEs(b) + ' siguientes dejan ' + dec4(facB) + '  ·  ' +
        'al multiplicarlos queda ' + dec4(facA * facB) + ', que es el factor de ' + yearsEs(n) + '  ·  ' +
        'las ventas pasan de ' + money(V) + ' a ' + money(end)
      : 'One year of growth multiplies sales by ' + dec4(1 + g) + '  ·  ' +
        yearsEn(a) + ' leave a factor of ' + dec4(facA) + '  ·  ' +
        'the next ' + yearsEn(b) + ' leave ' + dec4(facB) + '  ·  ' +
        'multiplying them gives ' + dec4(facA * facB) + ', which is the factor of ' + yearsEn(n) + '  ·  ' +
        'sales go from ' + money(V) + ' to ' + money(end);
    var gcv = fitCanvas(host.querySelector('#w1cv'), 190);
    if (state.view === 'compuesto') {
      drawCurveChart(gcv, 0, Math.max(2, n), [
        { f: function(x) { return futureValue(V, g, x); }, kind: 'green', label: (es ? 'La tasa sobre lo ya crecido' : 'The rate on what has already grown') },
        { f: function(x) { return simpleValue(V, g, x); }, kind: 'soft', dash: true, label: (es ? 'La tasa siempre sobre hoy' : 'The rate always on today') }
      ], {
        fmtY: function(y) { return money(y); }, fmtX: function(x) { return intN(x); },
        marks: [{ x: n, y: end, label: money(end), kind: 'gold' }],
        at: n,
        xLabel: (es ? 'años de proyección' : 'years of projection')
      });
    } else {
      drawCurveChart(gcv, 0, Math.max(2, n), [
        { f: function(x) { return growFactor(g, x); }, kind: 'green', label: (es ? 'Factor acumulado' : 'Accumulated factor') }
      ], {
        fmtY: function(y) { return dec3(y); }, fmtX: function(x) { return intN(x); },
        marks: [
          { x: a, y: facA, label: dec3(facA), kind: 'gold' },
          { x: n, y: fac,  label: dec3(fac),  kind: 'bad' }
        ],
        band: { from: 0, to: a },
        xLabel: (es ? 'años transcurridos' : 'years elapsed')
      });
    }
    host.querySelector('#w1read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con una tasa de ' + pct0(g) + ' sostenida ' + yearsEs(n) + ', las ventas quedan en ' + money(end) + ' y el factor acumulado es ' + dec4(fac) + ', es decir ' + pct1(fac - 1) + ' por encima del punto de partida. Presupuestar en línea recta daría ' + money(lin) + ', y esa lectura deja fuera ' + money(gap) + ' del último ejercicio. El corte en ' + yearsEs(a) + ' muestra por qué: el primer tramo deja ' + dec4(facA) + ' y el segundo ' + dec4(facB) + ', y como los dos factores se multiplican, sus exponentes se suman hasta ' + yearsEs(n) + '. Nota que al doble de horizonte el factor no se duplica sino que se eleva al cuadrado, ' + dec4(fac * fac) + ', que es la razón por la que las proyecciones a largo plazo se vuelven tan sensibles a un punto de tasa.'
      : '<strong>Business reading:</strong> with a rate of ' + pct0(g) + ' held for ' + yearsEn(n) + ', sales land at ' + money(end) + ' and the accumulated factor is ' + dec4(fac) + ', that is ' + pct1(fac - 1) + ' above the starting point. Budgeting in a straight line would give ' + money(lin) + ', and that reading leaves ' + money(gap) + ' out of the final year. The cut at ' + yearsEn(a) + ' shows why: the first stretch leaves ' + dec4(facA) + ' and the second ' + dec4(facB) + ', and since the two factors multiply, their exponents add up to ' + yearsEn(n) + '. Notice that at twice the horizon the factor does not double, it is squared, ' + dec4(fac * fac) + ', which is why long range projections turn so sensitive to a single point of rate.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · the root that averages growth
   ════════════════════════════════════════════════════════════════════════ */
function widgetRoot(A0, B0, n0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'media', A: A0, B: B0, n: n0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'media',   es: 'La trayectoria que promedia',   en: 'The path that averages' },
      { id: 'mensual', es: 'Del año al mes',                en: 'From the year to the month' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="raices-tasa-media-y-exponente-fraccionario">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'La raíz que promedia el crecimiento' : 'The root that averages growth') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'El área de análisis de Distribuidora del Pacífico tiene dos cifras de ventas, la del primer año y la del último, y tiene que decir a qué tasa creció el negocio cada año. La primera vista dibuja las dos trayectorias que compiten por esa respuesta: la curva verde crece a una tasa constante y llega justo al valor final, mientras la línea gris reparte el cambio total en partes iguales año con año. Mueve los años y observa que la curva siempre queda por debajo de la línea al principio, porque la tasa media verdadera es menor que el cambio total dividido entre los años: repartir por división ignora que cada año crece sobre lo que dejó el anterior. La segunda vista baja la escala del año al mes. Una tasa anual no se parte en doce por división, se parte tomando la raíz de orden doce del factor, y la curva muestra por qué: doce meses a la tasa mensual equivalente vuelven a dar el factor del año completo, mientras la línea recta de dividir entre doce se queda corta. Ese es el sentido práctico del exponente fraccionario.'
          : 'The analysis desk at Distribuidora del Pacífico has two sales figures, the one of the first year and the one of the last, and it has to state the rate at which the business grew each year. The first view draws the two paths competing for that answer: the green curve grows at a constant rate and lands exactly on the final value, while the grey line splits the total change into equal parts year by year. Move the years and watch how the curve always stays below the line at the start, because the true average rate is smaller than the total change divided by the years: splitting by division ignores that every year grows on what the previous one left. The second view drops the scale from the year to the month. An annual rate is not split into twelve by division, it is split by taking the twelfth root of the factor, and the curve shows why: twelve months at the equivalent monthly rate give back the factor of the whole year, while the straight line of dividing by twelve falls short. That is the practical meaning of a fractional exponent.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Ventas del primer año' : 'Sales in the first year') + ': <span class="cval" id="w2Al"></span></label>' +
          '<input type="range" min="1000000" max="4000000" step="200000" id="w2A" value="' + state.A + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Ventas del último año' : 'Sales in the last year') + ': <span class="cval" id="w2Bl"></span></label>' +
          '<input type="range" min="1200000" max="9000000" step="10000" id="w2B" value="' + state.B + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Años entre las dos cifras' : 'Years between the two figures') + ': <span class="cval" id="w2nl"></span></label>' +
          '<input type="range" min="2" max="10" step="1" id="w2n" value="' + state.n + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Meses que quieres ver' : 'Months you want to see') + ': <span class="cval" id="w2ml"></span></label>' +
          '<input type="range" min="3" max="24" step="1" id="w2m" value="12">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w2cv"></canvas>' +
        '<div class="dlist" id="w2steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Factor total' : 'Total factor') + '</div><div class="mnum cs" id="w2fac"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Cambio total' : 'Total change') + '</div><div class="mnum ts" id="w2tot"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Tasa media anual' : 'Average annual rate') + '</div><div class="mnum cs" id="w2cag"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Reparto por división' : 'Split by division') + '</div><div class="mnum ps" id="w2fla"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Tasa mensual equivalente' : 'Equivalent monthly rate') + '</div><div class="mnum cs" id="w2mes"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'La anual entre doce' : 'The annual one over twelve') + '</div><div class="mnum ps" id="w2doc"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w2read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#w2A').addEventListener('input', function() { state.A = parseInt(this.value, 10); update(); });
    host.querySelector('#w2B').addEventListener('input', function() { state.B = parseInt(this.value, 10); update(); });
    host.querySelector('#w2n').addEventListener('input', function() { state.n = parseInt(this.value, 10); update(); });
    host.querySelector('#w2m').addEventListener('input', function() { update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var A = state.A, B = state.B, n = state.n;
    var months = parseInt(host.querySelector('#w2m').value, 10) || 12;
    var fac = totalFactor(A, B), tot = fac - 1;
    var cg  = cagr(A, B, n), fl = flatSplit(A, B, n);
    var mes = subRate(cg, 12), doc12 = cg / 12;
    host.querySelector('#w2Al').textContent = money(A);
    host.querySelector('#w2Bl').textContent = money(B);
    host.querySelector('#w2nl').textContent = es ? yearsEs(n) : yearsEn(n);
    host.querySelector('#w2ml').textContent = es ? monthsEs(months) : monthsEn(months);
    host.querySelector('#w2fac').textContent = dec4(fac);
    host.querySelector('#w2tot').textContent = es ? moveEs1(tot) : moveEn1(tot);
    host.querySelector('#w2cag').textContent = pct2(cg);
    host.querySelector('#w2fla').textContent = pct2(fl);
    host.querySelector('#w2mes').textContent = pct2(mes);
    host.querySelector('#w2doc').textContent = pct2(doc12);
    host.querySelector('#w2steps').innerHTML = es
      ? 'Las ventas pasaron de ' + money(A) + ' a ' + money(B) + ' en ' + yearsEs(n) + '  ·  ' +
        'el factor total es ' + dec4(fac) + '  ·  ' +
        'la raíz de orden ' + intN(n) + ' de ese factor deja ' + dec4(1 + cg) + ' por año, es decir ' + pct2(cg) + '  ·  ' +
        'repartir el cambio total entre los años daría ' + pct2(fl) + ', que es otra cosa'
      : 'Sales went from ' + money(A) + ' to ' + money(B) + ' in ' + yearsEn(n) + '  ·  ' +
        'the total factor is ' + dec4(fac) + '  ·  ' +
        'the root of order ' + intN(n) + ' of that factor leaves ' + dec4(1 + cg) + ' per year, that is ' + pct2(cg) + '  ·  ' +
        'splitting the total change over the years would give ' + pct2(fl) + ', which is another thing';
    var gcv = fitCanvas(host.querySelector('#w2cv'), 190);
    if (state.view === 'media') {
      drawCurveChart(gcv, 0, n, [
        { f: function(x) { return A * Math.pow(1 + cg, x); }, kind: 'green', label: (es ? 'Tasa media constante' : 'Constant average rate') },
        { f: function(x) { return A * (1 + fl * x); }, kind: 'soft', dash: true, label: (es ? 'Reparto por división' : 'Split by division') }
      ], {
        fmtY: function(y) { return money(y); }, fmtX: function(x) { return intN(x); },
        marks: [{ x: n, y: B, label: money(B), kind: 'gold' }],
        xLabel: (es ? 'años transcurridos' : 'years elapsed')
      });
    } else {
      drawCurveChart(gcv, 0, months, [
        { f: function(x) { return Math.pow(1 + mes, x); }, kind: 'green', label: (es ? 'Tasa mensual equivalente' : 'Equivalent monthly rate') },
        { f: function(x) { return 1 + doc12 * x; }, kind: 'soft', dash: true, label: (es ? 'La anual entre doce' : 'The annual one over twelve') }
      ], {
        fmtY: function(y) { return dec3(y); }, fmtX: function(x) { return intN(x); },
        marks: [{ x: 12, y: 1 + cg, label: dec3(1 + cg), kind: 'gold' }],
        at: 12,
        xLabel: (es ? 'meses transcurridos' : 'months elapsed')
      });
    }
    host.querySelector('#w2read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> el negocio pasó de ' + money(A) + ' a ' + money(B) + ' en ' + yearsEs(n) + ', un factor total de ' + dec4(fac) + ' que equivale a ' + (es ? moveEs1(tot) : moveEn1(tot)) + '. La tasa que hay que reportar es ' + pct2(cg) + ' anual, porque es la única que sostenida ' + yearsEs(n) + ' vuelve a caer sobre ' + money(B) + '. Repartir el cambio total entre los años daría ' + pct2(fl) + ', una cifra más alta que ningún año podría sostener sin rebasar la meta, y esa distancia crece con el horizonte. En la vista mensual la misma idea cambia de escala: la tasa del mes es ' + pct2(mes) + ' y no ' + pct2(doc12) + ', porque doce meses se multiplican entre sí y no se suman.'
      : '<strong>Business reading:</strong> the business went from ' + money(A) + ' to ' + money(B) + ' in ' + yearsEn(n) + ', a total factor of ' + dec4(fac) + ' amounting to ' + moveEn1(tot) + '. The rate to report is ' + pct2(cg) + ' a year, because it is the only one that, held for ' + yearsEn(n) + ', lands back on ' + money(B) + '. Splitting the total change over the years would give ' + pct2(fl) + ', a figure higher than any year could hold without overshooting the target, and that distance grows with the horizon. In the monthly view the same idea changes scale: the rate of the month is ' + pct2(mes) + ' and not ' + pct2(doc12) + ', because twelve months multiply each other rather than adding up.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · the negative exponent and the value of today
   ════════════════════════════════════════════════════════════════════════ */
function widgetDiscount(F0, rp0, n0) {

    ];

      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="exponentes-negativos-valor-presente">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El exponente negativo trae el dinero al presente' : 'The negative exponent brings money to the present') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La tesorería de Distribuidora del Pacífico recibe todo el tiempo la misma propuesta: un cliente grande pide pagar después, un proveedor ofrece descuento por pagar antes, y alguien tiene que decir cuánto vale hoy ese dinero que se moverá de fecha. La primera vista dibuja el valor de hoy de un cobro futuro conforme se aleja la fecha. Arrastra los años y observa dos cosas: en el año cero el factor vale uno, que es el exponente cero y significa que un peso de hoy vale un peso, y a partir de ahí la curva baja sin llegar nunca a cero, porque dividir muchas veces entre un número mayor que uno achica sin anular. La segunda vista compara la única forma correcta de quitar el rendimiento, que es dividir entre el factor elevado a los años, contra la costumbre de restarle a la cantidad tantos puntos como años tenga. Las dos empiezan igual y se separan pronto, y en horizontes largos la resta llega a producir cifras negativas que no significan nada. Ese contraste es el sentido de escribir el exponente con signo menos.'
          : 'The treasury desk at Distribuidora del Pacífico gets the same proposal all the time: a large customer asks to pay later, a supplier offers a discount for paying earlier, and somebody has to say what that money moving across dates is worth today. The first view draws the value today of a future collection as the date moves away. Drag the years and watch two things: at year zero the factor is worth one, which is the zero exponent and means that a peso of today is a peso, and from there the curve falls without ever reaching zero, because dividing many times by a number greater than one shrinks without cancelling. The second view compares the only correct way of taking the return off, which is dividing by the factor raised to the years, against the habit of subtracting as many points from the amount as there are years. Both start together and separate quickly, and over long horizons the subtraction reaches negative figures that mean nothing at all. That contrast is the meaning of writing the exponent with a minus sign.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Cobro pactado a futuro' : 'Collection agreed for the future') + ': <span class="cval" id="w3Fl"></span></label>' +
          '<input type="range" min="200000" max="1500000" step="10000" id="w3F" value="' + state.F + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Rendimiento anual de la tesorería' : 'Annual return of the treasury') + ': <span class="cval" id="w3rl"></span></label>' +
          '<input type="range" min="3" max="20" step="1" id="w3r" value="' + state.rp + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Años de espera' : 'Years of waiting') + ': <span class="cval" id="w3nl"></span></label>' +
          '<input type="range" min="1" max="12" step="1" id="w3n" value="' + state.n + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Horizonte del dibujo' : 'Horizon of the drawing') + ': <span class="cval" id="w3hl"></span></label>' +
          '<input type="range" min="4" max="16" step="1" id="w3h" value="10">' +
        '</div></div>' +

/* ── Deterministic guard against two options landing on the same number ──
   In the chained change item the two drawn rates can leave the net change
   at zero, and then the plain average and the sum of the rates coincide.
   The guard walks the fall until the four figures separate.              */
function fixDrop(u, d) {
  for (var i = 0; i < 6; i++) {
    var net = chainChange(u, d);
    if (Math.abs(d - u) > 1e-9 && Math.abs(net) > 0.005 && Math.abs((u - d) / 2 - net) > 0.0005) return d;
    d = Math.round((d - 0.05) * 100) / 100;
    if (d < 0.05) d = 0.30;
  }
  return d;
}

      '<h2>Potencias y leyes de los exponentes</h2>' +
      '<p>Toda esta guía transcurre dentro de una sola empresa: Distribuidora del Pacífico, una importadora con bodega en Manzanillo que surte línea blanca a cadenas y a mueblerías del occidente del país. Cada bloque te sienta en una silla distinta de esa empresa, la de planeación comercial, la de análisis, la de tesorería y la de inteligencia de mercado. En las cuatro aparece la misma operación: multiplicar una cantidad por sí misma muchas veces, o deshacer esa multiplicación. Eso es una potencia, y en los negocios casi nunca se escribe con un número redondo como base.</p>' +
      '<p>Una <strong>potencia</strong> tiene dos partes con oficios distintos. La <strong>base</strong> dice qué se repite y el <strong>exponente</strong> dice cuántas veces. En una proyección financiera la base rara vez es una cantidad de dinero: es un <strong>factor</strong>, uno más la tasa, y el exponente es el horizonte medido en periodos. Escribir el crecimiento como potencia no es una elegancia de notación, es la afirmación de que cada periodo crece sobre lo que dejó el anterior. Cuando alguien multiplica la tasa por el número de años en lugar de elevar el factor, está suponiendo en silencio que el negocio vuelve cada año a su tamaño original.</p>' +
      '<p>De esa idea salen las leyes que gobiernan todo el bloque. Si dos tramos de tiempo se recorren uno tras otro, sus factores se multiplican, y como la base es la misma los exponentes se <strong>suman</strong>. Si se retrocede en el tiempo, se divide, y los exponentes se <strong>restan</strong>. Si un horizonte completo se repite varias veces, el exponente se <strong>multiplica</strong> por el número de repeticiones, que es la razón por la que duplicar el plazo eleva el factor al cuadrado en lugar de duplicarlo. Y cuando la base es un producto, la potencia se reparte entre sus partes, de modo que una tasa de crecimiento combinada con un ajuste de precios se puede analizar por separado y volver a juntar.</p>' +
      '<p>Falta la advertencia que se cobra cara en la práctica: la potencia no perdona errores de base. Elevar la tasa en vez del factor da una cifra casi idéntica al punto de partida y por eso pasa desapercibida en una hoja de cálculo. Confundir el número de periodos por uno cambia el resultado del último ejercicio completo. Y una tasa sostenida durante muchos años produce cifras que la intuición no anticipa, de manera que conviene revisar siempre si el orden de magnitud del resultado es defendible antes de llevarlo a una junta.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Producto de potencias</div><div class="rform">(1 + i)<sup>a</sup> × (1 + i)<sup>b</sup> = (1 + i)<sup>a + b</sup></div><div class="rnote">Dos horizontes seguidos.</div></div>' +
        '<div class="rcard"><div class="rname">Cociente de potencias</div><div class="rform">' + frac('(1 + i)<sup>a</sup>', '(1 + i)<sup>b</sup>') + ' = (1 + i)<sup>a − b</sup></div><div class="rnote">Regresar en el tiempo.</div></div>' +
        '<div class="rcard"><div class="rname">Potencia de una potencia</div><div class="rform">((1 + i)<sup>a</sup>)<sup>b</sup> = (1 + i)<sup>a · b</sup></div><div class="rnote">Repetir el horizonte.</div></div>' +
        '<div class="rcard"><div class="rname">Crecimiento compuesto</div><div class="rform">V<sub>0</sub> × (1 + i)<sup>n</sup></div><div class="rnote">La base es el factor, no la tasa.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> La línea blanca cerró el año con ventas de ' + money(c1V) + ' y el plan supone un crecimiento de ' + pct0(c1g) + ' anual sostenido. Planeación quiere ver el resultado en dos tramos: los primeros ' + yearsEs(c1a) + ' del plan y los ' + yearsEs(c1b) + ' que siguen.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Un año multiplica las ventas por ' + dec4(1 + c1g) + ', de modo que ' + yearsEs(c1a) + ' dejan un factor de ' + dec4(c1facA) + '.<br>' +
      '<strong>Paso 2.</strong> Los ' + yearsEs(c1b) + ' siguientes dejan ' + dec4(c1facB) + ', y al multiplicar los dos factores queda ' + dec4(c1fac) + '.<br>' +
      '<strong>Paso 3.</strong> Ese es exactamente el factor de ' + yearsEs(c1a + c1b) + ', porque los exponentes se sumaron, y las ventas del plan quedan en ' + money(c1end) + '.<br>' +
      '<strong>Paso 4.</strong> Multiplicar la tasa por los años habría dado ' + money(c1lin) + ', una cifra menor en ' + money(c1end - c1lin) + ' que ignora que cada año crece sobre el anterior.<br>' +
      '<strong>Lectura de negocio.</strong> La diferencia entre las dos lecturas no es un detalle académico: es el monto que un presupuesto lineal deja fuera del último ejercicio. Nota además que si el plan se extendiera al doble de años, el factor no sería el doble sino su cuadrado, ' + dec4(c1fac * c1fac) + ', y esa es la razón por la que un punto de tasa discutido hoy pesa tanto en un plan a diez años.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>Powers and the laws of exponents</h2>' +
      '<p>This whole guide takes place inside a single company: Distribuidora del Pacífico, an importer with a warehouse in Manzanillo that supplies home appliances to retail chains and furniture stores across the west of the country. Each block sits you in a different chair of that company, commercial planning, analysis, treasury and market intelligence. In all four the same operation turns up: multiplying a quantity by itself many times, or undoing that multiplication. That is a power, and in business it is almost never written with a round number as its base.</p>' +
      '<p>A <strong>power</strong> has two parts with different jobs. The <strong>base</strong> says what is repeated and the <strong>exponent</strong> says how many times. In a financial projection the base is rarely an amount of money: it is a <strong>factor</strong>, one plus the rate, and the exponent is the horizon measured in periods. Writing growth as a power is not notational elegance, it is the claim that every period grows on what the previous one left. When somebody multiplies the rate by the number of years instead of raising the factor, that person is silently assuming that the business returns to its original size every year.</p>' +
      '<p>From that idea come the laws that govern the whole block. If two stretches of time are travelled one after the other, their factors multiply, and since the base is the same the exponents <strong>add</strong>. If time is walked backwards, the factors divide and the exponents <strong>subtract</strong>. If a whole horizon is repeated several times, the exponent is <strong>multiplied</strong> by the number of repetitions, which is why doubling the term squares the factor instead of doubling it. And when the base is a product, the power spreads over its parts, so that a growth rate combined with a price adjustment can be analysed separately and then put back together.</p>' +
      '<p>One warning remains, and it is expensive in practice: a power does not forgive a mistaken base. Raising the rate instead of the factor gives a figure almost identical to the starting point, which is why it goes unnoticed in a spreadsheet. Getting the number of periods wrong by one changes the result of a whole final year. And a rate held for many years produces figures that intuition does not anticipate, so it is always worth checking whether the order of magnitude of the result is defensible before carrying it into a meeting.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Product of powers</div><div class="rform">(1 + i)<sup>a</sup> × (1 + i)<sup>b</sup> = (1 + i)<sup>a + b</sup></div><div class="rnote">Two horizons in a row.</div></div>' +
        '<div class="rcard"><div class="rname">Quotient of powers</div><div class="rform">' + frac('(1 + i)<sup>a</sup>', '(1 + i)<sup>b</sup>') + ' = (1 + i)<sup>a − b</sup></div><div class="rnote">Walking back in time.</div></div>' +

        '<div class="rcard"><div class="rname">Compound growth</div><div class="rform">V<sub>0</sub> × (1 + i)<sup>n</sup></div><div class="rnote">The base is the factor, not the rate.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> The appliance line closed the year with sales of ' + money(c1V) + ' and the plan assumes growth of ' + pct0(c1g) + ' a year, held steady. Planning wants to see the result in two stretches: the first ' + yearsEn(c1a) + ' of the plan and the ' + yearsEn(c1b) + ' that follow.</p>' +
