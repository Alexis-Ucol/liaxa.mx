<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relaciones de Poder y Lucha de Grupos Discriminados</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Relaciones de Poder y Lucha de Grupos Discriminados</div>
    <div class="wcourse" id="wcourse-el">Historia · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Relaciones de Poder y Lucha de Grupos Discriminados</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a4a8a', primaryDark:'#0c2547', primaryBg:'#e7edf6',
  accent:'#e07b1a', accentBg:'#fbeddf',
  darkPrimary:'#437bc6', darkPrimaryDark:'#74a5e6', darkPrimaryBg:'#0c203a',

  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

var MANIP = {};
function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function pickVariant(list, rng){ return list[Math.floor(rng()*list.length)]; }
function pickSome(pool, n, rng){
  var rest = pool.slice(), out = [];
  while (out.length < n && rest.length) out.push(rest.splice(Math.floor(rng()*rest.length),1)[0]);
  return out;
}
function pickSorted(pool, n, rng){
  var out = pickSome(pool, n, rng);
  out.sort(function(a,b){ return a-b; });
  return out;
}

function d_tab(which, btn){
  ['type','draw'].forEach(function(k){
    var p = document.getElementById('d_' + k);
    if (p) p.classList.toggle('active', k === which);
  });
  var w = document.getElementById('wCuaderno');
  if (w) w.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('dCv');
    if (c && c.getAttribute('data-ready') !== '1') { c.setAttribute('data-ready','1'); initCanvas(c); }
  }, 60);
}
function d_save(){

}

function buildLesson(rng) {
  injectManipStyles();

  /* ── PUNTO DE PARTIDA ───────────────────────── */
  addSection(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Derechos que no siempre estuvieron ahí', en:'Rights that were not always there' }),
    '<p>' + L({ es:'Si le preguntaras a tu bisabuela por su primer voto en una elección para presidencia de la República, la respuesta más probable es que no lo tuvo. En México las mujeres votaron por primera vez en una elección federal en 1955, dos años después de la reforma que las reconoció como ciudadanas plenas. Antes de eso, la mitad de la población adulta del país estaba fuera del padrón, y muy pocos consideraban que eso fuera un problema.',
               en:'If you asked your great grandmother about her first vote in a presidential election, the most likely answer is that she never had one. In Mexico women voted for the first time in a federal election in 1955, two years after the reform that recognized them as full citizens. Before that, half the adult population of the country was off the electoral roll, and very few thought that was a problem.' }) + '</p>' +
    '<p>' + L({ es:'Lo mismo vale para otros grupos. Hubo personas esclavizadas en este territorio, y su libertad se ordenó por decreto. Hubo un sistema que asignaba impuestos y oficios distintos según el origen de cada quien. Hubo pueblos cuyas lenguas y formas de gobierno no aparecían en la Constitución. En todos los casos, lo que hoy parece evidente tuvo que ser reclamado, discutido y escrito en una ley.',
               en:'The same holds for other groups. There were enslaved people in this territory, and their freedom was ordered by decree. There was a system assigning different taxes and trades according to the origin of each person. There were peoples whose languages and forms of government did not appear in the Constitution. In every case, what seems obvious today had to be claimed, argued and written into a law.' }) + '</p>' +
    '<p>' + L({ es:'En esta guía vas a hacer cuatro cosas: medir en casos concretos qué decisiones tenía y cuáles no tenía una persona según la época, distinguir cuándo un argumento presenta una desigualdad como natural y cuándo la fecha, ordenar los pasos por los que se ampliaron los derechos y evaluar explicaciones sobre por qué cada paso llegó cuando llegó.',
               en:'In this guide you will do four things: measure in concrete cases which decisions a person had and which she did not according to the period, tell apart when an argument presents an inequality as natural and when it dates it, order the steps by which rights were widened, and weigh explanations of why each step arrived when it did.' }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Pregunta guía: ', en:'Guiding question: ' }) + '</strong>' + L({ es:'si el racismo y el sexismo hubieran sido parte de la naturaleza humana, ninguna reforma habría podido cambiar nada. ¿Qué muestra entonces el hecho de que sí cambiaran?',
                                                                                                                        en:'if racism and sexism had been part of human nature, no reform could have changed anything. What, then, does the fact that they did change show?' }) + '</p></div>'
  );

  /* ── CONCEPTO 1 :: LA RELACIÓN DE PODER ─────── */
  addSection(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Una relación de poder es un reparto de decisiones', en:'A power relation is a distribution of decisions' }),
    '<p>' + L({ es:'En historia, hablar de poder no es hablar solo de quien manda un ejército. Poder es la capacidad de decidir sobre algo o sobre alguien, y esa capacidad casi siempre está repartida de forma desigual. La pregunta útil para estudiar cualquier época es sencilla y concreta: para tal decisión, ¿quién firma, quién autoriza y quién queda sin voz?',
               en:'In history, speaking of power is not only speaking of whoever commands an army. Power is the capacity to decide over something or over someone, and that capacity is almost always unevenly distributed. The useful question for studying any period is simple and concrete: for a given decision, who signs, who authorizes and who is left without a voice?' }) + '</p>' +
    '<p>' + L({ es:'Ese reparto se sostiene en tres planos que conviene revisar por separado. El plano legal es lo que una norma permite o prohíbe. El plano de los recursos es quién tiene bienes, ingresos y estudios, es decir, con qué cuenta cada quien para sostenerse sin depender de otro. El plano del relato es quién aparece en los libros, en los periódicos y en los discursos, y con qué palabras se nombra a los demás.',
               en:'That distribution rests on three planes worth reviewing separately. The legal plane is what a rule allows or forbids. The plane of resources is who holds goods, income and schooling, that is, what each person can count on to support themselves without depending on another. The plane of the story is who appears in books, newspapers and speeches, and with what words others are named.' }) + '</p>' +
    '<table class="dtable"><tr><th>' + L({ es:'Plano', en:'Plane' }) + '</th><th>' + L({ es:'Pregunta que le hacemos a la fuente', en:'Question we ask of the source' }) + '</th></tr>' +
    '<tr><td>' + L({ es:'Legal', en:'Legal' }) + '</td><td>' + L({ es:'¿qué le permite o le prohíbe la norma a cada grupo, y desde qué fecha?', en:'what does the rule allow or forbid each group, and since what date?' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Recursos', en:'Resources' }) + '</td><td>' + L({ es:'¿quién es dueño, quién cobra, quién puede estudiar y quién depende de otro para vivir?', en:'who owns, who is paid, who can study and who depends on another to live?' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Relato', en:'Story told' }) + '</td><td>' + L({ es:'¿quién aparece nombrado en las fuentes y quién solo aparece contado por otros?', en:'who appears named in the sources and who only appears narrated by others?' }) + '</td></tr></table>' +
    '<p>' + L({ es:'Cuando los tres planos empujan en la misma dirección contra un grupo, no estamos ante un caso aislado de mal trato sino ante discriminación: una regla estable que cierra oportunidades a alguien por lo que es y no por lo que hace. Distinguir un plano de otro sirve además para entender por qué una sola reforma casi nunca alcanza para terminar con una exclusión.',
               en:'When the three planes push in the same direction against a group, we are not facing an isolated case of mistreatment but discrimination: a stable rule closing opportunities to someone for what they are and not for what they do. Telling one plane from another also helps to understand why one single reform is almost never enough to end an exclusion.' }) + '</p>'
  );
  MANIP.a = { order:pickSome([0,1,2,3,4], 3, rng), round:0, sw:[0,0,0,0], tries:0, revealed:false, done:false,
    msg:{ es:'Empieza por preguntarte quién firma cuando esta persona quiere vender algo suyo.', en:'Start by asking who signs when this person wants to sell something of hers.' } };
  addWidget('wAutonomia', 'power');
  a_render();

  useVariant(pickVariant(V1(), rng), rng);
  useVariant(pickVariant(V2(), rng), rng);

  /* ── CONCEPTO 2 :: CONSTRUCCIONES HISTÓRICAS ── */
  addSection(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El racismo y el sexismo tienen fecha de fabricación', en:'Racism and sexism have a manufacturing date' }),
    '<p>' + L({ es:'Decir que el racismo y el sexismo son construcciones históricas no significa que sean imaginarios ni que sus efectos sean leves. Significa algo más preciso: son productos de la historia, con un momento de aparición, unos autores y unos intereses que los sostuvieron. No vienen de la biología, aunque muchas veces se hayan disfrazado de ella.',
               en:'Saying that racism and sexism are historical constructions does not mean they are imaginary or that their effects are mild. It means something more precise: they are products of history, with a moment of appearance, some authors and some interests that sustained them. They do not come from biology, even if they have often been disguised as it.' }) + '</p>' +
    '<p>' + L({ es:'En la Nueva España el origen de cada persona definía impuestos, oficios permitidos y matrimonios posibles, y esa clasificación se administraba con registros y normas, no con la sangre. En el siglo XIX apareció algo distinto y más peligroso: intentos de medir cráneos y de aplicar a las sociedades humanas ideas tomadas de la competencia entre especies, para colocar a unos pueblos por encima de otros. La conclusión estaba decidida antes de medir, y resultaba muy útil en el momento en que las potencias se repartían territorios. Hoy ninguna disciplina científica sostiene esas jerarquías.',
               en:'In New Spain the origin of each person defined taxes, permitted trades and possible marriages, and that classification was administered with registers and rules, not with blood. In the 19th century something different and more dangerous appeared: attempts to measure skulls and to apply to human societies ideas taken from competition between species, in order to place some peoples above others. The conclusion was decided before any measuring, and it was very useful at the moment when the powers were sharing out territories. Today no scientific discipline holds those hierarchies.' }) + '</p>' +
    '<p>' + L({ es:'Con el sexismo ocurrió lo mismo. Durante siglos se sostuvo que la naturaleza de la mujer la destinaba al hogar, y con ese argumento se le negaron el voto, el manejo de sus bienes y el acceso a ciertos oficios. La prueba de que era una construcción y no un dato natural es que bastó reformar unos artículos para que millones de personas hicieran lo que supuestamente su naturaleza les impedía.',
               en:'The same happened with sexism. For centuries it was held that the nature of woman destined her to the home, and with that argument she was denied the vote, the handling of her property and access to certain trades. The proof that it was a construction and not a natural fact is that reforming a few articles was enough for millions of people to do what their nature supposedly prevented.' }) + '</p>' +
    '<div class="srcbox">' + L({ es:'Criterio de análisis: a cada afirmación sobre un grupo pregúntale tres cosas. ¿Dice cuándo empezó lo que describe? ¿Se sabe quién lo decidió? ¿A quién le resultaba útil? Si las tres respuestas existen, tienes delante una construcción histórica y no un hecho de la naturaleza.',
                                 en:'Analytical criterion: ask three things of every claim about a group. Does it say when what it describes began? Is it known who decided it? Who found it useful? If the three answers exist, you have before you a historical construction and not a fact of nature.' }) + '<span class="srcref">' + L({ es:'Criterio usado en esta guía', en:'Criterion used in this guide' }) + '</span></div>'
  );
  MANIP.n = { seq:pickSome([0,1,2,3,4,5,6,7], 6, rng), i:0, tries:0, correct:0, lock:false, done:false,
    msg:{ es:'Busca la fecha: si la frase no dice cuándo empezó lo que describe, sospecha.', en:'Look for the date: if the sentence does not say when what it describes began, be suspicious.' } };
  addWidget('wNaturaliza', 'classify');
  n_render();

  useVariant(pickVariant(V3(), rng), rng);
  useVariant(pickVariant(V4(), rng), rng);

  /* ── CONCEPTO 3 :: CÓMO SE GANA UN DERECHO ──── */
  addSection(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Ningún derecho apareció solo', en:'No right appeared by itself' }),
    '<p>' + L({ es:'Las reformas que amplían derechos suelen estudiarse por su fecha de publicación, y esa fecha esconde lo más interesante. Antes de cada una hay años de organización: reuniones, publicaciones, peticiones, alianzas y también derrotas. Cuando una ley aparece sin nada de eso detrás, conviene desconfiar de la explicación que la presenta como una concesión generosa.',
               en:'Reforms that widen rights are usually studied by their date of publication, and that date hides the most interesting part. Before each one there are years of organizing: meetings, publications, petitions, alliances and defeats too. When a law appears with none of that behind it, it is wise to distrust the explanation presenting it as a generous grant.' }) + '</p>' +
    '<p>' + L({ es:'El caso del voto de las mujeres lo muestra bien. En 1916 se reunió en Mérida el primer congreso feminista del país, donde se discutió abiertamente el derecho al sufragio. Al año siguiente la demanda llegó al congreso que redactaba la Constitución y no prosperó. En 1937 una iniciativa presidencial propuso la reforma y no llegó a publicarse. En 1947 se reconoció el voto en elecciones municipales y apenas en 1953 en las federales. Casi cuatro décadas entre la demanda organizada y el reconocimiento pleno.',
               en:'The case of the vote of women shows it well. In 1916 the first feminist congress in the country met in Merida, where the right to suffrage was openly discussed. The following year the demand reached the congress drafting the Constitution and did not prosper. In 1937 a presidential bill proposed the reform and never reached publication. In 1947 the vote in municipal elections was recognized and only in 1953 in federal ones. Almost four decades between the organized demand and full recognition.' }) + '</p>' +
    '<p>' + L({ es:'Otros procesos siguen el mismo patrón con distintos protagonistas. La esclavitud se abolió por decreto tras haber sido combatida durante la guerra de independencia. La igualdad del varón y la mujer ante la ley se incorporó al artículo 4 en 1974. La prohibición expresa de discriminar y el reconocimiento de los derechos de los pueblos indígenas llegaron al texto constitucional en 2001, después de años de movilización. En todos los casos, primero alguien nombró la exclusión y solo después la ley la reconoció.',
               en:'Other processes follow the same pattern with different protagonists. Slavery was abolished by decree after having been fought during the war of independence. Equality of man and woman before the law was added to article 4 in 1974. The express prohibition of discrimination and the recognition of the rights of indigenous peoples reached the constitutional text in 2001, after years of mobilization. In every case, someone first named the exclusion and only afterwards did the law recognize it.' }) + '</p>'
  );
  var cset = pickSorted([0,1,2,3,4,5,6,7,8], 6, rng);
  MANIP.c = { set:cset, order:shuffleIdx(6, rng), sel:null, tries:0, done:false,
    msg:{ es:'Coloca arriba el paso más antiguo. Si dudas entre dos, pregúntate cuál hace posible al otro.', en:'Put the oldest step at the top. If you hesitate between two, ask which one makes the other possible.' } };
  addWidget('wEscalera', 'timeline');
  c_render();

  useVariant(pickVariant(V5(), rng), rng);
  useVariant(pickVariant(V6(), rng), rng);

  /* ── CONCEPTO 4 :: DEL PAPEL A LA VIDA ──────── */
  addSection(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Entre el derecho escrito y el derecho ejercido', en:'Between the written right and the exercised right' }),
    '<p>' + L({ es:'Una reforma cambia el texto de la ley el día que se publica. Cambiar lo que ocurre en la vida diaria toma mucho más. Entre ambos momentos hay un tramo que los historiadores estudian con atención, porque ahí se ve qué obstáculos seguían operando cuando el obstáculo legal ya había caído.',
               en:'A reform changes the text of the law the day it is published. Changing what happens in daily life takes much longer. Between those two moments there is a stretch historians study closely, because there you can see which obstacles were still operating once the legal obstacle had fallen.' }) + '</p>' +
    '<p>' + L({ es:'El ejemplo más claro está a la mano. El voto y el derecho a ser votada se reconocieron en 1953, y la primera mujer que gobernó un estado del país tomó posesión en Colima en 1979. Veintiséis años después del reconocimiento legal. Nada en la ley lo impedía: lo que pesaba eran los criterios con que se elegían las candidaturas, los recursos que se les asignaban y lo que se esperaba socialmente de una mujer en un cargo de decisión.',
               en:'The clearest example is close at hand. The vote and the right to be voted for were recognized in 1953, and the first woman to govern a state of the country took office in Colima in 1979. Twenty six years after the legal recognition. Nothing in the law prevented it: what weighed were the criteria for choosing candidacies, the resources assigned to them and what was socially expected of a woman in a decision making post.' }) + '</p>' +
    '<p>' + L({ es:'Por eso aparecen medidas que no se limitan a permitir. La reforma de 2019 no reconoció un derecho nuevo, ya que el derecho a ser votada existía desde 1953: lo que hizo fue exigir que la mitad de las candidaturas y de los cargos de los tres poderes correspondan a mujeres, es decir, atacar el tramo donde el derecho se perdía. Cuando estudies cualquier reforma, pregúntate siempre qué problema concreto venía a resolver.',
               en:'That is why measures appear that do not limit themselves to permitting. The 2019 reform did not recognize a new right, since the right to be voted for had existed since 1953: what it did was require that half of the candidacies and posts in the three branches go to women, that is, attack the stretch where the right was being lost. When you study any reform, always ask what concrete problem it came to solve.' }) + '</p>'
  );
  d_build(rng);

  useVariant(pickVariant(V7(), rng), rng);
  useVariant(pickVariant(V8(), rng), rng);

  /* ── CIERRE ─────────────────────────────────── */
  addSection(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Piensa como historiador', en:'Think like a historian' }),
    '<p>' + L({ es:'Ya tienes las cuatro herramientas: leer una relación de poder como un reparto de decisiones, reconocer cuándo un argumento naturaliza una desigualdad, ordenar los pasos por los que se conquista un derecho y medir la distancia entre lo que la ley reconoce y lo que ocurre. Las últimas preguntas no piden un dato suelto: piden que uses todo eso junto para decidir qué afirmación se sostiene mejor y con qué pruebas.',
               en:'You now have the four tools: reading a power relation as a distribution of decisions, recognizing when an argument naturalizes an inequality, ordering the steps by which a right is won and measuring the distance between what the law recognizes and what happens. The last questions do not ask for a loose fact: they ask you to use all of that together to decide which claim holds up better and with what evidence.' }) + '</p>'
  );

  useVariant(pickVariant(V9(), rng), rng);
  useVariant(pickVariant(V10(), rng), rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Relaciones de Poder y Lucha de Grupos Discriminados';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
