<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resolución de Conflictos Sociales y Políticos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS (concept manipulatives) ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1.1rem 0; }
.wgt-h { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.2rem; }
.wgt-q { font-size:.82rem; color:var(--text3); margin-bottom:.85rem; }
.wmsg { margin-top:.75rem; padding:.6rem .85rem; border-radius:0 8px 8px 0; border-left:3px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.83rem; }
.wmsg.ok   { background:var(--ok-bg);   color:var(--ok);    border-left-color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.wbtn { margin-top:.75rem; margin-right:.4rem; background:var(--green); color:#fff; border:none; border-radius:8px; padding:.55rem 1.1rem; font-size:.83rem; font-weight:600; cursor:pointer; min-height:44px; }
.wbtn:hover { background:var(--green-dark); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.55rem; }
.wcase { background:var(--surface2); border-radius:8px; padding:.75rem .9rem; font-size:.86rem; color:var(--text); margin-bottom:.7rem; }
.chips { display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0; }
.chip { border:1.5px solid var(--border); border-radius:22px; padding:.4rem .85rem; font-size:.8rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; transition:all .14s; }
.chip:hover { border-color:var(--green); }
.chip.used { opacity:.75; cursor:default; font-family:'IBM Plex Mono',monospace; font-size:.74rem; min-height:34px; }
.chip.used:hover { border-color:var(--border); }

/* two-column matcher + measure picker */
.mcols { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
.colh { font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin-bottom:.35rem; }
.optbox { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .7rem; font-size:.79rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; min-height:44px; display:flex; align-items:center; transition:all .14s; }
.optbox:hover { border-color:var(--green); }
.optbox.sel { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.optbox.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }

/* live meters */
.mtr { margin-bottom:.5rem; }
.mtrlbl { display:flex; justify-content:space-between; gap:.6rem; font-size:.73rem; color:var(--text3); margin-bottom:.2rem; }
.mtrtrack { height:12px; border:1px solid var(--border); border-radius:6px; background:var(--surface2); overflow:hidden; }
.mtrfill { height:100%; width:0%; background:var(--gold); transition:width .3s; }
.mtrfill.ok { background:var(--ok); }

/* route sequencer */
.tl-list { display:flex; flex-direction:column; gap:.45rem; margin:.7rem 0; }
.tl-chip { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .75rem; font-size:.81rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; gap:.5rem; transition:all .14s; }
.tl-chip:hover { border-color:var(--green); }
.tl-chip.sel { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.tl-chip.locked { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }
.tl-num { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; font-size:.78rem; flex-shrink:0; }

/* open notebook */
.reflect-prompt { font-size:.9rem; color:var(--text2); margin:.4rem 0 .8rem; }

@media (max-width:600px) {
  .mcols { grid-template-columns:1fr; }
  .wgt { padding:.85rem; }
  .wcase { font-size:.83rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Resolución de Conflictos Sociales y Políticos</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────
  //   When injecting logos, replace the two placeholder lines below with:
  //     var logoLeftB64  = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* Four distinct numeric options, correct first (shuffled later by addProblem). */
function numOpts(correct, cands){
  var out = [String(correct)], i, v;
  for (i = 0; i < cands.length && out.length < 4; i++) {
    v = String(cands[i]);
    if (cands[i] > 0 && out.indexOf(v) < 0) out.push(v);
  }
  var extra = 1;
  while (out.length < 4) { v = String(correct + extra); if (out.indexOf(v) < 0) out.push(v); extra++; }
  return out;
}

/* Seeded permutation that never comes back already ordered. */
function shufflePerm(n, rng){
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  var sorted = true;
  for (i = 0; i < n; i++) if (a[i] !== i) sorted = false;
  if (sorted && n > 1) { t = a[0]; a[0] = a[1]; a[1] = t; }
  return a;
}

/* ================================================

   A case lands on the board; the student decides whether the parties are two

   and who decides. The tally rebuilds live and every miss answers back with a

   ================================================ */
var MAP = null;
var MAP_BINS = { es:['Interpersonal','Social','Político'], en:['Interpersonal','Social','Political'] };

function mapRender(){
  if (!MAP) return;
  var box = document.getElementById('mapBox');
  if (!box) return;
  var names = MAP_BINS[LANG];
  var tal = '<div class="chips">' + names.map(function(b, k){
    return '<div class="chip used">' + b + ': ' + MAP.tally[k] + '</div>';
  }).join('') + '</div>';
  if (MAP.done) {
    box.innerHTML = tal +
      '<div class="wmsg ok">' + S('Tablero completo. Los tres montones se atienden de forma distinta: lo interpersonal se repara entre las partes, lo social se negocia entre grupos y lo político se resuelve cambiando reglas y decisiones públicas.',
                                  'Board complete. The three piles are handled differently: the interpersonal is repaired between the parties, the social is negotiated between groups, and the political is settled by changing rules and public decisions.') + '</div>';
    return;
  }
  var it = MAP.items[MAP.order[MAP.i]];
  var msg = MAP.note || S('Pregúntate primero: ¿quiénes son las partes?, ¿qué se disputan?',
                          'Ask yourself first: who are the parties, and what are they disputing?');
  box.innerHTML =
    '<div class="wcase">' + it[LANG] + '</div>' +
    '<div class="chips">' + names.map(function(b, k){
        return '<div class="chip" onclick="mapPick(' + k + ')">' + b + '</div>';
      }).join('') + '</div>' +
    tal +
    '<div class="wmsg ' + (MAP.note ? (MAP.noteOk ? 'ok' : 'warn') : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + (MAP.i + 1) + ' / ' + MAP.items.length + '</div>';
}

function mapPick(k){
  if (!MAP || MAP.done) return;
  var it = MAP.items[MAP.order[MAP.i]];
  if (k === it.bin) {
    MAP.tally[k]++; MAP.tries = 0; MAP.noteOk = true;
    MAP.note = S('Así es. ' + it.wes, 'That is it. ' + it.wen);
    MAP.i++;
    if (MAP.i >= MAP.items.length) MAP.done = true;
    mapRender();
    return;
  }
  MAP.tries++;
  if (MAP.tries >= 3) {
    MAP.tally[it.bin]++; MAP.tries = 0; MAP.noteOk = false;
    MAP.note = S('Este caso iba en ' + MAP_BINS.es[it.bin] + '. ' + it.wes,
                 'This case belonged in ' + MAP_BINS.en[it.bin] + '. ' + it.wen);
    MAP.i++;
    if (MAP.i >= MAP.items.length) MAP.done = true;
    mapRender();
    return;
  }
  MAP.noteOk = false;
  if (k === 0) {
    MAP.note = S('Todavía no. Aquí no discuten dos personas por su relación: revisa si son grupos completos o si lo que se disputa son las reglas.',
                 'Not yet. Here it is not two people arguing over their relationship: check whether whole groups are involved, or whether the rules are what is disputed.');
  } else if (k === 1) {
    MAP.note = S('Todavía no. Revisa si lo que está en juego es algo que dos grupos comparten, o más bien quién decide y con qué reglas.',
                 'Not yet. Check whether what is at stake is something two groups share, or rather who decides and under which rules.');
  } else {
    MAP.note = S('Todavía no. Revisa si de verdad se discuten las reglas y el poder público, o si el asunto se queda entre personas o entre grupos.',
                 'Not yet. Check whether the rules and public power are really in dispute, or whether the matter stays between people or between groups.');
  }
  mapRender();
}

/* ================================================

   The student taps a demand, then the need they think is hiding under it.
   A wrong pair does not lock: it answers with the question that finds the
   need. Third miss on the same demand reveals its pair (Rule 8, A).
   ================================================ */
var MTC = null;
function buildMatch(rng){
  var sets = [
    [ { p:{ es:'Que la cancha sea solo para nosotros.', en:'The court should be ours alone.' },
        q:{ es:'Necesito un horario seguro para entrenar antes del torneo.', en:'I need a reliable slot to train before the tournament.' } },

      { p:{ es:'No vuelvo a trabajar en equipo con ella.', en:'I am never working in a team with her again.' },
        q:{ es:'Necesito que el trabajo se reparta y que se reconozca lo que hice.', en:'I need the work shared out and my part recognized.' } },
      { p:{ es:'Que se cancele la fiesta del salón.', en:'The class party should be called off.' },
        q:{ es:'Necesito estudiar sin ruido la noche antes del examen.', en:'I need to study without noise the night before the exam.' } } ],
    [ { p:{ es:'Que nadie use el salón durante el receso.', en:'Nobody should use the classroom during break.' },
        q:{ es:'Necesito un lugar tranquilo para comer sin que me molesten.', en:'I need a quiet place to eat without being bothered.' } },
      { p:{ es:'Que se prohíban los celulares en todo el plantel.', en:'Phones should be banned across the whole school.' },
        q:{ es:'Necesito que dejen de circular fotos mías que nadie me pidió publicar.', en:'I need photos of me that nobody asked me about to stop circulating.' } },
      { p:{ es:'Que el maestro cambie de lugar a todo el grupo.', en:'The teacher should reseat the entire class.' },
        q:{ es:'Necesito ver el pizarrón desde donde estoy sentada.', en:'I need to see the board from where I am sitting.' } },
      { p:{ es:'Que se suspenda el torneo.', en:'The tournament should be suspended.' },
        q:{ es:'Necesito que se respete el resultado que ya quedó registrado.', en:'I need the result already on record to be respected.' } } ]
  ];
  var P = sets[Math.floor(rng() * sets.length)];
  var solved = [], i;
  for (i = 0; i < P.length; i++) solved.push(false);
  MTC = { pairs:P, right:shufflePerm(P.length, rng), sel:null, solved:solved, tries:0, msg:null, msgOk:false };
  return '<div class="wgt" data-widget="match" id="wMatch">' +
      '<div class="wgt-h">' + S('Del reclamo a la necesidad','From the demand to the need') + '</div>' +
      '<div class="wgt-q">' + S('Selecciona un reclamo y después la necesidad que se esconde debajo.',
                                'Select a demand and then the need hiding underneath it.') + '</div>' +
      '<div id="mtcBox"></div>' +
    '</div>';
}

function mtcRender(){
  if (!MTC) return;
  var box = document.getElementById('mtcBox');
  if (!box) return;
  var left = MTC.pairs.map(function(pr, i){
    var cls = 'optbox' + (MTC.solved[i] ? ' done' : '') + (MTC.sel === i ? ' sel' : '');
    return '<div class="' + cls + '" onclick="mtcLeft(' + i + ')">' + pr.p[LANG] + '</div>';
  }).join('');
  var right = MTC.right.map(function(r, pos){
    var cls = 'optbox' + (MTC.solved[r] ? ' done' : '');
    return '<div class="' + cls + '" onclick="mtcRight(' + pos + ')">' + MTC.pairs[r].q[LANG] + '</div>';
  }).join('');
  var done = MTC.solved.every(function(s){ return s; });
  var msg = MTC.msg || S('Un reclamo dice lo que alguien pide. La necesidad dice por qué lo pide, y ahí caben más soluciones.',
                         'A demand says what someone asks for. The need says why they ask for it, and more solutions fit there.');
  if (done) {
    msg = S('Los cuatro reclamos quedaron unidos a su necesidad. Fíjate en algo: casi ninguna necesidad exige exactamente lo que pedía el reclamo.',
            'All four demands are linked to their need. Notice something: almost no need requires exactly what the demand asked for.');
  }
  box.innerHTML =
    '<div class="mcols">' +
      '<div><div class="colh">' + S('Lo que se pide','What is demanded') + '</div>' + left + '</div>' +
      '<div><div class="colh">' + S('Lo que se necesita','What is needed') + '</div>' + right + '</div>' +
    '</div>' +
    '<div class="wmsg ' + (done || MTC.msgOk ? 'ok' : (MTC.msg ? 'warn' : '')) + '">' + msg + '</div>' +
    '<div class="wprog">' + MTC.solved.filter(function(s){ return s; }).length + ' / ' + MTC.pairs.length + '</div>';
}

function mtcLeft(i){
  if (!MTC || MTC.solved[i]) return;
  if (MTC.sel !== i) MTC.tries = 0;
  MTC.sel = (MTC.sel === i) ? null : i;
  MTC.msg = null; MTC.msgOk = false;
  mtcRender();
}

function mtcRight(pos){
  if (!MTC) return;
  var r = MTC.right[pos];
  if (MTC.solved[r]) return;
  if (MTC.sel === null) {
    MTC.msgOk = false;
    MTC.msg = S('Elige primero un reclamo de la columna izquierda.', 'Pick a demand from the left column first.');
    mtcRender(); return;
  }
  if (r === MTC.sel) {
    MTC.solved[r] = true; MTC.sel = null; MTC.tries = 0; MTC.msgOk = true;
    MTC.msg = S('Encaja. Con la necesidad a la vista aparecen soluciones que el reclamo original cerraba.',
                'It fits. With the need in view, solutions appear that the original demand shut down.');
    mtcRender(); return;
  }
  MTC.tries++;
  if (MTC.tries >= 3) {
    var s = MTC.sel;
    MTC.solved[s] = true; MTC.sel = null; MTC.tries = 0; MTC.msgOk = false;
    MTC.msg = S('Ese reclamo escondía esta necesidad: ' + MTC.pairs[s].q.es + ' Quien reclama no siempre sabe nombrarla.',
                'That demand was hiding this need: ' + MTC.pairs[s].q.en + ' The person demanding cannot always name it.');
    mtcRender(); return;
  }
  MTC.msgOk = false;
  MTC.msg = S('Esa no. Pregúntate qué quedaría cubierto para esa persona si su reclamo se cumpliera tal cual.',
              'Not that one. Ask what would be covered for that person if their demand were met exactly as stated.');
  mtcRender();
}

/* ================================================
   WIDGET 3 - ORDENA LA RUTA (secuenciador)
   Six steps arrive scrambled; two taps swap them. A failed check names the
   first step that is out of place and asks what has to happen before it.
   Third failed check lays the route out in order (Rule 8, A).
   ================================================ */
var RUT = null;
function buildRuta(rng){
  var pools = [
    { t:{ es:'Ruta de una mediación', en:'Route of a mediation' },
      steps:[
        { es:'Las dos partes aceptan participar y acuerdan las reglas de la conversación.', en:'Both parties agree to take part and settle the rules of the conversation.' },
        { es:'Cada parte cuenta el conflicto sin ser interrumpida.', en:'Each party tells the conflict without being interrupted.' },
        { es:'La persona mediadora resume lo que cada parte necesita.', en:'The mediator sums up what each party needs.' },
        { es:'Entre todas se proponen varias opciones de solución.', en:'Together they put forward several possible solutions.' },
        { es:'Se elige una opción y se escribe el acuerdo con responsables y fechas.', en:'One option is chosen and the agreement is written with names and dates.' },
        { es:'En la fecha pactada se revisa si el acuerdo se cumplió.', en:'On the agreed date they review whether the agreement was kept.' } ] },
    { t:{ es:'Ruta de una demanda hacia un acuerdo público', en:'Route from a demand to a public agreement' },
      steps:[
        { es:'Un grupo identifica el problema y lo pone por escrito.', en:'A group identifies the problem and puts it in writing.' },
        { es:'Reúne datos y firmas que respalden la demanda.', en:'It gathers data and signatures backing the demand.' },
        { es:'Presenta la demanda ante la autoridad y solicita audiencia.', en:'It files the demand with the authority and requests a hearing.' },
        { es:'Se instala una mesa de diálogo con las partes y una figura facilitadora.', en:'A dialogue table opens with the parties and a facilitator.' },
        { es:'Se firma un acuerdo público con responsables y plazos.', en:'A public agreement is signed with names and deadlines.' },
        { es:'Se vigila el cumplimiento y se informa al resto de la comunidad.', en:'Compliance is monitored and the rest of the community is informed.' } ] }
  ];
  var P = pools[Math.floor(rng() * pools.length)];
  RUT = { pool:P, order:shufflePerm(P.steps.length, rng), sel:null, tries:0, done:false, msg:null, msgOk:false };
  return '<div class="wgt" data-widget="timeline" id="wRuta">' +
      '<div class="wgt-h">' + S('Ordena la ruta','Put the route in order') + '</div>' +
      '<div class="wgt-q">' + S('Los pasos llegaron revueltos. Selecciona dos pasos para intercambiarlos hasta que la ruta tenga sentido.',
                                'The steps arrived scrambled. Select two steps to swap them until the route makes sense.') + '</div>' +
      '<div id="rutBox"></div>' +
    '</div>';
}

function rutRender(){
  if (!RUT) return;
  var box = document.getElementById('rutBox');
  if (!box) return;
  var chips = RUT.order.map(function(si, pos){
    var cls = 'tl-chip' + (RUT.sel === pos ? ' sel' : '') + (RUT.done ? ' locked' : '');
    return '<div class="' + cls + '" onclick="rutTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span> ' + RUT.pool.steps[si][LANG] + '</div>';
  }).join('');
  var msg = RUT.msg || S('Una ruta funciona cuando cada paso vuelve posible al siguiente.',
                         'A route works when each step makes the next one possible.');
  box.innerHTML =
    '<div class="colh">' + RUT.pool.t[LANG] + '</div>' +
    '<div class="tl-list">' + chips + '</div>' +
    (RUT.done ? '' : '<button class="wbtn" onclick="rutCheck()">' + S('Comprobar la ruta','Check the route') + '</button>') +
    '<div class="wmsg ' + (RUT.msgOk ? 'ok' : (RUT.msg ? 'warn' : '')) + '">' + msg + '</div>';
}

function rutTap(pos){
  if (!RUT || RUT.done) return;
  if (RUT.sel === null) { RUT.sel = pos; }
  else if (RUT.sel === pos) { RUT.sel = null; }
  else {
    var t = RUT.order[RUT.sel]; RUT.order[RUT.sel] = RUT.order[pos]; RUT.order[pos] = t; RUT.sel = null;
  }
  rutRender();
}

function rutCheck(){
  if (!RUT || RUT.done) return;
  var ok = true, first = -1, i;
  for (i = 0; i < RUT.order.length; i++) if (RUT.order[i] !== i) { ok = false; if (first < 0) first = i; }
  if (ok) {
    RUT.done = true; RUT.msgOk = true;
    RUT.msg = S('Ruta armada. Ningún acuerdo se firma antes de que las partes hayan sido escuchadas, y ninguno se sostiene si nadie revisa después.',
                'Route assembled. No agreement gets signed before the parties have been heard, and none holds if nobody checks afterwards.');
    rutRender(); return;
  }
  RUT.tries++;
  if (RUT.tries >= 3) {
    RUT.order = RUT.pool.steps.map(function(_, k){ return k; });
    RUT.done = true; RUT.msgOk = false;
    RUT.msg = S('Esta es la ruta completa. Observa que escuchar viene antes de proponer, y proponer antes de firmar.',
                'This is the full route. Notice that listening comes before proposing, and proposing before signing.');
    rutRender(); return;
  }
  RUT.msgOk = false;
  RUT.msg = S('Todavía no. Mira el paso que ocupa el lugar ' + (first + 1) + ': ¿qué tendría que haber pasado antes de que ese paso fuera posible?',
              'Not yet. Look at the step sitting in place ' + (first + 1) + ': what would have to happen before that step were possible?');
  rutRender();
}

/* ================================================
   WIDGET 4 - CONSTRUCTOR DE ACUERDOS (medidores en vivo)
   Three measures out of six. Every tap moves three meters at once, so the
   student sees a measure that calms the noise but leaves the need untouched.
   A failed check names the meter that fell shortest and by how much; the
   third one lays out a combination that clears all three (Rule 8, A).
   ================================================ */
var ACU = null;
function buildAcuerdo(rng){
  var cases = [
    { caso:{ es:'En la escuela, el equipo de futbol y el grupo de danza reclaman el patio a la misma hora del receso. Cada semana terminan discutiendo.',
             en:'At school, the football team and the dance group both claim the yard at the same break time. Every week it ends in an argument.' },
      m:[ { es:'Prohibir el uso del patio en el receso hasta nuevo aviso.', en:'Ban the use of the yard at break until further notice.', n:0, i:0, s:1 },
          { es:'Acordar un calendario de uso del patio que los dos grupos firmen.', en:'Agree on a yard schedule that both groups sign.', n:2, i:2, s:2 },
          { es:'Dar el patio cada día al grupo que llegue primero.', en:'Give the yard each day to whichever group arrives first.', n:1, i:0, s:0 },
          { es:'Formar una comisión con integrantes de ambos grupos que revise el acuerdo cada mes.', en:'Set up a committee with members of both groups that reviews the agreement monthly.', n:1, i:2, s:2 },
          { es:'Habilitar el salón de usos múltiples para los ensayos los días de partido.', en:'Open the multipurpose room for rehearsals on match days.', n:2, i:1, s:2 },
          { es:'Sancionar a quien reclame el patio durante el receso.', en:'Punish anyone who claims the yard during break.', n:0, i:0, s:0 } ] },
    { caso:{ es:'En la colonia, un grupo de vecinos y un colectivo de patinaje reclaman la plaza los fines de semana. Las quejas se acumulan en el módulo municipal.',
             en:'In the neighborhood, a residents group and a skating collective both claim the square on weekends. Complaints pile up at the municipal office.' },
      m:[ { es:'Cerrar la plaza los fines de semana hasta que dejen de llegar quejas.', en:'Close the square on weekends until the complaints stop arriving.', n:0, i:0, s:1 },
          { es:'Acordar un calendario de horarios y zonas que ambas partes firmen.', en:'Agree on a schedule of times and zones that both parties sign.', n:2, i:2, s:2 },
          { es:'Entregar la plaza cada semana a quien pida primero el permiso.', en:'Hand the square each week to whoever requests the permit first.', n:1, i:0, s:0 },
          { es:'Instalar una reunión mensual donde ambas partes revisen el calendario.', en:'Set a monthly meeting where both parties review the schedule.', n:1, i:2, s:2 },
          { es:'Adaptar el patio de la casa de cultura para practicar en las horas de mayor uso.', en:'Adapt the culture house courtyard for practice at the busiest hours.', n:2, i:1, s:2 },
          { es:'Multar a quien use la plaza fuera del horario permitido.', en:'Fine anyone using the square outside the allowed hours.', n:0, i:0, s:0 } ] }
  ];
  var C = cases[Math.floor(rng() * cases.length)];
  ACU = { c:C, sel:[], tries:0, revealed:false, msg:null, msgOk:false, best:[1,3,4], goal:5 };
  return '<div class="wgt" data-widget="build" id="wAcuerdo">' +
      '<div class="wgt-h">' + S('Constructor de acuerdos','Agreement builder') + '</div>' +
      '<div class="wgt-q">' + S('Elige tres medidas y observa cómo se mueven los tres medidores.',
                                'Choose three measures and watch the three meters move.') + '</div>' +
      '<div id="acuBox"></div>' +
    '</div>';
}

function acuLabels(){
  return LANG === 'es'
    ? ['Atiende la necesidad de fondo', 'Incluye a las dos partes', 'Se puede sostener en el tiempo']
    : ['Addresses the underlying need', 'Includes both parties', 'Can be sustained over time'];
}

function acuScores(){
  var v = [0, 0, 0], k;
  for (k = 0; k < ACU.sel.length; k++) {
    var m = ACU.c.m[ACU.sel[k]];
    v[0] += m.n; v[1] += m.i; v[2] += m.s;
  }
  return v;
}

function acuRender(){
  if (!ACU) return;
  var box = document.getElementById('acuBox');
  if (!box) return;
  var labels = acuLabels(), v = acuScores();
  var boxes = ACU.c.m.map(function(m, k){
    var cls = 'optbox' + (ACU.sel.indexOf(k) >= 0 ? ' sel' : '');
    return '<div class="' + cls + '" onclick="acuTap(' + k + ')">' + m[LANG] + '</div>';
  }).join('');
  var meters = labels.map(function(lb, k){
    var w = Math.round(v[k] / 6 * 100);
    return '<div class="mtr"><div class="mtrlbl"><span>' + lb + '</span><span>' + v[k] + ' / 6</span></div>' +
      '<div class="mtrtrack"><div class="mtrfill' + (v[k] >= ACU.goal ? ' ok' : '') + '" style="width:' + w + '%"></div></div></div>';
  }).join('');
  var msg = ACU.msg || S('Una medida puede callar el ruido y dejar intacto el motivo. Los medidores te dicen cuál es cuál.',
                         'A measure can silence the noise and leave the reason untouched. The meters tell you which is which.');
  box.innerHTML =
    '<div class="wcase">' + ACU.c.caso[LANG] + '</div>' +
    boxes +
    '<div style="margin-top:.9rem">' + meters + '</div>' +
    (ACU.revealed ? '' : '<button class="wbtn" onclick="acuCheck()">' + S('Comprobar el acuerdo','Check the agreement') + '</button>') +
    '<div class="wmsg ' + (ACU.msgOk ? 'ok' : (ACU.msg ? 'warn' : '')) + '">' + msg + '</div>' +
    '<div class="wprog">' + S('Medidas elegidas: ','Measures chosen: ') + ACU.sel.length + ' / 3</div>';
}

function acuTap(k){
  if (!ACU || ACU.revealed) return;
  var at = ACU.sel.indexOf(k);
  if (at >= 0) { ACU.sel.splice(at, 1); ACU.msg = null; ACU.msgOk = false; acuRender(); return; }
  if (ACU.sel.length >= 3) {
    ACU.msgOk = false;
    ACU.msg = S('Ya tienes tres medidas. Quita una para poder cambiarla.', 'You already have three measures. Remove one to swap it.');
    acuRender(); return;
  }
  ACU.sel.push(k); ACU.msg = null; ACU.msgOk = false;
  acuRender();
}

function acuCheck(){
  if (!ACU || ACU.revealed) return;
  if (ACU.sel.length !== 3) {
    ACU.msgOk = false;
    ACU.msg = S('Elige exactamente tres medidas antes de comprobar.', 'Choose exactly three measures before checking.');
    acuRender(); return;
  }
  var v = acuScores(), labels = acuLabels(), k, worst = 0;
  for (k = 1; k < 3; k++) if (v[k] < v[worst]) worst = k;
  if (v[0] >= ACU.goal && v[1] >= ACU.goal && v[2] >= ACU.goal) {
    ACU.revealed = true; ACU.msgOk = true;
    ACU.msg = S('Los tres medidores pasaron la marca. Un acuerdo así atiende el motivo, se decide con las dos partes y tiene una fecha para revisarse.',
                'All three meters cleared the mark. An agreement like this addresses the reason, is decided with both parties, and has a date to be reviewed.');
    acuRender(); return;
  }
  ACU.tries++;
  if (ACU.tries >= 3) {
    ACU.sel = ACU.best.slice();
    ACU.revealed = true; ACU.msgOk = false;
    ACU.msg = S('Esta combinación cruza las tres marcas: dar a cada parte lo que necesita, decidirlo con las dos y dejar quién revisa y cuándo.',
                'This combination clears all three marks: give each party what it needs, decide it with both, and set who reviews it and when.');
    acuRender(); return;
  }
  ACU.msgOk = false;
  ACU.msg = S('Tu acuerdo se queda corto en: ' + labels[worst] + '. Le faltan ' + (ACU.goal - v[worst]) + ' puntos. Cambia una medida y vuelve a mirar los medidores.',
              'Your agreement falls short on: ' + labels[worst] + '. It is ' + (ACU.goal - v[worst]) + ' points short. Swap one measure and look at the meters again.');
  acuRender();
}

/* ================================================
   WIDGET 5 - CUADERNO ABIERTO (escribir o trazar)
   The humanities analogue of showing your work: a seeded prompt the student
   answers by writing or sketching. Encouraging, never a verdict.
   ================================================ */
function buildCuaderno(rng){
  var PROMPTS = [
    { es:'Elige un conflicto que hayas visto en tu escuela o en tu colonia. Escribe cuál era la posición de cada parte y cuál podría ser la necesidad que había debajo.',
      en:'Pick a conflict you have seen at school or in your neighborhood. Write down each party position and what need might sit underneath it.' },
    { es:'Traza la ruta que seguirías para resolver un conflicto entre dos grupos de tu comunidad y marca en qué punto entra una persona mediadora.',
      en:'Sketch the route you would follow to settle a conflict between two groups in your community and mark where a mediator steps in.' },
    { es:'Redacta un acuerdo de tres puntos para un conflicto surgido en un grupo de chat: quién se compromete a qué, y cómo se revisará.',
      en:'Draft a three point agreement for a conflict that started in a chat group: who commits to what, and how it will be reviewed.' }
  ];

  wrap.className = 'wgt section';
  wrap.setAttribute('data-widget', 'reflect');
  wrap.id = 'wCuaderno';
  wrap.innerHTML =
    '<div class="wgt-h">' + S('Cuaderno abierto','Open notebook') + '</div>' +
    '<div class="reflect-prompt">' + p[LANG] + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" onclick="cuadTab(\'type\',this)">' + t('tab-type') + '</button>' +
      '<button class="wtab" onclick="cuadTab(\'draw\',this)">' + t('tab-draw') + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="cuad_type"><textarea class="wtextarea" id="cuadTa" placeholder="' + S('Tu respuesta...','Your answer...') + '"></textarea></div>' +
    '<div class="wpanel" id="cuad_draw"><div class="cvwrap"><canvas class="dcanvas" id="cuadCv"></canvas>' +
      '<div class="ctoolbar">' +
        '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
        '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
        '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
        '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
        '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
        '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
        '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
        '<button class="clrbtn">' + t('btn-clear') + '</button>' +
      '</div>' +
    '</div></div>' +
    '<button class="wbtn" onclick="cuadSave()">' + S('Guardar','Save') + '</button>' +
    '<div class="wmsg" id="cuadFb">' + S('Aquí no hay una sola respuesta. Escribe la tuya y compárala después con la de alguien más.',
                                         'There is no single answer here. Write yours and compare it later with someone else.') + '</div>';
  document.getElementById('lessonBody').appendChild(wrap);
}

function cuadTab(which, btn){
  ['type', 'draw'].forEach(function(x){
    var el = document.getElementById('cuad_' + x);
    if (el) el.classList.toggle('active', x === which);
  });
  var wrap = document.getElementById('wCuaderno');
  if (wrap) wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('cuadCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function cuadSave(){
  var fb = document.getElementById('cuadFb');
  if (!fb) return;
  fb.className = 'wmsg ok';
  fb.textContent = S('Guardado. Buen razonamiento: lo que escribiste ya es una propuesta, y una propuesta se puede poner sobre una mesa.',
                     'Saved. Good thinking: what you wrote is already a proposal, and a proposal can be put on a table.');
}

/* ================================================
   buildLesson - interleaved concept, manipulative, graded problem (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* CONCEPTO 1 */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('Un conflicto no es una pelea','A conflict is not a fight') + '</h2>' +
    '<p>' + S('Un conflicto aparece cuando dos partes quieren cosas que no caben juntas al mismo tiempo. Eso ocurre en cualquier grupo humano y no es una falla: es la señal de que hay personas distintas con necesidades distintas. La violencia es otra cosa. La violencia es una de las respuestas posibles ante el conflicto, y es la que daña a alguien para cerrarlo.',
              'A conflict appears when two parties want things that do not fit together at the same time. This happens in any human group and it is not a failure: it is the sign that different people have different needs. Violence is something else. Violence is one of the possible responses to a conflict, and it is the one that harms someone in order to close it.') + '</p>' +
    '<p>' + S('Conviene además saber con quién se discute. Un conflicto interpersonal ocurre entre personas concretas y se juega dentro de su relación. Un conflicto social enfrenta a grupos por algo que comparten: un recurso, un espacio, un servicio, un reconocimiento. Un conflicto político discute otra cosa: las reglas, las decisiones públicas y quién tiene la facultad de tomarlas.',
              'It also helps to know who is arguing. An interpersonal conflict happens between specific people and plays out inside their relationship. A social conflict sets groups against each other over something they share: a resource, a space, a service, a recognition. A political conflict argues about something else: the rules, the public decisions, and who holds the power to make them.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('el conflicto es inevitable, la violencia no. Entre los dos hay siempre una decisión, y esa decisión se puede aprender.',
        'the conflict is unavoidable, the violence is not. Between the two there is always a decision, and that decision can be learned.') + '</p></div>' +
    '<div class="rules-grid">' +

  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Debajo de cada reclamo hay una necesidad','Under every demand there is a need') + '</h2>' +
    '<p>' + S('Cuando alguien entra en un conflicto suele llegar con una posición: una sola solución ya elegida, dicha en voz alta, casi siempre en forma de exigencia. Debajo de esa posición hay un interés, que es la razón por la que la pide, y más abajo todavía una necesidad, que es aquello que esa persona no puede dejar de cubrir.',
              'When someone enters a conflict they usually arrive with a position: a single solution already chosen, said out loud, almost always in the form of a demand. Under that position there is an interest, which is the reason they ask for it, and further down a need, which is what that person cannot go without.') + '</p>' +
    '<p>' + S('La diferencia importa por una razón práctica. Dos posiciones opuestas no caben juntas: si una gana, la otra pierde. Dos necesidades, en cambio, casi siempre caben, porque suele haber varias formas de cubrirlas. Por eso quien conduce un diálogo pregunta para qué, y no solo qué quieres.',
              'The difference matters for a practical reason. Two opposing positions do not fit together: if one wins, the other loses. Two needs, on the other hand, almost always fit, because there tend to be several ways of covering them. That is why whoever leads a dialogue asks what for, and not only what do you want.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Posición','Position') + '</div><div class="rform">' + S('lo que exijo','what I demand') + '</div><div class="rnote">' + S('Una sola solución, dicha como exigencia.','A single solution, said as a demand.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Interés','Interest') + '</div><div class="rform">' + S('para qué lo pido','what I ask it for') + '</div><div class="rnote">' + S('La razón que sostiene la exigencia.','The reason holding up the demand.') + '</div></div>' +

    '</div>' +
    buildMatch(rng));

  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Formas de tramitar un conflicto','Ways of handling a conflict') + '</h2>' +
    '<p>' + S('Frente a un mismo conflicto caben respuestas muy distintas. La evasión lo deja correr y suele agravarlo. La imposición lo cierra por la fuerza o por la autoridad, sin escuchar. La negociación pone a las partes a construir un acuerdo entre ellas. La mediación agrega a una persona imparcial que no decide nada, solo ordena la conversación. El arbitraje también trae a un tercero, pero ahí sí es él quien decide y las partes se comprometen a acatar.',
              'Facing the same conflict, very different responses fit. Avoidance lets it run and usually makes it worse. Imposition closes it by force or by authority, without listening. Negotiation puts the parties to build an agreement between themselves. Mediation adds an impartial person who decides nothing, and only orders the conversation. Arbitration also brings a third party, but there it is that party who decides and the sides commit to comply.') + '</p>' +
    '<p>' + S('Elegir bien depende de dos cosas: si las partes todavía pueden hablarse y si quieren conservar la decisión en sus manos. Cuando ambas cosas se cumplen pero la conversación se descarrila, la mediación es la vía; cuando la confianza ya se rompió del todo y hace falta una resolución obligatoria, se recurre al arbitraje o a una instancia formal.',
              'Choosing well depends on two things: whether the parties can still talk to each other, and whether they want to keep the decision in their own hands. When both hold but the conversation keeps derailing, mediation is the route; when trust has broken completely and a binding resolution is needed, arbitration or a formal body is used.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Fíjate: ','Notice: ') + '</strong>' +
      S('en la mediación el acuerdo lo escriben las partes; en el arbitraje lo escribe el tercero. Esa es la diferencia que decide cuál conviene.',
        'in mediation the agreement is written by the parties; in arbitration it is written by the third party. That is the difference that decides which one fits.') + '</p></div>' +
    buildRuta(rng));

  }, rng);

    '<h2>' + S('La paz que se ve y la paz que se construye','The peace you see and the peace you build') + '</h2>' +
    '<p>' + S('Hay una paz que consiste solo en que se detuvieron los golpes. Es real y es valiosa, porque nadie está siendo lastimado en este momento, pero es frágil: si el motivo del enfrentamiento sigue intacto, la calma dura lo que dure la vigilancia. La cultura de paz apunta más lejos, a que las causas queden atendidas y a que existan formas acordadas de tramitar los desacuerdos que vendrán.',
              'There is a peace that consists only in the blows having stopped. It is real and valuable, because nobody is being hurt right now, but it is fragile: if the reason for the clash stays intact, the calm lasts as long as the watching does. A culture of peace aims further, at the causes being addressed and at agreed ways of handling the disagreements still to come.') + '</p>' +
    '<p>' + S('Esa mirada obliga a reconocer daños que no se ven como golpes. Hay violencia directa, que se identifica de inmediato. Hay violencia estructural, que no tiene un autor visible: está en cómo se reparten los servicios, los horarios, el dinero o el idioma de los trámites, y deja a ciertos grupos siempre atrás. Y hay violencia cultural, que es el conjunto de ideas que hace parecer normal esa desventaja. Trabajar por la paz supone tocar las tres, respetando la dignidad, la diversidad y la inclusión de quienes participan.',
              'That view forces the recognition of harms that do not look like blows. There is direct violence, identified at once. There is structural violence, with no visible author: it sits in how services, schedules, money or the language of paperwork are distributed, and leaves certain groups always behind. And there is cultural violence, the set of ideas that makes such disadvantage look normal. Working for peace means touching all three, while respecting the dignity, diversity and inclusion of those taking part.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Paz negativa','Negative peace') + '</div><div class="rform">' + S('¿pararon los golpes?','did the blows stop?') + '</div><div class="rnote">' + S('Necesaria, pero dura mientras dure la vigilancia.','Necessary, but it lasts as long as the watching.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Paz positiva','Positive peace') + '</div><div class="rform">' + S('¿se atendió la causa?','was the cause addressed?') + '</div><div class="rnote">' + S('Acuerdos que sostienen la convivencia.','Agreements that hold daily life together.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Violencia directa','Direct violence') + '</div><div class="rform">' + S('¿quién daña?','who is harming?') + '</div><div class="rnote">' + S('Golpes, insultos, amenazas, exclusión abierta.','Blows, insults, threats, open exclusion.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Violencia estructural','Structural violence') + '</div><div class="rform">' + S('¿cómo está organizado?','how is it organized?') + '</div><div class="rnote">' + S('El arreglo cotidiano deja fuera a los mismos.','The everyday setup leaves the same people out.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Violencia cultural','Cultural violence') + '</div><div class="rform">' + S('¿qué se cree normal?','what looks normal?') + '</div><div class="rnote">' + S('Ideas que justifican la desventaja de otros.','Ideas that justify the disadvantage of others.') + '</div></div>' +
    '</div>' +
    buildAcuerdo(rng));

  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('Decidir bien en la plaza y en la pantalla','Deciding well in the square and on the screen') + '</h2>' +
    '<p>' + S('Los conflictos que empiezan en un pasillo continúan en un grupo de chat, y muchos nacen directamente ahí. Lo que cambia en línea es la velocidad, el número de personas que miran y la facilidad para dañar la imagen de alguien sin verle la cara. Lo que no cambia es el criterio: la dignidad de las personas no se negocia, ni presencialmente ni en la pantalla.',
              'Conflicts that start in a hallway continue in a chat group, and many are born there. What changes online is the speed, the number of people watching and how easy it is to damage someone reputation without seeing their face. What does not change is the criterion: the dignity of people is not up for negotiation, neither in person nor on a screen.') + '</p>' +
    '<p>' + S('En los conflictos políticos ocurre algo parecido a mayor escala. Un desacuerdo sobre una regla se resuelve documentando el caso, buscando a quien tiene la facultad de decidir, pidiendo audiencia y llevando la discusión a una mesa pública donde estén las partes afectadas. Difundir información falsa o exponer a personas acelera el ruido y cierra justamente la puerta que se necesita abrir.',
              'In political conflicts something similar happens on a larger scale. A disagreement about a rule is settled by documenting the case, finding whoever holds the power to decide, requesting a hearing and taking the discussion to a public table where the affected parties sit. Spreading false information or exposing people speeds up the noise and shuts exactly the door that needs to be opened.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Antes de enviar: ','Before you send: ') + '</strong>' +
      S('pregúntate si lo que vas a publicar es cierto, si daña a alguien, si abre una salida y si lo dirías con esa persona delante.',
        'ask whether what you are about to post is true, whether it harms someone, whether it opens a way out and whether you would say it with that person in front of you.') + '</p></div>');
