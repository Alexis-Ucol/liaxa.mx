      hint: { es:'Lee la frase en voz baja con la palabra y sin ella. Fíjate en si sigue diciendo que una cosa se parece a otra o si pasa a decir que una cosa es la otra.',
              en:'Read the sentence quietly with the word and without it. Notice whether it still says that one thing resembles another or whether it starts saying that one thing is the other.' },
      exp: { es:'Sin esa palabra ya no hay dos cosas separadas: una pasa a llamarse con el nombre de la otra y la imagen gana fuerza. No pierde el sentido ni se convierte en exageración, y desde luego no queda igual.',
             en:'Without that word there are no longer two separate things: one comes to be called by the name of the other and the image gains force. It does not lose its meaning nor turn into an exaggeration, and it certainly does not stay the same.' },
      options: [GEN.quitar.c].concat(GEN.quitar.d),
      correct: GEN.quitar.c
    };
  }

  function q5() {
    var key = (rng() < 0.5) ? 'sinestesia' : 'antitesis';
    var f = figOf(C.auto, key);
    var op = [qo(f)].concat(otherFigs(C.auto, key, 3).map(qo));
    var task = (key === 'sinestesia')
      ? { es:'Identifica aquel en el que una misma imagen mezcla lo que se percibe con dos sentidos distintos.',
          en:'Identify the one in which a single image mixes what is perceived with two different senses.' }
      : { es:'Identifica aquel en el que dos ideas contrarias quedan enfrentadas dentro de la misma frase.',
          en:'Identify the one in which two opposite ideas are set against each other inside the same sentence.' };
    var pista = (key === 'sinestesia')
      ? { es:'Pregúntate con qué sentido se percibe cada palabra de la imagen: si una se ve y la otra se huele, o una se toca y la otra se oye, ya encontraste el fragmento.',
          en:'Ask yourself which sense perceives each word of the image: if one is seen and the other smelled, or one touched and the other heard, you have found the fragment.' }
      : { es:'Busca el fragmento partido en dos mitades que dicen cosas opuestas, unidas por un punto y coma o por una conjunción, no el más largo ni el más exagerado.',
          en:'Look for the fragment split into two halves that say opposite things, joined by a semicolon or a conjunction, not the longest or the most exaggerated one.' };
    return {
      title: (key === 'sinestesia') ? { es:'Dos sentidos en una imagen', en:'Two senses in one image' }
                                    : { es:'Dos ideas enfrentadas', en:'Two ideas set against each other' },
      q: { es:'Estos cuatro fragmentos pertenecen a ' + Q(C.auto.title) + '. ' + task.es,
           en:'These four fragments belong to ' + Q(C.auto.title) + '. ' + task.en },
      hint: pista,
      exp: { es:'Solo uno cumple lo que se pedía: ' + L(f.eff) + '. Los otros tres trabajan con un recurso distinto.',
             en:'Only one meets what was asked: ' + L(f.eff) + '. The other three work with a different device.' },
      options: op,
      correct: op[0]
    };
  }

  function q6() {
    if (rng() < 0.5) {
      var fp = figOf(C.auto, 'personificacion');
      return {
        title: { es:'Cuando el obstáculo decide', en:'When the obstacle decides' },
        q: { es:'En ' + Q(C.auto.title) + ' aparece esta línea: ' + Q(fp) + '. Determina qué efecto produce en quien lee.',
             en:'In ' + Q(C.auto.title) + ' this line appears: ' + Q(fp) + '. Determine what effect it produces in the reader.' },
        hint: { es:'Compara esa línea con la versión neutra del mismo hecho. Pregúntate qué papel recibe aquello que estorbaba cuando se le presta una voluntad.',
                en:'Compare that line with the neutral version of the same fact. Ask what role the thing standing in the way receives when it is lent a will of its own.' },
        exp: { es:'Al prestarle voluntad a algo que no la tiene, ese algo se convierte en un adversario y el esfuerzo se lee como un pulso. Aquí ' + L(fp.eff) + '.',
               en:'By lending a will to something that has none, that something becomes an adversary and the effort reads as a struggle. Here ' + L(fp.eff) + '.' },
        options: [GEN.efectoPers.c].concat(GEN.efectoPers.d),
        correct: GEN.efectoPers.c
      };
    }
    var fs = figOf(C.auto, 'sinestesia');
    return {
      title: { es:'La sensación por dos vías', en:'The sensation through two channels' },
      q: { es:'En ' + Q(C.auto.title) + ' aparece esta línea: ' + Q(fs) + '. Determina qué consigue en quien lee esa mezcla de sentidos.',
           en:'In ' + Q(C.auto.title) + ' this line appears: ' + Q(fs) + '. Determine what that mixture of senses achieves in the reader.' },
      hint: { es:'Fíjate en el momento en que reaccionas al leerla: si la sensación llega antes de que puedas explicar la frase, ahí está el efecto que se busca.',
              en:'Notice the moment when you react as you read it: if the sensation arrives before you can explain the sentence, that is the effect being sought.' },
      exp: { es:'La imagen llega por dos sentidos a la vez, y por eso se siente antes de entenderse del todo. Aquí ' + L(fs.eff) + '.',
             en:'The image arrives through two senses at once, which is why it is felt before it is fully understood. Here ' + L(fs.eff) + '.' },
      options: [GEN.efectoSin.c].concat(GEN.efectoSin.d),
      correct: GEN.efectoSin.c
    };
  }

  function q7() {
    if (rng() < 0.5) {
      return {
        title: { es:'Quién sostiene la pluma', en:'Who holds the pen' },
        q: { es:'Imagina que lees el Texto I sin conocer su título ni saber quién lo firma. Determina qué rasgo basta para reconocer que se trata de una autobiografía.',
             en:'Imagine reading Text I without knowing its title or who signed it. Determine which single trait is enough to recognise that it is an autobiography.' },
        hint: { es:'Descarta los rasgos que también aparecen en textos escritos sobre la vida de otras personas. Quédate con el único que solo puede darse cuando quien escribe y quien vivió los hechos son la misma persona.',
                en:'Rule out the traits that also appear in texts written about other people’s lives. Keep the only one that can happen only when the writer and the one who lived the events are the same person.' },
        exp: { es:'Las fechas, las imágenes y los recuerdos de infancia caben en cualquiera de los dos textos. Lo que distingue a la autobiografía es que quien narra y quien vivió son la misma persona, y por eso recuerda desde dentro.',
               en:'Dates, images and childhood memories fit in either text. What sets the autobiography apart is that the one narrating and the one who lived are the same person, and that is why they remember from inside.' },
        options: [GEN.rasgo.c].concat(GEN.rasgo.d),
        correct: GEN.rasgo.c
      };
    }
    var op = [qo(C.cual.c)].concat(C.cual.d.map(qo));
    return {
      title: { es:'De cuál de los dos textos', en:'From which of the two texts' },
      q: { es:'Uno de estos cuatro fragmentos salió del Texto I y los otros tres del Texto II. Identifica el que pertenece a la autobiografía.',
           en:'One of these four fragments came from Text I and the other three from Text II. Identify the one that belongs to the autobiography.' },
      hint: { es:'No te fijes en el tema, porque los dos textos hablan de la misma persona. Fíjate en quién habla dentro de cada frase y a quién señalan los verbos y los posesivos.',
              en:'Do not look at the subject, because both texts speak about the same person. Look at who is speaking inside each sentence and at whom the verbs and possessives point.' },
      exp: { es:'Tres fragmentos hablan de esa persona desde fuera, en tercera persona. Solo uno habla desde el yo de quien vivió los hechos, y ese pertenece a la autobiografía.',
             en:'Three fragments speak about that person from outside, in the third person. Only one speaks from the I of the person who lived the events, and that one belongs to the autobiography.' },
      options: op,
      correct: op[0]
    };
  }

  function q8() {
    if (rng() < 0.5) {
      return {
        title: { es:'Dos maneras de contar una vida', en:'Two ways of telling a life' },
        q: { es:'Los dos textos que leíste cuentan la misma vida. Determina cuál es la diferencia que separa a una autobiografía de una biografía.',
             en:'The two texts you read tell the same life. Determine the difference that separates an autobiography from a biography.' },
        hint: { es:'Pon a prueba cada opción con los dos textos que tienes delante: si un rasgo aparece en los dos, no puede ser lo que los distingue.',
                en:'Test each option against the two texts in front of you: if a trait shows up in both, it cannot be what tells them apart.' },
        exp: { es:'Los dos textos usan recursos, los dos cuentan hechos verdaderos y los dos pueden escribirse en cualquier momento de la vida. Lo que cambia es quién escribe y desde qué persona gramatical habla.',
               en:'Both texts use devices, both tell true events and both can be written at any point in a life. What changes is who writes and from which grammatical person they speak.' },
        options: [GEN.dif.c].concat(GEN.dif.d),
        correct: GEN.dif.c
      };
    }
    var op = [qo(C.dosVoces.c)].concat(C.dosVoces.d.map(qo));
    return {
      title: { es:'La voz que mira hacia atrás', en:'The voice that looks back' },
      q: { es:'En una autobiografía conviven dos momentos: el de la persona que vivió los hechos y el de la persona que hoy los escribe. Identifica la línea en la que se oye a quien escribe hoy juzgando lo que vivió entonces.',
           en:'In an autobiography two moments live together: that of the person who lived the events and that of the person writing them today. Identify the line in which the writer of today is heard judging what they lived back then.' },
      hint: { es:'Busca la frase que menciona el tiempo transcurrido o que llega a una conclusión imposible de alcanzar en el momento en que ocurrieron los hechos.',
              en:'Look for the sentence that mentions the time that has passed or that reaches a conclusion impossible to arrive at when the events were happening.' },
      exp: { es:'Tres líneas cuentan lo que ocurría entonces, sin salir de aquel momento. Solo una añade lo que quien escribe entendió después, y ahí se oye la segunda voz de la autobiografía.',
             en:'Three lines tell what was happening back then, without stepping out of that moment. Only one adds what the writer understood later, and that is where the second voice of the autobiography is heard.' },
      options: op,
      correct: op[0]
    };
  }

  function q9() {
    if (rng() < 0.5) {
      var fa = figOf(C.auto, 'antitesis');
      var op = [C.idea.c].concat(C.idea.d);
      return {
        title: { es:'La idea detrás de la imagen', en:'The idea behind the image' },
        q: { es:'En ' + Q(C.auto.title) + ' aparece esta línea: ' + Q(fa) + '. Determina qué idea sobre aquella etapa deja ver esa línea.',
             en:'In ' + Q(C.auto.title) + ' this line appears: ' + Q(fa) + '. Determine which idea about that stage of life the line lets you see.' },
        hint: { es:'Las dos mitades de la frase dicen cosas opuestas. En lugar de quedarte con una sola, pregúntate qué se sostiene si las dos son verdad al mismo tiempo.',
                en:'The two halves of the sentence say opposite things. Instead of keeping only one, ask what holds up if both are true at the same time.' },
        exp: { es:'Leer la frase al pie de la letra deja fuera lo importante: las dos mitades opuestas son verdad a la vez, y de esa contradicción sale la idea que quien escribe quiere dejar clara.',
               en:'Reading the sentence literally leaves out what matters: both opposite halves are true at once, and out of that contradiction comes the idea the writer wants to make clear.' },
        options: op,
        correct: op[0]
      };
    }
    var fb = C.bio.figs[Math.floor(rng() * C.bio.figs.length)];
    return {
      title: { es:'Una imagen en la biografía', en:'An image in the biography' },
      q: { es:'El Texto II lo escribió alguien que no vivió esos hechos y aun así contiene esta línea: ' + Q(fb) + '. Determina qué consigue esa imagen dentro de una biografía.',
           en:'Text II was written by someone who did not live those events and it still contains this line: ' + Q(fb) + '. Determine what that image achieves inside a biography.' },
      hint: { es:'Compara esa línea con los datos que la rodean, que son fechas y cifras. Pregúntate qué cuenta la imagen que ninguno de esos datos alcanza a contar.',
              en:'Compare that line with the data around it, which are dates and figures. Ask what the image tells that none of those data manage to tell.' },
      exp: { es:'La imagen no vuelve autobiográfico al texto ni sustituye a los datos: convive con ellos y resume de un golpe lo que las cifras tardarían en explicar. Aquí ' + L(fb.eff) + '.',
             en:'The image does not make the text autobiographical nor replace the data: it lives alongside them and sums up at a stroke what the figures would take long to explain. Here ' + L(fb.eff) + '.' },
      options: [GEN.bioimg.c].concat(GEN.bioimg.d),
      correct: GEN.bioimg.c
    };
  }

  function q10() {
    if (rng() < 0.5) {
      return {
        title: { es:'Decirlo sin decirlo', en:'Saying it without saying it' },
        q: { es:'Vas a escribir una página de tu autobiografía sobre tu primer día en una escuela nueva y quieres que quien lea sienta el miedo, sin escribir la palabra «miedo». Identifica cuál de estas líneas lo consigue con un recurso literario.',
             en:'You are going to write a page of your autobiography about your first day at a new school and you want the reader to feel the fear, without writing the word “fear”. Identify which of these lines achieves that with a literary device.' },
        hint: { es:'La línea que buscas cumple dos condiciones a la vez: lleva un recurso y habla de ese miedo. Comprueba las dos en cada opción antes de decidir.',
                en:'The line you want meets two conditions at once: it carries a device and it speaks about that fear. Check both in every option before deciding.' },
        exp: { es:'Una opción nombra el sentimiento tal cual, otra da un dato exacto de minutos y otra lleva una comparación que no habla del miedo sino del olor del salón. La correcta cumple las dos condiciones: usa una imagen y deja sentir el miedo.',
               en:'One option names the feeling outright, another gives an exact figure in minutes and another carries a simile that speaks not of fear but of the smell of the classroom. The correct one meets both conditions: it uses an image and lets the fear be felt.' },
        options: [GEN.sin.c].concat(GEN.sin.d),
        correct: GEN.sin.c
      };
    }
    return {
      title: { es:'El plan de tu página', en:'The plan for your page' },
      q: { es:'Vas a escribir la primera página de tu autobiografía y quieres que quien la lea entienda quién eres, no solo qué te ha pasado. Determina qué plan de trabajo lo consigue.',
           en:'You are going to write the first page of your autobiography and you want the reader to understand who you are, not just what has happened to you. Determine which work plan achieves that.' },
      hint: { es:'Recuerda lo que hacía el Texto I: no enumeraba su vida entera, se detenía en unos pocos momentos y los mostraba con imágenes, hablando desde el yo.',
              en:'Remember what Text I was doing: it did not list a whole life, it stopped at a few moments and showed them with images, speaking from the I.' },
      exp: { es:'Una lista de fechas informa pero no deja ver a nadie; exagerarlo todo hace que nada se crea; y escribirlo en tercera persona ya no sería una autobiografía. El plan correcto elige pocos momentos y los cuenta con imágenes.',
             en:'A list of dates informs but shows nobody; exaggerating everything means nothing is believed; and writing it in the third person would no longer be an autobiography. The correct plan picks few moments and tells them with images.' },
      options: [GEN.plan.c].concat(GEN.plan.d),
      correct: GEN.plan.c
    };
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('La vida contada por quien la vivió', 'A life told by the person who lived it'),
      '<p>' + T('Una autobiografía es el relato que alguien hace de su propia vida. Quien escribe y quien vivió los hechos son la misma persona, y eso cambia todo: recuerda desde dentro, elige por dónde empezar y decide qué momentos merecen detenerse. Dentro de ella caben dos tiempos, el de la persona que vivió aquello y el de la persona que hoy toma la pluma para contarlo. Escribir así no consiste en enumerar fechas, porque una lista informa pero no deja ver a nadie. Para que quien lee alcance a sentir lo que se sintió, la autobiografía recurre a los recursos literarios: maneras de usar el lenguaje que convierten una sensación, una emoción o una idea en algo que se puede ver, oír o tocar. No son adornos: son decisiones, y cada una produce un efecto distinto. A continuación vas a leer dos textos sobre la misma persona. El primero lo escribió ella; el segundo, alguien más. Los fragmentos marcados con línea punteada son el material con el que vas a trabajar durante toda la guía.',
                'An autobiography is the account someone gives of their own life. The writer and the person who lived the events are the same, and that changes everything: they remember from inside, they choose where to begin and they decide which moments deserve a pause. Two times live inside it, that of the person who lived through it and that of the person who today picks up the pen to tell it. Writing this way is not a matter of listing dates, because a list informs but shows nobody. So that the reader gets to feel what was felt, an autobiography turns to literary devices: ways of using language that turn a sensation, an emotion or an idea into something that can be seen, heard or touched. They are not ornaments: they are decisions, and each one produces a different effect. Below you will read two texts about the same person. The first was written by her; the second, by somebody else. The fragments marked with a dotted line are the material you will be working with all through this guide.') + '</p>' +
      textBlock(C.auto, T('Texto I', 'Text I')) +
      textBlock(C.bio,  T('Texto II', 'Text II')) +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('pregúntate qué ves, qué oyes y qué sientes gracias a cada fragmento marcado, y quién está hablando en cada texto.',
          'ask yourself what you see, what you hear and what you feel thanks to each marked fragment, and who is speaking in each text.') + '</p></div>');
  widgetCaza();
  addP(q1());
  addP(q2());

  sec(T('Comparar y nombrar', 'Comparing and naming'),
      T('La comparación y la metáfora', 'The simile and the metaphor'),
      '<p>' + T('La comparación coloca dos cosas lado a lado y avisa que son dos: usa «como», «parece», «igual que» o «tan… como». Su trabajo consiste en explicar algo que quien lee no conoce por medio de algo que sí conoce. La metáfora da un paso más y retira el aviso: llama a una cosa directamente con el nombre de la otra. Por eso suena más rotunda, porque no dice que algo se parece, dice que es. Las dos unen dos mundos, pero no pesan igual, y en una autobiografía esa diferencia importa: con la comparación quien escribe explica un recuerdo, con la metáfora lo afirma. Convertir una en otra, quitando o poniendo la palabra que avisa, es la mejor manera de sentir en qué se distinguen.',
                'The simile places two things side by side and warns that they are two: it uses “like”, “looks like”, “just as” or “as… as”. Its job is to explain something the reader does not know by means of something they do. The metaphor goes one step further and withdraws the warning: it calls one thing directly by the name of the other. That is why it sounds more absolute, because it does not say that something resembles, it says that it is. Both join two worlds, but they do not weigh the same, and in an autobiography that difference matters: with a simile the writer explains a memory, with a metaphor they assert it. Turning one into the other, removing or adding the warning word, is the best way of feeling how they differ.') + '</p>' +
      '<div class="glosslist">' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.comparacion.n) + '</div><div class="glossd">' + L(RECURSOS.comparacion.d) + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.metafora.n)    + '</div><div class="glossd">' + L(RECURSOS.metafora.d)    + '</div></div>' +
      '</div>');
  widgetClasifica();
  addP(q3());
  addP(q4());

  sec(T('Dar vida, tamaño y sentidos', 'Giving life, size and senses'),
      T('Personificación, hipérbole, sinestesia y antítesis', 'Personification, hyperbole, synaesthesia and antithesis'),
      '<p>' + T('La personificación le presta acciones o decisiones de persona a algo que no lo es: una corriente que empuja de regreso, una madera que se niega, un oficio que llama. Al hacerlo, aquello que rodeaba a quien escribe deja de ser decorado y se convierte en alguien con quien se discute. La hipérbole exagera a propósito, y quien lee lo sabe: nadie revisa la cifra, porque lo que se mide no es una cantidad sino el tamaño de una experiencia. La sinestesia mezcla dos sentidos en una misma imagen, un frío que suena o un olor que tiene color, y por eso la sensación llega antes de que la frase termine de entenderse. La antítesis enfrenta dos ideas contrarias dentro de la misma frase y, en lugar de escoger una, sostiene las dos a la vez. Los cuatro trabajan sobre quien lee de manera distinta, así que conviene reconocerlos por su efecto y no solo por su nombre.',
                'Personification lends the actions or decisions of a person to something that is not one: a current that pushes you back, a piece of wood that refuses, a trade that calls. In doing so, whatever surrounded the writer stops being scenery and becomes someone to argue with. Hyperbole exaggerates on purpose, and the reader knows it: nobody checks the figure, because what is measured is not an amount but the size of an experience. Synaesthesia mixes two senses in one image, a cold that sounds or a smell that has a colour, and that is why the sensation arrives before the sentence is fully understood. Antithesis sets two opposite ideas against each other inside the same sentence and, instead of choosing one, holds both at once. The four of them work on the reader in different ways, so it pays to recognise them by their effect and not only by their name.') + '</p>' +
      '<div class="glosslist">' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.personificacion.n) + '</div><div class="glossd">' + L(RECURSOS.personificacion.d) + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.hiperbole.n)       + '</div><div class="glossd">' + L(RECURSOS.hiperbole.d)       + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.sinestesia.n)      + '</div><div class="glossd">' + L(RECURSOS.sinestesia.d)      + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(RECURSOS.antitesis.n)       + '</div><div class="glossd">' + L(RECURSOS.antitesis.d)       + '</div></div>' +
      '</div>');
  widgetEfecto();
  addP(q5());
  addP(q6());

  sec(T('Dos textos, dos voces', 'Two texts, two voices'),
      T('Autobiografía y biografía', 'Autobiography and biography'),
      '<p>' + T('Los dos textos que tienes delante cuentan la misma vida, y sin embargo no son el mismo tipo de escrito. La autobiografía la firma quien vivió los hechos: habla desde el yo, recuerda, se equivoca al recordar y puede juzgar hoy lo que hizo entonces. La biografía la escribe alguien más: habla de esa persona en tercera persona, se apoya en fechas, en documentos y en lo que otros cuentan. Las dos pueden usar recursos literarios y las dos cuentan hechos verdaderos, así que no es ahí donde está la diferencia. Tampoco están obligadas a respetar el orden de los hechos: una vida ocurre en un orden y se cuenta en otro, y empezar por el final es una decisión de quien escribe, no un error.',
                'The two texts in front of you tell the same life, and yet they are not the same kind of writing. The autobiography is signed by the person who lived the events: it speaks from the I, it remembers, it gets things wrong while remembering and it can judge today what it did back then. The biography is written by somebody else: it speaks about that person in the third person and leans on dates, documents and what others tell. Both may use literary devices and both tell true events, so that is not where the difference lies. Nor are they obliged to respect the order of events: a life happens in one order and is told in another, and beginning at the end is a decision of the writer, not a mistake.') + '</p>');
  widgetVida();
  addP(q7());
  addP(q8());

  sec(T('De la emoción a la idea', 'From emotion to idea'),
      T('Cuando la imagen piensa', 'When the image thinks'),
      '<p>' + T('Hasta aquí los recursos han servido para hacer sentir: el frío, el cansancio, el asombro. Pero una imagen bien elegida también sostiene una idea, y esa es su tarea más difícil. Cuando quien escribe coloca dos mitades opuestas en la misma frase, no está adornando: está diciendo que dos cosas contrarias fueron verdad al mismo tiempo, algo que en una frase normal habría que explicar en un párrafo entero. Lo mismo ocurre en el otro texto: una biografía llena de fechas puede permitirse una sola imagen, y esa imagen resume de golpe lo que las cifras tardarían en explicar. Leer bien consiste en preguntar, delante de cada recurso, qué sensación produce y qué idea deja en pie.',
                'Up to here the devices have served to make you feel: the cold, the tiredness, the astonishment. But a well chosen image also holds up an idea, and that is its hardest task. When a writer places two opposite halves in the same sentence, they are not decorating: they are saying that two contrary things were true at the same time, something that in an ordinary sentence would take a whole paragraph to explain. The same happens in the other text: a biography full of dates can afford a single image, and that image sums up at a stroke what the figures would take long to explain. Reading well consists of asking, in front of every device, what sensation it produces and what idea it leaves standing.') + '</p>');
  addP(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('Tu propia página', 'Your own page'),
      '<p>' + T('Ya reconociste seis recursos dentro de una autobiografía y de una biografía, comprobaste qué le hace cada uno a quien lee y distinguiste las dos maneras de contar una misma vida. Lo que sigue es usarlos en tu propio relato: decidir qué quieres que sienta quien te lea y buscar la imagen que lo consiga.',
                'You have now recognised six devices inside an autobiography and a biography, checked what each one does to the reader and told apart the two ways of telling one same life. What comes next is using them in your own account: deciding what you want your reader to feel and finding the image that achieves it.') + '</p>');
  widgetCuaderno();
  addP(q10());
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Recursos Literarios en la Autobiografía';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
