<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de Hipótesis para la Media · Estadística · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/estadistica/est_hyp_mean.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:var(--green);line-height:1">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Prueba de Hipótesis para la Media</div>
    <div class="wcourse" id="wcourse-el">Estadística</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Prueba de Hipótesis para la Media</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Descargar resultados en PDF</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',

function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}

  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');

}
function nfD(x, d) {

  return (neg ? '−' : '') + s.join('.');
}

/* ── NORMAL MODEL · the sampling distribution of the mean rests on it ── */
function erfc(x) {

    tt * (0.09678418 + tt * (-0.18628806 + tt * (0.27886807 + tt * (-1.13520398 +
    tt * (1.48851587 + tt * (-0.82215223 + tt * 0.17087277)))))))));
  return x >= 0 ? ans : 2 - ans;
}
function nPdf(z)  { return Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI); }
function nCdf(z)  { return 0.5 * erfc(-z / Math.SQRT2); }
/* Inverse of the standard normal, rational approximation of Acklam. */

  var b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
           6.680131188771972e+01, -1.328068155288572e+01];
  var c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00,
           -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  var d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00,
           3.754408661907416e+00];
  var pl = 0.02425, ph = 1 - pl, q, r;
  if (p < pl) {

    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);

  if (p > ph) {
    q = Math.sqrt(-2 * Math.log(1 - p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /

/* ── STUDENT t MODEL · used when the deviation comes from the sample ── */
function lgamma(x) {

function betacf(a, b, x) {
  var MAXIT = 220, EPS = 3e-12, FPMIN = 1e-300;
  var qab = a + b, qap = a + 1, qam = a - 1;

    aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;

/* ── THE MACHINERY OF A TEST FOR THE MEAN ── */
function seMean(sd, n) { return sd / Math.sqrt(n); }

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers rendered by fmt, aligned across languages. */
function valOpts(correct, wrongs, fmt, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmt(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.12 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.37);
  return shuffleOpts(vals, vals, rng);
}
function intOpts(correct, wrongs, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v) || v < 1) return;
    var s = intN(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) add(Math.round(correct * (1 + j * 0.13 * (j % 2 ? 1 : -1))));
  return shuffleOpts(vals, vals, rng);
}

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

function startLesson() {

  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('err-fields'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = nextAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var dc = document.getElementById('dc' + i);
      if (!dc || !dc.width) return;
      var img = new Image();
      img.onload = function() {
        var dpr = window.devicePixelRatio || 1;
        dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
      };
      img.src = dataUrl;
    });
    if (saved.texts) saved.texts.forEach(function(txt, i) {
      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';
      var pz = document.getElementById('pz' + i);
      if (pz) pz.style.opacity = '0.4';
    });
  }, 300);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS
   ════════════════════════════════════════════════════════════════════════ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('pp' + idx);
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('pz' + idx).style.opacity = '0.4';
    saveSession();
  };
  reader.readAsDataURL(input.files[0]);
}
function toggleHint(idx) { document.getElementById('hint' + idx).classList.toggle('show'); }
function showResults() {
  var rb = document.getElementById('s_results');
  if (!rb) return;
  rb.style.display = 'block';
  setTimeout(function() {
    rb.classList.add('vis');
    rb.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 50);
}

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
/* Draws one normal density over four standard deviations on each side. Bands
   carry a kind: 0 pale, 1 green for the region where the null survives, 2 gold
   for the rejection region. opts.obs marks the statistic the sample produced. */
function drawCurve(g, mu, sd, bands, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 12, padR = 12, padT = 16, padB = 22;
  var x0 = mu - 4 * sd, x1 = mu + 4 * sd, i;
  opts = opts || {};
  var fmt = opts.fmt || function(v) { return nf(v); };
  function X(v) { return padL + (v - x0) / (x1 - x0) * (W - padL - padR); }
  var peak = nPdf(0) / sd;
  function Y(d) { return H - padB - d / peak * (H - padT - padB); }
  function dens(v) { return nPdf((v - mu) / sd) / sd; }
  var step = (x1 - x0) / 260;
  (bands || []).forEach(function(b) {
    var a = Math.max(x0, b.a), c = Math.min(x1, b.b), v;
    if (c <= a) return;
    ctx.beginPath();
    ctx.moveTo(X(a), H - padB);
    for (v = a; v <= c; v += step) ctx.lineTo(X(v), Y(dens(v)));
    ctx.lineTo(X(c), Y(dens(c)));
    ctx.lineTo(X(c), H - padB);
    ctx.closePath();
    ctx.fillStyle = b.kind === 2 ? P.gold : b.kind === 1 ? P.green : P.tint;
    ctx.globalAlpha = b.kind === 0 ? 1 : 0.42;
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.strokeStyle = P.dark; ctx.lineWidth = 2;
  ctx.beginPath();
  for (i = 0; i <= 260; i++) {
    var vv = x0 + i * step;
    if (i === 0) ctx.moveTo(X(vv), Y(dens(vv))); else ctx.lineTo(X(vv), Y(dens(vv)));
  }
  ctx.stroke();
  (opts.marks || []).forEach(function(m) {
    if (m < x0 || m > x1) return;
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(X(m), H - padB); ctx.lineTo(X(m), Y(dens(m))); ctx.stroke();
    ctx.restore();
  });
  if (typeof opts.obs === 'number' && opts.obs >= x0 && opts.obs <= x1) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(X(opts.obs), H - padB); ctx.lineTo(X(opts.obs), padT - 6); ctx.stroke();
    ctx.fillStyle = P.bad; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
    if (opts.obsLabel) {
      var ow = ctx.measureText(opts.obsLabel).width;
      ctx.fillText(opts.obsLabel, Math.min(Math.max(2, X(opts.obs) - ow / 2), W - ow - 2), H - padB + 21);
    }
    ctx.restore();
  }
  ctx.save();
  ctx.strokeStyle = P.dark; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(X(mu), padT - 8); ctx.lineTo(X(mu), H - padB); ctx.stroke();
  ctx.restore();
  if (opts.muLabel) {
    ctx.fillStyle = P.dark; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
    var lw = ctx.measureText(opts.muLabel).width;
    ctx.fillText(opts.muLabel, Math.min(Math.max(2, X(mu) - lw / 2), W - lw - 2), 11);
  }
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = -2; i <= 2; i++) {
    var tv = mu + i * sd, lab = fmt(tv), tw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(tv) - tw / 2), W - tw - 1), H - padB + 13);
  }
}
/* Draws two densities on the same axis over the range [-lim, lim]: the normal
   bell as a solid line and the t model as a dashed one, with the tail beyond
   each critical value shaded so the extra evidence the t model demands is
   visible instead of merely asserted. */
function drawDensityPair(g, fSolid, fDash, lim, marks, labels) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 12, padR = 12, padT = 22, padB = 24, i;
  function X(v) { return padL + (v + lim) / (2 * lim) * (W - padL - padR); }
  var peak = Math.max(fSolid(0), fDash(0));
  function Y(d) { return H - padB - d / peak * (H - padT - padB); }
  var step = 2 * lim / 300;
  function band(a, b, f, color) {
    var v;
    if (b <= a) return;
    ctx.beginPath();
    ctx.moveTo(X(a), H - padB);
    for (v = a; v <= b; v += step) ctx.lineTo(X(v), Y(f(v)));
    ctx.lineTo(X(b), Y(f(b)));
    ctx.lineTo(X(b), H - padB);
    ctx.closePath();
    ctx.fillStyle = color; ctx.globalAlpha = 0.42; ctx.fill(); ctx.globalAlpha = 1;
  }
  if (marks && marks.length) {
    band(marks[0], lim, fSolid, P.gold);
    if (marks.length > 1) band(marks[1], lim, fDash, P.bad);
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.strokeStyle = P.dark; ctx.lineWidth = 2;
  ctx.beginPath();
  for (i = 0; i <= 300; i++) {
    var va = -lim + i * step;
    if (i === 0) ctx.moveTo(X(va), Y(fSolid(va))); else ctx.lineTo(X(va), Y(fSolid(va)));
  }
  ctx.stroke();
  ctx.save();
  ctx.strokeStyle = P.green; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
  ctx.beginPath();
  for (i = 0; i <= 300; i++) {
    var vb = -lim + i * step;
    if (i === 0) ctx.moveTo(X(vb), Y(fDash(vb))); else ctx.lineTo(X(vb), Y(fDash(vb)));
  }
  ctx.stroke();
  ctx.restore();
  (marks || []).forEach(function(m, k) {
    ctx.save();
    ctx.strokeStyle = k === 0 ? P.gold : P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(m), H - padB); ctx.lineTo(X(m), padT - 10); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
    var lab = dec3(m), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(m) - lw / 2), W - lw - 1), H - padB + (k === 0 ? 11 : 21));
  });
  ctx.fillStyle = P.dark; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
  ctx.fillText(labels.solid, padL + 2, 12);
  ctx.fillStyle = P.green;
  ctx.fillText(labels.dash, W - padR - ctx.measureText(labels.dash).width - 2, 12);
}
/* Draws a confidence interval as a horizontal bar with the claimed value marked
   on it, so the tie between an interval and a two tailed test is visible. */
function drawIntervalBar(g, lo, hi, center, claim, fmt, labels) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 14, padR = 14;
  var span = Math.max(hi - lo, Math.abs(claim - center) * 2) * 1.35;
  var a = center - span / 2, b = center + span / 2;
  function X(v) { return padL + (v - a) / (b - a) * (W - padL - padR); }
  var yBar = H * 0.55;
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, yBar + 26); ctx.lineTo(W - padR, yBar + 26); ctx.stroke();
  ctx.fillStyle = P.green; ctx.globalAlpha = 0.30;
  ctx.fillRect(X(lo), yBar - 13, X(hi) - X(lo), 26);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = P.dark; ctx.lineWidth = 2;
  [lo, hi].forEach(function(v) {
    ctx.beginPath(); ctx.moveTo(X(v), yBar - 15); ctx.lineTo(X(v), yBar + 15); ctx.stroke();
  });
  ctx.beginPath(); ctx.moveTo(X(lo), yBar); ctx.lineTo(X(hi), yBar); ctx.stroke();
  ctx.save();
  ctx.strokeStyle = P.gold; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(X(center), yBar - 22); ctx.lineTo(X(center), yBar + 22); ctx.stroke();
  ctx.restore();
  var inside = claim >= lo && claim <= hi;
  ctx.strokeStyle = inside ? P.green : P.bad; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(X(claim), yBar - 30); ctx.lineTo(X(claim), yBar + 30); ctx.stroke();
  ctx.fillStyle = inside ? P.green : P.bad;
  ctx.beginPath(); ctx.arc(X(claim), yBar - 30, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.font = '600 10px "IBM Plex Sans", sans-serif';
  var cl = labels.claim, cw = ctx.measureText(cl).width;
  ctx.fillText(cl, Math.min(Math.max(2, X(claim) - cw / 2), W - cw - 2), yBar - 36);
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [[lo, X(lo)], [hi, X(hi)], [center, X(center)]].forEach(function(pairv) {
    var lab = fmt(pairv[0]), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, pairv[1] - lw / 2), W - lw - 1), yBar + 40);
  });
  ctx.fillStyle = P.dark; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
  ctx.fillText(labels.band, padL + 2, 14);
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · the whole test for a mean assembled in one place
   ════════════════════════════════════════════════════════════════════════ */
function widgetZTest(mu0, sd0, n0, dif0, al0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { tail: 'right', sd: sd0, n: n0, dif: dif0, al: al0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'right', es: 'El costo real es mayor', en: 'The real cost is larger' },
      { id: 'left',  es: 'El costo real es menor', en: 'The real cost is smaller' },
      { id: 'two',   es: 'El costo real cambió',   en: 'The real cost changed' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.tail ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="prueba-z-para-la-media">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'La prueba completa para un costo promedio' : 'The whole test for an average cost') + '</span></div>' +
        '<div class="iw-sub">' + (es

          : 'A logistics operator has an average cost of ' + money(mu0) + ' per shipment written into its rate card and finance reviews a sample of invoices to see whether reality matches the rate. Pick the suspicion to be tested first, because the tail comes from it. Then move the sample, the variability and the accepted risk, and watch the two ways of reading the same result: on the z scale, where the bell knows how to answer, and in pesos, where management makes the decision.') + '</div>' +

    host.querySelectorAll('.mtab').forEach(function(b) {

    host.querySelector('#z1s').addEventListener('input', function() { state.sd  = parseInt(this.value, 10); update(); });
    host.querySelector('#z1a').addEventListener('input', function() { state.al  = parseInt(this.value, 10); update(); });

  function update() {
    var es = LANG === 'es';
    var al = state.al / 100;
    var two = state.tail === 'two';
    var xbar = mu0 + state.dif;

    var z  = zStat(xbar, mu0, state.sd, state.n);

    var bands, marks, rejects, critTxt, ruleTxt;
    if (state.tail === 'right') {
      bands = [{ a: -4, b: zc, kind: 1 }, { a: zc, b: 4, kind: 2 }];
      marks = [zc];
      rejects = z > zc;
      critTxt = money2(mu0 + zc * se);
      ruleTxt = 'z > ' + dec3(zc);
    } else if (state.tail === 'left') {
      bands = [{ a: -4, b: -zc, kind: 2 }, { a: -zc, b: 4, kind: 1 }];
      marks = [-zc];
      rejects = z < -zc;
      critTxt = money2(mu0 - zc * se);
      ruleTxt = 'z < −' + dec3(zc);
    } else {
      bands = [{ a: -4, b: -zc, kind: 2 }, { a: -zc, b: zc, kind: 1 }, { a: zc, b: 4, kind: 2 }];
      marks = [-zc, zc];
      rejects = Math.abs(z) > zc;
      critTxt = money2(mu0 - zc * se) + ' / ' + money2(mu0 + zc * se);
      ruleTxt = '|z| > ' + dec3(zc);
    }
    host.querySelector('#z1dl').textContent  = money(state.dif);
    host.querySelector('#z1nl').textContent  = intN(state.n);
    host.querySelector('#z1sl').textContent  = money(state.sd);
    host.querySelector('#z1al').textContent  = dec1(state.al);
    host.querySelector('#z1se').textContent  = dec2(se);
    host.querySelector('#z1xb').textContent  = money2(xbar);
    host.querySelector('#z1z').textContent   = dec3(z);
    host.querySelector('#z1zc').textContent  = (state.tail === 'left' ? '−' : '') + dec3(zc) + (two ? ' / ' + dec3(zc) : '');
    host.querySelector('#z1cr').textContent  = critTxt;
    host.querySelector('#z1dec').textContent = rejects

            : 'The decision rule asks for ' + ruleTxt + ' and the statistic is ' + dec3(z) + ', so the null hypothesis is rejected: a difference this large is too rare to blame on sampling chance.')
      : (es ? 'La regla de decisión pide ' + ruleTxt + ' y el estadístico vale ' + dec3(z) + ', así que no se rechaza la hipótesis nula: una diferencia así de grande es perfectamente posible aunque la tarifa sea correcta.'
            : 'The decision rule asks for ' + ruleTxt + ' and the statistic is ' + dec3(z) + ', so the null hypothesis is not rejected: a difference this size is perfectly possible even if the rate card is right.');
    host.querySelector('#z1read').innerHTML = (es
      ? '<strong>Lectura de negocio:</strong> ' : '<strong>Business reading:</strong> ') + verdict + (es
      ? ' Con ' + intN(state.n) + ' facturas y una desviación de ' + money(state.sd) + ', cada error estándar mide ' + dec2(se) + ' pesos, y por eso una diferencia de ' + money(state.dif) + ' pesa ' + dec3(z) + ' errores estándar. La frontera de la decisión traducida a pesos queda en ' + critTxt + ', que es la cifra que conviene llevar a la junta: nadie discute un estadístico, todos discuten un costo por envío. Mueve solo el número de facturas y verás que la diferencia en pesos no se mueve, pero el estadístico sí, porque más información hace más difícil explicar la misma brecha por azar. Y al pasar a la prueba de dos colas el mismo resultado exige más evidencia, porque el riesgo se reparte entre los dos lados.'
      : ' With ' + intN(state.n) + ' invoices and a deviation of ' + money(state.sd) + ', each standard error measures ' + dec2(se) + ' pesos, and that is why a difference of ' + money(state.dif) + ' weighs ' + dec3(z) + ' standard errors. The decision boundary translated into pesos sits at ' + critTxt + ', which is the figure worth taking to the meeting: nobody argues about a statistic, everybody argues about a cost per shipment. Move only the number of invoices and you will see the difference in pesos stay put while the statistic moves, because more information makes the same gap harder to explain by chance. And switching to the two tailed test makes the same result demand more evidence, because the risk is split between both sides.');
    var g = fitCanvas(host.querySelector('#z1cv'), 165);
    drawCurve(g, 0, 1, bands, {
      marks: marks, fmt: function(v) { return dec2(v); },
      obs: Math.max(-3.9, Math.min(3.9, z)),
      obsLabel: (es ? 'Estadístico ' : 'Statistic ') + dec3(z),
      muLabel: (es ? 'Mundo donde la tarifa es correcta' : 'World where the rate card is right')
    });
  }
  widgets.push(mount);
  mount();
}

          : 'An insurer claims the average amount of its paid claims is ' + money(mu0) + ' and the reserving team reviews a sample of files. The gold area under the bell is the p value. Move the observed difference, the sample and the significance level, and compare the two decision cards: the one comparing the statistic against the critical value and the one comparing the p value against the significance level. They never disagree, because they are the same boundary seen from two sides.') + '</div>' +

        '</div></div>' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Estadístico z' : 'z statistic') + '</div><div class="mnum ts" id="p2z"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor crítico' : 'Critical value') + '</div><div class="mnum ps" id="p2zc"></div></div>' +

    host.querySelectorAll('.mtab').forEach(function(b) {

    var g = fitCanvas(host.querySelector('#p2cv'), 165);
    drawCurve(g, 0, 1, bands, {

/* ════════════════════════════════════════════════════════════════════════

        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Estadístico observado' : 'Observed statistic') + ': <span class="cval" id="t3tl"></span></label>' +
          '<input type="range" min="5" max="40" step="1" id="t3t" value="' + state.tv + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Franja roja' : 'Red band') + '</label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Es la evidencia extra que el modelo t exige antes de rechazar' : 'It is the extra evidence the t model demands before rejecting') + '</div>' +

          '<div class="metric"><div class="mlbl">' + (es ? 'Grados de libertad' : 'Degrees of freedom') + '</div><div class="mnum ts" id="t3df"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor crítico normal' : 'Normal critical value') + '</div><div class="mnum ts" id="t3zc"></div></div>' +

        '<div class="iw-read" id="t3read"></div>' +

    host.querySelector('#t3n').addEventListener('input', function() { state.n  = parseInt(this.value, 10); update(); });
    host.querySelector('#t3a').addEventListener('input', function() { state.al = parseInt(this.value, 10); update(); });
    host.querySelector('#t3t').addEventListener('input', function() { state.tv = parseInt(this.value, 10); update(); });

  }
  function update() {
    var es = LANG === 'es';
    var al = state.al / 100;

    host.querySelector('#t3pz').textContent  = pr(pz);
    var msg = (rejT === rejZ)
      ? (es ? 'Con este estadístico los dos modelos deciden lo mismo, así que la elección del modelo no cambia el veredicto esta vez, aunque sí cambia el valor p reportado.'
            : 'With this statistic both models decide the same, so the choice of model does not change the verdict this time, although it does change the reported p value.')
      : (es ? 'Aquí los dos modelos se separan: el modelo normal rechazaría y el modelo t no. Usar la tabla equivocada convierte un resultado insuficiente en un hallazgo, y ese es exactamente el error que la auditoría no puede permitirse.'
            : 'Here the two models part ways: the normal model would reject and the t model would not. Using the wrong table turns an insufficient result into a finding, and that is exactly the mistake the audit cannot afford.');
    host.querySelector('#t3read').innerHTML = (es
      ? '<strong>Lectura de negocio:</strong> ' : '<strong>Business reading:</strong> ') + msg + (es
      ? ' Con ' + intN(state.n) + ' contratos quedan ' + intN(df) + ' grados de libertad, y por eso la frontera pasa de ' + dec3(zc) + ' en el modelo normal a ' + dec3(tc) + ' en el modelo t: son ' + dec3(tc - zc) + ' errores estándar de exigencia adicional, el precio de haber estimado la desviación con la misma muestra que se está juzgando. El mismo estadístico ' + dec1(tv) + ' produce un valor p de ' + pr(pt) + ' con el modelo t y de ' + pr(pz) + ' con el modelo normal. Sube los contratos revisados y observa que la brecha se cierra: con muestras grandes la discusión sobre cuál tabla usar deja de tener consecuencias, y con muestras pequeñas puede decidir un dictamen completo.'
      : ' With ' + intN(state.n) + ' contracts there are ' + intN(df) + ' degrees of freedom, and that is why the boundary moves from ' + dec3(zc) + ' in the normal model to ' + dec3(tc) + ' in the t model: that is ' + dec3(tc - zc) + ' standard errors of extra demand, the price of having estimated the deviation with the same sample under judgement. The same statistic ' + dec1(tv) + ' produces a p value of ' + pr(pt) + ' under the t model and ' + pr(pz) + ' under the normal one. Raise the contracts reviewed and watch the gap close: with large samples the argument about which table to use stops having consequences, and with small samples it can decide a whole audit opinion.');
    var g = fitCanvas(host.querySelector('#t3cv'), 170);
    drawDensityPair(g, function(x) { return nPdf(x); }, function(x) { return tPdf(x, df); }, 4.2,
      [zc, tc], {
        solid: (es ? 'Modelo normal' : 'Normal model'),
        dash:  (es ? 'Modelo t con ' + intN(df) + ' grados' : 't model with ' + intN(df) + ' degrees')
      });
  }
  widgets.push(mount);
  mount();
}

function widgetDuality(xbar, sd0, n0, claim0, conf0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { n: n0, claim: claim0, conf: conf0 };
  var sd = sd0;
  var lo = Math.round(xbar - 0.6 * xbar / 4), hi = Math.round(xbar + 0.6 * xbar / 4);
  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="intervalo-de-confianza-y-decision">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El intervalo ya contiene la decisión' : 'The interval already holds the decision') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Un fondo de inversión reportó una utilidad promedio observada de ' + money(xbar) + ' por cuenta administrada. La barra verde es el intervalo de confianza para la utilidad promedio real y el marcador es la cifra que alguien afirma. Arrastra esa cifra afirmada dentro y fuera de la barra y observa la decisión de la prueba de dos colas: rechaza exactamente cuando la afirmación queda fuera del intervalo, ni un peso antes.'
          : 'An investment fund reported an observed average profit of ' + money(xbar) + ' per managed account. The green bar is the confidence interval for the true average profit and the marker is the figure somebody claims. Drag that claimed figure inside and outside the bar and watch the decision of the two tailed test: it rejects exactly when the claim falls outside the interval, not one peso sooner.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Utilidad promedio afirmada' : 'Claimed average profit') + ': <span class="cval" id="d4cl"></span></label>' +
          '<input type="range" min="' + lo + '" max="' + hi + '" step="5" id="d4c" value="' + state.claim + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Cuentas en la muestra' : 'Accounts in the sample') + ': <span class="cval" id="d4nl"></span></label>' +
          '<input type="range" min="16" max="400" step="4" id="d4n" value="' + state.n + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Nivel de confianza en por ciento' : 'Confidence level in percent') + ': <span class="cval" id="d4fl"></span></label>' +
          '<input type="range" min="80" max="99" step="1" id="d4f" value="' + state.conf + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Marcador' : 'Marker') + '</label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Verde si la afirmación sobrevive, rojo si el intervalo la deja fuera' : 'Green if the claim survives, red if the interval leaves it out') + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="d4cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Error estándar' : 'Standard error') + '</div><div class="mnum ts" id="d4se"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen de error' : 'Margin of error') + '</div><div class="mnum ts" id="d4me"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Límite inferior' : 'Lower bound') + '</div><div class="mnum cs" id="d4lo"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Límite superior' : 'Upper bound') + '</div><div class="mnum cs" id="d4hi"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor p de dos colas' : 'Two tailed p value') + '</div><div class="mnum ps" id="d4p"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Decisión de la prueba' : 'Decision of the test') + '</div><div class="mnum cs" id="d4dec"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="d4read"></div>' +
      '</div>';
    host.querySelector('#d4c').addEventListener('input', function() { state.claim = parseInt(this.value, 10); update(); });
    host.querySelector('#d4n').addEventListener('input', function() { state.n     = parseInt(this.value, 10); update(); });
    host.querySelector('#d4f').addEventListener('input', function() { state.conf  = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var al = 1 - state.conf / 100;
    var se = seMean(sd, state.n);
    var zc = zTwo(al);
    var me = zc * se;
    var loB = xbar - me, hiB = xbar + me;
    var z = zStat(xbar, state.claim, sd, state.n);
    var p = pTwo(z);
    var inside = state.claim >= loB && state.claim <= hiB;
    var rejects = p <= al;
    host.querySelector('#d4cl').textContent  = money(state.claim);
    host.querySelector('#d4nl').textContent  = intN(state.n);
    host.querySelector('#d4fl').textContent  = intN(state.conf);
    host.querySelector('#d4se').textContent  = dec2(se);
    host.querySelector('#d4me').textContent  = money2(me);
    host.querySelector('#d4lo').textContent  = money2(loB);
    host.querySelector('#d4hi').textContent  = money2(hiB);
    host.querySelector('#d4p').textContent   = pr(p);
    host.querySelector('#d4dec').textContent = rejects
      ? (es ? 'Se rechaza' : 'Reject') : (es ? 'No se rechaza' : 'Do not reject');
    host.querySelector('#d4read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> con ' + intN(state.n) + ' cuentas el margen de error al ' + intN(state.conf) + ' por ciento vale ' + money2(me) + ', así que el intervalo va de ' + money2(loB) + ' a ' + money2(hiB) + '. La cifra afirmada, ' + money(state.claim) + ', queda ' + (inside ? 'dentro' : 'fuera') + ' de ese rango, y la prueba de dos colas con un nivel de significancia de ' + dec1(100 - state.conf) + ' por ciento ' + (rejects ? 'la rechaza' : 'no la rechaza') + ', con un valor p de ' + pr(p) + '. Las dos herramientas coinciden siempre porque comparten el mismo margen de error. La diferencia está en lo que aportan a una junta: la prueba entrega un sí o un no, y el intervalo entrega además el rango de valores que la evidencia deja en pie, que es lo que se necesita para presupuestar. Angosta la muestra y verás cómo el intervalo se ensancha hasta volver compatible casi cualquier afirmación.'
      : '<strong>Business reading:</strong> with ' + intN(state.n) + ' accounts the margin of error at ' + intN(state.conf) + ' percent is ' + money2(me) + ', so the interval runs from ' + money2(loB) + ' to ' + money2(hiB) + '. The claimed figure, ' + money(state.claim) + ', falls ' + (inside ? 'inside' : 'outside') + ' that range, and the two tailed test at a significance level of ' + dec1(100 - state.conf) + ' percent ' + (rejects ? 'rejects it' : 'does not reject it') + ', with a p value of ' + pr(p) + '. The two tools always agree because they share the same margin of error. The difference is what they bring to a meeting: the test hands over a yes or a no, and the interval also hands over the range of values the evidence leaves standing, which is what budgeting needs. Shrink the sample and watch the interval widen until almost any claim becomes compatible with the data.';
    var g = fitCanvas(host.querySelector('#d4cv'), 150);
    drawIntervalBar(g, loB, hiB, xbar, state.claim, function(v) { return money(v); }, {
      claim: (es ? 'Afirmación ' : 'Claim ') + money(state.claim),
      band:  (es ? 'Intervalo al ' + intN(state.conf) + ' por ciento' : 'Interval at ' + intN(state.conf) + ' percent')
    });
  }
  widgets.push(mount);
  mount();
}

function frac(a, b) {

/* Places a statistic a safe distance away from the boundary so the verdict is
   never borderline, and returns the exact value once the sample mean has been
   rounded to a figure a report would actually print. */
function offBoundary(crit, rng, wantReject) {
  var d = pick([0.45, 0.72, 1.05], rng);
  return wantReject ? crit + d : crit - d;
}
function roundTo(v, step) { return Math.round(v / step) * step; }

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>Los cinco pasos de una prueba para la media</h2>' +
      '<p>Una prueba de hipótesis para la media resuelve una discusión muy concreta: alguien afirmó un promedio y alguien más tiene una muestra que parece decir otra cosa. El costo promedio por envío que aparece en el tarifario, el gasto promedio por cliente que reporta una franquicia, el margen promedio por contrato que declara una constructora. La muestra casi nunca coincide con la cifra afirmada, y el método existe para responder si esa diferencia es evidencia real o es el ruido normal de haber medido solo una parte.</p>' +
      '<p>El procedimiento siempre tiene los mismos cinco pasos. Primero se escriben las dos hipótesis sobre el parámetro de la población, con la igualdad siempre del lado de la nula. Segundo se fija el nivel de significancia, que es el riesgo de falsa alarma que la empresa acepta. Tercero se calcula el <strong>error estándar del promedio</strong>, que es la desviación de la población dividida entre la raíz del tamaño de muestra, y con él se obtiene el <strong>estadístico de prueba</strong>. Cuarto se compara ese estadístico contra el valor crítico que corresponde a la dirección y al riesgo elegidos. Quinto se enuncia la conclusión en el idioma del negocio, no en el de la fórmula.</p>' +
      '<p>La pieza que hace posible todo lo demás es el error estándar. El promedio de una muestra varía menos que un dato suelto, y varía menos entre más grande sea la muestra, porque los valores altos y bajos se compensan al promediarse. Ese es el motivo por el cual la raíz del tamaño de muestra aparece en el denominador y por el cual cuadruplicar la muestra reduce a la mitad el error estándar. Cuando la desviación de la población es un dato conocido, por histórico o por norma del sector, el estadístico sigue el modelo normal y se llama z.</p>' +
      '<p>Conviene traducir el valor crítico de vuelta a pesos, porque esa es la cifra que se discute en una junta. Decir que el estadístico rebasó ' + dec3(c1zc) + ' no le sirve a nadie fuera del área de datos. Decir que el costo promedio de la muestra rebasó la frontera de ' + money2(c1crit) + ' por envío, que es el punto a partir del cual la tarifa deja de ser creíble, convierte el análisis en un argumento que la dirección puede usar con el proveedor.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Error estándar</div><div class="rform">' + frac('σ', '√n') + '</div><div class="rnote">Cuánto varía el promedio de una muestra.</div></div>' +
        '<div class="rcard"><div class="rname">Estadístico</div><div class="rform">z = ' + frac('x̄ − μ₀', 'σ/√n') + '</div><div class="rnote">La diferencia medida en errores estándar.</div></div>' +
        '<div class="rcard"><div class="rname">Valor crítico</div><div class="rform">sale de α y de la cola</div><div class="rnote">La frontera de la zona de rechazo.</div></div>' +
        '<div class="rcard"><div class="rname">Frontera en pesos</div><div class="rform">μ₀ + z꜀ · σ/√n</div><div class="rnote">El mismo límite en unidades del negocio.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Un operador logístico tiene tarifado un costo promedio de ' + money(c1mu0) + ' por envío. Finanzas sospecha que el costo real es mayor y revisa una muestra aleatoria de ' + intN(c1n) + ' facturas, cuyo costo promedio resulta de ' + money2(c1xb) + '. Por el histórico del sector se acepta que la desviación estándar del costo es de ' + money(c1sd) + '. La revisión se hará con un nivel de significancia de ' + pct1(c1al) + ' por ciento.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> La nula defiende el tarifario: el costo promedio real es de ' + money(c1mu0) + ' o menos. La alternativa recoge la sospecha: el costo promedio real es mayor que ' + money(c1mu0) + '. La prueba es de una cola por la derecha.<br>' +
      '<strong>Paso 2.</strong> El nivel de significancia queda en ' + pr(c1al) + ', que es el riesgo aceptado de acusar al operador sin razón.<br>' +
      '<strong>Paso 3.</strong> El error estándar vale ' + money(c1sd) + ' entre la raíz de ' + intN(c1n) + ', es decir ' + dec2(c1se) + ' pesos. El estadístico es la diferencia de ' + money2(c1xb - c1mu0) + ' entre ese error estándar, o sea ' + dec3(c1z) + '.<br>' +

        : 'La queja no queda desmentida, simplemente no quedó probada: la muestra habría necesitado un promedio superior a ' + money2(c1crit) + ' por envío para sostenerla, y conviene decidir si vale la pena revisar más facturas antes de reclamar.') + '</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>The five steps of a test for the mean</h2>' +
      '<p>A hypothesis test for the mean settles a very concrete argument: somebody claimed an average and somebody else has a sample that seems to say otherwise. The average cost per shipment printed on the rate card, the average spending per customer a franchise reports, the average margin per contract a construction firm declares. The sample almost never matches the claimed figure, and the method exists to answer whether that difference is real evidence or the ordinary noise of having measured only a part.</p>' +
      '<p>The procedure always has the same five steps. First the two hypotheses about the parameter of the population are written down, with the equality always on the side of the null. Second the significance level is fixed, the false alarm risk the company accepts. Third the <strong>standard error of the average</strong> is computed, the deviation of the population divided by the square root of the sample size, and with it the <strong>test statistic</strong> is obtained. Fourth that statistic is compared against the critical value matching the chosen direction and risk. Fifth the conclusion is stated in the language of the business, not in the language of the formula.</p>' +
      '<p>The piece that makes everything else possible is the standard error. The average of a sample varies less than a single observation, and it varies less the larger the sample, because high and low values offset each other when averaged. That is why the square root of the sample size sits in the denominator and why quadrupling the sample halves the standard error. When the deviation of the population is a known figure, from history or from an industry standard, the statistic follows the normal model and is called z.</p>' +
      '<p>It pays to translate the critical value back into pesos, because that is the figure a meeting argues about. Saying the statistic cleared ' + dec3(c1zc) + ' is useless to anyone outside the data team. Saying the average cost of the sample cleared the boundary of ' + money2(c1crit) + ' per shipment, the point from which the rate card stops being credible, turns the analysis into an argument management can use with the supplier.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Standard error</div><div class="rform">' + frac('σ', '√n') + '</div><div class="rnote">How much the average of a sample varies.</div></div>' +
        '<div class="rcard"><div class="rname">Statistic</div><div class="rform">z = ' + frac('x̄ − μ₀', 'σ/√n') + '</div><div class="rnote">The difference measured in standard errors.</div></div>' +
        '<div class="rcard"><div class="rname">Critical value</div><div class="rform">from alpha and the tail</div><div class="rnote">The boundary of the rejection zone.</div></div>' +
        '<div class="rcard"><div class="rname">Boundary in pesos</div><div class="rform">μ₀ + z꜀ · σ/√n</div><div class="rnote">The same limit in business units.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A logistics operator has an average cost of ' + money(c1mu0) + ' per shipment written into its rate card. Finance suspects the real cost is larger and reviews a random sample of ' + intN(c1n) + ' invoices, whose average cost comes out at ' + money2(c1xb) + '. From industry history the standard deviation of the cost is taken to be ' + money(c1sd) + '. The review will run at a significance level of ' + pct1(c1al) + ' percent.</p>' +

      '<strong>Step 2.</strong> The significance level is set at ' + pr(c1al) + ', the accepted risk of accusing the operator without cause.<br>' +
      '<strong>Step 3.</strong> The standard error is ' + money(c1sd) + ' over the square root of ' + intN(c1n) + ', that is ' + dec2(c1se) + ' pesos. The statistic is the difference of ' + money2(c1xb - c1mu0) + ' over that standard error, meaning ' + dec3(c1z) + '.<br>' +
      '<strong>Step 4.</strong> The critical value at ' + pct1(c1al) + ' percent is ' + dec3(c1zc) + ', which in pesos puts the boundary at ' + money2(c1crit) + '.<br>' +
      '<strong>Step 5.</strong> ' + (c1R
        ? 'The statistic ' + dec3(c1z) + ' clears the critical value ' + dec3(c1zc) + ', so the null is rejected: the evidence supports a true average cost above the rate card.'
        : 'The statistic ' + dec3(c1z) + ' falls short of the critical value ' + dec3(c1zc) + ', so the null is not rejected: with this sample it cannot be held that the true average cost exceeds the rate card.') + '<br>' +
      '<strong>Business reading.</strong> ' + (c1R

  };
  var d1 = mk(q1i, o1.correctIdx, true);
  problems.push({ i18n: d1.i18n, title: d1.title, questionText: d1.questionText, options: d1.options, correctIdx: d1.correctIdx, explanation: d1.explanation, hint: d1.hint, showWork: true, fn: 'frontera = μ₀ + z꜀ · σ/√n', studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Item 2 ── */
  var s2se = seMean(p2sd, p2n);
  var s2zc = zOne(p2al);
  var s2xb = roundTo(p2mu0 - offBoundary(s2zc, rng, p2rej) * s2se, 0.01);

  var o2 = shuffleOpts(

     'El estadístico vale ' + dec3(s2z) + ' y el valor crítico ' + dec3(-s2zc) + ', así que ' + (s2R ? 'no se rechaza la hipótesis nula y el rendimiento anunciado queda confirmado.' : 'se rechaza la hipótesis nula y el rendimiento anunciado queda desmentido.'),
     'Como el promedio de la muestra, ' + dec2(s2xb) + ' por ciento, es menor que el rendimiento anunciado de ' + dec1(p2mu0) + ' por ciento, la afirmación queda desmentida sin necesidad de comparar contra ningún valor crítico.',

    ['The statistic is ' + dec3(s2z) + ' and the critical value ' + dec3(-s2zc) + ', so ' + (s2R ? 'the null hypothesis is rejected and the evidence supports a true average return below the advertised one.' : 'the null hypothesis is not rejected: with this sample it does not hold that the true average return is below the advertised one.'),

  var q2i = {

    hint: { es: 'La sospecha apunta hacia abajo, así que toda la zona de rechazo está en la cola izquierda y el valor crítico lleva signo negativo. Revisa también el idioma de la conclusión: hay una frase que ninguna prueba de hipótesis autoriza a escribir.',

  var c2se = seMean(c2sd, c2n);

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>El valor p y las pruebas de dos colas</h2>' +
      '<p>La regla del valor crítico entrega un veredicto, pero no dice por cuánto. Dos estudios pueden rechazar la misma nula, uno raspando la frontera y otro barriéndola, y el reporte los presentaría igual. El <strong>valor p</strong> resuelve ese problema: mide qué tan raro sería observar una diferencia al menos tan grande como la observada en un mundo donde la afirmación fuera cierta. Es una medida continua de sorpresa, y por eso se ha vuelto la forma estándar de reportar.</p>' +
      '<p>Su regla de decisión es directa: se rechaza la nula si el valor p no supera el nivel de significancia. Y esa regla nunca contradice a la del valor crítico, porque el valor crítico es precisamente el estadístico cuyo valor p vale exactamente alfa. Son la misma frontera vista desde dos lados, uno en la escala del estadístico y otro en la escala de la probabilidad.</p>' +
      '<p>Cuando la pregunta de negocio no tiene dirección, la prueba es de <strong>dos colas</strong> y el cálculo cambia en dos puntos. El valor crítico se toma con alfa repartido entre las dos colas, de modo que cada lado recibe la mitad, y el valor p se duplica, porque una diferencia igual de extrema del otro lado también contaría como evidencia contra la afirmación. Por eso una misma muestra siempre produce un valor p mayor en dos colas que en una: la prueba sin dirección exige más evidencia, y renunciar a la dirección tiene un precio en potencia que conviene pagar solo cuando el negocio realmente no tiene una sospecha previa.</p>' +
      '<p>Falta la advertencia que más errores provoca en los reportes. El valor p <strong>no</strong> es la probabilidad de que la afirmación sea cierta, ni la probabilidad de haberse equivocado. Es una probabilidad calculada suponiendo que la nula es cierta, así que no puede a la vez medir la credibilidad de esa suposición. Tampoco mide el tamaño de lo que está en juego: con una muestra suficientemente grande, una diferencia de un peso produce valores p diminutos sin que a nadie le importe un peso.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Valor p</div><div class="rform">P( evidencia | H₀ )</div><div class="rnote">La rareza del resultado bajo la nula.</div></div>' +

        '<div class="rcard"><div class="rname">Dos colas</div><div class="rform">p = 2 · P( z ≥ |z| )</div><div class="rnote">El riesgo se reparte entre los dos lados.</div></div>' +
        '<div class="rcard"><div class="rname">Lo que no es</div><div class="rform">p ≠ P( H₀ cierta )</div><div class="rnote">Ni mide la importancia del cambio.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una aseguradora tiene reservado un monto promedio de ' + money(c2mu0) + ' por siniestro pagado. El área de reservas no sospecha una dirección: quiere saber si el monto promedio real cambió, en cualquier sentido. Revisa ' + intN(c2n) + ' expedientes al azar y encuentra un promedio de ' + money2(c2xb) + '. La desviación estándar conocida es ' + money(c2sd) + ' y el nivel de significancia es ' + pct1(c2al) + ' por ciento.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Sin dirección previa, la nula dice que el monto promedio real es ' + money(c2mu0) + ' y la alternativa que es distinto de esa cifra. La prueba es de dos colas.<br>' +
      '<strong>Paso 2.</strong> El error estándar es ' + dec2(c2se) + ' pesos y el estadístico vale ' + dec3(c2z) + '.<br>' +
      '<strong>Paso 3.</strong> El valor p de dos colas es ' + pr(c2p) + ', el doble del área que queda más allá de ' + dec3(Math.abs(c2z)) + ' en una sola cola.<br>' +

        ? 'La reserva por siniestro quedó desactualizada y el área tiene evidencia suficiente para revisarla, aunque el valor p no dice cuánto dinero hay que mover: eso lo dice la diferencia de ' + money2(c2xb - c2mu0) + ' por expediente multiplicada por el volumen anual.'
        : 'La reserva por siniestro sobrevive la revisión, pero eso no prueba que sea exacta: la diferencia observada de ' + money2(c2xb - c2mu0) + ' por expediente sigue siendo compatible con el azar, y con más expedientes la misma diferencia podría volverse significativa.') + '</p></div>';
    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>The p value and two tailed tests</h2>' +
      '<p>The critical value rule delivers a verdict, but it does not say by how much. Two studies can reject the same null, one scraping the boundary and one sweeping past it, and the report would present them alike. The <strong>p value</strong> fixes that: it measures how rare it would be to observe a difference at least as large as the observed one in a world where the claim were true. It is a continuous measure of surprise, and that is why it has become the standard way of reporting.</p>' +
      '<p>Its decision rule is direct: reject the null if the p value does not exceed the significance level. And that rule never contradicts the critical value rule, because the critical value is precisely the statistic whose p value equals alpha. They are the same boundary seen from two sides, one on the scale of the statistic and one on the scale of probability.</p>' +
      '<p>When the business question has no direction, the test is <strong>two tailed</strong> and the computation changes in two places. The critical value is taken with alpha split between the two tails, so each side gets half, and the p value doubles, because an equally extreme difference on the other side would also count as evidence against the claim. That is why the same sample always produces a larger p value with two tails than with one: the test without a direction demands more evidence, and giving up the direction has a cost in power worth paying only when the business genuinely has no prior suspicion.</p>' +
      '<p>One warning remains, the one that causes most mistakes in reports. The p value is <strong>not</strong> the probability that the claim is true, nor the probability of having made a mistake. It is a probability computed assuming the null is true, so it cannot at the same time measure how credible that assumption is. Neither does it measure the size of what is at stake: with a large enough sample, a difference of one peso produces tiny p values without anyone caring about one peso.</p>' +
