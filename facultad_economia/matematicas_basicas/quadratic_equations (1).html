  function lineFor(R, x) {
    var u = units(R, x), r = x * u;
    var tailEs = r === R.target ? ', justo en la meta.' : (r < R.target ? ', por debajo de la meta.' : ', por encima de la meta.');
    var tailEn = r === R.target ? ', exactly on target.' : (r < R.target ? ', below the target.' : ', above the target.');
    var core = '$' + nstr(x) + ': ' + nstr(x) + ' × ' + thou(u) + ' = ' + money(r);
    return { es: 'Con ' + core + tailEs, en: 'At ' + core + tailEn };
  }
  function verify() {
    var R = rounds[st.i], hi = 2 * R.m - 10, ent = [], i;
    if (st.count === null) { setFb(st, 'warm', 'Indica primero cuántos precios alcanzan la meta.', 'First indicate how many prices reach the target.'); render(); return; }
    if (st.count >= 1) ent.push(num(st.v.p1));
    if (st.count === 2) ent.push(num(st.v.p2));
    for (i = 0; i < ent.length; i++) {
      if (isNaN(ent[i]) || ent[i] < 10 || ent[i] > hi) {
        setFb(st, 'warm', 'Escribe cada precio como un número entre 10 y ' + hi + '.', 'Enter each price as a number between 10 and ' + hi + '.'); render(); return;
      }
    }

      (ent.length === 0 || (ent.length === 1 && ent[0] === R.sols[0]) || (ent.length === 2 && ent[0] !== ent[1] && sameSet2(ent, R.sols)));
    var a = R.sols[0], b = R.sols[1];
    if (ok) {
      st.solved = true;
      if (R.kind === 'two') setFb(st, 'good',
        '✓ Correcto. Con $' + a + ': ' + a + ' × ' + thou(units(R, a)) + ' = ' + money(R.target) + ', y con $' + b + ': ' + b + ' × ' + thou(units(R, b)) + ' = ' + money(R.target) + '. Un precio bajo con muchos compradores y un precio alto con pocos producen el mismo ingreso. La demanda es una recta, pero el ingreso es precio × demanda: ese producto sube, llega a un máximo y vuelve a bajar, por eso puede alcanzar el mismo valor dos veces.',
        '✓ Correct. At $' + a + ': ' + a + ' × ' + thou(units(R, a)) + ' = ' + money(R.target) + ', and at $' + b + ': ' + b + ' × ' + thou(units(R, b)) + ' = ' + money(R.target) + '. A low price with many buyers and a high price with few buyers produce the same revenue. Demand is a straight line, but revenue is price × demand: that product rises, peaks and falls again, which is why it can reach the same value twice.');
      else if (R.kind === 'none') setFb(st, 'good',
        '✓ Correcto. El mayor ingreso posible es ' + money(R.Rmax) + ' (con $' + R.m + '), así que ningún precio alcanza ' + money(R.target) + '. Algunas metas quedan fuera de alcance, y el álgebra debería poder advertirlo antes de buscar.',
        '✓ Correct. The largest possible revenue is ' + money(R.Rmax) + ' (at $' + R.m + '), so no price reaches ' + money(R.target) + '. Some targets are out of reach, and algebra should be able to warn us before we search.');
      else setFb(st, 'good',
        '✓ Correcto. Solo $' + R.m + ' funciona: ' + R.m + ' × ' + thou(units(R, R.m)) + ' = ' + money(R.target) + '. Con $' + (R.m - 10) + ' y con $' + (R.m + 10) + ' el ingreso es ' + money(rev(R, R.m - 10)) + ', apenas por debajo. Los dos precios de la primera ronda se fundieron en uno solo.',
        '✓ Correct. Only $' + R.m + ' works: ' + R.m + ' × ' + thou(units(R, R.m)) + ' = ' + money(R.target) + '. At $' + (R.m - 10) + ' and at $' + (R.m + 10) + ' revenue is ' + money(rev(R, R.m - 10)) + ', just short. The two prices of the first round have merged into one.');
      render(); return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.solved = true;
      if (R.kind === 'two') setFb(st, 'warm',
        'Los dos precios son $' + a + ' y $' + b + ': ' + a + ' × ' + thou(units(R, a)) + ' = ' + money(R.target) + ' y ' + b + ' × ' + thou(units(R, b)) + ' = ' + money(R.target) + '. El ingreso sube, llega a un máximo y vuelve a bajar, por eso cruza la meta dos veces.',
        'The two prices are $' + a + ' and $' + b + ': ' + a + ' × ' + thou(units(R, a)) + ' = ' + money(R.target) + ' and ' + b + ' × ' + thou(units(R, b)) + ' = ' + money(R.target) + '. Revenue rises, peaks and falls again, which is why it crosses the target twice.');
      else if (R.kind === 'none') setFb(st, 'warm',
        'Ningún precio alcanza la meta. El ingreso máximo es ' + money(R.Rmax) + ' (con $' + R.m + '), menor que ' + money(R.target) + '.',
        'No price reaches the target. The maximum revenue is ' + money(R.Rmax) + ' (at $' + R.m + '), which is less than ' + money(R.target) + '.');
      else setFb(st, 'warm',
        'Exactamente un precio alcanza la meta: $' + R.m + ', porque ' + R.m + ' × ' + thou(units(R, R.m)) + ' = ' + money(R.target) + '. Los precios vecinos, $' + (R.m - 10) + ' y $' + (R.m + 10) + ', dan ' + money(rev(R, R.m - 10)) + '.',
        'Exactly one price reaches the target: $' + R.m + ', because ' + R.m + ' × ' + thou(units(R, R.m)) + ' = ' + money(R.target) + '. The neighboring prices, $' + (R.m - 10) + ' and $' + (R.m + 10) + ', give ' + money(rev(R, R.m - 10)) + '.');
      render(); return;
    }
    var es = '', en = '';
    ent.forEach(function(x) { var ln = lineFor(R, x); es += ln.es + ' '; en += ln.en + ' '; });
    var allHit = ent.length > 0 && ent.every(function(x) { return rev(R, x) === R.target; });
    if (R.kind === 'two' && ent.length < 2) {
      es += allHit ? 'Ese precio sí funciona, pero no es el único: el indicador cruza la meta a ambos lados del máximo.' : 'Recorre todo el rango de precios: el indicador cruza la línea de la meta más de una vez.';
      en += allHit ? 'That price does work, but it is not the only one: the gauge crosses the target on both sides of the peak.' : 'Sweep the whole price range: the gauge crosses the target line more than once.';
    } else if (R.kind === 'none') {
      es += 'Recorre todo el rango de precios y observa el punto más alto del indicador. ¿Llega alguna vez a la línea de la meta?';
      en += 'Sweep the whole price range and watch the highest point of the gauge. Does it ever reach the target line?';
    } else if (R.kind === 'one' && ent.length !== 1) {
      es += ent.length === 0 ? 'Observa el punto más alto del indicador y calcula el ingreso exacto ahí.' : 'Cerca del máximo el indicador casi no cambia. Solo cuenta una coincidencia exacta: multiplica para cada candidato.';
      en += ent.length === 0 ? 'Look at the highest point of the gauge and compute the exact revenue there.' : 'Near the peak the gauge barely moves. Only an exact match counts: multiply for each candidate.';
    } else {
      es += 'Vuelve a calcular precio × unidades vendidas para los precios vecinos.';
      en += 'Recompute price × units sold for the neighboring prices.';
    }
    setFb(st, 'miss', es, en); render();
  }

  host.addEventListener('input', function(e) {
    var t = e.target;
    if (t.classList && t.classList.contains('rr-slider')) { live(); return; }
    var k = t.getAttribute ? t.getAttribute('data-k') : null;
    if (k) st.v[k] = t.value;
  });
  host.addEventListener('click', function(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || !host.contains(b) || b.disabled) return;
    var act = b.getAttribute('data-act'), R = rounds[st.i], sl = host.querySelector('.rr-slider');
    if (act === 'dec' || act === 'inc') {
      var nv = st.price + (act === 'inc' ? 10 : -10);
      if (nv >= 10 && nv <= 2 * R.m - 10) { sl.value = nv; live(); }
    } else if (act === 'cnt') {
      st.count = parseInt(b.getAttribute('data-n'), 10); render();
    } else if (act === 'verify') {
      verify();
    } else if (act === 'next') {
      checkpoint(host.getAttribute('data-widget'), st.i, 'round');
      st.i++;
      if (st.i >= rounds.length) { st.done = true; }
      else { st.price = startPrice(rounds[st.i]); st.count = null; st.v = { p1: '', p2: '' }; st.tries = 0; st.solved = false; st.fb = null; }
      render();
    }
  });
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   W2 · FACTOR BUILDER  (Mode B: build the factors, read the solutions, verify)
   Three rounds: two positive roots, mixed signs, and an equation that must
   first be taken to standard form. The area model shows the expansion of the
   student's own factors (mechanism), never a verdict.
   ════════════════════════════════════════════════════════════════════════ */
function wFactor(rng, host) {
  var rounds = [];
  var r = rint(rng, 2, 5), s = rint(rng, r + 1, 9);
  rounds.push({ kind: 'pos', b: -(r + s), c: r * s, roots: [r, s], given: poly(1, -(r + s), r * s) + ' = 0',
    ctx: { es: 'Condición de punto de equilibrio de un taller de cerámica, donde x es la producción en cientos de piezas.',
           en: 'Break-even condition of a ceramics workshop, where x is production in hundreds of pieces.' } });
  var r2 = rint(rng, 2, 7), s2 = rint(rng, 2, 9); if (s2 === r2) s2 = r2 + 1;
  rounds.push({ kind: 'mixed', b: s2 - r2, c: -r2 * s2, roots: [r2, -s2], given: poly(1, s2 - r2, -r2 * s2) + ' = 0',
    ctx: { es: 'Condición de un modelo de precios, donde x es la cantidad vendida en miles de unidades.',
           en: 'Condition from a pricing model, where x is the quantity sold in thousands of units.' } });
  if (rng() < 0.5) {
    var r3 = rint(rng, 2, 6), s3 = rint(rng, 2, 8); if (s3 === r3) s3 = r3 + 2;
    rounds.push({ kind: 'rearr', b: s3 - r3, c: -r3 * s3, roots: [r3, -s3],
      given: 'x' + SQ + ' = ' + poly(0, r3 - s3, r3 * s3),
      ctx: { es: 'Un analista dejó esta condición sin ordenar. La variable x es la cantidad en miles de unidades.',
             en: 'An analyst left this condition unarranged. The variable x is the quantity in thousands of units.' } });
  } else {
    var g = pick([2, 3], rng), r4 = rint(rng, 2, 4), s4 = rint(rng, r4 + 1, 8);
    rounds.push({ kind: 'common', g: g, b: -(r4 + s4), c: r4 * s4, roots: [r4, s4],
      given: poly(g, -g * (r4 + s4), g * r4 * s4) + ' = 0',
      ctx: { es: 'Condición de punto de equilibrio de una planta, donde x es la producción en cientos de unidades.',
             en: 'Break-even condition of a plant, where x is production in hundreds of units.' } });
  }
  function fresh() { return { v: { m: '', n: '', x1: '', x2: '' }, s: { m: 1, n: 1, x1: 1, x2: 1 } }; }
  var st = { i: 0, tries: 0, solved: false, fb: null, done: false, v: fresh().v, s: fresh().s };

  function xTerm(k) { if (isNaN(k)) return '?'; if (k === 0) return '0'; return (k < 0 ? MINUS : '') + (Math.abs(k) === 1 ? '' : nstr(Math.abs(k))) + 'x'; }
  function liveAM() {
    var m = sVal(st, 'm'), n = sVal(st, 'n');
    var set = function(sel, html) { var e = host.querySelector(sel); if (e) e.innerHTML = html; };
    set('.am-hm', isNaN(m) ? '?' : nstr(m)); set('.am-hn', isNaN(n) ? '?' : nstr(n));
    set('.am-mx', xTerm(m)); set('.am-nx', xTerm(n));
    set('.am-mn', (isNaN(m) || isNaN(n)) ? '?' : nstr(m * n));
    set('.am-out', (isNaN(m) || isNaN(n)) ? '\u2014' : poly(1, m + n, m * n));
  }

  function render() {
    var title = '<span class="iw-title">' + L({ es: 'Constructor de factores', en: 'Factor builder' }) + '</span>';
    if (st.done) {
      host.innerHTML = '<div class="iw-head"><span class="iw-tag">' + L({ es: 'Actividad', en: 'Activity' }) + '</span>' + title + '</div>' +
        '<div class="wdone">' + L({
          es: '<strong>Tres ecuaciones factorizadas.</strong> En todas, el trabajo real fue encontrar el par de números; las soluciones salieron al igualar cada factor a cero. Cuando ningún par entero funciona, la factorización por inspección ya no alcanza.',
          en: '<strong>Three equations factored.</strong> In each one the real work was finding the pair of numbers; the solutions followed from setting each factor equal to zero. When no integer pair works, factoring by inspection is no longer enough.'
        }) + '</div>';
      return;
    }
    var R = rounds[st.i], dis = st.solved;
    host.innerHTML =
      '<div class="iw-head"><span class="iw-tag">' + L({ es: 'Ronda', en: 'Round' }) + ' ' + (st.i + 1) + '/3</span>' + title + '</div>' +
      '<div class="scenario-box">' + L(R.ctx) + '</div>' +
      '<div class="fb-eq">' + R.given + '</div>' +
      '<div class="gw-mini">' + L({
        es: 'Escribe la ecuación como un producto igual a cero. Elige el signo y el número de cada factor: la tabla muestra el desarrollo de tu producto. Después anota las dos soluciones y verifica.',
        en: 'Write the equation as a product equal to zero. Choose the sign and the number of each factor: the table shows the expansion of your product. Then enter the two solutions and check.'
      }) + '</div>' +
      '<div class="fb-row">' +
        '<span class="fb-grp">( x ' + sInput(st, 'm', dis, dis) + ' )</span>' +
        '<span class="fb-grp">( x ' + sInput(st, 'n', dis, dis) + ' )</span>' +
        '<span class="fb-grp">= 0</span>' +
      '</div>' +
      '<div class="am-wrap">' +
        '<table class="am"><tr><th>×</th><th>x</th><th class="am-hm">?</th></tr>' +
        '<tr><th>x</th><td>x' + SQ + '</td><td class="am-mx">?</td></tr>' +
        '<tr><th class="am-hn">?</th><td class="am-nx">?</td><td class="amc am-mn">?</td></tr></table>' +
        '<div class="am-exp">' + L({ es: 'Tu producto desarrollado:', en: 'Your product expanded:' }) + '<br><span class="mx am-out">\u2014</span></div>' +
      '</div>' +
      '<div class="flabel2" style="text-align:center">' + L({ es: 'Soluciones', en: 'Solutions' }) + '</div>' +
      '<div class="sol-row">' +
        '<span class="fb-grp"><span>x<sub>1</sub> =</span> ' + sInput(st, 'x1', dis, dis) + '</span>' +
        '<span class="fb-grp"><span>x<sub>2</sub> =</span> ' + sInput(st, 'x2', dis, dis) + '</span>' +
      '</div>' +
      '<div class="iw-fb"></div><div class="btn-row">' +
        (st.solved
          ? '<button type="button" class="next-btn" data-act="next">' + (st.i < 2 ? L({ es: 'Siguiente ronda', en: 'Next round' }) : L({ es: 'Terminar', en: 'Finish' })) + '</button>'
          : '<button type="button" class="verify-btn" data-act="verify">' + L({ es: 'Verificar', en: 'Check' }) + '</button>') +
      '</div>';
    liveAM(); showFb(host, st);
  }

  function fac(k) { return '(x ' + (k < 0 ? MINUS : '+') + ' ' + nstr(Math.abs(k)) + ')'; }
  function closing(R) {
    var a = R.roots[0], b = R.roots[1];
    var prod = fac(-a) + fac(-b) + ' = 0';
    if (R.kind === 'pos') return {
      es: prod + ', así que x = ' + a + ' o x = ' + b + '. El taller está en equilibrio con ' + thou(a * 100) + ' y con ' + thou(b * 100) + ' piezas.',
      en: prod + ', so x = ' + a + ' or x = ' + b + '. The workshop breaks even at ' + thou(a * 100) + ' and at ' + thou(b * 100) + ' pieces.' };
    if (R.kind === 'common') return {
      es: 'Al dividir entre ' + R.g + ' queda ' + poly(1, R.b, R.c) + ' = 0, y entonces ' + prod + ': x = ' + a + ' o x = ' + b + '. Dividir toda la ecuación entre un factor común no cambia sus soluciones.',
      en: 'Dividing by ' + R.g + ' leaves ' + poly(1, R.b, R.c) + ' = 0, and then ' + prod + ': x = ' + a + ' or x = ' + b + '. Dividing the whole equation by a common factor does not change its solutions.' };
    var pre = R.kind === 'rearr'
      ? { es: 'En forma estándar: ' + poly(1, R.b, R.c) + ' = 0. ', en: 'In standard form: ' + poly(1, R.b, R.c) + ' = 0. ' } : { es: '', en: '' };
    return {
      es: pre.es + prod + ', así que x = ' + nstr(a) + ' o x = ' + nstr(b) + '. Una cantidad no puede ser negativa: solo x = ' + nstr(a) + ' responde la pregunta de negocio.',
      en: pre.en + prod + ', so x = ' + nstr(a) + ' or x = ' + nstr(b) + '. A quantity cannot be negative: only x = ' + nstr(a) + ' answers the business question.' };
  }
  function verify() {
    var R = rounds[st.i];
    var m = sVal(st, 'm'), n = sVal(st, 'n'), x1 = sVal(st, 'x1'), x2 = sVal(st, 'x2');
    if (isNaN(m) || isNaN(n) || isNaN(x1) || isNaN(x2)) {
      setFb(st, 'warm', 'Completa los dos factores y las dos soluciones antes de verificar.', 'Fill in both factors and both solutions before checking.'); render(); return;
    }
    var okF = sameSet2([m, n], [-R.roots[0], -R.roots[1]]), okS = sameSet2([x1, x2], R.roots), cl = closing(R);
    if (okF && okS) { st.solved = true; setFb(st, 'good', '✓ Correcto. ' + cl.es, '✓ Correct. ' + cl.en); render(); return; }
    st.tries++;
    if (st.tries >= 3) {
      st.solved = true;
      sSet(st, 'm', -R.roots[0]); sSet(st, 'n', -R.roots[1]); sSet(st, 'x1', R.roots[0]); sSet(st, 'x2', R.roots[1]);
      setFb(st, 'warm', cl.es, cl.en); render(); return;
    }
    var pr = m * n, sm = m + n;
    if (!okF) {
      if (R.kind === 'rearr' && (pr === -R.c || sm === -R.b)) setFb(st, 'miss',
        'Antes de factorizar, el cero debe quedar solo en un lado. Pasa todos los términos al lado izquierdo y cuida el signo de cada uno.',
        'Before factoring, zero must stand alone on one side. Move every term to the left side and watch the sign of each one.');
      else if (R.kind === 'common' && (pr === R.g * R.c || sm === R.g * R.b || pr === R.g * R.g * R.c)) setFb(st, 'miss',
        'Los tres coeficientes comparten un factor común. Divide toda la ecuación entre ese factor y factoriza lo que queda.',
        'The three coefficients share a common factor. Divide the whole equation by it and factor what remains.');
      else if (R.kind === 'rearr' || R.kind === 'common') setFb(st, 'miss',
        'Tu producto se desarrolla como ' + poly(1, sm, pr) + ', que no equivale a la ecuación dada. Lleva primero la ecuación a la forma x' + SQ + ' + bx + c = 0 y compara término a término.',
        'Your product expands to ' + poly(1, sm, pr) + ', which is not equivalent to the given equation. First take the equation to the form x' + SQ + ' + bx + c = 0 and compare term by term.');
      else if (pr !== R.c) setFb(st, 'miss',
        'Tus números se multiplican a ' + nstr(pr) + ', pero el término constante es ' + nstr(R.c) + '. Empieza por los pares de factores de ' + nstr(Math.abs(R.c)) + ' y decide los signos.',
        'Your numbers multiply to ' + nstr(pr) + ', but the constant term is ' + nstr(R.c) + '. Start from the factor pairs of ' + nstr(Math.abs(R.c)) + ' and decide the signs.');
      else setFb(st, 'miss',
        'El producto es correcto (' + nstr(R.c) + '), pero tus números suman ' + nstr(sm) + ' y el coeficiente de x es ' + nstr(R.b) + '. Prueba otro par de factores u otros signos.',
        'The product is right (' + nstr(R.c) + '), but your numbers add up to ' + nstr(sm) + ' and the coefficient of x is ' + nstr(R.b) + '. Try another factor pair or other signs.');
    } else if (sameSet2([x1, x2], [m, n])) {
      setFb(st, 'miss',
        'Los factores son correctos. Un producto vale cero cuando alguno de sus factores vale cero: resuelve ' + fac(m).replace(/[()]/g, '') + ' = 0 y revisa el signo de cada solución.',
        'The factors are correct. A product is zero when one of its factors is zero: solve ' + fac(m).replace(/[()]/g, '') + ' = 0 and check the sign of each solution.');
    } else {
      setFb(st, 'miss',
        'Los factores son correctos. Iguala cada factor a cero por separado y despeja x en cada uno.',
        'The factors are correct. Set each factor equal to zero separately and solve each one for x.');
    }
    render();
  }

  bindInputs(host, st, liveAM);
  host.addEventListener('click', function(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || !host.contains(b) || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (act === 'sgn') toggleSign(st, b, liveAM);
    else if (act === 'verify') verify();
    else if (act === 'next') {
      checkpoint(host.getAttribute('data-widget'), st.i, 'round');
      st.i++;
      if (st.i >= rounds.length) st.done = true;
      else { var f = fresh(); st.v = f.v; st.s = f.s; st.tries = 0; st.solved = false; st.fb = null; }
      render();
    }
  });
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   W3 · FORMULA PIPELINE  (Mode B: staged calculate + verify)
   Stages: coefficients → discriminant → solutions (→ decision in round 3).
   Each stage is verified before the next unlocks, so one slip does not
   cascade. Round 1 gives the coefficients as scaffolding.
   ════════════════════════════════════════════════════════════════════════ */
function wPipeline(rng, host) {
  var rounds = [], t;
  /* Round 1: rational solutions, a ≠ 1, coefficients given */
  (function() {
    var a = pick([2, 4], rng), u = pick(a === 2 ? [1, 3, 5] : [1, 3, 5, 7], rng), v = rint(rng, 3, 6);
    var b = -(a * v + u), c = u * v;
    rounds.push({ a: a, b: b, c: c, prefill: true, pick: false, kind: 'profit',
      ctx: { es: 'Una planta embotelladora tiene una utilidad mensual, en miles de pesos, de P = ' + poly(-a, -b, -c) + ', donde x es la producción en miles de cajas. Para el punto de equilibrio, P = 0. Al multiplicar por ' + MINUS + '1 se obtiene:',
             en: 'A bottling plant has a monthly profit, in thousands of pesos, of P = ' + poly(-a, -b, -c) + ', where x is production in thousands of cases. At break-even, P = 0. Multiplying by ' + MINUS + '1 gives:' } });
  })();
  /* Round 2: irrational solutions, both positive */
  (function() {
    var a, b, c, D, guard = 0;
    do { a = pick([1, 1, 2], rng); b = rint(rng, 7, 14); c = rint(rng, 3, 14); D = b * b - 4 * a * c; guard++; }
    while ((D <= 4 || isSquare(D)) && guard < 200);
    if (D <= 4 || isSquare(D)) { a = 1; b = 9; c = 12; }
    rounds.push({ a: a, b: -b, c: c, prefill: false, pick: false, kind: 'profit',
      ctx: { es: 'Una imprenta tiene una utilidad semanal, en miles de pesos, de P = ' + poly(-a, b, -c) + ', donde x es la producción en miles de ejemplares. Para el punto de equilibrio, P = 0. Al multiplicar por ' + MINUS + '1 se obtiene:',
             en: 'A print shop has a weekly profit, in thousands of pesos, of P = ' + poly(-a, b, -c) + ', where x is production in thousands of copies. At break-even, P = 0. Multiplying by ' + MINUS + '1 gives:' } });
  })();
  /* Round 3: market equilibrium, one negative solution to reject */
  (function() {
    var B, C, cc, E, D, bb, guard = 0;
    do { B = rint(rng, 1, 3); C = rint(rng, 1, 4); bb = B + C; cc = rint(rng, 8, 36); D = bb * bb + 4 * cc; guard++; }
    while (isSquare(D) && guard < 200);
    if (isSquare(D)) { B = 2; C = 3; bb = 5; cc = 20; }
    E = rint(rng, 4, 10);
    var A = E + cc;
    rounds.push({ a: 1, b: bb, c: -cc, prefill: false, pick: true, kind: 'market', A: A, B: B, C: C, E: E,
      ctx: { es: 'En un mercado regional de aguacate, la demanda es p = ' + poly(0, -B, A) + ' y la oferta es p = ' + poly(1, C, E) + ', donde x es la cantidad en miles de toneladas y p el precio por kilogramo, en pesos. En el equilibrio, oferta y demanda coinciden. Al igualarlas y pasar todo a un lado se obtiene:',
             en: 'In a regional avocado market, demand is p = ' + poly(0, -B, A) + ' and supply is p = ' + poly(1, C, E) + ', where x is the quantity in thousands of tonnes and p the price per kilogram, in pesos. At equilibrium, supply equals demand. Setting them equal and moving every term to one side gives:' } });
  })();
  rounds.forEach(function(R) {
    R.D = R.b * R.b - 4 * R.a * R.c;
    var q = Math.sqrt(R.D), xa = (-R.b - q) / (2 * R.a), xb = (-R.b + q) / (2 * R.a);
    R.x1 = Math.min(xa, xb); R.x2 = Math.max(xa, xb);
  });

  var st = { i: 0, stage: 'abc', tries: 0, fb: null, done: false, v: {}, s: {}, abc: null, pickMiss: 0 };
  function startRound() {
    var R = rounds[st.i];
    st.v = { a: '', b: '', c: '', D: '', x1: '', x2: '' };
    st.s = { a: 1, b: 1, c: 1, D: 1, x1: 1, x2: 1 };
    st.tries = 0; st.fb = null; st.abc = null; st.pickMiss = 0;
    if (R.prefill) { st.abc = [R.a, R.b, R.c]; sSet(st, 'a', R.a); sSet(st, 'b', R.b); sSet(st, 'c', R.c); st.stage = 'D'; }
    else st.stage = 'abc';
  }
  startRound();
  var ORDER = ['abc', 'D', 'x', 'pick', 'fin'];
  function after(stage) { return ORDER.indexOf(st.stage) > ORDER.indexOf(stage); }
  function cls(stage) { return 'stage ' + (st.stage === stage ? 'active' : (after(stage) ? 'done' : 'locked')); }

  function drawPlot() {
    var cv = host.querySelector('canvas.pl-cv'); if (!cv || st.done || st.stage !== 'fin') return;
    var R = rounds[st.i];
    if (R.kind === 'profit') {
      var a = -R.a, b = -R.b, c = -R.c;
      var P = function(x) { return a * x * x + b * x + c; };
      plotXY(cv, 190, {
        x0: 0, x1: Math.ceil(-b / a), fs: [{ f: P, color: 'green' }],
        zero: true, zeroLabel: 'P = 0', shade: { from: R.x1, to: R.x2, f: P, label: L({ es: 'utilidad', en: 'profit' }) },
        marks: [{ x: R.x1, y: 0, label: f2(R.x1), dy: 18 }, { x: R.x2, y: 0, label: f2(R.x2), dy: 18 }],
        xlabel: L({ es: 'x (producción)', en: 'x (production)' })
      });
    } else {
      var dem = function(x) { return R.A - R.B * x; }, sup = function(x) { return x * x + R.C * x + R.E; };
      var xe = R.x2, xr = Math.max(Math.ceil(xe) + 1, Math.min(Math.ceil(xe * 2), Math.floor(R.A / R.B)));
      plotXY(cv, 190, {
        x0: 0, x1: xr,
        fs: [{ f: dem, color: 'gold', label: L({ es: 'demanda', en: 'demand' }), labelAt: 0, labelAlign: 'left', labelDy: -6 },
             { f: sup, color: 'green', label: L({ es: 'oferta', en: 'supply' }), labelAt: xr, labelAlign: 'right', labelDy: 18 }],
        marks: [{ x: xe, y: dem(xe), label: 'x = ' + f2(xe), dy: -12, color: 'ok' }],
        xlabel: L({ es: 'x (miles de toneladas)', en: 'x (thousand tonnes)' })
      });
    }
  }
  _redraws.push(drawPlot);

  function render() {
    var title = '<span class="iw-title">' + L({ es: 'La línea de la fórmula', en: 'The formula pipeline' }) + '</span>';
    if (st.done) {
      host.innerHTML = '<div class="iw-head"><span class="iw-tag">' + L({ es: 'Actividad', en: 'Activity' }) + '</span>' + title + '</div>' +
        '<div class="wdone">' + L({
          es: '<strong>Tres ecuaciones, un mismo procedimiento.</strong> Coeficientes, discriminante, soluciones: la fórmula funciona igual con números cómodos o incómodos. Observa que en las tres rondas un solo número intermedio decidió qué tipo de respuesta obtuviste.',
          en: '<strong>Three equations, one procedure.</strong> Coefficients, discriminant, solutions: the formula works the same with friendly or unfriendly numbers. Notice that in all three rounds a single intermediate number decided what kind of answer you obtained.'
        }) + '</div>';
      return;
    }
    var R = rounds[st.i], A = st.abc, sq = A ? Math.sqrt(A[1] * A[1] - 4 * A[0] * A[2]) : 0;
    var h =
      '<div class="iw-head"><span class="iw-tag">' + L({ es: 'Ronda', en: 'Round' }) + ' ' + (st.i + 1) + '/3</span>' + title + '</div>' +
      '<div class="scenario-box">' + L(R.ctx) + '<div class="fb-eq">' + poly(R.a, R.b, R.c) + ' = 0</div></div>' +
      '<div class="gw-mini">' + L({
        es: 'Trabaja en papel con calculadora y completa una etapa a la vez. Cada etapa se verifica antes de abrir la siguiente. Redondea las soluciones a dos decimales.',
        en: 'Work on paper with a calculator and complete one stage at a time. Each stage is checked before the next one opens. Round the solutions to two decimals.'
      }) + '</div><div class="pipe">';
    /* stage 1 */
    h += '<div class="' + cls('abc') + '"><div class="stage-h"><span class="stage-n">1</span><span class="stage-t">' + L({ es: 'Coeficientes', en: 'Coefficients' }) + '</span>' +
      '<span class="stage-f">ax' + SQ + ' + bx + c = 0</span></div><div class="stage-b">' +
      '<span class="lab">a = ' + sInput(st, 'a', st.stage !== 'abc', after('abc')) + '</span>' +
      '<span class="lab">b = ' + sInput(st, 'b', st.stage !== 'abc', after('abc')) + '</span>' +
      '<span class="lab">c = ' + sInput(st, 'c', st.stage !== 'abc', after('abc')) + '</span></div>' +
      (R.prefill ? '<div class="stage-note">' + L({ es: 'En esta ronda los coeficientes ya están identificados. Revisa de dónde sale cada signo.', en: 'In this round the coefficients are already identified. Check where each sign comes from.' }) + '</div>' : '') +
      '</div>';
    /* stage 2 */
    h += '<div class="' + cls('D') + '"><div class="stage-h"><span class="stage-n">2</span><span class="stage-t">' + L({ es: 'Discriminante', en: 'Discriminant' }) + '</span>' +
      '<span class="stage-f">D = b' + SQ + ' ' + MINUS + ' 4ac</span></div><div class="stage-b">' +
      '<span class="lab">D = ' + sInput(st, 'D', st.stage !== 'D', after('D')) + '</span>' +
      (after('D') ? '<span class="lab"><span>' + root('D') + ' ≈ ' + f3(sq) + '</span></span>' : '') + '</div></div>';
    /* stage 3 */
    h += '<div class="' + cls('x') + '"><div class="stage-h"><span class="stage-n">3</span><span class="stage-t">' + L({ es: 'Soluciones', en: 'Solutions' }) + '</span>' +
      '<span class="stage-f">x = ' + frac(MINUS + 'b ± ' + root('D'), '2a') + '</span></div><div class="stage-b">' +
      '<span class="lab"><span>x<sub>1</sub> =</span> ' + sInput(st, 'x1', st.stage !== 'x', after('x')) + '</span>' +
      '<span class="lab"><span>x<sub>2</sub> =</span> ' + sInput(st, 'x2', st.stage !== 'x', after('x')) + '</span></div></div>';
    /* stage 4 (round 3) */
    if (R.pick) {
      var pd = st.stage !== 'pick';
      h += '<div class="' + cls('pick') + '"><div class="stage-h"><span class="stage-n">4</span><span class="stage-t">' + L({ es: 'Decisión: ¿cuál es la cantidad de equilibrio?', en: 'Decision: which one is the equilibrium quantity?' }) + '</span></div>' +
        '<div class="pick-row">' +
        '<button type="button" class="pick-btn' + (st.stage === 'fin' ? '' : '') + '" data-act="pick" data-w="1"' + (pd ? ' disabled' : '') + '>x = ' + (after('x') ? f2(R.x1) : '?') + '</button>' +
        '<button type="button" class="pick-btn' + (st.stage === 'fin' ? ' on' : '') + '" data-act="pick" data-w="2"' + (pd ? ' disabled' : '') + '>x = ' + (after('x') ? f2(R.x2) : '?') + '</button>' +
        '</div></div>';
    }
    h += '</div>';
    if (st.stage === 'fin') h += '<canvas class="iw-canvas pl-cv" style="margin-top:.8rem"></canvas>';
    h += '<div class="iw-fb"></div><div class="btn-row">' +
      (st.stage === 'fin'
        ? '<button type="button" class="next-btn" data-act="next">' + (st.i < 2 ? L({ es: 'Siguiente ronda', en: 'Next round' }) : L({ es: 'Terminar', en: 'Finish' })) + '</button>'
        : (st.stage === 'pick' ? '' : '<button type="button" class="verify-btn" data-act="verify">' + L({ es: 'Verificar etapa', en: 'Check stage' }) + '</button>')) +
      '</div>';
    host.innerHTML = h;
    showFb(host, st);
    if (st.stage === 'fin') later(drawPlot);
  }

  function finish() {
    var R = rounds[st.i];
    st.stage = 'fin'; st.tries = 0;
    if (R.kind === 'profit') setFb(st, 'good',
      '✓ Ronda completa. La empresa está en equilibrio en x = ' + f2(R.x1) + ' y x = ' + f2(R.x2) + ' (en miles). Entre esos dos niveles la utilidad es positiva; fuera de ellos hay pérdida.',
      '✓ Round complete. The firm breaks even at x = ' + f2(R.x1) + ' and x = ' + f2(R.x2) + ' (in thousands). Between those two levels profit is positive; outside them the firm loses money.');
    else setFb(st, 'good',
      '✓ Ronda completa. La ecuación tiene dos soluciones, pero una cantidad negativa no existe en un mercado. El equilibrio está en x = ' + f2(R.x2) + ' mil toneladas, a un precio de ' + money(Math.round((R.A - R.B * R.x2) * 100) / 100) + ' por kilogramo.',
      '✓ Round complete. The equation has two solutions, but a negative quantity does not exist in a market. Equilibrium is at x = ' + f2(R.x2) + ' thousand tonnes, at a price of ' + money(Math.round((R.A - R.B * R.x2) * 100) / 100) + ' per kilogram.');
  }
  function afterX() { var R = rounds[st.i]; if (R.pick) { st.stage = 'pick'; st.tries = 0; } else finish(); }

  function verify() {
    var R = rounds[st.i], A, a, b, c;
    if (st.stage === 'abc') {
      a = sVal(st, 'a'); b = sVal(st, 'b'); c = sVal(st, 'c');
      if (isNaN(a) || isNaN(b) || isNaN(c)) { setFb(st, 'warm', 'Escribe los tres coeficientes.', 'Enter all three coefficients.'); render(); return; }
      var prop = a !== 0 && near(a * R.b, b * R.a) && near(a * R.c, c * R.a);
      if (prop) {
        st.abc = [a, b, c]; st.stage = 'D'; st.tries = 0;
        setFb(st, 'good', '✓ a = ' + nstr(a) + ', b = ' + nstr(b) + ', c = ' + nstr(c) + '. El signo que antecede a cada término pertenece a su coeficiente.',
          '✓ a = ' + nstr(a) + ', b = ' + nstr(b) + ', c = ' + nstr(c) + '. The sign in front of each term belongs to its coefficient.');
      } else {
        st.tries++;
        if (st.tries >= 3) {
          st.abc = [R.a, R.b, R.c]; sSet(st, 'a', R.a); sSet(st, 'b', R.b); sSet(st, 'c', R.c); st.stage = 'D'; st.tries = 0;
          setFb(st, 'warm', 'Los coeficientes son a = ' + nstr(R.a) + ', b = ' + nstr(R.b) + ', c = ' + nstr(R.c) + ': cada uno incluye el signo de su término. Continúa con el discriminante.',
            'The coefficients are a = ' + nstr(R.a) + ', b = ' + nstr(R.b) + ', c = ' + nstr(R.c) + ': each one includes the sign of its term. Continue with the discriminant.');
        } else if (Math.abs(a) === Math.abs(R.a) && Math.abs(b) === Math.abs(R.b) && Math.abs(c) === Math.abs(R.c)) {
          setFb(st, 'miss', 'Las magnitudes son correctas. Revisa los signos: en ax' + SQ + ' + bx + c = 0, cada coeficiente incluye el signo que antecede a su término.',
            'The magnitudes are right. Check the signs: in ax' + SQ + ' + bx + c = 0, each coefficient includes the sign in front of its term.');
        } else {
          setFb(st, 'miss', 'Compara la ecuación término a término con ax' + SQ + ' + bx + c = 0: a multiplica a x' + SQ + ', b multiplica a x, y c es el término sin x.',
            'Compare the equation term by term with ax' + SQ + ' + bx + c = 0: a multiplies x' + SQ + ', b multiplies x, and c is the term without x.');
        }
      }
      render(); return;
    }
    A = st.abc; a = A[0]; b = A[1]; c = A[2];
    var D = b * b - 4 * a * c;
    if (st.stage === 'D') {
      var d = sVal(st, 'D');
      if (isNaN(d)) { setFb(st, 'warm', 'Escribe el valor de D.', 'Enter the value of D.'); render(); return; }
      if (near(d, D)) {
        st.stage = 'x'; st.tries = 0;
        setFb(st, 'good', '✓ D = ' + par(b) + SQ + ' ' + MINUS + ' 4 · ' + par(a) + ' · ' + par(c) + ' = ' + nstr(b * b) + ' ' + (4 * a * c < 0 ? '+' : MINUS) + ' ' + nstr(Math.abs(4 * a * c)) + ' = ' + nstr(D) + '. La línea entrega ' + root('D') + ' ≈ ' + f3(Math.sqrt(D)) + ' a la siguiente etapa.',
          '✓ D = ' + par(b) + SQ + ' ' + MINUS + ' 4 · ' + par(a) + ' · ' + par(c) + ' = ' + nstr(b * b) + ' ' + (4 * a * c < 0 ? '+' : MINUS) + ' ' + nstr(Math.abs(4 * a * c)) + ' = ' + nstr(D) + '. The pipeline passes ' + root('D') + ' ≈ ' + f3(Math.sqrt(D)) + ' to the next stage.');
      } else {
        st.tries++;
        if (st.tries >= 3) {
          sSet(st, 'D', D); st.stage = 'x'; st.tries = 0;
          setFb(st, 'warm', 'D = ' + par(b) + SQ + ' ' + MINUS + ' 4 · ' + par(a) + ' · ' + par(c) + ' = ' + nstr(D) + '. Calcula b' + SQ + ' y 4ac por separado, cada uno con su signo, y después resta. Continúa con las soluciones.',
            'D = ' + par(b) + SQ + ' ' + MINUS + ' 4 · ' + par(a) + ' · ' + par(c) + ' = ' + nstr(D) + '. Compute b' + SQ + ' and 4ac separately, each with its sign, and then subtract. Continue with the solutions.');
        } else if (near(d, b * b + 4 * a * c)) {
          setFb(st, 'miss', 'Revisa el signo del término 4ac. Calcula primero el producto 4 · a · c con los signos de a y de c, y después réstalo de b' + SQ + '.',
            'Check the sign of the term 4ac. First compute the product 4 · a · c with the signs of a and c, and then subtract it from b' + SQ + '.');
        } else if (near(d, -b * b - 4 * a * c)) {
          setFb(st, 'miss', 'El cuadrado de un número nunca es negativo: ' + par(b) + SQ + ' = ' + nstr(b * b) + '. Corrige b' + SQ + ' y vuelve a restar.',
            'The square of a number is never negative: ' + par(b) + SQ + ' = ' + nstr(b * b) + '. Correct b' + SQ + ' and subtract again.');
        } else if (near(d, b * b - a * c)) {
          setFb(st, 'miss', 'Falta un factor: a b' + SQ + ' se le resta cuatro veces el producto de a por c.',
            'A factor is missing: four times the product of a and c is subtracted from b' + SQ + '.');
        } else {
          setFb(st, 'miss', 'D = b' + SQ + ' ' + MINUS + ' 4ac. Calcula b' + SQ + ' y 4ac por separado, cada uno con su signo, y después resta.',
            'D = b' + SQ + ' ' + MINUS + ' 4ac. Compute b' + SQ + ' and 4ac separately, each with its sign, and then subtract.');
        }
      }
      render(); return;
    }
    if (st.stage === 'x') {
      var x1 = sVal(st, 'x1'), x2 = sVal(st, 'x2'), tol = 0.011, q = Math.sqrt(D);
      if (isNaN(x1) || isNaN(x2)) { setFb(st, 'warm', 'Escribe las dos soluciones.', 'Enter both solutions.'); render(); return; }
      if (sameSet2([x1, x2], [R.x1, R.x2], tol)) {
        setFb(st, 'good', '', ''); afterX();
        if (st.stage === 'pick') setFb(st, 'good', '✓ x = ' + f2(R.x1) + ' y x = ' + f2(R.x2) + '. Las dos resuelven la ecuación. Falta decidir cuál responde la pregunta del mercado.',
          '✓ x = ' + f2(R.x1) + ' and x = ' + f2(R.x2) + '. Both solve the equation. It remains to decide which one answers the market question.');
      } else {
        st.tries++;
        if (st.tries >= 3) {
          sSet(st, 'x1', R.x1); sSet(st, 'x2', R.x2);
          var expl = 'x = (' + nstr(-b) + ' ± ' + f3(q) + ') ÷ ' + nstr(2 * a) + ': x = ' + f2(R.x1) + ', x = ' + f2(R.x2) + '.';
          afterX();
          if (st.stage === 'pick') setFb(st, 'warm', expl + ' Ahora decide cuál responde la pregunta del mercado.', expl + ' Now decide which one answers the market question.');
          else { finish(); st.fb = { cls: 'warm', msg: { es: expl + ' ' + st.fb.msg.es.replace('✓ ', ''), en: expl + ' ' + st.fb.msg.en.replace('✓ ', '') } }; }
        } else if (sameSet2([x1, x2], [-R.x1, -R.x2], tol)) {
          setFb(st, 'miss', 'Revisa el signo de ' + MINUS + 'b. Aquí b = ' + nstr(b) + ', así que ' + MINUS + 'b = ' + nstr(-b) + '.',
            'Check the sign of ' + MINUS + 'b. Here b = ' + nstr(b) + ', so ' + MINUS + 'b = ' + nstr(-b) + '.');
        } else if (Math.abs(a) !== 1 && sameSet2([x1, x2], [(-b - q) / 2, (-b + q) / 2], tol)) {
          setFb(st, 'miss', 'El denominador es 2a, no 2. Con a = ' + nstr(a) + ', divide entre ' + nstr(2 * a) + '.',
            'The denominator is 2a, not 2. With a = ' + nstr(a) + ', divide by ' + nstr(2 * a) + '.');
        } else if (sameSet2([x1, x2], [-b - q / (2 * a), -b + q / (2 * a)], tol)) {
          setFb(st, 'miss', 'Todo el numerador se divide entre 2a: primero calcula ' + MINUS + 'b ± ' + root('D') + ' y después divide el resultado completo.',
            'The entire numerator is divided by 2a: first compute ' + MINUS + 'b ± ' + root('D') + ' and then divide the whole result.');
        } else if (near(x1, R.x1, tol) || near(x1, R.x2, tol) || near(x2, R.x1, tol) || near(x2, R.x2, tol)) {
          setFb(st, 'miss', 'Una de tus soluciones es correcta. La otra usa el signo contrario delante de ' + root('D') + ': repite el cálculo cambiando solo ese signo.',
            'One of your solutions is correct. The other uses the opposite sign in front of ' + root('D') + ': repeat the calculation changing only that sign.');
        } else {
          setFb(st, 'miss', 'Calcula el numerador ' + MINUS + 'b ± ' + root('D') + ' con ' + MINUS + 'b = ' + nstr(-b) + ' y ' + root('D') + ' ≈ ' + f3(q) + ', y divide cada resultado entre 2a = ' + nstr(2 * a) + '.',
            'Compute the numerator ' + MINUS + 'b ± ' + root('D') + ' with ' + MINUS + 'b = ' + nstr(-b) + ' and ' + root('D') + ' ≈ ' + f3(q) + ', and divide each result by 2a = ' + nstr(2 * a) + '.');
        }
      }
      render(); return;
    }
  }

  bindInputs(host, st, null);
  host.addEventListener('click', function(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || !host.contains(b) || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (act === 'sgn') toggleSign(st, b, null);
    else if (act === 'verify') verify();
    else if (act === 'pick') {
      if (st.stage !== 'pick') return;
      if (b.getAttribute('data-w') === '2') { finish(); }
      else {
        st.pickMiss++;
        if (st.pickMiss >= 3) { finish(); st.fb.cls = 'warm'; }
        else setFb(st, 'miss', 'Esa solución es negativa. La variable x es una cantidad de producto: ¿puede un mercado intercambiar una cantidad negativa?',
          'That solution is negative. The variable x is a quantity of product: can a market trade a negative quantity?');
      }
      render();
    } else if (act === 'next') {
      checkpoint(host.getAttribute('data-widget'), st.i, 'round');
      st.i++;
      if (st.i >= rounds.length) st.done = true; else startRound();
      render();
    }
  });
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   W4 · BREAK-EVEN DIAGNOSIS  (Mode C: the tap is the submission)
   Five branches. The student computes D, enters it, and taps the verdict.
   The D field is a presence gate: guessing among three verdicts is not
   possible without the computation. A profit sketch appears as consequence.
   ════════════════════════════════════════════════════════════════════════ */
function wDiagnosis(rng, host) {
  var CITIES = shuffle(['Colima', 'Manzanillo', 'Tecomán', 'Guadalajara', 'Morelia', 'León', 'Puebla', 'Mérida', 'Tepic', 'Querétaro'], rng);
  var KINDS = shuffle(['two', 'two', 'one', 'none', 'none'], rng);
  var seen = {};
  var items = KINDS.map(function(kind, i) {
    var a, b, c, D, guard = 0, key;
    do {
      guard++;
      a = pick([-1, -1, -2], rng);
      if (kind === 'one') {
        b = a === -1 ? pick([6, 8, 10, 12, 14], rng) : pick([8, 12, 16], rng);
        c = -(b * b) / (4 * Math.abs(a));
      } else {
        b = rint(rng, 6, 15);
        var delta = rint(rng, 4, 44), want = kind === 'two' ? b * b - delta : b * b + delta;
        c = -Math.max(1, Math.round(want / (4 * Math.abs(a))));
      }
      D = b * b - 4 * a * c; key = a + '|' + b + '|' + c;
    } while (guard < 300 && (seen[key] || (kind === 'two' && D <= 0) || (kind === 'none' && D >= 0) || (kind === 'one' && D !== 0) || Math.abs(D) > 80));
    seen[key] = 1;
    return { kind: kind, a: a, b: b, c: c, D: D, city: CITIES[i] };
  });
  var VERD = [
    { k: 'two',  lab: { es: 'Dos puntos de equilibrio', en: 'Two break-even points' }, path: 'M4,30 Q30,-18 56,30' },
    { k: 'one',  lab: { es: 'Exactamente uno', en: 'Exactly one' },                  path: 'M4,34 Q30,2 56,34' },
    { k: 'none', lab: { es: 'Ninguno', en: 'None' },                                 path: 'M4,36 Q30,16 56,36' }
  ];
  function icon(v) {
    return '<svg viewBox="0 0 60 38" width="56" height="35" style="display:block">' +
      '<line x1="2" y1="18" x2="58" y2="18" stroke="var(--text3)" stroke-width="1.2" stroke-dasharray="4 3"/>' +
      '<path d="' + v.path + '" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round"/></svg>';
  }
  var st = { i: 0, tries: 0, solved: false, fb: null, done: false, v: { D: '' }, s: { D: 1 }, wrong: null };

  function drawPlot() {
    var cv = host.querySelector('canvas.dg-cv'); if (!cv || st.done || !st.solved) return;
    var it = items[st.i], P = function(x) { return it.a * x * x + it.b * x + it.c; };
    var xr = Math.ceil(-it.b / it.a), marks = [], shade = null;
    if (it.D >= 0) {
      var q = Math.sqrt(it.D), xa = (-it.b + q) / (2 * it.a), xb = (-it.b - q) / (2 * it.a);
      if (it.D === 0) marks.push({ x: xa, y: 0, label: nstr(xa), dy: 18 });
      else { marks.push({ x: xa, y: 0, label: nstr(xa), dy: 18 }, { x: xb, y: 0, label: nstr(xb), dy: 18 }); shade = { from: xa, to: xb, f: P, label: '' }; }
    }
    plotXY(cv, 170, { x0: 0, x1: xr, fs: [{ f: P, color: 'green' }],
      zero: true, zeroLabel: 'P = 0', marks: marks, shade: shade, xlabel: L({ es: 'x (producción, cientos de unidades)', en: 'x (production, hundreds of units)' }) });
  }
  _redraws.push(drawPlot);

  function render() {
    var title = '<span class="iw-title">' + L({ es: 'Diagnóstico de punto de equilibrio', en: 'Break-even diagnosis' }) + '</span>';
    if (st.done) {
      var rows = items.map(function(it) {
        var v = VERD.filter(function(x) { return x.k === it.kind; })[0];
        return '<div>' + it.city + ': D = ' + nstr(it.D) + ' · ' + L(v.lab) + '</div>';
      }).join('');
      host.innerHTML = '<div class="iw-head"><span class="iw-tag">' + L({ es: 'Actividad', en: 'Activity' }) + '</span>' + title + '</div>' +
        '<div class="wdone">' + L({
          es: '<strong>Diagnóstico completo.</strong> Sin resolver ninguna ecuación, el signo de D clasificó las cinco sucursales:',
          en: '<strong>Diagnosis complete.</strong> Without solving a single equation, the sign of D classified all five branches:'
        }) + '<div class="plines">' + rows + '</div></div>';
      return;
    }
    var it = items[st.i];
    var dots = items.map(function(_, j) { return '<span class="dg-dot ' + (j < st.i ? 'fin' : (j === st.i ? 'cur' : '')) + '"></span>'; }).join('');
    var h =
      '<div class="iw-head"><span class="iw-tag">' + L({ es: 'Sucursal', en: 'Branch' }) + ' ' + (st.i + 1) + '/5</span>' + title + '</div>' +
      '<div class="gw-mini">' + L({
        es: 'La dirección revisa cinco sucursales. En cada una, x es la producción en cientos de unidades y P la utilidad mensual en miles de pesos. Calcula en papel el discriminante de P = 0, anótalo y toca el veredicto.',
        en: 'Head office is reviewing five branches. For each one, x is production in hundreds of units and P is monthly profit in thousands of pesos. Compute the discriminant of P = 0 on paper, enter it, and tap the verdict.'
      }) + '</div>' +
      '<div class="dg-dots">' + dots + '</div>' +
      '<div class="dg-name">' + L({ es: 'Sucursal', en: 'Branch' }) + ' ' + it.city + '</div>' +
      '<div class="dg-fn">P = ' + poly(it.a, it.b, it.c) + '</div>' +
      '<div class="dg-d">D = ' + sInput(st, 'D', st.solved, st.solved) + '</div>' +
      '<div class="vd-grid">' + VERD.map(function(v) {
        var c = 'vd-btn' + (st.solved && v.k === it.kind ? ' right' : '') + (!st.solved && st.wrong === v.k ? ' wrong' : '');
        return '<button type="button" class="' + c + '" data-act="verdict" data-k="' + v.k + '"' + (st.solved ? ' disabled' : '') + '>' + icon(v) + '<span>' + L(v.lab) + '</span></button>';
      }).join('') + '</div>';
    if (st.solved) h += '<canvas class="iw-canvas dg-cv" style="margin-top:.8rem"></canvas>';
    h += '<div class="iw-fb"></div>';
    if (st.solved) h += '<div class="btn-row"><button type="button" class="next-btn" data-act="next">' + (st.i < 4 ? L({ es: 'Siguiente sucursal', en: 'Next branch' }) : L({ es: 'Terminar', en: 'Finish' })) + '</button></div>';
    host.innerHTML = h;
    showFb(host, st);
    if (st.solved) later(drawPlot);
  }

  function reading(it) {
    var calc = 'D = ' + nstr(it.b) + SQ + ' ' + MINUS + ' 4 · ' + par(it.a) + ' · ' + par(it.c) + ' = ' + nstr(it.b * it.b) + ' ' + MINUS + ' ' + nstr(4 * it.a * it.c) + ' = ' + nstr(it.D) + '. ';
    if (it.kind === 'two') return {
      es: calc + 'D es positivo: la utilidad cruza el cero dos veces, así que ' + it.city + ' tiene dos puntos de equilibrio y gana dinero entre ellos.',
      en: calc + 'D is positive: profit crosses zero twice, so ' + it.city + ' has two break-even points and earns money between them.' };
    if (it.kind === 'one') return {
      es: calc + 'D es cero: la utilidad toca el cero en un solo nivel de producción. ' + it.city + ' puede quedar en equilibrio, pero nunca gana dinero.',
      en: calc + 'D is zero: profit touches zero at a single production level. ' + it.city + ' can break even, but it never earns money.' };
    return {
      es: calc + 'D es negativo: no existe raíz cuadrada real, la ecuación no tiene solución y ' + it.city + ' pierde dinero en todos los niveles de producción.',
      en: calc + 'D is negative: there is no real square root, the equation has no solution, and ' + it.city + ' loses money at every production level.' };
  }
  function verdict(k) {
    var it = items[st.i], d = sVal(st, 'D'), rd = reading(it);
    if (isNaN(d)) { setFb(st, 'warm', 'Calcula primero D = b' + SQ + ' ' + MINUS + ' 4ac y anótalo.', 'First compute D = b' + SQ + ' ' + MINUS + ' 4ac and enter it.'); render(); return; }
    if (near(d, it.D) && k === it.kind) { st.solved = true; st.wrong = null; setFb(st, 'good', '✓ ' + rd.es, '✓ ' + rd.en); render(); return; }
    st.tries++; st.wrong = k;
    if (st.tries >= 3) { st.solved = true; st.wrong = null; sSet(st, 'D', it.D); setFb(st, 'warm', rd.es, rd.en); render(); return; }
    if (!near(d, it.D)) {
      if (near(d, it.b * it.b + 4 * it.a * it.c)) setFb(st, 'miss',
        'Revisa el valor de D. Aquí a y c son negativos, así que su producto es positivo y 4ac se resta de b' + SQ + '.',
        'Check the value of D. Here a and c are both negative, so their product is positive and 4ac is subtracted from b' + SQ + '.');
      else setFb(st, 'miss',
        'Revisa el valor de D antes del veredicto. Identifica a, b y c con sus signos, calcula b' + SQ + ' y 4ac por separado, y resta.',
        'Check the value of D before the verdict. Identify a, b and c with their signs, compute b' + SQ + ' and 4ac separately, and subtract.');
    } else {
      setFb(st, 'miss',
        'D = ' + nstr(it.D) + ' es correcto. Ahora lee su signo: D está bajo una raíz cuadrada. ¿Qué ocurre con las soluciones cuando D es positivo, cero o negativo?',
        'D = ' + nstr(it.D) + ' is correct. Now read its sign: D sits under a square root. What happens to the solutions when D is positive, zero or negative?');
    }
    render();
  }

  bindInputs(host, st, null);
  host.addEventListener('click', function(e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || !host.contains(b) || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (act === 'sgn') toggleSign(st, b, null);
    else if (act === 'verdict') verdict(b.getAttribute('data-k'));
    else if (act === 'next') {
      checkpoint(host.getAttribute('data-widget'), st.i, 'round');
      st.i++;
      if (st.i >= items.length) st.done = true;
      else { st.tries = 0; st.solved = false; st.fb = null; st.v = { D: '' }; st.s = { D: 1 }; st.wrong = null; }
      render();
    }
  });
  widgets.push(render); render();
}

/* ════════════════════════════════════════════════════════════════════════
   buildLesson(rng)  ·  QUADRATIC EQUATIONS  ·  Business Math
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  /*
   * CONCEPT ARC
   * topic        : Quadratic Equations
   * prerequisite : The student can solve linear equations and expand a product such as x(40 - 2x).

   *                   ax^2 + bx + c = 0 and its coefficients.

   *                   coefficients, D, solutions.
   *                4. The discriminant D = b^2 - 4ac as a diagnosis: two, one or no break-even points.
   * why_this_order: Each step removes a limit of the one before it: trial needs an equation (1),

   * time_budget (written before building; Part 0-T Step 1):

   * time_audit (Part 0-T Steps 2-3; constants unchanged, x1.2 on every C1/C2/S;
   *             R = measured words / 120 wpm, averaged over an 80-seed sweep):
   *   reading   1151w / 90 + 1 try-first (2m)                                   = 14.8m
   *   W revenue-rectangle   60s + [R15 2K 2C2 T] + [R15 3K T] + [R15 2K 2C2 T]
   *                         = 60 + 214 + 90 + 214                                =  9.6m
   *   W factor-builder      60s + 2 x [R7 C2 C1] + 1 x [R7 C1 C2 C1]
   *                         = 60 + 2x121 + 163                                   =  7.8m
   *   W formula-pipeline    60s + [R22 3C2] (coefficients given) + [R22 2K 3C2]
   *                         + [R30 2K 3C2 T] = 60 + 238 + 278 + 301              = 14.6m  (heavy x1)
   *   W breakeven-diagnosis 60s + 5 x [R5 C2 T] = 60 + 5x92                      =  8.7m
   *   widgets subtotal                                                           = 40.7m
   *   P1  concept   [R17 3K T]            =  92s     P6  gated  [R23 C2 C1 +40]    = 177s
   *   P2  concept   [R16 2K T]            =  71s     P7  gated  [R20 S C2 C1 +40]  = 282s
   *   P3  gated     [R19 C1 C2 +40]       = 173s     P8  concept [R21 3K T]        =  96s
   *   P4  errorhunt [R34 3K T]            = 109s     P9  gated  [R23 2C2 K +40]    = 227s
   *   P5  gated     [R21 2C2 +40]         = 205s     P10 concept [R15 3K T]        =  90s
   *   problems subtotal 1522s                                                    = 25.4m
   *   TOTAL 80.9m  (target 70-90, planned 75-85; heavy rounds 1/6; + ~5m slack)
   *   Blocks vs budget: reading 14.8 (12-18) · widgets 40.7 (35-45) · problems 25.4 (20-26).
   *   Corrections applied before this pass: pipeline round 1 gives a, b, c (lighten rounds);
   *   P10 kept conceptual rather than a second gated D computation (5 gated cards remain).
   */

  function addProb(spec) {
    var o = shuffleOpts(spec.opts.es, spec.opts.en, rng);
    problems.push({
      i18n: { title: spec.title, q: spec.q, hint: spec.hint, exp: spec.exp, opts: { es: o.es, en: o.en } },
      title: spec.title[LANG], questionText: spec.q[LANG], options: o[LANG].slice(), correctIdx: o.correctIdx,
      explanation: spec.exp[LANG], hint: spec.hint[LANG], showWork: spec.showWork, fn: '',
      studentChoice: null, pendingChoice: null
    });
    buildOneCard(problems[problems.length - 1], problems.length - 1);
  }
  function wxTag() { return '<div class="wx-tag">' + L({ es: 'Ejemplo resuelto', en: 'Worked example' }) + '</div>'; }
  var M1 = MINUS + '1';

  /* ══════════════════ CONCEPT 1 · where quadratics come from ══════════════════ */
  var c1 = (function() {
    var k = 2, m = pick([100, 125, 150], rng), N = 2 * k * m, xa = m - 50, xb = m - 25;
    return { k: k, m: m, N: N, xa: xa, xb: xb, ua: N - k * xa, ub: N - k * xb, Ra: xa * (N - k * xa), Rb: xb * (N - k * xb) };
  })();
  var dem1 = mx(c1.N + ' ' + MINUS + ' ' + c1.k + 'x');

  addSection(function() {
    return L({
      es: '<div class="stag">Concepto 1</div><h2>El ingreso es un producto: una meta, más de un precio</h2>' +
        '<p>Una gerente no fija el ingreso directamente. Fija un <strong>precio</strong>, y el mercado responde con una <strong>cantidad</strong>. El ingreso es el producto de ambos.</p>' +
        '<div class="callout"><p><strong>Ingreso = precio × unidades vendidas</strong></p></div>' +
        '<p>Los dos factores se mueven en sentidos opuestos: un precio más alto gana más por unidad y vende menos unidades. En economía esto se dibuja como un rectángulo bajo la recta de demanda. Su altura es el precio, su base es la cantidad vendida y su <strong>área es el ingreso</strong>.</p>' +
        '<div class="wx">' + wxTag() +
        '<p>Una papelería vende una agenda universitaria y estima una demanda semanal de ' + dem1 + ' agendas cuando el precio es de $x.</p>' +
        '<p>Con $' + c1.xa + ', la demanda es ' + mx(c1.N + ' ' + MINUS + ' ' + c1.k + ' · ' + c1.xa + ' = ' + c1.ua) + ' agendas y el ingreso es ' + mx(c1.xa + ' × ' + c1.ua + ' = ' + money(c1.Ra)) + '.</p>' +
        '<p>Con $' + c1.xb + ', la demanda baja a ' + c1.ub + ' agendas, pero el ingreso sube a ' + mx(c1.xb + ' × ' + c1.ub + ' = ' + money(c1.Rb)) + '. Menos ventas, más ingreso.</p></div>' +
        '<p>¿Subir el precio conviene siempre? Usa el rectángulo para averiguarlo.</p>',
      en: '<div class="stag">Concept 1</div><h2>Revenue is a product: one target, more than one price</h2>' +
        '<p>A manager does not set revenue directly. She sets a <strong>price</strong>, and the market answers with a <strong>quantity</strong>. Revenue is the product of the two.</p>' +
        '<div class="callout"><p><strong>Revenue = price × units sold</strong></p></div>' +
        '<p>The two factors move in opposite directions: a higher price earns more per unit and sells fewer units. Economists draw this as a rectangle under the demand line. Its height is the price, its base is the quantity sold, and its <strong>area is the revenue</strong>.</p>' +
        '<div class="wx">' + wxTag() +
        '<p>A stationery shop sells a student planner and estimates a weekly demand of ' + dem1 + ' planners when the price is $x.</p>' +
        '<p>At $' + c1.xa + ', demand is ' + mx(c1.N + ' ' + MINUS + ' ' + c1.k + ' · ' + c1.xa + ' = ' + c1.ua) + ' planners and revenue is ' + mx(c1.xa + ' × ' + c1.ua + ' = ' + money(c1.Ra)) + '.</p>' +
        '<p>At $' + c1.xb + ', demand falls to ' + c1.ub + ' planners, yet revenue rises to ' + mx(c1.xb + ' × ' + c1.ub + ' = ' + money(c1.Rb)) + '. Fewer sales, more revenue.</p></div>' +
        '<p>Does raising the price always pay off? Use the rectangle to find out.</p>'
    });
  });

  wRevenue(rng, widgetHost('revenue-rectangle'));

  addSection(function() {
    var eq0 = 'x(' + c1.N + ' ' + MINUS + ' ' + c1.k + 'x) = ' + c1.Rb;
    var eq1 = c1.N + 'x ' + MINUS + ' ' + c1.k + 'x' + SQ + ' = ' + c1.Rb;
    return L({
      es: '<div class="stag">Concepto 1 · La ecuación</div><h2>Forma estándar: convertir la búsqueda en una ecuación</h2>' +
        '<p>Con el rectángulo encontraste precios deslizando y comprobando productos. Para hallarlos sin prueba y error, la búsqueda debe escribirse como una ecuación.</p>' +
        '<p>La papelería vende ' + dem1 + ' agendas al precio de $x. Una meta de ingreso de ' + money(c1.Rb) + ' exige</p>' +
        '<div class="eq">' + eq0 + '</div>' +
        '<p>Al desarrollar el producto queda ' + mx(eq1) + '. La incógnita aparece ahora <strong>elevada al cuadrado</strong>, y ese término es lo que permitió que dos precios distintos produjeran el mismo ingreso. Una ecuación cuya mayor potencia de la incógnita es 2 es una <strong>ecuación cuadrática</strong>.</p>' +
        '<p>Todo método para resolverla parte de la <strong>forma estándar</strong>: todos los términos de un lado y cero del otro.</p>' +
        '<div class="callout"><p><strong>ax' + SQ + ' + bx + c = 0</strong>, con a ≠ 0. Aquí a es el coeficiente cuadrático, b el coeficiente lineal y c el término constante. Cada coeficiente lleva su propio signo.</p></div>' +
        '<div class="wx">' + wxTag() +
        '<p>Pasa todos los términos de ' + mx(eq1) + ' a un mismo lado: ' + mx(poly(-c1.k, c1.N, -c1.Rb) + ' = 0') + '.</p>' +
        '<p>Multiplicar ambos lados por ' + M1 + ' no cambia las soluciones y deja positivo el primer coeficiente: ' + mx(poly(c1.k, -c1.N, c1.Rb) + ' = 0') + '.</p>' +
        '<p>Entonces a = ' + c1.k + ', b = ' + nstr(-c1.N) + ' y c = ' + c1.Rb + '.</p></div>',
      en: '<div class="stag">Concept 1 · The equation</div><h2>Standard form: turning the search into an equation</h2>' +
        '<p>With the rectangle you found prices by sliding and checking products. To find them without trial and error, the search has to be written as an equation.</p>' +
        '<p>The stationery shop sells ' + dem1 + ' planners at a price of $x. A revenue target of ' + money(c1.Rb) + ' requires</p>' +
        '<div class="eq">' + eq0 + '</div>' +
        '<p>Expanding the product gives ' + mx(eq1) + '. The unknown now appears <strong>squared</strong>, and that term is what allowed two different prices to produce the same revenue. An equation whose highest power of the unknown is 2 is a <strong>quadratic equation</strong>.</p>' +
        '<p>Every method for solving one starts from the <strong>standard form</strong>: all terms on one side and zero on the other.</p>' +
        '<div class="callout"><p><strong>ax' + SQ + ' + bx + c = 0</strong>, with a ≠ 0. Here a is the quadratic coefficient, b the linear coefficient and c the constant term. Each coefficient carries its own sign.</p></div>' +
        '<div class="wx">' + wxTag() +
        '<p>Move every term of ' + mx(eq1) + ' to the same side: ' + mx(poly(-c1.k, c1.N, -c1.Rb) + ' = 0') + '.</p>' +
        '<p>Multiplying both sides by ' + M1 + ' leaves the solutions unchanged and makes the leading coefficient positive: ' + mx(poly(c1.k, -c1.N, c1.Rb) + ' = 0') + '.</p>' +
        '<p>So a = ' + c1.k + ', b = ' + nstr(-c1.N) + ' and c = ' + c1.Rb + '.</p></div>'
    });
  });

  /* ── P1 · model a story in standard form (conceptual, no work area) ── */
  (function() {
    var S = pick([
      { es: 'Un autolavado en Colima vende', en: 'A car wash in Colima sells', ues: 'lavados', uen: 'washes' },
      { es: 'Un cine independiente vende', en: 'An independent cinema sells', ues: 'boletos', uen: 'tickets' },
      { es: 'Una pastelería vende', en: 'A pastry shop sells', ues: 'pasteles', uen: 'cakes' }
    ], rng);
    var k = pick([2, 3, 5], rng), x1 = 10 * rint(rng, 4, 9), x2 = 10 * rint(rng, 11, 18), N = k * (x1 + x2), T = k * x1 * x2;
    var dm = mx(N + ' ' + MINUS + ' ' + k + 'x');
    var o = [poly(k, -N, T) + ' = 0', poly(k, N, -T) + ' = 0', poly(1, -N, T) + ' = 0', poly(k, -N, -T) + ' = 0'];
    addProb({
      title: { es: 'De la historia a la forma estándar', en: 'From the story to standard form' },
      q: { es: S.es + ' ' + dm + ' ' + S.ues + ' al mes cuando el precio es de $x. La dirección quiere un ingreso mensual de exactamente ' + money(T) + '. ¿Qué ecuación, en forma estándar, debe cumplir el precio x?',
           en: S.en + ' ' + dm + ' ' + S.uen + ' per month when the price is $x. Management wants a monthly revenue of exactly ' + money(T) + '. Which equation, in standard form, must the price x satisfy?' },
      hint: { es: 'El ingreso es precio por unidades vendidas. Escribe ese producto, iguálalo a la meta, desarróllalo y pasa todos los términos al mismo lado.',
              en: 'Revenue is price times units sold. Write that product, set it equal to the target, expand it, and move every term to the same side.' },
      exp: { es: 'Ingreso = x(' + N + ' ' + MINUS + ' ' + k + 'x) = ' + T + '. Al desarrollar: ' + N + 'x ' + MINUS + ' ' + k + 'x' + SQ + ' = ' + T + '. Al pasar todo a un lado: ' + o[0] + '.',
             en: 'Revenue = x(' + N + ' ' + MINUS + ' ' + k + 'x) = ' + T + '. Expanding: ' + N + 'x ' + MINUS + ' ' + k + 'x' + SQ + ' = ' + T + '. Moving every term to one side: ' + o[0] + '.' },
      opts: { es: o, en: o }, showWork: false
    });
  })();

  /* ── P2 · read a, b, c after rearranging (structural variants) ── */
  (function() {
    /* four structural variants; the correct sign pattern varies so the key is not systematically the longest option */
    var p = pick([2, 3, 4, 5], rng), q = rint(rng, 3, 11), r = rint(rng, 4, 20), v = Math.floor(rng() * 4), eq, bs, cs, why;
    if (v === 0)      { eq = p + 'x' + SQ + ' = ' + poly(0, q, r);                        bs = -1; cs = -1; }
    else if (v === 1) { eq = poly(p, 0, r) + ' = ' + q + 'x';                             bs = -1; cs = 1; }
    else if (v === 2) { eq = poly(p, q, 0) + ' = ' + r;                                   bs = 1;  cs = -1; }
    else              { eq = r + ' = x(' + q + ' ' + MINUS + ' ' + p + 'x)';              bs = -1; cs = 1; }
    function opt(sb, sc) { return 'a = ' + p + ', b = ' + nstr(sb * q) + ', c = ' + nstr(sc * r); }
    var o = [opt(bs, cs), opt(-bs, -cs), opt(bs, -cs), opt(-bs, cs)];
    why = poly(p, bs * q, cs * r) + ' = 0';
    addProb({
      title: { es: 'Lectura de los coeficientes', en: 'Reading the coefficients' },
      q: { es: 'Al analizar costos, una analista llega a la condición ' + mx(eq) + '. Escrita en forma estándar ax' + SQ + ' + bx + c = 0 con a positivo, ¿qué coeficientes resultan?',
           en: 'While analyzing costs, an analyst arrives at the condition ' + mx(eq) + '. Written in standard form ax' + SQ + ' + bx + c = 0 with a positive, which coefficients result?' },
      hint: { es: 'La forma estándar exige que el cero quede solo en un lado. Un término cambia de signo al pasar al otro lado de la igualdad.',
              en: 'Standard form needs zero alone on one side. A term changes sign when it moves across the equals sign.' },
      exp: { es: 'Con todos los términos del lado izquierdo: ' + why + '. Cada coeficiente incluye su signo: ' + o[0] + '.',
             en: 'With every term on the left side: ' + why + '. Each coefficient includes its sign: ' + o[0] + '.' },
      opts: { es: o, en: o }, showWork: false
    });
  })();

  /* ══════════════════ CONCEPT 2 · factoring ══════════════════ */
  var c2 = (function() {
    var r = rint(rng, 2, 4), s = rint(rng, r + 2, 9), mid = Math.floor((r + s) / 2), g = pick([2, 3], rng);
    return { r: r, s: s, B: r + s, C: r * s, mid: mid, Pm: -mid * mid + (r + s) * mid - r * s, g: g };
  })();

  addSection(function() {
    var P = mx('P = ' + poly(-1, c2.B, -c2.C));
    return L({
      es: '<div class="stag">Concepto 2</div><h2>Factorización: un producto igual a cero</h2>' +
        '<p>La forma estándar deja el cero en un lado por una razón. El cero es el único número que revela algo sobre los factores de un producto.</p>' +
        '<div class="callout"><p><strong>Propiedad del producto cero.</strong> Si A · B = 0, entonces A = 0 o B = 0.</p></div>' +
        '<p>Ningún otro número se comporta así: si A · B = 12, los factores podrían ser 3 y 4, 2 y 6, o infinitos pares más. Por eso, cuando el lado izquierdo de una ecuación cuadrática en forma estándar puede escribirse como un producto, la ecuación se separa en dos ecuaciones lineales.</p>' +
        '<p>Cuando a = 1 el producto se encuentra por inspección, porque ' + mx('(x + m)(x + n) = x' + SQ + ' + (m + n)x + mn') + '. Factorizar ' + mx('x' + SQ + ' + bx + c') + ' significa hallar dos números m y n tales que</p>' +
        '<div class="eq">m · n = c &nbsp; y &nbsp; m + n = b</div>' +
        '<p>El uso clásico en negocios es el <strong>punto de equilibrio</strong>: el nivel de producción en el que la utilidad es exactamente cero.</p>' +
        '<div class="wx">' + wxTag() +
        '<p>Un taller que produce x cientos de unidades al mes tiene una utilidad, en miles de pesos, de ' + P + '.</p>' +
        '<p>El equilibrio exige P = 0. Al multiplicar por ' + M1 + ': ' + mx(poly(1, -c2.B, c2.C) + ' = 0') + '.</p>' +
        '<p>Dos números con producto ' + c2.C + ' y suma ' + nstr(-c2.B) + ': ' + nstr(-c2.r) + ' y ' + nstr(-c2.s) + '. Entonces ' + mx('(x ' + MINUS + ' ' + c2.r + ')(x ' + MINUS + ' ' + c2.s + ') = 0') + ', así que x = ' + c2.r + ' o x = ' + c2.s + '.</p>' +
        '<p>El taller está en equilibrio con ' + thou(c2.r * 100) + ' y con ' + thou(c2.s * 100) + ' unidades. Entre esos niveles la utilidad es positiva (con x = ' + c2.mid + ', P = ' + c2.Pm + '); fuera de ellos, el taller pierde dinero.</p></div>' +
        '<p>Si los tres coeficientes comparten un factor común, divide primero entre él: ' + mx(poly(c2.g, -c2.g * c2.B, c2.g * c2.C) + ' = 0') + ' se convierte en ' + mx(poly(1, -c2.B, c2.C) + ' = 0') + '.</p>',
      en: '<div class="stag">Concept 2</div><h2>Factoring: a product equal to zero</h2>' +
        '<p>Standard form puts zero on one side for a reason. Zero is the only number that reveals something about the factors of a product.</p>' +
        '<div class="callout"><p><strong>Zero-product property.</strong> If A · B = 0, then A = 0 or B = 0.</p></div>' +
        '<p>No other number behaves this way: if A · B = 12, the factors could be 3 and 4, 2 and 6, or infinitely many other pairs. So when the left side of a quadratic equation in standard form can be written as a product, the equation splits into two linear equations.</p>' +
        '<p>When a = 1 the product is found by inspection, because ' + mx('(x + m)(x + n) = x' + SQ + ' + (m + n)x + mn') + '. Factoring ' + mx('x' + SQ + ' + bx + c') + ' means finding two numbers m and n such that</p>' +
        '<div class="eq">m · n = c &nbsp; and &nbsp; m + n = b</div>' +
        '<p>The classic business use is the <strong>break-even point</strong>: the production level at which profit is exactly zero.</p>' +
        '<div class="wx">' + wxTag() +
