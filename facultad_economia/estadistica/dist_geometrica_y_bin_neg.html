<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución Geométrica y Binomial Negativa · Estadística · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/estadistica/est_geometric.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Distribución Geométrica y Binomial Negativa</div>
    <div class="wcourse" id="wcourse-el">Estadística</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Distribución Geométrica y Binomial Negativa</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Descargar resultados en PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzIje7cRD7iI77G2-t6LMJEHtvjnwrFOJXsbbLe_4phhI7h9AhjL2HoIil1C-IoEn8T/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',

/* ════════════════════════════════════════════════════════════════════════
   ATTEMPT COUNTER + SEEDED RNG
   ════════════════════════════════════════════════════════════════════════ */
function getAttemptKey(name, group) {
  return 'fac_econ_est__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

/* ════════════════════════════════════════════════════════════════════════
   NUMBER + WAITING TIME HELPERS
   ════════════════════════════════════════════════════════════════════════ */
function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v) { return '$' + nf(Math.round(v)); }
function pr(x)    { return x.toFixed(4); }
function dec2(x)  { return x.toFixed(2); }
/* Percentage with one decimal, identical in both languages. */
function pct1(x)  { return (Math.round(x * 1000) / 10).toFixed(1); }

/* Number of ways to choose k items out of n, built multiplicatively. */
function comb(n, k) {
  if (k < 0 || k > n) return 0;
  var r = 1;
  for (var i = 1; i <= k; i++) r = r * (n - k + i) / i;
  return Math.round(r);
}
/* ── GEOMETRIC · X counts the trial on which the first success lands ── */
function geomP(k, p)  { return (k < 1) ? 0 : p * Math.pow(1 - p, k - 1); }
function geomLe(k, p) { return (k < 1) ? 0 : 1 - Math.pow(1 - p, k); }
function geomGt(k, p) { return (k < 0) ? 1 : Math.pow(1 - p, k); }
function geomGe(k, p) { return (k <= 1) ? 1 : Math.pow(1 - p, k - 1); }
function gMean(p) { return 1 / p; }
function gVar(p)  { return (1 - p) / (p * p); }
function gSd(p)   { return Math.sqrt(1 - p) / p; }
/* ── NEGATIVE BINOMIAL · X counts the trial on which the r-th success lands ── */
function nbP(k, r, p) {
  if (k < r) return 0;
  return comb(k - 1, r - 1) * Math.pow(p, r) * Math.pow(1 - p, k - r);
}
function nbLe(k, r, p) {
  var s = 0;
  for (var i = r; i <= k; i++) s += nbP(i, r, p);
  return Math.min(1, s);
}
function nbMean(r, p) { return r / p; }
function nbVar(r, p)  { return r * (1 - p) / (p * p); }
function nbSd(r, p)   { return Math.sqrt(r * (1 - p)) / p; }

/* Four distinct probability strings; the key is always the first value fed in. */
function probOpts(correct, wrongs, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (v <= 0.00005 || v >= 0.99995) return;
    var s = pr(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) add(correct + j * 0.0011 * (j % 2 ? 1 : -1));
  return shuffleOpts(vals, vals, rng);
}
/* Same idea for peso amounts. */
function moneyOpts(correct, wrongs, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v) || v <= 0) return;
    var s = money(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) add(correct * (1 + j * 0.07 * (j % 2 ? 1 : -1)));
  return shuffleOpts(vals, vals, rng);
}
/* Four distinct counts of trials, one decimal, aligned across languages. */
function countOpts(correct, wrongs, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v) || v <= 0) return;
    var s = dec2(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) add(correct * (1 + j * 0.09 * (j % 2 ? 1 : -1)));
  return shuffleOpts(vals, vals, rng);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS
   ════════════════════════════════════════════════════════════════════════ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;

  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {

    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');

}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
/* Draws a bar chart of vals, where vals[0] belongs to the trial number k0.
   cls(k) returns 0 plain, 1 inside the selected region, 2 the focal bar.
   opts may carry a mean line (mu, muLabel) and a shaded band. */
function drawBars(g, vals, k0, cls, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 24, padR = 10, padT = 14, padB = 20;
  var i, n = vals.length, maxV = 0;
  for (i = 0; i < n; i++) maxV = Math.max(maxV, vals[i]);
  if (maxV <= 0) maxV = 1;
  var bw = (W - padL - padR) / n;
  var plotH = H - padT - padB;
  function xOf(v) { return padL + (v - k0 + 0.5) * bw; }
  opts = opts || {};
  if (opts.band) {
    var bx1 = xOf(Math.max(k0 - 0.5, opts.band[0]));
    var bx2 = xOf(Math.min(k0 + n - 0.5, opts.band[1]));
    ctx.fillStyle = P.tint;
    ctx.fillRect(bx1, padT, Math.max(2, bx2 - bx1), plotH);
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL - 4, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  for (i = 0; i < n; i++) {
    var h = vals[i] / maxV * plotH;
    var c = cls ? cls(k0 + i) : 0;
    ctx.fillStyle = c === 2 ? P.gold : c === 1 ? P.green : P.border;
    ctx.fillRect(xOf(k0 + i) - bw * 0.38, H - padB - h, Math.max(1.5, bw * 0.76), h);
  }
  if (opts.mu !== undefined && opts.mu !== null && opts.mu >= k0 && opts.mu <= k0 + n) {
    ctx.save();
    ctx.strokeStyle = P.dark; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(xOf(opts.mu), padT - 6); ctx.lineTo(xOf(opts.mu), H - padB); ctx.stroke();
    ctx.restore();
    if (opts.muLabel) {
      ctx.fillStyle = P.dark; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var lw = ctx.measureText(opts.muLabel).width;
      ctx.fillText(opts.muLabel, Math.min(Math.max(2, xOf(opts.mu) - lw / 2), W - lw - 2), 10);
    }
  }
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  var step = Math.ceil(n / 12);
  for (i = 0; i < n; i += step) {
    var lab = String(k0 + i), tw = ctx.measureText(lab).width;
    ctx.fillText(lab, xOf(k0 + i) - tw / 2, H - padB + 12);
  }
}
/* How many trials are worth plotting so the tail is visible but not empty. */
function geomRange(p) { return Math.max(10, Math.min(40, Math.ceil(3.2 / p))); }

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · which trial does the first success land on
   ════════════════════════════════════════════════════════════════════════ */
function widgetFirstSuccess(p0, k0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { p: Math.round(p0 * 100), k: k0 };
  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="primer-exito">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'En qué intento cae el primer cierre' : 'Which attempt the first close lands on') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Un ejecutivo llama a un prospecto tras otro y se detiene en cuanto cierra la primera venta. Mueve la tasa de cierre por llamada y el intento que te interesa. La barra dorada es la probabilidad de que la venta caiga justo en ese intento, y la línea punteada marca el número promedio de llamadas.'
          : 'A rep calls one prospect after another and stops as soon as the first sale closes. Move the close rate per call and the attempt you care about. The gold bar is the probability that the sale lands exactly on that attempt, and the dashed line marks the average number of calls.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Tasa de cierre por llamada' : 'Close rate per call') + ': <span class="cval" id="w1pl"></span></label>' +
          '<input type="range" min="5" max="60" step="5" id="w1p" value="' + state.p + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Intento que interesa' : 'Attempt of interest') + ': <span class="cval" id="w1kl"></span></label>' +
          '<input type="range" min="1" max="20" step="1" id="w1k" value="' + state.k + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w1cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Justo en ese intento' : 'Exactly on that attempt') + '</div><div class="mnum ps" id="w1eq"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Fracasos previos' : 'Prior failures') + '</div><div class="mnum ts" id="w1q"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Llamadas promedio' : 'Average calls') + '</div><div class="mnum cs" id="w1mu"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w1read"></div>' +
      '</div>';
    host.querySelector('#w1p').addEventListener('input', function() { state.p = parseInt(this.value, 10); update(); });
    host.querySelector('#w1k').addEventListener('input', function() { state.k = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var p = state.p / 100, k = state.k, q = 1 - p;
    var eq = geomP(k, p), tail = Math.pow(q, k - 1), mu = gMean(p);
    host.querySelector('#w1pl').textContent = dec2(p);
    host.querySelector('#w1kl').textContent = String(k);
    host.querySelector('#w1eq').textContent = pr(eq);
    host.querySelector('#w1q').textContent  = pr(tail);
    host.querySelector('#w1mu').textContent = dec2(mu);
    host.querySelector('#w1read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> para que la primera venta caiga en la llamada ' + k + ' tienen que fallar las ' + (k - 1) + ' anteriores, y eso ocurre con probabilidad ' + pr(tail) + '. Al multiplicar por la tasa de cierre queda ' + pr(eq) + ', es decir cerca del ' + pct1(eq) + ' por ciento de las jornadas. Observa que la barra más alta siempre es la del primer intento: aunque el promedio sea ' + dec2(mu) + ' llamadas, el resultado individual más frecuente es cerrar de inmediato.'
      : '<strong>Business reading:</strong> for the first sale to land on call ' + k + ' the previous ' + (k - 1) + ' must fail, and that happens with probability ' + pr(tail) + '. Multiplying by the close rate leaves ' + pr(eq) + ', that is about ' + pct1(eq) + ' percent of working days. Notice that the tallest bar is always the first attempt: even though the average is ' + dec2(mu) + ' calls, the most frequent single outcome is closing right away.';
    var top = Math.max(geomRange(p), k + 2);
    var vals = [], i;
    for (i = 1; i <= top; i++) vals.push(geomP(i, p));
    var g = fitCanvas(host.querySelector('#w1cv'), 155);
    drawBars(g, vals, 1, function(j) { return j === k ? 2 : 0; },
      { mu: mu, muLabel: (es ? 'Promedio ' : 'Average ') + dec2(mu) });
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · cumulative questions and the memoryless property
   ════════════════════════════════════════════════════════════════════════ */
function widgetCumulative(p0, k0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { mode: 'le', k: k0, s: 0, p: Math.round(p0 * 100) };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'eq', es: 'Justo en k',   en: 'Exactly at k' },
      { id: 'le', es: 'A lo más k',   en: 'At most k' },
      { id: 'gt', es: 'Más de k',     en: 'More than k' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.mode ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="acumulada-geometrica">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Acumular intentos y probar la falta de memoria' : 'Accumulating attempts and testing the memoryless property') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Un gestor de cobranza marca a un deudor hasta obtener la primera promesa de pago. Cambia el tipo de pregunta y el valor de k para ver qué barras se suman. Después mueve el segundo control: son los intentos que ya fallaron, y sirve para comprobar que el modelo no guarda memoria de ellos.'
          : 'A collections agent dials a debtor until getting the first promise to pay. Change the type of question and the value of k to see which bars are added. Then move the second control: those are the attempts that already failed, and it lets you check that the model keeps no memory of them.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Valor de k' : 'Value of k') + ': <span class="cval" id="w2kl"></span></label>' +
          '<input type="range" min="1" max="16" step="1" id="w2k" value="' + state.k + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Intentos ya fallidos' : 'Attempts already failed') + ': <span class="cval" id="w2sl"></span></label>' +
          '<input type="range" min="0" max="10" step="1" id="w2s" value="' + state.s + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Probabilidad de promesa por llamada' : 'Promise probability per call') + ': <span class="cval" id="w2pl"></span></label>' +
          '<input type="range" min="5" max="60" step="5" id="w2p" value="' + state.p + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Barras verdes' : 'Green bars') + '</label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Son las que entran en la suma' : 'Those are the ones entering the sum') + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w2cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Justo en k' : 'Exactly at k') + '</div><div class="mnum ts" id="w2eq"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'A lo más k' : 'At most k') + '</div><div class="mnum cs" id="w2le"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Más de k' : 'More than k') + '</div><div class="mnum ps" id="w2gt"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Condicional tras los fallos' : 'Conditional after the failures') + '</div><div class="mnum cs" id="w2cond"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Sin condicionar' : 'Unconditional') + '</div><div class="mnum cs" id="w2plain"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia' : 'Difference') + '</div><div class="mnum ts" id="w2diff"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w2read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.mode = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#w2k').addEventListener('input', function() { state.k = parseInt(this.value, 10); update(); });
    host.querySelector('#w2s').addEventListener('input', function() { state.s = parseInt(this.value, 10); update(); });
    host.querySelector('#w2p').addEventListener('input', function() { state.p = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var p = state.p / 100, k = state.k, s = state.s;
    var eq = geomP(k, p), le = geomLe(k, p), gt = geomGt(k, p);
    var cond = geomGt(s + k, p) / geomGt(s, p);
    host.querySelector('#w2kl').textContent = String(k);
    host.querySelector('#w2sl').textContent = String(s);
    host.querySelector('#w2pl').textContent = dec2(p);
    host.querySelector('#w2eq').textContent = pr(eq);
    host.querySelector('#w2le').textContent = pr(le);
    host.querySelector('#w2gt').textContent = pr(gt);
    host.querySelector('#w2cond').textContent  = pr(cond);
    host.querySelector('#w2plain').textContent = pr(gt);
    host.querySelector('#w2diff').textContent  = pr(Math.abs(cond - gt));
    var msg;
    if (state.mode === 'eq') {
      msg = es
        ? 'Solo se suma una barra: la probabilidad de que la primera promesa de pago llegue justo en la llamada ' + k + ' es ' + pr(eq) + '.'
        : 'Only one bar is added: the probability that the first promise to pay arrives exactly on call ' + k + ' is ' + pr(eq) + '.';
    } else if (state.mode === 'le') {
      msg = es
        ? 'Se suman las barras desde la primera llamada hasta la ' + k + '. La probabilidad de resolver la cuenta dentro de las primeras ' + k + ' llamadas es ' + pr(le) + ', y esa es la cifra con la que el gestor decide cuántos intentos autorizar antes de escalar el caso.'
        : 'The bars from the first call up to call ' + k + ' are added. The probability of resolving the account within the first ' + k + ' calls is ' + pr(le) + ', and that is the figure the agent uses to decide how many attempts to authorise before escalating the case.';
    } else {
      msg = es
        ? 'Se suman todas las barras posteriores a la llamada ' + k + '. Sale mucho más corto notar que eso equivale a que las primeras ' + k + ' llamadas fallen todas, lo que da ' + pr(gt) + '.'
        : 'Every bar after call ' + k + ' is added. It is far shorter to notice that this is the same as all the first ' + k + ' calls failing, which gives ' + pr(gt) + '.';
    }

      : ' With ' + s + ' attempts already failed, the probability of needing more than ' + k + ' further calls is still ' + pr(cond) + ', identical to that of a freshly assigned debtor. Past effort does not bring the result closer, which is why a collections policy cannot be justified by saying the account is due to fall.';
    host.querySelector('#w2read').innerHTML = (es ? '<strong>Lectura de negocio:</strong> ' : '<strong>Business reading:</strong> ') + msg + memo;
    var top = Math.max(geomRange(p), k + 3);
    var vals = [], i;
    for (i = 1; i <= top; i++) vals.push(geomP(i, p));
    var g = fitCanvas(host.querySelector('#w2cv'), 155);
    drawBars(g, vals, 1, function(j) {
      if (j === k) return 2;
      if (state.mode === 'le' && j < k) return 1;
      if (state.mode === 'gt' && j > k) return 1;
      return 0;
    }, {});
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════

  var state = { p: Math.round(p0 * 100), c: cost0 };
  function mount() {

          : 'Every visit to a potential client carries a direct cost. Move the success rate per visit and the unit cost and watch two things at once: how the average number of visits shoots up when the rate drops, and how the green one standard deviation band widens even faster than the average.') + '</div>' +

      : '<strong>Business reading:</strong> with a rate of ' + dec2(p) + ' it takes on average ' + dec2(mu) + ' visits per close, which represents ' + money(mu * c) + ' of selling cost. The standard deviation of ' + dec2(sd) + ' visits is almost as large as the average, so budgeting only ' + money(mu * c) + ' per client won leaves the unit with no room: a client landing in the high band costs ' + money(hi * c) + '. It is also worth noting that the probability of closing on the first visit is ' + pr(geomP(1, p)) + ' and the probability of closing within three visits is ' + pr(geomLe(3, p)) + '.';
    var top = Math.max(geomRange(p), Math.ceil(hi) + 2);
    var vals = [], i;
    for (i = 1; i <= top; i++) vals.push(geomP(i, p));
    var g = fitCanvas(host.querySelector('#w3cv'), 155);

      { mu: mu, band: [lo, hi], muLabel: (es ? 'Promedio ' : 'Average ') + dec2(mu) });
  }
  widgets.push(mount);
  mount();

function widgetNegBinomial(r0, p0, k0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { r: r0, p: Math.round(p0 * 100), k: k0 };

    host.innerHTML =
      '<div class="gcrd" data-widget="binomial-negativa">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Esperar hasta el contrato número r' : 'Waiting for contract number r') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una firma consultora presenta propuestas hasta reunir los contratos que necesita para cubrir el trimestre. Mueve cuántos contratos hacen falta, la tasa de aceptación por propuesta y la propuesta que te interesa. Con el primer control en uno vuelves al caso geométrico: compara esa forma con la que aparece al pedir tres o cuatro contratos.'
          : 'A consulting firm submits proposals until it gathers the contracts it needs to cover the quarter. Move how many contracts are required, the acceptance rate per proposal and the proposal you care about. With the first control at one you are back in the geometric case: compare that shape with the one that appears when three or four contracts are required.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +

          '<label>' + (es ? 'Tasa de aceptación' : 'Acceptance rate') + ': <span class="cval" id="w4pl"></span></label>' +

        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Propuesta que interesa' : 'Proposal of interest') + ': <span class="cval" id="w4kl"></span></label>' +

        '</div><div class="cg">' +
          '<label>' + (es ? 'Barra dorada' : 'Gold bar') + '</label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Es la propuesta en la que cae el último contrato' : 'It is the proposal where the last contract lands') + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w4cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Acomodos previos' : 'Prior arrangements') + '</div><div class="mnum ts" id="w4c"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Justo en esa propuesta' : 'Exactly on that proposal') + '</div><div class="mnum ps" id="w4eq"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Dentro de esa propuesta' : 'Within that proposal') + '</div><div class="mnum cs" id="w4le"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Propuestas promedio' : 'Average proposals') + '</div><div class="mnum cs" id="w4mu"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Desviación estándar' : 'Standard deviation') + '</div><div class="mnum ts" id="w4sd"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo en propuestas' : 'Cost in proposals') + '</div><div class="mnum ps" id="w4extra"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w4read"></div>' +
      '</div>';
    var sr = host.querySelector('#w4r'), sk = host.querySelector('#w4k');
    sr.addEventListener('input', function() {
      state.r = parseInt(this.value, 10);
      if (state.k < state.r) { state.k = state.r; sk.value = state.k; }
      update();
    });
    host.querySelector('#w4p').addEventListener('input', function() { state.p = parseInt(this.value, 10); update(); });
    sk.addEventListener('input', function() {
      state.k = Math.max(state.r, parseInt(this.value, 10));
      update();
    });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var r = state.r, p = state.p / 100, k = Math.max(state.r, state.k);
    var c = comb(k - 1, r - 1);
    var eq = nbP(k, r, p), le = nbLe(k, r, p);
    var mu = nbMean(r, p), sd = nbSd(r, p);
    host.querySelector('#w4rl').textContent    = String(r);
    host.querySelector('#w4pl').textContent    = dec2(p);
    host.querySelector('#w4kl').textContent    = String(k);
    host.querySelector('#w4c').textContent     = nf(c);
    host.querySelector('#w4eq').textContent    = pr(eq);
    host.querySelector('#w4le').textContent    = pr(le);
    host.querySelector('#w4mu').textContent    = dec2(mu);
    host.querySelector('#w4sd').textContent    = dec2(sd);
    host.querySelector('#w4extra').textContent = dec2(mu - r);
    host.querySelector('#w4read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> para que el contrato número ' + r + ' se firme justo en la propuesta ' + k + ', los primeros ' + (r - 1) + ' contratos deben repartirse entre las ' + (k - 1) + ' propuestas anteriores, y eso admite ' + nf(c) + ' acomodos. La probabilidad resultante es ' + pr(eq) + ', mientras que la de haber reunido los ' + r + ' contratos a más tardar en esa propuesta es ' + pr(le) + '. En promedio la firma presenta ' + dec2(mu) + ' propuestas, de las cuales ' + dec2(mu - r) + ' terminan rechazadas: ese es el costo comercial de llegar a la meta.'
      : '<strong>Business reading:</strong> for contract number ' + r + ' to be signed exactly on proposal ' + k + ', the first ' + (r - 1) + ' contracts must be spread across the previous ' + (k - 1) + ' proposals, and that allows ' + nf(c) + ' arrangements. The resulting probability is ' + pr(eq) + ', while the probability of having gathered all ' + r + ' contracts by that proposal at the latest is ' + pr(le) + '. On average the firm submits ' + dec2(mu) + ' proposals, of which ' + dec2(mu - r) + ' end up rejected: that is the selling cost of reaching the target.';
    var top = Math.max(k + 3, Math.ceil(mu + 2 * sd) + 2);
    if (top > r + 45) top = r + 45;
    var vals = [], i;
    for (i = r; i <= top; i++) vals.push(nbP(i, r, p));
    var g = fitCanvas(host.querySelector('#w4cv'), 155);
    drawBars(g, vals, r, function(j) { return j === k ? 2 : (j < k ? 1 : 0); },
      { mu: mu, muLabel: (es ? 'Promedio ' : 'Average ') + dec2(mu) });
  }
  widgets.push(mount);
  mount();
}

      '<div class="stag">Concepto 1</div>' +
      '<h2>Cuando el conteo se detiene en el primer éxito</h2>' +
      '<p>Hay una familia de preguntas de negocio que la distribución binomial no puede responder, y no porque el cálculo sea más difícil sino porque la pregunta tiene otra forma. La binomial fija el número de intentos y deja libre el número de éxitos: de cien llamadas, cuántas cierran. En la operación diaria ocurre lo contrario con mucha frecuencia. El gerente fija el número de éxitos y lo que queda libre es el número de intentos: cuántas llamadas hacen falta hasta cerrar la primera venta, cuántas facturas hay que revisar hasta encontrar el primer error, cuántos candidatos hay que entrevistar hasta contratar al primero.</p>' +
      '<p>Ese segundo tipo de conteo se llama tiempo de espera, y el modelo que lo describe es la <strong>distribución geométrica</strong>. La variable X cuenta el número de ensayos realizados hasta obtener el primer éxito, incluyendo el ensayo en el que el éxito ocurre. A diferencia de la binomial, X no tiene un valor máximo: en principio el conteo puede seguir indefinidamente, aunque la probabilidad de valores muy grandes se vuelve minúscula.</p>' +
      '<p>Las condiciones que se exigen son las mismas que en la binomial salvo la primera. Cada ensayo debe tener dos resultados, la probabilidad de éxito p debe mantenerse constante y los ensayos deben ser independientes. Lo que cambia es que el número de ensayos ya no se decide antes de empezar: lo decide el propio experimento cuando aparece el primer éxito.</p>' +
      '<p>Armar la fórmula es directo. Para que el primer éxito caiga exactamente en el ensayo k tienen que ocurrir dos cosas en ese orden: que los primeros k − 1 ensayos fallen y que el ensayo k salga bien. Como los ensayos son independientes, las probabilidades se multiplican y no hay coeficiente que agregar, porque solo existe una secuencia posible.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Variable</div><div class="rform">X = ensayo del primer éxito</div><div class="rnote">Se cuenta el ensayo exitoso, no solo los fallidos.</div></div>' +
        '<div class="rcard"><div class="rname">Función de probabilidad</div><div class="rform">P(X = k) = q<sup>k − 1</sup> p</div><div class="rnote">k − 1 fracasos seguidos y luego el éxito.</div></div>' +
        '<div class="rcard"><div class="rname">Complemento</div><div class="rform">q = 1 − p</div><div class="rnote">Probabilidad de fracaso en un solo ensayo.</div></div>' +
        '<div class="rcard"><div class="rname">Recorrido</div><div class="rform">k = 1, 2, 3, ...</div><div class="rnote">Sin tope superior, a diferencia de la binomial.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Un ejecutivo de cuenta de una arrendadora llama a empresas de una lista muy amplia para colocar un contrato de arrendamiento puro. Cada llamada termina en contrato con probabilidad ' + dec2(p1) + ', de forma independiente, y el ejecutivo se detiene en cuanto coloca el primero. La dirección pregunta qué tan probable es que el primer contrato caiga justo en la llamada ' + k1 + '.</p>' +

      '<strong>Paso 2.</strong> Para que el primer contrato caiga en la llamada ' + k1 + ', las primeras ' + (k1 - 1) + ' llamadas deben fallar, y eso ocurre con probabilidad ' + dec2(q1) + '<sup>' + (k1 - 1) + '</sup> = ' + pr(Math.pow(q1, k1 - 1)) + '.<br>' +
      '<strong>Paso 3.</strong> La llamada ' + k1 + ' debe salir bien, lo que aporta el factor ' + dec2(p1) + '.<br>' +

      '<strong>Lectura de negocio.</strong> En cerca del ' + pct1(res) + ' por ciento de las jornadas el primer contrato llegará precisamente en la llamada ' + k1 + '. Conviene notar que este no es el escenario más probable: el valor más frecuente de X siempre es 1, porque cada llamada adicional exige que todas las anteriores hayan fallado.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>When the count stops at the first success</h2>' +
      '<p>There is a family of business questions the binomial distribution cannot answer, and not because the arithmetic is harder but because the question has a different shape. The binomial fixes the number of trials and leaves the number of successes free: out of one hundred calls, how many close. In daily operations the opposite happens very often. The manager fixes the number of successes and what stays free is the number of trials: how many calls it takes to close the first sale, how many invoices must be reviewed to find the first error, how many candidates must be interviewed before the first hire.</p>' +
      '<p>That second kind of count is called a waiting time, and the model that describes it is the <strong>geometric distribution</strong>. The variable X counts the number of trials carried out until the first success, including the trial on which the success occurs. Unlike the binomial, X has no maximum value: in principle the count can go on indefinitely, although the probability of very large values becomes minute.</p>' +
      '<p>The required conditions are the same as in the binomial except for the first one. Each trial must have two outcomes, the success probability p must stay constant and the trials must be independent. What changes is that the number of trials is no longer decided before starting: the experiment itself decides it when the first success shows up.</p>' +
      '<p>Building the formula is direct. For the first success to land exactly on trial k, two things must happen in that order: the first k − 1 trials must fail and trial k must come out well. Since the trials are independent the probabilities multiply, and there is no coefficient to add, because only one sequence is possible.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Variable</div><div class="rform">X = trial of the first success</div><div class="rnote">The successful trial is counted, not just the failed ones.</div></div>' +
        '<div class="rcard"><div class="rname">Probability function</div><div class="rform">P(X = k) = q<sup>k − 1</sup> p</div><div class="rnote">k − 1 failures in a row and then the success.</div></div>' +
        '<div class="rcard"><div class="rname">Complement</div><div class="rform">q = 1 − p</div><div class="rnote">Probability of failure on a single trial.</div></div>' +

      '<p><strong>Worked example.</strong> An account executive at a leasing company calls firms from a very long list to place an operating lease contract. Each call ends in a contract with probability ' + dec2(p1) + ', independently, and the executive stops as soon as the first one is placed. Management asks how likely it is that the first contract lands exactly on call ' + k1 + '.</p>' +

      '<strong>Step 3.</strong> Call ' + k1 + ' must come out well, which contributes the factor ' + dec2(p1) + '.<br>' +
      '<strong>Step 4.</strong> P(X = ' + k1 + ') = ' + pr(Math.pow(q1, k1 - 1)) + ' × ' + dec2(p1) + ' = ' + pr(res) + '.<br>' +
      '<strong>Business reading.</strong> In about ' + pct1(res) + ' percent of working days the first contract will arrive precisely on call ' + k1 + '. It is worth noting that this is not the most likely scenario: the most frequent value of X is always 1, because every extra call requires all the previous ones to have failed.</p></div>';
  });

      '<h2>A lo más k intentos, más de k intentos y la falta de memoria</h2>' +
      '<p>Preguntar por un intento exacto es poco frecuente en la práctica. Lo que un responsable de operación necesita saber es si el resultado va a llegar dentro del presupuesto de intentos que tiene autorizado, o cuál es el riesgo de que se pase de ese límite. Esas dos preguntas son complementarias y ambas tienen atajos limpios en el modelo geométrico.</p>' +
      '<p>El atajo nace de una observación sencilla: decir que hacen falta más de k intentos equivale a decir que los primeros k fallaron todos. Como los ensayos son independientes, esa probabilidad es simplemente q elevado a la k, sin sumar término por término. Y la probabilidad de resolver el asunto dentro de los primeros k intentos es el complemento de la anterior.</p>' +
      '<p>De ahí se desprende la propiedad más contraintuitiva del modelo, y la que más errores de gestión provoca: la <strong>falta de memoria</strong>. Si un gestor ya hizo diez llamadas sin éxito, la probabilidad de que necesite más de tres llamadas adicionales es exactamente la misma que la de un gestor que apenas empieza. El proceso no lleva la cuenta de los fracasos anteriores ni acumula presión hacia el éxito. La frase que se escucha en las salas de venta, esa cuenta ya me toca, no tiene sustento estadístico cuando el modelo geométrico aplica.</p>' +

  addSection(function(L) {

    if (es) return '' +
      '<div class="stag">Concepto 3</div>' +
      '<h2>Cuántos intentos cuesta un cierre: media y dispersión</h2>' +
      '<p>Una vez que el modelo está identificado, la pregunta que importa para presupuestar no es la probabilidad de un intento concreto sino el promedio: cuántos intentos hay que pagar, en promedio, por cada éxito conseguido. En el modelo geométrico ese promedio tiene la forma más simple posible, y su lectura es casi de sentido común: si una de cada cinco visitas cierra, en promedio hacen falta cinco visitas por cierre.</p>' +
      '<p>La dispersión, en cambio, suele sorprender. La desviación estándar del modelo geométrico es casi tan grande como la media, y se acerca a ella conforme p disminuye. Eso significa que el número de intentos hasta el primer éxito es una cantidad muy volátil: no es raro cerrar en el primer intento ni tampoco necesitar el triple del promedio. Un área comercial que presupuesta con el promedio y sin holgura queda descubierta la mitad del tiempo.</p>' +
      '<p>El paso final es traducir intentos a pesos. Si cada intento tiene un costo directo conocido, el costo esperado por éxito es ese costo unitario multiplicado por el número promedio de intentos. Ese es el número que se compara con el margen que deja un cliente ganado, y es el que decide si el canal de venta es rentable o si conviene invertir en mejorar la tasa de conversión en lugar de en hacer más intentos.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Valor esperado</div><div class="rform">μ = ' + frac('1', 'p') + '</div><div class="rnote">Intentos promedio hasta el primer éxito.</div></div>' +
        '<div class="rcard"><div class="rname">Varianza</div><div class="rform">σ<sup>2</sup> = ' + frac('q', 'p<sup>2</sup>') + '</div><div class="rnote">Crece muy rápido cuando p es pequeña.</div></div>' +
        '<div class="rcard"><div class="rname">Desviación estándar</div><div class="rform">σ = ' + frac('√q', 'p') + '</div><div class="rnote">En la misma unidad que los intentos.</div></div>' +
        '<div class="rcard"><div class="rname">Costo por éxito</div><div class="rform">Costo unitario por μ</div><div class="rnote">Traduce los intentos a pesos presupuestables.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una distribuidora de equipo médico visita hospitales privados para colocar un contrato de suministro. Cada visita cuesta ' + money(c6) + ' entre viáticos y tiempo del vendedor, y termina en contrato con probabilidad ' + dec2(p6) + ', de forma independiente. La dirección comercial quiere saber cuánto cuesta en promedio cada contrato firmado y qué tan confiable es esa cifra.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Los parámetros son p = ' + dec2(p6) + ' y q = ' + dec2(q) + '.<br>' +
      '<strong>Paso 2.</strong> El número promedio de visitas por contrato es μ = ' + dec2(mu) + '.<br>' +
      '<strong>Paso 3.</strong> La varianza es σ<sup>2</sup> = ' + dec2(vr) + ' y la desviación estándar es σ = ' + dec2(sd) + ' visitas, casi igual al promedio.<br>' +
      '<strong>Paso 4.</strong> El costo esperado por contrato es ' + dec2(mu) + ' × ' + money(c6) + ' = ' + money(mu * c6) + '.<br>' +
      '<strong>Lectura de negocio.</strong> Si el margen que deja un contrato de suministro no supera con holgura los ' + money(mu * c6) + ', el canal de venta directa no se sostiene. Y como la desviación estándar es de ' + dec2(sd) + ' visitas, hay hospitales que costarán ' + money((mu + sd) * c6) + ' o más antes de firmar: presupuestar exactamente el promedio deja al área sin margen de maniobra.</p></div>';
    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>How many attempts a close costs: mean and spread</h2>' +
      '<p>Once the model is identified, the question that matters for budgeting is not the probability of a specific attempt but the average: how many attempts have to be paid for, on average, per success obtained. In the geometric model that average has the simplest possible form, and its reading is almost common sense: if one out of every five visits closes, on average five visits are needed per close.</p>' +
      '<p>The spread, on the other hand, tends to surprise. The standard deviation of the geometric model is almost as large as the mean, and it gets closer to it as p decreases. That means the number of attempts until the first success is a highly volatile quantity: closing on the first attempt is not unusual, and neither is needing three times the average. A sales unit that budgets with the average and no slack is left uncovered half the time.</p>' +
      '<p>The final step is translating attempts into pesos. If each attempt has a known direct cost, the expected cost per success is that unit cost multiplied by the average number of attempts. That is the number compared against the margin a won client leaves, and it is the one that decides whether the sales channel is profitable or whether it is better to invest in improving the conversion rate rather than in making more attempts.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Expected value</div><div class="rform">μ = ' + frac('1', 'p') + '</div><div class="rnote">Average attempts until the first success.</div></div>' +
        '<div class="rcard"><div class="rname">Variance</div><div class="rform">σ<sup>2</sup> = ' + frac('q', 'p<sup>2</sup>') + '</div><div class="rnote">Grows very fast when p is small.</div></div>' +
        '<div class="rcard"><div class="rname">Standard deviation</div><div class="rform">σ = ' + frac('√q', 'p') + '</div><div class="rnote">In the same unit as the attempts.</div></div>' +
        '<div class="rcard"><div class="rname">Cost per success</div><div class="rform">Unit cost times μ</div><div class="rnote">Turns attempts into budgetable pesos.</div></div>' +

      '<p><strong>Worked example.</strong> A medical equipment distributor visits private hospitals to place a supply contract. Each visit costs ' + money(c6) + ' in travel expenses and sales time, and ends in a contract with probability ' + dec2(p6) + ', independently. The commercial director wants to know how much each signed contract costs on average and how reliable that figure is.</p>' +

      '<strong>Step 3.</strong> The variance is σ<sup>2</sup> = ' + dec2(vr) + ' and the standard deviation is σ = ' + dec2(sd) + ' visits, almost equal to the average.<br>' +

        en: 'A restaurant chain needs ' + rC + ' sites approved by the real estate committee before opening operations in a new city. The expansion team evaluates sites one after another and each one is approved with probability ' + dec2(pC) + ', independently. What is the probability that the last required site is approved exactly on evaluation number ' + kC + '?' },

  var muD = nbMean(rD, pD), sdD = nbSd(rD, pD);

  ], rng);
  var q9i = {

  buildOneCard(problems[problems.length - 1], problems.length - 1);

  var o10 = shuffleOpts(

     'La probabilidad de cerrar en la siguiente llamada ya es prácticamente uno, porque la probabilidad acumulada de fallar tantas veces seguidas es muy pequeña.'],
    ['The probability of closing on the next call is still ' + dec2(pE) + ', because the calls are independent and the model keeps no memory of the earlier rejections.',

function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };

  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));

  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');
    if (st) st.innerHTML = p.questionText + '<span class="pfn">' + (p.fn || '') + '</span>';
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
