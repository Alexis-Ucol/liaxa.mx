<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historia de las Mujeres y sus Luchas por los Derechos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Historia de las Mujeres y sus Luchas por los Derechos</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Historia de las Mujeres y sus Luchas por los Derechos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

  var _fname   = 'his2_t06_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);

function S(es, en){ return LANG === 'es' ? es : en; }
function L(o){ if (o === null || o === undefined) return ''; if (typeof o === 'string') return o; return (o[LANG] !== undefined ? o[LANG] : o.es); }

function shufflePerm(n, rng){
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  var sorted = true;
  for (i = 0; i < n; i++) if (a[i] !== i) sorted = false;
  if (sorted && n > 1) { t = a[0]; a[0] = a[1]; a[1] = t; }
  return a;
}
function pickV(list, rng){ return list[Math.floor(rng() * list.length)]; }

function addSection(tag, title, body){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + body;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

/* Shuffles the options (Rule 7) keeping the correct index, then builds the card
   inline immediately after the push (Rule 1 / Rule 5). */
function addProblem(v, rng){
  var langOpts = L(v.options), n = langOpts.length, idx = shufflePerm(n, rng);
  var p = {
    title:        L(v.title),
    questionText: L(v.stmt),
    fn:           '',
    hint:         L(v.hint),
    explanation:  L(v.explanation),
    options:      idx.map(function(k){ return langOpts[k]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(p);
  buildOneCard(p, problems.length - 1);
}

function fuBuild(rng){
  var set = FU_SETS[Math.floor(rng() * FU_SETS.length)];
  FU = { it:set, qOrd:shufflePerm(set.length, rng), sOrd:shufflePerm(set.length, rng),
         link:[null, null, null, null], sel:null, tries:0, done:false, fb:'', fbk:'' };
  return '<div class="wgt" data-widget="match" id="wFuentes">' +
    wgtHead(S('La mesa de fuentes', 'The table of sources'),
            S('Toca una pregunta de investigación y después el documento que puede responderla. Si cambias de opinión, toca la pareja para deshacerla.',
              'Tap a research question and then the document that can answer it. If you change your mind, tap the pair to undo it.')) +
    '<div id="fuBox"></div></div>';
}
function fuRender(){
  var z = document.getElementById('fuBox');
  if (!FU || !z) return;
  var usedBy = {}, i;
  for (i = 0; i < FU.link.length; i++) if (FU.link[i] !== null) usedBy[FU.link[i]] = i;
  var qs = FU.qOrd.map(function(k, pos){
    var cls = 'mt-item' + (FU.done ? ' ok' : (FU.sel === k ? ' sel' : (FU.link[k] !== null ? ' linked' : '')));
    var badge = FU.link[k] !== null ? '<span class="mt-badge">' + (pos + 1) + '</span>'
                                    : '<span class="mt-badge empty">' + (pos + 1) + '</span>';
    return '<div class="' + cls + '" onclick="fuTapQ(' + k + ')">' + badge + '<span>' + L(FU.it[k].q) + '</span></div>';
  }).join('');
  var ss = FU.sOrd.map(function(k){
    var owner = usedBy[k];
    var lbl = '';
    if (owner !== undefined){ lbl = String(FU.qOrd.indexOf(owner) + 1); }
    var cls = 'mt-item' + (FU.done ? ' ok' : (owner !== undefined ? ' linked' : ''));
    var badge = lbl ? '<span class="mt-badge">' + lbl + '</span>' : '<span class="mt-badge empty">?</span>';
    return '<div class="' + cls + '" onclick="fuTapS(' + k + ')">' + badge + '<span>' + L(FU.it[k].s) + '</span></div>';
  }).join('');
  var linked = FU.link.filter(function(x){ return x !== null; }).length;
  z.innerHTML =
    '<div class="mt-grid">' +
      '<div><div class="mt-lbl">' + S('Preguntas', 'Questions') + '</div>' + qs + '</div>' +
      '<div><div class="mt-lbl">' + S('Documentos del archivo', 'Documents in the archive') + '</div>' + ss + '</div>' +
    '</div>' +
    '<div class="iw-row"><span class="iw-read">' + linked + '/' + FU.it.length + ' ' + S('emparejadas', 'matched') + '</span>' +
      (FU.done ? '' : '<button class="iw-btn" onclick="fuCheck()">' + S('Revisar el archivo', 'Review the archive') + '</button>' +
                      '<button class="iw-btn2" onclick="fuClear()">' + S('Deshacer todo', 'Undo all') + '</button>') +
    '</div>' +
    '<div class="iw-fb' + (FU.fbk ? ' ' + FU.fbk : '') + '">' + FU.fb + '</div>';
}
function fuTapQ(k){
  if (!FU || FU.done) return;
  if (FU.link[k] !== null){ FU.link[k] = null; FU.sel = null;
    FU.fb = S('Pareja deshecha. Vuelve a elegir.', 'Pair undone. Choose again.'); FU.fbk = ''; fuRender(); return; }
  FU.sel = (FU.sel === k ? null : k);
  FU.fb = FU.sel === null ? '' : S('Pregunta elegida. Ahora toca el documento que podría contestarla.',
                                   'Question selected. Now tap the document that could answer it.');
  FU.fbk = '';
  fuRender();
}
function fuTapS(k){
  if (!FU || FU.done) return;
  var i;
  for (i = 0; i < FU.link.length; i++) if (FU.link[i] === k){
    FU.link[i] = null; FU.fb = S('Documento liberado.', 'Document released.'); FU.fbk = ''; fuRender(); return;
  }
  if (FU.sel === null){
    FU.fb = S('Primero elige una pregunta de la columna izquierda.', 'First choose a question from the left column.');
    FU.fbk = 'warn'; fuRender(); return;
  }
  FU.link[FU.sel] = k; FU.sel = null; FU.fb = ''; FU.fbk = '';
  fuRender();
}
function fuClear(){
  if (!FU || FU.done) return;
  FU.link = [null, null, null, null]; FU.sel = null; FU.fb = ''; FU.fbk = ''; fuRender();
}
function fuCheck(){
  if (!FU || FU.done) return;
  var i, wrong = [], empty = 0;
  for (i = 0; i < FU.it.length; i++){
    if (FU.link[i] === null) empty++;
    else if (FU.link[i] !== i) wrong.push(i);
  }
  if (empty > 0){
    FU.fbk = 'warn';
    FU.fb = S('Todavía hay preguntas sin documento. Cada una deja huella en algún papel distinto.',
              'Some questions still have no document. Each one leaves its trace on a different paper.');
    fuRender(); return;
  }
  if (wrong.length === 0){
    FU.done = true; FU.fbk = 'ok';
    FU.fb = S('Archivo en orden. Fíjate en la regla que acabas de usar: la fuente sirve para la pregunta que su autor tuvo alguna razón para responder. Por eso quien investiga cruza varias.',
              'Archive in order. Notice the rule you just used: a source serves the question its author had some reason to answer. That is why researchers cross several of them.');
    fuRender(); return;
  }
  FU.tries++;
  if (FU.tries >= 3){
    for (i = 0; i < FU.it.length; i++) FU.link[i] = i;
    FU.done = true; FU.fbk = 'warn';
    FU.fb = S('Así queda la mesa. Cada documento responde lo que su autor necesitaba anotar: cifras en los registros, opiniones en la prensa, sentimientos en los testimonios, permisos en la ley.',
              'This is how the table looks. Each document answers what its author needed to write down: figures in the records, opinions in the press, feelings in the testimonies, permissions in the law.');
    fuRender(); return;
  }
  for (i = 0; i < wrong.length; i++) FU.link[wrong[i]] = null;
  FU.fbk = 'bad';
  FU.fb = (wrong.length === 1 ? S('Una pareja no encaja. ', 'One pair does not fit. ')
                              : (wrong.length + S(' parejas no encajan. ', ' pairs do not fit. '))) + L(FU.it[wrong[0]].g);
  fuRender();
}

function tmMove(v){
  if (!MQ) return;
  MQ.year = parseInt(v, 10);
  var y = document.getElementById('tmYear'); if (y) y.textContent = MQ.year;
  var r = document.getElementById('tmRows'); if (r) r.innerHTML = tmRows();
}
function tmNext(){
  MQ.r++; MQ.tries = 0;
  if (MQ.r >= MQ.ord.length){ MQ.done = true; }
  tmRender();
}
function tmCheck(){
  if (!MQ || MQ.done) return;
  var it = TM_ITEMS[MQ.ord[MQ.r]], diff = MQ.year - it.y;
  if (diff === 0){
    MQ.fbk = 'ok';
    MQ.fb = '🎉 ' + L(it.d);
    var last = (MQ.r + 1 >= MQ.ord.length);
    tmRender();
    setTimeout(function(){ if (MQ && !MQ.done) { MQ.fb = last ? MQ.fb : ''; MQ.fbk = last ? 'ok' : ''; tmNext(); } }, 1500);
    return;
  }
  MQ.tries++;
  if (MQ.tries >= 3){
    MQ.year = it.y; MQ.fbk = 'warn'; MQ.fb = L(it.d);
    tmRender();
    setTimeout(function(){ if (MQ && !MQ.done) tmNext(); }, 2200);
    return;
  }
  var far = Math.abs(diff);
  var dir = diff < 0 ? S('avanza', 'move forward') : S('retrocede', 'move back');
  var size = far > 15 ? S('bastante', 'quite a lot') : (far > 4 ? S('un poco', 'a little') : S('muy poco, estás casi encima', 'very little, you are almost on it'));
  MQ.fbk = 'bad';
  MQ.fb = (diff < 0 ? S('En ese año el tablero todavía no lo enciende. ', 'At that year the board does not light it yet. ')
                    : S('Te pasaste: en ese año eso ya había ocurrido. ', 'You went too far: by that year it had already happened. ')) +
          dir + ' ' + size + '.';
  tmRender();
}

    var box = document.querySelector('#baBox .iw-fb');
    if (box){ box.className = 'iw-fb ' + keepk; box.innerHTML = keep; }
    return;
  }
  BA.fbk = 'bad';
  BA.fb = S('Vuelve a mirarlo: ¿bastaba con mostrar un texto para impedirlo, o el obstáculo venía de lo que la gente daba por normal?',
            'Look again: was showing a text enough to block it, or did the obstacle come from what people took as normal?');
  baRender();
}

/* ════════════════ MANIPULABLE D :: LA LÍNEA DE LAS CONQUISTAS ════════════════
   Los sucesos llegan sin fecha: solo pueden ordenarse razonando qué hace
   posible qué. Se intercambian tocando dos fichas y la revisión señala el
   lugar dudoso sin decir la respuesta. Las fechas aparecen al cerrar. */
var LN = null;
var LN_SETS = [
  [ { t:{ es:'Una asamblea reunida en Seneca Falls, en Estados Unidos, publica la primera declaración organizada de derechos de las mujeres.',
          en:'An assembly gathered at Seneca Falls, in the United States, publishes the first organized declaration of the rights of women.' }, y:'1848' },
    { t:{ es:'Nueva Zelanda se convierte en el primer país que reconoce el voto de las mujeres en elecciones nacionales.',
          en:'New Zealand becomes the first country to recognize the vote of women in national elections.' }, y:'1893' },
    { t:{ es:'Maestras y trabajadoras se reúnen en Mérida en el primer congreso feminista de México.',
          en:'Teachers and working women gather in Merida at the first feminist congress of Mexico.' }, y:'1916' },
    { t:{ es:'La ley mexicana reconoce el voto de las mujeres en las elecciones de los municipios.',
          en:'Mexican law recognizes the vote of women in municipal elections.' }, y:'1947' },
    { t:{ es:'La ley mexicana reconoce el voto de las mujeres en todo el país.',
          en:'Mexican law recognizes the vote of women in the whole country.' }, y:'1953' } ],
  [ { t:{ es:'Una religiosa novohispana defiende por escrito el derecho de las mujeres a estudiar.',
          en:'A nun in New Spain defends in writing the right of women to study.' }, y:'1691' },
    { t:{ es:'Una mujer obtiene por primera vez en México el título de médica.',
          en:'A woman obtains for the first time in Mexico a medical degree.' }, y:'1887' },
    { t:{ es:'Una delegada pide ante el congreso que redacta la Constitución que se reconozca el voto de las mujeres.',
          en:'A delegate asks the congress drafting the Constitution to recognize the vote of women.' }, y:'1916' },
    { t:{ es:'Una maestra yucateca resulta electa para un congreso estatal.',
          en:'A teacher from Yucatan is elected to a state congress.' }, y:'1923' },
    { t:{ es:'Un nuevo código civil reconoce a las mujeres la misma capacidad legal que a los hombres.',
          en:'A new civil code recognizes for women the same legal capacity as for men.' }, y:'1928' } ]
];

function lnBuild(rng){
  var set = LN_SETS[Math.floor(rng() * LN_SETS.length)];
  LN = { it:set, ord:shufflePerm(set.length, rng), sel:null, tries:0, done:false, fb:'', fbk:'' };
  return '<div class="wgt" data-widget="timeline" id="wLinea">' +
    wgtHead(S('La línea de las conquistas', 'The line of the conquests'),
            S('Los sucesos llegan sin fecha y revueltos. Toca dos fichas para intercambiarlas hasta dejarlos del más antiguo al más reciente.',
              'The events arrive undated and out of order. Tap two chips to swap them until they run from the oldest to the most recent.')) +
    '<div id="lnBox"></div></div>';
}
function lnRender(){
  var z = document.getElementById('lnBox');
  if (!LN || !z) return;
  var chips = LN.ord.map(function(k, pos){
    var cls = 'tl-chip' + (LN.done ? ' locked' : (LN.sel === pos ? ' sel' : ''));
    return '<div class="' + cls + '" onclick="lnTap(' + pos + ')">' +
             '<span class="tl-num">' + (pos + 1) + '</span>' +
             (LN.done ? '<span class="tl-year">' + LN.it[k].y + '</span>' : '') +
             '<span>' + L(LN.it[k].t) + '</span></div>';
  }).join('');
  z.innerHTML =
    '<div class="tl-list">' + chips + '</div>' +
    '<div class="iw-row">' + (LN.done ? '' : '<button class="iw-btn" onclick="lnCheck()">' + S('Revisar la línea', 'Check the line') + '</button>') + '</div>' +
    '<div class="iw-fb' + (LN.fbk ? ' ' + LN.fbk : '') + '">' + LN.fb + '</div>';
}
function lnTap(pos){
  if (!LN || LN.done) return;
  if (LN.sel === null){ LN.sel = pos; LN.fb = S('Ficha tomada. Toca otra para cambiarlas de lugar.', 'Chip taken. Tap another one to swap their places.'); LN.fbk = ''; }
  else if (LN.sel === pos){ LN.sel = null; LN.fb = ''; LN.fbk = ''; }
  else { var t = LN.ord[LN.sel]; LN.ord[LN.sel] = LN.ord[pos]; LN.ord[pos] = t; LN.sel = null; LN.fb = ''; LN.fbk = ''; }
  lnRender();
}
function lnCheck(){
  if (!LN || LN.done) return;
  var i, bad = -1;
  for (i = 0; i < LN.ord.length; i++) if (LN.ord[i] !== i){ bad = i; break; }
  if (bad === -1){
    LN.done = true; LN.fbk = 'ok';
    LN.fb = S('🎉 Línea completa. Mira las fechas que aparecieron: cada paso se apoya en el anterior, y entre el primero y el último cabe más de una vida entera.',
              '🎉 Line complete. Look at the dates that appeared: each step leans on the previous one, and more than a whole lifetime fits between the first and the last.');
    lnRender(); return;
  }
  LN.tries++;
  if (LN.tries >= 3){
    LN.ord = LN.it.map(function(_, k){ return k; });
    LN.done = true; LN.fbk = 'warn';
    LN.fb = S('Este es el orden con sus fechas. Léelo de arriba abajo y fíjate cómo lo escrito y lo discutido llegó siempre antes que la ley.',
              'This is the order with its dates. Read it from top to bottom and notice how what was written and discussed always came before the law.');
    lnRender(); return;
  }
  LN.fbk = 'bad';
  LN.fb = S('Todavía no. Revisa la ficha del lugar ', 'Not yet. Look at the chip in place ') + (bad + 1) +
          (LN.ord[bad] > bad ? S(': lo que describe ocurrió más tarde de lo que indicas, bájala.', ': what it describes happened later than you say, move it down.')
                             : S(': lo que describe ocurrió antes de lo que indicas, súbela.', ': what it describes happened earlier than you say, move it up.'));
  lnRender();
}

function buildReflect(rng){

function rfTab(which, btn){
  ['type', 'draw'].forEach(function(k){
    var el = document.getElementById('rf_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var w = document.getElementById('wReflexion');

}
function rfSave(){

}

/* ================================================
   buildLesson :: concepto, manipulable, problema (Rule 1)
   ================================================ */
function buildLesson(rng) {
  injectGuideStyles();

  /* ══════════ CONCEPTO 1 ══════════ */
  addSection(S('Concepto 1', 'Concept 1'),
    S('La mitad que faltaba en los libros', 'The half that was missing from the books'),
    S('<p>Durante mucho tiempo, los libros de historia contaron sobre todo lo que ocurría en los palacios, los campos de batalla y los congresos. En esos lugares casi no había mujeres, porque las leyes y las costumbres se lo impedían. Al escribir la historia mirando solo hacia allá, la mitad de la población quedó fuera del relato: aparecía de vez en cuando una reina o una heroína, y muy poco más.</p>' +
      '<p>Investigar la historia de las mujeres no consiste en inventar personajes, sino en cambiar las preguntas y buscar otras huellas. Quien investiga acude a censos y padrones para saber cuántas niñas iban a la escuela; a listas de pago y contratos para conocer jornadas y salarios; a los códigos civiles para saber qué podía firmar una mujer casada; a cartas, diarios y entrevistas para escuchar lo que ellas pensaban. Cada fuente responde bien a cierto tipo de pregunta y calla ante otras, y por eso quien investiga nunca se queda con una sola.</p>',
      '<p>For a long time, history books told mainly what happened in palaces, battlefields and parliaments. There were almost no women in those places, because laws and customs kept them out. By writing history looking only there, half the population was left out of the story: now and then a queen or a heroine appeared, and very little more.</p>' +
      '<p>Researching the history of women does not mean inventing characters, but changing the questions and looking for other traces. Researchers turn to censuses and rolls to learn how many girls went to school; to pay lists and contracts to learn about working days and wages; to civil codes to learn what a married woman could sign; to letters, diaries and interviews to hear what they thought. Each source answers one kind of question well and stays silent before others, and that is why a researcher never settles for a single one.</p>') +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Censos y padrones', 'Censuses and rolls') + '</div><div class="rform">' + S('cuántas y dónde', 'how many and where') + '</div><div class="rnote">' + S('Sirven para contar: alumnas, trabajadoras, jefas de familia.', 'Good for counting: girl students, women workers, women heads of household.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Leyes y códigos', 'Laws and codes') + '</div><div class="rform">' + S('qué se permitía', 'what was allowed') + '</div><div class="rnote">' + S('Muestran los límites que una autoridad podía exigir.', 'They show the limits an authority could enforce.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Prensa de la época', 'Press of the period') + '</div><div class="rform">' + S('qué se decía', 'what was said') + '</div><div class="rnote">' + S('Recoge las opiniones que circulaban, a favor y en contra.', 'It gathers the opinions in circulation, for and against.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Cartas y entrevistas', 'Letters and interviews') + '</div><div class="rform">' + S('quién lo vivió', 'who lived it') + '</div><div class="rnote">' + S('Dan la voz de ellas mismas, con nombre y experiencia propia.', 'They give their own voice, with a name and their own experience.') + '</div></div>' +
    '</div>' +
    fuBuild(rng));
  fuRender();

  /* ── graded 1 ── */
  addProblem(pickV([
    { title:{ es:'Lo que dice una fuente', en:'What a source says' },
      stmt:{ es:'Una historiadora quiere saber cuántas horas trabajaban las mujeres en una fábrica de hilados y cuánto se les pagaba. En el archivo de la empresa encuentra listas de pago, contratos y reglamentos internos. ¿Qué le permite afirmar ese conjunto de documentos?',
             en:'A historian wants to know how many hours women worked in a spinning mill and how much they were paid. In the company archive she finds pay lists, contracts and internal rules. What do those documents allow her to state?' },
      options:{ es:['Las jornadas y los salarios que la empresa registraba para sus trabajadoras.',
                    'La opinión que tenían las obreras sobre el trato que recibían de sus patrones.',
                    'El número de mujeres que sabían leer y escribir en todo el país.',
                    'Las razones por las que las familias enviaban a sus hijas a trabajar.'],
                en:['The working days and wages the company recorded for its women workers.',
                    'The opinion the workers held about the treatment they received from their bosses.',
                    'The number of women who could read and write in the whole country.',
                    'The reasons why families sent their daughters out to work.'] },
      correct:0,
      hint:{ es:'Pregúntate qué necesitaba anotar la empresa para funcionar, y qué cosas nunca habría escrito en sus papeles.',
             en:'Ask what the company needed to write down in order to run, and what it would never have put in its papers.' },
      explanation:{ es:'Los papeles de una empresa registran lo que a la empresa le hacía falta controlar: horas y pagos. Lo que las obreras sentían o lo que decidían sus familias no aparece ahí, y para conocerlo hacen falta cartas, entrevistas u otros testimonios.',
                    en:'Company papers record what the company needed to control: hours and payments. What the workers felt or what their families decided does not appear there, and to learn that you need letters, interviews or other testimonies.' } },
    { title:{ es:'Lo que dice una fuente', en:'What a source says' },
      stmt:{ es:'Un equipo escolar quiere reconstruir la vida de las mujeres de su comunidad hace ochenta años y solo consigue los discursos de las autoridades municipales de aquella época. ¿Cuál es el principal límite de trabajar únicamente con esa fuente?',
             en:'A school team wants to reconstruct the lives of the women of its community eighty years ago and can only obtain the speeches of the municipal authorities of that period. What is the main limit of working only with that source?' },
      options:{ es:['Muestra cómo hablaban de las mujeres quienes gobernaban, no cómo vivían ellas ni qué pensaban.',
                    'Registra únicamente cifras y no permite conocer ningún hecho de la época.',
                    'Proviene de una sola comunidad y por eso no sirve para fechar los acontecimientos.',
                    'Fue escrita hace muchos años y por esa razón ya no puede consultarse.'],
                en:['It shows how those who governed spoke about women, not how the women lived or what they thought.',
                    'It records only figures and does not allow any fact of the period to be known.',
                    'It comes from a single community and therefore cannot be used to date events.',
                    'It was written many years ago and for that reason it can no longer be consulted.'] },
      correct:0,
      hint:{ es:'Toda fuente dice mucho sobre quien la produjo. Pregúntate quién habla en esos discursos y quién guarda silencio.',
             en:'Every source says a lot about whoever produced it. Ask who speaks in those speeches and who stays silent.' },
      explanation:{ es:'Un discurso oficial sirve, pero informa sobre la mirada de la autoridad. Para no confundir esa mirada con la vida cotidiana hay que contrastarla con testimonios, cartas, fotografías o entrevistas de las propias mujeres.',
                    en:'An official speech is useful, but it informs about the view of the authority. To avoid confusing that view with daily life it must be contrasted with testimonies, letters, photographs or interviews of the women themselves.' } }
  ], rng), rng);

  /* ── graded 2 ── */
  addProblem(pickV([
    { title:{ es:'La mitad ausente', en:'The absent half' },
      stmt:{ es:'Durante mucho tiempo los libros de historia contaron sobre todo guerras, gobiernos y tratados. ¿Cómo influyó esa manera de escribir la historia en el lugar que ocuparon las mujeres dentro de esos relatos?',
             en:'For a long time history books told mainly of wars, governments and treaties. How did that way of writing history affect the place women occupied inside those accounts?' },
      options:{ es:['Quedaron casi ausentes, porque los espacios que esos relatos consideraban importantes les estaban cerrados.',
                    'Aparecieron con frecuencia, porque las guerras y los gobiernos dependían del trabajo doméstico.',
                    'Recibieron un capítulo aparte en cada libro, separado del resto de los sucesos.',
                    'Fueron el tema central de esos relatos hasta bien entrado el siglo XX.'],
                en:['They were almost absent, because the spaces those accounts considered important were closed to them.',
                    'They appeared often, because wars and governments depended on domestic work.',
                    'They were given a separate chapter in each book, apart from the rest of the events.',
                    'They were the central subject of those accounts well into the twentieth century.'] },
      correct:0,
      hint:{ es:'Piensa quiénes podían firmar un tratado o encabezar un ejército en aquellas épocas, y quiénes tenían prohibido hacerlo.',
             en:'Think about who could sign a treaty or lead an army in those periods, and who was forbidden to do so.' },
      explanation:{ es:'Si solo se cuenta lo que pasaba en los espacios de poder formal, quedan fuera quienes tenían prohibida la entrada. Las mujeres estaban en el trabajo, el comercio, la escuela y las revueltas, pero esos escenarios no se consideraban dignos de relato.',
                    en:'If only what happened in the spaces of formal power is told, those who were forbidden to enter are left out. Women were in work, trade, school and revolts, but those settings were not considered worth telling.' } },
    { title:{ es:'La mitad ausente', en:'The absent half' },
      stmt:{ es:'Una investigadora afirma: las mujeres siempre estuvieron en la historia; lo que faltaba eran preguntas que las buscaran. ¿Qué quiere decir con esa frase?',
             en:'A researcher states: women were always in history; what was missing were questions that looked for them. What does she mean by that sentence?' },
      options:{ es:['Que las mujeres participaron en el trabajo, la economía y la política, pero la historia que se escribía no preguntaba por ellas.',
                    'Que las fuentes sobre las mujeres se perdieron por completo y hoy resulta imposible saber algo de ellas.',
                    'Que las mujeres comenzaron a participar en la vida pública apenas en el siglo XX.',
                    'Que los archivos de aquellas épocas fueron redactados únicamente por mujeres.'],
                en:['That women took part in work, the economy and politics, but the history being written did not ask about them.',
                    'That the sources about women were completely lost and today it is impossible to know anything about them.',
                    'That women only began to take part in public life in the twentieth century.',
                    'That the archives of those periods were written exclusively by women.'] },
      correct:0,
      hint:{ es:'Fíjate en qué dice la frase que faltaba: no habla de las mujeres, habla de quien escribía.',
             en:'Notice what the sentence says was missing: it does not speak about the women, it speaks about whoever was writing.' },
      explanation:{ es:'Las huellas estaban en censos, listas de pago, testamentos y cartas, pero nadie las miraba con esa pregunta. Cuando la investigación empezó a preguntar por las mujeres, esas mismas fuentes empezaron a responder.',
                    en:'The traces were in censuses, pay lists, wills and letters, but nobody looked at them with that question. When research began asking about women, those same sources began to answer.' } }
  ], rng), rng);

  /* ══════════ CONCEPTO 2 ══════════ */
  addSection(S('Concepto 2', 'Concept 2'),
    S('Distintas épocas, distintos límites', 'Different eras, different limits'),
    S('<p>La situación de las mujeres no fue la misma en todas las épocas ni en todos los grupos sociales. En la Nueva España, la mayoría de las mujeres indígenas y mestizas trabajaba en el campo, en los mercados, en los talleres y en casas ajenas; a unas pocas, la vida conventual les abrió la única puerta disponible al estudio. Desde ahí, en el siglo XVII, Sor Juana Inés de la Cruz defendió por escrito el derecho de las mujeres a aprender.</p>' +
      '<p>En el siglo XIX la ley mexicana consideraba a la mujer casada dependiente de su esposo: necesitaba su permiso para trabajar, para firmar contratos y para administrar sus bienes. Aun así, muchas sostuvieron a sus familias con la costura, el comercio y el trabajo doméstico, y algunas empezaron a abrir profesiones cerradas. Durante la Revolución, miles de mujeres acompañaron a los ejércitos, atendieron heridos, llevaron mensajes y sostuvieron la economía de los pueblos. En el siglo XX esas presencias se convirtieron en demandas escritas, y una tras otra fueron quedando reconocidas en la ley.</p>',
      '<p>The situation of women was not the same in every era or in every social group. In New Spain, most indigenous and mestizo women worked in the fields, the markets, the workshops and other peoples houses; for a few, convent life opened the only available door to study. From there, in the seventeenth century, Sor Juana Ines de la Cruz defended in writing the right of women to learn.</p>' +
      '<p>In the nineteenth century Mexican law considered a married woman a dependant of her husband: she needed his permission to work, to sign contracts and to manage her property. Even so, many supported their families through sewing, trade and domestic work, and some began to open closed professions. During the Revolution, thousands of women followed the armies, cared for the wounded, carried messages and sustained the economy of the villages. In the twentieth century that presence turned into written demands, and one after another they were recognized in the law.</p>') +
    tmBuild(rng));
  tmRender();

  /* ── graded 3 ── */
  addProblem(pickV([
    { title:{ es:'Dos épocas, dos caminos', en:'Two eras, two paths' },
      stmt:{ es:'En 1885 una joven mexicana quiere estudiar medicina; medio siglo después otra joven quiere lo mismo. Las dos cuentan con dinero y con apoyo de su familia. ¿Qué diferencia principal enfrentan?',
             en:'In 1885 a young Mexican woman wants to study medicine; half a century later another young woman wants the same. Both have money and family support. What main difference do they face?' },
      options:{ es:['En la primera fecha casi no había mujeres tituladas y cada ingreso se discutía como caso excepcional; después ya existía un camino abierto por quienes llegaron antes.',
                    'En la primera fecha una ley prohibía expresamente a las mujeres presentar exámenes, y esa prohibición siguió vigente medio siglo después.',
                    'En las dos fechas las condiciones eran idénticas, porque las escuelas nunca pusieron obstáculo alguno a las mujeres.',
                    'En la fecha más reciente se exigía permiso del esposo para inscribirse, y en la más antigua no se exigía nada.'],

  /* ══════════ CONCEPTO 3 ══════════ */
  addSection(S('Concepto 3', 'Concept 3'),
    S('Barreras escritas y barreras de costumbre', 'Written barriers and barriers of custom'),
    S('<p>Cuando estudias la exclusión conviene separar dos cosas. Una barrera puede estar escrita: un artículo que impide votar, un código que exige el permiso del esposo, un reglamento que cierra una escuela. Otra barrera vive en la costumbre: la idea de que ciertas carreras no son para mujeres, el sueldo menor por la misma jornada, la familia que manda a estudiar a los hijos y deja a las hijas en casa.</p>' +
      '<p>La diferencia importa porque no se combaten igual ni desaparecen al mismo tiempo. Una norma puede cambiar en un día; una costumbre tarda generaciones. Por eso, en muchos momentos, un derecho ya reconocido en el papel seguía siendo difícil de ejercer. Además, las barreras se suman: una mujer indígena, una mujer pobre o una mujer con alguna discapacidad enfrentaba a la vez el trato desigual hacia su grupo y el que recibía por ser mujer. Estudiar la historia de las mujeres junto con la de otros grupos discriminados permite ver ese cruce.</p>',
      '<p>When you study exclusion it helps to separate two things. A barrier can be written down: an article that prevents voting, a code demanding the permission of the husband, a rule that closes a school. Another barrier lives in custom: the idea that certain careers are not for women, the lower wage for the same working day, the family that sends the sons to study and leaves the daughters at home.</p>' +
      '<p>The difference matters because they are not fought in the same way and do not disappear at the same time. A rule can change in a day; a custom takes generations. That is why, at many moments, a right already recognized on paper was still hard to exercise. Barriers also add up: an indigenous woman, a poor woman or a woman with a disability faced at once the unequal treatment given to her group and the one she received for being a woman. Studying the history of women together with that of other discriminated groups makes that crossing visible.</p>') +
    baBuild(rng));
  baRender();

  /* ══════════ CONCEPTO 4 ══════════ */
  addSection(S('Concepto 4', 'Concept 4'),
    S('Del reclamo aislado a la lucha organizada', 'From the isolated claim to organized struggle'),
    S('<p>Ninguna de esas conquistas llegó sola. A lo largo de más de un siglo las mujeres se organizaron: fundaron clubes y asociaciones, publicaron periódicos, se reunieron en congresos y llevaron sus demandas hasta los lugares donde se decidía. En 1848, una asamblea reunida en Seneca Falls, en Estados Unidos, publicó la primera declaración organizada de derechos de las mujeres. En 1893, Nueva Zelanda fue el primer país que reconoció su voto en elecciones nacionales.</p>' +
      '<p>En México, el primer congreso feminista se reunió en Mérida en enero de 1916: maestras y trabajadoras discutieron durante días sobre educación, trabajo y derechos políticos. Ese mismo año Hermila Galindo pidió al congreso que redactaba la Constitución que se reconociera el voto de las mujeres, y la petición no prosperó. En 1923 Elvia Carrillo Puerto resultó electa para el congreso de Yucatán, aunque las amenazas la obligaron a dejar el cargo. La ley tardó todavía décadas: el voto municipal llegó en 1947 y el voto en todo el país en 1953. La primera elección federal con las mujeres en el padrón fue la de 1955.</p>' +
      '<div class="callout"><p><strong>Fíjate: </strong>entre la primera petición formal y la reforma que la reconoció pasaron casi cuarenta años. Quienes empezaron la campaña no alcanzaron a votar.</p></div>',
      '<p>None of those conquests arrived on its own. Across more than a century women organized: they founded clubs and associations, published newspapers, gathered in congresses and carried their demands to the places where decisions were made. In 1848, an assembly gathered at Seneca Falls, in the United States, published the first organized declaration of the rights of women. In 1893, New Zealand became the first country to recognize their vote in national elections.</p>' +
      '<p>In Mexico, the first feminist congress met in Merida in January 1916: teachers and working women debated for days about education, work and political rights. That same year Hermila Galindo asked the congress drafting the Constitution to recognize the vote of women, and the request did not prosper. In 1923 Elvia Carrillo Puerto was elected to the congress of Yucatan, although threats forced her to leave the seat. The law still took decades: the municipal vote arrived in 1947 and the vote in the whole country in 1953. The first federal election with women on the roll was that of 1955.</p>' +
      '<div class="callout"><p><strong>Notice: </strong>almost forty years passed between the first formal request and the reform that recognized it. Those who began the campaign did not live to cast that vote.</p></div>') +
    lnBuild(rng));
  lnRender();

                    'Que las mujeres perdieron interés en la vida política una vez obtenido el voto.',
                    'Que a partir de esa fecha desaparecieron las organizaciones de mujeres en el país.'],
                en:['That recognizing a right in the law is one step, and that exercising it also depends on other conditions.',
                    'That the reform of those years was cancelled shortly after being approved.',
                    'That women lost interest in political life once the vote was obtained.',
                    'That from that date on the organizations of women disappeared from the country.'] },
      correct:0,
      hint:{ es:'Recuerda la distinción entre lo que impide una norma y lo que impide una costumbre.',
             en:'Recall the distinction between what a rule prevents and what a custom prevents.' },
      explanation:{ es:'La norma quedó abierta, pero las candidaturas, el dinero de campaña y las estructuras partidistas seguían en otras manos, y la costumbre pesaba. Por eso la participación creció despacio y siguió requiriendo organización.',
                    en:'The rule was opened, but candidacies, campaign money and party structures remained in other hands, and custom weighed. That is why participation grew slowly and kept requiring organization.' } },
    { title:{ es:'Del papel a la práctica', en:'From paper to practice' },
      stmt:{ es:'Un equipo escolar quiere investigar cómo cambió la vida de las mujeres de su localidad durante el último siglo. ¿Cuál de estos planes reúne mejor la información que necesita?',
             en:'A school team wants to research how the lives of the women of its town changed during the last century. Which of these plans best gathers the information it needs?' },
      options:{ es:['Entrevistar a mujeres mayores de la localidad y contrastar sus relatos con registros escolares, actas y fotografías de la época.',
                    'Consultar únicamente los discursos de las autoridades municipales de cada década.',
                    'Buscar solamente en libros de historia general del país, sin revisar ninguna fuente local.',
                    'Preguntar a sus compañeros de grupo qué imaginan que ocurría hace cien años.'],
                en:['Interview older women of the town and contrast their accounts with school records, minutes and photographs of the period.',
                    'Consult only the speeches of the municipal authorities of each decade.',
                    'Search only in general history books about the country, without checking any local source.',
                    'Ask their classmates what they imagine was happening a hundred years ago.'] },
      correct:0,
      hint:{ es:'Repasa qué responde cada tipo de fuente y qué gana una investigación cuando cruza varias.',
             en:'Review what each kind of source answers and what a piece of research gains when it crosses several.' },
      explanation:{ es:'La combinación es lo que da solidez: la entrevista aporta la experiencia vivida y los registros permiten fechar, contar y comprobar. Una sola de las dos, por sí misma, deja huecos que la otra podría llenar.',
                    en:'The combination is what gives solidity: the interview brings lived experience and the records make it possible to date, count and verify. Either one alone leaves gaps the other could fill.' } }
  ], rng), rng);

  /* ── graded 10 ── */
  addProblem(pickV([
    { title:{ es:'Poner a prueba una afirmación', en:'Testing a statement' },
      stmt:{ es:'Una afirmación para poner a prueba: las mujeres obtuvieron sus derechos porque un gobierno decidió concederlos. Con lo que revisaste en esta guía, ¿qué respuesta la corrige mejor?',
             en:'A statement to test: women obtained their rights because a government decided to grant them. With what you reviewed in this guide, which answer best corrects it?' },
      options:{ es:['Los derechos se reconocieron después de décadas de congresos, publicaciones y demandas sostenidas por ellas mismas.',
                    'Los derechos aparecieron de golpe en una sola reforma que nadie había pedido antes.',
                    'Los derechos fueron reconocidos por otros países y aquí se copiaron sin discusión interna.',
                    'Los derechos no cambiaron, porque los textos legales siguen siendo los del siglo XIX.'],
                en:['The rights were recognized after decades of congresses, publications and demands sustained by the women themselves.',
                    'The rights appeared all at once in a single reform nobody had asked for before.',
                    'The rights were recognized by other countries and copied here with no internal discussion.',
                    'The rights did not change, because the legal texts are still those of the nineteenth century.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Elige dos hechos con fecha de esta guía y ordénalos: ¿qué ocurrió antes, la demanda o la reforma?',
             en:'Choose two dated facts from this guide and order them: what came first, the demand or the reform?' },
      explanation:{ es:'Entre el congreso de Mérida y la reforma nacional median casi cuarenta años de organización, publicaciones y peticiones. La reforma es el final visible de un proceso, no su origen.',
                    en:'Almost forty years of organizing, publications and petitions lie between the congress in Merida and the national reform. The reform is the visible end of a process, not its origin.' } },
    { title:{ es:'Poner a prueba una afirmación', en:'Testing a statement' },
      stmt:{ es:'Tres elementos aparecen en toda esta historia: las demandas organizadas, las reformas legales y los cambios en la vida cotidiana. ¿Qué relación entre ellos describe mejor lo que ocurrió?',
             en:'Three elements appear throughout this history: organized demands, legal reforms and changes in daily life. Which relation among them best describes what happened?' },
      options:{ es:['Las demandas organizadas presionaron hasta lograr reformas, y los cambios cotidianos llegaron después, de manera desigual y más lenta.',
                    'Las reformas legales aparecieron primero y solo después alguien pensó en pedirlas.',
                    'Los cambios en la vida cotidiana ocurrieron primero y por eso las reformas resultaron innecesarias.',
                    'Los tres procesos ocurrieron a la vez y terminaron durante el mismo año.'],
                en:['The organized demands pressed until reforms were achieved, and the daily changes came afterwards, unevenly and more slowly.',
                    'The legal reforms appeared first and only afterwards did somebody think of asking for them.',
                    'The changes in daily life happened first and that is why the reforms turned out unnecessary.',
                    'The three processes happened at once and ended during the same year.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Sitúa en una línea tres fechas de esta guía: una demanda, una reforma y un cambio en la vida diaria.',
             en:'Place three dates from this guide on a line: a demand, a reform and a change in daily life.' },
      explanation:{ es:'El orden observable es ese: primero la organización, después la norma y al final la práctica, que tarda más porque depende de costumbres. Reconocerlo evita dos errores: creer que la ley basta y creer que no sirve de nada.',
                    en:'The observable order is that one: first the organizing, then the rule and finally the practice, which takes longer because it depends on customs. Recognizing this avoids two errors: believing the law is enough and believing it is useless.' } }
  ], rng), rng);
}
</script>

  var hb=null;

  startHB();
