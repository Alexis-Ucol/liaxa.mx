    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══ MANIPULATIVO 1 ══ Banco de arrastre: umbral de reposo y deslizamiento ══ */
function wArrastre(rng, host){
  var SUP = [
    { n:{ es:'hielo', en:'ice' },            fs: ri(rng, 3, 4) * 5,  fk: ri(rng, 1, 2) * 5 },
    { n:{ es:'piso de madera', en:'wooden floor' }, fs: ri(rng, 8, 10) * 5, fk: ri(rng, 5, 6) * 5 },
    { n:{ es:'tapete de hule', en:'rubber mat' },   fs: ri(rng, 13, 15) * 5, fk: ri(rng, 9, 10) * 5 }
  ];
  var TASKS = shuffle([
    { k:'quieto',   task:{ es:'la caja siga quieta aunque tu jalón sea mayor que cero', en:'the crate stays still even though your pull is greater than zero' } },
    { k:'arranca',  task:{ es:'la caja rompa el reposo y empiece a deslizarse', en:'the crate breaks out of rest and starts sliding' } },
    { k:'constante',task:{ es:'la caja ya deslizándose avance sin ganar ni perder rapidez', en:'the crate, already sliding, keeps moving without gaining or losing speed' } }
  ], rng);
  var rd = 0, tries = 0, locked = false, done = false;
  var sup = SUP[0], moving = false, v = 0, bx = 0, last = 0;
  var st = { W:0, H:0 };

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Banco de arrastre', en:'Drag bench' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs tall" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'tu jalón', en:'your pull' }) + '</span>' +
      '<input type="range" min="0" max="100" step="5" value="0" data-r="sf"><span class="gw-val" data-r="vf"></span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'jalón aplicado', en:'applied pull' }) + '</div><div class="gw-cv" data-r="ca"></div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'fricción', en:'friction' }) + '</div><div class="gw-cv" data-r="cf"></div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'fuerza neta', en:'net force' }) + '</div><div class="gw-cv" data-r="cn"></div></div>' +
    '</div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="rst">' + L({ es:'Regresar la caja', en:'Reset the crate' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var sf = host.querySelector('[data-r="sf"]'), vf = host.querySelector('[data-r="vf"]');
  var ca = host.querySelector('[data-r="ca"]'), cf = host.querySelector('[data-r="cf"]'), cn = host.querySelector('[data-r="cn"]');
  var elT = host.querySelector('[data-r="task"]'), elL = host.querySelector('[data-r="live"]');
  var elC = host.querySelector('[data-r="chk"]'), elR = host.querySelector('[data-r="rst"]'), elN = host.querySelector('[data-r="cnt"]');

  function F(){ return parseInt(sf.value, 10); }
  function fric(){ return moving ? sup.fk : Math.min(F(), sup.fs); }
  function net(){ return moving ? (F() - sup.fk) : 0; }

  function render(){
    var W = st.W, H = st.H, fy = H - 52, bw = 66, bh = 48, cxp = W / 2 + bx;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(8, fy + 4); ctx.lineTo(W - 8, fy + 4); ctx.stroke();
    var teeth = Math.round(W / 14);
    ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1;
    for (var i = 0; i < teeth; i++){
      var tx = 10 + i * 14, hgt = 3 + (sup.fs / 12);
      ctx.beginPath(); ctx.moveTo(tx, fy + 5); ctx.lineTo(tx + 5, fy + 5 + hgt); ctx.stroke();
    }
    label(ctx, L(sup.n), W - 12, fy + 22, cssv('--text3'), 11, 'right');
    ctx.fillStyle = cssv('--green-bg'); ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(cxp - bw / 2, fy - bh, bw, bh); ctx.fill(); ctx.stroke();
    label(ctx, L({ es:'caja', en:'crate' }), cxp, fy - bh / 2 + 4, cssv('--green'), 11);
    var ay = fy - bh / 2, sc = 0.85;
    if (F() > 0){
      arrow(ctx, cxp + bw / 2, ay, cxp + bw / 2 + F() * sc, ay, cssv('--green'), 4);
      label(ctx, F() + ' N', cxp + bw / 2 + F() * sc / 2, ay - 11, cssv('--green'), 11);
    }
    var fr = fric();
    if (fr > 0){
      arrow(ctx, cxp - bw / 2, ay, cxp - bw / 2 - fr * sc, ay, cssv('--gold'), 4);
      label(ctx, L({ es:'fricción ', en:'friction ' }) + fr + ' N', cxp - bw / 2 - fr * sc / 2, ay + 22, cssv('--gold'), 11);
    }
    var n = net();
    var ny = fy - bh - 18;
    if (n > 0){
      arrow(ctx, cxp, ny, cxp + Math.min(80, n * sc), ny, cssv('--bad'), 3);
      label(ctx, L({ es:'fuerza neta, gana rapidez', en:'net force, gaining speed' }), cxp, ny - 10, cssv('--bad'), 10);
    } else if (n < 0){
      arrow(ctx, cxp, ny, cxp - Math.min(80, Math.abs(n) * sc), ny, cssv('--bad'), 3);
      label(ctx, L({ es:'fuerza neta, pierde rapidez', en:'net force, losing speed' }), cxp, ny - 10, cssv('--bad'), 10);
    } else {
      label(ctx, L({ es:'fuerza neta = 0', en:'net force = 0' }), cxp, ny - 4, cssv('--ok'), 11);
    }
    label(ctx, moving ? L({ es:'deslizándose', en:'sliding' }) : L({ es:'en reposo', en:'at rest' }), 12, 20, moving ? cssv('--bad') : cssv('--ok'), 11, 'left');
  }

  function live(){
    vf.textContent = F() + ' N';
    ca.textContent = F() + ' N';
    cf.textContent = fric() + ' N';
    var n = net();
    cn.textContent = (n === 0 ? '0 N' : Math.abs(n) + ' N');
    var msg;
    if (!moving){
      msg = F() === 0
        ? L({ es:'Nadie jala la caja y no hay fricción que vencer. Sube tu jalón poco a poco.', en:'Nobody is pulling the crate and there is no friction to overcome. Raise your pull little by little.' })
        : L({ es:'La caja no se mueve: la fricción crece exactamente igual que tu jalón y la fuerza neta sigue en cero.', en:'The crate does not move: friction grows exactly as much as your pull and the net force stays at zero.' });
    } else if (n > 0){
      msg = L({ es:'La caja se desliza y cada instante va más rápido, porque tu jalón supera a la fricción.', en:'The crate slides and gets faster every instant, because your pull beats friction.' });
    } else if (n < 0){
      msg = L({ es:'La caja se desliza pero va frenando: ahora la fricción es mayor que tu jalón.', en:'The crate slides but is slowing down: now friction is greater than your pull.' });
    } else {
      msg = L({ es:'La caja se desliza sin cambiar de rapidez: tu jalón y la fricción son del mismo tamaño.', en:'The crate slides without changing speed: your pull and friction are the same size.' });
    }
    elL.innerHTML = msg;
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts;
    if (fitCanvas(cv, ctx, st)){
      if (!moving){ if (F() > sup.fs){ moving = true; v = 0.004; } }
      else {
        v += (F() - sup.fk) * 0.00007 * dt;
        if (v <= 0){ v = 0; moving = false; }
        bx += v * dt;
        var lim = st.W / 2 - 46;
        if (bx > lim){ bx = lim; v = 0; moving = false; }
      }
      render(); live();
    }
    requestAnimationFrame(frame);
  }

  function drawTask(){
    sup = SUP[rd % SUP.length];
    elT.innerHTML = L({ es:'Superficie: ', en:'Surface: ' }) + '<strong>' + L(sup.n) + '</strong>. ' +
      L({ es:'Ajusta tu jalón para que ', en:'Adjust your pull so that ' }) + L(TASKS[rd].task) + '.';
    elN.textContent = L({ es:'situación ', en:'situation ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function ok(){
    var k = TASKS[rd].k, f = F();
    if (k === 'quieto')    return !moving && f > 0;
    if (k === 'arranca')   return moving && f > sup.fs;
    return moving && f === sup.fk;
  }

  function nudge(){
    var k = TASKS[rd].k, f = F();
    if (k === 'quieto'){
      if (f === 0) return L({ es:'Con jalón cero la caja está quieta, pero sin nada que equilibrar. Sube el control sin llegar a arrancarla.', en:'With zero pull the crate is still, but with nothing to balance. Raise the control without getting it to start.' });
      return L({ es:'Te pasaste del punto en que la superficie deja de sostener a la caja: ya arrancó. Regresa la caja y prueba con un jalón menor.', en:'You went past the point where the surface stops holding the crate: it already started. Reset the crate and try a smaller pull.' });
    }
    if (k === 'arranca'){
      return L({ es:'Tu jalón todavía no vence a la fricción de reposo: la fricción lo iguala y la caja sigue pegada. Sube el control.', en:'Your pull does not yet beat the friction at rest: friction matches it and the crate stays put. Raise the control.' });
    }
    if (!moving) return L({ es:'Primero hay que despegarla: sube el jalón hasta que arranque y luego bájalo hasta emparejarlo con la fricción.', en:'First you have to get it going: raise the pull until it starts and then lower it to match friction.' });
    if (f > sup.fk) return L({ es:'La caja se sigue acelerando, tu jalón es mayor que la fricción. Bájalo un poco.', en:'The crate keeps accelerating, your pull is greater than friction. Lower it a little.' });
    return L({ es:'La caja va frenando, tu jalón quedó por debajo de la fricción. Súbelo un poco.', en:'The crate is slowing down, your pull ended up below friction. Raise it a little.' });
  }

  function reveal(){
    locked = true;
    var k = TASKS[rd].k;
    var txt = k === 'quieto'
      ? L({ es:'Mientras la caja está pegada, la fricción no tiene un valor fijo: vale lo mismo que tu jalón y por eso la fuerza neta se queda en cero. Cualquier jalón entre 1 N y ' + sup.fs + ' N sobre esta superficie la deja quieta.',
            en:'While the crate is stuck, friction has no fixed value: it equals your pull and that is why the net force stays at zero. Any pull between 1 N and ' + sup.fs + ' N on this surface leaves it still.' })
      : k === 'arranca'
      ? L({ es:'Sobre esta superficie la fricción de reposo alcanza como máximo ' + sup.fs + ' N. Con un jalón mayor que ese valor la caja se despega y empieza a deslizarse.',
            en:'On this surface the friction at rest reaches at most ' + sup.fs + ' N. With a pull greater than that value the crate comes loose and starts sliding.' })
      : L({ es:'Una vez deslizándose, la fricción de esta superficie se queda en ' + sup.fk + ' N. Con un jalón de ese mismo tamaño la fuerza neta vale cero y la caja avanza sin cambiar de rapidez.',
            en:'Once sliding, the friction of this surface stays at ' + sup.fk + ' N. With a pull of that same size the net force is zero and the crate moves on without changing speed.' });
    say(host, 'warm', txt);
    if (k === 'quieto'){ sf.value = Math.max(5, sup.fs - 5); moving = false; v = 0; }
    else if (k === 'arranca'){ sf.value = sup.fs + 5; }
    else { sf.value = sup.fk; moving = true; v = 0.05; }
    setTimeout(advance, 3000);
  }

  function advance(){
    rd++;
    if (rd >= TASKS.length){
      done = true; locked = true;
      elC.textContent = L({ es:'Completado', en:'Completed' }); elC.className = 'gw-btn solved'; elC.disabled = true;
      elN.textContent = '';
      say(host, 'good', L({
        es:'La misma caja sobre tres superficies distintas. La fricción nunca empujó a la caja: solo se opuso a que se deslizara, y su tamaño cambió según lo que estaba pasando.',
        en:'The same crate on three different surfaces. Friction never pushed the crate: it only opposed its sliding, and its size changed according to what was happening.'
      }));
      return;
    }
    locked = false; tries = 0; moving = false; v = 0; bx = 0; sf.value = 0;
    drawTask(); live();
    say(host, '', L({ es:'Nueva superficie. Mueve el control y observa la caja antes de comprobar.', en:'New surface. Move the control and watch the crate before checking.' }));
  }

  sf.addEventListener('input', function(){ if (!locked) live(); });
  elR.addEventListener('click', function(){ if (locked) return; moving = false; v = 0; bx = 0; sf.value = 0; live(); });
  elC.addEventListener('click', function(){
    if (locked || done) return;
    if (ok()){
      locked = true;
      say(host, 'good', L({ es:'Correcto. La caja quedó justo en la condición que pedía la situación.', en:'Correct. The crate ended up exactly in the condition the situation asked for.' }));
      setTimeout(advance, 1600);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    say(host, 'miss', nudge());
  });

  drawTask(); live();
  requestAnimationFrame(frame);
}

/* ══ MANIPULATIVO 2 ══ Rampa: hasta qué inclinación aguanta cada superficie ══ */
function wRampa(rng, host){
  var ROUNDS = shuffle([
    { n:{ es:'vidrio pulido', en:'polished glass' }, slip: ri(rng, 7, 10) },
    { n:{ es:'tabla de madera', en:'wooden board' }, slip: ri(rng, 18, 22) },
    { n:{ es:'lija gruesa', en:'coarse sandpaper' }, slip: ri(rng, 30, 34) }
  ], rng);
  var rd = 0, tries = 0, locked = false, best = [];
  var st = { W:0, H:0 }, slide = 0, last = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Rampa que se inclina', en:'Tilting ramp' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs tall" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'inclinación', en:'tilt' }) + '</span>' +
      '<input type="range" min="0" max="45" step="1" value="0" data-r="sa"><span class="gw-val" data-r="va"></span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'jalón cuesta abajo', en:'downhill pull' }) + '</div><div class="gw-cv" data-r="cd"></div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'agarre disponible', en:'available grip' }) + '</div><div class="gw-cv" data-r="cg"></div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'el bloque', en:'the block' }) + '</div><div class="gw-cv" data-r="ce"></div></div>' +
    '</div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Marcar este ángulo', en:'Mark this angle' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var sa = host.querySelector('[data-r="sa"]'), va = host.querySelector('[data-r="va"]');
  var cd = host.querySelector('[data-r="cd"]'), cg = host.querySelector('[data-r="cg"]'), ce = host.querySelector('[data-r="ce"]');
  var elT = host.querySelector('[data-r="task"]'), elL = host.querySelector('[data-r="live"]');
  var elC = host.querySelector('[data-r="chk"]'), elN = host.querySelector('[data-r="cnt"]');

  function A(){ return parseInt(sa.value, 10); }
  function cur(){ return ROUNDS[rd]; }
  function slipping(){ return A() > cur().slip; }
  function pull(){ return Math.round(A() * 2.2); }
  function grip(){ return Math.round(cur().slip * 2.2); }

  function render(){
    var W = st.W, H = st.H;
    ctx.clearRect(0, 0, W, H);
    var px = 26, py = H - 34, len = Math.min(W - 60, 300);
    var ang = A() * Math.PI / 180;
    var ex = px + len * Math.cos(ang), ey = py - len * Math.sin(ang);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + len, py); ctx.stroke();
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke(); ctx.lineCap = 'butt';
    var d = len * 0.62 - slide;
    if (d < 12) d = 12;
    var bxp = px + d * Math.cos(ang), byp = py - d * Math.sin(ang);
    ctx.save();
    ctx.translate(bxp, byp); ctx.rotate(-ang);
    ctx.fillStyle = cssv('--green-bg'); ctx.strokeStyle = slipping() ? cssv('--bad') : cssv('--green'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(-24, -34, 48, 32); ctx.fill(); ctx.stroke();
    label(ctx, L({ es:'bloque', en:'block' }), 0, -14, slipping() ? cssv('--bad') : cssv('--green'), 10);
    ctx.restore();
    label(ctx, A() + '°', px + 46, py - 8, cssv('--text3'), 12, 'left');
    label(ctx, L(cur().n), W - 12, 20, cssv('--gold'), 11, 'right');
    var bx0 = W - 122, by0 = 46, bw = 96;
    label(ctx, L({ es:'jalón cuesta abajo', en:'downhill pull' }), bx0, by0 - 6, cssv('--text3'), 9, 'left');
    ctx.fillStyle = cssv('--surface2'); ctx.fillRect(bx0, by0, bw, 10);
    ctx.fillStyle = cssv('--bad'); ctx.fillRect(bx0, by0, Math.min(bw, bw * A() / 45), 10);
    label(ctx, L({ es:'agarre de la superficie', en:'grip of the surface' }), bx0, by0 + 28, cssv('--text3'), 9, 'left');
    ctx.fillStyle = cssv('--surface2'); ctx.fillRect(bx0, by0 + 34, bw, 10);
    ctx.fillStyle = cssv('--ok'); ctx.fillRect(bx0, by0 + 34, Math.min(bw, bw * cur().slip / 45), 10);
    label(ctx, slipping() ? L({ es:'se desliza', en:'it slides' }) : L({ es:'sigue en su lugar', en:'still in place' }),
      12, 20, slipping() ? cssv('--bad') : cssv('--ok'), 11, 'left');
  }

  function live(){
    va.textContent = A() + '°';
    cd.textContent = pull() + ' N';
    cg.textContent = grip() + ' N';
    ce.textContent = slipping() ? L({ es:'baja', en:'slides' }) : L({ es:'quieto', en:'still' });
    elL.innerHTML = slipping()
      ? L({ es:'A esta inclinación el jalón cuesta abajo ya superó al agarre de la superficie y el bloque se va.', en:'At this tilt the downhill pull has already beaten the grip of the surface and the block goes.' })
      : L({ es:'La fricción está igualando al jalón cuesta abajo, así que las fuerzas siguen equilibradas y el bloque no baja.', en:'Friction is matching the downhill pull, so the forces stay balanced and the block does not go down.' });
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts;
    if (fitCanvas(cv, ctx, st)){
      if (slipping()) slide += 0.055 * dt * (1 + (A() - cur().slip) / 20);
      else slide = 0;
      render(); live();
    }
    requestAnimationFrame(frame);
  }

  function drawTask(){
    elT.innerHTML = L({ es:'Superficie de la rampa: ', en:'Ramp surface: ' }) + '<strong>' + L(cur().n) + '</strong>. ' +
      L({ es:'Sube la inclinación hasta el primer ángulo en que el bloque se suelta y márcalo ahí.',
          en:'Raise the tilt to the first angle at which the block lets go and mark it there.' });
    elN.textContent = L({ es:'rampa ', en:'ramp ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function ok(){ var a = A(), s = cur().slip; return a > s && a <= s + 3; }

  function nudge(){
    var a = A(), s = cur().slip;
    if (a <= s) return L({ es:'A ese ángulo el bloque todavía aguanta, la fricción alcanza a igualar al jalón cuesta abajo. Inclina un poco más.', en:'At that angle the block still holds on, friction manages to match the downhill pull. Tilt a little more.' });
    return L({ es:'El bloque ya se soltó bastante antes de ese ángulo. Baja la inclinación y busca el primer punto en que se suelta.', en:'The block let go well before that angle. Lower the tilt and look for the first point where it lets go.' });
  }

  function reveal(){
    locked = true;
    sa.value = cur().slip + 1;
    say(host, 'warm', L({
      es:'Sobre ' + L(cur().n) + ' el bloque aguanta hasta cerca de ' + cur().slip + '°. Pasado ese punto, la fricción ya no alcanza a igualar al jalón cuesta abajo y el bloque se desliza.',
      en:'On ' + L(cur().n) + ' the block holds up to about ' + cur().slip + '°. Past that point, friction can no longer match the downhill pull and the block slides.'
    }));
    best.push({ n: cur().n, s: cur().slip });
    setTimeout(advance, 3000);
  }

  function advance(){
    rd++;
    if (rd >= ROUNDS.length){
      var srt = best.slice().sort(function(a, b){ return b.s - a.s; });
      elC.textContent = L({ es:'Completado', en:'Completed' }); elC.className = 'gw-btn solved'; elC.disabled = true; elN.textContent = '';
      say(host, 'good', L({
        es:'Mismo bloque, mismo peso, tres superficies. Aguantó más inclinación sobre ' + L(srt[0].n) + ' y menos sobre ' + L(srt[srt.length - 1].n) + ': lo que cambió fue el par de superficies en contacto, no el bloque.',
        en:'Same block, same weight, three surfaces. It held more tilt on ' + L(srt[0].n) + ' and less on ' + L(srt[srt.length - 1].n) + ': what changed was the pair of surfaces in contact, not the block.'
      }));
      return;
    }
    locked = false; tries = 0; slide = 0; sa.value = 0;
    elC.textContent = L({ es:'Marcar este ángulo', en:'Mark this angle' });
    drawTask(); live();
    say(host, '', L({ es:'Rampa nueva con otra superficie. Inclina despacio y observa las dos barras.', en:'New ramp with another surface. Tilt slowly and watch the two bars.' }));
  }

  sa.addEventListener('input', function(){ if (!locked) live(); });
  elC.addEventListener('click', function(){
    if (locked) return;
    if (ok()){
      locked = true; best.push({ n: cur().n, s: cur().slip });
      say(host, 'good', L({ es:'Ese es el punto. Justo ahí el agarre de la superficie deja de alcanzar.', en:'That is the point. Right there the grip of the surface stops being enough.' }));
      setTimeout(advance, 1700);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    say(host, 'miss', nudge());
  });

  drawTask(); live();
  requestAnimationFrame(frame);
}

/* ══ MANIPULATIVO 3 ══ Taller: subir o bajar la fricción según convenga ══ */
function wTaller(rng, host){
  var UP = [
    { es:'Pegar una capa de hule bajo las patas', en:'Stick a rubber layer under the legs' },
    { es:'Cambiar la suela lisa por una con dibujo profundo', en:'Swap the smooth sole for one with deep tread' },
    { es:'Secar por completo el piso mojado', en:'Dry the wet floor completely' },
    { es:'Poner más peso encima para apretar el contacto', en:'Put more weight on top to press the contact' },
    { es:'Espolvorear resina sobre las manos antes de sujetar', en:'Sprinkle rosin on the hands before gripping' },
    { es:'Reemplazar las llantas gastadas por unas nuevas', en:'Replace the worn tyres with new ones' }
  ];
  var DOWN = [
    { es:'Colocar rodillos debajo del objeto', en:'Place rollers underneath the object' },
    { es:'Aplicar unas gotas de aceite en la unión', en:'Apply a few drops of oil at the joint' },
    { es:'Pulir la superficie hasta dejarla lisa', en:'Polish the surface until it is smooth' },
    { es:'Mojar la superficie con agua jabonosa', en:'Wet the surface with soapy water' },
    { es:'Montar el mueble sobre ruedas giratorias', en:'Mount the furniture on swivel wheels' },
    { es:'Espolvorear talco entre las dos piezas', en:'Sprinkle talc between the two pieces' }
  ];
  var GOALS = shuffle([
    { dir:'down', g:{ es:'Hay que mover un ropero pesado hasta el otro extremo del salón con el menor esfuerzo posible.', en:'A heavy wardrobe has to be moved to the other end of the room with the least possible effort.' } },
    { dir:'up',   g:{ es:'La escalera de tijera se desliza sobre el piso de loseta y hay que dejarla firme.', en:'The stepladder slips on the tiled floor and it has to be left firm.' } },
    { dir:'up',   g:{ es:'Una bicicleta tarda demasiado en frenar en una bajada y hay que mejorar su agarre.', en:'A bicycle takes too long to brake on a slope and its grip has to be improved.' } },
    { dir:'down', g:{ es:'La bisagra de una puerta rechina y cuesta trabajo abrirla.', en:'A door hinge squeaks and the door is hard to open.' } }
  ], rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Taller de superficies', en:'Surface workshop' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<div class="gw-mini" data-r="sub"></div>' +
    '<div class="gw-grid" data-r="grid"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Aplicar la solución', en:'Apply the solution' }) + '</button>' +
      '<button class="gw-btn" data-r="cl">' + L({ es:'Quitar todo', en:'Clear all' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var grid = host.querySelector('[data-r="grid"]');
  var elT = host.querySelector('[data-r="task"]'), elS = host.querySelector('[data-r="sub"]');
  var elC = host.querySelector('[data-r="chk"]'), elCl = host.querySelector('[data-r="cl"]'), elN = host.querySelector('[data-r="cnt"]');
  var items = [];

  function draw(){
    var goal = GOALS[rd];
    var good = shuffle(goal.dir === 'up' ? UP : DOWN, rng).slice(0, 3);
    var bad  = shuffle(goal.dir === 'up' ? DOWN : UP, rng).slice(0, 3);
    items = shuffle(good.map(function(x){ return { t:x, ok:true, on:false }; })
      .concat(bad.map(function(x){ return { t:x, ok:false, on:false }; })), rng);
    elT.innerHTML = L(goal.g);
    elS.innerHTML = goal.dir === 'up'
      ? L({ es:'Elige las tres intervenciones que aumentan la fricción entre las superficies que se tocan.', en:'Choose the three interventions that increase the friction between the surfaces in contact.' })
      : L({ es:'Elige las tres intervenciones que reducen la fricción entre las superficies que se tocan.', en:'Choose the three interventions that reduce the friction between the surfaces in contact.' });
    elN.textContent = L({ es:'encargo ', en:'job ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
    paint();
  }

  function paint(){
    grid.innerHTML = '';
    items.forEach(function(it, i){
      var b = document.createElement('button');
      b.className = 'gw-tile' + (it.on ? ' on' : '') + (it.mark === 'fix' ? ' fix' : '') + (it.mark === 'no' ? ' no' : '');
      b.type = 'button';
      b.innerHTML = L(it.t);
      if (locked) b.disabled = true;
      b.addEventListener('click', function(){
        if (locked) return;
        it.on = !it.on;
        paint();
        var sel = items.filter(function(x){ return x.on; }).length;
        say(host, '', sel === 0
          ? L({ es:'Sin intervenciones el problema sigue igual. Toca las que creas que sirven; puedes quitarlas otra vez.', en:'With no interventions the problem stays the same. Tap the ones you think help; you can remove them again.' })
          : L({ es:'Llevas ' + sel + ' de 3 intervenciones puestas.', en:'You have ' + sel + ' out of 3 interventions in place.' }));
      });
      grid.appendChild(b);
    });
  }

  function reveal(){
    locked = true;
    items.forEach(function(it){ it.mark = it.ok ? 'fix' : (it.on ? 'no' : ''); it.on = it.ok; });
    paint();
    var goal = GOALS[rd];
    say(host, 'warm', goal.dir === 'up'
      ? L({ es:'Las tres marcadas aumentan la fricción porque dejan superficies más rugosas o aprietan más el contacto. Las otras tres meten algo resbaloso entre las superficies o las alisan, y hacen justo lo contrario.',
            en:'The three marked ones increase friction because they leave rougher surfaces or press the contact harder. The other three put something slippery between the surfaces or smooth them out, and do exactly the opposite.' })
      : L({ es:'Las tres marcadas reducen la fricción porque separan las superficies con algo resbaloso o cambian el arrastre por rodadura. Las otras tres agarran más y harían el trabajo aún más pesado.',
            en:'The three marked ones reduce friction because they separate the surfaces with something slippery or swap dragging for rolling. The other three grip more and would make the job even heavier.' }));
    setTimeout(advance, 3400);
  }

  function advance(){
    rd++;
    if (rd >= GOALS.length){
      elC.textContent = L({ es:'Completado', en:'Completed' }); elC.className = 'gw-btn solved'; elC.disabled = true;
      elCl.disabled = true; elN.textContent = '';
      say(host, 'good', L({
        es:'Ninguna intervención fue buena o mala por sí sola: dependió de lo que se buscaba. La fricción estorba cuando quieres mover algo y sirve cuando quieres que algo no se mueva.',
        en:'No intervention was good or bad on its own: it depended on what was wanted. Friction gets in the way when you want to move something and helps when you want something not to move.'
      }));
      return;
    }
    locked = false; tries = 0;
    elC.textContent = L({ es:'Aplicar la solución', en:'Apply the solution' });
    draw();
    say(host, '', L({ es:'Encargo nuevo. Lee bien qué se busca antes de elegir.', en:'New job. Read carefully what is wanted before choosing.' }));
  }

  elCl.addEventListener('click', function(){ if (locked) return; items.forEach(function(it){ it.on = false; }); paint(); });
  elC.addEventListener('click', function(){
    if (locked) return;
    var sel = items.filter(function(x){ return x.on; });
    var wrong = sel.filter(function(x){ return !x.ok; }).length;
    var right = sel.length - wrong;
    if (sel.length !== 3){
      say(host, 'miss', sel.length < 3
        ? L({ es:'Todavía te faltan intervenciones por elegir: el encargo pide tres.', en:'You still have interventions left to choose: the job asks for three.' })
        : L({ es:'Elegiste de más. Quita alguna hasta dejar solo tres.', en:'You chose too many. Remove some until only three are left.' }));
      return;
    }
    if (wrong === 0){
      locked = true; paint();
      say(host, 'good', L({ es:'Las tres van en la dirección que pedía el encargo.', en:'All three go in the direction the job asked for.' }));
      setTimeout(advance, 1700);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    say(host, 'miss', L({
      es: right + L({ es:' de tus intervenciones van en la dirección correcta y ', en:' of your interventions go in the right direction and ' }) + wrong +
          L({ es:' hacen lo contrario de lo que se busca. Cámbialas y vuelve a aplicar.', en:' do the opposite of what is wanted. Change them and apply again.' }),
      en: right + ' of your interventions go in the right direction and ' + wrong + ' do the opposite of what is wanted. Change them and apply again.'
    }));
  });

  draw();
}

/* ══ MANIPULATIVO 4 ══ Tablero de equilibrio: clasificar escenas ══ */
function wEquilibrio(rng, host){
  var POOL = [
    { s:{ es:'Un librero apoyado en el piso, sin que nadie lo toque', en:'A bookcase resting on the floor, with nobody touching it' }, k:'reposo' },
    { s:{ es:'Una lámpara que cuelga inmóvil del techo', en:'A lamp hanging motionless from the ceiling' }, k:'reposo' },
    { s:{ es:'Un ropero empujado por dos personas con jalones iguales en sentidos contrarios, sin moverse', en:'A wardrobe pushed by two people with equal pulls in opposite directions, without moving' }, k:'reposo' },
    { s:{ es:'Un paracaidista que lleva un rato bajando siempre a la misma rapidez', en:'A skydiver who has been coming down at the same speed for a while' }, k:'constante' },
    { s:{ es:'Un elevador que sube entre dos pisos con el mismo ritmo todo el trayecto', en:'A lift going up between two floors at the same rate the whole way' }, k:'constante' },
    { s:{ es:'Un tren que avanza en línea recta con el marcador de rapidez fijo', en:'A train moving in a straight line with the speed reading fixed' }, k:'constante' },
    { s:{ es:'Una manzana que se acaba de soltar de la rama', en:'An apple that has just come loose from the branch' }, k:'cambia' },
    { s:{ es:'Un coche que frena al llegar al alto', en:'A car braking as it reaches the stop sign' }, k:'cambia' },

  ];
  var LBL = {
    reposo:{ es:'equilibrio, quieto', en:'balanced, still' },
    constante:{ es:'equilibrio, rapidez constante', en:'balanced, constant speed' },
    cambia:{ es:'sin equilibrio', en:'not balanced' }

  var ORDER = ['reposo', 'constante', 'cambia'];
  var scenes = shuffle(POOL, rng).slice(0, 5).map(function(x){ return { s:x.s, k:x.k, cur:0 }; });
  var tries = 0, locked = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Tablero de equilibrio', en:'Equilibrium board' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Toca cada escena hasta que su etiqueta describa lo que ocurre con las fuerzas.', en:'Tap each scene until its label describes what happens with the forces.' }) + '</div>' +
    '<div class="gw-mini">' + L({ es:'Las etiquetas van rotando entre las tres posibilidades y puedes cambiarlas cuantas veces quieras.', en:'The labels rotate between the three possibilities and you can change them as many times as you like.' }) + '</div>' +
    '<div data-r="list"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Revisar el tablero', en:'Review the board' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var list = host.querySelector('[data-r="list"]');
  var elC = host.querySelector('[data-r="chk"]'), elN = host.querySelector('[data-r="cnt"]');

  function paint(){
    list.innerHTML = '';
    scenes.forEach(function(sc, i){
      var d = document.createElement('div');
      d.className = 'gw-scene' + (sc.mark === 'fix' ? ' fix' : '') + (sc.mark === 'no' ? ' no' : '');
      d.innerHTML = '<div class="gw-st">' + L(sc.s) + '</div><div class="gw-lb">' + L(LBL[ORDER[sc.cur]]) + '</div>';
      d.addEventListener('click', function(){
        if (locked) return;
        sc.cur = (sc.cur + 1) % ORDER.length;
        paint();
      });
      list.appendChild(d);
    });
    var hits = scenes.filter(function(sc){ return ORDER[sc.cur] === sc.k; }).length;
    elN.textContent = hits + L({ es:' de ', en:' of ' }) + scenes.length;
  }

  function reveal(){
    locked = true;
    scenes.forEach(function(sc){
      sc.mark = ORDER[sc.cur] === sc.k ? 'fix' : 'no';
      sc.cur = ORDER.indexOf(sc.k);
      sc.mark = 'fix';
    });
    paint();
    elC.textContent = L({ es:'Completado', en:'Completed' }); elC.className = 'gw-btn solved'; elC.disabled = true;
    say(host, 'warm', L({
      es:'El tablero quedó ordenado. Estar quieto y avanzar en línea recta sin cambiar de rapidez son las dos maneras de tener las fuerzas equilibradas. En cambio, arrancar, frenar o desviarse siempre delata una fuerza neta distinta de cero.',
      en:'The board is now sorted. Being still and moving in a straight line without changing speed are the two ways of having balanced forces. On the other hand, starting, braking or veering always reveals a net force different from zero.'
    }));
  }

  elC.addEventListener('click', function(){
    if (locked) return;
    var bad = scenes.filter(function(sc){ return ORDER[sc.cur] !== sc.k; });
    if (bad.length === 0){
      locked = true;
      scenes.forEach(function(sc){ sc.mark = 'fix'; });
      paint();
      elC.textContent = L({ es:'Completado', en:'Completed' }); elC.className = 'gw-btn solved'; elC.disabled = true;
      say(host, 'good', L({
        es:'Todo el tablero coincide. Fíjate que la etiqueta nunca dependió de si el cuerpo se movía, sino de si su movimiento cambiaba.',
        en:'The whole board matches. Notice that the label never depended on whether the body was moving, but on whether its motion was changing.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    var over = bad.filter(function(sc){ return sc.k === 'cambia'; }).length;
    var under = bad.filter(function(sc){ return ORDER[sc.cur] === 'cambia'; }).length;
    var msg = L({ es:'Hay ' + bad.length + ' escenas que todavía no cuadran. ', en:'There are ' + bad.length + ' scenes that do not fit yet. ' });
    if (over > 0) msg += L({ es:'En alguna marcaste como equilibrada una escena donde el movimiento sí está cambiando.', en:'In one of them you marked as balanced a scene where the motion is indeed changing.' });
    else if (under > 0) msg += L({ es:'En alguna dijiste que no hay equilibrio, pero ahí el movimiento se mantiene tal cual.', en:'In one of them you said there is no balance, but there the motion stays just as it was.' });
    else msg += L({ es:'Revisa cuáles están quietas y cuáles avanzan sin cambiar de rapidez: son dos etiquetas distintas.', en:'Check which ones are still and which move on without changing speed: those are two different labels.' });
    say(host, 'miss', msg);
  });

  paint();
  say(host, '', L({ es:'Empieza tocando la primera escena. El contador de arriba te dice cuántas coinciden por ahora.', en:'Start by tapping the first scene. The counter above tells you how many match so far.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson  ::  concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Lo que no te deja resbalar y lo que no te deja avanzar', en:'What keeps you from slipping and what keeps you from advancing' }),
    '<p>' + L({
      es:'Un ropero pesado no se mueve por más que dos personas lo empujen, y de pronto, con un empujón apenas mayor, arranca de golpe. Un vaso olvidado sobre una charola inclinada aguanta ahí sin bajar. Un piso recién trapeado convierte un pasillo tranquilo en una zona de caídas.',
      en:'A heavy wardrobe does not move no matter how much two people push it, and suddenly, with a barely bigger push, it starts all at once. A glass left on a tilted tray holds there without going down. A freshly mopped floor turns a quiet corridor into a falling zone.'
    }) + '</p>' +
    '<p>' + L({
      es:'Las tres escenas hablan de la misma fuerza: la fricción, que aparece cada vez que dos superficies se tocan. En esta guía vas a decidir hacia dónde apunta, de qué depende su tamaño, cuándo conviene aumentarla y cuándo reducirla, y cómo se combina con las demás fuerzas para dejar a un cuerpo en equilibrio.',
      en:'The three scenes speak about the same force: friction, which appears every time two surfaces touch. In this guide you will decide which way it points, what its size depends on, when it is worth increasing it and when reducing it, and how it combines with the other forces to leave a body in equilibrium.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'la fricción nunca inicia un movimiento, siempre se opone a que dos superficies se deslicen una sobre la otra. Y un cuerpo con fuerzas equilibradas no es un cuerpo sin fuerzas, sino uno cuyo movimiento no cambia.',
      en:'friction never starts a motion, it always opposes two surfaces sliding over each other. And a body with balanced forces is not a body without forces, but one whose motion does not change.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'De dónde sale la fricción y hacia dónde apunta', en:'Where friction comes from and which way it points' }),
    '<p>' + L({
      es:'Ninguna superficie es realmente lisa. Vistas de muy cerca, incluso una loseta pulida y la suela de un zapato tienen salientes y hundimientos que se traban entre sí. De ese trabado nace la fricción: una fuerza de contacto que aparece siempre que dos superficies se tocan y una intenta deslizarse sobre la otra.',
      en:'No surface is really smooth. Seen very closely, even a polished tile and the sole of a shoe have bumps and hollows that catch on each other. From that catching comes friction: a contact force that appears whenever two surfaces touch and one tries to slide over the other.'
    }) + '</p>' +
    '<p>' + L({
      es:'Su dirección nunca es libre: la fricción se opone al deslizamiento entre las dos superficies. Si arrastras una caja hacia la derecha, la fricción del piso sobre la caja jala hacia la izquierda. Por eso un objeto lanzado sobre el suelo va perdiendo rapidez aunque ya nadie lo toque.',
      en:'Its direction is never free: friction opposes the sliding between the two surfaces. If you drag a crate to the right, the friction of the floor on the crate pulls to the left. That is why an object launched across the ground loses speed even though nobody touches it any more.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Origen', en:'Origin' }), L({ es:'contacto', en:'contact' }), L({ es:'nace del roce entre dos superficies, nunca de una sola', en:'it is born from the rubbing between two surfaces, never from one alone' })) +
      rcard(L({ es:'Dirección', en:'Direction' }), L({ es:'en contra', en:'against' }), L({ es:'siempre apunta al revés del deslizamiento o del intento de deslizarse', en:'it always points opposite to the sliding or to the attempt to slide' })) +
      rcard(L({ es:'Efecto', en:'Effect' }), L({ es:'frena', en:'it slows' }), L({ es:'reduce la rapidez de lo que se desliza y sostiene lo que aún no arranca', en:'it reduces the speed of what slides and holds what has not started yet' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Un empujón termina en cuanto la mano se separa. Lo que sigue actuando sobre el objeto durante todo el recorrido es la fricción, y por eso nada se desliza para siempre sobre un piso real.',
      en:'A push ends as soon as the hand lets go. What keeps acting on the object during the whole trip is friction, and that is why nothing slides forever on a real floor.'
    }) + '</p></div>'
  );
  wArrastre(rng, widgetHost(s1, 'w_arrastre'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Dos fricciones distintas: la que sostiene y la que frena', en:'Two different frictions: the one that holds and the one that slows' }),
    '<p>' + L({
      es:'Mientras un objeto sigue pegado a la superficie, la fricción no tiene un tamaño fijo. Se ajusta: vale exactamente lo mismo que el jalón que recibe, en sentido contrario, y por eso el objeto no se mueve. A esa se le llama fricción de reposo, y puede crecer solo hasta cierto tope.',
      en:'While an object stays stuck to the surface, friction has no fixed size. It adjusts: it equals exactly the pull it receives, in the opposite direction, and that is why the object does not move. That one is called friction at rest, and it can grow only up to a certain limit.'
    }) + '</p>' +
    '<p>' + L({
      es:'En cuanto el jalón supera ese tope, el objeto se despega y empieza a deslizarse. Entonces entra en juego la fricción de deslizamiento, que se mantiene casi constante y resulta menor que el tope anterior. Por eso el primer tirón de un mueble cuesta más trabajo que mantenerlo en movimiento.',
      en:'As soon as the pull beats that limit, the object comes loose and starts sliding. Then sliding friction comes into play, which stays almost constant and turns out smaller than the previous limit. That is why the first tug on a piece of furniture takes more effort than keeping it moving.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Jalón por debajo del tope', en:'Pull below the limit' }), L({ es:'no arranca', en:'it does not start' }), L({ es:'la fricción de reposo iguala el jalón y la fuerza neta se queda en cero', en:'friction at rest matches the pull and the net force stays at zero' })) +
      rcard(L({ es:'Jalón por encima del tope', en:'Pull above the limit' }), L({ es:'arranca', en:'it starts' }), L({ es:'el objeto se despega y a partir de ahí se desliza', en:'the object comes loose and from there it slides' })) +
      rcard(L({ es:'Ya deslizándose', en:'Already sliding' }), L({ es:'fricción menor', en:'smaller friction' }), L({ es:'mantener el movimiento pide menos jalón que iniciarlo', en:'keeping the motion going asks for less pull than starting it' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Una rampa mide ese tope sin necesidad de jalar nada. Conforme se inclina, crece la parte del peso que tiende a llevar el objeto cuesta abajo; el objeto se suelta justo cuando esa parte supera lo que la fricción de reposo alcanza a dar.',
      en:'A ramp measures that limit without pulling anything. As it tilts, the part of the weight that tends to take the object downhill grows; the object lets go exactly when that part beats what friction at rest manages to give.'
    }) + '</p></div>'
  );
  wRampa(rng, widgetHost(s2, 'w_rampa'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'De qué depende la fricción y cómo se le mueve el tamaño', en:'What friction depends on and how its size is changed' }),
    '<p>' + L({
      es:'Dos cosas deciden el tamaño de la fricción entre dos cuerpos. La primera es el par de superficies que se tocan: hule contra cemento agarra mucho más que hielo contra metal, y siempre son las dos superficies juntas, no una sola. La segunda es qué tanto se aprietan una contra la otra: mientras más carga hay encima, mayor es la fricción.',
      en:'Two things decide the size of the friction between two bodies. The first is the pair of surfaces that touch: rubber against cement grips much more than ice against metal, and it is always the two surfaces together, not one alone. The second is how hard they press against each other: the more load there is on top, the greater the friction.'
    }) + '</p>' +
    '<p>' + L({
      es:'También cambia mucho según el objeto se arrastre o ruede. Una base que raspa el piso produce fricción por deslizamiento, grande; una rueda que gira sobre el mismo piso produce fricción por rodadura, bastante menor. Por eso el mismo refrigerador que casi no se mueve arrastrando se lleva con facilidad sobre una plataforma con ruedas.',
      en:'It also changes a lot depending on whether the object drags or rolls. A base that scrapes the floor produces sliding friction, which is large; a wheel turning on the same floor produces rolling friction, which is considerably smaller. That is why the same fridge that hardly moves when dragged is carried easily on a wheeled platform.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Superficies rugosas', en:'Rough surfaces' }), L({ es:'más fricción', en:'more friction' }), L({ es:'suelas con dibujo, llantas nuevas, tapetes de hule', en:'patterned soles, new tyres, rubber mats' })) +
      rcard(L({ es:'Algo resbaloso en medio', en:'Something slippery in between' }), L({ es:'menos fricción', en:'less friction' }), L({ es:'aceite, cera, agua o talco separan las superficies', en:'oil, wax, water or talc separate the surfaces' })) +
      rcard(L({ es:'Rodar en vez de arrastrar', en:'Rolling instead of dragging' }), L({ es:'menos fricción', en:'less friction' }), L({ es:'ruedas, rodillos y baleros cambian el tipo de contacto', en:'wheels, rollers and bearings change the type of contact' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Ninguna de estas intervenciones es buena o mala por sí sola. Lubricar la cadena de una bicicleta la mejora y lubricar sus frenos la vuelve peligrosa: lo que decide es si en esa pieza la fricción estorba o es justamente la que hace el trabajo.',
      en:'None of these interventions is good or bad on its own. Lubricating the chain of a bicycle improves it and lubricating its brakes makes it dangerous: what decides is whether friction gets in the way in that part or is precisely the thing doing the job.'
    }) + '</p></div>'
  );
  wTaller(rng, widgetHost(s3, 'w_taller'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Fuerzas en equilibrio: quieto o avanzando parejo', en:'Balanced forces: still or moving evenly' }),
    '<p>' + L({
      es:'Se dice que las fuerzas sobre un cuerpo están en equilibrio cuando el resultado de juntarlas todas vale cero. Eso no significa que no haya fuerzas: significa que se compensan entre ellas. Un cuerpo en equilibrio conserva su movimiento tal como estaba, y esa condición admite dos formas.',
      en:'The forces on a body are said to be in equilibrium when the result of putting them all together is zero. That does not mean there are no forces: it means they compensate each other. A body in equilibrium keeps its motion just as it was, and that condition takes two forms.'
    }) + '</p>' +
    '<p>' + L({
      es:'La primera es estar quieto, como un cartel colgado o una caja apoyada en el piso. La segunda es avanzar en línea recta sin cambiar de rapidez, como un camión con el marcador fijo en carretera. En cambio, arrancar, frenar o desviarse delata siempre una fuerza neta distinta de cero.',
      en:'The first is being still, like a hanging sign or a box resting on the floor. The second is moving in a straight line without changing speed, like a truck with a fixed reading on the road. On the other hand, starting, braking or veering always reveals a net force different from zero.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Equilibrio en reposo', en:'Equilibrium at rest' }), L({ es:'fuerza neta cero', en:'zero net force' }), L({ es:'el peso queda compensado por el apoyo o por el jalón de una cuerda', en:'the weight is compensated by the support or by the pull of a rope' })) +
      rcard(L({ es:'Equilibrio en movimiento', en:'Equilibrium in motion' }), L({ es:'fuerza neta cero', en:'zero net force' }), L({ es:'el empuje del motor queda compensado por la fricción y el aire', en:'the drive of the engine is compensated by friction and the air' })) +
      rcard(L({ es:'Sin equilibrio', en:'No equilibrium' }), L({ es:'fuerza neta distinta de cero', en:'non zero net force' }), L({ es:'la rapidez sube, baja o la trayectoria se curva', en:'the speed goes up, goes down or the path bends' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La pregunta útil nunca es si el cuerpo se mueve, sino si su movimiento está cambiando. Una paracaidista que baja siempre a la misma rapidez está tan en equilibrio como un librero que lleva años en el mismo rincón.',
      en:'The useful question is never whether the body moves, but whether its motion is changing. A skydiver coming down always at the same speed is as much in equilibrium as a bookcase that has spent years in the same corner.'
    }) + '</p></div>'
  );
  wEquilibrio(rng, widgetHost(s4, 'w_equilibrio'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Decidir y comprobar', en:'Deciding and checking' }),
    '<p>' + L({
      es:'Las dos últimas situaciones salen del salón: una pide tomar una decisión práctica frente a un problema real y la otra pide revisar cómo se pone a prueba una idea sobre la fricción con una observación bien armada.',
      en:'The last two situations leave the classroom: one asks for a practical decision in the face of a real problem and the other asks you to review how an idea about friction is tested with a well built observation.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Fricción y Fuerzas en Equilibrio';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
