<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIAXA · Ejercicios hechos a tu medida</title>
<meta name="description" content="Describe los ejercicios que quieres y LIAXA los crea en segundos: números distintos para cada alumno y calificación automática.">
<meta property="og:title" content="LIAXA · Ejercicios hechos a tu medida. En segundos.">
<meta property="og:description" content="Describe los ejercicios que quieres y LIAXA los crea en segundos: números distintos para cada alumno y calificación automática.">
<meta property="og:image" content="https://liaxa.mx/logo.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1a1a2e">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one app shell; landing and code screens on the navy hero, the app on a dotted blue-tint field with the form docked right. Single light theme by choice (LIAXA brand). */
:root{
  --paper:#f6f5f0;--surface:#ffffff;--surface-2:#f0ede6;--line:#e2ddd4;
  --ink:#18180f;--ink-2:#52504a;--ink-3:#9a9690;
  --navy:#1a1a2e;--blue:#1a3a6b;--blue-tint:#e7ecf3;--navy-tint:#ebebf0;
  --gold:#c9a84c;--gold-deep:#a07830;
  --on-navy:#ffffff;--on-navy-muted:rgba(255,255,255,.72);
  --danger:#9b3232;--success:#1f6b47;--success-tint:#e6f4ec;
  --display:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.gut{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;border-bottom:1px solid var(--line)}
.logo{height:34px;width:auto;display:block}
.goldbar{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
.nav{display:flex;align-items:center;gap:18px}
.nav a,.nav .lnk{color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.9rem;background:none;border:0;padding:6px 2px}
.nav a:hover,.nav .lnk:hover{color:var(--blue)}
.nav .on{color:var(--blue);font-weight:600;box-shadow:inset 0 -2px 0 var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;padding:6px 10px;font:600 .72rem var(--sans);background:var(--surface);color:var(--ink-2)}
.lang button[aria-pressed=true]{background:var(--blue);color:#fff}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:4px 12px 4px 4px;font:500 .84rem var(--sans);color:var(--ink-2);min-height:40px}
.av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font:700 .82rem var(--display)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.14);padding:8px;display:flex;flex-direction:column}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:.82rem;color:var(--ink-2);overflow-wrap:anywhere}
.menu button{text-align:left;background:none;border:0;padding:10px;border-radius:8px;font-size:.92rem;color:var(--ink)}
.menu button:hover{background:var(--blue-tint)}
.hide-sm{}
@media (max-width:760px){.hide-sm{display:none!important}}
.pillgold{background:var(--gold);color:var(--navy);border:0;border-radius:100px;padding:8px 16px;font:600 .85rem var(--sans)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid transparent;font:600 .95rem var(--sans);text-decoration:none;transition:filter .15s,background .15s,border-color .15s}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{filter:brightness(.9)}
.btn-s{background:var(--surface);color:var(--blue);border-color:var(--line)}
.btn-s:hover{border-color:var(--blue);background:var(--blue-tint)}
.btn-g{background:var(--gold);color:var(--navy)}
.btn-g:hover{filter:brightness(.95)}
.btn-round{border-radius:100px}
.btn[disabled]{opacity:.6;cursor:default}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:56px;background:var(--paper);clip-path:polygon(0 100%,100% 0,100% 100%)}
.hero-in{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:center;padding-block:64px 140px}
@media (max-width:980px){.hero-in{grid-template-columns:minmax(0,1fr);gap:40px;padding-block:40px 110px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:400 .72rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--on-navy-muted)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
h1.big{margin:0;font:700 clamp(2.1rem,4.6vw,3.6rem)/1.1 var(--display);text-wrap:balance}
h1.big em{color:var(--gold);font-style:italic}
.lead{margin:0;max-width:520px;color:var(--on-navy-muted);font-size:1.02rem;line-height:1.7}
.entry{display:flex;flex-direction:column;gap:10px;max-width:520px}
.entry label{font-size:.8rem;font-weight:600;color:var(--on-navy-muted)}
.entry-row{display:flex;gap:10px;flex-wrap:wrap}
.entry-row input{flex:1 1 240px;min-width:0;min-height:52px;padding:0 16px;border:0;border-radius:10px;background:#fff;color:var(--navy);font-size:1rem}
.entry-row .btn{min-height:52px;min-width:180px;font-size:1rem}
@media (max-width:560px){.entry-row .btn{flex:1 1 100%}}
.err{color:#ffd9d9;font-size:.86rem;margin:0}
.sample{position:relative;min-width:0}
.card{background:var(--surface);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.req{display:flex;gap:10px;align-items:center;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.88rem;color:var(--ink-2)}
.tu{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--blue-tint);color:var(--blue);display:flex;align-items:center;justify-content:center;font:600 .7rem var(--sans)}
.sheet-head{position:relative;padding:16px 20px 14px;background:var(--blue);color:#fff;background-image:radial-gradient(circle,rgba(255,255,255,.09) 1.2px,transparent 1.3px);background-size:22px 22px}
.status{display:flex;align-items:center;gap:8px;font:500 .74rem var(--sans);opacity:.9}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.sheet-head h2{margin:6px 0 3px;font:600 1.4rem/1.2 var(--display)}
.sheet-head .meta{font-size:.8rem;opacity:.88}
.xbtn{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:1.2rem}
.sheet-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.sheet-acts .btn{min-height:40px;padding:0 14px;font-size:.86rem}
.exs{list-style:none;margin:0;padding:0}
.exs li{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.exs li:last-child{border-bottom:0}
.exn{display:flex;align-items:flex-start;gap:10px}
.num{flex-shrink:0;width:25px;height:25px;border-radius:50%;background:var(--blue);color:#fff;font:700 .76rem var(--sans);display:flex;align-items:center;justify-content:center}
.ans{align-self:flex-start;margin-left:35px;font-size:.86rem;font-weight:600;color:var(--success);background:var(--success-tint);border-radius:100px;padding:3px 12px}
.more{padding:10px 20px 14px;font-size:.84rem;color:var(--ink-2)}
.chip-ok{position:absolute;left:-18px;bottom:-24px;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,.3);font-size:.85rem;font-weight:500}
@media (max-width:560px){.chip-ok{left:8px}}

/* footer */
.foot{max-width:1180px;margin:0 auto;padding-block:44px 34px;display:flex;flex-direction:column;gap:24px}
.foot-top{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
.foot nav{display:flex;gap:48px;flex-wrap:wrap}
.foot h3{margin:0 0 8px;font:700 .74rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep)}
.foot .col{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.foot .col a,.foot .col span,.foot .col button{color:var(--blue);text-decoration:none;background:none;border:0;padding:0;text-align:left}
.foot-bot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2)}

/* code screen */
.codebox{position:relative;z-index:1;max-width:460px;margin:0 auto;padding-block:56px 130px}
.wcard{background:var(--surface);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.wcard::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
.wcard-in{padding:30px 28px 26px;display:flex;flex-direction:column;gap:20px}
@media (max-width:480px){.wcard-in{padding:24px 18px 22px}}
.wcard h1{margin:0;font:600 1.55rem/1.2 var(--display);color:var(--navy)}
.digits{display:flex;gap:8px;justify-content:space-between}
.digits input{width:100%;max-width:54px;height:60px;border:1.5px solid var(--line);border-radius:12px;text-align:center;font:600 1.55rem var(--sans);color:var(--navy);background:var(--surface)}
.digits input:focus{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.chk{display:flex;align-items:center;gap:10px;font-size:.92rem;min-height:44px}
.chk input{width:19px;height:19px;accent-color:var(--blue)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);animation:sp 0.9s linear infinite;margin:0 auto}
.spin.dark{border-color:var(--surface-2);border-top-color:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}

/* app */
.app{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);background:var(--blue-tint);background-image:radial-gradient(circle,rgba(26,58,107,.12) 1.2px,transparent 1.3px);background-size:22px 22px;min-height:calc(100vh - 65px)}
.left{min-width:0;display:flex;flex-direction:column;gap:20px;padding:26px 24px 30px}
.left-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:260px;text-align:center}
.left-center p{margin:0;font:600 1.3rem var(--display);color:var(--navy)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:26px;max-width:430px}
.steps li{display:flex;gap:18px;align-items:center;font-size:1.05rem;line-height:1.45;color:var(--ink-2)}
.steps b{color:var(--navy);font-weight:600}
.stepn{flex-shrink:0;width:56px;height:56px;border-radius:50%;background:var(--surface);box-shadow:0 6px 18px rgba(26,58,107,.14);display:flex;align-items:center;justify-content:center;font:700 1.6rem/1 var(--display);color:var(--gold-deep)}
.wrap820{width:100%;max-width:820px;align-self:center;display:flex;flex-direction:column;gap:8px}
.quote{font-size:.86rem;color:var(--ink-2);border-left:3px solid var(--gold);padding:2px 0 2px 10px;overflow-wrap:anywhere}
.active-sheet{box-shadow:0 0 0 3px var(--gold),0 14px 36px rgba(26,58,107,.22)}
.changed{padding:8px 20px;background:var(--surface-2);font-size:.82rem;color:var(--ink-2)}
.toggle{align-self:center;display:inline-flex;align-items:center;gap:8px;background:none;border:0;min-height:44px;padding:0 14px;font:600 .95rem var(--sans);color:var(--blue)}
.rows{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
.row-b{flex:1;min-width:0}
.row-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m{font-size:.78rem;color:var(--ink-2)}
.tag{background:var(--surface-2);color:var(--ink-2);padding:1px 7px;border-radius:4px;font-size:.7rem;font-weight:600;margin-right:4px}
.rbtn{flex-shrink:0;border:1px solid var(--line);background:none;border-radius:6px;padding:6px 10px;font:500 .78rem var(--sans);color:var(--ink-2);min-height:34px}
.rbtn:hover{color:var(--blue);border-color:var(--blue);background:var(--blue-tint)}

.side{min-width:0;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px 0;display:flex}
.form{flex:1;display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 14px 36px rgba(26,58,107,.22);position:sticky;top:90px;max-height:calc(100vh - 112px)}
.form-head{padding:15px 20px;background:var(--blue);background-image:radial-gradient(circle,rgba(255,255,255,.08) 1.2px,transparent 1.3px);background-size:24px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.form-head .t{font:600 1.12rem var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-head label{display:flex;align-items:center;gap:8px;font:500 .8rem var(--sans)}
.form-head input{width:16px;height:16px;accent-color:var(--gold)}
.form-head .ghost{background:none;border:1.5px solid var(--on-navy-muted);border-radius:100px;padding:6px 14px;font:600 .8rem var(--sans);color:#fff;flex-shrink:0}
.form-b{flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 20px 20px;min-height:0;overflow:auto}
.form-b textarea{flex:1;min-height:180px;resize:none;padding:14px 16px;border:2px solid var(--gold);border-radius:14px;background:var(--surface);font:400 1rem/1.5 var(--sans);color:var(--ink)}
.attached{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 10px}
.attached button{margin-left:auto;background:none;border:0;color:var(--ink-2);font-size:1.1rem;line-height:1}
.main-btn{min-height:52px;border-radius:100px;font-size:1rem;font-weight:700}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-l{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:100px}
.bar i.full{background:var(--gold-deep)}
.small{font-size:.82rem;color:var(--ink-2);margin:0}
.lim h2{margin:4px 0 0;font:600 1.35rem/1.25 var(--display);color:var(--navy)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.opt:hover{border-color:var(--blue)}
.opt .ot{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt b{font:600 .96rem var(--sans);color:var(--navy)}
.opt small{font-size:.8rem;line-height:1.4;color:var(--ink-2)}
.opt .pr{font:700 1.12rem var(--display);color:var(--navy);white-space:nowrap}
.opt.hl{background:var(--navy);border:2px solid var(--gold);color:#fff;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px}
.opt.hl b{color:#fff}.opt.hl small{color:var(--on-navy-muted)}.opt.hl .pr{color:var(--gold)}
.badge{display:inline-block;font:600 .66rem var(--sans);background:var(--gold);color:var(--navy);border-radius:100px;padding:2px 9px;margin-left:6px;vertical-align:2px}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--ink-2);font-size:.95rem}

/* phone bottom bar */
.pbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);min-height:auto}
  .side{order:-1;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .form{position:static;max-height:none}
  .form-b textarea{min-height:170px;flex:none;height:190px}
  .left{padding:16px max(16px,env(safe-area-inset-left,0px)) 110px}
  .app.has-sheet .side{display:none}
  .app.has-sheet.show-form .side{display:flex}
  .app.has-sheet.show-form .left{display:none}
  .pbar{display:flex;flex-direction:column;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(26,58,107,.12);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .app:not(.has-sheet) ~ .pbar,.app.show-form ~ .pbar{display:none}
  .left-center{min-height:120px}
  .steps{gap:18px}.stepn{width:46px;height:46px;font-size:1.35rem}.steps li{font-size:.98rem}
}
.pbar-row{display:flex;gap:8px}
.pbar input{flex:1;min-width:0;min-height:46px;padding:0 14px;border:2px solid var(--gold);border-radius:100px;font-size:.92rem}
.back{align-self:flex-start;display:none;align-items:center;gap:6px;background:none;border:0;min-height:40px;padding:0;font:600 .9rem var(--sans);color:var(--blue)}
@media (max-width:900px){.app.has-sheet .back{display:inline-flex}}

/* modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(14,20,40,.55);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.dlg{position:relative;width:100%;background:var(--surface);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28);max-height:calc(100vh - 48px);overflow:auto}
.dlg::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
.dlg-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:1.3rem}
.dlg-in{padding:26px 28px 26px;display:flex;flex-direction:column;gap:20px}
@media (max-width:600px){.scrim{padding:0;align-items:stretch}.dlg{border-radius:0;max-height:none;min-height:100%}.dlg-in{padding:22px 18px 28px}}
.dlg h2{margin:0;font:600 1.55rem/1.2 var(--display);color:var(--navy);padding-right:48px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.plans{grid-template-columns:minmax(0,1fr)}}
.plan{border:1.5px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.plan .k{font:700 .74rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep)}
.plan .p{display:flex;align-items:baseline;gap:6px}
.plan .p b{font:700 2.2rem/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.plan .p span,.plan .pp{font-size:.86rem;color:var(--ink-2)}
.plan .btn{margin-top:auto}
.plan.hl{background:var(--navy);border:2px solid var(--gold);color:#fff;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px}
.plan.hl .k{color:var(--gold)}.plan.hl .p b{color:#fff}.plan.hl .p span,.plan.hl .pp{color:var(--on-navy-muted)}
.incl{display:flex;flex-wrap:wrap;gap:8px 20px;padding:14px 16px;background:var(--paper);border-radius:12px;font-size:.86rem}
.send{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:20px}
@media (max-width:760px){.send{grid-template-columns:minmax(0,1fr)}}
.sopt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.sopt[aria-pressed=true]{border:2px solid var(--blue);background:var(--blue-tint)}
.dot{flex-shrink:0;margin-top:3px;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:#fff}
.sopt[aria-pressed=true] .dot{border:5px solid var(--blue)}
.sopt b{display:block;font:600 .95rem var(--sans);color:var(--navy)}
.sopt small{font-size:.82rem;line-height:1.4;color:var(--ink-2)}
.panel{display:flex;flex-direction:column;gap:13px;padding:18px;background:var(--paper);border-radius:14px;min-width:0}
.fld{display:flex;flex-direction:column;gap:5px;font:500 .8rem var(--sans);color:var(--ink-2)}
.fld input,.fld select{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--navy);font-size:.94rem}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chk2{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;line-height:1.4;color:var(--ink)}
.chk2 input{width:17px;height:17px;margin-top:2px;accent-color:var(--blue);flex-shrink:0}
.dlg-acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.linkbox{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1.5px dashed var(--blue);border-radius:10px;background:var(--surface);font:500 .95rem var(--mono);color:var(--navy);overflow-wrap:anywhere}

/* grades */
.grades{max-width:1360px;margin:0 auto;padding-block:26px 40px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.gside{flex:1 1 250px;max-width:300px;min-width:0;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.gside{max-width:none}}
.gsheet{display:flex;flex-direction:column;gap:2px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.gsheet[aria-pressed=true]{border-color:var(--blue);background:var(--blue-tint)}
.gsheet b{font:600 .9rem var(--sans);color:var(--navy)}
.gsheet span{font-size:.78rem;color:var(--ink-2)}
.gmain{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px}
.stat span{font-size:.8rem;color:var(--ink-2)}
.stat b{display:block;font:700 1.8rem/1.2 var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.lower{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
@media (max-width:1100px){.lower{grid-template-columns:minmax(0,1fr)}}
.tbl{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.tbl-sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th{background:var(--surface-2);text-align:left;font:600 .76rem var(--sans);color:var(--ink-2);padding:11px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);white-space:nowrap}
.r{text-align:right}
.alert{font-size:.78rem;font-weight:600;color:var(--danger);background:var(--surface-2);border-radius:100px;padding:2px 10px}
.qbars{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:9px}
.qb{display:grid;grid-template-columns:38px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:.84rem}
.qb .tr{height:10px;border-radius:100px;background:var(--surface-2);overflow:hidden}
.qb .tr i{display:block;height:100%;background:var(--blue);border-radius:100px}
.qb.hard .tr i{background:var(--gold-deep)}
.qb.hard b{color:var(--gold-deep)}

/* toast + prototype helper */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:11px 20px;border-radius:24px;box-shadow:0 4px 20px rgba(0,0,0,.3);font:500 .88rem var(--sans);max-width:calc(100vw - 32px);text-align:center}
@media (max-width:900px){.toast.up{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}*{transition:none!important}}
/* ── added for the live page ── */
html,body{min-height:100%}
.digits input:disabled{opacity:.6}
.notice{margin:0;padding:10px 12px;border-radius:10px;background:var(--blue-tint);color:var(--navy);font-size:.88rem;line-height:1.45}
.notice.bad{background:#fbeaea;color:var(--danger)}
.err-dark{margin:0;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.1);color:#ffe2e2;font-size:.88rem;line-height:1.45}
.lnk-gold{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.lnk-blue{background:none;border:0;padding:0;color:var(--blue);font-weight:600}
.lnk-blue[disabled]{color:var(--ink-3);cursor:default;font-weight:500}
.soon{font-size:.8rem;color:var(--ink-3);margin:0;text-align:center}
.boot{min-height:calc(100vh - 65px);display:flex;align-items:center;justify-content:center}
</style>
</head>

function t(key, vars) {
  var s = (T[S.lang] && T[S.lang][key] !== undefined) ? T[S.lang][key] : T.es[key];
  if (vars && typeof s === "string") s = s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; });

}

  var el = document.createElement("div");

function api(path, body) {

      '<input type="file" id="file" accept="image/*,.pdf" class="sr"></label></div>' +
    '<button type="submit" class="btn btn-p main-btn">' + (student ? t("createStudent") : t("create")) + ' ' + ARROW + '</button>' +
    '<p class="soon">' + t("soon") + '</p>' + meter() + '</div></form>';
}
function screenApp() {
  var a = (S.me && S.me.account) || { next: "panel" };
  return header("app") + '<div class="app"><main class="left">' + leftArea(a) + '</main><aside class="side">' + formArea(a) + '</aside></div>';
}
function modalPrices() {
  function plan(k, price, per, note, hl) {
    return '<div class="plan' + (hl ? " hl" : "") + '"><div class="k">' + t(k) + (hl ? '<span class="badge">' + t("best") + '</span>' : "") + '</div>' +
      '<div class="p"><b>$' + price + '</b><span>' + per + '</span></div><div class="pp">' + note + '</div>' +
      '<button type="button" class="btn ' + (hl ? "btn-g" : "btn-s") + '" data-act="prices-start">' + t("startWithEmail") + '</button></div>';
  }
  return '<div class="scrim" data-act="close-modal"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT" style="max-width:980px" data-stop="1">' +
    '<button type="button" class="dlg-x" data-act="close-modal" aria-label="' + t("close") + '">×</button><div class="dlg-in">' +
    '<h2 id="dlgT">' + t("pricesTitle") + '</h2><p class="small" style="font-size:.95rem">' + t("pricesStart") + '</p>' +
    '<div class="plans">' + plan("oneSheet", 50, t("once"), t("oneSheetNote")) + plan("m20", 300, t("perMonth"), t("m20Note")) + plan("m40", 500, t("perMonth"), t("m40Note"), true) + '</div>' +
    '<p class="small">' + t("pricesMxn") + '</p></div></div></div>';
}

function render(focusSel) {
  document.documentElement.lang = S.lang;
  document.title = t("title");
  var html = S.screen === "inicio" ? screenInicio() : S.screen === "codigo" ? screenCodigo() : S.screen === "google" ? screenGoogle() : S.screen === "app" ? screenApp() : screenBoot();
  if (S.modal === "prices") html += modalPrices();
  document.getElementById("root").innerHTML = html;
  if (focusSel) { var el = document.querySelector(focusSel); if (el) { el.focus(); if (el.select && el.id === "email") el.select(); } }
}

// ── going between screens ──
function startWait(n) {
  S.wait = Math.max(0, Math.round(n || 0));
  clearInterval(waitTimer);
  if (!S.wait) return;
  waitTimer = setInterval(function () {
    S.wait = Math.max(0, S.wait - 1);
    var b = document.getElementById("resendBtn");
    if (b) { b.textContent = resendLabel(); b.disabled = S.wait > 0 || S.busy; }
    if (!S.wait) clearInterval(waitTimer);
  }, 1000);
}
function toCode(email, wait, notice, bad) {
  S.email = email; S.screen = "codigo"; S.busy = false; S.error = ""; S.digits = ["", "", "", "", "", ""];
  S.notice = notice || ""; S.noticeBad = !!bad;
  startWait(wait);
  render("#d0");
}
function toInicio(error) {
  S.screen = "inicio"; S.busy = false; S.error = error || ""; S.notice = ""; S.menu = false;
  clearInterval(waitTimer); S.wait = 0;
  render(error ? "#email" : null);
}
function toApp(me, welcome) {
  S.me = me; S.screen = "app"; S.busy = false; S.error = ""; S.menu = false; S.googleStuck = "";
  sstore("lx_g", null);
  render();
  window.scrollTo(0, 0);
  if (welcome) toast(t("welcome"));
}
function submitEmail() {
  var input = document.getElementById("email");
  var v = (input ? input.value : S.email).trim();
  S.email = v;
  if (!okEmail(v)) { S.error = t("badEmail"); render("#email"); return; }
  S.busy = true; S.error = ""; render();
  api("/api/login/start", { email: v, lang: S.lang, ret: location.origin + location.pathname }).then(function (d) {
    if (d.method === "google" && d.url) {
      S.email = d.email || v; S.screen = "google"; S.busy = false; render();
      sstore("lx_g", S.email);
      setTimeout(function () { location.assign(d.url); }, 350);
    } else if (d.method === "code") {
      sstore("lx_g", null);
      toCode(d.email || v, d.wait);
    } else {
      S.busy = false; S.error = errText(d); render("#email");
    }
  });
}
function codeInstead() {
  var email = S.googleStuck || S.email;
  S.busy = true; render();
  api("/api/login/code", { email: email, lang: S.lang, resend: false, why: "google" }).then(function (d) {
    S.busy = false;
    if (d.method === "code") { S.googleStuck = ""; sstore("lx_g", null); toCode(d.email || email, d.wait); }
    else if (d.error === "wait") { S.googleStuck = ""; sstore("lx_g", null); toCode(email, d.wait); }
    else { S.error = errText(d); render(); }
  });
}
function readDigits() {
  for (var i = 0; i < 6; i++) { var el = document.getElementById("d" + i); if (el) S.digits[i] = (el.value || "").replace(/\D/g, "").slice(0, 1); }
  var r = document.getElementById("remember"); if (r) S.remember = r.checked;
  return S.digits.join("");
}
function submitCode() {
  var code = readDigits();
  if (code.length !== 6) { S.error = t("e_bad_code"); render("#d" + Math.max(0, S.digits.indexOf(""))); return; }
  S.busy = true; S.error = ""; render();
  api("/api/login/verify", { email: S.email, code: code, remember: !!S.remember }).then(function (d) {
    if (d.ok) { toApp({ signedIn: true, email: d.email, remember: d.remember, account: d.account }, true); return; }
    S.busy = false; S.error = errText(d);
    if (d.error === "wrong_code" || d.error === "expired") S.digits = ["", "", "", "", "", ""];
    render("#d0");
    say(S.error);
  });
}
function resend() {
  if (S.wait > 0 || S.busy) return;
  S.busy = true; render();
  api("/api/login/code", { email: S.email, lang: S.lang }).then(function (d) {
    S.busy = false;
    if (d.method === "code") { S.error = ""; S.notice = ""; S.digits = ["", "", "", "", "", ""]; startWait(d.wait); render("#d0"); toast(t("resent")); }
    else { if (d.error === "wait") startWait(d.wait); S.error = errText(d); render(); }
  });
}
function logout() {
  api("/api/logout", {}).then(function () {
    S.me = null; S.email = ""; S.remember = false;
    toInicio(); toast(t("signedOut"));
  });
}
// When the person comes back to the tab, the session may have ended (unused for a while, or signed out elsewhere).
function recheck() {
  if (S.screen !== "app") return;
  api("/api/login/me").then(function (d) {
    if (d.error === "network") return;
    if (!d.signedIn) { S.me = null; toInicio(); toast(t("sessionOver")); }
    else { S.me = d; }
  });
}

// ── events ──
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (S.menu && !e.target.closest(".menu") && !(el && el.getAttribute("data-act") === "menu")) { S.menu = false; render(); if (!el) return; }
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "close-modal" && e.target.closest("[data-stop]") && !e.target.closest(".dlg-x")) return;   // a click inside the dialog
  switch (act) {
    case "lang-es": case "lang-en":
      S.lang = act.slice(5); store("lx_lang", S.lang); render(); break;
    case "home": if (S.screen !== "inicio") toInicio(); else window.scrollTo(0, 0); break;
    case "focus-email": S.modal = null; if (S.screen !== "inicio") toInicio(); render("#email"); window.scrollTo(0, 0); break;
    case "prices": S.modal = "prices"; render(".dlg-x"); break;
    case "prices-start": S.modal = null; render("#email"); window.scrollTo(0, 0); break;
    case "close-modal": S.modal = null; render(); break;
    case "code-instead": codeInstead(); break;
    case "resend": resend(); break;
    case "other-email": S.googleStuck = ""; toInicio(); render("#email"); break;
    case "menu": S.menu = !S.menu; render(S.menu ? ".menu [role=menuitem]" : null); break;
    case "logout": S.menu = false; logout(); break;
  }
});
document.addEventListener("submit", function (e) {
  var f = e.target.getAttribute("data-form");
  if (!f) return;
  e.preventDefault();
  if (f === "email" && !S.busy) submitEmail();
  if (f === "code" && !S.busy) submitCode();
  if (f === "create") toast(t("soon"));
});
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.id === "email") { S.email = el.value; if (S.error) { S.error = ""; var p = document.getElementById("emailErr"); if (p) { p.hidden = true; p.className = ""; p.textContent = ""; } } return; }
  if (!el.hasAttribute("data-digit")) return;
  var i = +el.getAttribute("data-digit");
  var ds = (el.value || "").replace(/\D/g, "");
  if (ds.length > 1) {                             // a pasted or autofilled code lands in one box: spread it out
    for (var k = 0; k < ds.length && i + k < 6; k++) { var box = document.getElementById("d" + (i + k)); if (box) box.value = ds[k]; }
    var last = Math.min(5, i + ds.length - 1);
    var nb = document.getElementById("d" + (last < 5 ? last + 1 : 5)); if (nb) nb.focus();
  } else {
    el.value = ds;
    if (ds && i < 5) document.getElementById("d" + (i + 1)).focus();
  }
  if (readDigits().length === 6 && !S.busy) submitCode();
});
document.addEventListener("keydown", function (e) {
  var el = e.target;
  if (e.key === "Escape") { if (S.modal) { S.modal = null; render(); } else if (S.menu) { S.menu = false; render(".acct"); } return; }
  if (!el.hasAttribute || !el.hasAttribute("data-digit")) return;
  var i = +el.getAttribute("data-digit");
  if (e.key === "Backspace" && !el.value && i > 0) { var p = document.getElementById("d" + (i - 1)); p.value = ""; p.focus(); e.preventDefault(); }
  if (e.key === "ArrowLeft" && i > 0) { document.getElementById("d" + (i - 1)).focus(); e.preventDefault(); }
  if (e.key === "ArrowRight" && i < 5) { document.getElementById("d" + (i + 1)).focus(); e.preventDefault(); }
});
document.addEventListener("paste", function (e) {
  var el = e.target;
  if (!el.hasAttribute || !el.hasAttribute("data-digit")) return;
  var txt = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\D/g, "");
  if (!txt) return;
  e.preventDefault();
  var i = txt.length >= 6 ? 0 : +el.getAttribute("data-digit");
  for (var k = 0; k < txt.length && i + k < 6; k++) document.getElementById("d" + (i + k)).value = txt[k];
  if (readDigits().length === 6 && !S.busy) submitCode();
  else { var n = document.getElementById("d" + Math.min(5, i + txt.length)); if (n) n.focus(); }
});
document.addEventListener("change", function (e) { if (e.target.id === "remember") S.remember = e.target.checked; });
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") recheck(); });
// Back from Google's page without finishing (the browser restored this page): offer the code.
window.addEventListener("pageshow", function (e) {
  if (e.persisted && S.screen === "google") { S.googleStuck = S.email; toInicio(); }
});

// ── start ──
(function boot() {
  var saved = load("lx_lang");
  S.lang = saved === "en" || saved === "es" ? saved : (/^es\b/i.test(navigator.language || "es") ? "es" : (navigator.language ? "en" : "es"));
  var q = new URLSearchParams(location.search);
  var lx = q.get("lx"), lxEmail = q.get("lx_email") || "", lxErr = q.get("lx_err");
  if (lx) {
    ["lx", "lx_email", "lx_err"].forEach(function (k) { q.delete(k); });
    var clean = location.pathname + (q.toString() ? "?" + q.toString() : "") + location.hash;
    try { history.replaceState(null, "", clean); } catch (e) {}
  }
  // Back from Google. The code screen is shown only in the tab that left for Google with that same email
  // (a link someone else made cannot make the page claim a code was sent).
  var left = sload("lx_g");
  var mine = !!lxEmail && left === lxEmail;
  if (lx) sstore("lx_g", null);
  render();
  if (lx === "code" && mine) { toCode(lxEmail, 60, t("googleFallback")); return; }
  if (lx === "code_error" && mine) { S.email = lxEmail; toInicio(errText({ error: lxErr || "send_failed" })); return; }
  if ((lx === "code" || lx === "code_error" || lx === "google_failed") && lxEmail) {
    S.email = lxEmail; S.googleStuck = lxEmail; toInicio(); return;
  }
  api("/api/login/me").then(function (d) {
    if (d.signedIn) { toApp(d, lx === "google"); return; }
    var pending = sload("lx_g");
    if (pending) { S.email = pending; S.googleStuck = pending; }
    toInicio(d.error === "network" ? t("e_network") : "");
  });
})();
})();
</script>
</body>
</html>
