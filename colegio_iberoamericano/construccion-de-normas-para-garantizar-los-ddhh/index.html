        en:[
        'The voice of those who used the space in the morning, whose need was left out of the agreed schedule.',
        'The signature of the municipal authority at the foot of the document agreed at the meeting.',
        'A larger number of football teams represented during the neighborhood meeting.',
        'A sanction for those who use the court outside the schedule that was agreed.' ] },
      correct:0,
      hint:{ es:'Compara quiénes usaban la cancha con quiénes estuvieron en la reunión.',
             en:'Compare who used the court with who attended the meeting.' },
      explanation:{ es:'Los equipos acordaron el horario que les servía porque eran los únicos presentes. Al no estar quienes caminaban temprano, su franja de la mañana no existió en la discusión y el acuerdo terminó desplazándolos del espacio.',
                    en:'The teams agreed on the schedule that suited them because they were the only ones present. With those who walked early absent, their morning slot did not exist in the discussion and the agreement ended up pushing them out of the space.' } }
  ], rng), rng);

  /* ── CONCEPTO 4 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Del acuerdo al efecto: la ruta y quien la respalda','From agreement to effect: the road and who backs it') + '</h2>' +
    '<p>' + S('Un acuerdo bien escrito todavía no cambia nada. Para que un derecho quede protegido de verdad hace falta recorrer un camino: nombrar el derecho afectado, escuchar a quienes lo viven, acordar y escribir, dar a conocer, aplicar de la misma manera para todos y revisar después de un tiempo.',
              'A well written agreement still changes nothing. For a right to be genuinely protected a road has to be travelled: name the affected right, listen to those who live it, agree and write, make it known, apply it the same way for everyone and review it after a while.') + '</p>' +
    '<p>' + S('En ese camino aparecen las instituciones. Son las que reciben un acuerdo, responden conforme a la ley y cuentan con los recursos y las facultades para hacer obras o corregir un trato injusto. Sin acuerdo de la comunidad, deciden a ciegas; sin institución, el acuerdo se queda en papel.',
              'Institutions appear along that road. They are the ones that receive an agreement, respond according to the law and hold the resources and powers to carry out works or correct unfair treatment. With no community agreement they decide blindly; with no institution the agreement stays on paper.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Comité de convivencia','Coexistence committee') + '</div><div class="rform">' + S('dentro de la escuela','inside the school') + '</div><div class="rnote">' + S('Construye, aplica y revisa el acuerdo del plantel.','It builds, applies and reviews the school agreement.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Ayuntamiento','Municipal government') + '</div><div class="rform">' + S('en la comunidad','in the community') + '</div><div class="rnote">' + S('Recibe peticiones y ejecuta obras y servicios públicos.','It receives petitions and carries out public works and services.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Comisión de derechos humanos','Human rights commission') + '</div><div class="rform">' + S('en el estado y en el país','in the state and the country') + '</div><div class="rnote">' + S('Recibe quejas cuando una autoridad afecta un derecho.','It receives complaints when an authority harms a right.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('La ley escrita','Written law') + '</div><div class="rform">' + S('sobre todas las normas','above all rules') + '</div><div class="rnote">' + S('Ninguna norma menor puede contradecir los derechos.','No lesser rule may contradict rights.') + '</div></div>' +
    '</div>' +
    '<div class="callout"><p><strong>' + S('Regla de oro del camino: ','Golden rule of the road: ') + '</strong>' +
      S('cada paso sostiene al siguiente. Saltarse uno no adelanta el proceso, lo debilita, porque el paso saltado reaparece más tarde como un conflicto.',
        'each step holds up the next one. Skipping one does not speed the process up, it weakens it, because the skipped step reappears later as a conflict.') + '</p></div>' +
    buildRT(rng));
  rtRender();

  /* ── PROBLEMA 7 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El acuerdo ya está firmado', en:'The agreement is already signed' }, showWork:false,
      stmt:{ es:'Un grupo de vecinos detectó que la parada del camión quedó a oscuras, escuchó a quienes la usan de noche y acordó por escrito qué solicitar. ¿Cuál es el paso que sigue para que ese acuerdo tenga efecto?',
             en:'A group of neighbors noticed the bus stop was left dark, listened to those who use it at night and agreed in writing on what to request. What is the next step for that agreement to have an effect?' },
      options:{ es:[
        'Presentarlo ante la autoridad que puede instalar el alumbrado y dar seguimiento a la respuesta que reciban.',
        'Archivar el acuerdo firmado hasta que alguna autoridad pregunte por el problema de la parada.',
        'Volver a reunir a los vecinos para escuchar otra vez el mismo problema de la parada a oscuras.',
        'Repartir copias del texto entre quienes lo firmaron y considerar cerrado el asunto del alumbrado.' ],
        en:[
        'Presenting it to the authority that can install the lighting and following up on the answer they receive.',
        'Filing the signed agreement until some authority asks about the problem of the stop.',
        'Gathering the neighbors again to listen once more to the same problem of the dark stop.',
        'Handing out copies of the text among those who signed it and considering the lighting matter closed.' ] },
      correct:0,
      hint:{ es:'Pregúntate quién tiene los recursos y la facultad para instalar el alumbrado.',
             en:'Ask yourself who holds the resources and the power to install the lighting.' },
      explanation:{ es:'Los vecinos ya nombraron el derecho, escucharon y acordaron. Lo que sigue es llevar el acuerdo a la institución que puede ejecutarlo y no soltarlo hasta obtener respuesta, porque un documento guardado no cambia la calle.',
                    en:'The neighbors already named the right, listened and agreed. What follows is taking the agreement to the institution that can carry it out and not letting go until there is an answer, because a filed document does not change the street.' } },
    { title:{ es:'El rol choca con la clase', en:'The rota clashes with class' }, showWork:false,
      stmt:{ es:'Una escuela escribió, difundió y aplicó durante un bimestre su acuerdo sobre el uso del patio. Ahora dos grupos reportan que el rol se empalma con sus clases de educación física. ¿Qué corresponde hacer con esa norma?',
             en:'A school wrote, publicized and applied its agreement on the use of the yard for a whole term. Now two groups report that the rota overlaps with their physical education classes. What should be done with that rule?' },
      options:{ es:[
        'Revisarla en asamblea con los grupos afectados y ajustar el rol para que las dos actividades quepan.',
        'Mantener el rol sin ningún cambio, porque un acuerdo ya firmado no debería modificarse nunca.',
        'Suspender el acuerdo por completo y dejar el uso del patio como estaba antes de escribirlo.',
        'Aplicar una sanción a los dos grupos que reportaron el empalme con sus clases.' ],
        en:[
        'Reviewing it in assembly with the affected groups and adjusting the rota so both activities fit.',
        'Keeping the rota unchanged, because an agreement once signed should never be modified.',
        'Suspending the agreement entirely and leaving yard use as it was before it was written.',
        'Sanctioning the two groups that reported the overlap with their classes.' ] },
      correct:0,
      hint:{ es:'El acuerdo ya recorrió los pasos anteriores. Piensa cuál es el que cierra el camino.',
             en:'The agreement already went through the earlier steps. Think about which one closes the road.' },
      explanation:{ es:'El empalme apareció al aplicar la norma, que es justo lo que la revisión sirve para corregir. Ajustar el rol con quienes viven el problema conserva el acuerdo y lo mejora, mientras que congelarlo, suspenderlo o sancionar deja el problema intacto.',
                    en:'The overlap showed up while applying the rule, which is exactly what the review stage exists to correct. Adjusting the rota with those who live the problem keeps the agreement and improves it, while freezing it, suspending it or sanctioning leaves the problem untouched.' } }
  ], rng), rng);

  /* ── PROBLEMA 8 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Cuando la escuela no responde', en:'When the school does not respond' }, showWork:false,
      stmt:{ es:'Un estudiante queda excluido de un taller por hablar una lengua indígena. Su familia reclama por escrito ante la escuela y no recibe respuesta. ¿A qué instancia puede acudir para que ese trato sea revisado?',
             en:'A student is excluded from a workshop for speaking an indigenous language. His family complains in writing to the school and receives no answer. Which body can they turn to so that treatment is reviewed?' },
      options:{ es:[
        'A la comisión de derechos humanos de su estado, que recibe quejas cuando un acto de autoridad afecta un derecho.',
        'A la asociación de padres de familia del plantel, que decide las sanciones que aplica la escuela.',
        'Al comité de convivencia del salón, que resuelve los desacuerdos entre compañeros del grupo.',
        'A la empresa que administra el transporte escolar, que registra los reclamos del plantel.' ],
        en:[
        'To the human rights commission of their state, which receives complaints when an act of authority harms a right.',
        'To the parents association of the school, which decides the sanctions the school applies.',
        'To the classroom coexistence committee, which settles disagreements among classmates.',
        'To the company that runs the school transport, which records complaints from the school.' ] },
      correct:0,
      hint:{ es:'La escuela ya fue la primera instancia y no respondió. Busca la institución creada para ese tipo de queja.',
             en:'The school was already the first instance and did not respond. Look for the institution created for that kind of complaint.' },
      explanation:{ es:'Excluir a alguien por la lengua que habla es discriminación, y la escuela actúa como autoridad. Las comisiones de derechos humanos existen precisamente para recibir quejas por actos de autoridad que afectan derechos y pedir que se corrijan.',
                    en:'Excluding someone for the language they speak is discrimination, and the school acts as an authority. Human rights commissions exist precisely to receive complaints about acts of authority that harm rights and to demand they be corrected.' } },
    { title:{ es:'El papel de la institución', en:'The role of the institution' }, showWork:false,
      stmt:{ es:'Un grupo de vecinos acordó por escrito la instalación de rampas en las banquetas de su calle y presentó el documento en el ayuntamiento. ¿Qué papel juega la institución en este caso?',
             en:'A group of neighbors agreed in writing on the installation of ramps on the sidewalks of their street and submitted the document to the municipal government. What role does the institution play in this case?' },
      options:{ es:[
        'Recibe el acuerdo, responde conforme a la ley y cuenta con los recursos y las facultades para ejecutar la obra.',
        'Sustituye el acuerdo vecinal por su propia decisión, sin considerar lo que los vecinos escribieron.',
        'Guarda el documento como constancia, sin ninguna obligación de responder a quienes lo presentaron.',
        'Elige a los vecinos que podrán usar las rampas una vez que la obra quede terminada.' ],
        en:[
        'It receives the agreement, responds according to the law and holds the resources and powers to carry out the work.',
        'It replaces the neighborhood agreement with its own decision, without considering what the neighbors wrote.',
        'It keeps the document on record, with no obligation to answer those who submitted it.',
        'It chooses which neighbors will be able to use the ramps once the work is finished.' ] },
      correct:0,
      hint:{ es:'Piensa qué puede hacer el ayuntamiento que los vecinos por sí solos no pueden.',
             en:'Think about what the municipal government can do that the neighbors alone cannot.' },
      explanation:{ es:'Los vecinos aportan el acuerdo y el conocimiento de su calle; el ayuntamiento aporta el presupuesto, las facultades y la obligación de responder. Las rampas se construyen cuando esas dos partes se encuentran, no cuando una sustituye a la otra.',
                    en:'The neighbors bring the agreement and the knowledge of their street; the municipal government brings the budget, the powers and the duty to answer. The ramps get built when those two parts meet, not when one replaces the other.' } }
  ], rng), rng);

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Dos acuerdos de convivencia', en:'Two coexistence agreements' }, showWork:false,
      stmt:{ es:'En una secundaria el acuerdo de convivencia se construyó en asambleas por grupo, se redactó con lenguaje claro, se publicó en todos los salones y se revisa cada semestre. En otra, la lista de reglas la firmó la dirección, está pegada solo en la entrada y no se modifica desde hace ocho años. ¿Cuál es la diferencia principal entre ambas?',
             en:'In one secondary school the coexistence agreement was built in assemblies by group, written in clear language, posted in every classroom and reviewed each semester. In another, the list of rules was signed by the leadership, is posted only at the entrance and has not been modified in eight years. What is the main difference between them?' },
      options:{ es:[
        'La primera se construyó con quienes la viven y puede ajustarse, por lo que responde mejor a lo que ocurre hoy en la escuela.',
        'La primera contiene un número mayor de reglas escritas que la lista pegada en la segunda escuela.',
        'La segunda resulta más estricta que la primera, porque la firmó directamente la dirección del plantel.',
        'La segunda ahorra tiempo a la comunidad, y por esa razón sus reglas se cumplen con mayor frecuencia.' ],
        en:[
        'The first was built with those who live it and can be adjusted, so it responds better to what happens at the school today.',
        'The first contains a larger number of written rules than the list posted at the second school.',
        'The second is stricter than the first, because it was signed directly by the school leadership.',
        'The second saves the community time, and for that reason its rules are followed more often.' ] },
      correct:0,
      hint:{ es:'Fíjate en dos cosas: quién participó al escribirlas y qué pasa cuando dejan de servir.',
             en:'Look at two things: who took part in writing them and what happens when they stop working.' },
      explanation:{ es:'La primera fue construida por la comunidad, se dio a conocer donde la gente está y tiene fecha de revisión, así que puede corregirse cuando algo falla. La segunda quedó fija en el tiempo y en la puerta, y por eso ya no responde a lo que hoy pasa en el plantel.',
                    en:'The first was built by the community, made known where people are and has a review date, so it can be corrected when something fails. The second stayed frozen in time and at the door, so it no longer responds to what happens at the school today.' } },
    { title:{ es:'Comprobar el acuerdo', en:'Checking the agreement' }, showWork:false,
      stmt:{ es:'Al terminar de construir su acuerdo de convivencia, un grupo quiere comprobar que quedó bien hecho antes de ponerlo en marcha. ¿Cuál de estas revisiones responde mejor a ese propósito?',
             en:'After finishing building its coexistence agreement, a group wants to check that it turned out well before putting it into practice. Which of these reviews best serves that purpose?' },
      options:{ es:[
        'Comprobar que nombra los derechos que cuida, que se entiende, que alcanza a todos por igual y que fija cuándo será revisado.',
        'Comprobar que está firmado por la mayoría del grupo y que la letra tiene el mismo tamaño en todas sus partes.',
        'Comprobar que incluye una sanción distinta para cada una de las faltas que podrían ocurrir en el salón.',
        'Comprobar que resulta más extenso que el acuerdo del año pasado y que menciona a todos los docentes.' ],
        en:[
        'Checking that it names the rights it protects, that it is understood, that it reaches everyone equally and that it sets when it will be reviewed.',
        'Checking that it is signed by most of the group and that the type is the same size in all its parts.',
        'Checking that it includes a different sanction for each of the offenses that could occur in the classroom.',
        'Checking that it is longer than last year agreement and that it mentions every teacher by name.' ] },
      correct:0,
      hint:{ es:'Recuerda de qué partes se compone una norma que se sostiene en la práctica.',
             en:'Recall which parts make up a rule that holds up in practice.' },
      explanation:{ es:'Una norma se sostiene si se sabe qué derecho cuida, si cualquiera la entiende, si alcanza a todos por igual y si tiene fecha para revisarse. Firmas, cantidad de sanciones o extensión no dicen nada sobre si la norma protege algo y si se podrá cumplir.',
                    en:'A rule holds up if it is known which right it protects, if anyone understands it, if it reaches everyone equally and if it has a review date. Signatures, number of sanctions or length say nothing about whether the rule protects something and whether it can be met.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Da igual participar', en:'Taking part makes no difference' }, showWork:false,
      stmt:{ es:'Un compañero afirma que da igual participar en el acuerdo del salón, porque las normas siempre las deciden los adultos. Durante el ciclo, el grupo propuso un cambio en el rol de limpieza, lo discutió en asamblea con su docente y la propuesta quedó incorporada al acuerdo del salón. ¿Qué respuesta corrige mejor esa afirmación?',
             en:'A classmate claims it makes no difference to take part in the classroom agreement, because rules are always decided by adults. During the year, the group proposed a change to the cleaning rota, discussed it in assembly with their teacher and the proposal was incorporated into the classroom agreement. Which answer best corrects that claim?' },
      options:{ es:[
        'Que la experiencia del propio grupo muestra que su participación modificó una norma que después se aplicó a todos.',
        'Que la afirmación es correcta, porque los acuerdos de aula no llegan a tener ningún efecto real en la escuela.',
        'Que las normas del salón solo cambian cuando las autoridades del plantel lo deciden por su propia cuenta.',
        'Que participar sirve para conocer mejor a los compañeros, aunque el contenido de las normas no cambie.' ],
        en:[
        'That the group own experience shows that their participation changed a rule that was then applied to everyone.',
        'That the claim is correct, because classroom agreements never come to have any real effect at school.',
        'That classroom rules only change when the school authorities decide it entirely on their own.',
        'That taking part helps to get to know classmates better, even though the content of the rules does not change.' ] },
      correct:0,
      hint:{ es:'La respuesta está en lo que ese mismo grupo hizo durante el ciclo.',
             en:'The answer is in what that same group did during the year.' },
      explanation:{ es:'El propio caso desmiente la afirmación: el grupo propuso, discutió y su propuesta terminó dentro del acuerdo que rige para todos. Participar no garantiza ganar cada discusión, pero sí abre la posibilidad real de cambiar la norma.',
                    en:'The case itself refutes the claim: the group proposed, discussed and their proposal ended up inside the agreement that governs everyone. Taking part does not guarantee winning every discussion, but it does open a real possibility of changing the rule.' } },
    { title:{ es:'Dos salones, dos caminos', en:'Two classrooms, two roads' }, showWork:false,
      stmt:{ es:'Al iniciar el ciclo, dos salones eligen cómo tener su acuerdo de convivencia. El salón A lo redacta en asamblea con todas las voces del grupo y programa una revisión a mitad del año. El salón B copia el acuerdo del año pasado sin discutirlo. ¿Cuál es el beneficio principal que obtiene el salón A?',
             en:'At the start of the year, two classrooms choose how to have their coexistence agreement. Classroom A drafts it in assembly with every voice in the group and schedules a review at midyear. Classroom B copies last year agreement without discussing it. What is the main benefit classroom A obtains?' },
      options:{ es:[
        'Un acuerdo que responde a lo que hoy ocurre en ese grupo y que puede ajustarse cuando deje de servir.',
        'Un acuerdo más breve que el anterior, porque redactarlo en asamblea obliga a reducir el número de reglas.',
        'Un acuerdo que evita por completo que aparezcan conflictos entre los integrantes de ese salón.',
        'Un acuerdo idéntico al del salón B, salvo por el tiempo que cada grupo dedicó a escribirlo.' ],
        en:[
        'An agreement that responds to what happens in that group today and that can be adjusted when it stops working.',
        'A shorter agreement than the previous one, because drafting it in assembly forces cutting the number of rules.',
        'An agreement that completely prevents conflicts from appearing among the members of that classroom.',
        'An agreement identical to that of classroom B, except for the time each group spent writing it.' ] },
      correct:0,
      hint:{ es:'Compara de qué grupo salió cada texto y qué puede pasar con él a mitad del año.',
             en:'Compare which group each text came from and what can happen to it at midyear.' },
      explanation:{ es:'El acuerdo del salón A salió de las personas que hoy conviven ahí y tiene una fecha para corregirse. El del salón B pertenece a un grupo que ya no está y nadie lo revisará, así que llega desconectado de lo que ocurre en ese salón.',
                    en:'Classroom A agreement came from the people who share that room today and has a date to be corrected. Classroom B agreement belongs to a group that is no longer there and nobody will review it, so it arrives disconnected from what happens in that room.' } }
  ], rng), rng);
}

</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Construcción de Normas para Garantizar los DDHH';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
