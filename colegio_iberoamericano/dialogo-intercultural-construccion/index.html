<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diálogo Intercultural y Construcción Democrática</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Diálogo Intercultural y Construcción Democrática</div>
    <div class="wcourse" id="wcourse-el">Español · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Diálogo Intercultural y Construcción Democrática</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c84', primaryDark:'#111d43', primaryBg:'#e8ebf5',
  accent:'#e42424', accentBg:'#fbdfdf',
  darkPrimary:'#4e69bb', darkPrimaryDark:'#7d95dd', darkPrimaryBg:'#0f1936',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

  var g = (studentData.group || '').trim();
  return 'esp3_t11_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'esp3_t11_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line

  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');

    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');

    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;

    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');

        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);

      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}

  // ── Footer on every page ──

  for (var p = 1; p <= pages; p++) {

      PW/2, PH-5, {align:'center'});

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp3_t11_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

  /* ───────── qué hace cada oración dentro de un texto argumentativo ───────── */
  var ROLES = {
    tesis: {

          tx: { es:'El artículo se mantiene, y se agrega que quien falte por motivos familiares podrá pedir un permiso especial en la dirección.',
                en:'The article stays, and a line is added saying that anyone absent for family reasons may request a special permit at the head office.' },
          nt: { es:'Nadie queda excluido, pero cada familia tiene que ir a pedir de manera individual lo que la regla común no reconoce.',
                en:'Nobody is excluded, but each family has to go and ask individually for what the common rule does not recognise.' } },
        { lbl:{ es:'Consulta', en:'Consultation' },
          tx: { es:'Se pregunta a los grupos si aprueban el artículo tal como está y se cuenta cuántos están a favor.',
                en:'The classes are asked whether they approve the article as it stands and the votes in favour are counted.' },
          nt: { es:'Ya se pregunta, pero solo se responde sí o no: el texto del artículo sigue siendo el de quien lo escribió.',
                en:'People are asked now, but they can only answer yes or no: the wording of the article is still the one written by its author.' } },
        { lbl:{ es:'Diálogo', en:'Dialogue' },

          nt: { es:'La regla cambia por las razones escuchadas y sigue valiendo para todos. Nadie recibe una excepción: todos reciben otra regla.',
                en:'The rule changes because of the reasons heard and still holds for everyone. Nobody gets an exception: everybody gets a different rule.' } }
      ]
    }
  ];

  var C = { t1: T1, t2: T2POOL[Math.floor(rng() * T2POOL.length)] };

  /* ───────── escenas para clasificar las tres posturas ───────── */
  var POSTURAS = [
    { es:'Niega la diferencia', en:'Denies the difference' },
    { es:'Tolera sin escuchar', en:'Tolerates without listening' },
    { es:'Dialoga', en:'Holds a dialogue' }
  ];
  var ESCENAS = [
    { b:0, es:'La dirección elige el menú de la feria y avisa que este año no se incluirá ningún platillo de las comunidades.',
           en:'The head office picks the fair menu and announces that this year no dish from the communities will be included.' },
    { b:1, es:'El consejo permite que cada grupo festeje por su lado, pero la fecha del festival la fija siempre el mismo comité.',

    { b:0, es:'En la asamblea se habla solo en español porque quien no lo entienda ya lo aprenderá con el tiempo.',
           en:'In the assembly only Spanish is spoken because anyone who does not understand it will learn it in time.' },
    { b:1, es:'La escuela coloca sus carteles en dos lenguas, aunque los acuerdos se siguen escribiendo únicamente en una.',
           en:'The school puts up its posters in two languages, though the agreements are still written in one alone.' },
    { b:2, es:'Dos grupos con propuestas opuestas exponen sus razones y redactan juntos una tercera que recoge lo que ninguno podía ceder.',
           en:'Two groups with opposing proposals lay out their reasons and jointly draft a third one that takes in what neither could give up.' }
  ];
  var POSTURA_FB = [
    { es:'Esa escena niega la diferencia: la decisión se toma como si un solo modo de vivir fuera el modo de todos.',
      en:'That scene denies the difference: the decision is taken as if a single way of living were everybody way.' },
    { es:'Esa escena tolera sin escuchar: nadie prohíbe nada, pero quien decide sigue siendo el mismo de siempre.',
      en:'That scene tolerates without listening: nobody forbids anything, but whoever decides is still the same as always.' },
    { es:'Esa escena dialoga: las razones de un grupo llegan a modificar lo que el otro había propuesto.',
      en:'That scene is a dialogue: the reasons of one group end up changing what the other had proposed.' }
  ];

  /* ───────── indexado y render de los textos ───────── */
  function indexText(tx) {
    tx.all = [];
    tx.paras.forEach(function (p, pi) {
      p.forEach(function (s) { s.k = tx.all.length; s.pi = pi; tx.all.push(s); });
    });
  }
  indexText(C.t1);
  indexText(C.t2);

  function sentOf(tx, pi, role) {
    var p = tx.paras[pi], i;
    for (i = 0; i < p.length; i++) { if (p[i].r === role) return p[i]; }
    return p[0];
  }
  function tesisOf(tx, pi) { return sentOf(tx, pi, 'tesis'); }
  function rolesIn(tx, pi) {
    return tx.paras[pi].filter(function (s) { return s.r !== 'tesis'; }).map(function (s) { return s.r; });
  }

  /* pares oración - función, para el emparejador */
  var FUNCIONES = [
    { s: sentOf(C.t1, 0, 'evidencia'),    r: 'evidencia' },
    { s: sentOf(C.t1, 1, 'concesion'),    r: 'concesion' },
    { s: sentOf(C.t1, 1, 'refutacion'),   r: 'refutacion' },
    { s: sentOf(C.t1, 1, 'argumento'),    r: 'argumento' },
    { s: sentOf(C.t1, 2, 'consecuencia'), r: 'consecuencia' }
  ];

  function textHTML(tx, opt) {
    opt = opt || {};
    var out = '';
    tx.paras.forEach(function (p, pi) {
      if (opt.only !== undefined && opt.only !== pi) return;
      var inner = p.map(function (s) {
        var txt = L(s);
        if (opt.tap) {
          var cls = 'xchip' + ((opt.marks && opt.marks[s.k]) ? opt.marks[s.k] : '');
          return '<span class="' + cls + '" onclick="tsTap(' + s.k + ')">' + txt + '</span> ';
        }
        return txt + ' ';
      }).join('');
      out += '<span class="dpara"><span class="pmark">' + (pi + 1) + '</span> ' + inner + '</span>';
    });
    return out;
  }
  function textBlock(tx, label) {
    return '<div class="dtext"><div class="dtitle">' + label + ' · ' + L(tx.title) + ' · ' + L(tx.meta) + '</div>' +
           textHTML(tx, {}) + '</div>';
  }

  /* ═════════ WIDGET 1 · qué defiende cada párrafo ═════════ */
  function widgetTesis() {
    var order = shuffle([0, 1, 2], rng);
    var st = { r: 0, tries: 0, marks: {}, done: false };
    var w = widgetBox('wTesis', 'hunt');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Qué defiende el párrafo', 'What the paragraph defends') + '</div>' +
          '<div class="iw-sub">' + T('Recorriste los tres párrafos del Texto I y localizaste en cada uno la afirmación que los demás enunciados sostienen.',
                                     'You went through the three paragraphs of Text I and located in each one the claim the other statements hold up.') + '</div>' +
          '<div class="iw-fb">' + (fb || '') + '</div>';
        return;
      }
      var pi = order[st.r];
      w.innerHTML =
        '<div class="iw-tag">' + T('Qué defiende el párrafo', 'What the paragraph defends') + '</div>' +
        '<div class="iw-sub">' + T('Este es el párrafo ', 'This is paragraph ') + (pi + 1) +
          T(' del Texto I. Toca la afirmación que el resto del párrafo defiende: aquella para la cual trabajan las otras tres oraciones.',
            ' of Text I. Tap the claim the rest of the paragraph defends: the one the other three sentences work for.') + '</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + order.length + '</div>' +
        '<div class="dtext">' + textHTML(C.t1, { tap: true, marks: st.marks, only: pi }) + '</div>' +
        '<div class="iw-fb" id="tsFb">' + (fb || '') + '</div>';
    }
    function advance(fb) {
      st.r++; st.tries = 0; st.marks = {};
      if (st.r >= order.length) st.done = true;
      if (st.done) { paint(''); return; }
      st.locked = true;
      var _fe = document.getElementById('psFb');
      if (_fe) _fe.innerHTML = (fb || '') + '<br><button onclick="psSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.binbtn');
      if (_bs) _bs.forEach(function(b){ b.style.opacity='0.35'; b.style.pointerEvents='none'; });
    }
    window.tsTap = function (k) {
      if (st.done) return;
      var got = C.t1.all[k];
      if (got.pi !== order[st.r]) return;
      if (got.r === 'tesis') {
        st.marks[k] = ' hit';
        advance('<span class="iw-ok">' + T('Esa es: las otras tres oraciones existen para que esa afirmación se sostenga.',
                                           'That is the one: the other three sentences exist so that this claim holds up.') + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.marks[tesisOf(C.t1, order[st.r]).k] = ' rev';
        advance(T('La afirmación que el párrafo defiende era esta: ', 'The claim the paragraph defends was this one: ') +
                Q(tesisOf(C.t1, order[st.r])));
        return;
      }
      st.marks[k] = ' miss';
      paint(T('Esa oración ', 'That sentence ') + L(ROLES[got.r].d) +
            T('. Busca a cuál afirmación del párrafo le está trabajando.', '. Look for which claim of the paragraph it is working for.'));
      st.marks[k] = '';
    };
    paint('');
  }

  /* ═════════ WIDGET 2 · cada oración con su movimiento ═════════ */
  function widgetFuncion() {
    var use = FUNCIONES.slice(0);
    var lo = perm(use.length), ro = perm(use.length);
    while (ro.every(function (v, k) { return v === lo[k]; })) { ro.push(ro.shift()); }
    var st = { sel: null, done: {}, tries: 0, over: false };
    var w = widgetBox('wFuncion', 'match');

    function paint(fb) {
      var left = lo.map(function (i) {
        var cls = 'mtchip' + (st.done[i] ? ' done' : (st.sel === i ? ' sel' : ''));
        return '<button class="' + cls + '" onclick="fnLeft(' + i + ')">' + L(use[i].s) + '</button>';
      }).join('');
      var right = ro.map(function (i) {
        var rr = ROLES[use[i].r];
        return '<button class="mtchip' + (st.done[i] ? ' done' : '') + '" onclick="fnRight(' + i + ')">' +
               '<b>' + L(rr.n) + '</b>' + L(rr.d) + '</button>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('Cada oración con su movimiento', 'Each sentence with its move') + '</div>' +
        '<div class="iw-sub">' + T('Toca una oración del Texto I y después el movimiento que realiza dentro del argumento. Un texto que defiende una postura avanza con movimientos distintos, y cada uno hace un trabajo que los otros no hacen.',
                                   'Tap a sentence from Text I and then the move it performs inside the argument. A text defending a position advances through different moves, and each one does a job the others do not.') + '</div>' +
        '<div class="mtcols">' +
          '<div><div class="mthead">' + T('Oración del texto', 'Sentence from the text') + '</div>' + left + '</div>' +
          '<div><div class="mthead">' + T('Movimiento del argumento', 'Move of the argument') + '</div>' + right + '</div>' +
        '</div>' +
        '<div class="iw-fb" id="fnFb">' + (fb || '') + '</div>';
    }
    function allDone() {
      var i;
      for (i = 0; i < use.length; i++) { if (!st.done[i]) return false; }
      return true;
    }
    window.fnLeft = function (i) {
      if (st.over || st.done[i]) return;
      st.sel = (st.sel === i) ? null : i;
      paint('');
    };
    window.fnRight = function (i) {
      if (st.over || st.done[i]) return;
      if (st.sel === null) { paint(T('Elige primero una oración de la columna izquierda.', 'Choose a sentence from the left column first.')); return; }
      if (st.sel === i) {
        st.done[i] = true; st.sel = null; st.tries = 0;
        if (allDone()) {
          st.over = true;
          paint('<span class="iw-ok">' + T('Los cinco movimientos quedaron identificados: juntos son la manera en que un texto defiende una postura sin imponerla.',
                                           'The five moves are identified: together they are the way a text defends a position without imposing it.') + '</span>');
          return;
        }
        paint('<span class="iw-ok">' + T('Correcto: esa oración ', 'Correct: that sentence ') + L(ROLES[use[i].r].d) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var j;
        for (j = 0; j < use.length; j++) { st.done[j] = true; }
        st.over = true; st.sel = null;
        paint(T('Estas son las parejas correctas. Fíjate en el verbo con que empieza cada oración: ahí suele verse el movimiento que realiza.',
                'These are the correct pairs. Look at the verb each sentence starts from: the move it performs usually shows there.'));
        return;
      }
      var mine = st.sel;
      st.sel = null;
      paint(T('Ese movimiento lo realiza otra oración. La que elegiste ', 'That move is performed by a different sentence. The one you chose ') +
            L(ROLES[use[mine].r].d) + T('.', '.'));
    };
    paint('');
  }

  /* ═════════ WIDGET 3 · tres maneras de tratar la diferencia ═════════ */
  function widgetPosturas() {
    var items = shuffle(ESCENAS.slice(0), rng);
    var st = { i: 0, tries: 0, hits: 0, done: false };
    var w = widgetBox('wPosturas', 'classify');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Tres maneras de tratar la diferencia', 'Three ways of handling difference') + '</div>' +
          '<div class="iw-sub">' + T('Revisaste las seis escenas de esta ronda.', 'You went through the six scenes of this round.') + '</div>' +
          '<div class="iw-fb"><span class="iw-ok">' + st.hits + ' / ' + items.length +
          T(' a la primera.', ' on the first try.') + '</span></div>';
        return;
      }
      w.innerHTML =
        '<div class="iw-tag">' + T('Tres maneras de tratar la diferencia', 'Three ways of handling difference') + '</div>' +
        '<div class="iw-sub">' + T('Cada ficha describe una escena escolar. Decide si en ella la diferencia se niega, se tolera sin escuchar o se dialoga. Pregúntate siempre quién termina decidiendo.',
                                   'Each card describes a school scene. Decide whether in it difference is denied, tolerated without listening, or brought into dialogue. Always ask who ends up deciding.') + '</div>' +
        '<div class="iw-prog">' + (st.i + 1) + ' / ' + items.length + '</div>' +
        '<div class="clscard">' + L(items[st.i]) + '</div>' +
        '<div class="binrow">' + POSTURAS.map(function (b, bi) {
          return '<button class="binbtn" onclick="psPick(' + bi + ')">' + L(b) + '</button>';
        }).join('') + '</div>' +
        '<div class="iw-fb" id="psFb">' + (fb || '') + '</div>';
    }
    window.psPick = function (bi) {
      if (st.done || st.locked) return;
      if (st.done) return;
      var it = items[st.i];
      if (bi === it.b) {
        if (st.tries === 0) st.hits++;
        st.tries = 0; st.i++;
        if (st.i >= items.length) { st.done = true; paint(''); return; }
        paint('<span class="iw-ok">' + L(POSTURA_FB[it.b]) + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var sol = L(POSTURA_FB[it.b]);
        st.tries = 0; st.i++;
        if (st.i >= items.length) { st.done = true; paint(''); return; }
        paint(sol);
        return;
      }
      var pista = (bi === 2)
        ? T('Todavía no. Para que haya diálogo, lo que dice un grupo tiene que alcanzar a cambiar la propuesta del otro. Revisa si aquí ocurre eso.',
            'Not yet. For there to be dialogue, what one group says has to manage to change the proposal of the other. Check whether that happens here.')
        : (bi === 0
            ? T('Todavía no. Fíjate si la escena impide algo o si más bien lo permite y aun así decide sin preguntar.',
                'Not yet. Notice whether the scene forbids something or rather allows it and still decides without asking.')
            : T('Todavía no. Pregúntate si aquí alguien es solo soportado, o si en cambio nadie lo escucha porque de plano se le excluye.',
                'Not yet. Ask whether somebody here is merely put up with, or whether instead nobody listens because they are ruled out altogether.'));
      document.getElementById('psFb').textContent = pista;
    };

    window.psSig = function(){
      st.locked = false;
      (typeof paint !== 'undefined' ? paint : render)('');
    };
    paint('');
  }

  /* ═════════ WIDGET 4 · escalera de la decisión ═════════ */
  function widgetEscalera() {
    var M = C.t2.escalera;
    var w = widgetBox('wEscalera', 'slider');
    var labels = M.map(function (p) { return L(p.lbl); });

    w.innerHTML =

      '<div class="iw-sub">' + T('Un mismo asunto del Texto II resuelto de cuatro maneras, de la más cerrada a la más abierta. Mueve el control y observa quién decide en cada peldaño y qué le ocurre después al acuerdo.',
                                 'One and the same matter from Text II settled in four ways, from the most closed to the most open. Move the control and watch who decides on each rung and what happens to the agreement afterwards.') + '</div>' +

  /* ═════════ WIDGET 5 · la ruta del acuerdo ═════════ */
  function widgetRuta() {
    var R = C.t2.ruta;
    var st = { order: perm(R.length), sel: null, tries: 0, done: false };
    var w = widgetBox('wRuta', 'order');

    function paint(fb) {
      var chips = st.order.map(function (ei, pos) {
        var cls = 'tchip' + (st.done ? ' lock' : (st.sel === pos ? ' sel' : ''));
        return '<div class="' + cls + '" onclick="ruTap(' + pos + ')"><span class="tnum">' + (pos + 1) + '</span><span>' + L(R[ei]) + '</span></div>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('La ruta del acuerdo', 'The route of the agreement') + '</div>' +
        '<div class="iw-sub">' + T('Estos son los cinco momentos por los que pasó la asamblea del Texto II. Acomódalos del primero al último. Toca una tarjeta y luego otra para intercambiarlas, y comprueba cuando el orden te convenza.',
                                   'These are the five moments the assembly of Text II went through. Arrange them from first to last. Tap one card and then another to swap them, and check once the order convinces you.') + '</div>' +
        '<div class="tlist">' + chips + '</div>' +
        (st.done ? '' : '<button class="iwbtn" onclick="ruCheck()">' + T('Comprobar', 'Check') + '</button>') +
        '<div class="iw-fb" id="ruFb">' + (fb || '') + '</div>';
    }
    window.ruTap = function (pos) {
      if (st.done) return;
      if (st.sel === null) { st.sel = pos; }
      else if (st.sel === pos) { st.sel = null; }
      else { var t2 = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t2; st.sel = null; }
      paint('');
    };
    window.ruCheck = function () {
      if (st.done) return;
      if (st.order.every(function (ei, pos) { return ei === pos; })) {
        st.done = true;
        paint('<span class="iw-ok">' + T('Ese es el recorrido: primero se sabe qué quiere cada quien, después por qué lo quiere, y solo entonces aparece una propuesta que nadie traía. El acuerdo se escribe al final, no al principio.',
                                         'That is the route: first you learn what each side wants, then why it wants it, and only then does a proposal appear that nobody had brought. The agreement gets written at the end, not at the start.') + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.order = R.map(function (_, i) { return i; });
        st.done = true;
        paint(T('Este es el orden correcto. Compáralo con el tuyo: cada momento necesita que el anterior ya haya ocurrido.',
                'This is the correct order. Compare it with yours: each moment needs the previous one to have happened already.'));
        return;
      }
      var bad = 0, i;
      for (i = 0; i < st.order.length; i++) { if (st.order[i] !== i) { bad = i; break; } }
      paint(T('Todavía no. Revisa la tarjeta ', 'Not yet. Look at card ') + (bad + 1) +
            T(': ¿qué tendría que haber pasado antes para que ese momento fuera posible?',
              ': what would have had to happen before for that moment to be possible?'));
    };
    paint('');
  }

  /* ═════════ WIDGET 6 · bitácora del diálogo ═════════ */
  function widgetBitacora() {

    window.biSave = function () {
      var v = (document.getElementById('biTa').value || '').trim();
      document.getElementById('biFb').innerHTML = v.length < 25
        ? T('Amplíalo un poco: añade la razón que sostendría lo que acabas de afirmar.',
            'Stretch it a little: add the reason that would hold up what you have just claimed.')
        : '<span class="iw-ok">' + T('Guardado. Aquí no hay una sola respuesta buena: relee lo que escribiste y pregúntate a quién tendrías que escuchar antes de sostenerlo.',
                                     'Saved. There is no single good answer here: read what you wrote again and ask whom you would have to listen to before holding it.') + '</span>';
    };
  }

  /* ═════════ constructor de tarjetas ═════════ */
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

  /* ═════════ banco de preguntas ═════════ */

  function q1() {
    var pi = Math.floor(rng() * 3);

             en:'Go back to paragraph ' + (pi + 1) + ' of Text I. Identify which of these four sentences is the one the other three defend.' },
        hint: { es:'Prueba una por una: si una oración da una razón, un dato o un caso de otra, entonces está trabajando para ella. La que no trabaja para ninguna es la que el párrafo defiende.',
                en:'Try them one by one: if a sentence gives a reason, a figure or a case of another, then it is working for it. The one working for none is the one the paragraph defends.' },
        exp: { es:'La oración correcta es aquella hacia la cual apuntan las demás: las otras tres dan una razón, un dato, un caso o lo que se sigue de ella. Si se retira, el párrafo se queda sin nada que defender.',

           en:'In paragraph ' + (pi + 1) + ' of Text I, somebody underlined this sentence as the position of the author: ' + Q(s) + '. Determine why that underlining is wrong.' },
      hint: { es:'Compara esa oración con las demás del párrafo y pregúntate cuál depende de cuál: la que existe en función de otra no puede ser la postura.',

      exp: { es:'Esa oración ' + L(ROLES[s.r].d) + ', de manera que depende de otra afirmación. La postura del párrafo es ' + Q(tesisOf(C.t1, pi)) + '.',

  sec(T('Punto de partida', 'Starting point'),
      T('Una sociedad multicultural y un texto que la discute', 'A multicultural society and a text that argues about it'),
      '<p>' + T('Vivir entre culturas distintas es un hecho; convertir ese hecho en una manera de decidir juntos es una tarea, y sobre esa tarea se discute. Los textos que la discuten no informan solamente: defienden una postura y la sostienen con razones, datos, casos y concesiones. Leerlos consiste en localizar qué afirmación defiende cada párrafo y con qué la sostiene, porque solo así puedes darle la razón o discutírsela con argumentos. La afirmación central no siempre abre el párrafo: a veces llega después de un dato que prepara el terreno y a veces cierra como conclusión, de modo que conviene buscarla preguntando quién trabaja para quién. Vas a leer dos textos: un ensayo que argumenta y una crónica que narra un caso. Con los dos trabajarás durante toda la guía, y cada párrafo va numerado para que puedas volver a él.',
                'Living among different cultures is a fact; turning that fact into a way of deciding together is a task, and that task is argued about. The texts that argue about it do not merely inform: they defend a position and hold it up with reasons, figures, cases and concessions. Reading them consists of locating which claim each paragraph defends and what it holds it up with, since only then can you agree or argue back with reasons of your own. The central claim does not always open the paragraph: sometimes it comes after a figure that prepares the ground and sometimes it closes as a conclusion, so it is best to look for it by asking who works for whom. You are going to read two texts: an essay that argues and a chronicle that narrates a case. You will work with both throughout this guide, and each paragraph is numbered so that you can go back to it.') + '</p>' +
      textBlock(C.t1, T('Texto I', 'Text I')) +
      textBlock(C.t2, T('Texto II', 'Text II')) +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('en cada párrafo, pregúntate cuál afirmación quedaría sin defensa si las otras oraciones desaparecieran.',
          'in each paragraph, ask which claim would be left undefended if the other sentences disappeared.') + '</p></div>');
  widgetTesis();
  addP(q1());
  addP(q2());

  sec(T('Cómo se sostiene una postura', 'How a position is held up'),
      T('Los movimientos de un texto argumentativo', 'The moves of an argumentative text'),
      '<p>' + T('Una postura sola no convence a nadie: lo que convence es lo que la rodea. El argumento da la razón por la cual habría que aceptarla. La evidencia la respalda con un dato que cualquiera podría comprobar. El ejemplo la muestra ocurriendo en un caso concreto. La consecuencia dice qué se sigue cuando se acepta. Y hay dos movimientos que solo aparecen cuando el autor sabe que alguien piensa distinto: la concesión, con la que admite algo válido de la postura contraria, y la refutación, con la que responde a la objeción y explica por qué no derriba lo que defiende. Ese par es decisivo en los textos sobre sociedades multiculturales, porque quien escribe sabe que discute con lectores que no piensan como él. Reconocer los movimientos te sirve para dos cosas: encontrar antes la postura, ya que todos apuntan hacia ella, y discutir el texto señalando con qué se sostiene cada cosa que afirma.',
                'A position on its own convinces nobody: what convinces is what surrounds it. The argument gives the reason why it should be accepted. The evidence backs it with a figure anyone could check. The example shows it happening in a concrete case. The consequence says what follows once it is accepted. And there are two moves that only appear when the author knows somebody thinks otherwise: the concession, admitting something valid from the opposing position, and the rebuttal, answering the objection and explaining why it does not bring down what is being defended. That pair is decisive in texts about multicultural societies, because the writer knows they are arguing with readers who do not think as they do. Recognising the moves is useful for two things: finding the position sooner, since they all point at it, and discussing the text by pointing out what each of its claims is held up with.') + '</p>' +
      '<div class="glosslist">' +
        '<div class="gloss"><div class="glossn">' + L(ROLES.argumento.n)    + '</div><div class="glossd">' + L(ROLES.argumento.d)    + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(ROLES.evidencia.n)    + '</div><div class="glossd">' + L(ROLES.evidencia.d)    + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(ROLES.ejemplo.n)      + '</div><div class="glossd">' + L(ROLES.ejemplo.d)      + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(ROLES.concesion.n)    + '</div><div class="glossd">' + L(ROLES.concesion.d)    + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(ROLES.refutacion.n)   + '</div><div class="glossd">' + L(ROLES.refutacion.d)   + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(ROLES.consecuencia.n) + '</div><div class="glossd">' + L(ROLES.consecuencia.d) + '</div></div>' +
      '</div>');
  widgetFuncion();
  addP(q3());
  addP(q4());

  sec(T('Tres maneras de tratar la diferencia', 'Three ways of handling difference'),
      T('Negar, tolerar, dialogar', 'Denying, tolerating, holding a dialogue'),
      '<p>' + T('El Texto I distingue con cuidado entre tolerar y dialogar, y esa distinción no es un juego de palabras: cambia quién decide. Negar la diferencia consiste en actuar como si un solo modo de vivir fuera el modo de todos, y suele disfrazarse de trato igual para todos. Tolerar es un paso adelante, porque ya no prohíbe, pero deja al otro en el lugar de quien es soportado: puede tener su fiesta, su lengua y su ropa, y aun así no aparece cuando se decide. Dialogar es distinto: exige que las razones de un grupo alcancen a modificar la propuesta del otro. Al aplicar estas tres maneras a escenas concretas verás que la diferencia entre ellas casi nunca está en lo que se permite, sino en quién termina teniendo voz en el acuerdo.',
                'Text I carefully tells tolerating and holding a dialogue apart, and that distinction is not word play: it changes who decides. Denying difference consists of acting as if a single way of living were everybody way, and it usually disguises itself as equal treatment for all. Tolerating is a step forward, since it no longer forbids, but it leaves the other in the place of someone put up with: they may have their festival, their language and their clothes, and still not show up when things are decided. Dialogue is different: it demands that the reasons of one group manage to change the proposal of the other. Applying these three ways to concrete scenes you will see that the difference between them almost never lies in what is allowed, but in who ends up having a voice in the agreement.') + '</p>');
  widgetPosturas();
  addP(q5());
  addP(q6());

  sec(T('Qué le hace el diálogo a una decisión', 'What dialogue does to a decision'),
      T('De la imposición al acuerdo', 'From imposition to agreement'),
      '<p>' + T('Una misma decisión puede tomarse de varias maneras, y el resultado escrito llega a parecerse mucho aunque el camino haya sido opuesto. Por eso conviene mirar el proceso y no solo el acuerdo final. Cuando se impone, decide quien tenía la propuesta; cuando se tolera, se abre un espacio aparte para que nadie estorbe; cuando se consulta, se pregunta pero solo se elige entre lo que otros trajeron; cuando se dialoga, las razones ajenas modifican la propia propuesta y aparece algo que nadie llevaba al empezar. El Texto II narra un caso de esos, y el peldaño en el que se detenga una escuela explica después por qué el acuerdo se defiende o se abandona.',
                'One and the same decision can be taken in several ways, and the written result may look very much alike even when the road was the opposite. That is why it is worth looking at the process and not only at the final agreement. When it is imposed, whoever had the proposal decides; when it is tolerated, a separate space is opened so that nobody gets in the way; when it is consulted, people are asked but the choice is only among what others brought; when there is dialogue, other people reasons change your own proposal and something appears that nobody was carrying at the start. Text II narrates one such case, and the rung a school stops at later explains why the agreement gets defended or dropped.') + '</p>');
  widgetEscalera();
  addP(q7());
  addP(q8());

  sec(T('El diálogo construye lo democrático', 'Dialogue builds what is democratic'),
      T('Deliberar no es votar', 'Deliberating is not voting'),
      '<p>' + T('Votar y deliberar no son lo mismo. Una votación cuenta preferencias y siempre deja intacta la propuesta ganadora; una deliberación pone las razones a la vista y permite que las propuestas cambien mientras se discuten. La democracia necesita las dos cosas, pero en una sociedad diversa la votación sola tiende a repetir el mismo resultado, porque quienes son pocos pierden siempre. El diálogo intercultural no elimina el desacuerdo ni pide que todos piensen igual: pide que cada grupo pueda decir qué no está dispuesto a ceder y por qué, de modo que el acuerdo final tenga algo de cada uno. Un acuerdo así se defiende incluso cuando incomoda, y por eso dura más que cualquier vigilancia.',
                'Voting and deliberating are not the same. A vote counts preferences and always leaves the winning proposal untouched; a deliberation puts the reasons in sight and lets proposals change while they are discussed. Democracy needs both, but in a diverse society voting alone tends to repeat the same result, because those who are few always lose. Intercultural dialogue does not remove disagreement nor ask everyone to think alike: it asks that each group be able to say what it is not willing to give up, and why, so that the final agreement carries something of each of them. An agreement like that gets defended even when it is inconvenient, and that is why it lasts longer than any supervision.') + '</p>');
  widgetRuta();
  addP(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('Llevar el diálogo a tu escuela', 'Taking dialogue into your school'),
      '<p>' + T('Ya localizaste lo que cada párrafo defiende, reconociste los movimientos con que un texto sostiene su postura y distinguiste entre negar, tolerar y dialogar. Con eso puedes leer cualquier texto sobre sociedades multiculturales sin quedarte en el detalle que más te gustó, y también puedes intervenir en una asamblea diciendo qué afirmas y con qué lo respaldas. Lo que sigue no ocurre en la lectura sino en el trato diario: preguntar antes de decidir, escuchar razones que no traías y aceptar que te cambien la propuesta.',
                'You have located what each paragraph defends, recognised the moves a text holds its position up with, and told apart denying, tolerating and holding a dialogue. With that you can read any text about multicultural societies without stopping at whichever detail you liked best, and you can also speak up in an assembly saying what you claim and what you back it with. What comes next does not happen in the reading but in everyday dealings: asking before deciding, listening to reasons you were not carrying, and accepting that they change your proposal.') + '</p>');
  widgetBitacora();
  addP(q10());
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';

  var moduleTitle = 'Diálogo Intercultural y Construcción Democrática';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
