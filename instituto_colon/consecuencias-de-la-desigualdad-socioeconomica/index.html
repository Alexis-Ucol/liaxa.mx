        { t:{ es:'Se coloca en el periódico mural el nombre de quienes reciben apoyo.',
              en:'The names of those receiving support are posted on the wall newspaper.' }, c:2,
          why:{ es:'Señalar a quien recibe apoyo no le da conexión: le agrega una carga que los demás no llevan.',
                en:'Singling out whoever receives support does not give them a connection: it adds a burden the others do not carry.' } } ] }
  ];
  var st = pick(sets, rng);
  TAB = { st:st, order:shuffle([0,1,2,3,4,5], rng), placed:{}, sel:-1, tries:0, msg:null, cls:'', missIdx:-1 };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Tablero de acciones','Action board') + '</div>' +
      '<div class="wgt-q">' + S('Toca una propuesta y después la columna a la que pertenece.',
                                'Tap a proposal and then the column it belongs to.') + '</div>' +
      '<div id="tabBox"></div>' +
    '</div>';
}
function tabCols(){
  return [ S('Quita el obstáculo','Removes the obstacle'),
           S('Alivia mientras tanto','Eases things meanwhile'),
           S('Carga el costo a quien menos tiene','Puts the cost on whoever has least') ];
}
function tabRender(){
  if (!TAB) return;
  var box = document.getElementById('tabBox');
  if (!box) return;
  var cols = tabCols();
  var colHtml = cols.map(function(c, k){
    var items = '';
    Object.keys(TAB.placed).forEach(function(id){
      if (TAB.placed[id] === k) items += '<div class="bitem">' + TAB.st.cards[id].t[LANG] + '</div>';
    });
    return '<div class="bcol' + (TAB.sel >= 0 ? ' armed' : '') + '" onclick="tabDrop(' + k + ')">' +
             '<div class="bcol-h">' + c + '</div>' + items + '</div>';
  }).join('');
  var count = Object.keys(TAB.placed).length;
  var cards = TAB.order.map(function(id, k){
    var used = TAB.placed.hasOwnProperty(id);
    var cl = 'acard' + (used ? ' used' : '') + (TAB.sel === id ? ' sel' : '') + (TAB.missIdx === id ? ' miss' : '');
    return '<div class="' + cl + '" onclick="tabPick(' + id + ')">' + TAB.st.cards[id].t[LANG] + '</div>';
  }).join('');
  var def = TAB.sel >= 0
    ? S('Ahora toca la columna donde va esa propuesta.','Now tap the column where that proposal goes.')
    : S('Pregúntate de cada propuesta: ¿quita lo que provoca el problema, lo hace más llevadero por un rato, o le pasa el costo a quien ya venía con menos?',
        'Ask of each proposal: does it remove what causes the problem, does it make it more bearable for a while, or does it pass the cost to whoever already had less?');
  var done = count >= 6;
  var msg = done
    ? S('Las seis quedaron clasificadas. Las tres columnas existen en la vida real y las de en medio hacen falta, pero solo la primera cambia lo que produjo el problema. Proponer una acción es decir qué obstáculo quita, a quién llega y cómo se sostiene.',
        'All six are sorted. The three columns exist in real life and the middle ones are needed, but only the first changes what produced the problem. Proposing an action means saying which obstacle it removes, who it reaches and how it is sustained.')
    : (TAB.msg || def);
  box.innerHTML =
    '<div class="wcase">' + TAB.st.ctx[LANG] + '</div>' +
    '<div class="board">' + colHtml + '</div>' +
    (done ? '' : '<div class="cardlist">' + cards + '</div>') +
    '<div class="wmsg' + (done ? ' ok' : (TAB.cls ? ' ' + TAB.cls : '')) + '">' + msg + '</div>' +
    (count > 0 ? '<div class="wrow"><button class="wbtn" onclick="tabReset()">' + S('Vaciar el tablero','Clear the board') + '</button></div>' : '') +
    '<div class="wprog">' + S('Propuestas colocadas: ','Proposals placed: ') + count + ' / 6</div>';
}
function tabPick(id){
  if (!TAB || TAB.placed.hasOwnProperty(id)) return;
  TAB.sel = (TAB.sel === id) ? -1 : id;
  TAB.tries = 0; TAB.missIdx = -1; TAB.msg = null; TAB.cls = '';
  tabRender();
}
function tabDrop(k){
  if (!TAB || TAB.sel < 0) return;
  var id = TAB.sel, card = TAB.st.cards[id];
  if (card.c === k) {
    TAB.placed[id] = k; TAB.sel = -1; TAB.tries = 0; TAB.missIdx = -1;
    TAB.msg = card.why[LANG]; TAB.cls = 'ok';
    tabRender(); return;
  }
  TAB.tries++; TAB.missIdx = id; TAB.cls = 'warn';
  var cols = tabCols();
  TAB.msg = S('Esa propuesta regresó a la lista. ','That proposal came back to the list. ') + card.why[LANG];
  if (TAB.tries >= 3) {
    TAB.placed[id] = card.c; TAB.sel = -1; TAB.tries = 0; TAB.missIdx = -1;
    TAB.msg = card.why[LANG] + ' ' + S('Por eso quedó en ','That is why it went to ') + '"' + cols[card.c] + '".';
    TAB.cls = 'ok';
  }
  tabRender();
}
function tabReset(){
  if (!TAB) return;
  TAB.placed = {}; TAB.sel = -1; TAB.tries = 0; TAB.msg = null; TAB.cls = ''; TAB.missIdx = -1;
  tabRender();
}

/* ================================================
   buildLesson — concept, manipulative, graded problems, interleaved (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';
  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('No toda diferencia es una desigualdad','Not every difference is an inequality') + '</h2>' +
    '<p>' + S('Las personas somos distintas en muchas cosas: la comida que preferimos, la música que escuchamos, el oficio que soñamos. Ninguna de esas diferencias le quita nada a nadie. La desigualdad socioeconómica es otra cosa: aparece cuando el ingreso de un hogar, el tipo de trabajo que tienen sus integrantes o el lugar donde está su casa terminan decidiendo a qué puede llegar esa familia y a qué no.',
              'People differ in many things: the food we prefer, the music we listen to, the trade we dream of. None of those differences takes anything away from anyone. Socioeconomic inequality is something else: it appears when a household\'s income, the kind of work its members have or the place where their home stands end up deciding what that family can reach and what it cannot.') + '</p>' +
    '<p>' + S('Por eso la desigualdad no se mide solo contando el dinero que entra a cada casa. Se mide en consecuencias: quién llega al médico a tiempo, quién termina la secundaria, quién duerme bajo un techo firme, quién puede opinar en las decisiones de su comunidad. El dinero es el punto de partida; las consecuencias son lo que hay que mirar.',
              'That is why inequality is not measured only by counting the money coming into each home. It is measured in consequences: who reaches a doctor in time, who finishes secondary school, who sleeps under a solid roof, who gets to speak in their community\'s decisions. Money is the starting point; consequences are what has to be looked at.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Diferencia','Difference') + '</div><div class="rform">' + S('cambia la costumbre','the custom changes') + '</div><div class="rnote">' + S('Gustos, tradiciones y proyectos distintos entre familias.','Different tastes, traditions and projects between families.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Desigualdad socioeconómica','Socioeconomic inequality') + '</div><div class="rform">' + S('cambia el acceso','access changes') + '</div><div class="rnote">' + S('El ingreso, el empleo o el lugar de residencia deciden a qué llega cada quien.','Income, work or place of residence decide what each person reaches.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Pregunta clave','Key question') + '</div><div class="rform">' + S('¿decide el acceso?','does it decide access?') + '</div><div class="rnote">' + S('Si la respuesta es sí, deja de ser solo una diferencia.','If the answer is yes, it stops being just a difference.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Dónde se ve','Where it shows') + '</div><div class="rform">' + S('en las consecuencias','in the consequences') + '</div><div class="rnote">' + S('Salud, estudios, vivienda, trabajo, seguridad y participación.','Health, schooling, housing, work, safety and participation.') + '</div></div>' +
    '</div>' +
    '<div class="callout"><p><strong>' + S('Ojo: ','Careful: ') + '</strong>' +
      S('un derecho puede estar reconocido para toda la población y aun así quedar fuera del alcance de una parte de ella. Ahí es donde se lee la desigualdad.',
        'a right can be recognized for the whole population and still remain out of reach for part of it. That is where inequality is read.') + '</p></div>' +
    buildDif(rng));
  difRender();

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Cuatro situaciones en la asamblea', en:'Four situations at the assembly' }, showWork:false,
      stmt:{ es:'En una asamblea escolar se mencionan cuatro situaciones que ocurren en el municipio. ¿Cuál de ellas describe una desigualdad socioeconómica y no simplemente una diferencia entre las personas?',
             en:'At a school assembly, four situations happening in the municipality are mentioned. Which one describes a socioeconomic inequality and not simply a difference between people?' },
      options:{ es:[
        'Las familias de la parte alta reciben agua una vez por semana, mientras el resto de la localidad la recibe todos los días.',
        'Unas familias celebran el fin de año con una cena numerosa y otras con una comida entre pocas personas.',
        'Algunas personas del municipio se trasladan en bicicleta y otras prefieren caminar hasta su lugar de trabajo.',
        'En una misma cuadra conviven familias que llegaron hace treinta años y otras que llegaron el año pasado.' ],
        en:[
        'The families in the upper part receive water once a week, while the rest of the town receives it every day.',
        'Some families celebrate the end of the year with a large dinner and others with a meal among a few people.',
        'Some people in the municipality travel by bicycle and others prefer to walk to their workplace.',
        'On the same block there are families who arrived thirty years ago and others who arrived last year.' ] },
      correct:0,
      hint:{ es:'Pregúntate en cuál de las cuatro situaciones la posición económica de la familia está decidiendo a qué puede llegar.',
             en:'Ask yourself in which of the four situations the family\'s economic position is deciding what it can reach.' },
      explanation:{ es:'Recibir agua una vez por semana o todos los días no es una preferencia: es un acceso desigual a un servicio del que dependen la salud y la vida diaria de la casa. Las otras tres describen costumbres, formas de trasladarse o antigüedad en el barrio, y ninguna cierra el acceso de nadie a un derecho.',
                    en:'Receiving water once a week or every day is not a preference: it is unequal access to a service the household\'s health and daily life depend on. The other three describe customs, ways of getting around or time in the neighborhood, and none of them closes off anyone\'s access to a right.' } },
    { title:{ es:'El criterio que las separa', en:'The criterion that separates them' }, showWork:false,
      stmt:{ es:'Dos estudiantes discuten en clase. Uno afirma que cualquier diferencia entre familias ya es una desigualdad; el otro sostiene que hay que revisar caso por caso. ¿Qué criterio permite decidir cuándo una diferencia es además una desigualdad socioeconómica?',
             en:'Two students argue in class. One claims that any difference between families is already an inequality; the other holds that each case has to be reviewed. Which criterion makes it possible to decide when a difference is also a socioeconomic inequality?' },
      options:{ es:[
        'Que la posición económica del hogar esté decidiendo a qué servicios y derechos puede llegar la familia.',
        'Que la diferencia se note a simple vista al comparar dos casas ubicadas en la misma calle.',
        'Que la mayoría de las familias del lugar considere injusta la situación cuando se les pregunta.',
        'Que la diferencia se mantenga sin cambios durante varios años seguidos en la comunidad.' ],
        en:[
        'That the household\'s economic position is deciding which services and rights the family can reach.',
        'That the difference is visible at a glance when comparing two houses located on the same street.',
        'That most families in the place consider the situation unfair when they are asked about it.',
        'That the difference stays unchanged for several years in a row in the community.' ] },
      correct:0,
      hint:{ es:'Busca el criterio que habla de acceso, y no de apariencia, de opinión ni de duración.',
             en:'Look for the criterion that talks about access, and not about appearance, opinion or duration.' },
      explanation:{ es:'Una diferencia se vuelve desigualdad socioeconómica cuando el ingreso, el empleo o el lugar de residencia determinan a qué derechos puede llegar una familia. Que se note a simple vista, que parezca injusta o que dure muchos años no alcanza para decidirlo: el criterio es el acceso.',
                    en:'A difference becomes socioeconomic inequality when income, work or place of residence determine which rights a family can reach. Being visible at a glance, seeming unfair or lasting many years is not enough to decide it: the criterion is access.' } }
  ], rng), rng);

  /* ── PROBLEMA 2 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Gratuito no siempre es alcanzable', en:'Free is not always reachable' }, showWork:false,
      stmt:{ es:'La atención en una clínica es gratuita para toda la población del municipio, pero la clínica solo abre en la cabecera y en horario laboral. Quienes trabajan por jornada en las comunidades casi nunca logran asistir. ¿Qué muestra este caso sobre las consecuencias de la desigualdad socioeconómica?',
             en:'Care at a clinic is free for the whole population of the municipality, but the clinic only opens in the municipal seat and during working hours. Those doing day work in the communities almost never manage to attend. What does this case show about the consequences of socioeconomic inequality?' },
      options:{ es:[
        'Que un derecho puede estar reconocido para todas las personas y aun así quedar fuera del alcance de quienes no pueden dejar de trabajar ni pagar el traslado.',
        'Que el servicio dejaría de representar un costo para el municipio si abriera también en las comunidades más alejadas.',
        'Que la población de la cabecera se enferma con menos frecuencia que la población del resto del municipio.',
        'Que los horarios de atención deberían decidirse mediante una votación entre el personal que trabaja en la clínica.' ],
        en:[
        'That a right can be recognized for everyone and still remain out of reach for those who cannot stop working or pay for the trip.',
        'That the service would stop representing a cost for the municipality if it also opened in the most distant communities.',
        'That the population of the municipal seat falls ill less often than the population of the rest of the municipality.',
        'That opening hours should be decided by a vote among the staff working at the clinic.' ] },
      correct:0,
      hint:{ es:'Compara lo que la clínica ofrece en el papel con lo que una jornada de trabajo y una hora de camino permiten en la práctica.',
             en:'Compare what the clinic offers on paper with what a work shift and an hour of travel allow in practice.' },
      explanation:{ es:'La gratuidad elimina el precio de la consulta, pero no el costo del traslado ni el día de trabajo que se pierde. Por eso el derecho queda declarado para toda la población y, al mismo tiempo, fuera del alcance real de una parte de ella. Esa distancia entre lo declarado y lo alcanzable es una consecuencia típica de la desigualdad socioeconómica.',
                    en:'Being free removes the price of the visit, but not the cost of the trip or the workday lost. That is why the right is declared for the whole population and, at the same time, out of the real reach of part of it. That distance between what is declared and what is reachable is a typical consequence of socioeconomic inequality.' } },
    { title:{ es:'Inscripción abierta, aula vacía', en:'Open enrollment, empty classroom' }, showWork:false,
      stmt:{ es:'En una localidad, el bachillerato más cercano está a hora y media y no hay transporte por la tarde. La inscripción no cuesta nada, pero cada año menos estudiantes de esa localidad continúan. ¿Qué consecuencia de la desigualdad socioeconómica describe mejor la situación?',
             en:'In one town, the nearest upper secondary school is an hour and a half away and there is no afternoon transport. Enrollment costs nothing, but each year fewer students from that town continue. Which consequence of socioeconomic inequality best describes the situation?' },
      options:{ es:[
        'El lugar donde vive una familia está decidiendo quién puede continuar estudiando, aunque la inscripción no tenga costo.',
        'La comunidad muestra poco interés por los estudios porque prefiere incorporarse temprano al trabajo.',
        'Las escuelas de la cabecera reciben más estudiantes porque ofrecen una mayor variedad de materias optativas.',
        'Los horarios escolares del país no coinciden con los horarios de trabajo que tienen las familias.' ],
        en:[
        'The place where a family lives is deciding who can continue studying, even though enrollment has no cost.',
        'The community shows little interest in studies because it prefers to join the workforce early.',
        'The schools in the municipal seat receive more students because they offer a wider range of elective subjects.',
        'School hours in the country do not match the working hours that families have.' ] },
      correct:0,
      hint:{ es:'Fíjate en qué condición cambia entre quienes continúan y quienes no, y si esa condición depende de la voluntad de cada estudiante.',
             en:'Notice which condition changes between those who continue and those who do not, and whether that condition depends on each student\'s will.' },
      explanation:{ es:'Lo que separa a quienes continúan de quienes no es la distancia y la falta de transporte, no la voluntad ni el interés. Cuando vivir lejos y no poder pagar el traslado deciden quién estudia, el domicilio se convierte en una barrera y la desigualdad se traduce en años de escuela perdidos.',
                    en:'What separates those who continue from those who do not is distance and the lack of transport, not willingness or interest. When living far away and being unable to pay for the trip decide who studies, the address becomes a barrier and inequality turns into lost years of school.' } }
  ], rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Las consecuencias se acumulan','Consequences pile up') + '</h2>' +
    '<p>' + S('Una consecuencia de la desigualdad casi nunca se queda quieta en un solo lugar. El agua insegura enferma, la enfermedad hace faltar a clases, las faltas dejan huecos en el aprendizaje, los huecos empujan a dejar la escuela y la escuela sin terminar limita el tipo de trabajo al que se puede llegar. Cada efecto se convierte en la causa del siguiente.',
              'A consequence of inequality almost never stays put in one place. Unsafe water causes illness, illness causes missed classes, absences leave gaps in learning, the gaps push toward leaving school, and unfinished school limits the kind of work you can reach. Each effect becomes the cause of the next one.') + '</p>' +
    '<p>' + S('Por eso dos personas que empezaron muy cerca pueden terminar muy lejos. No es que una haya querido más que la otra: es que una fue sorteando obstáculos que la otra nunca tuvo enfrente. A ese encadenamiento se le llama acumulación de desventajas, y explica por qué la desigualdad crece con el tiempo en lugar de quedarse igual.',
              'That is why two people who started very close can end up very far apart. It is not that one wanted it more than the other: it is that one kept dodging obstacles the other never faced. That chaining is called accumulation of disadvantages, and it explains why inequality grows over time instead of staying the same.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Lo importante: ','What matters: ') + '</strong>' +
      S('ninguna etapa por sí sola explica la distancia final. Hay que leer el recorrido completo para entender por qué se abrió.',
        'no single stage explains the final distance. The whole path has to be read to understand why it opened up.') + '</p></div>' +
    buildTray(rng));
  trRender();

  /* ── PROBLEMA 3 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Lo que muestra el recorrido', en:'What the path shows' }, showWork:false,
      stmt:{ es:'Un estudio siguió durante veinte años a dos grupos que empezaron la primaria con resultados parecidos. Al final, quienes venían de hogares con ingreso inestable habían cursado menos años de escuela y trabajaban sin contrato. ¿Qué explica mejor esa distancia final?',
             en:'A study followed two groups for twenty years who began primary school with similar results. In the end, those from households with unstable income had completed fewer years of school and worked without a contract. What best explains that final distance?' },
      options:{ es:[
        'Que cada etapa agregó una desventaja sobre la anterior, y enfermedades, faltas, trabajo temprano y estudios interrumpidos se fueron sumando.',
        'Que los resultados escolares del inicio de la primaria no eran un dato confiable para comparar a los dos grupos.',
        'Que los dos grupos tomaron decisiones distintas frente a oportunidades que en realidad eran las mismas para todos.',
        'Que veinte años son demasiados para que un estudio consiga seguir a las mismas personas sin perder información.' ],
        en:[
        'That each stage added a disadvantage on top of the previous one, and illness, absences, early work and interrupted studies kept adding up.',
        'That the school results at the start of primary were not a reliable figure for comparing the two groups.',
        'That the two groups made different decisions when facing opportunities that were in fact the same for everyone.',
        'That twenty years is too long for a study to follow the same people without losing information.' ] },
      correct:0,
      hint:{ es:'Piensa si la distancia final apareció de golpe en una sola etapa o si se fue formando a lo largo del recorrido.',
             en:'Think about whether the final distance appeared all at once at a single stage or built up along the path.' },
      explanation:{ es:'Los dos grupos partieron casi del mismo punto, así que la distancia no estaba al inicio: se formó etapa por etapa. Enfermarse más, faltar más, trabajar antes de tiempo y salir de la escuela son eslabones encadenados, y cada uno hizo más probable el siguiente. Eso es la acumulación de desventajas.',
                    en:'The two groups started from almost the same point, so the distance was not there at the beginning: it formed stage by stage. Falling ill more, missing more class, working too early and leaving school are chained links, and each one made the next more likely. That is the accumulation of disadvantages.' } },
    { title:{ es:'Una sola causa no alcanza', en:'One cause is not enough' }, showWork:false,
      stmt:{ es:'Un estudiante afirma que su vecino no terminó la secundaria por una única razón: se enfermaba mucho de niño. Al revisar la historia completa aparecen además el agua insegura en su casa, las faltas acumuladas, el trabajo de fin de semana y las tardes sin tiempo para estudiar. ¿Qué le falta a esa afirmación?',
             en:'A student claims his neighbor did not finish secondary school for a single reason: he was often ill as a child. Reviewing the full story, unsafe water at home, accumulated absences, weekend work and afternoons with no time to study also appear. What is missing from that claim?' },
      options:{ es:[
        'Que las desventajas se encadenaron, y la enfermedad fue solo el primer eslabón de una serie en la que cada etapa agregó un obstáculo nuevo.',
        'Que enfermarse durante la infancia no guarda ninguna relación con lo que ocurre después en la trayectoria escolar.',
        'Que sin conocer el diagnóstico médico exacto de esos años no es posible decir nada sobre el caso del vecino.',
        'Que la responsabilidad de que un estudiante termine la secundaria corresponde únicamente al personal de la escuela.' ],
        en:[
        'That the disadvantages chained together, and illness was only the first link in a series where each stage added a new obstacle.',
        'That falling ill during childhood bears no relation to what happens later in a school path.',
        'That without knowing the exact medical diagnosis from those years nothing can be said about the neighbor\'s case.',
        'That the responsibility for a student finishing secondary school lies solely with the school staff.' ] },
      correct:0,
      hint:{ es:'Revisa cuántos obstáculos distintos aparecen en la historia completa y si alguno de ellos podría explicar el desenlace por sí solo.',
             en:'Review how many distinct obstacles appear in the full story and whether any of them could explain the outcome on its own.' },
      explanation:{ es:'La enfermedad fue real, pero llegó acompañada del agua insegura que la provocaba, de las faltas que dejó, del trabajo que ocupó los fines de semana y del tiempo de estudio que nunca hubo. Explicar el desenlace con una sola causa deja fuera la cadena que lo hizo probable.',
                    en:'The illness was real, but it came together with the unsafe water that caused it, the absences it left, the work that took up the weekends and the study time that never existed. Explaining the outcome with a single cause leaves out the chain that made it likely.' } }
  ], rng), rng);

  /* ── PROBLEMA 4 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La consecuencia que casi no se nombra', en:'The consequence that is rarely named' }, showWork:false,
      stmt:{ es:'En una colonia sin drenaje, las enfermedades estomacales se repiten cada temporada de lluvias en las mismas familias. Cuando se habla del problema solo se menciona la salud. ¿Qué otra consecuencia se desprende directamente de esa situación?',
             en:'In a neighborhood with no drainage, stomach illnesses recur every rainy season in the same families. When the problem is discussed, only health is mentioned. What other consequence follows directly from that situation?' },
      options:{ es:[
        'Se pierden días de trabajo y de escuela, y con ellos parte del ingreso del hogar y del avance escolar de quienes estudian.',
        'Las familias aprenden a preparar remedios caseros que después comparten con el resto de sus vecinos.',
        'El número de habitantes de la colonia disminuye porque las familias se mudan al centro del municipio.',
        'Las autoridades sanitarias reducen sus visitas de inspección durante los meses de temporada de lluvias.' ],
        en:[
        'Work and school days are lost, and with them part of the household income and part of the school progress of those studying.',
        'The families learn to prepare home remedies that they later share with the rest of their neighbors.',
        'The number of residents in the neighborhood drops because the families move to the center of the municipality.',
        'Health authorities reduce their inspection visits during the months of the rainy season.' ] },
      correct:0,
      hint:{ es:'Sigue el efecto fuera del terreno de la salud: pregúntate qué deja de hacer una persona cada vez que se enferma.',
             en:'Follow the effect outside the field of health: ask what a person stops doing every time they fall ill.' },
      explanation:{ es:'La enfermedad no se queda dentro del cuerpo ni dentro de la casa: cada episodio se lleva días de trabajo y días de clase. Menos días trabajados significan menos ingreso, y menos días de clase significan más rezago. Así es como una falla de servicios termina afectando el ingreso y los estudios de la misma familia.',

  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Cuando la desventaja pasa a la siguiente generación','When disadvantage passes to the next generation') + '</h2>' +
    '<p>' + S('Lo que se acumula en una vida no siempre termina con esa vida. Un hogar con ingreso bajo tiene menos margen para sostener los estudios de quienes crecen en él; sin esos estudios, esas personas alcanzan empleos peor pagados; con esos empleos forman hogares que vuelven a tener ingreso bajo. El punto de llegada de una generación se convierte en el punto de partida de la siguiente.',
              'What piles up in one life does not always end with that life. A household with low income has less room to sustain the studies of those growing up in it; without those studies, those people reach worse paid jobs; with those jobs they form households that once again have low income. One generation\'s finish line becomes the next one\'s starting line.') + '</p>' +
    '<p>' + S('Esto se conoce como transmisión de la desigualdad, y es la razón por la que en algunas comunidades la misma situación reaparece con otros nombres cada veinte o treinta años. No es un destino ni una herencia biológica: es un circuito de condiciones materiales. Y como es un circuito, basta con cortar un eslabón y sostener ese corte para que deje de girar.',
              'This is known as the transmission of inequality, and it is why in some communities the same situation reappears under other names every twenty or thirty years. It is not a destiny or a biological inheritance: it is a circuit of material conditions. And since it is a circuit, cutting one link and sustaining that cut is enough to stop it turning.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Ojo: ','Careful: ') + '</strong>' +
      S('que algo se repita durante generaciones no significa que sea natural ni inevitable. Significa que nadie ha cortado el eslabón que lo sostiene.',
        'something repeating for generations does not mean it is natural or unavoidable. It means nobody has cut the link holding it up.') + '</p></div>' +
    buildWheel(rng));
  whRender();

      options:{ es:[
        'Que las condiciones que impiden estudiar se transmiten de una generación a la siguiente mientras ninguna medida las modifique.',

                    en:'What repeated was not a custom or a family trait, but the same material condition: a household needing income before its members finished studying. As long as that condition stays there, the next generation runs into it again, and that is why we speak of transmission of inequality and not of inheritance.' } },
    { title:{ es:'El argumento del esfuerzo', en:'The effort argument' }, showWork:false,

             en:'In a group discussion, someone holds that if a family\'s situation repeats generation after generation it is because nobody in it has tried hard enough. Which observation best challenges that argument?' },
      options:{ es:[
        'Que las tres generaciones enfrentaron los mismos obstáculos materiales, y el esfuerzo personal no retira del camino un obstáculo que es de todos.',
        'Que existen personas que lograron salir de esa situación por su cuenta, lo que demuestra que el esfuerzo siempre termina alcanzando.',
        'Que medir el esfuerzo real de una persona resulta prácticamente imposible y por eso conviene no discutir el asunto.',
        'Que cada generación enfrenta problemas propios de su época y no tiene sentido comparar unas con otras.' ],
        en:[

        'That there are people who got out of that situation on their own, which shows effort always ends up being enough.',
        'That measuring a person\'s real effort is practically impossible and so the matter is better left undiscussed.',

      explanation:{ es:'El argumento del esfuerzo supone que las tres generaciones tuvieron el mismo camino por delante. Lo que se repitió, en realidad, fue el obstáculo: la falta de ingreso estable, de escuela cercana o de servicios. Señalar esa condición compartida es lo que desmonta el argumento, porque ningún esfuerzo individual retira una barrera que es colectiva.',
                    en:'The effort argument assumes the three generations had the same road ahead. What actually repeated was the obstacle: the lack of stable income, of a nearby school or of services. Pointing to that shared condition is what dismantles the argument, because no individual effort removes a barrier that is collective.' } }
  ], rng), rng);

  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Una vida digna es un piso, no un premio','A dignified life is a floor, not a prize') + '</h2>' +
    '<p>' + S('Una vida digna es el conjunto de condiciones que toda persona necesita para vivir y desarrollarse: alimentación suficiente, salud, educación, una vivienda con servicios, un trabajo con derechos y voz en las decisiones que la afectan. No se gana por méritos ni se otorga como recompensa: corresponde a cada persona por el hecho de serlo, y garantizarla es una responsabilidad pública.',
              'A dignified life is the set of conditions every person needs in order to live and develop: enough food, health, education, housing with services, work with rights and a voice in the decisions that affect them. It is not earned through merit or granted as a reward: it belongs to each person simply for being one, and guaranteeing it is a public responsibility.') + '</p>' +
    '<p>' + S('Por eso no basta con que una acción exista. Para saber si de verdad garantiza ese piso hay que revisar tres cosas al mismo tiempo, y las tres tienen que cumplirse: si falta una, la acción se queda a medio camino.',
              'That is why it is not enough for an action to exist. To know whether it truly guarantees that floor, three things have to be checked at the same time, and all three must hold: if one is missing, the action stops halfway.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Cobertura','Coverage') + '</div><div class="rform">' + S('¿a quién llega?','who does it reach?') + '</div><div class="rnote">' + S('Debe alcanzar sobre todo a quienes parten con más obstáculos.','It must reach above all those starting with the most obstacles.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Permanencia','Permanence') + '</div><div class="rform">' + S('¿cuánto dura?','how long does it last?') + '</div><div class="rnote">' + S('Si termina, la situación regresa tal como estaba.','If it ends, the situation returns just as it was.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Dignidad','Dignity') + '</div><div class="rform">' + S('¿derecho o favor?','a right or a favor?') + '</div><div class="rnote">' + S('Nadie debe exponerse ni dar algo a cambio para recibirla.','Nobody should have to be exposed or give something in exchange to receive it.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Las tres juntas','All three together') + '</div><div class="rform">' + S('sin excepción','no exceptions') + '</div><div class="rnote">' + S('Con una sola que falle, el derecho queda sin garantizar.','With just one failing, the right is left unguaranteed.') + '</div></div>' +
    '</div>' +

  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('Quitar el obstáculo, aliviar el momento o pasar el costo','Removing the obstacle, easing the moment or passing the cost') + '</h2>' +
    '<p>' + S('Frente a la misma situación caben acciones muy distintas. Unas alivian lo inmediato: una colecta, una despensa, una jornada médica. Hacen falta, sostienen a alguien un mes difícil y nadie debería despreciarlas, pero cuando terminan la situación queda igual que antes. Otras quitan el obstáculo: un consultorio permanente, una ruta de transporte establecida, una beca escrita en el reglamento. Esas cambian lo que producía el problema.',
              'Faced with the same situation, very different actions are possible. Some ease the immediate: a collection drive, a food parcel, a medical day. They are needed, they hold someone up through a hard month and nobody should dismiss them, but when they end the situation is left just as it was. Others remove the obstacle: a permanent clinic, an established transport route, a scholarship written into the regulation. Those change what was producing the problem.') + '</p>' +
    '<p>' + S('Y hay un tercer grupo que empeora las cosas aunque suene razonable: pedir a quien menos tiene que ahorre, que contrate, que se traslade por su cuenta, o publicar la lista de quienes pidieron ayuda. Esas medidas trasladan el costo o señalan a la persona, y profundizan la desventaja en lugar de reducirla. Proponer una acción es responder tres preguntas: qué obstáculo quita, a quiénes alcanza y cómo se sostiene.',
              'And there is a third group that makes things worse even though it sounds reasonable: asking those with least to save up, to buy a plan, to travel on their own, or publishing the list of those who asked for help. Those measures shift the cost or single out the person, and they deepen the disadvantage instead of reducing it. Proposing an action means answering three questions: which obstacle it removes, who it reaches and how it is sustained.') + '</p>' +
    buildTab(rng));

      options:{ es:[
        'Porque las cobijas atienden un daño que ya ocurrió y el drenaje evita que vuelva a ocurrir, así que solo una actúa sobre la causa.',
        'Porque reunir cobijas requiere la participación de muchas más personas que rehacer una obra de drenaje pluvial.',
        'Porque las cobijas se entregan de inmediato y una obra de drenaje siempre tarda varios años en quedar concluida.',
        'Porque la ayuda organizada entre vecinos no forma parte de las acciones que una autoridad puede tomar en cuenta.' ],
        en:[
        'Because the blankets deal with damage that already happened and the drainage prevents it from happening again, so only one acts on the cause.',
        'Because collecting blankets requires the participation of many more people than rebuilding a storm drainage works.',
        'Because blankets are handed out immediately and a drainage works always takes several years to be completed.',
        'Because help organized among neighbors is not part of the actions an official can take into account.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué queda distinto en la colonia cuando llega la siguiente temporada de lluvias con cada una de las dos acciones.',
             en:'Ask what is different in the neighborhood when the next rainy season arrives, under each of the two actions.' },
      explanation:{ es:'Las cobijas hacen falta y sostienen a las familias en los días peores, pero al llegar la siguiente lluvia la colonia vuelve a inundarse. El drenaje rehecho cambia la condición que provoca la inundación. Las dos acciones sirven, pero no son equivalentes: solo una impide que el daño se repita.',
                    en:'The blankets are needed and hold the families up through the worst days, but when the next rain arrives the neighborhood floods again. Rebuilt drainage changes the condition that causes the flooding. Both actions are useful, but they are not equivalent: only one keeps the damage from repeating.' } }
  ], rng), rng);

  /* ── CIERRE ─────────────────────────────────────────────────── */
  addSection(S('CIERRE','CLOSING'),
    '<h2>' + S('Para cerrar','To close') + '</h2>' +
    '<p>' + S('Las dos preguntas que siguen retoman todo el recorrido de la guía.',
              'The two questions that follow take up the whole path of this guide.') + '</p>');

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La conclusión que no se sostiene', en:'The conclusion that does not hold' }, showWork:false,
      stmt:{ es:'Un equipo reunió estos datos de su comunidad: la clínica más cercana está a tres horas, la mitad de los hogares recibe agua por pipa y buena parte de las personas jóvenes deja el bachillerato antes de terminarlo. De las cuatro conclusiones que escribieron, ¿cuál no se sostiene con esos datos?',
             en:'A team gathered these figures about their community: the nearest clinic is three hours away, half the households receive water by truck and a large share of young people leave upper secondary before finishing. Of the four conclusions they wrote, which one does not hold up with those figures?' },
      options:{ es:[
        'Las personas jóvenes de la comunidad conceden poca importancia a los estudios y por eso abandonan el bachillerato.',
        'El acceso a la salud depende del tiempo y del dinero que cada familia pueda destinar al traslado hasta la clínica.',
        'El agua segura no está garantizada para todos los hogares y depende de un reparto que no llega todos los días.',
        'Continuar los estudios después de la secundaria no está al alcance de una parte de la comunidad.' ],
        en:[
        'Young people in the community place little importance on studying and that is why they leave upper secondary.',
        'Access to health depends on the time and money each family can put toward the trip to the clinic.',
        'Safe water is not guaranteed for every household and depends on a delivery that does not arrive every day.',
        'Continuing studies after secondary school is out of reach for part of the community.' ] },
      correct:0,
      hint:{ es:'Compara cada conclusión con lo que los datos registran realmente, y descarta la que agrega algo que ningún dato mide.',
             en:'Compare each conclusion with what the figures actually record, and rule out the one adding something no figure measures.' },
      explanation:{ es:'Los datos registran distancias, servicios y trayectorias escolares: condiciones materiales. Ninguno mide lo que las personas jóvenes piensan de los estudios. Esa conclusión no se desprende de la información, atribuye una intención a quienes enfrentan el obstáculo y desvía la mirada de lo que sí está documentado.',
                    en:'The figures record distances, services and school paths: material conditions. None of them measures what young people think about studying. That conclusion does not follow from the information, it attributes an intention to those facing the obstacle and shifts attention away from what is documented.' } },
    { title:{ es:'Un planteamiento bien construido', en:'A well built statement' }, showWork:false,
      stmt:{ es:'Un cartel del periódico mural dice: en la zona alta el agua llega una vez por semana, por eso las enfermedades estomacales se repiten y se pierden días de escuela, y proponemos ampliar la red hasta la zona alta con mantenimiento permanente. ¿Qué hace que este planteamiento esté bien construido?',
             en:'A poster on the wall newspaper reads: in the upper area water arrives once a week, that is why stomach illnesses recur and school days are lost, and we propose extending the network to the upper area with permanent maintenance. What makes this statement well built?' },
      options:{ es:[
        'Que parte de un hecho verificable, nombra la consecuencia que ese hecho produce y propone una acción sostenida sobre esa causa.',
        'Que utiliza un lenguaje directo y consigue llamar la atención de quienes pasan frente al periódico mural de la escuela.',
        'Que menciona una zona específica de la comunidad en lugar de referirse a la situación del municipio en general.',
        'Que propone una acción que puede llevarse a cabo sin necesidad de destinar presupuesto público a la comunidad.' ],
        en:[
        'That it starts from a verifiable fact, names the consequence that fact produces and proposes a sustained action on that cause.',
        'That it uses direct language and manages to catch the attention of those walking past the school wall newspaper.',
        'That it mentions a specific area of the community instead of referring to the municipality\'s situation in general.',
        'That it proposes an action that can be carried out without needing to assign public budget to the community.' ] },
      correct:0,
      hint:{ es:'Revisa si el cartel encadena las tres partes que debe tener una propuesta: de qué parte, qué provoca y qué se hará.',
             en:'Check whether the poster chains the three parts a proposal should have: what it starts from, what it causes and what will be done.' },
      explanation:{ es:'El cartel no se queda en la denuncia ni en el deseo: enuncia un hecho que se puede comprobar, muestra la consecuencia que provoca en la salud y en la escuela, y propone una acción que actúa sobre la causa y se sostiene con mantenimiento permanente. Esas tres partes juntas son las que permiten evaluar y exigir una propuesta.',
                    en:'The poster does not stop at complaint or wish: it states a fact that can be checked, shows the consequence it produces in health and school, and proposes an action that acts on the cause and holds up with permanent maintenance. Those three parts together are what make a proposal possible to evaluate and to demand.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Por qué es un asunto de derechos', en:'Why it is a matter of rights' }, showWork:false,
      stmt:{ es:'Al terminar su proyecto, el grupo debe escribir una frase que explique por qué la desigualdad socioeconómica es un asunto de derechos y no solamente de dinero. ¿Cuál de las cuatro lo expresa mejor?',
             en:'On finishing their project, the group has to write a sentence explaining why socioeconomic inequality is a matter of rights and not only of money. Which of the four expresses it best?' },
      options:{ es:[
        'Porque cuando el ingreso o el domicilio deciden quién se atiende, quién estudia y quién vive con servicios, lo que se reparte de forma desigual son derechos.',
        'Porque el dinero que entra a un hogar suele variar de un mes a otro y eso dificulta la planeación de los gastos familiares.',
        'Porque quienes tienen mayores ingresos aportan más impuestos y con ellos se sostienen los servicios de toda la población.',
        'Porque los derechos están escritos en documentos oficiales que toda la población debería conocer mucho mejor.' ],
        en:[
        'Because when income or address decide who gets care, who studies and who lives with services, what is unequally distributed are rights.',
        'Because the money coming into a household tends to vary from month to month and that makes planning family spending harder.',
        'Because those with higher incomes contribute more taxes and with them the services of the whole population are sustained.',
        'Because rights are written in official documents that the whole population should get to know much better.' ] },
      correct:0,
      hint:{ es:'Busca la frase que conecta la posición económica de un hogar con el acceso concreto a la salud, la escuela y los servicios.',
             en:'Look for the sentence connecting a household\'s economic position with concrete access to health, school and services.' },
      explanation:{ es:'A lo largo de la guía las consecuencias fueron siempre las mismas: atención médica que no llega, estudios que se interrumpen, viviendas sin servicios, entornos inseguros. Todo eso son derechos. Cuando el ingreso o el domicilio deciden quién los alcanza, la desigualdad deja de ser una diferencia de dinero y se convierte en un reparto desigual de derechos.',
                    en:'Throughout the guide the consequences were always the same: medical care that does not arrive, studies that get interrupted, homes without services, unsafe surroundings. All of those are rights. When income or address decide who reaches them, inequality stops being a difference in money and becomes an unequal distribution of rights.' } },
    { title:{ es:'El siguiente paso del grupo', en:'The group\'s next step' }, showWork:false,
      stmt:{ es:'El grupo ya documentó que la falta de transporte por la tarde deja fuera del bachillerato a quienes viven en las comunidades alejadas. Ahora presentarán una acción ante la autoridad municipal. ¿Qué debe incluir su propuesta para garantizar el derecho y no solo señalar el problema?',
             en:'The group has documented that the lack of afternoon transport leaves students from the outlying communities out of upper secondary. They will now present an action to the municipal authority. What must their proposal include in order to guarantee the right and not just point out the problem?' },
      options:{ es:[
        'Qué obstáculo quita, a quiénes alcanza incluidas las comunidades más alejadas, y con qué presupuesto se sostiene cada año.',
        'Cuántas personas del grupo participaron en la investigación y durante cuántas semanas estuvieron reuniendo la información.',
        'Qué opinan las autoridades sobre el problema y en qué fecha estarían dispuestas a recibir al grupo en sus oficinas.',
        'Cuáles son las causas históricas del rezago de la comunidad y desde qué año se viene presentando esa situación.' ],
        en:[
        'Which obstacle it removes, who it reaches including the most distant communities, and with what budget it is sustained each year.',
        'How many people in the group took part in the research and for how many weeks they were gathering the information.',
        'What the authorities think about the problem and on what date they would be willing to receive the group at their offices.',
        'What the historical causes of the community\'s lag are and since what year that situation has been occurring.' ] },
      correct:0,
      hint:{ es:'Recuerda las tres condiciones que debe cumplir una acción para que un derecho quede realmente garantizado.',
             en:'Recall the three conditions an action has to meet for a right to be genuinely guaranteed.' },
      explanation:{ es:'Una propuesta que garantiza un derecho responde a las tres condiciones al mismo tiempo: dice qué obstáculo elimina, asegura que alcance a quienes parten con más desventaja y explica con qué recursos se sostiene año con año. Los datos del proceso, la agenda de las autoridades y los antecedentes históricos acompañan el trabajo, pero por sí solos no garantizan nada.',
                    en:'A proposal that guarantees a right answers the three conditions at once: it says which obstacle it removes, it makes sure it reaches those starting with the most disadvantage and it explains with what resources it is sustained year after year. The process figures, the authorities\' agenda and the historical background accompany the work, but on their own they guarantee nothing.' } }
  ], rng), rng);

  /* Los lienzos se vuelven a dibujar al cambiar de tamaño o de tema (Rule 14). */
  if (!window.__liaxaRedrawHooked) {
    window.__liaxaRedrawHooked = true;
    var redrawAll = function(){
      if (typeof TRY_ !== 'undefined' && TRY_) trDraw();
      if (typeof WHL  !== 'undefined' && WHL)  whDraw();
      if (typeof MDS  !== 'undefined' && MDS)  mdDraw();
    };
    window.addEventListener('resize', redrawAll);
    try {
      new MutationObserver(redrawAll).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
    } catch(e) {}
  }
}
</script>
</body>
</html>
