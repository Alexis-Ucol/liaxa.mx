<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Resistencia de los Pueblos Originarios</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">La Resistencia de los Pueblos Originarios</div>
    <div class="wcourse" id="wcourse-el">Historia · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">La Resistencia de los Pueblos Originarios</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c3c9c', primaryDark:'#041d4f', primaryBg:'#e5ebf8',
  accent:'#9cb4e4', accentBg:'#e3e9f7',
  darkPrimary:'#3369d6', darkPrimaryDark:'#6595f5', darkPrimaryBg:'#061940',

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;

          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {

        pp.src = dataUrl; pp.style.display = 'block';

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

function shuffleIdx(n, rng){
  var a = [], i;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function addProblem(spec, rng){
  var so = shuffleOpts(spec.options, spec.correct, rng);
  var p = { title: spec.title, questionText: spec.questionText, fn: '', hint: spec.hint || '',
            explanation: spec.explanation || '', options: so.options, correctIdx: so.correctIdx,
            showWork: !!spec.showWork, studentChoice: null, pendingChoice: null };

  buildOneCard(p, problems.length - 1);
}

   reversible, revelacion al tercer intento (Regla 8, patron A).

var MA_POOL = [
  { c:'legal', es:'Las autoridades del pueblo llevan sus títulos de tierras ante el juez de la ciudad.', en:'The village authorities take their land titles before the judge in the city.' },
  { c:'legal', es:'El pueblo paga a un escribano para traducir su reclamo y presentarlo por escrito.', en:'The village pays a scribe to translate its claim and present it in writing.' },
  { c:'legal', es:'Los principales piden por carta que se revise la cuenta del tributo tras una mala cosecha.', en:'The village elders ask by letter for the tribute account to be reviewed after a bad harvest.' },
  { c:'legal', es:'Un pueblo manda a dos representantes a seguir su pleito en la audiencia durante meses.', en:'A village sends two representatives to follow its lawsuit at the court for months.' },
  { c:'retiro', es:'Varias familias se mudan a las barrancas de la sierra, lejos del camino real.', en:'Several families move to the ravines of the sierra, far from the royal road.' },
  { c:'retiro', es:'Un grupo abandona el pueblo nuevo y regresa a vivir junto a sus antiguas milpas.', en:'A group leaves the new town and returns to live next to its old maize fields.' },
  { c:'retiro', es:'Los jóvenes se ausentan del caserío la semana en que llega el repartidor de turnos.', en:'The young people leave the hamlet the week the labor officer arrives.' },
  { c:'armas', es:'Los pueblos de una comarca expulsan a las autoridades y se gobiernan por su cuenta.', en:'The villages of a district expel the authorities and govern on their own.' },
  { c:'armas', es:'Un grupo armado corta el paso de las recuas que llevan bastimentos a la mina.', en:'An armed group blocks the mule trains carrying supplies to the mine.' },
  { c:'armas', es:'Varios pueblos se alían y toman por la fuerza el real de minas de la región.', en:'Several villages ally and seize the mining camp of the region by force.' }
];
var MA_CATS = [
  { k:'legal',  es:'Por la vía legal',        en:'Through the courts' },
  { k:'retiro', es:'Por la vía del retiro',   en:'Through withdrawal' },
  { k:'armas',  es:'Por la vía de las armas', en:'Through arms' }
];
var MA_NUDGE = {
  legal:  { es:'En esa columna van los casos en que el pueblo acude a papeles, jueces y tribunales. Vuelve a leer qué hace la gente de este caso.', en:'That column holds cases where the village turns to papers, judges and courts. Read again what the people in this case do.' },
  retiro: { es:'En esa columna van los casos en que la gente se aparta o se aleja para escapar de la carga. Lee otra vez hacia dónde se dirige este caso.', en:'That column holds cases where people move away or withdraw to escape the burden. Read again where this case is heading.' },
  armas:  { es:'En esa columna van los casos en que el pueblo toma las armas o expulsa a la autoridad. Revisa si eso ocurre en este caso.', en:'That column holds cases where the village takes up arms or expels the authorities. Check whether that happens in this case.' }
};
var MA_NOTE = {
  legal:  { es:'Fue la vía más usada: durante siglos los pueblos pleitearon por escrito.', en:'It was the most used path: for centuries villages litigated in writing.' },
  retiro: { es:'Apartarse también era resistir: sin gente, la carga no podía cobrarse.', en:'Withdrawing was also resisting: with no people, the burden could not be collected.' },
  armas:  { es:'El levantamiento solía llegar cuando las otras vías ya se habían agotado.', en:'The uprising usually came when the other paths had already been exhausted.' }
};
function mA_build(rng){
  var by = { legal:[], retiro:[], armas:[] };
  MA_POOL.forEach(function(it){ by[it.c].push(it); });
  var items = [];
  ['legal','retiro','armas'].forEach(function(k){
    shuffleIdx(by[k].length, rng).slice(0, 2).forEach(function(i){ items.push(by[k][i]); });
  });
  var ord = shuffleIdx(items.length, rng);
  var A = { items: ord.map(function(i){ return items[i]; }), placed:[], tries:[], rev:[], sel:null, done:0 };
  A.items.forEach(function(){ A.placed.push(null); A.tries.push(0); A.rev.push(false); });
  MANIP.A = A;
}
function mA_render(){
  var A = MANIP.A, i, pool = '';
  for (i = 0; i < A.items.length; i++){
    if (A.placed[i] === null)
      pool += '<div class="clscard' + (A.sel === i ? ' sel' : '') + '" onclick="mA_sel(' + i + ')">' + L(A.items[i]) + '</div>';
  }
  if (!pool) pool = '<div class="mzq">' + L({ es:'Ya no queda ningún caso en la lista.', en:'No cases are left in the list.' }) + '</div>';
  var cols = '<div class="clsgrid">';
  MA_CATS.forEach(function(c){
    var inner = '';
    for (var j = 0; j < A.items.length; j++){
      if (A.placed[j] === c.k)
        inner += '<div class="clscard ' + (A.rev[j] ? 'rev' : 'ok') + '">' + L(A.items[j]) + '</div>';
    }
    cols += '<div class="clscol" onclick="mA_drop(\'' + c.k + '\')"><div class="clshdr">' + L(c) + '</div>' + inner + '</div>';
  });
  cols += '</div>';
  document.getElementById('mzA').innerHTML =
    '<div class="mztitle">' + L({ es:'Seis casos de un archivo', en:'Six cases from an archive' }) + '</div>' +
    '<div class="mzq">' + L({ es:'Toca un caso y después la columna donde crees que va. Puedes seguir moviendo casos hasta que todos queden colocados.', en:'Tap a case and then the column where you think it belongs. Keep placing cases until all of them are sorted.' }) + '</div>' +
    '<div class="tlpool">' + pool + '</div>' + cols +
    '<div class="mzfb" id="fbA">' + (A.msg || L({ es:'Empieza por el primer caso de la lista.', en:'Start with the first case in the list.' })) + '</div>';
  if (A.kind) { var e = document.getElementById('fbA'); if (e) e.className = 'mzfb ' + A.kind; }
}
function mA_sel(i){
  var A = MANIP.A;
  if (A.placed[i] !== null) return;
  A.sel = (A.sel === i ? null : i);
  A.msg = L({ es:'Caso elegido. Ahora toca la columna que le corresponde.', en:'Case selected. Now tap the column where it belongs.' });
  A.kind = '';
  mA_render();
}
function mA_drop(cat){
  var A = MANIP.A;
  if (A.sel === null){
    A.msg = L({ es:'Primero toca un caso de la lista y después la columna.', en:'First tap a case in the list, then the column.' });
    A.kind = 'warn'; mA_render(); return;
  }
  var i = A.sel, it = A.items[i];
  if (it.c === cat){
    A.placed[i] = cat; A.sel = null; A.done++;
    A.msg = L({ es:'Bien colocado. ', en:'Well placed. ' }) + L(MA_NOTE[cat]);
    A.kind = 'ok';
  } else {
    A.tries[i]++;
    if (A.tries[i] >= 3){
      A.placed[i] = it.c; A.rev[i] = true; A.sel = null; A.done++;
      A.msg = L({ es:'Ese caso pertenece a ', en:'That case belongs to ' }) +
              L(MA_CATS.filter(function(c){ return c.k === it.c; })[0]).toLowerCase() + '. ' + L(MA_NOTE[it.c]);
      A.kind = 'warn';
    } else {
      A.msg = L(MA_NUDGE[cat]);
      A.kind = 'bad';
    }
  }
  if (A.done === A.items.length){
    A.msg = L({ es:'Los seis casos quedaron ordenados. Un mismo pueblo podía usar las tres vías en distintos momentos.', en:'All six cases are sorted. One village could use all three paths at different moments.' });
    A.kind = 'ok';
  }
  mA_render();

    options: [ f4 + L({ es:' pueblos', en:' villages' }), (n4 / 4) + L({ es:' pueblos', en:' villages' }),
               (n4 / 2) + L({ es:' pueblos', en:' villages' }), n4 + L({ es:' pueblos', en:' villages' }) ],
    correct: 0, showWork: true
  } : {
    title: L({ es:'Los que no mandaron representante', en:'Those who sent no representative' }),
    questionText: L({ es:'Una audiencia citó a los ' + n5 + ' pueblos de una provincia para revisar el cobro de turnos de trabajo. Del total, dos de cada cinco enviaron representante. ¿Cuántos pueblos no enviaron representante?',
                      en:'A court summoned the ' + n5 + ' villages of a province to review the collection of labor shifts. Of the total, two out of every five sent a representative. How many villages sent no representative?' }),
    hint: L({ es:'Divide los pueblos en cinco partes iguales y fíjate en cuántas partes quedan fuera de las que sí acudieron.', en:'Split the villages into five equal parts and look at how many parts are left outside those that did attend.' }),
    explanation: L({ es:'Cada parte tiene ' + n5 + ' entre 5 = ' + (n5 / 5) + ' pueblos; si dos partes enviaron representante, quedan tres partes sin enviar: ' + (n5 / 5) + ' x 3 = ' + f5,
                     en:'Each part has ' + n5 + ' divided by 5 = ' + (n5 / 5) + ' villages; if two parts sent a representative, three parts did not: ' + (n5 / 5) + ' x 3 = ' + f5 }),
    options: [ f5 + L({ es:' pueblos', en:' villages' }), (n5 * 2 / 5) + L({ es:' pueblos', en:' villages' }),
               (n5 / 5) + L({ es:' pueblos', en:' villages' }), n5 + L({ es:' pueblos', en:' villages' }) ],
    correct: 0, showWork: true
  }, rng);

  /* ══════════ CONCEPTO 4 ══════════ */
  addSection(L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Cómo terminaron y qué dejaron', en:'How they ended and what they left' }),
    L({ es:'<p>Los desenlaces fueron muy distintos. La guerra chichimeca no terminó con una victoria militar: después de cuarenta años de conflicto, la corona cambió de política y ofreció alimentos, herramientas y el fin de las expediciones de captura a cambio de la paz. En Nuevo México, en cambio, los pueblos sostuvieron su propio gobierno durante doce años antes de que las tropas regresaran. Otros levantamientos fueron derrotados en pocos meses y sus dirigentes castigados con dureza.</p>' +
              '<p>Aun en los casos derrotados, la resistencia dejó huellas: los pleitos por tierras continuaban en los tribunales años después del levantamiento, y muchos pueblos conservaron sus autoridades, su lengua y sus fiestas. Medir el resultado de un movimiento solo por quién ganó la última batalla deja fuera casi todo lo importante.</p>' +
              '<div class="callout"><p><strong>Emitir un juicio con fundamento.</strong> Para valorar un agravio no basta con indignarse: hay que decir qué se le quitó al pueblo, quién lo hizo, qué reclamó la comunidad y qué respuesta recibió. Un juicio sostenido en documentos pesa más que una opinión suelta.</p></div>',
        en:'<p>The outcomes were very different. The Chichimeca war did not end with a military victory: after forty years of conflict, the crown changed policy and offered food, tools and the end of capture expeditions in exchange for peace. In New Mexico, by contrast, the peoples sustained their own government for twelve years before the troops returned. Other uprisings were defeated within months and their leaders harshly punished.</p>' +
            '<p>Even in the defeated cases, resistance left traces: land lawsuits continued in the courts years after the uprising, and many villages kept their authorities, their language and their feasts. Measuring the result of a movement only by who won the last battle leaves out almost everything that matters.</p>' +
            '<div class="callout"><p><strong>Judging with grounds.</strong> To assess a grievance it is not enough to feel outrage: you have to say what was taken from the village, who took it, what the community claimed and what answer it received. A judgment held up by documents weighs more than a loose opinion.</p></div>' }));

  addSection(L({ es:'Explora', en:'Explore' }),
    L({ es:'Mide cuánto duró cada periodo', en:'Measure how long each period lasted' }),
    L({ es:'<p>Ajusta la barra hasta que el periodo termine exactamente en su año final. La barra te dice en vivo en qué año caería tu respuesta.</p>',
        en:'<p>Adjust the bar until the period ends exactly in its final year. The bar tells you live which year your answer would fall in.</p>' }) +
    '<div class="mzone" id="mzC"></div>');
  mC_build(rng); mC_render();

  /* ── P7 ── */
  addProblem(v7 === 0 ? {
    title: L({ es:'Una paz negociada', en:'A negotiated peace' }),
    questionText: L({ es:'Tras cuatro décadas de conflicto en el camino de la plata, la autoridad colonial dejó de enviar expediciones de captura y empezó a entregar alimentos y herramientas para conseguir la paz. Un estudiante debe explicar qué muestra ese desenlace. ¿Cuál explicación se sostiene mejor?',
                      en:'After four decades of conflict on the silver road, the colonial authority stopped sending capture expeditions and began delivering food and tools to obtain peace. A student has to explain what that outcome shows. Which explanation holds up best?' }),
    hint: L({ es:'Compara lo que la autoridad hacía al principio con lo que aceptó hacer al final.', en:'Compare what the authority did at the start with what it agreed to do in the end.' }),
    explanation: L({ es:'La autoridad abandonó su política anterior y aceptó negociar: eso indica que la resistencia sostenida durante décadas la obligó a cambiar de estrategia.',
                     en:'The authority abandoned its earlier policy and agreed to negotiate: that indicates the resistance sustained for decades forced it to change strategy.' }),
    options: [ L({ es:'Que la resistencia sostenida obligó a la autoridad a cambiar su política', en:'That sustained resistance forced the authority to change its policy' }),
               L({ es:'Que la expansión minera nunca afectó a los pueblos de esa región', en:'That mining expansion never affected the peoples of that region' }),
               L({ es:'Que la corona había perdido interés en los caminos hacia las minas', en:'That the crown had lost interest in the roads toward the mines' }),
               L({ es:'Que los acuerdos se firmaron antes de que existiera algún conflicto', en:'That the agreements were signed before any conflict existed' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Después de la derrota', en:'After the defeat' }),
    questionText: L({ es:'Un levantamiento fue sofocado en pocos meses y sus dirigentes castigados. Sin embargo, en los archivos aparecen escritos de ese mismo pueblo reclamando sus tierras veinte años más tarde. Un estudiante debe explicar qué permite afirmar ese dato. ¿Cuál afirmación se sostiene mejor?',
                      en:'An uprising was put down within months and its leaders punished. Yet the archives contain documents from that same village claiming its land twenty years later. A student has to explain what that fact supports. Which statement holds up best?' }),
    hint: L({ es:'Fíjate en que la comunidad sigue actuando después del final del levantamiento, pero de otro modo.', en:'Notice that the community keeps acting after the uprising ends, but in another way.' }),
    explanation: L({ es:'La derrota militar no terminó la defensa del pueblo: la comunidad siguió reclamando por la vía legal, que era otra de sus herramientas.',
                     en:'The military defeat did not end the defense of the village: the community kept claiming through the courts, which was another of its tools.' }),
    options: [ L({ es:'Que el pueblo continuó su defensa por otra vía después de la derrota', en:'That the village continued its defense by another path after the defeat' }),
               L({ es:'Que el levantamiento nunca llegó a afectar las tierras del pueblo', en:'That the uprising never came to affect the land of the village' }),
               L({ es:'Que los tribunales resolvían los reclamos el mismo año de presentarlos', en:'That the tribunals settled claims in the same year they were filed' }),
               L({ es:'Que el pueblo abandonó sus tierras al terminar el levantamiento', en:'That the village abandoned its land when the uprising ended' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ── P8 ── */
  addProblem(v8 === 0 ? {
    title: L({ es:'Cuál se sostuvo más tiempo', en:'Which one held on longer' }),
    questionText: L({ es:'Una ficha compara dos periodos: ' + L(s1) + ', de ' + s1.a + ' a ' + s1.b + ', y ' + L(s2) + ', de ' + s2.a + ' a ' + s2.b + '. ¿Cuántos años más se sostuvo el periodo más largo respecto del más corto?',
                      en:'A study card compares two periods: ' + L(s1) + ', from ' + s1.a + ' to ' + s1.b + ', and ' + L(s2) + ', from ' + s2.a + ' to ' + s2.b + '. How many more years did the longer period hold on compared with the shorter one?' }),
    hint: L({ es:'Obtén primero cuánto duró cada periodo y después compáralos entre sí.', en:'First work out how long each period lasted and then compare them with each other.' }),
    explanation: L({ es:'Un periodo duró ' + d1 + ' años y el otro ' + d2 + ' años; la diferencia es ' + dBig + ' - ' + dSml + ' = ' + dDif,
                     en:'One period lasted ' + d1 + ' years and the other ' + d2 + ' years; the difference is ' + dBig + ' - ' + dSml + ' = ' + dDif }),
    options: [ dDif + L({ es:' años', en:' years' }), dSum + L({ es:' años', en:' years' }),
               dBig + L({ es:' años', en:' years' }), dSml + L({ es:' años', en:' years' }) ],
    correct: 0, showWork: true
  } : {
    title: L({ es:'Años de resistencia sumados', en:'Years of resistance added up' }),
    questionText: L({ es:'Para una exposición escolar se quiere mostrar cuántos años de resistencia suman dos periodos juntos: ' + L(s1) + ', de ' + s1.a + ' a ' + s1.b + ', y ' + L(s2) + ', de ' + s2.a + ' a ' + s2.b + '. ¿Cuántos años suman entre los dos?',
                      en:'For a school exhibit, the aim is to show how many years of resistance two periods add up to together: ' + L(s1) + ', from ' + s1.a + ' to ' + s1.b + ', and ' + L(s2) + ', from ' + s2.a + ' to ' + s2.b + '. How many years do they add up to?' }),
    hint: L({ es:'Mide cada periodo por separado antes de juntarlos en un solo total.', en:'Measure each period separately before putting them together into a single total.' }),
    explanation: L({ es:'Un periodo duró ' + d1 + ' años y el otro ' + d2 + ' años; juntos suman ' + d1 + ' + ' + d2 + ' = ' + dSum,
                     en:'One period lasted ' + d1 + ' years and the other ' + d2 + ' years; together they add up to ' + d1 + ' + ' + d2 + ' = ' + dSum }),
    options: [ dSum + L({ es:' años', en:' years' }), dDif + L({ es:' años', en:' years' }),
               dBig + L({ es:' años', en:' years' }), (dSum - 1) + L({ es:' años', en:' years' }) ],
    correct: 0, showWork: true
  }, rng);

  /* ══════════ CONCEPTO 5 ══════════ */
  addSection(L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Una historia que sigue abierta', en:'A story that is still open' }),
    L({ es:'<p>La resistencia no se detuvo con el fin del periodo colonial. Durante el siglo XIX muchos pueblos volvieron a defender sus tierras comunales, y en el siglo XX y en el actual la defensa continúa por otras vías: asambleas comunitarias, autoridades propias, escuelas donde se enseña en lengua indígena y reclamos ante tribunales por el territorio y el agua.</p>' +
              '<p>Hoy se hablan en el país decenas de lenguas indígenas, agrupadas en varias familias lingüísticas, y muchas comunidades siguen tomando decisiones en asamblea. En 2001 la Constitución reconoció el derecho de los pueblos indígenas a la libre determinación y a la autonomía, y en 2003 se aprobó una ley general de derechos lingüísticos de los pueblos indígenas. Esos reconocimientos no aparecieron solos: llegaron después de décadas de reclamos sostenidos.</p>' +
              '<div class="callout"><p><strong>Que una lengua siga viva es un resultado histórico.</strong> Detrás de cada lengua que hoy se habla hay generaciones que decidieron enseñarla a sus hijos aunque la escuela, la ley o el mercado premiaran abandonarla.</p></div>',
        en:'<p>Resistance did not stop when the colonial period ended. During the nineteenth century many villages again defended their communal land, and in the twentieth century and today the defense continues by other paths: community assemblies, their own authorities, schools that teach in indigenous languages and claims before the courts over territory and water.</p>' +
            '<p>Dozens of indigenous languages are spoken in the country today, grouped into several language families, and many communities still make decisions in assembly. In 2001 the Constitution recognized the right of indigenous peoples to self determination and autonomy, and in 2003 a general law on the linguistic rights of indigenous peoples was passed. Those recognitions did not appear on their own: they came after decades of sustained claims.</p>' +
            '<div class="callout"><p><strong>A living language is a historical result.</strong> Behind every language spoken today there are generations who chose to teach it to their children even when school, law or the market rewarded giving it up.</p></div>' }));

  /* ── P9 ── */
  addProblem(v9 === 0 ? {
    title: L({ es:'Lenguas que siguen vivas', en:'Languages that are still alive' }),
    questionText: L({ es:'Después de siglos en los que hablar una lengua indígena fue motivo de castigo o de burla en escuelas y oficinas, hoy se hablan en el país decenas de esas lenguas y muchas comunidades siguen decidiendo en asamblea. ¿Qué permite sostener ese hecho?',
                      en:'After centuries in which speaking an indigenous language brought punishment or mockery in schools and offices, today dozens of those languages are spoken in the country and many communities still decide in assembly. What does that fact support?' }),
    hint: L({ es:'Piensa en qué tuvo que hacer cada generación para que la lengua llegara hasta la siguiente.', en:'Think about what each generation had to do for the language to reach the next one.' }),
    explanation: L({ es:'Que la lengua y la asamblea sigan vivas después de esa presión indica que sostenerlas fue una decisión repetida por muchas generaciones, es decir, una forma de resistencia.',
                     en:'That language and assembly are still alive after such pressure indicates that keeping them was a decision repeated by many generations, that is, a form of resistance.' }),
    options: [ L({ es:'Que conservar la lengua y el gobierno comunitario fue también resistir', en:'That keeping the language and community government was also a way of resisting' }),
               L({ es:'Que las autoridades coloniales promovieron el uso de esas lenguas', en:'That the colonial authorities promoted the use of those languages' }),
               L({ es:'Que las comunidades dejaron de organizarse al terminar la colonia', en:'That communities stopped organizing when the colonial period ended' }),
               L({ es:'Que las asambleas comunitarias se crearon apenas en el siglo XX', en:'That community assemblies were created only in the twentieth century' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Un reconocimiento que tardó', en:'A recognition that took time' }),
    questionText: L({ es:'En 2001 la Constitución reconoció el derecho de los pueblos indígenas a la libre determinación y a la autonomía. Antes de esa fecha, organizaciones y comunidades habían reclamado ese reconocimiento durante décadas, con documentos, marchas y propuestas. ¿Cómo se relaciona ese reconocimiento con la historia de resistencia?',
                      en:'In 2001 the Constitution recognized the right of indigenous peoples to self determination and autonomy. Before that date, organizations and communities had claimed that recognition for decades, with documents, marches and proposals. How does that recognition relate to the history of resistance?' }),
    hint: L({ es:'Observa quién puso el tema sobre la mesa y durante cuánto tiempo lo sostuvo.', en:'Look at who put the issue on the table and for how long they sustained it.' }),
    explanation: L({ es:'El reconocimiento llegó después de reclamos sostenidos por los propios pueblos, así que es un resultado de esa larga defensa y no una concesión espontánea.',
                     en:'The recognition came after claims sustained by the peoples themselves, so it is a result of that long defense and not a spontaneous concession.' }),
    options: [ L({ es:'Es resultado de reclamos sostenidos por los pueblos durante mucho tiempo', en:'It is the result of claims sustained by these peoples over a long time' }),
               L({ es:'Muestra que los pueblos dejaron de reclamar sus derechos en el siglo XX', en:'It shows that these peoples stopped claiming their rights in the twentieth century' }),
               L({ es:'Indica que la autonomía de los pueblos existía ya en la ley colonial', en:'It indicates that the autonomy of these peoples already existed in colonial law' }),
               L({ es:'Prueba que ningún pueblo había pedido ese reconocimiento antes de 2001', en:'It proves that no people had asked for that recognition before 2001' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ── P10 ── */
  addProblem(v10 === 0 ? {
    title: L({ es:'La conclusión del equipo', en:'The conclusion of the team' }),
    questionText: L({ es:'Un equipo revisó cartas de queja, mapas pintados y sentencias de varios pueblos, y ahora debe escribir una conclusión sobre los agravios que sufrieron. ¿Cuál conclusión se apoya mejor en esas fuentes?',
                      en:'A team reviewed letters of complaint, painted maps and rulings from several villages, and now has to write a conclusion about the grievances they suffered. Which conclusion is best supported by those sources?' }),
    hint: L({ es:'Elige la afirmación que podrías respaldar señalando documentos concretos del expediente.', en:'Choose the statement you could back up by pointing at concrete documents in the file.' }),
    explanation: L({ es:'Las fuentes muestran años de reclamos escritos antes de cualquier levantamiento, así que la conclusión sostenible es que los agravios estaban documentados y fueron reclamados una y otra vez.',
                     en:'The sources show years of written claims before any uprising, so the sustainable conclusion is that the grievances were documented and claimed again and again.' }),
    options: [ L({ es:'Los pueblos reclamaron esos agravios por escrito durante años antes de cualquier levantamiento', en:'These peoples claimed those grievances in writing for years before any uprising' }),
               L({ es:'Los levantamientos ocurrieron de improviso, sin quejas previas de los pueblos', en:'The uprisings happened suddenly, with no earlier complaints from these peoples' }),
               L({ es:'Los agravios afectaron a un solo pueblo aislado en todo el territorio', en:'The grievances affected only one isolated village in the whole territory' }),
               L({ es:'Las quejas de los pueblos se resolvían el mismo año en que se presentaban', en:'The complaints of these peoples were settled in the same year they were filed' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Cómo emitir un juicio', en:'How to make a judgment' }),
    questionText: L({ es:'Un grupo debe emitir un juicio sobre un agravio sufrido por un pueblo durante el periodo colonial y quiere que su conclusión resista una revisión de otro equipo. ¿Cuál procedimiento es el más adecuado?',
                      en:'A group has to make a judgment about a grievance suffered by a village during the colonial period and wants its conclusion to survive review by another team. Which procedure is the most suitable?' }),
    hint: L({ es:'Piensa qué haría falta para que otra persona pudiera comprobar tu conclusión.', en:'Think about what someone else would need in order to check your conclusion.' }),
    explanation: L({ es:'Un juicio se sostiene cuando contrasta lo que dicen las dos partes en los documentos y nombra con precisión qué derecho del pueblo fue afectado, porque así puede comprobarse.',
                     en:'A judgment holds when it contrasts what both sides say in the documents and names precisely which right of the village was affected, because it can then be checked.' }),
    options: [ L({ es:'Contrastar los documentos de las dos partes y precisar qué derecho fue afectado', en:'Contrast the documents of both sides and specify which right was affected' }),
               L({ es:'Tomar solo la versión de la autoridad, porque dejó más papeles escritos', en:'Take only the version of the authority, because it left more written papers' }),
               L({ es:'Decidir a partir de lo que hoy se piensa, sin revisar documentos de la época', en:'Decide from what people think today, without reviewing documents of the period' }),
               L({ es:'Suponer que todos los pueblos vivieron lo mismo en cualquier región', en:'Assume that every village lived through the same thing in any region' }) ],
    correct: 0, showWork: false
  }, rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'La Resistencia de los Pueblos Originarios';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
