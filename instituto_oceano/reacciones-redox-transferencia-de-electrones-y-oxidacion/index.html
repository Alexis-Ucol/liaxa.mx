<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reacciones Redox: Transferencia de Electrones y Oxidación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Reacciones Redox: Transferencia de Electrones y Oxidación</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Reacciones Redox: Transferencia de Electrones y Oxidación</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c6cb4', primaryDark:'#032f50', primaryBg:'#e5f0f8',
  accent:'#9ccce4', accentBg:'#e3f0f7',
  darkPrimary:'#3191d8', darkPrimaryDark:'#64b7f6', darkPrimaryBg:'#052741',

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'qui3_t12_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

   STATE

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'qui3_t12_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);

  setTimeout(function() {

        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {

        pp.src = dataUrl; pp.style.display = 'block';

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: v.fn ? L(v.fn) : '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: mesa de transferencia

   ══════════════════════════════════════════════════════════════════════════ */
var TRANSFER = [
  { don:{ lab:'Zn', es:'átomo de zinc de la lámina', en:'zinc atom of the strip' },

  { don:{ lab:'Na', es:'átomo de sodio', en:'sodium atom' },
    acc:{ lab:'Cl', es:'átomo de cloro', en:'chlorine atom' },
    aStart:0, n:1,
    fin:{ es:'los dos iones formados se atraen y forman la sal de mesa', en:'the two ions that form attract each other and make table salt' },
    why:{ es:'el sodio queda como ion Na<sup>+</sup> y el cloro como ion Cl<sup>-</sup>', en:'sodium ends up as a Na<sup>+</sup> ion and chlorine as a Cl<sup>-</sup> ion' } },

    fin:{ es:'la cinta arde con luz blanca y deja un polvo blanco de óxido', en:'the ribbon burns with a white light and leaves a white powder of oxide' },
    why:{ es:'el magnesio queda como ion Mg<sup>2+</sup> y el oxígeno como ion O<sup>2-</sup>', en:'magnesium ends up as a Mg<sup>2+</sup> ion and oxygen as an O<sup>2-</sup> ion' } },
  { don:{ lab:'Al', es:'átomo de aluminio', en:'aluminium atom' },
    acc:{ lab:'3 Ag<sup>+</sup>', es:'grupo de tres iones plata', en:'group of three silver ions' },
    aStart:3, n:3,
    fin:{ es:'el aluminio se disuelve y aparece plata brillante en el fondo', en:'the aluminium dissolves and shiny silver appears at the bottom' },
    why:{ es:'un solo átomo de aluminio alcanza para tres iones plata, porque cada uno necesita un electrón', en:'a single aluminium atom is enough for three silver ions, because each one needs one electron' } }
];

function wTransfer(rng, host){
  var RONDAS = shuffle(TRANSFER, rng).slice(0, 3);
  var st = { r:0, k:0, tries:0, hits:0, done:false };

  function puntos(k){
    var s = '';
    for (var i = 0; i < k; i++) s += '●';
    return s || '···';
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Mesa de transferencia', en:'Transfer bench' }) + '</div>' +
        '<div class="gw-fb good">' + L({ es:'Repartiste los electrones de los tres casos. Aciertos directos: ', en:'You shared out the electrons of the three cases. Direct hits: ' }) + st.hits + ' / ' + RONDAS.length + '. ' +
        L({ es:'En los tres, el número de electrones que salió de un lado es exactamente el que entró al otro.', en:'In all three, the number of electrons that left one side is exactly the number that entered the other.' }) + '</div>';
      return;
    }
    var d = RONDAS[st.r];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Mesa de transferencia', en:'Transfer bench' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Envía electrones de la partícula de la izquierda a la de la derecha y observa cómo cambian las dos cargas. Puedes devolverlos cuantas veces quieras antes de comprobar.',
        en:'Send electrons from the particle on the left to the one on the right and watch how both charges change. You can send them back as many times as you like before checking.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + RONDAS.length + '</div>' +
      '<div class="gw-lbl">' + L({ es:'Lo que se observa', en:'What is observed' }) + '</div>' +
      '<div>' + L(d.fin) + '</div>' +
      '<div class="tr-stage">' +
        '<div class="tr-atom" data-r="da"><div class="tr-lab">' + d.don.lab + '</div><div class="tr-sub">' + L(d.don) + '</div><div class="tr-charge" data-r="dq">0</div></div>' +
        '<div class="tr-mid"><div class="tr-flow" data-r="flow">' + puntos(0) + '</div><div class="tr-count" data-r="cnt">0 e</div></div>' +
        '<div class="tr-atom" data-r="aa"><div class="tr-lab">' + d.acc.lab + '</div><div class="tr-sub">' + L(d.acc) + '</div><div class="tr-charge" data-r="aq">' + fmtQ(d.aStart) + '</div></div>' +
      '</div>' +
      '<div class="gw-row">' +
        '<button class="gw-btn" data-act="menos">← ' + L({ es:'devolver', en:'send back' }) + '</button>' +
        '<button class="gw-btn" data-act="mas">' + L({ es:'enviar electrón', en:'send electron' }) + ' →</button>' +
        '<button class="gw-btn go" data-act="ver">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '</div>' +
      '<div class="gw-fb" data-r="fb">' + L({
        es:'Cada electrón que sale deja al de la izquierda con una carga positiva más y al de la derecha con una carga negativa más.',
        en:'Each electron that leaves makes the left one carry one more positive charge and the right one carry one more negative charge.'
      }) + '</div>';
    live();
  }

  function live(){
    var d = RONDAS[st.r];
    var dq = host.querySelector('[data-r="dq"]');
    var aq = host.querySelector('[data-r="aq"]');
    var fl = host.querySelector('[data-r="flow"]');
    var cn = host.querySelector('[data-r="cnt"]');
    var da = host.querySelector('[data-r="da"]');
    var aa = host.querySelector('[data-r="aa"]');
    if (dq) dq.textContent = fmtQ(st.k);
    if (aq) aq.textContent = fmtQ(d.aStart - st.k);
    if (fl) fl.textContent = puntos(st.k);
    if (cn) cn.textContent = st.k + ' e';
    if (da) da.classList.toggle('neutro', st.k === 0);
    if (aa) aa.classList.toggle('neutro', (d.aStart - st.k) === 0);
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function advance(){
    st.r++; st.k = 0; st.tries = 0;
    if (st.r >= RONDAS.length) st.done = true;
    setTimeout(render, 1600);
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done) return;
    var act = b.getAttribute('data-act');
    var d = RONDAS[st.r];
    if (act === 'mas'){ if (st.k < 5) st.k++; live(); return; }
    if (act === 'menos'){ if (st.k > 0) st.k--; live(); return; }
    if (act !== 'ver') return;
    if (st.k === d.n){
      st.hits++;
      say('good', L({ es:'Así es: ', en:'That is it: ' }) + L(d.why) + '.');
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.k = d.n; live();
      say('warm', L({ es:'El reparto correcto es de ', en:'The correct sharing is ' }) + d.n + L({ es:' electrón(es): ', en:' electron(s): ' }) + L(d.why) + '.');
      advance();
      return;
    }
    var qa = d.aStart - st.k;
    if (qa > 0){
      say('miss', L({ es:'Todavía no. La partícula de la derecha conserva carga ', en:'Not yet. The particle on the right still carries charge ' }) + fmtQ(qa) +
        L({ es:', así que le faltan electrones para quedar como en el producto: envía más.', en:', so it is still short of electrons to end up as in the product: send more.' }));
    } else if (qa < 0 && d.aStart > 0){
      say('miss', L({ es:'Te pasaste. La partícula de la derecha quedó con carga ', en:'Too many. The particle on the right ended up with charge ' }) + fmtQ(qa) +
        L({ es:', y en el producto no queda con carga negativa: devuelve electrones.', en:', and in the product it does not end up negatively charged: send some back.' }));
    } else {
      say('miss', L({ es:'Revisa la carga que quedó a la izquierda: ', en:'Look at the charge left on the left: ' }) + fmtQ(st.k) +
        L({ es:'. Compárala con la carga del ion que se forma en el producto y ajusta.', en:'. Compare it with the charge of the ion that forms in the product and adjust.' }));
    }
  });

  render();
}

   ══════════════════════════════════════════════════════════════════════════ */
var OXNUM = [

function wOxida(rng, host){
  var RONDAS = shuffle(OXNUM, rng).slice(0, 3);
  var st = { r:0, x:0, tries:0, hits:0, done:false };

  function render(){
    if (st.done){
      host.innerHTML =

        L({ es:'La suma en pantalla es la que manda: si no llega a la carga total, el valor propuesto no puede ser el bueno.', en:'The sum on the screen is what rules: if it does not reach the total charge, the proposed value cannot be the right one.' }) + '</div>';

    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Asignador de números de oxidación', en:'Oxidation number assigner' }) + '</div>' +

      '<div class="gw-fb" data-r="fb">' + L({
        es:'Prueba valores y observa la suma: hay uno solo que la deja en la carga total del compuesto.',
        en:'Try values and watch the sum: there is only one that leaves it at the total charge of the compound.'
      }) + '</div>';
    live();
  }

  function live(){
    var c = RONDAS[st.r];
    var suma = c.known + c.n * st.x;
    var v = host.querySelector('[data-r="val"]');
    var s = host.querySelector('[data-r="sum"]');
    if (v) v.textContent = c.el + ' = ' + fmtQ(st.x);
    if (s){
      s.textContent = L({ es:'suma actual: ', en:'current sum: ' }) + fmtQ(suma);
      s.classList.toggle('hit', suma === c.target);
    }
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function advance(){
    st.r++; st.tries = 0;
    if (st.r >= RONDAS.length) st.done = true;
    setTimeout(render, 1700);
  }

  host.addEventListener('input', function(e){
    var sl = (e.target && e.target.getAttribute && e.target.getAttribute('data-r') === 'sl') ? e.target : null;
    if (!sl) return;
    st.x = parseInt(sl.value, 10);
    live();

  host.addEventListener('click', function(e){

    if (!b || st.done) return;
    var c = RONDAS[st.r];
    var suma = c.known + c.n * st.x;
    if (st.x === c.ans){
      st.hits++;
      say('good', L({ es:'Correcto: con ', en:'Correct: with ' }) + c.el + ' = ' + fmtQ(c.ans) + L({ es:' la suma queda en ', en:' the sum lands on ' }) + fmtQ(c.target) + '.');

      return;

      if (sl){ sl.value = String(c.ans); }

      advance();
      return;
    }
    if (suma > c.target){
      say('miss', L({ es:'La suma va en ', en:'The sum stands at ' }) + fmtQ(suma) + L({ es:' y debe quedar en ', en:' and it has to end at ' }) + fmtQ(c.target) +
        L({ es:': te sobra carga positiva, baja el cursor.', en:': you have positive charge to spare, move the slider down.' }));
    } else {
      say('miss', L({ es:'La suma va en ', en:'The sum stands at ' }) + fmtQ(suma) + L({ es:' y debe quedar en ', en:' and it has to end at ' }) + fmtQ(c.target) +
        L({ es:': te falta carga positiva, sube el cursor.', en:': you are short of positive charge, move the slider up.' }));
    }
  });

  render();
}

function wDetector(rng, host){
  var RONDAS = shuffle(REACC, rng).slice(0, 3);
  var st = { r:0, fase:0, tries:0, hits:0, marcado:{}, done:false };

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Detector de agentes', en:'Agent detector' }) + '</div>' +
        '<div class="gw-fb good">' + L({ es:'Revisaste las tres ecuaciones. Aciertos directos: ', en:'You went through the three equations. Direct hits: ' }) + st.hits + ' / ' + (RONDAS.length * 2) + '. ' +
        L({ es:'La que sube de número se oxida y arrastra a la otra: el que baja recibe esos mismos electrones.', en:'The one that goes up in number is oxidized and drags the other along: the one that goes down receives those very electrons.' }) + '</div>';
      return;
    }
    var d = RONDAS[st.r];
    var preg = st.fase === 0
      ? L({ es:'¿Cuál sustancia se oxida?', en:'Which substance is oxidized?' })
      : L({ es:'¿Cuál actúa como agente oxidante?', en:'Which one acts as the oxidizing agent?' });
    var chips = d.sp.map(function(s, i){
      var cls = 'dx-chip';
      if (st.marcado['ox'] === i) cls += ' ox';
      if (st.marcado['red'] === i) cls += ' red';

    }).join('');

      '<div class="gw-mini iw-sub">' + L({

      }) + '</div>' +

      '<div class="dx-chips">' + chips + '</div>' +
      '<div class="gw-fb" data-r="fb">' + L({
        es:'Compara el número de antes con el de después: uno sube y el otro baja.',

    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }

    if (st.r >= RONDAS.length) st.done = true;
    setTimeout(render, 1500);
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-sp]') : null;

      siguiente();
      return;

      st.marcado[clave] = meta;
      render();
      say('warm', L({ es:'Era ', en:'It was ' }) + d.sp[meta] + ': ' + L(st.fase === 0 ? d.oxWhy : d.redWhy) + '.');
      siguiente();
      return;

    if (i >= 2){
      say('miss', L({
        es:'Esa sustancia es un producto: aparece cuando la transferencia ya ocurrió. Busca entre las que entran a la reacción.',

        es:'Todavía no. El agente oxidante es el que recibe los electrones, y por recibirlos su número de oxidación baja.',
        en:'Not yet. The oxidizing agent is the one that receives the electrons, and by receiving them its oxidation number falls.'
      }));
    }
  });

  render();
}

        es:'Busca la cuenta más pequeña que deje las dos barras a la misma altura.',
        en:'Look for the smallest count that leaves both bars at the same height.'
      }) + '</div>';
    live();
  }

  function live(){
    var d = RONDAS[st.r];
    var ce = st.ca * d.a.n, ga = st.cb * d.b.n;
    var mx = Math.max(ce, ga, 1);
    var ca = host.querySelector('[data-r="ca"]');
    var cb = host.querySelector('[data-r="cb"]');
    var ta = host.querySelector('[data-r="ta"]');
    var tb = host.querySelector('[data-r="tb"]');
    var ba = host.querySelector('[data-r="ba"]');
    var bb = host.querySelector('[data-r="bb"]');
    if (ca) ca.textContent = st.ca;
    if (cb) cb.textContent = st.cb;
    if (ta) ta.textContent = st.ca + ' × ' + d.a.n + ' = ' + ce + ' e';
    if (tb) tb.textContent = st.cb + ' × ' + d.b.n + ' = ' + ga + ' e';
    if (ba) ba.style.height = Math.round(ce / mx * 100) + '%';
    if (bb) bb.style.height = Math.round(ga / mx * 100) + '%';
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function advance(){
    st.r++; st.tries = 0;
    if (st.r >= RONDAS.length) st.done = true;
    setTimeout(render, 1700);
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done) return;
    var act = b.getAttribute('data-act');
    var d = RONDAS[st.r];
    if (act === 'a+'){ if (st.ca < 6) st.ca++; live(); return; }
    if (act === 'a-'){ if (st.ca > 1) st.ca--; live(); return; }
    if (act === 'b+'){ if (st.cb < 6) st.cb++; live(); return; }
    if (act === 'b-'){ if (st.cb > 1) st.cb--; live(); return; }
    if (act !== 'ver') return;
    var ce = st.ca * d.a.n, ga = st.cb * d.b.n;
    if (ce === ga && gcd2(st.ca, st.cb) === 1){
      st.hits++;
      say('good', L({ es:'Equilibrada: ', en:'Balanced: ' }) + L(d.why) + '.');
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.ca = d.ca; st.cb = d.cb; live();
      say('warm', L({ es:'La cuenta cierra así: ', en:'The count closes like this: ' }) + L(d.why) + L({ es:'. En total viajan ', en:'. In total ' }) + d.tot + L({ es:' electrones.', en:' electrons travel.' }));
      advance();
      return;
    }
    if (ce > ga){
      say('miss', L({ es:'Se ceden ', en:'There are ' }) + ce + L({ es:' electrones y solo se reciben ', en:' electrons given up and only ' }) + ga +
        L({ es:': sobran electrones sin destino, sube el coeficiente de la mitad que los gana.', en:' received: there are electrons with nowhere to go, raise the coefficient of the half that gains them.' }));
    } else if (ga > ce){
      say('miss', L({ es:'Se piden ', en:'There are ' }) + ga + L({ es:' electrones y solo se ceden ', en:' electrons asked for and only ' }) + ce +
        L({ es:': faltan electrones, sube el coeficiente de la mitad que los entrega.', en:' given up: electrons are missing, raise the coefficient of the half that hands them over.' }));
    } else {
      say('miss', L({
        es:'Las dos barras ya están iguales, pero los dos coeficientes se pueden dividir entre un mismo número: busca la pareja más pequeña que también cuadre.',
        en:'Both bars are already equal, but the two coefficients can both be divided by the same number: look for the smallest pair that also fits.'
      }));
    }
  });

  render();
}

    if (!b) return;
    var act = b.getAttribute('data-act');

    L({ es:'Todo lo que se oxida está entregando algo', en:'Everything that rusts is handing something over' }),
    '<p>' + L({
      es:'La reja que se llena de herrumbre, la manzana que se pone café cuando la dejas partida, el clavo que se cubre de plata dentro de un vaso, la fogata que calienta la noche y la pila que hace sonar tus audífonos parecen fenómenos sin relación. Todos son, en el fondo, el mismo tipo de reacción: alguien entrega electrones y alguien más los recibe.',
      en:'The railing that fills with rust, the apple that turns brown when you leave it cut open, the nail that becomes coated in silver inside a glass, the campfire that warms the night and the battery that makes your headphones play look like unrelated events. Underneath, they are all the same kind of reaction: someone hands electrons over and someone else receives them.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a seguir el rastro de esos electrones. Vas a repartirlos entre dos partículas y ver cómo cambian sus cargas, a asignar números de oxidación para descubrir quién subió y quién bajó, a nombrar al que provoca cada cambio, a comprobar que la cuenta de electrones siempre cierra y a decidir, con argumentos, qué gana y qué pierde una comunidad con los procesos que dependen de estas reacciones.',
      en:'In this guide you are going to follow the trail of those electrons. You will share them out between two particles and see how their charges change, assign oxidation numbers to find out who went up and who went down, name the one that causes each change, check that the electron count always closes and decide, with arguments, what a community gains and loses with the processes that depend on these reactions.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a poder decidir', en:'What you will be able to decide' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'transferencia de electrones', en:'transfer of electrons' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'oxidación y reducción', en:'oxidation and reduction' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'número de oxidación', en:'oxidation number' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'agente oxidante', en:'oxidizing agent' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'agente reductor', en:'reducing agent' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'balance de electrones', en:'electron balance' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'beneficios y costo ambiental', en:'benefits and environmental cost' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Quien pierde electrones se oxida, quien los gana se reduce', en:'Whoever loses electrons is oxidized, whoever gains them is reduced' }),
    '<p>' + L({
      es:'Durante mucho tiempo se llamó oxidación solamente a combinarse con oxígeno, porque los casos más visibles eran la herrumbre y las combustiones. Hoy el nombre significa algo más amplio y más útil: una sustancia se oxida cuando pierde electrones, y se reduce cuando los gana. Con esa definición cabe también lo que ocurre en una pila, en la que ningún oxígeno participa.',
      en:'For a long time oxidation meant only combining with oxygen, because the most visible cases were rust and burning. Today the name means something wider and more useful: a substance is oxidized when it loses electrons, and reduced when it gains them. With that definition, what happens inside a battery also fits, where no oxygen takes part at all.'
    }) + '</p>' +
    '<p>' + L({
      es:'Lo importante es que las dos cosas ocurren siempre juntas. Los electrones no se quedan flotando ni desaparecen: si una sustancia los suelta, otra los recoge en ese mismo instante y en la misma cantidad. Por eso se habla de una sola reacción de óxido reducción, o redox, con dos mitades inseparables. Cuando metes una lámina de zinc en una disolución de cobre, la lámina se adelgaza porque sus átomos se van como iones positivos, y el cobre aparece como sólido porque sus iones recogieron justo esos electrones.',
      en:'What matters is that the two things always happen together. Electrons neither float around nor disappear: if one substance releases them, another picks them up at that very instant and in the same amount. That is why we speak of a single oxidation reduction reaction, or redox, with two inseparable halves. When you put a zinc strip into a copper solution, the strip gets thinner because its atoms leave as positive ions, and copper appears as a solid because its ions picked up exactly those electrons.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Se oxida', en:'Is oxidized' }), L({ es:'pierde electrones', en:'loses electrons' }), L({ es:'queda con más carga positiva que antes', en:'ends up with more positive charge than before' })) +
      rcard(L({ es:'Se reduce', en:'Is reduced' }), L({ es:'gana electrones', en:'gains electrons' }), L({ es:'queda con menos carga positiva que antes', en:'ends up with less positive charge than before' })) +
      rcard(L({ es:'Nunca solas', en:'Never alone' }), L({ es:'cedidos = ganados', en:'given up = gained' }), L({ es:'lo que sale de una sustancia entra en la otra', en:'what leaves one substance enters the other' })) +
      rcard(L({ es:'En tu entorno', en:'Around you' }), L({ es:'herrumbre, pilas, fuego', en:'rust, batteries, fire' }), L({ es:'procesos distintos con el mismo mecanismo de fondo', en:'different processes with the same underlying mechanism' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Cuidado con el nombre: ', en:'Careful with the name: ' }) + '</strong>' + L({
      es:'oxidarse no exige que haya oxígeno. El zinc de una pila se oxida dentro de una disolución donde el oxígeno no participa.',
      en:'being oxidized does not require oxygen to be there. The zinc of a battery is oxidized inside a solution where oxygen plays no part.'
    }) + '</p></div>'
  );
  wTransfer(rng, widgetHost(s1, 'wTransfer', 'transfer'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El número de oxidación: una etiqueta para seguir la carga', en:'The oxidation number: a label for tracking charge' }),
    '<p>' + L({
      es:'Ver los electrones es imposible, así que la química usa una etiqueta que hace visible su reparto: el número de oxidación. Es la carga que tendría cada átomo si los electrones compartidos se le adjudicaran por completo al elemento que los atrae con más fuerza. No siempre es una carga real, pero funciona como un marcador que permite comparar el antes y el después de una reacción.',
      en:'Seeing electrons is impossible, so chemistry uses a label that makes their sharing visible: the oxidation number. It is the charge each atom would have if the shared electrons were awarded entirely to the element that pulls at them hardest. It is not always a real charge, but it works as a marker that lets you compare the before and after of a reaction.'
    }) + '</p>' +
    '<p>' + L({
      es:'Las etiquetas se asignan con un puñado de acuerdos. Un elemento que no está combinado con ningún otro vale 0, sin importar si es un metal en barra o un gas de dos átomos. Un ion sencillo vale lo mismo que su carga. El hidrógeno suele valer +1 y el oxígeno suele valer −2, salvo en los peróxidos, donde el oxígeno vale −1. Y para cerrar la cuenta hay dos reglas de suma: en un compuesto sin carga todos los números juntos suman 0, y en un ion poliatómico suman lo mismo que la carga del ion. Con esas dos sumas se despeja el valor del elemento que falta.',
      en:'The labels are assigned with a handful of agreements. An element not combined with any other is worth 0, whether it is a metal bar or a two atom gas. A simple ion is worth the same as its charge. Hydrogen is usually worth +1 and oxygen is usually worth −2, except in peroxides, where oxygen is worth −1. And to close the count there are two adding rules: in a compound with no charge all the numbers together add up to 0, and in a polyatomic ion they add up to the charge of the ion. With those two sums you can work out the value of the element that is missing.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Elemento libre', en:'Free element' }), '0', L({ es:'un metal en barra o un gas como O<sub>2</sub>', en:'a metal bar or a gas such as O<sub>2</sub>' })) +
      rcard(L({ es:'Ion sencillo', en:'Simple ion' }), L({ es:'su carga', en:'its charge' }), L({ es:'el ion Mg<sup>2+</sup> vale +2', en:'the Mg<sup>2+</sup> ion is worth +2' })) +
      rcard(L({ es:'Hidrógeno y oxígeno', en:'Hydrogen and oxygen' }), '+1 / −2', L({ es:'el oxígeno vale −1 en los peróxidos', en:'oxygen is worth −1 in peroxides' })) +
      rcard(L({ es:'La suma', en:'The sum' }), L({ es:'0 o la carga', en:'0 or the charge' }), L({ es:'compuesto neutro suma 0; ion poliatómico suma su carga', en:'a neutral compound adds to 0; a polyatomic ion adds to its charge' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'El número de oxidación se asigna por átomo. Si un elemento aparece dos veces en la fórmula, lo que falta se reparte entre esas dos apariciones.',
      en:'The oxidation number is assigned per atom. If an element appears twice in the formula, what is missing is shared between those two appearances.'
    }) + '</p></div>'
  );
  wOxida(rng, widgetHost(s2, 'wOxida', 'slider'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Quién provoca el cambio: agente oxidante y agente reductor', en:'Who causes the change: oxidizing agent and reducing agent' }),
    '<p>' + L({
      es:'Con los números de oxidación asignados, reconocer una reacción redox se vuelve un ejercicio de comparación: se anota el valor de cada elemento antes y después, y si al menos uno cambió, hubo transferencia de electrones. Si ninguno cambia, por más que aparezca un sólido nuevo o cambie el color, la reacción no es redox. Una neutralización entre un ácido y una base es el ejemplo clásico: los iones se reacomodan, pero nadie sube ni baja de número.',
      en:'With the oxidation numbers assigned, recognizing a redox reaction becomes an exercise in comparison: you write down the value of each element before and after, and if at least one has changed, there was a transfer of electrons. If none changes, no matter how new the solid that appears or how different the colour, the reaction is not redox. A neutralization between an acid and a base is the classic example: the ions rearrange, but nobody goes up or down in number.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cuando sí hay cambio, conviene nombrar a los dos protagonistas por lo que le hacen al otro, no por lo que les pasa a ellos. El agente oxidante es el que provoca la oxidación del otro, y para lograrlo se queda con sus electrones, así que su propio número baja: termina reducido. El agente reductor es el que provoca la reducción del otro entregándole electrones, así que su propio número sube: termina oxidado. Los nombres suenan al revés de lo que le ocurre a cada uno, y ese es justo el detalle que hay que tener firme.',
      en:'When there is a change, it helps to name the two protagonists by what they do to the other, not by what happens to them. The oxidizing agent is the one that causes the other to be oxidized, and to do that it keeps its electrons, so its own number falls: it ends up reduced. The reducing agent is the one that causes the other to be reduced by handing over electrons, so its own number rises: it ends up oxidized. The names sound like the opposite of what happens to each one, and that is exactly the detail to keep straight.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Sube el número', en:'The number rises' }), L({ es:'se oxidó', en:'it was oxidized' }), L({ es:'perdió electrones y actúa como agente reductor', en:'it lost electrons and acts as the reducing agent' })) +
      rcard(L({ es:'Baja el número', en:'The number falls' }), L({ es:'se redujo', en:'it was reduced' }), L({ es:'ganó electrones y actúa como agente oxidante', en:'it gained electrons and acts as the oxidizing agent' })) +
      rcard(L({ es:'Nadie cambia', en:'Nobody changes' }), L({ es:'no es redox', en:'not redox' }), L({ es:'los iones solo se reacomodan, como en una neutralización', en:'the ions only rearrange, as in a neutralization' })) +
      rcard(L({ es:'Ojo con el nombre', en:'Watch the name' }), L({ es:'agente = lo que causa', en:'agent = what causes' }), L({ es:'el agente oxidante es el que termina reducido', en:'the oxidizing agent is the one that ends up reduced' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Para decidir si una reacción es redox no basta con mirar si cambia el aspecto de la mezcla: hay que comparar los números de oxidación de los mismos elementos en los dos lados.',
      en:'To decide whether a reaction is redox it is not enough to look at whether the mixture changes its appearance: you have to compare the oxidation numbers of the same elements on both sides.'
    }) + '</p></div>'
  );
  wDetector(rng, widgetHost(s3, 'wDetector', 'classify'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'La cuenta que siempre cierra', en:'The count that always closes' }),
    '<p>' + L({
      es:'Como los electrones que salen de una sustancia son exactamente los que entran en la otra, cada reacción redox se puede separar en dos mitades y volver a juntarlas cuando las cuentas coinciden. Una mitad muestra lo que cede el que se oxida, por ejemplo un átomo de aluminio que suelta 3 electrones al convertirse en ion. La otra muestra lo que recibe el que se reduce, por ejemplo un ion cobre que toma 2 electrones para volverse metal.',
      en:'Since the electrons that leave one substance are exactly the ones that enter the other, every redox reaction can be split into two halves and put back together once the counts match. One half shows what the one being oxidized gives up, for example an aluminium atom that releases 3 electrons as it turns into an ion. The other shows what the one being reduced receives, for example a copper ion that takes 2 electrons to become metal.'
    }) + '</p>' +
    '<p>' + L({
      es:'El problema es que 3 y 2 no coinciden, y no se puede transferir medio electrón. La salida es repetir cada mitad las veces necesarias hasta que las dos manejen la misma cantidad: dos aluminios sueltan 6 electrones y tres iones cobre reciben esos mismos 6. Esa cifra común es el menor número que se puede formar tanto con grupos de 3 como con grupos de 2, y de ella salen los coeficientes de la reacción completa. Con la cuenta cerrada también queda claro cuántos electrones viajan en total, que es el mismo número contado por cualquiera de los dos lados, nunca la suma de ambos.',
      en:'The trouble is that 3 and 2 do not match, and half an electron cannot be transferred. The way out is to repeat each half as many times as needed until both handle the same amount: two aluminiums release 6 electrons and three copper ions receive those same 6. That common figure is the smallest number that can be made both with groups of 3 and with groups of 2, and the coefficients of the whole reaction come out of it. With the count closed it is also clear how many electrons travel in total, which is the same number counted from either side, never the sum of both.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Media reacción', en:'Half reaction' }), L({ es:'lo que cede', en:'what is given up' }), L({ es:'Al → Al<sup>3+</sup> + 3 e<sup>-</sup>', en:'Al → Al<sup>3+</sup> + 3 e<sup>-</sup>' })) +
      rcard(L({ es:'Media reacción', en:'Half reaction' }), L({ es:'lo que gana', en:'what is gained' }), L({ es:'Cu<sup>2+</sup> + 2 e<sup>-</sup> → Cu', en:'Cu<sup>2+</sup> + 2 e<sup>-</sup> → Cu' })) +
      rcard(L({ es:'Repetir cada mitad', en:'Repeat each half' }), L({ es:'hasta igualar', en:'until they match' }), L({ es:'la cifra común más pequeña marca los coeficientes', en:'the smallest common figure sets the coefficients' })) +
      rcard(L({ es:'Total transferido', en:'Total transferred' }), L({ es:'se cuenta una vez', en:'counted once' }), L({ es:'por un lado o por el otro, nunca sumando los dos', en:'from one side or the other, never adding both' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Si las dos mitades no manejan la misma cantidad de electrones, la ecuación describe algo que no puede ocurrir: sobrarían electrones sueltos.',
      en:'If the two halves do not handle the same amount of electrons, the equation describes something that cannot happen: there would be loose electrons left over.'
    }) + '</p></div>'
  );
  wBalanza(rng, widgetHost(s4, 'wBalanza', 'balance'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Lo que estas reacciones dan y lo que cobran', en:'What these reactions give and what they charge' }),
    '<p>' + L({
      es:'Buena parte de lo que usas a diario existe gracias a una transferencia de electrones. Las pilas y las baterías guardan energía química y la entregan mientras un metal se oxida. Los metales de una obra o de un cable salen de sus minerales porque alguien los redujo en un horno. Los combustibles calientan casas y mueven camiones al entregarle electrones al oxígeno. Los blanqueadores y los desinfectantes limpian porque arrancan electrones a las moléculas que manchan o a los microorganismos. Hasta la respiración de tus células es una cadena de reacciones redox.',
      en:'A good part of what you use every day exists thanks to a transfer of electrons. Batteries store chemical energy and hand it over while a metal is oxidized. The metals of a building or a cable come out of their minerals because someone reduced them in a furnace. Fuels heat homes and move trucks by handing electrons over to oxygen. Bleaches and disinfectants clean because they pull electrons from the molecules that stain or from microorganisms. Even the breathing of your cells is a chain of redox reactions.'
    }) + '</p>' +
    '<p>' + L({
      es:'El costo aparece por el otro lado de la misma moneda. La corrosión destruye rejas, puentes y tuberías, y repararlos consume dinero y materiales. Las combustiones liberan gases que quedan en el aire de la ciudad. La obtención de metales genera residuos y consume enormes cantidades de energía. Y una pila desechada en la basura común termina rota en un tiradero, donde sus metales pasan al suelo y al agua. Ninguna de esas consecuencias cancela el beneficio, pero tampoco se cancela con él: valorar un proceso es ponerlos lado a lado y decidir en qué condiciones conviene, qué se puede recuperar y qué alternativas existen.',
      en:'The cost appears on the other side of the same coin. Corrosion destroys railings, bridges and pipes, and repairing them uses up money and materials. Burning releases gases that stay in the air of the city. Obtaining metals generates waste and consumes enormous amounts of energy. And a battery thrown into ordinary rubbish ends up broken in a dump, where its metals pass into the soil and the water. None of those consequences cancels the benefit, but neither is it cancelled by it: weighing up a process means putting them side by side and deciding under which conditions it is worth it, what can be recovered and what alternatives exist.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Beneficio', en:'Benefit' }), L({ es:'energía portátil', en:'portable energy' }), L({ es:'pilas y baterías que funcionan mientras un metal se oxida', en:'batteries that work while a metal is oxidized' })) +
      rcard(L({ es:'Beneficio', en:'Benefit' }), L({ es:'metales y calor', en:'metals and heat' }), L({ es:'reducción de minerales y combustiones que mueven vehículos', en:'reduction of minerals and burning that moves vehicles' })) +
      rcard(L({ es:'Costo', en:'Cost' }), L({ es:'corrosión', en:'corrosion' }), L({ es:'estructuras que se destruyen y hay que reponer', en:'structures that are destroyed and have to be replaced' })) +
      rcard(L({ es:'Costo', en:'Cost' }), L({ es:'residuos y gases', en:'waste and gases' }), L({ es:'metales de pilas en el suelo y gases de combustión en el aire', en:'battery metals in the soil and combustion gases in the air' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Una postura sostenible no consiste en prohibir toda reacción útil ni en negar sus efectos, sino en comparar el beneficio real con el daño real y proponer lo que sí se puede hacer.',
      en:'A sustainable position does not consist of banning every useful reaction or denying its effects, but of comparing the real benefit with the real harm and proposing what can actually be done.'
    }) + '</p></div>'
  );
  wCuaderno(rng, widgetHost(s5, 'wCuaderno', 'reflect'));
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Reacciones Redox: Transferencia de Electrones y Oxidación';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
