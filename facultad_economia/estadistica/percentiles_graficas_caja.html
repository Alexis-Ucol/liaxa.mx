<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentiles y Gráficas de Caja · Estadística · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/estadistica/est_percentiles.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Percentiles y Gráficas de Caja</div>
    <div class="wcourse" id="wcourse-el">Estadística</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Percentiles y Gráficas de Caja</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Descargar resultados en PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzIje7cRD7iI77G2-t6LMJEHtvjnwrFOJXsbbLe_4phhI7h9AhjL2HoIil1C-IoEn8T/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',
  darkPrimaryDark: '#7aaae0',
  darkPrimaryBg:   '#0e1e38',
  darkAccent:      '#d4b86a',
  darkAccentBg:    '#241e0e',
  logoLeftB64:  '',
  logoRightB64: '',
  guideTitle:  { 'es': 'Percentiles y Gráficas de Caja', 'en': 'Percentiles and Box Plots' },
  courseName:  { 'es': 'Estadística', 'en': 'Statistics' },
  filePrefix:  'est_percentiles'
};
/* ════════════════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════════════════
   ATTEMPT COUNTER + SEEDED RNG
   ════════════════════════════════════════════════════════════════════════ */
function getAttemptKey(name, group) {
  return 'fac_econ_est__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

/* ════════════════════════════════════════════════════════════════════════
   NUMBER + STATISTICS HELPERS
   ════════════════════════════════════════════════════════════════════════ */
function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function mm(v) { return '$' + nf(v * 1000); }              // miles -> pesos
function un(v, word) { return nf(v) + ' ' + word; }
function listMM(a) { return a.map(mm).join(', '); }
function listN(a) { return a.map(nf).join(', '); }

function genSorted(rng, n, base, step, jit) {
  var a = [], v = base;
  for (var i = 0; i < n; i++) { a.push(v); v += step + Math.floor(rng() * jit); }
  return a;
}
function posIndex(n, k) { return Math.ceil(k / 100 * n) - 1; }
function pctl(s, k) {
  var n = s.length, L = k / 100 * n;
  if (Math.abs(L - Math.round(L)) < 1e-9) { var i = Math.round(L); return (s[i - 1] + s[i]) / 2; }
  return s[Math.ceil(L) - 1];
}
/* Nudges Q3 so that Q3 minus Q1 is even; keeps the 1.5 rule on whole numbers. */
function tuneEven(s) {
  var i1 = posIndex(s.length, 25), i3 = posIndex(s.length, 75);
  if ((s[i3] - s[i1]) % 2 !== 0) s[i3] += 1;
  return s;
}
function fiveNum(s) {
  return { min: s[0], q1: pctl(s, 25), med: pctl(s, 50), q3: pctl(s, 75), max: s[s.length - 1] };
}
function fences(s) {
  var q1 = pctl(s, 25), q3 = pctl(s, 75), iqr = q3 - q1;
  return { q1: q1, q3: q3, iqr: iqr, lo: q1 - 1.5 * iqr, hi: q3 + 1.5 * iqr };
}
/* Four distinct answer values: the key first, then the supplied misconceptions. */
function distinct4(c, wrongs) {
  var seen = {}, out = [c];
  seen[String(c)] = 1;
  var pool = wrongs.slice();
  var step = Math.max(1, Math.round(Math.abs(c) * 0.07));
  for (var k = 1; k <= 40; k++) pool.push(c + (k % 2 ? 1 : -1) * step * Math.ceil(k / 2));
  for (var i = 0; i < pool.length && out.length < 4; i++) {
    var v = pool[i];
    if (v <= 0 || seen[String(v)]) continue;
    seen[String(v)] = 1; out.push(v);
  }
  return out;
}
function valOpts(correctVal, wrongVals, fmtEs, fmtEn, rng) {
  var vals = distinct4(correctVal, wrongVals);
  return shuffleOpts(vals.map(fmtEs), vals.map(fmtEn), rng);
}
function cssv(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ════════════════════════════════════════════════════════════════════════

function lsKey() {
  var n = (studentData.name || '').trim(), g = (studentData.group || '').trim();
  return 'fac_econ_est__' + (n + '__' + g).replace(/\s+/g, '_');
}
function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}
function loadSession(name, group) {
  var key = 'fac_econ_est__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function dismissRestore() { document.getElementById('restoreBar').style.display = 'none'; }
function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c) { return c !== null; })) ? 'block' : 'none';
}
function observeSections() {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

   START / RESTORE
   ════════════════════════════════════════════════════════════════════════ */
function startLesson() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('err-fields'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = nextAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var dc = document.getElementById('dc' + i);
      if (!dc || !dc.width) return;
      var img = new Image();
      img.onload = function() {
        var dpr = window.devicePixelRatio || 1;
        dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
      };
      img.src = dataUrl;
    });
    if (saved.texts) saved.texts.forEach(function(txt, i) {
      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';
      var pz = document.getElementById('pz' + i);
      if (pz) pz.style.opacity = '0.4';
    });
  }, 300);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function makeScale(lo, hi, left, right) {
  var span = (hi - lo) || 1;
  return function(v) { return left + (v - lo) / span * (right - left); };
}
/* Draws one box plot band: whiskers, box, median, and any outlier dots. */
function drawBoxBand(ctx, sc, yTop, bh, five, outs, P, label) {
  var yc = yTop + bh / 2;
  ctx.lineWidth = 1.5; ctx.strokeStyle = P.text3;
  ctx.beginPath();
  ctx.moveTo(sc(five.min), yc); ctx.lineTo(sc(five.q1), yc);
  ctx.moveTo(sc(five.q3), yc); ctx.lineTo(sc(five.max), yc);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(sc(five.min), yTop + 5); ctx.lineTo(sc(five.min), yTop + bh - 5);
  ctx.moveTo(sc(five.max), yTop + 5); ctx.lineTo(sc(five.max), yTop + bh - 5);
  ctx.stroke();
  var x1 = sc(five.q1), x3 = sc(five.q3);
  ctx.fillStyle = P.tint;   ctx.fillRect(x1, yTop, Math.max(2, x3 - x1), bh);
  ctx.strokeStyle = P.green; ctx.lineWidth = 2;
  ctx.strokeRect(x1, yTop, Math.max(2, x3 - x1), bh);
  ctx.strokeStyle = P.dark; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(sc(five.med), yTop); ctx.lineTo(sc(five.med), yTop + bh); ctx.stroke();
  (outs || []).forEach(function(v) {
    ctx.fillStyle = P.bad;
    ctx.beginPath(); ctx.arc(sc(v), yc, 4.5, 0, 6.2832); ctx.fill();
  });
  if (label) {
    ctx.fillStyle = P.text2; ctx.font = '600 11px "IBM Plex Sans", sans-serif';
    ctx.fillText(label, 4, yTop - 6);
  }
}
function drawFenceLine(ctx, x, yTop, yBot, P, label) {
  ctx.save();
  ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBot); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = P.gold; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
  ctx.fillText(label, Math.max(2, x - 10), yTop - 4);
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · percentile explorer
   ════════════════════════════════════════════════════════════════════════ */
function widgetPercentile(data) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { k: 25 };
  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="percentile-explorer">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Explorador de percentiles' : 'Percentile explorer') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Mueve el control para elegir el percentil. Observa cómo cambia la posición calculada y qué sucursal queda señalada en la fila ordenada de ventas mensuales.'
          : 'Move the slider to choose a percentile. Watch how the computed position changes and which branch gets flagged in the ordered row of monthly sales.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Percentil elegido' : 'Chosen percentile') + ': <span class="cval" id="w1lbl">' + state.k + '</span></label>' +
          '<input type="range" min="5" max="95" step="5" id="w1k" value="' + state.k + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Sucursales ordenadas' : 'Ordered branches') + ': <span class="cval">' + data.length + '</span></label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Ventas del mes en pesos' : 'Monthly sales in pesos') + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w1cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Posición L' : 'Position L') + '</div><div class="mnum ps" id="w1L"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Posición usada' : 'Position used') + '</div><div class="mnum ts" id="w1P"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor' : 'Value') + '</div><div class="mnum cs" id="w1V"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w1read"></div>' +
      '</div>';
    var sl = host.querySelector('#w1k');
    sl.addEventListener('input', function() { state.k = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es', n = data.length;
    var L = state.k / 100 * n;
    var isInt = Math.abs(L - Math.round(L)) < 1e-9;
    var posUsed = isInt ? Math.round(L) : Math.ceil(L);
    var val = pctl(data, state.k);
    host.querySelector('#w1lbl').textContent = state.k;
    host.querySelector('#w1L').textContent = nf(L);
    host.querySelector('#w1P').textContent = isInt ? (posUsed + ' y ' + (posUsed + 1)) : String(posUsed);
    host.querySelector('#w1V').textContent = mm(val);
    host.querySelector('#w1read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> alrededor del ' + state.k + ' por ciento de las sucursales vende ' + mm(val) + ' o menos al mes. Las que quedan a la izquierda de la marca son las candidatas a un plan de recuperación.'
      : '<strong>Business reading:</strong> about ' + state.k + ' percent of the branches sell ' + mm(val) + ' or less per month. The ones to the left of the marker are the candidates for a recovery plan.';
    draw(posUsed, val);
  }
  function draw(posUsed, val) {
    var cv = host.querySelector('#w1cv');
    var g = fitCanvas(cv, 120), ctx = g.ctx, P = palette();
    var lo = data[0], hi = data[data.length - 1];
    var sc = makeScale(lo, hi, 26, g.w - 26);
    var y = 62;
    ctx.strokeStyle = P.border; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(g.w - 20, y); ctx.stroke();
    data.forEach(function(v, i) {
      var isSel = (i + 1) <= posUsed;
      ctx.fillStyle = isSel ? P.green : P.border;
      ctx.beginPath(); ctx.arc(sc(v), y, (i + 1) === posUsed ? 8 : 5.5, 0, 6.2832); ctx.fill();
      if ((i + 1) === posUsed) {
        ctx.strokeStyle = P.gold; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(sc(v), y, 11, 0, 6.2832); ctx.stroke();
      }
    });
    ctx.fillStyle = P.text3; ctx.font = '10px "IBM Plex Mono", monospace';
    ctx.fillText(mm(lo), 6, y + 30);
    var hx = ctx.measureText(mm(hi)).width;
    ctx.fillText(mm(hi), g.w - hx - 6, y + 30);
    ctx.fillStyle = P.dark; ctx.font = '600 11px "IBM Plex Sans", sans-serif';
    var lbl = (LANG === 'es' ? 'P' : 'P') + state.k + ' = ' + mm(val);
    var lw = ctx.measureText(lbl).width;
    ctx.fillText(lbl, Math.min(Math.max(4, sc(val) - lw / 2), g.w - lw - 4), 30);
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · box plot builder with the 1.5 IQR rule
   ════════════════════════════════════════════════════════════════════════ */
function widgetBoxplot(base) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var core = base.slice(0, base.length - 1);
  var f0 = fences(base);
  var minTop = base[base.length - 1];
  var maxTop = Math.round(f0.q3 + 4 * f0.iqr);
  var state = { top: minTop };
  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="boxplot-builder">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Constructor de gráfica de caja' : 'Box plot builder') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Arrastra el control para cambiar el importe de la factura más grande de la cartera. Observa en qué momento cruza el límite superior y deja de dibujarse como bigote para dibujarse como punto atípico.'
          : 'Drag the slider to change the amount of the largest invoice in the portfolio. Watch the moment it crosses the upper limit and stops being drawn as a whisker and becomes an outlier dot.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Factura más grande' : 'Largest invoice') + ': <span class="cval" id="w2lbl"></span></label>' +
          '<input type="range" min="' + minTop + '" max="' + maxTop + '" step="1" id="w2t" value="' + state.top + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Facturas en la cartera' : 'Invoices in the portfolio') + ': <span class="cval">' + base.length + '</span></label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'La regla usa 1.5 veces el rango intercuartílico' : 'The rule uses 1.5 times the interquartile range') + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w2cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">Q1</div><div class="mnum cs" id="w2q1"></div></div>' +
          '<div class="metric"><div class="mlbl">Q3</div><div class="mnum cs" id="w2q3"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Rango interc.' : 'IQR') + '</div><div class="mnum ts" id="w2iqr"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Límite superior' : 'Upper limit') + '</div><div class="mnum ps" id="w2hi"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Bigote llega a' : 'Whisker ends at') + '</div><div class="mnum ts" id="w2wh"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Estado' : 'Status') + '</div><div class="mnum ps" id="w2st"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w2read"></div>' +
      '</div>';
    var sl = host.querySelector('#w2t');
    sl.addEventListener('input', function() { state.top = parseInt(this.value, 10); update(); });
    update();
  }
  function current() {
    var arr = core.concat([state.top]).slice().sort(function(a, b) { return a - b; });
    return arr;
  }
  function update() {
    var es = LANG === 'es';
    var arr = current(), f = fences(arr);
    var inside = arr.filter(function(v) { return v <= f.hi && v >= f.lo; });
    var outs = arr.filter(function(v) { return v > f.hi || v < f.lo; });
    var whisk = inside[inside.length - 1];
    host.querySelector('#w2lbl').textContent = mm(state.top);
    host.querySelector('#w2q1').textContent  = mm(f.q1);
    host.querySelector('#w2q3').textContent  = mm(f.q3);
    host.querySelector('#w2iqr').textContent = mm(f.iqr);
    host.querySelector('#w2hi').textContent  = mm(f.hi);
    host.querySelector('#w2wh').textContent  = mm(whisk);
    host.querySelector('#w2st').textContent  = outs.length
      ? (es ? 'Atípico' : 'Outlier') : (es ? 'Dentro' : 'Inside');
    host.querySelector('#w2read').innerHTML = outs.length
      ? (es
        ? '<strong>Alerta de auditoría:</strong> la factura de ' + mm(state.top) + ' supera el límite superior de ' + mm(f.hi) + ', así que se marca como atípica y entra a revisión. El bigote se detiene en ' + mm(whisk) + ', que es el dato más alto que sí cabe dentro del límite.'
        : '<strong>Audit alert:</strong> the invoice of ' + mm(state.top) + ' is above the upper limit of ' + mm(f.hi) + ', so it is flagged as an outlier and goes to review. The whisker stops at ' + mm(whisk) + ', the highest value that still fits inside the limit.')
      : (es
        ? '<strong>Sin alerta:</strong> la factura de ' + mm(state.top) + ' no llega al límite superior de ' + mm(f.hi) + ', así que forma parte del bigote y no se considera atípica.'
        : '<strong>No alert:</strong> the invoice of ' + mm(state.top) + ' does not reach the upper limit of ' + mm(f.hi) + ', so it is part of the whisker and is not treated as an outlier.');
    draw(arr, f, inside, outs);
  }
  function draw(arr, f, inside, outs) {
    var cv = host.querySelector('#w2cv');
    var g = fitCanvas(cv, 140), ctx = g.ctx, P = palette();
    var lo = Math.min(arr[0], f.lo), hi = Math.max(arr[arr.length - 1], f.hi);
    var pad = (hi - lo) * 0.08;
    var sc = makeScale(lo - pad, hi + pad, 16, g.w - 16);
    var five = {
      min: inside[0], q1: f.q1, med: pctl(arr, 50), q3: f.q3, max: inside[inside.length - 1]
    };
    drawFenceLine(ctx, sc(f.hi), 34, 108, P, LANG === 'es' ? 'Límite sup.' : 'Upper limit');
    drawBoxBand(ctx, sc, 52, 38, five, outs, P, LANG === 'es' ? 'Cartera de facturas' : 'Invoice portfolio');
    ctx.fillStyle = P.text3; ctx.font = '10px "IBM Plex Mono", monospace';
    ctx.fillText(mm(five.q1), Math.max(2, sc(five.q1) - 18), 106);
    var w3 = ctx.measureText(mm(five.q3)).width;
    ctx.fillText(mm(five.q3), Math.min(g.w - w3 - 2, sc(five.q3) - 18), 124);
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · comparing two box plots and reading the skew
   ════════════════════════════════════════════════════════════════════════ */
function widgetCompare(a, b) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var fa = fiveNum(a), fb = fiveNum(b);
  var state = { med: Math.round((fb.q1 + fb.q3) / 2) };
  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="boxplot-comparator">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Comparador de dos sucursales' : 'Two branch comparator') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La sucursal Norte queda fija. Mueve la mediana de la sucursal Sur dentro de su caja y lee cómo cambia el diagnóstico de simetría y la frase de negocio que la acompaña.'
          : 'The North branch stays fixed. Move the median of the South branch inside its box and read how the symmetry diagnosis and the business sentence change.') + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Mediana de la sucursal Sur' : 'Median of the South branch') + ': <span class="cval" id="w3lbl"></span></label>' +
          '<input type="range" min="' + fb.q1 + '" max="' + fb.q3 + '" step="1" id="w3m" value="' + state.med + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Rango intercuartílico' : 'Interquartile range') + '</label>' +
          '<div style="font-size:.74rem;color:var(--text3)">' + (es ? 'Norte' : 'North') + ': ' + mm(fa.q3 - fa.q1) + ' · ' + (es ? 'Sur' : 'South') + ': ' + mm(fb.q3 - fb.q1) + '</div>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w3cv"></canvas>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Mediana Norte' : 'North median') + '</div><div class="mnum cs">' + mm(fa.med) + '</div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Mediana Sur' : 'South median') + '</div><div class="mnum cs" id="w3med"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Forma de la caja Sur' : 'South box shape') + '</div><div class="mnum ps" id="w3sk"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    var sl = host.querySelector('#w3m');
    sl.addEventListener('input', function() { state.med = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var span = fb.q3 - fb.q1;
    var rel = span ? (state.med - fb.q1) / span : 0.5;
    var shape = rel < 0.38 ? (es ? 'Sesgo a la derecha' : 'Right skewed')
              : rel > 0.62 ? (es ? 'Sesgo a la izquierda' : 'Left skewed')
              : (es ? 'Casi simétrica' : 'Nearly symmetric');
    host.querySelector('#w3lbl').textContent = mm(state.med);
    host.querySelector('#w3med').textContent = mm(state.med);
    host.querySelector('#w3sk').textContent  = shape;
    var reading = rel < 0.38
      ? (es ? 'La mediana está pegada al lado bajo de la caja, así que la mitad de los días con ventas más altas se reparte en un tramo más ancho. Es la firma de unos pocos días muy buenos.'
            : 'The median sits close to the low side of the box, so the better half of the days spreads over a wider stretch. That is the signature of a few very strong days.')
      : rel > 0.62
      ? (es ? 'La mediana está pegada al lado alto de la caja: la sucursal sostiene ventas altas la mayor parte del tiempo y los días flojos son los que se estiran.'
            : 'The median sits close to the high side of the box: the branch holds high sales most of the time and it is the weak days that stretch out.')
      : (es ? 'La mediana está cerca del centro de la caja, así que el 50 por ciento central se reparte de forma pareja a ambos lados.'
            : 'The median sits near the centre of the box, so the middle 50 percent spreads evenly on both sides.');
    host.querySelector('#w3read').innerHTML = (es

function buildLesson(rng) {

  addSection(function(L) {

      '<p>El promedio resume y al mismo tiempo esconde. Si una cadena de tiendas reporta una venta mensual promedio por sucursal, ese número no dice cuántas sucursales quedan muy por debajo ni cuántas sostienen el resultado. Los percentiles responden justo eso, porque trabajan con la <strong>posición</strong> del dato dentro del conjunto ordenado y no con su magnitud.</p>' +
      '<p>El percentil k, escrito Pk, es el valor por debajo del cual queda aproximadamente el k por ciento de las observaciones ordenadas de menor a mayor. En finanzas y operaciones esto se usa todos los días: el percentil 90 de los tiempos de entrega define la promesa de servicio, el percentil 25 de los sueldos fija el piso de una banda salarial y el percentil 50, que es la mediana, marca el centro sin dejarse arrastrar por un dato extremo.</p>' +

        '<div class="rcard"><div class="rname">Si L no es entero</div><div class="rform">Redondea hacia arriba</div><div class="rnote">El dato que ocupa esa posición es Pk.</div></div>' +

      '</div>' +

      '<div class="stag">Concept 1</div>' +
      '<h2>Percentiles: reading the business by position</h2>' +
      '<p>An average summarises and hides at the same time. If a retail chain reports an average monthly sales figure per branch, that single number does not say how many branches fall far below it or how many carry the result. Percentiles answer exactly that question, because they work with the <strong>position</strong> of a value inside the ordered set rather than with its size.</p>' +

  };
  var d1 = mk(q1i, o1.correctIdx, true);
  problems.push({ i18n: d1.i18n, title: d1.title, questionText: d1.questionText, options: d1.options, correctIdx: d1.correctIdx, explanation: d1.explanation, hint: d1.hint, showWork: true, fn: '', studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Problema 2 ── */
  var o2 = shuffleOpts(
    ['El 80 por ciento de los tickets fue menor o igual a $' + nf(tk) + '.',

  buildOneCard(problems[problems.length - 1], problems.length - 1);

  addSection(function(L) {

    if (es) return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>Rango intercuartílico: cuánto varía el 50 por ciento central</h2>' +
      '<p>Una vez que sabes ubicar cuartiles, la pregunta natural del negocio es cuánta variación hay. El rango total, es decir el máximo menos el mínimo, responde rápido pero es frágil: basta un cliente extraordinario o un error de captura para inflarlo. El rango intercuartílico evita ese problema porque solo mira el bloque central.</p>' +
      '<p>El rango intercuartílico, abreviado IQR, es la distancia entre el tercer y el primer cuartil. Mide el ancho del 50 por ciento central de los datos y por eso se le llama una medida robusta: no cambia aunque el dato más alto se dispare. Un IQR pequeño describe una operación predecible; un IQR grande describe una operación que exige más colchón de inventario, de caja o de personal.</p>' +

    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Interquartile range: how much the middle 50 percent moves</h2>' +

      '<p>The interquartile range, written IQR, is the distance between the third and the first quartile. It measures the width of the middle 50 percent of the data, which is why it is called a robust measure: it does not move even if the largest value shoots up. A small IQR describes a predictable operation; a large IQR describes one that needs more buffer in inventory, cash or staffing.</p>' +

  buildOneCard(problems[problems.length - 1], problems.length - 1);

  var D3 = tuneEven(genSorted(rng, 11, 124 + Math.floor(rng() * 40), 6, 10));

    if (es) return '' +

      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Límite inferior</div><div class="rform">Q1 − 1.5 × IQR</div><div class="rnote">Por debajo de esta línea el dato se marca.</div></div>' +
        '<div class="rcard"><div class="rname">Límite superior</div><div class="rform">Q3 + 1.5 × IQR</div><div class="rnote">Por arriba de esta línea el dato se marca.</div></div>' +
        '<div class="rcard"><div class="rname">Bigotes</div><div class="rform">Último dato dentro de los límites</div><div class="rnote">Los bigotes nunca se dibujan hasta un valor atípico.</div></div>' +

  var d8 = mk(q8i, o8.correctIdx, false);
  problems.push({ i18n: d8.i18n, title: d8.title, questionText: d8.questionText, options: d8.options, correctIdx: d8.correctIdx, explanation: d8.explanation, hint: d8.hint, showWork: false, fn: '', studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Problema 9 ── */
  var Gc = tuneEven(genSorted(rng, 13, 46 + Math.floor(rng() * 16), 4, 7));
  var fG0 = fences(Gc);
  var G = Gc.slice();
  G[G.length - 1] = Math.round(fG0.hi + 5 + Math.floor(rng() * 9));
  G[0] = Math.round(fG0.lo - 4 - Math.floor(rng() * 8));
  G.sort(function(x, y) { return x - y; });
  var fG = fences(G);
  var gOuts = G.filter(function(v) { return v > fG.hi || v < fG.lo; });
  var nOut = gOuts.length;
  var o9 = valOpts(nOut, [nOut + 1, nOut + 2, Math.max(0, nOut - 1), nOut + 3],
    function(v) { return un(v, v === 1 ? 'devolución' : 'devoluciones'); },
    function(v) { return un(v, v === 1 ? 'return' : 'returns'); }, rng);
  var q9i = {
    title: { es: 'Devoluciones fuera de patrón', en: 'Returns outside the pattern' },
    q: { es: 'Una tienda departamental registra el monto de las devoluciones de trece días: ' + listMM(shuffle(G, rng)) + '. El área de prevención de pérdidas aplica la regla de límites basada en los cuartiles para decidir qué días se auditan. ¿Cuántos de esos montos quedan fuera de los límites?',
        en: 'A department store records the value of returns over thirteen days: ' + listMM(shuffle(G, rng)) + '. The loss prevention team applies the quartile based limit rule to decide which days get audited. How many of those amounts fall outside the limits?' },
    opts: { es: o9.es, en: o9.en },
    hint: { es: 'Calcula los dos límites una sola vez a partir de los cuartiles de los trece montos y luego revisa cada extremo de la lista ordenada.',
            en: 'Compute both limits once from the quartiles of the thirteen amounts and then check each end of the sorted list.' },
    exp: { es: 'Ordenados, los montos son: ' + listMM(G) + '. Q1 = ' + mm(fG.q1) + ' y Q3 = ' + mm(fG.q3) + ', así que IQR = ' + mm(fG.iqr) + ' y un punto y medio de IQR equivale a ' + mm(1.5 * fG.iqr) + '. Los límites quedan en ' + mm(fG.lo) + ' y ' + mm(fG.hi) + '. Fuera de esa franja quedan: ' + listMM(gOuts) + '. Son ' + un(nOut, nOut === 1 ? 'monto' : 'montos') + ' para auditar, y conviene revisarlos antes de concluir que hubo fraude.',
           en: 'Sorted, the amounts are: ' + listMM(G) + '. Q1 = ' + mm(fG.q1) + ' and Q3 = ' + mm(fG.q3) + ', so IQR = ' + mm(fG.iqr) + ' and one and a half IQR equals ' + mm(1.5 * fG.iqr) + '. The limits land at ' + mm(fG.lo) + ' and ' + mm(fG.hi) + '. Outside that band we find: ' + listMM(gOuts) + '. That is ' + un(nOut, nOut === 1 ? 'amount' : 'amounts') + ' to audit, and they should be reviewed before concluding that there was fraud.' }
  };
  var d9 = mk(q9i, o9.correctIdx, true);
  problems.push({ i18n: d9.i18n, title: d9.title, questionText: d9.questionText, options: d9.options, correctIdx: d9.correctIdx, explanation: d9.explanation, hint: d9.hint, showWork: true, fn: '', studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Problema 10 ── */
  var bigOrder = 400 + Math.floor(rng() * 260);
  var o10 = shuffleOpts(
    ['La media sube de forma notable, la mediana casi no se mueve y el bigote superior se alarga.',
     'La media y la mediana suben en la misma proporción, porque ambas resumen el centro.',
     'La mediana sube y la media queda igual, porque el pedido es un valor atípico.',
     'El rango intercuartílico se duplica de inmediato, porque el pedido es muy alto.'],
    ['The mean rises noticeably, the median barely moves and the upper whisker stretches out.',
     'The mean and the median rise in the same proportion, because both summarise the centre.',
     'The median rises and the mean stays the same, because the order is an outlier.',
     'The interquartile range doubles immediately, because the order is very large.'], rng);
  var q10i = {
    title: { es: 'Efecto de un pedido corporativo', en: 'Effect of a corporate order' },
    q: { es: 'Una franquicia reporta cada mes la media y el resumen de cinco números de sus ventas mensuales. Al cierre del año entra un pedido corporativo extraordinario de ' + mm(bigOrder) + ' que se suma al mes que ya era el más alto de la serie. ¿Qué le ocurre a los indicadores del reporte?',
        en: 'A franchise reports the mean and the five number summary of its monthly sales every month. At year end an exceptional corporate order of ' + mm(bigOrder) + ' is added to the month that was already the highest in the series. What happens to the indicators in the report?' },
    opts: { es: o10.es, en: o10.en },
    hint: { es: 'Piensa en cuáles indicadores dependen de la magnitud de cada dato y cuáles dependen solo de su posición dentro del orden.',
            en: 'Think about which indicators depend on the size of each value and which depend only on its position within the ordering.' },
    exp: { es: 'La media suma todos los montos y los divide entre el número de meses, así que un dato mucho más grande la jala hacia arriba. La mediana y los cuartiles dependen de la posición, no de la magnitud, y el mes más alto ya ocupaba el extremo del orden, así que casi no se mueven. En la gráfica el efecto visible es que el bigote superior se estira o el punto se dibuja aparte como atípico.',
           en: 'The mean adds all the amounts and divides by the number of months, so a much larger value pulls it upward. The median and the quartiles depend on position rather than size, and the highest month already sat at the end of the ordering, so they barely move. On the chart the visible effect is that the upper whisker stretches out or the point is drawn separately as an outlier.' }
  };
  var d10 = mk(q10i, o10.correctIdx, false);
  problems.push({ i18n: d10.i18n, title: d10.title, questionText: d10.questionText, options: d10.options, correctIdx: d10.correctIdx, explanation: d10.explanation, hint: d10.hint, showWork: false, fn: '', studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}

function applyUIStrings() {

  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);

  set('lbl-group-el', t('lbl-group'));

  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));

  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');
    if (st) st.innerHTML = p.questionText + '<span class="pfn">' + (p.fn || '') + '</span>';
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }
