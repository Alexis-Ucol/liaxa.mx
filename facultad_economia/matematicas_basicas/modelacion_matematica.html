/* ════════════════════════════════════════════════════════════════════════
   SECTION REGISTRY  (concept text is re-rendered on language switch)
   ════════════════════════════════════════════════════════════════════════ */
function addSection(fn) {
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = fn(LANG);
  document.getElementById('lessonBody').appendChild(d);
  sectionDefs.push({ el: d, fn: fn });
}
function applySectionLang() {
  sectionDefs.forEach(function(s) { s.el.innerHTML = s.fn(LANG); });
}

/* ════════════════════════════════════════════════════════════════════════
   ITEM ASSEMBLY
   Each item keeps both languages in i18n. The student always reads one of
   them: q, opts, hint and exp hold the active language and are the only
   fields the cards and the PDF ever touch.
   The runtime gate dumps questionText, options and explanation for external
   review, so those three carry both versions tagged ES and EN. They are an
   audit surface, never rendered anywhere in the guide.
   ════════════════════════════════════════════════════════════════════════ */
function bothTxt(o) {
  return (o.es === o.en) ? o.es : ('[ES] ' + o.es + '\n[EN] ' + o.en);
}
function bothOpts(o) {
  return o.es.map(function(s, i) {
    return (s === o.en[i]) ? s : ('[ES] ' + s + '   [EN] ' + o.en[i]);
  });
}
function mk(i18n, correctIdx, showWork) {
  return {
    i18n: i18n, correctIdx: correctIdx, showWork: showWork,
    title: i18n.title[LANG],
    q:     i18n.q[LANG],
    hint:  i18n.hint[LANG],
    exp:   i18n.exp[LANG],
    opts:  i18n.opts[LANG].slice(),
    questionText: bothTxt(i18n.q),
    explanation:  bothTxt(i18n.exp),
    options:      bothOpts(i18n.opts)
  };
}
function addItem(i18n, correctIdx, showWork) {
  var d = mk(i18n, correctIdx, showWork);
  problems.push({
    i18n: d.i18n, title: d.title, q: d.q, hint: d.hint, exp: d.exp, opts: d.opts,
    questionText: d.questionText, options: d.options, explanation: d.explanation,
    correctIdx: d.correctIdx, showWork: d.showWork,
    studentChoice: null, pendingChoice: null
  });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}

/* ════════════════════════════════════════════════════════════════════════
   PLANE PRIMITIVES
   The four tools draw on the same kind of plane, so the axes, the grid and
   the scale always look alike and the student reads one picture, not four.
   Colours come from the CSS tokens, so the plane follows the theme.
   ════════════════════════════════════════════════════════════════════════ */
var SVW = 340, SVH = 232, SVL = 46, SVR = 12, SVT = 14, SVB = 30;
function mapX(x, xmin, xmax) { return SVL + (x - xmin) / (xmax - xmin) * (SVW - SVL - SVR); }
function mapY(y, ymin, ymax) { return (SVH - SVB) - (y - ymin) / (ymax - ymin) * (SVH - SVB - SVT); }
function svgNum(v) { return (Math.round(v * 10) / 10).toString(); }
function svgOpen() {
  return '<svg viewBox="0 0 ' + SVW + ' ' + SVH + '" xmlns="http://www.w3.org/2000/svg" role="img">';
}
function gridSvg(xmin, xmax, ymin, ymax, xlab, ylab, xticks, yticks) {
  var s = '', i, gx, gy;
  for (i = 0; i <= 4; i++) {
    gx = xmin + (xmax - xmin) * i / 4;
    s += '<line x1="' + svgNum(mapX(gx, xmin, xmax)) + '" y1="' + SVT + '" x2="' + svgNum(mapX(gx, xmin, xmax)) + '" y2="' + (SVH - SVB) + '" stroke="var(--border)" stroke-width="0.6"/>';
    gy = ymin + (ymax - ymin) * i / 4;
    s += '<line x1="' + SVL + '" y1="' + svgNum(mapY(gy, ymin, ymax)) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(mapY(gy, ymin, ymax)) + '" stroke="var(--border)" stroke-width="0.6"/>';
  }
  var y0 = mapY(Math.max(ymin, Math.min(ymax, 0)), ymin, ymax);
  var x0 = mapX(Math.max(xmin, Math.min(xmax, 0)), xmin, xmax);
  s += '<line x1="' + SVL + '" y1="' + svgNum(y0) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(y0) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  s += '<line x1="' + svgNum(x0) + '" y1="' + SVT + '" x2="' + svgNum(x0) + '" y2="' + (SVH - SVB) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  for (i = 0; i < xticks.length; i++) {
    s += '<text x="' + svgNum(mapX(xticks[i].v, xmin, xmax)) + '" y="' + (SVH - SVB + 12) + '" font-size="8" fill="var(--text3)" text-anchor="middle">' + xticks[i].t + '</text>';
  }
  for (i = 0; i < yticks.length; i++) {
    s += '<text x="' + (SVL - 4) + '" y="' + svgNum(mapY(yticks[i].v, ymin, ymax) + 3) + '" font-size="8" fill="var(--text3)" text-anchor="end">' + yticks[i].t + '</text>';
  }
  s += '<text x="' + (SVW - SVR) + '" y="' + (SVH - 4) + '" font-size="8.5" fill="var(--text2)" text-anchor="end">' + xlab + '</text>';
  s += '<text x="2" y="10" font-size="8.5" fill="var(--text2)" text-anchor="start">' + ylab + '</text>';
  return s;
}
/* Returns the piece of the line y = b + m x that actually fits inside the
   drawing box, so a steep line never spills over the axes. */
function clipSeg(m, b, xmin, xmax, ymin, ymax) {
  var lo = xmin, hi = xmax;
  if (m !== 0) {
    var xa = (ymin - b) / m, xb = (ymax - b) / m;
    lo = Math.max(lo, Math.min(xa, xb));
    hi = Math.min(hi, Math.max(xa, xb));
  } else if (b < ymin || b > ymax) { return null; }
  if (hi - lo < 1e-9) return null;
  return [lo, b + m * lo, hi, b + m * hi];
}
function lineSvg(m, b, xmin, xmax, ymin, ymax, color, width) {
  var g = clipSeg(m, b, xmin, xmax, ymin, ymax);
  if (!g) return '';
  return '<line x1="' + svgNum(mapX(g[0], xmin, xmax)) + '" y1="' + svgNum(mapY(g[1], ymin, ymax)) +
         '" x2="' + svgNum(mapX(g[2], xmin, xmax)) + '" y2="' + svgNum(mapY(g[3], ymin, ymax)) +
         '" stroke="' + color + '" stroke-width="' + width + '"/>';
}
/* Any curve is drawn by sampling and cut at the edges of the box, so the
   part that leaves the frame never dirties the axes. */
function curveSvg(f, xmin, xmax, ymin, ymax, color, width) {
  var N = 96, run = [], segs = [], i, x, y;
  for (i = 0; i <= N; i++) {
    x = xmin + (xmax - xmin) * i / N;
    y = f(x);
    if (isFinite(y) && y >= ymin && y <= ymax) {
      run.push(svgNum(mapX(x, xmin, xmax)) + ',' + svgNum(mapY(y, ymin, ymax)));
    } else {
      if (run.length > 1) segs.push(run);
      run = [];
    }
  }
  if (run.length > 1) segs.push(run);
  return segs.map(function(p) {
    return '<polyline points="' + p.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="' + width + '"/>';
  }).join('');
}
function dotSvg(x, y, xmin, xmax, ymin, ymax, color, r) {
  if (!(x >= xmin && x <= xmax && y >= ymin && y <= ymax)) return '';
  return '<circle cx="' + svgNum(mapX(x, xmin, xmax)) + '" cy="' + svgNum(mapY(y, ymin, ymax)) +
         '" r="' + r + '" fill="' + color + '"/>';
}
function vlineSvg(x, xmin, xmax, ymin, ymax, color) {
  if (!(x >= xmin && x <= xmax)) return '';
  return '<line x1="' + svgNum(mapX(x, xmin, xmax)) + '" y1="' + SVT +
         '" x2="' + svgNum(mapX(x, xmin, xmax)) + '" y2="' + (SVH - SVB) +
         '" stroke="' + color + '" stroke-width="1" stroke-dasharray="3 3"/>';
}
function roundUpTo(v, step) { return Math.ceil(v / step) * step; }

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · del enunciado al modelo
   Cinco meses observados de la operacion. El alumno mueve las dos piezas
   del modelo, la parte fija y la parte por entrega, hasta que la recta pasa
   por los cinco puntos. Empezar con costo fijo en cero muestra que un
   modelo puramente proporcional no puede explicar los datos.
   ════════════════════════════════════════════════════════════════════════ */
function widgetAjuste(Ftrue, vTrue, vStart) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var QS = [400, 700, 1000, 1300, 1600];
  var OBS = QS.map(function(q) { return Ftrue + vTrue * q; });
  var state = { F: 0, v: vStart };
  var XMIN = 0, XMAX = 1800, YMIN = 0;
  var YMAX = roundUpTo((Ftrue + vTrue * 1600) * 1.25, 10000);

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var dev = 0, i;
    for (i = 0; i < QS.length; i++) dev += Math.abs(state.F + state.v * QS[i] - OBS[i]);
    var xt = [{ v: 0, t: '0' }, { v: 450, t: '450' }, { v: 900, t: '900' }, { v: 1350, t: '1,350' }, { v: 1800, t: '1,800' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: intN(YMAX / 2000) + ' k' }, { v: YMAX, t: intN(YMAX / 1000) + ' k' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'entregas del mes' : 'deliveries in the month',
      es ? 'costo total, $' : 'total cost, $', xt, yt);
    inner += lineSvg(state.v, state.F, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    for (i = 0; i < QS.length; i++) {
      inner += dotSvg(QS[i], OBS[i], XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '4.2');
    }
    set('#w1svg', svgOpen() + inner + '</svg>');

    set('#w1fl', money(state.F));
    set('#w1vl', money(state.v));
    set('#w1dev', money(dev));
    set('#w1at', money(state.F + state.v * 1000));
    set('#w1obs', money(Ftrue + vTrue * 1000));
    set('#w1eq', (es ? 'costo del mes = ' : 'cost of the month = ') +
      '<span class="ec">' + money(state.F) + (es ? ' fijos' : ' fixed') + '</span>' +
      '<span style="color:var(--text3)"> + </span>' +
      '<span class="ev">' + money(state.v) + (es ? ' por entrega' : ' per delivery') + '</span>');

    var vd = host.querySelector('#w1verd');
    if (vd) {
      if (dev === 0) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'La recta pasa por los cinco meses: este par de números es el modelo de la operación.'
                            : 'The line runs through all five months: this pair of numbers is the model of the operation.';
      } else if (state.F === 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Sin parte fija la recta sale del origen y ningún costo por entrega la hace pasar por los cinco puntos.'
                            : 'With no fixed part the line leaves the origin, and no cost per delivery makes it pass through all five points.';
      } else {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Todavía hay distancia entre la recta y los meses observados.'
                            : 'There is still a gap between the line and the observed months.';
      }
    }

    set('#w1read', (dev === 0)
      ? (es
        ? '<strong>Lectura de negocio:</strong> el modelo quedó armado. Los ' + money(Ftrue) + ' son la renta de la bodega, los sueldos base y el seguro, que se pagan aunque no salga ni un paquete, y los ' + money(vTrue) + ' son lo que agrega cada entrega en gasolina, empaque y bono al repartidor. La distinción no es un detalle contable: la parte fija decide si el negocio aguanta un mes flojo, y la parte por entrega decide si conviene aceptar un pedido más. Fíjate en que el modelo tiene solo dos números y explica cinco meses distintos, y por eso sirve para el sexto.'
        : '<strong>Business reading:</strong> the model is built. The ' + money(Ftrue) + ' is the warehouse rent, the base wages and the insurance, all paid even if not one parcel goes out, and the ' + money(vTrue) + ' is what each delivery adds in fuel, packaging and driver bonus. The distinction is no accounting nicety: the fixed part decides whether the business survives a slow month, and the per-delivery part decides whether taking one more order pays. Notice that the model holds only two numbers and explains five different months, which is why it works for the sixth.')
      : (state.F === 0)
      ? (es
        ? '<strong>Lectura de negocio:</strong> con costo fijo en cero estás suponiendo que el gasto es proporcional a las entregas, es decir que un mes con la mitad de paquetes cuesta la mitad. Prueba cualquier costo por entrega: la recta se queda corta en los meses flojos y se pasa en los ocupados, porque la renta de la bodega se paga igual. Esa terquedad de los datos es la señal de que el modelo necesita un término que no dependa del volumen. La desviación acumulada de ' + money(dev) + ' mide exactamente cuánto le falta al modelo para explicar lo que ya ocurrió.'
        : '<strong>Business reading:</strong> with the fixed cost at zero you are assuming spending is proportional to deliveries, that is, that a month with half the parcels costs half as much. Try any cost per delivery: the line falls short in the slow months and overshoots in the busy ones, because the warehouse rent is paid all the same. That stubbornness in the data is the sign that the model needs a term which does not depend on volume. The accumulated deviation of ' + money(dev) + ' measures exactly how far the model is from explaining what already happened.')
      : (es
        ? '<strong>Lectura de negocio:</strong> vas acercándote. La desviación acumulada de ' + money(dev) + ' suma, mes por mes, la distancia entre lo que el modelo predice y lo que la empresa gastó. Una manera rápida de cerrarla: la inclinación de la recta la fija el costo por entrega, así que ajústalo primero hasta que la recta quede paralela a la fila de puntos, y solo después sube o baja el costo fijo para asentarla encima. Separar los dos ajustes es más rápido que mover los dos números a ciegas.'
        : '<strong>Business reading:</strong> you are closing in. The accumulated deviation of ' + money(dev) + ' adds up, month by month, the distance between what the model predicts and what the company actually spent. A quick way to close it: the slope of the line is set by the cost per delivery, so tune that first until the line runs parallel to the row of points, and only then raise or lower the fixed cost to settle it on top of them. Splitting the two adjustments is faster than moving both numbers blind.'));
  }

  function mount() {
    var es = LANG === 'es';
    var rows = QS.map(function(q, i) {
      return intN(q) + (es ? ' entregas' : ' deliveries') + ': ' + money(OBS[i]);
    }).join('   ·   ');
    host.innerHTML =
      '<div class="gcrd" data-widget="ajuste-del-modelo">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Armar el modelo a partir de los meses observados' : 'Building the model from the observed months') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Estos son cinco meses reales de la operación de Rutas del Puerto: cuántas entregas hizo y cuánto gastó. Los puntos dorados son esos meses. La recta verde es tu modelo. Mueve las dos piezas hasta que la recta pase exactamente por los cinco puntos y la desviación acumulada llegue a cero. Empieza dejando el costo fijo en cero, que es el modelo que casi todo el mundo escribe primero, y comprueba por ti mismo que ningún costo por entrega logra salvarlo.'
          : 'These are five real months of the Rutas del Puerto operation: how many deliveries it made and how much it spent. The golden dots are those months. The green line is your model. Move the two pieces until the line runs exactly through the five points and the accumulated deviation reaches zero. Start with the fixed cost at zero, the model almost everybody writes first, and see for yourself that no cost per delivery can rescue it.') + '</div>' +
        '<div class="dlist">' + rows + '</div>' +
        '<div class="iw-expr" id="w1eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'tu modelo' : 'your model') + '</span><span><i class="lg-out"></i>' + (es ? 'meses observados' : 'observed months') + '</span></div>' +
        '<div class="plane" id="w1svg"></div>' +
        '<div class="verdict" id="w1verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo fijo del mes' : 'Fixed cost for the month') + ': <span class="cval" id="w1fl"></span></label>' +
          '<input type="range" min="0" max="60000" step="2000" id="w1f" value="' + state.F + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Costo por entrega' : 'Cost per delivery') + ': <span class="cval" id="w1vl"></span></label>' +
          '<input type="range" min="10" max="34" step="1" id="w1v" value="' + state.v + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Desviación acumulada' : 'Accumulated deviation') + '</div><div class="mnum cs" id="w1dev"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Tu modelo a 1,000 entregas' : 'Your model at 1,000 deliveries') + '</div><div class="mnum ps" id="w1at"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Lo que gastó ese mes' : 'What it spent that month') + '</div><div class="mnum ts" id="w1obs"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w1read"></div>' +
      '</div>';
    var fs = host.querySelector('#w1f'), vs = host.querySelector('#w1v');
    fs.addEventListener('input', function() { state.F = parseInt(fs.value, 10); render(); });
    vs.addEventListener('input', function() { state.v = parseInt(vs.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · que familia describe cada serie
   Tres series reales del negocio y tres familias de modelo. Cada familia se
   ancla en los primeros meses y se proyecta hacia adelante; la desviacion
   se mide siempre en los tres ultimos meses, de modo que la comparacion es
   justa. Elegir mal no da un error pequeno, da una proyeccion que se abre.
   ════════════════════════════════════════════════════════════════════════ */
function widgetFamilia(serL, serE, serQ) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var SER = [
    { v: serL, fam: 'lin', money: true,  key: 'flota' },
    { v: serE, fam: 'exp', money: false, key: 'paquetes' },
    { v: serQ, fam: 'cua', money: true,  key: 'ingreso' }
  ];
  var state = { s: 0, f: 'lin' };

  function fitAt(v, fam, x) {
    var d1 = v[1] - v[0];
    if (fam === 'lin') return v[0] + d1 * x;
    if (fam === 'exp') return v[0] * Math.pow(v[1] / v[0], x);
    var d2 = (v[2] - v[1]) - d1;
    return v[0] + d1 * x + (d2 / 2) * x * (x - 1);
  }

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var S = SER[state.s], v = S.v, i;
    var unit = S.money ? money : function(x) { return intN(x); };
    var dev = 0;
    for (i = 3; i <= 5; i++) dev += Math.abs(fitAt(v, state.f, i) - v[i]);
    dev = Math.round(dev);

    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
    for (i = 0; i <= 5; i++) { var f = fitAt(v, state.f, i); if (isFinite(f)) { lo = Math.min(lo, f); hi = Math.max(hi, f); } }
    var span = Math.max(hi - lo, 1);
    var YMIN = Math.max(0, lo - span * 0.15), YMAX = hi + span * 0.15;
    var XMIN = 0, XMAX = 5;
    var xt = [{ v: 0, t: '1' }, { v: 1, t: '2' }, { v: 2, t: '3' }, { v: 3, t: '4' }, { v: 4, t: '5' }, { v: 5, t: '6' }];
    var yt = [{ v: YMIN, t: unit(YMIN) }, { v: (YMIN + YMAX) / 2, t: unit((YMIN + YMAX) / 2) }, { v: YMAX, t: unit(YMAX) }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'mes' : 'month',
      S.money ? (es ? '$' : '$') : (es ? 'paquetes' : 'parcels'), xt, yt);
    inner += curveSvg(function(x) { return fitAt(v, state.f, x); }, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.2');
    for (i = 0; i <= 5; i++) inner += dotSvg(i, v[i], XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '4');
    set('#w2svg', svgOpen() + inner + '</svg>');

    var difs = [], rats = [];
    for (i = 1; i <= 5; i++) { difs.push(unit(v[i] - v[i - 1])); rats.push(dec2(v[i] / v[i - 1])); }
    set('#w2vals', (es ? 'valores: ' : 'values: ') + v.map(unit).join('  ·  '));
    set('#w2difs', (es ? 'diferencias: ' : 'differences: ') + difs.join('  ·  '));
    set('#w2rats', (es ? 'razones: ' : 'ratios: ') + rats.join('  ·  '));
    set('#w2dev', unit(dev));
    set('#w2next', unit(Math.round(fitAt(v, state.f, 6))));
    set('#w2eq', (es ? 'serie ajustada con la familia ' : 'series fitted with the ') +
      '<span class="ec">' + (state.f === 'lin' ? (es ? 'lineal' : 'linear') : state.f === 'exp' ? (es ? 'exponencial' : 'exponential') : (es ? 'cuadrática' : 'quadratic')) + '</span>' +
      '<span style="color:var(--text3)">' + (es ? '' : ' family') + '</span>');

    var vd = host.querySelector('#w2verd');
    if (vd) {
      if (dev === 0 && state.f === S.fam) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Acertaste: esta familia reproduce los seis meses sin sobrar ni faltar nada.'
                            : 'You got it: this family reproduces all six months with nothing left over and nothing missing.';
      } else if (dev === 0) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'También pasa por los seis meses, pero con un parámetro de más: cuando dos familias encajan igual se usa la más simple.'
                            : 'It also runs through all six months, but with one parameter too many: when two families fit alike, the simpler one is used.';
      } else {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Esta familia se despega de los datos en los últimos meses.'
                            : 'This family pulls away from the data over the last months.';
      }
    }

    set('#w2read', (dev === 0 && state.f === S.fam)
      ? (es
        ? '<strong>Lectura de negocio:</strong> la firma quedó a la vista en los renglones de arriba. Cuando las diferencias entre meses consecutivos se repiten, la serie es lineal; cuando lo que se repite son las razones, es exponencial; y cuando las diferencias cambian de forma pareja, subiendo primero y bajando después, es cuadrática. Reconocer la firma antes de calcular ahorra el error más caro de la modelación, que no es equivocarse en una cuenta sino elegir la familia equivocada y arrastrarla hasta la decisión final. Con la familia correcta el séptimo mes se proyecta en ' + unit(Math.round(fitAt(v, state.f, 6))) + '.'
        : '<strong>Business reading:</strong> the signature is right there in the rows above. When the differences between consecutive months repeat, the series is linear; when what repeats is the ratios, it is exponential; and when the differences change evenly, rising first and falling later, it is quadratic. Recognising the signature before calculating saves the most expensive mistake in modeling, which is not getting a sum wrong but picking the wrong family and dragging it all the way to the final decision. With the right family the seventh month projects to ' + unit(Math.round(fitAt(v, state.f, 6))) + '.')
      : (dev === 0)
      ? (es
        ? '<strong>Lectura de negocio:</strong> esta familia también pasa por los seis meses, y eso merece una explicación. Una cuadrática con curvatura cero es una recta escrita con un término de más, así que siempre puede imitar a una serie lineal. La regla que usan los analistas para no perderse aquí es la parsimonia: entre dos modelos que explican lo mismo se elige el que tiene menos piezas, porque cada pieza adicional es un número que hay que estimar y que puede estimarse mal. Un modelo con parámetros de sobra se ajusta muy bien al pasado y suele proyectar peor el futuro.'
        : '<strong>Business reading:</strong> this family also runs through all six months, and that deserves an explanation. A quadratic with zero curvature is a straight line written with one term too many, so it can always imitate a linear series. The rule analysts use to keep their footing here is parsimony: between two models that explain the same thing you keep the one with fewer pieces, because every extra piece is a number that has to be estimated and can be estimated badly. A model with spare parameters fits the past beautifully and usually forecasts the future worse.')
      : (es
        ? '<strong>Lectura de negocio:</strong> la desviación acumulada de los últimos tres meses llega a ' + unit(dev) + '. Fíjate en que el ajuste no falla al principio: la curva sale pegada a los primeros puntos y se despega después, que es exactamente lo peligroso de elegir mal la familia. Un modelo así pasa cualquier revisión rápida sobre los meses recientes y falla justo donde se le pide trabajar, que es hacia adelante. Con esta familia el séptimo mes se proyectaría en ' + unit(Math.round(fitAt(v, state.f, 6))) + ', y esa cifra es la que llegaría a la junta de presupuesto.'
        : '<strong>Business reading:</strong> the deviation accumulated over the last three months comes to ' + unit(dev) + '. Notice that the fit does not fail at the start: the curve leaves hugging the first points and pulls away later, which is exactly what makes the wrong family dangerous. A model like that survives any quick review of recent months and fails precisely where it is asked to work, which is ahead. With this family the seventh month would project to ' + unit(Math.round(fitAt(v, state.f, 6))) + ', and that is the figure that would reach the budget meeting.'));

    host.querySelectorAll('[data-ser]').forEach(function(b) {
      b.classList.toggle('active', parseInt(b.getAttribute('data-ser'), 10) === state.s);
    });
    host.querySelectorAll('[data-fam]').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-fam') === state.f);
    });
  }

  function mount() {
    var es = LANG === 'es';
    var serNames = es
      ? ['Costo de la flota', 'Paquetes recibidos', 'Ingreso de temporada']
      : ['Fleet cost', 'Parcels received', 'Seasonal revenue'];
    var famNames = es
      ? { lin: 'Lineal', exp: 'Exponencial', cua: 'Cuadrática' }
      : { lin: 'Linear', exp: 'Exponential', cua: 'Quadratic' };
    host.innerHTML =
      '<div class="gcrd" data-widget="familia-del-modelo">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Qué familia describe cada serie' : 'Which family describes each series') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Rutas del Puerto lleva tres registros de seis meses. Elige uno con los botones de arriba y después prueba con qué familia lo modelas. Cada familia se ancla en los primeros meses y se proyecta hacia adelante, y la desviación se mide siempre en los tres últimos, así que la comparación es pareja. Antes de elegir mira los dos renglones de abajo: las diferencias delatan a la lineal, las razones delatan a la exponencial. Una de las series encaja con dos familias a la vez y conviene averiguar cuál y por qué.'
          : 'Rutas del Puerto keeps three six-month records. Pick one with the buttons above, then try out the family you would model it with. Each family is anchored on the first months and projected forward, and the deviation is always measured over the last three, so the comparison is even. Before choosing, look at the two rows below: the differences give the linear one away, the ratios give away the exponential one. One of the series fits two families at once, and it is worth finding out which and why.') + '</div>' +
        '<div class="mtabs">' +
          '<button class="mtab" data-ser="0">' + serNames[0] + '</button>' +
          '<button class="mtab" data-ser="1">' + serNames[1] + '</button>' +
          '<button class="mtab" data-ser="2">' + serNames[2] + '</button>' +
        '</div>' +
        '<div class="dlist" id="w2vals"></div>' +
        '<div class="dlist" id="w2difs"></div>' +
        '<div class="dlist" id="w2rats"></div>' +
        '<div class="mtabs">' +
          '<button class="mtab" data-fam="lin">' + famNames.lin + '</button>' +
          '<button class="mtab" data-fam="exp">' + famNames.exp + '</button>' +
          '<button class="mtab" data-fam="cua">' + famNames.cua + '</button>' +
        '</div>' +
        '<div class="iw-expr" id="w2eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'familia elegida' : 'chosen family') + '</span><span><i class="lg-out"></i>' + (es ? 'meses observados' : 'observed months') + '</span></div>' +
        '<div class="plane" id="w2svg"></div>' +
        '<div class="verdict" id="w2verd"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Desviación en los últimos tres meses' : 'Deviation over the last three months') + '</div><div class="mnum cs" id="w2dev"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Proyección del séptimo mes' : 'Seventh month projection') + '</div><div class="mnum ps" id="w2next"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Meses registrados' : 'Months on record') + '</div><div class="mnum ts">6</div></div>' +
        '</div>' +
        '<div class="iw-read" id="w2read"></div>' +
      '</div>';
    host.querySelectorAll('[data-ser]').forEach(function(b) {
      b.addEventListener('click', function() { state.s = parseInt(b.getAttribute('data-ser'), 10); render(); });
    });
    host.querySelectorAll('[data-fam]').forEach(function(b) {
      b.addEventListener('click', function() { state.f = b.getAttribute('data-fam'); render(); });
    });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · el punto de cambio entre dos planes
   Flota propia contra subcontratacion. Las dos rectas se cruzan una sola
   vez y ese cruce es la decision. El alumno mueve el costo fijo y ve el
   cruce correrse, y mueve el volumen para pararse de un lado o del otro.
   ════════════════════════════════════════════════════════════════════════ */
function widgetCambio(F0, vA, vB, q0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { F: F0, q: q0 };
  var g = vB - vA;
  var XMIN = 0, XMAX = 4000, YMIN = 0;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var tie   = state.F / g;
    var tieUp = Math.ceil(tie);
    var cFleet = state.F + vA * state.q;
    var cOut   = vB * state.q;
    var YMAX = roundUpTo(Math.max(state.F + vA * XMAX, vB * XMAX) * 1.06, 20000);
    var xt = [{ v: 0, t: '0' }, { v: 1000, t: '1,000' }, { v: 2000, t: '2,000' }, { v: 3000, t: '3,000' }, { v: 4000, t: '4,000' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: intN(YMAX / 2000) + ' k' }, { v: YMAX, t: intN(YMAX / 1000) + ' k' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'entregas del mes' : 'deliveries in the month',
      es ? 'costo del mes, $' : 'cost of the month, $', xt, yt);
    inner += lineSvg(vA, state.F, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    inner += lineSvg(vB, 0, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '2.4');
    inner += vlineSvg(tie, XMIN, XMAX, YMIN, YMAX, 'var(--text3)');
    inner += dotSvg(tie, vB * tie, XMIN, XMAX, YMIN, YMAX, 'var(--text3)', '4');
    inner += dotSvg(state.q, cFleet, XMIN, XMAX, YMIN, YMAX, 'var(--text)', '4.5');
    set('#w3svg', svgOpen() + inner + '</svg>');

    set('#w3fl', money(state.F));
    set('#w3ql', intN(state.q));
    set('#w3a', money(cFleet));
    set('#w3b', money(cOut));
    set('#w3tie', intN(tieUp) + (es ? ' entregas' : ' deliveries'));
    set('#w3eq', (es ? 'la flota ahorra ' : 'the fleet saves ') +
      '<span class="ec">' + money(g) + (es ? ' por entrega' : ' per delivery') + '</span>' +
      '<span style="color:var(--text3)">' + (es ? ' y cuesta ' : ' and costs ') + '</span>' +
      '<span class="ev">' + money(state.F) + (es ? ' fijos al mes' : ' fixed a month') + '</span>');

    var vd = host.querySelector('#w3verd');
    if (vd) {
      if (cFleet < cOut) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'A este volumen conviene la flota propia: ahorra ' + money(cOut - cFleet) + ' en el mes.'
                            : 'At this volume the own fleet wins: it saves ' + money(cOut - cFleet) + ' over the month.';
      } else if (cFleet > cOut) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'A este volumen conviene subcontratar: la flota propia cuesta ' + money(cFleet - cOut) + ' de más.'
                            : 'At this volume outsourcing wins: the own fleet costs ' + money(cFleet - cOut) + ' more.';
      } else {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Empate exacto: a este volumen los dos planes cuestan lo mismo.'
                            : 'An exact tie: at this volume both plans cost the same.';
      }
    }

    set('#w3read', (state.q < tie)
      ? (es
        ? '<strong>Lectura de negocio:</strong> por debajo del cruce el ahorro de ' + money(g) + ' por entrega no alcanza a pagar los ' + money(state.F) + ' de costo fijo, así que subcontratar sale mejor. Esa es la ventaja real de un contrato por entrega: no compromete nada por adelantado. El cruce está en ' + intN(tieUp) + ' entregas al mes, y conviene fijarse en un detalle: el resultado exacto del modelo casi nunca cae en un número entero de entregas, y como no existen fracciones de paquete la respuesta útil siempre se redondea hacia arriba.'
        : '<strong>Business reading:</strong> below the crossing the saving of ' + money(g) + ' per delivery does not cover the ' + money(state.F) + ' of fixed cost, so outsourcing comes out ahead. That is the real advantage of a per-delivery contract: it commits nothing in advance. The crossing sits at ' + intN(tieUp) + ' deliveries a month, and one detail is worth noting: the exact result of the model almost never lands on a whole number of deliveries, and since there is no such thing as a fraction of a parcel the useful answer is always rounded up.')
      : (es
        ? '<strong>Lectura de negocio:</strong> pasado el cruce cada entrega deja ' + money(g) + ' de ahorro y el costo fijo ya quedó cubierto, así que la flota propia gana y la ventaja crece con el volumen. Ahora sube el costo fijo sin tocar el volumen y mira cómo el cruce se recorre hacia la derecha: rentar una bodega más grande no encarece cada entrega, pero sí sube el volumen mínimo que hay que sostener para justificarla. Esa es la pregunta que una dirección debe contestar antes de firmar, y no después.'
        : '<strong>Business reading:</strong> past the crossing every delivery leaves ' + money(g) + ' of saving and the fixed cost is already covered, so the own fleet wins and the advantage grows with volume. Now raise the fixed cost without touching the volume and watch the crossing travel to the right: renting a bigger warehouse makes no single delivery dearer, but it does raise the minimum volume that has to be sustained to justify it. That is the question a management team has to answer before signing, not after.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="punto-de-cambio">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Dónde se cruzan los dos planes' : 'Where the two plans cross') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La recta verde es la flota propia: un costo fijo mensual más ' + money(vA) + ' por entrega. La dorada es subcontratar: sin costo fijo, pero ' + money(vB) + ' por entrega. Mueve el volumen del mes y párate de un lado y del otro del cruce para ver cambiar el veredicto. Después mueve el costo fijo, que es la variable que la dirección sí controla al firmar un contrato, y observa hacia dónde se corre el punto de cambio y qué tan rápido lo hace.'
          : 'The green line is the own fleet: a monthly fixed cost plus ' + money(vA) + ' per delivery. The golden one is outsourcing: no fixed cost, but ' + money(vB) + ' per delivery. Move the volume of the month and stand on either side of the crossing to watch the verdict change. Then move the fixed cost, the variable management actually controls when it signs a contract, and watch which way the switching point travels and how fast.') + '</div>' +
        '<div class="iw-expr" id="w3eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'flota propia' : 'own fleet') + '</span><span><i class="lg-out"></i>' + (es ? 'subcontratar' : 'outsourcing') + '</span></div>' +
        '<div class="plane" id="w3svg"></div>' +
        '<div class="verdict" id="w3verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo fijo mensual de la flota' : 'Monthly fixed cost of the fleet') + ': <span class="cval" id="w3fl"></span></label>' +
          '<input type="range" min="6000" max="60000" step="2000" id="w3f" value="' + state.F + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Entregas del mes' : 'Deliveries in the month') + ': <span class="cval" id="w3ql"></span></label>' +
          '<input type="range" min="200" max="4000" step="100" id="w3q" value="' + state.q + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo con flota propia' : 'Cost with own fleet') + '</div><div class="mnum cs" id="w3a"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo subcontratado' : 'Outsourced cost') + '</div><div class="mnum ps" id="w3b"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Punto de cambio' : 'Switching point') + '</div><div class="mnum ts" id="w3tie"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    var fs = host.querySelector('#w3f'), qs = host.querySelector('#w3q');
    fs.addEventListener('input', function() { state.F = parseInt(fs.value, 10); render(); });
    qs.addEventListener('input', function() { state.q = parseInt(qs.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 4 · que tan firme es la decision
   El modelo se alimenta de dos estimaciones y ninguna es exacta. Aqui el
   alumno mete el error en cada una y observa cual de las dos tumba la
   decision primero. Es la diferencia entre un resultado y un resultado
   confiable.
   ════════════════════════════════════════════════════════════════════════ */
function widgetSensibilidad(F, vA, vB, qBase) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { ev: 0, eq: 0 };
  var XMIN = 0, XMAX = 4000, YMIN = 0;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var vAe = vA * (1 + state.ev / 100);
    var qe  = Math.round(qBase * (1 + state.eq / 100));
    var g   = vB - vAe;
    var cFleet = F + vAe * qe;
    var cOut   = vB * qe;
    var adv    = cOut - cFleet;
    var tie    = g > 0 ? F / g : null;
    var YMAX = roundUpTo(Math.max(F + vA * 1.35 * XMAX, vB * XMAX) * 1.06, 20000);
    var xt = [{ v: 0, t: '0' }, { v: 1000, t: '1,000' }, { v: 2000, t: '2,000' }, { v: 3000, t: '3,000' }, { v: 4000, t: '4,000' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: intN(YMAX / 2000) + ' k' }, { v: YMAX, t: intN(YMAX / 1000) + ' k' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'entregas del mes' : 'deliveries in the month',
      es ? 'costo del mes, $' : 'cost of the month, $', xt, yt);
    inner += lineSvg(vAe, F, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    inner += lineSvg(vB, 0, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '2.4');
    if (tie !== null) inner += vlineSvg(tie, XMIN, XMAX, YMIN, YMAX, 'var(--text3)');
    inner += dotSvg(qe, cFleet, XMIN, XMAX, YMIN, YMAX, 'var(--text)', '4.5');
    set('#w4svg', svgOpen() + inner + '</svg>');

    set('#w4evl', (state.ev > 0 ? '+' : '') + intN(state.ev) + '%');
    set('#w4eql', (state.eq > 0 ? '+' : '') + intN(state.eq) + '%');
    set('#w4v', money1(vAe));
    set('#w4q', intN(qe) + (es ? ' entregas' : ' deliveries'));
    set('#w4tie', tie === null ? (es ? 'no existe' : 'none') : intN(Math.ceil(tie)) + (es ? ' entregas' : ' deliveries'));
    set('#w4adv', money(adv));
    set('#w4eq', (es ? 'costo por entrega estimado en ' : 'cost per delivery estimated at ') +
      '<span class="ec">' + money1(vAe) + '</span>' +
      '<span style="color:var(--text3)">' + (es ? ' sobre ' : ' over ') + '</span>' +
      '<span class="ev">' + intN(qe) + (es ? ' entregas' : ' deliveries') + '</span>');

    var vd = host.querySelector('#w4verd');
    if (vd) {
      if (adv > 0) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'La decisión se sostiene: con estos supuestos la flota propia sigue ganando por ' + money(adv) + '.'
                            : 'The decision holds: under these assumptions the own fleet still wins by ' + money(adv) + '.';
      } else if (adv < 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'La decisión se dio la vuelta: con estos supuestos subcontratar sale ' + money(-adv) + ' más barato.'
                            : 'The decision has flipped: under these assumptions outsourcing comes out ' + money(-adv) + ' cheaper.';
      } else {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Estás justo en el filo: los dos planes cuestan lo mismo y cualquier desviación decide.'
                            : 'You are right on the edge: both plans cost the same and any drift decides it.';
      }
    }

    set('#w4read', (adv > 0)
      ? (es
        ? '<strong>Lectura de negocio:</strong> con el volumen esperado de ' + intN(qBase) + ' entregas la flota propia gana por ' + money(adv) + ' al mes. Antes de firmar conviene averiguar qué tan cómodo es ese margen. Mueve primero el error en el volumen y anota con cuántos puntos porcentuales se voltea el veredicto; regresa a cero y repite con el error en el costo por entrega. La comparación de esos dos números es la que interesa: el parámetro que voltea la decisión con el error más pequeño es el que hay que medir con más cuidado antes de comprometerse.'
        : '<strong>Business reading:</strong> at the expected volume of ' + intN(qBase) + ' deliveries the own fleet wins by ' + money(adv) + ' a month. Before signing it pays to find out how comfortable that margin is. Move the volume error first and note how many percentage points it takes to flip the verdict; return to zero and repeat with the cost per delivery. Comparing those two numbers is what matters: the parameter that flips the decision on the smallest error is the one to measure most carefully before committing.')
      : (es
        ? '<strong>Lectura de negocio:</strong> este es el punto que rara vez se lleva a la junta. El modelo no cambió ni una línea, cambiaron los supuestos con los que se alimentó, y la recomendación se dio la vuelta. Un resultado que sobrevive a errores razonables en los datos de entrada es una decisión; uno que se voltea con un error del tamaño del que cualquiera comete al estimar es apenas una coincidencia aritmética. Reportar el rango en el que la respuesta se mantiene vale más que reportar el número exacto.'
        : '<strong>Business reading:</strong> this is the point that rarely makes it to the meeting. The model did not change one line, the assumptions feeding it did, and the recommendation turned around. A result that survives reasonable errors in the input data is a decision; one that flips on an error the size anybody makes while estimating is barely an arithmetic coincidence. Reporting the range over which the answer holds is worth more than reporting the exact number.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="sensibilidad-del-modelo">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Qué tan firme es la recomendación' : 'How firm the recommendation is') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'El modelo recomienda la flota propia para un mes de ' + intN(qBase) + ' entregas, pero ese volumen es una estimación y el costo de ' + money(vA) + ' por entrega también. Mueve cada control para meterle a cada estimación el error que consideres realista y vigila el veredicto. La pregunta no es cuánto ahorra el plan ganador, sino cuánto tiene que equivocarse el área de operaciones para que el plan ganador deje de serlo.'
          : 'The model recommends the own fleet for a month of ' + intN(qBase) + ' deliveries, but that volume is an estimate and so is the ' + money(vA) + ' cost per delivery. Move each control to load whatever error you think realistic onto each estimate and keep an eye on the verdict. The question is not how much the winning plan saves, but how far off operations has to be for the winning plan to stop winning.') + '</div>' +
        '<div class="iw-expr" id="w4eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'flota propia' : 'own fleet') + '</span><span><i class="lg-out"></i>' + (es ? 'subcontratar' : 'outsourcing') + '</span></div>' +
        '<div class="plane" id="w4svg"></div>' +
        '<div class="verdict" id="w4verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Error en el costo por entrega' : 'Error in the cost per delivery') + ': <span class="cval" id="w4evl"></span></label>' +
          '<input type="range" min="-30" max="30" step="5" id="w4ev" value="0">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Error en el volumen esperado' : 'Error in the expected volume') + ': <span class="cval" id="w4eql"></span></label>' +
          '<input type="range" min="-30" max="30" step="5" id="w4eq2" value="0">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Costo por entrega corregido' : 'Corrected cost per delivery') + '</div><div class="mnum cs" id="w4v"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Volumen corregido' : 'Corrected volume') + '</div><div class="mnum ps" id="w4q"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ventaja de la flota' : 'Advantage of the fleet') + '</div><div class="mnum ts" id="w4adv"></div></div>' +
        '</div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Punto de cambio corregido' : 'Corrected switching point') + '</div><div class="mnum cs" id="w4tie"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w4read"></div>' +
      '</div>';
    var es1 = host.querySelector('#w4ev'), es2 = host.querySelector('#w4eq2');
    es1.addEventListener('input', function() { state.ev = parseInt(es1.value, 10); render(); });
    es2.addEventListener('input', function() { state.eq = parseInt(es2.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   BUILD LESSON · concepto, herramienta, reactivos, y otra vez
   Todos los numeros salen del rng sembrado, de modo que dos alumnos nunca
   comparten una sola cifra y un mismo alumno nunca repite un intento.
   La guia entera sigue a un negocio: Rutas del Puerto, una empresa de
   entregas de ultima milla en Manzanillo que reparte los pedidos de las
   tiendas en linea de Colima.
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];
  document.getElementById('lessonBody').innerHTML = '';

  /* ── Concepto 1 · del enunciado al modelo ── */
  var c1a  = pick([30, 40, 50], rng);
  var c1q  = pick([1200, 1500, 1800], rng);
  var c1v  = pick([18, 22, 26], rng);
  var c1F  = c1a * c1q;
  var c1C  = c1F + c1v * c1q;
  var c1avg = c1a + c1v;
  var c1q2 = 2 * c1q;
  var c1C2 = c1F + c1v * c1q2;
  var c1avg2 = c1a / 2 + c1v;

  var w1F  = pick([30000, 36000, 42000], rng);
  var w1v  = pick([18, 22, 26], rng);
  var w1vs = pick([30, 32, 34], rng);

  /* ── Reactivo 1 · el costo del mes que viene ── */
  var p1v  = pick([18, 22, 26], rng);
  var p1F  = pick([42000, 48000, 54000], rng);
  var p1q1 = pick([1200, 1400], rng);
  var p1s  = pick([300, 400, 500], rng);
  var p1q2 = p1q1 + p1s;
  var p1q3 = p1q1 + 3 * p1s;
  var p1C1 = p1F + p1v * p1q1;
  var p1C2 = p1F + p1v * p1q2;
  var p1ok = p1F + p1v * p1q3;
  var p1d1 = Math.round(p1C1 * p1q3 / p1q1);
  var p1d2 = p1v * p1q3;
  var p1d3 = p1F + p1v * (p1q1 + 2 * p1s);

  /* ── Reactivo 2 · el modelo que no cierra en unidades ── */
  var p2F = pick([36000, 42000, 48000], rng);
  var p2v = pick([19, 23, 27], rng);
  var p2q = pick([1500, 1700, 1900], rng);
  var p2bad = p2F + p2v;
  var p2ok  = p2F + p2v * p2q;

  /* ── Concepto 2 · la familia del modelo ── */
  var c2L0 = pick([52000, 58000, 64000], rng);
  var c2d  = pick([3000, 4000, 5000], rng);
  var c2E  = pick([[1280, 25], [800, 50], [960, 50]], rng);
  var c2e0 = c2E[0], c2ep = c2E[1], c2r = 1 + c2ep / 100;
  var c2e1 = c2e0 * c2r, c2e2 = c2e1 * c2r, c2e3 = c2e2 * c2r;
  var c2k  = pick([6000, 8000, 10000], rng);
  var c2Rm = pick([180000, 200000, 220000], rng);
  var c2L  = [c2L0, c2L0 + c2d, c2L0 + 2 * c2d, c2L0 + 3 * c2d];
  var c2R  = [c2Rm - 9 * c2k, c2Rm - 4 * c2k, c2Rm - c2k, c2Rm];

  var w2L0 = pick([48000, 54000, 60000], rng);
  var w2d  = pick([3000, 4000, 5000], rng);
  var w2E  = pick([[1024, 25], [2048, 25], [800, 50], [960, 50]], rng);
  var w2k  = pick([6000, 8000, 10000], rng);
  var w2Rm = pick([180000, 200000, 220000], rng);
  var w2r  = 1 + w2E[1] / 100;
  var w2serL = [0, 1, 2, 3, 4, 5].map(function(i) { return w2L0 + w2d * i; });
  var w2serE = [0, 1, 2, 3, 4, 5].map(function(i) { return Math.round(w2E[0] * Math.pow(w2r, i)); });
  var w2serQ = [0, 1, 2, 3, 4, 5].map(function(i) { return w2Rm - w2k * (i - 3) * (i - 3); });

  /* ── Reactivo 3 · el quinto mes de paquetes ── */
  var p3S = pick([[1280, 25], [2560, 25], [800, 50], [960, 50]], rng);
  var p3e0 = p3S[0], p3p = p3S[1], p3r = 1 + p3p / 100;
  var p3e1 = p3e0 * p3r, p3e2 = p3e1 * p3r, p3e3 = p3e2 * p3r;
  var p3ok = p3e3 * p3r;
  var p3d1 = 2 * p3e3 - p3e2;
  var p3d2 = p3e3 + (p3e1 - p3e0);
  var p3d3 = 2 * p3e3;

  /* ── Reactivo 4 · cual situacion pide una exponencial ── */
  var p4pct  = pick([6, 8, 10], rng);
  var p4step = pick([3000, 4000, 5000], rng);
  var p4rent = pick([18000, 20000, 22000], rng);

  /* ═══════════════════════ CONCEPTO 1 ═══════════════════════ */
  addSection(function(L) {
    if (L === 'es') return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>Del enunciado al modelo: variables, unidades y estructura</h2>' +
      '<p>Rutas del Puerto es una empresa de entregas de última milla en Manzanillo: recoge en su bodega los pedidos de las tiendas en línea de Colima y los lleva hasta la puerta del cliente. Cada mes su dirección enfrenta decisiones que no se parecen entre sí, comprar otra camioneta, subir la tarifa, aceptar un contrato grande, y todas tienen algo en común: alguien tiene que traducir la situación a números antes de poder discutirla.</p>' +
      '<p><strong>Modelar</strong> es exactamente esa traducción. Un modelo matemático no es una fórmula que se busca en un formulario, es una frase sobre el negocio escrita con símbolos. La traducción se hace en cuatro pasos que conviene no saltarse: se nombra la <strong>variable de decisión</strong>, aquello que la empresa sí puede mover; se anotan sus <strong>unidades</strong>; se escribe la relación entre las cantidades involucradas; y al final se traduce el resultado de vuelta al idioma del negocio, porque un número sin interpretación no sirve para decidir nada.</p>' +
      '<p>La estructura que aparece con más frecuencia en costos es la separación entre lo que se paga pase lo que pase y lo que se paga por cada unidad de actividad. La renta de la bodega, los sueldos base y el seguro de las camionetas no dependen de cuántos paquetes salgan: son <strong>costo fijo</strong>. La gasolina, el empaque y el bono del repartidor sí dependen: son <strong>costo variable</strong>, y se miden en pesos por entrega. Escribir el costo total como el fijo más el variable multiplicado por el número de entregas es el modelo lineal que sostiene casi toda la contabilidad de operaciones.</p>' +
      '<p>Las unidades son la herramienta de control más barata que existe y casi nadie la usa. Cada término de un modelo debe medir lo mismo que los demás, o la suma no significa nada. Sumar pesos por mes con pesos por entrega es un error que se detecta sin hacer una sola cuenta, con solo leer las etiquetas, y es el error que más veces aparece en un modelo mal armado.</p>' +
      '<p>Hay una consecuencia de esta estructura que confunde incluso a quien lleva años en el puesto. El costo por entrega que reporta la contabilidad, el que sale de dividir el costo total del mes entre las entregas del mes, <strong>no es constante</strong>: baja conforme crece el volumen, porque el costo fijo se reparte entre más envíos. Ese costo promedio sirve para explicar un mes que ya ocurrió, pero no para pronosticar otro. Para decidir si conviene aceptar un pedido más, la cifra que importa es el costo variable, que es lo que realmente agrega una entrega adicional.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Modelo lineal de costo</div><div class="rform">C = F + v · q</div><div class="rnote">Fijo más variable por unidad.</div></div>' +
        '<div class="rcard"><div class="rname">Variable de decisión</div><div class="rform">q = entregas</div><div class="rnote">Lo que la empresa sí controla.</div></div>' +
        '<div class="rcard"><div class="rname">Unidades</div><div class="rform">$ por entrega</div><div class="rnote">Todo término mide lo mismo.</div></div>' +
        '<div class="rcard"><div class="rname">Costo promedio</div><div class="rform">' + frac('C', 'q') + '</div><div class="rnote">Baja al crecer el volumen.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> En un mes con ' + intN(c1q) + ' entregas, Rutas del Puerto gastó ' + money(c1C) + '. De esa cantidad, ' + money(c1F) + ' correspondieron a renta, sueldos base y seguros, y el resto se movió con el número de paquetes. La dirección quiere saber cuánto costaría un mes con el doble de entregas.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se nombra la variable: q son las entregas del mes. El costo fijo es ' + money(c1F) + ' al mes.<br>' +
      '<strong>Paso 2.</strong> Lo que no es fijo se reparte entre las ' + intN(c1q) + ' entregas y da ' + money(c1v) + ' por entrega. Las unidades cierran: pesos entre entregas son pesos por entrega.<br>' +
      '<strong>Paso 3.</strong> Con el modelo armado, un mes de ' + intN(c1q2) + ' entregas costaría ' + money(c1C2) + '.<br>' +
      '<strong>Paso 4.</strong> Se traduce de vuelta. El costo promedio del mes observado fue ' + money(c1avg) + ' por entrega; en el mes del doble de volumen baja a ' + money(c1avg2) + ', porque los ' + money(c1F) + ' fijos se reparten entre el doble de paquetes.<br>' +
      '<strong>Lectura.</strong> El costo total no se duplicó al duplicarse el volumen, y el costo por entrega tampoco se mantuvo. Quien pronostique multiplicando ' + money(c1avg) + ' por las entregas esperadas se equivocará siempre, y en la dirección equivocada.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>From the statement to the model: variables, units and structure</h2>' +
      '<p>Rutas del Puerto is a last-mile delivery company in Manzanillo: it collects the orders of Colima’s online shops at its warehouse and carries them to the customer’s door. Every month its management faces decisions that look nothing alike, buying another van, raising the tariff, taking on a large contract, and they all share one thing: somebody has to translate the situation into numbers before it can be discussed at all.</p>' +
      '<p><strong>Modeling</strong> is precisely that translation. A mathematical model is not a formula looked up in a table, it is a sentence about the business written with symbols. The translation runs in four steps that are best not skipped: name the <strong>decision variable</strong>, the thing the firm can actually move; write down its <strong>units</strong>; state the relation between the quantities involved; and at the end translate the result back into the language of the business, because a number with no interpretation decides nothing.</p>' +
      '<p>The structure that turns up most often in costs is the split between what gets paid come what may and what gets paid for each unit of activity. Warehouse rent, base wages and van insurance do not depend on how many parcels go out: they are <strong>fixed cost</strong>. Fuel, packaging and the driver bonus do depend: they are <strong>variable cost</strong>, measured in pesos per delivery. Writing the total cost as the fixed part plus the variable part times the number of deliveries is the linear model that holds up nearly all of operations accounting.</p>' +
      '<p>Units are the cheapest control tool there is and almost nobody uses it. Every term of a model has to measure the same thing as the others, or the sum means nothing. Adding pesos per month to pesos per delivery is a mistake you can catch without doing a single calculation, just by reading the labels, and it is the mistake that shows up most often in a badly built model.</p>' +
      '<p>This structure has a consequence that trips up even people who have held the job for years. The cost per delivery that accounting reports, the one from dividing the month’s total cost by the month’s deliveries, is <strong>not constant</strong>: it falls as volume grows, because the fixed cost is spread over more shipments. That average cost explains a month that has already happened, but it cannot forecast another. To decide whether taking one more order pays, the figure that matters is the variable cost, which is what an extra delivery really adds.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Linear cost model</div><div class="rform">C = F + v · q</div><div class="rnote">Fixed plus variable per unit.</div></div>' +
        '<div class="rcard"><div class="rname">Decision variable</div><div class="rform">q = deliveries</div><div class="rnote">What the firm actually controls.</div></div>' +
        '<div class="rcard"><div class="rname">Units</div><div class="rform">$ per delivery</div><div class="rnote">Every term measures the same.</div></div>' +
        '<div class="rcard"><div class="rname">Average cost</div><div class="rform">' + frac('C', 'q') + '</div><div class="rnote">It falls as volume grows.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> In a month with ' + intN(c1q) + ' deliveries, Rutas del Puerto spent ' + money(c1C) + '. Of that amount, ' + money(c1F) + ' went to rent, base wages and insurance, and the rest moved with the number of parcels. Management wants to know what a month with twice the deliveries would cost.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Name the variable: q is the deliveries in the month. The fixed cost is ' + money(c1F) + ' a month.<br>' +
      '<strong>Step 2.</strong> What is not fixed is spread over the ' + intN(c1q) + ' deliveries and comes to ' + money(c1v) + ' per delivery. The units close: pesos divided by deliveries are pesos per delivery.<br>' +
      '<strong>Step 3.</strong> With the model built, a month of ' + intN(c1q2) + ' deliveries would cost ' + money(c1C2) + '.<br>' +
      '<strong>Step 4.</strong> Translate it back. The average cost of the observed month was ' + money(c1avg) + ' per delivery; in the month with twice the volume it falls to ' + money(c1avg2) + ', because the ' + money(c1F) + ' of fixed cost is spread over twice the parcels.<br>' +
      '<strong>Reading.</strong> Total cost did not double when volume doubled, and the cost per delivery did not hold either. Anyone forecasting by multiplying ' + money(c1avg) + ' by the expected deliveries will be wrong every time, and wrong in the same direction.</p></div>';
  });

  widgetAjuste(w1F, w1v, w1vs);

  /* ── Reactivo 1 · el costo del mes que viene ── */
  var o1es = [money(p1ok), money(p1d1), money(p1d2), money(p1d3)];
  var o1en = [money(p1ok), money(p1d1), money(p1d2), money(p1d3)];
  var o1 = shuffleOpts(o1es, o1en, rng);
  addItem({
    title: { es: 'El costo del mes que viene', en: 'The cost of next month' },
    q: { es: 'Rutas del Puerto cerró marzo con ' + intN(p1q1) + ' entregas y un costo total de ' + money(p1C1) + ', y abril con ' + intN(p1q2) + ' entregas y un costo total de ' + money(p1C2) + '. La estructura de costos no cambió entre los dos meses. Para mayo la coordinación de operaciones proyecta ' + intN(p1q3) + ' entregas. ¿Cuál sería el costo total de mayo?',
        en: 'Rutas del Puerto closed March with ' + intN(p1q1) + ' deliveries and a total cost of ' + money(p1C1) + ', and April with ' + intN(p1q2) + ' deliveries and a total cost of ' + money(p1C2) + '. The cost structure did not change between the two months. For May the operations desk projects ' + intN(p1q3) + ' deliveries. What would May’s total cost be?' },
    hint: { es: 'Los dos meses se diferencian en las entregas y en el costo. Esa doble diferencia te dice cuánto agrega una entrega. Una vez que tengas esa cifra, regresa a cualquiera de los dos meses para averiguar cuánto se paga aunque no salga ningún paquete.',
            en: 'The two months differ in deliveries and in cost. That pair of differences tells you how much one delivery adds. Once you have that figure, go back to either month to find out how much is paid even when no parcel goes out.' },
    opts: { es: o1.es, en: o1.en },
    exp: { es: 'La diferencia entre los dos meses es de ' + intN(p1s) + ' entregas y ' + money(p1v * p1s) + ' de costo, así que cada entrega agrega ' + money(p1v) + '. Con eso, la parte que se paga sin importar el volumen resulta ' + money(p1F) + ' al mes, y mayo cierra en ' + money(p1ok) + '. La cifra de ' + money(p1d1) + ' sale de escalar el costo de marzo en la misma proporción que las entregas, es decir de suponer que el gasto es proporcional al volumen, y por eso arrastra el costo fijo tantas veces como creció el mes. La de ' + money(p1d2) + ' cobra ' + money(p1v) + ' por cada entrega de mayo pero olvida los ' + money(p1F) + ' que se pagan aunque la bodega esté vacía. Y la de ' + money(p1d3) + ' repite el salto de marzo a abril una vez más, como si mayo estuviera a ' + intN(p1s) + ' entregas de abril y no a ' + intN(2 * p1s) + '.',
           en: 'The two months differ by ' + intN(p1s) + ' deliveries and ' + money(p1v * p1s) + ' of cost, so each delivery adds ' + money(p1v) + '. From there, the part paid regardless of volume works out to ' + money(p1F) + ' a month, and May closes at ' + money(p1ok) + '. The figure of ' + money(p1d1) + ' comes from scaling March’s cost in the same proportion as the deliveries, that is, from assuming spending is proportional to volume, which drags the fixed cost along as many times as the month grew. The figure of ' + money(p1d2) + ' charges ' + money(p1v) + ' for every May delivery but forgets the ' + money(p1F) + ' paid even with an empty warehouse. And ' + money(p1d3) + ' repeats the March-to-April jump once more, as if May were ' + intN(p1s) + ' deliveries past April rather than ' + intN(2 * p1s) + '.' }
  }, o1.correctIdx, true);

      '<h2>Elegir la familia: lineal, exponencial o cuadrática</h2>' +
      '<p>Armar un modelo tiene dos momentos y solo uno de ellos se parece al álgebra de la escuela. El segundo es ajustar los números; el primero, mucho más importante, es decidir <strong>qué tipo de relación</strong> hay entre las cantidades. Equivocarse en una cuenta produce un resultado con un error; equivocarse de familia produce un resultado que se ve razonable en el rango donde se ajustó y se desbarranca justo donde se le pide trabajar.</p>' +
      '<p>Tres familias cubren la mayor parte de las situaciones de un negocio, y cada una deja una firma reconocible en los datos. Si la cantidad cambia en la <strong>misma cantidad absoluta</strong> en cada periodo, la relación es <strong>lineal</strong>: las diferencias entre valores consecutivos se repiten. Si cambia en el <strong>mismo porcentaje</strong>, la relación es <strong>exponencial</strong>: lo que se repite ya no son las diferencias sino las razones entre un valor y el anterior. Y si la cantidad es el producto de dos magnitudes que se mueven en sentidos opuestos, como una tarifa y el volumen que esa tarifa permite colocar, la relación es <strong>cuadrática</strong>: sube, alcanza un techo y baja.</p>' +
      '<p>La distinción entre lineal y exponencial es la que más dinero cuesta en la práctica. Un crecimiento de una cantidad fija por mes y un crecimiento de un porcentaje fijo por mes se parecen mucho durante los primeros periodos y se separan sin remedio después. Una empresa que trata como lineal un crecimiento que en realidad es porcentual subestima su demanda futura y se queda corta de bodega, de camionetas y de personal, todo al mismo tiempo y sin aviso.</p>' +
      '<p>La firma se lee antes de calcular nada. Se acomodan los valores observados en fila, se restan los consecutivos y se anotan las diferencias; después se dividen los consecutivos y se anotan las razones. Si las diferencias se repiten, la serie es lineal. Si las razones se repiten, es exponencial. Si las diferencias cambian de forma pareja, primero grandes y luego pequeñas o negativas, hay curvatura y la serie es cuadrática.</p>' +
      '<p>Falta una regla que evita un error frecuente cuando dos familias parecen encajar. Una cuadrática con curvatura nula es una recta escrita con un término de más, así que siempre puede imitar a una serie lineal. Cuando dos modelos explican lo mismo se elige el de menos piezas: es el principio de <strong>parsimonia</strong>. Cada parámetro adicional es un número que hay que estimar y que se puede estimar mal, y un modelo con parámetros de sobra se ajusta muy bien al pasado y suele pronosticar peor el futuro.</p>' +

      '<div class="stag">Concept 2</div>' +
      '<h2>Choosing the family: linear, exponential or quadratic</h2>' +
      '<p>Building a model has two moments and only one of them resembles school algebra. The second is fitting the numbers; the first, far more important, is deciding <strong>what kind of relation</strong> holds between the quantities. Getting a calculation wrong produces a result with an error in it; getting the family wrong produces a result that looks reasonable over the range where it was fitted and falls apart exactly where it is asked to work.</p>' +
      '<p>Three families cover most business situations, and each leaves a recognisable signature in the data. If the quantity changes by the <strong>same absolute amount</strong> each period, the relation is <strong>linear</strong>: the differences between consecutive values repeat. If it changes by the <strong>same percentage</strong>, the relation is <strong>exponential</strong>: what repeats is no longer the differences but the ratios of each value to the previous one. And if the quantity is the product of two magnitudes moving in opposite directions, such as a tariff and the volume that tariff allows you to place, the relation is <strong>quadratic</strong>: it climbs, reaches a ceiling and falls.</p>' +
      '<p>The distinction between linear and exponential is the one that costs the most money in practice. Growth of a fixed amount per month and growth of a fixed percentage per month look very much alike over the first few periods and then separate beyond repair. A company that treats percentage growth as linear underestimates its future demand and runs short of warehouse, vans and staff, all at once and with no warning.</p>' +
      '<p>The signature can be read before anything is calculated. Lay the observed values in a row, subtract consecutive ones and note the differences; then divide consecutive ones and note the ratios. If the differences repeat, the series is linear. If the ratios repeat, it is exponential. If the differences change evenly, large first and small or negative later, there is curvature and the series is quadratic.</p>' +

  addSection(function(L) {

      '<p>Con el modelo armado y la familia bien elegida, resolver suele ser la parte corta del trabajo. Lo que sigue es donde se separan los alumnos que despejan de los analistas que deciden: hay que <strong>validar</strong> el resultado antes de entregarlo. Un número que sale de un despeje correcto puede seguir siendo inservible si cae fuera del terreno donde el modelo tiene sentido.</p>' +
      '<p>La primera revisión es el <strong>dominio</strong>. Las variables de un negocio no admiten cualquier valor: no existen entregas negativas, ni medio repartidor, ni una tarifa que supere lo que el cliente está dispuesto a pagar. Cuando el álgebra entrega una raíz negativa o una fracción de camioneta, esa solución no se descarta por capricho, se descarta porque el enunciado nunca la permitió.</p>' +
      '<p>La segunda revisión es el <strong>redondeo con dirección</strong>, y merece más cuidado del que suele recibir. Redondear al entero más cercano es la costumbre de la aritmética, pero en un problema de negocio la dirección la fija la pregunta. Si se busca el volumen mínimo que cubre un costo, se redondea hacia arriba, porque el entero de abajo todavía deja pérdida. Si se busca cuántas unidades caben en un presupuesto, se redondea hacia abajo, porque una más ya no se puede pagar. La misma cifra de 4.3 se convierte en 5 o en 4 según lo que se haya preguntado.</p>' +

      '<div class="stag">Concept 3</div>' +
      '<h2>Solving and validating: domain, units and rounding</h2>' +
      '<p>With the model built and the family well chosen, solving is usually the short part of the job. What comes next is where students who clear an unknown part ways with analysts who decide: the result has to be <strong>validated</strong> before it is handed over. A number produced by a correct piece of algebra can still be useless if it falls outside the ground on which the model makes sense.</p>' +
      '<p>The first review is the <strong>domain</strong>. Business variables do not take just any value: there is no such thing as a negative delivery, half a driver, or a tariff above what the customer will pay. When the algebra returns a negative root or a fraction of a van, that solution is not discarded on a whim, it is discarded because the situation never allowed it.</p>' +
      '<p>The second review is <strong>rounding with a direction</strong>, and it deserves more care than it usually gets. Rounding to the nearest whole number is an arithmetic habit, but in a business problem the direction is set by the question. If you are after the smallest volume that covers a cost, you round up, because the whole number below still leaves a loss. If you are after how many units fit inside a budget, you round down, because one more can no longer be paid for. The same 4.3 becomes 5 or 4 depending on what was asked.</p>' +
      '<p>The third review is <strong>order of magnitude</strong>. Before handing a result over it pays to compare it with something known about the business: last month’s volume, installed capacity, the size of the market. A model recommending a volume eight times the historical one is not uncovering an opportunity, it is warning that a figure was keyed in wrongly or a unit was confused.</p>' +

  addSection(function(L) {

      '<div class="stag">Concepto 4</div>' +
      '<h2>Los límites del modelo: supuestos, rango de validez y sensibilidad</h2>' +
      '<p>Todo modelo es una simplificación deliberada, y esa es su virtud, no su defecto. El modelo de costo de Rutas del Puerto supone que el costo por entrega no cambia con el volumen, que no hay horas extra, que la bodega tiene lugar de sobra y que la demanda responde a la tarifa de la misma manera todo el año. Ninguna de esas cuatro cosas es enteramente cierta. El modelo sirve de todas formas, siempre que quien lo use sepa cuáles supuestos aceptó al construirlo.</p>' +
      '<p>De ahí sale el <strong>rango de validez</strong>. Un modelo se ajusta con datos de un cierto tramo y solo es confiable dentro de ese tramo y un poco más allá. Proyectar tres años hacia adelante con una recta ajustada a cuatro meses no es un cálculo audaz, es un cálculo sin respaldo: nada en esos cuatro meses dice que la tendencia se sostenga cuando el mercado se sature, entre un competidor o cambie la temporada. La extrapolación lejana es el error de modelación que más veces llega a una junta convertido en gráfica.</p>' +
      '<p>La segunda revisión es la <strong>sensibilidad</strong>. Los parámetros de un modelo son estimaciones, no medidas exactas, y la pregunta correcta no es cuál es el resultado sino qué tanto se mueve el resultado cuando los parámetros se mueven. Un resultado que sobrevive a errores razonables en los datos de entrada es una decisión; uno que se voltea con un error del tamaño del que cualquiera comete al estimar es apenas una coincidencia aritmética.</p>' +
      '<p>La sensibilidad no se reparte por igual entre los parámetros. En una comparación de planes de transporte, el punto de cambio depende del costo fijo y del ahorro por entrega, pero no de la misma manera: el costo fijo entra dividido por el ahorro, así que un error pequeño en el ahorro, que es la diferencia entre dos tarifas y por lo tanto la cifra peor conocida de las dos, mueve el punto de cambio mucho más que un error del mismo tamaño en el costo fijo, que suele estar escrito en un contrato.</p>' +
      '<p>Por eso un buen reporte de modelación no entrega un número solo. Entrega el número, los supuestos bajo los que se obtuvo, el rango en el que la recomendación se mantiene y el parámetro que habría que medir mejor si se quiere reducir el riesgo. Ese último dato, cuál medir mejor, suele ser el más valioso de todos, porque le dice a la empresa dónde vale la pena gastar en información.</p>' +

      '<p><strong>Ejemplo resuelto.</strong> El punto de cambio entre flota propia y subcontratación de Rutas del Puerto se calculó con un costo fijo de ' + money(c4F) + ' al mes y un ahorro estimado de ' + money(c4g) + ' por entrega, y quedó en ' + intN(c4q1) + ' entregas mensuales. Operaciones advierte que ese ahorro pudo haberse sobreestimado hasta en ' + intN(c4e) + '%.</p>' +

      '<h2>The limits of the model: assumptions, range of validity and sensitivity</h2>' +
      '<p>Every model is a deliberate simplification, and that is its virtue, not its flaw. The Rutas del Puerto cost model assumes the cost per delivery does not change with volume, that there is no overtime, that the warehouse has room to spare and that demand responds to the tariff the same way all year. Not one of those four things is entirely true. The model works anyway, provided whoever uses it knows which assumptions were accepted when it was built.</p>' +
      '<p>Out of that comes the <strong>range of validity</strong>. A model is fitted with data from a certain stretch and is only reliable within that stretch and a little beyond. Projecting three years ahead with a line fitted to four months is not a bold calculation, it is an unsupported one: nothing in those four months says the trend holds when the market saturates, a competitor arrives or the season turns. Distant extrapolation is the modeling error that most often reaches a meeting dressed up as a chart.</p>' +
      '<p>The second review is <strong>sensitivity</strong>. The parameters of a model are estimates, not exact measurements, and the right question is not what the result is but how far the result moves when the parameters move. A result that survives reasonable errors in the input data is a decision; one that flips on an error the size anybody makes while estimating is barely an arithmetic coincidence.</p>' +

      '<p>That is why a good modeling report never hands over a bare number. It hands over the number, the assumptions under which it was obtained, the range over which the recommendation holds, and the parameter worth measuring better if the risk is to come down. That last item, which one to measure better, is often the most valuable of all, because it tells the firm where spending on information pays.</p>' +
