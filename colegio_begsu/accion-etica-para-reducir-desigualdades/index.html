<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acción Ética para Reducir Desigualdades</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ══ MANIPULATIVES (shared shell) ══ */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1.15rem 0; }
.wgt-h { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.2rem; }
.wgt-q { font-size:.82rem; color:var(--text3); margin-bottom:.85rem; }
.wcase { background:var(--surface2); border-radius:8px; padding:.75rem .9rem; font-size:.86rem; color:var(--text); margin-bottom:.6rem; border-left:3px solid var(--green); }
.wsub { font-size:.73rem; color:var(--text3); margin:.65rem 0 .3rem; text-transform:uppercase; letter-spacing:.07em; }
.wmsg { margin-top:.75rem; padding:.62rem .85rem; border-radius:0 8px 8px 0; border-left:3px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.83rem; }
.wmsg.ok   { background:var(--ok-bg);   color:var(--ok);    border-left-color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.wmsg.bad  { background:var(--bad-bg);  color:var(--bad);   border-left-color:var(--bad); }
.wbtn { margin-top:.75rem; margin-right:.4rem; background:var(--green); color:#fff; border:none; border-radius:8px; padding:.55rem 1.1rem; font-size:.83rem; font-weight:600; cursor:pointer; min-height:44px; }
.wbtn:hover { background:var(--green-dark); }
.wbtn.alt { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.55rem; }

/* ══ W1 · TABLERO DE VIDA DIGNA ══ */
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.5rem; margin-top:.35rem; }
@media(max-width:500px){ .tiles { grid-template-columns:1fr 1fr; } }
.tile { border:1.5px solid var(--border); border-radius:10px; padding:.55rem .6rem; background:var(--surface2); color:var(--text2); cursor:pointer; min-height:52px; display:flex; align-items:center; gap:.4rem; font-size:.79rem; transition:all .15s; }
.tile:hover { border-color:var(--green); }
.tile.sel  { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.tile.good { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.tile.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.tico { font-size:1rem; flex-shrink:0; }

/* ══ W2 · CADENA DE CAUSAS ══ */
.chain { border-left:3px solid var(--border); margin:.55rem 0 .2rem .5rem; padding-left:.9rem; min-height:2.2rem; }
.clink { display:flex; align-items:center; gap:.5rem; margin-bottom:.42rem; font-size:.8rem; color:var(--text2); }
.cbadge { background:var(--green); color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700; flex-shrink:0; }
.cbadge.warn { background:var(--gold); }
.step { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .75rem; font-size:.81rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; min-height:44px; display:flex; align-items:center; transition:all .15s; }
.step:hover { border-color:var(--green); }
.step.used { opacity:.42; pointer-events:none; border-style:dashed; }

/* ══ W3 · REPARTIDOR DE APOYOS ══ */
.alrow { border:1px solid var(--border); border-radius:10px; padding:.6rem .7rem; margin-bottom:.5rem; background:var(--surface2); }
.alhead { display:flex; justify-content:space-between; align-items:center; gap:.5rem; font-size:.82rem; color:var(--text2); margin-bottom:.3rem; }
.alname { font-weight:600; color:var(--text); }
.alnote { font-size:.73rem; color:var(--text3); margin-bottom:.4rem; }
.altrack { height:14px; border:1px solid var(--border); border-radius:7px; background:var(--surface); overflow:hidden; margin-bottom:.35rem; }
.alfill { height:100%; width:0%; background:var(--gold); transition:width .3s; }
.alfill.ok { background:var(--ok); }
.alctl { display:flex; align-items:center; gap:.45rem; }
.albtn { border:1.5px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text2); font-size:.95rem; font-weight:700; cursor:pointer; min-width:44px; min-height:44px; }
.albtn:hover { border-color:var(--green); color:var(--green); }
.alcount { font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--text2); }
.alstate { font-size:.73rem; font-weight:600; }
.alstate.ok  { color:var(--ok); }
.alstate.low { color:var(--bad); }

/* ══ W4 · TERMÓMETRO DE LA SOLIDARIDAD ══ */
.crit { margin-bottom:.7rem; }
.critq { font-size:.8rem; color:var(--text2); margin-bottom:.3rem; font-weight:600; }
.tri { display:flex; gap:.45rem; flex-wrap:wrap; }
.tribtn { flex:1 1 30%; border:1.5px solid var(--border); border-radius:9px; padding:.5rem .6rem; font-size:.76rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; transition:all .15s; }
.tribtn:hover { border-color:var(--green); }
.tribtn.sel { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.mtr { margin-top:.6rem; }
.mtrlbl { display:flex; justify-content:space-between; font-size:.74rem; color:var(--text3); margin-bottom:.22rem; }
.mtrtrack { height:14px; border:1px solid var(--border); border-radius:7px; background:var(--surface2); overflow:hidden; }
.mtrfill { height:100%; width:0%; background:var(--bad); transition:width .34s; }
.mtrfill.mid { background:var(--gold); }
.mtrfill.ok  { background:var(--ok); }

/* ══ W5 · FILTRO DE ALERTAS ══ */
.chips { display:flex; flex-direction:column; gap:.45rem; margin:.55rem 0; }
.chip { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .8rem; font-size:.8rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; display:flex; align-items:center; transition:all .15s; }
.chip:hover { border-color:var(--green); }
.chip.sel  { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.chip.good { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.chip.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
</style>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Acción Ética para Reducir Desigualdades</div>

  </div>

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');
  document.documentElement.setAttribute('lang', l);
  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });
    if (answeredCount === problems.length && problems.length > 0) {
      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);
    }
  }
}
/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce3_t04_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce3_t04_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };

  document.getElementById('lessonScreen').style.display  = 'block';

  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');

    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');

    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');

    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'fce3_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function S(es, en){ return LANG === 'es' ? es : en; }

function addSection(tag, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     false,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ================================================
   WIDGET 1 · TABLERO DE VIDA DIGNA
   The student taps the conditions that a described community lacks. Every tap
   redraws the board and updates the running count in real time. A check answers
   with how many of the missing conditions were found and how many marked tiles
   the community actually has, so the feedback points toward the gap instead of
   giving a verdict. Three communities per run (Rule 8, pattern B).
   ================================================ */
var CV = null;
var CVT = [
  { es:'Agua potable en la vivienda',        en:'Drinking water at home',            ico:'W' },
  { es:'Centro de salud cercano',            en:'Nearby health center',              ico:'S' },
  { es:'Secundaria en la localidad',         en:'Secondary school in town',          ico:'E' },
  { es:'Vivienda con techo y piso firmes',   en:'Home with solid roof and floor',    ico:'V' },
  { es:'Transporte suficiente',              en:'Sufficient transport',              ico:'T' },
  { es:'Conexión a internet',                en:'Internet connection',               ico:'I' },
  { es:'Alimentación suficiente y variada',  en:'Sufficient and varied food',        ico:'A' },
  { es:'Espacios públicos seguros',          en:'Safe public spaces',                ico:'P' }
];
function buildTablero(rng){
  var cases = [
    { es:'En una comunidad de la sierra hay escuela primaria y secundaria, transporte todos los días y viviendas con techo y piso firmes. El agua se acarrea de un pozo comunitario, el centro de salud más cercano está a tres horas de camino y no hay señal para conectarse.',
      en:'In a community in the mountains there is a primary school, a secondary school, transport every day and homes with solid roofs and floors. Water is carried from a shared well, the closest health center is three hours away and there is no signal to connect.',
      miss:[0,1,5] },
    { es:'En una colonia de la periferia de la ciudad hay agua entubada, centro de salud, secundaria, internet y alimentación suficiente. El transporte llega dos veces al día, muchas viviendas tienen techo de lámina sin fijar y los parques quedan sin alumbrado.',
      en:'In a neighborhood on the edge of the city there is piped water, a health center, a secondary school, internet and sufficient food. Transport arrives twice a day, many homes have loose sheet metal roofs and the parks have no lighting.',
      miss:[3,4,7] },
    { es:'En una localidad de familias jornaleras hay agua entubada, transporte, viviendas firmes, internet y parques iluminados. No existe secundaria, el centro de salud abre un día por semana y la comida del día depende de lo que alcance el jornal.',
      en:'In a town of farm worker families there is piped water, transport, solid homes, internet and lit parks. There is no secondary school, the health center opens one day a week and the food of the day depends on what the daily wage covers.',
      miss:[1,2,6] },
    { es:'En un barrio con internet, transporte, secundaria y parques iluminados, el agua llega dos veces por semana, muchas familias completan una sola comida al día y las viviendas se levantaron sin piso firme.',
      en:'In a district with internet, transport, a secondary school and lit parks, water arrives twice a week, many families complete only one meal a day and the homes were built without a solid floor.',
      miss:[0,3,6] }
  ];
  CV = { pool:shuffle(cases, rng).slice(0,3), r:0, sel:[], tries:0, done:false, cls:'',
         msg:{ es:'Marca las condiciones que esta comunidad no tiene. Puedes cambiar tu selección antes de revisar.',
               en:'Mark the conditions this community does not have. You can change your selection before checking.' } };
  return '<div class="wgt" id="cvw">' +
    '<div class="wgt-h">' + S('Tablero de vida digna','Board of a decent life') + '</div>' +
    '<div class="wgt-q">' + S('La calidad de vida es un conjunto de condiciones, no un solo dato. Encuentra las que faltan.','Quality of life is a set of conditions, not a single figure. Find the ones that are missing.') + '</div>' +
    '<div class="wcase" id="cvcase"></div>' +
    '<div class="tiles" id="cvtiles"></div>' +
    '<div class="wmsg" id="cvmsg"></div>' +
    '<button class="wbtn" onclick="cvCheck()">' + S('Revisar el tablero','Check the board') + '</button>' +
    '<button class="wbtn alt" onclick="cvClear()">' + S('Limpiar','Clear') + '</button>' +
    '<div class="wprog" id="cvprog"></div>' +
  '</div>';
}
function cvRender(){
  if (!CV || !document.getElementById('cvtiles')) return;
  var c = CV.pool[CV.r];
  document.getElementById('cvcase').innerHTML = c[LANG];
  document.getElementById('cvtiles').innerHTML = CVT.map(function(tl, i){
    var cl = 'tile';
    if (CV.done) cl += (c.miss.indexOf(i) >= 0) ? ' good' : (CV.sel.indexOf(i) >= 0 ? ' miss' : '');
    else if (CV.sel.indexOf(i) >= 0) cl += ' sel';
    return '<div class="' + cl + '" onclick="cvTap(' + i + ')"><span class="tico">' + tl.ico + '</span>' + tl[LANG] + '</div>';
  }).join('');
  var m = document.getElementById('cvmsg');
  m.className = 'wmsg' + (CV.cls ? ' ' + CV.cls : '');
  m.innerHTML = CV.msg[LANG];
  document.getElementById('cvprog').textContent =
    S('Comunidad ','Community ') + (CV.r + 1) + ' / ' + CV.pool.length +
    S('  ·  condiciones marcadas: ','  ·  marked conditions: ') + CV.sel.length;
}
function cvTap(i){
  if (!CV || CV.done) return;
  var k = CV.sel.indexOf(i);
  if (k >= 0) CV.sel.splice(k, 1); else CV.sel.push(i);
  CV.cls = '';
  CV.msg = CV.sel.length
    ? { es:'Llevas ' + CV.sel.length + ' condiciones marcadas. Vuelve a leer el caso y quita o agrega las que haga falta.',
        en:'You have ' + CV.sel.length + ' conditions marked. Read the case again and remove or add whatever is needed.' }
    : { es:'El tablero está limpio. Marca lo que esta comunidad no tiene.',
        en:'The board is clean. Mark what this community does not have.' };
  cvRender();
}
function cvCheck(){
  if (!CV || CV.done) return;
  var c = CV.pool[CV.r];
  var hit = 0, extra = 0, i;
  for (i = 0; i < CV.sel.length; i++){ if (c.miss.indexOf(CV.sel[i]) >= 0) hit++; else extra++; }
  if (hit === c.miss.length && extra === 0){
    if (CV.r + 1 >= CV.pool.length){
      CV.done = true; CV.cls = 'ok';
      CV.msg = { es:'Tablero completo. Ninguna de estas comunidades es pobre por una sola razón: en cada una faltan varias condiciones al mismo tiempo, y por eso la calidad de vida se mide por el conjunto.',
                 en:'Board complete. None of these communities lacks for one single reason: in each one several conditions are missing at the same time, and that is why quality of life is measured as a whole.' };
    } else {
      CV.r++; CV.sel = []; CV.tries = 0; CV.cls = 'ok';
      CV.msg = { es:'Exacto, esas eran las condiciones ausentes. Ahora observa otra comunidad.',
                 en:'Exactly, those were the absent conditions. Now look at another community.' };
    }
  } else {
    CV.tries++;
    if (CV.tries >= 3){
      CV.done = true; CV.cls = 'warn';
      CV.msg = { es:'Estas eran las condiciones ausentes en el caso, señaladas en el tablero. Fíjate en que ninguna comunidad falla en una sola cosa.',
                 en:'These were the absent conditions in the case, marked on the board. Notice that no community fails in only one thing.' };
    } else {
      CV.cls = 'bad';
      CV.msg = { es:'Encontraste ' + hit + ' de ' + c.miss.length + ' condiciones ausentes' + (extra ? ' y marcaste ' + extra + ' que la comunidad sí tiene.' : '. Falta alguna que el caso menciona.') + ' Ajusta tu selección y vuelve a revisar.',
                 en:'You found ' + hit + ' of ' + c.miss.length + ' absent conditions' + (extra ? ' and marked ' + extra + ' the community does have.' : '. One that the case mentions is still missing.') + ' Adjust your selection and check again.' };
    }
  }
  cvRender();
}
function cvClear(){
  if (!CV || CV.done) return;
  CV.sel = []; CV.cls = '';
  CV.msg = { es:'Tablero limpio. Empieza otra vez por lo que el caso dice que falta.',
             en:'Clean board. Start again from what the case says is missing.' };
  cvRender();
}

/* ================================================
   WIDGET 2 · CADENA QUE SE REPITE
   The student taps the links of a causal chain in order, from the first obstacle
   to the point where the same obstacle returns. A wrong tap answers with the clue
   of the link that comes first and clears the chain so the student can rebuild it.
   Third miss reveals the whole chain (Rule 8, pattern A).
   ================================================ */
var CH = null;
function buildCadena(rng){
  var sets = [
    [ { es:'La secundaria más cercana está a dos horas y el pasaje cuesta más de lo que la familia puede pagar.',
        en:'The closest secondary school is two hours away and the fare costs more than the family can pay.',
        clue:{ es:'la cadena empieza por el obstáculo material que existe antes de cualquier decisión.', en:'the chain starts with the material obstacle that exists before any decision.' } },
      { es:'Varias personas jóvenes dejan de estudiar antes de terminar la secundaria.',
        en:'Several young people stop studying before finishing secondary school.',
        clue:{ es:'sigue lo que le ocurre a las personas jóvenes cuando el traslado es imposible.', en:'next comes what happens to young people when the trip is impossible.' } },
      { es:'Los empleos a los que pueden acceder pagan menos y no ofrecen seguridad social.',
        en:'The jobs they can reach pay less and offer no social security.',
        clue:{ es:'sigue el efecto sobre el tipo de trabajo al que pueden entrar.', en:'next comes the effect on the kind of work they can enter.' } },
      { es:'Las familias no logran reunir el dinero del traslado para la siguiente generación.',
        en:'Families cannot gather the travel money for the next generation.',
        clue:{ es:'sigue lo que pasa con el ingreso familiar años después.', en:'next comes what happens to family income years later.' } },
      { es:'La siguiente generación enfrenta el mismo obstáculo y la brecha se mantiene.',
        en:'The next generation faces the same obstacle and the gap stays in place.',
        clue:{ es:'el último eslabón es el que devuelve la cadena a su punto de partida.', en:'the last link is the one that returns the chain to its starting point.' } } ],
    [ { es:'En la comunidad no hay red de agua potable y el pozo queda a una hora de camino.',
        en:'The community has no drinking water network and the well is one hour away.',
        clue:{ es:'la cadena empieza por la condición que falta en el territorio.', en:'the chain starts with the condition missing in the territory.' } },
      { es:'Las niñas y los niños dedican varias horas al día a acarrear agua.',
        en:'Girls and boys spend several hours a day carrying water.',
        clue:{ es:'sigue quién absorbe el tiempo que exige esa falta.', en:'next comes who absorbs the time that absence demands.' } },
      { es:'Faltan a clases con frecuencia y su aprovechamiento escolar baja.',
        en:'They miss class often and their school performance drops.',
        clue:{ es:'sigue el efecto de esas horas sobre la escuela.', en:'next comes the effect of those hours on school.' } },
      { es:'Menos personas concluyen la secundaria y consiguen empleos con ingresos bajos.',
        en:'Fewer people finish secondary school and get jobs with low income.',
        clue:{ es:'sigue lo que ocurre al terminar la edad escolar.', en:'next comes what happens at the end of school age.' } },
      { es:'La comunidad no reúne recursos ni interlocución para exigir la red, y el ciclo continúa.',
        en:'The community gathers neither resources nor interlocution to demand the network, and the cycle continues.',
        clue:{ es:'el último eslabón explica por qué la falta inicial sigue sin resolverse.', en:'the last link explains why the initial absence remains unsolved.' } } ],
    [ { es:'Los apoyos del programa se publican solo en español y por internet.',
        en:'The program supports are published only in Spanish and online.',
        clue:{ es:'la cadena empieza por la decisión de diseño que nadie revisó.', en:'the chain starts with the design decision nobody reviewed.' } },
      { es:'Las familias de la comunidad hablante de una lengua originaria no se enteran a tiempo.',
        en:'The families of the community that speaks an original language do not find out in time.',
        clue:{ es:'sigue quién queda fuera de la información.', en:'next comes who is left out of the information.' } },
      { es:'Los apoyos se reparten entre quienes ya tenían acceso a la información.',
        en:'The supports are distributed among those who already had access to the information.',
        clue:{ es:'sigue quién termina recibiendo el recurso.', en:'next comes who ends up receiving the resource.' } },
      { es:'La comunidad queda fuera del programa otra vez y deja de confiar en él.',
        en:'The community is left out of the program again and stops trusting it.',
        clue:{ es:'sigue el efecto sobre la relación entre la comunidad y el programa.', en:'next comes the effect on the relation between community and program.' } },
      { es:'La siguiente convocatoria recibe aún menos solicitudes de la comunidad y la exclusión se repite.',
        en:'The next call receives even fewer applications from the community and the exclusion repeats.',
        clue:{ es:'el último eslabón muestra cómo la exclusión se alimenta a sí misma.', en:'the last link shows how the exclusion feeds itself.' } } ]
  ];
  var set = sets[Math.floor(rng() * sets.length)];
  CH = { order:set, pool:shuffle(set, rng), placed:[], tries:0, done:false, cls:'',
         msg:{ es:'Empieza por el eslabón que existe antes que todos los demás.',
               en:'Start with the link that exists before all the others.' } };
  return '<div class="wgt" id="chw">' +
    '<div class="wgt-h">' + S('La cadena que se repite','The chain that repeats') + '</div>' +
    '<div class="wgt-q">' + S('Arma el orden en que un obstáculo produce el siguiente hasta volver al punto de partida.','Build the order in which one obstacle produces the next until it returns to the starting point.') + '</div>' +
    '<div class="chain" id="chrail"></div>' +
    '<div class="wsub">' + S('Eslabones por colocar','Links to place') + '</div>' +
    '<div id="chpool"></div>' +
    '<div class="wmsg" id="chmsg"></div>' +
    '<button class="wbtn alt" onclick="chReset()">' + S('Volver a empezar','Start over') + '</button>' +
    '<div class="wprog" id="chprog"></div>' +
  '</div>';
}
function chRender(){
  var rail = document.getElementById('chrail');
  if (!rail || !CH) return;
  rail.innerHTML = CH.placed.length
    ? CH.placed.map(function(e, i){
        return '<div class="clink"><div class="cbadge' + (CH.done && i === CH.placed.length - 1 ? ' warn' : '') + '">' + (i+1) + '</div><div>' + e[LANG] + '</div></div>';
      }).join('')
    : '<div class="clink" style="color:var(--text3)">' + S('La cadena está vacía.','The chain is empty.') + '</div>';
  document.getElementById('chpool').innerHTML = CH.pool.map(function(e, i){
    var used = CH.placed.indexOf(e) >= 0;
    return '<div class="step' + (used ? ' used' : '') + '" onclick="chTap(' + i + ')">' + e[LANG] + '</div>';
  }).join('');
  var m = document.getElementById('chmsg');
  m.className = 'wmsg' + (CH.cls ? ' ' + CH.cls : '');
  m.innerHTML = CH.msg[LANG];
  document.getElementById('chprog').textContent = S('Eslabones colocados: ','Links placed: ') + CH.placed.length + ' / ' + CH.order.length;
}
function chTap(i){
  if (!CH || CH.done) return;
  var e = CH.pool[i];
  if (CH.placed.indexOf(e) >= 0) return;
  var expected = CH.order[CH.placed.length];
  if (e === expected){
    CH.placed.push(e);
    if (CH.placed.length === CH.order.length){
      CH.done = true; CH.cls = 'ok';
      CH.msg = { es:'Cadena cerrada. La desigualdad no se explica por una sola decisión ni por la falta de esfuerzo: cada eslabón crea las condiciones del siguiente, y por eso se hereda de una generación a otra.',
                 en:'The chain is closed. Inequality is not explained by a single decision or by a lack of effort: each link creates the conditions for the next one, and that is why it is inherited from one generation to another.' };
    } else {
      CH.cls = 'ok';
      var nx = CH.order[CH.placed.length];
      CH.msg = { es:'Ese eslabón va en su lugar. Para el siguiente, ' + nx.clue.es,
                 en:'That link fits. For the next one, ' + nx.clue.en };
    }
  } else {
    CH.tries++;
    if (CH.tries >= 3){
      CH.placed = CH.order.slice(); CH.done = true; CH.cls = 'warn';
      CH.msg = { es:'Esta es la cadena completa. Observa que el último eslabón devuelve la situación al primero: eso es lo que hace estructural a una desigualdad.',
                 en:'This is the complete chain. Notice that the last link returns the situation to the first one: that is what makes an inequality structural.' };
    } else {
      CH.placed = []; CH.cls = 'bad';
      var f = CH.order[0];
      CH.msg = { es:'Ese eslabón es consecuencia de otro que aún no colocas: ' + f.clue.es + ' La cadena vuelve a empezar.',
                 en:'That link is a consequence of another one you have not placed yet: ' + f.clue.en + ' The chain starts over.' };
    }
  }
  chRender();
}
function chReset(){
  if (!CH || CH.done) return;
  CH.placed = []; CH.cls = '';
  CH.msg = { es:'Cadena limpia. Busca de nuevo el eslabón que está antes de todos.',
             en:'Clean chain. Look again for the link that comes before all the others.' };
  chRender();
}

/* ================================================
   WIDGET 3 · REPARTIDOR DE APOYOS
   Three students start from different conditions and share a fixed set of
   supports. Each tap on the plus or minus button redraws the bars at once, so
   the student sees that splitting the supports evenly leaves somebody below the
   line while equity closes the gap. Third miss reveals the distribution that
   works (Rule 8, pattern A).
   ================================================ */
var AP = null;
function buildApoyos(rng){
  var cfgs = [
    { base:[20,55,40],
      names:['Rosa','Diego','Ximena'],
      notes:[ { es:'camina dos horas al día y estudia sin luz eléctrica estable', en:'walks two hours a day and studies without stable electric light' },
              { es:'vive cerca de la escuela y tiene un lugar fijo para estudiar', en:'lives near the school and has a fixed place to study' },
              { es:'trabaja por las tardes y comparte un solo cuaderno con su hermana', en:'works in the afternoons and shares a single notebook with her sister' } ] },
    { base:[10,45,60],
      names:['Ana','Beto','Lucía'],
      notes:[ { es:'llegó este año, no habla español en casa y nadie le traduce las tareas', en:'arrived this year, does not speak Spanish at home and nobody translates the homework' },
              { es:'falta a clase cuando la familia se traslada por la cosecha', en:'misses class when the family moves for the harvest' },
              { es:'tiene internet en casa y apoyo para repasar', en:'has internet at home and support to review' } ] },
    { base:[35,15,50],
      names:['Iván','Nayeli','Sofía'],
      notes:[ { es:'estudia después de cuidar a sus hermanos menores', en:'studies after taking care of younger siblings' },
              { es:'usa silla de ruedas y la escuela no tiene rampa hasta el aula', en:'uses a wheelchair and the school has no ramp up to the classroom' },
              { es:'llega a tiempo y cuenta con los materiales completos', en:'arrives on time and has all the materials' } ] }
  ];
  var c = cfgs[Math.floor(rng() * cfgs.length)];
  var need = 75, stepv = 20;
  var needs = c.base.map(function(b){ var d = Math.ceil((need - b) / stepv); return d > 0 ? d : 0; });
  var total = needs[0] + needs[1] + needs[2];
  AP = { base:c.base, names:c.names, notes:c.notes, need:need, step:stepv, needs:needs, total:total,
         giv:[0,0,0], tries:0, done:false, cls:'',
         msg:{ es:'Tienes ' + total + ' apoyos para repartir. La línea del ' + need + ' por ciento marca las condiciones mínimas para concluir el ciclo.',
               en:'You have ' + total + ' supports to hand out. The line at ' + need + ' per cent marks the minimum conditions to finish the school year.' } };
  return '<div class="wgt" id="apw">' +
    '<div class="wgt-h">' + S('Repartidor de apoyos','Support allocator') + '</div>' +
    '<div class="wgt-q">' + S('Reparte los apoyos disponibles para que las tres personas alcancen las condiciones mínimas. Puedes quitar y volver a poner.','Hand out the available supports so that the three people reach the minimum conditions. You can take them back and try again.') + '</div>' +
    '<div id="aprows"></div>' +
    '<div class="wmsg" id="apmsg"></div>' +
    '<button class="wbtn" onclick="apCheck()">' + S('Revisar el reparto','Check the allocation') + '</button>' +
    '<button class="wbtn alt" onclick="apReset()">' + S('Devolver todo','Return everything') + '</button>' +
    '<div class="wprog" id="approg"></div>' +
  '</div>';
}
function apLevel(i){ var v = AP.base[i] + AP.giv[i] * AP.step; return v > 100 ? 100 : v; }
function apRender(){
  if (!AP || !document.getElementById('aprows')) return;
  document.getElementById('aprows').innerHTML = AP.names.map(function(nm, i){
    var lv = apLevel(i), ok = lv >= AP.need;
    return '<div class="alrow">' +
      '<div class="alhead"><span class="alname">' + nm + '</span>' +
        '<span class="alstate ' + (ok ? 'ok' : 'low') + '">' + (ok ? S('condiciones suficientes','sufficient conditions') : S('por debajo de lo necesario','below what is needed')) + '</span></div>' +
      '<div class="alnote">' + AP.notes[i][LANG] + '</div>' +
      '<div class="altrack"><div class="alfill' + (ok ? ' ok' : '') + '" style="width:' + lv + '%"></div></div>' +
      '<div class="alctl">' +
        '<button class="albtn" onclick="apAdd(' + i + ',-1)">-</button>' +
        '<button class="albtn" onclick="apAdd(' + i + ',1)">+</button>' +
        '<span class="alcount">' + S('apoyos: ','supports: ') + AP.giv[i] + '</span>' +
      '</div></div>';
  }).join('');
  var m = document.getElementById('apmsg');
  m.className = 'wmsg' + (AP.cls ? ' ' + AP.cls : '');
  m.innerHTML = AP.msg[LANG];
  var left = AP.total - (AP.giv[0] + AP.giv[1] + AP.giv[2]);
  document.getElementById('approg').textContent = S('Apoyos sin repartir: ','Supports not handed out: ') + left + ' / ' + AP.total;
}
function apAdd(i, d){
  if (!AP || AP.done) return;
  var left = AP.total - (AP.giv[0] + AP.giv[1] + AP.giv[2]);
  if (d > 0 && left <= 0){
    AP.cls = 'warn';
    AP.msg = { es:'Ya no quedan apoyos. Si quieres dar uno más, primero quítalo de quien ya alcanzó la línea.',
               en:'There are no supports left. If you want to give one more, first take it from somebody who already reached the line.' };
    apRender(); return;
  }
  if (d < 0 && AP.giv[i] <= 0) return;
  AP.giv[i] += d;
  AP.cls = '';
  var lv = apLevel(i);
  AP.msg = lv >= AP.need
    ? { es:AP.names[i] + ' ya alcanzó la línea. Observa a quién le falta todavía antes de seguir dando apoyos aquí.',
        en:AP.names[i] + ' has reached the line. Look at who is still short before giving more supports here.' }
    : { es:AP.names[i] + ' sigue por debajo de la línea. Compara la barra con su punto de partida.',
        en:AP.names[i] + ' is still below the line. Compare the bar with the starting point.' };
  apRender();
}
function apCheck(){
  if (!AP || AP.done) return;
  var below = [], over = [], i;
  for (i = 0; i < 3; i++){
    if (apLevel(i) < AP.need) below.push(AP.names[i]);
    else if (AP.giv[i] > AP.needs[i]) over.push(AP.names[i]);
  }
  if (below.length === 0){
    AP.done = true; AP.cls = 'ok';
    AP.msg = { es:'Las tres alcanzaron las condiciones mínimas y no recibieron lo mismo. Eso es equidad: el trato se ajusta al punto de partida para que el resultado sea igual de digno para todas.',
               en:'The three of them reached the minimum conditions and did not receive the same amount. That is equity: the treatment adjusts to the starting point so the result is equally decent for everyone.' };
  } else {
    AP.tries++;
    if (AP.tries >= 3){
      AP.giv = AP.needs.slice(); AP.done = true; AP.cls = 'warn';
      AP.msg = { es:'Este reparto sí funciona. Repartir los apoyos en partes iguales dejaba a alguien por debajo, porque no todas partían del mismo lugar.',
                 en:'This allocation does work. Splitting the supports evenly left somebody below, because they did not all start from the same place.' };
    } else {
      AP.cls = 'bad';
      AP.msg = { es:'Todavía queda gente por debajo de la línea: ' + below.join(', ') + '.' + (over.length ? ' Mientras tanto, ' + over.join(', ') + ' recibió más de lo que necesitaba.' : ' Prueba mover apoyos de quien ya la alcanzó.'),
                 en:'There are still people below the line: ' + below.join(', ') + '.' + (over.length ? ' Meanwhile, ' + over.join(', ') + ' received more than needed.' : ' Try moving supports from whoever already reached it.') };
    }
  }
  apRender();
}
function apReset(){
  if (!AP || AP.done) return;
  AP.giv = [0,0,0]; AP.cls = '';
  AP.msg = { es:'Reparto vacío. Mira primero de dónde parte cada persona y después decide.',
             en:'Empty allocation. Look first at where each person starts and then decide.' };
  apRender();
}

/* ================================================
   WIDGET 4 · TERMÓMETRO DE LA SOLIDARIDAD
   Four design decisions, three positions each. The meter moves with every tap,
   so the student watches an action slide from occasional help toward solidarity
   and back. The check names the weakest decision instead of judging the whole
   thing; the third check reveals the configuration that holds up (Rule 8).
   ================================================ */
var TM = null;
function buildTermo(rng){
  var cases = [
    { es:'Un grupo de la escuela quiere responder a la falta de agua potable en una comunidad cercana. Antes de salir, decide cómo va a hacerlo.',
      en:'A group from the school wants to respond to the lack of drinking water in a nearby community. Before going out, it decides how it will do it.' },
    { es:'Un grupo quiere responder a que varias personas jóvenes de una comunidad dejan la secundaria antes de terminarla. Antes de empezar, decide cómo va a hacerlo.',
      en:'A group wants to respond to the fact that several young people in a community leave secondary school before finishing. Before starting, it decides how it will do it.' }
  ];
  var crit = [
    { q:{ es:'¿Quién decide qué se va a hacer?', en:'Who decides what will be done?' },
      o:[ { es:'El grupo decide desde la escuela', en:'The group decides from the school' },
          { es:'Se consulta cuando el plan ya está hecho', en:'People are consulted once the plan is ready' },
          { es:'La comunidad participa desde el inicio', en:'The community takes part from the start' } ],
      w:{ es:'quién decide', en:'who decides' } },
    { q:{ es:'¿Sobre qué actúa?', en:'What does it act on?' },
      o:[ { es:'Alivia el efecto inmediato', en:'It eases the immediate effect' },
          { es:'Alivia el efecto y documenta el caso', en:'It eases the effect and documents the case' },
          { es:'Documenta y va sobre la causa del problema', en:'It documents and goes after the cause of the problem' } ],
      w:{ es:'sobre qué actúa', en:'what it acts on' } },
    { q:{ es:'¿Cuánto dura?', en:'How long does it last?' },
      o:[ { es:'Una entrega única', en:'A single delivery' },
          { es:'Mientras dure la campaña escolar', en:'While the school campaign lasts' },
          { es:'Con seguimiento, fechas y responsables', en:'With follow up, dates and people responsible' } ],
      w:{ es:'cuánto dura', en:'how long it lasts' } },
    { q:{ es:'¿Cómo trata a las personas?', en:'How does it treat people?' },
      o:[ { es:'Como personas que reciben una ayuda', en:'As people who receive help' },
          { es:'Como personas invitadas a colaborar', en:'As people invited to collaborate' },
          { es:'Como titulares de derechos que deciden', en:'As rights holders who decide' } ],
      w:{ es:'cómo trata a las personas', en:'how it treats people' } }
  ];
  TM = { cse:cases[Math.floor(rng() * cases.length)], crit:crit, val:[0,0,0,0], tries:0, done:false, cls:'',
         msg:{ es:'Ajusta las cuatro decisiones y observa hacia dónde se mueve el termómetro.',
               en:'Adjust the four decisions and watch where the thermometer moves.' } };
  return '<div class="wgt" id="tmw">' +
    '<div class="wgt-h">' + S('Termómetro de la solidaridad','Thermometer of solidarity') + '</div>' +
    '<div class="wgt-q">' + S('Ayudar una vez y actuar con solidaridad no son lo mismo. Mueve las decisiones y compruébalo.','Helping once and acting in solidarity are not the same. Move the decisions and see it for yourself.') + '</div>' +
    '<div class="wcase">' + TM.cse[LANG] + '</div>' +
    '<div id="tmcrit"></div>' +
    '<div class="mtr"><div class="mtrlbl"><span id="tmlbl"></span><span id="tmnote"></span></div>' +
      '<div class="mtrtrack"><div class="mtrfill" id="tmfill"></div></div></div>' +
    '<div class="wmsg" id="tmmsg"></div>' +
    '<button class="wbtn" onclick="tmCheck()">' + S('Revisar la acción','Check the action') + '</button>' +
  '</div>';
}
function tmScore(){ return TM.val[0] + TM.val[1] + TM.val[2] + TM.val[3]; }
function tmRender(){
  if (!TM || !document.getElementById('tmcrit')) return;
  document.getElementById('tmcrit').innerHTML = TM.crit.map(function(c, i){
    return '<div class="crit"><div class="critq">' + c.q[LANG] + '</div><div class="tri">' +
      c.o.map(function(o, j){
        return '<button class="tribtn' + (TM.val[i] === j ? ' sel' : '') + '" onclick="tmSet(' + i + ',' + j + ')">' + o[LANG] + '</button>';
      }).join('') + '</div></div>';
  }).join('');
  var sc = tmScore(), pctv = Math.round(sc / 8 * 100);
  var f = document.getElementById('tmfill');
  f.style.width = pctv + '%';
  f.className = 'mtrfill' + (sc >= 7 ? ' ok' : (sc >= 4 ? ' mid' : ''));
  document.getElementById('tmlbl').textContent = sc >= 7 ? S('Acción solidaria','Solidarity action')
    : (sc >= 4 ? S('A medio camino','Halfway there') : S('Ayuda ocasional','Occasional help'));
  document.getElementById('tmnote').textContent = sc >= 7 ? S('reconoce y acompaña','it recognizes and accompanies')
    : (sc >= 4 ? S('todavía decide por otras personas','it still decides for other people') : S('alivia sin cambiar nada','it eases without changing anything'));
  var m = document.getElementById('tmmsg');
  m.className = 'wmsg' + (TM.cls ? ' ' + TM.cls : '');
  m.innerHTML = TM.msg[LANG];
}
function tmSet(i, j){
  if (!TM || TM.done) return;
  TM.val[i] = j; TM.cls = '';
  var sc = tmScore();
  TM.msg = sc >= 7
    ? { es:'El termómetro subió. Con estas decisiones la acción reconoce a la comunidad como protagonista.',
        en:'The thermometer went up. With these decisions the action recognizes the community as the protagonist.' }
    : { es:'El termómetro se movió. Revisa cuál de las cuatro decisiones sigue dejando a la comunidad fuera.',
        en:'The thermometer moved. Check which of the four decisions still leaves the community out.' };
  tmRender();
}
function tmCheck(){
  if (!TM || TM.done) return;
  var sc = tmScore();
  if (sc >= 7){
    TM.done = true; TM.cls = 'ok';
    TM.msg = { es:'Así se sostiene una acción solidaria: la comunidad decide, se atiende la causa y no solo el efecto, hay seguimiento con responsables y las personas son tratadas como titulares de derechos, no como receptoras.',
               en:'This is how a solidarity action holds up: the community decides, the cause is addressed and not only the effect, there is follow up with people responsible, and people are treated as rights holders, not as recipients.' };
  } else {
    TM.tries++;
    var low = 0, i;
    for (i = 1; i < 4; i++){ if (TM.val[i] < TM.val[low]) low = i; }
    if (TM.tries >= 3){
      TM.val = [2,2,2,2]; TM.done = true; TM.cls = 'warn';
      TM.msg = { es:'Esta es la combinación que sostiene una acción solidaria. La caridad ocasional alivia un efecto y termina; la solidaridad reconoce a la otra persona como igual y va por la causa.',
                 en:'This is the combination that sustains a solidarity action. Occasional charity eases an effect and ends; solidarity recognizes the other person as an equal and goes after the cause.' };
    } else {
      TM.cls = 'bad';
      TM.msg = { es:'La acción todavía se parece a una ayuda ocasional. El punto más débil está en ' + TM.crit[low].w.es + '. Ajusta esa decisión y vuelve a revisar.',
                 en:'The action still looks like occasional help. The weakest point is ' + TM.crit[low].w.en + '. Adjust that decision and check again.' };
    }
  }
  tmRender();
}

/* ================================================
   WIDGET 5 · FILTRO DE ALERTAS
   A concrete project is described and the student marks the signals that would
   make it fail as an ethical action. Every tap updates the count in real time and
   the check reports how many signals were found and how many correct decisions
   were marked by mistake. Third miss reveals the signals (Rule 8, pattern A).
   ================================================ */
var FL = null;
function buildFiltro(rng){
  var cases = [
    { cse:{ es:'Un grupo de estudiantes propone llevar despensas a una comunidad el último viernes del semestre. El contenido se decide en la escuela, se toman fotografías para la página del plantel y no está prevista una segunda visita.',
            en:'A group of students proposes taking food parcels to a community on the last Friday of the term. The contents are decided at school, photos are taken for the school page and no second visit is planned.' },
      ch:[ { es:'El contenido se decide sin preguntar a la comunidad', en:'The contents are decided without asking the community', a:true },
           { es:'La acción termina al cerrar el semestre', en:'The action ends when the term closes', a:true },
           { es:'Las personas aparecen en fotografías para promover al plantel', en:'People appear in photos used to promote the school', a:true },
           { es:'La fecha se acordó con las autoridades de la comunidad', en:'The date was agreed with the community authorities', a:false },
           { es:'Se registra por escrito lo que se entrega', en:'What is delivered is recorded in writing', a:false },
           { es:'Participan estudiantes de varios grupos', en:'Students from several groups take part', a:false } ] },
    { cse:{ es:'Una asociación instala una biblioteca en una comunidad. Elige los libros en la ciudad, contrata a una persona externa para atenderla y anuncia que el proyecto dura seis meses.',
            en:'An association sets up a library in a community. It chooses the books in the city, hires an outside person to run it and announces that the project lasts six months.' },
      ch:[ { es:'Los libros se eligen sin consultar a quienes van a leerlos', en:'The books are chosen without asking those who will read them', a:true },
           { es:'Nadie de la comunidad se capacita para quedarse a cargo', en:'Nobody from the community is trained to stay in charge', a:true },
           { es:'El proyecto cierra en seis meses sin un plan para continuar', en:'The project closes in six months with no plan to continue', a:true },
           { es:'El espacio se acordó con la asamblea de la comunidad', en:'The space was agreed with the community assembly', a:false },
           { es:'El horario se ajustó a las jornadas de trabajo del lugar', en:'The schedule was adjusted to the working hours of the place', a:false },
           { es:'El registro de préstamos queda abierto a cualquiera', en:'The lending record stays open to anyone', a:false } ] },
    { cse:{ es:'Un municipio anuncia becas para jóvenes de comunidades alejadas. La convocatoria se publica solo en internet y en español, el trámite exige acudir dos veces a la cabecera y los resultados no se hacen públicos.',
            en:'A town announces scholarships for young people from distant communities. The call is published only online and in Spanish, the procedure requires two trips to the town center and the results are not made public.' },
      ch:[ { es:'La convocatoria no llega a quienes hablan otra lengua', en:'The call does not reach those who speak another language', a:true },
           { es:'El trámite exige traslados que la beca no cubre', en:'The procedure requires trips that the scholarship does not cover', a:true },
           { es:'Los resultados no se hacen públicos', en:'The results are not made public', a:true },
           { es:'El programa se dirige a comunidades alejadas', en:'The program is aimed at distant communities', a:false },
           { es:'La beca se entrega cada mes durante el ciclo escolar', en:'The scholarship is delivered monthly during the school year', a:false },
           { es:'Hay un teléfono de atención para resolver dudas', en:'There is a phone line to answer questions', a:false } ] }
  ];
  var c = cases[Math.floor(rng() * cases.length)];
  FL = { cse:c.cse, ch:shuffle(c.ch, rng), sel:[], tries:0, done:false, cls:'',
         msg:{ es:'Marca las señales que impedirían que esta acción reduzca la desigualdad.',
               en:'Mark the signals that would keep this action from reducing inequality.' } };
  return '<div class="wgt" id="flw">' +
    '<div class="wgt-h">' + S('Filtro de alertas','Alert filter') + '</div>' +
    '<div class="wgt-q">' + S('Una buena intención no basta. Revisa el proyecto antes de que salga a la comunidad.','A good intention is not enough. Review the project before it reaches the community.') + '</div>' +
    '<div class="wcase">' + FL.cse[LANG] + '</div>' +
    '<div class="chips" id="flchips"></div>' +
    '<div class="wmsg" id="flmsg"></div>' +
    '<button class="wbtn" onclick="flCheck()">' + S('Revisar el proyecto','Review the project') + '</button>' +
    '<button class="wbtn alt" onclick="flClear()">' + S('Limpiar','Clear') + '</button>' +
    '<div class="wprog" id="flprog"></div>' +
  '</div>';
}
function flRender(){
  if (!FL || !document.getElementById('flchips')) return;
  document.getElementById('flchips').innerHTML = FL.ch.map(function(c, i){
    var cl = 'chip';
    if (FL.done) cl += c.a ? ' good' : (FL.sel.indexOf(i) >= 0 ? ' miss' : '');
    else if (FL.sel.indexOf(i) >= 0) cl += ' sel';
    return '<div class="' + cl + '" onclick="flTap(' + i + ')">' + c[LANG] + '</div>';
  }).join('');
  var m = document.getElementById('flmsg');
  m.className = 'wmsg' + (FL.cls ? ' ' + FL.cls : '');
  m.innerHTML = FL.msg[LANG];
  document.getElementById('flprog').textContent = S('Señales marcadas: ','Signals marked: ') + FL.sel.length;
}
function flTap(i){
  if (!FL || FL.done) return;
  var k = FL.sel.indexOf(i);
  if (k >= 0) FL.sel.splice(k, 1); else FL.sel.push(i);
  FL.cls = '';
  FL.msg = { es:'Llevas ' + FL.sel.length + ' señales marcadas. Pregúntate en cada una si la comunidad decide, si la acción se sostiene y si respeta a las personas.',
             en:'You have ' + FL.sel.length + ' signals marked. Ask in each case whether the community decides, whether the action lasts and whether it respects people.' };
  flRender();
}
function flCheck(){
  if (!FL || FL.done) return;
  var tot = 0, hit = 0, extra = 0, i;
  for (i = 0; i < FL.ch.length; i++) if (FL.ch[i].a) tot++;
  for (i = 0; i < FL.sel.length; i++){ if (FL.ch[FL.sel[i]].a) hit++; else extra++; }
  if (hit === tot && extra === 0){
    FL.done = true; FL.cls = 'ok';
    FL.msg = { es:'Filtro superado. Las tres señales tienen algo en común: dejan a la comunidad fuera de la decisión, no se sostienen en el tiempo o usan a las personas para otra cosa. Corregirlas es lo que convierte una buena intención en una acción ética.',
               en:'Filter passed. The three signals share something: they leave the community out of the decision, they do not last over time or they use people for something else. Correcting them is what turns a good intention into an ethical action.' };
  } else {
    FL.tries++;
    if (FL.tries >= 3){
      FL.done = true; FL.cls = 'warn';
      FL.msg = { es:'Estas eran las señales de alerta. Las demás decisiones no eran el problema: cuidar la forma de actuar es parte del contenido de la acción.',
                 en:'These were the alert signals. The other decisions were not the problem: taking care of how you act is part of the content of the action.' };
    } else {
      FL.cls = 'bad';
