<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polígonos Regulares con Regla y Compás</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.iwrap { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:12px; padding:1.1rem 1.1rem 1.2rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.4rem; }
.iw-goal { font-size:.92rem; color:var(--text); font-weight:600; margin-bottom:.5rem; }
.iw-sub { font-size:.79rem; color:var(--text3); margin-bottom:.75rem; }
.ivcanvas { display:block; width:100%; height:250px; background:var(--surface); }
.iw-ctrl { display:flex; align-items:center; gap:.6rem; margin:.85rem 0 .5rem; }
.iw-ctrl input[type=range] { flex:1; accent-color:var(--green); min-height:34px; }
.iw-btn { min-width:44px; min-height:44px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text); border-radius:9px; font-size:1.05rem; font-weight:700; cursor:pointer; font-family:inherit; }
.iw-btn:hover { border-color:var(--green); color:var(--green); }
.iw-read { font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--green-dark); background:var(--green-bg); border-radius:8px; padding:.45rem .7rem; text-align:center; }
.rverify-btn { margin-top:.85rem; min-height:44px; padding:.55rem 1.25rem; border:none; border-radius:9px; background:var(--green); color:#fff; font-size:.86rem; font-weight:600; cursor:pointer; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.rfb { min-height:1.35rem; margin-top:.6rem; font-size:.85rem; color:var(--text2); }
.tl-list, .tsl-bins, .tsl-chips { display:flex; flex-wrap:wrap; gap:.5rem; margin:.75rem 0; }
.tl-list { flex-direction:column; }
.tl-chip { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .8rem; cursor:pointer; background:var(--surface2); font-size:.83rem; min-height:44px; display:flex; align-items:center; gap:.55rem; color:var(--text); }
.tl-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.tl-chip.locked { cursor:default; }
.tl-num { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; }
.tsl-bin { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .75rem; background:var(--surface2); color:var(--text); cursor:pointer; font-size:.8rem; font-family:inherit; min-height:44px; }
.tsl-bin:hover { border-color:var(--green); color:var(--green); }
.tsl-chip { border:1.5px solid var(--gold); background:var(--gold-bg); color:var(--text); border-radius:20px; padding:.4rem .85rem; font-size:.79rem; cursor:pointer; min-height:38px; display:flex; align-items:center; }
.tsl-chip.fixed { border-color:var(--green); background:var(--green-bg); cursor:default; }
.tsl-sum { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem; color:var(--green-dark); text-align:center; margin-top:.45rem; }
.reflect-prompt { font-size:.92rem; color:var(--text2); margin:.4rem 0 .85rem; }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ivcanvas { height: 230px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
  .iwrap { padding: .85rem .8rem 1rem; }
  .tsl-bin { font-size: .76rem; padding: .45rem .6rem; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from the rebrand step -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Polígonos Regulares con Regla y Compás</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 2A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Polígonos Regulares con Regla y Compás</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->

      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);
    }
  }
}

  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  if (!tb) return;
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER: two-tap confirmation (Rule 6)
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm, used by restoreSession and setLang to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    var u = URL.createObjectURL(b);

               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })

   GUIDE CONTENT: geometry helpers, manipulatives and buildLesson

var WIDGET_REDRAW = [];
window.redrawWidgets = function(){ WIDGET_REDRAW.forEach(function(f){ try { f(); } catch(e){} }); };

function cssVar(n){ var v=''; try { v = getComputedStyle(document.documentElement).getPropertyValue(n); } catch(e){} return (v||'').trim(); }

function fmt(x){ return String(Math.round(x*100)/100); }

function addSection(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
  document.getElementById('lessonBody').appendChild(d);
}

function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length-1; i > 0; i--){ var j = Math.floor(rng()*(i+1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return { opts:a, idx:a.indexOf(correct) };
}

function permOf(n, rng){
  var a = []; for (var i=0;i<n;i++) a.push(i);
  for (var k=a.length-1;k>0;k--){ var j=Math.floor(rng()*(k+1)); var tmp=a[k]; a[k]=a[j]; a[j]=tmp; }
  var sorted = true; for (var q=0;q<n;q++) if (a[q]!==q) sorted = false;
  if (sorted){ var s=a[0]; a[0]=a[n-1]; a[n-1]=s; }
  return a;
}

function fitCanvas(cv, hh){
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth || 320;
  cv.width = Math.round(w*dpr); cv.height = Math.round(hh*dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx:ctx, w:w, h:hh };
}

/* ── MANIPULATIVE 1: digital compass, split the circle into equal arcs ── */
function buildCompas(rng){
  var TG = [{n:4,ia:90},{n:5,ia:108},{n:6,ia:120},{n:8,ia:135},{n:9,ia:140},{n:10,ia:144},{n:12,ia:150}];
  var rounds = shuffle(TG, rng).slice(0,3);
  var es = (LANG === 'es');
  var st = { n:3, r:0, tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap cmpwrap section';
  wrap.setAttribute('data-widget', 'compas');
  wrap.id = 'compasW';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Compás digital':'Digital compass')+'</div>'+
    '<div class="iw-goal" id="cmpGoal"></div>'+
    '<div class="iw-sub">'+(es?'Mueve el control para repartir más o menos marcas sobre la circunferencia: el trazo se rehace al instante.':'Move the control to spread more or fewer marks around the circle: the drawing redraws instantly.')+'</div>'+
    '<div class="cvwrap"><canvas class="ivcanvas" id="cmpCv"></canvas></div>'+
    '<div class="iw-ctrl">'+
      '<button class="iw-btn" onclick="cmpStep(-1)">−</button>'+
      '<input type="range" min="3" max="12" step="1" value="3" id="cmpRange" oninput="cmpSet(this.value)">'+
      '<button class="iw-btn" onclick="cmpStep(1)">+</button>'+
    '</div>'+
    '<div class="iw-read" id="cmpRead"></div>'+
    '<button class="rverify-btn" onclick="cmpCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="cmpFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function draw(){
    var cv = document.getElementById('cmpCv'); if (!cv) return;
    var f = fitCanvas(cv, cv.clientHeight || 250), ctx = f.ctx, w = f.w, hh = f.h;
    ctx.clearRect(0,0,w,hh);
    var cx = w/2, cy = hh/2, R = Math.min(w,hh)/2 - 26;
    ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    for (var i=0;i<st.n;i++){
      var a = -Math.PI/2 + i*2*Math.PI/st.n;
      var x = cx + R*Math.cos(a), y = cy + R*Math.sin(a);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle = cssVar('--green-bg'); ctx.fill();
    ctx.strokeStyle = cssVar('--green'); ctx.lineWidth = 2.5; ctx.stroke();
    var a0 = -Math.PI/2, a1 = -Math.PI/2 + 2*Math.PI/st.n;
    ctx.strokeStyle = cssVar('--gold'); ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a0), cy+R*Math.sin(a0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a1), cy+R*Math.sin(a1)); ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx,cy,R*0.30,a0,a1); ctx.stroke();
    ctx.fillStyle = cssVar('--gold');
    for (var k=0;k<st.n;k++){
      var ak = -Math.PI/2 + k*2*Math.PI/st.n;
      ctx.beginPath(); ctx.arc(cx+R*Math.cos(ak), cy+R*Math.sin(ak), 3.6, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = cssVar('--text');
    ctx.beginPath(); ctx.arc(cx,cy,2.6,0,Math.PI*2); ctx.fill();
    ctx.font = '600 12px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center';
    var am = (a0+a1)/2;
    ctx.fillStyle = cssVar('--gold');
    ctx.fillText(fmt(360/st.n)+'°', cx + R*0.47*Math.cos(am), cy + R*0.47*Math.sin(am) + 4);
  }
  WIDGET_REDRAW.push(draw);

  function readout(){
    var el = document.getElementById('cmpRead'); if (!el) return;
    el.textContent = (es ? 'Lados: ' : 'Sides: ') + st.n + '    ' + (es ? 'ángulo central: ' : 'central angle: ') + fmt(360/st.n) + '°';
  }
  function goalText(){
    var el = document.getElementById('cmpGoal'); if (!el || st.r >= rounds.length) return;
    var g = rounds[st.r];
    el.textContent = es
      ? 'Reto ' + (st.r+1) + ' de 3: construye un polígono regular cuyo ángulo interior mida ' + g.ia + '°.'
      : 'Challenge ' + (st.r+1) + ' of 3: build a regular polygon whose interior angle is ' + g.ia + '°.';
  }
  function advance(ms){
    st.lock = true;
    setTimeout(function(){
      st.r++; st.tries = 0;
      var fb = document.getElementById('cmpFb');
      if (st.r >= rounds.length){
        st.done = true;
        if (fb) fb.innerHTML = '<span style="color:var(--ok);font-weight:700">'+(es?'Ya dominas el reparto de la circunferencia con el compás.':'You now control how the compass splits the circle.')+'</span>';
        return;
      }
      st.lock = false; st.n = 3;
      var rg = document.getElementById('cmpRange'); if (rg) rg.value = 3;
      if (fb) fb.textContent = '';
      goalText(); draw(); readout();
    }, ms);
  }

  window.cmpSet = function(v){ if (st.lock||st.done) return; st.n = parseInt(v,10)||3; draw(); readout(); };
  window.cmpStep = function(d){
    if (st.lock||st.done) return;
    st.n = Math.max(3, Math.min(12, st.n + d));
    var rg = document.getElementById('cmpRange'); if (rg) rg.value = st.n;
    draw(); readout();
  };
  window.cmpCheck = function(){
    if (st.lock||st.done) return;
    var g = rounds[st.r], fb = document.getElementById('cmpFb');
    var ia = 180 - 360/st.n;
    if (Math.abs(ia - g.ia) < 0.001){
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700">🎉 '+(es
        ? '¡Exacto! Con ' + st.n + ' lados el ángulo interior mide ' + g.ia + '°.'
        : 'Exactly! With ' + st.n + ' sides the interior angle is ' + g.ia + '°.')+'</span>';
      advance(1400); return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.n = g.n;
      var rg = document.getElementById('cmpRange'); if (rg) rg.value = st.n;
      draw(); readout();
      fb.textContent = es
        ? 'Con ' + g.n + ' lados el ángulo central mide ' + fmt(360/g.n) + '° y el interior ' + g.ia + '°. Observa: mientras más lados repartes, más se abre el ángulo interior.'
        : 'With ' + g.n + ' sides the central angle is ' + fmt(360/g.n) + '° and the interior angle is ' + g.ia + '°. Notice: the more sides you spread, the wider the interior angle.';
      advance(2600); return;
    }
    fb.textContent = (ia < g.ia)
      ? (es ? 'Tu polígono todavía cierra demasiado. Reparte más marcas y vuelve a verificar.' : 'Your polygon is still too sharp. Spread more marks and check again.')
      : (es ? 'Ahora se abre de más. Quita marcas y vuelve a verificar.' : 'Now it opens too much. Remove marks and check again.');
  };

  goalText();
  setTimeout(function(){ draw(); readout(); }, 70);
}

/* ── MANIPULATIVE 2: close a mosaic vertex with regular tiles ── */
function buildTeselado(rng){
  var es = (LANG === 'es');
  var P = [
    { a:60,  nm: es?'Triángulo':'Triangle' },
    { a:90,  nm: es?'Cuadrado':'Square' },
    { a:108, nm: es?'Pentágono':'Pentagon' },
    { a:120, nm: es?'Hexágono':'Hexagon' },
    { a:135, nm: es?'Octágono':'Octagon' },
    { a:150, nm: es?'Dodecágono':'Dodecagon' }
  ];
  var RS = [ {s:4,sol:[4,1]}, {s:5,sol:[5,0]}, {s:3,sol:[3,3]}, {s:1,sol:[1,1,1]}, {s:0,sol:[0,0,0,0,0]} ];
  var rounds = shuffle(RS, rng).slice(0,3);
  var st = { r:0, placed:[rounds[0].s], over:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap tslwrap section';
  wrap.setAttribute('data-widget', 'teselado');
  wrap.id = 'teseladoW';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Vértice del mosaico':'Mosaic vertex')+'</div>'+
    '<div class="iw-goal" id="tslGoal"></div>'+
    '<div class="iw-sub">'+(es?'Toca una pieza para agregarla al vértice. Toca una pieza ya colocada para quitarla.':'Tap a tile to add it to the vertex. Tap a placed tile to remove it.')+'</div>'+
    '<div class="cvwrap"><canvas class="ivcanvas" id="tslCv"></canvas></div>'+
    '<div class="tsl-bins">'+ P.map(function(p,i){
        return '<button class="tsl-bin" onclick="tslPick('+i+')">'+p.nm+' '+p.a+'°</button>';
      }).join('') +'</div>'+
    '<div class="tsl-chips" id="tslChips"></div>'+
    '<div class="tsl-sum" id="tslSum"></div>'+
    '<div class="rfb" id="tslFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function total(){ return st.placed.reduce(function(s,i){ return s + P[i].a; }, 0); }

  function draw(){
    var cv = document.getElementById('tslCv'); if (!cv) return;
    var f = fitCanvas(cv, cv.clientHeight || 250), ctx = f.ctx, w = f.w, hh = f.h;
    ctx.clearRect(0,0,w,hh);
    var cx = w/2, cy = hh/2, RR = Math.min(w,hh)/2 - 20;
    var cols = [cssVar('--green'), cssVar('--gold'), cssVar('--green-dark')];
    var acc = 0;
    for (var i=0;i<st.placed.length;i++){
      var ang = P[st.placed[i]].a;
      var b0 = (-90+acc)*Math.PI/180, b1 = (-90+acc+ang)*Math.PI/180;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,RR,b0,b1); ctx.closePath();
      ctx.globalAlpha = (acc >= 360) ? 0.30 : 0.80;
      ctx.fillStyle = cols[i % 3]; ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = cssVar('--surface'); ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = cssVar('--surface');
      ctx.font = '700 11px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center';
      var bm = (b0+b1)/2;
      ctx.fillText(ang+'°', cx + RR*0.66*Math.cos(bm), cy + RR*0.66*Math.sin(bm) + 4);
      acc += ang;
    }
    if (acc < 360){
      var g0 = (-90+acc)*Math.PI/180, g1 = (270)*Math.PI/180;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,RR,g0,g1); ctx.closePath();
      ctx.fillStyle = cssVar('--surface2'); ctx.fill();
      ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = cssVar('--text3');
      ctx.font = '600 11px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center';
      var gm = (g0+g1)/2;
      ctx.fillText((360-acc)+'°', cx + RR*0.66*Math.cos(gm), cy + RR*0.66*Math.sin(gm) + 4);
    }
    ctx.strokeStyle = (acc > 360) ? cssVar('--bad') : cssVar('--green');
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx,cy,RR,0,Math.PI*2); ctx.stroke();
  }
  WIDGET_REDRAW.push(draw);

  function chips(){
    var el = document.getElementById('tslChips'); if (!el) return;
    el.innerHTML = st.placed.map(function(pi,pos){
      var cls = 'tsl-chip' + (pos===0 ? ' fixed' : '');
      var cl = (pos===0 || st.lock) ? '' : ' onclick="tslDrop('+pos+')"';
      return '<div class="'+cls+'"'+cl+'>'+P[pi].nm+' '+P[pi].a+'°</div>';
    }).join('');
  }
  function goalText(){
    var el = document.getElementById('tslGoal'); if (!el || st.r >= rounds.length) return;
    var seedName = P[rounds[st.r].s].nm.toLowerCase();
    el.textContent = es
      ? 'Reto ' + (st.r+1) + ' de 3: en el vértice ya hay un ' + seedName + '. Agrega piezas hasta cerrar la vuelta completa.'
      : 'Challenge ' + (st.r+1) + ' of 3: the vertex already holds one ' + seedName + '. Add tiles until the full turn closes.';
  }
  function next(ms){
    setTimeout(function(){
      st.r++; st.over = 0;
      var fb = document.getElementById('tslFb');
      if (st.r >= rounds.length){
        st.done = true; st.lock = true;
        if (fb) fb.innerHTML = '<span style="color:var(--ok);font-weight:700">'+(es?'Ya sabes leer un vértice de mosaico: todo depende de sumar 360°.':'You can now read a mosaic vertex: it all comes down to adding up to 360°.')+'</span>';
        return;
      }
      st.lock = false;
      st.placed = [rounds[st.r].s];
      if (fb) fb.textContent = '';
      goalText(); update();
    }, ms);
  }
  function reveal(){
    var g = rounds[st.r];
    st.placed = [g.s].concat(g.sol);
    st.lock = true;
    chips(); draw();
    var sum = document.getElementById('tslSum');
    if (sum) sum.textContent = (es?'Suma en el vértice: ':'Vertex total: ') + '360° / 360°';
    var fb = document.getElementById('tslFb');
    if (fb) fb.textContent = es
      ? 'Esta combinación sí cierra: sus ángulos interiores suman justo una vuelta completa.'
      : 'This combination does close: its interior angles add up to exactly one full turn.';
    next(2600);
  }
  function update(){
    var tt = total();
    var sum = document.getElementById('tslSum'), fb = document.getElementById('tslFb');
    if (sum) sum.textContent = (es?'Suma en el vértice: ':'Vertex total: ') + tt + '° / 360°';
    chips(); draw();
    if (st.lock || st.done) return;
    if (tt === 360){
      st.lock = true;
      if (fb) fb.innerHTML = '<span style="color:var(--ok);font-weight:700">🎉 '+(es?'¡El vértice cierra exacto! Este grupo de piezas sí cubre el plano.':'The vertex closes exactly! This set of tiles does cover the plane.')+'</span>';
      next(1700); return;
    }
    if (tt > 360){
      st.over++;
      if (fb) fb.textContent = es
        ? 'Te pasaste por ' + (tt-360) + '°: las piezas se traslapan. Quita una y prueba con otra más pequeña.'
        : 'You went over by ' + (tt-360) + '°: the tiles overlap. Remove one and try a smaller tile.';
      if (st.over >= 3) reveal();
      return;
    }
    if (fb) fb.textContent = es
      ? 'Falta un hueco de ' + (360-tt) + '° para cerrar la vuelta.'
      : 'A gap of ' + (360-tt) + '° is still open.';
  }

  window.tslPick = function(i){ if (st.lock||st.done) return; st.placed.push(i); update(); };
  window.tslDrop = function(pos){ if (st.lock||st.done||pos===0) return; st.placed.splice(pos,1); update(); };

  goalText();
  setTimeout(function(){ update(); }, 70);
}

/* ── MANIPULATIVE 3: order the ruler and compass construction steps ── */
function buildPasos(rng){
  var es = (LANG === 'es');
  var SETS = [
    { title: es?'Hexágono regular a partir del radio':'Regular hexagon from the radius',
      steps: es
        ? ['Traza una circunferencia con centro O y radio r.',
           'Marca sobre ella un punto A cualquiera.',
           'Con la misma abertura r, apoya la punta en A y corta la circunferencia en B.',
           'Repite el corte desde cada marca nueva hasta dar la vuelta completa.',
           'Une con la regla las seis marcas consecutivas.']
        : ['Draw a circle with centre O and radius r.',
           'Mark any point A on the circle.',
           'Keeping the same opening r, place the point on A and cut the circle at B.',
           'Repeat the cut from each new mark until the turn is complete.',
           'Join the six consecutive marks with the ruler.'] },
    { title: es?'Cuadrado a partir de un diámetro':'Square from a diameter',
      steps: es
        ? ['Traza una circunferencia con centro O.',
           'Traza con la regla un diámetro AC que pase por O.',
           'Con el compás traza dos arcos iguales, uno desde A y otro desde C.',
           'Une con la regla los dos cruces de esos arcos: la recta corta la circunferencia en B y D.',
           'Une A, B, C y D con la regla.']
        : ['Draw a circle with centre O.',
           'Use the ruler to draw a diameter AC through O.',
           'With the compass draw two equal arcs, one from A and one from C.',
           'Join the two arc crossings with the ruler: the line cuts the circle at B and D.',
           'Join A, B, C and D with the ruler.'] }
  ];
  var set = SETS[Math.floor(rng()*SETS.length)];
  var st = { order: permOf(set.steps.length, rng), sel:null, tries:0, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap stpwrap section';
  wrap.setAttribute('data-widget', 'construccion');
  wrap.id = 'pasosW';
  document.getElementById('lessonBody').appendChild(wrap);

  function render(){
    var chips = st.order.map(function(ei,pos){
      var cls = 'tl-chip' + (st.sel===pos ? ' sel' : '') + (st.done ? ' locked' : '');
      var cl = st.done ? '' : ' onclick="stpTap('+pos+')"';
      return '<div class="'+cls+'"'+cl+'><span class="tl-num">'+(pos+1)+'</span>'+set.steps[ei]+'</div>';
    }).join('');
    wrap.innerHTML =
      '<div class="iw-tag">'+(es?'Orden de trazo':'Construction order')+'</div>'+
      '<div class="iw-goal">'+set.title+'</div>'+
      '<div class="iw-sub">'+(es?'Acomoda los pasos del primero al último. Toca dos pasos para intercambiarlos.':'Put the steps in order from first to last. Tap two steps to swap them.')+'</div>'+
      '<div class="tl-list">'+chips+'</div>'+
      (st.done ? '' : '<button class="rverify-btn" onclick="stpCheck()">'+(es?'Verificar':'Check')+'</button>')+
      '<div class="rfb" id="stpFb"></div>';
  }
  window.stpTap = function(pos){
    if (st.done) return;
    if (st.sel === null) st.sel = pos;
    else if (st.sel === pos) st.sel = null;
    else { var tmp = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = tmp; st.sel = null; }
    render();
  };
  window.stpCheck = function(){
    var ok = true;
    for (var i=0;i<st.order.length;i++) if (st.order[i] !== i) ok = false;
    if (ok){
      st.done = true; render();
      document.getElementById('stpFb').innerHTML = '<span style="color:var(--ok);font-weight:700">🎉 '+(es?'¡Orden correcto! Cada paso deja lista la herramienta del siguiente.':'Correct order! Each step sets up the tool for the next one.')+'</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.order = set.steps.map(function(_,i){ return i; });
      st.done = true; render();
      document.getElementById('stpFb').textContent = es
        ? 'Este es el orden correcto. Fíjate en qué necesita cada paso para poder hacerse.'
        : 'This is the correct order. Notice what each step needs before it can be done.';
      return;
    }
    var bad = 0;
    for (var k=0;k<st.order.length;k++){ if (st.order[k] !== k){ bad = k; break; } }
    render();
    document.getElementById('stpFb').textContent = es
      ? 'Todavía no. Revisa el paso ' + (bad+1) + ': ¿ya tienes lo que ese trazo necesita?'
      : 'Not yet. Check step ' + (bad+1) + ': do you already have what that stroke needs?';
  };
  render();
}

/* ── graded problem builder: pushes and renders one card inline (Rule 1/5) ── */
function addProblem(rng, spec){
  var sh = shuffleOpts(spec.options, spec.correct, rng);
  problems.push({
    title: spec.title,
    questionText: spec.q,
    fn: '',
    options: sh.opts,
    correctIdx: sh.idx,
    hint: spec.hint,
    explanation: spec.exp,
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  });
  var idx = problems.length - 1;
  buildOneCard(problems[idx], idx);
}

  addSection(C + '3',
    es ? 'Regla y compás, según lo que te den' : 'Ruler and compass, according to what you are given',
    es
    ? '<p>La construcción cambia según la información de partida. Si te dan el radio, el hexágono sale casi solo: al mantener la abertura del compás igual al radio, cada cuerda que trazas mide lo mismo que el radio, así que el triángulo formado por dos radios y esa cuerda tiene sus tres lados iguales.</p>'+
      '<p>Si lo que te dan es un diámetro y quieres un cuadrado, necesitas dos radios perpendiculares al diámetro: los consigues trazando arcos iguales desde los dos extremos y uniendo sus cruces. Y si ya tienes un polígono inscrito, partir cada ángulo central en dos duplica el número de lados: del cuadrado sale el octágono, del hexágono el dodecágono.</p>'+
      '<div class="callout"><p><strong>Un mismo compás, tres caminos:</strong> partir de la abertura igual al radio, partir de un diámetro y su mediatriz, o partir de un polígono ya trazado y bisecar sus ángulos centrales.</p></div>'
    : '<p>The construction changes with the information you start from. If you are given the radius, the hexagon almost builds itself: keeping the compass opening equal to the radius, every chord you draw measures the same as the radius, so the triangle formed by two radii and that chord has three equal sides.</p>'+
      '<p>If what you are given is a diameter and you want a square, you need two radii perpendicular to that diameter: you get them by drawing equal arcs from both ends and joining their crossings. And if you already have an inscribed polygon, cutting each central angle in two doubles the number of sides: the square gives the octagon, the hexagon gives the dodecagon.</p>'+
      '<div class="callout"><p><strong>One compass, three routes:</strong> start from an opening equal to the radius, start from a diameter and its perpendicular bisector, or start from a polygon already drawn and bisect its central angles.</p></div>');

  addSection(C + '4',
    es ? 'Teselados: cerrar la vuelta sin huecos' : 'Tessellations: closing the turn with no gaps',
    es
    ? '<p>Un teselado cubre el plano con piezas que no dejan huecos ni se traslapan. La condición está siempre en los vértices: las piezas que llegan a un mismo punto tienen que completar exactamente una vuelta, ni un grado de más ni uno de menos.</p>'+
      '<p>Por eso, de todos los polígonos regulares, solo tres cubren el plano ellos solos: el triángulo equilátero, el cuadrado y el hexágono regular. Sus ángulos interiores caben un número entero de veces en la vuelta completa. Los demás siempre dejan un sobrante.</p>'
    : '<p>A tessellation covers the plane with tiles that leave no gaps and never overlap. The condition always lives at the vertices: the tiles meeting at one point must complete exactly one turn, not a degree more and not a degree less.</p>'+
      '<p>That is why, out of all regular polygons, only three cover the plane on their own: the equilateral triangle, the square and the regular hexagon. Their interior angles fit a whole number of times into the full turn. The rest always leave something over.</p>');

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Polígonos Regulares con Regla y Compás';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
