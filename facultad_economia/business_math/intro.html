<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Algebra for Business · Week 1 · ALEXIS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --green:      #1a4a8a;
  --green-dark: #0f2d5a;
  --green-bg:   #e8edf5;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #1e7d45;
  --ok-bg:      rgba(30,125,69,.12);
  --bad:        #c0321a;
  --bad-bg:     rgba(192,50,26,.10);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:#18181a; --surface:#242420; --surface2:#2e2e28; --border:#3a3830;
  --text:#e8e4da; --text2:#b0aa9e; --text3:#7a7468; --shadow:0 4px 20px rgba(0,0,0,.35);
  --green:#4a7abf; --green-dark:#7aaae0; --green-bg:#0e1e38;
  --gold:#d4b86a; --gold-bg:#241e0e;
  --ok:#4a9a6f; --ok-bg:rgba(74,154,111,.12);
  --bad:#c05030; --bad-bg:rgba(192,80,48,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.65}

/* WELCOME */
#welcomeScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.wcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:2.4rem 2rem;width:100%;max-width:460px;text-align:center;border-top:4px solid var(--gold)}
.wlogos{display:flex;justify-content:center;align-items:center;gap:1.4rem;margin-bottom:1.6rem;padding-bottom:1.6rem;border-bottom:1px solid var(--border)}
.wlogos img{height:50px;width:auto;object-fit:contain}
.wlogsep{width:1px;height:40px;background:var(--border);flex-shrink:0}
.wtitle{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.25rem}
.wcourse{font-size:.78rem;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1.6rem}
.flabel{display:block;font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;text-align:left}
.finput{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:.95rem;font-family:inherit;margin-bottom:.9rem;transition:border-color .18s}
.finput:focus{outline:none;border-color:var(--green)}
.sbtn{width:100%;padding:.85rem;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .18s}
.sbtn:hover{background:var(--green-dark)}
.serr{min-height:1.2rem;font-size:.82rem;color:var(--bad);margin-top:.4rem}
.wfoot{margin-top:1rem;font-size:.75rem;color:var(--text3)}

/* LESSON */
#lessonScreen{display:none}
.stickybar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:.55rem 1.2rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hsep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.htitle{font-family:'Crimson Pro',serif;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.hchip{font-size:.7rem;background:var(--green-bg);color:var(--green-dark);padding:.2rem .65rem;border-radius:20px;white-space:nowrap;flex-shrink:0}
.tbtn{background:none;border:1px solid var(--border);border-radius:7px;padding:.28rem .55rem;cursor:pointer;font-size:.82rem;color:var(--text2);flex-shrink:0}
.progbar{height:3px;background:var(--border);position:sticky;top:47px;z-index:99}
.progfill{height:100%;background:var(--green);width:0%;transition:width .4s}
.lang-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang-btn{padding:.28rem .7rem;font-size:.72rem;font-weight:600;letter-spacing:.06em;cursor:pointer;border:none;background:none;color:var(--text3);font-family:inherit;transition:all .15s}
.lang-btn.active{background:var(--green);color:#fff}

/* CONTENT */
.lbody{max-width:760px;margin:0 auto;padding:2rem 1.2rem 4rem}
.section{opacity:0;transform:translateY(16px);transition:opacity .48s,transform .48s;margin-bottom:2.8rem}
.section.vis{opacity:1;transform:none}
.stag{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.45rem}
.section h2{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.7rem}
.section p{color:var(--text2);margin-bottom:.8rem}
.callout{background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1rem 0}
.callout strong{color:var(--green-dark)}
.callout p{margin-bottom:0}

/* RULE CARDS */
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.75rem;margin:1.1rem 0}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem;border-top:3px solid var(--green);overflow-x:auto}
.rname{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.35rem}
.rval{font-size:.88rem;color:var(--green-dark);font-weight:600;margin-bottom:.3rem;font-family:'IBM Plex Mono',monospace}
.rnote{font-size:.76rem;color:var(--text3)}

/* EXAMPLE BLOCK */
.gcrd{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.3rem;margin:.9rem 0}
.gcrd p{margin-bottom:.5rem}

/* FORMULA HIGHLIGHT */
.fbox{background:var(--gold-bg);border:1.5px solid rgba(201,168,76,.4);border-radius:10px;padding:1rem 1.2rem;margin:.9rem 0;text-align:center}
.fbox .formula{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;color:var(--green-dark);font-weight:600;margin-bottom:.3rem}
.fbox .flab{font-size:.74rem;color:var(--text3)}

/* DRAG-DROP */
.dd-pool{display:flex;flex-wrap:wrap;gap:.5rem;padding:.9rem;background:var(--surface2);border-radius:10px;border:2px dashed var(--border);margin:.75rem 0;min-height:52px}
.dd-chip{background:var(--green);color:#fff;border-radius:6px;padding:.32rem .8rem;font-size:.82rem;font-weight:500;cursor:grab;user-select:none;transition:opacity .15s,transform .1s;border:2px solid transparent}
.dd-chip:active{cursor:grabbing;transform:scale(1.06)}
.dd-chip.used{opacity:.3;cursor:default;pointer-events:none}
.dd-chip.gold{background:var(--gold);color:#1a1a00}
.dd-bins{display:grid;gap:.65rem;margin:.75rem 0}
.dd-bins.cols2{grid-template-columns:1fr 1fr}
.dd-bins.cols3{grid-template-columns:repeat(3,1fr)}
.dd-bin{min-height:70px;border-radius:10px;border:2px dashed var(--border);padding:.6rem .8rem;background:var(--surface);transition:background .16s,border-color .16s}
.dd-bin.over{background:var(--green-bg);border-color:var(--green)}
.dd-bin h4{font-size:.72rem;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.45rem;pointer-events:none}
.dd-bin .dd-chip{margin:.2rem .2rem .2rem 0;cursor:default}
.dd-bin .dd-chip.ok-chip{background:var(--ok);border-color:var(--ok)}
.dd-bin .dd-chip.bad-chip{background:var(--bad);border-color:var(--bad)}
.dd-actions{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
.dd-check{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.1rem;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.dd-reset{background:none;border:1.5px solid var(--border);color:var(--text2);border-radius:8px;padding:.45rem .9rem;font-size:.82rem;cursor:pointer;font-family:inherit}
.dd-fb{font-size:.82rem;margin-top:.55rem;padding:.55rem .85rem;border-radius:8px;display:none;line-height:1.5}
.dd-fb.show{display:block}
.dd-fb.ok{background:var(--ok-bg);color:var(--ok)}
.dd-fb.bad{background:var(--bad-bg);color:var(--bad)}
.dd-fb.part{background:var(--gold-bg);color:#7a5800}

/* BUILD-AN-EQUATION ACTIVITY */
.eq-builder{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:1.2rem 1.4rem;margin:.9rem 0}
.eq-scenario{font-size:.9rem;color:var(--text2);margin-bottom:1rem;line-height:1.6;padding:.8rem 1rem;background:var(--gold-bg);border-radius:8px;border-left:3px solid var(--gold)}
.eq-slots{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.eq-slot{min-width:80px;min-height:36px;border:2px dashed var(--border);border-radius:7px;padding:.3rem .6rem;font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--text3);text-align:center;background:var(--surface2);transition:all .18s}
.eq-slot.filled{background:var(--green-bg);border-color:var(--green);color:var(--green-dark);font-weight:600}
.eq-slot.over{background:var(--gold-bg);border-color:var(--gold)}
.eq-op{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--text3);padding:0 .1rem}
.eq-pool{display:flex;flex-wrap:wrap;gap:.45rem;margin:.6rem 0}

/* SLIDER ACTIVITY */
.slider-act{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:1.2rem 1.4rem;margin:.9rem 0}
.slider-scenario{font-size:.88rem;color:var(--text2);margin-bottom:.8rem;line-height:1.6}
.slider-row{display:flex;align-items:center;gap:.8rem;margin:.6rem 0;flex-wrap:wrap}
.slider-label{font-size:.8rem;color:var(--text3);min-width:80px}
.slider-input{flex:1;min-width:120px;accent-color:var(--green)}
.slider-val{font-family:'IBM Plex Mono',monospace;font-size:.88rem;color:var(--green-dark);font-weight:600;min-width:60px;text-align:right}
.slider-result{font-size:.9rem;padding:.7rem 1rem;border-radius:8px;margin-top:.8rem;background:var(--green-bg);color:var(--green-dark);font-weight:600;display:none}
.slider-result.show{display:block}

/* CASE BOX */
.case-box{background:var(--gold-bg);border:1.5px solid rgba(201,168,76,.4);border-radius:12px;padding:1.2rem 1.4rem;margin:.85rem 0}
.case-q{font-size:.88rem;color:var(--text2);margin-bottom:.65rem;line-height:1.6}
.case-q strong{color:var(--text)}
.case-input{width:100%;padding:.6rem .85rem;border:1.5px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;background:var(--surface);color:var(--text);margin-bottom:.45rem;transition:border-color .18s}
.case-input:focus{outline:none;border-color:var(--green)}
.case-reveal{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.1rem;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:.3rem}
.case-answer{display:none;margin-top:.65rem;background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 9px 9px 0;padding:.75rem 1rem;font-size:.83rem;color:var(--text2);line-height:1.55}
.case-answer.show{display:block}
.case-answer strong{color:var(--green-dark)}

/* RESULT */
.dlbtn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:.8rem 1.8rem;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .18s}
.dlbtn:hover{background:var(--green-dark)}
.dlbtn:disabled{opacity:.6;cursor:wait}

@media(max-width:600px){
  .wcard{padding:1.6rem 1.1rem}
  .dd-bins.cols2,.dd-bins.cols3{grid-template-columns:1fr 1fr}
  .lbody{padding:1.2rem .7rem 3rem}
  .section h2{font-size:1.3rem}
  .htitle{display:none}
  .lang-btn{padding:.26rem .48rem;font-size:.68rem}
  .eq-slots{gap:.35rem}
}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" style="border-bottom:none;margin-bottom:.8rem;padding-bottom:.4rem">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1">ALEXIS</div>
    </div>
    <div class="wtitle" id="w-title">Basic Algebra for Business</div>
    <div class="wcourse" id="w-course">Business Math · Week 1</div>
    <label class="flabel" for="sName" id="lbl-name">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name">
    <label class="flabel" for="sGroup" id="lbl-group">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 2B" autocomplete="off">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Let's go →</button>
    <div class="serr" id="startErr"></div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>.lbt{font-family:'Crimson Pro',serif;font-weight:700;letter-spacing:.1em;fill:var(--green);font-size:28px}.lbl{stroke:var(--gold);stroke-width:2.5}.lba{fill:var(--gold)}</style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hsep"></div>
    <div class="htitle" id="h-title">Basic Algebra for Business</div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>
  <div class="section" id="s_results" style="display:none">
    <div style="text-align:center;padding:2rem 1rem">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">⬇ &nbsp;<span id="pdf-lbl">Download results as PDF</span></button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// CORE STATE
// ═══════════════════════════════════════
var LANG = 'en';
var studentName = '', studentGroup = '';
var activityScores = { dd1: null, eq1: null, slider1: null, case1: null };

function setLang(l) {
  LANG = l;
  document.getElementById('btn-en').className = 'lang-btn' + (l==='en'?' active':'');
  document.getElementById('btn-es').className = 'lang-btn' + (l==='es'?' active':'');
  buildLesson();
}

function toggleTheme() {
  var d = document.documentElement;
  var dark = d.getAttribute('data-theme') === 'dark';
  d.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = dark ? '🌙' : '☀️';
}

function startLesson() {
  var n = document.getElementById('sName').value.trim();
  var g = document.getElementById('sGroup').value.trim();
  var err = document.getElementById('startErr');
  if (!n) { err.textContent = LANG==='en' ? 'Please enter your name.' : 'Ingresa tu nombre.'; return; }
  if (!g) { err.textContent = LANG==='en' ? 'Please enter your group.' : 'Ingresa tu grupo.'; return; }
  studentName = n; studentGroup = g;
  err.textContent = '';
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display = 'block';
  document.getElementById('studentChip').textContent = n + ' · ' + g;
  buildLesson();
  setTimeout(observeSections, 200);
}

// ═══════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════
function updateProgress() {
  var scores = Object.values(activityScores);
  var done = scores.filter(function(s){ return s !== null; }).length;
  var pct = Math.round((done / scores.length) * 100);
  document.getElementById('progFill').style.width = pct + '%';
  if (done === scores.length) {
    var res = document.getElementById('s_results');
    res.style.display = 'block';
    setTimeout(function(){ res.classList.add('vis'); }, 100);
  }
}

// ═══════════════════════════════════════
// INTERSECTION OBSERVER (fade-in)
// ═══════════════════════════════════════
function observeSections() {
  if (!window.IntersectionObserver) {
    document.querySelectorAll('.section').forEach(function(s){ s.classList.add('vis'); });
    return;
  }
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.08 });
  document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
}

// ═══════════════════════════════════════
// DRAG-DROP HELPERS
// ═══════════════════════════════════════
// ── DRAG & TAP ENGINE (move-based, no cloning) ──
var _dragged = null;
var _tapped  = null;

function ddStart(el) {
  _dragged = el;
  // Deselect any tapped chip
  if (_tapped) { _tapped.style.outline = ''; _tapped = null; }
  setTimeout(function(){ el.style.opacity = '.4'; }, 0);
}
function ddEnd(el) { el.style.opacity = ''; _dragged = null; }

function ddOver(e)  { e.preventDefault(); e.currentTarget.classList.add('over'); }
function ddLeave(e) { e.currentTarget.classList.remove('over'); }

// Drop onto a named bin
function ddDrop(e, binId) {
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  if (!_dragged) return;
  var bin = document.getElementById(binId);
  if (!bin) return;
  _dragged.style.opacity = '';
  bin.appendChild(_dragged);
  _dragged = null;
}

// Drop back onto the pool (drag-to-remove)
function ddDropPool(e, poolId) {
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  if (!_dragged) return;
  var pool = document.getElementById(poolId);
  if (!pool) return;
  _dragged.style.opacity = '';
  pool.appendChild(_dragged);
  _dragged = null;
}

// Tap on a chip
function chipTap(el, e) {
  e.stopPropagation();
  // If chip is already inside a bin → return it to its pool
  if (el.parentElement && el.parentElement.classList.contains('dd-bin')) {
    if (_tapped) { _tapped.style.outline = ''; _tapped = null; }
    // Find sibling pool: walk up to dd-bins wrapper, then find dd-pool sibling
    var binsEl = el.parentElement.parentElement; // dd-bins div
    var poolEl = null;
    if (binsEl) {
      var sibs = binsEl.parentElement ? binsEl.parentElement.childNodes : [];
      for (var i = 0; i < sibs.length; i++) {
        if (sibs[i].classList && sibs[i].classList.contains('dd-pool')) { poolEl = sibs[i]; break; }
      }
    }
    if (poolEl) { poolEl.appendChild(el); }
    return;
  }
  // Chip is in the pool — select / deselect
  if (_tapped === el) { _tapped.style.outline = ''; _tapped = null; return; }
  if (_tapped) { _tapped.style.outline = ''; }
  _tapped = el;
  el.style.outline = '2px solid var(--gold)';
}

// Tap on a bin
function binTap(binId) {
  if (!_tapped) return;
  var bin = document.getElementById(binId);
  if (!bin) return;
  _tapped.style.outline = '';
  bin.appendChild(_tapped);
  _tapped = null;
}

// ═══════════════════════════════════════
// SEEDED SHUFFLE
// ═══════════════════════════════════════
function seededRng(seed) {
  var s = seed;
  return function(){ s=(s*16807+0)%2147483647; return (s-1)/2147483646; };
}
function shuffle(arr, rng) {
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(rng()*i+1); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
var rng = seededRng(Date.now()%999+1);

// ═══════════════════════════════════════
// BUILD LESSON
// ═══════════════════════════════════════
function buildLesson() {
  var lb = document.getElementById('lessonBody');
  lb.innerHTML = '';
  activityScores = { dd1: null, eq1: null, slider1: null, case1: null };
  updateProgress();
  var es = LANG === 'es';

  // ───────────────────────────────────────
  // SECTION 1 — What is algebra doing here?
  // ───────────────────────────────────────
  var s1 = document.createElement('div');
  s1.className = 'section';
  s1.innerHTML =
    '<div class="stag">'+(es?'Concepto 1 de 4':'Concept 1 of 4')+'</div>'+
    '<h2>'+(es?'¿Por qué álgebra en los negocios?':'Why algebra in business?')+'</h2>'+
    '<p>'+(es?
      'Antes de calcular cualquier cosa — un precio, una ganancia, una proyección — necesitas un <strong>lenguaje para escribir relaciones entre cantidades</strong>. Eso es el álgebra. Una ecuación de negocios no es abstracta: es una frase sobre dinero, traducida a símbolos.':
      'Before calculating anything — a price, a profit, a forecast — you need a <strong>language to express relationships between quantities</strong>. That is algebra. A business equation is not abstract: it is a sentence about money, translated into symbols.')+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard">'+
        '<div class="rname">Variable</div>'+

  lb.appendChild(act3);
  updateSlider();

  // ───────────────────────────────────────
  // SECTION 4 — Business vocabulary
  // ───────────────────────────────────────
  var s4 = document.createElement('div');
  s4.className = 'section';
  s4.innerHTML =
    '<div class="stag">'+(es?'Concepto 4 de 4':'Concept 4 of 4')+'</div>'+
    '<h2>'+(es?'El vocabulario del álgebra de negocios':'The vocabulary of business algebra')+'</h2>'+
    '<p>'+(es?
      'Las mismas operaciones algebraicas aparecen en finanzas, logística y mercadotecnia, pero con nombres distintos. Reconocer la estructura te permite transferir lo que aprendes.':
      'The same algebraic operations appear in finance, logistics, and marketing, but with different labels. Recognizing the structure lets you transfer what you learn.')+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">Revenue (Ingreso)</div><div class="rval">R = p · q</div><div class="rnote">'+(es?'Precio por unidad multiplicado por cantidad vendida.':'Price per unit × quantity sold.')+'</div></div>'+
      '<div class="rcard"><div class="rname">Total Cost (Costo Total)</div><div class="rval">C = F + v·q</div><div class="rnote">'+(es?'Costo fijo más costo variable unitario por cantidad.':'Fixed cost + variable cost per unit × quantity.')+'</div></div>'+
      '<div class="rcard"><div class="rname">Profit (Ganancia)</div><div class="rval">P = R − C</div><div class="rnote">'+(es?'Ingreso menos costo total.':'Revenue minus total cost.')+'</div></div>'+
      '<div class="rcard"><div class="rname">Break-even (Equilibrio)</div><div class="rval">q* = F ÷ (p−v)</div><div class="rnote">'+(es?'Unidades necesarias para que P = 0.':'Units needed so that P = 0.')+'</div></div>'+
    '</div>';
  lb.appendChild(s4);

  // ─── ACTIVITY 4: Integrative case ───
  var act4 = document.createElement('div');
  act4.className = 'section';
  act4.id = 'act4';
  act4.innerHTML =
    '<div class="stag">'+(es?'Actividad 4 de 4 · Caso integrador':'Activity 4 of 4 · Case study')+'</div>'+
    '<h2>'+(es?'Tú eres el analista':'You are the analyst')+'</h2>'+
    '<p style="margin-bottom:.9rem">'+(es?
      'Lee la situación, escribe tu respuesta, y luego revela la solución. No hay respuesta única en la reflexión — lo que importa es que tu razonamiento sea algebraicamente correcto.':
      'Read the situation, type your answer, then reveal the solution. There is no single correct reflection — what matters is that your reasoning is algebraically sound.')+'</p>'+

    '<div class="case-box">'+
      '<div class="case-q"><strong>'+(es?'Situación:':'Situation:')+'</strong><br>'+
        (es?
          'Una tienda en línea vende camisetas. El precio de venta es $250 por pieza. El costo de producción es $80 por pieza, y los costos fijos mensuales (plataforma, bodega, etc.) son $6,800.':
          'An online store sells t-shirts at $250 each. Production cost is $80 per shirt, and monthly fixed costs (platform, storage, etc.) are $6,800.')+
      '</div>'+
      '<div class="case-q"><strong>'+(es?'Pregunta 1:':'Question 1:')+'</strong> '+(es?
        'Escribe la ecuación de ganancia en función de la cantidad vendida (q).':
        'Write the profit equation as a function of quantity sold (q).')+'</div>'+
      '<textarea class="case-input" rows="2" placeholder="'+(es?'P = ...':'P = ...')+'"></textarea>'+
      '<button class="case-reveal" onclick="reveal(\'ans1\')">'+( es?'Ver solución':'Reveal solution')+'</button>'+
      '<div class="case-answer" id="ans1">'+
        '<strong>'+(es?'Solución:':'Solution:')+'</strong><br>'+
        'P = (250−80)·q − 6800<br>'+
        '<strong>P = 170q − 6800</strong>'+
      '</div>'+
    '</div>'+

    '<div class="case-box">'+
      '<div class="case-q"><strong>'+(es?'Pregunta 2:':'Question 2:')+'</strong> '+(es?
        '¿Cuántas camisetas necesita vender por mes para no perder dinero?':
        'How many shirts must the store sell per month to break even?')+'</div>'+
      '<textarea class="case-input" rows="2" placeholder="'+(es?'q* = ...':'q* = ...')+'"></textarea>'+
      '<button class="case-reveal" onclick="reveal(\'ans2\')">'+( es?'Ver solución':'Reveal solution')+'</button>'+
      '<div class="case-answer" id="ans2">'+
        '<strong>'+(es?'Punto de equilibrio:':'Break-even:')+'</strong><br>'+
        '0 = 170q − 6800<br>'+
        'q* = 6800 ÷ 170<br>'+
        '<strong>q* = 40 '+(es?'camisetas/mes':'shirts/month')+'</strong>'+
      '</div>'+
    '</div>'+

    '<div class="case-box">'+
      '<div class="case-q"><strong>'+(es?'Reflexión:':'Reflection:')+'</strong> '+(es?
        'Si la tienda reduce su costo de producción a $60 por pieza sin cambiar el precio, ¿cómo cambia el punto de equilibrio? ¿Por qué crees que pasa eso?':
        'If the store reduces production cost to $60 per shirt without changing the price, what happens to the break-even point? Why do you think that is?')+'</div>'+
      '<textarea class="case-input" rows="3" placeholder="'+(es?'Mi análisis...':'My analysis...')+'"></textarea>'+
      '<button class="case-reveal" onclick="reveal(\'ans3\')">'+( es?'Ver solución':'Reveal solution')+'</button>'+
      '<div class="case-answer" id="ans3">'+
        '<strong>'+(es?'Análisis:':'Analysis:')+'</strong><br>'+
        (es?
          'q* = 6800 ÷ (250−60) = 6800 ÷ 190 ≈ 35.8 → 36 camisetas. El equilibrio baja porque el margen por unidad (p−v) es mayor. Cada camiseta aporta más a cubrir los costos fijos.':
          'q* = 6800 ÷ (250−60) = 6800 ÷ 190 ≈ 35.8 → 36 shirts. Break-even decreases because the margin per unit (p−v) is larger. Each shirt contributes more toward covering fixed costs.')+
      '</div>'+
    '</div>';
  lb.appendChild(act4);

  setTimeout(observeSections, 100);
}

// ═══════════════════════════════════════
// ACTIVITY 1 — DD CHECK
// ═══════════════════════════════════════
function checkDD1(){
  var cats = ['var','const','expr','eq'];
  var correct = 0, total = 0;
  cats.forEach(function(cat){
    document.getElementById('bin1-'+cat).querySelectorAll('.dd-chip').forEach(function(chip){
      total++;
      var ok = chip.dataset.ans === cat;
      chip.classList.remove('ok-chip','bad-chip');
      chip.classList.add(ok?'ok-chip':'bad-chip');
      chip.style.pointerEvents = 'none';
      if(ok) correct++;
    });
  });
  var fb = document.getElementById('fb1');
  var es = LANG==='es';
  if(total < 8){
    fb.className='dd-fb show part';
    fb.textContent=(es?'⚠ Coloca todas las fichas primero.':'⚠ Place all chips before checking.');
    return;
  }
  if(correct===total){
    fb.className='dd-fb show ok';
    fb.textContent=(es?'✓ ¡Perfecto! Todos los términos están correctamente clasificados.':'✓ Perfect! All terms are correctly classified.');
  } else {
    fb.className='dd-fb show bad';
    fb.textContent=(es?'Obtuviste '+correct+' de '+total+' correctos. Las fichas en rojo están en el grupo equivocado.':'You got '+correct+' of '+total+' correct. Red chips are in the wrong category.');
  }
  activityScores.dd1 = correct/total;
  updateProgress();
  document.querySelector('#act1 .dd-check').disabled = true;
}
function resetDD1(){
  var pool = document.getElementById('pool1');
  ['var','const','expr','eq'].forEach(function(cat){
    document.getElementById('bin1-'+cat).querySelectorAll('.dd-chip').forEach(function(c){
      c.classList.remove('ok-chip','bad-chip');
      c.style.opacity='1'; c.style.pointerEvents=''; c.style.outline='';
      pool.appendChild(c);
    });
  });
  document.getElementById('fb1').className='dd-fb';
  var btn=document.querySelector('#act1 .dd-check'); if(btn) btn.disabled=false;
  activityScores.dd1=null; updateProgress();
}

// ═══════════════════════════════════════
// ACTIVITY 2 — EQUATION BUILDER
// ═══════════════════════════════════════
function eqOver(e){ e.preventDefault(); e.currentTarget.classList.add('over'); }
function eqLeave(e){ e.currentTarget.classList.remove('over'); }
function eqDrop(e, idx){
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  if(!_dragged || idx===2) return;
  var val = _dragged.dataset.val;
  // Return previous occupant to pool if any
  var slot = document.getElementById('eqs-'+idx);
  if(window._eqSlots[idx]){
    var prev = document.createElement('div');
    prev.className='dd-chip';
    prev.draggable=true;
    prev.dataset.val=window._eqSlots[idx];
    prev.style.fontFamily="'IBM Plex Mono',monospace";
    prev.textContent=window._eqSlots[idx];
    prev.setAttribute('ondragstart','ddStart(this)');
    prev.setAttribute('ondragend','ddEnd(this)');
    prev.setAttribute('onclick','chipTap(this,event)');
    document.getElementById('eq-pool').appendChild(prev);
  }
  window._eqSlots[idx]=val;
  slot.textContent=val;
  slot.classList.add('filled');
  _dragged.remove();
  _dragged=null;
}
function eqSlotTap(idx){
  if(idx===2) return;
  if(!_tapped) return;
  var val=_tapped.dataset.val;
  if(window._eqSlots[idx]){
    var prev=document.createElement('div');
    prev.className='dd-chip'; prev.draggable=true;
    prev.dataset.val=window._eqSlots[idx];
    prev.style.fontFamily="'IBM Plex Mono',monospace";
    prev.textContent=window._eqSlots[idx];
    prev.setAttribute('ondragstart','ddStart(this)');
    prev.setAttribute('ondragend','ddEnd(this)');
    prev.setAttribute('onclick','chipTap(this,event)');
    document.getElementById('eq-pool').appendChild(prev);
  }
  window._eqSlots[idx]=val;
  var slot=document.getElementById('eqs-'+idx);
  slot.textContent=val; slot.classList.add('filled');
  _tapped.style.outline=''; _tapped.remove(); _tapped=null;
}
function checkEQ1(){
  var s=window._eqSlots; var c=window._eqCorrect; var es=LANG==='es';
  var fb=document.getElementById('fb2');
  if(!s[0]||!s[1]){
    fb.className='dd-fb show part';
    fb.textContent=(es?'⚠ Completa ambos términos primero.':'⚠ Fill both slots first.');
    return;
  }
  // Accept either order — addition is commutative
  var ok = (s[0]===c[0]&&s[1]===c[1]) || (s[0]===c[1]&&s[1]===c[0]);
  if(ok){
    fb.className='dd-fb show ok';
    fb.textContent='✓ '+(es?'¡Correcto! La ecuación es: ':'Correct! The equation is: ')+s[0]+' + '+s[1]+' = '+window._eqSlots[2]+'. → '+window._eqResult;
    activityScores.eq1=1;
  } else {
    fb.className='dd-fb show bad';
    fb.textContent=(es?'Eso no es exactamente correcto. Revisa qué representa cada parte del problema.':'That\'s not quite right. Review what each part of the problem represents.');
    activityScores.eq1=0.3;
  }
  updateProgress();
  document.querySelector('#act2 .dd-check').disabled=true;
}
function resetEQ1(){
  window._eqSlots=['','','1260'];
  ['eqs-0','eqs-1'].forEach(function(id,i){
    var s=document.getElementById(id);
    s.textContent=(LANG==='es'?'término '+(i+1):'term '+(i+1));
    s.classList.remove('filled');
  });
  document.getElementById('fb2').className='dd-fb';
  var btn=document.querySelector('#act2 .dd-check'); if(btn) btn.disabled=false;
  activityScores.eq1=null; updateProgress();
  buildLesson(); // rebuild to restore pool
}

// ═══════════════════════════════════════
// ACTIVITY 3 — SLIDER
// ═══════════════════════════════════════
function updateSlider(){
  var q=parseInt(document.getElementById('sl-q').value);
  var f=parseInt(document.getElementById('sl-f').value);
  document.getElementById('sl-q-val').textContent=q;
  document.getElementById('sl-f-val').textContent='$'+f.toLocaleString();
  var p=120, v=30;
  var profit=(p-v)*q-f;
  var res=document.getElementById('slider-result');
  var es=LANG==='es';
  res.style.display='block';
  if(profit>0){
    res.style.background='var(--ok-bg)'; res.style.color='var(--ok)';
    res.innerHTML='P = (120−30)·'+q+' − '+f+' = <strong>$'+profit.toLocaleString()+'</strong> &nbsp;✓ '+(es?'Ganancia':'Profit');
  } else if(profit===0){
    res.style.background='var(--gold-bg)'; res.style.color='#7a5800';
    res.innerHTML='P = (120−30)·'+q+' − '+f+' = <strong>$0</strong> &nbsp;↔ '+(es?'Punto de equilibrio':'Break-even');
  } else {
    res.style.background='var(--bad-bg)'; res.style.color='var(--bad)';
    res.innerHTML='P = (120−30)·'+q+' − '+f+' = <strong>$'+profit.toLocaleString()+'</strong> &nbsp;✗ '+(es?'Pérdida':'Loss');
  }
  if(activityScores.slider1===null && q>0){
    activityScores.slider1=1;
    updateProgress();
  }
}

// ═══════════════════════════════════════
// ACTIVITY 4 — REVEAL
// ═══════════════════════════════════════
var _revealed=0;
function reveal(id){
  document.getElementById(id).classList.add('show');
  _revealed++;
  if(_revealed>=3 && activityScores.case1===null){
    activityScores.case1=1; updateProgress();
  }
}

// ═══════════════════════════════════════

    var jspdf=window.jspdf;

    doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);

    doc.setTextColor(198,214,232); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(new Date().toLocaleString(es?'es-MX':'en-US',{dateStyle:'long',timeStyle:'short'}),M,57);

    doc.text(es?'ALUMNO/A':'STUDENT',M+4,79);
    doc.text(es?'GRUPO':'GROUP',130,79);
    doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.text(studentName,M+4,87);
    doc.text(studentGroup,130,87);

    // ── SCORES ──
    var s1=activityScores.dd1!==null?Math.round(activityScores.dd1*10)+'/10':'-';
    var s2=activityScores.eq1!==null?(activityScores.eq1===1?'\u2713':'parcial'):'-';
    var s3=activityScores.slider1!==null?'\u2713':'-';
    var s4=activityScores.case1!==null?'3/3':'-';
    var done=Object.values(activityScores).filter(function(s){return s!==null;}).length;
    var total=4;
    var pct=Math.round(done/total*100);

    doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');

    var ry=142;
