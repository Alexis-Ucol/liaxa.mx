<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparación y Orden en la Recta Numérica — Matemáticas 1° Secundaria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a3a6b;   /* PRIMARY      */
  --green-dark: #0f2244;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institución" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Comparación y Orden en la Recta Numérica</div>
    <div class="wcourse" id="wcourse-el">Matemáticas 1° Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Tienes una sesión guardada.</strong><br>
      <span id="restoreSub">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Continuar</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Nueva sesión</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <!-- ── LIAXA FOOTER SVG ──────────────────────────────────────────────────
           When branding for an institution, replace the two hex color values
           below with the institution's PRIMARY and ACCENT colors respectively.
           PRIMARY  → stroke/fill on the chart line and LIAXA text
           ACCENT   → fill on the dot and stroke on the vertical bar
           ──────────────────────────────────────────────────────────────────── -->
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO_LEFT: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="hlogo-left"  src="" alt="Institución" style="display:none">
      <!-- LOGO_RIGHT: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="hlogo-right" src="" alt="Institución" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Comparación y Orden en la Recta Numérica</div>
    <div class="hsep"></div>
    <div class="halexis">
      <!-- ── LIAXA HEADER SVG — same color tokens as footer ── -->
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG — edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#cc243c',
  primaryDark:  '#480b14',
  primaryBg:    '#f6e7e9',
  accent:       '#fc0c24',
  accentBg:     '#ffdbdf',
  pBR: 204,  pBG: 36,  pBB: 60,
  pAR: 252, pAG: 12, pAB: 36,
  darkPrimary:     '#c74255',
  darkPrimaryDark: '#e87283',
  darkPrimaryBg:   '#3b0b12',

function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.getElementById('btn-es').classList.toggle('active', l === 'es');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.documentElement.setAttribute('lang', l);
  applyUIStrings();
  var ht = document.querySelector('.htitle');
  if (ht) ht.textContent = (l === 'es' ? 'Comparación y Orden en la Recta Numérica' : 'Comparison and Order on the Number Line');
  // Rebuild lesson in new language if already running (answers preserved)
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prevChoices = problems.map(function(p) { return p.studentChoice; });
    problems = [];
    answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    document.getElementById('s_results').style.display = 'none';
    document.getElementById('s_results').classList.remove('vis');
    var rng = seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group));
    buildLesson(rng);
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
    }, { threshold: 0.05 });
    document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
    prevChoices.forEach(function(choice, idx) {
      if (choice !== null && choice !== undefined) confirmMC(idx, choice);
    });
    if (answeredCount === problems.length && problems.length > 0) {
      document.getElementById('s_results').style.display = 'block';
      setTimeout(function() { document.getElementById('s_results').classList.add('vis'); }, 50);
    }
  }
}

  document.getElementById('lessonScreen').style.display  = 'block';

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   ATTEMPT COUNTER  (new attempt = new numbers)
   ================================================ */
function attKey(n, g) {
  return SCHOOL.ls + '__att__' + (n + '__' + g).replace(/\s+/g, '_');
}
function nextAttempt(n, g) {
  var k = attKey(n, g), v = 0;
  try { v = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  v++;
  try { localStorage.setItem(k, String(v)); } catch(e) {}
  return v;
}
function currentAttempt(n, g) {
  var k = attKey(n, g);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}

function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================

   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — doble toque para confirmar (Regla 8)
   Primer toque: resalta en dorado (pendiente).
   Segundo toque en la misma opción: confirma.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Segundo toque en la misma opción → confirmar
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>✓ ¡Correcto!</strong> ' : '<strong>✗ Incorrecto.</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // Primer toque → resaltar como pendiente, limpiar pendiente anterior
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Confirmación directa — usada por restoreSession para omitir el doble toque
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>✓ ¡Correcto!</strong> ' : '<strong>✗ Incorrecto.</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ================================================
   buildLesson — mat1_t02_g02

function buildLesson(rng) {
  var body = document.getElementById('lessonBody');
  var L = LANG;
  function ri(a,b){ return a+Math.floor(rng()*(b-a+1)); }
  function shuf(opts,cor){var a=opts.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return{opts:a,ci:a.indexOf(cor)};}

  function makeNL(nums, hl, w) {
    w = w||400; var h=56;
    var mn=Math.min.apply(null, nums.concat([-8]));
    var mx=Math.max.apply(null, nums.concat([8]));
    mn=Math.min(mn-2,-6); mx=Math.max(mx+2,6);
    var range=mx-mn;
    function toX(n){return 14+(n-mn)/range*(w-28);}
    var svg='<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:'+w+'px;display:block;margin:.6rem auto;">';
    svg+='<line x1="10" y1="28" x2="'+(w-10)+'" y2="28" stroke="var(--border)" stroke-width="2"/>';
    svg+='<polygon points="'+(w-10)+',28 '+(w-18)+',23 '+(w-18)+',33" fill="var(--border)"/>';
    for(var n=Math.ceil(mn);n<=Math.floor(mx);n++){
      var x=toX(n); var iz=(n===0); var isH=hl&&hl.indexOf(n)>=0;
      var col=iz?'var(--gold)':isH?'var(--green)':'var(--border)';
      var tc=iz?'var(--gold)':isH?'var(--green-dark)':'var(--text3)';
      var fw=isH?'700':'400';
      svg+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="34" stroke="'+col+'" stroke-width="'+(iz||isH?2.5:1.5)+'"/>';
      svg+='<text x="'+x+'" y="50" text-anchor="middle" font-size="9" fill="'+tc+'" font-weight="'+fw+'">'+(n>0?'+':'')+n+'</text>';
    }
    if(hl){hl.forEach(function(n){if(n>=mn&&n<=mx){var x=toX(n);svg+='<circle cx="'+x+'" cy="28" r="5" fill="var(--green)" opacity="0.85"/>';}});}
    svg+='</svg>';
    return svg;
  }

  /* ── SECTION 1 ── */
  var ex1a=ri(-8,-2), ex1b=ri(1,8);
  var s1=document.createElement('div'); s1.className='section';
  s1.innerHTML=
    '<div class="stag">'+(L==='es'?'Concepto 1':'Concept 1')+'</div>' +

    '<p>'+(L==='es'?'La recta numérica es como una regla infinita. El cero está en el centro: positivos a la derecha, negativos a la izquierda.':'The number line is like an infinite ruler. Zero is in the center: positives to the right, negatives to the left.')+'</p>' +
    makeNL([ex1a,ex1b],[ex1a,ex1b]) +
    '<div class="callout"><strong>'+(L==='es'?'Regla de comparación:':'Comparison rule:')+'</strong> '+(L==='es'?'En la recta numérica, el número que está más a la <em>derecha</em> es mayor. Si A está a la derecha de B, entonces A &gt; B.':'On the number line, the number further to the <em>right</em> is greater. If A is to the right of B, then A &gt; B.')+'</div>';
  body.appendChild(s1);

  /* ── Compare widget ── */
  var pairs=[]; for(var pi=0;pi<3;pi++){var aa=ri(-9,9),bb=ri(-9,9); while(bb===aa)bb=ri(-9,9); pairs.push([aa,bb]);}
  window._pairs=pairs; window._psc=[null,null,null]; window._pcPend=[null,null,null];
  var csec=document.createElement('div'); csec.className='section'; csec.id='cmpsec';
  var ch=
    '<div class="stag">'+(L==='es'?'Interactivo':'Interactive')+'</div>' +
    '<h2 style="font-size:1.2rem;margin-bottom:.5rem">⚖️ '+(L==='es'?'Compara: Selecciona el Símbolo Correcto':'Compare: Select the Correct Symbol')+'</h2>' +
    '<p>'+(L==='es'?'Toca el símbolo correcto para cada par de números.':'Tap the correct symbol for each pair of numbers.')+'</p>';
  pairs.forEach(function(p,i){
    var cor=p[0]>p[1]?'>':p[0]<p[1]?'<':'=';
    ch+='<div style="margin-bottom:1rem"><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:center;margin:.8rem 0">' +
      '<div style="background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:.7rem;text-align:center;font-family:\'IBM Plex Mono\',monospace;font-size:1.3rem;font-weight:700">'+p[0]+'</div>' +
      '<div style="display:flex;flex-direction:column;gap:.35rem;align-items:center">' +
        '<button style="padding:.28rem .6rem;border-radius:7px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);font-size:.95rem;font-weight:700;cursor:pointer;font-family:\'IBM Plex Mono\',monospace;min-width:42px;text-align:center" id="cb'+i+'lt" onclick="cmpClick('+i+',\'<\',\''+cor+'\')">&lt;</button>' +
        '<button style="padding:.28rem .6rem;border-radius:7px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);font-size:.95rem;font-weight:700;cursor:pointer;font-family:\'IBM Plex Mono\',monospace;min-width:42px;text-align:center" id="cb'+i+'gt" onclick="cmpClick('+i+',\'>\',\''+cor+'\')">&gt;</button>' +

  });
  ch+='<div id="cmpsum"></div>'; csec.innerHTML=ch; body.appendChild(csec);

  /* ── Problem 1 ── */
  var n1a=ri(-9,-1), n1b=n1a+ri(1,Math.min(-n1a,8));

  var p1opts=[n1a+' < '+n1b, n1a+' > '+n1b, n1a+' = '+n1b, '|'+n1a+'| > |'+n1b+'|'];

    showWork:false, studentChoice:null, pendingChoice:null
  });
  buildOneCard(problems[problems.length-1], problems.length-1);

  /* ── SECTION 2 ── */
  var s2=document.createElement('div'); s2.className='section';
  s2.innerHTML=
    '<div class="stag">'+(L==='es'?'Concepto 2':'Concept 2')+'</div>' +
    '<h2>📐 '+(L==='es'?'Reglas de Orden con Signo':'Rules for Ordering Signed Numbers')+'</h2>' +
    '<div class="callout"><strong>'+(L==='es'?'4 reglas esenciales:':'4 essential rules:')+'</strong><br>' +
    (L==='es'?'1. Todo positivo es mayor que cero.<br>2. Todo negativo es menor que cero.<br>3. Todo positivo es mayor que cualquier negativo.<br>4. Entre dos negativos, el que tiene menor valor absoluto es el mayor.':'1. Every positive is greater than zero.<br>2. Every negative is less than zero.<br>3. Every positive is greater than any negative.<br>4. Between two negatives, the one with smaller absolute value is greater.')+'</div>' +

    '<div style="font-size:.71rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:.45rem">'+(L==='es'?'Ejemplo resuelto: ¿−7 o −2?':'Solved example: −7 or −2?')+'</div>' +

    '</div>' + makeNL([-7,-2],[-7,-2]);
  body.appendChild(s2);

  var numList=[ri(-8,-3), 0, ri(1,7)];

    '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0" id="ogslots">';
  for(var si=0;si<4;si++) oh+='<div style="min-width:60px;min-height:44px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:\'IBM Plex Mono\',monospace;cursor:pointer;transition:all .18s;padding:.3rem .5rem;color:var(--text3);font-size:.75rem" id="ogs'+si+'" onclick="ogPlace('+si+')">'+(L==='es'?'Pos ':'Pos ')+(si+1)+'</div>';
  oh+='</div><button style="padding:.45rem 1rem;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:.5rem" id="ogvbtn" onclick="ogVerify()" disabled>'+(L==='es'?'✓ Verificar orden':'✓ Verify order')+'</button>' +
    '<div id="ogfb" style="font-size:.83rem;margin-top:.5rem;line-height:1.5"></div></div>';
  osec.innerHTML=oh; body.appendChild(osec);

  /* ── Problem 3 ── */
  var m4=[ri(-8,-1),ri(-9,-2),ri(1,6),ri(2,9)]; while(m4[2]===m4[3]) m4[3]=ri(2,9);
  var sm4=m4.slice().sort(function(a,b){return a-b;}); var sm4s=sm4.join(' < ');
  var wm1=[sm4[1],sm4[0],sm4[2],sm4[3]].join(' < ');
  var wm2=[sm4[0],sm4[1],sm4[3],sm4[2]].join(' < ');
  var wm3=[sm4[3],sm4[2],sm4[1],sm4[0]].join(' < ');
  var p3sh=shuf([sm4s,wm1,wm2,wm3], sm4s);
  problems.push({
    title: L==='es'?'Ordena cuatro números':'Order four numbers',
    questionText: L==='es'?'Ordena de menor a mayor: <strong>'+m4.join(', ')+'</strong>':'Order from least to greatest: <strong>'+m4.join(', ')+'</strong>',
    options:p3sh.opts, correctIdx:p3sh.ci,
    hint: L==='es'?'Primero identifica los negativos (van primero), luego cero si existe, luego los positivos.':'First identify the negatives (they go first), then zero if present, then positives.',
    explanation: L==='es'?'Orden correcto: <strong>'+sm4s+'</strong>. Los números se ordenan de izquierda a derecha en la recta numérica.':'Correct order: <strong>'+sm4s+'</strong>. Numbers are ordered left to right on the number line.',
    showWork:false, studentChoice:null, pendingChoice:null
  });
  buildOneCard(problems[problems.length-1], problems.length-1);

  /* ── SECTION 4 ── */
  var da=-(ri(11,29)/10), db=-(ri(1,10)/10);
  if(Math.abs(da)===Math.abs(db)) db=-(ri(1,9)/10);
  var s4=document.createElement('div'); s4.className='section';
  s4.innerHTML=
    '<div class="stag">'+(L==='es'?'Concepto 3':'Concept 3')+'</div>' +
    '<h2>🔬 '+(L==='es'?'Negativos con Decimales':'Negatives with Decimals')+'</h2>' +
    '<p>'+(L==='es'?'Las mismas reglas aplican para números decimales y fracciones negativos.':'The same rules apply to negative decimal numbers and fractions.')+'</p>' +
    '<div class="callout"><strong>'+(L==='es'?'Truco del valor absoluto:':'Absolute value trick:')+'</strong> '+(L==='es'?'Para comparar dos negativos: calcula su valor absoluto. El que tenga <em>menor</em> valor absoluto es el <em>mayor</em> número.':'To compare two negatives: calculate the absolute value. The one with the <em>smaller</em> absolute value is the <em>greater</em> number.')+'</div>' +
    '<div style="background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:.9rem 1.1rem;margin:.9rem 0;">' +
    '<div style="font-size:.71rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:.45rem">'+(L==='es'?'Ejemplo':'Example')+'</div>' +
    '<p style="margin:.3rem 0">'+(L==='es'?'¿Cuál es mayor: ':'Which is greater: ')+da.toFixed(1)+' '+(L==='es'?'o':'or')+' '+db.toFixed(1)+'?</p>' +
    '<p style="margin:.3rem 0">|'+da.toFixed(1)+'| = '+Math.abs(da).toFixed(1)+' &nbsp;&nbsp; |'+db.toFixed(1)+'| = '+Math.abs(db).toFixed(1)+'</p>' +
    '<p style="margin:0">'+(L==='es'?'Como '+Math.abs(da).toFixed(1)+' &gt; '+Math.abs(db).toFixed(1)+', entonces <strong>'+da.toFixed(1)+' &lt; '+db.toFixed(1)+'</strong>':'Since '+Math.abs(da).toFixed(1)+' &gt; '+Math.abs(db).toFixed(1)+', then <strong>'+da.toFixed(1)+' &lt; '+db.toFixed(1)+'</strong>')+'</p>' +
    '</div>';
  body.appendChild(s4);

  /* ── Problem 4 ── */
  var dc1=-(ri(5,19)/10), dc2=-(ri(1,4)/10);
  var p4opts=[dc1+' < '+dc2, dc1+' > '+dc2, dc1+' = '+dc2, String(dc2)+' < '+String(dc1)];
  var p4sh=shuf(p4opts, dc1+' < '+dc2);
  problems.push({
    title: L==='es'?'Compara decimales negativos':'Compare negative decimals',
    questionText: L==='es'?'¿Cuál es la relación correcta entre <strong>'+dc1+'</strong> y <strong>'+dc2+'</strong>?':'What is the correct relationship between <strong>'+dc1+'</strong> and <strong>'+dc2+'</strong>?',
    options:p4sh.opts, correctIdx:p4sh.ci,
    hint: L==='es'?'Calcula el valor absoluto de cada número. El mayor valor absoluto corresponde al número más negativo (más pequeño).':'Calculate the absolute value of each number. The larger absolute value corresponds to the more negative (smaller) number.',
    explanation: '|'+dc1+'|='+Math.abs(dc1).toFixed(1)+' &gt; |'+dc2+'|='+Math.abs(dc2).toFixed(1)+(L==='es'?', entonces':' so')+' <strong>'+dc1+' &lt; '+dc2+'</strong>.',
    showWork:false, studentChoice:null, pendingChoice:null
  });
  buildOneCard(problems[problems.length-1], problems.length-1);

  /* ── Final Assessment ── */
  var sf=document.createElement('div'); sf.className='section';
  sf.innerHTML='<div class="stag" style="color:var(--gold)">'+(L==='es'?'Evaluación Final':'Final Assessment')+'</div>' +
    '<h2>🏆 '+(L==='es'?'Demuestra lo que Aprendiste':'Show What You Learned')+'</h2>' +
    '<p>'+(L==='es'?'Resuelve los siguientes problemas.':'Solve the following problems.')+'</p>';
  body.appendChild(sf);

  /* ── Problem 5 ── */
  var pa=ri(1,15), pb=ri(-15,-1);
  var p5opts=[pb+' < '+pa, pb+' > '+pa, pb+' = '+pa, pa+' < '+pb];
  var p5sh=shuf(p5opts, pb+' < '+pa);
  problems.push({
    title: L==='es'?'Positivo vs. negativo':'Positive vs. negative',
    questionText: L==='es'?'¿Cuál es la relación correcta entre <strong>'+pb+'</strong> y <strong>'+pa+'</strong>?':'What is the correct relationship between <strong>'+pb+'</strong> and <strong>'+pa+'</strong>?',
    options:p5sh.opts, correctIdx:p5sh.ci, hint:'',
    explanation: L==='es'?'Todo número negativo es menor que cualquier número positivo: <strong>'+pb+' &lt; '+pa+'</strong>.':'Every negative number is less than any positive number: <strong>'+pb+' &lt; '+pa+'</strong>.',
    showWork:false, studentChoice:null, pendingChoice:null
  });
  buildOneCard(problems[problems.length-1], problems.length-1);

  /* ── Problem 6 ── */
  var temps=[ri(-25,-15), ri(-14,-5), ri(-4,-1)];
  var minT=Math.min.apply(null,temps), maxT=Math.max.apply(null,temps);
  var p6opts=L==='es'
    ?['La temperatura '+minT+'°C, porque tiene mayor valor absoluto','La temperatura '+maxT+'°C, porque tiene mayor valor absoluto','La temperatura 0°C siempre es la más fría','Las tres temperaturas son iguales']
    :['The temperature '+minT+'°C, because it has the greatest absolute value','The temperature '+maxT+'°C, because it has the greatest absolute value','0°C is always the coldest','All three temperatures are equal'];
  var p6sh=shuf(p6opts, p6opts[0]);
  problems.push({
    title: L==='es'?'La temperatura más fría':'The coldest temperature',
    questionText: L==='es'?'Tres ciudades reportan: '+temps[0]+'°C, '+temps[1]+'°C y '+temps[2]+'°C. ¿Cuál es la más fría y por qué?':'Three cities report: '+temps[0]+'°C, '+temps[1]+'°C and '+temps[2]+'°C. Which is the coldest and why?',
    options:p6sh.opts, correctIdx:p6sh.ci, hint:'',
    explanation: L==='es'?'La temperatura más fría es la más negativa (más a la izquierda en la recta). <strong>'+minT+'°C</strong> es la más fría.':'The coldest temperature is the most negative (furthest left). <strong>'+minT+'°C</strong> is the coldest.',
    showWork:false, studentChoice:null, pendingChoice:null
  });
  buildOneCard(problems[problems.length-1], problems.length-1);

  /* ── Problem 7 ── */
  var sd1=-(ri(10,30)/10), sd2=-(ri(31,60)/10);
  var p7opts=L==='es'
    ?[sd2+' porque |'+sd2+'| > |'+sd1+'|', sd1+' porque es el primero mencionado', 'Ambos son iguales', '0 porque es el centro']
    :[sd2+' because |'+sd2+'| > |'+sd1+'|', sd1+' because it is mentioned first', 'Both are equal', '0 because it is the center'];
  var p7sh=shuf(p7opts, p7opts[0]);
  problems.push({
    title: L==='es'?'¿Cuál decimal es menor?':'Which decimal is smaller?',
    questionText: L==='es'?'¿Cuál es el menor entre <strong>'+sd1+'</strong> y <strong>'+sd2+'</strong>?':'Which is smaller between <strong>'+sd1+'</strong> and <strong>'+sd2+'</strong>?',
    options:p7sh.opts, correctIdx:p7sh.ci, hint:'',
    explanation: sd2+(L==='es'?' es el menor porque |'+sd2+'|='+Math.abs(sd2).toFixed(1)+' &gt; |'+sd1+'|='+Math.abs(sd1).toFixed(1)+'. Mayor valor absoluto = más negativo = menor.':' is smaller because |'+sd2+'|='+Math.abs(sd2).toFixed(1)+' &gt; |'+sd1+'|='+Math.abs(sd1).toFixed(1)+'. Larger absolute value = more negative = smaller.'),
    showWork:false, studentChoice:null, pendingChoice:null
  });
  buildOneCard(problems[problems.length-1], problems.length-1);

  /* ── Problem 8 ── */
  var mix=[ri(-8,-2), ri(-3,3), ri(2,7), -(ri(1,9)/10)];
  var smix=mix.slice().sort(function(a,b){return a-b;});
  var smixs=smix.map(function(n){return n%1===0?n:n.toFixed(1);}).join(' < ');
  var wm8a=[smix[1],smix[0],smix[2],smix[3]].map(function(n){return n%1===0?n:n.toFixed(1);}).join(' < ');
  var wm8b=[smix[0],smix[1],smix[3],smix[2]].map(function(n){return n%1===0?n:n.toFixed(1);}).join(' < ');
  var wm8c=[smix[3],smix[2],smix[1],smix[0]].map(function(n){return n%1===0?n:n.toFixed(1);}).join(' < ');
  var p8sh=shuf([smixs,wm8a,wm8b,wm8c], smixs);
  problems.push({
    title: L==='es'?'Ordena cuatro números mixtos':'Order four mixed numbers',
    questionText: L==='es'?'Ordena de menor a mayor: <strong>'+mix.map(function(n){return n%1===0?n:n.toFixed(1);}).join(', ')+'</strong>':'Order from least to greatest: <strong>'+mix.map(function(n){return n%1===0?n:n.toFixed(1);}).join(', ')+'</strong>',
    options:p8sh.opts, correctIdx:p8sh.ci, hint:'',
    explanation: (L==='es'?'Orden correcto:':'Correct order:')+' <strong>'+smixs+'</strong>.',
    showWork:false, studentChoice:null, pendingChoice:null
  });
  buildOneCard(problems[problems.length-1], problems.length-1);

  /* ── Problem 9 ── */
  var nums9=[ri(-10,-5), ri(-4,-1), ri(1,4), ri(5,10)];
  while(Math.abs(nums9[0])===Math.abs(nums9[3])) nums9[3]=ri(5,10);
  var farthest=nums9.reduce(function(a,b){return Math.abs(b)>Math.abs(a)?b:a;});
  var p9sh=shuf(nums9.map(String), String(farthest));
  problems.push({
    title: L==='es'?'¿Quién está más lejos del cero?':'Farthest from zero',
    questionText: L==='es'?'¿Cuál de estos números está más lejos del cero en la recta numérica? '+nums9.join(', '):'Which of these numbers is farthest from zero on the number line? '+nums9.join(', '),
    options:p9sh.opts, correctIdx:p9sh.ci, hint:'',
    explanation: L==='es'?'El número más alejado del cero tiene mayor valor absoluto: <strong>'+farthest+'</strong> (|'+farthest+'|='+Math.abs(farthest)+').':'The number farthest from zero has the greatest absolute value: <strong>'+farthest+'</strong> (|'+farthest+'|='+Math.abs(farthest)+').',
    showWork:false, studentChoice:null, pendingChoice:null
  });
  buildOneCard(problems[problems.length-1], problems.length-1);

  /* ── Problem 10 ── */
  var lo=ri(-8,-4), hi=ri(4,8);
  var mid=(lo+hi)/2;
  var midStr=mid%1===0?String(mid):mid.toFixed(1);
  var p10opts=[midStr, String(lo), String(hi), '0'];
  if('0'===midStr) p10opts[3]='1';
  var p10sh=shuf(p10opts, midStr);
  problems.push({
    title: L==='es'?'El número del medio':'The middle number',
    questionText: L==='es'?'Si se ordenan de menor a mayor: … <strong>'+lo+'</strong> __ <strong>'+hi+'</strong> …<br>¿Qué número estaría exactamente en el punto medio entre '+lo+' y '+hi+'?':'When ordered least to greatest: … <strong>'+lo+'</strong> __ <strong>'+hi+'</strong> …<br>What number is exactly halfway between '+lo+' and '+hi+'?',
    options:p10sh.opts, correctIdx:p10sh.ci, hint:'',
    explanation: L==='es'?'El punto medio entre '+lo+' y '+hi+' es ('+lo+'+'+hi+')/2 = <strong>'+midStr+'</strong>.':'The midpoint between '+lo+' and '+hi+' is ('+lo+'+'+hi+')/2 = <strong>'+midStr+'</strong>.',
    showWork:false, studentChoice:null, pendingChoice:null
  });
  buildOneCard(problems[problems.length-1], problems.length-1);
}

/* ── Compare widget handler ── */
function cmpClick(i, ch, cor) {
  var L = LANG;
  if(window._psc[i]!==null) return;

  // Second tap on same symbol → confirm
  if(window._pcPend[i] === ch) {
    window._pcPend[i] = null;
    var ok=(ch===cor); window._psc[i]=ok;
    ['lt','gt','eq'].forEach(function(s){
      var b=document.getElementById('cb'+i+s); if(!b) return;
      b.disabled=true; b.style.borderColor=''; b.style.background=''; b.style.color='';
      var sym=s==='lt'?'<':s==='gt'?'>':'=';
      if(sym===cor){b.style.background='#e8f5e9'; b.style.borderColor='#4a7c3f'; b.style.color='#2d5a27';}
      if(!ok&&sym===ch){b.style.background='#fdecea'; b.style.borderColor='#c0392b'; b.style.color='#c0392b';}
    });
    var fb=document.getElementById('cpfb'+i);
    if(fb){fb.textContent=ok?(L==='es'?'✓ ¡Correcto!':'✓ Correct!'):(L==='es'?'✗ Incorrecto. La respuesta es: ':'✗ Incorrect. The answer is: ')+cor; fb.style.color=ok?'#2d5a27':'#c0392b';}
    if(window._psc.every(function(s){return s!==null;})){
      var sm=window._psc.filter(Boolean).length;
      var csum=document.getElementById('cmpsum');
      if(csum) csum.innerHTML='<div class="callout" style="margin-top:.7rem">'+(L==='es'?'Resultado: '+sm+'/3 correctas.':'Result: '+sm+'/3 correct.')+'</div>';
    }
    return;
  }

  // First tap → gold highlight, clear previous pending in this row
  window._pcPend[i] = ch;
  ['lt','gt','eq'].forEach(function(s){
    var b=document.getElementById('cb'+i+s); if(!b) return;
    var sym=s==='lt'?'<':s==='gt'?'>':'=';
    if(sym===ch){b.style.background='var(--gold-bg)'; b.style.borderColor='var(--gold)'; b.style.color='var(--gold)';}
    else{b.style.background=''; b.style.borderColor=''; b.style.color='';}
  });
}

/* ── Ordering game handlers ── */
function ogPickNum(i) {
  if(window._g4done) return;
  var slots=window._g4slots;
  if(slots.indexOf(i)>=0) return;
  document.querySelectorAll('#ogpool div').forEach(function(d){d.style.background='var(--surface)';d.style.color='var(--text)';});
  var el=document.getElementById('ogn'+i);
  if(window._g4sel===i){window._g4sel=null;return;}
  window._g4sel=i;
  if(el){el.style.background='var(--green)';el.style.color='#fff';}
}
function ogPlace(si) {
  if(window._g4done) return;
  var slots=window._g4slots, sel=window._g4sel;
  var slotEl=document.getElementById('ogs'+si);
  if(slots[si]!==null){
    var prev=slots[si]; slots[si]=null;
    if(slotEl){slotEl.textContent=(LANG==='es'?'Pos ':'Pos ')+(si+1);slotEl.style.borderStyle='dashed';slotEl.style.borderColor='var(--border)';slotEl.style.color='var(--text3)';slotEl.style.fontSize='.75rem';}
    var numEl=document.getElementById('ogn'+prev);
    if(numEl){numEl.style.opacity='1';numEl.style.pointerEvents='auto';}
  } else if(sel!==null){
    slots[si]=sel;
    var n=window._g4[sel];
    if(slotEl){slotEl.textContent=(n>=0?'+':'')+n;slotEl.style.borderStyle='solid';slotEl.style.borderColor='var(--green)';slotEl.style.color='var(--text)';slotEl.style.fontSize='.95rem';}
    var ne=document.getElementById('ogn'+sel);
    if(ne){ne.style.opacity='.3';ne.style.pointerEvents='none';ne.style.background='var(--surface)';}
    window._g4sel=null;
    document.querySelectorAll('#ogpool div').forEach(function(d){d.style.background='var(--surface)';d.style.color='var(--text)';});
    document.getElementById('ogvbtn').disabled=slots.indexOf(null)>=0;
  }
}
function ogVerify() {
  var L = LANG;
  var slots=window._g4slots, game=window._g4, sorted=window._g4s;
  window._g4done=true;
  var allOk=true;
  for(var i=0;i<4;i++){
    var n=slots[i]!==null?game[slots[i]]:null;
    var el=document.getElementById('ogs'+i);
    if(n!==sorted[i]){allOk=false;if(el){el.style.borderColor='var(--bad)';el.style.background='var(--bad-bg)';}}
    else{if(el){el.style.borderColor='var(--ok)';el.style.background='var(--ok-bg)';}}
  }
  var fb=document.getElementById('ogfb');
  if(fb){
    if(allOk){fb.innerHTML='<span style="color:#2d6a4f;font-weight:700">✓ '+(L==='es'?'¡Perfecto! Orden correcto:':'Perfect! Correct order:')+' '+sorted.map(function(n){return(n>=0?'+':'')+n;}).join(' < ')+'</span>';}
    else{fb.innerHTML='<span style="color:#8b2500">✗ '+(L==='es'?'No del todo. El orden correcto es:':'Not quite. The correct order is:')+' <strong>'+sorted.map(function(n){return(n>=0?'+':'')+n;}).join(' < ')+'</strong></span>';}
  }
}
</script>
