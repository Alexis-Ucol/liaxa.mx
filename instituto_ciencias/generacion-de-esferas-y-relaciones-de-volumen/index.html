<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generación de Esferas y Relaciones de Volumen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.mcv { display:block; width:100%; height:270px; touch-action:none; background:var(--surface); }
.mrow { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-top:.7rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .9rem; font-size:.82rem; cursor:pointer; color:var(--text2); font-family:inherit; min-height:44px; transition:all .14s; }
.mbtn:hover { border-color:var(--green); color:var(--green); }
.mbtn.go { background:var(--green); color:#fff; border-color:var(--green); }
.mbtn.go:hover { background:var(--green-dark); color:#fff; }
.mbtn.warn { border-color:var(--gold); color:var(--gold); }
.mfb { margin-top:.7rem; padding:.6rem .85rem; border-radius:8px; font-size:.84rem; background:var(--surface2); color:var(--text2); border-left:3px solid var(--border); }
.mfb.good { background:var(--ok-bg); color:var(--ok); border-left-color:var(--ok); }
.mfb.near { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.mstat { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.mtile { background:var(--surface2); border-radius:8px; padding:.55rem .35rem; text-align:center; border:1.5px solid var(--border); }
.mtile.hit { border-color:var(--ok); background:var(--ok-bg); }
.mtile .tl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.mtile .tv { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--text); }
.mhead { display:flex; justify-content:space-between; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.4rem; }
.mtitle { font-weight:600; font-size:.95rem; }
.mround { font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.mnote { font-size:.76rem; color:var(--text3); margin-top:.5rem; }
.mhide { display:none; }
.mlev { display:grid; grid-template-columns:auto 1fr auto; gap:.35rem .6rem; align-items:center; margin-top:.6rem; }
.mlev label { font-size:.74rem; color:var(--text3); white-space:nowrap; }
.mlev input[type=range] { width:100%; accent-color:var(--green); min-height:28px; }
.mlev .lv { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green); font-weight:600; min-width:2.2rem; text-align:right; }
.mbar { height:16px; border-radius:6px; background:var(--green); transition:width .25s; }
.mbar.acc { background:var(--gold); }
.mbar.dk { background:var(--green-dark); }
.mbarow { display:grid; grid-template-columns:5.4rem 1fr 4.6rem; gap:.5rem; align-items:center; margin-top:.45rem; font-size:.76rem; color:var(--text2); }
.mbarval { font-family:'IBM Plex Mono',monospace; font-size:.75rem; text-align:right; color:var(--text2); }
@media (max-width:600px){ .mstat { grid-template-columns:1fr 1fr; } .mcv { height:240px; } .mbtn { font-size:.78rem; padding:.5rem .6rem; } .mbarow { grid-template-columns:4.4rem 1fr 4.2rem; } }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Generación de Esferas y Relaciones de Volumen</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')

/* ---------- small helpers ---------- */
var PIV = 3.1416;
function L(es, en){ return LANG === 'en' ? en : es; }
function cssv(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888'; } catch(e){ return '#888'; } }
function n2(v){ return (Math.round(v * 100) / 100).toFixed(2); }
function n1(v){ return (Math.round(v * 10) / 10).toFixed(1); }
function frac(n, d){ return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>'; }
function addSection(html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}
function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return { options: a, correctIdx: a.indexOf(correct) };
}
function pushProb(spec, rng){
  var s = shuffleOpts(spec.options, spec.correct, rng);
  var prob = {
    title: spec.title, questionText: spec.questionText, fn: spec.fn || '',
    hint: spec.hint || '', explanation: spec.explanation || '',
    options: s.options, correctIdx: s.correctIdx, showWork: !!spec.showWork,
    studentChoice: null, pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}
function setFb(id, msg, cls){
  var e = document.getElementById(id); if (!e) return;
  e.innerHTML = msg; e.className = 'mfb' + (cls ? ' ' + cls : '');
}
function showEl(id, on){ var e = document.getElementById(id); if (e) e.classList.toggle('mhide', !on); }
function setTx(id, txt){ var e = document.getElementById(id); if (e) e.textContent = txt; }
function cvFit(id){
  var cv = document.getElementById(id);
  if (!cv) return null;
  var dpr = window.devicePixelRatio || 1;
  var r = cv.getBoundingClientRect();
  var w = Math.max(240, Math.round(r.width));
  var h = Math.max(180, Math.round(r.height));
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  return { ctx: ctx, w: w, h: h };
}
function cvLabel(ctx, txt, x, y, col, align){
  ctx.save(); ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.font = '500 11px "IBM Plex Sans", sans-serif';
  ctx.fillText(txt, x, y); ctx.restore();
}

var M1 = null, M2 = null, M3 = null, M4 = null;

/* ================================================
   MANIPULATIVE 1 : Taller de perfiles
   Five sliders set the distance from the axis at five heights. The canvas
   revolves that profile in real time. The student must shape the profile that
   generates a requested solid. Directional feedback names the level that is
   off and which way to move it; the answer is revealed on the third miss.
   ================================================ */
var M1PROF = { esfera:[0, 8.66, 10, 8.66, 0], cono:[10, 7.5, 5, 2.5, 0], cilindro:[10, 10, 10, 10, 10] };
function m1Name(k){
  return k === 'esfera' ? L('una esfera', 'a sphere') : k === 'cono' ? L('un cono', 'a cone') : L('un cilindro', 'a cylinder');
}
function m1Rule(k){
  return k === 'esfera'
      ? L('el perfil debe tocar el eje arriba y abajo y abrirse al máximo justo a la mitad, siguiendo un arco',
          'the profile has to touch the axis at the top and at the bottom and open to its widest exactly halfway, following an arc')
    : k === 'cono'
      ? L('el perfil debe bajar de forma pareja, desde su anchura máxima en la base hasta tocar el eje en la punta',
          'the profile has to come down evenly, from its widest at the base until it touches the axis at the tip')
      : L('el perfil debe quedar a la misma distancia del eje en los cinco niveles',
          'the profile has to stay at the same distance from the axis at all five levels');
}
function m1Build(rng){
  M1 = { kinds: shuffle(['esfera', 'cono', 'cilindro'], rng), round: 0, tries: 0, resolved: false, done: false, vals: [5, 5, 5, 5, 5] };
}
function m1Html(){
  var sl = '';
  for (var i = 0; i < 5; i++){
    sl += '<label>' + L('Nivel ', 'Level ') + (i + 1) + (i === 0 ? L(' (base)', ' (base)') : i === 4 ? L(' (cima)', ' (top)') : '') + '</label>' +
          '<input type="range" id="m1s' + i + '" min="0" max="10" step="1" oninput="m1Input()">' +
          '<span class="lv" id="m1v' + i + '"></span>';
  }
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Taller de perfiles', 'Profile workshop') + '</div>' +
      '<div class="mround" id="m1r"></div></div>' +
    '<p style="font-size:.86rem">' + L(
      'Cada control separa del eje la figura plana a esa altura. Muévelos y observa el cuerpo que barre el giro. Da forma al perfil que genera el cuerpo pedido.',
      'Each control pushes the flat figure away from the axis at that height. Move them and watch the solid swept by the turn. Shape the profile that generates the requested solid.') + '</p>' +
    '<div class="callout" style="margin:.6rem 0"><p><strong id="m1goal"></strong></p></div>' +
    '<div class="cvwrap"><canvas class="mcv" id="m1cv"></canvas></div>' +
    '<div class="mlev">' + sl + '</div>' +
    '<div class="mnote" id="m1note"></div>' +
    '<div class="mrow">' +
      '<button class="mbtn go" onclick="m1Check()">' + L('Girar y comprobar', 'Spin and check') + '</button>' +
      '<button class="mbtn" onclick="m1Flat()">' + L('Aplanar todo', 'Flatten it all') + '</button>' +
      '<button class="mbtn go mhide" id="m1next" onclick="m1Next()">' + L('Siguiente cuerpo →', 'Next solid →') + '</button>' +
    '</div>' +
    '<div class="mfb" id="m1fb"></div>' +
  '</div>';
}
function m1Init(){
  if (!M1 || !document.getElementById('m1cv')) return;
  for (var i = 0; i < 5; i++){ var s = document.getElementById('m1s' + i); if (s) s.value = M1.vals[i]; }
  showEl('m1next', false);
  setFb('m1fb', L('Mueve los cinco controles hasta que el rastro del giro sea el cuerpo pedido.',
                  'Move the five controls until the trail of the spin is the requested solid.'), '');
  m1Input();
}
function m1Flat(){
  if (!M1 || M1.resolved) return;
  M1.vals = [5, 5, 5, 5, 5];
  for (var i = 0; i < 5; i++){ var s = document.getElementById('m1s' + i); if (s) s.value = 5; }
  m1Input();
}
function m1Input(){
  if (!M1) return;
  for (var i = 0; i < 5; i++){
    var s = document.getElementById('m1s' + i);
    if (s) M1.vals[i] = parseFloat(s.value);
    setTx('m1v' + i, n1(M1.vals[i]));
  }
  var k = M1.kinds[M1.round];
  setTx('m1r', L('Cuerpo ' + (M1.round + 1) + ' de 3', 'Solid ' + (M1.round + 1) + ' of 3'));
  setTx('m1goal', L('Construye el perfil que genera ' + m1Name(k) + '.', 'Build the profile that generates ' + m1Name(k) + '.'));
  var v = M1.vals, note;
  var toca = (v[0] < 1 && v[4] < 1), pareja = (Math.abs(v[0] - v[4]) < 1 && Math.abs(v[0] - v[2]) < 1);
  if (pareja && v[0] > 1) note = L('Ahora mismo la distancia al eje no cambia con la altura: el giro barre un tubo.',
                                   'Right now the distance to the axis does not change with height: the spin sweeps a tube.');
  else if (toca) note = L('Ahora mismo el perfil se cierra arriba y abajo: el giro barre un cuerpo redondeado en los dos extremos.',
                          'Right now the profile closes at the top and at the bottom: the spin sweeps a solid rounded at both ends.');
  else if (v[0] > v[4]) note = L('Ahora mismo el perfil se estrecha conforme subes: el giro barre un cuerpo que termina en punta hacia arriba.',
                                 'Right now the profile narrows as you go up: the spin sweeps a solid ending in a tip at the top.');
  else note = L('Ahora mismo el perfil se ensancha conforme subes: el giro barre un cuerpo que se abre hacia arriba.',
                'Right now the profile widens as you go up: the spin sweeps a solid opening upward.');
  setTx('m1note', note);
  m1Draw();
}
function m1RadAt(u){
  var v = M1.vals, x = u * 4, i = Math.min(3, Math.floor(x)), f = x - i;
  return v[i] + (v[i + 1] - v[i]) * f;
}
function m1Draw(){
  var f = cvFit('m1cv'); if (!f || !M1) return;
  var ctx = f.ctx;
  var s = Math.min((f.h - 46) / 10, (f.w - 80) / 24);
  var ax = f.w / 2, bot = f.h - 24, H = 10 * s;
  ctx.save(); ctx.strokeStyle = cssv('--text3'); ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ax, bot - H - 14); ctx.lineTo(ax, bot + 12); ctx.stroke(); ctx.restore();
  var i, u, y, r;
  ctx.save(); ctx.strokeStyle = cssv('--green'); ctx.globalAlpha = 0.45; ctx.lineWidth = 1.2;
  for (i = 0; i <= 20; i++){
    u = i / 20; y = bot - u * H; r = m1RadAt(u) * s;
    if (r < 1.2) continue;
    ctx.beginPath(); ctx.ellipse(ax, y, r, r * 0.28, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.fillStyle = cssv('--green-bg'); ctx.globalAlpha = 0.75;
  ctx.beginPath(); ctx.moveTo(ax, bot);
  for (i = 0; i <= 40; i++){ u = i / 40; ctx.lineTo(ax - m1RadAt(u) * s, bot - u * H); }
  ctx.lineTo(ax, bot - H); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.save(); ctx.fillStyle = cssv('--gold-bg'); ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(ax, bot);
  for (i = 0; i <= 40; i++){ u = i / 40; ctx.lineTo(ax + m1RadAt(u) * s, bot - u * H); }
  ctx.lineTo(ax, bot - H); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.fillStyle = cssv('--gold');
  for (i = 0; i < 5; i++){
    y = bot - (i / 4) * H; r = M1.vals[i] * s;
    ctx.beginPath(); ctx.arc(ax + r, y, 3.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  cvLabel(ctx, L('figura plana', 'flat figure'), 8, 15, cssv('--gold'));
  cvLabel(ctx, L('rastro del giro', 'trail of the spin'), 8, 32, cssv('--green'));
  cvLabel(ctx, L('eje', 'axis'), ax + 6, bot - H - 20, cssv('--text3'));
}
function m1Check(){
  if (!M1 || M1.done || M1.resolved) return;
  var k = M1.kinds[M1.round], tgt = M1PROF[k], i, worst = -1, wd = 0, d;
  for (i = 0; i < 5; i++){
    d = M1.vals[i] - tgt[i];
    if (Math.abs(d) > Math.abs(wd)){ wd = d; worst = i; }
  }
  if (Math.abs(wd) <= 1.0){
    M1.resolved = true;
    setFb('m1fb', L('¡Ese es el perfil! Al girar genera ' + m1Name(k) + ', porque ' + m1Rule(k) + '.',
                    'That is the profile. Spinning it generates ' + m1Name(k) + ', because ' + m1Rule(k) + '.'), 'good');
    showEl('m1next', true);
    return;
  }
  M1.tries++;
  if (M1.tries >= 3){
    M1.resolved = true;
    M1.vals = tgt.slice();
    for (i = 0; i < 5; i++){ var s = document.getElementById('m1s' + i); if (s) s.value = Math.round(tgt[i]); }
    m1Input();
    setFb('m1fb', L('Este es el perfil de ' + m1Name(k) + ': ' + m1Rule(k) + '. Mira cómo queda el rastro del giro.',
                    'This is the profile of ' + m1Name(k) + ': ' + m1Rule(k) + '. Look at how the trail of the spin turns out.'), 'near');
    showEl('m1next', true);
    return;
  }
  var msg = wd > 0
    ? L('Casi. El nivel ' + (worst + 1) + ' está demasiado lejos del eje: acércalo y vuelve a girar.',
        'Almost. Level ' + (worst + 1) + ' is too far from the axis: bring it closer and spin again.')
    : L('Casi. El nivel ' + (worst + 1) + ' está demasiado cerca del eje: sepáralo y vuelve a girar.',
        'Almost. Level ' + (worst + 1) + ' is too close to the axis: push it out and spin again.');
  setFb('m1fb', msg, 'near');
}
function m1Next(){
  if (!M1) return;
  M1.round++; M1.tries = 0; M1.resolved = false;
  showEl('m1next', false);
  if (M1.round >= 3){
    M1.done = true; M1.round = 2;
    setFb('m1fb', L('Los tres perfiles giraron. Solo el arco que sale del eje y regresa a él genera una esfera: todos sus puntos quedan a la misma distancia de un mismo centro.',
                    'The three profiles have spun. Only the arc that leaves the axis and returns to it generates a sphere: all of its points stay at the same distance from one centre.'), 'good');
    return;
  }
  M1.vals = [5, 5, 5, 5, 5];
  for (var i = 0; i < 5; i++){ var s = document.getElementById('m1s' + i); if (s) s.value = 5; }
  setFb('m1fb', L('Cuerpo nuevo. Vuelve a dar forma al perfil.', 'New solid. Shape the profile again.'), '');
  m1Input();
}

/* ================================================
   MANIPULATIVE 2 : Mesa de cortes
   A horizontal plane slides through a hemisphere and through a cylinder with a
   cone carved out of it. Both sections are drawn and measured live, so the
   equality at every height is visible. The student is asked to place the plane
   where the section has a given area; feedback says which way to move it.
   ================================================ */
function m2Build(rng){
  var R = pick([8, 10, 12], rng);
  var hs = shuffle([2, 3, 4, 5, 6], rng).slice(0, 3);
  M2 = { R: R, targets: hs, round: 0, tries: 0, resolved: false, done: false, h: 0 };
}
function m2Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Mesa de cortes', 'Cutting bench') + '</div>' +
      '<div class="mround" id="m2r"></div></div>' +
    '<p style="font-size:.86rem">' + L(
      'A la izquierda hay media esfera apoyada sobre su cara plana. A la derecha, un cilindro del mismo radio y de altura igual al radio, al que se le quitó un cono con la punta abajo. El plano corta los dos cuerpos a la misma altura.',
      'On the left there is half a sphere resting on its flat face. On the right, a cylinder of the same radius and of height equal to the radius, with a cone carved out of it, tip down. The plane cuts both solids at the same height.') + '</p>' +
    '<div class="cvwrap"><canvas class="mcv" id="m2cv"></canvas></div>' +
    '<div class="cgrid" style="margin-top:.8rem">' +
      '<div class="cg"><label>' + L('Altura del plano', 'Height of the plane') + ': <span class="cval" id="m2lh"></span> cm</label>' +
        '<input type="range" id="m2h" min="0" max="12" step="1" oninput="m2Input()"></div>' +
      '<div class="cg"><label>' + L('Sección pedida', 'Requested section') + ': <span class="cval" id="m2lt"></span> cm²</label>' +
        '<div class="mnote" id="m2note"></div></div>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile" id="m2t1"><div class="tl">' + L('Corte en la media esfera', 'Cut in the half sphere') + '</div><div class="tv" id="m2a1"></div></div>' +
      '<div class="mtile" id="m2t2"><div class="tl">' + L('Corte en el cilindro hueco', 'Cut in the hollow cylinder') + '</div><div class="tv" id="m2a2"></div></div>' +
      '<div class="mtile" id="m2t3"><div class="tl">' + L('Diferencia', 'Difference') + '</div><div class="tv" id="m2a3"></div></div>' +
    '</div>' +
    '<div class="mrow">' +
      '<button class="mbtn go" onclick="m2Check()">' + L('Fijar el corte', 'Fix the cut') + '</button>' +
      '<button class="mbtn mhide go" id="m2next" onclick="m2Next()">' + L('Siguiente corte →', 'Next cut →') + '</button>' +
    '</div>' +
    '<div class="mfb" id="m2fb"></div>' +
  '</div>';
}
function m2Init(){
  if (!M2 || !document.getElementById('m2cv')) return;
  var sl = document.getElementById('m2h');
  if (sl){ sl.max = String(M2.R); sl.value = String(M2.h); }
  showEl('m2next', false);
  setFb('m2fb', L('Desliza el plano y compara las dos secciones que aparecen abajo.',
                  'Slide the plane and compare the two sections that appear below.'), '');
  m2Input();
}
function m2Area(h){ return PIV * (M2.R * M2.R - h * h); }
function m2Input(){
  if (!M2) return;
  var sl = document.getElementById('m2h');
  if (sl) M2.h = parseFloat(sl.value);
  var a = m2Area(M2.h), t = m2Area(M2.targets[M2.round]);
  setTx('m2lh', n1(M2.h));
  setTx('m2lt', n2(t));
  setTx('m2a1', n2(a) + ' cm²');
  setTx('m2a2', n2(a) + ' cm²');
  setTx('m2a3', '0.00 cm²');
  setTx('m2r', L('Corte ' + (M2.round + 1) + ' de 3', 'Cut ' + (M2.round + 1) + ' of 3'));
  setTx('m2note', L('Radio de los dos cuerpos: ' + M2.R + ' cm.', 'Radius of both solids: ' + M2.R + ' cm.'));
  var d = document.getElementById('m2t3'); if (d) d.classList.add('hit');
  m2Draw();
}
function m2Draw(){
  var f = cvFit('m2cv'); if (!f || !M2) return;
  var ctx = f.ctx, R = M2.R, h = M2.h;
  var panelW = f.w / 2;
  var s = Math.min((f.h - 118) / R, (panelW - 34) / (2 * R));
  var bot = f.h - 96, c1 = panelW / 2, c2 = panelW + panelW / 2;
  var cutY = bot - h * s, rs = Math.sqrt(Math.max(0, R * R - h * h));
  ctx.save(); ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(panelW, 6); ctx.lineTo(panelW, f.h - 6); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.fillStyle = cssv('--green-bg'); ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(c1, bot, R * s, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(c2 - R * s, bot); ctx.lineTo(c2 - R * s, bot - R * s); ctx.lineTo(c2 + R * s, bot - R * s); ctx.lineTo(c2 + R * s, bot);
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.fillStyle = cssv('--surface'); ctx.strokeStyle = cssv('--text3'); ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(c2, bot); ctx.lineTo(c2 - R * s, bot - R * s); ctx.lineTo(c2 + R * s, bot - R * s); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(c1 - rs * s, cutY); ctx.lineTo(c1 + rs * s, cutY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(c2 - R * s, cutY); ctx.lineTo(c2 - h * s, cutY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(c2 + h * s, cutY); ctx.lineTo(c2 + R * s, cutY); ctx.stroke();
  ctx.setLineDash([3, 4]); ctx.lineWidth = 1; ctx.strokeStyle = cssv('--text3');
  ctx.beginPath(); ctx.moveTo(10, cutY); ctx.lineTo(f.w - 10, cutY); ctx.stroke(); ctx.restore();
  var s2 = Math.min(30 / R, 3.4), py = f.h - 42;
  ctx.save(); ctx.fillStyle = cssv('--gold-bg'); ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(c1, py, Math.max(1, rs * s2), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(c2, py, R * s2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = cssv('--surface'); ctx.beginPath(); ctx.arc(c2, py, Math.max(0, h * s2), 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = cssv('--gold'); ctx.beginPath(); ctx.arc(c2, py, Math.max(0, h * s2), 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  cvLabel(ctx, L('media esfera', 'half sphere'), c1, 14, cssv('--green'), 'center');
  cvLabel(ctx, L('cilindro sin el cono', 'cylinder minus the cone'), c2, 14, cssv('--green'), 'center');
  cvLabel(ctx, L('círculo del corte', 'circle of the cut'), c1, f.h - 10, cssv('--gold'), 'center');
  cvLabel(ctx, L('anillo del corte', 'ring of the cut'), c2, f.h - 10, cssv('--gold'), 'center');
}
function m2Check(){
  if (!M2 || M2.done || M2.resolved) return;
  var t = M2.targets[M2.round], a = m2Area(M2.h), ta = m2Area(t);
  if (M2.h === t){
    M2.resolved = true;
    setFb('m2fb', L('Exacto: a ' + t + ' cm de la base el corte mide ' + n2(ta) + ' cm² en los dos cuerpos. Sea cual sea la altura, el círculo y el anillo siempre miden lo mismo.',
                    'Exactly: at ' + t + ' cm from the base the cut measures ' + n2(ta) + ' cm² in both solids. Whatever the height, the circle and the ring always measure the same.'), 'good');
    showEl('m2next', true);
    return;
  }
  M2.tries++;
  if (M2.tries >= 3){
    M2.resolved = true;
    M2.h = t;
    var sl = document.getElementById('m2h'); if (sl) sl.value = String(t);
    m2Input();
    setFb('m2fb', L('El plano iba a ' + t + ' cm de la base: ahí el radio del corte se achica lo justo para dar ' + n2(ta) + ' cm².',
                    'The plane was at ' + t + ' cm from the base: there the radius of the cut shrinks just enough to give ' + n2(ta) + ' cm².'), 'near');
    showEl('m2next', true);
    return;
  }
  var msg = a > ta
    ? L('Tu corte mide ' + n2(a) + ' cm², más que el pedido. Cuanto más alto va el plano, más chico es el círculo: sube el plano.',
        'Your cut measures ' + n2(a) + ' cm², more than the requested one. The higher the plane goes, the smaller the circle: raise the plane.')
    : L('Tu corte mide ' + n2(a) + ' cm², menos que el pedido. Cuanto más baja el plano, más grande es el círculo: baja el plano.',
        'Your cut measures ' + n2(a) + ' cm², less than the requested one. The lower the plane goes, the bigger the circle: lower the plane.');
  setFb('m2fb', msg, 'near');
}
function m2Next(){
  if (!M2) return;
  M2.round++; M2.tries = 0; M2.resolved = false;
  showEl('m2next', false);
  if (M2.round >= 3){
    M2.done = true; M2.round = 2;
    setFb('m2fb', L('Los tres cortes coincidieron. Si dos cuerpos de la misma altura dan secciones iguales a cualquier altura, tienen el mismo volumen: la media esfera mide lo mismo que el cilindro al que le quitaron el cono.',
                    'The three cuts matched. If two solids of the same height give equal sections at every height, they have the same volume: the half sphere measures the same as the cylinder with the cone taken out.'), 'good');
    return;
  }
  M2.h = 0;
  var sl = document.getElementById('m2h'); if (sl) sl.value = '0';
  setFb('m2fb', L('Corte nuevo. Coloca el plano donde la sección tenga el área pedida.',
                  'New cut. Place the plane where the section has the requested area.'), '');
  m2Input();
}
/* ================================================
   MANIPULATIVE 3 : Banco de trasvase
   A cone shaped measure fills a sphere and a cylinder that share its radius.
   The student first predicts how many measures are needed and then pours them
   one by one, watching the level rise and spill. Wrong predictions get told how
   far the level would reach; the count is revealed on the third miss.
   ================================================ */
var M3R = [
  { v:'esfera',   cap:2, pre:0 },
  { v:'cilindro', cap:3, pre:0 },
  { v:'cilindro', cap:3, pre:2 }
];
function m3VName(v){ return v === 'esfera' ? L('la esfera', 'the sphere') : L('el cilindro', 'the cylinder'); }
function m3Build(rng){
  M3 = { r: pick([3, 4, 5, 6], rng), round: 0, poured: 0, guess: 1, tries: 0, resolved: false, done: false, spill: false };
}
function m3Need(){ var R = M3R[M3.round]; return R.cap - R.pre; }
function m3Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Banco de trasvase', 'Pouring bench') + '</div>' +
      '<div class="mround" id="m3r"></div></div>' +
    '<p style="font-size:.86rem">' + L(
      'La medida es un cono cuya base tiene el mismo radio que los recipientes y cuya altura es igual al diámetro de la esfera. Predice cuántas medidas caben y luego viértelas para verlo.',
      'The measure is a cone whose base has the same radius as the vessels and whose height equals the diameter of the sphere. Predict how many measures fit and then pour them to see it.') + '</p>' +
    '<div class="callout" style="margin:.6rem 0"><p><strong id="m3goal"></strong></p></div>' +
    '<div class="cvwrap"><canvas class="mcv" id="m3cv"></canvas></div>' +
    '<div class="mstat">' +
      '<div class="mtile"><div class="tl">' + L('Medidas vertidas', 'Measures poured') + '</div><div class="tv" id="m3p"></div></div>' +
      '<div class="mtile"><div class="tl">' + L('Nivel alcanzado', 'Level reached') + '</div><div class="tv" id="m3l"></div></div>' +
      '<div class="mtile"><div class="tl">' + L('Tu predicción', 'Your prediction') + '</div><div class="tv" id="m3g"></div></div>' +
    '</div>' +
    '<div class="mrow">' +
      '<button class="mbtn" onclick="m3Guess(-1)">−</button>' +
      '<button class="mbtn" onclick="m3Guess(1)">+</button>' +
      '<button class="mbtn go" onclick="m3Check()">' + L('Comprobar predicción', 'Check the prediction') + '</button>' +
    '</div>' +
    '<div class="mrow">' +
      '<button class="mbtn" onclick="m3Pour()">' + L('Vaciar una medida', 'Empty one measure') + '</button>' +
      '<button class="mbtn warn" onclick="m3Reset()">' + L('Vaciar el recipiente', 'Empty the vessel') + '</button>' +
      '<button class="mbtn go mhide" id="m3next" onclick="m3Next()">' + L('Siguiente reto →', 'Next challenge →') + '</button>' +
    '</div>' +
    '<div class="mfb" id="m3fb"></div>' +
  '</div>';
}
function m3Init(){
  if (!M3 || !document.getElementById('m3cv')) return;
  showEl('m3next', false);
  M3.poured = M3R[M3.round].pre; M3.spill = false;
  setFb('m3fb', L('Primero decide el número con los controles y compruébalo; después vierte las medidas y observa el nivel.',
                  'First set the number with the controls and check it; then pour the measures and watch the level.'), '');
  m3Update();
}
function m3Guess(d){
  if (!M3 || M3.resolved) return;
  M3.guess = Math.max(1, Math.min(6, M3.guess + d));
  m3Update();
}
function m3Reset(){
  if (!M3) return;
  M3.poured = M3R[M3.round].pre; M3.spill = false;
  m3Update();
}
function m3Pour(){
  if (!M3) return;
  var R = M3R[M3.round];
  if (M3.poured >= R.cap){
    M3.spill = true;
    setFb('m3fb', L('Se derramó: ' + m3VName(R.v) + ' ya estaba al ras con ' + R.cap + ' medidas en total. Vacía y vuelve a empezar.',
                    'It spilled over: ' + m3VName(R.v) + ' was already brim full with ' + R.cap + ' measures in total. Empty it and start again.'), 'near');
    m3Update();
    return;
  }
  M3.poured++;
  M3.spill = false;
  if (M3.poured === R.cap){
    setFb('m3fb', L('Al ras. ' + (R.pre > 0 ? 'Con el contenido de la esfera y ' + (R.cap - R.pre) + ' medida más, ' : 'Con ' + R.cap + ' medidas, ') + m3VName(R.v) + ' quedó exactamente lleno, sin una gota de sobra.',
                    'Brim full. ' + (R.pre > 0 ? 'With the content of the sphere and ' + (R.cap - R.pre) + ' more measure, ' : 'With ' + R.cap + ' measures, ') + m3VName(R.v) + ' is exactly full, without a drop to spare.'), 'good');
  } else {
    setFb('m3fb', L('Sigue habiendo hueco: el nivel va en el ' + Math.round(M3.poured / R.cap * 100) + ' % de la capacidad.',
                    'There is still room: the level is at ' + Math.round(M3.poured / R.cap * 100) + ' % of the capacity.'), '');
  }
  m3Update();
}
function m3Update(){
  if (!M3) return;
  var R = M3R[M3.round];
  setTx('m3r', L('Reto ' + (M3.round + 1) + ' de 3', 'Challenge ' + (M3.round + 1) + ' of 3'));
  setTx('m3p', M3.poured + ' / ' + R.cap);
  setTx('m3l', Math.round(Math.min(1, M3.poured / R.cap) * 100) + ' %');
  setTx('m3g', String(M3.guess));
  setTx('m3goal', R.pre > 0
    ? L('El cilindro ya recibió todo el contenido de la esfera. ¿Cuántas medidas más lo llenan hasta el borde?',
        'The cylinder has already received the whole content of the sphere. How many more measures fill it to the brim?')
    : L('¿Cuántas medidas llenan ' + m3VName(R.v) + ' hasta el borde?',
        'How many measures fill ' + m3VName(R.v) + ' to the brim?'));
  m3Draw();
}
function m3CapH(frc){
  var lo = 0, hi = 2, mid, val, i;
  for (i = 0; i < 40; i++){
    mid = (lo + hi) / 2;
    val = mid * mid * (3 - mid) / 4;
    if (val < frc) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function m3Draw(){
  var f = cvFit('m3cv'); if (!f || !M3) return;
  var ctx = f.ctx, R = M3R[M3.round];
  var pr = Math.min((f.h - 70) / 4, (f.w - 150) / 3, 48);
  var by = f.h - 26, cx = f.w * 0.63, mx = f.w * 0.2;
  var frc = Math.min(1, M3.poured / R.cap);
  ctx.save(); ctx.fillStyle = cssv('--gold-bg'); ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mx - pr * 0.6, by - pr * 1.2); ctx.lineTo(mx + pr * 0.6, by - pr * 1.2); ctx.lineTo(mx, by); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.restore();
  cvLabel(ctx, L('la medida', 'the measure'), mx, by - pr * 1.2 - 12, cssv('--gold'), 'center');
  cvLabel(ctx, L('cono', 'cone'), mx, by + 14, cssv('--text3'), 'center');
  var lvl;
  ctx.save();
  ctx.beginPath();
  if (R.v === 'esfera'){ ctx.arc(cx, by - pr, pr, 0, Math.PI * 2); lvl = m3CapH(frc) * pr; }
  else { ctx.rect(cx - pr, by - 2 * pr, 2 * pr, 2 * pr); lvl = frc * 2 * pr; }
  ctx.clip();
  ctx.fillStyle = cssv('--green'); ctx.globalAlpha = 0.55;
  ctx.fillRect(cx - pr - 4, by - lvl, 2 * pr + 8, lvl + 4);
  ctx.restore();
  ctx.save(); ctx.strokeStyle = cssv('--green-dark'); ctx.lineWidth = 2.4;
  ctx.beginPath();
  if (R.v === 'esfera') ctx.arc(cx, by - pr, pr, 0, Math.PI * 2);
  else ctx.rect(cx - pr, by - 2 * pr, 2 * pr, 2 * pr);
  ctx.stroke(); ctx.restore();
  if (M3.spill){
    ctx.save(); ctx.fillStyle = cssv('--green'); ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(cx, by + 6, pr * 1.5, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    cvLabel(ctx, L('se derramó', 'it spilled'), cx, by + 18, cssv('--bad'), 'center');
  }
  ctx.save(); ctx.strokeStyle = cssv('--text3'); ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - pr - 12, by - (R.v === 'esfera' ? 2 * pr : 2 * pr)); ctx.lineTo(cx + pr + 12, by - 2 * pr); ctx.stroke(); ctx.restore();
  cvLabel(ctx, L('borde', 'brim'), cx + pr + 14, by - 2 * pr, cssv('--text3'));
  cvLabel(ctx, R.v === 'esfera' ? L('esfera de radio ' + M3.r + ' cm', 'sphere of radius ' + M3.r + ' cm')
                                : L('cilindro de radio ' + M3.r + ' cm', 'cylinder of radius ' + M3.r + ' cm'), cx, 14, cssv('--green'), 'center');
}
function m3Check(){
  if (!M3 || M3.done || M3.resolved) return;
  var R = M3R[M3.round], need = m3Need();
  if (M3.guess === need){
    M3.resolved = true;
    setFb('m3fb', L('Predicción correcta. ' + (R.pre > 0
        ? 'La esfera dejó lleno el cilindro hasta dos tercios, así que una medida más lo remata.'
        : 'Vierte las medidas y verás que ' + m3VName(R.v) + ' queda al ras con ' + need + '.'),
      'Correct prediction. ' + (R.pre > 0
        ? 'The sphere filled the cylinder up to two thirds, so one more measure finishes it.'
        : 'Pour the measures and you will see ' + m3VName(R.v) + ' come out brim full with ' + need + '.')), 'good');
    showEl('m3next', true);
    return;
  }
  M3.tries++;
  if (M3.tries >= 3){
    M3.resolved = true;
    M3.guess = need;
    setFb('m3fb', L('Eran ' + need + '. Viértelas y compruébalo: el nivel llega justo al borde y no sobra nada.',
                    'It was ' + need + '. Pour them and check it: the level reaches the brim exactly and nothing is left over.'), 'near');
    m3Update();
    showEl('m3next', true);
    return;
  }
  var msg = M3.guess < need
    ? L('Te quedas corto: con ' + M3.guess + ' el nivel solo llegaría al ' + Math.round((R.pre + M3.guess) / R.cap * 100) + ' % y quedaría hueco. Prueba con más.',

        'You go over: with ' + M3.guess + ' it would spill, because ' + m3VName(R.v) + ' reaches the brim before that. Try fewer.');

}
function m3Next(){

                    'The bench made it clear: the cone measure fits 2 times into the sphere and 3 times into the cylinder, so a cone, a sphere and a cylinder sharing radius and height are in the ratio 1 : 2 : 3.'), 'good');

/* ================================================
   MANIPULATIVE 4 : Banco de escala
   One slider changes the radius shared by the three solids. The bars and the
   numbers move live, and the ratio tile shows that 1 : 2 : 3 never moves. The
   student is asked to hit a requested sphere volume; feedback says whether the
   radius is short or long. Answer revealed on the third miss.
   ================================================ */
function m4Build(rng){
  M4 = { r: 4, targets: shuffle([2, 3, 5, 6, 7], rng).slice(0, 3), round: 0, tries: 0, resolved: false, done: false };
}
function m4V(kind, r){
  return kind === 'cono' ? 2 * PIV * r * r * r / 3 : kind === 'esfera' ? 4 * PIV * r * r * r / 3 : 2 * PIV * r * r * r;
}
function m4Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Banco de escala', 'Scaling bench') + '</div>' +
      '<div class="mround" id="m4r"></div></div>' +
    '<p style="font-size:.86rem">' + L(
      'Los tres cuerpos comparten el radio, y el cono y el cilindro tienen de altura el diámetro de la esfera. Cambia el radio y vigila las tres barras: crecen juntas, pero mira si la proporción entre ellas se mueve.',
      'The three solids share the radius, and the cone and the cylinder have the diameter of the sphere as their height. Change the radius and watch the three bars: they grow together, but see whether the proportion between them moves.') + '</p>' +
    '<div class="callout" style="margin:.6rem 0"><p><strong id="m4goal"></strong></p></div>' +
    '<div class="cgrid" style="margin-top:.6rem">' +
      '<div class="cg"><label>' + L('Radio', 'Radius') + ': <span class="cval" id="m4lr"></span> cm</label>' +
        '<input type="range" id="m4s" min="1" max="10" step="0.5" oninput="m4Input()"></div>' +
      '<div class="cg"><label>' + L('Altura del cono y del cilindro', 'Height of the cone and the cylinder') + ': <span class="cval" id="m4lh"></span> cm</label>' +
        '<div class="mnote" id="m4note"></div></div>' +
    '</div>' +
    '<div class="mbarow"><span>' + L('Cono', 'Cone') + '</span><span><span class="mbar acc" id="m4b1" style="width:0%"></span></span><span class="mbarval" id="m4n1"></span></div>' +
    '<div class="mbarow"><span>' + L('Esfera', 'Sphere') + '</span><span><span class="mbar" id="m4b2" style="width:0%"></span></span><span class="mbarval" id="m4n2"></span></div>' +
    '<div class="mbarow"><span>' + L('Cilindro', 'Cylinder') + '</span><span><span class="mbar dk" id="m4b3" style="width:0%"></span></span><span class="mbarval" id="m4n3"></span></div>' +
    '<div class="mstat">' +
      '<div class="mtile"><div class="tl">' + L('Esfera entre cono', 'Sphere over cone') + '</div><div class="tv" id="m4q1"></div></div>' +
      '<div class="mtile"><div class="tl">' + L('Cilindro entre cono', 'Cylinder over cone') + '</div><div class="tv" id="m4q2"></div></div>' +
      '<div class="mtile" id="m4t3"><div class="tl">' + L('Razón', 'Ratio') + '</div><div class="tv" id="m4q3"></div></div>' +
    '</div>' +
    '<div class="mrow">' +
      '<button class="mbtn go" onclick="m4Check()">' + L('Fijar el radio', 'Fix the radius') + '</button>' +
      '<button class="mbtn go mhide" id="m4next" onclick="m4Next()">' + L('Siguiente pedido →', 'Next order →') + '</button>' +
    '</div>' +
    '<div class="mfb" id="m4fb"></div>' +
  '</div>';
}
function m4Init(){
  if (!M4 || !document.getElementById('m4s')) return;
  var s = document.getElementById('m4s'); if (s) s.value = String(M4.r);
  showEl('m4next', false);
  setFb('m4fb', L('Mueve el radio y observa las tres barras al mismo tiempo.',
                  'Move the radius and watch the three bars at the same time.'), '');
  m4Input();
}
function m4Input(){
  if (!M4) return;
  var s = document.getElementById('m4s');
  if (s) M4.r = parseFloat(s.value);
  var r = M4.r, vc = m4V('cono', r), ve = m4V('esfera', r), vl = m4V('cilindro', r);
  setTx('m4lr', n1(r)); setTx('m4lh', n1(2 * r));
  setTx('m4n1', n2(vc)); setTx('m4n2', n2(ve)); setTx('m4n3', n2(vl));
  var b1 = document.getElementById('m4b1'), b2 = document.getElementById('m4b2'), b3 = document.getElementById('m4b3');
  if (b1) b1.style.width = (vc / vl * 100) + '%';
  if (b2) b2.style.width = (ve / vl * 100) + '%';
  if (b3) b3.style.width = '100%';
  setTx('m4q1', n2(ve / vc)); setTx('m4q2', n2(vl / vc)); setTx('m4q3', '1 : 2 : 3');
  var t = document.getElementById('m4t3'); if (t) t.classList.add('hit');
  setTx('m4r', L('Pedido ' + (M4.round + 1) + ' de 3', 'Order ' + (M4.round + 1) + ' of 3'));
  setTx('m4goal', L('Ajusta el radio para que la esfera mida ' + n2(m4V('esfera', M4.targets[M4.round])) + ' cm³.',
                    'Set the radius so that the sphere measures ' + n2(m4V('esfera', M4.targets[M4.round])) + ' cm³.'));
  setTx('m4note', L('Las barras se miden contra el cilindro, que es el mayor de los tres.',
                    'The bars are measured against the cylinder, the largest of the three.'));
}
function m4Check(){
  if (!M4 || M4.done || M4.resolved) return;
  var t = M4.targets[M4.round], vt = m4V('esfera', t), v = m4V('esfera', M4.r);
  if (Math.abs(M4.r - t) < 0.01){
    M4.resolved = true;
    setFb('m4fb', L('Justo: con radio ' + t + ' cm la esfera mide ' + n2(vt) + ' cm³, el cono ' + n2(m4V('cono', t)) + ' cm³ y el cilindro ' + n2(m4V('cilindro', t)) + ' cm³. La razón sigue siendo 1 : 2 : 3.',
                    'Right there: with radius ' + t + ' cm the sphere measures ' + n2(vt) + ' cm³, the cone ' + n2(m4V('cono', t)) + ' cm³ and the cylinder ' + n2(m4V('cilindro', t)) + ' cm³. The ratio is still 1 : 2 : 3.'), 'good');
    showEl('m4next', true);
    return;
  }
  M4.tries++;
  if (M4.tries >= 3){
    M4.resolved = true;
    M4.r = t;
    var s = document.getElementById('m4s'); if (s) s.value = String(t);
    m4Input();
    setFb('m4fb', L('El radio pedido era ' + t + ' cm. Fíjate en que al triplicar el radio el volumen se multiplica por mucho más de tres, pero la razón entre los tres cuerpos no se mueve.',
                    'The requested radius was ' + t + ' cm. Notice that tripling the radius multiplies the volume by far more than three, yet the ratio between the three solids does not move.'), 'near');
    showEl('m4next', true);
    return;
  }
  var msg = v < vt
    ? L('Vas corto: tu esfera mide ' + n2(v) + ' cm³ y el pedido es mayor. Aumenta el radio.',
        'You are short: your sphere measures ' + n2(v) + ' cm³ and the order is bigger. Increase the radius.')
    : L('Te pasas: tu esfera mide ' + n2(v) + ' cm³ y el pedido es menor. Reduce el radio.',
        'You go over: your sphere measures ' + n2(v) + ' cm³ and the order is smaller. Reduce the radius.');
  setFb('m4fb', msg, 'near');
}
function m4Next(){
  if (!M4) return;
  M4.round++; M4.tries = 0; M4.resolved = false;
  showEl('m4next', false);
  if (M4.round >= 3){
    M4.done = true; M4.round = 2;
    setFb('m4fb', L('Tres radios distintos y siempre lo mismo: la esfera vale el doble que el cono y el cilindro el triple. La razón no depende del tamaño.',
                    'Three different radii and always the same thing: the sphere is worth twice the cone and the cylinder three times it. The ratio does not depend on the size.'), 'good');
    return;
  }
  M4.r = 4;
  var s = document.getElementById('m4s'); if (s) s.value = '4';
  setFb('m4fb', L('Pedido nuevo. Busca el radio que da el volumen pedido.',
                  'New order. Find the radius that gives the requested volume.'), '');
  m4Input();
}
/* ================================================

        'The cylinder and the cone can be opened up and left flat on the table without deforming them. The skin of the sphere cannot: it curves in two directions at once, so to cover it you cut it into long strips called gores, and even then some wrinkling remains. That is why no flat world map is completely faithful.') + '</p></div>'

    questionText: L('Un taller funde barras cilíndricas macizas de acero de ' + r9 + ' cm de radio y de altura igual al doble del radio, y con ese metal cuela esferas macizas del mismo radio. Si se funden ' + k9 + ' barras y no se pierde material, ¿cuántas esferas completas se obtienen?',
                    'A workshop melts solid steel cylindrical bars of radius ' + r9 + ' cm and height equal to twice the radius, and with that metal it casts solid spheres of the same radius. If ' + k9 + ' bars are melted and no material is lost, how many complete spheres are obtained?'),
    hint: L('Averigua primero cuánto metal aporta una barra y cuánto se lleva una esfera del mismo radio, y usa esa comparación con todas las barras. Solo cuentan las esferas que quedan enteras.',
            'First work out how much metal one bar provides and how much a sphere of the same radius takes, and use that comparison with all the bars. Only spheres that come out whole count.'),
    explanation: L('Cada barra aporta 3.1416 × ' + r9 + '² × ' + (2 * r9) + ' = ' + n2(vCil9) + ' cm³ y cada esfera se lleva ' + frac(4, 3) + ' × 3.1416 × ' + r9 + '³ = ' + n2(vEsf9) + ' cm³, es decir una barra y media por esfera. Con ' + k9 + ' barras salen ' + n2(vCil9 * k9 / vEsf9) + ' esferas, y completas solo hay ' + ans9,
                   'Each bar provides 3.1416 × ' + r9 + '² × ' + (2 * r9) + ' = ' + n2(vCil9) + ' cm³ and each sphere takes ' + frac(4, 3) + ' × 3.1416 × ' + r9 + '³ = ' + n2(vEsf9) + ' cm³, that is one bar and a half per sphere. With ' + k9 + ' bars there are ' + n2(vCil9 * k9 / vEsf9) + ' spheres, and complete ones only ' + ans9),
    options: o9, correct: o9[0], showWork: true
  }, rng);

  /* ── Problema 10 ── */
  var p10v = Math.floor(rng() * 2);
  if (p10v === 0){
    var o10 = [
      L('Se mantiene la misma en todos los juegos, sin importar el tamaño', 'It stays the same in every set, no matter the size'),
      L('La esfera saca ventaja al cilindro en los juegos más grandes', 'The sphere gains on the cylinder in the larger sets'),
      L('El cilindro saca ventaja a la esfera en los juegos más grandes', 'The cylinder gains on the sphere in the larger sets'),
      L('Se invierte en cuanto el radio pasa de los diez centímetros', 'It flips as soon as the radius goes past ten centimetres')
    ];
    pushProb({
      title: L('Juegos grandes y juegos chicos', 'Large sets and small sets'),
      questionText: L('Un taller fabrica juegos formados por un cono, una esfera y un cilindro que comparten radio, con el cono y el cilindro de altura igual al diámetro de la esfera. Hay juegos de escritorio de 3 cm de radio y juegos de exhibición de 40 cm de radio. ¿Qué ocurre con la razón entre los volúmenes de las tres piezas al pasar de un juego al otro?',
                      'A workshop makes sets formed by a cone, a sphere and a cylinder sharing the radius, with the cone and the cylinder of height equal to the diameter of the sphere. There are desk sets of radius 3 cm and display sets of radius 40 cm. What happens to the ratio between the volumes of the three pieces when going from one set to the other?'),
      hint: L('Escribe los tres volúmenes en función del radio y fíjate en el factor que llevan en común antes de compararlos entre sí.',
              'Write the three volumes in terms of the radius and look at the factor they share before comparing them with each other.'),
      explanation: L('Los tres volúmenes se escriben como un número por π r³, así que al compararlos ese factor común desaparece y solo quedan los números. La razón entre las tres piezas es la misma en el juego de escritorio y en el de exhibición.',
                     'The three volumes are written as a number times π r³, so when they are compared that common factor disappears and only the numbers remain. The ratio between the three pieces is the same in the desk set and in the display set.'),
      options: o10, correct: o10[0], showWork: false
    }, rng);
  } else {
    var o10b = [
      L('No existe un desarrollo plano exacto y hay que cortarla en husos que se deforman un poco', 'There is no exact flat development and it has to be cut into gores that deform a little'),
      L('Se obtiene un rectángulo y dos círculos exactos, igual que ocurre con el cilindro', 'You get a rectangle and two exact circles, just as happens with the cylinder'),
      L('Se obtiene un sector circular y un círculo exactos, igual que ocurre con el cono', 'You get a circular sector and an exact circle, just as happens with the cone'),
      L('Se obtiene un desarrollo exacto siempre que la esfera sea suficientemente pequeña', 'You get an exact development as long as the sphere is small enough')
    ];
    pushProb({
      title: L('La piel sobre la mesa', 'The skin on the table'),
      questionText: L('Un taller quiere forrar globos terráqueos y prueba a extender sobre la mesa la piel completa de la esfera, sin estirarla ni romperla. ¿Qué ocurre al intentarlo?',
                      'A workshop wants to cover globes and tries to spread the complete skin of the sphere out on the table, without stretching or tearing it. What happens when they try?'),
      hint: L('Piensa en qué se puede recortar de una hoja plana. El cilindro y el cono se abren sin deformarse porque su superficie se curva en una sola dirección.',
              'Think about what can be cut out of a flat sheet. The cylinder and the cone open up without deforming because their surface curves in a single direction.'),
      explanation: L('La superficie de la esfera se curva en dos direcciones a la vez, así que no hay ninguna figura plana que la reproduzca sin arrugas ni desgarres. En la práctica se corta de polo a polo en tiras angostas, los husos, que se pegan con una deformación pequeña.',
                     'The surface of the sphere curves in two directions at once, so there is no flat figure that reproduces it without wrinkles or tears. In practice it is cut from pole to pole into narrow strips, the gores, which are glued on with a small deformation.'),
      options: o10b, correct: o10b[0], showWork: false
    }, rng);
  }
}
</script>
