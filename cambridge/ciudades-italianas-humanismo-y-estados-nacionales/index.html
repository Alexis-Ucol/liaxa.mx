<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciudades Italianas, Humanismo y Estados Nacionales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Ciudades Italianas, Humanismo y Estados Nacionales</div>
    <div class="wcourse" id="wcourse-el">Historia · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Ciudades Italianas, Humanismo y Estados Nacionales</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#c0202a', primaryDark:'#490a0e', primaryBg:'#f6e7e8',
  accent:'#f5c800', accentBg:'#fff8db',
  darkPrimary:'#c94049', darkPrimaryDark:'#e97179', darkPrimaryBg:'#3b0a0e',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')

    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });

    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');

    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);

var MANIP = {};
function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function addProblem(spec, rng){
  var so = shuffleOpts(spec.options, spec.correct, rng);
  var p = { title: spec.title, questionText: spec.questionText, fn: '', hint: spec.hint || '',
            explanation: spec.explanation || '', options: so.options, correctIdx: so.correctIdx,
            showWork: !!spec.showWork, studentChoice: null, pendingChoice: null };
  problems.push(p);
  buildOneCard(p, problems.length - 1);
}

  var d = document.createElement('div');

  document.getElementById('lessonBody').appendChild(d);
  return d;
}

/* ── MANIPULABLE E :: balanza comercial de la metropoli (3 rondas) ── */
function mE_build(rng){
  var rounds = [];
  for (var r = 0; r < 3; r++) {
    var ex = (6 + Math.floor(rng() * 7)) * 100;
    var meta = (2 + Math.floor(rng() * 4)) * 100;
    rounds.push({ ex:ex, meta:meta, imp:ex });
  }
  MANIP.E = { rounds:rounds, round:0, tries:0, done:false };
}
function mE_round(){ return MANIP.E.rounds[MANIP.E.round]; }
function mE_render(){

      '<div class="mzfb ok">' + L({ es:'Ajustaste tres balanzas. Esa era la idea central de la politica economica de las metropolis: vender mas de lo que se compra al exterior y acumular metales, con las colonias obligadas a comerciar solo con ellas.',

                              en:'The metropolis sells abroad for ' + d.ex + ' thousand escudos. Move its purchases abroad until the favorable balance is exactly ' + d.meta + ' thousand escudos.' }) + '</div>' +
    '<div class="bmwrap">' +
      '<div class="bmtag l">' + L({ es:'lo que vende', en:'what it sells' }) + '</div>' +
      '<div class="bmtag r">' + L({ es:'lo que compra', en:'what it buys' }) + '</div>' +
      '<div class="bmbeam" id="mE_beam" style="transform:rotate(' + deg + 'deg)"></div>' +
      '<div class="bmpiv"></div>' +
      '<div class="bmnum" id="mE_num">' + L({ es:'saldo: ', en:'balance: ' }) + saldo + '</div>' +
    '</div>' +
    '<div class="barwrap">' +
      '<div class="barrow"><div class="barlbl">' + L({ es:'ventas', en:'sales' }) + '</div>' +
        '<div class="bartrack"><div class="barfill" style="width:100%"></div></div>' +
        '<div class="barval">' + d.ex + '</div></div>' +
      '<div class="barrow"><div class="barlbl">' + L({ es:'compras', en:'purchases' }) + '</div>' +
        '<div class="bartrack"><div class="barfill acc" id="mE_bar" style="width:' + (d.imp / d.ex * 100) + '%"></div></div>' +
        '<div class="barval" id="mE_val">' + d.imp + '</div></div>' +
      '<input class="mzsl" type="range" id="mE_sl" min="0" max="' + d.ex + '" step="20" value="' + d.imp + '" oninput="mE_input()">' +
    '</div>' +
    '<div class="mzrow"><button class="mzbtn" onclick="mE_check()">' + L({ es:'Cerrar el ano', en:'Close the year' }) + '</button>' +
      '<button class="mzbtn2" onclick="mE_reset()">' + L({ es:'Volver al inicio', en:'Back to start' }) + '</button></div>' +
    '<div class="mzfb" id="mE_fb">' + L({ es:'Mueve la barra dorada y observa como se inclina la balanza a favor o en contra de la metropoli.',
                                          en:'Move the gold bar and watch the balance tip in favor of or against the metropolis.' }) + '</div>';
}
function mE_input(){
  var E = MANIP.E, d = mE_round();
  d.imp = parseInt(document.getElementById('mE_sl').value, 10);
  var saldo = d.ex - d.imp, dif = saldo - d.meta;
  document.getElementById('mE_bar').style.width = (d.imp / d.ex * 100) + '%';
  document.getElementById('mE_val').textContent = d.imp;
  document.getElementById('mE_num').textContent = L({ es:'saldo: ', en:'balance: ' }) + saldo;
  document.getElementById('mE_beam').style.transform = 'rotate(' + Math.max(-11, Math.min(11, dif / 40)) + 'deg)';
  if (dif === 0) setFB('mE_fb', L({ es:'La balanza quedo justo en la meta. Cierra el ano.', en:'The balance is right on target. Close the year.' }), 'warn');
  else if (dif > 0) setFB('mE_fb', L({ es:'El saldo favorable pasa de la meta por ' + dif + '. Compra un poco mas al exterior.',
                                       en:'The favorable balance exceeds the target by ' + dif + '. Buy a bit more abroad.' }), '');
  else setFB('mE_fb', L({ es:'El saldo favorable se queda corto por ' + (-dif) + '. Compra menos al exterior.',
                          en:'The favorable balance falls short by ' + (-dif) + '. Buy less abroad.' }), '');
}
function mE_reset(){
  var d = mE_round();
  d.imp = d.ex;
  mE_render();
}
function mE_advance(){
  var E = MANIP.E;
  E.round++; E.tries = 0;
  if (E.round >= 3) E.done = true;
  mE_render();
}
function mE_check(){
  var E = MANIP.E, d = mE_round(), saldo = d.ex - d.imp, dif = saldo - d.meta;
  if (dif === 0) {
    setFB('mE_fb', L({ es:'Ano cerrado con saldo favorable de ' + d.meta + ': la metropoli vendio ' + d.ex + ' y compro ' + d.imp + ', de modo que entraron metales en sus arcas.',
                       en:'Year closed with a favorable balance of ' + d.meta + ': the metropolis sold ' + d.ex + ' and bought ' + d.imp + ', so precious metals flowed into its treasury.' }), 'ok');
    setTimeout(mE_advance, 2200);
    return;
  }
  E.tries++;
  if (E.tries >= 3) {
    d.imp = d.ex - d.meta;
    mE_render();
    setFB('mE_fb', L({ es:'Para un saldo favorable de ' + d.meta + ' con ventas de ' + d.ex + ', las compras al exterior debian ser de ' + (d.ex - d.meta) + '.',
                       en:'For a favorable balance of ' + d.meta + ' with sales of ' + d.ex + ', purchases abroad had to be ' + (d.ex - d.meta) + '.' }), 'warn');
    setTimeout(mE_advance, 3000);
    return;
  }
  setFB('mE_fb', (dif > 0 ? L({ es:'Todavia el saldo pasa de la meta. Sube las compras.', en:'The balance still exceeds the target. Raise purchases.' })
                          : L({ es:'Todavia el saldo se queda corto. Baja las compras.', en:'The balance still falls short. Lower purchases.' })), 'bad');
}

    L({ es:'<p>Entre los siglos XII y XIII, Europa vivio un renacer de la vida urbana. Dos regiones concentraron ese impulso: el norte de Italia, con Venecia, Genova, Milan y Florencia, y Flandes, con Brujas, Gante y Amberes. Las ciudades italianas dominaban el Mediterraneo y traian especias, seda y alumbre del Levante; las ciudades flamencas producian y vendian pano de lana de alta calidad con materia prima llegada de Inglaterra.</p>' +
              '<p>Entre las dos regiones se abrio un puente: las ferias de Champana, en el reino de Francia, donde los mercaderes de ambos extremos se reunian varias veces al ano. Mover tanto valor obligo a inventar herramientas nuevas: la letra de cambio, que evitaba viajar con monedas, la contabilidad por partida doble y las primeras companias con socios y capital. En las ciudades, los gremios regulaban oficios, precios y aprendizaje, y la burguesia negociaba con los senores cartas de franquicia que le daban gobierno propio, tribunales y mercado.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Venecia</div><div class="rform">galeras al Levante</div><div class="rnote">especias, seda y alumbre para toda Europa</div></div>' +

                '<div class="rcard"><div class="rname">Florencia</div><div class="rform">banca y talleres</div><div class="rnote">ganancias que despues financian el Humanismo</div></div>' +

          en:'<p>Between the 12th and 13th centuries Europe experienced a rebirth of urban life. Two regions concentrated that momentum: northern Italy, with Venice, Genoa, Milan and Florence, and Flanders, with Bruges, Ghent and Antwerp. The Italian cities dominated the Mediterranean and brought spices, silk and alum from the Levant; the Flemish cities produced and sold high quality wool cloth using raw material shipped from England.</p>' +

  addSection(L({ es:'Concepto 2', en:'Concept 2' }), L({ es:'El feudalismo se transmuta y nace el Humanismo', en:'Feudalism transmutes and Humanism is born' }),
    L({ es:'<p>El dinero que circulaba por las ciudades cambio el orden feudal desde dentro. Muchos senores empezaron a cobrar rentas en moneda en lugar de exigir servicios de trabajo, algunos campesinos compraron su libertad y otros se marcharon a la ciudad. La riqueza dejo de medirse solo en tierra y comenzo a medirse tambien en capital, credito y mercancias. A eso se le llama transmutacion del sistema feudal: no desaparece de golpe, se transforma.</p>' +
              '<p>En ese mundo urbano nacio el Humanismo. Los humanistas volvieron a los textos griegos y latinos originales, aprendieron sus lenguas, criticaron las copias mal hechas y pusieron al ser humano y a su experiencia en el centro del estudio. Su programa se llamo studia humanitatis: gramatica, retorica, poesia, historia y filosofia moral. Los financiaron banqueros y ciudades ricas mediante el mecenazgo, y desde 1450 la imprenta de tipos moviles multiplico los libros: lo que antes tardaba meses de copia a mano se producia en cientos de ejemplares iguales.</p>' +
              '<table class="dtable"><tr><th>Antes</th><th>Con el Humanismo</th></tr>' +
              '<tr><td>El saber se organiza para comentar autoridades</td><td>Se leen y se corrigen los textos originales</td></tr>' +
              '<tr><td>La copia a mano limita la circulacion</td><td>La imprenta difunde ideas entre ciudades</td></tr>' +
              '<tr><td>La tierra define riqueza y prestigio</td><td>El comercio y el credito tambien dan prestigio</td></tr></table>',
          en:'<p>The money circulating through the cities changed the feudal order from within. Many lords began collecting rents in coin instead of demanding labor services, some peasants bought their freedom and others left for the city. Wealth stopped being measured only in land and began to be measured also in capital, credit and goods. This is called the transmutation of the feudal system: it does not vanish at once, it transforms.</p>' +
              '<p>Humanism was born in that urban world. Humanists returned to the original Greek and Latin texts, learned their languages, criticized faulty copies and placed the human being and human experience at the center of study. Their program was called studia humanitatis: grammar, rhetoric, poetry, history and moral philosophy. Bankers and wealthy cities funded them through patronage, and from 1450 the movable type press multiplied books: what once took months of hand copying was produced in hundreds of identical copies.</p>' +
              '<table class="dtable"><tr><th>Before</th><th>With Humanism</th></tr>' +
              '<tr><td>Learning is organized to comment on authorities</td><td>Original texts are read and corrected</td></tr>' +
              '<tr><td>Hand copying limits circulation</td><td>Printing spreads ideas between cities</td></tr>' +

  addSection(L({ es:'Concepto 3', en:'Concept 3' }), L({ es:'Estados nacionales, monarquias absolutas y rutas por el oceano', en:'National states, absolute monarchies and ocean routes' }),
    L({ es:'<p>Mientras las ciudades crecian, los reyes de Castilla, Portugal, Francia e Inglaterra fueron reuniendo en sus manos lo que antes estaba repartido entre senores: el cobro de impuestos en todo el reino, un ejercito permanente, una administracion de funcionarios y unas mismas leyes para territorios distintos. Esa concentracion dio forma a los estados nacionales y, con el tiempo, a las monarquias absolutas, donde el rey afirmaba concentrar toda la autoridad. La burguesia apoyo el proceso: prestaba dinero y pagaba impuestos a cambio de proteccion, caminos seguros y privilegios comerciales.</p>' +
              '<p>Esos estados, ya con recursos, financiaron la busqueda de rutas maritimas. En 1453 los otomanos tomaron Constantinopla y el paso hacia Asia quedo bajo otro control, mas costoso para los mercaderes europeos. Portugal costeo Africa, doblo el cabo de Buena Esperanza en 1488 y llego a la India en 1498; Castilla financio en 1492 el viaje que llevo a la llegada a America; el tratado de Tordesillas repartio en 1494 las zonas de navegacion entre ambas coronas y la expedicion de Magallanes y Elcano completo la primera vuelta al mundo entre 1519 y 1522.</p>' +
              '<table class="dtable"><tr><th>Ano</th><th>Hecho</th></tr>' +
              '<tr><td>1453</td><td>Los otomanos toman Constantinopla</td></tr>' +
              '<tr><td>1488</td><td>Portugal dobla el cabo de Buena Esperanza</td></tr>' +
              '<tr><td>1492</td><td>Viaje financiado por Castilla que llega a America</td></tr>' +
              '<tr><td>1494</td><td>Tratado de Tordesillas entre Castilla y Portugal</td></tr>' +
              '<tr><td>1498</td><td>Llegada portuguesa a la India por el oceano</td></tr>' +
              '<tr><td>1519 a 1522</td><td>Primera vuelta al mundo</td></tr></table>',
          en:'<p>While the cities grew, the kings of Castile, Portugal, France and England gathered into their own hands what had been scattered among lords: tax collection across the kingdom, a standing army, an administration of officials and the same laws for different territories. That concentration shaped the national states and, in time, the absolute monarchies, where the king claimed to hold all authority. The bourgeoisie backed the process: it lent money and paid taxes in exchange for protection, safe roads and trade privileges.</p>' +
              '<p>Those states, now with resources, funded the search for sea routes. In 1453 the Ottomans took Constantinople and the way to Asia came under another control, costlier for European merchants. Portugal sailed down Africa, rounded the Cape of Good Hope in 1488 and reached India in 1498; Castile funded in 1492 the voyage that led to the arrival in America; the treaty of Tordesillas divided navigation zones between the two crowns in 1494, and the Magellan and Elcano expedition completed the first circumnavigation between 1519 and 1522.</p>' +
              '<table class="dtable"><tr><th>Year</th><th>Event</th></tr>' +
              '<tr><td>1453</td><td>The Ottomans take Constantinople</td></tr>' +
              '<tr><td>1488</td><td>Portugal rounds the Cape of Good Hope</td></tr>' +

  addSection(L({ es:'Concepto 4', en:'Concept 4' }), L({ es:'Cinco potencias, cinco maneras de colonizar', en:'Five powers, five ways of colonizing' }),
    L({ es:'<p>Una vez abiertas las rutas, las potencias europeas disputaron territorios en America, Africa y Asia, y ninguna colonizo igual. Espana organizo virreinatos con virrey, audiencias y ciudades, impuso la encomienda y el trabajo por turnos, y volco su economia en la plata de Zacatecas y Potosi. Portugal levanto primero una cadena de factorias fortificadas en las costas de Africa y Asia para asegurar la ruta de las especias, y despues desarrollo en Brasil grandes plantaciones de azucar.</p>' +
              '<p>Inglaterra fundo en la costa atlantica de Norteamerica colonias de poblamiento donde llegaban familias enteras, con asambleas locales y una sociedad formada por propietarios, artesanos, trabajadores llegados por contrato y personas esclavizadas, sobre todo en las colonias del sur. Con los pueblos originarios los colonos ingleses combinaron intercambio, tratados y alianzas con despojo de tierras y conflictos armados. Francia poblo poco su Nueva Francia y organizo en cambio una red de puestos junto a rios y lagos del noreste, donde el trafico de pieles de castor crecio con la demanda europea de sombreros. Holanda entrego el comercio a companias privadas con monopolio, acciones y flota propia, que controlaron puertos del sudeste asiatico.</p>' +
              '<table class="dtable"><tr><th>Potencia</th><th>Rasgo principal</th></tr>' +
              '<tr><td>Espana</td><td>Virreinatos, encomienda y mineria de plata</td></tr>' +
              '<tr><td>Portugal</td><td>Factorias en Africa y Asia, azucar en Brasil</td></tr>' +
              '<tr><td>Inglaterra</td><td>Colonias de poblamiento en Norteamerica</td></tr>' +
              '<tr><td>Francia</td><td>Puestos de trafico de pieles en el noreste</td></tr>' +
              '<tr><td>Holanda</td><td>Companias con monopolio y puertos en Asia</td></tr></table>' +
              '<div class="callout"><p><strong>Por que el Caribe y el sudeste asiatico.</strong> Inglaterra, Francia y Holanda concentraron su actividad en islas y puertos que eran paso obligado de las rutas y permitian controlar productos de altisimo valor, como el azucar o las especias, con territorios pequenos y facilmente defendibles por una flota.</p></div>',
          en:'<p>Once the routes were open, the European powers disputed territories in America, Africa and Asia, and none colonized in the same way. Spain organized viceroyalties with a viceroy, courts and cities, imposed the encomienda and rotating labor duty, and poured its economy into the silver of Zacatecas and Potosi. Portugal first built a chain of fortified trading posts along the coasts of Africa and Asia to secure the spice route, and later developed large sugar plantations in Brazil.</p>' +
              '<p>England founded settlement colonies on the Atlantic coast of North America where whole families arrived, with local assemblies and a society made up of landowners, artisans, workers arriving under contract and enslaved people, especially in the southern colonies. With the indigenous peoples the English colonists combined exchange, treaties and alliances with land dispossession and armed conflict. France settled few people in New France and instead organized a network of posts along northeastern rivers and lakes, where the beaver fur trade grew with European demand for hats. The Netherlands handed trade to private monopoly companies with shares and their own fleet, which controlled ports in southeast Asia.</p>' +
              '<table class="dtable"><tr><th>Power</th><th>Main trait</th></tr>' +
              '<tr><td>Spain</td><td>Viceroyalties, encomienda and silver mining</td></tr>' +
              '<tr><td>Portugal</td><td>Trading posts in Africa and Asia, sugar in Brazil</td></tr>' +
              '<tr><td>England</td><td>Settlement colonies in North America</td></tr>' +
              '<tr><td>France</td><td>Fur trade posts in the northeast</td></tr>' +
              '<tr><td>Netherlands</td><td>Monopoly companies and ports in Asia</td></tr></table>' +
              '<div class="callout"><p><strong>Why the Caribbean and southeast Asia.</strong> England, France and the Netherlands concentrated their activity on islands and ports that were obligatory stops on the routes and allowed control of extremely valuable goods, such as sugar or spices, with small territories a fleet could easily defend.</p></div>' }));

  addSection(L({ es:'Explora', en:'Explore' }), L({ es:'Une cada potencia con su modelo', en:'Match each power with its model' }),
    L({ es:'<p>Toca una potencia y despues el modelo colonial que la caracteriza. Si la pareja no corresponde, recibiras una pista sobre como organizo su imperio.</p>',
        en:'<p>Tap a power and then the colonial model that characterizes it. If the pair does not match, you will get a clue about how that power organized its empire.</p>' }) +
    '<div class="mzone" id="mzD"></div>');
  mD_build(rng); mD_render();

  /* ── PROBLEMA 7 ── */
  addProblem(v7 === 0 ? {
    title: L({ es:'Dos colonizaciones distintas', en:'Two different colonizations' }),
    questionText: L({ es:'En Nueva Espana y en Peru la corona espanola nombro virreyes, repartio encomiendas y organizo grandes centros mineros con trabajo obligado. En la Nueva Francia, en cambio, unos pocos colonos instalaron puestos junto a los rios para intercambiar mercancias con los pueblos originarios. ¿Que diferencia entre ambas colonizaciones muestran estos hechos?',
                      en:'In New Spain and Peru the Spanish crown appointed viceroys, distributed encomiendas and organized large mining centers with forced labor. In New France, by contrast, a few colonists set up posts along the rivers to exchange goods with indigenous peoples. What difference between the two colonizations do these facts show?' }),
    hint: L({ es:'Compara cuanto territorio administraba cada potencia y de que actividad sacaba su ganancia principal.',
              en:'Compare how much territory each power administered and which activity produced its main profit.' }),
    explanation: L({ es:'Espana monto un gobierno territorial extenso sostenido en trabajo obligado y mineria; Francia armo una red de puestos dedicada al intercambio de pieles.',
                     en:'Spain built an extensive territorial government based on forced labor and mining; France set up a network of posts devoted to the fur trade.' }),
    options: [ L({ es:'Una monto un gobierno territorial extenso con trabajo obligado; la otra, una red de puestos de intercambio', en:'One built an extensive territorial government with forced labor; the other, a network of trading posts' }),
               L({ es:'Las dos buscaban unicamente poblar el territorio con familias campesinas europeas', en:'Both sought only to settle the territory with European farming families' }),
               L({ es:'Ninguna de las dos dependia del comercio con su metropoli para sostenerse', en:'Neither of them depended on trade with its metropolis to sustain itself' }),
               L({ es:'Las dos entregaron su administracion a companias privadas con monopolio', en:'Both handed their administration to private monopoly companies' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Companias y colonos', en:'Companies and colonists' }),
    questionText: L({ es:'Holanda entrego el comercio de Asia a una compania privada con monopolio, flota y derecho de firmar tratados, mientras Inglaterra fundo en la costa atlantica de Norteamerica colonias donde se establecieron familias enteras. ¿Que contraste senala esa comparacion?',
                      en:'The Netherlands handed Asian trade to a private company with monopoly, fleet and the right to sign treaties, while England founded colonies on the Atlantic coast of North America where whole families settled. What contrast does that comparison point out?' }),
    hint: L({ es:'Pregunta que buscaba cada potencia: controlar el paso de las mercancias o instalar poblacion permanente.',
              en:'Ask what each power sought: controlling the flow of goods or installing permanent population.' }),
    explanation: L({ es:'Holanda priorizo el control de puertos y rutas mediante companias; Inglaterra apunto al poblamiento estable del territorio.',
                     en:'The Netherlands prioritized control of ports and routes through companies; England aimed at stable settlement of the territory.' }),
    options: [ L({ es:'Una potencia priorizo el control de puertos y rutas; la otra, el poblamiento del territorio', en:'One power prioritized control of ports and routes; the other, settlement of the territory' }),
               L({ es:'Las dos organizaron virreinatos dependientes de un consejo real', en:'Both organized viceroyalties answering to a royal council' }),
               L({ es:'Ninguna de las dos permitio la participacion de companias comerciales', en:'Neither of them allowed trading companies to take part' }),
               L({ es:'Las dos concentraron su actividad en la mineria de plata continental', en:'Both concentrated their activity on mainland silver mining' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ══════════ CONCEPTO 5 ══════════ */
  addSection(L({ es:'Concepto 5', en:'Concept 5' }), L({ es:'Una politica economica: expoliacion y monopolio', en:'An economic policy: extraction and monopoly' }),
    L({ es:'<p>La expoliacion de los recursos humanos y naturales de los territorios colonizados no fue un abuso aislado: fue una politica economica de estado. Las metropolis buscaban acumular metales preciosos vendiendo mas de lo que compraban al exterior, y para lograrlo obligaron a sus colonias a comerciar solo con ellas. Espana concentro el trafico autorizado en un puerto, organizo flotas vigiladas y cobro el quinto real, la quinta parte de los metales extraidos. Otras coronas hicieron algo parecido con sus propias leyes de navegacion y sus companias privilegiadas.</p>' +
              '<p>Esa politica se sostuvo en gran medida con trabajo forzado. Al disminuir la poblacion originaria por epidemias y por trabajos obligatorios, y al crecer la demanda europea de azucar, tabaco y plata, las potencias intensificaron el trafico transatlantico de personas esclavizadas. Las principales regiones de origen fueron Senegambia, la Costa de Oro, el golfo de Benin y Angola, en Africa occidental y central; los destinos principales fueron Brasil, las islas del Caribe, los puertos de la America espanola y las colonias inglesas del sur.</p>' +
              '<p>Las personas africanas esclavizadas eran obligadas a trabajar jornadas muy largas en plantaciones, minas y casas, se les separaba de sus familias y se les negaban derechos basicos. Aun asi sostuvieron su lengua, su musica, su cocina y sus creencias, formaron familias y comunidades y resistieron de muchas formas, desde el trabajo lento hasta la huida y la fundacion de pueblos libres llamados palenques o quilombos. Su trabajo y su cultura estan en la base de las sociedades americanas de hoy.</p>' +
              '<div class="callout"><p><strong>Lee la economia detras del dato.</strong> Cuando una metropoli prohibe a su colonia vender a otra potencia, no protege a la colonia: asegura que la ganancia del intercambio se quede en la metropoli.</p></div>',
          en:'<p>The extraction of human and natural resources from colonized territories was not an isolated abuse: it was a state economic policy. The metropolises sought to accumulate precious metals by selling more than they bought abroad, and to achieve this they forced their colonies to trade only with them. Spain concentrated authorized traffic in a single port, organized escorted fleets and collected the royal fifth, one fifth of the metals extracted. Other crowns did something similar with their own navigation laws and chartered companies.</p>' +
              '<p>That policy rested largely on forced labor. As the indigenous population declined through epidemics and compulsory labor, and as European demand for sugar, tobacco and silver grew, the powers intensified the transatlantic trafficking of enslaved people. The main regions of origin were Senegambia, the Gold Coast, the Bight of Benin and Angola, in western and central Africa; the main destinations were Brazil, the Caribbean islands, the ports of Spanish America and the southern English colonies.</p>' +
              '<p>Enslaved African people were forced to work very long days on plantations, in mines and in houses, were separated from their families and were denied basic rights. Even so they sustained their languages, music, cooking and beliefs, formed families and communities and resisted in many ways, from slow work to escape and the founding of free towns called palenques or quilombos. Their labor and their culture lie at the base of American societies today.</p>' +
              '<div class="callout"><p><strong>Read the economy behind the figure.</strong> When a metropolis forbids its colony to sell to another power, it is not protecting the colony: it is making sure the profit of the exchange stays in the metropolis.</p></div>' }));

  addSection(L({ es:'Explora', en:'Explore' }), L({ es:'Ajusta la balanza de la metropoli', en:'Adjust the balance of the metropolis' }),
    L({ es:'<p>La regla que seguian las metropolis era simple: vender mas al exterior de lo que se le compra. Mueve las compras y observa como se inclina la balanza.</p>',
        en:'<p>The rule the metropolises followed was simple: sell more abroad than you buy from abroad. Move the purchases and watch the balance tip.</p>' }) +
    '<div class="mzone" id="mzE"></div>');
  mE_build(rng); mE_render();

  /* ── PROBLEMA 8 ── */
  addProblem(v8 === 0 ? {
    title: L({ es:'El quinto real', en:'The royal fifth' }),
    questionText: L({ es:'De un cargamento de ' + S8 + ' marcos de plata que sale de las minas, la corona toma la quinta parte como impuesto. Del resto se descuentan ' + F8 + ' marcos por el traslado hasta el puerto. ¿Cuantos marcos llegan finalmente al comerciante?',
                      en:'From a shipment of ' + S8 + ' silver marks leaving the mines, the crown takes one fifth as tax. From what remains, ' + F8 + ' marks are deducted for carriage to the port. How many marks finally reach the merchant?' }),
    hint: L({ es:'Separa primero la parte que se lleva el impuesto y trabaja despues solo con lo que queda.',
              en:'First set aside the share the tax takes and then work only with what remains.' }),
    explanation: L({ es:'El impuesto es ' + S8 + ' entre 5 = ' + (S8/5) + ' marcos, asi que quedan ' + S8 + ' - ' + (S8/5) + ' = ' + (S8 - S8/5) + '. Tras el traslado llegan ' + (S8 - S8/5) + ' - ' + F8 + ' = ' + (S8 - S8/5 - F8),
                     en:'The tax is ' + S8 + ' divided by 5 = ' + (S8/5) + ' marks, so ' + S8 + ' - ' + (S8/5) + ' = ' + (S8 - S8/5) + ' remain. After carriage, arriving marks are ' + (S8 - S8/5) + ' - ' + F8 + ' = ' + (S8 - S8/5 - F8) }),
    options: [ (S8 - S8/5 - F8) + L({ es:' marcos', en:' marks' }), (S8 - S8/5) + L({ es:' marcos', en:' marks' }),
               (S8 - F8) + L({ es:' marcos', en:' marks' }), (S8 - S8/5 - 2*F8) + L({ es:' marcos', en:' marks' }) ],
    correct: 0, showWork: true
  } : {
    title: L({ es:'Pieles del noreste', en:'Pelts from the northeast' }),
    questionText: L({ es:'En un ano, un puesto frances del noreste de Norteamerica reune ' + N8 + ' pieles de castor. Envia la cuarta parte a la metropoli en el primer barco, ' + L8 + ' pieles se danan en el almacen y el resto sale en el segundo barco. ¿Cuantas pieles lleva el segundo barco?',
                      en:'In one year a French post in northeastern North America gathers ' + N8 + ' beaver pelts. It sends one quarter to the metropolis on the first ship, ' + L8 + ' pelts are damaged in the warehouse and the rest leaves on the second ship. How many pelts does the second ship carry?' }),
    hint: L({ es:'Calcula la parte del primer barco, quitala del total y despues considera las pieles que se danaron.',
              en:'Work out the first ship share, take it from the total and then account for the damaged pelts.' }),
    explanation: L({ es:'El primer barco lleva ' + N8 + ' entre 4 = ' + (N8/4) + ' pieles, asi que quedan ' + N8 + ' - ' + (N8/4) + ' = ' + (N8 - N8/4) + '. Sin las danadas, el segundo barco lleva ' + (N8 - N8/4) + ' - ' + L8 + ' = ' + (N8 - N8/4 - L8),
                     en:'The first ship carries ' + N8 + ' divided by 4 = ' + (N8/4) + ' pelts, so ' + N8 + ' - ' + (N8/4) + ' = ' + (N8 - N8/4) + ' remain. Without the damaged ones the second ship carries ' + (N8 - N8/4) + ' - ' + L8 + ' = ' + (N8 - N8/4 - L8) }),
    options: [ (N8 - N8/4 - L8) + L({ es:' pieles', en:' pelts' }), (N8 - N8/4) + L({ es:' pieles', en:' pelts' }),
               (N8 - L8) + L({ es:' pieles', en:' pelts' }), (N8/4) + L({ es:' pieles', en:' pelts' }) ],
    correct: 0, showWork: true
  }, rng);

  /* ── PROBLEMA 9 ── */
  addProblem(v9 === 0 ? {
    title: L({ es:'Reglas del comercio colonial', en:'Rules of colonial trade' }),
    questionText: L({ es:'Una metropoli obliga a sus colonias a venderle solo a ella sus materias primas, a comprarle solo a ella los productos manufacturados y prohibe todo comercio con otras potencias. ¿Cual era el objetivo de esa politica economica?',
                      en:'A metropolis forces its colonies to sell their raw materials only to it, to buy manufactured goods only from it and forbids all trade with other powers. What was the aim of that economic policy?' }),
    hint: L({ es:'Sigue el recorrido de la ganancia: quien compra barato, quien vende caro y donde se queda la diferencia.',
              en:'Follow the path of the profit: who buys cheap, who sells dear and where the difference stays.' }),
    explanation: L({ es:'Con ese doble monopolio la metropoli compraba barato, vendia caro y acumulaba metales, mientras la colonia quedaba como proveedora y compradora cautiva.',
                     en:'With that double monopoly the metropolis bought cheap, sold dear and accumulated precious metals, while the colony remained a captive supplier and buyer.' }),
    options: [ L({ es:'Acumular riqueza en la metropoli manteniendo a la colonia como proveedora y compradora cautiva', en:'Accumulate wealth in the metropolis by keeping the colony a captive supplier and buyer' }),
               L({ es:'Impulsar en la colonia una industria propia de productos manufacturados', en:'Promote in the colony its own manufacturing industry' }),
               L({ es:'Igualar los precios de las materias primas en todos los puertos del mundo', en:'Equalize raw material prices in every port in the world' }),
               L({ es:'Dejar en manos de las colonias la decision sobre las rutas del comercio', en:'Leave decisions about trade routes in the hands of the colonies' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Un solo puerto autorizado', en:'A single authorized port' }),
    questionText: L({ es:'Durante mucho tiempo, todo el comercio autorizado con las colonias americanas de Espana debia pasar por un unico puerto peninsular, y ningun barco podia zarpar sin registrarse alli. ¿Que buscaba la corona con esa medida?',
                      en:'For a long time all authorized trade with the American colonies of Spain had to pass through a single peninsular port, and no ship could sail without registering there. What was the crown seeking with that measure?' }),
    hint: L({ es:'Piensa que gana quien puede contar, revisar y gravar cada barco que entra y sale.',
              en:'Think about what is gained by whoever can count, inspect and tax every ship coming and going.' }),
    explanation: L({ es:'Un solo puerto permitia registrar, vigilar y gravar todo el trafico, de modo que la riqueza colonial pasara por las manos de la corona.',
                     en:'A single port made it possible to register, watch and tax all traffic, so that colonial wealth passed through the hands of the crown.' }),
    options: [ L({ es:'Controlar y gravar todo el trafico para que la riqueza colonial pasara por sus manos', en:'Control and tax all traffic so colonial wealth passed through its hands' }),
               L({ es:'Reducir los impuestos que pagaban los mercaderes de otras potencias', en:'Reduce the taxes paid by merchants from other powers' }),
               L({ es:'Abrir el comercio de las colonias a cualquier flota extranjera interesada', en:'Open colonial trade to any interested foreign fleet' }),
               L({ es:'Trasladar a las colonias la decision sobre el precio de los metales', en:'Transfer to the colonies the decision on metal prices' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ── PROBLEMA 10 ── */
  addProblem(v10 === 0 ? {
    title: L({ es:'Trabajo forzado y plantaciones', en:'Forced labor and plantations' }),
    questionText: L({ es:'En las islas del Caribe y en el noreste de Brasil, las plantaciones de azucar exigian trabajo continuo durante todo el ano, la poblacion originaria de esas islas habia disminuido de forma drastica y la demanda europea de azucar seguia creciendo. ¿Cual fue la causa principal de que las potencias intensificaran el trafico de personas esclavizadas desde Africa?',
                      en:'On the Caribbean islands and in northeastern Brazil the sugar plantations demanded continuous work all year, the indigenous population of those islands had declined drastically and European demand for sugar kept growing. What was the main cause of the powers intensifying the trafficking of enslaved people from Africa?' }),
    hint: L({ es:'Relaciona lo que la economia colonial necesitaba producir con la mano de obra que tenia disponible.',
              en:'Relate what the colonial economy needed to produce with the workforce it had available.' }),
    explanation: L({ es:'La causa principal fue economica: sostener plantaciones y minas de exportacion exigia una enorme mano de obra forzada que las potencias buscaron mediante ese trafico.',
                     en:'The main cause was economic: sustaining export plantations and mines required an enormous forced workforce that the powers sought through that trafficking.' }),
    options: [ L({ es:'La demanda de mano de obra forzada para sostener las plantaciones y las minas de exportacion', en:'The demand for forced labor to sustain export plantations and mines' }),
               L({ es:'La ausencia de puertos aptos en las costas del oceano Atlantico', en:'The lack of suitable ports on the Atlantic coasts' }),
               L({ es:'El interes de las colonias por fabricar sus propios productos manufacturados', en:'The interest of the colonies in making their own manufactured goods' }),
               L({ es:'La prohibicion de cultivar cana de azucar en las islas del Caribe', en:'The ban on growing sugar cane on the Caribbean islands' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Islas y puertos elegidos', en:'Chosen islands and ports' }),
    questionText: L({ es:'Inglaterra, Francia y Holanda concentraron buena parte de su actividad colonizadora en las islas de la cuenca del Caribe y en los puertos del sudeste asiatico, en lugar de ocupar grandes extensiones continentales. ¿Que explica mejor esa concentracion?',
                      en:'England, France and the Netherlands concentrated much of their colonizing activity on the islands of the Caribbean basin and the ports of southeast Asia, instead of occupying large mainland areas. What best explains that concentration?' }),
    hint: L({ es:'Piensa que ventaja daba a una flota un territorio pequeno situado sobre una ruta muy transitada.',
              en:'Think about the advantage a small territory on a busy route gave to a fleet.' }),
    explanation: L({ es:'Eran puntos de paso obligado de las rutas y daban acceso a productos de altisimo valor, con territorios pequenos que una flota podia defender.',
                     en:'They were obligatory stops on the routes and gave access to extremely valuable goods, with small territories a fleet could defend.' }),
    options: [ L({ es:'Eran paso obligado de las rutas y daban acceso a productos de altisimo valor', en:'They were obligatory stops on the routes and gave access to extremely valuable goods' }),
               L({ es:'Eran regiones sin ninguna poblacion anterior a la llegada europea', en:'They were regions with no population before the European arrival' }),
               L({ es:'Un tratado prohibia a esas potencias navegar por el oceano Atlantico', en:'A treaty forbade those powers from sailing the Atlantic ocean' }),
               L({ es:'Eran los territorios mas extensos disponibles en el continente americano', en:'They were the largest territories available on the American mainland' }) ],
    correct: 0, showWork: false
  }, rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbwoSl0opNALX7IT8O9tk7xZoPU9LbrYvZ-n_p9u3R-pUlwi-rVTTfnYRaiKngnsY1QV/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
