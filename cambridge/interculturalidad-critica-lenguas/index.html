  /* ═════════ constructor de tarjetas ═════════ */
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: false,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

  /* ═════════ banco de preguntas ═════════ */

  function q1() {
    if (rng() < 0.5) {
      var ci = medidaDe('inter');
      return {
        title: { es:'Cuatro medidas para el mismo caso', en:'Four measures for the same case' },
        q: { es:'Estas cuatro medidas se propusieron en ' + L(C.lugar) + ' para responder a lo que ocurre con el ' + L(C.lengua) + '. Identifica cuál de ellas corresponde a la interculturalidad crítica.',
             en:'These four measures were proposed in ' + L(C.lugar) + ' in response to what is happening with ' + L(C.lengua) + '. Identify which one of them corresponds to critical interculturality.' },
        hint: { es:'Tres de las cuatro dejan intacto el lugar donde hoy se decide sin la lengua. Busca la única que cambia quién habla y dónde.',
                en:'Three of the four leave untouched the place where decisions are made today without the language. Look for the only one that changes who speaks and where.' },
        exp: { es:'La interculturalidad crítica no se conforma con que la lengua exista ni con que se celebre: pregunta en qué espacios se usa y quién decide en ellos. Pedir que se abandone, reservarle una fecha o encerrarla en su propio rincón son tres maneras distintas de dejar las cosas como estaban.',
               en:'Critical interculturality is not satisfied with the language merely existing or being celebrated: it asks in which spaces it is used and who decides in them. Asking for it to be dropped, setting aside a date for it or shutting it into its own corner are three different ways of leaving things as they were.' },
        options: [ci, medidaDe('asim'), medidaDe('vitrina'), medidaDe('separa')],
        correct: ci
      };
    }
    var f = figOf(C.replica, 'fiesta');
    var co = { es: cap(POST.vitrina.d.es) + '.', en: cap(POST.vitrina.d.en) + '.' };
    return {
      title: { es:'La postura de la respuesta', en:'The stance of the reply' },
      q: { es:'En la respuesta leída ante ' + L(C.quien) + ' aparece esto: ' + Q(f) + '. Identifica la postura frente a la diversidad lingüística que sostiene esa frase.',
           en:'In the reply read out before ' + L(C.quien) + ' this appears: ' + Q(f) + '. Identify the stance towards linguistic diversity that this sentence holds.' },
      hint: { es:'No basta con ver si la frase habla bien o mal de la lengua. Pregúntate qué lugar le queda a la lengua los otros días del año.',
              en:'It is not enough to see whether the sentence speaks well or badly of the language. Ask what place is left for the language on the other days of the year.' },
      exp: { es:'La frase no desprecia la lengua: la aprecia y hasta le dedica un programa. Lo que hace es reservarle una fecha y dejar intacto el resto del calendario, que es donde se dan los avisos y se toman los acuerdos. Apreciar una lengua y darle un lugar donde se decide no son la misma cosa.',
             en:'The sentence does not scorn the language: it values it and even devotes a programme to it. What it does is set aside a date for it and leave the rest of the calendar untouched, which is where announcements are made and agreements reached. Valuing a language and giving it a place where decisions happen are not the same thing.' },
      options: [co,
                { es: cap(POST.asim.d.es) + '.', en: cap(POST.asim.d.en) + '.' },
                { es: cap(POST.separa.d.es) + '.', en: cap(POST.separa.d.en) + '.' },
                { es: cap(POST.inter.d.es) + '.', en: cap(POST.inter.d.en) + '.' }],
      correct: co
    };
  }

  function q2() {
    if (rng() < 0.5) {
      var co = { es:'La lengua seguiría fuera de los lugares donde se decide algo: al día siguiente de la fiesta, el aviso y el trámite volverían a hacerse en una sola.',
                 en:'The language would remain outside the places where anything is decided: the day after the celebration, the announcement and the paperwork would go back to a single one.' };
      return {
        title: { es:'Lo que la fiesta no toca', en:'What the celebration does not touch' },
        q: { es:'Supón que en ' + L(C.lugar) + ' la única respuesta al problema fuera repetir cada año la celebración de la lengua. Determina qué quedaría sin cambiar.',
             en:'Suppose that in ' + L(C.lugar) + ' the only response to the problem were to repeat the celebration of the language every year. Determine what would remain unchanged.' },
        hint: { es:'Compara el día de la fiesta con el lunes siguiente. La pregunta no es si la gente se siente orgullosa, sino en qué lengua se resuelve lo que hay que resolver.',
                en:'Compare the day of the celebration with the following Monday. The question is not whether people feel proud, but in which language what has to be settled gets settled.' },
        exp: { es:'Una celebración anual mueve el ánimo y no mueve el reparto: quien atiende, quien avisa y quien decide siguen haciéndolo igual que antes. Por eso una medida así puede convivir muchos años con el mismo problema sin resolverlo, y por eso se distingue de una que cambia dónde se usa la lengua.',
               en:'An annual celebration moves the mood and does not move the distribution: whoever attends, announces and decides goes on doing so just as before. That is why such a measure can live for years alongside the same problem without solving it, and why it differs from one that changes where the language is used.' },
        options: [co,
                  { es:'No quedaría nada sin cambiar, porque una celebración anual sostenida durante varios años termina modificando la costumbre de un lugar.',
                    en:'Nothing would remain unchanged, because an annual celebration kept up for several years ends up modifying the habits of a place.' },
                  { es:'Quedaría sin cambiar el ánimo de la gente, que es justamente lo único que una fiesta nunca consigue mover.',
                    en:'What would remain unchanged is people’s mood, which is precisely the one thing a celebration never manages to move.' },
                  { es:'Quedaría sin cambiar la escritura de la lengua, que es lo que en realidad impide usarla en documentos y avisos.',
                    en:'What would remain unchanged is the writing system of the language, which is what really prevents its use in documents and notices.' }],
        correct: co
      };
    }
    return {
      title: { es:'Dos maneras de reconocer', en:'Two ways of recognising' },
      q: { es:'Determina qué distingue una medida de interculturalidad crítica de una de reconocimiento de vitrina.',
           en:'Determine what distinguishes a measure of critical interculturality from one of showcase recognition.' },
      hint: { es:'Las dos hablan bien de la lengua. La diferencia no está en el aprecio sino en si alguna de ellas mueve los espacios y las decisiones.',
              en:'Both speak well of the language. The difference is not in the appreciation but in whether either of them moves the spaces and the decisions.' },
      exp: { es:'El reconocimiento de vitrina reparte aprecio: un mural, una fecha, una canción. La interculturalidad crítica reparte lugares y decisiones: quién atiende, en qué lengua se avisa, quién se sienta en la mesa. Por eso la segunda suele costar dinero o poder, y la primera casi nunca.',
             en:'Showcase recognition hands out appreciation: a mural, a date, a song. Critical interculturality hands out places and decisions: who attends, in which language notices are given, who sits at the table. That is why the second usually costs money or power, and the first almost never does.' },
      options: [GEN.distingue.c].concat(GEN.distingue.d),
      correct: GEN.distingue.c
    };
  }

  function q3() {
    var key = (rng() < 0.5) ? 'tesis' : 'concesion';
    var want = figOf(C.carta, key);
    var co = qo(want);
    var others = otherFigs(C.carta, key, 3).map(qo);
    return {
      title: { es:'La pieza que sostiene todo', en:'The piece that holds it all up' },
      q: { es:'Estos cuatro fragmentos se tomaron de la carta dirigida a ' + L(C.quien) + '. Identifica cuál de ellos ' + L(FUNC[key].d) + '.',
           en:'These four fragments were taken from the letter addressed to ' + L(C.quien) + '. Identify which of them ' + L(FUNC[key].d) + '.' },
      hint: { es:'Léelos preguntando qué hace cada uno dentro del escrito, y no de qué habla. Dos fragmentos pueden hablar del mismo asunto y ocupar lugares distintos.',
              en:'Read them asking what each one does inside the text, and not what it is about. Two fragments can speak of the same matter and occupy different places.' },
      exp: { es:'Cada pieza de un alegato tiene un oficio y solo uno. La tesis dice qué hacer; el dato lo vuelve verificable; el testimonio lo vuelve visible; la concesión reconoce la razón contraria y la refutación la contesta; el llamado pone fecha. Confundirlas es lo que produce escritos que dan muchas vueltas y no piden nada.',
             en:'Each piece of an argument has one job and only one. The thesis says what to do; the figure makes it checkable; the testimony makes it visible; the concession grants the opposing reason and the refutation answers it; the call sets a date. Confusing them is what produces texts that go round and round and ask for nothing.' },
      options: [co].concat(others),
      correct: co
    };
  }

  function q4() {
    if (rng() < 0.5) {
      var fk = shuffle(['dato', 'testimonio', 'principio', 'refutacion', 'llamado'], rng)[0];
      var fr = figOf(C.carta, fk);
      var co = fopt(fk);
      return {
        title: { es:'El oficio del fragmento', en:'The job of the fragment' },
        q: { es:'En la carta aparece esto: ' + Q(fr) + '. Determina qué hace ese fragmento dentro del alegato.',
             en:'This appears in the letter: ' + Q(fr) + '. Determine what that fragment does inside the argument.' },
        hint: { es:'Pregúntate qué se perdería si ese fragmento no estuviera: si se cae la posibilidad de verificar, si se cae el rostro del problema, o si se cae la fecha.',
                en:'Ask what would be lost if that fragment were not there: whether the possibility of checking falls away, or the face of the problem, or the date.' },
        exp: { es:'Reconocer la pieza no es ponerle una etiqueta: es saber qué se apoya en ella. Una cifra sostiene lo que se puede discutir con otra cifra; un testimonio sostiene lo que una cifra no alcanza a mostrar; un principio sostiene la petición cuando quien escucha no comparte el caso.',
               en:'Recognising the piece is not labelling it: it is knowing what rests on it. A figure holds up what can be argued with another figure; a testimony holds up what a figure cannot show; a principle holds up the request when the listener does not share the case.' },
        options: [co].concat(otherFunc(fk, 3)),
        correct: co
      };
    }
    return {
      title: { es:'Si se quita el reconocimiento', en:'If the acknowledgement is removed' },
      q: { es:'De la carta se elimina el fragmento en el que quien escribe le reconoce a la otra parte una razón verdadera. Determina qué le ocurriría al escrito.',
           en:'The fragment in which the writer grants the other side a genuine reason is removed from the letter. Determine what would happen to the text.' },
      hint: { es:'Piensa en quién queda del otro lado leyendo. Esa persona sostiene una razón que existe: si el escrito no la nombra, ella todavía la tiene entera.',
              en:'Think about who is left on the other side reading. That person holds a reason that exists: if the text does not name it, they still have it whole.' },
      exp: { es:'Reconocer la razón contraria no es ceder: es la única manera de que la respuesta caiga sobre lo que el otro de verdad piensa. Un escrito que salta ese paso contesta a una versión debilitada del adversario, y quien lo lee se da cuenta enseguida de que no fue tomado en serio.',
             en:'Granting the opposing reason is not giving in: it is the only way for the answer to land on what the other side actually thinks. A text that skips that step answers a weakened version of its opponent, and whoever reads it notices at once that they were not taken seriously.' },
      options: [GEN.quitaconc.c].concat(GEN.quitaconc.d),
      correct: GEN.quitaconc.c
    };
  }

  function q5() {
    if (rng() < 0.5) {
      return {
        title: { es:'Lo que se puede comprobar', en:'What can be checked' },
        q: { es:'La misma tesis se va a presentar ante quienes reparten el presupuesto en ' + L(C.lugar) + '. Determina cuál de estos cuatro apoyos puede ser verificado por quien lo recibe.',
             en:'The same thesis is to be presented to those who share out the budget in ' + L(C.lugar) + '. Determine which of these four supports can be checked by whoever receives it.' },
        hint: { es:'Verificable no quiere decir cierto ni importante: quiere decir que quien lo escucha puede ir, repetir el procedimiento y llegar a otro resultado si te equivocaste.',
                en:'Checkable does not mean true or important: it means the listener can go, repeat the procedure and reach a different result if you got it wrong.' },
        exp: { es:'Ante quien decide con criterios, el apoyo más fuerte es el que se expone a ser desmentido. Una advertencia sobre el futuro, un acuerdo general y una declaración de justicia pueden ser todos razonables, pero ninguno se puede volver a contar el martes por la mañana, y por eso ninguno obliga a nadie.',
               en:'Before someone who decides on criteria, the strongest support is the one that exposes itself to being disproved. A warning about the future, a general agreement and a statement of justice may all be reasonable, but none of them can be counted again on Tuesday morning, and so none of them binds anyone.' },
        options: [GEN.verificable.c].concat(GEN.verificable.d),
        correct: GEN.verificable.c
      };
    }
    var co = { es:'El testimonio de quien lo vive, porque a quien ya decidió que la lengua no vale no lo mueve una cifra sino reconocerse en alguien cercano.',
               en:'The testimony of someone who lives it, because whoever has already decided the language is worthless is not moved by a figure but by recognising themselves in someone close.' };
    return {
      title: { es:'El apoyo y quien lo recibe', en:'The support and its receiver' },
      q: { es:'Un compañero repite que la lengua de su casa no sirve para nada. Determina qué apoyo conviene usar con él y por qué.',
           en:'A classmate keeps saying that the language of his home is of no use. Determine which support to use with him and why.' },
      hint: { es:'El mismo apoyo no funciona con todos. Pregúntate qué es lo que esta persona puede reconocer, no lo que puede comprobar.',
              en:'The same support does not work with everyone. Ask what this person can recognise, not what they can verify.' },
      exp: { es:'Elegir el apoyo es elegir por dónde entra el argumento. Ante quien decide con criterios entra la cifra; ante quien ya se formó una opinión sobre sí mismo entra la escena en la que se reconoce; ante quienes ya están convencidos entra el principio que ordena lo que van a pedir juntos.',
             en:'Choosing the support is choosing the way in for the argument. With whoever decides on criteria, the figure gets in; with whoever has already formed an opinion about themselves, the scene they recognise gets in; with those already convinced, the principle that orders what they will ask for together gets in.' },
      options: [co,
                { es:'Un dato levantado en el lugar, porque una cifra clara termina por convencer a cualquiera que la escuche con atención.',
                  en:'A figure gathered in the place, because a clear number ends up convincing anyone who listens to it attentively.' },
                { es:'La comparación con otro país donde la lengua sí se usa, porque el ejemplo ajeno es el que más impresiona.',
                  en:'A comparison with another country where the language is used, because someone else’s example is what impresses most.' },
                { es:'Un principio general sobre el valor de todas las lenguas, porque conviene empezar siempre por lo que nadie discute.',
                  en:'A general principle about the value of all languages, because it is always best to start with what nobody disputes.' }],
      correct: co
    };
  }

  function q6() {
    if (rng() < 0.5) {
      var ok = shuffle(OKEYS, rng)[0];
      var O = OBJ[ok];
      return {
        title: { es:'Contestar el razonamiento', en:'Answering the reasoning' },
        q: { es:'En la reunión alguien sostiene esto: ' + Q(O.obj) + ' Identifica cuál de estas cuatro respuestas desarma ese razonamiento.',
             en:'At the meeting somebody holds this: ' + Q(O.obj) + ' Identify which of these four answers dismantles that reasoning.' },
        hint: { es:'Descarta las respuestas que discuten los hechos, las que hablan de quien objetó y las que solo cambian de tema. Queda la que sigue el razonamiento hasta donde se rompe.',
                en:'Discard the answers that dispute the facts, those that talk about the objector and those that merely change the subject. What remains is the one that follows the reasoning to where it breaks.' },
        exp: { es:'Una objeción se desarma mostrando qué pasaría si se aceptara del todo, no negando los hechos que menciona ni señalando a quien la dijo. Las respuestas que atacan a la persona dejan el razonamiento intacto, y quien escucha lo nota: la objeción sigue ahí cuando termina el enojo.',
               en:'An objection is dismantled by showing what would follow if it were fully accepted, not by denying the facts it mentions or pointing at whoever said it. Answers that attack the person leave the reasoning intact, and the listener notices: the objection is still there once the anger is over.' },
        options: [O.ref].concat(O.d),
        correct: O.ref
      };
    }
    var ok2 = shuffle(OKEYS, rng)[0];
    return {
      title: { es:'Una respuesta que no contesta', en:'An answer that answers nothing' },
      q: { es:'Ante la objeción ' + Q(OBJ[ok2].obj) + ' alguien responde que quien la dijo nunca se ha interesado por la comunidad. Determina por qué esa respuesta no sirve.',
           en:'Faced with the objection ' + Q(OBJ[ok2].obj) + ' somebody replies that whoever said it has never cared about the community. Determine why that answer is of no use.' },
      hint: { es:'Separa dos cosas que suelen ir juntas: quién habla y qué dice. Solo una de las dos se puede refutar.',
              en:'Separate two things that usually travel together: who is speaking and what is said. Only one of the two can be refuted.' },
      exp: { es:'Al hablar de quien objetó y no de lo que objetó, la respuesta deja el razonamiento sin tocar: quien lo sostiene puede repetirlo mañana con otra boca y seguirá igual de fuerte. Además, en una asamblea eso desplaza la discusión hacia las personas, que es exactamente donde no se resuelve nada.',
             en:'By speaking about the objector and not about the objection, the answer leaves the reasoning untouched: whoever holds it can repeat it tomorrow through another mouth and it will be just as strong. Besides, in an assembly that shifts the discussion towards people, which is exactly where nothing gets settled.' },
      options: [GEN.adhominem.c].concat(GEN.adhominem.d),
      correct: GEN.adhominem.c
    };
  }

  function q7() {
    if (rng() < 0.5) {
      return {
        title: { es:'Dónde va el reconocimiento', en:'Where the acknowledgement goes' },
        q: { es:'Estás ordenando los movimientos de tu propio alegato. Determina en qué lugar conviene colocar el reconocimiento de la razón contraria.',
             en:'You are ordering the moves of your own argument. Determine where the acknowledgement of the opposing reason should be placed.' },
        hint: { es:'Piensa en qué necesita tener enfrente la refutación para no golpear al aire. Ese requisito decide el lugar.',
                en:'Think about what the refutation needs in front of it so as not to swing at thin air. That requirement decides the place.' },
        exp: { es:'La concesión y la refutación son una sola maniobra en dos tiempos: primero se pone la razón contraria completa sobre la mesa, y enseguida se muestra hacia dónde lleva. Separadas pierden las dos: una concesión suelta parece rendición, y una refutación sin concesión parece que discute con un adversario inventado.',
               en:'Concession and refutation are a single manoeuvre in two beats: first the opposing reason is laid out in full, and then it is shown where it leads. Apart, both are lost: a loose concession looks like surrender, and a refutation with no concession looks like an argument with an invented opponent.' },
        options: [GEN.concesion.c].concat(GEN.concesion.d),
        correct: GEN.concesion.c
      };
    }
    return {
      title: { es:'La cifra y su lugar', en:'The figure and its place' },
      q: { es:'En la carta dirigida a ' + L(C.quien) + ' el conteo aparece después de la petición y no al principio. Determina por qué ese orden funciona mejor.',
           en:'In the letter addressed to ' + L(C.quien) + ' the count appears after the request and not at the start. Determine why that order works better.' },
      hint: { es:'Imagina que alguien te dice una cifra sin decirte para qué te la dice. Pregúntate qué te falta en ese momento.',
              en:'Imagine somebody gives you a figure without telling you what it is for. Ask what you are missing at that moment.' },
      exp: { es:'Un dato no argumenta por sí mismo: argumenta cuando ya se sabe qué se pretende hacer con él. Anunciada la petición, el conteo se lee como su respaldo y quien escucha puede decidir si le parece suficiente. Antes de la petición, la misma cifra es solo información suelta que cada quien interpretará a su modo.',
             en:'A figure does not argue on its own: it argues once it is known what is meant to be done with it. Once the request is announced, the count reads as its backing and the listener can decide whether it seems enough. Before the request, the same figure is just loose information each person will read their own way.' },
      options: [GEN.ordendato.c].concat(GEN.ordendato.d),
      correct: GEN.ordendato.c
    };
  }

  function q8() {
    if (rng() < 0.5) {
      var S = shuffle(C.sits, rng)[0];
      var co = { es:'A ' + L(DEST[S.d]).toLowerCase() + ', sosteniéndolo con ' + L(APOY[S.a]).toLowerCase() + ' y pidiendo ' + L(S.cier[S.ci]).toLowerCase(),
                 en:'To ' + L(DEST[S.d]).toLowerCase() + ', holding it up with ' + L(APOY[S.a]).toLowerCase() + ' and asking for ' + L(S.cier[S.ci]).toLowerCase() };
      var wrongD = (S.d + 1) % DEST.length, wrongA = (S.a + 1) % APOY.length, wrongC = (S.ci + 1) % S.cier.length;
      return {
        title: { es:'Un alegato para esta situación', en:'An argument for this situation' },
        q: { es:'Se presenta esta situación: ' + L(S.s) + ' Determina cuál de estos cuatro alegatos se adecúa mejor.',
             en:'This situation comes up: ' + L(S.s) + ' Determine which of these four arguments fits best.' },
        hint: { es:'Los cuatro están bien escritos. Decide primero quién tiene que quedar cambiado, porque de eso dependen el apoyo y la petición.',
                en:'All four are well written. Decide first who has to be left changed, because the support and the request both depend on it.' },
        exp: { es:'Un alegato se adecúa cuando sus tres piezas apuntan a la misma persona: le habla a quien puede hacer algo distinto, se sostiene en lo que esa persona puede verificar o reconocer, y pide algo que esa persona puede cumplir en una fecha. Basta con que una pieza apunte a otro lado para que el escrito quede sin destinatario real.',
               en:'An argument fits when its three pieces point at the same person: it speaks to whoever can do something different, rests on what that person can check or recognise, and asks for something that person can carry out on a date. One piece pointing elsewhere is enough to leave the text with no real addressee.' },
        options: [co,
                  { es:'A ' + L(DEST[wrongD]).toLowerCase() + ', sosteniéndolo con ' + L(APOY[S.a]).toLowerCase() + ' y pidiendo ' + L(S.cier[S.ci]).toLowerCase(),
                    en:'To ' + L(DEST[wrongD]).toLowerCase() + ', holding it up with ' + L(APOY[S.a]).toLowerCase() + ' and asking for ' + L(S.cier[S.ci]).toLowerCase() },
                  { es:'A ' + L(DEST[S.d]).toLowerCase() + ', sosteniéndolo con ' + L(APOY[wrongA]).toLowerCase() + ' y pidiendo ' + L(S.cier[S.ci]).toLowerCase(),
                    en:'To ' + L(DEST[S.d]).toLowerCase() + ', holding it up with ' + L(APOY[wrongA]).toLowerCase() + ' and asking for ' + L(S.cier[S.ci]).toLowerCase() },
                  { es:'A ' + L(DEST[S.d]).toLowerCase() + ', sosteniéndolo con ' + L(APOY[S.a]).toLowerCase() + ' y pidiendo ' + L(S.cier[wrongC]).toLowerCase(),
                    en:'To ' + L(DEST[S.d]).toLowerCase() + ', holding it up with ' + L(APOY[S.a]).toLowerCase() + ' and asking for ' + L(S.cier[wrongC]).toLowerCase() }],
        correct: co
      };
    }
    var cb = { es:'Ante quien administra el lugar donde hoy se atiende en una sola lengua, porque es quien puede cambiar en qué lengua se atiende mañana.',
               en:'Before whoever runs the place that today operates in a single language, because they are the one who can change which language it operates in tomorrow.' };
    return {
      title: { es:'A quién le hablas', en:'Who you speak to' },
      q: { es:'Tu alegato busca que la lengua entre en un espacio del que hoy está fuera. Determina ante quién debe presentarse para conseguirlo.',
           en:'Your argument seeks to bring the language into a space it is currently outside of. Determine before whom it should be presented to achieve that.' },
      hint: { es:'Un escrito solo consigue algo si llega a manos de alguien que pueda hacerlo. Descarta a quienes ya están de acuerdo y a quienes no tienen manera de cambiar nada.',
              en:'A text only achieves something if it reaches someone who can do it. Rule out those who already agree and those who have no way of changing anything.' },
      exp: { es:'Conmover a quien ya piensa como tú no cambia el reparto, y convencer a quien no tiene ninguna facultad sobre el asunto tampoco. Un alegato se dirige a quien tiene a la vez el poder de decidir y algo que puede hacer en una fecha concreta; a los demás se les habla después, para sostener lo que ya quedó acordado.',
             en:'Moving those who already think like you does not change the distribution, and convincing those with no say over the matter does not either. An argument is addressed to whoever holds both the power to decide and something they can do on a concrete date; the rest are spoken to afterwards, to hold up what has already been agreed.' },
      options: [cb,
                { es:'Ante quienes ya hablan la lengua todos los días, porque son quienes mejor entienden lo que está en juego.',
                  en:'Before those who already speak the language every day, because they are the ones who best understand what is at stake.' },
                { es:'Ante quienes hablan mal de la lengua, porque mientras ellos no cambien de opinión no se puede avanzar en nada.',
                  en:'Before those who speak badly of the language, because until they change their minds nothing can move forward.' },
                { es:'Ante la mayor cantidad de gente posible, porque un alegato gana fuerza en proporción al número de personas que lo escuchan.',
                  en:'Before as many people as possible, because an argument gains force in proportion to the number of people who hear it.' }],
      correct: cb
    };
  }

  function q9() {
    if (rng() < 0.5) {
      return {
        title: { es:'Nosotros y ellos', en:'Us and them' },
        q: { es:'La carta dice ' + T('«contamos las consultas», «levantamos el sondeo»', '“we counted the consultations”, “we ran the survey”') + '. Determina qué cambiaría si en su lugar dijera que ellos nunca preguntan ni piden nada.',
             en:'The letter says ' + T('«contamos las consultas», «levantamos el sondeo»', '“we counted the consultations”, “we ran the survey”') + '. Determine what would change if instead it said that they never ask and never request anything.' },
        hint: { es:'El hecho que se cuenta es el mismo en las dos versiones. Fíjate en dónde queda la falta en cada una.',
                en:'The fact being reported is the same in both versions. Notice where the fault ends up in each.' },
        exp: { es:'En un alegato intercultural importa dónde se coloca la carencia. Si la falta está en quienes hablan la lengua, lo que hay que arreglar son ellos, y el servicio queda como estaba. Si la falta está en un espacio que funciona en una sola lengua, lo que hay que arreglar es el espacio, que es justo lo que se puede aprobar en una sesión.',

        options: [GEN.culpa.c].concat(GEN.culpa.d),

      q: { es:'En la reunión de ' + L(C.lugar) + ' alguien se refirió al ' + L(C.lengua) + ' llamándolo «el dialecto». Determina por qué esa palabra no describe lo que la lengua es.',
           en:'At the meeting in ' + L(C.lugar) + ' somebody referred to ' + L(C.lengua) + ' by calling it “the dialect”. Determine why that word does not describe what the language is.' },
      hint: { es:'Pregúntate si esa palabra se usa alguna vez para el español que hablas tú, y qué significa que se reserve para unas cuantas lenguas.',
              en:'Ask whether that word is ever used for the Spanish you speak, and what it means that it is saved for a few languages only.' },
      exp: { es:'Toda lengua se habla en variedades, y a esas variedades se les llama dialectos: el español que hablas tú también lo es. Cuando la palabra se reserva para unas cuantas lenguas deja de describir y empieza a ordenar, porque coloca a unas arriba y a otras abajo sin que ningún rasgo lingüístico sostenga esa diferencia.',
             en:'Every language is spoken in varieties, and those varieties are called dialects: the Spanish you speak is one too. When the word is saved for a few languages it stops describing and starts ranking, because it places some above and others below with no linguistic feature holding that difference up.' },
      options: [GEN.dialecto.c].concat(GEN.dialecto.d),
      correct: GEN.dialecto.c
    };
  }

  function q10() {
    if (rng() < 0.5) {
      var N = NUEVOS[Math.floor(rng() * NUEVOS.length)];
      return {
        title: { es:'Un caso nuevo', en:'A new case' },
        q: { es:'Fuera del expediente que trabajaste se presenta este caso. ' + L(N.p) + ' Determina qué alegato se adecúa mejor.',
             en:'Outside the file you have been working on, this case comes up. ' + L(N.p) + ' Determine which argument fits best.' },
        hint: { es:'Empieza por el final: decide qué tendría que ser distinto la semana entrante y quién puede hacerlo. Después revisa cuál de los cuatro escritos se lo pide a esa persona.',
                en:'Start from the end: decide what would have to be different next week and who can do it. Then check which of the four texts asks that person for it.' },
        exp: { es:'Los cuatro escritos están redactados con cuidado, así que la elección no se hace por calidad sino por adecuación. Uno traslada la carencia a quienes hablan la lengua, otro le reserva una fecha en el calendario y otro la aparta en un espacio propio. Solo uno cambia en qué lengua funciona el lugar donde hoy queda fuera.',
               en:'All four texts are carefully written, so the choice is not made by quality but by fit. One shifts the shortcoming onto those who speak the language, another sets aside a date on the calendar for it and another puts it away in a space of its own. Only one changes the language in which the place that leaves it out today operates.' },
        options: [N.c].concat(N.d),
        correct: N.c
      };
    }
    return {
      title: { es:'Por dónde empezar', en:'Where to begin' },
      q: { es:'Vas a escribir tu propio alegato sobre el valor de una lengua que se habla cerca de ti. Determina qué decisión tienes que tomar antes que ninguna otra.',
           en:'You are going to write your own argument about the value of a language spoken near you. Determine which decision you have to make before any other.' },
      hint: { es:'Repasa lo que hiciste en la mesa de trabajo: ahí las piezas no se elegían en cualquier orden, porque una de ellas mandaba sobre las otras dos.',
              en:'Go back over what you did at the work table: there the pieces were not chosen in any order, because one of them governed the other two.' },
      exp: { es:'El destinatario y la petición no se eligen por gusto: se deducen del cambio que se busca. Si no está decidido qué tiene que quedar distinto y en quién, cualquier apoyo parece igual de bueno y el escrito termina siendo una declaración de aprecio que nadie tiene que cumplir.',
             en:'The audience and the request are not chosen by taste: they are deduced from the change being sought. If it is not settled what has to be left different and in whom, every support looks equally good and the text ends up being a declaration of appreciation that nobody has to carry out.' },
      options: [GEN.empezar.c].concat(GEN.empezar.d),
      correct: GEN.empezar.c
    };
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Cuatro maneras de responder', 'Four ways of answering'),
      '<p>' + T('En ' + L(C.lugar) + ' pasa esto: ' + L(C.caso) + '. Nadie ha prohibido nada y casi todos dicen apreciar la lengua, y sin embargo el resultado se parece bastante a una prohibición. Cuando una lengua queda fuera de los lugares donde se avisa, se atiende y se decide, quienes la hablan aprenden que para lo importante hay que cambiar de lengua, y sus hijos lo aprenden todavía más rápido. Frente a una situación así se responde desde alguna de cuatro posturas, y conviene reconocerlas porque tres de ellas suenan bien y dejan el reparto intacto. La interculturalidad crítica es la única que se pregunta no solo si las lenguas conviven, sino quién decide, en qué lengua y en qué lugar.',
                'In ' + L(C.lugar) + ' this is happening: ' + L(C.caso) + '. Nobody has banned anything and almost everyone says they value the language, and yet the result looks a good deal like a ban. When a language is left out of the places where notices are given, people are attended to and decisions are made, its speakers learn that for important matters you have to switch languages, and their children learn it even faster. Faced with a situation like that, people answer from one of four stances, and it pays to recognise them because three of them sound good and leave the distribution untouched. Critical interculturality is the only one that asks not only whether languages coexist, but who decides, in which language and in which place.') + '</p>' +
      '<div class="glosslist">' + PKEYS.map(function (k) {
        return '<div class="gloss"><div class="glossn">' + L(POST[k].n) + '</div><div class="glossd">' + cap(L(POST[k].d)) + '.</div></div>';
      }).join('') + '</div>' +
      textBlock(C.replica, T('Documento I', 'Document I')) +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('pregúntate, en cada frase, dónde quedaría la lengua el lunes siguiente si esa frase se cumpliera.',
          'ask yourself, at each sentence, where the language would be left the following Monday if that sentence came true.') + '</p></div>');
  widgetPosturas();
  addP(q1());
  addP(q2());

  sec(T('El alegato', 'The argument'),
      T('Siete piezas y un solo oficio cada una', 'Seven pieces, each with a single job'),
      '<p>' + T('Contra una respuesta como la anterior no basta con indignarse: hay que escribir algo que obligue a contestar. Un texto argumentativo es exactamente eso, y está hecho de piezas que se reconocen por el trabajo que hacen. La tesis dice en una frase qué debe hacerse. El dato lo vuelve verificable, porque cualquiera puede volver a contar. El testimonio muestra por dentro lo que la cifra solo mide. El principio saca la petición del gusto personal. La concesión le reconoce a la otra parte una razón verdadera y la refutación muestra hacia dónde lleva esa razón si se la toma en serio. El llamado cierra con una acción, una fecha y unos responsables. Lo que sigue es la carta que se leyó en respuesta a ese documento: los fragmentos subrayados son sus piezas.',
                'Against a reply like the one above, being outraged is not enough: you have to write something that forces an answer. An argumentative text is exactly that, and it is made of pieces recognised by the work they do. The thesis says in one sentence what must be done. The figure makes it checkable, because anyone can count again. The testimony shows from the inside what the figure only measures. The principle lifts the request out of personal taste. The concession grants the other side a genuine reason and the refutation shows where that reason leads if taken seriously. The call closes with an action, a date and people responsible. What follows is the letter read out in reply to that document: the underlined fragments are its pieces.') + '</p>' +
      '<div class="glosslist">' + FKEYS.map(function (k) {
        return '<div class="gloss"><div class="glossn">' + L(FUNC[k].n) + '</div><div class="glossd">' + cap(L(FUNC[k].d)) + '.</div></div>';
      }).join('') + '</div>' +
      textBlock(C.carta, T('Documento II', 'Document II')));
  widgetAnatomia();
  addP(q3());
  addP(q4());

  sec(T('Las objeciones', 'The objections'),
      T('Cuatro razones que siempre vuelven', 'Four reasons that always come back'),
      '<p>' + T('Cuando se defiende el valor de una lengua reaparecen casi siempre las mismas cuatro objeciones, y conviene tenerlas contestadas de antemano. Que una lengua vale lo que paga. Que si se usa una, la otra se pierde. Que ya se hace algo, porque hay una fiesta. Que de todos modos esto ya se perdió. Ninguna se desarma negando los hechos que menciona ni diciendo algo sobre quien la sostiene: eso deja el razonamiento en pie y traslada la discusión a las personas. Se desarman siguiendo el razonamiento hasta el punto en que se rompe, casi siempre porque aplicado en serio sostiene lo contrario de lo que pretendía, o porque presenta como destino algo que fue una decisión.',
                'When the value of a language is defended, almost always the same four objections come back, and it pays to have them answered in advance. That a language is worth what it pays. That if one is used, the other is lost. That something is already being done, because there is a celebration. That this is already lost anyway. None of them is dismantled by denying the facts it mentions or by saying something about whoever holds it: that leaves the reasoning standing and shifts the discussion onto people. They are dismantled by following the reasoning to the point where it breaks, almost always because applied seriously it supports the opposite of what it intended, or because it presents as fate what was a decision.') + '</p>');
  widgetObjecion();
  addP(q5());
  addP(q6());

  sec(T('El orden', 'The order'),
      T('Cada movimiento vuelve posible al siguiente', 'Each move makes the next one possible'),
      '<p>' + T('Las piezas de un alegato no se pueden barajar. Una cifra colocada antes de la petición es información suelta, porque todavía no se sabe para qué se está contando. Una refutación sin la concesión que la precede parece discutir con un adversario inventado. Un llamado puesto al principio no se sostiene en nada. Y quien escribe tiene además que decir desde dónde habla, porque un alegato dirigido a una comunidad se lee distinto si quien lo firma vive ahí. Ordenar es, en el fondo, decidir qué necesita saber quien escucha antes de poder aceptar lo que sigue.',
                'The pieces of an argument cannot be shuffled. A figure placed before the request is loose information, because it is not yet known what is being counted for. A refutation without the concession before it looks like an argument with an invented opponent. A call placed at the beginning rests on nothing. And the writer also has to say where they are speaking from, because an argument addressed to a community reads differently if whoever signs it lives there. Ordering is, at bottom, deciding what the listener needs to know before they can accept what comes next.') + '</p>');
  widgetOrden();
  addP(q7());

  sec(T('La adecuación', 'The fit'),
      T('A quién le hablas decide todo lo demás', 'Who you speak to decides everything else'),
      '<p>' + T('El mismo alegato no sirve en todas partes. Quien reparte el presupuesto decide con criterios y necesita una cifra que pueda verificar y una petición que quepa en el acta de esa sesión. Quien ya decidió que su lengua no vale no se mueve por cifras, porque el asunto no es de información sino de cómo se ve a sí mismo: ahí entra el testimonio y una tarea concreta al lado de alguien. Y quienes ya hablan la lengua no necesitan que se les demuestre nada; necesitan un criterio común y una manera de quedar sentados donde se decide. Elegir mal no es un error de estilo: un alegato entregado en la ventanilla equivocada no se lee, y uno lleno de cifras ante quien esperaba reconocerse no consigue nada.',
                'The same argument does not work everywhere. Whoever shares out the budget decides on criteria and needs a figure they can check and a request that fits into the minutes of that session. Whoever has already decided their language is worthless is not moved by figures, because the matter is not one of information but of how they see themselves: that is where testimony and a concrete task beside someone come in. And those who already speak the language need nothing proved to them; they need a shared criterion and a way of being seated where decisions are made. Choosing badly is not an error of style: an argument handed in at the wrong desk goes unread, and one full of figures before someone who was hoping to recognise themselves achieves nothing.') + '</p>' +
      '<div class="glosslist">' + DEST.map(function (o, i) {
        var s = [ { es:'Necesita un criterio común y un lugar en la mesa donde se decide.', en:'Needs a shared criterion and a seat at the table where decisions are made.' },
                  { es:'Necesita una cifra verificable y una petición que quepa en el presupuesto.', en:'Needs a checkable figure and a request that fits into the budget.' },
                  { es:'Necesita reconocerse en alguien cercano antes de escuchar cualquier razón.', en:'Needs to recognise themselves in someone close before hearing any reason.' } ][i];
        return '<div class="gloss"><div class="glossn">' + L(o) + '</div><div class="glossd">' + L(s) + '</div></div>';
      }).join('') + '</div>');
  widgetMesa();
  addP(q8());
  addP(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('Tu turno de argumentar', 'Your turn to argue'),
      '<p>' + T('Leíste dos documentos sobre el mismo caso, separaste las piezas de un alegato, contestaste las cuatro objeciones que siempre vuelven y armaste escritos para destinatarios distintos. Falta hacerlo con una lengua que esté cerca de ti: la de tu casa, la de tu abuela, la que oyes en el mercado o la que se hace con las manos y también tiene gramática propia. Promover una lengua no es hablar bien de ella: es conseguirle un lugar donde valga la pena usarla y alguien que conteste en ella.',
                'You have read two documents on the same case, separated out the pieces of an argument, answered the four objections that always come back and built texts for different audiences. What is left is doing it with a language close to you: the one at home, your grandmother’s, the one you hear at the market or the one made with the hands, which also has a grammar of its own. Promoting a language is not speaking well of it: it is getting it a place where using it is worthwhile and someone who answers back in it.') + '</p>');
  widgetTaller();
  addP(q10());
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Interculturalidad Crítica y Argumentación sobre el Valor de las Lenguas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
