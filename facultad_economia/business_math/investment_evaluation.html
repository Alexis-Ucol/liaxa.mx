<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment Evaluation · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_inversiones.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Investment Evaluation</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Investment Evaluation</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxSJnnHSGtMSBcK4ggFvfN2DtEdTSK_yn57GA0OgOI1kJqHufnIsr5lOGAJZkQro_8G/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',
  darkPrimaryDark: '#7aaae0',
  darkPrimaryBg:   '#0e1e38',
  darkAccent:      '#d4b86a',
  darkAccentBg:    '#241e0e',
  logoLeftB64:  '',
  logoRightB64: '',

function getAttemptKey(name, group) {
  return 'fac_econ_neg__neg_inversiones__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {

  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function dec1(x)   { return x.toFixed(1); }
function dec2(x)   { return x.toFixed(2); }
/* Rate written the way a bank quotes it: 18 and not 18.00, 1.5 and not 1.50. */
function pctS(x) {
  var v = Math.round(x * 1000000) / 10000;
  if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
  return String(Math.round(v * 100) / 100);
}
/* Rate as an option value, always two decimals so four choices stay distinct. */
function pct2(x)   { return (x * 100).toFixed(2) + '%'; }
function intN(x)   { return nf(Math.round(x)); }

/* ── THE MODELS THIS GUIDE RUNS ON ────────────────────────────────────────
   Evaluating an investment means weighing money that leaves the company on
   one date against money that comes back on later ones. Nothing may be
   added to anything else until every amount has been carried to the same
   date, and the rate that carries it is the return the company gives up by
   committing its capital here rather than to the next best use. */
function dfactor(i, n)      { return Math.pow(1 + i, n); }
/* One amount promised for a future date, valued today. */
function pvSingle(F, i, n)  { return F / dfactor(i, n); }
/* What one peso a year for n years is worth today at rate i. */
function annFactor(i, n)    { return i === 0 ? n : (1 - Math.pow(1 + i, -n)) / i; }
function pvAnnuity(A, i, n) { return A * annFactor(i, n); }
/* Present value of a stream whose first amount lands one period from today. */
function pvStream(flows, i) {
  var v = 0;
  for (var k = 0; k < flows.length; k++) v += flows[k] / dfactor(i, k + 1);
  return v;
}
/* Value created: everything that comes back, valued today, less what went out. */
function npvLevel(I, A, i, n)   { return pvAnnuity(A, i, n) - I; }
function npvStream(I, flows, i) { return pvStream(flows, i) - I; }
/* Value recovered per peso committed. Above one, the project adds value. */
function profIndex(I, pv)   { return pv / I; }
/* The rate at which a project is worth exactly what it costs. */
function irrLevel(I, A, n) {
  var lo = 0.000001, hi = 5, mid, k;
  if (A * n <= I) return null;
  for (k = 0; k < 160; k++) {
    mid = (lo + hi) / 2;
    if (pvAnnuity(A, mid, n) - I > 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function irrStream(I, flows) {
  var lo = 0.000001, hi = 5, mid, k, tot = 0;
  for (k = 0; k < flows.length; k++) tot += flows[k];
  if (tot <= I) return null;
  for (k = 0; k < 160; k++) {
    mid = (lo + hi) / 2;
    if (npvStream(I, flows, mid) > 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
/* Years of undiscounted flow needed to get the outlay back. */
function payback(I, A) { return I / A; }
/* The same question asked of flows already brought back to today. */
function discPayback(I, A, i) {
  var x = 1 - I * i / A;
  return x <= 0 ? null : -Math.log(x) / Math.log(1 + i);
}
/* A net present value written with no leading sign: magnitude plus a word. */
function npvTxt(v, es) {
  var m = money(Math.abs(v));
  if (es) return m + (v >= 0 ? ' a favor' : ' en contra');
  return m + (v >= 0 ? ' in favour' : ' against');
}
/* A rate that may not exist because the project never pays its cost back. */
function rateTxt(v, es) { return v === null ? (es ? 'no existe' : 'none') : pct2(v); }
function yearsTxt(v, es) { return v === null ? (es ? 'nunca' : 'never') : dec1(v) + (es ? ' años' : ' years'); }

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers, each rendered once per language and kept aligned.
   The key is always the first value handed in. */
function valOpts2(correct, wrongs, fmtEs, fmtEn, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmtEn(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(v);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.11 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.41);
  return shuffleOpts(vals.map(fmtEs), vals.map(fmtEn), rng);
}
function valOpts(correct, wrongs, fmt, rng) {
  return valOpts2(correct, wrongs, fmt, fmt, rng);
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {

          correct:   correctCount,
          score:     Math.round(correctCount / problems.length * 100),
          timestamp: new Date().toLocaleString('es-MX'),
          guide:     SCHOOL.guideTitle ? (SCHOOL.guideTitle['es'] || SCHOOL.guideTitle['en'] || '') : document.title.split('·')[0].trim()
        })
      });
    } catch(e) {}
  }

  var rb = document.getElementById('s_results');
  if (!rb) return;
  rb.style.display = 'block';
  setTimeout(function() {
    rb.classList.add('vis');
    rb.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 50);
}

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  return P.dark;
}
/* Plots any curve given as a function of time or of a rate. A balance that
   grows, a promise that shrinks as its date moves away and a loan balance
   that falls to zero are all the same picture to this routine.
     opts.marks  points worth naming, such as the year a balance doubles
     opts.band   the stretch of the horizontal axis worth highlighting
     opts.hline  a reference amount drawn as a horizontal line
     opts.asym   the limit a curve approaches without reaching
     opts.at     where the student is standing right now                     */
function drawCurveChart(g, xMin, xMax, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 56, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var fmtY  = opts.fmtY || function(v) { return intN(v); };
  var fmtX  = opts.fmtX || function(v) { return intN(v); };
  var STEPS = 140;
  var yLo = null, yHi = null;
  function note(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (yLo === null || v < yLo) yLo = v;
    if (yHi === null || v > yHi) yHi = v;
  }
  series.forEach(function(s) {
    for (i = 0; i <= STEPS; i++) note(s.f(xMin + (xMax - xMin) * i / STEPS));
  });
  note(opts.yFloor); note(opts.yCeil);
  if (opts.hline) note(opts.hline.y);
  if (opts.asym)  note(opts.asym.y);
  if (yLo === null) { yLo = 0; yHi = 1; }
  if (yHi - yLo < 1) yHi = yLo + 1;
  var pd = (yHi - yLo) * 0.10;
  yLo -= pd; yHi += pd;
  function X(v) { return padL + (v - xMin) / (xMax - xMin) * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }
  function Yc(v) { return Math.max(padT - 10, Math.min(H - padB + 10, Y(v))); }

  if (opts.band && opts.band.to > opts.band.from) {
    var b1 = X(Math.max(xMin, opts.band.from)), b2 = X(Math.min(xMax, opts.band.to));
    if (b2 > b1) {
      ctx.save();
      ctx.fillStyle = P.tint;
      ctx.fillRect(b1, padT - 8, b2 - b1, H - padB - padT + 8);
      ctx.restore();
    }
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  if (opts.asym) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.asym.y)); ctx.lineTo(W - padR, Y(opts.asym.y)); ctx.stroke();
    ctx.restore();
    if (opts.asym.label) {
      ctx.fillStyle = P.bad; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      ctx.fillText(opts.asym.label, padL + 4, Math.max(10, Y(opts.asym.y) - 4));
    }
  }
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  series.forEach(function(s) {
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = 2.2;
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= STEPS; i++) {
      var xv = xMin + (xMax - xMin) * i / STEPS;
      var yv = s.f(xv);
      if (typeof yv !== 'number' || !isFinite(yv)) { started = false; continue; }
      var px = X(xv), py = Yc(yv);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  });
  (opts.marks || []).forEach(function(m) {
    if (typeof m.x !== 'number' || !isFinite(m.x) || m.x < xMin || m.x > xMax) return;
    var cx = X(m.x), cy = Yc(m.y);
    ctx.save();
    ctx.strokeStyle = kindColor(P, m.kind || 'gold'); ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = kindColor(P, m.kind || 'gold');
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (m.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var mw = ctx.measureText(m.label).width;
      ctx.fillText(m.label, Math.min(Math.max(2, cx - mw / 2), W - mw - 2), Math.max(10, cy - 9));
    }
  });
  if (typeof opts.at === 'number' && opts.at >= xMin && opts.at <= xMax) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(opts.at), H - padB); ctx.lineTo(X(opts.at), padT - 6); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [xMin, (xMin + xMax) / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · what each future flow is really worth on the day of the decision
   ════════════════════════════════════════════════════════════════════════ */
function widgetNPV(I0, A0, n0, r0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'flows', I: I0, A: A0, n: n0, r: r0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'flows', es: 'Lo que vale hoy el flujo de cada año', en: 'What each year of flow is worth today' },
      { id: 'cumul', es: 'Valor recuperado acumulado', en: 'Value recovered so far' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="flujos-descontados-y-valor-presente-neto">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Un proyecto vale lo que valen hoy sus flujos' : 'A project is worth what its flows are worth today') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una empresa desembolsa una cantidad hoy y espera recibir un flujo anual durante varios años. Empieza por la primera vista: la línea plana es la cifra que aparecerá en el estado de resultados de cada año y la línea que baja es lo que ese mismo dinero vale el día en que se firma. Las dos parten casi juntas y se separan cada año que pasa, y ahí está el motivo por el que un proyecto no se juzga sumando sus flujos. Pasa después a la vista acumulada: la curva es lo que llevas recuperado y la línea dorada es lo que costó. Donde la curva cruza la línea, el proyecto ya se pagó; lo que quede por encima al terminar el plazo es el valor que el proyecto agrega, y es exactamente el valor presente neto que aparece en el tablero. Mueve la tasa hacia arriba y observa cómo esa curva se aplana hasta que deja de alcanzar la línea: ese es el momento en que el proyecto deja de convenir.'
          : 'A company pays out an amount today and expects an annual flow back for several years. Start with the first view: the flat line is the figure that will appear in each year of the income statement, and the falling line is what that same money is worth on the day the deal is signed. The two start out close together and drift apart with every year that passes, and that is why a project is never judged by adding its flows up. Then switch to the cumulative view: the curve is what you have recovered so far and the gold line is what it cost. Where the curve crosses the line, the project has paid for itself; whatever sits above the line at the end of the term is the value the project adds, and it is exactly the net present value shown on the panel. Push the rate up and watch that curve flatten until it no longer reaches the line: that is the point where the project stops being worth doing.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Desembolso de hoy' : 'Outlay today') + ': <span class="cval" id="n1Il"></span></label>' +
          '<input type="range" min="400000" max="2400000" step="50000" id="n1I" value="' + state.I + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Flujo neto de cada año' : 'Net flow each year') + ': <span class="cval" id="n1Al"></span></label>' +
          '<input type="range" min="80000" max="700000" step="20000" id="n1A" value="' + state.A + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Años que dura el proyecto' : 'Years the project lasts') + ': <span class="cval" id="n1nl"></span></label>' +
          '<input type="range" min="2" max="15" step="1" id="n1n" value="' + state.n + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Tasa de descuento' : 'Discount rate') + ': <span class="cval" id="n1rl"></span></label>' +
          '<input type="range" min="3" max="30" step="1" id="n1r" value="' + Math.round(state.r * 100) + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="n1cv"></canvas>' +
        '<div class="dlist" id="n1steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor hoy de todos los flujos' : 'Value today of every flow') + '</div><div class="mnum cs" id="n1pv"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor presente neto' : 'Net present value') + '</div><div class="mnum ps" id="n1npv"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Pesos recuperados por peso invertido' : 'Pesos recovered per peso invested') + '</div><div class="mnum ts" id="n1pi"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Suma de los flujos sin descontar' : 'Flows added without discounting') + '</div><div class="mnum ts" id="n1raw"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Lo que se pierde al no descontar' : 'What ignoring the dates hides') + '</div><div class="mnum cs" id="n1gap"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Año en que el proyecto se paga' : 'Year the project pays for itself') + '</div><div class="mnum ps" id="n1pb"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="n1read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#n1I').addEventListener('input', function() { state.I = parseInt(this.value, 10); update(); });
    host.querySelector('#n1A').addEventListener('input', function() { state.A = parseInt(this.value, 10); update(); });
    host.querySelector('#n1n').addEventListener('input', function() { state.n = parseInt(this.value, 10); update(); });
    host.querySelector('#n1r').addEventListener('input', function() { state.r = parseInt(this.value, 10) / 100; update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var I = state.I, A = state.A, n = state.n, r = state.r;
    var pv  = pvAnnuity(A, r, n);
    var npv = pv - I;
    var raw = A * n;
    var dp  = discPayback(I, A, r);
    if (dp !== null && dp > n) dp = null;
    host.querySelector('#n1Il').textContent = money(I);
    host.querySelector('#n1Al').textContent = money(A);
    host.querySelector('#n1nl').textContent = intN(n) + (es ? ' años' : ' years');
    host.querySelector('#n1rl').textContent = pctS(r) + (es ? ' por ciento' : ' percent');
    host.querySelector('#n1pv').textContent  = money(pv);
    host.querySelector('#n1npv').textContent = npvTxt(npv, es);
    host.querySelector('#n1pi').textContent  = dec2(pv / I);
    host.querySelector('#n1raw').textContent = money(raw);
    host.querySelector('#n1gap').textContent = money(raw - pv);

      : 'Undiscounted, ' + money(I) + ' comes back at ' + money(A) + ' a year in ' + yearsTxt(spShown, es) + '  ·  ' +

        'by the end of the ' + intN(n) + ' years what has been recovered in today pesos adds to ' + money(rec) + '  ·  ' +
        'against the outlay that leaves ' + npvTxt(npv, es);
    var g = fitCanvas(host.querySelector('#p3cv'), 185);

      ], {
        yFloor: 0, fmtY: function(v) { return money(v); }, fmtX: function(v) { return intN(v); },
        hline: { y: I, label: (es ? 'Desembolso' : 'Outlay') },
        marks: [].concat(
          spShown !== null ? [{ x: spShown, y: I, label: dec1(spShown) + (es ? ' años' : ' years'), kind: 'soft' }] : [],
          dpShown !== null ? [{ x: dpShown, y: I, label: dec1(dpShown) + (es ? ' años' : ' years'), kind: 'bad' }] : []),
        xLabel: (es ? 'años transcurridos' : 'years elapsed')
      });
    } else {
      drawCurveChart(g, 0.02, 0.30, [
        { f: function(x) { var d = discPayback(I, A, x); return (d === null || d > 40) ? null : d; }, kind: 'green', label: (es ? 'Recuperación descontada' : 'Discounted payback') }
      ], {
        at: r, yFloor: 0, fmtY: function(v) { return dec1(v); }, fmtX: function(v) { return pct2(v); },
        hline: { y: sp, label: (es ? 'Sin descontar' : 'Undiscounted') },

        'Ahora la advertencia que da sentido a toda la sección. Cualquiera de las dos cifras deja de contar el día en que el proyecto termina de pagarse, y lo que ocurre después no aparece por ningún lado. Un proyecto que se recupera rápido y muere enseguida puede valer menos que uno que tarda y después produce durante años; en este caso, lo que el proyecto agrega en total es ' + npvTxt(npv, es) + ', y esa cifra sí toma en cuenta todo el plazo. Por eso el plazo de recuperación se usa para medir riesgo y liquidez, nunca para decidir por sí solo qué proyecto conviene.'
      : '<strong>Business reading:</strong> the outlay of ' + money(I) + ' comes back in ' + yearsTxt(spShown, es) + ' if the flows are counted as they arrive, and in ' + yearsTxt(dpShown, es) + ' if each one is first discounted at ' + pctS(r) + ' percent. The second figure is the honest one, because the first gives away the cost of having the capital tied up throughout the wait. ' +
        'Now the warning that gives the whole section its point. Either figure stops counting the day the project finishes paying for itself, and whatever happens afterwards appears nowhere. A project that recovers fast and then dies can be worth less than one that takes its time and then produces for years; here, what the project adds in total is ' + npvTxt(npv, es) + ', and that figure does take the whole term into account. This is why the payback period is used to gauge risk and liquidity, and never on its own to decide which project to run.';
  }
  widgets.push(mount);
  mount();
}

function widgetCompare(IA0, AA0, IB0, AB0, n0, r0) {
  var host = document.createElement('div');

  function mount() {

      { id: 'value', es: 'Valor en pesos de cada proyecto', en: 'Value of each project in pesos' },

    host.innerHTML =

        '<span class="iw-title">' + (es ? 'Dos propuestas sobre la mesa y presupuesto para una' : 'Two proposals on the table and budget for one') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Aquí conviven dos proyectos que compiten por el mismo dinero. La primera vista mide a cada uno en pesos y la segunda en pesos por cada peso invertido, que son dos preguntas distintas y que no siempre dan el mismo ganador. Empieza con dos proyectos parecidos: las dos vistas coincidirán y no habrá nada que discutir. Después haz al proyecto B claramente más caro y también más productivo, y compara de nuevo: es muy probable que B gane en pesos mientras A gana en pesos por peso, porque A es más eficiente pero más pequeño. Cuando eso pasa, la pregunta que resuelve el empate es qué hará la empresa con el dinero que le sobra si elige el proyecto chico. Si tiene otro destino igual de rentable, conviene el índice; si el dinero se queda parado, conviene el valor en pesos. Observa además si las dos curvas de la primera vista llegan a tocarse: cuando lo hacen, hay una tasa exacta a partir de la cual el ganador cambia, y basta con que la empresa revise su tasa mínima para que la decisión se voltee.'
          : 'Two projects competing for the same money live side by side here. The first view measures each one in pesos and the second in pesos per peso invested, which are two different questions and do not always name the same winner. Start with two similar projects: both views will agree and there will be nothing to argue about. Then make project B clearly dearer and also more productive, and compare again: B will very likely win in pesos while A wins per peso invested, because A is more efficient but smaller. When that happens, the question that breaks the tie is what the company will do with the money left over if it picks the small project. If there is another use just as profitable, the index is the guide; if the money would simply sit idle, the peso figure is. Watch as well whether the two curves in the first view ever meet: when they do, there is an exact rate beyond which the winner changes, and a revision of the company minimum rate is enough to flip the decision.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Proyecto A, desembolso' : 'Project A, outlay') + ': <span class="cval" id="c4IAl"></span></label>' +
          '<input type="range" min="300000" max="1800000" step="50000" id="c4IA" value="' + state.IA + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Proyecto A, flujo anual' : 'Project A, annual flow') + ': <span class="cval" id="c4AAl"></span></label>' +
          '<input type="range" min="60000" max="600000" step="10000" id="c4AA" value="' + state.AA + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Proyecto B, desembolso' : 'Project B, outlay') + ': <span class="cval" id="c4IBl"></span></label>' +
          '<input type="range" min="300000" max="1800000" step="50000" id="c4IB" value="' + state.IB + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Proyecto B, flujo anual' : 'Project B, annual flow') + ': <span class="cval" id="c4ABl"></span></label>' +
          '<input type="range" min="60000" max="600000" step="10000" id="c4AB" value="' + state.AB + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Años que duran ambos' : 'Years both of them last') + ': <span class="cval" id="c4nl"></span></label>' +
          '<input type="range" min="2" max="15" step="1" id="c4n" value="' + state.n + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Tasa mínima de la empresa' : 'Minimum rate of the company') + ': <span class="cval" id="c4rl"></span></label>' +
          '<input type="range" min="3" max="30" step="1" id="c4r" value="' + Math.round(state.r * 100) + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="c4cv"></canvas>' +
        '<div class="dlist" id="c4steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor presente neto de A' : 'Net present value of A') + '</div><div class="mnum cs" id="c4na"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor presente neto de B' : 'Net present value of B') + '</div><div class="mnum ps" id="c4nb"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Gana en pesos' : 'Wins in pesos') + '</div><div class="mnum ts" id="c4wn"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Índice de A' : 'Index of A') + '</div><div class="mnum cs" id="c4ia"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Índice de B' : 'Index of B') + '</div><div class="mnum ps" id="c4ib"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Gana por peso invertido' : 'Wins per peso invested') + '</div><div class="mnum ts" id="c4wi"></div></div>' +

    host.querySelectorAll('.mtab').forEach(function(b) {

        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#c4IA').addEventListener('input', function() { state.IA = parseInt(this.value, 10); update(); });
    host.querySelector('#c4AA').addEventListener('input', function() { state.AA = parseInt(this.value, 10); update(); });
    host.querySelector('#c4IB').addEventListener('input', function() { state.IB = parseInt(this.value, 10); update(); });
    host.querySelector('#c4AB').addEventListener('input', function() { state.AB = parseInt(this.value, 10); update(); });
    host.querySelector('#c4n').addEventListener('input', function() { state.n = parseInt(this.value, 10); update(); });
    host.querySelector('#c4r').addEventListener('input', function() { state.r = parseInt(this.value, 10) / 100; update(); });

  }
  function update() {
    var es = LANG === 'es';
    var IA = state.IA, AA = state.AA, IB = state.IB, AB = state.AB, n = state.n, r = state.r;
    var pvA = pvAnnuity(AA, r, n), pvB = pvAnnuity(AB, r, n);
    var npvA = pvA - IA, npvB = pvB - IB;
    var piA = pvA / IA, piB = pvB / IB;
    var winV = Math.abs(npvA - npvB) < 1 ? (es ? 'empate' : 'a tie') : (npvA > npvB ? 'A' : 'B');
    var winI = Math.abs(piA - piB) < 0.005 ? (es ? 'empate' : 'a tie') : (piA > piB ? 'A' : 'B');
    host.querySelector('#c4IAl').textContent = money(IA);
    host.querySelector('#c4AAl').textContent = money(AA);
    host.querySelector('#c4IBl').textContent = money(IB);
    host.querySelector('#c4ABl').textContent = money(AB);
    host.querySelector('#c4nl').textContent  = intN(n) + (es ? ' años' : ' years');
    host.querySelector('#c4rl').textContent  = pctS(r) + (es ? ' por ciento' : ' percent');
    host.querySelector('#c4na').textContent = npvTxt(npvA, es);
    host.querySelector('#c4nb').textContent = npvTxt(npvB, es);
    host.querySelector('#c4wn').textContent = winV;
    host.querySelector('#c4ia').textContent = dec2(piA);
    host.querySelector('#c4ib').textContent = dec2(piB);
    host.querySelector('#c4wi').textContent = winI;
    host.querySelector('#c4steps').textContent = es
      ? 'A pide ' + money(IA) + ' y devuelve ' + money(AA) + ' al año, lo que vale hoy ' + money(pvA) + '  ·  ' +
        'B pide ' + money(IB) + ' y devuelve ' + money(AB) + ' al año, lo que vale hoy ' + money(pvB) + '  ·  ' +
        'en pesos gana ' + winV + ' y por peso invertido gana ' + winI + '  ·  ' +
        'la diferencia en valor entre los dos es ' + money(Math.abs(npvA - npvB))
      : 'A asks for ' + money(IA) + ' and returns ' + money(AA) + ' a year, worth ' + money(pvA) + ' today  ·  ' +
        'B asks for ' + money(IB) + ' and returns ' + money(AB) + ' a year, worth ' + money(pvB) + ' today  ·  ' +
        'in pesos the winner is ' + winV + ' and per peso invested it is ' + winI + '  ·  ' +
        'the gap in value between the two is ' + money(Math.abs(npvA - npvB));
    var g = fitCanvas(host.querySelector('#c4cv'), 185);

      drawCurveChart(g, 0.01, 0.40, [
        { f: function(x) { return pvAnnuity(AA, x, n) - IA; }, kind: 'green', label: (es ? 'Proyecto A' : 'Project A') },
        { f: function(x) { return pvAnnuity(AB, x, n) - IB; }, kind: 'gold',  label: (es ? 'Proyecto B' : 'Project B') }
      ], {
        at: r, fmtY: function(v) { return money(v); }, fmtX: function(v) { return pct2(v); },
        xLabel: (es ? 'tasa de descuento' : 'discount rate')
      });
    } else {
      drawCurveChart(g, 0.01, 0.40, [
        { f: function(x) { return pvAnnuity(AA, x, n) / IA; }, kind: 'green', label: (es ? 'Proyecto A' : 'Project A') },
        { f: function(x) { return pvAnnuity(AB, x, n) / IB; }, kind: 'gold',  label: (es ? 'Proyecto B' : 'Project B') }
      ], {
        at: r, fmtY: function(v) { return dec2(v); }, fmtX: function(v) { return pct2(v); },
        hline: { y: 1, label: (es ? 'Punto en que se empata el costo' : 'Point where it just breaks even') },
        xLabel: (es ? 'tasa de descuento' : 'discount rate')
      });
    }
    host.querySelector('#c4read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> a una tasa de ' + pctS(r) + ' por ciento, A agrega ' + npvTxt(npvA, es) + ' con un desembolso de ' + money(IA) + ', y B agrega ' + npvTxt(npvB, es) + ' con uno de ' + money(IB) + '. Por peso invertido, A devuelve ' + dec2(piA) + ' y B devuelve ' + dec2(piB) + '. ' +
        (winV === winI
          ? 'Las dos medidas coinciden en esta configuración, así que la decisión no tiene matices: el mismo proyecto gana se mire como se mire.'
          : 'Las dos medidas se contradicen en esta configuración, y ese desacuerdo es justo lo que hay que saber manejar. El proyecto que gana en pesos agrega más valor total; el que gana por peso rinde más por cada peso comprometido.') +
        ' La regla que ordena el asunto es corta. Si los proyectos son excluyentes, es decir si hacer uno impide hacer el otro y no hay otro destino para el dinero sobrante, se elige el de mayor valor en pesos. Si en cambio el presupuesto es limitado pero hay una lista de proyectos entre los cuales repartirlo, se ordenan por valor por peso invertido y se van tomando de arriba hacia abajo hasta agotar el presupuesto, porque así cada peso disponible se coloca donde más rinde.'
      : '<strong>Business reading:</strong> at a rate of ' + pctS(r) + ' percent, A adds ' + npvTxt(npvA, es) + ' on an outlay of ' + money(IA) + ', and B adds ' + npvTxt(npvB, es) + ' on one of ' + money(IB) + '. Per peso invested, A returns ' + dec2(piA) + ' and B returns ' + dec2(piB) + '. ' +
        (winV === winI
          ? 'The two measures agree in this configuration, so the decision carries no nuance: the same project wins however you look at it.'
          : 'The two measures contradict each other in this configuration, and that disagreement is exactly what has to be handled well. The project winning in pesos adds more value in total; the one winning per peso earns more on each peso committed.') +
        ' The rule that settles the matter is short. If the projects are mutually exclusive, meaning that doing one rules out the other and there is no other home for the leftover money, pick the one with the larger value in pesos. If instead the budget is capped but there is a list of projects to spread it over, rank them by value per peso invested and take them from the top down until the budget runs out, because that puts every available peso where it earns the most.';
  }
  widgets.push(mount);
  mount();
}

        '<div class="rcard"><div class="rname">Criterio</div><div class="rform">TIR > tasa exigida</div><div class="rnote">Equivale a VPN positivo.</div></div>' +
        '<div class="rcard"><div class="rname">Holgura</div><div class="rform">TIR − tasa exigida</div><div class="rnote">Puntos de margen antes del rechazo.</div></div>' +
        '<div class="rcard"><div class="rname">Límite</div><div class="rform">no mide tamaño</div><div class="rnote">Entre proyectos decide el VPN.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una comercializadora de café en Colima puede instalar una planta de tostado propia por ' + money(c2I) + ' y dejar de pagar maquila. El ahorro neto estimado es de ' + money(c2A) + ' al año durante ' + intN(c2n) + ' años. La empresa exige ' + pctS(c2h) + ' por ciento anual a cualquier inversión, que es lo que le cuesta su capital.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se pregunta a qué tasa los ' + intN(c2n) + ' ahorros de ' + money(c2A) + ' valdrían hoy exactamente los ' + money(c2I) + ' que cuesta la planta. Esa tasa resulta ser ' + pct2(c2IRR) + '.<br>' +
      '<strong>Paso 2.</strong> Se compara contra el ' + pctS(c2h) + ' por ciento exigido y queda una holgura de ' + dec2((c2IRR - c2h) * 100) + ' puntos.<br>' +
      '<strong>Paso 3.</strong> El valor presente neto a la tasa exigida confirma el veredicto con ' + money(c2NPV) + ', que es positivo justamente porque la tasa exigida quedó a la izquierda del cruce.<br>' +
      '<strong>Lectura de negocio.</strong> La planta de tostado conviene, y la holgura de ' + dec2((c2IRR - c2h) * 100) + ' puntos dice algo que el valor presente neto no dice directamente: cuánto pueden empeorar las condiciones antes de que la decisión cambie. Si el costo del capital de la empresa subiera hasta ' + pct2(c2IRR) + ', el proyecto dejaría de agregar valor sin que los ahorros proyectados se hubieran movido un peso. Una advertencia final para el uso de esta cifra. Si mañana llega una segunda propuesta más cara y con una tasa interna menor pero con un valor presente neto mayor, y solo hay presupuesto para una, la elegible es la segunda: la tasa interna informa, pero no decide entre proyectos.</p></div>';
    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>The rate the project earns and the rate the company demands</h2>' +
      '<p>Net present value answers in pesos, and that is its strength. In a meeting, though, the question usually arrives in a different currency: what does this thing return? The answer to that version of the question is the <strong>internal rate of return</strong>, defined in a deceptively simple way: it is the discount rate at which the project is worth exactly what it costs, not a peso more. Put another way, it is the point where net present value hits zero.</p>' +
      '<p>That definition is worth translating into something you can say out loud. If a project has an internal rate of eighteen percent, it means the money still tied up in it is earning eighteen percent a year for as long as it stays there. It is a return, exactly the kind you would demand of a financial instrument, which is why it can be set against the cost of credit, against what a bank note pays, or against what the rest of the company operations earn. That immediate comparability is why the figure gets used so much.</p>' +
      '<p>The figure it is compared against is the <strong>required minimum rate</strong>, the same one used for discounting in the previous concept. If the project earns above it the project is worth doing, and if it earns below it the project is not. That test and the net present value test always agree when a single project is being accepted or rejected on its own, and the reason is geometric: the curve of value against rate slopes down, so sitting to the left of the crossing is the same as sitting above the axis. They never contradict each other in that setting, and anyone who sees a contradiction should check the arithmetic.</p>' +
      '<p>Where they do come apart is in choosing between projects. The internal rate is a figure <strong>per peso and per year</strong>, so it knows nothing about size: a tiny project with a spectacular return still adds very little value. Net present value is measured in pesos and does capture scale. That is why sensible practice reports both figures and decides on net present value, leaving the internal rate to do what it does well, which is show how much headroom there is before the project stops being worth doing.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Definition</div><div class="rform">NPV(IRR) = 0</div><div class="rnote">The rate at which it is worth what it costs.</div></div>' +
        '<div class="rcard"><div class="rname">Test</div><div class="rform">IRR > required rate</div><div class="rnote">The same thing as a positive NPV.</div></div>' +
        '<div class="rcard"><div class="rname">Headroom</div><div class="rform">IRR − required rate</div><div class="rnote">Points of margin before rejection.</div></div>' +
        '<div class="rcard"><div class="rname">Limit</div><div class="rform">blind to size</div><div class="rnote">Between projects, NPV decides.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A coffee trading company in Colima can install its own roasting plant for ' + money(c2I) + ' and stop paying a contract roaster. The estimated net saving is ' + money(c2A) + ' a year for ' + intN(c2n) + ' years. The company requires ' + pctS(c2h) + ' percent a year from any investment, which is what its capital costs.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Ask at what rate the ' + intN(c2n) + ' savings of ' + money(c2A) + ' would be worth today exactly the ' + money(c2I) + ' the plant costs. That rate turns out to be ' + pct2(c2IRR) + '.<br>' +
      '<strong>Step 2.</strong> Set it against the ' + pctS(c2h) + ' percent required and it leaves ' + dec2((c2IRR - c2h) * 100) + ' points of headroom.<br>' +
      '<strong>Step 3.</strong> Net present value at the required rate confirms the verdict at ' + money(c2NPV) + ', positive precisely because the required rate landed to the left of the crossing.<br>' +
      '<strong>Business reading.</strong> The roasting plant is worth building, and the ' + dec2((c2IRR - c2h) * 100) + ' points of headroom say something net present value does not say directly: how far conditions can worsen before the decision changes. If the cost of capital rose to ' + pct2(c2IRR) + ', the project would stop adding value without the projected savings having moved a single peso. One closing warning about how to use the figure. If a second proposal arrives tomorrow that costs more and carries a lower internal rate but a higher net present value, and there is budget for only one, the one to take is the second: the internal rate informs the choice between projects but does not settle it.</p></div>';
  });

  widgetIRR(w2I, w2A, w2n, w2h);

  /* ── Item 3 ── */

  var q3i = {
    title: { es: 'El rendimiento de la flotilla de reparto', en: 'The return on the delivery fleet' },
    q: { es: 'Una distribuidora de bebidas en Villa de Álvarez puede comprar tres camionetas de reparto por ' + money(s3I) + ' y dejar de contratar fletes externos. El ahorro neto estimado es de ' + money(p3A) + ' al año durante ' + intN(p3n) + ' años, y al final las unidades se retirarían sin valor de reventa. La empresa exige ' + pctS(p3h) + ' por ciento anual a sus inversiones y el consejo pidió expresar el proyecto como un rendimiento, para poder compararlo con lo que paga su línea de crédito. ¿Cuál es la tasa interna de retorno de la compra?',
        en: 'A beverage distributor in Villa de Álvarez can buy three delivery vans for ' + money(s3I) + ' and stop hiring outside carriers. The estimated net saving is ' + money(p3A) + ' a year for ' + intN(p3n) + ' years, after which the vehicles would be retired with no resale value. The company requires ' + pctS(p3h) + ' percent a year from its investments, and the board asked for the project to be expressed as a return so it can be set against what its credit line charges. What is the internal rate of return on the purchase?' },
