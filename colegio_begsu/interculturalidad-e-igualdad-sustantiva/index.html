                                              'There is no single answer here: what counts is that you use a case from your own place.') + '</div>' +
    '</div>');
}

function reflectTab(which, btn){
  ['type','draw'].forEach(function(k){
    var el = document.getElementById('reflect_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var tabs = btn.closest('.wtabs');
  if (tabs) tabs.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('reflectCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function reflectSave(){
  var fb = document.getElementById('reflectFb');
  if (fb) {
    fb.className = 'wmsg ok';
    fb.textContent = S('Guardado. Buen razonamiento: aquí no hay una sola respuesta correcta.',
                       'Saved. Good thinking: there is no single right answer here.');
  }
}

/* ================================================
   buildLesson - concepto, manipulativo, problema (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  if (ESCT) { clearInterval(ESCT); ESCT = null; }
  if (PIST) { clearInterval(PIST); PIST = null; }
  document.getElementById('lessonBody').innerHTML = '';
  var pf = document.getElementById('progFill'); if (pf) pf.style.width = '0%';
  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('La diferencia no es el problema','Difference is not the problem') + '</h2>' +
    '<p>' + S('En un mismo salón hay personas que hablan otra lengua en casa, que llegaron de otro estado o de otro país, que comen distinto, que celebran fiestas distintas y que creen cosas distintas. Eso se llama diversidad cultural y no es un accidente: es la forma normal en la que vive la gente en este país y en cualquier otro.',
              'In one single classroom there are people who speak another language at home, who arrived from another state or another country, who eat differently, who celebrate different festivals and who believe different things. That is called cultural diversity and it is no accident: it is the ordinary way people live in this country and in any other.') + '</p>' +
    '<p>' + S('Que muchas culturas estén en el mismo lugar todavía no dice nada sobre cómo se tratan. Pueden ignorarse durante años sin que pase nada. La interculturalidad empieza cuando esas culturas se tratan de verdad: cuando unas preguntan, otras responden, las dos aportan y las dos aprenden, y ninguna tiene que quedarse callada para caber. Ese trato solo funciona si las partes valen lo mismo dentro del grupo.',
              'Many cultures being in the same place still says nothing about how they treat each other. They can ignore one another for years and nothing happens. Interculturality begins when those cultures actually deal with each other: when some ask, others answer, both contribute and both learn, and none has to keep quiet in order to fit. That dealing only works if the sides are worth the same inside the group.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Diversidad','Diversity') + '</div><div class="rform">' + S('muchas culturas conviviendo','many cultures living together') + '</div><div class="rnote">' + S('Es el punto de partida, no un mérito ni un problema.','It is the starting point, not a merit nor a problem.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Coexistir','Coexist') + '</div><div class="rform">' + S('mismo lugar, sin trato','same place, no dealings') + '</div><div class="rnote">' + S('Nadie agrede y nadie se acerca tampoco.','Nobody attacks and nobody comes closer either.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Reconocer','Recognise') + '</div><div class="rform">' + S('valorar lo que el otro trae','valuing what the other brings') + '</div><div class="rnote">' + S('Se nombra y se respeta lo que antes se ignoraba.','What used to be ignored gets named and respected.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Interculturalidad','Interculturality') + '</div><div class="rform">' + S('intercambio entre iguales','exchange between equals') + '</div><div class="rnote">' + S('Las dos partes aportan y las dos aprenden.','Both sides contribute and both learn.') + '</div></div>' +
    '</div>' +
    '<div class="callout"><p><strong>' + S('Lo que está en juego: ','What is at stake: ') + '</strong>' +
      S('un grupo que solo coexiste se rompe en cuanto aparece el primer conflicto, porque nadie conoce al otro lo suficiente para hablarle. Un grupo que intercambia llega a ese conflicto con algo ya construido entre las partes.',
        'a group that merely coexists breaks apart as soon as the first conflict appears, because nobody knows the other well enough to speak to them. A group that exchanges reaches that conflict with something already built between the sides.') + '</p></div>');

  buildLadder(rng); escRender();

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Lo que le falta a la semana cultural', en:'What the culture week is missing' }, showWork:false,
      stmt:{ es:'Una escuela organiza una semana de las culturas: cada grupo presenta bailes y comidas de una región mientras los demás miran desde las gradas. Al terminar la semana, el trato entre los grupos sigue exactamente igual que antes. ¿Qué le falta a esa semana para que haya interculturalidad?',
             en:'A school organises a culture week: each group presents dances and dishes from one region while the others watch from the stands. When the week ends, the way the groups treat each other is exactly as it was before. What is that week missing for there to be interculturality?' },
      options:{ es:[
        'Que las culturas presentes se traten entre sí: que unas pregunten, otras respondan y algo del grupo cambie a partir de ese intercambio',
        'Que se presenten más regiones del país para que ninguna cultura quede fuera del programa de la semana',
        'Que la presentación se repita cada año en la misma fecha hasta volverse una tradición de la escuela',
        'Que cada grupo prepare su presentación sin ayuda de los demás para que resulte más auténtica'],
        en:[
        'That the cultures present actually deal with each other: some ask, others answer and something in the group changes out of that exchange',
        'That more regions of the country be presented so that no culture is left out of the week programme',
        'That the presentation be repeated every year on the same date until it becomes a school tradition',
        'That each group prepare its presentation without help from the others so that it turns out more authentic'] },
      correct:0,
      hint:{ es:'Pregúntate si en esa semana alguien aprendió algo del otro, o si cada grupo solo mostró lo suyo y volvió a su lugar.',
             en:'Ask whether anyone learned something from the other during that week, or whether each group merely showed its own and went back to its place.' },
      explanation:{ es:'Mostrar bailes y comidas ya reconoce lo que cada grupo trae, y por eso la semana no es inútil. Pero mirar desde las gradas deja a las culturas una frente a otra sin tratarse: nadie pregunta, nadie responde y nada cambia después. La interculturalidad aparece cuando las partes aportan y aprenden unas de otras, no cuando se exhiben por turnos.',
                    en:'Showing dances and dishes already recognises what each group brings, which is why the week is not useless. But watching from the stands leaves the cultures facing each other without dealing with each other: nobody asks, nobody answers and nothing changes afterwards. Interculturality appears when the sides contribute and learn from one another, not when they take turns on display.' } },
    { title:{ es:'Lo que hay en ese salón', en:'What that classroom has' }, showWork:false,
      stmt:{ es:'En un salón conviven estudiantes de tres comunidades distintas. Nadie agrede a nadie y cada quien trabaja con los suyos. Al terminar el año, ninguno sabe una palabra de la lengua del otro ni cómo se llaman sus fiestas. ¿Qué describe mejor lo que hay en ese salón?',
             en:'In one classroom there are students from three different communities. Nobody attacks anybody and each one works with their own. By the end of the year, none of them knows a single word of the other language nor the names of their festivals. What best describes what that classroom has?' },
      options:{ es:[
        'Coexistencia sin encuentro: comparten el espacio, y todavía falta que las partes se traten y aprendan algo unas de otras',
        'Discriminación abierta: lo que falta es que la escuela sancione a quienes agreden a sus compañeros de otras comunidades',
        'Interculturalidad completa: lo único que falta es que la escuela lo deje escrito en su reglamento de convivencia',
        'Ausencia de diversidad: lo que falta es que lleguen estudiantes de más comunidades para que el salón sea diverso'],
        en:[
        'Coexistence without encounter: they share the space, and the sides still need to deal with each other and learn something from one another',
        'Open discrimination: what is missing is for the school to sanction those who attack classmates from other communities',
        'Full interculturality: the only thing missing is for the school to write it into its coexistence rules',
        'Absence of diversity: what is missing is for students from more communities to arrive so the classroom becomes diverse'] },
      correct:0,
      hint:{ es:'Fíjate en dos cosas distintas: si hay culturas distintas en el salón, y si esas culturas se tratan entre sí.',
             en:'Look at two separate things: whether there are different cultures in the classroom, and whether those cultures deal with each other.' },
      explanation:{ es:'Diversidad hay de sobra: son tres comunidades en un mismo salón. Nadie agrede, así que tampoco se puede llamar discriminación. Lo que no ocurrió en todo el año fue el trato: sin preguntas ni intercambio, las culturas comparten el espacio y siguen siendo desconocidas entre sí. Eso es coexistir, un escalón por debajo de la interculturalidad.',
                    en:'There is diversity to spare: three communities in one classroom. Nobody attacks anyone, so it cannot be called discrimination either. What never happened all year was the dealing: with no questions and no exchange, the cultures share the space and remain strangers to each other. That is coexisting, one rung below interculturality.' } }
  ], rng), rng);

  /* ── PROBLEMA 2 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Iguales quiere decir otra cosa', en:'Equal means something else' }, showWork:false,
      stmt:{ es:'Para que el grupo se lleve bien, un compañero propone que en la escuela nadie hable de su lengua, de su comida ni de sus fiestas, porque así todas las personas serían iguales. ¿Qué problema tiene esa propuesta?',
             en:'So that the group gets along, a classmate proposes that at school nobody talk about their language, their food or their festivals, because that way everyone would be equal. What is wrong with that proposal?' },
      options:{ es:[
        'Le pide a una parte del grupo que esconda lo que es para poder caber, y ser iguales en derechos no significa dejar de ser distintos',
        'Ninguno de fondo: si nadie menciona sus diferencias, los conflictos entre grupos desaparecen del salón por sí solos',
        'Es un problema solo práctico: sería muy difícil vigilar que nadie hable de sus costumbres durante toda la jornada',
        'Que la propuesta tendría que aplicarse únicamente en las clases y dejar libre el recreo para hablar de lo que sea'],
        en:[
        'It asks part of the group to hide what they are in order to fit, and being equal in rights does not mean ceasing to be different',
        'Nothing serious: if nobody mentions their differences, conflicts between groups disappear from the classroom by themselves',
        'It is only a practical problem: it would be very hard to police that nobody talks about their customs all day long',
        'That the proposal should apply only during lessons and leave break free to talk about anything'] },
      correct:0,
      hint:{ es:'Pregúntate a quién le costaría más callarse: a quien ya se parece a la mayoría o a quien no.',
             en:'Ask who would find staying silent harder: someone who already resembles the majority, or someone who does not.' },
      explanation:{ es:'La propuesta suena justa porque parece pedir lo mismo a todos, pero el silencio no le cuesta igual a quien ya se parece a la mayoría que a quien no. Igualdad significa que todas las personas valen lo mismo y tienen los mismos derechos, no que todas tengan que parecerse. Además, callar las diferencias no resuelve los conflictos: los deja sin nombrar.',
                    en:'The proposal sounds fair because it seems to ask the same of everyone, but silence does not cost the same for someone who already resembles the majority as for someone who does not. Equality means everyone is worth the same and holds the same rights, not that everyone has to look alike. Besides, silencing differences does not settle conflicts: it leaves them unnamed.' } },
    { title:{ es:'Una lengua para los actos', en:'One language for the assemblies' }, showWork:false,
      stmt:{ es:'Una escuela acuerda que, para tratar a todo el mundo igual, en los actos escolares solo se hablará español, aunque una parte del estudiantado habla también otra lengua en casa. ¿Qué tiene de equivocado ese acuerdo?',
             en:'A school agrees that, in order to treat everyone the same, only Spanish will be spoken at school assemblies, even though part of the student body also speaks another language at home. What is wrong with that agreement?' },
      options:{ es:[
        'Trata una lengua del propio grupo como un estorbo: pide callarla en vez de darle un lugar junto a la otra',
        'Nada de fondo: si en el acto se escucha una sola lengua, ninguna persona del público puede sentirse excluida',
        'Que el acuerdo tendría que incluir también las lenguas extranjeras que se enseñan como materia en la escuela',
        'Que un acuerdo así corresponde tomarlo por votación entre el estudiantado y no en una reunión de maestros'],
        en:[
        'It treats a language of the group itself as a nuisance: it asks for it to be silenced instead of giving it a place beside the other',
        'Nothing serious: if a single language is heard at the assembly, nobody in the audience can feel excluded',
        'That the agreement should also include the foreign languages taught as a subject at the school',
        'That an agreement like this should be taken by a student vote and not at a teachers meeting'] },
      correct:0,
      hint:{ es:'Distingue entre que todas las personas entiendan y que una lengua del grupo tenga que desaparecer del acto.',
             en:'Tell apart everyone understanding and a language of the group having to disappear from the assembly.' },
      explanation:{ es:'Que todas las personas entiendan es un objetivo razonable, y se resuelve traduciendo o repitiendo, no borrando. El acuerdo va más lejos: convierte una lengua del propio grupo en algo que no se puede escuchar, y eso le dice a quienes la hablan que su parte vale menos. Tratar igual no es hacer desaparecer lo que distingue a una parte del grupo.',
                    en:'Everyone understanding is a reasonable goal, and it is met by translating or repeating, not by erasing. The agreement goes further: it turns a language of the group itself into something that cannot be heard, and that tells its speakers that their side is worth less. Treating equally is not making what distinguishes part of the group disappear.' } }
  ], rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('La misma regla no siempre da la misma oportunidad','The same rule does not always give the same chance') + '</h2>' +
    '<p>' + S('Todas las personas tienen los mismos derechos y las reglas de la escuela son las mismas para todo el estudiantado. Eso ya está escrito y es indispensable. La pregunta que sigue es otra: con esa misma regla, ¿todas las personas pueden de verdad ejercer ese derecho?',
              'Everyone holds the same rights and the school rules are the same for the whole student body. That is already written down and it is indispensable. The next question is a different one: under that same rule, can everyone actually exercise that right?') + '</p>' +
    '<p>' + S('Muchas veces no, porque entre la persona y el derecho hay una barrera: una hora imposible, una escalera, un aviso en una lengua que no lee, una tarea de cuidado que le toca siempre a las mismas. La igualdad sustantiva mira ese resultado real y admite medidas distintas para quitar la barrera. No reparte ventajas ni frena a nadie: acerca el punto de salida de quien venía más atrás.',
              'Often they cannot, because between the person and the right there is a barrier: an impossible hour, a staircase, a notice in a language they do not read, a caring duty that always falls on the same people. Substantive equality looks at that real outcome and allows different measures to remove the barrier. It hands out no advantages and holds nobody back: it brings forward the starting point of whoever was further behind.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Igualdad formal','Formal equality') + '</div><div class="rform">' + S('la misma regla para todos','the same rule for everyone') + '</div><div class="rnote">' + S('Necesaria, y a veces no alcanza.','Necessary, and sometimes not enough.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Barrera','Barrier') + '</div><div class="rform">' + S('lo que impide ejercer el derecho','what blocks exercising the right') + '</div><div class="rnote">' + S('Horario, escalera, lengua, tarea de cuidado.','Timetable, staircase, language, caring duty.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Medida','Measure') + '</div><div class="rform">' + S('trato distinto que quita la barrera','different treatment that removes it') + '</div><div class="rnote">' + S('No le quita nada a quien ya podía.','It takes nothing from those who already could.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Igualdad sustantiva','Substantive equality') + '</div><div class="rform">' + S('mismo derecho ejercido de verdad','same right actually exercised') + '</div><div class="rnote">' + S('Se comprueba en el resultado, no en el papel.','It is checked in the outcome, not on paper.') + '</div></div>' +
    '</div>' +
    '<div class="callout"><p><strong>' + S('Cómo se nota: ','How you notice it: ') + '</strong>' +
      S('si la regla es la misma para todo el mundo y aun así los que se quedan fuera son siempre del mismo grupo, la barrera no está en la regla, está en las condiciones con las que cada quien llega a ella.',
        'if the rule is the same for everyone and yet the people left out always come from the same group, the barrier is not in the rule, it is in the conditions each one arrives with.') + '</p></div>');

  buildTrack(rng); pisRender();

  /* ── PROBLEMA 3 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La medida que sí llega', en:'The measure that reaches' }, showWork:false,
      stmt:{ es:'En una secundaria las clases de regularización son a las siete de la mañana. La mitad del grupo vive a más de una hora y llega en un transporte que pasa a las ocho. La escuela quiere que la regularización llegue de verdad a todo el grupo. ¿Qué medida cumple ese objetivo?',
             en:'At a secondary school the catch-up classes are at seven in the morning. Half the group lives more than an hour away and arrives on transport that passes at eight. The school wants the catch-up classes to actually reach the whole group. Which measure meets that goal?' },
      options:{ es:[
        'Abrir además un grupo de regularización en un horario compatible con el transporte que usa esa mitad del grupo',
        'Publicar un aviso que recuerde que la regularización está abierta a todo el estudiantado sin excepción',
        'Cancelar la clase de las siete hasta que todo el grupo pueda asistir a esa misma hora de la mañana',
        'Entregar un reconocimiento mensual a quienes logran llegar puntuales a la clase de las siete'],
        en:[
        'Also open a catch-up group at a time compatible with the transport that half of the group uses',
        'Publish a notice reminding everyone that catch-up classes are open to the whole student body without exception',
        'Cancel the seven o clock class until the whole group is able to attend at that same morning hour',
        'Give a monthly award to those who manage to arrive on time for the seven o clock class'] },
      correct:0,
      hint:{ es:'Pregúntate qué es exactamente lo que impide llegar, y si la medida quita eso sin quitarle la clase a quien ya podía asistir.',
             en:'Ask what exactly stops them arriving, and whether the measure removes that without taking the class away from those who already could attend.' },
      explanation:{ es:'Lo que deja fuera a esa mitad del grupo no es el permiso, es la hora del transporte. Repetir el aviso no mueve el transporte y premiar la puntualidad premia a quienes ya podían llegar. Cancelar la clase empareja quitándosela a todos, y así nadie se regulariza. Un segundo horario quita la barrera y deja intacto lo que ya funcionaba.',
                    en:'What leaves that half of the group out is not permission, it is the transport time. Repeating the notice does not move the transport and rewarding punctuality rewards those who could already arrive. Cancelling the class levels things by taking it from everyone, and then nobody catches up. A second time slot removes the barrier and leaves intact what was already working.' } },
    { title:{ es:'El curso que no llega a todos', en:'The course that does not reach everyone' }, showWork:false,
      stmt:{ es:'Una escuela ofrece un curso de computación que se sigue en línea desde casa. Varias familias de la comunidad no tienen conexión y sus hijos hacen las tareas en el teléfono de un vecino. La escuela quiere que el curso llegue de verdad a todo el grupo. ¿Qué medida cumple ese objetivo?',
             en:'A school offers a computing course to be followed online from home. Several families in the community have no connection and their children do the homework on a neighbour phone. The school wants the course to actually reach the whole group. Which measure meets that goal?' },
      options:{ es:[
        'Abrir el aula de cómputo de la escuela en horarios fijos para quienes no tienen conexión en su casa',
        'Recordar en la reunión de familias que el curso es gratuito y que está disponible para todo el grupo',
        'Suspender el curso en línea hasta que todas las familias de la comunidad cuenten con conexión propia',
        'Publicar cada semana la lista de quienes entregaron las tareas del curso dentro del plazo marcado'],
        en:[
        'Open the school computer room at fixed hours for those who have no connection at home',
        'Remind the families meeting that the course is free and available to the whole group',
        'Suspend the online course until every family in the community has its own connection',
        'Publish each week the list of those who handed in the course homework within the deadline'] },
      correct:0,
      hint:{ es:'Pregúntate qué es exactamente lo que impide seguir el curso, y si la medida quita eso sin quitarle el curso a quien ya podía seguirlo.',
             en:'Ask what exactly stops them following the course, and whether the measure removes that without taking the course from those who already could follow it.' },
      explanation:{ es:'La barrera no es el costo ni la información: es que en esas casas no hay conexión. Recordar que el curso es gratuito no la quita, y publicar listas solo hace visible quién se quedó atrás. Suspenderlo empareja hacia abajo y nadie aprende. Abrir el aula pone la conexión al alcance de quien no la tiene y no le quita nada a quien ya la tenía.',
                    en:'The barrier is neither cost nor information: it is that those homes have no connection. Reminding people the course is free does not remove it, and publishing lists only makes visible who fell behind. Suspending it levels downwards and nobody learns. Opening the room puts the connection within reach of those without it and takes nothing from those who already had it.' } }
  ], rng), rng);

  /* ── PROBLEMA 4 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La rampa y el reclamo', en:'The ramp and the complaint' }, showWork:false,
      stmt:{ es:'La escuela construye una rampa y cambia a la planta baja los salones donde estudia un compañero que usa silla de ruedas. Otro estudiante reclama que eso es un privilegio. ¿Qué conviene responderle?',
             en:'The school builds a ramp and moves to the ground floor the classrooms where a student who uses a wheelchair studies. Another student complains that this is a privilege. What is the right answer to give him?' },
      options:{ es:[
        'Que no es un privilegio: la rampa no le da una ventaja a nadie, quita la barrera que le impedía entrar al salón por su cuenta',
        'Que sí es un privilegio, aunque conviene aceptarlo porque en la escuela se trata de muy pocas personas',
        'Que se trata de un gasto decidido por la dirección y que al estudiantado no le corresponde opinar sobre él',
        'Que la medida sería justa solo si todos los grados de la escuela tuvieran sus salones en la planta baja'],
        en:[
        'That it is not a privilege: the ramp gives nobody an advantage, it removes the barrier that stopped him entering the classroom on his own',
        'That it is a privilege, though worth accepting because very few people at the school are involved',
        'That it is spending decided by the head office and the student body has no business giving an opinion on it',
        'That the measure would be fair only if every year group had its classrooms on the ground floor'] },
      correct:0,
      hint:{ es:'Compara dos cosas: lo que la medida le da a esa persona y lo que le quita a quien ya podía subir la escalera.',
             en:'Compare two things: what the measure gives that person and what it takes from those who could already climb the stairs.' },
      explanation:{ es:'Un privilegio pone a alguien por encima de los demás. La rampa deja a ese compañero en el mismo lugar que el resto: entrar al salón por su cuenta, que es lo que los demás ya hacían. Nadie pierde su acceso por ella, así que no hay ventaja repartida. Y no es un asunto ajeno al grupo: el acceso a la escuela es un derecho de todo el estudiantado.',
                    en:'A privilege puts someone above the rest. The ramp leaves that classmate in the same place as everyone else: entering the classroom on his own, which is what the others already did. Nobody loses their access because of it, so no advantage is handed out. And it is not a matter outside the group: access to the school is a right of the whole student body.' } },
    { title:{ es:'Los lugares del taller', en:'The workshop places' }, showWork:false,
      stmt:{ es:'Tras tres años en los que ninguna estudiante se inscribió, una escuela reserva la mitad de los lugares del taller de robótica para mujeres. Un compañero dice que la medida es injusta para los hombres. ¿Qué conviene responderle?',
             en:'After three years in which no girl signed up, a school reserves half the places in the robotics workshop for girls. A classmate says the measure is unfair to the boys. What is the right answer to give him?' },
      options:{ es:[
        'Que la medida corrige una desventaja que se venía repitiendo cada año y busca que las dos partes tengan la misma posibilidad real de entrar',
        'Que es injusta pero necesaria, porque a las mujeres les interesa menos la robótica y hay que animarlas a intentarlo',
        'Que los lugares deberían repartirse por orden de llegada, tal como se hizo durante los tres años anteriores',
        'Que la escuela debería abrir un taller distinto para cada grupo y así nadie tendría que competir por los lugares'],
        en:[
        'That the measure corrects a disadvantage that had been repeating every year and seeks the same real chance of entry for both sides',
        'That it is unfair but necessary, because girls are less interested in robotics and need encouragement to try',
        'That places should be shared out by order of arrival, just as was done during the three previous years',
        'That the school should open a separate workshop for each group so nobody has to compete for places'] },
      correct:0,
      hint:{ es:'Fíjate en el dato de los tres años: pregúntate si el resultado se repitió por casualidad o por algo que la escuela sí puede cambiar.',
             en:'Look at the three year figure: ask whether the result repeated by chance or because of something the school can actually change.' },
      explanation:{ es:'Tres años con el mismo resultado no son una casualidad: señalan una desventaja sostenida en el punto de salida. La medida no dice que las mujeres sepan menos ni que les interese menos, y por eso la respuesta que habla de falta de interés repite justamente el estereotipo que causó el problema. Volver al orden de llegada devuelve el resultado conocido, y separar talleres deja la desventaja intacta en un salón aparte.',
                    en:'Three years with the same result is not chance: it points to a sustained disadvantage at the starting point. The measure does not say that girls know less or care less, which is why the answer about lack of interest repeats exactly the stereotype that caused the problem. Going back to order of arrival brings back the known result, and separating workshops leaves the disadvantage untouched in a room of its own.' } }
  ], rng), rng);

  /* ── CONCEPTO 3 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('De la idea al daño','From an idea to harm') + '</h2>' +
    '<p>' + S('Casi siempre el daño empieza como una idea repetida: que las personas de tal comunidad son de tal modo, que las mujeres sirven para unas cosas y los hombres para otras, que quien habla distinto entiende menos. Eso es un estereotipo. Cuando esa idea se aplica a una persona concreta antes de conocerla, ya es un prejuicio. Y en el momento en que ese juicio le quita a alguien una oportunidad o un derecho, hay discriminación.',
              'The harm almost always starts as a repeated idea: that people from a certain community are a certain way, that women are good for some things and men for others, that whoever speaks differently understands less. That is a stereotype. When that idea is applied to one particular person before knowing them, it is already a prejudice. And the moment that judgement takes an opportunity or a right away from someone, there is discrimination.') + '</p>' +
    '<p>' + S('El racismo es una de sus formas más antiguas: coloca a unas personas por encima de otras por su color de piel, sus rasgos o su origen. No vive solo en los insultos. Vive en los apodos que se dicen riendo, en quién queda fuera del equipo, en a quién se le cree cuando dos versiones se contradicen. Por eso la intención no cierra el asunto: decir que era una broma no cambia lo que la broma dejó, y quien la recibe no tiene por qué cargar además con la tarea de demostrar que le dolió.',
              'Racism is one of its oldest forms: it places some people above others because of their skin colour, their features or their origin. It does not live in insults alone. It lives in nicknames said with a laugh, in who gets left off the team, in who is believed when two versions clash. That is why intention does not settle the matter: saying it was a joke does not change what the joke left behind, and the person who receives it should not also carry the task of proving that it hurt.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Estereotipo','Stereotype') + '</div><div class="rform">' + S('idea fija sobre un grupo','fixed idea about a group') + '</div><div class="rnote">' + S('Se repite hasta parecer un dato.','Repeated until it sounds like a fact.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Prejuicio','Prejudice') + '</div><div class="rform">' + S('juicio antes de conocer','judgement before knowing') + '</div><div class="rnote">' + S('Ya apunta a una persona concreta.','It already points at one person.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Discriminación','Discrimination') + '</div><div class="rform">' + S('quita un derecho u oportunidad','takes a right or a chance away') + '</div><div class="rnote">' + S('Se mide por el efecto, no por la intención.','Measured by effect, not by intention.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Racismo','Racism') + '</div><div class="rform">' + S('unos por encima por su origen','some above others by origin') + '</div><div class="rnote">' + S('Aparece en apodos y en decisiones.','It shows up in nicknames and in decisions.') + '</div></div>' +
    '</div>' +
    '<div class="callout"><p><strong>' + S('La prueba: ','The test: ') + '</strong>' +
      S('pregúntate qué perdió la persona. Si perdió una oportunidad, un lugar, un turno o el derecho a ser escuchada por una característica suya, lo que hubo fue discriminación, aunque nadie haya querido hacerle daño.',
        'ask what the person lost. If they lost an opportunity, a place, a turn or the right to be heard because of a characteristic of theirs, what happened was discrimination, even if nobody meant to harm them.') + '</p></div>');

  addProblem(pick([

      options:{ es:[
        'Un estereotipo se volvió discriminación en el momento en que les quitó la oportunidad de presentar la prueba',
        'Hubo únicamente un estereotipo, porque una creencia sobre un grupo no llega a ser una acción contra alguien',
        'No hubo discriminación, porque el entrenador es quien decide a quién convoca a las pruebas de su equipo',
        'Hubo un prejuicio sin consecuencias, ya que esos estudiantes podrán presentarse a las pruebas del año siguiente'],
        en:[

                    en:'The idea about the community was a stereotype while it stayed inside the coach head. It stopped being one when he decided with it: the two students lost the trial because of their origin and not because of their play. The chance to try next year does not give back this year opportunity, and deciding about the team does not include deciding by the origin of whoever shows up.' } },
    { title:{ es:'El grupo asignado de antemano', en:'The group assigned in advance' }, showWork:false,
      stmt:{ es:'Una maestra piensa que quienes vienen de las comunidades de la sierra llegan con menos nivel. Con esa idea inscribe directamente a esos estudiantes en el grupo de menor exigencia, sin aplicarles la evaluación que aplicó a los demás. ¿Qué ocurrió en ese caso?',
             en:'A teacher thinks that those who come from the mountain communities arrive with a lower level. With that idea she signs those students straight into the least demanding group, without giving them the assessment she gave to everyone else. What happened in that case?' },
      options:{ es:[
        'Un estereotipo se volvió discriminación al decidir su lugar por su origen en lugar de por lo que muestra su evaluación',
        'Hubo únicamente un estereotipo, porque pensar algo sobre un grupo no afecta a nadie mientras no se diga en voz alta',
        'No hubo discriminación, porque agrupar por nivel es una decisión pedagógica que corresponde a cada maestra',

        en:[

        'There was only a stereotype, because thinking something about a group harms nobody as long as it is not said aloud',
        'There was no discrimination, because grouping by level is a teaching decision belonging to each teacher',

      hint:{ es:'Fíjate en qué se usó para decidir el lugar de esos estudiantes y en qué se usó para decidir el de los demás.',

      explanation:{ es:'A los demás se les midió con una evaluación; a estos se les asignó lugar por el sitio del que vienen. Ahí la idea dejó de ser solo una idea: les quitó la posibilidad de mostrar lo que saben. Agrupar por nivel es válido cuando el nivel se mide, no cuando se supone. Y poder pedir un cambio después no repara la evaluación que nunca se les aplicó.',
                    en:'Everyone else was measured with an assessment; these students were assigned a place by where they come from. That is where the idea stopped being just an idea: it took away their chance to show what they know. Grouping by level is valid when the level is measured, not when it is assumed. And being able to request a change later does not repair the assessment they were never given.' } }

  addProblem(pick([

      stmt:{ es:'Un compañero le pone apodos a otro por su color de piel. Cuando le piden que se detenga, responde que es solo una broma y que nadie se está enojando. ¿Cuál es la mejor razón para pedirle que pare?',
             en:'A classmate gives another one nicknames because of his skin colour. When he is asked to stop, he answers that it is only a joke and that nobody is getting angry. What is the best reason to ask him to stop?' },
      options:{ es:[
        'Que el efecto no lo decide quien hace la broma: el apodo señala a alguien por algo que es y lo coloca por debajo del resto ante el grupo',
        'Que las bromas de ese tipo están prohibidas en el reglamento y quien las hace se expone a una sanción de la escuela',
        'Que la broma podría incomodar a otras personas del salón que tengan un color de piel parecido al del compañero',
        'Que conviene esperar a que la persona señalada diga expresamente que le molesta antes de pedirle a alguien que pare'],
        en:[
        'That the effect is not decided by whoever makes the joke: the nickname marks someone for something they are and places them below the rest in front of the group',
        'That jokes of that kind are banned in the school rules and whoever makes them risks a sanction',
        'That the joke might make other people in the classroom with a similar skin colour uncomfortable',
        'That it is better to wait until the person marked says openly that it bothers them before asking anyone to stop'] },
      correct:0,
      hint:{ es:'Separa dos cosas: lo que quien habla quiso hacer y lo que el apodo deja instalado en el grupo.',
             en:'Separate two things: what the speaker meant to do and what the nickname leaves installed in the group.' },
      explanation:{ es:'El apodo no comenta algo que el compañero hizo: lo señala por su color de piel, que es algo que él es y no puede cambiar, y lo deja en un lugar más bajo delante del grupo. Esa consecuencia ocurre sin importar la intención de quien la dice. El reglamento ayuda, pero es una razón externa; y esperar a que la persona reclame le traslada a ella el trabajo de detener lo que no empezó.',
                    en:'The nickname does not comment on something the classmate did: it marks him for his skin colour, which is something he is and cannot change, and leaves him in a lower place in front of the group. That consequence happens regardless of the intention of whoever says it. The rules help, but they are an outside reason; and waiting for the person to complain shifts onto them the work of stopping something they did not start.' } },
    { title:{ es:'La sonrisa que no cierra el asunto', en:'The smile that settles nothing' }, showWork:false,
      stmt:{ es:'En un salón se repite un apodo que se burla del origen de un compañero, y varios lo dicen riendo. Él responde con una sonrisa y no dice nada. Otro estudiante concluye que entonces no está pasando nada. ¿Qué conviene responderle?',
             en:'In a classroom a nickname mocking a classmate origin keeps being repeated, and several say it laughing. He answers with a smile and says nothing. Another student concludes that nothing is going on then. What is the right answer to give him?' },
      options:{ es:[
        'Que sonreír no significa que esté bien: el apodo lo separa del grupo por su origen y esa separación sigue ahí aunque él no reclame',
        'Que sí está pasando algo, aunque solamente cuando el apodo se dice frente a un adulto de la escuela',
        'Que no está pasando nada mientras el compañero no presente una queja formal ante la dirección del plantel',
        'Que el asunto se resolvería si el resto del grupo aceptara que también le pongan apodos entre ellos'],
        en:[
        'That smiling does not mean it is fine: the nickname sets him apart from the group for his origin and that separation stays even if he does not complain',
        'That something is going on, though only when the nickname is said in front of an adult from the school',
        'That nothing is going on as long as the classmate files no formal complaint with the head office',
        'That the matter would be settled if the rest of the group accepted nicknames among themselves too'] },
      correct:0,
      hint:{ es:'Pregúntate qué opciones tiene alguien que está solo frente a un grupo que se ríe, y si su reacción prueba que el apodo no le afecta.',
             en:'Ask what options someone has when standing alone before a laughing group, and whether their reaction proves the nickname does not affect them.' },
      explanation:{ es:'Sonreír frente a un grupo que se ríe suele ser la salida más barata para no quedar aún más solo, así que no prueba que el apodo sea inofensivo. Lo que el apodo hace no depende de la reacción de quien lo recibe: lo marca por su origen delante de todos. Tampoco depende de que haya adultos presentes ni de que exista una queja escrita, y repartir apodos entre todos no quita el que ya lo señala a él.',
                    en:'Smiling in front of a laughing group is usually the cheapest way out of ending up even more alone, so it proves nothing about the nickname being harmless. What the nickname does is not up to the reaction of the person receiving it: it marks him for his origin in front of everyone. It does not depend on adults being present nor on a written complaint either, and handing nicknames around does not remove the one that already marks him.' } }
  ], rng), rng);

  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Rechazar la discriminación: una ruta, no un enojo','Rejecting discrimination: a route, not an outburst') + '</h2>' +
    '<p>' + S('Rechazar la discriminación no consiste en indignarse un rato. Consiste en hacer algo que cambie la situación, y eso tiene un orden. Primero se detiene y se nombra el hecho, porque lo que no se nombra se vuelve costumbre. Enseguida se atiende a la persona afectada y se le pregunta qué necesita, en vez de decidir por ella.',
              'Rejecting discrimination is not a matter of being outraged for a while. It is a matter of doing something that changes the situation, and that has an order. First the fact is stopped and named, because whatever goes unnamed turns into habit. Next the person affected is looked after and asked what they need, instead of deciding for them.') + '</p>' +
    '<p>' + S('Después vienen los hechos por escrito: qué pasó, cuándo, dónde y quiénes lo vieron. Con eso el caso llega a quien puede resolverlo dentro de la escuela y deja de depender de la palabra de una sola persona. Al final hace falta lo que casi siempre se olvida: una medida que cambie algo, no solo una disculpa, y una fecha para revisar si la situación cambió de verdad. Quien mira sin hacer nada deja la carga completa sobre quien está recibiendo el daño.',
              'Then come the facts in writing: what happened, when, where and who saw it. With that, the case reaches whoever can settle it inside the school and stops depending on one person word. At the end comes what is nearly always forgotten: a measure that changes something, not only an apology, and a date to check whether the situation really changed. Whoever watches and does nothing leaves the whole load on the person receiving the harm.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Cuidado con esto: ','Watch out for this: ') + '</strong>' +
      S('pedirle a quien recibe el daño que aguante, que ignore o que no reaccione le traslada el problema a ella y deja intacto lo que lo causó. La respuesta se le pide a quien discrimina y a quien puede cambiar las condiciones.',
        'asking the person receiving the harm to put up with it, to ignore it or not to react shifts the problem onto them and leaves untouched what caused it. The response is asked of whoever discriminates and of whoever can change the conditions.') + '</p></div>');

        'That the timetable should be extended only if most of the student body requests it in writing'] },
      correct:0,
      hint:{ es:'Fíjate en quiénes son los que faltan y en si tienen algo en común que ellas mismas puedan cambiar.',
             en:'Look at who the missing ones are and whether they share something they themselves could change.' },
      explanation:{ es:'La puerta abierta describe la regla; los datos describen el resultado, y ahí las ausentes coinciden siempre en lo mismo: cuidan a alguien justo a esa hora. Eso no es falta de interés, es una tarea que no eligieron y que ocurre exactamente en el horario disponible. Cuando la regla es igual y el resultado se repite en el mismo grupo, la barrera está fuera de la regla, en las condiciones con las que cada quien llega.',
                    en:'The open door describes the rule; the figures describe the outcome, and there the absent ones always coincide in the same thing: they are minding someone at exactly that hour. That is not lack of interest, it is a duty they did not choose that falls precisely in the available slot. When the rule is equal and the outcome repeats in the same group, the barrier sits outside the rule, in the conditions each one arrives with.' } },
    { title:{ es:'Lo que dicen los datos', en:'What the figures say' }, showWork:false,
      stmt:{ es:'La convocatoria de una beca deportiva se difunde únicamente por internet. Al cierre no llegó ninguna solicitud de las tres comunidades donde el servicio falla casi todos los días. La convocatoria decía que estaba abierta a toda la población del municipio. ¿Qué conclusión se sigue de esos datos?',
             en:'A sports scholarship call is spread only over the internet. At the deadline no application had arrived from the three communities where the service fails almost every day. The call stated that it was open to the whole population of the municipality. What follows from those figures?' },
      options:{ es:[
        'Que la convocatoria era igual para todos y aun así dejó fuera a las mismas comunidades, señal de que la barrera está en el medio de difusión',
        'Que en esas tres comunidades no hay personas interesadas en practicar deporte de manera formal',
        'Que la convocatoria fue justa, porque a ninguna comunidad se le prohibió presentar su solicitud a tiempo',
        'Que conviene reducir el número de becas hasta que las tres comunidades cuenten con un servicio estable'],
        en:[
        'That the call was equal for everyone and still left out the same communities, a sign that the barrier is in the way it was spread',
        'That in those three communities there is nobody interested in practising sport formally',
        'That the call was fair, because no community was forbidden from applying in time',
        'That the number of scholarships should be cut until the three communities have a stable service'] },
      correct:0,
      hint:{ es:'Compara dónde se publicó la convocatoria con el lugar donde viven quienes no se enteraron.',
             en:'Compare where the call was published with where the people who never heard of it live.' },
      explanation:{ es:'Nadie prohibió nada, y ese es justamente el punto: la convocatoria era igual para todos y aun así el resultado señala a las mismas tres comunidades, las que no tienen servicio estable. Concluir que ahí nadie quiere hacer deporte inventa una explicación que los datos no sostienen. Reducir becas empeora la situación de todos sin acercar la convocatoria a nadie: lo que falla es el medio por el que se difundió.',
                    en:'Nobody forbade anything, and that is exactly the point: the call was equal for everyone and the outcome still points to the same three communities, the ones without stable service. Concluding that nobody there wants to play sport invents an explanation the figures do not support. Cutting scholarships makes things worse for everyone without bringing the call closer to anyone: what fails is the channel it was spread through.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El plan de la escuela', en:'The school plan' }, showWork:true,
      stmt:{ es:'En una escuela conviven estudiantes de varias comunidades. Se repiten las burlas por la forma de hablar, la mitad de las familias no se entera de las convocatorias porque solo se publican en la puerta de la dirección, y en los actos escolares nunca aparece nada de lo que esas comunidades traen. ¿Qué plan atiende los tres asuntos a la vez?',
             en:'A school has students from several communities. Mockery about the way people speak keeps repeating, half the families never hear about the calls because they are published only on the head office door, and school assemblies never feature anything those communities bring. Which plan addresses all three matters at once?' },
      options:{ es:[
        'Detener y nombrar las burlas con una medida acordada y una fecha de revisión, difundir las convocatorias por donde esas familias sí pasan y dar lugar en los actos a lo que esas comunidades aportan',
        'Dedicar un acto escolar a las culturas del municipio e invitar a las familias de esas comunidades a presenciar la presentación',
        'Publicar un reglamento que prohíba las burlas y aplicar una sanción a quien sea sorprendido haciéndolas durante la jornada',
        'Pedir a las familias de esas comunidades que avisen a la escuela cada vez que ocurra alguno de los tres asuntos señalados'],
        en:[
        'Stop and name the mockery with an agreed measure and a review date, spread the calls where those families actually pass and give the assemblies room for what those communities bring',
        'Devote one school assembly to the cultures of the municipality and invite the families of those communities to watch the presentation',
        'Publish rules banning mockery and sanction whoever is caught doing it during the school day',
        'Ask the families of those communities to notify the school every time any of the three matters occurs'] },
      correct:0,
      hint:{ es:'Revisa uno por uno los tres asuntos y marca cuáles quedan atendidos en cada respuesta y cuáles se quedan igual.',
             en:'Go through the three matters one by one and mark which ones each answer handles and which stay as they were.' },
      explanation:{ es:'El acto único atiende solo la parte de los actos y deja a esas familias como público. El reglamento atiende solo las burlas y sin revisión no se sabe si sirvió. Pedirles que avisen les entrega la vigilancia de un problema que no crearon. El primer plan toca los tres puntos donde están: la burla se detiene con una medida revisable, la convocatoria cambia de medio para que llegue, y los actos pasan de exhibir a incluir lo que esas comunidades aportan.',
                    en:'The one-off assembly handles only the assembly part and leaves those families as an audience. The rules handle only the mockery and with no review nobody knows whether it worked. Asking them to notify hands them the policing of a problem they did not create. The first plan touches all three points where they sit: the mockery is stopped with a reviewable measure, the call changes channel so it arrives, and assemblies move from displaying to including what those communities bring.' } },
    { title:{ es:'El plan de la escuela', en:'The school plan' }, showWork:true,
      stmt:{ es:'En una secundaria, un grupo de estudiantes con discapacidad no puede entrar a la biblioteca del segundo piso, varios compañeros repiten bromas sobre ellos y la escuela responde con una plática anual sobre el respeto. ¿Qué plan atiende los tres asuntos a la vez?',
             en:'At a secondary school, a group of students with disabilities cannot get into the second floor library, several classmates keep repeating jokes about them and the school responds with one yearly talk about respect. Which plan addresses all three matters at once?' },
      options:{ es:[
        'Trasladar o hacer accesible la biblioteca, acordar con el grupo una medida frente a las bromas con fecha de revisión y sostener ese trabajo durante el año en lugar de una sola plática',
        'Repetir la plática sobre el respeto cada mes hasta que las bromas dejen de aparecer en los pasillos de la escuela',
        'Pedir a los estudiantes afectados que avisen cada vez que necesiten un libro que esté en el segundo piso',
        'Colocar en los pasillos carteles con frases sobre la inclusión y sobre el respeto a las diferencias entre las personas'],
        en:[
        'Move or make the library accessible, agree with the group on a measure against the jokes with a review date and sustain that work through the year instead of a single talk',
        'Repeat the respect talk every month until the jokes stop appearing in the school corridors',
        'Ask the affected students to notify staff whenever they need a book that is on the second floor',
        'Put up posters in the corridors with phrases about inclusion and respect for differences between people'] },
      correct:0,
      hint:{ es:'Separa lo que cambia una condición física, lo que cambia el trato en el grupo y lo que solo repite un mensaje.',
             en:'Separate what changes a physical condition, what changes how the group behaves and what merely repeats a message.' },
      explanation:{ es:'La escalera no se resuelve hablando: mientras la biblioteca siga arriba, ese grupo sigue afuera. Repetir la plática o colgar carteles insiste en el mensaje y no cambia ni el acceso ni el trato. Pedirles que avisen deja el acceso a discreción de otros y les añade un trámite. El plan que sirve mueve la condición física, acuerda una medida sobre las bromas y fija cuándo se revisa, porque sin revisión nadie sabe si algo cambió.',
                    en:'The staircase is not solved by talking: while the library stays upstairs, that group stays outside. Repeating the talk or hanging posters insists on the message and changes neither access nor treatment. Asking them to notify staff leaves access at the discretion of others and adds paperwork for them. The plan that works moves the physical condition, agrees a measure about the jokes and sets when it gets reviewed, because with no review nobody knows whether anything changed.' } }
  ], rng), rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Interculturalidad e Igualdad Sustantiva';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
