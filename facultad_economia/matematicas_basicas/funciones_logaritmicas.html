<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funciones Logarítmicas · Matemáticas Básicas · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/matematicas_basicas/mat_logaritmos.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.iw-expr { font-family:'IBM Plex Mono',monospace; font-size:1rem; text-align:center; padding:.75rem .6rem; background:var(--surface2); border-radius:8px; margin:.5rem 0; color:var(--text); word-break:break-word; }
.iw-expr .ec { color:var(--green-dark); font-weight:600; }
.iw-expr .ev { color:var(--gold); font-weight:600; }
.iw-note { font-size:.74rem; color:var(--text3); text-align:center; margin-top:-.2rem; margin-bottom:.5rem; }

/* ── COORDINATE PLANE ── */
.plane { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:.35rem; margin:.55rem 0 .2rem; }
.plane svg { display:block; width:100%; height:auto; }
.plane text { font-family:'IBM Plex Mono',monospace; }
.plegend { display:flex; flex-wrap:wrap; gap:.9rem; justify-content:center; font-size:.72rem; color:var(--text3); margin-bottom:.4rem; }
.plegend span i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:.3rem; font-style:normal; }
.lg-in  { background:var(--green); }
.lg-out { background:var(--gold); }
.verdict { text-align:center; font-size:.84rem; font-weight:600; margin-top:.5rem; }
.v-ok  { color:var(--ok); }
.v-bad { color:var(--bad); }

/* ── CHIPS AND TABS ── */
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .iw-expr { font-size: .86rem; }
  .plegend { gap: .5rem; font-size: .68rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:var(--green);line-height:1">ALEXIS</div>
    </div>
    </div>
    <div class="wtitle" id="wtitle-el">Funciones Logarítmicas</div>
    <div class="wcourse" id="wcourse-el">Matemáticas Básicas</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Funciones Logarítmicas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>

/* ════════════════════════════════════════════════════════════════════════
   ATTEMPT COUNTER + SEEDED RNG
   Fresh numbers on every fresh start; a restored session reuses the seed.
   ════════════════════════════════════════════════════════════════════════ */
function getAttemptKey(name, group) {
  return 'fac_econ_mat__mat_logaritmos__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned.
   The key is always the value handed in first. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

/* ════════════════════════════════════════════════════════════════════════
   NUMBER AND EXPRESSION HELPERS
   ════════════════════════════════════════════════════════════════════════ */
function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 100) / 100).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { var r = Math.round(v); return (r < 0 ? '−$' : '$') + nf(Math.abs(r)); }
function money1(v) { return (v < 0 ? '−$' : '$') + nfD(Math.abs(v), 1); }
function intN(x)   { return nf(Math.round(x)); }
function dec1(x)   { return nfD(x, 1); }
function frac(a, b) {
  return '<span class="mf-outer"><span class="mf-num">' + a + '</span><span class="mf-den">' + b + '</span></span>';
}
/* Writes a term with its sign, so a negative term is always a subtraction. */
function term(coef, varName) {
  if (coef === 0) return '';
  var sign = coef > 0 ? ' + ' : ' − ';
  var abs  = Math.abs(coef);
  return sign + ((abs === 1 && varName) ? '' : intN(abs)) + (varName || '');
}
function headTerm(coef, varName) {
  if (coef === 0) return '';
  var abs = Math.abs(coef);
  return (coef < 0 ? '−' : '') + ((abs === 1 && varName) ? '' : intN(abs)) + (varName || '');
}

/* ════════════════════════════════════════════════════════════════════════
   SESSION PERSISTENCE

function lsKey() {
  var n = (studentData.name || '').trim(), g = (studentData.group || '').trim();
  return 'fac_econ_mat__mat_logaritmos__' + (n + '__' + g).replace(/\s+/g, '_');

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);

    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}
function loadSession(name, group) {
  var key = 'fac_econ_mat__mat_logaritmos__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function dismissRestore() { document.getElementById('restoreBar').style.display = 'none'; }
function checkForSavedSession() {

}
function observeSections() {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

/* ════════════════════════════════════════════════════════════════════════
   START / RESTORE
   ════════════════════════════════════════════════════════════════════════ */
function startLesson() {

}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);

  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;

    if (choice !== null && choice !== undefined) confirmMC(idx, choice);

    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {

    });

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS
   ════════════════════════════════════════════════════════════════════════ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.exp;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.exp;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

   SECTION REGISTRY  (concept text is re-rendered on language switch)

function addSection(fn) {

  d.innerHTML = fn(LANG);
  document.getElementById('lessonBody').appendChild(d);

function applySectionLang() {

/* ════════════════════════════════════════════════════════════════════════
   ITEM ASSEMBLY
   Each item keeps both languages in i18n. The student always reads one of
   them: q, opts, hint and exp hold the active language and are the only
   fields the cards and the PDF ever touch.
   The runtime gate dumps questionText, options and explanation for external
   review, so those three carry both versions tagged ES and EN. They are an
   audit surface, never rendered anywhere in the guide.
   ════════════════════════════════════════════════════════════════════════ */
function bothTxt(o) {
  return (o.es === o.en) ? o.es : ('[ES] ' + o.es + '\n[EN] ' + o.en);
}
function bothOpts(o) {
  return o.es.map(function(s, i) {
    return (s === o.en[i]) ? s : ('[ES] ' + s + '   [EN] ' + o.en[i]);
  });
}
function mk(i18n, correctIdx, showWork) {
  return {
    i18n: i18n, correctIdx: correctIdx, showWork: showWork,
    title: i18n.title[LANG],
    q:     i18n.q[LANG],
    hint:  i18n.hint[LANG],
    exp:   i18n.exp[LANG],
    opts:  i18n.opts[LANG].slice(),
    questionText: bothTxt(i18n.q),
    explanation:  bothTxt(i18n.exp),
    options:      bothOpts(i18n.opts)
  };
}
function addItem(i18n, correctIdx, showWork) {
  var d = mk(i18n, correctIdx, showWork);
  problems.push({
    i18n: d.i18n, title: d.title, q: d.q, hint: d.hint, exp: d.exp, opts: d.opts,
    questionText: d.questionText, options: d.options, explanation: d.explanation,
    correctIdx: d.correctIdx, showWork: d.showWork,
    studentChoice: null, pendingChoice: null
  });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}

/* ════════════════════════════════════════════════════════════════════════
   PLANE PRIMITIVES
   The three tools draw on the same kind of plane, so the axes, the grid and
   the scale always look alike and the student reads one picture, not three.
   Colours come from the CSS tokens, so the plane follows the theme.
   ════════════════════════════════════════════════════════════════════════ */
var SVW = 340, SVH = 232, SVL = 42, SVR = 12, SVT = 14, SVB = 30;
function mapX(x, xmin, xmax) { return SVL + (x - xmin) / (xmax - xmin) * (SVW - SVL - SVR); }
function mapY(y, ymin, ymax) { return (SVH - SVB) - (y - ymin) / (ymax - ymin) * (SVH - SVB - SVT); }
function svgNum(v) { return (Math.round(v * 10) / 10).toString(); }
function svgOpen() {
  return '<svg viewBox="0 0 ' + SVW + ' ' + SVH + '" xmlns="http://www.w3.org/2000/svg" role="img">';
}
function gridSvg(xmin, xmax, ymin, ymax, xlab, ylab, xticks, yticks) {
  var s = '', i, gx, gy;
  for (i = 0; i <= 4; i++) {
    gx = xmin + (xmax - xmin) * i / 4;
    s += '<line x1="' + svgNum(mapX(gx, xmin, xmax)) + '" y1="' + SVT + '" x2="' + svgNum(mapX(gx, xmin, xmax)) + '" y2="' + (SVH - SVB) + '" stroke="var(--border)" stroke-width="0.6"/>';
    gy = ymin + (ymax - ymin) * i / 4;
    s += '<line x1="' + SVL + '" y1="' + svgNum(mapY(gy, ymin, ymax)) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(mapY(gy, ymin, ymax)) + '" stroke="var(--border)" stroke-width="0.6"/>';
  }
  var y0 = mapY(Math.max(ymin, Math.min(ymax, 0)), ymin, ymax);
  var x0 = mapX(Math.max(xmin, Math.min(xmax, 0)), xmin, xmax);
  s += '<line x1="' + SVL + '" y1="' + svgNum(y0) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(y0) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  s += '<line x1="' + svgNum(x0) + '" y1="' + SVT + '" x2="' + svgNum(x0) + '" y2="' + (SVH - SVB) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  for (i = 0; i < xticks.length; i++) {
    s += '<text x="' + svgNum(mapX(xticks[i].v, xmin, xmax)) + '" y="' + (SVH - SVB + 12) + '" font-size="8" fill="var(--text3)" text-anchor="middle">' + xticks[i].t + '</text>';
  }
  for (i = 0; i < yticks.length; i++) {
    s += '<text x="' + (SVL - 4) + '" y="' + svgNum(mapY(yticks[i].v, ymin, ymax) + 3) + '" font-size="8" fill="var(--text3)" text-anchor="end">' + yticks[i].t + '</text>';
  }
  s += '<text x="' + (SVW - SVR) + '" y="' + (SVH - 4) + '" font-size="8.5" fill="var(--text2)" text-anchor="end">' + xlab + '</text>';
  s += '<text x="2" y="10" font-size="8.5" fill="var(--text2)" text-anchor="start">' + ylab + '</text>';
  return s;
}
/* Returns the piece of the line y = b + m x that actually fits inside the
   drawing box, so a steep line never spills over the axes. */
function clipSeg(m, b, xmin, xmax, ymin, ymax) {
  var lo = xmin, hi = xmax;
  if (m !== 0) {
    var xa = (ymin - b) / m, xb = (ymax - b) / m;
    lo = Math.max(lo, Math.min(xa, xb));
    hi = Math.min(hi, Math.max(xa, xb));
  } else if (b < ymin || b > ymax) { return null; }
  if (hi - lo < 1e-9) return null;
  return [lo, b + m * lo, hi, b + m * hi];
}
function lineSvg(m, b, xmin, xmax, ymin, ymax, color, width) {
  var g = clipSeg(m, b, xmin, xmax, ymin, ymax);
  if (!g) return '';
  return '<line x1="' + svgNum(mapX(g[0], xmin, xmax)) + '" y1="' + svgNum(mapY(g[1], ymin, ymax)) +
         '" x2="' + svgNum(mapX(g[2], xmin, xmax)) + '" y2="' + svgNum(mapY(g[3], ymin, ymax)) +
         '" stroke="' + color + '" stroke-width="' + width + '"/>';
}

/* ════════════════════════════════════════════════════════════════════════
   CURVE PRIMITIVE
   Una curva se dibuja por muestreo y se corta en los bordes del cuadro,
   de modo que la parte que se sale por abajo no ensucia el eje.
   ════════════════════════════════════════════════════════════════════════ */
function curveSvg(f, xmin, xmax, ymin, ymax, color, width) {
  var N = 96, run = [], segs = [], i, x, y;
  for (i = 0; i <= N; i++) {
    x = xmin + (xmax - xmin) * i / N;
    y = f(x);
    if (isFinite(y) && y >= ymin && y <= ymax) {
      run.push(svgNum(mapX(x, xmin, xmax)) + ',' + svgNum(mapY(y, ymin, ymax)));
    } else {
      if (run.length > 1) segs.push(run);
      run = [];
    }
  }
  if (run.length > 1) segs.push(run);
  return segs.map(function(p) {
    return '<polyline points="' + p.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="' + width + '"/>';
  }).join('');
}
function dotSvg(x, y, xmin, xmax, ymin, ymax, color, r) {
  if (!(x >= xmin && x <= xmax && y >= ymin && y <= ymax)) return '';
  return '<circle cx="' + svgNum(mapX(x, xmin, xmax)) + '" cy="' + svgNum(mapY(y, ymin, ymax)) +
         '" r="' + r + '" fill="' + color + '"/>';
}
function vlineSvg(x, xmin, xmax, ymin, ymax, color) {
  if (!(x >= xmin && x <= xmax)) return '';
  return '<line x1="' + svgNum(mapX(x, xmin, xmax)) + '" y1="' + SVT +
         '" x2="' + svgNum(mapX(x, xmin, xmax)) + '" y2="' + (SVH - SVB) +
         '" stroke="' + color + '" stroke-width="1" stroke-dasharray="3 3"/>';
}
function roundUpTo(v, step) { return Math.ceil(v / step) * step; }

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · el logaritmo cuenta los periodos
   El alumno mueve la tasa y el objetivo y ve el punto donde la curva de
   crecimiento cruza la meta. Al mover el capital inicial descubre que el
   plazo no se mueve, porque el logaritmo lee un factor, no un monto.
   ════════════════════════════════════════════════════════════════════════ */
function widgetPlazo(P0, i0, m0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { P: P0, i: i0, m: m0 };
  var XMIN = 0, XMAX = 30;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var f     = 1 + state.i / 100;
    var mult  = state.m / 10;
    var meta  = state.P * mult;
    var exact = Math.log(mult) / Math.log(f);
    var full  = Math.ceil(exact);
    var prev  = state.P * Math.pow(f, full - 1);
    var reach = state.P * Math.pow(f, full);
    var YMIN  = 0;
    var YMAX  = roundUpTo(meta * 1.3, 100000);
    var xt = [{ v: 0, t: '0' }, { v: 10, t: '10' }, { v: 20, t: '20' }, { v: 30, t: '30' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: dec1(YMAX / 2000000) + ' M' }, { v: YMAX, t: dec1(YMAX / 1000000) + ' M' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'años transcurridos' : 'years elapsed',
      es ? 'saldo, $' : 'balance, $', xt, yt);
    inner += lineSvg(0, meta, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '1.6');
    inner += curveSvg(function(x) { return state.P * Math.pow(f, x); }, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    inner += vlineSvg(exact, XMIN, XMAX, YMIN, YMAX, 'var(--text3)');
    inner += dotSvg(exact, meta, XMIN, XMAX, YMIN, YMAX, 'var(--text)', '4.5');
    set('#w1svg', svgOpen() + inner + '</svg>');

    set('#w1il', intN(state.i) + '%');
    set('#w1ml', dec1(mult) + (es ? ' veces' : ' times'));
    set('#w1pl', money(state.P));
    set('#w1exact', dec1(exact) + (es ? ' años' : ' years'));
    set('#w1full', intN(full) + (es ? ' años' : ' years'));
    set('#w1saldo', money(reach));
    set('#w1eq', (es ? 'un factor de ' : 'a factor of ') + '<span class="ec">' + dec1(mult) + '</span>' +
      '<span style="color:var(--text3)">' + (es ? ' al ' : ' at ') + '</span>' +
      '<span class="ev">' + intN(state.i) + (es ? '% anual' : '% a year') + '</span>');

    var vd = host.querySelector('#w1verd');
    if (vd) {
      if (exact > 30) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Con esa tasa la meta queda fuera del horizonte de 30 años que muestra la gráfica.'
                            : 'At that rate the target falls outside the 30 year horizon the chart shows.';
      } else if (full - exact < 0.15) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'El cruce cae casi justo en un aniversario: el año completo alcanza la meta por muy poco.'
                            : 'The crossing lands almost exactly on an anniversary: the full year clears the target by very little.';
      } else {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'El cruce cae a media anualidad, así que hay que esperar al siguiente aniversario para cobrar el interés.'
                            : 'The crossing lands mid year, so you must wait for the next anniversary before the interest is credited.';
      }
    }

    set('#w1read', es
      ? '<strong>Lectura de negocio:</strong> con ' + intN(state.i) + '% anual el saldo alcanza ' + dec1(mult) + ' veces el capital a los ' + dec1(exact) + ' años. Como el banco abona el interés una vez al año, al cumplirse ' + intN(full - 1) + ' años el fondo apenas lleva ' + money(prev) + ' y todavía no llega, y hasta el año ' + intN(full) + ' llega a ' + money(reach) + '. Ahora mueve el capital inicial de lado a lado y vigila el plazo: no se mueve un solo año. El logaritmo no lee montos, lee el factor por el que hay que multiplicar, y ese factor es el mismo tanto si el fondo empieza con cien mil como si empieza con un millón.'
      : '<strong>Business reading:</strong> at ' + intN(state.i) + '% a year the balance reaches ' + dec1(mult) + ' times the capital after ' + dec1(exact) + ' years. Since the bank credits interest once a year, at ' + intN(full - 1) + ' years the fund holds only ' + money(prev) + ' and has not arrived yet, and only in year ' + intN(full) + ' does it reach ' + money(reach) + '. Now slide the starting capital from side to side and watch the term: it does not move by a single year. The logarithm does not read amounts, it reads the factor you must multiply by, and that factor is the same whether the fund starts with a hundred thousand or with a million.');
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="logaritmo-como-plazo">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El logaritmo lee el plazo' : 'The logarithm reads the term') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La curva verde es el saldo del fondo de reserva y la línea dorada es la meta que fijó la dirección. El punto negro marca el instante exacto en que el saldo alcanza la meta, y ese instante es lo que devuelve un logaritmo. Mueve la tasa y observa cómo se corre el cruce. Después mueve el múltiplo objetivo. Y al final mueve el capital inicial de un extremo al otro sin tocar nada más: fíjate en el plazo mientras lo haces, porque lo que ocurre ahí es el punto entero de esta herramienta.'
          : 'The green curve is the balance of the reserve fund and the golden line is the target set by management. The black dot marks the exact moment the balance reaches the target, and that moment is what a logarithm returns. Move the rate and watch the crossing travel. Then move the target multiple. And finally slide the starting capital from one end to the other without touching anything else: keep your eye on the term while you do, because what happens there is the whole point of this tool.') + '</div>' +
        '<div class="iw-expr" id="w1eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'saldo del fondo' : 'fund balance') + '</span><span><i class="lg-out"></i>' + (es ? 'meta de la dirección' : 'management target') + '</span></div>' +
        '<div class="plane" id="w1svg"></div>' +
        '<div class="verdict" id="w1verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Tasa anual' : 'Annual rate') + ': <span class="cval" id="w1il"></span></label>' +
          '<input type="range" min="3" max="20" step="1" id="w1i" value="' + state.i + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Múltiplo que se busca' : 'Target multiple') + ': <span class="cval" id="w1ml"></span></label>' +
          '<input type="range" min="15" max="50" step="5" id="w1m" value="' + state.m + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Capital inicial' : 'Starting capital') + ': <span class="cval" id="w1pl"></span></label>' +
          '<input type="range" min="100000" max="900000" step="50000" id="w1p" value="' + state.P + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Plazo exacto' : 'Exact term') + '</div><div class="mnum cs" id="w1exact"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Años completos' : 'Full years') + '</div><div class="mnum ps" id="w1full"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Saldo al cumplirlos' : 'Balance once reached') + '</div><div class="mnum ts" id="w1saldo"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w1read"></div>' +
      '</div>';
    var si = host.querySelector('#w1i'), sm = host.querySelector('#w1m'), sp = host.querySelector('#w1p');
    si.addEventListener('input', function() { state.i = parseInt(si.value, 10); render(); });
    sm.addEventListener('input', function() { state.m = parseInt(sm.value, 10); render(); });
    sp.addEventListener('input', function() { state.P = parseInt(sp.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · el producto se vuelve suma
   Dos años de crecimiento se multiplican entre si, pero sus logaritmos se
   suman. Las barras muestran esa suma y el panel de abajo desmonta el error
   de aplicar la misma idea a una suma de cantidades.
   ════════════════════════════════════════════════════════════════════════ */
function widgetLeyes(a0, b0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { a: a0, b: b0 };

  function log10(x) { return Math.log(x) / Math.LN10; }

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var f1 = 1 + state.a / 100;
    var f2 = 1 + state.b / 100;
    var fp = f1 * f2;
    var l1 = log10(f1), l2 = log10(f2), lp = log10(fp);
    var lsum = log10(f1 + f2);
    var esc = Math.max(lp, 0.0001);
    var w1p = Math.max(2, Math.round(l1 / esc * 96));
    var w2p = Math.max(2, Math.round(l2 / esc * 96));
    var wtp = 96;

    set('#w2f1', dec1(state.a) + '%');
    set('#w2f2', dec1(state.b) + '%');
    set('#w2acum', nfD(fp, 4));
    set('#w2suma', nfD(l1 + l2, 4));
    set('#w2logp', nfD(lp, 4));
    set('#w2eq', '<span class="ec">' + nfD(l1, 4) + '</span>' +
      '<span style="color:var(--text3)"> + </span>' +
      '<span class="ec">' + nfD(l2, 4) + '</span>' +
      '<span style="color:var(--text3)">' + (es ? ' da ' : ' gives ') + '</span>' +
      '<span class="ev">' + nfD(lp, 4) + '</span>');

    set('#w2bars',
      '<div style="display:flex;align-items:center;gap:.5rem;margin:.35rem 0">' +
        '<span style="font-size:.7rem;color:var(--text3);width:104px;flex-shrink:0">' + (es ? 'año 1' : 'year 1') + '</span>' +
        '<span style="height:13px;border-radius:7px;background:var(--green);width:' + w1p + '%"></span>' +
        '<span style="font-size:.7rem;color:var(--text2)">' + nfD(l1, 4) + '</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:.5rem;margin:.35rem 0">' +
        '<span style="font-size:.7rem;color:var(--text3);width:104px;flex-shrink:0">' + (es ? 'año 2' : 'year 2') + '</span>' +
        '<span style="height:13px;border-radius:7px;background:var(--green);width:' + w2p + '%"></span>' +
        '<span style="font-size:.7rem;color:var(--text2)">' + nfD(l2, 4) + '</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:.5rem;margin:.35rem 0">' +
        '<span style="font-size:.7rem;color:var(--text3);width:104px;flex-shrink:0">' + (es ? 'los dos juntos' : 'both together') + '</span>' +
        '<span style="height:13px;border-radius:7px;background:var(--gold);width:' + wtp + '%"></span>' +
        '<span style="font-size:.7rem;color:var(--text2)">' + nfD(lp, 4) + '</span>' +
      '</div>');

    var vd = host.querySelector('#w2verd');
    if (vd) {
      vd.className = 'verdict v-ok';
      vd.textContent = es ? 'Las dos barras verdes juntas miden exactamente lo mismo que la barra dorada.'
                          : 'The two green bars together measure exactly the same as the golden bar.';
    }

    set('#w2trap', es
      ? '<strong>El error que hay que evitar:</strong> si en vez del producto de los factores se suman los factores, el resultado es ' + nfD(f1 + f2, 4) + ' y su logaritmo vale ' + nfD(lsum, 4) + ', que no tiene ninguna relación con ' + nfD(l1 + l2, 4) + '. El logaritmo convierte un producto en una suma, nunca una suma en otra suma.'
      : '<strong>The mistake to avoid:</strong> if the factors are added instead of multiplied, the result is ' + nfD(f1 + f2, 4) + ' and its logarithm is ' + nfD(lsum, 4) + ', which bears no relation to ' + nfD(l1 + l2, 4) + '. A logarithm turns a product into a sum, never a sum into another sum.');

    set('#w2read', es
      ? '<strong>Lectura de negocio:</strong> dos años seguidos de ' + dec1(state.a) + '% y ' + dec1(state.b) + '% dejan un factor acumulado de ' + nfD(fp, 4) + ', es decir un crecimiento total de ' + dec1((fp - 1) * 100) + '% y no la suma de los dos porcentajes. Los porcentajes no se suman, pero sus logaritmos sí. Por eso un analista que trabaja con cadenas largas de crecimiento suma logaritmos en lugar de multiplicar factores: el logaritmo de un producto largo es la suma de los logaritmos, y el logaritmo de un mismo factor repetido n veces es n veces su logaritmo. Esa última propiedad es la que permite despejar un exponente, que es justo lo que hace falta cuando la incógnita es el número de periodos.'
      : '<strong>Business reading:</strong> two consecutive years of ' + dec1(state.a) + '% and ' + dec1(state.b) + '% leave a cumulative factor of ' + nfD(fp, 4) + ', that is total growth of ' + dec1((fp - 1) * 100) + '% rather than the sum of the two percentages. Percentages do not add up, but their logarithms do. That is why an analyst working with long chains of growth adds logarithms instead of multiplying factors: the logarithm of a long product is the sum of the logarithms, and the logarithm of one factor repeated n times is n times its logarithm. That last property is the one that frees an exponent, which is exactly what you need when the unknown is the number of periods.');
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="leyes-de-logaritmos">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Un producto que se vuelve suma' : 'A product that turns into a sum') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Cítricos Tecomán creció un porcentaje el primer año y otro distinto el segundo. Los dos factores se multiplican, pero mira lo que pasa con sus logaritmos: las barras verdes son los logaritmos de cada año y la dorada es el logaritmo del factor acumulado. Mueve los dos porcentajes y comprueba que las verdes siempre completan a la dorada, sin importar qué valores elijas. Lee después el recuadro inferior, que muestra el error más común con esta propiedad.'
          : 'Cítricos Tecomán grew by one percentage in the first year and by a different one in the second. The two factors multiply, but watch what happens to their logarithms: the green bars are the logarithm of each year and the golden one is the logarithm of the cumulative factor. Move both percentages and check that the green bars always fill the golden one exactly, whatever values you choose. Then read the panel below, which shows the most common mistake made with this property.') + '</div>' +
        '<div class="iw-expr" id="w2eq"></div>' +
        '<div id="w2bars"></div>' +
        '<div class="verdict" id="w2verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Crecimiento del primer año' : 'Growth in the first year') + ': <span class="cval" id="w2f1"></span></label>' +
          '<input type="range" min="2" max="60" step="1" id="w2a" value="' + state.a + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Crecimiento del segundo año' : 'Growth in the second year') + ': <span class="cval" id="w2f2"></span></label>' +
          '<input type="range" min="2" max="60" step="1" id="w2b" value="' + state.b + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Factor acumulado' : 'Cumulative factor') + '</div><div class="mnum cs" id="w2acum"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Suma de logaritmos' : 'Sum of logarithms') + '</div><div class="mnum ps" id="w2suma"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Logaritmo del producto' : 'Logarithm of the product') + '</div><div class="mnum ts" id="w2logp"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w2trap"></div>' +
        '<div class="iw-read" id="w2read"></div>' +
      '</div>';
    var sa = host.querySelector('#w2a'), sb = host.querySelector('#w2b');
    sa.addEventListener('input', function() { state.a = parseInt(sa.value, 10); render(); });
    sb.addEventListener('input', function() { state.b = parseInt(sb.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · la escala logaritmica
   Dos divisiones crecen de forma distinta: una a un porcentaje fijo y otra
   a una cantidad fija de pesos. En escala lineal las dos suben; solo en
   escala logaritmica se distingue cual mantiene su ritmo.
   ════════════════════════════════════════════════════════════════════════ */
function widgetEscala(V0, g0, B0, addB) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { g: g0, add: addB, mode: 'lin' };
  var XMIN = 0, XMAX = 8;

  function log10(x) { return Math.log(x) / Math.LN10; }

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var isLog = state.mode === 'log';
    var fa = function(x) { return V0 * Math.pow(1 + state.g / 100, x); };
    var fb = function(x) { return B0 + state.add * x; };
    var maxv = Math.max(fa(XMAX), fb(XMAX));
    var minv = Math.min(V0, B0);
    var YMIN = isLog ? log10(minv * 0.75) : 0;
    var YMAX = isLog ? log10(maxv * 1.25) : roundUpTo(maxv * 1.12, 1000000);
    var ga = function(x) { return isLog ? log10(fa(x)) : fa(x); };
    var gb = function(x) { return isLog ? log10(fb(x)) : fb(x); };
    var xt = [{ v: 0, t: '0' }, { v: 2, t: '2' }, { v: 4, t: '4' }, { v: 6, t: '6' }, { v: 8, t: '8' }];
    var yt = isLog
      ? [{ v: YMIN, t: dec1(Math.pow(10, YMIN) / 1000000) + ' M' },
         { v: (YMIN + YMAX) / 2, t: dec1(Math.pow(10, (YMIN + YMAX) / 2) / 1000000) + ' M' },
         { v: YMAX, t: dec1(Math.pow(10, YMAX) / 1000000) + ' M' }]
      : [{ v: 0, t: '0' },
         { v: YMAX / 2, t: dec1(YMAX / 2000000) + ' M' },
         { v: YMAX, t: dec1(YMAX / 1000000) + ' M' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'años' : 'years',
      es ? 'ventas anuales, $' : 'annual sales, $', xt, yt);
    inner += curveSvg(ga, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    inner += curveSvg(gb, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '2.4');
    set('#w3svg', svgOpen() + inner + '</svg>');

    var a1 = fa(1) - fa(0);
    var a8 = fa(XMAX) - fa(XMAX - 1);
    var b1 = (fb(1) / fb(0) - 1) * 100;
    var b8 = (fb(XMAX) / fb(XMAX - 1) - 1) * 100;

    set('#w3gl', dec1(state.g) + '%');
    set('#w3al', money(state.add));
    set('#w3exp', money(fa(XMAX)));
    set('#w3lin', money(fb(XMAX)));
    set('#w3ritmo', dec1(b8) + '%');
    set('#w3eq', '<span class="ec">' + (es ? 'exportación' : 'exports') + ' ' + dec1(state.g) + (es ? '% anual' : '% a year') + '</span>' +
      '<span style="color:var(--text3)"> · </span>' +
      '<span class="ev">' + (es ? 'mercado local' : 'domestic market') + ' ' + money(state.add) + (es ? ' más cada año' : ' more each year') + '</span>');

    var vd = host.querySelector('#w3verd');
    if (vd) {
      if (isLog) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'En esta escala la exportación es una recta y el mercado local se va aplanando: la recta delata el ritmo constante.'
                            : 'On this scale exports form a straight line while the domestic market flattens out: the straight line reveals the constant pace.';
      } else {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'En esta escala las dos curvas suben y cuesta decir cuál conserva su ritmo: la vista se va al tamaño, no a la velocidad.'
                            : 'On this scale both curves rise and it is hard to tell which keeps its pace: the eye follows size, not speed.';
      }
    }

    set('#w3read', isLog
      ? (es
        ? '<strong>Lectura de negocio:</strong> la escala logarítmica no dibuja el monto sino su logaritmo, así que distancias iguales representan multiplicaciones iguales. Por eso la exportación, que crece ' + dec1(state.g) + '% cada año, se ve como una recta perfecta: cada año multiplica por el mismo factor. El mercado local suma ' + money(state.add) + ' cada año, siempre la misma cantidad de pesos, y por eso su curva se aplana: ese aumento fijo representa ' + dec1(b1) + '% el primer año y apenas ' + dec1(b8) + '% el último. En un tablero directivo esta es la diferencia entre un negocio que conserva su ritmo y uno que crece cada vez más despacio aunque nunca deje de subir.'
        : '<strong>Business reading:</strong> a logarithmic scale plots not the amount but its logarithm, so equal distances stand for equal multiplications. That is why exports, growing ' + dec1(state.g) + '% every year, show up as a perfectly straight line: each year multiplies by the same factor. The domestic market adds ' + money(state.add) + ' a year, always the same amount of pesos, and that is why its curve flattens: the fixed increase is ' + dec1(b1) + '% in the first year and barely ' + dec1(b8) + '% in the last. On a management dashboard this is the difference between a business that holds its pace and one that grows more slowly every year while never ceasing to rise.')
      : (es
        ? '<strong>Lectura de negocio:</strong> en escala lineal las dos series suben y el ojo compara tamaños. La exportación pasa de ' + money(V0) + ' a ' + money(fa(XMAX)) + ' y el mercado local llega a ' + money(fb(XMAX)) + ', pero el gráfico no dice cuál de las dos conserva su velocidad. Fíjate en un dato que la escala lineal esconde: la exportación ganó ' + money(a1) + ' en su primer año y ' + money(a8) + ' en el último, y aun así su ritmo porcentual no cambió ni un punto. Cambia a escala logarítmica para ver esa historia dibujada.'
        : '<strong>Business reading:</strong> on a linear scale both series rise and the eye compares sizes. Exports go from ' + money(V0) + ' to ' + money(fa(XMAX)) + ' and the domestic market reaches ' + money(fb(XMAX)) + ', yet the chart says nothing about which of the two keeps its speed. Look at a figure the linear scale hides: exports gained ' + money(a1) + ' in their first year and ' + money(a8) + ' in the last, and even so their percentage pace did not shift by a single point. Switch to the logarithmic scale to see that story drawn.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="escala-logaritmica">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Lo que revela la escala logarítmica' : 'What the logarithmic scale reveals') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Las dos series son reales en cualquier empresa: la exportación crece a un porcentaje fijo y el mercado local suma la misma cantidad de pesos cada año. Míralas primero en escala lineal y trata de decidir cuál de las dos conserva mejor su ritmo. Cambia después a escala logarítmica, donde el eje vertical mide logaritmos y no pesos, y observa cuál de las dos se convierte en una recta. Mueve los dos controles para comprobar que la forma no depende de los números elegidos.'
          : 'Both series are real in any firm: exports grow at a fixed percentage and the domestic market adds the same amount of pesos every year. Look at them first on a linear scale and try to decide which of the two better holds its pace. Then switch to the logarithmic scale, where the vertical axis measures logarithms rather than pesos, and see which one becomes a straight line. Move both controls to check that the shape does not depend on the numbers you pick.') + '</div>' +
        '<div class="mtabs">' +
          '<button class="mtab' + (state.mode === 'lin' ? ' active' : '') + '" data-m="lin">' + (es ? 'Escala lineal' : 'Linear scale') + '</button>' +
          '<button class="mtab' + (state.mode === 'log' ? ' active' : '') + '" data-m="log">' + (es ? 'Escala logarítmica' : 'Logarithmic scale') + '</button>' +
        '</div>' +
        '<div class="iw-expr" id="w3eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'exportación' : 'exports') + '</span><span><i class="lg-out"></i>' + (es ? 'mercado local' : 'domestic market') + '</span></div>' +
        '<div class="plane" id="w3svg"></div>' +
        '<div class="verdict" id="w3verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Ritmo anual de la exportación' : 'Annual pace of exports') + ': <span class="cval" id="w3gl"></span></label>' +
          '<input type="range" min="4" max="24" step="1" id="w3g" value="' + state.g + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Aumento fijo del mercado local' : 'Fixed increase of the domestic market') + ': <span class="cval" id="w3al"></span></label>' +
          '<input type="range" min="200000" max="1400000" step="100000" id="w3a" value="' + state.add + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Exportación al año 8' : 'Exports at year 8') + '</div><div class="mnum cs" id="w3exp"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Mercado local al año 8' : 'Domestic market at year 8') + '</div><div class="mnum ps" id="w3lin"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ritmo local del último año' : 'Domestic pace in the last year') + '</div><div class="mnum ts" id="w3ritmo"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() { state.mode = b.getAttribute('data-m'); mount(); });
    });
    var sg = host.querySelector('#w3g'), sa = host.querySelector('#w3a');
    sg.addEventListener('input', function() { state.g = parseInt(sg.value, 10); render(); });
    sa.addEventListener('input', function() { state.add = parseInt(sa.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   BUILD LESSON · concepto, herramienta, reactivos, y otra vez
   Todos los numeros salen del rng sembrado, de modo que dos alumnos nunca
   comparten una sola cifra y un mismo alumno nunca repite un intento.
   La guia entera sigue a un negocio: Citricos Tecoman, una empacadora de
   limon de Tecoman que exporta y vende en el mercado local de Colima.
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];
  document.getElementById('lessonBody').innerHTML = '';

  function log10(x) { return Math.log(x) / Math.LN10; }

  /* ── Concepto 1 · el logaritmo responde por el tiempo ── */
  var c1P = pick([400000, 500000, 600000], rng);
  var c1i = pick([8, 9, 10, 12], rng);
  var c1m = pick([2, 3], rng);
  var c1f = 1 + c1i / 100;
  var c1T = c1P * c1m;
  var c1e = Math.log(c1m) / Math.log(c1f);
  var c1n = Math.ceil(c1e);
  var c1v1 = c1P * Math.pow(c1f, c1n - 1);
  var c1v2 = c1P * Math.pow(c1f, c1n);
  var c1s = Math.ceil((c1m - 1) / (c1i / 100));

  var w1P = pick([300000, 400000, 500000], rng);
  var w1i = pick([6, 8, 10, 12], rng);
  var w1m = pick([20, 25, 30], rng);

  /* ── Reactivo 1 · la mitad del plazo de duplicacion ── */
  var p1i  = pick([6, 8, 9, 10], rng);
  var p1f  = 1 + p1i / 100;
  var p1T2 = Math.log(2) / Math.log(p1f);
  var p1T15 = Math.log(1.5) / Math.log(p1f);
  var p1half = p1T2 / 2;
  var p1share = p1T15 / p1T2 * 100;

  /* ── Reactivo 2 · cuantos años hasta la meta ── */
  var p2P = pick([350000, 480000, 520000, 640000], rng);
  var p2i = pick([7, 8, 9, 11], rng);
  var p2m = pick([2, 2.5, 3], rng);
  var p2T = Math.round(p2P * p2m / 1000) * 1000;
  var p2f = 1 + p2i / 100;
  var p2e = Math.log(p2T / p2P) / Math.log(p2f);
  var p2n = Math.ceil(p2e);
  var p2v1 = p2P * Math.pow(p2f, p2n - 1);
  var p2v2 = p2P * Math.pow(p2f, p2n);
  var p2s = Math.ceil((p2T / p2P - 1) / (p2i / 100));

  /* ── Concepto 2 · las leyes del logaritmo ── */
  var c2a = pick([12, 18, 24], rng);
  var c2b = pick([8, 15, 30], rng);
  var c2fa = 1 + c2a / 100;
  var c2fb = 1 + c2b / 100;
  var c2fp = c2fa * c2fb;
  var c2la = log10(c2fa), c2lb = log10(c2fb), c2lp = log10(c2fp);
  var c2g = pick([6, 7, 8], rng);
  var c2fg = 1 + c2g / 100;
  var c2F = pick([2.5, 3, 4], rng);
  var c2e = log10(c2F) / log10(c2fg);
  var c2n = Math.ceil(c2e);

  var w2a = pick([15, 20, 25], rng);
  var w2b = pick([8, 12, 30], rng);

  /* ── Reactivo 3 · la tasa anual implicita ── */
  var p3A = pick([8, 10, 12], rng) * 1000000;
  var p3y = pick([5, 6, 8], rng);
  var p3k = pick([1.6, 1.8, 2.2], rng);
  var p3B = Math.round(p3A * p3k / 100000) * 100000;
  var p3r = (Math.pow(p3B / p3A, 1 / p3y) - 1) * 100;
  var p3avg = (p3B / p3A - 1) / p3y * 100;
  var p3tot = (p3B / p3A - 1) * 100;
  var p3log = log10(p3B / p3A) / p3y * 100;

  /* ── Reactivo 4 · el logaritmo de una suma ── */
  var p4x = pick([9, 12, 15], rng) * 100000;
  var p4y = pick([4, 6, 7], rng) * 100000;

  /* ── Concepto 3 · ecuaciones exponenciales y escala ── */
  var c3V = pick([600000, 800000, 1000000], rng);
  var c3d = pick([15, 18, 20], rng);
  var c3r = pick([0.25, 0.3], rng);
  var c3R = Math.round(c3V * c3r / 1000) * 1000;
  var c3f = 1 - c3d / 100;
  var c3e = Math.log(c3R / c3V) / Math.log(c3f);
  var c3n = Math.ceil(c3e);
  var c3v1 = c3V * Math.pow(c3f, c3n - 1);
  var c3v2 = c3V * Math.pow(c3f, c3n);

  var w3V = pick([6000000, 8000000, 10000000], rng);
  var w3g = pick([10, 14, 18], rng);
  var w3B = pick([9000000, 12000000], rng);
  var w3add = pick([400000, 600000, 900000], rng);

  /* ── Reactivo 5 · la depreciacion de la maquina ── */
  var p5V = pick([600000, 750000, 900000], rng);
  var p5d = pick([15, 18, 20], rng);
  var p5r = pick([0.25, 0.3], rng);
  var p5R = Math.round(p5V * p5r / 1000) * 1000;
  var p5f = 1 - p5d / 100;
  var p5e = Math.log(p5R / p5V) / Math.log(p5f);
  var p5n = Math.ceil(p5e);
  var p5v1 = p5V * Math.pow(p5f, p5n - 1);
  var p5v2 = p5V * Math.pow(p5f, p5n);
  var p5s = Math.ceil((p5V - p5R) / (p5V * p5d / 100));

  /* ── Reactivo 6 · la recta en escala logaritmica ── */
  var p6g = pick([9, 11, 13], rng);
  var p6y = pick([6, 7, 8], rng);

  /* ── Reactivo 7 · cuando alcanza la division chica a la grande ── */
  var p7A = pick([900000, 1200000, 1500000], rng);
  var p7ia = pick([5, 6, 7], rng);
  var p7q = pick([0.5, 0.6], rng);
  var p7B = Math.round(p7A * p7q / 10000) * 10000;
  var p7ib = pick([12, 14, 15], rng);
  var p7n = Math.ceil(Math.log(p7A / p7B) / Math.log((1 + p7ib / 100) / (1 + p7ia / 100)));
  var p7alone = Math.ceil(Math.log(p7A / p7B) / Math.log(1 + p7ib / 100));

      '<h2>Las leyes del logaritmo: cadenas de crecimiento que se vuelven sumas</h2>' +
      '<p>Un año de crecimiento se representa con un factor. Varios años seguidos no se suman, se multiplican entre sí, y ahí empieza el desorden en más de un reporte. Si Cítricos Tecomán creció ' + intN(c2a) + '% un año y ' + intN(c2b) + '% al siguiente, el crecimiento acumulado no es la suma de los dos porcentajes: es el producto de sus factores, que deja ' + dec1((c2fp - 1) * 100) + '%. La diferencia parece pequeña en dos años y se vuelve enorme cuando el reporte cubre una década.</p>' +

function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);
  set('lbl-name-el',  t('lbl-name'));
  set('lbl-group-el', t('lbl-group'));
  set('startBtn',     t('btn-start'));
  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));
  var ll = document.getElementById('logo-left');  if (ll) ll.alt = SCHOOL.logoLeftAlt;
  var lr = document.getElementById('logo-right'); if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title = p.i18n.title[LANG];
    p.q     = p.i18n.q[LANG];
    p.hint  = p.i18n.hint[LANG];
    p.exp   = p.i18n.exp[LANG];
    p.opts  = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.q;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.opts[oi] !== undefined) o.innerHTML = p.opts[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.exp;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();
