<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Problemáticas Sociales y Ambientales de la Comunidad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Problemáticas Sociales y Ambientales de la Comunidad</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Problemáticas Sociales y Ambientales de la Comunidad</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'geo1_t09_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function permOf(n, rng){
  var a = [], i;
  for (i = 0; i < n; i++) a.push(i);
  for (i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

      why:{ es:'Se pierde cubierta vegetal, sombra y refugio para las aves.', en:'Plant cover, shade and shelter for birds are lost.' } },
    { es:'Muchas familias caminan veinte minutos hasta el centro de salud más cercano', en:'Many families walk twenty minutes to the nearest health centre', bin:0,
      why:{ es:'Lo que falla es un servicio del que dependen las personas.', en:'What fails is a service the people depend on.' } },
    { es:'El pozo del que se abastece la colonia baja un poco de nivel cada año', en:'The well that supplies the neighbourhood drops a little in level every year', bin:1,
      why:{ es:'Se saca agua del subsuelo más rápido de lo que se repone.', en:'Water is taken from underground faster than it is replaced.' } },
    { es:'Los vecinos dejaron de ir a las juntas y ya nadie organiza nada en el barrio', en:'Neighbours stopped going to the meetings and nobody organises anything in the barrio any more', bin:0,
      why:{ es:'Lo que se debilita es la organización de la propia comunidad.', en:'What weakens is the organisation of the community itself.' } }
  ];
  var st = { seq: permOf(ITEMS.length, rng), i: 0, tries: 0, hits: 0, done: false, busy: false };

  function render(){
    st.busy = false;
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'El tablero de la colonia', en:'The neighbourhood board' }) + '</div>' +
        '<div class="gw-q">' + L({ es:'Tablero terminado', en:'Board finished' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Acertaste ' + st.hits + ' de ' + ITEMS.length + '. Cuando el daño cae sobre el agua, el aire, el suelo o los seres vivos, hablamos de lo ambiental; cuando cae sobre la vida, los servicios o el trato entre las personas, hablamos de lo social.',
          en:'You got ' + st.hits + ' of ' + ITEMS.length + '. When the damage falls on water, air, soil or living things, we call it environmental; when it falls on daily life, services or the way people treat one another, we call it social.'
        }) + '</div>';
      return;
    }
    var it = ITEMS[st.seq[st.i]];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El tablero de la colonia', en:'The neighbourhood board' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿De qué tipo es cada situación?', en:'What kind is each situation?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Lee la situación y decide si el daño cae sobre el entorno natural o sobre la vida de las personas.',
        en:'Read the situation and decide whether the damage falls on the natural surroundings or on the lives of the people.'
      }) + '</div>' +
      '<div class="cl-prog">' + (st.i + 1) + ' / ' + ITEMS.length + '</div>' +
      '<div class="cl-card">' + L(it) + '</div>' +
      '<div class="cl-bins">' + BINS.map(function(b, bi){
        return '<button class="cl-bin" data-b="' + bi + '">' + L(b) + '</button>';
      }).join('') + '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.cl-bin').forEach(function(btn){
      btn.addEventListener('click', function(){ choose(parseInt(btn.getAttribute('data-b'), 10)); });
    });
  }

  function advance(){
    st.busy = true;
    st.i++; st.tries = 0;
    if (st.i >= ITEMS.length) st.done = true;
    setTimeout(render, 1200);
  }

  function choose(bi){
    if (st.busy || st.done) return;
    var it = ITEMS[st.seq[st.i]];
    if (bi === it.bin){
      st.hits++;
      say(host, 'good', '✓ ' + L(it.why));
      advance();
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      say(host, 'warm', L({ es:'Va en ', en:'It goes under ' }) + '<b>' + L(BINS[it.bin]) + '</b>. ' + L(it.why));
      advance();
      return;
    }
    if (bi === 0){
      say(host, 'miss', L({
        es:'Todavía no. Pregúntate qué es lo dañado aquí: ¿el agua, el aire, el suelo o los seres vivos?',
        en:'Not yet. Ask yourself what is damaged here: the water, the air, the soil or living things?'
      }));
    } else {
      say(host, 'miss', L({
        es:'Todavía no. Fíjate si lo afectado es el entorno natural o la vida diaria de las personas.',
        en:'Not yet. Check whether what is affected is the natural surroundings or the daily life of the people.'
      }));
    }
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: EL RECORRIDO (lo que se dice  ->  el dato que lo comprueba)
   ══════════════════════════════════════════════════════════════════════════ */
function wRecorrido(rng, host){
  var PAIRS = [
    { a:{ es:'El agua no alcanza', en:'There is not enough water' },
      b:{ es:'Cuántos días por semana llega el agua a cada calle', en:'How many days a week the water reaches each street' },
      cue:{ es:'se comprueba contando días, no repitiendo la queja', en:'is checked by counting days, not by repeating the complaint' } },
    { a:{ es:'La basura se acumula en el arroyo', en:'Rubbish piles up in the stream' },
      b:{ es:'Cuántos costales se retiran de ese punto cada semana', en:'How many sacks are taken from that spot each week' },
      cue:{ es:'se mide por lo que se saca de ahí, en cantidad', en:'is measured by what is taken out of there, as an amount' } },
    { a:{ es:'La calle es insegura al anochecer', en:'The street is unsafe after dark' },
      b:{ es:'Cuántas luminarias no encienden en el tramo', en:'How many street lamps do not switch on along the stretch' },
      cue:{ es:'necesita un conteo de lo que falla en ese tramo', en:'needs a count of what fails along that stretch' } },
    { a:{ es:'El aire de la colonia hace daño', en:'The air in the neighbourhood is harmful' },
      b:{ es:'Cuántos días al mes se quema basura al aire libre', en:'How many days a month rubbish is burned in the open' },
      cue:{ es:'se sostiene con la frecuencia de lo que ensucia el aire', en:'is supported by how often the thing that dirties the air happens' } },
    { a:{ es:'Los jóvenes no tienen dónde reunirse', en:'Young people have nowhere to meet' },
      b:{ es:'Cuántos espacios públicos abiertos hay y a qué distancia quedan', en:'How many open public spaces there are and how far away they are' },
      cue:{ es:'se comprueba contando lugares y midiendo distancias', en:'is checked by counting places and measuring distances' } }
  ];
  var N = PAIRS.length;
  var st = { left: permOf(N, rng), right: permOf(N, rng), sel: null, done: [], tries: 0 };

  function isDone(i){ return st.done.indexOf(i) >= 0; }

  function render(){
    var leftHtml = st.left.map(function(i){
      var cls = 'mt-chip' + (isDone(i) ? ' done' : (st.sel === i ? ' sel' : ''));
      return '<div class="' + cls + '" data-side="a" data-i="' + i + '">' + L(PAIRS[i].a) + '</div>';
    }).join('');
    var rightHtml = st.right.map(function(i){
      var cls = 'mt-chip' + (isDone(i) ? ' done' : '');
      return '<div class="' + cls + '" data-side="b" data-i="' + i + '">' + L(PAIRS[i].b) + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El recorrido', en:'The walk around' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿Con qué dato se comprueba cada cosa que se dice?', en:'Which figure proves each thing people say?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Toca una frase de la izquierda y después el dato que la convertiría en algo comprobable. Los pares que aciertes se quedan fijos.',
        en:'Tap a phrase on the left and then the figure that would make it something you can prove. The pairs you get right stay fixed.'
      }) + '</div>' +
      '<div class="mt-wrap">' +
        '<div class="mt-col"><div class="mt-lbl">' + L({ es:'Lo que se dice', en:'What people say' }) + '</div>' + leftHtml + '</div>' +
        '<div class="mt-col"><div class="mt-lbl">' + L({ es:'El dato', en:'The figure' }) + '</div>' + rightHtml + '</div>' +
      '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.mt-chip').forEach(function(el){
      el.addEventListener('click', function(){ tap(el.getAttribute('data-side'), parseInt(el.getAttribute('data-i'), 10)); });
    });
  }

  function finish(){
    say(host, 'good', '🎉 ' + L({
      es:'Recorrido completo. Una queja se vuelve un diagnóstico cuando alguien puede contarla, medirla y anotarla en una hoja: con eso ya se puede hablar con la autoridad.',
      en:'Walk complete. A complaint becomes a diagnosis when someone can count it, measure it and write it down on a sheet: with that you can already talk to the authority.'
    }));
  }

  function tap(side, i){
    if (isDone(i)) return;
    if (side === 'a'){
      st.sel = (st.sel === i ? null : i);
      var keep = host.querySelector('.gw-fb').innerHTML;
      render();
      if (st.sel !== null){
        say(host, 'warm', L({ es:'Elegiste ', en:'You picked ' }) + '<b>' + L(PAIRS[st.sel].a) + '</b>. ' +
          L({ es:'Ahora toca el dato que lo comprobaría.', en:'Now tap the figure that would prove it.' }));
      } else if (keep){ say(host, '', keep); }
      return;
    }
    if (st.sel === null){
      say(host, 'warm', L({
        es:'Primero elige una frase de la izquierda: un dato solo sirve cuando sabes qué afirmación sostiene.',
        en:'Pick a phrase on the left first: a figure is only useful once you know which claim it supports.'
      }));
      return;
    }
    var chosen = st.sel;
    if (i === chosen){
      st.done.push(chosen); st.sel = null; st.tries = 0;
      render();
      if (st.done.length >= N){ finish(); return; }
      say(host, 'good', '✓ ' + L({ es:'Esa afirmación ', en:'That claim ' }) + L(PAIRS[chosen].cue) + '.');
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.done.push(chosen); st.sel = null; st.tries = 0;
      render();
      say(host, 'warm', L({ es:'Le corresponde: ', en:'The right one is: ' }) + '<b>' + L(PAIRS[chosen].b) + '</b>. ' +
        L({ es:'Esa afirmación ', en:'That claim ' }) + L(PAIRS[chosen].cue) + '.');
      if (st.done.length >= N) finish();
      return;
    }
    say(host, 'miss', L({ es:'Todavía no. Esa afirmación ', en:'Not yet. That claim ' }) +
      L(PAIRS[chosen].cue) + L({ es:', vuelve a elegir.', en:', choose again.' }));
  }

  render();
  say(host, '', L({
    es:'Cinco frases que se escuchan en la colonia y cinco datos revueltos.',
    en:'Five phrases you hear in the neighbourhood and five figures, shuffled.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: LA CADENA (ordenar causa y efectos)
   ══════════════════════════════════════════════════════════════════════════ */
function wCadena(rng, host){
  var STEPS = [
    { es:'El camión recolector deja de pasar por las calles de la orilla', en:'The rubbish truck stops coming down the streets on the edge' },
    { es:'Las bolsas se amontonan en el borde del arroyo porque no hay a dónde llevarlas', en:'Bags pile up on the bank of the stream because there is nowhere to take them' },
    { es:'La basura tapa el cauce y el agua deja de correr por ahí', en:'The rubbish blocks the channel and the water stops running through' },
    { es:'Con la primera lluvia fuerte el arroyo se desborda hacia las casas de abajo', en:'With the first heavy rain the stream overflows towards the houses below' },
    { es:'Varias familias pierden sus cosas y las niñas y los niños faltan a la escuela', en:'Several families lose their belongings and the children miss school' }
  ];
  var N = STEPS.length;
  var st = { order: permOf(N, rng), sel: null, tries: 0, done: false };
  if (st.order.every(function(v, i){ return v === i; })) { var q = st.order[0]; st.order[0] = st.order[N - 1]; st.order[N - 1] = q; }

  function render(){
    var chips = st.order.map(function(ei, pos){
      var cls = 'tl-chip' + (st.done ? ' locked' : (st.sel === pos ? ' sel' : ''));
      return '<div class="' + cls + '" data-p="' + pos + '"><span class="tl-num">' + (pos + 1) + '</span>' + L(STEPS[ei]) + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'La cadena', en:'The chain' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'De un servicio que falla a una familia que pierde su casa', en:'From a service that fails to a family that loses its home' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Ordena los eslabones del primero al último. Toca dos tarjetas para intercambiarlas y después verifica.',
        en:'Order the links from first to last. Tap two cards to swap them and then check.'
      }) + '</div>' +
      '<div class="tl-list">' + chips + '</div>' +
      (st.done ? '' : '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Verificar la cadena', en:'Check the chain' }) + '</button></div>') +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.tl-chip').forEach(function(el){
      el.addEventListener('click', function(){ tap(parseInt(el.getAttribute('data-p'), 10)); });
    });
    var b = host.querySelector('[data-r="check"]');
    if (b) b.addEventListener('click', check);
  }

  function tap(pos){
    if (st.done) return;
    var msg = host.querySelector('.gw-fb').innerHTML;
    if (st.sel === null) st.sel = pos;
    else if (st.sel === pos) st.sel = null;
    else { var t = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t; st.sel = null; }
    render();
    if (msg) say(host, '', msg);
  }

  function check(){
    var ok = st.order.every(function(ei, pos){ return ei === pos; });
    if (ok){
      st.done = true; render();
      say(host, 'good', '🎉 ' + L({
        es:'Esa es la cadena. Empieza como un servicio que falla, sigue como un daño al arroyo y termina en la vida de unas familias: por eso casi nunca se puede separar lo ambiental de lo social.',
        en:'That is the chain. It starts as a service that fails, goes on as damage to the stream and ends in the lives of some families: that is why the environmental side can hardly ever be separated from the social one.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.order = STEPS.map(function(_, i){ return i; });
      st.done = true; render();
      say(host, 'warm', L({
        es:'Este es el orden. Fíjate en que cada eslabón solo puede ocurrir si el anterior ya ocurrió: sin bolsas amontonadas no hay cauce tapado, y sin cauce tapado el agua no entra a las casas.',
        en:'This is the order. Notice that each link can only happen if the previous one already happened: with no piled up bags there is no blocked channel, and with no blocked channel the water does not get into the houses.'
      }));
      return;
    }
    var bad = 0;
    for (var i = 0; i < N; i++){ if (st.order[i] !== i){ bad = i; break; } }
    say(host, 'miss', L({
      es:'Todavía no. Mira la tarjeta número ' + (bad + 1) + ': ¿lo que dice puede ocurrir antes de lo que está arriba de ella?',
      en:'Not yet. Look at card number ' + (bad + 1) + ': can what it says happen before what is above it?'
    }));
  }

  render();
  say(host, '', L({
    es:'Los cinco eslabones están revueltos.',
    en:'The five links are shuffled.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: EL MOSAICO (marcar lo que sí describe a una comunidad
   pluricultural y descartar lo que la niega)
   ══════════════════════════════════════════════════════════════════════════ */
function wMosaico(rng, host){
  var TILES = [
    { es:'En el mismo municipio viven pueblos originarios que conservan su lengua y deciden en asamblea', en:'In the same municipality live original peoples who keep their language and decide in assembly', ok:true,
      why:{ es:'Son parte de la comunidad y traen consigo lengua y forma propia de organizarse.', en:'They are part of the community and bring with them a language and their own way of organising.' } },
    { es:'Hay comunidades afromexicanas con historia propia, reconocidas en la Constitución del país', en:'There are Afro-Mexican communities with a history of their own, recognised in the Constitution of the country', ok:true,
      why:{ es:'Su presencia es antigua y su reconocimiento es parte de la identidad del país.', en:'Their presence is old and their recognition is part of the identity of the country.' } },
    { es:'Personas llegadas de otro estado o de otro país aportan oficios, música y comida al barrio', en:'People arrived from another state or another country bring trades, music and food to the barrio', ok:true,
      why:{ es:'Quien llega también construye el lugar al que llega.', en:'Whoever arrives also builds the place they arrive at.' } },
    { es:'Colectivos de jóvenes de la ciudad se identifican por el deporte, la música o el arte que practican', en:'Groups of young people in the city identify themselves by the sport, music or art they practise', ok:true,
      why:{ es:'Los grupos urbanos también son una forma de identidad dentro de la comunidad.', en:'Urban groups are also a form of identity within the community.' } },
    { es:'Para formar una sola comunidad todos tendrían que dejar de hablar su lengua', en:'To form a single community everyone would have to stop speaking their own language', ok:false,
      why:{ es:'La comunidad no se une borrando lenguas: se une reconociéndolas.', en:'A community is not united by erasing languages: it is united by recognising them.' } },
    { es:'La diversidad de pueblos y culturas solo existe en el campo, no en las ciudades', en:'The diversity of peoples and cultures only exists in the countryside, not in cities', ok:false,
      why:{ es:'En las ciudades conviven pueblos originarios, migrantes y grupos urbanos.', en:'In cities original peoples, migrants and urban groups live side by side.' } },
    { es:'Una cultura vale más que otra según el lugar del que venga', en:'One culture is worth more than another depending on where it comes from', ok:false,
      why:{ es:'Ordenar las culturas por valor es justo lo que abre la puerta a la discriminación.', en:'Ranking cultures by worth is exactly what opens the door to discrimination.' } },
    { es:'Reconocer la diversidad significa que cada grupo debe vivir aparte de los demás', en:'Recognising diversity means each group should live apart from the others', ok:false,
      why:{ es:'Reconocer no es separar: es compartir el territorio sin dejar de ser quien se es.', en:'Recognising is not separating: it is sharing the territory without ceasing to be who you are.' } }
  ];
  var ord = permOf(TILES.length, rng);
  var st = { sel: TILES.map(function(){ return false; }), tries: 0, done: false };

  function render(){
    var grid = ord.map(function(i){
      var cls = 'bd-tile';
      if (st.done) cls += TILES[i].ok ? ' good' : ' bad';
      else if (st.sel[i]) cls += ' on';
      return '<button class="' + cls + '" data-i="' + i + '">' + L(TILES[i]) + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'El mosaico', en:'The mosaic' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿Cuáles describen de verdad a una comunidad pluricultural?', en:'Which ones really describe a pluricultural community?' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Marca solo las tarjetas que describen bien a una comunidad formada por varios pueblos y grupos. Puedes marcar y desmarcar las veces que quieras antes de verificar.',
        en:'Mark only the cards that describe well a community made up of several peoples and groups. You can mark and unmark as many times as you like before checking.'
      }) + '</div>' +
      '<div class="bd-grid">' + grid + '</div>' +
      (st.done ? '' : '<div class="gw-row"><button class="gw-btn" data-r="check">' + L({ es:'Verificar el mosaico', en:'Check the mosaic' }) + '</button></div>') +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.bd-tile').forEach(function(el){
      el.addEventListener('click', function(){ toggle(parseInt(el.getAttribute('data-i'), 10)); });
    });
    var b = host.querySelector('[data-r="check"]');
    if (b) b.addEventListener('click', check);
  }

  function toggle(i){
    if (st.done) return;
    var msg = host.querySelector('.gw-fb').innerHTML;
    st.sel[i] = !st.sel[i];
    render();
    if (msg) say(host, '', msg);
  }

  function check(){
    var extra = [], falta = [];
    TILES.forEach(function(tt, i){
      if (st.sel[i] && !tt.ok) extra.push(i);
      if (!st.sel[i] && tt.ok) falta.push(i);
    });
    if (extra.length === 0 && falta.length === 0){
      st.done = true; render();
      say(host, 'good', '🎉 ' + L({
        es:'Mosaico armado. Una comunidad pluricultural no es la que logra que todos se parezcan, es la que reconoce que sus pueblos originarios, sus familias afromexicanas, quienes llegaron de fuera y sus grupos urbanos forman juntos un solo lugar.',
        en:'Mosaic assembled. A pluricultural community is not one that gets everybody to look alike, it is one that recognises that its original peoples, its Afro-Mexican families, those who came from elsewhere and its urban groups together form a single place.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.done = true; render();
      say(host, 'warm', L({
        es:'Estas son las cuatro que describen a una comunidad pluricultural. Las otras cuatro no describen la diversidad: la niegan, la esconden o la ordenan por valor.',
        en:'These are the four that describe a pluricultural community. The other four do not describe diversity: they deny it, hide it or rank it by worth.'
      }));
      return;
    }
    if (extra.length){
      say(host, 'miss', L({ es:'Revisa la que dice ', en:'Look again at the one that says ' }) + '<b>' + L(TILES[extra[0]]) + '</b>. ' +
        L({ es:'¿Esa frase reconoce la diversidad o la borra?', en:'Does that sentence recognise diversity or erase it?' }));
      return;
    }
    say(host, 'miss', L({
      es:'Te falta al menos una. Todavía hay un grupo que forma parte de la comunidad y que dejaste sin marcar: piensa en quiénes viven en tu municipio además de quienes nacieron ahí.',
      en:'You are missing at least one. There is still a group that is part of the community and that you left unmarked: think about who lives in your municipality besides those born there.'
    }));
  }

  render();
  say(host, '', L({
    es:'Ocho tarjetas: cuatro describen a la comunidad y cuatro la niegan.',
    en:'Eight cards: four describe the community and four deny it.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: EL PLAN (repartir jornadas hasta cumplir dos metas)
   ══════════════════════════════════════════════════════════════════════════ */
function wPlan(rng, host){
  var xm = ri(rng, 3, 5);
  var ym = ri(rng, 2, 4);
  var T  = xm + ym + ri(rng, 1, 2);
  var r  = ri(rng, 4, 6);
  var f  = ri(rng, 5, 8);
  var R  = xm * r;
  var F  = ym * f;
  var st = { x: 1, y: 1 };

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'El plan del grupo', en:'The group plan' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Dos metas, ' + T + ' jornadas y un solo grupo', en:'Two goals, ' + T + ' work sessions and a single group' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'El grupo puede dedicar ' + T + ' jornadas este mes. Cada jornada de limpieza retira ' + r + ' costales del arroyo y cada taller enseña a separar la basura a ' + f + ' familias. Mueve las barras hasta que las dos metas queden cubiertas sin pasarte de jornadas.',
      en:'The group can give ' + T + ' work sessions this month. Each clean up session takes ' + r + ' sacks out of the stream and each workshop teaches ' + f + ' families to separate their rubbish. Move the bars until both goals are covered without going over the sessions available.'
    }) + '</div>' +
    '<div class="pl-row">' +
      '<div class="pl-lbl"><span>' + L({ es:'Jornadas de limpieza del arroyo', en:'Clean up sessions at the stream' }) + '</span><span class="pl-val" data-v="x"></span></div>' +
      '<div class="pl-track"><div class="pl-fill" data-b="x"></div></div>' +
      '<input class="pl-sld" type="range" data-s="x" min="0" max="' + T + '" step="1" value="' + st.x + '">' +
    '</div>' +
    '<div class="pl-row">' +
      '<div class="pl-lbl"><span>' + L({ es:'Talleres de separación en la escuela', en:'Sorting workshops at the school' }) + '</span><span class="pl-val" data-v="y"></span></div>' +
      '<div class="pl-track"><div class="pl-fill alt" data-b="y"></div></div>' +
      '<input class="pl-sld" type="range" data-s="y" min="0" max="' + T + '" step="1" value="' + st.y + '">' +
    '</div>' +
    '<div class="pl-stats">' +
      '<div class="pl-st"><div class="pl-sl">' + L({ es:'Jornadas usadas', en:'Sessions used' }) + '</div><div class="pl-sv" data-k="t"></div></div>' +
      '<div class="pl-st"><div class="pl-sl">' + L({ es:'Costales retirados', en:'Sacks removed' }) + '</div><div class="pl-sv" data-k="r"></div></div>' +
      '<div class="pl-st"><div class="pl-sl">' + L({ es:'Familias alcanzadas', en:'Families reached' }) + '</div><div class="pl-sv" data-k="f"></div></div>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  function draw(){
    var used = st.x + st.y, cos = st.x * r, fam = st.y * f;
    host.querySelector('[data-v="x"]').textContent = st.x;
    host.querySelector('[data-v="y"]').textContent = st.y;
    host.querySelector('[data-b="x"]').style.width = (st.x / T * 100) + '%';
    host.querySelector('[data-b="y"]').style.width = (st.y / T * 100) + '%';
    host.querySelector('[data-k="t"]').textContent = used + ' / ' + T;
    host.querySelector('[data-k="r"]').textContent = cos + ' / ' + R;
    host.querySelector('[data-k="f"]').textContent = fam + ' / ' + F;
    host.querySelector('[data-k="t"]').className = 'pl-sv ' + (used <= T ? 'hit' : 'miss');
    host.querySelector('[data-k="r"]').className = 'pl-sv ' + (cos >= R ? 'hit' : 'miss');
    host.querySelector('[data-k="f"]').className = 'pl-sv ' + (fam >= F ? 'hit' : 'miss');
    host.querySelector('[data-b="x"]').className = 'pl-fill' + (used > T ? ' off' : '');
    host.querySelector('[data-b="y"]').className = 'pl-fill alt' + (used > T ? ' off' : '');

    if (used > T){
      say(host, 'miss', L({
        es:'Estás comprometiendo ' + used + ' jornadas y el grupo solo tiene ' + T + '. Un plan que nadie puede cumplir se cae en la primera semana: baja alguna de las dos barras.',
        en:'You are committing ' + used + ' sessions and the group only has ' + T + '. A plan nobody can carry out collapses in the first week: lower one of the two bars.'
      }));
      return;
    }
    if (cos < R){
      say(host, 'warm', L({
        es:'Al arroyo le faltan ' + (R - cos) + ' costales para llegar a la meta. Todavía te quedan jornadas libres: sube la barra de limpieza.',
        en:'The stream is ' + (R - cos) + ' sacks short of the goal. You still have free sessions: raise the clean up bar.'
      }));
      return;
    }
    if (fam < F){
      say(host, 'warm', L({
        es:'Faltan ' + (F - fam) + ' familias por alcanzar. Sube la barra de talleres sin pasarte de las ' + T + ' jornadas.',
        en:'There are still ' + (F - fam) + ' families to reach. Raise the workshops bar without going over the ' + T + ' sessions.'
      }));
      return;
    }
    say(host, 'good', '🎉 ' + L({
      es:'Plan armado: cumples las dos metas y te sobran ' + (T - used) + ' jornadas. Fíjate en lo que hiciste: limpiar quita la basura que ya está, y el taller evita la que iba a llegar. Un plan que solo limpia se repite para siempre.',
      en:'Plan ready: you meet both goals and have ' + (T - used) + ' sessions to spare. Notice what you did: cleaning removes the rubbish already there, and the workshop prevents the rubbish that was going to arrive. A plan that only cleans repeats itself forever.'
    }));
  }

  host.querySelectorAll('.pl-sld').forEach(function(sl){
    sl.addEventListener('input', function(){
      st[sl.getAttribute('data-s')] = parseInt(sl.value, 10);
      draw();
    });
  });
  draw();
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

      es:'Una comunidad es el conjunto de personas que comparten un mismo lugar: una colonia, un pueblo, un barrio, una localidad. Comparten calles, agua, aire, transporte y escuela, y por eso también comparten los problemas de ese lugar. Cuando el camión de la basura deja de pasar, no se molesta una sola familia: se llena de bolsas el mismo terreno por el que todos caminan.',
      en:'A community is the set of people who share one place: a neighbourhood, a village, a barrio, a town. They share streets, water, air, transport and school, and because of that they also share the problems of that place. When the rubbish truck stops coming, it is not one family that is bothered: the same ground everyone walks on fills up with bags.'

    '<p>' + L({
      es:'En esta guía vas a aprender a mirar tu comunidad como quien levanta un diagnóstico: a distinguir lo que le pasa al entorno de lo que le pasa a la gente, a comprobar con datos lo que hasta ahora era una impresión, a reconocer que quienes viven ahí no son todos iguales ni resienten lo mismo, y a proponer una acción que se pueda cumplir y revisar.',
      en:'In this guide you will learn to look at your community the way someone drawing up a diagnosis does: to tell what happens to the surroundings from what happens to the people, to prove with figures what until now was an impression, to recognise that those who live there are not all alike nor feel the same things, and to propose an action that can be carried out and reviewed.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a clasificar lo que ocurre en una colonia entre lo social y lo ambiental, a emparejar cada queja con el dato que la comprueba, a armar la cadena que va de un servicio que falla hasta una casa inundada, a separar lo que describe a una comunidad pluricultural de lo que la niega, y a repartir las jornadas de un grupo hasta que dos metas queden cubiertas.',
      en:'you are going to sort what happens in a neighbourhood into social and environmental, pair each complaint with the figure that proves it, build the chain that runs from a service that fails to a flooded house, separate what describes a pluricultural community from what denies it, and share out the work sessions of a group until two goals are covered.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Qué es una problemática de la comunidad', en:'What a community issue is' }),
    '<p>' + L({
      es:'No todo lo que molesta es una problemática de la comunidad. Para serlo necesita tres cosas: que alcance a un conjunto de personas que comparte un espacio, que se sostenga en el tiempo en lugar de resolverse en una tarde, y que ninguna familia por su cuenta pueda arreglarla. Una bicicleta descompuesta es un contratiempo; que el agua llegue dos días por semana a toda la colonia desde hace un año es una problemática.',
      en:'Not everything annoying is a community issue. To be one it needs three things: to reach a set of people who share a space, to hold over time instead of being sorted out in one afternoon, and to be beyond what any single family can fix on its own. A broken bicycle is a setback; water reaching the whole neighbourhood two days a week for the past year is an issue.'
    }) + '</p>' +
    '<p>' + L({
      es:'Esas problemáticas se agrupan en dos familias. Las ambientales dañan el entorno del que dependemos: el agua de un arroyo o de un pozo, el aire, el suelo, los árboles, los animales. Las sociales dañan la vida en común: los servicios que faltan, la salud, la seguridad, la convivencia y el trato entre las personas. Separarlas ayuda a nombrar el daño con precisión, aunque en la vida real casi siempre aparecen juntas.',
      en:'Those issues fall into two families. Environmental ones damage the surroundings we depend on: the water of a stream or a well, the air, the soil, the trees, the animals. Social ones damage life together: missing services, health, safety, and the way people get along and treat one another. Telling them apart helps to name the damage precisely, even though in real life they almost always show up together.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Alcance', en:'Reach' }), L({ es:'toca a varias personas', en:'touches several people' }), L({ es:'no es un asunto de un solo hogar', en:'it is not a matter for one household' })) +
      rcard(L({ es:'Duración', en:'Duration' }), L({ es:'se sostiene en el tiempo', en:'it holds over time' }), L({ es:'no se cierra en una tarde', en:'it does not close in one afternoon' })) +
      rcard(L({ es:'Ambiental', en:'Environmental' }), L({ es:'daña el entorno', en:'damages the surroundings' }), L({ es:'agua, aire, suelo, seres vivos', en:'water, air, soil, living things' })) +
      rcard(L({ es:'Social', en:'Social' }), L({ es:'daña la vida en común', en:'damages life together' }), L({ es:'servicios, salud, convivencia', en:'services, health, getting along' })) +
    '</div>'
  );
  wTablero(rng, widgetHost(s1, 'w_tablero', 'classify'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Reconocerla con evidencia y no con impresiones', en:'Recognising it with evidence, not impressions' }),
    '<p>' + L({
      es:'Reconocer una problemática empieza por salir a mirar. Un recorrido por la comunidad, con libreta en mano, sirve para anotar lo que se ve y lo que se escucha: dónde se acumula la basura, qué calles quedan a oscuras, en qué horarios llega el agua, quiénes tienen que caminar más lejos para llegar al centro de salud. A eso se suman la entrevista a quienes viven ahí y un mapa sencillo donde se marca en qué parte del lugar ocurre cada cosa.',
      en:'Recognising an issue starts with going out to look. A walk around the community, notebook in hand, is for writing down what you see and hear: where rubbish piles up, which streets go dark, at what times water arrives, who has to walk furthest to reach the health centre. To that you add interviews with those who live there and a simple map marking which part of the place each thing happens in.'
    }) + '</p>' +
    '<p>' + L({
      es:'La diferencia entre una impresión y un dato es que el dato se puede contar, medir o fechar, y que otra persona puede repetirlo y obtener lo mismo. Decir que la colonia está oscura es una impresión; anotar que doce luminarias no encienden en seis calles durante una semana es un dato. Y un registro solo sostiene aquello que midió: si contaste días de agua, puedes hablar de días de agua, no de las causas de la baja presión en toda la ciudad.',
      en:'The difference between an impression and a figure is that a figure can be counted, measured or dated, and that another person can repeat it and get the same result. Saying the neighbourhood is dark is an impression; writing down that twelve lamps fail to switch on across six streets in one week is a figure. And a record only supports what it measured: if you counted days with water, you can talk about days with water, not about the causes of low pressure across the whole city.'
    }) + '</p>'
  );
  wRecorrido(rng, widgetHost(s2, 'w_recorrido', 'match'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Cómo afectan: una problemática arrastra a otra', en:'How they affect: one issue drags another' }),
    '<p>' + L({
      es:'Las problemáticas de una comunidad casi nunca vienen solas. Un servicio que falla produce un daño en el entorno, y ese daño termina cayendo sobre la vida de alguien. Por eso conviene leerlas como cadenas y no como hechos sueltos: cada eslabón solo puede ocurrir porque el anterior ya ocurrió, y la cadena se corta más fácil cerca del principio que cerca del final.',
      en:'The issues of a community hardly ever come alone. A service that fails produces damage in the surroundings, and that damage ends up falling on somebody life. That is why it is worth reading them as chains and not as loose facts: each link can only happen because the previous one already happened, and the chain is easier to cut near the beginning than near the end.'
    }) + '</p>' +
    '<p>' + L({
      es:'Ver la cadena completa también evita dos errores frecuentes. El primero es culpar al último eslabón, como cuando se dice que las familias inundadas fueron descuidadas. El segundo es atender solo el final, limpiar el arroyo cada temporada sin tocar la razón por la que se llena, de modo que el trabajo se repite para siempre. Preguntar dónde empezó todo es lo que permite proponer algo que sirva más de una vez.',
      en:'Seeing the whole chain also avoids two frequent mistakes. The first is blaming the last link, as when people say the flooded families were careless. The second is dealing only with the end, cleaning the stream every season without touching the reason it fills up, so the work repeats forever. Asking where it all started is what lets you propose something that works more than once.'
    }) + '</p>'
  );
  wCadena(rng, widgetHost(s3, 'w_cadena', 'timeline'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Una comunidad diversa: identidad pluricultural', en:'A diverse community: pluricultural identity' }),
    '<p>' + L({
      es:'La comunidad no es un bloque parejo. En un mismo municipio conviven pueblos originarios que conservan su lengua, su forma de organizarse y su relación con el territorio; comunidades afromexicanas con una historia propia y con reconocimiento en la Constitución del país; personas migrantes que llegaron de otro estado o de otro país y trajeron oficios, comida y música; y grupos urbanos, sobre todo juveniles, que se identifican por el deporte, el arte o la música que practican. A esa mezcla que convive en un mismo lugar se le llama identidad pluricultural.',
      en:'A community is not an even block. In one municipality there live original peoples who keep their language, their way of organising and their relationship with the territory; Afro-Mexican communities with a history of their own and with recognition in the Constitution of the country; migrants who arrived from another state or another country bringing trades, food and music; and urban groups, mostly of young people, who identify themselves by the sport, art or music they practise. That mixture living in one place is what we call a pluricultural identity.'
    }) + '</p>' +
    '<p>' + L({
      es:'Reconocer esa diversidad importa por dos razones muy concretas. La primera es que una misma problemática no golpea igual a todos: la falta de agua pega más fuerte a quien vive en la parte alta, y una obra pega más fuerte a quien depende del monte que se va a talar. La segunda es que negar la diversidad se vuelve en sí misma una problemática social, porque la discriminación deja fuera a parte de la comunidad. Y al revés, los saberes de cada grupo, como el manejo del agua o del bosque de un pueblo originario, suelen ser parte de la solución.',
      en:'Recognising that diversity matters for two very concrete reasons. The first is that the same issue does not hit everyone alike: a lack of water hits harder those living in the upper part, and a construction project hits harder those who depend on the woodland about to be felled. The second is that denying diversity becomes a social issue in itself, because discrimination shuts part of the community out. And the other way round, the knowledge of each group, such as the way an original people manages water or forest, is often part of the solution.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Pueblos originarios', en:'Original peoples' }), L({ es:'lengua y territorio', en:'language and territory' }), L({ es:'formas propias de decidir en común', en:'their own ways of deciding together' })) +
      rcard(L({ es:'Afromexicanos', en:'Afro-Mexicans' }), L({ es:'historia propia', en:'a history of their own' }), L({ es:'reconocidos en la Constitución', en:'recognised in the Constitution' })) +
      rcard(L({ es:'Migrantes', en:'Migrants' }), L({ es:'llegan y aportan', en:'they arrive and contribute' }), L({ es:'oficios, comida, música, palabras', en:'trades, food, music, words' })) +
      rcard(L({ es:'Grupos urbanos', en:'Urban groups' }), L({ es:'identidad compartida', en:'a shared identity' }), L({ es:'deporte, arte y música de la ciudad', en:'sport, art and music of the city' })) +
    '</div>'
  );
  wMosaico(rng, widgetHost(s4, 'w_mosaico', 'board'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Ser agente de cambio: de la queja a la acción', en:'Being an agent of change: from complaint to action' }),
    '<p>' + L({
      es:'Un agente de cambio es alguien que, en lugar de esperar, hace algo del tamaño de sus posibilidades y lo hace con otros. En la escuela y en la colonia hay acciones al alcance de un grupo de tu edad: separar residuos y medir cuánto baja la basura, sembrar y cuidar árboles, levantar una encuesta y entregarla a la autoridad, organizar una campaña de ahorro de agua, acompañar a quien llega de fuera para que no quede aislado.',
      en:'An agent of change is someone who, instead of waiting, does something the size of what they can manage and does it with others. At school and in the neighbourhood there are actions within reach of a group your age: sorting waste and measuring how much the rubbish drops, planting and caring for trees, running a survey and handing it to the authority, organising a water saving campaign, staying close to someone who has just arrived so they are not left alone.'
    }) + '</p>' +
    '<p>' + L({
      es:'Una acción sirve cuando se puede cumplir y cuando se puede revisar. Eso significa decir qué se hace, quién lo hace, cuándo, y con qué dato se sabrá si funcionó: cuántos costales menos, cuántas luminarias encendidas, cuántas familias participando. También conviene combinar lo que repara con lo que previene, porque limpiar quita la basura que ya está y el taller evita la que iba a llegar. Y como el tiempo y las manos son limitados, un plan realista reparte lo que hay en lugar de prometer todo.',
      en:'An action works when it can be carried out and when it can be reviewed. That means saying what is done, who does it, when, and which figure will show whether it worked: how many fewer sacks, how many lamps switched on, how many families taking part. It also helps to combine what repairs with what prevents, because cleaning removes the rubbish already there and the workshop prevents the rubbish that was going to arrive. And since time and hands are limited, a realistic plan shares out what there is instead of promising everything.'
    }) + '</p>'
  );
  wPlan(rng, widgetHost(s5, 'w_plan', 'plan'));
  wCompromiso(rng, widgetHost(s5, 'w_compromiso', 'reflect'));
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Para cerrar', en:'To finish' }),
    L({ es:'Un caso con todas sus piezas', en:'A case with all its pieces' }),
    '<p>' + L({
      es:'El caso que sigue trae junto todo lo anterior: un origen, un daño al entorno, personas afectadas y una petición. Léelo con calma y decide cuál planteamiento no deja ninguna pieza fuera.',
      en:'The case below brings together everything above: an origin, damage to the surroundings, people affected and a request. Read it calmly and decide which statement leaves no piece out.'
    }) + '</p>'
  );
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Problemáticas Sociales y Ambientales de la Comunidad';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
