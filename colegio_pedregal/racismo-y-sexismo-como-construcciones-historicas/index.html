<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racismo y Sexismo como Construcciones Históricas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Racismo y Sexismo como Construcciones Históricas</div>
    <div class="wcourse" id="wcourse-el">Historia · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Racismo y Sexismo como Construcciones Históricas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c0c3c', primaryDark:'#0c0c47', primaryBg:'#e7e7f6',
  accent:'#cc6c6c', accentBg:'#f6e4e4',
  darkPrimary:'#4545c4', darkPrimaryDark:'#7575e5', darkPrimaryBg:'#0c0c3a',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;

  opts.forEach(function(o, i) {

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });

  document.body.appendChild(_dlA); _dlA.click();

var MANIP = {};
function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function pickVariant(list, rng){ return list[Math.floor(rng()*list.length)]; }
function pickSome(pool, n, rng){
  var rest = pool.slice(), out = [];
  while (out.length < n && rest.length) out.push(rest.splice(Math.floor(rng()*rest.length),1)[0]);
  return out;
}

               'Las reformas resolvieron el problema y lo que queda hoy son casos aislados',
               'Las desigualdades que siguen vigentes prueban que las reformas no sirvieron de nada',
               'La desigualdad reaparecerá siempre, porque forma parte de toda sociedad humana'],
           en:['What was built can be dismantled, and dismantling it takes more than changing the text of a law',
               'The reforms solved the problem and what remains today are isolated cases',
               'The inequalities still in force prove that the reforms were of no use',
               'Inequality will always reappear, because it is part of every human society'] },
    correct:0,
    hint:{ es:'Busca la conclusión que da cuenta de los dos hechos a la vez, no la que se queda con uno y olvida el otro.',
           en:'Look for the conclusion that accounts for both facts at once, not the one that keeps one and forgets the other.' },
    exp:{ es:'Las reformas cambiaron cosas reales, así que negarles todo efecto contradice las fechas. Las desigualdades siguen medibles, así que declarar el problema resuelto contradice los datos. La única conclusión compatible con ambos hechos es que la construcción cede, pero cede por tramos y en más de un plano.',
         en:'The reforms changed real things, so denying them any effect contradicts the dates. The inequalities are still measurable, so declaring the problem solved contradicts the data. The only conclusion compatible with both facts is that the construction gives way, but it gives way in stretches and on more than one plane.' } },
  { title:{ es:'Para qué sirve fechar una idea', en:'What dating an idea is for' },
    q:{ es:'Si el racismo y el sexismo tienen fecha, autores e intereses identificables, ¿qué consecuencia tiene eso para quien los estudia hoy?',
        en:'If racism and sexism have identifiable dates, authors and interests, what consequence does that have for whoever studies them today?' },
    opts:{ es:['Se pueden rastrear en documentos y discutir sus efectos actuales con pruebas a la vista',
               'Pertenecen al pasado y solo interesan a quien estudie épocas antiguas',
               'Basta con conocer su origen para que dejen de producir efectos',
               'Su estudio corresponde a la biología y no a la historia'],
           en:['They can be traced in documents and their present effects discussed with evidence in view',
               'They belong to the past and only concern whoever studies ancient periods',
               'Knowing their origin is enough for them to stop producing effects',
               'Their study belongs to biology and not to history'] },
    correct:0,
    hint:{ es:'Piensa en qué gana una discusión cuando en lugar de opiniones se pueden poner sobre la mesa documentos con fecha.',
           en:'Think about what a discussion gains when instead of opinions there are dated documents to put on the table.' },
    exp:{ es:'Fechar una idea la saca del terreno de la opinión y la mete en el del archivo: se puede mostrar cuándo apareció, quién la sostuvo y qué produjo. Eso no la desactiva por sí solo, pero convierte una discusión de creencias en una discusión con pruebas, que es la herramienta con la que trabaja la historia.',
         en:'Dating an idea takes it out of the terrain of opinion and into that of the archive: it can be shown when it appeared, who sustained it and what it produced. That does not deactivate it by itself, but it turns a discussion of beliefs into a discussion with evidence, which is the tool history works with.' } }
]; }

/* ════════════════════════════════════════════════
   LECCIÓN
   ════════════════════════════════════════════════ */
function buildLesson(rng) {
  injectManipStyles();

  /* ── PUNTO DE PARTIDA ───────────────────────── */
  addSection(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Ideas que parecen naturales y tienen fecha', en:'Ideas that look natural and have a date' }),
    '<p>' + L({ es:'Hay afirmaciones que suenan tan antiguas que parecen no haber empezado nunca: que ciertos trabajos no son para mujeres, que los pueblos del mundo se ordenan de mayor a menor, que el color de una persona dice algo sobre lo que puede llegar a ser. Ninguna de esas ideas viene de la naturaleza. Todas se fabricaron, y de casi todas conocemos el siglo, los autores y el provecho que dejaban.',
               en:'There are claims that sound so old they seem never to have begun: that certain jobs are not for women, that the peoples of the world can be ranked from higher to lower, that the colour of a person says something about what they may become. None of those ideas comes from nature. All of them were manufactured, and of almost all of them we know the century, the authors and the profit they yielded.' }) + '</p>' +
    '<p>' + L({ es:'Eso es lo que quiere decir que el racismo y el sexismo son construcciones históricas. No que sean imaginarios ni que sus efectos sean leves, sino que son productos de la historia: aparecieron en un momento, alguien los sostuvo por escrito y a alguien le resultaban útiles. Lo que se construye en la historia puede rastrearse en documentos, y también puede desmontarse.',
               en:'That is what it means to say that racism and sexism are historical constructions. Not that they are imaginary or that their effects are mild, but that they are products of history: they appeared at a moment, someone sustained them in writing and someone found them useful. What is built in history can be traced in documents, and it can also be dismantled.' }) + '</p>' +
    '<p>' + L({ es:'En esta guía vas a trabajar con las herramientas de un historiador: colocarás años exactos en una línea del tiempo, armarás la ficha de fabricación de varias ideas, emparejarás frases que naturalizan una desigualdad con el hecho fechado que las desmiente y decidirás qué pruebas sostienen mejor una afirmación sobre el pasado.',
               en:'In this guide you will work with the tools of a historian: you will set exact years on a timeline, you will assemble the manufacturing record of several ideas, you will pair sentences that naturalize an inequality with the dated fact that refutes them, and you will decide which evidence best supports a claim about the past.' }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Pregunta guía: ', en:'Guiding question: ' }) + '</strong>' + L({ es:'¿cómo se distingue una diferencia que existe en el cuerpo de una clasificación que alguien inventó, escribió y administró?',
                                                                                                                        en:'how do you tell a difference that exists in the body from a classification that someone invented, wrote down and administered?' }) + '</p></div>'
  );

  /* ── CONCEPTO 1 :: EL CRITERIO ──────────────── */
  addSection(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Cuatro señales de que algo fue construido', en:'Four signs that something was built' }),
    '<p>' + L({ es:'Un hecho de la naturaleza y una construcción histórica se parecen mucho vistos desde dentro de una época: los dos se sienten obvios. Se distinguen cuando les haces cuatro preguntas concretas, y esas preguntas son el método de este tema.',
               en:'A fact of nature and a historical construction look very much alike seen from inside a period: both feel obvious. They are told apart when you ask them four concrete questions, and those questions are the method of this topic.' }) + '</p>' +
    '<table class="dtable"><tr><th>' + L({ es:'Señal', en:'Sign' }) + '</th><th>' + L({ es:'Pregunta que le haces a la idea', en:'Question you ask the idea' }) + '</th></tr>' +
    '<tr><td>' + L({ es:'Fecha', en:'Date' }) + '</td><td>' + L({ es:'¿desde cuándo se sostiene, y hasta cuándo se sostuvo?', en:'since when has it been held, and until when was it held?' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Autores', en:'Authors' }) + '</td><td>' + L({ es:'¿quién la escribió, la enseñó o la convirtió en norma?', en:'who wrote it, taught it or turned it into a rule?' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Interés', en:'Interest' }) + '</td><td>' + L({ es:'¿quién ganaba algo mientras esa idea se daba por cierta?', en:'who gained something while that idea was taken as true?' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Variación', en:'Variation' }) + '</td><td>' + L({ es:'¿dice lo mismo en otro país y en otro siglo?', en:'does it say the same thing in another country and in another century?' }) + '</td></tr></table>' +
    '<p>' + L({ es:'La cuarta señal es la más rápida de comprobar. Lo que depende de la naturaleza humana no debería cambiar al cruzar una frontera. Si el mismo derecho se reconoce en un país en un año y en otro seis décadas después, la explicación no está en la especie sino en lo que ocurría dentro de cada país. Por eso los historiadores comparan calendarios antes de aceptar cualquier explicación natural.',
               en:'The fourth sign is the quickest to check. What depends on human nature should not change when it crosses a border. If the same right is recognized in one country in one year and in another six decades later, the explanation is not in the species but in what was happening inside each country. That is why historians compare calendars before accepting any natural explanation.' }) + '</p>'
  );
  MANIP.s = { set:pickSome([0,1,2,3,4], 3, rng), i:0, tries:0, solved:false, done:false, year:0,
    msg:{ es:'Recorre primero toda la línea y luego decide dónde fijar el año.', en:'Run through the whole line first and then decide where to set the year.' } };
  MANIP.s.year = S_TRACKS[MANIP.s.set[0]].start;
  addWidget('wLinea', 'slider');
  s_render();

  useVariant(pickVariant(V1(), rng), rng);
  useVariant(pickVariant(V2(), rng), rng);

  /* ── CONCEPTO 2 :: LA FABRICACIÓN DE LA RAZA ── */
  addSection(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Cómo se fabricó la idea de raza', en:'How the idea of race was manufactured' }),
    '<p>' + L({ es:'En la Nueva España el origen de cada persona se anotaba en los registros y de esa anotación dependían el tributo que pagaba, los oficios a los que podía entrar y los matrimonios que se le permitían. Aquella clasificación no se sostenía en la sangre sino en papeles: cédulas que creaban las categorías, libros parroquiales que las registraban y funcionarios que las asignaban. Por eso los archivos guardan casos de personas cuya calidad cambia de un documento a otro, según el trámite y los testigos.',
               en:'In New Spain the origin of each person was recorded in the registers, and on that entry depended the tax they paid, the trades they could enter and the marriages allowed to them. That classification did not rest on blood but on papers: decrees creating the categories, parish books recording them and officials assigning them. That is why the archives keep cases of people whose category changes from one document to another, depending on the procedure and the witnesses.' }) + '</p>' +
    '<p>' + L({ es:'En el siglo diecinueve apareció algo distinto y más peligroso. Varios autores midieron cráneos, construyeron tablas y publicaron escalas que colocaban a unos pueblos por encima de otros. Se presentaban como ciencia y llegaron a las escuelas y a los periódicos. El detalle decisivo es el calendario: aquellas escalas se publicaron mientras las potencias europeas ocupaban territorios en otros continentes, es decir, cuando resultaba muy conveniente que la desigualdad pareciera un dato de la naturaleza y no una decisión política.',
               en:'In the nineteenth century something different and more dangerous appeared. Several authors measured skulls, built tables and published scales placing some peoples above others. They presented themselves as science and reached schools and newspapers. The decisive detail is the calendar: those scales were published while the European powers were occupying territories on other continents, that is, when it was very convenient for inequality to look like a fact of nature and not a political decision.' }) + '</p>' +
    '<div class="srcbox">' + L({ es:'Lo que hoy sabemos: al comparar el material genético de la especie, la variación no sigue las fronteras de las categorías raciales. Dos personas del mismo grupo pueden diferir entre sí más que dos personas de grupos distintos. Las líneas que llamamos raza no aparecen en la biología porque se trazaron en oficinas, leyes y libros.',
                                 en:'What we know today: when the genetic material of the species is compared, variation does not follow the borders of racial categories. Two people of the same group may differ from each other more than two people of different groups. The lines we call race do not appear in biology because they were drawn in offices, laws and books.' }) + '<span class="srcref">' + L({ es:'Criterio usado en esta guía', en:'Criterion used in this guide' }) + '</span></div>'
  );
  MANIP.f = { set:pickSome([0,1,2,3,4], 3, rng), i:0, done:false,
    rows:[{ state:'open', tries:0 }, { state:'open', tries:0 }, { state:'open', tries:0 }],
    msg:{ es:'Empieza por la fecha: si la idea tiene principio y final, ya no es natural.', en:'Start with the date: if the idea has a beginning and an end, it is no longer natural.' } };
  addWidget('wFicha', 'dossier');
  f_render();

  useVariant(pickVariant(V3(), rng), rng);
  useVariant(pickVariant(V4(), rng), rng);

  /* ── CONCEPTO 3 :: LA FABRICACIÓN DEL SEXISMO ─ */
  addSection(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Cómo se fabricó la idea de la naturaleza femenina', en:'How the idea of feminine nature was manufactured' }),
    '<p>' + L({ es:'El sexismo se construyó con otro material, pero con el mismo procedimiento. Durante el siglo diecinueve los códigos civiles establecieron que la mujer casada necesitaba autorización del marido para firmar un contrato, tomar un empleo o vender lo suyo, y los manuales de conducta explicaban que esa dependencia venía de su naturaleza. Conviene detenerse en la contradicción: si de verdad hubiera sido incapaz, la ley no habría necesitado prohibírselo.',
               en:'Sexism was built with different material, but with the same procedure. During the nineteenth century civil codes established that a married woman needed the authorization of her husband to sign a contract, take a job or sell what was hers, and conduct manuals explained that this dependence came from her nature. It is worth pausing on the contradiction: if she had truly been incapable, the law would not have needed to forbid it.' }) + '</p>' +
    '<p>' + L({ es:'El mismo argumento cerró las aulas. Los reglamentos escolares negaban la inscripción de mujeres en ciertas carreras diciendo que su constitución no lo resistiría. En 1887 Matilde Montoya obtuvo el título de médica en México después de años de trámites y de permisos concedidos uno por uno, y ejerció sin que ocurriera ninguna de las catástrofes anunciadas. La afirmación no se derrumbó por un discurso: se derrumbó cuando la realidad la puso a prueba.',
               en:'The same argument closed the classrooms. School regulations denied enrolment to women in certain degrees saying their constitution would not withstand it. In 1887 Matilde Montoya obtained a medical degree in Mexico after years of paperwork and permits granted one by one, and she practised without any of the announced catastrophes happening. The claim did not collapse because of a speech: it collapsed when reality put it to the test.' }) + '</p>' +
    '<p>' + L({ es:'Un argumento que naturaliza tiene siempre la misma forma: describe una prohibición y la presenta como una descripción. Reconocerlo es sencillo cuando se le pone al lado un hecho con fecha. Eso es lo que harás enseguida.',
               en:'An argument that naturalizes always has the same shape: it describes a prohibition and presents it as a description. Recognizing it is simple when a dated fact is placed beside it. That is what you will do next.' }) + '</p>'
  );
  MANIP.m = { set:pickSome([0,1,2,3,4,5], 4, rng), sel:null, solved:{}, tries:0, done:false, last:null,
    msg:{ es:'Toca una frase de la izquierda y después la prueba que le quita el argumento.', en:'Tap a sentence on the left and then the evidence that takes its argument away.' } };
  MANIP.m.left = shuffleIdx(MANIP.m.set.length, rng).map(function(k){ return MANIP.m.set[k]; });
  MANIP.m.right = shuffleIdx(MANIP.m.set.length, rng).map(function(k){ return MANIP.m.set[k]; });
  addWidget('wDesmonta', 'match');
  m_render();

  useVariant(pickVariant(V5(), rng), rng);
  useVariant(pickVariant(V6(), rng), rng);

  /* ── CONCEPTO 4 :: LO QUE QUEDA DESPUÉS ─────── */
  addSection(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Lo que queda cuando cae la ley', en:'What remains when the law falls' }),
    '<p>' + L({ es:'Derogar un artículo es rápido. Desarmar lo que ese artículo construyó durante un siglo toma mucho más, porque una construcción histórica se sostiene en tres planos a la vez: la ley, el reparto de recursos y las palabras con que se habla de un grupo. Cuando cae el primero, los otros dos siguen operando durante años.',
               en:'Repealing an article is quick. Dismantling what that article built over a century takes much longer, because a historical construction rests on three planes at once: the law, the distribution of resources and the words with which a group is spoken about. When the first one falls, the other two go on operating for years.' }) + '</p>' +
    '<p>' + L({ es:'Por eso los historiadores miden la distancia entre la fecha de una reforma y la fecha en que el derecho se ejerce de verdad. Y por eso aparecen medidas que no se limitan a permitir: cuando en 2019 se exigió que la mitad de las candidaturas y de los cargos correspondieran a mujeres, no se reconoció un derecho nuevo, porque ese derecho existía desde 1953. Lo que se atacó fue el tramo donde se perdía.',
               en:'That is why historians measure the distance between the date of a reform and the date when the right is actually exercised. And that is why measures appear that do not limit themselves to permitting: when in 2019 it was required that half of the candidacies and posts go to women, no new right was recognized, because that right had existed since 1953. What was attacked was the stretch where it was being lost.' }) + '</p>' +
    '<p>' + L({ es:'Hay algo más que aparece justo en ese tramo. Las dos construcciones que estudiaste se fabricaron en momentos distintos, pero caen sobre las mismas personas al mismo tiempo. Una mujer indígena no enfrenta el sexismo por un lado y el racismo por otro: enfrenta una situación que ninguno de los dos explica por separado, y los datos de ingreso y de acceso a la escuela lo muestran con claridad.',
               en:'There is something more that appears precisely in that stretch. The two constructions you studied were manufactured at different moments, but they fall on the same people at the same time. An indigenous woman does not face sexism on one side and racism on the other: she faces a situation that neither of the two explains separately, and the data on income and on access to school show it clearly.' }) + '</p>'
  );
  d_build(rng);

  useVariant(pickVariant(V7(), rng), rng);
  useVariant(pickVariant(V8(), rng), rng);

  /* ── CIERRE ─────────────────────────────────── */
  addSection(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Fechar es la mejor prueba', en:'Dating is the best proof' }),
    '<p>' + L({ es:'Ya tienes el método completo: buscar la fecha, buscar a los autores, buscar el interés y comparar con otros lugares y otras épocas. Las últimas dos preguntas no piden un dato suelto: piden que decidas qué pruebas sostienen una afirmación sobre el pasado y qué explicación resiste mejor cuando se le pone enfrente un contraejemplo.',
               en:'You now have the complete method: look for the date, look for the authors, look for the interest and compare with other places and other periods. The last two questions do not ask for a loose fact: they ask you to decide which evidence supports a claim about the past and which explanation holds up better when a counterexample is placed in front of it.' }) + '</p>'
  );

  useVariant(pickVariant(V9(), rng), rng);
  useVariant(pickVariant(V10(), rng), rng);
}
</script>
