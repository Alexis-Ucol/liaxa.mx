<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proporcionalidad y Porcentajes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

/* ── GUIDE WIDGETS (proporcionalidad y porcentajes) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.9rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.55rem .7rem; margin:.6rem 0; overflow-x:auto; text-align:center; }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.defsym { font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:700; color:var(--green-dark); }
.deftxt { font-size:.82rem; color:var(--text2); }
/* sliders + lecturas */
.slrow { display:flex; align-items:center; gap:.6rem; margin-top:.55rem; flex-wrap:wrap; }
.slrow input[type=range] { flex:1; min-width:130px; accent-color:var(--green); height:34px; }
.sllbl { font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--text3); min-width:96px; }
.slval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:64px; text-align:right; }
.statgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.45rem; margin-top:.6rem; }
.statcell { background:var(--surface2); border-radius:8px; padding:.5rem; text-align:center; }
.statlbl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); margin-bottom:.15rem; }
.statnum { font-family:'IBM Plex Mono',monospace; font-size:.92rem; font-weight:700; color:var(--green-dark); }
/* lienzos de los manipulativos */
.gvcanvas { display:block; width:100%; height:210px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.rectcanvas { display:block; width:100%; height:180px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
/* tablero de 100 */
.pgrid { display:grid; grid-template-columns:repeat(10,1fr); gap:2px; max-width:300px; margin:.6rem auto .4rem; }
.pcell { aspect-ratio:1 / 1; min-height:24px; border:1px solid var(--border); border-radius:3px; background:var(--surface2); cursor:pointer; padding:0; }
.pcell.on { background:var(--green); border-color:var(--green-dark); }
.pgbtns { display:flex; gap:.5rem; justify-content:center; margin-top:.4rem; }
.pgbtn { min-width:64px; min-height:44px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.95rem; font-weight:700; cursor:pointer; font-family:inherit; }
.pgbtn:hover { border-color:var(--green); color:var(--green); }
/* cadena de factores */
.chiprow { display:flex; flex-wrap:wrap; gap:.45rem; margin:.5rem 0 .2rem; }
.pchip { min-width:68px; min-height:44px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:700; cursor:pointer; padding:.25rem .55rem; }
.pchip:hover { border-color:var(--green); }
.pchip.sel { background:var(--green); border-color:var(--green-dark); color:#fff; }
.barrow { display:flex; align-items:center; gap:.5rem; margin-top:.45rem; }
.barlbl { font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--text3); min-width:74px; }
.bartrack { flex:1; background:var(--surface2); border-radius:6px; height:18px; overflow:hidden; }
.barfill { height:100%; background:var(--green); }
.barfill.acc { background:var(--gold); }
@media (max-width: 600px) {
  .defgrid { grid-template-columns:1fr; }
  .statgrid { grid-template-columns:repeat(3,1fr); }
  .pcell { min-height:20px; }
  .pchip { min-width:60px; font-size:.82rem; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Proporcionalidad y Porcentajes</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático II · Sem 2</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">

function getAttemptKey(name, group){ return 'liaxa_pm2_t04_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

   STATE

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_pm2_t04_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_pm2_t04_g01__' + (name + '__' + group).replace(/\s+/g, '_');

  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

      saved.texts.forEach(function(text, i) {

        if (ta) ta.value = text;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ================================================
   buildLesson: Proporcionalidad y Porcentajes (Pensamiento Matematico II, Sem 2)
   Interleaved: concepto -> manipulativo -> problema(s). Cards built inline.
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function isEn(){ return LANG === 'en'; }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function pickOne(arr){ return arr[Math.floor(rng()*arr.length)]; }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : '#000'; }
    catch(e){ return '#000'; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 180;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function gcd2(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
  function mf(n,d){
    return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>';
  }
  function fr(n,d){ var g = gcd2(n,d) || 1; var a = n/g, b = d/g; return b === 1 ? String(a) : mf(a,b); }
  function nu(x){
    var r = Math.round(x*100)/100;
    if (Math.abs(r - Math.round(r)) < 1e-9) return String(Math.round(r));
    return String(r);
  }
  function sep(x){ return nu(x).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function money(x){ return '$ ' + sep(x); }
  function pc(x){ return nu(x) + ' %'; }
  function fac(x){ return (Math.round(x*1000)/1000).toFixed(2); }
  function optVals(correct, cands, allowNeg){
    var out = [correct], i, v;
    for (i=0;i<cands.length && out.length<4;i++){
      v = cands[i];
      if (v === null || v === undefined || !isFinite(v)) continue;
      v = Math.round(v*100)/100;
      if (!allowNeg && v <= 0) continue;
      if (out.indexOf(v) < 0) out.push(v);
    }
    var k = 1, c1, c2;
    while (out.length < 4 && k < 400){
      c1 = Math.round((correct + k)*100)/100;
      c2 = Math.round((correct - k)*100)/100;
      if (out.indexOf(c1) < 0) out.push(c1);
      if (out.length < 4 && (allowNeg || c2 > 0) && out.indexOf(c2) < 0) out.push(c2);
      k++;
    }
    return out;
  }
  function withU(vals, u){
    var out = [], i;
    for (i=0;i<vals.length;i++) out.push(sep(vals[i]) + ' ' + u);
    return out;
  }
  function withM(vals){
    var out = [], i;
    for (i=0;i<vals.length;i++) out.push(money(vals[i]));
    return out;
  }
  function withP(vals){
    var out = [], i;
    for (i=0;i<vals.length;i++) out.push(pc(vals[i]));
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),

  /* problemas */

      p1m = p1a + ri(2,8), p1d = p1k*p1m;

  var p3b = pickOne([{v:60,t1:6,t2:4},{v:80,t1:3,t2:4},{v:45,t1:8,t2:6},{v:50,t1:9,t2:5},{v:90,t1:4,t2:6},{v:75,t1:8,t2:5}]);

  var p4k = pickOne([36,48,60,72]), p4bad = ri(0,3), p4del = pickOne([1,2,3]);
  var p4xs = [];
  (function(){
    var d, divs = [];
    for (d=2; d<=24; d++){ if (p4k % d === 0 && p4k/d >= 2 && p4k/d <= 24) divs.push(d); }
    p4xs = shufA(divs).slice(0,4);
    while (p4xs.length < 4) p4xs.push(p4xs[0] + p4xs.length);
  })();

  var p5Q = pickOne([40,60,80,120,140,160,200,240]), p5p = pickOne([15,25,35,45,55,65,75]);
  var p6Q = pickOne([240,320,480,600,800,900,1200]), p6p = pickOne([10,15,20,25,30,40]);

  var DIRSIT = [
    {es:'El número de litros de gasolina cargados y el importe total pagado.', en:'The number of litres of fuel loaded and the total amount paid.'},
    {es:'La cantidad de tela empleada y el número de camisas iguales que se cortan.', en:'The amount of cloth used and the number of identical shirts that are cut.'},

  ];

  var p10b = pickOne([{r1:3,r2:2,T:45,p:50},{r1:5,r2:3,T:64,p:25},{r1:4,r2:1,T:60,p:50},{r1:7,r2:3,T:80,p:25}]);

  /* ============================================================

  sec(T({es:'Concepto 1', en:'Concept 1'}),

        es:'Una razón compara dos cantidades mediante su cociente, y una proporción afirma que dos razones valen lo mismo. Cuando todas las parejas de una situación conservan ese cociente, la relación entre las variables es de variación directa y el valor común del cociente recibe el nombre de constante de proporcionalidad.',
        en:'A ratio compares two quantities through their quotient, and a proportion states that two ratios are worth the same. When every pair in a situation keeps that quotient, the relation between the variables is a direct variation and the shared value of the quotient is called the constant of proportionality.'
      })+'</p>'+

        '<div class="defcell"><div class="defname">'+T({es:'Constante',en:'Constant'})+'</div><div class="defsym">k = y : x</div><div class="deftxt">'+T({es:'El cociente entre las cantidades emparejadas no cambia.',en:'The quotient of the paired quantities does not change.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Modelo',en:'Model'})+'</div><div class="defsym">y = kx</div><div class="deftxt">'+T({es:'Conocida k, cada valor de x determina el de y.',en:'Once k is known, each value of x determines the value of y.'})+'</div></div>'+

        '<div class="defcell"><div class="defname">'+T({es:'Productos cruzados',en:'Cross products'})+'</div><div class="defsym">a · d = b · c</div><div class="deftxt">'+T({es:'Herramienta para hallar el término faltante de una proporción.',en:'A tool for finding the missing term of a proportion.'})+'</div></div>'+
      '</div>'+
      '<p>'+T({
        es:'La marca distintiva de la variación directa es el efecto del escalado: al multiplicar x por cualquier número positivo, y queda multiplicada por ese mismo número. Por eso conviene desconfiar de las relaciones que solo suman una cantidad fija, porque en ellas el cociente '+mf('y','x')+' cambia de una pareja a otra y la gráfica no pasa por el origen.',
        en:'The distinctive mark of direct variation is the scaling effect: multiplying x by any positive number multiplies y by that same number. Relations that merely add a fixed amount deserve suspicion, because in them the quotient '+mf('y','x')+' changes from one pair to the next and the graph misses the origin.'

  /* ---- MANIPULATIVO 1: la recta que atrapa al punto ---- */
  (function(){
    var wrap = widget('directa');
    var st = { r:0, k:1, tries:0, done:false, lock:false, reveal:false };
    function R(){ return w1[st.r]; }
    function draw(){
      var cv = document.getElementById('dpCv');
      if (!cv) return;
      var F = fitCv(cv), ctx = F.ctx, w = F.w, h = F.h, r = R();
      var padL = 32, padB = 24, padT = 12, padR = 12, XMAX = 8, YMAX = 28, i;
      function X(v){ return padL + v/XMAX*(w - padL - padR); }
      function Y(v){ return h - padB - v/YMAX*(h - padB - padT); }
      ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
      for (i=1;i<=XMAX;i++){ ctx.beginPath(); ctx.moveTo(X(i),Y(0)); ctx.lineTo(X(i),Y(YMAX)); ctx.stroke(); }
      for (i=4;i<=YMAX;i+=4){ ctx.beginPath(); ctx.moveTo(X(0),Y(i)); ctx.lineTo(X(XMAX),Y(i)); ctx.stroke(); }
      ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1.4;

        en:'When the final amount and the applied factor are known, the initial amount is recovered by dividing by that factor, because dividing undoes exactly what the multiplication did.'
      })+'</p></div>');

  /* ---- MANIPULATIVO 4: cadena de factores ---- */
  (function(){
    var wrap = widget('cadena');
    var CH = [10,20,25,50,-10,-20,-25,-50];
    var st = { r:0, sel:[], tries:0, done:false, lock:false };
    function R(){ return w4[st.r]; }
    function facOf(p){ return (100 + p)/100; }
    function netOf(){
      var f = 1, i;
      for (i=0;i<st.sel.length;i++) f *= facOf(CH[st.sel[i]]);
      return Math.round((f - 1)*10000)/100;
    }
    function chipTxt(p){ return (p > 0 ? '+' : '−') + Math.abs(p) + ' %'; }
    function netTxt(p){
      if (Math.abs(p) < 1e-9) return T({es:'sin cambio neto', en:'no net change'});
      if (p > 0) return T({es:'aumento neto de ', en:'net increase of '}) + nu(p) + ' %';
      return T({es:'disminución neta de ', en:'net decrease of '}) + nu(-p) + ' %';
    }
    function chainTxt(){
      var i, s = '1.00';
      for (i=0;i<st.sel.length;i++) s += ' · ' + fac(facOf(CH[st.sel[i]]));
      var f = 1;
      for (i=0;i<st.sel.length;i++) f *= facOf(CH[st.sel[i]]);
      return s + ' = ' + fac(f);
    }
    function barsHtml(){
      var f = 1, i;
      for (i=0;i<st.sel.length;i++) f *= facOf(CH[st.sel[i]]);
      var wA = 50, wB = Math.max(2, Math.min(100, 50*f));
      return '<div class="barrow"><span class="barlbl">'+T({es:'inicial',en:'initial'})+'</span><span class="bartrack"><span class="barfill" style="width:'+wA+'%"></span></span></div>'+
             '<div class="barrow"><span class="barlbl">'+T({es:'final',en:'final'})+'</span><span class="bartrack"><span class="barfill acc" style="width:'+wB+'%"></span></span></div>';
    }
    function chipsHtml(){
      var out = '', i;
      for (i=0;i<CH.length;i++) out += '<button class="pchip'+(st.sel.indexOf(i) >= 0 ? ' sel' : '')+'" onclick="chTap('+i+')">'+chipTxt(CH[i])+'</button>';
      return out;
    }
    function nudge(){
      var fb = document.getElementById('chFb'), r = R(), n;
      if (!fb) return;
      if (st.sel.length < 2){ fb.textContent = T({es:'Elige dos cambios para formar la cadena.', en:'Choose two changes to form the chain.'}); return; }
      n = netOf();
      if (Math.abs(n - r.net) < 0.001) fb.textContent = T({es:'La cadena alcanza la meta. Verifica para confirmar.', en:'The chain reaches the goal. Check to confirm.'});
      else if (n > r.net) fb.textContent = T({es:'Tu variación neta quedó por encima de la meta: prueba con un cambio menos favorable.', en:'Your net variation ended up above the goal: try a less favourable change.'});
      else fb.textContent = T({es:'Tu variación neta quedó por debajo de la meta: prueba con un cambio más favorable.', en:'Your net variation ended up below the goal: try a more favourable change.'});
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Cadena de factores', en:'Chain of factors'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Actividad completa',en:'Activity complete'})+'</div>'+
          '<div class="rfb">'+T({
            es:'El orden de los cambios no altera el resultado porque los factores se multiplican, pero sumar los porcentajes sí lo altera, y ahí nace el error más frecuente.',
            en:'The order of the changes does not alter the result because the factors multiply, yet adding the percentages does alter it, and that is where the most frequent error is born.'
          })+'</div></div>';
        return;
      }
      var r = R();
      st.sel = [];
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Cadena de factores', en:'Chain of factors'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Selecciona dos cambios y observa cómo se multiplican los factores y cómo se mueve la barra del precio final. Toca de nuevo un cambio para retirarlo.',
            en:'Select two changes and watch the factors multiply and the final price bar move. Tap a change again to remove it.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Ronda ',en:'Round '})+(st.r+1)+' / 3</div>'+
          '<div class="goalbar">'+T({es:'Meta: forma una cadena de dos cambios cuya variación neta sea de ', en:'Goal: build a chain of two changes whose net variation is '})+netTxt(r.net)+'.</div>'+
          '<div class="chiprow" id="chChips">'+chipsHtml()+'</div>'+
          '<div class="dataline" id="chLine">'+chainTxt()+'</div>'+
          '<div id="chBars">'+barsHtml()+'</div>'+
          '<div class="statgrid" id="chStats">'+statsHtml()+'</div>'+
          '<button class="rverify-btn" onclick="chChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="chFb"></div>'+
        '</div>';
      setTimeout(function(){ nudge(); }, 60);
    }
    function statsHtml(){
      var r = R(), n = netOf();
      return '<div class="statcell"><div class="statlbl">'+T({es:'Cambios elegidos',en:'Changes chosen'})+'</div><div class="statnum">'+st.sel.length+' / 2</div></div>'+
             '<div class="statcell"><div class="statlbl">'+T({es:'Variación neta',en:'Net variation'})+'</div><div class="statnum">'+nu(n)+' %</div></div>'+
             '<div class="statcell"><div class="statlbl">'+T({es:'Meta',en:'Goal'})+'</div><div class="statnum">'+nu(r.net)+' %</div></div>';
    }
    function refresh(){
      var c = document.getElementById('chChips'); if (c) c.innerHTML = chipsHtml();
      var l = document.getElementById('chLine'); if (l) l.textContent = chainTxt();
      var b = document.getElementById('chBars'); if (b) b.innerHTML = barsHtml();
      var s = document.getElementById('chStats'); if (s) s.innerHTML = statsHtml();
      nudge();
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.lock = false; st.r++; st.tries = 0;
        if (st.r >= w4.length) st.done = true;
        render();
      }, ms);
    }
    window.chTap = function(i){
      if (st.done || st.lock) return;
      var at = st.sel.indexOf(i);
      if (at >= 0) st.sel.splice(at,1);
      else { if (st.sel.length >= 2) st.sel.shift(); st.sel.push(i); }
      refresh();
    };
    window.chChk = function(){
      if (st.done || st.lock) return;
      var r = R(), fb = document.getElementById('chFb');
      if (!fb) return;
      if (st.sel.length === 2 && Math.abs(netOf() - r.net) < 0.001){
        fb.innerHTML = '<span class="okmsg">'+T({es:'Correcto. ',en:'Correct. '})+'</span>'+T({
          es:'El producto de los dos factores vale '+fac(1 + r.net/100)+', y esa es la única lectura fiel del cambio total.',
          en:'The product of the two factors equals '+fac(1 + r.net/100)+', and that is the only faithful reading of the total change.'
        });
        adv(2200); return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.sel = [CH.indexOf(r.a), CH.indexOf(r.b)];
        refresh();
        var fb2 = document.getElementById('chFb');
        if (fb2) fb2.innerHTML = T({
          es:'Una cadena que cumple la meta es esta: '+fac(facOf(r.a))+' por '+fac(facOf(r.b))+' da '+fac(facOf(r.a)*facOf(r.b))+', es decir una '+netTxt(r.net)+'.',
          en:'A chain that meets the goal is this one: '+fac(facOf(r.a))+' times '+fac(facOf(r.b))+' gives '+fac(facOf(r.a)*facOf(r.b))+', that is a '+netTxt(r.net)+'.'
        });
        adv(3400); return;
      }
      nudge();
    };
    render();
  })();

  /* ---- P7 ---- */
  (function(){
    var p1 = p7[0], p2 = p7[1], net = p7[2];
    function netTxt2(p, en){
      if (Math.abs(p) < 1e-9) return en ? 'The final price equals the initial one.' : 'El precio final es igual al inicial.';
      if (p > 0) return (en ? 'An increase of ' : 'Un aumento del ') + nu(p) + ' %.';
      return (en ? 'A decrease of ' : 'Una disminución del ') + nu(-p) + ' %.';
    }
    if (v7 === 0){
      var vals = optVals(net, [p1 + p2, -net, net + 5, net - 5], true);
      var oes = [], oen = [], i;
      for (i=0;i<vals.length;i++){ oes.push(netTxt2(vals[i], false)); oen.push(netTxt2(vals[i], true)); }
      addProb({
        title:{es:'Dos cambios seguidos', en:'Two changes in a row'},
        q:{es:'El precio de una bicicleta subió un '+p1+' % al inicio del verano y después bajó un '+Math.abs(p2)+' % en la liquidación de temporada. Determina la variación neta respecto al precio que tenía antes de ambos cambios.',
           en:'The price of a bicycle rose by '+p1+' % at the start of summer and later fell by '+Math.abs(p2)+' % in the season clearance. Determine the net variation with respect to the price it had before both changes.'},
        options:{es:oes, en:oen}, correct:{es:netTxt2(net,false), en:netTxt2(net,true)},
        hint:{es:'Traduce cada cambio a su factor y multiplícalos, porque el segundo cambio se calcula sobre un precio ya modificado. La diferencia entre el producto y la unidad revela la variación neta.',
              en:'Translate each change into its factor and multiply them, because the second change is computed on an already modified price. The difference between the product and one reveals the net variation.'},
        exp:{es:'Los factores son '+fac(1+p1/100)+' y '+fac(1+p2/100)+', y su producto vale '+fac((1+p1/100)*(1+p2/100))+'. Ese resultado corresponde a '+netTxt2(net,false).toLowerCase()+' Restar los porcentajes daría '+nu(p1+p2)+' %, cifra que ignora que el segundo cambio actúa sobre otra base.',
             en:'The factors are '+fac(1+p1/100)+' and '+fac(1+p2/100)+', and their product equals '+fac((1+p1/100)*(1+p2/100))+'. That result corresponds to '+netTxt2(net,true).toLowerCase()+' Subtracting the percentages would give '+nu(p1+p2)+' %, a figure that ignores that the second change acts on a different base.'},
        showWork:true
      });
    } else {
      var fin = Math.round(p7Q*(1 + net/100)*100)/100;
      var vals2 = optVals(fin, [p7Q*(1 + (p1+p2)/100), p7Q*(1+p1/100), p7Q*(1+p2/100), fin + 20]);
      addProb({
        title:{es:'Dos cambios seguidos', en:'Two changes in a row'},
        q:{es:'Una bicicleta costaba '+money(p7Q)+', subió un '+p1+' % al inicio del verano y después bajó un '+Math.abs(p2)+' % en la liquidación de temporada. Determina el precio final.',
           en:'A bicycle cost '+money(p7Q)+', rose by '+p1+' % at the start of summer and later fell by '+Math.abs(p2)+' % in the season clearance. Determine the final price.'},
        options:{es:withM(vals2), en:withM(vals2)}, correct:{es:money(fin), en:money(fin)},
        hint:{es:'Aplica los cambios en cadena: convierte cada porcentaje en factor y multiplica el precio inicial por ambos, uno después del otro. El precio intermedio es la base del segundo cambio.',
              en:'Apply the changes as a chain: turn each percentage into a factor and multiply the initial price by both, one after the other. The intermediate price is the base of the second change.'},
        exp:{es:'Tras el aumento el precio es '+money(p7Q*(1+p1/100))+', y al aplicarle el factor '+fac(1+p2/100)+' resulta '+money(fin)+'. El producto de los dos factores vale '+fac((1+p1/100)*(1+p2/100))+', de modo que la variación neta es de '+nu(net)+' %.',
             en:'After the increase the price is '+money(p7Q*(1+p1/100))+', and applying the factor '+fac(1+p2/100)+' to it gives '+money(fin)+'. The product of the two factors equals '+fac((1+p1/100)*(1+p2/100))+', so the net variation is '+nu(net)+' %.'},
        showWork:true
      });
    }
  })();

  /* ---- P8 ---- */
  (function(){
    if (v8 === 0){
      var F = p8O*(100 - p8p)/100;
      var vals = optVals(p8O, [Math.round(F*(1 + p8p/100)), F + p8p*10, p8O + 100, p8O - 100]);
      addProb({
        title:{es:'El precio antes del descuento', en:'The price before the discount'},
        q:{es:'Una tableta se vendió con un descuento del '+p8p+' % y el cliente pagó '+money(F)+'. Determina el precio que tenía antes del descuento.',
           en:'A tablet was sold with a discount of '+p8p+' % and the customer paid '+money(F)+'. Determine the price it had before the discount.'},
        options:{es:withM(vals), en:withM(vals)}, correct:{es:money(p8O), en:money(p8O)},
        hint:{es:'Identifica qué porcentaje del precio original quedó reflejado en lo que se pagó y escribe ese porcentaje como factor. La cantidad original se recupera dividiendo lo pagado entre ese factor.',
              en:'Identify what percentage of the original price ended up reflected in what was paid and write that percentage as a factor. The original amount is recovered by dividing what was paid by that factor.'},
        exp:{es:'Lo pagado representa el '+(100-p8p)+' % del precio original, así que el original es '+money(F)+' entre '+nu((100-p8p)/100)+', es decir '+money(p8O)+'. Aplicar el '+p8p+' % al precio ya rebajado usaría la base equivocada y devolvería otra cifra.',
             en:'What was paid represents '+(100-p8p)+' % of the original price, so the original is '+money(F)+' divided by '+nu((100-p8p)/100)+', that is '+money(p8O)+'. Applying '+p8p+' % to the already reduced price would use the wrong base and would return a different figure.'},
        showWork:true
      });
    } else {
      var N = p8P*(100 + p8q)/100;
      var vals2 = optVals(p8P, [Math.round(N*(100 - p8q)/100), N - p8q*10, p8P - 200, p8P + 200]);
      addProb({
        title:{es:'La población anterior', en:'The earlier population'},
        q:{es:'Una comunidad creció un '+p8q+' % en una década y ahora registra '+sep(N)+' habitantes. Determina cuántos habitantes tenía al inicio de la década.',
           en:'A community grew by '+p8q+' % in one decade and now records '+sep(N)+' inhabitants. Determine how many inhabitants it had at the start of the decade.'},
        options:{es:withU(vals2,'habitantes'), en:withU(vals2,'inhabitants')},
        correct:{es:sep(p8P)+' habitantes', en:sep(p8P)+' inhabitants'},
        hint:{es:'La población actual es la anterior multiplicada por el factor de crecimiento, que se forma sumando el porcentaje escrito en decimal a la unidad. Para volver atrás hay que dividir entre ese factor.',
              en:'The current population is the earlier one multiplied by the growth factor, formed by adding the percentage written in decimal form to one. Going back requires dividing by that factor.'},
        exp:{es:'El factor de crecimiento es '+fac(1 + p8q/100)+', así que la población inicial es '+sep(N)+' entre '+fac(1 + p8q/100)+', es decir '+sep(p8P)+' habitantes. Restar el '+p8q+' % a la población actual tomaría como base el total equivocado.',
             en:'The growth factor is '+fac(1 + p8q/100)+', so the initial population is '+sep(N)+' divided by '+fac(1 + p8q/100)+', that is '+sep(p8P)+' inhabitants. Subtracting '+p8q+' % from the current population would take the wrong total as the base.'},
        showWork:true
      });
    }
  })();

  /* ---- P9 ---- */
  (function(){
    if (v9 === 0){
      var oes = [p9inv[0].es, p9dir[0].es, p9dir[1].es, p9dir[2].es];
      var oen = [p9inv[0].en, p9dir[0].en, p9dir[1].en, p9dir[2].en];
      addProb({
        title:{es:'Qué se conserva en cada situación', en:'What is preserved in each situation'},
        q:{es:'Cuatro situaciones relacionan dos cantidades que cambian juntas. Selecciona aquella en la que el producto de las dos cantidades permanece constante.',
           en:'Four situations relate two quantities that change together. Select the one in which the product of the two quantities stays constant.'},
        options:{es:oes, en:oen}, correct:{es:oes[0], en:oen[0]},
        hint:{es:'Imagina que duplicas la primera cantidad de cada situación y observa qué le ocurre a la segunda. Si se reduce a la mitad, el producto se conserva; si también se duplica, lo que se conserva es el cociente.',
              en:'Imagine doubling the first quantity of each situation and watch what happens to the second. If it halves, the product is preserved; if it doubles as well, what is preserved is the quotient.'},
        exp:{es:'En la situación correcta el trabajo total ya está fijado, así que repartirlo entre más participantes reduce en la misma proporción lo que toca a cada uno y el producto se mantiene. En las otras tres, duplicar la primera cantidad duplica la segunda, señal de que el cociente es lo constante.',
             en:'In the correct situation the total work is already fixed, so sharing it among more participants reduces what falls to each one in the same proportion and the product is maintained. In the other three, doubling the first quantity doubles the second, a sign that the quotient is what stays constant.'},
        showWork:false
      });
    } else {
      var oes2 = [p9dir[0].es, p9inv[0].es, p9inv[1].es, p9inv[2].es];
      var oen2 = [p9dir[0].en, p9inv[0].en, p9inv[1].en, p9inv[2].en];
      addProb({
        title:{es:'Qué se conserva en cada situación', en:'What is preserved in each situation'},
        q:{es:'Cuatro situaciones relacionan dos cantidades que cambian juntas. Selecciona aquella en la que el cociente de las dos cantidades permanece constante.',
           en:'Four situations relate two quantities that change together. Select the one in which the quotient of the two quantities stays constant.'},
        options:{es:oes2, en:oen2}, correct:{es:oes2[0], en:oen2[0]},
        hint:{es:'Prueba con el doble de la primera cantidad en cada situación. Cuando la segunda también se duplica, el cociente sobrevive al cambio; cuando se reduce a la mitad, lo que sobrevive es el producto.',
              en:'Try doubling the first quantity in each situation. When the second one doubles too, the quotient survives the change; when it halves, what survives is the product.'},
        exp:{es:'En la situación correcta cada unidad añadida aporta siempre la misma cantidad, de modo que el cociente entre las dos magnitudes no cambia y la gráfica sería una recta por el origen. Las otras tres reparten una cantidad total ya fijada, y ahí lo constante es el producto.',
             en:'In the correct situation each added unit always contributes the same amount, so the quotient between the two magnitudes does not change and the graph would be a line through the origin. The other three share out an already fixed total, and there what stays constant is the product.'},
        showWork:false
      });
    }
  })();

  /* ---- P10 ---- */
  (function(){
    if (v10 === 0){
      var need = p10a.b*p10a.c/p10a.a, tot = need*100/(100 - p10a.p);
      var vals = optVals(tot, [need, Math.round(need*(100 + p10a.p)/100), need + p10a.p, tot + 10]);
      addProb({
        title:{es:'Compra con material defectuoso', en:'Purchase with defective material'},
        q:{es:'Un taller arma '+p10a.a+' sillas con '+p10a.b+' tablones, siempre en la misma proporción. Debe entregar '+p10a.c+' sillas y sabe que el '+p10a.p+' % de los tablones que compra sale defectuoso y no puede usarse. Determina cuántos tablones debe comprar.',
           en:'A workshop assembles '+p10a.a+' chairs from '+p10a.b+' planks, always in the same proportion. It must deliver '+p10a.c+' chairs and knows that '+p10a.p+' % of the planks it buys come out defective and cannot be used. Determine how many planks it must buy.'},
        options:{es:withU(vals,'tablones'), en:withU(vals,'planks')},
        correct:{es:sep(tot)+' tablones', en:sep(tot)+' planks'},
        hint:{es:'Resuelve por etapas: primero usa la proporción entre tablones y sillas para saber cuántos tablones útiles hacen falta. Después reconoce que los útiles son solo una fracción de los comprados y recupera el total dividiendo entre el factor correspondiente.',
              en:'Solve in stages: first use the proportion between planks and chairs to know how many usable planks are needed. Then recognise that the usable ones are only a fraction of those bought and recover the total by dividing by the matching factor.'},
        exp:{es:'La proporción da '+p10a.b+' por '+p10a.c+' entre '+p10a.a+', es decir '+need+' tablones útiles. Como los útiles son el '+(100-p10a.p)+' % de la compra, se necesitan '+need+' entre '+nu((100-p10a.p)/100)+', o sea '+tot+' tablones. Quedarse en '+need+' ignoraría por completo el material perdido.',
             en:'The proportion gives '+p10a.b+' times '+p10a.c+' over '+p10a.a+', that is '+need+' usable planks. Since the usable ones are '+(100-p10a.p)+' % of the purchase, '+need+' divided by '+nu((100-p10a.p)/100)+' are needed, that is '+tot+' planks. Stopping at '+need+' would ignore the lost material entirely.'},
        showWork:true
      });
    } else {
      var base = p10b.T*p10b.r2/(p10b.r1 + p10b.r2), fin2 = base*(100 + p10b.p)/100;
      var vals2 = optVals(fin2, [base, p10b.T*p10b.r1/(p10b.r1 + p10b.r2), base + p10b.p, fin2 + 6]);
      addProb({
        title:{es:'Reparto en una razón y ajuste', en:'Sharing in a ratio and an adjustment'},
        q:{es:'Una mezcla para firme combina arena y cemento en la razón '+p10b.r1+' a '+p10b.r2+', y se preparan '+p10b.T+' kilogramos de mezcla. Para reforzarla se aumenta el cemento un '+p10b.p+' % sin tocar la arena. Determina la cantidad final de cemento.',
           en:'A slab mix combines sand and cement in the ratio '+p10b.r1+' to '+p10b.r2+', and '+p10b.T+' kilograms of mix are prepared. To strengthen it the cement is raised by '+p10b.p+' % without touching the sand. Determine the final amount of cement.'},
        options:{es:withU(vals2,'kilogramos'), en:withU(vals2,'kilograms')},
        correct:{es:sep(fin2)+' kilogramos', en:sep(fin2)+' kilograms'},
        hint:{es:'Suma primero los términos de la razón para saber en cuántas partes iguales se divide la mezcla y calcula cuánto pesa la porción de cemento. Al resultado aplícale el factor de aumento correspondiente.',
              en:'First add the terms of the ratio to know into how many equal parts the mix divides and compute how much the cement portion weighs. Then apply the matching increase factor to that result.'},
        exp:{es:'La mezcla se divide en '+(p10b.r1+p10b.r2)+' partes iguales de '+nu(p10b.T/(p10b.r1+p10b.r2))+' kilogramos, y al cemento le tocan '+p10b.r2+' de ellas, es decir '+base+' kilogramos. Con el factor '+fac(1 + p10b.p/100)+' la cantidad final es '+nu(fin2)+' kilogramos. La porción de '+nu(p10b.T*p10b.r1/(p10b.r1+p10b.r2))+' kilogramos corresponde a la arena.',
             en:'The mix divides into '+(p10b.r1+p10b.r2)+' equal parts of '+nu(p10b.T/(p10b.r1+p10b.r2))+' kilograms, and the cement takes '+p10b.r2+' of them, that is '+base+' kilograms. With the factor '+fac(1 + p10b.p/100)+' the final amount is '+nu(fin2)+' kilograms. The portion of '+nu(p10b.T*p10b.r1/(p10b.r1+p10b.r2))+' kilograms corresponds to the sand.'},
        showWork:true
      });
    }
  })();
}

  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
