<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Revolución Francesa y los Movimientos Independentistas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:75px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 57px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">La Revolución Francesa y los Movimientos Independentistas</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">La Revolución Francesa y los Movimientos Independentistas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c54', primaryDark:'#182a3b', primaryBg:'#eaeef3',
  accent:'#e4243c', accentBg:'#fbdfe2',
  darkPrimary:'#5e85ab', darkPrimaryDark:'#8badce', darkPrimaryBg:'#152331',

    choices: problems.map(function(p) { return p.studentChoice; }),

}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

var MANIP = {};
function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function addProblem(spec, rng){
  var so = shuffleOpts(spec.options, spec.correct, rng);
  var p = { title: spec.title, questionText: spec.questionText, fn: '', hint: spec.hint || '',
            explanation: spec.explanation || '', options: so.options, correctIdx: so.correctIdx,
            showWork: !!spec.showWork, studentChoice: null, pendingChoice: null };

/* ── MANIPULABLE A :: la pirámide de los tres estamentos ── */

  { c:2, es:'Sostiene con su trabajo y sus contribuciones el gasto del reino', en:'Sustains the spending of the kingdom with its work and its contributions' }
];
function mA_build(rng){
  var byc = [[],[],[]], i, c;
  for (i = 0; i < ESTCARDS.length; i++) byc[ESTCARDS[i].c].push(i);
  var sel = [];
  for (c = 0; c < 3; c++){ var o = shuffleIdx(byc[c].length, rng); sel.push(byc[c][o[0]]); sel.push(byc[c][o[1]]); }
  var cards = shuffleIdx(sel.length, rng).map(function(k){ return sel[k]; });
  MANIP.A = { cards: cards, cur: cards.map(function(){ return Math.floor(rng() * 3); }),
              lock: cards.map(function(){ return false; }), mark: {}, tries: 0, done: false, fb: '', fbk: '' };
}
function mA_render(){
  var A = MANIP.A, z = document.getElementById('mzA');

  for (c = 0; c < 3; c++){
    var inner = '';
    for (i = 0; i < A.cards.length; i++){
      if (A.cur[i] !== c) continue;
      var cls = 'pycard' + (A.mark[i] ? ' ' + A.mark[i] : '') + (A.lock[i] ? ' lock' : '');
      inner += '<div class="' + cls + '" onclick="mA_tap(' + i + ')">' + L(ESTCARDS[A.cards[i]]) + '</div>';

                              en:'Each tap moves the card to the next level of the pyramid. When the board convinces you, check it.' }) + '</div>' +
    '<div class="pyr">' + rows + '</div>' +
    (A.done ? '' : '<div class="mzrow"><button class="mzbtn" onclick="mA_check()">' + L({ es:'Revisar la pirámide', en:'Check the pyramid' }) + '</button></div>') +
    '<div class="mzfb' + (A.fbk ? ' ' + A.fbk : '') + '">' + A.fb + '</div>';

function mA_tap(i){
  var A = MANIP.A;
  if (!A || A.done || A.lock[i]) return;
  A.cur[i] = (A.cur[i] + 1) % 3;

function mA_check(){

  A.mark = {};

    if (ESTCARDS[A.cards[i]].c === A.cur[i]){ A.mark[i] = 'ok'; A.lock[i] = true; }
    else { A.mark[i] = 'bad'; wrong++; }

  if (wrong === 0){
    A.done = true; A.fbk = 'ok';
    A.fb = L({ es:'Pirámide completa: el clero y la nobleza aportan rentas, cargos y exenciones; el tercer estado aporta población, trabajo e impuestos. Ese reparto desigual es el punto de partida de 1789.',
               en:'Pyramid complete: the clergy and the nobility bring rents, offices and exemptions; the third estate brings population, work and taxes. That unequal arrangement is the starting point of 1789.' });

      for (i = 0; i < A.cards.length; i++){ A.cur[i] = ESTCARDS[A.cards[i]].c; A.mark[i] = 'ok'; A.lock[i] = true; }

                 en:'This is how the pyramid stands: two estates with privileges and exemptions above, and below the one that sustained the spending of the kingdom.' });
    } else {

             L({ es:' tarjetas en el nivel equivocado. Las marcadas en rojo se pueden seguir moviendo: fíjate si describen un privilegio o una carga.',
                 en:' cards on the wrong level. The ones marked in red can still be moved: notice whether they describe a privilege or a burden.' });
    }
  }
  mA_render();
}

/* ── MANIPULABLE B :: el tablero de los Estados Generales (3 rondas, Regla 8 patrón B) ── */
function mB_build(rng){
  var r = [], i;
  for (i = 0; i < 3; i++){
    var c = 280 + 10 * Math.floor(rng() * 5);
    var n = 270 + 10 * Math.floor(rng() * 5);
    var t;
    if (i === 0) t = c + n;
    else if (i === 1) t = c + n - 20 * (1 + Math.floor(rng() * 3));
    else t = c + n + 20 * (1 + Math.floor(rng() * 3));
    var total = c + n + t;
    var need = Math.floor(total / 2) + 1;
    var min = need - t; if (min < 0) min = 0;
    r.push({ c:c, n:n, t:t, total:total, need:need, min:min });
  }
  MANIP.B = { r: r, round: 0, tries: 0, allies: 0, rule: 'orden', done: false, fb: '', fbk: '' };
}
function mB_state(){
  var B = MANIP.B, d = B.r[B.round];
  var fav = d.t + B.allies, con = d.c + d.n - B.allies;
  return { d:d, fav:fav, con:con, pass:(B.rule === 'cabeza' && fav > con) };
}
function mB_render(){
  var B = MANIP.B, z = document.getElementById('mzB');
  if (!B || !z) return;
  if (B.done){
    z.innerHTML = '<div class="mztitle">' + L({ es:'Tres votaciones, una misma conclusión', en:'Three votes, one same conclusion' }) + '</div>' +
                  '<div class="mzfb ok">' + B.fb + '</div>';
    return;
  }
  var s = mB_state(), d = s.d;
  var pf = Math.round(s.fav / d.total * 100), pc = 100 - pf;
  var verdict = (B.rule === 'orden')
    ? L({ es:'Voto por estamento: 1 voto a favor contra 2 en contra. La propuesta se rechaza.', en:'Vote by estate: 1 vote in favour against 2 against. The proposal is rejected.' })
    : (s.pass ? L({ es:'Voto por cabeza: la propuesta se aprueba.', en:'Vote by head: the proposal passes.' })
              : L({ es:'Voto por cabeza: la propuesta se rechaza.', en:'Vote by head: the proposal is rejected.' }));
  z.innerHTML =
    '<div class="mzstep">' + L({ es:'Votación', en:'Vote' }) + ' ' + (B.round + 1) + ' / 3</div>' +
    '<div class="mztitle">' + L({ es:'Consigue que la propuesta del tercer estado se apruebe con el menor número posible de aliados',

    '<div class="vboard">' +

        '<div class="vcell"><div class="vlbl">' + L(ESTCOL[1]) + '</div><div class="vnum">' + d.n + '</div></div>' +
        '<div class="vcell third"><div class="vlbl">' + L(ESTCOL[2]) + '</div><div class="vnum">' + d.t + '</div></div>' +
      '</div>' +
      '<div class="mzrow">' +
        '<button class="' + (B.rule === 'orden' ? 'mzbtn' : 'mzbtn2') + '" onclick="mB_rule(\'orden\')">' + L({ es:'Voto por estamento', en:'Vote by estate' }) + '</button>' +
        '<button class="' + (B.rule === 'cabeza' ? 'mzbtn' : 'mzbtn2') + '" onclick="mB_rule(\'cabeza\')">' + L({ es:'Voto por cabeza', en:'Vote by head' }) + '</button>' +
      '</div>' +
      '<input class="mzsl" id="slB" type="range" min="0" max="' + (d.c + d.n) + '" step="1" value="' + B.allies + '" oninput="mB_slide(this.value)">' +
      '<div class="mzread">' + B.allies + L({ es:' aliados del clero y la nobleza', en:' allies from the clergy and the nobility' }) + '</div>' +
      '<div class="vbars"><div class="vfav" style="width:' + pf + '%"></div><div class="vcon" style="width:' + pc + '%"></div></div>' +
      '<div class="mzread">' + L({ es:'A favor ', en:'In favour ' }) + s.fav + L({ es:' · En contra ', en:' · Against ' }) + s.con +
        L({ es:' · Mayoría necesaria ', en:' · Majority needed ' }) + d.need + '</div>' +

function mB_rule(r){ var B = MANIP.B; if (!B || B.done) return; B.rule = r; mB_render(); }
function mB_slide(v){ var B = MANIP.B; if (!B || B.done) return; B.allies = parseInt(v, 10) || 0; mB_render(); }

             L({ es:'. Suma más aliados.', en:'. Add more allies.' });
    } else {
      B.fbk = 'bad';

    L({ es:'<p>A finales del siglo XVIII, Francia era el reino más poblado de Europa occidental y también uno de los más desiguales. La sociedad estaba dividida en tres estamentos fijados por el nacimiento: el clero, la nobleza y el tercer estado. Los dos primeros reunían tierras, rentas, cargos y honores, y estaban libres de los principales impuestos directos. El tercer estado, que era más de nueve de cada diez habitantes, juntaba en un mismo grupo a campesinos sin tierra, artesanos, comerciantes ricos y abogados, y sobre él caía el peso de las contribuciones.</p>' +

              '<div class="callout"><p><strong>Una crisis de cuentas se volvió política.</strong> Para arreglar las finanzas había que tocar los privilegios, y tocar los privilegios era discutir el orden entero del reino.</p></div>',
          en:'<p>At the end of the eighteenth century, France was the most populated kingdom of western Europe and also one of the most unequal. Society was divided into three estates fixed by birth: the clergy, the nobility and the third estate. The first two held land, rents, offices and honours, and were free of the main direct taxes. The third estate, which was more than nine out of every ten inhabitants, put landless peasants, artisans, rich merchants and lawyers in one same group, and the weight of taxation fell on it.</p>' +

              '<p>While that was happening, the ideas of the Enlightenment circulated in books, coffee houses and gatherings. Authors such as Montesquieu, Voltaire and Rousseau discussed the separation of powers, tolerance and the idea that legitimate authority is born of an agreement among people and not of the will of a king. When the crisis forced a discussion about taxes, those ideas offered the language to discuss something far bigger: who rules and by what right.</p>' +

  addSection(L({ es:'Concepto 2', en:'Concept 2' }), L({ es:'1789: de los Estados Generales a la Declaración', en:'1789: from the Estates General to the Declaration' }),
    L({ es:'<p>Los Estados Generales se reunieron en mayo de 1789 con cerca de 300 diputados del clero, 300 de la nobleza y 600 del tercer estado. El número no era el problema: el problema era la regla. Si se votaba por estamento, cada uno emitía un solo voto y el tercer estado perdía siempre 1 contra 2. Si se votaba por cabeza, sus 600 diputados podían formar mayoría sumando unos pocos aliados. La discusión sobre cómo contar los votos era, en realidad, una discusión sobre quién representaba a la nación.</p>' +
              '<p>En junio, los diputados del tercer estado dieron un paso decisivo: se declararon Asamblea Nacional, sostuvieron que representaban a la nación entera y se comprometieron a no separarse hasta darle una constitución. El 14 de julio la multitud de París tomó la fortaleza de la Bastilla, símbolo del poder del rey para encarcelar por su sola orden. En agosto la Asamblea suprimió los privilegios señoriales y aprobó la Declaración de los Derechos del Hombre y del Ciudadano.</p>' +

              '<div class="callout"><p><strong>La Declaración no describía a Francia: la contradecía.</strong> Por eso sirvió como programa a quienes querían cambiar su propio país, incluso al otro lado del océano.</p></div>',
          en:'<p>The Estates General met in May 1789 with about 300 deputies of the clergy, 300 of the nobility and 600 of the third estate. The number was not the problem: the problem was the rule. If the vote was by estate, each one cast a single vote and the third estate always lost 1 against 2. If the vote was by head, its 600 deputies could form a majority by adding a few allies. The argument about how to count votes was in fact an argument about who represented the nation.</p>' +
              '<p>In June, the deputies of the third estate took a decisive step: they declared themselves the National Assembly, claimed that they represented the whole nation and pledged not to separate until they had given it a constitution. On 14 July the crowd of Paris took the fortress of the Bastille, a symbol of the power of the king to imprison by his order alone. In August the Assembly abolished manorial privileges and approved the Declaration of the Rights of Man and of the Citizen.</p>' +
              '<p>That short text changed the starting point: people are born free and equal in rights, sovereignty resides in the nation, the law must be the same for everyone and taxes are consented to through representatives. In 1791 France had its first constitution and a monarchy limited by law; in 1792 the monarchy was abolished and the republic was proclaimed. The king was tried and sentenced to death in 1793. Years of war and unstable governments followed, until in 1799 Napoleon Bonaparte took power and in 1804 proclaimed himself emperor.</p>' +

  addSection(L({ es:'Concepto 3', en:'Concept 3' }), L({ es:'Un imperio que se agota y una monarquía sin rey', en:'An empire wearing out and a monarchy without a king' }),
    L({ es:'<p>Mientras Francia se transformaba, la monarquía española gobernaba un imperio inmenso. Durante el siglo XVIII los reyes de la casa de Borbón intentaron hacerlo más rentable con un conjunto de medidas conocidas como reformas borbónicas: nuevos impuestos, intendencias que ordenaban el cobro, control más estricto del comercio, expulsión de los jesuitas en 1767 y la costumbre de reservar los cargos más altos a funcionarios nacidos en España. Los criollos, hijos de españoles nacidos en América, se vieron desplazados del gobierno de la tierra donde vivían.</p>' +
              '<p>Sostener la cohesión de unas colonias tan lejanas costaba cada vez más. Las guerras europeas interrumpían la navegación y encarecían todo; la Corona pedía préstamos y donativos forzosos; en 1804 ordenó cobrar en América los capitales que la Iglesia tenía prestados, lo que golpeó a hacendados, mineros y comerciantes endeudados. El descontento todavía no era un proyecto de independencia, pero los agravios se acumulaban.</p>' +
              '<p>El golpe llegó desde fuera. En 1808 Napoleón ocupó España, obligó a Carlos IV y a Fernando VII a renunciar al trono en Bayona y colocó como rey a su hermano José. La monarquía quedó sin rey legítimo. En España y en América se formaron juntas que decían gobernar en nombre del rey ausente, con un argumento de la época: si falta el rey, la autoridad regresa a los pueblos que se la habían confiado. En la Nueva España, el ayuntamiento de la ciudad de México propuso una junta con el virrey; en septiembre de 1808 un grupo de peninsulares lo depuso. La salida negociada se cerró y quedó abierta la vía de las armas.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Siglo XVIII</div><div class="rform">Reformas borbónicas</div><div class="rnote">más impuestos y cargos para peninsulares</div></div>' +
                '<div class="rcard"><div class="rname">1808</div><div class="rform">Bayona</div><div class="rnote">el rey renuncia al trono</div></div>' +
                '<div class="rcard"><div class="rname">Vacío de poder</div><div class="rform">Juntas</div><div class="rnote">gobiernan en nombre del rey ausente</div></div>' +
                '<div class="rcard"><div class="rname">1808 en México</div><div class="rform">Golpe al virrey</div><div class="rnote">se cierra la salida negociada</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>Dos procesos se cruzan.</strong> Uno viene de dentro: décadas de agravios coloniales. El otro viene de fuera: una monarquía sin cabeza. Juntos abren 1810.</p></div>',
          en:'<p>While France was transforming itself, the Spanish monarchy governed an immense empire. During the eighteenth century the kings of the house of Bourbon tried to make it more profitable with a set of measures known as the Bourbon reforms: new taxes, intendancies that ordered collection, stricter control of trade, the expulsion of the Jesuits in 1767 and the habit of reserving the highest offices for officials born in Spain. The creoles, children of Spaniards born in America, found themselves pushed out of the government of the land where they lived.</p>' +
              '<p>Holding such distant colonies together cost more and more. European wars interrupted navigation and made everything dearer; the Crown asked for loans and forced donations; in 1804 it ordered the collection in America of the capital the Church had lent out, which hit indebted estate owners, miners and merchants. The discontent was not yet a project of independence, but the grievances were piling up.</p>' +
              '<p>The blow came from outside. In 1808 Napoleon occupied Spain, forced Charles IV and Ferdinand VII to renounce the throne at Bayonne and placed his brother Joseph as king. The monarchy was left without a legitimate king. In Spain and in America assemblies were formed that claimed to govern in the name of the absent king, with an argument of the time: if the king is missing, authority returns to the peoples who had entrusted it to him. In New Spain, the town council of Mexico City proposed an assembly together with the viceroy; in September 1808 a group of peninsulars deposed him. The negotiated way out was closed and the way of arms was left open.</p>' +
              '<div class="rules-grid">' +

              '<div class="callout"><p><strong>Two processes cross.</strong> One comes from within: decades of colonial grievances. The other comes from outside: a monarchy without a head. Together they open 1810.</p></div>' }));

  addSection(L({ es:'Concepto 4', en:'Concept 4' }), L({ es:'1810: las ideas cruzan el océano', en:'1810: the ideas cross the ocean' }),
    L({ es:'<p>Entre 1809 y 1810 varias ciudades americanas instalaron juntas de gobierno: Chuquisaca y La Paz, Caracas en abril de 1810, Buenos Aires en mayo, Bogotá en julio, Santiago en septiembre. Casi todas empezaron jurando fidelidad a Fernando VII y casi todas terminaron discutiendo la independencia. El argumento del regreso de la soberanía a los pueblos se usó primero para conservar el reino y después para separarse de él.</p>' +
              '<p>En la Nueva España el camino fue distinto porque el movimiento fue popular desde el primer día. La madrugada del 16 de septiembre de 1810, en el pueblo de Dolores, el cura Miguel Hidalgo llamó a la lucha y en pocas semanas reunió un ejército enorme de campesinos, mineros y trabajadores de las haciendas. Ese carácter masivo le dio una fuerza que ninguna junta tenía y, al mismo tiempo, le trajo el rechazo de muchos criollos acomodados. En diciembre de 1810, en Guadalajara, Hidalgo firmó bandos que declaraban abolida la esclavitud y suprimido el tributo que pagaba la población indígena.</p>' +
              '<p>José María Morelos ordenó el movimiento y le dio un programa. En 1813 presentó los Sentimientos de la Nación ante el Congreso de Chilpancingo: la soberanía reside en el pueblo, la esclavitud queda prohibida para siempre, se acaban las distinciones de casta y la América es libre de España. En 1814 el Congreso promulgó la Constitución de Apatzingán. En Sudamérica, Simón Bolívar y José de San Martín encabezaron campañas que llevaron ideas semejantes de Caracas a Lima. Nadie copió a Francia: cada movimiento tomó principios y los usó para resolver problemas propios.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">1810</div><div class="rform">Juntas americanas</div><div class="rnote">de Caracas a Santiago</div></div>' +
                '<div class="rcard"><div class="rname">16 de septiembre</div><div class="rform">Dolores</div><div class="rnote">el movimiento nace popular</div></div>' +
                '<div class="rcard"><div class="rname">Diciembre de 1810</div><div class="rform">Bandos de Guadalajara</div><div class="rnote">fin de la esclavitud y del tributo</div></div>' +
                '<div class="rcard"><div class="rname">1813</div><div class="rform">Sentimientos de la Nación</div><div class="rnote">soberanía del pueblo y fin de las castas</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>Los principios viajaron; las soluciones fueron locales.</strong> En Europa se discutía cómo cambiar un reino. En América había que decidir además si seguir siendo colonia y qué hacer con las castas y la esclavitud.</p></div>',
          en:'<p>Between 1809 and 1810 several American cities set up governing assemblies: Chuquisaca and La Paz, Caracas in April 1810, Buenos Aires in May, Bogota in July, Santiago in September. Almost all of them began by swearing loyalty to Ferdinand VII and almost all of them ended up discussing independence. The argument of the return of sovereignty to the peoples was used first to preserve the kingdom and later to separate from it.</p>' +
              '<p>In New Spain the path was different because the movement was popular from the first day. At dawn on 16 September 1810, in the town of Dolores, the priest Miguel Hidalgo called people to the fight and in a few weeks gathered an enormous army of peasants, miners and estate workers. That mass character gave it a strength no assembly had and, at the same time, brought it the rejection of many well off creoles. In December 1810, in Guadalajara, Hidalgo signed decrees declaring slavery abolished and the tribute paid by the indigenous population suppressed.</p>' +
              '<p>Jose Maria Morelos organized the movement and gave it a programme. In 1813 he presented the Sentiments of the Nation at the Congress of Chilpancingo: sovereignty resides in the people, slavery is forbidden forever, distinctions of caste are ended and America is free of Spain. In 1814 the Congress promulgated the Constitution of Apatzingan. In South America, Simon Bolivar and Jose de San Martin led campaigns that carried similar ideas from Caracas to Lima. Nobody copied France: each movement took principles and used them to solve problems of its own.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">1810</div><div class="rform">American assemblies</div><div class="rnote">from Caracas to Santiago</div></div>' +
                '<div class="rcard"><div class="rname">16 September</div><div class="rform">Dolores</div><div class="rnote">the movement is born popular</div></div>' +
                '<div class="rcard"><div class="rname">December 1810</div><div class="rform">Decrees of Guadalajara</div><div class="rnote">end of slavery and of the tribute</div></div>' +
                '<div class="rcard"><div class="rname">1813</div><div class="rform">Sentiments of the Nation</div><div class="rnote">sovereignty of the people and end of castes</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>The principles travelled; the solutions were local.</strong> In Europe the discussion was how to change a kingdom. In America it was also whether to remain a colony and what to do with castes and slavery.</p></div>' }));

  /* ══════════════════ CONCEPTO 5 ══════════════════ */
  addSection(L({ es:'Concepto 5', en:'Concept 5' }), L({ es:'Ni copia ni casualidad', en:'Neither a copy nor chance' }),
    L({ es:'<p>Conviene medir con cuidado la influencia. Los movimientos americanos no repitieron paso a paso lo ocurrido en Francia: tomaron de ahí un lenguaje político y algunos principios, y los combinaron con agravios coloniales que Francia no tenía. Al mismo tiempo, muchos criollos que defendían la soberanía del pueblo y la igualdad ante la ley se alarmaron con lo que veían: la insurrección popular de Hidalgo y, sobre todo, la revolución de la población esclavizada de Saint Domingue, que en 1804 fundó Haití y abolió la esclavitud. Querían gobernar sin la metrópoli, pero no querían perder su lugar en la sociedad.</p>' +
              '<p>Por eso la independencia de la Nueva España se consumó en 1821 mediante un acuerdo y no por una victoria popular. Agustín de Iturbide, jefe realista, y Vicente Guerrero, jefe insurgente, pactaron el Plan de Iguala: independencia, unión de todos los habitantes y una sola religión. Los Tratados de Córdoba lo confirmaron y el 27 de septiembre de 1821 el Ejército Trigarante entró en la ciudad de México. En 1822 Iturbide fue proclamado emperador; el Primer Imperio duró poco y en 1824 la primera constitución federal estableció una república.</p>' +
              '<p>Ese resultado explica en parte lo que vino después. La nueva nación heredó una hacienda pública arruinada, un territorio enorme y una discusión abierta sobre cómo organizarse, que enfrentó a federalistas y centralistas durante décadas. La Revolución Francesa dejó preguntas que siguieron vigentes a los dos lados del océano: quién es el soberano, quiénes cuentan como ciudadanos y qué significa que la ley sea la misma para todos.</p>' +
              '<table class="dtable"><tr><th>Rasgo</th><th>Francia desde 1789</th><th>América desde 1810</th></tr>' +
                '<tr><td>Contra qué se lucha</td><td>El orden desigual del propio reino</td><td>El orden desigual y además el dominio colonial</td></tr>' +
                '<tr><td>Quién encabeza</td><td>Diputados del tercer estado y multitudes urbanas</td><td>Criollos, curas y sectores populares del campo y las minas</td></tr>' +
                '<tr><td>Cómo termina la primera etapa</td><td>Constitución de 1791 y luego república</td><td>Acuerdo de 1821, imperio breve y república en 1824</td></tr></table>' +
              '<div class="callout"><p><strong>Comparar no es igualar.</strong> Reconocer qué se tomó de 1789 y qué se hizo distinto es lo que permite explicar por qué cada proceso terminó como terminó.</p></div>',
          en:'<p>The influence has to be measured with care. The American movements did not repeat step by step what happened in France: they took a political language and some principles from it, and combined them with colonial grievances France did not have. At the same time, many creoles who defended the sovereignty of the people and equality before the law were alarmed by what they saw: the popular insurrection of Hidalgo and, above all, the revolution of the enslaved population of Saint Domingue, which in 1804 founded Haiti and abolished slavery. They wanted to govern without the metropolis, but they did not want to lose their place in society.</p>' +
              '<p>That is why the independence of New Spain was achieved in 1821 through an agreement and not by a popular victory. Agustin de Iturbide, a royalist commander, and Vicente Guerrero, an insurgent commander, agreed on the Plan of Iguala: independence, union of all inhabitants and a single religion. The Treaties of Cordoba confirmed it and on 27 September 1821 the Army of the Three Guarantees entered Mexico City. In 1822 Iturbide was proclaimed emperor; the First Empire did not last long and in 1824 the first federal constitution established a republic.</p>' +
              '<p>That outcome explains part of what came next. The new nation inherited ruined public finances, an enormous territory and an open argument about how to organize itself, which set federalists against centralists for decades. The French Revolution left questions that stayed alive on both sides of the ocean: who is the sovereign, who counts as a citizen and what it means for the law to be the same for everyone.</p>' +
              '<table class="dtable"><tr><th>Feature</th><th>France from 1789</th><th>America from 1810</th></tr>' +
                '<tr><td>What is fought against</td><td>The unequal order of its own kingdom</td><td>The unequal order and colonial rule as well</td></tr>' +
                '<tr><td>Who leads</td><td>Deputies of the third estate and urban crowds</td><td>Creoles, priests and popular groups from the countryside and the mines</td></tr>' +
                '<tr><td>How the first stage ends</td><td>Constitution of 1791 and then a republic</td><td>Agreement of 1821, a brief empire and a republic in 1824</td></tr></table>' +
              '<div class="callout"><p><strong>Comparing is not equating.</strong> Recognizing what was taken from 1789 and what was done differently is what makes it possible to explain why each process ended as it did.</p></div>' }));

  addSection(L({ es:'Explora', en:'Explore' }), L({ es:'La cadena que llega a 1810', en:'The chain that reaches 1810' }),
    L({ es:'<p>Arma la explicación eslabón por eslabón: qué venía de atrás, qué llegó de fuera, qué problema se abrió y cómo respondió América.</p>',
        en:'<p>Build the explanation link by link: what came from before, what arrived from outside, what problem opened up and how America responded.</p>' }) +
    '<div class="mzone" id="mzE"></div>');
  mE_build(rng); mE_render();

  /* ── PROBLEMA 8 ── */
  addProblem(v8 === 0 ? {
    title: L({ es:'Dos luchas en una', en:'Two fights in one' }),
    questionText: L({ es:'La Revolución Francesa transformó desde dentro a un reino europeo. Los movimientos que estallaron en América en 1810 buscaban además romper el vínculo con la metrópoli que los gobernaba. ¿Qué diferencia de fondo señala esa comparación?',
                      en:'The French Revolution transformed a European kingdom from within. The movements that broke out in America in 1810 also sought to break the tie with the metropolis that governed them. What deep difference does that comparison point out?' }),
    hint: L({ es:'Cuenta cuántos adversarios distintos tenía cada movimiento y quién gobernaba en cada caso.',
              en:'Count how many different adversaries each movement had and who governed in each case.' }),
    explanation: L({ es:'En Francia el conflicto era interno: cambiar el orden desigual del propio reino. En América había que cambiar ese orden y al mismo tiempo terminar con el gobierno de una metrópoli, es decir, ganar la independencia.',
                     en:'In France the conflict was internal: changing the unequal order of its own kingdom. In America that order had to change and at the same time the government of a metropolis had to end, that is, independence had to be won.' }),
    options: [ L({ es:'En América la lucha fue a la vez contra el orden desigual y contra el dominio colonial', en:'In America the fight was at once against the unequal order and against colonial rule' }),
               L({ es:'En América no se discutieron los derechos de las personas, solo el reparto de las tierras', en:'In America the rights of people were not discussed, only the distribution of land' }),
               L({ es:'En Francia la lucha se dirigió contra una metrópoli lejana que cobraba impuestos y cargos', en:'In France the fight was aimed at a distant metropolis that charged taxes and fees' }),
               L({ es:'En América el conflicto se resolvió sin cambiar quién gobernaba los territorios', en:'In America the conflict was settled without changing who governed the territories' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Entusiasmo con reservas', en:'Enthusiasm with reservations' }),
    questionText: L({ es:'Muchos criollos americanos adoptaron la soberanía del pueblo y la igualdad ante la ley, pero se alarmaron con la insurrección popular que encabezó Hidalgo y con la revolución de la población esclavizada que fundó Haití en 1804. ¿Cómo se explica esa reacción?',
                      en:'Many American creoles adopted the sovereignty of the people and equality before the law, but were alarmed by the popular insurrection led by Hidalgo and by the revolution of the enslaved population that founded Haiti in 1804. How is that reaction explained?' }),
    hint: L({ es:'Piensa qué ganaban esos criollos con la independencia y qué podían perder si el cambio lo dirigían otros grupos.',
              en:'Think about what those creoles gained from independence and what they could lose if other groups led the change.' }),
    explanation: L({ es:'Esos criollos querían gobernar sin la metrópoli, pero conservando su posición social. Un cambio dirigido por los sectores populares amenazaba ese lugar, y por eso buscaron una independencia sin transformación social profunda.',
                     en:'Those creoles wanted to govern without the metropolis, but keeping their social position. A change led by popular groups threatened that place, and that is why they sought an independence without deep social transformation.' }),
    options: [ L({ es:'Querían gobernar sin la metrópoli, pero temían perder su posición si el cambio lo dirigían los sectores populares', en:'They wanted to govern without the metropolis, but feared losing their position if popular groups led the change' }),
               L({ es:'Rechazaban la soberanía del pueblo y preferían que el rey de España siguiera gobernando sus territorios', en:'They rejected the sovereignty of the people and preferred the king of Spain to go on governing their territories' }),
               L({ es:'Consideraban que la igualdad ante la ley debía aplicarse primero en Europa y después en América', en:'They held that equality before the law should be applied first in Europe and later in America' }),
               L({ es:'Desconocían el contenido de la Declaración de 1789 y por eso no podían apoyar esos movimientos', en:'They did not know the content of the Declaration of 1789 and so could not support those movements' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ══════════════════ CIERRE ══════════════════ */
  addSection(L({ es:'Cierre', en:'Closing' }), L({ es:'Une los hilos', en:'Tie the threads together' }),
    L({ es:'<p>Las dos preguntas que siguen recorren de un extremo a otro lo que trabajaste en esta guía.</p>',
        en:'<p>The two questions that follow run from one end to the other of what you worked on in this guide.</p>' }));

  /* ── PROBLEMA 9 ── */
  addProblem(v9 === 0 ? {
    title: L({ es:'Las etapas en el cartel', en:'The stages on the poster' }),
    questionText: L({ es:'Un equipo hace un cartel sobre la lucha por la independencia de la Nueva España, que va de septiembre de 1810 a septiembre de 1821. Divide el periodo en etapas: a la primera le asigna 1 año y a la segunda ' + e9 + ' años. ¿Cuántos años le quedan para las etapas siguientes?',
                      en:'A team makes a poster about the fight for the independence of New Spain, which runs from September 1810 to September 1821. It divides the period into stages: it gives 1 year to the first and ' + e9 + ' years to the second. How many years are left for the following stages?' }),
    hint: L({ es:'Averigua primero cuántos años abarca todo el periodo y después cuántos ya están repartidos.',
              en:'First work out how many years the whole period covers and then how many are already assigned.' }),
    explanation: L({ es:'El periodo completo abarca 1821 - 1810 = 11 años. Las dos primeras etapas ocupan 1 + ' + e9 + ' = ' + s9 + ' años, así que quedan 11 - ' + s9 + ' = ' + r9a,
                     en:'The whole period covers 1821 - 1810 = 11 years. The first two stages take 1 + ' + e9 + ' = ' + s9 + ' years, so what is left is 11 - ' + s9 + ' = ' + r9a }),
    options: [ r9a + L(ANO), '11' + L(ANO), (e9 + 1) + L(ANO), (r9a + 2) + L(ANO) ],
    correct: 0, showWork: true
  } : {
    title: L({ es:'Fichas para cuatro carteles', en:'Cards for four posters' }),
    questionText: L({ es:'Una maestra pide un cartel por cada una de las cuatro etapas de la lucha por la independencia, y ' + m9 + ' fichas de sucesos para cada cartel. El equipo ya escribió ' + g9 + ' fichas. ¿Cuántas fichas le faltan?',
                      en:'A teacher asks for one poster for each of the four stages of the fight for independence, and ' + m9 + ' event cards for each poster. The team has already written ' + g9 + ' cards. How many cards does it still need?' }),
    hint: L({ es:'Averigua primero cuántas fichas necesita el trabajo completo y después considera las que ya están escritas.',
              en:'First work out how many cards the whole task needs and then take into account the ones already written.' }),
    explanation: L({ es:'Los cuatro carteles necesitan 4 x ' + m9 + ' = ' + (4*m9) + ' fichas, y el equipo ya tiene ' + g9 + ': ' + (4*m9) + ' - ' + g9 + ' = ' + r9b,
                     en:'The four posters need 4 x ' + m9 + ' = ' + (4*m9) + ' cards, and the team already has ' + g9 + ': ' + (4*m9) + ' - ' + g9 + ' = ' + r9b }),
    options: [ r9b + L(FIC), (4*m9) + L(FIC), (4*m9 + g9) + L(FIC), g9 + L(FIC) ],
    correct: 0, showWork: true
  }, rng);

  /* ── PROBLEMA 10 ── */
  addProblem(v10 === 0 ? {
    title: L({ es:'Tres piezas, una explicación', en:'Three pieces, one explanation' }),
    questionText: L({ es:'Un equipo debe reunir en una sola explicación estos tres elementos: las ideas proclamadas en Francia en 1789, la ocupación de España por Napoleón en 1808 y las juntas americanas de 1810. ¿Cuál de las explicaciones relaciona correctamente los tres?',
                      en:'A team has to bring together in a single explanation these three elements: the ideas proclaimed in France in 1789, the occupation of Spain by Napoleon in 1808 and the American assemblies of 1810. Which of the explanations relates the three correctly?' }),
    hint: L({ es:'Ordena los tres elementos en el tiempo y pregúntate qué aportó cada uno: un lenguaje, una oportunidad o una respuesta.',
              en:'Put the three elements in time order and ask what each one contributed: a language, an opportunity or a response.' }),
    explanation: L({ es:'Las ideas de 1789 aportaron el lenguaje de la soberanía y de la igualdad; la invasión de 1808 dejó a la monarquía sin rey legítimo; con ese vacío, en 1810 se formaron juntas que reclamaron gobernarse a sí mismas.',
                     en:'The ideas of 1789 provided the language of sovereignty and equality; the invasion of 1808 left the monarchy without a legitimate king; with that vacuum, in 1810 assemblies were formed that claimed to govern themselves.' }),
    options: [ L({ es:'Las ideas de 1789 ofrecieron el lenguaje de la soberanía, la invasión de 1808 dejó a la monarquía sin rey y con ese vacío en 1810 se formaron juntas que reclamaron gobernarse', en:'The ideas of 1789 offered the language of sovereignty, the invasion of 1808 left the monarchy without a king and with that vacuum in 1810 assemblies were formed that claimed to govern themselves' }),
               L({ es:'La invasión de 1808 llevó por primera vez las ideas de 1789 a América y las juntas de 1810 las rechazaron para sostener al rey', en:'The invasion of 1808 brought the ideas of 1789 to America for the first time and the assemblies of 1810 rejected them to support the king' }),
               L({ es:'Las juntas de 1810 se formaron para apoyar a Napoleón y difundir en América las ideas proclamadas en 1789', en:'The assemblies of 1810 were formed to support Napoleon and to spread in America the ideas proclaimed in 1789' }),
               L({ es:'Las ideas de 1789 llegaron a América después de 1810, cuando las juntas ya habían declarado la independencia', en:'The ideas of 1789 reached America after 1810, when the assemblies had already declared independence' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Medir una influencia', en:'Measuring an influence' }),
    questionText: L({ es:'Se afirma con frecuencia que la Revolución Francesa influyó en los movimientos independentistas de América Latina. ¿Cuál es la forma más precisa de entender esa influencia?',
                      en:'It is often said that the French Revolution influenced the independence movements of Latin America. What is the most precise way of understanding that influence?' }),
    hint: L({ es:'Recuerda que los problemas de una colonia no eran los mismos que los de un reino europeo, aunque el lenguaje político fuera parecido.',
              en:'Remember that the problems of a colony were not the same as those of a European kingdom, even if the political language was similar.' }),
    explanation: L({ es:'La influencia fue de principios y de lenguaje político: soberanía, igualdad ante la ley y ciudadanía. Los movimientos americanos los usaron para plantear problemas propios, como el dominio colonial, las castas y la esclavitud.',
                     en:'The influence was one of principles and political language: sovereignty, equality before the law and citizenship. The American movements used them to raise problems of their own, such as colonial rule, castes and slavery.' }),
    options: [ L({ es:'Aportó principios y un lenguaje político que los americanos usaron para plantear problemas propios, como el dominio colonial y las castas', en:'It provided principles and a political language that Americans used to raise problems of their own, such as colonial rule and castes' }),
               L({ es:'Aportó un plan de gobierno detallado que los movimientos americanos aplicaron paso por paso', en:'It provided a detailed plan of government that the American movements applied step by step' }),
               L({ es:'Aportó las tropas y el dinero con los que se sostuvieron las campañas americanas', en:'It provided the troops and the money with which the American campaigns were sustained' }),
               L({ es:'Aportó únicamente el ejemplo de un rey derrocado, sin efecto en las leyes ni en los textos americanos', en:'It provided only the example of an overthrown king, with no effect on American laws or texts' }) ],
    correct: 0, showWork: false
  }, rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'La Revolución Francesa y los Movimientos Independentistas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
