<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los DDHH como Valores Compartidos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.wgt-q { font-size:.9rem; font-weight:600; margin-bottom:.6rem; }
.wcase { background:var(--surface2); border-left:4px solid var(--gold); border-radius:0 8px 8px 0; padding:.75rem .9rem; font-size:.88rem; color:var(--text2); margin-bottom:.8rem; }
.chips { display:flex; flex-wrap:wrap; gap:.45rem; }
.chip { background:var(--surface2); border:1.5px solid var(--border); border-radius:22px; padding:.45rem .9rem; font-size:.82rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.chip:hover { border-color:var(--green); color:var(--green); }
.chip.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.chip.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.chip.used { opacity:.4; pointer-events:none; }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.04em; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.45rem .9rem; font-size:.78rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; }
.wbtn:hover { border-color:var(--green); color:var(--green); }
.fgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.6rem; }
.fcard { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.75rem .8rem; font-size:.82rem; cursor:pointer; transition:all .16s; }
.fcard:hover { border-color:var(--green); }
.fcard.open { border-color:var(--ok); background:var(--ok-bg); }
.fcust { color:var(--text2); margin-bottom:.45rem; }
.fval { font-size:.78rem; color:var(--ok); font-weight:600; }
.fhint { font-size:.7rem; color:var(--text3); }
.balwrap { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.balcv { display:block; width:100%; height:210px; }
.tgt { font-size:.85rem; background:var(--green-bg); border-radius:8px; padding:.55rem .8rem; margin-bottom:.75rem; color:var(--text); }
.tgt strong { color:var(--green-dark); }
.chainrow { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; margin:.7rem 0; min-height:44px; }
.link { background:var(--green-bg); border:1.5px solid var(--green); color:var(--green-dark); border-radius:8px; padding:.42rem .7rem; font-size:.79rem; }
.link.start { background:var(--gold-bg); border-color:var(--gold); color:var(--text); }
.link.ghost { background:var(--surface2); border:1.5px dashed var(--border); color:var(--text3); }
.arw { color:var(--text3); font-weight:700; }
.slotgrid { display:grid; gap:.5rem; margin-bottom:.85rem; }
.slot { border:1.5px dashed var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.82rem; color:var(--text3); min-height:44px; display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
.slot.filled { border-style:solid; border-color:var(--green); background:var(--green-bg); color:var(--text); }
.slotlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.09em; color:var(--gold); font-weight:700; flex-shrink:0; }
.frag { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.frag:hover { border-color:var(--green); color:var(--green); }
.frag.used { opacity:.35; pointer-events:none; }
.fraglist { display:flex; flex-direction:column; gap:.45rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Los DDHH como Valores Compartidos</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');
  document.documentElement.setAttribute('lang', l);
  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });

      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);
    }
  }
}
/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce1_t02_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce1_t02_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce1_t02_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')

    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;

    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }

    var pp = document.getElementById('pp'+i);

      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}

  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');

    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('fce1_t02_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';

}

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

   WIDGET 1 — CARTAS: COSTUMBRE Y VALOR DE FONDO

var FLIP = null;
function buildFlip(rng){

    { value:{ es:'todas las niñas y todos los niños deben poder ir a la escuela.',

        { es:'En un país africano el calendario oficial incluye días festivos de varias religiones.',

      ] },
    { value:{ es:'toda persona debe poder expresar lo que piensa sin miedo.',
              en:'every person should be able to say what they think without fear.' },
      cards:[
        { es:'En una isla de Oceanía las decisiones del pueblo se toman en un círculo donde cada quien habla por turno.',
          en:'On an island in Oceania village decisions are made in a circle where each person speaks in turn.' },
        { es:'En una ciudad europea hay una esquina donde cualquier persona puede dar un discurso público.',

      '<div class="fgrid" id="flipCards"></div>' +

}
function flipRender(){

    if (FLIP.open[i]) opened++;
    h += '<div class="fcard' + (FLIP.open[i] ? ' open' : '') + '" onclick="flipTap(' + i + ')">' +
           '<div class="fcust">' + FLIP.cards[i][LANG] + '</div>' +
           (FLIP.open[i]
              ? '<div class="fval">' + S('Valor que protege: ','Value it protects: ') + FLIP.value[LANG] + '</div>'

         '</div>';
  }

            'You have opened ' + opened + ' of 3. Open the rest and compare what lies underneath.');

function flipTap(i){ if (!FLIP) return; FLIP.open[i] = !FLIP.open[i]; flipRender(); }

/* ================================================
   WIDGET 2 — DETECTOR DE RASGOS (3 rondas, casos distintos por ronda)
   Directional nudge per chosen trait; reveal on the third miss (Rule 8, B).
   ================================================ */
var TRT = null;
function buildTraits(rng){
  var traits = [
    { k:'uni', es:'Universales',       en:'Universal',
      nes:'Ese rasgo responde a quiénes alcanza el derecho: a todas las personas. Vuelve a leer qué está en juego.',
      nen:'That feature answers who the right reaches: every person. Read the case again.' },
    { k:'ina', es:'Inalienables',      en:'Inalienable',
      nes:'Ese rasgo dice que nadie puede quitar el derecho ni renunciar a él. ¿Es eso lo que ocurre aquí?',
      nen:'That feature says nobody can take the right away or give it up. Is that what happens here?' },
    { k:'ind', es:'Indivisibles',      en:'Indivisible',
      nes:'Ese rasgo dice que no se pueden tomar unos derechos y descartar otros. ¿El caso separa derechos?',
      nen:'That feature says you cannot keep some rights and drop others. Does the case split rights apart?' },
    { k:'int', es:'Interdependientes', en:'Interdependent',
      nes:'Ese rasgo dice que un derecho se apoya en otro. ¿Ves aquí algo que dependa de otra cosa?',
      nen:'That feature says one right leans on another. Do you see something here that depends on something else?' },
    { k:'pro', es:'Progresivos',       en:'Progressive',
      nes:'Ese rasgo habla de avanzar con el tiempo y no retroceder. ¿El caso menciona un cambio a lo largo del tiempo?',
      nen:'That feature is about moving forward over time and not going back. Does the case mention change over time?' }
  ];
  var cases = [
    { k:'uni', es:'Una escuela pública inscribe a estudiantes de cualquier país, lengua o religión con los mismos requisitos para todos.',
               en:'A public school enrolls students of any country, language or religion with the same requirements for everyone.',
      wes:'Lo que está en juego es a quiénes alcanza el derecho: a todas las personas, sin excepción.',
      wen:'What is at stake is who the right reaches: every person, with no exception.' },
    { k:'ina', es:'Una autoridad no puede quitarle a una persona su derecho a tener un nombre, ni siquiera como castigo.',
               en:'An authority cannot take away a person right to have a name, not even as a punishment.',
      wes:'Nadie puede retirar el derecho ni la persona renunciar a él, pase lo que pase.',
      wen:'Nobody can withdraw the right and the person cannot give it up, whatever happens.' },
    { k:'ind', es:'Un plan de gobierno propone atender primero la salud y dejar la educación para dentro de veinte años.',
               en:'A government plan proposes to handle health first and leave education for twenty years from now.',
      wes:'Los derechos no se eligen por partes: valen en conjunto y no se pueden separar así.',
      wen:'Rights are not picked apart: they hold together and cannot be split that way.' },
    { k:'int', es:'En una comunidad sin agua limpia, las enfermedades hacen que muchos estudiantes falten a clases.',
               en:'In a community without clean water, illness makes many students miss class.',
      wes:'Un derecho se apoya en otro: sin agua se debilita la salud y con ella la educación.',
      wen:'One right leans on another: without water, health weakens and education weakens with it.' },
    { k:'pro', es:'Cada año el municipio conecta más viviendas a la red de agua y se compromete a no desconectar ninguna.',
               en:'Each year the town connects more homes to the water network and promises not to disconnect any.',
      wes:'El derecho debe avanzar con el tiempo y no retroceder en lo ya logrado.',
      wen:'The right must advance over time and never go back on what was achieved.' },
    { k:'uni', es:'Una comunidad rural pequeña reclama la misma calidad de secundaria que una escuela de la capital.',
               en:'A small rural community demands the same quality of secondary school as a school in the capital.',
      wes:'El derecho alcanza por igual a todas las personas, vivan donde vivan.',
      wen:'The right reaches every person equally, wherever they live.' },
    { k:'ina', es:'Una persona que perdió su empleo sigue teniendo derecho a recibir atención médica.',
               en:'A person who lost their job still has the right to receive medical care.',
      wes:'El derecho no se pierde por la situación en que se encuentra la persona.',
      wen:'The right is not lost because of the situation the person is in.' },
    { k:'int', es:'Sin acta de nacimiento, una niña no puede inscribirse en la escuela de su comunidad.',
               en:'Without a birth certificate, a girl cannot enroll in her community school.',
      wes:'El derecho a la identidad sostiene al derecho a la educación: uno abre la puerta del otro.',
      wen:'The right to identity holds up the right to education: one opens the door to the other.' },
    { k:'ind', es:'Alguien propone respetar la libertad de expresión pero no la alimentación de la niñez, porque no se puede todo.',
               en:'Someone proposes respecting free speech but not child nutrition, because you cannot have everything.',
      wes:'No se puede conservar unos derechos y descartar otros: forman un conjunto.',
      wen:'You cannot keep some rights and drop others: they form one set.' },
    { k:'pro', es:'Un ayuntamiento quiere cerrar la mitad de las bibliotecas públicas que ya funcionaban en la ciudad.',
               en:'A town council wants to close half of the public libraries that were already running in the city.',
      wes:'Retroceder en lo que ya se había logrado contradice el avance que los derechos exigen.',
      wen:'Going back on what had already been achieved contradicts the advance that rights require.' }
  ];
  TRT = { traits:traits, rounds:shuffle(cases, rng).slice(0,3), i:0, tries:0, wrong:[], revealed:false, done:false };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Detector de rasgos','Feature detector') + '</div>' +
      '<div id="trtBox"></div>' +
    '</div>';
}
function trtRender(){
  if (!TRT) return;
  var box = document.getElementById('trtBox');
  if (!box) return;
  if (TRT.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Tres casos, tres rasgos distintos. Ya distingues qué pregunta responde cada uno.',
        'Three cases, three different features. You can now tell which question each one answers.') +
      '</div>';
    return;
  }
  var c = TRT.rounds[TRT.i];
  var chips = TRT.traits.map(function(tr){
    var cls = 'chip';
    if (TRT.revealed && tr.k === c.k) cls += ' good';
    else if (TRT.wrong.indexOf(tr.k) >= 0) cls += ' miss used';
    else if (TRT.revealed) cls += ' used';
    return '<div class="' + cls + '" onclick="trtPick(\'' + tr.k + '\')">' + tr[LANG] + '</div>';
  }).join('');
  box.innerHTML =
    '<div class="wgt-q">' + S('¿Qué rasgo de los derechos humanos está en juego en este caso?',
                              'Which feature of human rights is at stake in this case?') + '</div>' +
    '<div class="wcase">' + c[LANG] + '</div>' +
    '<div class="chips">' + chips + '</div>' +
    '<div class="wmsg" id="trtMsg">' + (TRT.msg || S('Elige el rasgo que mejor explica el caso.','Choose the feature that best explains the case.')) + '</div>' +
    (TRT.revealed ? '<button class="wbtn" onclick="trtNext()">' + S('Siguiente caso →','Next case →') + '</button>' : '') +
    '<div class="wprog">' + S('Caso ','Case ') + (TRT.i + 1) + S(' de 3',' of 3') + '</div>';
  var m = document.getElementById('trtMsg');
  if (m && TRT.msgCls) m.className = TRT.msgCls;
}
function trtPick(k){
  if (!TRT || TRT.revealed || TRT.done) return;
  var c = TRT.rounds[TRT.i];
  if (k === c.k) {
    TRT.revealed = true;
    TRT.msg = S('¡Exacto! ','Exactly! ') + (LANG === 'es' ? c.wes : c.wen);
    TRT.msgCls = 'wmsg ok';
  } else {
    if (TRT.wrong.indexOf(k) < 0) TRT.wrong.push(k);
    TRT.tries++;
    var tr = null, i;
    for (i = 0; i < TRT.traits.length; i++) if (TRT.traits[i].k === k) tr = TRT.traits[i];
    if (TRT.tries >= 3) {
      TRT.revealed = true;
      var right = null;
      for (i = 0; i < TRT.traits.length; i++) if (TRT.traits[i].k === c.k) right = TRT.traits[i];
      TRT.msg = S('El rasgo era ','The feature was ') + '<strong>' + right[LANG] + '</strong>. ' + (LANG === 'es' ? c.wes : c.wen);
      TRT.msgCls = 'wmsg warn';
    } else {
      TRT.msg = (LANG === 'es' ? tr.nes : tr.nen);
      TRT.msgCls = 'wmsg warn';
    }
  }
  trtRender();
}
function trtNext(){
  if (!TRT) return;
  TRT.i++; TRT.tries = 0; TRT.wrong = []; TRT.revealed = false; TRT.msg = null; TRT.msgCls = null;
  if (TRT.i >= TRT.rounds.length) TRT.done = true;
  trtRender();
}

/* ================================================
   WIDGET 3 — BALANZA DE LA VIGENCIA (canvas + 2 palancas)
   Left pan: recognition in law. Right pan: real conditions to exercise it.
   The beam tips live as the student moves the sliders; three states to reach.
   ================================================ */
var BAL = null, BAL_BOUND = false;
function buildBalance(rng){
  var l0 = 45 + 5 * Math.floor(rng() * 8);
  var r0 = 15 + 5 * Math.floor(rng() * 6);
  BAL = {
    ley:l0, real:r0, ti:0, done:false,
    targets:[
      { name:S('un derecho reconocido y vigente','a right recognized and truly in force'),
        ok:function(l,r){ return l >= 80 && r >= 80 && Math.abs(l - r) <= 10; },
        hint:function(l,r){
          if (l < 80) return S('Todavía falta reconocimiento en la ley: sube esa palanca.','Legal recognition is still short: raise that lever.');
          if (r < 80) return S('La ley ya está alta, pero las condiciones reales se quedan atrás: súbelas.','The law is high now, but real conditions lag behind: raise them.');
          return S('Las dos están altas pero desparejas: acerca una a la otra hasta equilibrar la balanza.','Both are high but uneven: bring them closer until the scale balances.');
        } },
      { name:S('un derecho escrito, pero no vigente','a right written down, but not in force'),
        ok:function(l,r){ return l >= 80 && r <= 35; },
        hint:function(l,r){
          if (l < 80) return S('Para este estado la ley debe seguir alta: sube el reconocimiento legal.','For this state the law must stay high: raise legal recognition.');
          return S('Baja las condiciones reales hasta 35 o menos para ver la brecha entre el papel y la vida diaria.','Lower real conditions to 35 or less to see the gap between paper and daily life.');
        } },
      { name:S('un avance parejo, pero todavía incompleto','an even advance, still incomplete'),
        ok:function(l,r){ return l >= 40 && l <= 60 && r >= 40 && r <= 60 && Math.abs(l - r) <= 10; },
        hint:function(l,r){
          if (l > 60 || r > 60) return S('Baja las dos palancas hacia la mitad de la escala.','Lower both levers toward the middle of the scale.');
          if (l < 40 || r < 40) return S('Sube las dos palancas hacia la mitad de la escala.','Raise both levers toward the middle of the scale.');
          return S('Ya están a media escala: ahora empareja las dos, con menos de 10 puntos de diferencia.','They are mid scale now: even them out, less than 10 points apart.');
        } }
    ]
  };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Balanza de la vigencia','Scale of enforcement') + '</div>' +
      '<div class="tgt" id="balTgt"></div>' +
      '<div class="balwrap"><canvas class="balcv" id="balCv"></canvas></div>' +
      '<div class="cgrid">' +
        '<div class="cg"><label>' + S('Reconocimiento en la ley','Recognition in the law') + ': <span class="cval" id="balLeyV">' + BAL.ley + '</span></label>' +
          '<input type="range" min="0" max="100" step="5" id="balLey" value="' + BAL.ley + '" oninput="balIn()"></div>' +
        '<div class="cg"><label>' + S('Condiciones reales para ejercerlo','Real conditions to exercise it') + ': <span class="cval" id="balRealV">' + BAL.real + '</span></label>' +
          '<input type="range" min="0" max="100" step="5" id="balReal" value="' + BAL.real + '" oninput="balIn()"></div>' +
      '</div>' +
      '<div class="wmsg" id="balMsg"></div>' +
      '<div class="wprog" id="balProg"></div>' +
    '</div>';
}
function balDraw(){
  var cv = document.getElementById('balCv');
  if (!cv || !BAL) return;
  var r = cv.getBoundingClientRect();
  if (!r.width) return;
  var dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = r.width, H = r.height;
  var cs = getComputedStyle(document.documentElement);
  var CG = cs.getPropertyValue('--green').trim() || '#1a4a8a';
  var CA = cs.getPropertyValue('--gold').trim()  || '#c9a84c';
  var CT = cs.getPropertyValue('--text2').trim() || '#4a4640';
  var C3 = cs.getPropertyValue('--text3').trim() || '#7a7468';
  var CB = cs.getPropertyValue('--border').trim()|| '#ddd8cc';
  ctx.clearRect(0, 0, W, H);
  var px = W / 2, py = H * 0.30, arm = Math.min(W * 0.33, 145);
  var ang = ((BAL.ley - BAL.real) / 100) * 0.32;
  var lx = px - arm * Math.cos(ang), ly = py + arm * Math.sin(ang);
  var rx = px + arm * Math.cos(ang), ry = py - arm * Math.sin(ang);
  var base = H - 26;
  ctx.strokeStyle = CB; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px - 34, base); ctx.lineTo(px, py + 6); ctx.lineTo(px + 34, base); ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = CG; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.stroke();
  ctx.fillStyle = CA; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
  function pan(x, y, val, col, label){
    ctx.strokeStyle = CB; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 26); ctx.stroke();
    var pw = 58, ph = 34, top = y + 26;
    ctx.strokeStyle = CB; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.rect(x - pw / 2, top, pw, ph); ctx.stroke();
    var fh = (ph - 4) * (val / 100);
    ctx.fillStyle = col; ctx.globalAlpha = 0.75;
    ctx.fillRect(x - pw / 2 + 2, top + ph - 2 - fh, pw - 4, fh);
    ctx.globalAlpha = 1;
    ctx.fillStyle = CT; ctx.font = '600 12px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(val + '', x, top + ph + 14);
    ctx.fillStyle = C3; ctx.font = '10px IBM Plex Sans, sans-serif';
    ctx.fillText(label, x, top + ph + 26);
  }
  pan(lx, ly, BAL.ley,  CG, S('la ley','the law'));
  pan(rx, ry, BAL.real, CA, S('la vida diaria','daily life'));
}
function balIn(){
  if (!BAL) return;
  var a = document.getElementById('balLey'), b = document.getElementById('balReal');
  if (a) BAL.ley = parseInt(a.value, 10);
  if (b) BAL.real = parseInt(b.value, 10);
  var av = document.getElementById('balLeyV'), bv = document.getElementById('balRealV');
  if (av) av.textContent = BAL.ley;
  if (bv) bv.textContent = BAL.real;
  balDraw();
  balEval();
}
function balEval(){
  var msg = document.getElementById('balMsg'), tg = document.getElementById('balTgt'), pr = document.getElementById('balProg');
  if (!msg || !tg) return;
  var gap = Math.abs(BAL.ley - BAL.real);
  var read = S('Ley: ','Law: ') + BAL.ley + ' · ' + S('Vida diaria: ','Daily life: ') + BAL.real + ' · ' + S('Brecha: ','Gap: ') + gap;
  if (BAL.done) {
    tg.innerHTML = '<strong>' + S('Balanza dominada','Scale mastered') + '</strong>';
    msg.className = 'wmsg ok';
    msg.innerHTML = S('Recorriste los tres estados. Un derecho es vigente cuando la ley lo reconoce y la vida diaria lo sostiene. ',
                      'You went through all three states. A right is in force when the law recognizes it and daily life sustains it. ') + read;
    if (pr) pr.textContent = S('3 de 3 estados logrados','3 of 3 states reached');
    return;
  }
  var t = BAL.targets[BAL.ti];
  tg.innerHTML = '<strong>' + S('Objetivo: ','Goal: ') + '</strong>' + S('coloca la balanza en ','set the scale to ') + t.name;
  if (t.ok(BAL.ley, BAL.real)) {
    BAL.ti++;
    if (BAL.ti >= BAL.targets.length) { BAL.done = true; balEval(); return; }
    msg.className = 'wmsg ok';
    msg.innerHTML = S('¡Lo lograste! Ahora prueba el siguiente estado. ','You made it! Now try the next state. ') + read;
    tg.innerHTML = '<strong>' + S('Objetivo: ','Goal: ') + '</strong>' + S('coloca la balanza en ','set the scale to ') + BAL.targets[BAL.ti].name;
  } else {
    msg.className = 'wmsg warn';
    msg.innerHTML = t.hint(BAL.ley, BAL.real) + '<br>' + read;
  }
  if (pr) pr.textContent = S('Estados logrados: ','States reached: ') + BAL.ti + ' / 3';
}

/* ================================================
   WIDGET 4 — CADENA DE INTERDEPENDENCIA
   Build the chain link by link; wrong link gives a directional nudge, the
   student can remove the last link, and the chain is revealed on the 3rd miss.
   ================================================ */
var CHN = null;
function buildChain(rng){
  var pools = [
    { start:{ es:'Agua limpia en casa', en:'Clean water at home' },
      steps:[ { es:'Menos enfermedades estomacales', en:'Fewer stomach illnesses' },
              { es:'Menos faltas a la escuela',      en:'Fewer school absences' },
              { es:'Mejor aprovechamiento en clase', en:'Better performance in class' },
              { es:'Más opciones al terminar la secundaria', en:'More options after secondary school' } ] },
    { start:{ es:'Acta de nacimiento', en:'Birth certificate' },
      steps:[ { es:'Inscripción en la escuela', en:'Enrollment at school' },
              { es:'Certificado de estudios',   en:'School certificate' },
              { es:'Acceso a un trabajo digno', en:'Access to decent work' },
              { es:'Ingreso propio para sostenerse', en:'Own income to support oneself' } ] },
    { start:{ es:'Transporte escolar seguro', en:'Safe school transport' },
      steps:[ { es:'Asistencia diaria a clases',  en:'Daily class attendance' },
              { es:'Continuidad en los estudios', en:'Staying in school' },
              { es:'Certificado de secundaria',   en:'Secondary school certificate' },
              { es:'Más opciones de estudio y de trabajo', en:'More study and work options' } ] }
  ];
  var p = pools[Math.floor(rng() * pools.length)];
  var order = shuffle([0,1,2,3], rng);
  CHN = { p:p, order:order, placed:0, tries:0, revealed:false, msg:null, msgCls:null };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Cadena de interdependencia','Chain of interdependence') + '</div>' +
      '<div class="wgt-q">' + S('Arma la cadena: toca el eslabón que sigue después del último colocado.',
                                'Build the chain: tap the link that comes right after the last one placed.') + '</div>' +
      '<div id="chnBox"></div>' +
    '</div>';
}
function chnRender(){
  if (!CHN) return;
  var box = document.getElementById('chnBox');
  if (!box) return;
  var row = '<span class="link start">' + CHN.p.start[LANG] + '</span>';
  var i;
  for (i = 0; i < 4; i++) {
    row += '<span class="arw">→</span>';
    if (i < CHN.placed) row += '<span class="link">' + CHN.p.steps[i][LANG] + '</span>';
    else row += '<span class="link ghost">?</span>';
  }
  var cards = '';
  for (i = 0; i < CHN.order.length; i++) {
    var s = CHN.order[i];
    var used = s < CHN.placed;
    cards += '<div class="chip' + (used ? ' used good' : '') + '" onclick="chnPick(' + s + ')">' + CHN.p.steps[s][LANG] + '</div>';
  }
  var done = CHN.placed >= 4;
  box.innerHTML =
    '<div class="chainrow">' + row + '</div>' +
    (done ? '' : '<div class="chips">' + cards + '</div>') +
    '<div class="wmsg' + (CHN.msgCls ? ' ' + CHN.msgCls : '') + '" id="chnMsg">' +
      (CHN.msg || S('Empieza por la consecuencia inmediata del primer eslabón.','Start with the immediate consequence of the first link.')) + '</div>' +
    (CHN.placed > 0 && !done ? '<button class="wbtn" onclick="chnUndo()">' + S('↺ Quitar el último eslabón','↺ Remove the last link') + '</button>' : '') +
    (done ? '<button class="wbtn" onclick="chnReset()">' + S('↺ Armar de nuevo','↺ Build it again') + '</button>' : '') +
    '<div class="wprog">' + S('Eslabones colocados: ','Links placed: ') + Math.min(CHN.placed,4) + ' / 4</div>';
}
function chnPick(s){
  if (!CHN || CHN.placed >= 4) return;
  if (s === CHN.placed) {
    CHN.placed++;
    if (CHN.placed >= 4) {
      CHN.msg = S('Cadena completa. Un solo derecho atendido a tiempo abre la puerta de otros tres.',
                  'Chain complete. A single right met on time opens the door to three more.');
      CHN.msgCls = 'ok';
    } else {
      CHN.msg = S('Va bien. ¿Y qué se vuelve posible después de eso?','Going well. And what becomes possible after that?');
      CHN.msgCls = 'ok';
    }
    CHN.tries = 0;
  } else {
    CHN.tries++;
    if (CHN.tries >= 3) {
      CHN.placed = 4;
      CHN.msg = S('Así queda la cadena completa. Fíjate en el orden: cada eslabón hace posible el siguiente.',
                  'This is the full chain. Look at the order: each link makes the next one possible.');
      CHN.msgCls = 'warn';
    } else {
      CHN.msg = S('Ese eslabón ocurre más adelante. Pregúntate qué pasa justo después de lo último que colocaste.',
                  'That link happens later on. Ask yourself what happens right after the last one you placed.');
      CHN.msgCls = 'warn';
    }
  }
  chnRender();
}
function chnUndo(){ if (!CHN || CHN.placed === 0) return; CHN.placed--; CHN.msg = S('Eslabón retirado. Puedes intentarlo otra vez.','Link removed. You can try again.'); CHN.msgCls = null; chnRender(); }
function chnReset(){ if (!CHN) return; CHN.placed = 0; CHN.tries = 0; CHN.msg = null; CHN.msgCls = null; chnRender(); }

/* ================================================
   WIDGET 5 — CONSTRUCTOR DE POSTURA CRÍTICA
   Four ordered slots: claim, evidence, human-rights criterion, proposal.
   Noise fragments (opinion / irrelevant data) give their own nudge.
   ================================================ */
var STC = null;
function buildStance(rng){
  var topics = [
    { frags:[
        { ty:'af', es:'El derecho al agua no es plenamente vigente en la colonia.',
                   en:'The right to water is not fully in force in the neighborhood.' },
        { ty:'ev', es:'En 62 de las 120 viviendas el agua llega solo dos días por semana.',
                   en:'In 62 of the 120 homes water arrives only two days a week.' },
        { ty:'cr', es:'El acceso a agua suficiente y segura es una condición de la salud y de la dignidad.',
                   en:'Access to enough safe water is a condition for health and dignity.' },
        { ty:'pr', es:'Pedir al comité vecinal y al municipio un calendario público de reparación de la red.',
                   en:'Ask the neighborhood committee and the town for a public repair schedule for the network.' },
        { ty:'op', es:'El agua de la colonia sabe rara y eso molesta a mucha gente.',
                   en:'The water here tastes odd and that annoys a lot of people.' },
        { ty:'ir', es:'En la colonia hay tres tiendas y dos canchas deportivas.',
                   en:'The neighborhood has three shops and two sports courts.' }
      ] },
    { frags:[
        { ty:'af', es:'El derecho a la educación no es plenamente vigente en la comunidad.',
                   en:'The right to education is not fully in force in the community.' },
        { ty:'ev', es:'De 40 estudiantes que terminaron la primaria, 14 no se inscribieron a secundaria por falta de transporte.',
                   en:'Of 40 students who finished primary school, 14 did not enroll in secondary school for lack of transport.' },
        { ty:'cr', es:'La educación debe estar disponible y ser accesible para toda persona, sin importar dónde viva.',
                   en:'Education must be available and accessible to every person, no matter where they live.' },
        { ty:'pr', es:'Solicitar una ruta de transporte escolar y dar seguimiento en la asamblea del mes.',
                   en:'Request a school bus route and follow it up at the monthly assembly.' },
        { ty:'op', es:'A muchos estudiantes no les gusta la clase de la primera hora.',
                   en:'Many students do not like the first period class.' },
        { ty:'ir', es:'La escuela de la comunidad tiene un patio más pequeño que la de la cabecera.',
                   en:'The community school has a smaller yard than the one in the main town.' }
      ] }
  ];
  var tp = topics[Math.floor(rng() * topics.length)];
  STC = {
    frags: shuffle(tp.frags, rng),
    slots: [
      { ty:'af', lbl:S('Afirmación','Claim'),    ask:S('¿Qué ocurre con la vigencia de este derecho?','What is happening with this right?') },
      { ty:'ev', lbl:S('Evidencia','Evidence'),  ask:S('¿Qué dato comprobable lo sostiene?','What checkable data backs it up?') },
      { ty:'cr', lbl:S('Criterio','Criterion'),  ask:S('¿Con qué principio de derechos humanos lo juzgas?','Which human rights principle do you judge it by?') },
      { ty:'pr', lbl:S('Propuesta','Proposal'),  ask:S('¿Qué debe cambiar y quién es responsable?','What must change and who is responsible?') }
    ],
    filled: [], tries: 0, msg: null, msgCls: null
  };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Constructor de postura crítica','Critical stance builder') + '</div>' +
      '<div class="wgt-q">' + S('Coloca los enunciados en su lugar, en orden, para armar una postura que se sostenga.',
                                'Place the statements in their slot, in order, to build a stance that holds up.') + '</div>' +
      '<div id="stcBox"></div>' +
    '</div>';
}
function stcRender(){
  if (!STC) return;
  var box = document.getElementById('stcBox');
  if (!box) return;
  var slots = '', i;
  for (i = 0; i < STC.slots.length; i++) {
    var f = STC.filled[i];
    slots += '<div class="slot' + (f ? ' filled' : '') + '">' +
               '<span class="slotlbl">' + STC.slots[i].lbl + '</span>' +
               '<span>' + (f ? f[LANG] : STC.slots[i].ask) + '</span>' +
             '</div>';
  }
  var done = STC.filled.length >= 4;
  var frags = '';
  for (i = 0; i < STC.frags.length; i++) {
    var used = STC.filled.indexOf(STC.frags[i]) >= 0;
    frags += '<div class="frag' + (used ? ' used' : '') + '" onclick="stcPick(' + i + ')">' + STC.frags[i][LANG] + '</div>';
  }
  box.innerHTML =
    '<div class="slotgrid">' + slots + '</div>' +
    (done ? '' : '<div class="fraglist">' + frags + '</div>') +
    '<div class="wmsg' + (STC.msgCls ? ' ' + STC.msgCls : '') + '">' +
      (STC.msg || S('Empieza por decir qué ocurre con la vigencia del derecho.','Start by saying what is happening with the right.')) + '</div>' +
    '<button class="wbtn" onclick="stcReset()">' + S('↺ Armar de nuevo','↺ Build it again') + '</button>';
}
function stcPick(i){
  if (!STC || STC.filled.length >= 4) return;
  var f = STC.frags[i];
  if (STC.filled.indexOf(f) >= 0) return;
  var want = STC.slots[STC.filled.length];
  if (f.ty === want.ty) {
    STC.filled.push(f);
    STC.tries = 0;
    if (STC.filled.length >= 4) {
      STC.msg = S('Postura completa: afirmas, lo pruebas con un dato, lo juzgas con un principio y propones qué cambiar. Eso es asumir una postura crítica.',
                  'Stance complete: you claim, back it with data, judge it by a principle and propose what to change. That is taking a critical stance.');
      STC.msgCls = 'ok';
    } else {
      STC.msg = S('Bien. Ahora: ','Good. Now: ') + STC.slots[STC.filled.length].ask;
      STC.msgCls = 'ok';
    }
  } else {
    STC.tries++;
    if (STC.tries >= 3) {
      var ord = ['af','ev','cr','pr'], k, j;
      STC.filled = [];
      for (k = 0; k < ord.length; k++)
        for (j = 0; j < STC.frags.length; j++)
          if (STC.frags[j].ty === ord[k]) STC.filled.push(STC.frags[j]);
      STC.msg = S('Así queda armada. Observa el orden: primero la afirmación, luego el dato, después el principio y al final la propuesta.',
                  'Here it is assembled. Notice the order: claim first, then data, then the principle, and the proposal last.');
      STC.msgCls = 'warn';
    } else {
      var extra = '';
      if (f.ty === 'op') extra = S('Ese enunciado expresa un gusto personal, no algo que se pueda comprobar. ','That statement expresses a personal taste, not something that can be checked. ');
      if (f.ty === 'ir') extra = S('Ese dato es cierto, pero no mide la vigencia del derecho. ','That data is true, but it does not measure whether the right is in force. ');
      STC.msg = extra + S('Aquí hace falta: ','What is missing here: ') + want.ask;
      STC.msgCls = 'warn';
    }
  }
  stcRender();
}
function stcReset(){ if (!STC) return; STC.filled = []; STC.tries = 0; STC.msg = null; STC.msgCls = null; stcRender(); }

             en:'A student claims: “Human rights are a permission the government gives to those who behave well.” Which idea best corrects that claim?' },

      stmt:{ es:'En una escuela se propone que las y los estudiantes con discapacidad tomen clase en un salón aparte para no atrasar al resto del grupo. ¿Qué respuesta se apoya mejor en los derechos humanos?',
             en:'At a school someone proposes that students with disabilities take class in a separate room so the rest of the group is not held back. Which answer is best grounded in human rights?' },
      options:{ es:[
        'Separarlos vulnera la igualdad: la escuela debe hacer los ajustes necesarios para que todos aprendan juntos.',
        'Es aceptable, porque cada grupo avanza mejor cuando reúne a personas de ritmo parecido.',
        'Es aceptable si las familias del grupo lo aprueban por mayoría de votos en una junta.',
        'Da lo mismo, porque el derecho a la educación se cumple con solo tener un lugar en la escuela.' ],
        en:[
        'Separating them breaks equality: the school must make the adjustments needed for everyone to learn together.',
        'It is acceptable, because each group advances better when it gathers people of similar pace.',
        'It is acceptable if the families of the group approve it by majority vote at a meeting.',
        'It makes no difference, because the right to education is met just by having a place at school.' ] },
      correct:0,
      hint:{ es:'Recuerda que un derecho alcanza a todas las personas y que una votación no puede recortarlo.',
             en:'Remember that a right reaches every person and that a vote cannot cut it back.' },
      explanation:{ es:'La igualdad no significa dar exactamente lo mismo, sino remover las barreras que dejan a alguien fuera. Apartar al alumnado con discapacidad lo excluye en lugar de incluirlo, y una mayoría no puede decidir sobre un derecho.',
                    en:'Equality does not mean giving exactly the same, but removing the barriers that leave someone out. Setting students with disabilities apart excludes them instead of including them, and a majority cannot decide over a right.' } },
    { title:{ es:'Igualdad en la escuela', en:'Equality at school' }, showWork:false,
      stmt:{ es:'Una escuela pide a las familias recién llegadas de otro estado un comprobante extra que no solicita a las demás, y mientras tanto no inscribe a sus hijas e hijos. ¿Qué postura se apoya mejor en los derechos humanos?',
             en:'A school asks families newly arrived from another state for an extra document it does not require from the others, and meanwhile does not enroll their children. Which stance is best grounded in human rights?' },
      options:{ es:[
        'El requisito extra discrimina por origen y no puede condicionar el acceso a la escuela.',
        'El requisito es válido mientras la escuela avisa con tiempo a las familias afectadas.',
        'El requisito es correcto, porque cada escuela fija libremente sus reglas de inscripción.',
        'El requisito es un asunto menor, porque los estudiantes pueden inscribirse el año siguiente.' ],
        en:[
        'The extra requirement discriminates by origin and cannot condition access to school.',
        'The requirement is valid as long as the school warns the affected families in advance.',
        'The requirement is fine, because each school freely sets its own enrollment rules.',
        'The requirement is a minor issue, because the students can enroll the following year.' ] },
      correct:0,
      hint:{ es:'Compara el trato que reciben dos familias que necesitan exactamente lo mismo.',
             en:'Compare the treatment given to two families that need exactly the same thing.' },
      explanation:{ es:'Pedir más a unas familias que a otras por su lugar de origen es un trato desigual sin justificación, y el resultado es que unos niños quedan fuera de la escuela mientras otros entran.',
                    en:'Asking more from some families than others because of where they come from is unequal treatment with no justification, and the result is that some children stay out of school while others get in.' } }
  ], rng), rng);

  /* ── PROBLEMA 9 (numérico, situación real) ──────────────────── */
  addProblem(pick([
    (function(){
      var G = 6 + Math.floor(rng() * 5);
      var Sz = 28 + Math.floor(rng() * 8);
      var T = G * Sz;
      var D = 40 + Math.floor(rng() * 60);
      var ans = T - D;
      return { title:{ es:'Cuentas de la comunidad', en:'Community count' }, showWork:true, fn:'',
        stmt:{ es:'Una secundaria tiene ' + G + ' grupos y en cada grupo hay ' + Sz + ' estudiantes. Al revisar el acceso a la escuela, ' + D + ' estudiantes de todo el plantel reportaron que caminan más de una hora para llegar. ¿Cuántos estudiantes del plantel no caminan más de una hora?',
               en:'A secondary school has ' + G + ' groups with ' + Sz + ' students in each. While reviewing access to school, ' + D + ' students in the whole school reported walking more than an hour to get there. How many students in the school do not walk more than an hour?' },
        options:{ es:[String(ans), String(T), String(ans + Sz), String(ans - Sz)],
                  en:[String(ans), String(T), String(ans + Sz), String(ans - Sz)] },
        correct:0,
        hint:{ es:'Primero necesitas saber cuántos estudiantes hay en todo el plantel, y solo después separar al grupo que reportó el trayecto largo.',
               en:'First you need the number of students in the whole school, and only then separate the group that reported the long walk.' },
        explanation:{ es:'El plantel tiene ' + G + ' × ' + Sz + ' = ' + T + ' estudiantes; al quitar a quienes caminan más de una hora quedan ' + T + ' − ' + D + ' = ' + ans,
                      en:'The school has ' + G + ' × ' + Sz + ' = ' + T + ' students; removing those who walk more than an hour leaves ' + T + ' − ' + D + ' = ' + ans } };
    })(),
    (function(){
      var E = 60 + Math.floor(rng() * 40);
      var R = 20 + Math.floor(rng() * 15);
      var C = 4 + Math.floor(rng() * 7);
      var ans = E - R - C;
      return { title:{ es:'Cuentas de la comunidad', en:'Community count' }, showWork:true, fn:'',
        stmt:{ es:'Un municipio tiene ' + E + ' escuelas y se comprometió a que todas cuenten con rampa de acceso. Al iniciar el ciclo ' + R + ' escuelas ya tenían rampa y durante el ciclo se construyeron ' + C + ' más. ¿Cuántas escuelas siguen sin rampa?',
               en:'A town has ' + E + ' schools and promised that all of them would have an access ramp. At the start of the year ' + R + ' schools already had one and during the year ' + C + ' more were built. How many schools still have no ramp?' },
        options:{ es:[String(ans), String(ans + C), String(ans + R), String(ans + R + C)],
                  en:[String(ans), String(ans + C), String(ans + R), String(ans + R + C)] },
        correct:0,
        hint:{ es:'Junta las rampas que ya existían con las que se construyeron y compara ese total con el número de escuelas.',
               en:'Add the ramps that already existed to the ones built and compare that total with the number of schools.' },
        explanation:{ es:'Con rampa hay ' + R + ' + ' + C + ' = ' + (R + C) + ' escuelas, de modo que sin rampa quedan ' + E + ' − ' + (R + C) + ' = ' + ans,
                      en:'There are ' + R + ' + ' + C + ' = ' + (R + C) + ' schools with a ramp, so the ones without a ramp are ' + E + ' − ' + (R + C) + ' = ' + ans } };
    })()
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Postura frente a la crítica', en:'Answering the critique' }, showWork:false,
      stmt:{ es:'Al terminar su investigación, un equipo concluye: “Los derechos humanos son solo un ideal bonito; como en muchos lugares no se cumplen, no sirven de nada.” ¿Qué postura crítica resulta más sólida frente a esa conclusión?',
             en:'After finishing their research, a team concludes: “Human rights are just a nice ideal; since they are not met in many places, they are useless.” Which critical stance is stronger against that conclusion?' },
      options:{ es:[
        'Que su incumplimiento muestra una deuda pendiente, y que siguen sirviendo como criterio para exigir y medir avances.',
        'Que en efecto no sirven, porque un derecho que no se cumple deja de existir para todo el mundo.',
        'Que sí se cumplen siempre, y que los casos contrarios son invento de quienes protestan.',
        'Que su utilidad depende de que cada persona decida cuáles quiere respetar en su vida diaria.' ],
        en:[
        'That failing to meet them shows an outstanding debt, and they still work as a standard to demand and measure progress.',
        'That they are indeed useless, because a right that is not met stops existing for everybody.',
        'That they are always met, and that the cases to the contrary are invented by protesters.',
        'That their usefulness depends on each person deciding which ones to respect in daily life.' ] },
      correct:0,
      hint:{ es:'Distingue entre lo que un derecho promete y lo que sirve para reclamar cuando la promesa no se cumple.',
             en:'Tell apart what a right promises from what it is useful for when the promise is not met.' },
      explanation:{ es:'Que un derecho no se cumpla no lo anula: al contrario, es la regla que permite nombrar el incumplimiento, exigir a la autoridad y comparar la situación de un año con la del siguiente.',
                    en:'A right not being met does not cancel it: on the contrary, it is the standard that lets you name the failure, demand action and compare one year with the next.' } },
    { title:{ es:'Postura frente a la crítica', en:'Answering the critique' }, showWork:false,
      stmt:{ es:'Un compañero sostiene: “Como cada cultura es distinta, no puede haber derechos válidos para todo el mundo.” ¿Qué respuesta defiende mejor la idea de los derechos humanos como valores compartidos?',
             en:'A classmate argues: “Since every culture is different, there cannot be rights valid for everyone.” Which answer best defends the idea of human rights as shared values?' },
      options:{ es:[
        'Que las formas culturales varían, pero el acuerdo mínimo sobre la dignidad de cada persona se sostiene en todas.',
        'Que las culturas distintas deben unificarse primero para que los derechos puedan aplicarse.',
        'Que los derechos valen solo dentro de los países que participaron en su redacción original.',
        'Que las diferencias culturales son un obstáculo que la ley tendría que eliminar poco a poco.' ],
        en:[
        'That cultural forms vary, but the minimum agreement about the dignity of each person holds in all of them.',
        'That different cultures must first be unified before rights can be applied anywhere.',
        'That rights are valid only inside the countries that took part in writing them.',
        'That cultural differences are an obstacle the law should gradually remove.' ] },
      correct:0,
      hint:{ es:'Recuerda las tres costumbres distintas que protegían un mismo valor de fondo.',
             en:'Recall the three different customs that protected one and the same underlying value.' },
      explanation:{ es:'La diversidad cultural no impide el acuerdo: sociedades muy distintas coinciden en que nadie debe ser esclavizado, humillado ni dejado sin escuela. Cambia la forma de cuidarlo, no el valor que se cuida.',
                    en:'Cultural diversity does not block agreement: very different societies coincide in that no one should be enslaved, humiliated or left without school. The way of protecting it changes, not the value protected.' } }
  ], rng), rng);
}
</script>
