        '<button class="wtab active" onclick="cuTab(\'type\',this)">⌨️ ' + T('Escribir', 'Write') + '</button>' +
        '<button class="wtab" onclick="cuTab(\'draw\',this)">✏️ ' + T('Dibujar', 'Sketch') + '</button>' +
      '</div>' +
      '<div class="wpanel active" id="cu_type"><textarea class="wtextarea" id="cuTa" placeholder="' +
        T('Escribe aquí tus notas…', 'Write your notes here…') + '"></textarea></div>' +
      '<div class="wpanel" id="cu_draw"><div class="cvwrap"><canvas class="dcanvas" id="cuCv"></canvas>' +
        '<div class="ctoolbar">' +
          '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
          '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
          '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
          drawDotsHTML() +
          '<button class="clrbtn">' + t('btn-clear') + '</button>' +
        '</div></div></div>' +
      '<div style="margin-top:.7rem"><button class="iwbtn" onclick="cuSave()">' + T('Guardar', 'Save') + '</button></div>' +
      '<div class="iw-fb" id="cuFb"></div>';
    window.cuTab = function (which, btn) {
      ['type', 'draw'].forEach(function (x) {
        document.getElementById('cu_' + x).classList.toggle('active', x === which);
      });
      w.querySelectorAll('.wtab').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function () { var c = document.getElementById('cuCv'); if (c) initCanvas(c); }, 60);
    };
    window.cuSave = function () {
      var v = (document.getElementById('cuTa').value || '').trim();
      document.getElementById('cuFb').innerHTML = (v.length < 30)
        ? T('Amplíalo un poco: añade en qué te apoyas y quién tendría que leerlo para que sirva de algo.',
            'Stretch it a little: add what you are resting on and who would have to read it for it to be of any use.')
        : '<span class="iw-ok">' + T('Guardado. Aquí no hay una sola respuesta buena: relee tu tesis y pregúntate si alguien podría discutirla.',
                                     'Saved. There is no single good answer here: read your thesis again and ask whether somebody could argue with it.') + '</span>';
    };
  }

  /* ═════════ constructor de tarjetas ═════════ */
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: false,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

  /* ═════════ banco de preguntas ═════════ */

  function q1() {
    var c = optOf(TXI, 'tesis');
    var d3 = (rng() < 0.5) ? 'ejemplo' : 'voz';
    return {
      title:{ es:'Dónde está la postura', en:'Where the position is' },
      q:{ es:'Los cuatro fragmentos de las opciones están tomados del Texto I. Determina cuál enuncia la postura que quien escribe se compromete a defender a lo largo de todo el ensayo.',
          en:'The four fragments in the options are taken from Text I. Determine which one states the position the writer commits to defending throughout the essay.' },
      hint:{ es:'Tres de los fragmentos aportan un hecho, un caso o una solución. Busca el único que afirma algo con lo que otra persona podría no estar de acuerdo y que obliga al resto del texto a sostenerlo.',
             en:'Three of the fragments bring in a fact, a case or a solution. Look for the only one that claims something another person could disagree with and that forces the rest of the text to hold it up.' },
      exp:{ es:'La tesis es la afirmación discutible que organiza el ensayo entero: separa lo que parece el problema de lo que quien escribe cree que es el problema. El dato y el ejemplo no se discuten, se comprueban, y por eso sirven para apoyarla; la propuesta llega al final, cuando la tesis ya está defendida.',
            en:'The thesis is the arguable claim that organises the whole essay: it separates what looks like the problem from what the writer believes the problem is. The fact and the example are not argued but checked, which is why they serve to support it; the proposal comes at the end, once the thesis has been defended.' },
      options:[ c, optOf(TXI, 'dato'), optOf(TXI, d3), optOf(TXI, 'propuesta') ],
      correct: c
    };
  }

  function q2() {
    var c = { es:'Porque nombra el asunto del que habla el ensayo, pero no dice qué sostiene quien escribe sobre ese asunto, que es lo único que alguien podría discutirle.',
              en:'Because it names the subject the essay talks about, but does not say what the writer maintains about that subject, which is the only thing somebody could dispute.' };
    return {
      title:{ es:'Asunto y postura', en:'Subject and position' },
      q:{ es:'Un compañero resume el Texto I diciendo: ' + CIT(T('trata sobre ', 'it is about ') + L(C.tema)) + '. Determina por qué ese resumen todavía no dice cuál es la postura crítica del ensayo.',
          en:'A classmate sums up Text I by saying: ' + CIT(T('trata sobre ', 'it is about ') + L(C.tema)) + '. Determine why that summary still does not say what the critical position of the essay is.' },
      hint:{ es:'Compara el resumen con la primera oración en la que quien escribe usa el verbo sostengo. Pregúntate cuál de las dos podría recibir un no estoy de acuerdo.',
             en:'Compare the summary with the first sentence in which the writer uses the verb I maintain. Ask which of the two could receive a disagreement.' },
      exp:{ es:'El asunto es aquello de lo que se habla y lo comparten todos los textos sobre el mismo problema, incluido el Texto II. La postura es lo que quien escribe afirma sobre ese asunto y es lo que puede rebatirse. Por eso dos ensayos sobre el mismo asunto pueden sostener posturas contrarias.',
            en:'The subject is what is being talked about, and every text on the same problem shares it, Text II included. The position is what the writer claims about that subject and it is what can be disputed. That is why two essays on the same subject can hold opposite positions.' },
      options:[ c,
        { es:'Porque el resumen deja fuera los datos del ensayo, que son la parte que de verdad convence a quien lee.',
          en:'Because the summary leaves out the facts of the essay, which are the part that really convinces the reader.' },
        { es:'Porque un ensayo no trata sobre un asunto de la comunidad, sino sobre la experiencia personal de quien lo escribe.',
          en:'Because an essay is not about a community subject, but about the personal experience of whoever writes it.' },
        { es:'Porque el resumen es demasiado breve y un ensayo necesita al menos tres oraciones para quedar resumido.',
          en:'Because the summary is too short and an essay needs at least three sentences to be summed up.' } ],
      correct: c
    };
  }

  function q3() {
    if (rng() < 0.5) {
      var c1 = { es:'El problema de mi calle no es que la gente tire basura, sino que el camión pasa a una hora en la que casi nadie está en casa.',
                 en:'The problem on my street is not that people throw rubbish, but that the lorry comes at a time when almost nobody is at home.' };
      return {
        title:{ es:'Cuál sirve como tesis', en:'Which one works as a thesis' },
        q:{ es:'Cuatro estudiantes escriben la primera oración de su ensayo sobre la basura de su calle. Determina cuál de las cuatro funciona como tesis.',
            en:'Four students write the opening sentence of their essay about the rubbish on their street. Determine which of the four works as a thesis.' },
        hint:{ es:'Prueba cada oración con esta pregunta: ¿otra persona podría responder que no está de acuerdo y tener algo que discutir? Los hechos se comprueban, los sentimientos no se discuten y un tema no afirma nada.',
               en:'Test each sentence with this question: could another person answer that they disagree and have something to argue about? Facts are checked, feelings are not argued with and a topic claims nothing.' },
        exp:{ es:'Una tesis afirma algo discutible sobre un asunto acotado. Contar cuánto tiempo lleva la basura es un dato que se verifica; decir que da asco expresa una reacción que nadie puede rebatir; anunciar el tema no compromete a quien escribe con ninguna idea. Solo la primera opción sostiene algo que otra persona podría negar y que obliga al resto del ensayo a defenderla.',
              en:'A thesis claims something arguable about a narrow subject. Saying how long the rubbish has been there is a fact to verify; saying it is disgusting expresses a reaction nobody can dispute; announcing the topic commits the writer to no idea at all. Only the first option holds something another person could deny and that forces the rest of the essay to defend it.' },
        options:[ c1,
          { es:'En el camellón de mi calle se acumula basura desde hace tres meses.',
            en:'Rubbish has been piling up on the median strip of my street for three months.' },
          { es:'La basura de mi calle es asquerosa y me da mucho coraje cada vez que paso.',
            en:'The rubbish on my street is disgusting and makes me really angry every time I walk past.' },
          { es:'Este texto trata sobre el problema de la basura en las ciudades del país.',
            en:'This text is about the problem of rubbish in the cities of this country.' } ],
        correct: c1
      };
    }
    var c2 = { es:'La falta de luz en las cuadras que llevan a la escuela no es un descuido del vecindario, sino una obra que se entregó a medias y que nadie ha reclamado por escrito.',
               en:'The lack of light on the blocks leading to the school is not neighbourhood carelessness, but a job handed over half finished that nobody has claimed for in writing.' };
    return {
      title:{ es:'Cuál sirve como tesis', en:'Which one works as a thesis' },
      q:{ es:'Cuatro estudiantes escriben la primera oración de su ensayo sobre el alumbrado de las cuadras que llevan a su escuela. Determina cuál de las cuatro funciona como tesis.',
          en:'Four students write the opening sentence of their essay about the lighting on the blocks leading to their school. Determine which of the four works as a thesis.' },
      hint:{ es:'Prueba cada oración con esta pregunta: ¿otra persona podría responder que no está de acuerdo y tener algo que discutir? Los hechos se comprueban, los sentimientos no se discuten y un tema no afirma nada.',
             en:'Test each sentence with this question: could another person answer that they disagree and have something to argue about? Facts are checked, feelings are not argued with and a topic claims nothing.' },
      exp:{ es:'Una tesis afirma algo discutible sobre un asunto acotado. Contar las lámparas fundidas es un dato que se verifica; decir que caminar ahí es horrible expresa una reacción que nadie puede rebatir; anunciar el tema de la inseguridad no compromete a quien escribe con ninguna idea. Solo la primera opción atribuye una causa que otra persona podría negar.',
            en:'A thesis claims something arguable about a narrow subject. Counting the burnt out lamps is a fact to verify; saying that walking there is horrible expresses a reaction nobody can dispute; announcing the topic of insecurity commits the writer to no idea at all. Only the first option assigns a cause another person could deny.' },
      options:[ c2,
        { es:'Seis de las nueve lámparas de esas cuadras llevan meses fundidas.',
          en:'Six of the nine lamps on those blocks have been burnt out for months.' },
        { es:'Caminar por ahí de noche es horrible y a mí me da mucho miedo.',
          en:'Walking there at night is horrible and it frightens me a lot.' },
        { es:'Este texto trata sobre el problema de la inseguridad en las ciudades.',
          en:'This text is about the problem of insecurity in cities.' } ],
      correct: c2
    };
  }

  function q4() {
    var c = { es:'Enuncia un hecho que cualquiera puede comprobar y con el que nadie va a discutir; una tesis necesita afirmar algo que otra persona pueda rebatir.',
              en:'It states a fact anybody can check and that nobody is going to argue with; a thesis needs to claim something another person could dispute.' };
    return {
      title:{ es:'Lo que le falta a esa oración', en:'What that sentence is missing' },
      q:{ es:'Alguien propone que la tesis del Texto I sea esta oración: ' + CIT(L(C.hecho)) + ' Determina qué le falta para funcionar como tesis.',
          en:'Somebody proposes that the thesis of Text I be this sentence: ' + CIT(L(C.hecho)) + ' Determine what it is missing in order to work as a thesis.' },
      hint:{ es:'Imagina que otra persona lee esa oración y quiere contestarle. Pregúntate qué podría responderle, aparte de ir a mirar si es cierta.',
             en:'Imagine another person reads that sentence and wants to answer back. Ask what they could reply, apart from going to see whether it is true.' },
      exp:{ es:'Los hechos son el material con el que se apoya una tesis, no la tesis misma. Frente a un hecho solo caben dos respuestas: es cierto o no lo es, y eso se resuelve mirando. Frente a una tesis caben muchas: se puede aceptar, matizar o rebatir con otras razones, y por eso el ensayo tiene algo que defender. La extensión, las cifras y la primera persona no deciden nada aquí.',
            en:'Facts are the material a thesis is supported with, not the thesis itself. Faced with a fact there are only two replies: it is true or it is not, and that is settled by looking. Faced with a thesis there are many: it can be accepted, qualified or disputed with other reasons, and that is why the essay has something to defend. Length, figures and the first person decide nothing here.' },
      options:[ c,
        { es:'Es demasiado breve; una tesis necesita al menos tres renglones para quedar suficientemente clara.',
          en:'It is too short; a thesis needs at least three lines in order to be clear enough.' },
        { es:'No incluye ninguna cifra, y toda tesis debe apoyarse en un número exacto para ser tomada en serio.',
          en:'It includes no figure, and every thesis must rest on an exact number to be taken seriously.' },
        { es:'No está escrita en primera persona, y el ensayo se escribe siempre desde el yo de quien firma.',
          en:'It is not written in the first person, and an essay is always written from the I of whoever signs it.' } ],
      correct: c
    };
  }

  function q5() {
    var K = ['dato', 'voz', 'concesion', 'enumeracion'];
    var k = K[Math.floor(rng() * K.length)];
    var otros = ['dato', 'voz', 'concesion', 'enumeracion', 'ejemplo', 'refuta', 'propuesta'].filter(function (x) { return x !== k; });
    var pick3 = shuffle(otros, rng).slice(0, 3);
    return {
      title:{ es:'Qué hace ese fragmento', en:'What that fragment does' },
      q:{ es:'En el Texto I aparece este fragmento: ' + quoted(TXI, k) + ' Determina qué función cumple dentro del ensayo.',
          en:'This fragment appears in Text I: ' + quoted(TXI, k) + ' Determine what job it does inside the essay.' },
      hint:{ es:'No te fijes en lo que el fragmento cuenta, sino en para qué está puesto ahí. Pregúntate qué perdería el ensayo si lo quitaras.',
             en:'Do not look at what the fragment tells, but at what it is put there for. Ask what the essay would lose if you removed it.' },
      exp:{ es:'Cada pieza de un ensayo tiene un trabajo distinto: unas aportan pruebas, otra admite la objeción contraria, otra enumera para que se sienta el tamaño del problema y otra propone el cierre. Este fragmento ' + L(FUN[k].d) + ', y por eso ocupa el lugar que ocupa en el texto.',
            en:'Each piece of an essay has a different job: some bring evidence, one admits the opposite objection, one enumerates so the size of the problem is felt and one proposes the closing. This fragment ' + L(FUN[k].d) + ', and that is why it sits where it sits in the text.' },
      options:[ ACT[k], ACT[pick3[0]], ACT[pick3[1]], ACT[pick3[2]] ],
      correct: ACT[k]
    };
  }

  function q6() {
    var c = optOf(TXI, 'dato');
    return {
      title:{ es:'El apoyo que se puede verificar', en:'The support that can be verified' },
      q:{ es:'Quien lee un ensayo puede ir a comprobar algunos de sus enunciados y otros no. De estos cuatro, tomados de los dos textos, determina cuál puede comprobarse fuera del texto.',
          en:'A reader of an essay can go and check some of its statements and not others. Of these four, taken from the two texts, determine which one can be checked outside the text.' },
      hint:{ es:'Pregúntate de cada opción: ¿a quién tendría que preguntarle o qué tendría que mirar para saber si es cierta? Si no hay a quién preguntar ni qué mirar, el enunciado no se puede verificar.',
             en:'Ask of each option: whom would I have to ask, or what would I have to look at, to know whether it is true? If there is nobody to ask and nothing to look at, the statement cannot be verified.' },
      exp:{ es:'Un apoyo verificable señala una fuente concreta: un informe, un plano, un registro o una persona identificable. Una generalización que dice todos no cuenta a nadie; una exageración que dice nunca se desmiente con un solo caso; una metáfora hace ver el problema, pero no es un dato y no pretende serlo. Por eso la fuerza de una postura crítica depende de cuántos de sus apoyos alguien podría ir a revisar.',
            en:'A verifiable support points to a concrete source: a report, a map, a record or an identifiable person. A generalisation that says everybody counts nobody; an exaggeration that says never is disproved by a single case; a metaphor makes the problem visible, but it is not a fact and does not claim to be. That is why the strength of a critical position depends on how many of its supports somebody could go and check.' },
      options:[ c, optOf(TXC, 'generaliza'), optOf(TXC, 'exagera'), optOf(TXI, 'metafora') ],
      correct: c
    };
  }

  function q7() {
    var K = ['metafora', 'retorica', 'contraste', 'enumeracion'];
    var k = K[Math.floor(rng() * K.length)];
    var otros = K.filter(function (x) { return x !== k; });
    return {
      title:{ es:'El efecto que busca', en:'The effect it seeks' },
      q:{ es:'Vuelve a leer este fragmento del Texto I: ' + quoted(TXI, k) + ' Determina qué efecto busca producir en quien lee.',
          en:'Read this fragment of Text I again: ' + quoted(TXI, k) + ' Determine what effect it seeks to produce in the reader.' },
      hint:{ es:'La información de esa parte podría decirse en una frase seca. Pregúntate qué le pasa a quien lee cuando se dice de esta otra manera.',
             en:'The information in that part could be said in one dry sentence. Ask what happens to the reader when it is said in this other way.' },
      exp:{ es:'La función creativa del lenguaje no adorna el ensayo: lo hace trabajar. ' + L(EFECTO[k]) + ' Ese efecto es lo que distingue a un ensayo de un informe: los dos pueden decir lo mismo, pero solo uno busca mover a quien lee hacia una postura.',
            en:'The creative function of language does not decorate the essay: it makes it work. ' + L(EFECTO[k]) + ' That effect is what tells an essay apart from a report: both can say the same thing, but only one seeks to move the reader towards a position.' },
      options:[ EFECTO[k], EFECTO[otros[0]], EFECTO[otros[1]], EFECTO[otros[2]] ],
      correct: EFECTO[k]
    };
  }

  function q8() {
    var c = { es:'La idea se conserva, pero se pierde la imagen que la vuelve visible y memorable, que es la parte del ensayo que trabaja sobre quien lee.',
              en:'The idea is kept, but the image that makes it visible and memorable is lost, and that is the part of the essay that works on the reader.' };
    return {
      title:{ es:'Si se dijera sin imagen', en:'If it were said with no image' },
      q:{ es:'Un compañero propone quitar la metáfora del Texto I y escribir en su lugar la frase ' + CIT(L(C.neutro)) + '. Determina qué cambia en el ensayo con esa sustitución.',
          en:'A classmate proposes removing the metaphor from Text I and writing the phrase ' + CIT(L(C.neutro)) + ' in its place. Determine what changes in the essay with that substitution.' },
      hint:{ es:'Las dos versiones informan de lo mismo. Compara qué te queda en la cabeza después de leer cada una y quién queda convencido con cada una.',
             en:'Both versions report the same thing. Compare what stays in your head after reading each one and who is convinced by each one.' },
      exp:{ es:'Un ensayo no solo demuestra: también busca que quien lee vea el problema. La metáfora traduce una situación abstracta a una escena que cualquiera reconoce, y esa escena se recuerda mucho después de que las cifras se olvidan. La frase neutra dice lo mismo y no engaña a nadie, pero deja al ensayo sin la parte que convence por la vía de hacer ver. La tesis, en cambio, sigue siendo la misma en las dos versiones.',
            en:'An essay does not only prove: it also seeks to make the reader see the problem. The metaphor turns an abstract situation into a scene anybody recognises, and that scene is remembered long after the figures are forgotten. The neutral phrase says the same and misleads nobody, but it leaves the essay without the part that convinces by making things visible. The thesis, on the other hand, stays the same in both versions.' },
      options:[ c,
        { es:'No cambia nada, porque las dos versiones dicen lo mismo y una metáfora es solo un adorno del texto.',
          en:'Nothing changes, because both versions say the same and a metaphor is only an ornament of the text.' },
        { es:'El ensayo gana precisión, porque una metáfora introduce siempre información falsa en el argumento.',
          en:'The essay gains precision, because a metaphor always introduces false information into the argument.' },
        { es:'El ensayo se queda sin tesis, porque la metáfora era la afirmación que el texto se dedicaba a defender.',
          en:'The essay is left with no thesis, because the metaphor was the claim the text set out to defend.' } ],
      correct: c
    };
  }

  function q9() {
    if (rng() < 0.5) {
      var c1 = { es:'El Texto I apoya lo que afirma con datos, ejemplos y voces, y responde a la objeción más fuerte; el Texto II repite su molestia y descalifica a quienes decidieron.',
                 en:'Text I backs what it claims with facts, examples and voices, and answers the strongest objection; Text II repeats its annoyance and discredits those who decided.' };
      return {
        title:{ es:'Postura crítica o queja', en:'Critical position or complaint' },
        q:{ es:'Los dos textos están molestos por lo mismo y defienden posturas parecidas, pero solo uno sostiene una postura crítica. Determina qué diferencia lo explica.',
            en:'Both texts are annoyed about the same thing and defend similar positions, but only one holds a critical position. Determine which difference explains it.' },
        hint:{ es:'Subraya mentalmente en cada texto los enunciados que otra persona podría ir a verificar. Después cuenta cuántos quedan en cada uno.',
               en:'Mentally underline in each text the statements another person could go and verify. Then count how many are left in each.' },
        exp:{ es:'Una postura crítica no se mide por el enojo ni por la extensión, sino por lo que la sostiene: apoyos que se pueden comprobar y una respuesta a lo que dice la parte contraria. Los dos textos hablan en primera persona y los dos toman partido desde la primera línea; lo que cambia es que uno se hace cargo de sus afirmaciones y el otro las declara y ataca a quien no las comparte.',
              en:'A critical position is not measured by anger or by length, but by what holds it up: supports that can be checked and an answer to what the other side says. Both texts speak in the first person and both take sides from the first line; what changes is that one takes responsibility for its claims and the other declares them and attacks whoever does not share them.' },
        options:[ c1,
          { es:'El Texto I es mucho más largo, y la extensión es lo que convierte una opinión suelta en un ensayo.',
            en:'Text I is much longer, and length is what turns a loose opinion into an essay.' },
          { es:'El Texto I evita hablar en primera persona, mientras que el Texto II se permite decir yo todo el tiempo.',
            en:'Text I avoids speaking in the first person, while Text II allows itself to say I all the time.' },
          { es:'El Texto I describe el problema sin tomar partido, mientras que el Texto II toma partido desde la primera línea.',
            en:'Text I describes the problem without taking sides, while Text II takes sides from the first line.' } ],
        correct: c1
      };
    }
    var c2 = { es:'Atribuye a todo un grupo una conducta que no cuenta ni comprueba, de modo que basta un solo caso contrario para tumbarla.',
               en:'It attributes to a whole group a behaviour it neither counts nor checks, so that one single case against is enough to knock it down.' };
    return {
      title:{ es:'Por qué ese enunciado no sostiene', en:'Why that statement does not hold' },
      q:{ es:'El Texto II afirma: ' + quoted(TXC, 'generaliza') + ' Determina por qué ese enunciado debilita la postura que el propio texto defiende.',
          en:'Text II claims: ' + quoted(TXC, 'generaliza') + ' Determine why that statement weakens the very position the text defends.' },
      hint:{ es:'Pregúntate a cuántas personas tendría que haber observado quien escribe para poder decir todos, y qué pasaría si alguien encontrara una sola excepción.',
             en:'Ask how many people the writer would have had to observe in order to say everybody, and what would happen if somebody found a single exception.' },
      exp:{ es:'Una afirmación que abarca a todo un grupo se derrumba con un solo contraejemplo, así que quien la usa le entrega a la parte contraria la manera más fácil de responderle. El Texto I, en cambio, dice cuántas calles surte el pozo, en qué asamblea se leyó el informe y quién dijo cada cosa: eso puede revisarse y por eso es más difícil de tumbar. Generalizar no es un problema de tono, es un problema de resistencia del argumento.',
            en:'A claim that covers a whole group collapses with one single counterexample, so whoever uses it hands the other side the easiest way to answer back. Text I, by contrast, says how many streets the well supplies, at which assembly the report was read and who said each thing: that can be checked and is therefore harder to knock down. Generalising is not a problem of tone, it is a problem of how much weight the argument can take.' },
      options:[ c2,
        { es:'Usa palabras demasiado coloquiales, y un texto de opinión exige siempre un vocabulario formal.',
          en:'It uses words that are too colloquial, and an opinion text always demands formal vocabulary.' },
        { es:'Habla de personas concretas del barrio, y una postura crítica debe referirse siempre a las autoridades.',
          en:'It speaks about specific people in the neighbourhood, and a critical position must always refer to the authorities.' },
        { es:'Menciona un problema distinto del que anuncia al principio, de modo que el texto cambia de asunto.',
          en:'It mentions a problem different from the one announced at the start, so the text changes subject.' } ],
      correct: c2
    };
  }

  function q10() {
    if (rng() < 0.5) {
      var c1 = { es:'Muestra que quien escribe conoce la objeción más fuerte y puede responderla, de modo que su tesis ya no depende de ignorarla.',
                 en:'It shows that the writer knows the strongest objection and can answer it, so the thesis no longer depends on ignoring it.' };
      return {
        title:{ es:'Admitir para poder responder', en:'Admitting in order to answer' },
        q:{ es:'Antes de defenderse, el Texto I dedica una línea a admitir esto: ' + quoted(TXI, 'concesion') + ' Determina por qué admitirlo fortalece su postura en lugar de debilitarla.',
            en:'Before defending itself, Text I devotes a line to admitting this: ' + quoted(TXI, 'concesion') + ' Determine why admitting it strengthens its position instead of weakening it.' },
        hint:{ es:'Lee lo que viene inmediatamente después de esa línea. Pregúntate qué le quedaría por decir a quien piensa lo contrario cuando llega a ese punto.',
               en:'Read what comes immediately after that line. Ask what somebody who thinks the opposite would have left to say when they reach that point.' },
        exp:{ es:'Admitir lo que tiene de cierto la posición contraria se llama concesión, y sirve para dos cosas: le quita a quien discute su mejor argumento, porque ya está reconocido, y demuestra que la tesis se sostiene incluso aceptándolo. Por eso la concesión va seguida siempre de una respuesta que explica por qué eso no basta. Quien nunca concede nada suele estar defendiendo una postura que solo se sostiene si no se mira el otro lado.',
              en:'Admitting what is true in the opposite position is called a concession, and it does two things: it takes away the opponent best argument, because it is already acknowledged, and it shows that the thesis holds even when that is accepted. That is why a concession is always followed by an answer explaining why it is not enough. Whoever concedes nothing is usually defending a position that only holds if the other side is not looked at.' },
        options:[ c1,
          { es:'Suaviza el tono del ensayo y evita que alguien de la comunidad se moleste con lo que viene después.',
            en:'It softens the tone of the essay and keeps anybody in the community from getting upset with what follows.' },
          { es:'Una postura crítica solo se acepta si quien la defiende cede una parte de lo que estaba pidiendo.',
            en:'A critical position is only accepted if whoever defends it gives up part of what they were asking for.' },
          { es:'Al admitirlo, el ensayo cambia de tesis y adopta la de la parte contraria para evitar el conflicto.',
            en:'By admitting it, the essay changes its thesis and adopts the opposite one in order to avoid conflict.' } ],
        correct: c1
      };
    }
    var c2 = { es:'Convierte la crítica en algo que la comunidad puede discutir y decidir, y deja ver que la postura apunta a cambiar el problema y no solo a nombrarlo.',
               en:'It turns the criticism into something the community can discuss and decide on, and shows that the position aims to change the problem and not only to name it.' };
    return {
      title:{ es:'Para qué sirve el cierre', en:'What the closing is for' },
      q:{ es:'El Texto I termina así: ' + quoted(TXI, 'propuesta') + ' Determina qué le aporta ese cierre a la postura crítica del ensayo.',
          en:'Text I ends like this: ' + quoted(TXI, 'propuesta') + ' Determine what that closing adds to the critical position of the essay.' },
      hint:{ es:'Compara ese final con el del Texto II, que pide que alguien haga algo sin decir quién ni cómo. Pregúntate cuál de los dos puede llevarse a una asamblea.',
             en:'Compare that ending with the one in Text II, which asks for somebody to do something without saying who or how. Ask which of the two can be taken to an assembly.' },
      exp:{ es:'Una postura crítica que se queda en el diagnóstico deja a la comunidad con el problema descrito y sin nada que decidir. La propuesta final nombra una acción concreta y a quién le toca tomarla, así que puede aceptarse, corregirse o rechazarse en una reunión. La tesis sigue siendo la afirmación central del ensayo; la propuesta es lo que esa afirmación permite pedir una vez defendida.',
            en:'A critical position that stops at the diagnosis leaves the community with the problem described and nothing to decide. The final proposal names a concrete action and who has to take it, so it can be accepted, corrected or rejected at a meeting. The thesis is still the central claim of the essay; the proposal is what that claim allows you to ask for once it has been defended.' },
      options:[ c2,
        { es:'Sustituye a la tesis, porque en todo ensayo la propuesta final es la verdadera afirmación que se defiende.',
          en:'It replaces the thesis, because in every essay the final proposal is the real claim being defended.' },
        { es:'Sirve para alargar el texto cuando los datos reunidos no alcanzaron para llenar la última parte.',
          en:'It serves to lengthen the text when the facts gathered were not enough to fill the last part.' },
        { es:'Garantiza que la autoridad responda, porque toda propuesta escrita obliga a quien la recibe a contestarla.',
          en:'It guarantees a reply from the authorities, because every written proposal obliges the recipient to answer.' } ],
      correct: c2
    };
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Escribir para tomar partido', 'Writing in order to take sides'),
      '<p>' + T('En tu comunidad hay problemas de los que todo el mundo habla en la tienda, en el camión y en la puerta de la escuela, y sobre los que casi nadie escribe. El ensayo es el texto que se hace cargo de esa conversación: alguien que vive el problema toma partido por escrito, dice qué sostiene sobre él y se compromete a defenderlo delante de quien piense distinto. No es un reporte, porque no se limita a informar; no es una queja, porque no se limita a expresar molestia. Un ensayo con postura crítica hace las dos cosas al mismo tiempo: aporta lo que puede comprobarse y elige la manera de decirlo para que quien lee vea el problema como lo ve quien escribe.',
                'In your community there are problems everybody talks about in the shop, on the bus and at the school gate, and about which hardly anybody writes. The essay is the text that takes charge of that conversation: somebody who lives the problem takes sides in writing, says what they maintain about it and commits to defending it in front of anyone who thinks otherwise. It is not a report, because it does not stop at informing; it is not a complaint, because it does not stop at expressing annoyance. An essay with a critical position does both things at once: it brings in what can be checked and it chooses the way of saying it so the reader sees the problem the way the writer sees it.') + '</p>' +
      '<p>' + T('Aquí vas a trabajar con dos textos escritos sobre el mismo problema de la misma comunidad. El primero es un ensayo escolar; el segundo, un comentario publicado por alguien igual de molesto. Los dos toman partido desde la primera línea, y sin embargo solo uno sostiene una postura crítica. Los fragmentos marcados del Texto I son las piezas con las que trabajarás durante toda la guía.',
                'Here you are going to work with two texts written about the same problem in the same community. The first is a school essay; the second, a comment posted by somebody just as annoyed. Both take sides from the first line, and yet only one holds a critical position. The marked fragments of Text I are the pieces you will work with throughout the guide.') + '</p>' +
      textBlock(TXI, LBL1) +
      textBlock(TXC, LBL2) +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('en cada fragmento marcado del Texto I pregúntate qué se caería del ensayo si esa parte no estuviera.',
          'at each marked fragment of Text I, ask what would fall out of the essay if that part were not there.') + '</p></div>');
  widgetHilo();
  addP(q1());
  addP(q2());

  sec(T('La tesis', 'The thesis'),
      T('Una postura no es un tema ni un dato', 'A position is not a topic and not a fact'),
      '<p>' + T('Lo primero que se aprende al escribir un ensayo es a distinguir tres cosas que suelen confundirse. El asunto es aquello de lo que se habla: el agua, la cancha, la basura. El dato es un hecho que se puede verificar: cuántas lámparas están fundidas, qué día pasa el camión. La tesis es otra cosa: es lo que quien escribe afirma sobre el asunto, y su rasgo definitivo es que otra persona podría negarla con razones. Si nadie puede estar en desacuerdo con tu primera oración, todavía no tienes tesis; tienes un tema anunciado o un dato suelto.',
                'The first thing you learn when writing an essay is to tell apart three things that are often confused. The subject is what is being talked about: the water, the court, the rubbish. The fact is something that can be verified: how many lamps are burnt out, which day the lorry comes. The thesis is something else: it is what the writer claims about the subject, and its defining feature is that another person could deny it with reasons. If nobody can disagree with your opening sentence, you do not have a thesis yet; you have an announced topic or a loose fact.') + '</p>' +
      '<p>' + T('Una tesis útil para un ensayo comunitario cumple tres condiciones a la vez: el asunto cabe en tu comunidad y puedes observarlo, la afirmación puede rebatirse, y hay algo comprobable en lo que apoyarla. Cuando una de las tres falla, el ensayo se queda sin de dónde sostenerse. La mesa de trabajo que sigue existe para probar esas tres piezas por separado.',
                'A thesis that works for a community essay meets three conditions at once: the subject fits inside your community and you can observe it, the claim can be disputed, and there is something checkable to rest it on. When one of the three fails, the essay has nothing to hold on to. The work table that follows exists to test those three pieces separately.') + '</p>' +
      '<div class="glosslist">' +
        ['tesis', 'dato', 'propuesta'].map(function (k) {
          return '<div class="gloss"><div class="glossn">' + L(FUN[k].n) + '</div><div class="glossd">' + L(FUN[k].d) + '</div></div>';
        }).join('') +
      '</div>');
  widgetTesis();
  addP(q3());
  addP(q4());

  sec(T('Los apoyos', 'The supports'),
      T('Cómo se sostiene una postura', 'How a position is held up'),
      '<p>' + T('Una tesis sola no convence a nadie: hay que sostenerla. Los ensayos lo hacen con cuatro piezas que conviene no confundir. El dato aporta un hecho verificable y dice de dónde salió, para que quien lo dude pueda ir a revisarlo. El ejemplo baja el problema a un caso concreto, con nombre y detalle, porque una situación se entiende mejor cuando se ve ocurrir. La voz de quien conoce el caso trae las palabras de alguien que vive el problema de cerca y añade lo que ningún dato registra. Y hay una cuarta pieza que parece un error y no lo es: admitir lo que tiene de razón la postura contraria, para responderle enseguida y mostrar que la tesis aguanta incluso aceptándolo.',
                'A thesis on its own convinces nobody: it has to be held up. Essays do this with four pieces that are worth telling apart. The fact brings in something verifiable and says where it came from, so that anybody who doubts it can go and check. The example brings the problem down to a concrete case, with a name and a detail, because a situation is understood better when it is seen happening. The voice of somebody who knows the case brings in the words of a person who lives the problem at close range and adds what no figure records. And there is a fourth piece that looks like a mistake and is not: admitting what is right in the opposite position, in order to answer it at once and show that the thesis holds even when that is accepted.') + '</p>' +
      '<div class="glosslist">' +
        ['dato', 'ejemplo', 'voz', 'concesion', 'refuta'].map(function (k) {
          return '<div class="gloss"><div class="glossn">' + L(FUN[k].n) + '</div><div class="glossd">' + L(FUN[k].d) + '</div></div>';
        }).join('') +
      '</div>');
  widgetCaza();
  addP(q5());
  addP(q6());

  sec(T('La función creativa', 'The creative function'),
      T('Decirlo de manera que se vea', 'Saying it so that it can be seen'),
      '<p>' + T('Un ensayo podría escribirse entero con frases secas y seguiría siendo verdadero, pero probablemente no movería a nadie. Por eso quien escribe elige cómo decir cada cosa, y esa elección es la función creativa del español trabajando dentro de un texto que argumenta. Una metáfora traduce el problema a una escena que cualquiera ha vivido. Una pregunta retórica no pide respuesta: obliga a quien lee a dársela en silencio, y al dársela ya está participando. Una enumeración acumula elementos hasta que se siente el tamaño de lo que falta. Un contraste pone dos situaciones una junto a otra y deja que la diferencia se vea sola, sin nombrarla.',
                'An essay could be written entirely in dry sentences and would still be true, but it would probably move nobody. That is why the writer chooses how to say each thing, and that choice is the creative function of Spanish at work inside a text that argues. A metaphor turns the problem into a scene anybody has lived through. A rhetorical question asks for no answer: it forces the reader to give it silently, and in giving it they are already taking part. An enumeration piles up elements until the size of what is missing can be felt. A contrast sets two situations side by side and lets the difference show by itself, without naming it.') + '</p>' +
      '<p>' + T('Estos recursos no son adorno ni relleno: son parte del argumento. Un dato demuestra, una imagen hace ver, y una postura crítica necesita las dos cosas para llegar a quien todavía no está de acuerdo.',
                'These resources are neither ornament nor filler: they are part of the argument. A fact proves, an image makes visible, and a critical position needs both in order to reach somebody who does not agree yet.') + '</p>');
  widgetRecursos();
  addP(q7());
  addP(q8());

  sec(T('Evaluar posturas', 'Evaluating positions'),
      T('Lo que separa un ensayo de un desahogo', 'What separates an essay from letting off steam'),
      '<p>' + T('Los dos textos que leíste están molestos por lo mismo y sostienen posturas parecidas, pero no valen lo mismo como argumento. Evaluar una postura crítica no consiste en decidir si estás de acuerdo con ella: consiste en revisar en qué se apoya cada una de sus afirmaciones. Hay tres maneras rápidas de perder una discusión por escrito. La primera es declarar algo y no dar ninguna razón. La segunda es generalizar, decir todos o nadie sin haber contado, porque un solo caso contrario tumba la afirmación entera. La tercera es hablar de la persona que decidió en lugar de la decisión que tomó, que es la manera más segura de dejar el argumento sin responder.',
                'The two texts you read are annoyed about the same thing and hold similar positions, but they are not worth the same as an argument. Evaluating a critical position does not mean deciding whether you agree with it: it means checking what each of its claims rests on. There are three quick ways to lose an argument in writing. The first is to declare something and give no reason. The second is to generalise, to say everybody or nobody without having counted, because one single case against knocks the whole claim down. The third is to talk about the person who decided instead of the decision they took, which is the surest way of leaving the argument unanswered.') + '</p>' +
      '<div class="glosslist">' +
        ['sinrazon', 'generaliza', 'ataque', 'exagera'].map(function (k) {
          return '<div class="gloss"><div class="glossn">' + L(FALLA[k].n) + '</div><div class="glossd">' + L(FALLA[k].d) + '</div></div>';
        }).join('') +
      '</div>');
  widgetPeso();
  addP(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('De la postura a la mesa donde se decide', 'From the position to the table where things are decided'),
      '<p>' + T('Ya distinguiste el asunto de la postura, seguiste el hilo con el que un ensayo sostiene lo que afirma, viste cómo el lenguaje hace ver lo que los datos solo demuestran y comprobaste que el enojo, por legítimo que sea, no sostiene por sí solo ninguna crítica. Queda una última idea. Un ensayo sobre un problema de la comunidad no termina en la página: termina cuando alguien lo lee y tiene algo concreto que aceptar, corregir o rechazar. Por eso el cierre propone y dice quién debería decidir. Escribir así es una manera de participar sin esperar el turno.',
                'You have now told the subject apart from the position, followed the thread with which an essay holds up what it claims, seen how language makes visible what facts only prove, and checked that anger, however justified, holds up no criticism on its own. One last idea remains. An essay about a community problem does not end on the page: it ends when somebody reads it and has something concrete to accept, correct or reject. That is why the closing proposes and says who ought to decide. Writing like this is a way of taking part without waiting your turn.') + '</p>');
  widgetCuaderno();
  addP(q10());
}
window.addEventListener('beforeunload', saveSession);
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Postura Crítica ante Problemas Comunitarios: El Ensayo';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
