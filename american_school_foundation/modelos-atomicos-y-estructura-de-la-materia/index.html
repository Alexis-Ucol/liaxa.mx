    var o2 = nums([d2 * m, d2, d2 * (m - 1), d2 * (m + 1)]);
    v = { title:{ es:'La jornada completa', en:'The full session' },
      q:{ es:'Un grupo observó ' + d2 + ' desviaciones muy grandes por cada ' + B + ' partículas disparadas contra la lámina. Si en toda la jornada se dispararon ' + (B * m) + ' partículas al mismo ritmo, ¿cuántas desviaciones muy grandes se esperan?',
          en:'A group observed ' + d2 + ' very large deflections for every ' + B + ' particles fired at the foil. If ' + (B * m) + ' particles were fired during the whole session at the same rate, how many very large deflections are expected?' },
      opts:{ es:o2, en:o2 }, ci:0,
      hint:{ es:'Averigua cuántas veces cabe el grupo pequeño de partículas dentro del total de la jornada.',
             en:'Work out how many times the small group of particles fits inside the total for the session.' },
      exp:{ es:'La jornada equivale a ' + m + ' tandas de ' + B + ' partículas, y en cada tanda aparecen ' + d2 + ' desviaciones muy grandes: ' + d2 + ' × ' + m + ' = ' + (d2 * m),
            en:'The session is equivalent to ' + m + ' batches of ' + B + ' particles, and in each batch ' + d2 + ' very large deflections appear: ' + d2 + ' × ' + m + ' = ' + (d2 * m) } };
  }
  return fin(v, true);
}

function mkP8(rng){
  var V = [
    { title:{ es:'Dentro del protón', en:'Inside the proton' },
      q:{ es:'Los experimentos en aceleradores mostraron que el protón no es una pieza única: está formado por partículas más pequeñas llamadas quarks. ¿Qué idea de los primeros modelos del átomo queda corregida con ese hallazgo?',
          en:'Experiments in accelerators showed that the proton is not a single piece: it is made of smaller particles called quarks. Which idea from the first models of the atom is corrected by that finding?' },
      opts:{ es:['La idea de que existen piezas de materia que ya no tienen partes internas de ninguna clase',
                 'La idea de que el átomo tiene un núcleo donde se concentra la carga positiva',
                 'La idea de que los electrones se encuentran fuera del núcleo del átomo',
                 'La idea de que cada elemento tiene su propio número de protones'],
             en:['The idea that there are pieces of matter which no longer have internal parts of any kind',
                 'The idea that the atom has a nucleus where the positive charge is concentrated',
                 'The idea that the electrons are found outside the nucleus of the atom',
                 'The idea that each element has its own number of protons'] }, ci:0,
      hint:{ es:'Compara el hallazgo con lo que sostenía la primera imagen del átomo acerca de poder o no dividir sus piezas.',
             en:'Compare the finding with what the first picture of the atom claimed about whether its pieces could be divided.' },
      exp:{ es:'Si el protón tiene partes, entonces la idea de una pieza última sin partes internas ya no se sostiene. Las otras tres afirmaciones siguen siendo válidas en el modelo actual y no fueron corregidas por el hallazgo.',
            en:'If the proton has parts, then the idea of an ultimate piece with no internal parts no longer holds. The other three statements are still valid in the current model and were not corrected by the finding.' } },
    { title:{ es:'La imagen de la superficie', en:'The image of the surface' },
      q:{ es:'Con un microscopio de efecto túnel se obtienen registros en los que se distinguen átomos individuales acomodados sobre una superficie. ¿Qué muestra ese avance sobre la manera en que se construye el conocimiento científico?',
          en:'With a tunnelling microscope, records are obtained in which individual atoms arranged on a surface can be told apart. What does that advance show about the way scientific knowledge is built?' },
      opts:{ es:['Que una idea propuesta para explicar observaciones indirectas puede confirmarse después con instrumentos nuevos',
                 'Que las teorías anteriores al microscopio no servían para explicar ningún fenómeno de la materia',
                 'Que los átomos empezaron a existir cuando fue posible construir un instrumento capaz de registrarlos',
                 'Que las imágenes de una superficie sustituyen a los modelos y los vuelven innecesarios'],
             en:['That an idea proposed to explain indirect observations can later be confirmed with new instruments',
                 'That the theories from before the microscope were of no use for explaining any phenomenon of matter',
                 'That atoms began to exist when it became possible to build an instrument able to record them',
                 'That images of a surface replace models and make them unnecessary'] }, ci:0,
      hint:{ es:'El átomo se propuso mucho antes de que existiera cualquier instrumento capaz de registrarlo uno por uno.',
             en:'The atom was proposed long before any instrument able to record them one by one existed.' },
      exp:{ es:'La existencia del átomo se sostuvo durante mucho tiempo con observaciones indirectas, y instrumentos posteriores la confirmaron. Así avanza el conocimiento: una explicación se propone, se pone a prueba y se confirma o se corrige.',
            en:'The existence of the atom was upheld for a long time on indirect observations, and later instruments confirmed it. That is how knowledge advances: an explanation is proposed, tested and then confirmed or corrected.' } },
    { title:{ es:'El laboratorio de materiales', en:'The materials laboratory' },
      q:{ es:'Un laboratorio de nanotecnología acomoda átomos y moléculas uno por uno para obtener materiales con propiedades distintas de las del material original. ¿Qué relación tiene ese trabajo con el modelo de partículas?',
          en:'A nanotechnology laboratory arranges atoms and molecules one by one to obtain materials with properties different from those of the original material. What relation does that work have with the particle model?' },
      opts:{ es:['Aprovecha que las propiedades de un material dependen de qué partículas lo forman y de cómo están acomodadas',
                 'Demuestra que las propiedades de un material no tienen relación con las partículas que lo forman',
                 'Consiste en partir los átomos en pedazos para obtener elementos que antes no existían',
                 'Sustituye el estudio de las partículas por el estudio de los objetos que se ven a simple vista'],
             en:['It takes advantage of the fact that the properties of a material depend on which particles form it and how they are arranged',
                 'It shows that the properties of a material have no relation with the particles that form it',
                 'It consists of splitting atoms into pieces to obtain elements that did not exist before',
                 'It replaces the study of particles with the study of objects visible to the naked eye'] }, ci:0,
      hint:{ es:'Pregúntate qué se cambia realmente cuando se acomodan los átomos de otra manera: las partículas o su arreglo.',
             en:'Ask yourself what really changes when the atoms are arranged differently: the particles or their arrangement.' },
      exp:{ es:'Acomodar átomos de otra manera cambia las propiedades del material sin cambiar los átomos mismos. Esa es justamente la idea central del modelo de partículas aplicada a la construcción de materiales nuevos.',
            en:'Arranging atoms differently changes the properties of the material without changing the atoms themselves. That is precisely the central idea of the particle model applied to building new materials.' } }
  ];
  return fin(V[Math.floor(rng() * V.length)], false);
}

function mkP9(rng){
  var v;
  if (rng() < 0.5){
    var IO = [
      { es:'aluminio', en:'aluminium', z:13, a:27, q:3 },
      { es:'magnesio', en:'magnesium', z:12, a:24, q:2 },
      { es:'sodio', en:'sodium', z:11, a:23, q:1 },
      { es:'oxígeno', en:'oxygen', z:8, a:16, q:-2 },
      { es:'flúor', en:'fluorine', z:9, a:19, q:-1 },
      { es:'cloro', en:'chlorine', z:17, a:35, q:-1 },
      { es:'calcio', en:'calcium', z:20, a:40, q:2 },
      { es:'potasio', en:'potassium', z:19, a:39, q:1 }
    ];
    var x = pk(rng, IO), nm = L({ es:x.es, en:x.en }), e1 = x.z - x.q;
    var o1 = nums([e1, x.z, x.z + x.q, x.a - x.q]);
    var s1es = x.q > 0
      ? 'Un ion con carga ' + sgn(x.q) + ' tiene ' + x.q + ' electrón(es) menos que protones. Con ' + x.z + ' protones, los electrones son ' + x.z + ' − ' + x.q + ' = ' + e1
      : 'Un ion con carga ' + sgn(x.q) + ' tiene ' + Math.abs(x.q) + ' electrón(es) más que protones. Con ' + x.z + ' protones, los electrones son ' + x.z + ' + ' + Math.abs(x.q) + ' = ' + e1;
    var s1en = x.q > 0
      ? 'An ion with charge ' + sgn(x.q) + ' has ' + x.q + ' electron(s) fewer than protons. With ' + x.z + ' protons, the electrons are ' + x.z + ' − ' + x.q + ' = ' + e1
      : 'An ion with charge ' + sgn(x.q) + ' has ' + Math.abs(x.q) + ' electron(s) more than protons. With ' + x.z + ' protons, the electrons are ' + x.z + ' + ' + Math.abs(x.q) + ' = ' + e1;
    v = { title:{ es:'La ficha del ion', en:'The ion card' },
      q:{ es:'Una ficha de laboratorio describe un ion de ' + nm + ' con número atómico ' + x.z + ', número de masa ' + x.a + ' y carga neta ' + sgn(x.q) + '. ¿Cuántos electrones tiene ese ion?',
          en:'A laboratory card describes an ion of ' + nm + ' with atomic number ' + x.z + ', mass number ' + x.a + ' and net charge ' + sgn(x.q) + '. How many electrons does that ion have?' },
      opts:{ es:o1, en:o1 }, ci:0,
      hint:{ es:'El signo de la carga indica si al ion le faltan o le sobran electrones respecto a sus protones, y el número indica cuántos.',
             en:'The sign of the charge tells whether the ion is missing electrons or has extra ones compared with its protons, and the number tells how many.' },
      exp:{ es:s1es, en:s1en } };
  } else {
    var P2 = [
      { a:24, n:12, q:2 }, { a:27, n:14, q:3 }, { a:35, n:18, q:-1 },
      { a:16, n:8, q:-2 }, { a:23, n:12, q:1 }, { a:40, n:20, q:2 }
    ];
    var y = pk(rng, P2), z2 = y.a - y.n, e2 = z2 - y.q;
    var o2 = nums([e2, z2, z2 + y.q, y.a - y.q]);
    var s2es = 'Primero se obtienen los protones, que son las partículas del núcleo que no son neutrones: ' + y.a + ' − ' + y.n + ' = ' + z2 +
      '. Después, un ion con carga ' + sgn(y.q) + ' tiene ' + Math.abs(y.q) + ' electrón(es) ' + (y.q > 0 ? 'menos' : 'más') + ' que protones: ' +
      z2 + (y.q > 0 ? ' − ' : ' + ') + Math.abs(y.q) + ' = ' + e2;
    var s2en = 'First the protons are obtained, the particles of the nucleus that are not neutrons: ' + y.a + ' − ' + y.n + ' = ' + z2 +
      '. Then, an ion with charge ' + sgn(y.q) + ' has ' + Math.abs(y.q) + ' electron(s) ' + (y.q > 0 ? 'fewer' : 'more') + ' than protons: ' +
      z2 + (y.q > 0 ? ' − ' : ' + ') + Math.abs(y.q) + ' = ' + e2;
    v = { title:{ es:'El ion sin nombre', en:'The unnamed ion' },
      q:{ es:'Otra ficha describe un ion con número de masa ' + y.a + ', ' + y.n + ' neutrones en el núcleo y carga neta ' + sgn(y.q) + '. ¿Cuántos electrones tiene ese ion?',
          en:'Another card describes an ion with mass number ' + y.a + ', ' + y.n + ' neutrons in the nucleus and net charge ' + sgn(y.q) + '. How many electrons does that ion have?' },
      opts:{ es:o2, en:o2 }, ci:0,
      hint:{ es:'Con el número de masa y los neutrones puedes saber cuántos protones hay, y de ahí pasar a los electrones usando la carga.',
             en:'With the mass number and the neutrons you can find how many protons there are, and from there move to the electrons using the charge.' },
      exp:{ es:s2es, en:s2en } };
  }
  return fin(v, true);
}

function mkP10(rng){
  var V = [
    { title:{ es:'Dos núcleos parecidos', en:'Two similar nuclei' },
      q:{ es:'Dos átomos tienen el mismo número de protones pero distinto número de neutrones en su núcleo. ¿Qué se puede afirmar sobre esos dos átomos?',
          en:'Two atoms have the same number of protons but a different number of neutrons in their nucleus. What can be stated about those two atoms?' },
      opts:{ es:['Son átomos del mismo elemento y tienen distinto número de masa',
                 'Son átomos de elementos distintos y tienen el mismo número de masa',
                 'Son átomos del mismo elemento y tienen distinta carga neta',
                 'Son átomos de elementos distintos porque su núcleo cambió de tamaño'],
             en:['They are atoms of the same element and have a different mass number',
                 'They are atoms of different elements and have the same mass number',
                 'They are atoms of the same element and have a different net charge',
                 'They are atoms of different elements because their nucleus changed size'] }, ci:0,
      hint:{ es:'Revisa qué dato decide de qué elemento se trata y qué dato depende de todas las partículas del núcleo.',
             en:'Check which figure decides which element it is and which figure depends on all the particles of the nucleus.' },
      exp:{ es:'El elemento lo decide el número de protones, así que ambos son del mismo elemento. Como el número de masa cuenta protones y neutrones juntos, un cambio en los neutrones lo modifica. La carga neta no cambia, porque los neutrones no tienen carga.',
            en:'The element is decided by the number of protons, so both are of the same element. Since the mass number counts protons and neutrons together, a change in the neutrons modifies it. The net charge does not change, because neutrons have no charge.' } },
    { title:{ es:'La conclusión del cuaderno', en:'The conclusion in the notebook' },
      q:{ es:'Al revisar la historia de los modelos del átomo, un estudiante concluye en su cuaderno que los modelos anteriores fueron inútiles porque después tuvieron que cambiarse. ¿Qué respuesta corrige mejor esa conclusión?',
          en:'On reviewing the history of the models of the atom, a student concludes in their notebook that the earlier models were useless because they later had to be changed. Which answer best corrects that conclusion?' },
      opts:{ es:['Cada modelo explicó los hechos conocidos en su momento y sirvió de base para el siguiente',
                 'Los modelos anteriores fueron inútiles porque ninguno alcanzó a medir el tamaño del núcleo',
                 'Los modelos no se cambian nunca, solo se les pone otro nombre en cada época',
                 'El modelo aceptado hoy es definitivo y ya no admite ninguna corrección futura'],
             en:['Each model explained the facts known at its time and served as the basis for the next one',
                 'The earlier models were useless because none of them managed to measure the size of the nucleus',
                 'Models are never changed, they are only given another name in each period',
                 'The model accepted today is final and no longer admits any future correction'] }, ci:0,
      hint:{ es:'Piensa qué habría pasado con la imagen del núcleo si antes nadie hubiera propuesto que el átomo tiene partes.',
             en:'Think about what would have happened to the picture of the nucleus if nobody had earlier proposed that the atom has parts.' },
      exp:{ es:'Cada modelo dio cuenta de lo que se conocía y dejó planteada la pregunta que el siguiente respondió. Sin la idea de que el átomo tiene partes no se habría buscado el núcleo, y sin el núcleo no habría tenido sentido hablar de niveles de energía.',
            en:'Each model accounted for what was known and left open the question the next one answered. Without the idea that the atom has parts, the nucleus would not have been looked for, and without the nucleus it would have made no sense to speak of energy levels.' } },
    { title:{ es:'El renglón de la tabla', en:'The row in the table' },
      q:{ es:'Una tabla del salón indica que el número atómico es el dato que identifica a cada elemento. ¿A qué corresponde ese número dentro del átomo?',
          en:'A table in the classroom states that the atomic number is the figure that identifies each element. What does that number correspond to inside the atom?' },
      opts:{ es:['A la cantidad de protones que hay en su núcleo',
                 'A la suma de los protones y los neutrones de su núcleo',
                 'A la cantidad de electrones que puede perder o ganar al formar un ion',
                 'A la masa de su núcleo expresada en gramos'],
             en:['To the number of protons in its nucleus',
                 'To the sum of the protons and the neutrons of its nucleus',
                 'To the number of electrons it can lose or gain when forming an ion',
                 'To the mass of its nucleus expressed in grams'] }, ci:0,
      hint:{ es:'Un átomo puede ganar o perder electrones y seguir siendo el mismo elemento, y puede cambiar de neutrones sin dejar de serlo.',
             en:'An atom can gain or lose electrons and still be the same element, and it can change neutrons without stopping being it.' },
      exp:{ es:'Los electrones pueden cambiar al formarse un ion y los neutrones pueden variar sin cambiar de elemento. Lo único que se mantiene fijo para cada elemento es su cantidad de protones, y eso es el número atómico.',
            en:'The electrons can change when an ion forms and the neutrons can vary without changing element. The only thing that stays fixed for each element is its number of protons, and that is the atomic number.' } }
  ];
  return fin(V[Math.floor(rng() * V.length)], false);
}
</script>

(function(){
