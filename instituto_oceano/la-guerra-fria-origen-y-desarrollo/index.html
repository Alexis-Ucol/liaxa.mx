    { q:{ es:'La crisis de octubre de 1962 terminó con un acuerdo: la Unión Soviética retiró los misiles instalados en la isla, Estados Unidos se comprometió a no invadirla y, de forma discreta, retiró misiles propios situados cerca de la frontera soviética. Después se instaló una línea de comunicación directa entre ambos gobiernos. ¿Qué aprendieron las dos potencias de aquellos días?',
          en:'The crisis of October 1962 ended in an agreement: the Soviet Union withdrew the missiles installed on the island, the United States pledged not to invade it and, quietly, withdrew its own missiles stationed near the Soviet border. A direct communication line between the two governments was set up afterwards. What did the two powers learn from those days?' },
      o:{ es:['Que habían estado a punto de una guerra nuclear por un error de cálculo y que necesitaban canales para negociar antes de llegar a ese extremo.',
              'Que una de las dos superpotencias podía imponer sus condiciones sin ceder absolutamente nada a cambio.',
              'Que el uso de armas nucleares era la única forma de resolver una crisis grave entre los bloques.',
              'Que sus alianzas militares en Europa habían dejado de tener cualquier utilidad.'],
          en:['That they had come close to a nuclear war through a miscalculation and needed channels to negotiate before reaching that extreme.',
              'That one of the two superpowers could impose its conditions without giving up anything at all in return.',
              'That using nuclear weapons was the only way to settle a serious crisis between the blocs.',
              'That their military alliances in Europe had stopped being of any use.'] }, c:0,
      h:{ es:'Fíjate en qué cedió cada parte y en qué se creó justo después para no repetir la experiencia.',
          en:'Look at what each side gave up and at what was created right afterwards to avoid repeating the experience.' },
      e:{ es:'La crisis se cerró con concesiones de los dos lados y sin humillación pública para ninguno. La lección quedó en dos herencias concretas: la línea directa entre los dos gobiernos, para hablar en minutos y no en días, y los primeros tratados para limitar los arsenales, que abrieron el periodo de distensión.',
          en:'The crisis closed with concessions from both sides and public humiliation for neither. The lesson left two concrete legacies: the direct line between the two governments, to talk in minutes rather than days, and the first treaties to limit the arsenals, which opened the period of detente.' } },
    { q:{ es:'Durante décadas las dos superpotencias enviaron armas, dinero y asesores a bandos enfrentados en países como Corea, Vietnam, Angola o Afganistán, sin llegar nunca a declararse la guerra entre ellas. ¿Cómo se entiende mejor ese tipo de intervención?',
          en:'For decades the two superpowers sent weapons, money and advisers to opposing sides in countries such as Korea, Vietnam, Angola or Afghanistan, without ever declaring war on each other. How is that kind of intervention best understood?' },
      o:{ es:['Como guerras por delegación: la disputa entre los bloques se libraba dentro de otros países, que pagaban el costo humano del enfrentamiento.',
              'Como misiones humanitarias acordadas entre las dos superpotencias para reconstruir esos países.',
              'Como conflictos locales sin ninguna relación con la rivalidad entre Estados Unidos y la Unión Soviética.',
              'Como enfrentamientos directos entre los ejércitos de las dos superpotencias en territorio neutral.'],
          en:['As proxy wars: the dispute between the blocs was fought inside other countries, which paid the human cost of the confrontation.',
              'As humanitarian missions agreed between the two superpowers to rebuild those countries.',
              'As local conflicts with no connection to the rivalry between the United States and the Soviet Union.',
              'As direct clashes between the armies of the two superpowers on neutral territory.'] }, c:0,
      h:{ es:'Distingue entre quién tomaba las decisiones y quién ponía el territorio y las víctimas en cada uno de esos conflictos.',
          en:'Distinguish between who took the decisions and who provided the territory and the casualties in each of those conflicts.' },
      e:{ es:'La disuasión nuclear hacía impensable el choque directo, así que la competencia buscó terrenos donde el riesgo fuera menor para las superpotencias. El resultado fue que países enteros quedaron atrapados en una disputa ajena: sus guerras internas se prolongaron y se hicieron más destructivas gracias al armamento que llegaba de fuera.',
          en:'Nuclear deterrence made a direct clash unthinkable, so the competition looked for ground where the risk to the superpowers was lower. The result was that whole countries were caught in someone else dispute: their internal wars lasted longer and grew more destructive thanks to the weaponry arriving from outside.' } }
  ];

  addProblem({ title:L({ es:'Al borde y de vuelta', en:'To the brink and back' }), questionText:L(v7.q), options:L(v7.o), correct:v7.c, hint:L(v7.h), explanation:L(v7.e) }, rng);

  /* ══════════════════ CONCEPTO 5 ══════════════════ */
  addSection(L({ es:'Concepto 5', en:'Concept 5' }), L({ es:'El desenlace: 1989 y 1991', en:'The outcome: 1989 and 1991' }),
    L({ es:'<p>La distensión de los años setenta no duró. En 1979 la Unión Soviética intervino militarmente en Afganistán y se abrió una guerra larga y costosa; el gasto militar volvió a dispararse en los dos bloques. Mientras tanto, la economía soviética llevaba años estancada: producía acero y cohetes, pero escaseaban los bienes de consumo y las filas para comprar alimentos formaban parte de la vida diaria.</p>' +
              '<p>En 1985 llegó al poder un dirigente que intentó reformar el sistema desde dentro, con cambios económicos y una apertura mayor a la crítica pública. También decidió algo decisivo: dejar de sostener por la fuerza a los gobiernos aliados de Europa del Este. Sin ese respaldo, las protestas que llevaban años creciendo se volvieron imparables. Hungría abrió su frontera con Austria, miles de personas salieron por ahí y en el otoño de 1989 las manifestaciones llenaron las calles de varias capitales.</p>' +
              '<p>El 9 de noviembre de 1989 se abrieron los pasos del Muro de Berlín y la gente lo cruzó y lo derribó a golpes. En 1990 los dos Estados alemanes se reunificaron. En diciembre de 1991 la Unión Soviética se disolvió y sus repúblicas se convirtieron en Estados independientes. El orden bipolar que había ordenado la política mundial desde 1945 dejó de existir sin que se disparara un solo tiro entre las dos superpotencias.</p>',
          en:'<p>The detente of the 1970s did not last. In 1979 the Soviet Union intervened militarily in Afghanistan and a long, costly war opened; military spending shot up again in both blocs. Meanwhile the Soviet economy had been stagnant for years: it produced steel and rockets, but consumer goods were scarce and queues to buy food were part of daily life.</p>' +
              '<p>In 1985 a leader came to power who tried to reform the system from within, with economic changes and greater openness to public criticism. He also decided something crucial: to stop propping up allied governments in eastern Europe by force. Without that backing, the protests that had been growing for years became unstoppable. Hungary opened its border with Austria, thousands of people left that way and in the autumn of 1989 demonstrations filled the streets of several capitals.</p>' +
              '<p>On 9 November 1989 the crossings of the Berlin Wall were opened and people crossed it and knocked it down by hand. In 1990 the two German states were reunified. In December 1991 the Soviet Union dissolved and its republics became independent states. The bipolar order that had organized world politics since 1945 ceased to exist without a single shot being fired between the two superpowers.</p>' }) +
    '<div class="mzone" id="mzE"></div>');
  mE_render();

  /* ── graded 8 ── */
  var p8v = [
    { q:{ es:'A mediados de la década de 1980 la Unión Soviética enfrentaba una economía estancada, un gasto militar enorme y una guerra costosa en Afganistán. Su nuevo dirigente impulsó reformas y dejó de sostener por la fuerza a los gobiernos aliados de Europa del Este. ¿Qué consecuencia tuvo esa última decisión?',
          en:'By the mid 1980s the Soviet Union faced a stagnant economy, enormous military spending and a costly war in Afghanistan. Its new leader pushed reforms and stopped propping up allied governments in eastern Europe by force. What consequence did that last decision have?' },
      o:{ es:['Las protestas que llevaban años creciendo dejaron de ser reprimidas por tropas soviéticas y esos gobiernos cayeron uno tras otro en 1989.',
              'Los gobiernos aliados reactivaron sus economías y el bloque oriental se consolidó durante dos décadas más.',
              'Los países de Europa occidental invadieron de inmediato el territorio soviético.',
              'Estados Unidos se vio obligado a disolver su propia alianza militar en el mismo año.'],
          en:['The protests that had been growing for years stopped being crushed by Soviet troops and those governments fell one after another in 1989.',

              'The United States was forced to dissolve its own military alliance that same year.'] }, c:0,
      h:{ es:'Pregúntate qué había sostenido a esos gobiernos frente a protestas anteriores y qué ocurrió cuando ese sostén dejó de estar disponible.',
          en:'Ask what had held those governments up against earlier protests and what happened when that support was no longer available.' },
      e:{ es:'En 1953, 1956 y 1968 las protestas en países del bloque oriental habían sido reprimidas con tropas. Cuando en 1989 quedó claro que esa intervención ya no llegaría, la relación de fuerzas cambió de golpe: en pocos meses cayeron los gobiernos de varios países y se abrió el Muro de Berlín. Dos años después, la propia Unión Soviética se disolvió.',
          en:'In 1953, 1956 and 1968 protests in eastern bloc countries had been put down with troops. When it became clear in 1989 that such an intervention would no longer come, the balance of forces changed abruptly: within months the governments of several countries fell and the Berlin Wall was opened. Two years later the Soviet Union itself dissolved.' } },
    { q:{ es:'En noviembre de 1989 se abrieron los pasos del Muro de Berlín y en diciembre de 1991 la Unión Soviética se disolvió en repúblicas independientes. ¿Qué cambio de fondo marcaron esos dos hechos?',
          en:'In November 1989 the crossings of the Berlin Wall were opened and in December 1991 the Soviet Union dissolved into independent republics. What underlying change did those two events mark?' },
      o:{ es:['El fin del orden bipolar: desapareció uno de los dos bloques y con él la estructura que había ordenado la política mundial desde 1945.',
              'El inicio de una guerra abierta entre las dos superpotencias por el control de Europa central.',
              'La unión de los dos bloques en una sola alianza militar dirigida desde Moscú.',
              'El regreso de las fronteras europeas al trazado que tenían antes de 1914.'],
          en:['The end of the bipolar order: one of the two blocs disappeared and with it the structure that had organized world politics since 1945.',
              'The start of an open war between the two superpowers for control of central Europe.',
              'The merging of the two blocs into a single military alliance directed from Moscow.',
              'The return of European borders to the layout they had before 1914.'] }, c:0,
      h:{ es:'Piensa qué necesitaba tener el mundo para ser bipolar y qué le faltó a partir de esos dos hechos.',
          en:'Think about what the world needed in order to be bipolar and what it lacked after those two events.' },
      e:{ es:'Un orden bipolar requiere dos polos. Al desaparecer uno de ellos, los conflictos del mundo dejaron de leerse como episodios de una misma disputa y Estados Unidos quedó como única superpotencia durante décadas. Muchos países que habían recibido apoyo de un bloque perdieron de golpe a su patrocinador y tuvieron que reacomodarse.',
          en:'A bipolar order requires two poles. With one of them gone, the conflicts of the world stopped being read as episodes of a single dispute and the United States was left as the only superpower for decades. Many countries that had received support from one bloc suddenly lost their sponsor and had to readjust.' } }
  ];

  /* ══════════════════ CIERRE ══════════════════ */
  addSection(L({ es:'Cierre', en:'Closing' }), L({ es:'Un mundo entero dentro de la disputa', en:'A whole world inside the dispute' }),

  /* ── graded 9 ── */
  var p9v = [
    { q:{ es:'Mientras duraba la Guerra Fría, decenas de países de Asia y África lograron su independencia. Varios de ellos formaron un movimiento que rechazaba alinearse con cualquiera de los dos bloques. ¿Qué buscaban con esa postura?',
          en:'While the Cold War lasted, dozens of countries in Asia and Africa gained their independence. Several of them formed a movement that refused to align with either bloc. What were they seeking with that stance?' },
      o:{ es:['Conservar margen de decisión propio y evitar que la independencia recién ganada se convirtiera en una nueva dependencia frente a una superpotencia.',
              'Formar un tercer bloque militar con armas nucleares para atacar a las dos superpotencias.',
              'Ingresar al mismo tiempo en las dos alianzas militares para recibir ayuda de los dos lados.',
              'Renunciar a mantener relaciones diplomáticas y comerciales con el resto del mundo.'],
          en:['To keep their own room for decision and prevent newly won independence from turning into a new dependence on a superpower.',
              'To form a third military bloc with nuclear weapons in order to attack both superpowers.',
              'To join both military alliances at the same time in order to receive aid from both sides.',
              'To give up diplomatic and trade relations with the rest of the world.'] }, c:0,
      h:{ es:'Considera qué acababan de conseguir esos países y qué podían perder al comprometerse a fondo con un bloque.',
          en:'Consider what those countries had just achieved and what they could lose by committing fully to one bloc.' },
      e:{ es:'El movimiento de países no alineados reunió a Estados recién independizados que no querían repetir, en forma de alianza, la subordinación de la que acababan de salir. No siempre lo lograron: la presión de los bloques llegó a casi todas las regiones, con préstamos, asesores militares y apoyo a distintos bandos internos, y varias de esas naciones terminaron atrapadas en guerras por delegación.',
          en:'The movement of non aligned countries brought together newly independent states that did not want to repeat, in the form of an alliance, the subordination they had just escaped. They did not always succeed: pressure from the blocs reached almost every region, with loans, military advisers and support for different internal sides, and several of those nations ended up caught in proxy wars.' } },
    { q:{ es:'En 1962, cuando varios gobiernos del continente americano rompieron relaciones con Cuba por presión del bloque occidental, el gobierno mexicano mantuvo las suyas y sostuvo el principio de no intervención en los asuntos internos de otros países. ¿Qué muestra esa decisión sobre el margen de acción de los países latinoamericanos?',
          en:'In 1962, when several governments of the American continent broke relations with Cuba under pressure from the western bloc, the Mexican government kept its own and upheld the principle of non intervention in the internal affairs of other countries. What does that decision show about the room for action of Latin American countries?' },
      o:{ es:['Que la presión de los bloques era fuerte, pero un gobierno podía sostener una política exterior propia si la fundaba en principios que defendía de manera pública y constante.',
              'Que la rivalidad entre los bloques no tuvo ningún efecto en el continente americano.',
              'Que México se incorporó entonces al bloque encabezado por la Unión Soviética.',
              'Que los países latinoamericanos decidían su política exterior en conjunto y siempre por unanimidad.'],
          en:['That pressure from the blocs was strong, but a government could sustain its own foreign policy if it grounded it in principles defended publicly and consistently.',
              'That the rivalry between the blocs had no effect at all on the American continent.',
              'That Mexico then joined the bloc led by the Soviet Union.',
              'That Latin American countries decided their foreign policy together and always unanimously.'] }, c:0,
      h:{ es:'Distingue entre estar bajo presión y quedar obligado: fíjate en lo que ese gobierno hizo y en el argumento con que lo sostuvo.',
          en:'Distinguish between being under pressure and being obliged: look at what that government did and at the argument it used to sustain it.' },
      e:{ es:'América Latina vivió la Guerra Fría de cerca: hubo golpes de Estado, apoyos militares y económicos de los dos bloques y conflictos internos prolongados. Dentro de ese marco, mantener relaciones con la isla y apelar a la no intervención mostró que existía margen, aunque estrecho, para una posición propia sostenida con argumentos jurídicos y no con armas.',
          en:'Latin America lived the Cold War at close range: there were coups, military and economic support from both blocs and long internal conflicts. Within that setting, keeping relations with the island and appealing to non intervention showed that room existed, however narrow, for a position of its own sustained with legal arguments rather than weapons.' } }

  /* ── graded 10 ── */
  var p10v = [
    { q:{ es:'Un equipo de tu grupo sostiene que la Guerra Fría explica buena parte del mundo en que vivimos hoy. ¿Qué argumento sostiene mejor esa afirmación?',
          en:'A team in your class argues that the Cold War explains a good part of the world we live in today. What argument best supports that claim?' },
      o:{ es:['De ella salieron fronteras, alianzas, organismos y tecnologías que siguen funcionando, y su final dejó a Estados Unidos como única superpotencia durante décadas.',
              'Fue el conflicto más largo de la historia y por esa razón aparece en todos los libros de texto.',
              'Durante esos años no ocurrió ningún otro proceso histórico de importancia en el mundo.',
              'Terminó con un tratado que aún hoy obliga a todos los países a mantener sus fronteras.'],
          en:['Out of it came borders, alliances, organizations and technologies that still work, and its ending left the United States as the only superpower for decades.',
              'It was the longest conflict in history and for that reason it appears in every textbook.',
              'During those years no other historical process of importance took place in the world.',
              'It ended with a treaty that still today obliges every country to keep its borders.'] }, c:0,
      h:{ es:'Un argumento así se sostiene mostrando qué quedó después y sigue en funcionamiento, no repitiendo cuánto duró el periodo.',
          en:'An argument like this is supported by showing what was left afterwards and still works, not by repeating how long the period lasted.' },
      e:{ es:'La alianza militar occidental sigue existiendo, Corea continúa dividida, varios conflictos actuales heredaron armas y bandos de aquellos años y tecnologías como los satélites o las redes de comunicación nacieron de esa competencia. Reconocer esas huellas es distinto de afirmar que nada más ocurrió: es mostrar por dónde sigue actuando el pasado.',
          en:'The western military alliance still exists, Korea remains divided, several current conflicts inherited weapons and sides from those years and technologies such as satellites or communication networks were born of that competition. Recognizing those traces is different from claiming nothing else happened: it is showing where the past is still at work.' } },
    { q:{ es:'Dos fuentes describen el mismo momento: un discurso estadounidense de 1947 presenta el conflicto como la defensa de la libertad frente a la opresión, y un discurso soviético del mismo año lo presenta como la defensa de los trabajadores frente al imperialismo. ¿Cómo conviene trabajar con dos fuentes así?',
          en:'Two sources describe the same moment: an American speech from 1947 presents the conflict as the defence of freedom against oppression, and a Soviet speech from the same year presents it as the defence of workers against imperialism. How should two such sources be handled?' },
      o:{ es:['Tomarlas como testimonios del punto de vista de cada bloque y contrastarlas entre sí y con otras evidencias antes de sacar conclusiones.',
              'Elegir la que resulte más agradable de leer y descartar la otra por completo.',
              'Descartar las dos, porque toda fuente producida por un gobierno carece de valor histórico.',
              'Aceptar las dos como descripciones neutrales y exactas de lo que ocurría en el mundo.'],
          en:['Take them as testimonies of the viewpoint of each bloc and contrast them with each other and with other evidence before drawing conclusions.',
              'Choose whichever is more pleasant to read and discard the other completely.',
              'Discard both, because any source produced by a government has no historical value.',
              'Accept both as neutral and exact descriptions of what was happening in the world.'] }, c:0,
      h:{ es:'Pregúntate quién habla en cada caso, ante quién habla y qué gana con esa versión de los hechos.',
          en:'Ask who is speaking in each case, whom they are speaking to and what they gain from that version of events.' },
      e:{ es:'Los dos discursos son fuentes valiosas, pero no por lo que describen del mundo sino por lo que revelan de quien habla. Cada uno construye una imagen de sí mismo y del rival para ganar apoyo dentro y fuera de su país. El trabajo del historiador es leerlos junto a otras evidencias, como tratados, cifras económicas y testimonios de terceros países, y reconstruir a partir de ahí lo que ocurría.',
          en:'Both speeches are valuable sources, though not for what they describe of the world but for what they reveal about the speaker. Each builds an image of itself and of the rival in order to win support at home and abroad. The historian task is to read them alongside other evidence, such as treaties, economic figures and testimonies from third countries, and to reconstruct from there what was happening.' } }
