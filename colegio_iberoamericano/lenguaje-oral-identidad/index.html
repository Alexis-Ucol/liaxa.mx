<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Lenguaje Oral como Expresión de la Identidad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">El Lenguaje Oral como Expresión de la Identidad</div>
    <div class="wcourse" id="wcourse-el">Español · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">El Lenguaje Oral como Expresión de la Identidad</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c84', primaryDark:'#111d43', primaryBg:'#e8ebf5',
  accent:'#e42424', accentBg:'#fbdfdf',
  darkPrimary:'#4e69bb', darkPrimaryDark:'#7d95dd', darkPrimaryBg:'#0f1936',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

  var g = (studentData.group || '').trim();
  return 'esp1_t10_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'esp1_t10_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp1_t10_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

  /* ═════════ índice de turnos marcados ═════════ */
  function indexFigs(tx) {
    var figs = [];
    tx.paras.forEach(function (par) {
      par.forEach(function (seg) { if (seg.r) { seg.k = figs.length; figs.push(seg); } });
    });
    tx.figs = figs;
    return tx;
  }
  indexFigs(GRAB);
  function figOf(role) {
    var i;
    for (i = 0; i < GRAB.figs.length; i++) { if (GRAB.figs[i].r === role) return GRAB.figs[i]; }
    return GRAB.figs[0];
  }

  function textHTML(tx, mode, marks) {
    return tx.paras.map(function (par) {
      return '<span class="dpara">' + par.map(function (seg) {
        if (!seg.r) return L(seg);
        if (mode === 'hunt') {
          var extra = (marks && marks[seg.k]) ? marks[seg.k] : '';
          return '<span class="xchip' + extra + '" onclick="vzTap(' + seg.k + ')">' + L(seg) + '</span>';
        }
        return '<span class="xmark">' + L(seg) + '</span>';
      }).join('') + '</span>';
    }).join('');
  }
  function textBlock(tx, label) {
    return '<div class="dtext"><div class="dtitle">' + label + ' · ' + L(tx.title) + ' · ' + L(tx.meta) + '</div>' +
           textHTML(tx, 'plain', null) + '</div>';
  }

  /* ═════════ WIDGET 1 · rastrea la grabación ═════════ */
  function widgetRastreo() {
    var order = shuffle(CKEYS, rng).slice(0, 3);
    var st = { r:0, tries:0, marks:{}, done:false };
    var w = widgetBox('wRastreo', 'hunt');

    function paint(fb) {
      if (st.done) {
        w.innerHTML =
          '<div class="iw-tag">' + T('Rastrea la grabación', 'Track the recording') + '</div>' +
          '<div class="iw-sub">' + T('Recorriste las tres señas de esta ronda dentro de la transcripción.',
                                     'You worked through the three marks of this round inside the transcript.') + '</div>' +
          '<div class="iw-fb">' + (fb || '') + '</div>';
        return;
      }
      var c = CLAVES[order[st.r]];
      w.innerHTML =
        '<div class="iw-tag">' + T('Rastrea la grabación', 'Track the recording') + '</div>' +
        '<div class="iw-sub">' + T('La transcripción tiene cinco turnos subrayados. Toca el que ',
                                   'The transcript has five underlined turns. Tap the one that ') + L(c.d) + '.</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + order.length + '</div>' +
        '<div class="dtext"><div class="dtitle">' + L(GRAB.title) + '</div>' +
          textHTML(GRAB, 'hunt', st.marks) + '</div>' +
        '<div class="iw-fb" id="vzFb">' + (fb || '') + '</div>';
    }
    function advance(fb) {
      st.r++; st.tries = 0; st.marks = {};
      if (st.r >= order.length) st.done = true;
      if (st.done) { paint(''); return; }
      st.locked = true;
      var _fe = document.getElementById('snFb');
      if (_fe) _fe.innerHTML = (fb || '') + '<br><button onclick="snSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = w.querySelectorAll('.binbtn');
      if (_bs) _bs.forEach(function(b){ b.style.opacity='0.35'; b.style.pointerEvents='none'; });
    }
    window.vzTap = function (k) {
      if (st.done) return;
      var want = figOf(order[st.r]), got = GRAB.figs[k];
      if (k === want.k) {
        st.marks[k] = ' hit';
        advance('<span class="iw-ok">' + L(CLAVES[want.r].n) + ': ' + L(want.eff) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.marks[want.k] = ' rev';
        advance(T('El turno que buscabas era el de ', 'The turn you were after was ') + Q(want) + ': ' + L(want.eff) + '.');
        return;
      }
      st.marks[k] = ' miss';
      paint(T('Ese turno ', 'That turn ') + L(CLAVES[got.r].d) +
            T('. Busca el que ', '. Look for the one that ') + L(CLAVES[want.r].d) + '.');
      st.marks[k] = '';
    };
    paint('');
  }

  /* ═════════ WIDGET 2 · qué seña deja cada frase ═════════ */
  function widgetSenas() {
    var BINS = ES ? ['De dónde viene', 'A qué grupo pertenece', 'En qué situación habla']
                  : ['Where they are from', 'Which group they belong to', 'What situation they speak in'];
    var items = shuffle(FRASES, rng).slice(0, 6);
    var st = { i:0, tries:0, hits:0, done:false };
    var w = widgetBox('wSenas', 'classify');

    function paint(fb) {
      if (st.done) {
        w.innerHTML =
          '<div class="iw-tag">' + T('Tres señas en una frase', 'Three marks in one sentence') + '</div>' +
          '<div class="iw-sub">' + T('Clasificaste las seis frases de esta ronda. Casi todas las voces reales llevan las tres señas mezcladas.',
                                     'You classified the six sentences of this round. Almost every real voice carries the three marks mixed together.') + '</div>' +
          '<div class="iw-fb"><span class="iw-ok">' + st.hits + ' / ' + items.length +
          T(' a la primera.', ' on the first try.') + '</span></div>';
        return;
      }
      var it = items[st.i];
      w.innerHTML =
        '<div class="iw-tag">' + T('Tres señas en una frase', 'Three marks in one sentence') + '</div>' +
        '<div class="iw-sub">' + T('Antes de tocar, pregúntate una cosa: si oyeras esta frase sin ver a la persona, ¿qué adivinarías primero de ella?',
                                   'Before you tap, ask yourself one thing: if you heard this sentence without seeing the person, what would you guess about them first?') + '</div>' +
        '<div class="iw-prog">' + (st.i + 1) + ' / ' + items.length + '</div>' +
        '<div class="clscard">' + L(it.t) + '</div>' +
        '<div class="binrow">' + BINS.map(function (b, bi) {
          return '<button class="binbtn" onclick="snPick(' + bi + ')">' + b + '</button>';
        }).join('') + '</div>' +
        '<div class="iw-fb" id="snFb">' + (fb || '') + '</div>';
    }
    function advance(fb) {
      st.i++; st.tries = 0;
      if (st.i >= items.length) st.done = true;
      paint(fb);
    }
    window.snPick = function (bi) {
      if (st.done || st.locked) return;
      if (st.done) return;
      var it = items[st.i];
      if (bi === it.bin) {
        if (st.tries === 0) st.hits++;
        advance('<span class="iw-ok">' + BINS[it.bin] + ': ' + L(it.why) + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        advance(T('Era ', 'It was ') + Q({ es:BINS[it.bin], en:BINS[it.bin] }) + '. ' + L(it.why));
        return;
      }
      var nudge;
      if (bi === 0) {
        nudge = T('Todavía no. Una seña de la región cambia la palabra según el mapa: prueba a decir la frase en otro estado del país y fíjate si algo cambiaría.',
                  'Not yet. A mark of the region changes the word according to the map: try saying the sentence in another part of the country and see whether anything would change.');
      } else if (bi === 1) {
        nudge = T('Todavía no. Una seña de grupo aparece cuando la frase solo la entiende bien quien comparte la edad o el trabajo de quien habla.',
                  'Not yet. A group mark appears when the sentence is only fully understood by people who share the speaker’s age or job.');
      } else {
        nudge = T('Todavía no. Una seña de la situación aparece cuando la misma persona diría la frase de otro modo en su cocina.',
                  'Not yet. A situation mark appears when the same person would say the sentence differently in their own kitchen.');
      }
      paint(nudge);
    };

    window.snSig = function(){
      st.locked = false;
      (typeof paint !== 'undefined' ? paint : render)('');
    };
    paint('');
  }

  /* ═════════ WIDGET 3 · palabras heredadas ═════════ */
  function widgetHerencia() {
    var wo = perm(HEREDA.length);
    var de = perm(HEREDA.length);
    var st = { sel:null, tied:{}, rev:{}, tries:{}, done:false };
    var w = widgetBox('wHerencia', 'match');

    function paint(fb) {
      var left = wo.map(function (wi) {
        var cls = 'mchip word' + (st.tied[wi] ? ' tied' : (st.rev[wi] ? ' rev' : (st.sel === wi ? ' sel' : '')));
        return '<div class="' + cls + '" onclick="hrWord(' + wi + ')">' + HEREDA[wi].w + '</div>';
      }).join('');
      var right = de.map(function (di) {
        var cls = 'mchip' + (st.tied[di] ? ' tied' : (st.rev[di] ? ' rev' : ''));
        return '<div class="' + cls + '" onclick="hrDef(' + di + ')">' + L(HEREDA[di].d) + '</div>';
      }).join('');
      var falta = HEREDA.length - Object.keys(st.tied).length - Object.keys(st.rev).length;
      w.innerHTML =
        '<div class="iw-tag">' + T('Palabras heredadas', 'Inherited words') + '</div>' +
        '<div class="iw-sub">' + T('Estas cinco palabras se usan hoy dentro del español y ninguna nació en él. Toca una palabra y después la línea que dice qué nombra.',
                                   'These five words are used today inside Spanish and none of them was born in it. Tap a word and then the line that says what it names.') + '</div>' +
        '<div class="iw-prog">' + falta + T(' por emparejar', ' left to match') + '</div>' +
        '<div class="mgrid">' +
          '<div class="mcol"><div class="mhead">' + T('Palabra', 'Word') + '</div>' + left + '</div>' +
          '<div class="mcol"><div class="mhead">' + T('Qué nombra', 'What it names') + '</div>' + right + '</div>' +
        '</div>' +
        '<div class="iw-fb" id="hrFb">' + (fb || '') + '</div>';
    }
    window.hrWord = function (wi) {
      if (st.done || st.tied[wi] || st.rev[wi]) return;
      st.sel = (st.sel === wi) ? null : wi;
      paint('');
    };
    window.hrDef = function (di) {
      if (st.done || st.tied[di] || st.rev[di]) return;
      if (st.sel === null) { paint(T('Elige primero una palabra de la izquierda.', 'Choose a word on the left first.')); return; }
      var wi = st.sel;
      if (di === wi) {
        st.tied[wi] = 1; st.sel = null;
        if (Object.keys(st.tied).length + Object.keys(st.rev).length >= HEREDA.length) st.done = true;
        paint('<span class="iw-ok">' + HEREDA[wi].w + ' ' + L(HEREDA[wi].or) + ': ' + L(HEREDA[wi].d) +
              T('. Nadie la siente prestada porque llegó al español hace siglos.',
                '. Nobody feels it is borrowed because it entered Spanish centuries ago.') + '</span>');
        return;
      }
      st.tries[wi] = (st.tries[wi] || 0) + 1;
      if (st.tries[wi] >= 3) {
        st.rev[wi] = 1; st.sel = null;
        if (Object.keys(st.tied).length + Object.keys(st.rev).length >= HEREDA.length) st.done = true;
        paint(HEREDA[wi].w + ' ' + L(HEREDA[wi].or) + T(' nombra ', ' names ') + L(HEREDA[wi].d) + '.');
        return;
      }
      paint(T('Esa línea es de otra palabra. ', 'That line belongs to another word. ') + L(HEREDA[wi].p));
    };
    paint('');
  }

  /* ═════════ WIDGET 5 · la historia de Ana, en orden ═════════ */
  function widgetLinea() {
    var st = { order: perm(LINEA.length), sel:null, tries:0, done:false };
    var w = widgetBox('wLinea', 'timeline');

    function paint(fb) {
      var chips = st.order.map(function (ei, pos) {
        var cls = 'tchip' + (st.done ? ' lock' : (st.sel === pos ? ' sel' : ''));
        return '<div class="' + cls + '" onclick="lnTap(' + pos + ')"><span class="tnum">' + (pos + 1) + '</span>' + L(LINEA[ei]) + '</div>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('La historia de Ana, en orden', 'Ana’s story, in order') + '</div>' +
        '<div class="iw-sub">' + T('Estos cinco hechos aparecen revueltos. Colócalos del primero al último tal como los cuenta el texto: toca dos tarjetas para intercambiarlas.',
                                   'These five facts appear jumbled. Put them from first to last just as the text tells them: tap two cards to swap them.') + '</div>' +
        '<div class="tlist">' + chips + '</div>' +
        (st.done ? '' : '<button class="iwbtn" onclick="lnCheck()">' + T('Comprobar', 'Check') + '</button>') +
        '<div class="iw-fb" id="lnFb">' + (fb || '') + '</div>';
    }
    window.lnTap = function (pos) {
      if (st.done) return;
      if (st.sel === null) { st.sel = pos; }
      else if (st.sel === pos) { st.sel = null; }
      else { var tmp = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = tmp; st.sel = null; }
      paint('');
    };
    window.lnCheck = function () {
      if (st.done) return;
      if (st.order.every(function (ei, pos) { return ei === pos; })) {
        st.done = true;
        paint('<span class="iw-ok">' + T('Ese es el orden. Ana no perdió su manera de hablar de un día para otro: la fue guardando, y después la volvió a sacar delante del grupo.',
                                         'That is the order. Ana did not lose her way of speaking overnight: she put it away bit by bit, and later took it out again in front of the class.') + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.order = LINEA.map(function (_, i) { return i; });
        st.done = true;
        paint(T('Este es el orden real. Fíjate en que los dos últimos hechos ya no le ocurren a Ana: son cosas que ella decide hacer.',
                'This is the real order. Notice that the last two facts no longer happen to Ana: they are things she decides to do.'));
        return;
      }
      var bad = 0;
      while (bad < st.order.length && st.order[bad] === bad) bad++;
      paint(T('Todavía no. Revisa la tarjeta número ', 'Not yet. Check card number ') + (bad + 1) +
            T(': ¿ese hecho ocurre antes o después del que pusiste arriba?', ': does that fact happen before or after the one you put above it?'));
    };
    paint('');
  }

  /* ═════════ constructor de tarjetas ═════════ */
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: false,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);

              en:'A regional variant is not a mistake: it is the shape the language took in a territory. Correcting somebody for saying alberca would be like correcting them for coming from where they come from, and that does not improve communication, it just interrupts it.' }

      q:{ es:'Las cinco personas de la grabación usan palabras muy distintas entre sí y aun así la conversación avanza. ¿Qué lo hace posible?',

      exp:{ es:'La grabación reúne a alguien del norte, a alguien de Mérida, a un panadero y a una alumna en dos situaciones distintas. Lo diferente está a la vista, y lo común es la lengua que sostiene todo: por eso una palabra nueva se explica en un segundo y nadie se queda fuera.',
            en:'The recording brings together somebody from the north, somebody from Mérida, a baker and a student in two different situations. What differs is on show, and what they share is the language holding it all up: that is why a new word is explained in a second and nobody is left out.' }

  function q7() {

  function q8() {

  function q9() {

        title:{ es:'El suéter guardado', en:'The jumper put away' },

            en:'Ana writes: “I put my words away like somebody putting away a jumper they no longer wear”. What does she mean by that comparison?' },

  function q10() {
    if (rng() < 0.5) {
      var c1 = { es:'Que las dos reúnen hablas de varios grupos y las ajustan según con quién estén hablando.',
                 en:'That both of them gather ways of speaking from several groups and adjust them according to who they are talking to.' };
      return {
        title:{ es:'Ximena y Ana', en:'Ximena and Ana' },
        q:{ es:'Después de leer la grabación y el texto del periódico mural, ¿qué tienen en común la voz de Ximena y la de Ana?',
            en:'After reading the recording and the wall newspaper text, what do Ximena’s voice and Ana’s voice have in common?' },
        options:[ c1,
          { es:'Que las dos nacieron en la misma región y comparten las mismas palabras.',
            en:'That both were born in the same region and share the same words.' },
          { es:'Que las dos usan un solo modo de hablar en cualquier lugar donde estén.',
            en:'That both use a single way of speaking wherever they are.' },
          { es:'Que las dos tuvieron que abandonar el habla de su casa para ser aceptadas.',
            en:'That both had to abandon the speech of their home in order to be accepted.' } ],
        correct: c1,
        hint:{ es:'Deja de lado de dónde viene cada una y fíjate en cuántos modos de hablar maneja cada una.',
               en:'Set aside where each of them comes from and look at how many ways of speaking each one handles.' },
        exp:{ es:'Ximena pasa de sus amigas al micrófono en media hora; Ana pasa de su casa a su escuela nueva en unos meses. En los dos casos hay una sola persona con varias hablas disponibles: lo diferente es de dónde vienen esas hablas, y lo común es que ninguna de las dos tiene que renunciar a ninguna.',
              en:'Ximena goes from her friends to the microphone in half an hour; Ana goes from her home to her new school in a few months. In both cases there is one person with several ways of speaking available: what differs is where those come from, and what they share is that neither has to give any of them up.' }
      };
    }
    var c2 = { es:'Cada quien habla con las palabras de los grupos por los que ha pasado, y eso se puede contar.',
               en:'Each person speaks with the words of the groups they have passed through, and that can be told.' };
    return {
      title:{ es:'El cartel de la escuela', en:'The school poster' },
      q:{ es:'El grupo quiere resumir en un cartel lo que muestran los dos textos que leíste. ¿Cuál de estas frases lo hace sin contradecirlos?',
          en:'The class wants to sum up on a poster what the two texts you read show. Which of these sentences does that without contradicting them?' },
      options:[ c2,
        { es:'Hablar bien consiste en usar siempre las mismas palabras, sin importar el lugar.',
          en:'Speaking well means always using the same words, whatever the place.' },
        { es:'Las palabras de cada región deberían quedarse en su región para evitar confusiones.',
          en:'The words of each region should stay in their region so as to avoid confusion.' },
        { es:'Quien cambia de ciudad tiene que cambiar también su manera de hablar.',
          en:'Whoever changes city has to change their way of speaking too.' } ],
      correct: c2,
      hint:{ es:'Prueba cada frase contra el final del texto de Ana: ¿alguna de ellas describe lo que le pasó?',
             en:'Test each sentence against the ending of Ana’s text: does any of them describe what happened to her?' },
      exp:{ es:'Las otras tres chocan con los textos: Ximena cambia de palabras y habla muy bien, chich viajó de Mérida a otro salón sin causar ninguna confusión, y Ana conservó lo suyo mientras aprendía lo nuevo. Reconocer de dónde viene cada palabra es lo que permite ver a la vez lo común y lo diferente.',
            en:'The other three clash with the texts: Ximena changes words and speaks very well, chich travelled from Mérida to another classroom without causing any confusion, and Ana kept what was hers while learning the new. Recognising where each word comes from is what makes it possible to see what is shared and what differs at the same time.' }
    };
  }

  /* ═════════ LECCIÓN ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Una voz dice más de lo que cuenta', 'A voice says more than it tells'),
      '<p>' + T('Antes de terminar la primera frase, tu voz ya contó cosas de ti que no pensabas contar: en qué lugar aprendiste a hablar, con quién pasas el día, qué haces cuando no estás en la escuela y hasta si te sientes cómodo o nervioso en el sitio donde estás. Eso no ocurre porque hables mal ni porque hables bien; ocurre porque nadie aprende una lengua en abstracto. Cada persona la aprende de otras personas concretas, en un lugar concreto, y se queda con las palabras de esa gente. La grabación que sigue la hizo un grupo de primero durante una semana: cinco turnos, cinco maneras distintas de decir de dónde viene quien habla. Los turnos subrayados son los que vas a usar en toda la guía, así que léelos con calma.',
                'Before you finish your first sentence, your voice has already told things about you that you were not planning to tell: where you learned to speak, who you spend the day with, what you do when you are not at school and even whether you feel comfortable or nervous in the place where you are. That does not happen because you speak badly or because you speak well; it happens because nobody learns a language in the abstract. Each person learns it from specific other people, in a specific place, and keeps those people’s words. The recording that follows was made by a first year class over one week: five turns, five different ways of saying where the speaker comes from. The underlined turns are the ones you will use throughout this guide, so read them calmly.') + '</p>' +
      textBlock(GRAB, T('Texto I', 'Text I')) +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('en cada turno subrayado pregúntate qué adivinarías de esa persona si solo la oyeras un segundo, sin verle la cara.',
          'at each underlined turn ask yourself what you would guess about that person if you only heard them for a second, without seeing their face.') + '</p></div>');
  widgetRastreo();
  addP(q1());
  addP(q2());

  sec(T('Tres señas', 'Three marks'),
      T('De dónde vengo, con quién ando, dónde estoy', 'Where I am from, who I am with, where I am'),
      '<p>' + T('Las señas que deja una voz se pueden agrupar en tres. La primera es la del territorio: para una misma cosa, cada región guarda su palabra, y la que a ti te enseñaron dice dónde creciste. La segunda es la del grupo: la edad, el equipo, el taller o el oficio le dan a cada quien un puñado de expresiones que fuera de ahí hay que traducir. La tercera es la de la situación: la misma persona no habla igual en su cocina que frente a un micrófono, y ese ajuste se llama registro. Ninguna de las tres es un defecto y ninguna sustituye a las otras: en una sola frase suelen estar las tres al mismo tiempo, y por eso conviene aprender a separarlas.',
                'The marks a voice leaves can be grouped into three. The first is territory: for one same thing, each region keeps its own word, and the one you were taught says where you grew up. The second is group: age, a team, a club or a trade gives each person a handful of expressions that have to be translated outside it. The third is situation: the same person does not speak the same way in their kitchen as in front of a microphone, and that adjustment is called register. None of the three is a defect and none replaces the others: all three are usually present in a single sentence at the same time, and that is why it is worth learning to tell them apart.') + '</p>' +
      '<div class="glosslist">' +
        '<div class="gloss"><div class="glossn">' + T('Territorio', 'Territory') + '</div><div class="glossd">' +
          T('la palabra propia de una región para algo que en otra región tiene otro nombre',
            'the word a region has of its own for something that has another name elsewhere') + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + T('Grupo', 'Group') + '</div><div class="glossd">' +
          T('las expresiones que se aprenden dentro de una edad, un equipo o un oficio',
            'the expressions learned inside an age group, a team or a trade') + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + T('Situación', 'Situation') + '</div><div class="glossd">' +
          T('el ajuste que hace una misma persona según el lugar y el público que tiene enfrente',
            'the adjustment one same person makes according to the place and the audience in front of them') + '</div></div>' +
      '</div>');
  widgetSenas();
  addP(q3());
  addP(q4());

  sec(T('Lo que quedó dentro', 'What stayed inside'),
      T('Palabras que el español no trajo consigo', 'Words that Spanish did not bring with it'),
      '<p>' + T('En México se hablan decenas de lenguas además del español, y muchas de ellas llevan siglos dejando palabras dentro de él. Cuando alguien dice que fue al tianguis, que le dieron un itacate o que la tortilla está en el comal, está usando palabras que llegaron del náhuatl y que hoy nadie siente prestadas. En Yucatán ocurre lo mismo con el maya: pib y chich se dicen mientras se habla español y funcionan igual que cualquier otra palabra. Esas herencias importan por dos razones. Una es que muestran que una lengua guarda la historia de los pueblos que la formaron. La otra es que no están repartidas por igual: algunas se usan en todo el país y otras solo en una región, y por eso a veces hay que explicarlas.',
                'In Mexico dozens of languages are spoken besides Spanish, and many of them have been leaving words inside it for centuries. When somebody says they went to the tianguis, that they were given an itacate or that the tortilla is on the comal, they are using words that came from Náhuatl and that nobody today feels are borrowed. In Yucatán the same happens with Maya: pib and chich are said while speaking Spanish and work just like any other word. Those inheritances matter for two reasons. One is that they show a language keeps the history of the peoples that shaped it. The other is that they are not spread out evenly: some are used across the whole country and others only in one region, and that is why they sometimes have to be explained.') + '</p>');
  widgetHerencia();
  addP(q5());
  addP(q6());

  sec(T('El mismo recado', 'The same message'),
      T('Cambiar de registro no es cambiar de persona', 'Changing register is not changing person'),
      '<p>' + T('De las tres señas, la del registro es la única que puedes mover a voluntad en el momento. No eliges dónde naciste ni con quién creciste, pero sí eliges cómo pides algo según quién esté enfrente. Un recado tan simple como pedir la tarea se puede decir de cuatro maneras muy distintas sin cambiar ni una coma de lo que se pide. Lo que cambia es cuánto se explica, qué expresiones se dejan fuera y qué fórmulas aparecen. Quien maneja varios registros no es alguien que finja: es alguien que puede entrar a más lugares sin dejar de ser el mismo. En el ejercicio que sigue, la petición es siempre la misma y solo cambia quién la escucha.',
                'Of the three marks, register is the only one you can move at will in the moment. You do not choose where you were born or who you grew up with, but you do choose how you ask for something depending on who is in front of you. A message as simple as asking for the homework can be said in four very different ways without changing a single comma of what is being asked. What changes is how much gets explained, which expressions are left out and which formulas appear. Somebody who handles several registers is not somebody pretending: they are somebody who can enter more places without ceasing to be themselves. In the activity that follows, the request is always the same and only the listener changes.') + '</p>');
  widgetRecado();
  addP(q7());

  sec(T('Cuando la voz molesta', 'When a voice bothers people'),
      T('Una palabra que se guarda y vuelve', 'A word put away and taken out again'),
      '<p>' + T('Reconocer las señas de una voz sirve para algo más que para clasificarlas. En muchos salones, la manera de hablar de quien llega de otro lugar se convierte en un motivo de burla, y quien la recibe suele hacer lo mismo: esconderla. Esconder el habla propia funciona a corto plazo, porque las burlas paran, pero tiene un precio, porque también se apaga la parte de la identidad que esas palabras cargaban. El texto que sigue lo escribió una alumna para el periódico mural de su escuela. Cuenta cinco momentos de un mismo año y termina en un lugar distinto de donde empezó, aunque ella no haya cambiado de escuela otra vez.',
                'Recognising the marks of a voice is useful for more than classifying them. In many classrooms, the way somebody who arrives from elsewhere speaks becomes something to laugh at, and the person on the receiving end usually does the same thing: hides it. Hiding your own speech works in the short term, because the mockery stops, but it has a price, because the part of your identity those words carried gets switched off too. The text that follows was written by a student for her school’s wall newspaper. It tells five moments of one same year and ends up somewhere different from where it started, even though she did not change school again.') + '</p>' +
      textBlock(VOZ, T('Texto II', 'Text II')));
  widgetLinea();
  addP(q8());
  addP(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('Lo común y lo diferente', 'What is shared and what differs'),
      '<p>' + T('Ya recorriste el camino completo: descubriste que una voz deja señas del territorio, del grupo y de la situación; que el español que hablas guarda palabras de otras lenguas de este país; que el registro se ajusta sin que la persona cambie; y que una manera de hablar puede esconderse y volver. Queda una última idea, y es la que junta todas. Cada quien habla con una mezcla que nadie más tiene exactamente igual, y al mismo tiempo casi todas las piezas de esa mezcla vienen de alguien más. Eso es lo diferente y lo común al mismo tiempo, y no hay que elegir entre los dos.',
                'You have now travelled the whole path: you discovered that a voice leaves marks of territory, group and situation; that the Spanish you speak keeps words from other languages of this country; that register is adjusted without the person changing; and that a way of speaking can be hidden and can come back. One last idea remains, and it is the one that brings all of them together. Each person speaks with a mixture that nobody else has in exactly the same way, and at the same time almost every piece of that mixture comes from somebody else. That is what differs and what is shared at the same time, and there is no need to choose between them.') + '</p>');
  widgetCuaderno();
  addP(q10());
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'El Lenguaje Oral como Expresión de la Identidad';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
