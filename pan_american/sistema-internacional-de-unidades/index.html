<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Internacional de Unidades</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Sistema Internacional de Unidades</div>
    <div class="wcourse" id="wcourse-el">Física · Segundo de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Sistema Internacional de Unidades</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c3c9c', primaryDark:'#041d4f', primaryBg:'#e5ebf8',
  accent:'#9cb4e4', accentBg:'#e3e9f7',
  darkPrimary:'#3369d6', darkPrimaryDark:'#6595f5', darkPrimaryBg:'#061940',

function setLang(l){

function getAttemptKey(name, group){ return 'liaxa_fis2_t02_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

function lsKey() {

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {

}

}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'fis2_t02_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function uniq(a){ var m = {}, i; for (i = 0; i < a.length; i++){ var k = '' + a[i]; if (m[k]) return false; m[k] = 1; } return true; }
function gen(rng, mk){ var i, d; for (i = 0; i < 90; i++){ d = mk(rng); if (d && uniq(d.vals)) return d; } return d; }
function clampn(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function nums(a){ return [String(a[0]), String(a[1]), String(a[2]), String(a[3])]; }

/* moves the decimal point k places to the right (k<0 moves it left) without
   floating point noise, so the prefix ladder always reads cleanly */
function shiftDec(s, k){
  var p = String(s).split('.'), ip = p[0], fp = p[1] || '';
  if (k >= 0){
    while (k > 0){ if (fp.length){ ip += fp.charAt(0); fp = fp.slice(1); } else { ip += '0'; } k--; }
  } else {
    k = -k;
    while (k > 0){
      if (ip.length > 1){ fp = ip.charAt(ip.length - 1) + fp; ip = ip.slice(0, -1); }
      else { fp = ip + fp; ip = '0'; }
      k--;
    }
  }
  ip = ip.replace(/^0+(?=\d)/, '');
  fp = fp.replace(/0+$/, '');
  return fp ? ip + '.' + fp : ip;
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}


/* ══════════════════════════════════════════════════════════════════════════

function buildLesson(rng){

    '<p>' + L({
      es:'La estatura marcada en el marco de la puerta, el litro de leche del desayuno, los minutos que dura el recreo, los kilos de tortilla que se piden en la tienda. En cada caso alguien comparó algo con una cantidad de referencia. Medir es exactamente eso: comparar una propiedad con una unidad que todos aceptan.',
      en:'The height marked on a door frame, the litre of milk at breakfast, the minutes a break lasts, the kilos of tortilla asked for at the shop. In every case someone compared something against a reference amount. Measuring is exactly that: comparing a property with a unit that everyone accepts.'

    '<p>' + L({
      es:'Una magnitud es la propiedad que se puede medir: la longitud de un pasillo, la masa de una bolsa de arroz, el tiempo de una carrera, la temperatura del agua. La unidad es la cantidad de referencia con la que se compara esa propiedad. El instrumento es el aparato que hace posible la comparación.',

    '<div class="callout"><p>' + L({
      es:'En casa, en la escuela y en el mercado conviven referencias distintas para la misma magnitud: la masa se pide en kilos, en gramos o por costal. El Sistema Internacional elige una sola unidad básica para cada magnitud y a partir de ella construye todas las demás.',
      en:'At home, at school and at the market, different references live side by side for the same quantity: mass is asked for in kilos, in grams or by the sack. The International System chooses a single base unit for each quantity and builds all the others from it.'

      en:'The International System defines seven base quantities. Everything else measured in physics is built from them. Each unit has a fixed symbol that does not change from one country or language to another.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Longitud', en:'Length' }), 'm', L({ es:'metro', en:'metre' })) +
      rcard(L({ es:'Masa', en:'Mass' }), 'kg', L({ es:'kilogramo', en:'kilogram' })) +
      rcard(L({ es:'Tiempo', en:'Time' }), 's', L({ es:'segundo', en:'second' })) +
      rcard(L({ es:'Temperatura', en:'Temperature' }), 'K', L({ es:'kelvin', en:'kelvin' })) +
      rcard(L({ es:'Corriente eléctrica', en:'Electric current' }), 'A', L({ es:'ampere', en:'ampere' })) +
      rcard(L({ es:'Cantidad de sustancia', en:'Amount of substance' }), 'mol', L({ es:'mol', en:'mole' })) +

      en:'Symbols are written in lower case, except those taken from a family name, such as K for Kelvin or A for Ampère. They never carry a full stop, they do not change in the plural and they always stay separate from the number: write 12 m, not 12 Mts.'

      en:'Most quantities in physics do not appear in the list of the seven base ones: area, volume, speed, density. All of them are expressed by combining base units through multiplications and divisions, and that combination is called a derived unit.'

    L({ es:'Concepto 4', en:'Concept 4' }),

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

/* ══════════════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var POOL = [
    { sit:{ es:'Conocer la masa de un costal de maíz en la tienda del barrio', en:'Find the mass of a sack of corn at the corner shop' }, inst:'balanza', unit:'kg',
      why:{ es:'La masa se compara en una balanza y su unidad básica es el kilogramo.', en:'Mass is compared on a balance and its base unit is the kilogram.' } },
    { sit:{ es:'Medir el ancho de la cancha de la escuela', en:'Measure the width of the school court' }, inst:'cinta', unit:'m',
      why:{ es:'El ancho es una longitud: se compara con una cinta métrica y su unidad básica es el metro.', en:'Width is a length: it is compared with a tape measure and its base unit is the metre.' } },
    { sit:{ es:'Registrar cuánto dura una vuelta a la pista', en:'Record how long one lap of the track takes' }, inst:'cronometro', unit:'s',
      why:{ es:'La duración es tiempo: se registra con cronómetro y su unidad básica es el segundo.', en:'Duration is time: it is recorded with a stopwatch and its base unit is the second.' } },
    { sit:{ es:'Saber qué tan caliente está el agua de una olla', en:'Find out how hot the water in a pot is' }, inst:'termometro', unit:'K',
      why:{ es:'Se mide temperatura: se usa un termómetro y la unidad básica del sistema es el kelvin, aunque en la vida diaria se lea en grados Celsius.', en:'Temperature is measured: a thermometer is used and the base unit of the system is the kelvin, even though daily readings use degrees Celsius.' } },
    { sit:{ es:'Medir cuánto líquido cabe en un frasco del laboratorio', en:'Measure how much liquid fits in a laboratory jar' }, inst:'probeta', unit:'m³',
      why:{ es:'La capacidad es volumen: se compara con una probeta graduada y su unidad en el sistema es el metro cúbico, aunque la escala del laboratorio venga en mililitros.', en:'Capacity is volume: it is compared with a graduated cylinder and its unit in the system is the cubic metre, even though the laboratory scale comes in millilitres.' } },
    { sit:{ es:'Conocer el grosor de una lámina metálica muy delgada', en:'Find the thickness of a very thin metal sheet' }, inst:'vernier', unit:'m',
      why:{ es:'El grosor sigue siendo una longitud: pide un vernier por su escala fina y su unidad básica es el metro.', en:'Thickness is still a length: it calls for a vernier caliper because of its fine scale and its base unit is the metre.' } }
  ];
  var INST = [
    { k:'balanza', es:'Balanza', en:'Balance' },
    { k:'cinta', es:'Cinta métrica', en:'Tape measure' },
    { k:'cronometro', es:'Cronómetro', en:'Stopwatch' },
    { k:'termometro', es:'Termómetro', en:'Thermometer' },
    { k:'probeta', es:'Probeta graduada', en:'Graduated cylinder' },
    { k:'vernier', es:'Vernier', en:'Vernier caliper' }
  ];
  var UNITS = ['m', 'kg', 's', 'K', 'm³'];
  var R = shuffle(POOL, rng).slice(0, 3);
  var rd = 0, tries = 0, si = null, su = null, locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Une la medición', en:'Match the measurement' }) + '</div>' +
    '<div class="gw-q" data-r="sit"></div>' +
    '<div class="gw-lbl">' + L({ es:'Instrumento', en:'Instrument' }) + '</div>' +
    '<div class="gw-grid" data-r="inst"></div>' +
    '<div class="gw-lbl" style="margin-top:.7rem">' + L({ es:'Unidad básica del sistema', en:'Base unit of the system' }) + '</div>' +
    '<div class="gw-grid" data-r="unit"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button><span class="gw-val" data-r="live"></span></div>' +
    '<div class="gw-fb"></div>';

  var elS = host.querySelector('[data-r="sit"]'),
      elI = host.querySelector('[data-r="inst"]'),
      elU = host.querySelector('[data-r="unit"]'),

      elL = host.querySelector('[data-r="live"]');

  function nameI(k){ var i; for (i = 0; i < INST.length; i++) if (INST[i].k === k) return L(INST[i]); return '?'; }

  function draw(){
    var d = R[rd];
    elS.innerHTML = L(d.sit);
    elI.innerHTML = INST.map(function(o){
      return '<button class="gw-tile' + (si === o.k ? ' on' : '') + '" data-k="' + o.k + '"' + (locked ? ' disabled' : '') + '>' + L(o) + '</button>';
    }).join('');
    elU.innerHTML = UNITS.map(function(u){
      return '<button class="gw-tile gw-key' + (su === u ? ' on' : '') + '" data-k="' + u + '"' + (locked ? ' disabled' : '') + '>' + u + '</button>';
    }).join('');
    elL.innerHTML = (si ? nameI(si) : '?') + ' · ' + (su ? su : '?');
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Tres situaciones resueltas. Ya distingues la magnitud, el instrumento que la compara y la unidad que la expresa.',
        en:'Three situations solved. You now tell apart the quantity, the instrument that compares it and the unit that expresses it.'
      }));
      return;
    }
    locked = false; tries = 0; si = null; su = null;
    elC.textContent = L({ es:'Comprobar', en:'Check' });
    elC.className = 'gw-btn';
    say(host, '', L({ es:'Nueva situación. Elige el instrumento y la unidad que le corresponden.', en:'New situation. Choose the instrument and the unit that go with it.' }));
    draw();
  }

  function close(msg){
    locked = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente situación', en:'Next situation' });
    elC.className = 'gw-btn solved';
    draw();
    say(host, msg.cls, msg.txt);

  function check(){
    if (done) return;

    var d = R[rd];
    if (!si || !su){
      say(host, 'warm', L({ es:'Elige primero un instrumento y una unidad, después comprueba.', en:'Choose an instrument and a unit first, then check.' }));
      return;
    }
    if (si === d.inst && su === d.unit){ close({ cls:'good', txt:L(d.why) }); return; }
    tries++;
    if (tries >= 3){
      si = d.inst; su = d.unit;
      close({ cls:'warm', txt:L({ es:'Esta es la combinación correcta. ', en:'This is the correct pairing. ' }) + L(d.why) });
      return;
    }
    if (si === d.inst){
      say(host, 'miss', L({
        es:'El instrumento ya es el adecuado. Revisa la unidad: esa magnitud no se expresa en ' + su + '.',
        en:'The instrument is already the right one. Check the unit: that quantity is not expressed in ' + su + '.'
      }));
    } else if (su === d.unit){
      say(host, 'miss', L({
        es:'La unidad es la correcta. Ahora piensa con qué aparato se hace esa comparación.',
        en:'The unit is right. Now think about which device makes that comparison.'
      }));
    } else {
      say(host, 'miss', L({
        es:'Empieza por decidir qué magnitud aparece en la situación: longitud, masa, tiempo, temperatura o volumen.',
        en:'Start by deciding which quantity appears in the situation: length, mass, time, temperature or volume.'
      }));
    }
  }

  elI.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    si = b.getAttribute('data-k');
    draw();
  });
  elU.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    su = b.getAttribute('data-k');
    draw();
  });
  elC.addEventListener('click', check);

  say(host, '', L({ es:'Lee la situación y arma la pareja: primero el instrumento, después la unidad.', en:'Read the situation and build the pair: the instrument first, then the unit.' }));
  draw();
}

    { opts:['4 A', '4 amp', '4 amps'], ok:0, rule:{ es:'el ampere se simboliza A con mayúscula porque viene del apellido de una persona', en:'the ampere is written A with a capital because it comes from a family name' } },
    { opts:['300 K', '300 k', '300 Kelvin'], ok:0, rule:{ es:'el kelvin se simboliza K con mayúscula y sin el signo de grados', en:'the kelvin is written K with a capital and without the degree sign' } },
    { opts:['2 mol', '2 Mol', '2 mols'], ok:0, rule:{ es:'el mol conserva su forma: minúscula y sin plural', en:'the mole keeps its form: lower case and with no plural' } }
  ];
  var F = shuffle(POOL, rng).slice(0, 4);
  var cur = [], i;
  for (i = 0; i < 4; i++) cur.push((F[i].ok + 1 + ri(rng, 0, 1)) % 3);
  var tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Corrige la etiqueta', en:'Fix the label' }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Esta etiqueta salió del almacén con la escritura descuidada. Toca cada renglón hasta que cumpla las reglas del sistema.',
      en:'This label left the storeroom carelessly written. Tap each row until it follows the rules of the system.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="fields"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button><span class="gw-val" data-r="live"></span></div>' +

        es:'La etiqueta quedó impecable. Los símbolos del sistema no se pluralizan, no llevan punto y solo usan mayúscula cuando vienen de un apellido.',
        en:'The label is spotless now. Symbols of the system are never pluralized, carry no full stop and only use a capital when they come from a family name.'
      }));
      return;
    }

      for (i = 0; i < 4; i++) cur[i] = F[i].ok;
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      draw();
      say(host, 'warm', L({
        es:'Así queda la etiqueta corregida. Compara cada renglón con el que tenías y fíjate en las mayúsculas, los puntos y los plurales.',
        en:'This is how the corrected label looks. Compare each row with the one you had and watch the capitals, the full stops and the plurals.'
      }));
      return;
    }
    draw();
    var falta = 4 - score();
    say(host, 'miss', L({
      es:'Todavía ' + (falta === 1 ? 'queda 1 renglón' : 'quedan ' + falta + ' renglones') + ' fuera de regla. Revisa este: ' + F[bad].opts[cur[bad]] + ', porque ' + L(F[bad].rule) + '.',
      en:'There ' + (falta === 1 ? 'is still 1 row' : 'are still ' + falta + ' rows') + ' out of rule. Look at this one: ' + F[bad].opts[cur[bad]] + ', because ' + L(F[bad].rule) + '.'
    }));
  }

  elF.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || done) return;
    var i = parseInt(b.getAttribute('data-k'), 10);
    cur[i] = (cur[i] + 1) % 3;
    draw();
  });
  elC.addEventListener('click', check);

  say(host, '', L({ es:'Toca los renglones para cambiar la forma de escribirlos y comprueba cuando creas que la etiqueta ya cumple.', en:'Tap the rows to change how they are written and check when you think the label complies.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3  ::  Constructor de unidades derivadas
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var POOL = [
    { mag:{ es:'la rapidez de un ciclista', en:'the speed of a cyclist' }, t:['m', '/', 's'],
      tip:{ es:'los metros recorridos se reparten entre los segundos empleados', en:'the metres travelled are shared out among the seconds taken' } },
    { mag:{ es:'el área de una cancha', en:'the area of a court' }, t:['m', '²'],
      tip:{ es:'una superficie queda determinada por dos longitudes', en:'a surface is determined by two lengths' } },
    { mag:{ es:'el volumen de una caja', en:'the volume of a box' }, t:['m', '³'],
      tip:{ es:'un espacio interior necesita tres longitudes', en:'an interior space needs three lengths' } },
    { mag:{ es:'la densidad de un material', en:'the density of a material' }, t:['kg', '/', 'm', '³'],
      tip:{ es:'la masa se reparte entre el volumen que ocupa', en:'the mass is shared out among the volume it occupies' } }
  ];
  var KEYS = ['m', 'kg', 's', '/', '²', '³'];
  var R = shuffle(POOL, rng).slice(0, 3);
  var rd = 0, tries = 0, built = [], locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma la unidad derivada', en:'Build the derived unit' }) + '</div>' +
    '<div class="gw-q" data-r="mag"></div>' +
    '<div class="gw-exp" data-r="disp"></div>' +
    '<div class="gw-row" data-r="keys"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="del">' + L({ es:'Borrar', en:'Delete' }) + '</button><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elM = host.querySelector('[data-r="mag"]'),
      elD = host.querySelector('[data-r="disp"]'),
      elK = host.querySelector('[data-r="keys"]'),
      elB = host.querySelector('[data-r="del"]'),
      elC = host.querySelector('[data-r="chk"]');

  elK.innerHTML = KEYS.map(function(k){
    return '<button class="gw-btn gw-key" data-k="' + k + '">' + k + '</button>';
  }).join('');

  function draw(){
    var d = R[rd];
    elM.innerHTML = L({ es:'Unidad para ', en:'Unit for ' }) + L(d.mag);
    elD.innerHTML = built.length ? built.join('') : '?';
    elK.querySelectorAll('.gw-btn').forEach(function(b){ b.disabled = locked || done; });
    elB.disabled = locked || done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres unidades armadas. Cada unidad derivada guarda la receta de la magnitud que representa.',
        en:'Three units built. Every derived unit keeps the recipe of the quantity it stands for.'
      }));
      return;
    }
    locked = false; tries = 0; built = [];
    elC.textContent = L({ es:'Comprobar', en:'Check' });
    elC.className = 'gw-btn';
    say(host, '', L({ es:'Nueva magnitud. Arma su unidad con las teclas.', en:'New quantity. Build its unit with the keys.' }));
    draw();
  }

  function close(cls, txt){
    locked = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente magnitud', en:'Next quantity' });
    elC.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = R[rd], tgt = d.t.join(''), cu = built.join('');
    if (cu === tgt){
      close('good', L({
        es:'Correcto: ' + tgt + '. Se lee así porque ' + L(d.tip) + '.',
        en:'Correct: ' + tgt + '. It reads that way because ' + L(d.tip) + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      built = d.t.slice();
      close('warm', L({
        es:'La unidad buscada es ' + tgt + ', porque ' + L(d.tip) + '.',
        en:'The unit being sought is ' + tgt + ', because ' + L(d.tip) + '.'
      }));
      return;
    }
    var msg;
    if (!cu){
      msg = L({ es:'Empieza por la unidad básica de la cantidad principal de esa magnitud.', en:'Start with the base unit of the main amount in that quantity.' });
    } else if (tgt.indexOf(cu) === 0){
      msg = L({ es:'Vas bien: ' + cu + ' es el comienzo correcto, pero todavía falta completar la unidad.', en:'Good start: ' + cu + ' is the right beginning, but the unit is not finished yet.' });
    } else if (tgt.indexOf('/') >= 0 && cu.indexOf('/') < 0){
      msg = L({ es:'En esta magnitud una cantidad se reparte entre otra, así que falta la barra de división.', en:'In this quantity one amount is shared out among another, so the division bar is missing.' });
    } else if (cu.length > tgt.length){
      msg = L({ es:'Sobran elementos. Usa borrar y deja solo lo indispensable.', en:'There are extra elements. Use delete and keep only what is essential.' });
    } else {
      msg = L({ es:'Revisa qué unidades básicas intervienen de verdad: ' + L(d.tip) + '.', en:'Check which base units really take part: ' + L(d.tip) + '.' });
    }
    say(host, 'miss', msg);
  }

  elK.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    if (built.length >= 6) return;
    built.push(b.getAttribute('data-k'));
    draw();
  });
  elB.addEventListener('click', function(){
    if (locked || done) return;
    built.pop();
    draw();
  });
  elC.addEventListener('click', check);

  say(host, '', L({ es:'Toca las teclas para escribir la unidad y comprueba cuando la tengas.', en:'Tap the keys to write the unit and check when you have it.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4  ::  Escalera de prefijos (el punto decimal en movimiento)
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var UN = [
    { s:'km', es:'kilómetro', en:'kilometre' },
    { s:'hm', es:'hectómetro', en:'hectometre' },
    { s:'dam', es:'decámetro', en:'decametre' },
    { s:'m', es:'metro', en:'metre' },
    { s:'dm', es:'decímetro', en:'decimetre' },
    { s:'cm', es:'centímetro', en:'centimetre' },
    { s:'mm', es:'milímetro', en:'millimetre' }
  ];
  var VALS = ['2.5', '3.4', '12', '0.8', '45', '1.75', '6', '250'];
  var R = [], i;
  for (i = 0; i < 3; i++){
    var a = ri(rng, 0, 6), b = ri(rng, 0, 6), guard = 0;
    while ((b === a || Math.abs(b - a) > 4) && guard < 40){ b = ri(rng, 0, 6); guard++; }
    if (b === a) b = (a + 2) % 7;
    R.push({ i:a, j:b, v:pk(rng, VALS) });
  }
  var rd = 0, tries = 0, pos = R[0].i, locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Escalera de prefijos', en:'Prefix ladder' }) + '</div>' +
    '<div class="gw-q" data-r="goal"></div>' +
    '<div class="gw-lad" data-r="lad"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="up">▲ ' + L({ es:'Subir', en:'Up' }) + '</button>' +
      '<button class="gw-btn" data-r="dn">▼ ' + L({ es:'Bajar', en:'Down' }) + '</button>' +
      '<button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elG = host.querySelector('[data-r="goal"]'),
      elL = host.querySelector('[data-r="lad"]'),
      elU = host.querySelector('[data-r="up"]'),
      elD = host.querySelector('[data-r="dn"]'),
      elC = host.querySelector('[data-r="chk"]');

  function draw(){
    var d = R[rd], k;
    elG.innerHTML = L({ es:'Expresa ', en:'Express ' }) + d.v + ' ' + UN[d.i].s + L({ es:' en ', en:' in ' }) + UN[d.j].s;
    var rows = '';
    for (k = 0; k < 7; k++){
      var cls = 'gw-step' + (k === d.j ? ' goal' : '') + (k === pos ? ' here' : '');
      rows += '<div class="' + cls + '"><span class="gw-sym">' + UN[k].s + '</span><span class="gw-name">' + L(UN[k]) + '</span>' +
        (k === pos ? '<span class="gw-num">' + shiftDec(d.v, pos - d.i) + '</span>'
                   : (k === d.j ? '<span class="gw-tag">' + L({ es:'objetivo', en:'target' }) + '</span>' : '')) +
        '</div>';
    }
    elL.innerHTML = rows;
    elU.disabled = locked || done || pos === 0;
    elD.disabled = locked || done || pos === 6;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres conversiones recorridas. Cada escalón mueve el punto decimal un lugar, ni más ni menos.',
        en:'Three conversions walked through. Each step moves the decimal point one place, no more and no less.'
      }));
      return;
    }
    locked = false; tries = 0; pos = R[rd].i;
    elC.textContent = L({ es:'Comprobar', en:'Check' });
    elC.className = 'gw-btn';
    say(host, '', L({ es:'Nueva conversión. Camina por la escalera y observa el número.', en:'New conversion. Walk the ladder and watch the number.' }));
    draw();
  }

  function close(cls, txt){
    locked = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente conversión', en:'Next conversion' });
    elC.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function move(k){
    if (locked || done) return;
    pos = clampn(pos + k, 0, 6);
    var d = R[rd];
    say(host, '', L({
      es:'Estás en ' + UN[pos].s + ' y el número vale ' + shiftDec(d.v, pos - d.i) + '.',
      en:'You are on ' + UN[pos].s + ' and the number reads ' + shiftDec(d.v, pos - d.i) + '.'
    }));
    draw();
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = R[rd];
    if (pos === d.j){
      close('good', L({
        es:'Exacto: ' + d.v + ' ' + UN[d.i].s + ' equivale a ' + shiftDec(d.v, d.j - d.i) + ' ' + UN[d.j].s + '.',
        en:'Exactly: ' + d.v + ' ' + UN[d.i].s + ' equals ' + shiftDec(d.v, d.j - d.i) + ' ' + UN[d.j].s + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      pos = d.j;
      close('warm', L({
        es:'El escalón buscado era ' + UN[d.j].s + ': ' + d.v + ' ' + UN[d.i].s + ' equivale a ' + shiftDec(d.v, d.j - d.i) + ' ' + UN[d.j].s + '.',
        en:'The step being sought was ' + UN[d.j].s + ': ' + d.v + ' ' + UN[d.i].s + ' equals ' + shiftDec(d.v, d.j - d.i) + ' ' + UN[d.j].s + '.'
      }));
      return;
    }
    var n = Math.abs(d.j - pos);
    say(host, 'miss', L({
      es:'Estás en ' + UN[pos].s + ' y el objetivo es ' + UN[d.j].s + ': te ' + (n === 1 ? 'falta 1 escalón' : 'faltan ' + n + ' escalones') + ' hacia ' + (d.j > pos ? 'abajo' : 'arriba') + '.',
      en:'You are on ' + UN[pos].s + ' and the target is ' + UN[d.j].s + ': you are ' + (n === 1 ? '1 step' : n + ' steps') + ' short, ' + (d.j > pos ? 'downwards' : 'upwards') + '.'
    }));
  }

  elU.addEventListener('click', function(){ move(-1); });
  elD.addEventListener('click', function(){ move(1); });
  elC.addEventListener('click', check);

  say(host, '', L({ es:'Muévete escalón por escalón hasta la unidad que pide el objetivo y observa cómo cambia el número.', en:'Move step by step to the unit the target asks for and watch how the number changes.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5  ::  Lee la probeta (lectura de una escala graduada)
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var R = [], i, lv;
  for (i = 0; i < 3; i++){
    lv = ri(rng, 3, 19) * 5;
    if (lv === 50) lv = 65;
    R.push(lv);
  }
  var rd = 0, tries = 0, val = 50, locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Lee la probeta', en:'Read the cylinder' }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'La probeta está graduada en mililitros. Ajusta la línea dorada hasta que coincida con la superficie del líquido.',
      en:'The cylinder is graduated in millilitres. Adjust the golden line until it matches the surface of the liquid.'
    }) + '</div>' +
    '<div class="gw-cyl" data-r="svg"></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="dn">− 5</button>' +
      '<button class="gw-btn" data-r="up">+ 5</button>' +
      '<button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="live"></span>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elS = host.querySelector('[data-r="svg"]'),
      elU = host.querySelector('[data-r="up"]'),
      elD = host.querySelector('[data-r="dn"]'),
      elC = host.querySelector('[data-r="chk"]'),
      elL = host.querySelector('[data-r="live"]');

  function yOf(v){ return 18 + 150 * (1 - v / 100); }

  function draw(){
    var lev = R[rd], t, p = '';
    p += '<svg viewBox="0 0 250 200" style="width:100%;max-width:250px;height:auto;display:block;margin:0 auto">';
    p += '<rect x="95" y="18" width="80" height="150" rx="5" style="fill:var(--surface2);stroke:var(--text3);stroke-width:2"/>';
    p += '<rect x="97" y="' + yOf(lev) + '" width="76" height="' + (150 * lev / 100) + '" style="fill:var(--green);opacity:.35"/>';
    p += '<line x1="97" y1="' + yOf(lev) + '" x2="173" y2="' + yOf(lev) + '" style="stroke:var(--green);stroke-width:2.5"/>';
    for (t = 0; t <= 100; t += 10){
      p += '<line x1="95" y1="' + yOf(t) + '" x2="110" y2="' + yOf(t) + '" style="stroke:var(--border);stroke-width:1.5"/>';
      p += '<text x="90" y="' + (yOf(t) + 4) + '" text-anchor="end" style="fill:var(--text3);font-size:10px">' + t + '</text>';
    }
    p += '<line x1="88" y1="' + yOf(val) + '" x2="196" y2="' + yOf(val) + '" style="stroke:var(--gold);stroke-width:2;stroke-dasharray:5 4"/>';
    p += '<text x="200" y="' + (yOf(val) + 4) + '" style="fill:var(--gold);font-size:11px;font-weight:600">' + val + '</text>';
    p += '<text x="135" y="188" text-anchor="middle" style="fill:var(--text3);font-size:10px">mL</text>';
    p += '</svg>';
    elS.innerHTML = p;
    elL.innerHTML = L({ es:'Tu lectura: ', en:'Your reading: ' }) + val + ' mL';
    elU.disabled = locked || done || val >= 100;
    elD.disabled = locked || done || val <= 0;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres lecturas ajustadas. Leer una escala es ubicar la marca que coincide con la superficie, siempre observando de frente.',
        en:'Three readings adjusted. Reading a scale means finding the mark that matches the surface, always looking straight on.'
      }));
      return;
    }
    locked = false; tries = 0; val = 50;
    elC.textContent = L({ es:'Comprobar', en:'Check' });
    elC.className = 'gw-btn';
    say(host, '', L({ es:'Nueva medición. Ajusta tu lectura al nuevo nivel.', en:'New measurement. Adjust your reading to the new level.' }));
    draw();
  }

  function close(cls, txt){
    locked = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente medición', en:'Next measurement' });
    elC.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function move(k){
    if (locked || done) return;
    val = clampn(val + k, 0, 100);
    draw();
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var lev = R[rd];
    if (val === lev){
      close('good', L({
        es:'Lectura exacta: el líquido llega a ' + lev + ' mL.',
        en:'Exact reading: the liquid reaches ' + lev + ' mL.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      val = lev;
      close('warm', L({
        es:'La superficie del líquido coincide con la marca de ' + lev + ' mL.',
        en:'The surface of the liquid matches the mark at ' + lev + ' mL.'
      }));
      return;
    }
    say(host, 'miss', val > lev
      ? L({ es:'Tu línea quedó por encima de la superficie del líquido. Baja la lectura y vuelve a comprobar.', en:'Your line ended above the surface of the liquid. Lower the reading and check again.' })
      : L({ es:'Tu línea quedó por debajo de la superficie del líquido. Sube la lectura y vuelve a comprobar.', en:'Your line ended below the surface of the liquid. Raise the reading and check again.' }));
  }

  elU.addEventListener('click', function(){ move(5); });
  elD.addEventListener('click', function(){ move(-5); });
  elC.addEventListener('click', check);

  say(host, '', L({ es:'Sube o baja tu lectura de cinco en cinco hasta alcanzar la superficie del líquido.', en:'Raise or lower your reading five by five until you reach the surface of the liquid.' }));
  draw();
}
</script>

<script>
(function(){

    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
