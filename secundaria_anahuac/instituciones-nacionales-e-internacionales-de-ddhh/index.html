   verdict line under the gates recalculates on every tap, so the student sees a
   petition open or close in real time. A wrong reading answers with the clue of
   the requirement that does not match. Three cases, reveal inside each one
   (Rule 8, pattern B).
   ================================================ */
var FA = null;
var FAQ = [
  { es:'¿Ya se agotaron los recursos que ofrecía el propio país?', en:'Have the remedies offered by the country itself been exhausted?' },
  { es:'¿La petición llega dentro de los seis meses posteriores a la notificación de la resolución definitiva?', en:'Does the petition arrive within six months after notice of the final resolution?' },
  { es:'¿El reclamo se dirige contra actos atribuibles al Estado?', en:'Is the claim directed against acts attributable to the State?' }
];
function buildFiltro(rng){
  var cases = [
    { es:'La familia de Ismael recorrió todas las instancias: hubo queja, recomendación incumplida, juicio y sentencia firme de un tribunal federal. Se la notificaron hace tres meses y el reclamo es contra la actuación de una autoridad federal.',
      en:'The family of Ismael went through every instance: there was a complaint, an unfulfilled recommendation, a trial and a final ruling from a federal court. They were notified three months ago and the claim is against the conduct of a federal authority.',
      a:[1,1,1],
      clue:[ { es:'el caso pasó por todas las instancias del país hasta la sentencia firme', en:'the case went through every instance in the country up to the final ruling' },
             { es:'la notificación ocurrió hace tres meses, dentro del plazo', en:'the notice happened three months ago, inside the deadline' },
             { es:'lo que se reclama es la actuación de una autoridad', en:'what is claimed is the conduct of an authority' } ] },
    { es:'Un grupo de vecinos se enteró de que existe un sistema internacional y quiere llevar ahí su reclamo contra una autoridad municipal. Todavía no presentan queja ante ningún organismo del país ni han acudido a ningún tribunal.',
      en:'A group of neighbors learned that an international system exists and wants to take their claim against a municipal authority there. They have not yet filed a complaint before any national body nor gone to any court.',
      a:[0,0,1],
      clue:[ { es:'no han tocado ninguna instancia interna todavía', en:'they have not touched any internal instance yet' },
             { es:'no existe resolución definitiva, así que el plazo ni siquiera ha comenzado a correr', en:'there is no final resolution, so the deadline has not even started to run' },
             { es:'sí reclaman actos de una autoridad', en:'they do claim acts of an authority' } ] },
    { es:'A Beatriz le negaron un servicio público, litigó durante años y recibió la sentencia definitiva. Le notificaron esa resolución hace dos años y apenas ahora prepara su escrito para el sistema interamericano.',
      en:'Beatriz was denied a public service, litigated for years and received the final ruling. She was notified of that resolution two years ago and only now prepares her document for the Inter-American system.',
      a:[1,0,1],
      clue:[ { es:'el litigio llegó hasta la sentencia definitiva', en:'the litigation reached the final ruling' },
             { es:'entre la notificación y el escrito pasaron dos años, muy por encima del plazo', en:'two years passed between the notice and the document, far beyond the deadline' },
             { es:'el servicio negado dependía de una autoridad', en:'the service denied depended on an authority' } ] },
    { es:'Dos vecinos discuten por el ruido de una fiesta. Uno demandó al otro, perdió el juicio y la sentencia quedó firme hace dos meses. Ahora quiere llevar a su vecino ante el sistema interamericano.',
      en:'Two neighbors argue over the noise of a party. One sued the other, lost the trial and the ruling became final two months ago. Now he wants to take his neighbor before the Inter-American system.',
      a:[1,1,0],
      clue:[ { es:'el juicio terminó con sentencia firme', en:'the trial ended with a final ruling' },
             { es:'la sentencia quedó firme hace dos meses, dentro del plazo', en:'the ruling became final two months ago, inside the deadline' },
             { es:'quien está del otro lado es un particular, no el Estado', en:'the one on the other side is a private party, not the State' } ] }
  ];
  FA = { pool:shuffle(cases, rng).slice(0,3), r:0, ans:[null,null,null], tries:0, reveal:false, done:false, cls:'',
         msg:{ es:'Responde los tres requisitos. El semáforo y el veredicto se recalculan con cada respuesta, y puedes cambiarlas antes de resolver.',
               en:'Answer the three requirements. The lights and the verdict recalculate with each answer, and you can change them before resolving.' } };
  return '<div class="wgt" id="faw">' +
    '<div class="wgt-h">' + S('Filtro del sistema interamericano','Filter of the Inter-American system') + '</div>' +
    '<div class="wgt-q">' + S('Una petición internacional no se abre por la gravedad del caso, sino cuando reúne sus requisitos. Revisa este.','An international petition does not open because of how serious the case is, but when it meets its requirements. Review this one.') + '</div>' +
    '<div class="wcase" id="facase"></div>' +
    '<div id="facrits"></div>' +
    '<div class="gate" id="fagate"></div>' +
    '<div class="wmsg" id="famsg"></div>' +
    '<button class="wbtn" id="fabtn" onclick="faAct()"></button>' +
    '<div class="wprog" id="faprog"></div>' +
  '</div>';
}
function faRender(){
  if (!FA || !document.getElementById('facrits')) return;
  var c = FA.pool[FA.r];
  document.getElementById('facase').innerHTML = c[LANG];
  document.getElementById('facrits').innerHTML = FAQ.map(function(q, i){
    var sel = FA.ans[i];
    return '<div class="crit"><div class="critq">' + (i+1) + '. ' + q[LANG] + '</div><div class="tri">' +
      '<button class="tribtn' + (sel === 1 ? ' sel' : '') + '" onclick="faTap(' + i + ',1)">' + S('Sí, se cumple','Yes, it is met') + '</button>' +
      '<button class="tribtn' + (sel === 0 ? ' sel' : '') + '" onclick="faTap(' + i + ',0)">' + S('Todavía no','Not yet') + '</button>' +
    '</div></div>';
  }).join('');
  var open = true, answered = 0, i;
  for (i = 0; i < 3; i++){ if (FA.ans[i] === null) open = false; else { answered++; if (FA.ans[i] === 0) open = false; } }
  document.getElementById('fagate').innerHTML =
    FAQ.map(function(q, k){ return '<span class="gdot' + (FA.ans[k] === 1 ? ' on' : FA.ans[k] === 0 ? ' off' : '') + '"></span>'; }).join('') +
    '<span>' + (answered < 3
      ? S('faltan requisitos por responder','requirements still to answer')
      : (open ? S('con esta lectura, la petición pasa el filtro','with this reading, the petition passes the filter')
              : S('con esta lectura, la petición no pasa el filtro todavía','with this reading, the petition does not pass the filter yet'))) + '</span>';
  var m = document.getElementById('famsg');
  m.className = 'wmsg' + (FA.cls ? ' ' + FA.cls : '');
  m.innerHTML = FA.msg[LANG];
  var b = document.getElementById('fabtn');
  b.style.display = FA.done ? 'none' : 'inline-block';
  b.textContent = FA.reveal ? S('Siguiente expediente','Next file') : S('Resolver el filtro','Resolve the filter');
  document.getElementById('faprog').textContent = S('Expediente ','File ') + (FA.r + 1) + ' / ' + FA.pool.length;
}
function faTap(i, v){
  if (!FA || FA.done || FA.reveal) return;
  FA.ans[i] = (FA.ans[i] === v) ? null : v;
  FA.cls = '';
  FA.msg = { es:'Vuelve a leer el expediente y confirma cada requisito antes de resolver: basta que uno falte para que la petición no se abra.',
             en:'Read the file again and confirm each requirement before resolving: one missing requirement is enough for the petition not to open.' };
  faRender();
}
function faAct(){
  if (!FA || FA.done) return;
  if (FA.reveal){ faNext(); return; }
  var c = FA.pool[FA.r], i, bad = -1, blank = false;
  for (i = 0; i < 3; i++){
    if (FA.ans[i] === null) blank = true;
    else if (FA.ans[i] !== c.a[i] && bad < 0) bad = i;
  }
  if (blank){
    FA.cls = 'bad';
    FA.msg = { es:'Falta responder algún requisito. Los tres se revisan siempre, incluso cuando el caso parece evidente.',
               en:'Some requirement is still unanswered. All three are always reviewed, even when the case looks obvious.' };
    faRender(); return;
  }
  if (bad < 0){
    FA.reveal = true; FA.cls = 'ok';
    var passes = (c.a[0] === 1 && c.a[1] === 1 && c.a[2] === 1);
    FA.msg = { es:'Lectura correcta. ' + (passes
                 ? 'Los tres requisitos se cumplen y la petición puede presentarse: ' + c.clue[0].es + ', ' + c.clue[1].es + ' y ' + c.clue[2].es + '.'
                 : 'La petición no puede abrirse todavía porque ' + (c.a[0] === 0 ? c.clue[0].es : c.a[1] === 0 ? c.clue[1].es : c.clue[2].es) + '.'),
               en:'Correct reading. ' + (passes
                 ? 'The three requirements are met and the petition can be filed: ' + c.clue[0].en + ', ' + c.clue[1].en + ' and ' + c.clue[2].en + '.'
                 : 'The petition cannot open yet because ' + (c.a[0] === 0 ? c.clue[0].en : c.a[1] === 0 ? c.clue[1].en : c.clue[2].en) + '.') };
  } else {
    FA.tries++;
    if (FA.tries >= 3){
      FA.reveal = true; FA.cls = 'warn';
      for (i = 0; i < 3; i++) FA.ans[i] = c.a[i];
      FA.msg = { es:'Así queda el semáforo del expediente. El requisito que se te escapaba es el número ' + (bad + 1) + ': ' + c.clue[bad].es + '.',
                 en:'This is how the lights of the file stand. The requirement that escaped you is number ' + (bad + 1) + ': ' + c.clue[bad].en + '.' };
    } else {
      FA.cls = 'bad';
      FA.msg = { es:'Uno de los requisitos está leído al revés. Vuelve al número ' + (bad + 1) + ' y fíjate en este dato del expediente: ' + c.clue[bad].es + '.',
                 en:'One of the requirements is read the wrong way round. Go back to number ' + (bad + 1) + ' and look at this detail of the file: ' + c.clue[bad].en + '.' };
      FA.ans[bad] = null;
    }
  }
  faRender();
}
function faNext(){
  if (FA.r + 1 >= FA.pool.length){
    FA.done = true; FA.reveal = true; FA.cls = 'ok';
    FA.msg = { es:'Filtro recorrido. Los requisitos no existen para dejar casos fuera por capricho: obligan a que el propio país tenga primero la oportunidad de reparar, y solo cuando no lo hace el reclamo cruza la frontera.',
               en:'The filter is complete. The requirements do not exist to leave cases out on a whim: they force the country itself to have the first chance to repair, and only when it does not does the claim cross the border.' };
  } else {
    FA.r++; FA.ans = [null,null,null]; FA.tries = 0; FA.reveal = false; FA.cls = '';
    FA.msg = { es:'Llega otro expediente. Lee con cuidado las fechas y quién está señalado antes de responder.',
               en:'Another file arrives. Read the dates carefully and who is named before answering.' };
  }
  faRender();
}

/* ================================================
   buildLesson — interleaved: concepto, manipulativo, problema (Rule 1)
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';

  /* ── APERTURA ───────────────────────────────────────────────── */
  addSection(S('PUNTO DE PARTIDA','STARTING POINT'),
    '<h2>' + S('Un derecho escrito no se defiende solo','A written right does not defend itself') + '</h2>' +
    '<p>' + S('Un derecho humano reconocido en la Constitución o en un tratado es una promesa escrita. Entre esa promesa y la vida diaria de una persona hay una distancia, y esa distancia la cubren las instituciones: oficinas con nombre, domicilio, presupuesto y un mandato que dice qué pueden hacer y a quién pueden vigilar. Cuando alguien exige que se aplique una norma, no lo hace en el aire: lo hace ante una de ellas.',
              'A human right recognized in the Constitution or in a treaty is a written promise. Between that promise and the daily life of a person there is a distance, and institutions cover that distance: offices with a name, an address, a budget and a mandate that says what they can do and whom they can oversee. When somebody demands that a rule be applied, they do not do it in the air: they do it before one of them.') + '</p>' +
    '<p>' + S('En esta guía vas a operar esas instituciones por dentro: turnarás casos a quien tiene competencia, armarás el escrito de una queja, ordenarás el camino de un reclamo y revisarás si una petición internacional reúne sus requisitos. Al final tendrás una respuesta práctica a una pregunta que muchas personas no saben responder: a dónde ir y con qué, cuando un derecho se queda en el papel.',
              'In this guide you will operate those institutions from the inside: you will route cases to whoever has competence, build the document of a complaint, order the path of a claim and check whether an international petition meets its requirements. In the end you will hold a practical answer to a question many people cannot answer: where to go and with what, when a right stays on paper.') + '</p>');

  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1','CONCEPT 1'),
    '<h2>' + S('Quién está obligado y quién vigila','Who is obliged and who oversees') + '</h2>' +
    '<p>' + S('El primer artículo de la Constitución fija una regla que ordena todo lo demás: todas las autoridades, en el ámbito de sus competencias, tienen la obligación de promover, respetar, proteger y garantizar los derechos humanos. La palabra clave es autoridades. El sujeto obligado es el Estado, es decir, quien ejerce poder público en cualquier nivel, desde una presidencia municipal hasta una oficina federal.',
              'The first article of the Constitution sets a rule that organizes everything else: all authorities, within the scope of their competences, have the obligation to promote, respect, protect and guarantee human rights. The key word is authorities. The obliged subject is the State, that is, whoever exercises public power at any level, from a municipal government to a federal office.') + '</p>' +
    '<p>' + S('Una obligación sin nadie que la vigile se cumple cuando conviene. Por eso el mismo texto constitucional creó organismos públicos de defensa de los derechos humanos: uno nacional y uno en cada entidad federativa. Son autónomos, lo que significa que no dependen de la autoridad a la que revisan, ni reciben instrucciones de ella sobre lo que debe concluir su investigación. Esa independencia es lo que hace creíble su trabajo.',
              'An obligation with nobody to oversee it is met only when convenient. That is why the same constitutional text created public bodies for the defense of human rights: one national and one in each state. They are autonomous, which means they do not depend on the authority they review, nor do they receive instructions from it about what their investigation must conclude. That independence is what makes their work credible.') + '</p>' +
    '<p>' + S('Ese diseño abrió dos caminos distintos para reclamar. La vía jurisdiccional pasa por tribunales: una persona juzgadora estudia el acto reclamado, sigue un procedimiento con pruebas y dicta una resolución que obliga. La vía no jurisdiccional pasa por los organismos de derechos humanos: se abre con una queja gratuita, sin abogado y sin formalidades, investiga y termina en una recomendación pública. Ninguna de las dos sustituye a la otra, y saber qué ofrece cada una es lo que permite elegir bien.',
              'That design opened two different paths to claim. The judicial route goes through courts: a judge studies the challenged act, follows a procedure with evidence and issues a binding resolution. The non judicial route goes through human rights bodies: it opens with a free complaint, without a lawyer and without formalities, it investigates and ends in a public recommendation. Neither replaces the other, and knowing what each one offers is what allows choosing well.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Respetar','Respect') + '</div><div class="rform">' + S('no dañar','do no harm') + '</div><div class="rnote">' + S('La autoridad se abstiene de violar el derecho con su propia actuación.','The authority refrains from violating the right through its own conduct.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Proteger','Protect') + '</div><div class="rform">' + S('impedir el daño','prevent harm') + '</div><div class="rnote">' + S('Evita que terceros vulneren el derecho de una persona.','It prevents third parties from harming the right of a person.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Garantizar','Guarantee') + '</div><div class="rform">' + S('hacerlo posible','make it possible') + '</div><div class="rnote">' + S('Pone los medios para que el derecho pueda ejercerse de verdad.','It provides the means so the right can actually be exercised.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Promover','Promote') + '</div><div class="rform">' + S('darlo a conocer','make it known') + '</div><div class="rnote">' + S('Difunde y enseña el derecho para que la gente pueda exigirlo.','It spreads and teaches the right so people can demand it.') + '</div></div>' +
    '</div>' +
    buildBalanza(rng));
  blRender();

  /* ── P1 ─────────────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La fuerza de un documento que no obliga', en:'The force of a document that does not bind' },
      stmt:{ es:'Un organismo público de derechos humanos concluye que una corporación policial violó derechos de varias personas y le dirige una recomendación. El vocero de la corporación declara a la prensa que se trata de una sugerencia sin ninguna consecuencia. ¿Qué explica mejor el peso real de ese documento?',
             en:'A public human rights body concludes that a police corps violated the rights of several people and addresses a recommendation to it. The spokesperson of the corps declares to the press that it is a suggestion with no consequence at all. What best explains the real weight of that document?' },
      options:{ es:[
        'No se ejecuta por la fuerza, pero es pública y coloca a la autoridad ante la obligación de responder: si la rechaza debe fundar su negativa por escrito y puede ser citada a comparecer ante el órgano legislativo.',
        'Obliga exactamente igual que una sentencia judicial, de modo que la autoridad que no la acata comete por ese solo hecho un delito que se persigue de oficio.',
        'Solo produce efectos cuando la autoridad firmó antes un convenio con el organismo en el que se comprometió a aceptar por anticipado sus conclusiones.',
        'Es un documento interno del organismo, por lo que su contenido se comunica a la autoridad señalada sin darse a conocer a la población.' ],
        en:[
        'It is not enforced by force, but it is public and places the authority under the obligation to answer: if it rejects the document it must give written grounds and it can be summoned before the legislative body.',
        'It binds exactly like a court ruling, so the authority that does not obey commits, by that fact alone, a crime prosecuted automatically.',
        'It produces effects only when the authority previously signed an agreement with the body committing itself in advance to accept its conclusions.',
        'It is an internal document of the body, so its content is communicated to the authority named without being made known to the population.' ] },
      correct:0,
      hint:{ es:'Piensa en dos cosas: qué puede hacer el organismo cuando la autoridad dice que no, y quién más se entera del contenido.',
             en:'Think about two things: what the body can do when the authority says no, and who else learns the content.' },
      explanation:{ es:'La recomendación no se impone por la fuerza, y por eso se le llama protección no jurisdiccional. Su peso viene de otro lado: es pública, describe con nombre y fecha lo que ocurrió, y la autoridad que la rechaza queda obligada a explicar por escrito por qué lo hace y puede ser llamada a comparecer ante el órgano legislativo que corresponde. Esa exposición pública, más el expediente que queda documentado, es lo que la convierte en un instrumento de exigencia y no en una simple opinión.',
                    en:'The recommendation is not imposed by force, and that is why it is called non judicial protection. Its weight comes from elsewhere: it is public, it describes with names and dates what happened, and the authority that rejects it is obliged to explain in writing why it does so and can be summoned before the corresponding legislative body. That public exposure, plus the documented file that remains, is what turns it into an instrument of demand and not a mere opinion.' } },
    { title:{ es:'Hasta dónde llega el organismo', en:'How far the body reaches' },
      stmt:{ es:'Durante una plática en la escuela, alguien afirma que cuando la comisión de derechos humanos comprueba una violación puede destituir al servidor público responsable y ordenar su detención. ¿Qué corrección es la adecuada?',
             en:'During a talk at school, somebody claims that when the human rights commission proves a violation it can dismiss the responsible public servant and order their detention. Which correction is the right one?' },
      options:{ es:[
        'El organismo investiga, documenta y recomienda, y da vista a quien sí puede sancionar: los órganos internos de control, la fiscalía o los tribunales, según el tipo de responsabilidad.',
        'La afirmación es correcta, porque la autonomía del organismo incluye la facultad de imponer sanciones administrativas y penales a quien resulte responsable.',
        'El organismo no puede sancionar ni tampoco investigar, ya que su función se limita a difundir los derechos humanos y a impartir cursos a las autoridades.',
        'La afirmación es correcta únicamente cuando la persona servidora pública acepta por escrito los hechos que el organismo le atribuye en su expediente.' ],
        en:[
        'The body investigates, documents and recommends, and refers the matter to whoever can sanction: internal control offices, the prosecutor or the courts, depending on the type of responsibility.',
        'The claim is correct, because the autonomy of the body includes the power to impose administrative and criminal sanctions on whoever is responsible.',
        'The body cannot sanction and cannot investigate either, since its function is limited to spreading human rights and giving courses to authorities.',
        'The claim is correct only when the public servant accepts in writing the facts the body attributes to them in its file.' ] },
      hint:{ es:'Separa dos funciones distintas: quién acredita que hubo una violación y quién impone una consecuencia por ella.',
             en:'Separate two different functions: who establishes that a violation happened and who imposes a consequence for it.' },
      correct:0,
      explanation:{ es:'Acreditar una violación y castigarla son tareas de instituciones distintas. El organismo de derechos humanos investiga, integra el expediente, concluye y recomienda, y cuando encuentra conductas que pueden derivar en responsabilidad administrativa o penal da vista a los órganos internos de control, a la fiscalía o a los tribunales, que son los que pueden destituir, multar o procesar. Confundir las dos funciones lleva a esperar del organismo algo que su mandato no le permite hacer.',
                    en:'Establishing a violation and punishing it are tasks of different institutions. The human rights body investigates, builds the file, concludes and recommends, and when it finds conduct that may lead to administrative or criminal responsibility it refers the matter to internal control offices, the prosecutor or the courts, which are the ones that can dismiss, fine or prosecute. Confusing the two functions leads to expecting from the body something its mandate does not allow.' } }
  ], rng), rng);

  /* ── P2 ─────────────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Elegir la vía con la que se va a reclamar', en:'Choosing the route to claim with' },
      stmt:{ es:'Ana necesita que una orden de la autoridad quede sin efecto y que el resultado se pueda hacer cumplir aunque la autoridad se resista. Su primo le insiste en que presente una queja ante el organismo de derechos humanos, porque es gratuito y rápido. ¿Qué debe considerar Ana antes de decidir?',
             en:'Ana needs an order from the authority to be annulled and the result to be enforceable even if the authority resists. Her cousin insists she file a complaint before the human rights body, because it is free and fast. What should Ana consider before deciding?' },
      options:{ es:[
        'Que la vía judicial termina en una resolución obligatoria que puede hacerse cumplir, mientras que la queja es gratuita y rápida pero termina en un documento que la autoridad puede rechazar.',
        'Que las dos vías terminan en resoluciones igualmente obligatorias, y la única diferencia real entre ellas está en el tiempo que tarda cada una en resolver el asunto.',
        'Que el organismo de derechos humanos puede dejar sin efecto la orden si la autoridad no contesta su solicitud de informes dentro del plazo que le fijó el propio organismo.',
        'Que la vía judicial no admite asuntos de derechos humanos, porque esos casos corresponden de manera exclusiva a los organismos públicos autónomos.' ],
        en:[
        'That the judicial route ends in a binding resolution that can be enforced, while the complaint is free and fast but ends in a document the authority can reject.',
        'That both routes end in equally binding resolutions, and the only real difference between them lies in how long each one takes to settle the matter.',
        'That the human rights body can annul the order if the authority does not answer its request for reports within the deadline the body itself set.',
        'That the judicial route does not admit human rights matters, because those cases belong exclusively to the autonomous public bodies.' ] },
      correct:0,
      hint:{ es:'Ana no busca cualquier respuesta: busca una que se pueda hacer cumplir contra la voluntad de la autoridad.',
             en:'Ana is not looking for any answer: she is looking for one that can be enforced against the will of the authority.' },
      explanation:{ es:'Las dos vías defienden derechos, pero ofrecen resultados distintos. La queja no cuesta nada, no exige abogado y avanza rápido, y por eso conviene cuando se busca documentar el hecho, detener un daño con medidas cautelares o presionar públicamente. Lo que Ana necesita, en cambio, es dejar sin efecto un acto y contar con una resolución exigible: eso solo lo da una persona juzgadora. Nada le impide seguir las dos, y muchas personas lo hacen.',
                    en:'Both routes defend rights, but they offer different results. The complaint costs nothing, requires no lawyer and moves fast, and that is why it suits documenting a fact, stopping harm with precautionary measures or applying public pressure. What Ana needs, instead, is to annul an act and to hold an enforceable resolution: only a judge gives that. Nothing prevents her from following both, and many people do.' } },
    { title:{ es:'Reconocer la protección no jurisdiccional', en:'Recognizing non judicial protection' },
      stmt:{ es:'Cuatro hechos ocurren en la misma semana en una ciudad. ¿Cuál de ellos corresponde a la actuación de un organismo público de derechos humanos y no a la de un tribunal?',
             en:'Four events happen in the same week in a city. Which one of them corresponds to the action of a public human rights body and not to that of a court?' },
      options:{ es:[
        'Se recibe la queja de una vecina, se piden informes a la autoridad señalada y se emite un documento público que describe la violación y pide reparar el daño.',
        'Se estudia el acto reclamado en un procedimiento con pruebas y con las dos partes presentes, y se dicta una resolución que deja sin efecto ese acto.',
        'Se ordena a una autoridad, bajo apercibimiento, que restituya en su empleo a una persona en un plazo de tres días hábiles contados a partir de la notificación.',
        'Se impone una multa a una persona servidora pública y se ordena su inhabilitación para ocupar cargos públicos durante los próximos cinco años.' ],
        en:[
        'A complaint from a neighbor is received, reports are requested from the authority named and a public document is issued describing the violation and asking for reparation.',
        'The challenged act is studied in a procedure with evidence and with both parties present, and a resolution is issued that annuls that act.',
        'An authority is ordered, under warning, to reinstate a person in their job within three working days counted from the notification.',
        'A fine is imposed on a public servant and their disqualification from holding public office for the next five years is ordered.' ] },
      correct:0,
      hint:{ es:'Busca el único hecho que termina en un documento que pide y no en una orden que manda.',
             en:'Look for the only event that ends in a document that asks and not in an order that commands.' },
      explanation:{ es:'La actuación del organismo se reconoce por su punto de partida y por su punto de llegada: empieza con una queja que cualquier persona puede presentar sin costo y termina en una recomendación pública que describe los hechos y pide reparación. Los otros tres hechos mandan: anulan un acto, ordenan bajo apercibimiento o imponen una sanción, y todos ellos requieren la fuerza de una resolución obligatoria que un organismo no jurisdiccional no puede dictar.',
                    en:'The action of the body is recognized by its starting point and by its end point: it begins with a complaint that anyone can file for free and ends in a public recommendation describing the facts and asking for reparation. The other three events command: they annul an act, order under warning or impose a sanction, and all of them require the force of a binding resolution that a non judicial body cannot issue.' } }
  ], rng), rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Cada institución tiene un mandato escrito','Each institution has a written mandate') + '</h2>' +
    '<p>' + S('Preguntar a dónde ir parece un detalle menor y no lo es: un caso presentado en la ventanilla equivocada se retrasa semanas. El mandato de cada institución responde dos preguntas, a quién vigila y qué puede hacer, y ese par decide la ruta. El organismo nacional atiende quejas contra autoridades federales; el organismo de cada entidad, contra autoridades estatales y municipales.',
              'Asking where to go looks like a minor detail and it is not: a case presented at the wrong window is delayed for weeks. The mandate of each institution answers two questions, whom it oversees and what it can do, and that pair decides the route. The national body handles complaints against federal authorities; the body of each state handles complaints against state and municipal authorities.') + '</p>' +
    '<p>' + S('Junto a ellos trabajan instituciones especializadas. El consejo nacional que previene la discriminación atiende actos discriminatorios, y a diferencia de los organismos anteriores puede conocer los que cometen particulares, como una empresa o un comercio. Las procuradurías de protección se ocupan de niñas, niños y adolescentes que necesitan medidas de protección inmediatas. Y la comisión de atención a víctimas acompaña, registra y gestiona la reparación de quienes ya fueron reconocidas como víctimas.',
              'Beside them work specialized institutions. The national council that prevents discrimination handles discriminatory acts, and unlike the previous bodies it can hear those committed by private parties, such as a company or a shop. The protection offices deal with children and adolescents who need immediate protection measures. And the victim support commission accompanies, registers and manages reparation for those already recognized as victims.') + '</p>' +
    '<p>' + S('Los mandatos también dicen lo que no. Los organismos de derechos humanos no revisan resoluciones judiciales, porque para eso existen los recursos dentro del propio juicio; no resuelven conflictos entre particulares donde no hay autoridad involucrada; y no intervienen en asuntos electorales. Conocer esos límites evita perder tiempo y ayuda a llevar el caso a quien de verdad puede tomarlo.',
              'Mandates also say what they do not cover. Human rights bodies do not review judicial resolutions, because the remedies inside the trial itself exist for that; they do not settle conflicts between private parties where no authority is involved; and they do not intervene in electoral matters. Knowing those limits avoids losing time and helps take the case to whoever can really handle it.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Regla práctica: ','Practical rule: ') + '</strong>' +
      S('antes de elegir institución, responde tres preguntas sobre el caso. Quién cometió el acto, de qué nivel de gobierno depende y qué resultado se busca. Con esas tres respuestas la ruta casi siempre queda clara.',
        'before choosing an institution, answer three questions about the case. Who committed the act, which level of government it depends on and what result is sought. With those three answers the route is almost always clear.') + '</p></div>' +
    buildMesa(rng));
  csRender();

  /* ── P3 ─────────────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La ventanilla que corresponde', en:'The right window' },
      stmt:{ es:'En un puesto de revisión de una carretera federal, agentes de una corporación federal bajan a varias personas de un autobús, las mantienen tres horas sin agua y sin explicación, y las dejan ir sin levantar ningún registro. Una organización quiere que el hecho se investigue sin costo y que la corporación reciba una recomendación pública. ¿Qué institución corresponde?',
             en:'At a checkpoint on a federal highway, agents of a federal corps take several people off a bus, keep them for three hours without water and without explanation, and let them go without making any record. An organization wants the fact investigated at no cost and the corps to receive a public recommendation. Which institution fits?' },
      options:{ es:[
        'La Comisión Nacional de los Derechos Humanos, porque la queja se dirige contra la actuación de una autoridad federal y lo que se busca es una investigación gratuita con recomendación pública.',
        'La comisión de derechos humanos del estado por el que pasa la carretera, porque el hecho ocurrió dentro de su territorio y ahí viven las personas afectadas.',
        'El consejo nacional que previene la discriminación, porque las personas fueron bajadas del autobús sin que mediara ninguna explicación de los agentes.',
        'Un juzgado civil del lugar, porque las personas afectadas sufrieron un daño y buscan que alguien lo repare por medio de una resolución.' ],
        en:[
        'The National Human Rights Commission, because the complaint is aimed at the conduct of a federal authority and what is sought is a free investigation with a public recommendation.',
        'The human rights commission of the state the highway crosses, because the fact happened inside its territory and the affected people live there.',
        'The national council that prevents discrimination, because the people were taken off the bus without the agents giving any explanation.',
        'A local civil court, because the affected people suffered harm and seek someone to repair it through a resolution.' ] },
      correct:0,
      hint:{ es:'No decide dónde ocurrió el hecho, sino de qué nivel de gobierno depende quien lo cometió y qué resultado se busca.',
             en:'What decides is not where the fact happened, but which level of government the one who committed it depends on and what result is sought.' },
      explanation:{ es:'La competencia se define por la autoridad señalada, no por el lugar. Como los agentes pertenecen a una corporación federal, la queja corresponde al organismo nacional, aunque el hecho haya ocurrido dentro de un estado. El consejo que previene la discriminación entraría si el trato se hubiera basado en el origen, la apariencia u otra categoría prohibida, y un juzgado civil resolvería un conflicto de otra naturaleza. Además, lo que la organización busca, una investigación gratuita que termine en recomendación pública, es justamente lo que ofrece la vía no jurisdiccional.',
                    en:'Competence is defined by the authority named, not by the place. Since the agents belong to a federal corps, the complaint corresponds to the national body, even though the fact happened inside a state. The council that prevents discrimination would come in if the treatment had been based on origin, appearance or another prohibited category, and a civil court would settle a conflict of another nature. Besides, what the organization seeks, a free investigation ending in a public recommendation, is exactly what the non judicial route offers.' } },
    { title:{ es:'Cuando quien discrimina no es autoridad', en:'When the one who discriminates is not an authority' },
      stmt:{ es:'Una empresa privada publica una vacante y anota que no recibirá solicitudes de personas mayores de treinta y cinco años ni de quienes tengan alguna discapacidad. Varias personas quedaron fuera por ese anuncio y quieren reclamar. Ninguna autoridad participó en el hecho. ¿Qué institución corresponde?',
             en:'A private company publishes a job opening and notes that it will not receive applications from people over thirty five or from those with a disability. Several people were left out by that notice and want to claim. No authority took part in the fact. Which institution fits?' },
      options:{ es:[
        'El consejo nacional que previene la discriminación, porque su mandato alcanza actos discriminatorios cometidos también por particulares, como una empresa.',
        'La Comisión Nacional de los Derechos Humanos, porque el anuncio afecta un derecho reconocido en la Constitución y el caso ocurrió en más de un estado del país.',
        'La comisión de derechos humanos del estado donde está la empresa, porque su mandato cubre cualquier violación de derechos ocurrida dentro de ese territorio.',
        'La comisión de atención a víctimas, porque las personas que quedaron fuera del proceso de selección sufrieron un daño que alguien debe reparar.' ],
        en:[
        'The national council that prevents discrimination, because its mandate also reaches discriminatory acts committed by private parties, such as a company.',
        'The National Human Rights Commission, because the notice affects a right recognized in the Constitution and the case happened in more than one state of the country.',
        'The human rights commission of the state where the company is located, because its mandate covers any rights violation happening inside that territory.',
        'The victim support commission, because the people left out of the selection process suffered harm that someone must repair.' ] },
      correct:0,
      hint:{ es:'Revisa quién cometió el acto: en este caso no hay ninguna autoridad de por medio.',
             en:'Check who committed the act: in this case there is no authority involved.' },
      explanation:{ es:'Los organismos públicos de derechos humanos, nacional y estatales, conocen quejas contra autoridades, y aquí no hay ninguna: quien excluye es una empresa. El consejo que previene la discriminación es la institución diseñada precisamente para ese vacío, porque su mandato alcanza también los actos discriminatorios de particulares y puede llamar a las partes, dictar medidas administrativas y ordenar acciones de reparación. La comisión de atención a víctimas interviene en otro momento, cuando ya existe un reconocimiento de la calidad de víctima.',
                    en:'Public human rights bodies, national and state ones, hear complaints against authorities, and here there is none: the one excluding is a company. The council that prevents discrimination is the institution designed precisely for that gap, because its mandate also reaches discriminatory acts by private parties and it can summon the parties, issue administrative measures and order reparation actions. The victim support commission comes in at another moment, once the status of victim is already recognized.' } }
  ], rng), rng);

  /* ── P4 ─────────────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Lo que el mandato deja fuera', en:'What the mandate leaves out' },
      stmt:{ es:'Un hombre perdió un juicio y considera que la persona juzgadora resolvió mal. Acude al organismo de derechos humanos y pide que revoque la sentencia y ordene un nuevo fallo a su favor. ¿Qué respuesta corresponde a su solicitud?',
             en:'A man lost a trial and believes the judge decided badly. He goes to the human rights body and asks it to revoke the ruling and order a new decision in his favor. What answer fits his request?' },
      options:{ es:[
        'El organismo no puede revisar el fondo de una resolución judicial: eso se combate con los recursos del propio juicio ante tribunales superiores, aunque sí puede atender demoras u obstáculos ajenos al criterio del fallo.',
        'El organismo debe admitir la solicitud y revocar la sentencia, porque su autonomía le permite revisar cualquier acto de autoridad, incluidas las resoluciones de los tribunales.',
        'El organismo debe admitir la solicitud solo si el hombre demuestra que no cuenta con recursos para pagar a un abogado que promueva el recurso correspondiente.',
        'El organismo no puede hacer nada en ningún caso relacionado con tribunales, porque su mandato se limita a las autoridades del poder ejecutivo federal.' ],
        en:[
        'The body cannot review the substance of a judicial resolution: that is challenged with the remedies of the trial itself before higher courts, although it can address delays or obstacles unrelated to the criterion of the ruling.',
        'The body must admit the request and revoke the ruling, because its autonomy allows it to review any act of authority, including court resolutions.',
        'The body must admit the request only if the man proves he lacks the resources to pay a lawyer to bring the corresponding remedy.',
        'The body can do nothing at all in any matter related to courts, because its mandate is limited to authorities of the federal executive branch.' ] },
      correct:0,
      hint:{ es:'Piensa en para qué existen los recursos dentro de un juicio y qué pasaría si otro organismo pudiera cambiar los fallos.',
             en:'Think about why remedies inside a trial exist and what would happen if another body could change rulings.' },
      explanation:{ es:'Si un organismo no jurisdiccional pudiera modificar sentencias, la independencia judicial dejaría de existir y ningún fallo sería definitivo. Por eso el mandato excluye el fondo de las resoluciones judiciales y remite a los recursos del propio juicio. El límite no es absoluto: el organismo sí puede intervenir por hechos ajenos al criterio del fallo, como una demora injustificada, la falta de una persona intérprete o el obstáculo al acceso al expediente, que son violaciones a los derechos del proceso y no desacuerdos con lo resuelto.',
                    en:'If a non judicial body could modify rulings, judicial independence would cease to exist and no decision would be final. That is why the mandate excludes the substance of judicial resolutions and refers to the remedies of the trial itself. The limit is not absolute: the body can intervene for facts unrelated to the criterion of the ruling, such as an unjustified delay, the absence of an interpreter or an obstacle to accessing the file, which are violations of procedural rights and not disagreements with what was decided.' } },
    { title:{ es:'Un conflicto sin autoridad de por medio', en:'A conflict with no authority involved' },
      stmt:{ es:'Dos vecinos llevan meses en desacuerdo por el uso de un patio compartido. Uno de ellos presenta una queja ante la comisión estatal de derechos humanos para que obligue al otro a ceder. No participa ninguna autoridad y el desacuerdo no se basa en ninguna característica de las personas. ¿Qué corresponde esperar?',
             en:'Two neighbors have disagreed for months about the use of a shared yard. One of them files a complaint before the state human rights commission so that it forces the other to give in. No authority takes part and the disagreement is not based on any characteristic of the people. What should be expected?' },
      options:{ es:[
        'Que la comisión no admita la queja por falta de competencia, porque su mandato es vigilar autoridades, y oriente a los vecinos hacia una instancia de conciliación o judicial.',
        'Que la comisión admita la queja y emita una recomendación dirigida al vecino que se niega a ceder, ya que el conflicto afecta la convivencia del lugar.',
        'Que la comisión admita la queja e imponga una multa al vecino responsable, porque su autonomía la faculta para resolver cualquier conflicto entre habitantes.',
        'Que la comisión turne el asunto al consejo nacional que previene la discriminación, porque todo conflicto entre particulares corresponde a ese consejo.' ],
        en:[
        'That the commission does not admit the complaint for lack of competence, because its mandate is to oversee authorities, and that it guides the neighbors toward a conciliation or judicial instance.',
        'That the commission admits the complaint and issues a recommendation addressed to the neighbor who refuses to give in, since the conflict affects local coexistence.',
        'That the commission admits the complaint and fines the responsible neighbor, because its autonomy empowers it to settle any conflict between residents.',
        'That the commission refers the matter to the national council that prevents discrimination, because every conflict between private parties belongs to that council.' ] },
      correct:0,
      hint:{ es:'Recuerda a quién vigilan los organismos públicos de derechos humanos y qué tendría que haber en el caso para que el consejo pudiera entrar.',
             en:'Recall whom public human rights bodies oversee and what the case would need for the council to be able to step in.' },
      explanation:{ es:'El sujeto obligado frente a estos organismos es la autoridad, y en el patio compartido no hay ninguna. Por eso la queja no se admite y lo que corresponde es orientar a los vecinos hacia una instancia de conciliación o hacia un juzgado, que sí resuelven conflictos entre particulares. El consejo que previene la discriminación tampoco entraría, porque su mandato requiere que el trato se base en una característica de la persona, como su origen, su edad, su discapacidad o su lengua, y aquí el desacuerdo es sobre el uso de un espacio.',
                    en:'The obliged subject before these bodies is the authority, and in the shared yard there is none. That is why the complaint is not admitted and what fits is to guide the neighbors toward a conciliation instance or a court, which do settle conflicts between private parties. The council that prevents discrimination would not step in either, because its mandate requires the treatment to be based on a characteristic of the person, such as origin, age, disability or language, and here the disagreement is about the use of a space.' } }
  ], rng), rng);

  /* ── CONCEPTO 3 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('La queja: el instrumento que abre la puerta','The complaint: the instrument that opens the door') + '</h2>' +
    '<p>' + S('La queja es el trámite con el que una persona pone en movimiento a un organismo de derechos humanos. No cuesta nada, no exige abogado y no pide un formato solemne: puede presentarse por escrito, en la oficina, por teléfono o por medios electrónicos. Puede presentarla la persona afectada o cualquier otra en su favor, incluso una organización, y por regla general se presenta dentro del año siguiente al hecho, con excepciones cuando se trata de violaciones graves.',
              'The complaint is the procedure with which a person sets a human rights body in motion. It costs nothing, requires no lawyer and asks for no solemn format: it can be filed in writing, at the office, by phone or by electronic means. It can be filed by the affected person or by anyone else on their behalf, including an organization, and as a rule it is filed within the year following the fact, with exceptions when serious violations are involved.') + '</p>' +
    '<p>' + S('Lo que sí necesita es contenido. Un expediente se sostiene sobre cuatro preguntas: quién actuó, qué hizo, cuándo y dónde, más un medio para localizar a quien reclama y la firma que hace suyo el escrito. Con eso el organismo pide informes a la autoridad señalada, que está obligada a responder, y empieza a integrar pruebas. Si el daño continúa mientras avanza la investigación, puede solicitar medidas cautelares, es decir, pedir a la autoridad que suspenda o realice algo de inmediato para evitar un daño que después no tendría remedio.',
              'What it does need is content. A file stands on four questions: who acted, what they did, when and where, plus a way to reach whoever claims and the signature that makes the document theirs. With that the body requests reports from the authority named, which is obliged to answer, and starts gathering evidence. If harm continues while the investigation moves forward, it can request precautionary measures, that is, ask the authority to suspend or to do something immediately in order to avoid harm that later would have no remedy.') + '</p>' +
    '<p>' + S('El expediente puede cerrar de varias maneras: con una conciliación cuando la autoridad corrige durante el trámite, con un acuerdo de no violación cuando la investigación no la acredita, o con una recomendación cuando sí. La recomendación se notifica y se publica, y la autoridad tiene un plazo para aceptarla o rechazarla y otro para probar que la cumplió. A partir de ahí empieza el seguimiento, que es la parte menos vistosa y la que decide si el reclamo sirvió de algo.',
              'The file can close in several ways: with a conciliation when the authority corrects during the procedure, with a finding of no violation when the investigation does not establish one, or with a recommendation when it does. The recommendation is notified and published, and the authority has a deadline to accept or reject it and another to prove that it complied. From there the follow up begins, which is the least showy part and the one that decides whether the claim was worth anything.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Presentar','File') + '</div><div class="rform">' + S('gratuita','free of charge') + '</div><div class="rnote">' + S('Cualquier persona, sin abogado y sin formato solemne.','Any person, without a lawyer and without a solemn format.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Investigar','Investigate') + '</div><div class="rform">' + S('pedir informes','request reports') + '</div><div class="rnote">' + S('La autoridad señalada está obligada a responder.','The authority named is obliged to answer.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Proteger a tiempo','Protect in time') + '</div><div class="rform">' + S('medidas cautelares','precautionary measures') + '</div><div class="rnote">' + S('Frenan el daño mientras dura la investigación.','They stop the harm while the investigation lasts.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Concluir','Conclude') + '</div><div class="rform">' + S('recomendación','recommendation') + '</div><div class="rnote">' + S('Se publica, se acepta o se rechaza, y se le da seguimiento.','It is published, accepted or rejected, and followed up.') + '</div></div>' +
    '</div>' +
    buildQueja(rng));
  qjRender();

  addProblem(pick([
    { title:{ es:'El escrito que sí puede investigarse', en:'The document that can actually be investigated' },
      stmt:{ es:'Cuatro personas redactan su queja el mismo día. ¿Cuál de estos escritos permite que el organismo abra un expediente y comience a investigar?',
             en:'Four people write their complaint on the same day. Which of these documents allows the body to open a file and start investigating?' },
      options:{ es:[
        'El martes 14, en la clínica de la avenida Juárez, el médico de guardia del turno vespertino me negó la consulta por no traer comprobante de domicilio. Mi teléfono es el que anoto abajo y firmo este escrito.',
        'En este país las autoridades nunca respetan a nadie y todo el sistema de salud está podrido de arriba abajo. Alguien tiene que hacer algo de una vez por todas con esa gente.',

        'Adjunto la nota de un periódico sobre una clínica de otro estado donde negaron una consulta el año pasado, para que se investigue lo que sucede en todo el sector salud del país.' ],
        en:[
        'On Tuesday the 14th, at the clinic on Juarez avenue, the doctor on duty in the evening shift denied me the appointment for not bringing proof of address. My phone number is written below and I sign this document.',
        'In this country the authorities never respect anyone and the whole health system is rotten from top to bottom. Somebody has to do something about those people once and for all.',
        'I want to complain because at the clinic they treated me badly some time ago. I do not remember the date or who attended me, but it was very unfair and I felt humiliated that day.',

      correct:0,
      hint:{ es:'Revisa cuál de los cuatro responde a la vez quién actuó, qué hizo, cuándo y dónde.',
             en:'Check which of the four answers at once who acted, what they did, when and where.' },
      explanation:{ es:'El primer escrito nombra el día, el lugar, la persona señalada por su función y turno, el hecho concreto y un medio de contacto, y va firmado: con eso el organismo puede pedir informes a esa clínica y verificar lo ocurrido. El segundo es una opinión general sin hecho ni autoridad; el tercero describe un malestar real pero sin datos que permitan localizar nada; y el cuarto se apoya en un caso ajeno, que no prueba lo que le pasó a quien reclama.',
                    en:'The first document names the day, the place, the person identified by function and shift, the concrete fact and a means of contact, and it is signed: with that the body can request reports from that clinic and verify what happened. The second is a general opinion with no fact and no authority; the third describes real distress but without details that allow locating anything; and the fourth relies on an unrelated case, which does not prove what happened to the person claiming.' } },
    { title:{ es:'Cuando el daño no puede esperar', en:'When the harm cannot wait' },
      stmt:{ es:'Una familia presenta una queja porque a su hija con discapacidad auditiva le niegan la inscripción en la escuela pública. El ciclo escolar comienza en dos semanas y la investigación puede tardar meses. ¿Qué instrumento corresponde solicitar y cuál es su alcance?',
             en:'A family files a complaint because their daughter with a hearing disability is denied enrollment at the public school. The school year starts in two weeks and the investigation may take months. Which instrument should be requested and what is its scope?' },
      options:{ es:[
        'Medidas cautelares, con las que el organismo pide a la autoridad actuar de inmediato para evitar un daño irreparable, sin que ello prejuzgue todavía si hubo o no violación.',
        'Una recomendación anticipada, con la que el organismo concluye desde ahora que hubo violación y ordena a la escuela inscribir a la niña en un plazo perentorio.',
        'Una denuncia penal contra el personal de la escuela, único camino para lograr que la niña quede inscrita antes de que empiece el ciclo escolar.',
        'Una queja adicional ante el mismo organismo, de modo que al haber dos expedientes abiertos el caso avance con el doble de rapidez que uno solo.' ],
        en:[
        'Precautionary measures, with which the body asks the authority to act immediately to avoid irreparable harm, without that prejudging yet whether a violation occurred.',
        'An early recommendation, with which the body concludes from now that a violation occurred and orders the school to enroll the girl within a strict deadline.',
        'A criminal complaint against the school staff, the only path to get the girl enrolled before the school year starts.',
        'An additional complaint before the same body, so that with two open files the case moves twice as fast as with one.' ] },
      correct:0,
      hint:{ es:'Piensa en qué hace falta antes de que la investigación termine, y en si eso puede darse por concluido el fondo del caso.',
             en:'Think about what is needed before the investigation ends, and whether that can settle the substance of the case.' },
      explanation:{ es:'Las medidas cautelares existen justamente para los casos en que esperar equivale a perder el derecho: si la niña no se inscribe ahora, pierde el ciclo completo, y esa pérdida ya no se repara después. El organismo pide a la autoridad una acción inmediata mientras investiga, y esa solicitud no adelanta ninguna conclusión sobre el fondo. Una recomendación llega al final, después de integrar el expediente, y una denuncia penal persigue otra cosa: la responsabilidad de personas, no la inscripción de la niña.',
                    en:'Precautionary measures exist precisely for cases where waiting means losing the right: if the girl is not enrolled now, she loses the whole year, and that loss cannot be repaired afterwards. The body asks the authority for immediate action while it investigates, and that request anticipates no conclusion on the substance. A recommendation arrives at the end, after the file is built, and a criminal complaint pursues something else: the responsibility of individuals, not the enrollment of the girl.' } }
  ], rng), rng);

  addProblem(pick([
