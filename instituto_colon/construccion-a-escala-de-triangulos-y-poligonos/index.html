/* ================================================
   buildLesson - OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');

  /* ── helpers ─────────────────────────────────────────────────────── */
  function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function pk(a){ return a[Math.floor(rng()*a.length)]; }
  function cssv(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || 'transparent'; } catch(e){ return 'transparent'; } }
  function dg(v){ return v+'°'; }
  function n1(v){ var r=Math.round(v*100)/100; return (r===Math.round(r)) ? String(Math.round(r)) : String(r); }
  function cm(v){ return n1(v)+' cm'; }
  function F(){ return '700 11px "IBM Plex Sans", sans-serif'; }

  var BTN  = 'min-height:44px;min-width:44px;padding:.55rem 1.1rem;border-radius:8px;border:1.5px solid var(--green);background:var(--green);color:#fff;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer';
  var BTN2 = 'min-height:44px;min-width:44px;padding:.45rem .9rem;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer';
  var CHIP = 'min-height:44px;padding:.5rem .8rem;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-align:left';

  function fbSet(id, ok, html){
    var e=document.getElementById(id); if(!e) return;
    e.className='mcfb show'; e.innerHTML=html;
    e.style.background = ok ? 'var(--ok-bg)' : 'var(--gold-bg)';
    e.style.color      = ok ? 'var(--ok)'    : 'var(--text2)';
  }
  function sec(tag,title,html){
    var d=document.createElement('div'); d.className='section';
    d.innerHTML='<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
    LB.appendChild(d); return d;
  }
  function widget(kind, html){
    var d=document.createElement('div');
    d.className = kind+'wrap section';
    d.setAttribute('data-widget', kind);
    d.innerHTML = html;
    LB.appendChild(d); return d;
  }
  function addProb(p){
    var so = shuffle(p.options, rng);
    problems.push({
      title:p.title, questionText:p.q, fn:(p.fn||''), hint:p.hint, explanation:p.exp,
      options:so, correctIdx:so.indexOf(p.correct), showWork:!!p.showWork,
      studentChoice:null, pendingChoice:null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }
  function optN(correct, cands, suf){
    suf = (suf===undefined ? '' : suf);
    var out=[correct], i, c;
    for (i=0;i<cands.length && out.length<4;i++){
      c = Math.round(cands[i]);
      if (c>0 && out.indexOf(c)<0) out.push(c);
    }
    var d=1;
    while (out.length<4 && d<600){
      if (out.indexOf(correct+d)<0) out.push(correct+d);
      else if (correct-d>0 && out.indexOf(correct-d)<0) out.push(correct-d);
      d++;
    }
    return out.map(function(v){ return v+suf; });
  }
  function optT(correct, others){
    var out=[correct];
    for (var i=0;i<others.length && out.length<4;i++){ if (out.indexOf(others[i])<0) out.push(others[i]); }
    return out;
  }
  function cvSetup(cv, H){
    var dpr=window.devicePixelRatio||1, W=cv.clientWidth||320;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    return { g:g, W:W, H:H };
  }
  function listCm(a){ return a.map(function(v){ return n1(v)+' cm'; }).join(', ').replace(/, ([^,]*)$/, L({es:' y $1', en:' and $1'})); }
  function listM(a){  return a.map(function(v){ return n1(v)+' m';  }).join(', ').replace(/, ([^,]*)$/, L({es:' y $1', en:' and $1'})); }

  /* ══════════════════════════════════════════════════════════════════
     SECCIÓN 1 - El factor de escala
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 1', en:'Concept 1'}),
      L({es:'Todas las medidas por un mismo número', en:'Every measurement by one same number'}),
    '<p>'+L({es:'Una copia a escala no es un dibujo que se parece al original: es el mismo dibujo con todas sus longitudes multiplicadas por un mismo número. Ese número es el factor de escala y se descubre comparando un lado de la copia con el lado que le corresponde en el original. Si el factor pasa de uno, la copia crece; si se queda por debajo de uno, la copia se encoge; y si vale exactamente uno, las dos figuras son la misma. Los lados correspondientes son los que ocupan el mismo lugar en las dos figuras, no los que se parecen a simple vista.',
             en:'A scale copy is not a drawing that looks like the original: it is the same drawing with every one of its lengths multiplied by one same number. That number is the scale factor and it is discovered by comparing a side of the copy with the side matching it in the original. If the factor goes past one, the copy grows; if it stays below one, the copy shrinks; and if it is exactly one, the two figures are the same. Matching sides are the ones sitting in the same place in both figures, not the ones that look alike at first glance.'})+'</p>'+
    '<p>'+L({es:'Lo delicado está en la palabra mismo. Basta con que un solo lado desobedezca al factor para que la figura deje de ser copia y pase a ser una deformación: se alarga por un lado y se queda corta por el otro. Por eso, después de sacar el factor con una pareja de lados que se corresponden, conviene probarlo con otra pareja. Si el mismo número funciona en todas las parejas, el dibujo está bien construido; si falla en una, allí está el error.',
             en:'The delicate part is the word same. It takes a single side disobeying the factor for the figure to stop being a copy and turn into a distortion: it stretches on one side and falls short on the other. That is why, after working out the factor with one pair of matching sides, it is worth testing it on another pair. If the same number works on every pair, the drawing is well built; if it fails on one, that is where the mistake is.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'El factor',en:'The factor'})+'</div><div class="rform">'+L({es:'copia ÷ original',en:'copy ÷ original'})+'</div><div class="rnote">'+L({es:'Sale de una pareja de lados que se corresponden.',en:'It comes from one pair of matching sides.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Mayor que 1',en:'Greater than 1'})+'</div><div class="rform">'+L({es:'la copia crece',en:'the copy grows'})+'</div><div class="rnote">'+L({es:'Es una ampliación de la figura original.',en:'It is an enlargement of the original figure.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Menor que 1',en:'Less than 1'})+'</div><div class="rform">'+L({es:'la copia se encoge',en:'the copy shrinks'})+'</div><div class="rnote">'+L({es:'Es la reducción que hace caber un terreno en la hoja.',en:'It is the reduction that fits a plot onto the sheet.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Todos los lados',en:'Every side'})+'</div><div class="rform">'+L({es:'el mismo factor',en:'the same factor'})+'</div><div class="rnote">'+L({es:'Uno solo que falle rompe la copia.',en:'A single one failing breaks the copy.'})+'</div></div>'+
    '</div>'+
    '<div class="callout"><p>'+L({es:'El error más común es sumar en vez de multiplicar. Agregar dos centímetros a cada lado también agranda la figura, pero engorda mucho a los lados cortos y casi nada a los largos, así que la forma se pierde por el camino.',
                                  en:'The commonest mistake is adding instead of multiplying. Adding two centimetres to every side also makes the figure bigger, but it fattens the short sides a lot and the long ones almost nothing, so the shape gets lost along the way.'})+'</p></div>');

  /* ── W1: ajusta el factor (3 rondas) ── */
  var w1R = [];
  (function(){
    var pool = shuffle([[8,5],[6,15],[4,20],[6,25],[5,30],[10,15],[12,5],[8,25],[10,5],[4,25]], rng);
    for (var i=0;i<3;i++){ w1R.push({ s:pool[i][0], v:pool[i][1], t:pool[i][0]*pool[i][1]/10 }); }
  })();
  widget('factor',
    '<div class="stag">'+L({es:'Ajusta el factor',en:'Adjust the factor'})+'</div>'+
    '<h2>'+L({es:'Lleva la copia a la medida pedida',en:'Bring the copy to the required measurement'})+'</h2>'+
    '<p>'+L({es:'La figura verde es el original y la dorada es tu copia. El deslizador decide por cuánto se multiplica cada longitud, y la copia responde al instante. Abajo, la raya punteada marca justo lo que debe medir el lado de la copia: muévete hasta que la copia se pare exactamente sobre esa raya.',
             en:'The green figure is the original and the golden one is your copy. The slider decides what every length gets multiplied by, and the copy answers at once. Below, the dashed line marks exactly what the side of the copy has to measure: move until the copy lands right on that line.'})+'</p>'+
    '<div class="gcrd">'+
      '<div style="font-size:.85rem;color:var(--text2);margin-bottom:.7rem" id="w1goal"></div>'+
      '<div class="cvwrap"><canvas id="w1cv" style="display:block;width:100%;height:226px"></canvas></div>'+
      '<div class="cg" style="margin-top:.9rem"><label>'+L({es:'Factor de escala: ',en:'Scale factor: '})+'<span class="cval" id="w1kv">×1</span></label>'+
        '<input type="range" id="w1k" min="5" max="30" step="5" value="10"></div>'+
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem">'+
        '<button id="w1dn" style="'+BTN2+'">'+L({es:'Menos',en:'Less'})+'</button>'+
        '<button id="w1up" style="'+BTN2+'">'+L({es:'Más',en:'More'})+'</button>'+
        '<button id="w1chk" style="'+BTN+'">'+L({es:'Comprobar',en:'Check'})+'</button>'+
      '</div>'+
      '<div class="metrics" style="margin-top:.9rem">'+
        '<div class="metric"><div class="mlbl">'+L({es:'Lado del original',en:'Side of the original'})+'</div><div class="mnum cs" id="w1a">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Lado de tu copia',en:'Side of your copy'})+'</div><div class="mnum ps" id="w1b">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Medida pedida',en:'Required measure'})+'</div><div class="mnum ts" id="w1c">-</div></div>'+
      '</div>'+
      '<div class="mcfb" id="w1fb"></div>'+
    '</div>');

  (function(){
    var round=0, tries=0, done=false, busy=false;
    var myCv = document.getElementById('w1cv');
    function R(){ return w1R[Math.min(round,2)]; }
    function G(){ var e=document.getElementById('w1k'); return e ? parseInt(e.value,10) : 10; }
    function draw(){
      var cv=document.getElementById('w1cv'); if(!cv || cv!==myCv) return;
      var st=cvSetup(cv,226), g=st.g, W=st.W, H=st.H;
      var r=R(), k=G()/10, copy=r.s*k;
      var widest = r.s*3;
      var baseY = H-48;
      var px = Math.min((W-56)/(r.s + widest + 3), (baseY-18)/(0.72*widest));
      function tri(x, len, fill, stroke, lbl){
        var w=len*px, apex=x+0.36*w, hy=baseY-0.72*w;
        g.fillStyle=fill;
        g.beginPath(); g.moveTo(x,baseY); g.lineTo(x+w,baseY); g.lineTo(apex,hy); g.closePath(); g.fill();
        g.strokeStyle=stroke; g.lineWidth=2.2; g.stroke();
        g.fillStyle=stroke; g.font=F(); g.textAlign='center'; g.textBaseline='top';
        g.fillText(lbl, x+w/2, baseY+5);
      }
      tri(22, r.s, cssv('--green-bg'), cssv('--green'), n1(r.s)+' cm');
      var cx = 22 + r.s*px + 20;
      tri(cx, copy, cssv('--gold-bg'), cssv('--gold'), n1(copy)+' cm');
      g.strokeStyle=cssv('--text3'); g.lineWidth=2.4; g.setLineDash([5,4]);
      g.beginPath(); g.moveTo(cx, baseY+22); g.lineTo(cx + r.t*px, baseY+22); g.stroke();
      g.setLineDash([]);
      g.fillStyle=cssv('--text3'); g.font='500 10px "IBM Plex Sans", sans-serif';
      g.textAlign='left'; g.textBaseline='top';
      g.fillText(L({es:'pedido: ',en:'required: '})+n1(r.t)+' cm', cx, baseY+27);
    }
    function update(){
      var r=R(), k=G()/10, e;
      e=document.getElementById('w1kv'); if(e) e.textContent='×'+n1(k);
      e=document.getElementById('w1a');  if(e) e.textContent=n1(r.s)+' cm';
      e=document.getElementById('w1b');
      if(e){ e.textContent=n1(r.s*k)+' cm'; e.style.color = (Math.abs(r.s*k-r.t)<0.001 ? 'var(--ok)' : 'var(--gold)'); }
      e=document.getElementById('w1c');  if(e) e.textContent=n1(r.t)+' cm';
      e=document.getElementById('w1goal');
      if(e) e.innerHTML=L({es:'Ronda '+(round+1)+' de 3: el lado marcado del original mide <strong>'+n1(r.s)+' cm</strong> y en la copia debe quedar en <strong>'+n1(r.t)+' cm</strong>.',
                           en:'Round '+(round+1)+' of 3: the marked side of the original measures <strong>'+n1(r.s)+' cm</strong> and in the copy it has to end up at <strong>'+n1(r.t)+' cm</strong>.'});
      draw();
    }
    function nextRound(){
      round++; busy=false;
      if (round>=3){ done=true; return; }
      tries=0;
      var sl=document.getElementById('w1k'); if(sl) sl.value='10';
      update();
    }
    function check(){
      if (done||busy) return;
      var r=R(), k=G()/10, copy=r.s*k;
      if (Math.abs(copy-r.t)<0.001){
        fbSet('w1fb', true, L({es:'🎉 Justo en la medida. Con el factor ×'+n1(k)+', el lado de '+n1(r.s)+' cm queda en '+n1(r.t)+' cm.'+(round===2?' Las tres rondas quedaron listas.':' Va la siguiente ronda.'),
                               en:'🎉 Right on the measure. With factor ×'+n1(k)+', the side of '+n1(r.s)+' cm ends up at '+n1(r.t)+' cm.'+(round===2?' All three rounds are done.':' On to the next round.')}));
        busy=true; setTimeout(nextRound, 80); return;
      }
      tries++;
      if (tries>=3){
        var sl=document.getElementById('w1k'); if(sl) sl.value=String(r.v);
        update();
        fbSet('w1fb', true, L({es:'El factor era ×'+n1(r.v/10)+'. Se obtiene comparando la medida pedida con la del original: '+n1(r.t)+' ÷ '+n1(r.s)+' = '+n1(r.v/10)+'.',
                               en:'The factor was ×'+n1(r.v/10)+'. It comes from comparing the required measure with the original one: '+n1(r.t)+' ÷ '+n1(r.s)+' = '+n1(r.v/10)+'.'}));
        busy=true; setTimeout(nextRound, 80); return;
      }
      fbSet('w1fb', false, (copy>r.t)
        ? L({es:'Tu copia llegó a '+n1(copy)+' cm y se pasó de los '+n1(r.t)+' cm pedidos: el multiplicador estiró de más. Baja el factor.',
             en:'Your copy reached '+n1(copy)+' cm and went past the '+n1(r.t)+' cm required: the multiplier stretched too far. Lower the factor.'})
        : L({es:'Tu copia se quedó en '+n1(copy)+' cm, todavía por debajo de los '+n1(r.t)+' cm pedidos. Sube el factor.',
             en:'Your copy stopped at '+n1(copy)+' cm, still short of the '+n1(r.t)+' cm required. Raise the factor.'}));
    }
    var sl0=document.getElementById('w1k'); if(sl0) sl0.addEventListener('input', update);
    var bu=document.getElementById('w1up');
    if (bu) bu.addEventListener('click', function(){ var s=document.getElementById('w1k'); if(s){ s.value=String(Math.min(30, parseInt(s.value,10)+5)); update(); } });
    var bd=document.getElementById('w1dn');
    if (bd) bd.addEventListener('click', function(){ var s=document.getElementById('w1k'); if(s){ s.value=String(Math.max(5, parseInt(s.value,10)-5)); update(); } });
    var cb=document.getElementById('w1chk'); if(cb) cb.addEventListener('click', check);
    setTimeout(update, 90);
    window.addEventListener('resize', function(){ if(document.getElementById('w1cv')===myCv) draw(); });
  })();

  /* ── P1 ── */
  var p1v = pk([0,1]);
  var p1q, p1exp, p1corr, p1opts, p1title, p1hint;
  if (p1v===0){
    var t1 = pk([[4,6,7],[5,7,9],[6,8,9],[4,5,6],[5,6,8],[6,7,10]]);
    var k1 = pk([2,3,4]);
    var a1=t1[0], b1=t1[1], c1=t1[2], ac1=a1*k1, res1=c1*k1;
    p1corr = res1+' cm';
    p1opts = optN(res1, [c1+(ac1-a1), b1*k1, c1], ' cm');
    p1title = L({es:'El lado que falta en la copia', en:'The missing side of the copy'});
    p1q = L({es:'Un triángulo tiene lados de '+a1+' cm, '+b1+' cm y '+c1+' cm. En una copia a escala, el lado que corresponde al de '+a1+' cm mide '+ac1+' cm. ¿Cuánto mide en esa copia el lado que corresponde al de '+c1+' cm?',
             en:'A triangle has sides of '+a1+' cm, '+b1+' cm and '+c1+' cm. In a scale copy, the side matching the '+a1+' cm one measures '+ac1+' cm. How much does the side matching the '+c1+' cm one measure in that copy?'});
    p1exp = L({es:'El lado de '+a1+' cm terminó en '+ac1+' cm, así que cada longitud se multiplicó por '+ac1+' ÷ '+a1+' = '+k1+'. Al lado de '+c1+' cm le toca el mismo trato: '+c1+' × '+k1+' = '+res1+' cm.',
               en:'The '+a1+' cm side ended up at '+ac1+' cm, so every length was multiplied by '+ac1+' ÷ '+a1+' = '+k1+'. The '+c1+' cm side gets the same treatment: '+c1+' × '+k1+' = '+res1+' cm.'});
    p1hint = L({es:'Empieza por la única pareja de lados de la que conoces las dos medidas: ella te dice por cuánto se multiplicó todo.',
                en:'Start with the only pair of sides where you know both measurements: it tells you what everything was multiplied by.'});
  } else {
    var b2 = pk([[3,5,6],[4,6,7],[5,7,8],[4,5,7]]);
    var m2 = pk([3,4,5,6]);
    var r0=b2[0]*m2, r1=b2[1]*m2, r2=b2[2]*m2;
    p1corr = b2[2]+' cm';
    p1opts = optN(b2[2], [b2[1], b2[2]+m2, r2/2], ' cm');
    p1title = L({es:'Del terreno al plano', en:'From the plot to the plan'});
    p1q = L({es:'Un terreno triangular mide '+r0+' m, '+r1+' m y '+r2+' m de lado. En el plano, el lado de '+r0+' m aparece dibujado con '+b2[0]+' cm. ¿Cuánto mide en el plano el lado que corresponde al de '+r2+' m?',
             en:'A triangular plot has sides of '+r0+' m, '+r1+' m and '+r2+' m. On the plan, the '+r0+' m side is drawn with '+b2[0]+' cm. How much does the side matching the '+r2+' m one measure on the plan?'});
    p1exp = L({es:'El lado de '+r0+' m ocupa '+b2[0]+' cm, así que cada centímetro del plano vale '+r0+' ÷ '+b2[0]+' = '+m2+' metros. El lado de '+r2+' m necesita entonces '+r2+' ÷ '+m2+' = '+b2[2]+' cm.',
               en:'The '+r0+' m side takes up '+b2[0]+' cm, so each centimetre of the plan is worth '+r0+' ÷ '+b2[0]+' = '+m2+' metres. The '+r2+' m side then needs '+r2+' ÷ '+m2+' = '+b2[2]+' cm.'});
    p1hint = L({es:'Averigua primero cuántos metros representa un centímetro del plano usando el único lado que aparece en las dos medidas.',
                en:'First work out how many metres one centimetre of the plan stands for, using the only side that appears in both measurements.'});
  }
  addProb({ title:p1title, q:p1q, hint:p1hint, exp:p1exp, correct:p1corr, options:p1opts, showWork:true });

  /* ── P2 ── */
  var p2v = pk([0,1]);
  var p2q, p2exp, p2corr, p2opts, p2title, p2hint;
  if (p2v===0){
    var w2 = pk([6,8,10]), h2 = w2 + pk([4,6]);
    var kk2 = pk([15,20,25])/10;
    var cw2 = w2*kk2, ch2 = h2*kk2, d2 = cw2-w2;
    p2corr = L({es:n1(cw2)+' cm de ancho y '+n1(ch2)+' cm de alto', en:n1(cw2)+' cm wide and '+n1(ch2)+' cm tall'});
    p2opts = optT(p2corr, [
      L({es:(w2+d2)+' cm de ancho y '+(h2+d2)+' cm de alto', en:(w2+d2)+' cm wide and '+(h2+d2)+' cm tall'}),
      L({es:n1(cw2)+' cm de ancho y '+n1(ch2+2)+' cm de alto', en:n1(cw2)+' cm wide and '+n1(ch2+2)+' cm tall'}),
      L({es:n1(cw2+1)+' cm de ancho y '+n1(ch2-1)+' cm de alto', en:n1(cw2+1)+' cm wide and '+n1(ch2-1)+' cm tall'})
    ]);
    p2title = L({es:'La copia bien hecha', en:'The copy done right'});
    p2q = L({es:'Un rectángulo mide '+w2+' cm de ancho y '+h2+' cm de alto. ¿Cuál de estos rectángulos es una copia a escala suya?',
             en:'A rectangle measures '+w2+' cm wide and '+h2+' cm tall. Which of these rectangles is a scale copy of it?'});
    p2exp = L({es:'En la copia correcta el ancho pasa de '+w2+' a '+n1(cw2)+' cm y el alto de '+h2+' a '+n1(ch2)+' cm; las dos medidas quedaron multiplicadas por '+n1(kk2)+'. En las demás opciones cada medida cambió por su cuenta, así que el rectángulo salió más gordo o más flaco que el original.',
               en:'In the correct copy the width goes from '+w2+' to '+n1(cw2)+' cm and the height from '+h2+' to '+n1(ch2)+' cm; both measurements were multiplied by '+n1(kk2)+'. In the other options each measurement changed on its own, so the rectangle came out fatter or thinner than the original.'});
    p2hint = L({es:'Compara los anchos entre sí y los altos entre sí, y fíjate si en las dos parejas aparece el mismo número.',
                en:'Compare the widths with each other and the heights with each other, and see whether the same number shows up in both pairs.'});
  } else {
    var t3 = pk([[4,6,8],[6,8,10],[4,6,10],[6,10,12]]);
    var g3=[t3[0]*1.5, t3[1]*1.5, t3[2]*1.5];
    p2corr = listCm(g3);
    p2opts = optT(p2corr, [
      listCm([t3[0]+2, t3[1]+2, t3[2]+2]),
      listCm([g3[0], g3[1], g3[2]+3]),
      listCm([t3[0]*2, g3[1], g3[2]])
    ]);
    p2title = L({es:'El trío que sí es copia', en:'The trio that really is a copy'});
    p2q = L({es:'Un triángulo tiene lados de '+t3[0]+' cm, '+t3[1]+' cm y '+t3[2]+' cm. ¿Cuál de estos tríos de medidas corresponde a una copia a escala suya?',
             en:'A triangle has sides of '+t3[0]+' cm, '+t3[1]+' cm and '+t3[2]+' cm. Which of these trios of measurements belongs to a scale copy of it?'});
    p2exp = L({es:'En el trío correcto los tres lados quedaron multiplicados por 1.5: '+t3[0]+' × 1.5 = '+n1(g3[0])+', '+t3[1]+' × 1.5 = '+n1(g3[1])+' y '+t3[2]+' × 1.5 = '+n1(g3[2])+'. En los otros tríos hay al menos un lado que no siguió al mismo número, y con eso la figura deja de ser copia.',
               en:'In the correct trio the three sides were multiplied by 1.5: '+t3[0]+' × 1.5 = '+n1(g3[0])+', '+t3[1]+' × 1.5 = '+n1(g3[1])+' and '+t3[2]+' × 1.5 = '+n1(g3[2])+'. In the other trios there is at least one side that did not follow the same number, and that alone stops the figure from being a copy.'});
    p2hint = L({es:'Ve lado por lado y pregunta cuántas veces cabe la medida original en la nueva: el resultado debe repetirse en los tres.',
                en:'Go side by side and ask how many times the original measurement fits into the new one: the result has to repeat in all three.'});
  }
  addProb({ title:p2title, q:p2q, hint:p2hint, exp:p2exp, correct:p2corr, options:p2opts, showWork:false });

  /* ══════════════════════════════════════════════════════════════════
     SECCIÓN 2 - Los datos que hacen falta para construir
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 2', en:'Concept 2'}),
      L({es:'Tres datos y el compás', en:'Three pieces of data and the compass'}),
    '<p>'+L({es:'Construir un triángulo no es trazar tres rayas al tanteo: hay que saber qué datos alcanzan. Con los tres lados alcanza, y el procedimiento es siempre el mismo: se dibuja uno de ellos como base, se abre el compás con la medida del segundo lado y se traza un arco desde un extremo, se abre con la del tercero y se traza otro arco desde el otro extremo, y donde los dos arcos se cruzan está el vértice que faltaba. También alcanza con dos lados y el ángulo que forman entre ellos, o con dos ángulos y el lado que va entre los dos.',
             en:'Building a triangle is not drawing three lines by guesswork: you have to know which data are enough. The three sides are enough, and the procedure is always the same: one of them is drawn as the base, the compass is opened to the second side and an arc is drawn from one end, it is opened to the third side and another arc is drawn from the other end, and where the two arcs cross sits the missing vertex. Two sides and the angle they form between them are also enough, and so are two angles and the side running between them.'})+'</p>'+
    '<p>'+L({es:'Tres ángulos, en cambio, no alcanzan. Fijan la forma pero dejan el tamaño en libertad, y por eso todos los triángulos que salen con esos tres ángulos son copias a escala unos de otros. Antes de tomar el compás conviene además revisar si los tres lados pueden juntarse: los dos más cortos, sumados, tienen que superar al más largo. Si apenas lo igualan, los arcos se tocan encima de la base y la figura se aplasta en una línea; si se quedan por debajo, los arcos ni siquiera llegan a cruzarse. Al construir a escala esta revisión se hace una sola vez, porque si el trío original cierra, el trío multiplicado por el mismo factor también cierra.',
             en:'Three angles, on the other hand, are not enough. They fix the shape but leave the size free, and that is why every triangle coming out of those three angles is a scale copy of the others. Before picking up the compass it is also worth checking whether the three sides can meet: the two shorter ones together have to beat the longest one. If they only equal it, the arcs touch on top of the base and the figure flattens into a line; if they fall below it, the arcs never even reach each other. When building to scale this check is done once only, because if the original trio closes, the trio multiplied by the same factor closes too.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Tres lados',en:'Three sides'})+'</div><div class="rform">'+L({es:'base y dos arcos',en:'base and two arcs'})+'</div><div class="rnote">'+L({es:'El cruce de los arcos da el tercer vértice.',en:'The crossing of the arcs gives the third vertex.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Dos lados',en:'Two sides'})+'</div><div class="rform">'+L({es:'con el ángulo de en medio',en:'with the angle in between'})+'</div><div class="rnote">'+L({es:'El transportador coloca el segundo lado.',en:'The protractor places the second side.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Tres ángulos',en:'Three angles'})+'</div><div class="rform">'+L({es:'forma sí, tamaño no',en:'shape yes, size no'})+'</div><div class="rnote">'+L({es:'Salen infinitas copias a escala.',en:'Infinitely many scale copies come out.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Antes de trazar',en:'Before drawing'})+'</div><div class="rform">'+L({es:'corto + corto > largo',en:'short + short > long'})+'</div><div class="rnote">'+L({es:'Si no se cumple, los arcos no se cruzan.',en:'If it fails, the arcs do not cross.'})+'</div></div>'+
    '</div>');

  /* ── W2: los arcos que se cruzan (3 rondas) ── */
  var w2R = [];
  (function(){
    var pool = shuffle([[9,5],[10,6],[11,7],[12,5],[10,4],[13,8],[12,7],[11,6]], rng);
    for (var i=0;i<3;i++){ w2R.push({ b:pool[i][0], a:pool[i][1], c:pool[i][0]-pool[i][1]+1 }); }
  })();
  widget('arcs',
    '<div class="stag">'+L({es:'Cruza los arcos',en:'Cross the arcs'})+'</div>'+
    '<h2>'+L({es:'La medida más corta que todavía cierra',en:'The shortest measurement that still closes'})+'</h2>'+
    '<p>'+L({es:'La base ya está trazada y desde su extremo izquierdo sale un arco con el segundo lado, que tampoco se mueve. El deslizador abre el compás para el tercer lado y su arco crece o se encoge contigo. Mientras los dos arcos no se toquen no hay vértice y no hay triángulo. Busca la abertura entera más pequeña con la que la figura ya cierra.',
             en:'The base is already drawn and from its left end an arc comes out with the second side, which does not move either. The slider opens the compass for the third side and its arc grows or shrinks with you. As long as the two arcs do not touch there is no vertex and no triangle. Look for the smallest whole opening with which the figure already closes.'})+'</p>'+
    '<div class="gcrd">'+
      '<div style="font-size:.85rem;color:var(--text2);margin-bottom:.7rem" id="w2goal"></div>'+
      '<div class="cvwrap"><canvas id="w2cv" style="display:block;width:100%;height:212px"></canvas></div>'+
      '<div class="cg" style="margin-top:.9rem"><label>'+L({es:'Tercer lado: ',en:'Third side: '})+'<span class="cval" id="w2cv2">2 cm</span></label>'+
        '<input type="range" id="w2c" min="1" max="20" step="1" value="2"></div>'+
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem">'+
        '<button id="w2dn" style="'+BTN2+'">'+L({es:'Menos',en:'Less'})+'</button>'+
        '<button id="w2up" style="'+BTN2+'">'+L({es:'Más',en:'More'})+'</button>'+
        '<button id="w2chk" style="'+BTN+'">'+L({es:'Comprobar',en:'Check'})+'</button>'+
      '</div>'+
      '<div class="metrics" style="margin-top:.9rem">'+
        '<div class="metric"><div class="mlbl">'+L({es:'Base',en:'Base'})+'</div><div class="mnum cs" id="w2b">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Segundo lado',en:'Second side'})+'</div><div class="mnum cs" id="w2a">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Los dos cortos suman',en:'The two short ones add up to'})+'</div><div class="mnum ts" id="w2s">-</div></div>'+
      '</div>'+
      '<div class="mcfb" id="w2fb"></div>'+
    '</div>');

  (function(){
    var round=0, tries=0, done=false, busy=false;
    var myCv = document.getElementById('w2cv');
    function R(){ return w2R[Math.min(round,2)]; }
    function G(){ var e=document.getElementById('w2c'); return e ? parseInt(e.value,10) : 2; }
    function draw(){
      var cv=document.getElementById('w2cv'); if(!cv || cv!==myCv) return;
      var st=cvSetup(cv,212), g=st.g, W=st.W, H=st.H;
      var r=R(), c=G();
      var baseY=H-38, ax=32;
      var px = Math.min((W-64)/r.b, (baseY-24)/Math.max(r.a, Math.min(c, r.a+r.b)));
      var bx = ax + r.b*px;
      var ra = r.a*px, rc = c*px;
      g.strokeStyle=cssv('--border'); g.lineWidth=1.6;
      g.beginPath(); g.arc(ax, baseY, ra, -Math.PI*0.98, -0.02); g.stroke();
      g.beginPath(); g.arc(bx, baseY, rc, -Math.PI*0.98, -0.02); g.stroke();
      g.strokeStyle=cssv('--green'); g.lineWidth=3;
      g.beginPath(); g.moveTo(ax,baseY); g.lineTo(bx,baseY); g.stroke();
      var xx = (r.b*r.b + r.a*r.a - c*c)/(2*r.b);
      var yy2 = r.a*r.a - xx*xx;
      if (yy2 > 0.0001){
        var px2 = ax + xx*px, py2 = baseY - Math.sqrt(yy2)*px;
        g.fillStyle=cssv('--green-bg');
        g.beginPath(); g.moveTo(ax,baseY); g.lineTo(bx,baseY); g.lineTo(px2,py2); g.closePath(); g.fill();
        g.strokeStyle=cssv('--green'); g.lineWidth=2.4; g.stroke();
        g.fillStyle=cssv('--gold'); g.beginPath(); g.arc(px2,py2,5,0,Math.PI*2); g.fill();
      } else {
        g.strokeStyle=cssv('--gold'); g.lineWidth=2.6;
        g.beginPath(); g.arc(ax, baseY, ra, -Math.PI*0.6, -Math.PI*0.25); g.stroke();
        g.beginPath(); g.arc(bx, baseY, rc, -Math.PI*0.75, -Math.PI*0.4); g.stroke();
      }
      g.fillStyle=cssv('--green-dark'); g.font=F(); g.textAlign='center'; g.textBaseline='top';
      g.fillText(n1(r.b)+' cm', (ax+bx)/2, baseY+6);
      g.fillStyle=cssv('--text3'); g.font='500 10px "IBM Plex Sans", sans-serif';
      g.textAlign='left';  g.fillText(n1(r.a)+' cm', ax-6, baseY-ra-16);
      g.textAlign='right'; g.fillText(n1(c)+' cm', bx+6, baseY-rc-16);
    }
    function update(){
      var r=R(), c=G(), e;
      e=document.getElementById('w2cv2'); if(e) e.textContent=n1(c)+' cm';
      e=document.getElementById('w2b');   if(e) e.textContent=n1(r.b)+' cm';
      e=document.getElementById('w2a');   if(e) e.textContent=n1(r.a)+' cm';
      e=document.getElementById('w2s');
      if(e){ var s=r.a+c; e.textContent=n1(s)+' cm'; e.style.color = (s>r.b ? 'var(--ok)' : 'var(--gold)'); }
      e=document.getElementById('w2goal');
      if(e) e.innerHTML=L({es:'Ronda '+(round+1)+' de 3: la base mide <strong>'+n1(r.b)+' cm</strong> y el segundo lado <strong>'+n1(r.a)+' cm</strong>. Encuentra el tercer lado entero más corto que ya cierra la figura.',
                           en:'Round '+(round+1)+' of 3: the base measures <strong>'+n1(r.b)+' cm</strong> and the second side <strong>'+n1(r.a)+' cm</strong>. Find the shortest whole third side that already closes the figure.'});
      draw();
    }
    function nextRound(){
      round++; busy=false;
      if (round>=3){ done=true; return; }
      tries=0;
      var sl=document.getElementById('w2c'); if(sl) sl.value='2';
      update();
    }
    function check(){
      if (done||busy) return;
      var r=R(), c=G();
      if (c===r.c){
        fbSet('w2fb', true, L({es:'🎉 Ahí está el cruce. Con '+n1(r.a)+' cm y '+n1(c)+' cm los dos lados cortos suman '+n1(r.a+c)+' cm y por fin superan a la base de '+n1(r.b)+' cm.'+(round===2?' Las tres rondas quedaron listas.':' Va la siguiente ronda.'),
                               en:'🎉 There is the crossing. With '+n1(r.a)+' cm and '+n1(c)+' cm the two short sides add up to '+n1(r.a+c)+' cm and at last beat the base of '+n1(r.b)+' cm.'+(round===2?' All three rounds are done.':' On to the next round.')}));
        busy=true; setTimeout(nextRound, 80); return;
      }
      tries++;
      if (tries>=3){
        var sl=document.getElementById('w2c'); if(sl) sl.value=String(r.c);
        update();
        fbSet('w2fb', true, L({es:'Era '+n1(r.c)+' cm. Con '+n1(r.b-r.a)+' cm los dos cortos apenas empatan con la base y los arcos se tocan sobre ella; la primera medida entera que ya la supera es '+n1(r.c)+' cm.',
                               en:'It was '+n1(r.c)+' cm. With '+n1(r.b-r.a)+' cm the two short ones only tie with the base and the arcs touch on top of it; the first whole measurement that already beats it is '+n1(r.c)+' cm.'}));
        busy=true; setTimeout(nextRound, 80); return;
      }
      if (c < r.c){
        fbSet('w2fb', false, L({es:'Con '+n1(c)+' cm los dos lados cortos suman '+n1(r.a+c)+' cm y no llegan a la base de '+n1(r.b)+' cm: los arcos se quedan separados. Alarga el tercer lado.',
                                en:'With '+n1(c)+' cm the two short sides add up to '+n1(r.a+c)+' cm and do not reach the base of '+n1(r.b)+' cm: the arcs stay apart. Lengthen the third side.'}));
      } else if (c >= r.a+r.b){
        fbSet('w2fb', false, L({es:'Con '+n1(c)+' cm el tercer lado se pasó tanto que ahora son la base y el segundo lado los que se quedan cortos, y los arcos vuelven a separarse. Acórtalo bastante.',
                                en:'With '+n1(c)+' cm the third side overshot so far that now the base and the second side are the ones falling short, and the arcs come apart again. Shorten it by a good deal.'}));
      } else {
        fbSet('w2fb', false, L({es:'Con '+n1(c)+' cm la figura sí cierra, pero todavía sobra: se busca la medida entera más corta que aún alcance a cruzar los arcos. Acórtalo.',
                                en:'With '+n1(c)+' cm the figure does close, but there is room to spare: what is wanted is the shortest whole measurement that still gets the arcs to cross. Shorten it.'}));
      }
    }
    var sl0=document.getElementById('w2c'); if(sl0) sl0.addEventListener('input', update);
    var bu=document.getElementById('w2up');
    if (bu) bu.addEventListener('click', function(){ var s=document.getElementById('w2c'); if(s){ s.value=String(Math.min(20, parseInt(s.value,10)+1)); update(); } });
    var bd=document.getElementById('w2dn');
    if (bd) bd.addEventListener('click', function(){ var s=document.getElementById('w2c'); if(s){ s.value=String(Math.max(1, parseInt(s.value,10)-1)); update(); } });
    var cb=document.getElementById('w2chk'); if(cb) cb.addEventListener('click', check);
    setTimeout(update, 90);
    window.addEventListener('resize', function(){ if(document.getElementById('w2cv')===myCv) draw(); });
  })();

  /* ── P3 ── */
  var p3a = pk([5,6,7,8]), p3b = pk([10,11,12,13]);
  var p3v = pk([0,1]);
  var p3q, p3exp, p3corr, p3opts, p3title, p3hint;
  if (p3v===0){
    var r3 = p3b-p3a+1;
    p3corr = r3+' cm';
    p3opts = optN(r3, [p3b-p3a, p3a+p3b, p3b], ' cm');
    p3title = L({es:'El tercer lado más corto', en:'The shortest third side'});
    p3q = L({es:'Se va a construir un triángulo y dos de sus lados medirán '+p3a+' cm y '+p3b+' cm. Si el tercero debe medir un número entero de centímetros, ¿cuál es la medida más corta con la que la figura todavía se puede construir?',
             en:'A triangle is going to be built and two of its sides will measure '+p3a+' cm and '+p3b+' cm. If the third one has to measure a whole number of centimetres, what is the shortest measurement with which the figure can still be built?'});
    p3exp = L({es:'Los dos lados cortos, juntos, tienen que superar al más largo. Con un tercer lado de '+(p3b-p3a)+' cm la suma sería '+(p3b-p3a)+' + '+p3a+' = '+p3b+' cm, exactamente la del lado largo, y los arcos se tocarían encima de él sin formar figura. La primera medida entera que ya lo supera es '+r3+' cm.',
               en:'The two short sides together have to beat the longest one. With a third side of '+(p3b-p3a)+' cm the sum would be '+(p3b-p3a)+' + '+p3a+' = '+p3b+' cm, exactly the long side, and the arcs would touch on top of it without forming a figure. The first whole measurement that already beats it is '+r3+' cm.'});
    p3hint = L({es:'Piensa en el momento justo en que los dos lados cortos apenas alcanzan a acostarse sobre el largo, y da un paso más allá.',
                en:'Think of the exact moment when the two short sides only just lie down along the long one, and take one step past it.'});
  } else {
    var r3b = p3a+p3b-1;
    p3corr = r3b+' cm';
    p3opts = optN(r3b, [p3a+p3b, p3b, p3b-p3a+1], ' cm');
    p3title = L({es:'El tercer lado más largo', en:'The longest third side'});
    p3q = L({es:'Se va a construir un triángulo y dos de sus lados medirán '+p3a+' cm y '+p3b+' cm. Si el tercero debe medir un número entero de centímetros, ¿cuál es la medida más larga con la que la figura todavía se puede construir?',
             en:'A triangle is going to be built and two of its sides will measure '+p3a+' cm and '+p3b+' cm. If the third one has to measure a whole number of centimetres, what is the longest measurement with which the figure can still be built?'});
    p3exp = L({es:'Ahora el tercer lado es el largo, y los otros dos son los cortos: '+p3a+' + '+p3b+' = '+(p3a+p3b)+' cm. Si el tercero midiera justo '+(p3a+p3b)+' cm, los dos se acostarían sobre él sin dejar altura. La mayor medida entera que se queda por debajo es '+r3b+' cm.',
               en:'Now the third side is the long one and the other two are the short ones: '+p3a+' + '+p3b+' = '+(p3a+p3b)+' cm. If the third measured exactly '+(p3a+p3b)+' cm, those two would lie down along it leaving no height. The largest whole measurement staying below it is '+r3b+' cm.'});
    p3hint = L({es:'Reúne los dos lados que ya tienes y pregúntate hasta dónde puede estirarse el tercero antes de que esos dos se queden sin poder levantarse.',
                en:'Put together the two sides you already have and ask how far the third can stretch before those two are left unable to rise.'});
  }
  addProb({ title:p3title, q:p3q, hint:p3hint, exp:p3exp, correct:p3corr, options:p3opts, showWork:true });

  /* ── P4 ── */
  var p4v = pk([0,1]);
  var p4q, p4exp, p4corr, p4opts, p4title, p4hint;
  if (p4v===0){
    p4corr = L({es:'Le saldrá con la forma correcta, pero de cualquier tamaño', en:'It will come out with the right shape, but at any size'});
    p4opts = optT(p4corr, [
      L({es:'Le saldrá del tamaño correcto, pero con otra forma', en:'It will come out at the right size, but with another shape'}),
      L({es:'No podrá trazar ningún triángulo con esos datos', en:'No triangle at all can be drawn with those data'}),
      L({es:'Le saldrá un triángulo con ángulos distintos a los anotados', en:'A triangle with angles different from the noted ones will come out'})
    ]);
    p4title = L({es:'Los datos del pizarrón', en:'The data from the board'});
    p4q = L({es:'Un alumno quiere copiar en su cuaderno el triángulo del pizarrón, pero solo alcanzó a anotar la medida de sus tres ángulos interiores. ¿Qué le va a pasar al dibujo?',
             en:'A student wants to copy the triangle from the board into a notebook, but only managed to note down the measures of its three interior angles. What is going to happen to the drawing?'});
    p4exp = L({es:'Con los tres ángulos anotados el alumno puede trazar los lados en la inclinación correcta, pero nada le dice dónde cortarlos: cada largo que elija da un triángulo distinto en tamaño. Todos esos triángulos son copias a escala unos de otros, así que la forma es la del pizarrón aunque el tamaño no lo sea.',
               en:'With the three angles noted the student can draw the sides at the right slant, but nothing says where to cut them: every length chosen gives a triangle of a different size. All those triangles are scale copies of one another, so the shape is the one on the board even if the size is not.'});
    p4hint = L({es:'Pregúntate qué dato del pizarrón se perdió al anotar solo aberturas y ninguna longitud.',
                en:'Ask yourself which piece of information from the board was lost by noting down only openings and no lengths.'});
  } else {
    var bad4 = pk([[3,5,9],[4,6,11],[5,6,12],[2,7,10]]);
    p4corr = L({es:'Los dos arcos no llegan a cruzarse y la figura no cierra', en:'The two arcs never cross and the figure does not close'});
    p4opts = optT(p4corr, [
      L({es:'Sale un triángulo muy alargado, pero válido', en:'A very stretched triangle comes out, but a valid one'}),
      L({es:'Sale un triángulo con un ángulo recto', en:'A triangle with a right angle comes out'}),
      L({es:'Salen dos triángulos distintos con esas medidas', en:'Two different triangles come out with those measurements'})
    ]);
    p4title = L({es:'El trío que no funciona', en:'The trio that does not work'});
    p4q = L({es:'Un alumno traza una base de '+bad4[2]+' cm y abre el compás para los otros dos lados, que según sus datos miden '+bad4[0]+' cm y '+bad4[1]+' cm. ¿Qué ocurre al intentar levantar el triángulo?',
             en:'A student draws a base of '+bad4[2]+' cm and opens the compass for the other two sides, which according to the data measure '+bad4[0]+' cm and '+bad4[1]+' cm. What happens when trying to raise the triangle?'});
    p4exp = L({es:'Los dos lados cortos juntos dan '+bad4[0]+' + '+bad4[1]+' = '+(bad4[0]+bad4[1])+' cm, y la base mide '+bad4[2]+' cm, así que se quedan cortos. Cada arco alcanza hasta donde le da su medida y entre los dos queda un hueco: no hay punto de cruce y por lo tanto no hay tercer vértice.',
               en:'The two short sides together give '+bad4[0]+' + '+bad4[1]+' = '+(bad4[0]+bad4[1])+' cm, and the base measures '+bad4[2]+' cm, so they fall short. Each arc reaches as far as its own measurement allows and a gap is left between them: there is no crossing point and therefore no third vertex.'});
    p4hint = L({es:'Antes de imaginar el dibujo, junta las dos medidas menores y compáralas con la base.',
                en:'Before picturing the drawing, add the two smaller measurements together and compare them with the base.'});
  }
  addProb({ title:p4title, q:p4q, hint:p4hint, exp:p4exp, correct:p4corr, options:p4opts, showWork:false });

  /* ══════════════════════════════════════════════════════════════════
     SECCIÓN 3 - Polígonos regulares desde el centro
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 3', en:'Concept 3'}),
      L({es:'Repartir la vuelta para construir', en:'Sharing out the turn in order to build'}),
    '<p>'+L({es:'Un polígono regular se construye desde su centro. Se traza una circunferencia, se marca un punto de arranque y se reparte la vuelta completa en tantas partes iguales como lados vaya a tener la figura. Cada una de esas partes es un ángulo central, y al unir cada marca con la siguiente los lados salen iguales sin necesidad de medirlos uno por uno. Con seis marcas cada ángulo central se lleva sesenta grados; con ocho marcas se lleva cuarenta y cinco. Entre más vértices se repartan la vuelta, menos le toca a cada uno.',
             en:'A regular polygon is built from its centre. A circle is drawn, a starting point is marked and the full turn is shared out into as many equal parts as the figure will have sides. Each of those parts is a central angle, and joining every mark to the next one makes the sides come out equal with no need to measure them one by one. With six marks each central angle takes sixty degrees; with eight marks it takes forty five. The more vertices share the turn, the less each one gets.'})+'</p>'+
    '<p>'+L({es:'Para construir la misma figura a escala solo se cambia el radio de la circunferencia. Un radio mayor da un polígono mayor, con lados más largos, pero con exactamente los mismos ángulos: el central no depende del tamaño sino de en cuántas partes se cortó la vuelta. Junto al ángulo central viaja el ángulo interior, que es lo que le falta al central para completar el ángulo llano, y también se queda igual al cambiar de tamaño.',
             en:'To build the same figure to scale, only the radius of the circle changes. A bigger radius gives a bigger polygon, with longer sides, but with exactly the same angles: the central one does not depend on the size but on how many parts the turn was cut into. Travelling with the central angle is the interior angle, which is what the central one needs to complete the straight angle, and it stays the same when the size changes too.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Ángulo central',en:'Central angle'})+'</div><div class="rform">360° ÷ '+L({es:'lados',en:'sides'})+'</div><div class="rnote">'+L({es:'La vuelta completa repartida entre los vértices.',en:'The full turn shared among the vertices.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Ángulo interior',en:'Interior angle'})+'</div><div class="rform">180° − '+L({es:'central',en:'central'})+'</div><div class="rnote">'+L({es:'Lo que le falta al central para el ángulo llano.',en:'What the central one lacks to reach the straight angle.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Para agrandar',en:'To enlarge'})+'</div><div class="rform">'+L({es:'radio mayor',en:'bigger radius'})+'</div><div class="rnote">'+L({es:'Los lados crecen todos por igual.',en:'The sides all grow alike.'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Los ángulos',en:'The angles'})+'</div><div class="rform">'+L({es:'no dependen del radio',en:'do not depend on the radius'})+'</div><div class="rnote">'+L({es:'Dependen de cuántos vértices hay.',en:'They depend on how many vertices there are.'})+'</div></div>'+
    '</div>');

  /* ── W3: constructor de polígono regular (3 rondas) ── */
  var NL = [3,4,5,6,8,9,10,12];
  var w3R = shuffle([90,72,60,45,40,36,30], rng).slice(0,3);
  widget('regular',
    '<div class="stag">'+L({es:'Reparte la vuelta',en:'Share out the turn'})+'</div>'+
    '<h2>'+L({es:'Construye el polígono que se pide',en:'Build the polygon being asked for'})+'</h2>'+
    '<p>'+L({es:'El deslizador cambia cuántos vértices se reparten la circunferencia. La cuña dorada es el ángulo central que le toca a cada uno, y se abre o se cierra al instante según cuántos vértices haya. Ajusta el reparto hasta que la cuña mida justo lo que se pide.',
             en:'The slider changes how many vertices share the circle. The golden wedge is the central angle each one gets, and it opens or closes at once depending on how many vertices there are. Adjust the sharing until the wedge measures exactly what is asked for.'})+'</p>'+
    '<div class="gcrd">'+
      '<div style="font-size:.85rem;color:var(--text2);margin-bottom:.7rem" id="w3goal"></div>'+
      '<div class="cvwrap"><canvas id="w3cv" style="display:block;width:100%;height:236px"></canvas></div>'+
      '<div class="cg" style="margin-top:.9rem"><label>'+L({es:'Vértices repartidos: ',en:'Vertices sharing the turn: '})+'<span class="cval" id="w3nv">5</span></label>'+
        '<input type="range" id="w3n" min="0" max="7" step="1" value="2"></div>'+
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem">'+
        '<button id="w3dn" style="'+BTN2+'">'+L({es:'Menos',en:'Fewer'})+'</button>'+
        '<button id="w3up" style="'+BTN2+'">'+L({es:'Más',en:'More'})+'</button>'+
        '<button id="w3chk" style="'+BTN+'">'+L({es:'Comprobar',en:'Check'})+'</button>'+
      '</div>'+
      '<div class="metrics" style="margin-top:.9rem">'+
        '<div class="metric"><div class="mlbl">'+L({es:'Lados',en:'Sides'})+'</div><div class="mnum cs" id="w3a">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Ángulo central',en:'Central angle'})+'</div><div class="mnum ps" id="w3b">-</div></div>'+
        '<div class="metric"><div class="mlbl">'+L({es:'Ángulo interior',en:'Interior angle'})+'</div><div class="mnum ts" id="w3c">-</div></div>'+
      '</div>'+
      '<div class="mcfb" id="w3fb"></div>'+
    '</div>');

  (function(){
    var round=0, tries=0, done=false, busy=false;
    var myCv = document.getElementById('w3cv');
    function T(){ return w3R[Math.min(round,2)]; }
    function G(){ var e=document.getElementById('w3n'); return NL[e ? parseInt(e.value,10) : 2]; }
    function draw(){
      var cv=document.getElementById('w3cv'); if(!cv || cv!==myCv) return;
      var st=cvSetup(cv,236), g=st.g, W=st.W, H=st.H;
      var n=G(), cx=W/2, cy=H/2+4, R0=Math.min(W,H)/2-38;
      var i, ang, x, y;
      g.strokeStyle=cssv('--border'); g.lineWidth=1.4; g.setLineDash([4,4]);
      g.beginPath(); g.arc(cx,cy,R0,0,Math.PI*2); g.stroke(); g.setLineDash([]);
      g.fillStyle=cssv('--gold-bg');
      g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,R0*0.42,-Math.PI/2,-Math.PI/2+2*Math.PI/n); g.closePath(); g.fill();
      g.strokeStyle=cssv('--gold'); g.lineWidth=2; g.stroke();
      g.fillStyle=cssv('--green-bg'); g.beginPath();
      for (i=0;i<n;i++){
        ang = -Math.PI/2 + i*2*Math.PI/n;
        x = cx + R0*Math.cos(ang); y = cy + R0*Math.sin(ang);
        if (i===0) g.moveTo(x,y); else g.lineTo(x,y);
      }
      g.closePath(); g.fill();
      g.strokeStyle=cssv('--green'); g.lineWidth=2.4; g.stroke();
      g.strokeStyle=cssv('--green-dark'); g.lineWidth=1.1;
      for (i=0;i<n;i++){
        ang = -Math.PI/2 + i*2*Math.PI/n;
        g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+R0*Math.cos(ang), cy+R0*Math.sin(ang)); g.stroke();
      }
      for (i=0;i<n;i++){
        ang = -Math.PI/2 + i*2*Math.PI/n;
        g.fillStyle=cssv('--gold');
        g.beginPath(); g.arc(cx+R0*Math.cos(ang), cy+R0*Math.sin(ang), 3.4, 0, Math.PI*2); g.fill();
      }
      var mid = -Math.PI/2 + Math.PI/n;
      g.fillStyle=cssv('--gold'); g.font='700 12px "IBM Plex Sans", sans-serif';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(dg(n1(360/n)), cx + R0*0.6*Math.cos(mid), cy + R0*0.6*Math.sin(mid));
      g.fillStyle=cssv('--text3'); g.font='500 10px "IBM Plex Sans", sans-serif';
      g.textAlign='center'; g.textBaseline='top';
      g.fillText(L({es:'centro',en:'centre'}), cx, cy+6);
    }
    function update(){
      var n=G(), e;
      e=document.getElementById('w3nv'); if(e) e.textContent=String(n);
      e=document.getElementById('w3a');  if(e) e.textContent=String(n);
      e=document.getElementById('w3b');
      if(e){ e.textContent=dg(n1(360/n)); e.style.color = (360/n===T() ? 'var(--ok)' : 'var(--gold)'); }
      e=document.getElementById('w3c');  if(e) e.textContent=dg(n1(180-360/n));
      e=document.getElementById('w3goal');
      if(e) e.innerHTML=L({es:'Ronda '+(round+1)+' de 3: construye el polígono regular cuyo ángulo central mide <strong>'+dg(T())+'</strong>.',
                           en:'Round '+(round+1)+' of 3: build the regular polygon whose central angle measures <strong>'+dg(T())+'</strong>.'});
      draw();
    }
    function nextRound(){
      round++; busy=false;
      if (round>=3){ done=true; return; }
      tries=0;
      var sl=document.getElementById('w3n'); if(sl) sl.value='2';
      update();
    }
    function check(){
      if (done||busy) return;
      var n=G(), c=360/n, tg=T();
      if (c===tg){
        fbSet('w3fb', true, L({es:'🎉 Exacto. Con '+n+' vértices la vuelta se parte en '+n+' ángulos centrales de '+dg(tg)+' y cada lado sale igual a los demás.'+(round===2?' Las tres rondas quedaron listas.':' Va la siguiente ronda.'),
                               en:'🎉 Exactly. With '+n+' vertices the turn splits into '+n+' central angles of '+dg(tg)+' and every side comes out equal to the rest.'+(round===2?' All three rounds are done.':' On to the next round.')}));
        busy=true; setTimeout(nextRound, 80); return;
      }
      tries++;
      if (tries>=3){
        var idx = NL.indexOf(Math.round(360/tg));
        var sl=document.getElementById('w3n'); if(sl && idx>=0) sl.value=String(idx);
        update();
        fbSet('w3fb', true, L({es:'Eran '+Math.round(360/tg)+' vértices: la vuelta completa de 360° repartida en partes de '+dg(tg)+' cabe '+360+' ÷ '+tg+' = '+Math.round(360/tg)+' veces.',
                               en:'It was '+Math.round(360/tg)+' vertices: the full turn of 360° shared into parts of '+dg(tg)+' fits '+360+' ÷ '+tg+' = '+Math.round(360/tg)+' times.'}));
        busy=true; setTimeout(nextRound, 80); return;
      }
      fbSet('w3fb', false, (c>tg)
        ? L({es:'Tu cuña mide '+dg(n1(c))+', más abierta que los '+dg(tg)+' pedidos: con pocos vértices a cada uno le toca demasiado. Reparte la vuelta entre más.',
             en:'Your wedge measures '+dg(n1(c))+', wider than the '+dg(tg)+' asked for: with few vertices each one gets too much. Share the turn among more.'})
        : L({es:'Tu cuña mide '+dg(n1(c))+', más cerrada que los '+dg(tg)+' pedidos: con tantos vértices a cada uno le toca muy poco. Reparte la vuelta entre menos.',
             en:'Your wedge measures '+dg(n1(c))+', tighter than the '+dg(tg)+' asked for: with so many vertices each one gets very little. Share the turn among fewer.'}));
    }
    var sl0=document.getElementById('w3n'); if(sl0) sl0.addEventListener('input', update);
    var bu=document.getElementById('w3up');
    if (bu) bu.addEventListener('click', function(){ var s=document.getElementById('w3n'); if(s){ s.value=String(Math.min(7, parseInt(s.value,10)+1)); update(); } });
    var bd=document.getElementById('w3dn');
    if (bd) bd.addEventListener('click', function(){ var s=document.getElementById('w3n'); if(s){ s.value=String(Math.max(0, parseInt(s.value,10)-1)); update(); } });
    var cb=document.getElementById('w3chk'); if(cb) cb.addEventListener('click', check);
    setTimeout(update, 90);
    window.addEventListener('resize', function(){ if(document.getElementById('w3cv')===myCv) draw(); });
  })();

  /* ── P5 ── */
  var PG = [[4,90],[5,72],[6,60],[8,45],[9,40],[10,36],[12,30]];
  var g5 = pk(PG);
  var p5v = pk([0,1]);
  var p5q, p5exp, p5corr, p5opts, p5title, p5hint;
  if (p5v===0){
    p5corr = g5[0]+L({es:' lados',en:' sides'});
    p5opts = optN(g5[0], [g5[0]+2, g5[0]-1, Math.round(180/g5[1])], L({es:' lados',en:' sides'}));
    p5title = L({es:'Cuántos vértices caben', en:'How many vertices fit'});
    p5q = L({es:'Para construir un polígono regular se reparte la vuelta completa de la circunferencia en ángulos centrales iguales de '+dg(g5[1])+'. ¿Cuántos lados va a tener la figura terminada?',
             en:'To build a regular polygon the full turn of the circle is shared out into equal central angles of '+dg(g5[1])+'. How many sides will the finished figure have?'});
    p5exp = L({es:'Cada vértice se lleva un ángulo central de '+dg(g5[1])+' y entre todos completan la vuelta: 360 ÷ '+g5[1]+' = '+g5[0]+'. La figura tendrá '+g5[0]+' vértices y, por lo tanto, '+g5[0]+' lados iguales.',
               en:'Each vertex takes a central angle of '+dg(g5[1])+' and together they complete the turn: 360 ÷ '+g5[1]+' = '+g5[0]+'. The figure will have '+g5[0]+' vertices and therefore '+g5[0]+' equal sides.'});
    p5hint = L({es:'Piensa cuántas veces cabe esa abertura dentro de una vuelta completa.',
                en:'Think about how many times that opening fits inside one full turn.'});
  } else {
    p5corr = dg(g5[1]);
    p5opts = optN(g5[1], [180-g5[1], g5[1]*2, Math.round(g5[1]/2)], '°');
    p5title = L({es:'La cuña de cada vértice', en:'The wedge of each vertex'});
    p5q = L({es:'Se quiere construir un polígono regular de '+g5[0]+' lados marcando sus vértices sobre una circunferencia. ¿Cuánto debe medir el ángulo central que separa dos marcas seguidas?',
             en:'A regular polygon with '+g5[0]+' sides is to be built by marking its vertices on a circle. How much does the central angle separating two consecutive marks have to measure?'});
    p5exp = L({es:'Los '+g5[0]+' vértices se reparten la vuelta completa en partes iguales: 360 ÷ '+g5[0]+' = '+dg(g5[1])+' para cada uno.',
               en:'The '+g5[0]+' vertices share the full turn in equal parts: 360 ÷ '+g5[0]+' = '+dg(g5[1])+' for each one.'});
    p5hint = L({es:'La vuelta completa se reparte por igual entre todas las marcas, así que fíjate en cuántas marcas hay.',
                en:'The full turn is shared equally among all the marks, so look at how many marks there are.'});
  }
  addProb({ title:p5title, q:p5q, hint:p5hint, exp:p5exp, correct:p5corr, options:p5opts, showWork:true });

  /* ── P6 ── */
  var g6 = pk([[4,90],[5,72],[6,60],[10,36],[12,30]]);
  var g6b = pk([[4,90],[5,72],[10,36],[12,30]]);
  var p6v = pk([0,1]);
  var p6q, p6exp, p6corr, p6opts, p6title, p6hint;
  if (p6v===0){
    var f6 = pk([2,3,4]);
    p6corr = dg(g6[1]);
    p6opts = optN(g6[1], [Math.round(g6[1]/f6), g6[1]*f6, 180-g6[1], Math.round(g6[1]*1.5), g6[1]*2], '°');
    p6title = L({es:'La cuña de la ampliación', en:'The wedge of the enlargement'});
    p6q = L({es:'Un polígono regular de '+g6[0]+' lados se vuelve a construir con un radio '+f6+' veces mayor, así que cada lado del nuevo dibujo queda '+f6+' veces más largo. ¿Cuánto mide el ángulo central del nuevo dibujo?',
             en:'A regular polygon with '+g6[0]+' sides is built again with a radius '+f6+' times bigger, so every side of the new drawing comes out '+f6+' times longer. How much does the central angle of the new drawing measure?'});
    p6exp = L({es:'El nuevo dibujo sigue teniendo '+g6[0]+' vértices repartiéndose la misma vuelta completa, y eso es lo único que decide el ángulo central: 360 ÷ '+g6[0]+' = '+dg(g6[1])+'. El radio más grande alarga los lados, pero no abre ni cierra las cuñas.',
               en:'The new drawing still has '+g6[0]+' vertices sharing the same full turn, and that is the only thing deciding the central angle: 360 ÷ '+g6[0]+' = '+dg(g6[1])+'. The bigger radius lengthens the sides, but it neither opens nor closes the wedges.'});
    p6hint = L({es:'Pregúntate si al agrandar la circunferencia cambia el número de partes en que quedó cortada la vuelta.',
                en:'Ask yourself whether enlarging the circle changes the number of parts the turn was cut into.'});
  } else {
    p6corr = L({es:'Sigue midiendo '+dg(g6b[1]), en:'It still measures '+dg(g6b[1])});
    p6opts = optT(p6corr, [
      L({es:'Se reduce a la mitad, '+dg(g6b[1]/2), en:'It halves, down to '+dg(g6b[1]/2)}),
      L({es:'Se duplica, hasta '+dg(g6b[1]*2),    en:'It doubles, up to '+dg(g6b[1]*2)}),
      L({es:'Pasa a medir '+dg(180-g6b[1]),       en:'It becomes '+dg(180-g6b[1])})
    ]);
    p6title = L({es:'La copia reducida', en:'The reduced copy'});
    p6q = L({es:'Un polígono regular de '+g6b[0]+' lados se vuelve a dibujar a escala, con todos sus lados de la mitad de largo. ¿Qué ocurre con su ángulo central?',
             en:'A regular polygon with '+g6b[0]+' sides is drawn again to scale, with all its sides half as long. What happens to its central angle?'});
    p6exp = L({es:'Reducir los lados a la mitad encoge la circunferencia, pero la vuelta completa sigue partida entre los mismos '+g6b[0]+' vértices: 360 ÷ '+g6b[0]+' = '+dg(g6b[1])+'. El ángulo central no mide longitudes, mide reparto.',
               en:'Halving the sides shrinks the circle, but the full turn is still split among the same '+g6b[0]+' vertices: 360 ÷ '+g6b[0]+' = '+dg(g6b[1])+'. The central angle does not measure lengths, it measures sharing.'});
    p6hint = L({es:'Fíjate en qué dato de la figura cambió al reducirla y en cuál se quedó exactamente igual.',
                en:'Look at which piece of the figure changed when it was reduced and which one stayed exactly the same.'});
  }
  addProb({ title:p6title, q:p6q, hint:p6hint, exp:p6exp, correct:p6corr, options:p6opts, showWork:false });

  /* ══════════════════════════════════════════════════════════════════
     SECCIÓN 4 - Cuadriláteros e irregulares: la diagonal como andamio
     ══════════════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 4', en:'Concept 4'}),
      L({es:'La diagonal sostiene la copia', en:'The diagonal holds the copy up'}),
    '<p>'+L({es:'Cuatro lados no bastan para fijar un cuadrilátero. Si se arma con varillas y tornillos, la figura se dobla como una puerta sin que ninguno de sus lados cambie de medida, y por eso dos cuadriláteros con los mismos cuatro lados pueden verse muy distintos. La pieza que le falta es la diagonal: al trazarla, el cuadrilátero queda partido en dos triángulos, y un triángulo con sus tres lados conocidos ya no se mueve.',
             en:'Four sides are not enough to fix a quadrilateral. If it is put together with rods and screws, the figure swings like a door without any of its sides changing measurement, and that is why two quadrilaterals with the same four sides can look very different. The missing piece is the diagonal: once it is drawn, the quadrilateral is split into two triangles, and a triangle with its three sides known no longer moves.'})+'</p>'+
    '<p>'+L({es:'De ahí sale el modo de copiar a escala un cuadrilátero: se multiplica por el factor cada lado y también la diagonal, y se levantan los dos triángulos uno tras otro con la misma técnica de los arcos. Con un polígono irregular de más lados el procedimiento es el mismo, repetido: desde un solo vértice salen las diagonales que lo parten en triángulos, se multiplican todas las medidas por el factor y se van armando los triángulos en orden. Las diagonales obedecen al factor igual que los lados, porque también son segmentos de la figura.',
             en:'From there comes the way to copy a quadrilateral to scale: every side is multiplied by the factor and so is the diagonal, and the two triangles are raised one after the other with the same arc technique. With an irregular polygon of more sides the procedure is the same, repeated: from a single vertex come the diagonals splitting it into triangles, all the measurements are multiplied by the factor and the triangles are assembled in order. Diagonals obey the factor just like the sides, because they are segments of the figure too.'})+'</p>'+

                                  en:'It pays to assemble the triangles in the order in which they share the diagonal: the first one leaves ready the line the second leans on, and that way the drawing does not go crooked at the end.'})+'</p></div>');

  var sd10 = pk([2,3,4]), m10 = pk([3,4,5]);
  var p10v = pk([0,1]);
  var p10q, p10exp, p10corr, p10opts, p10title, p10hint;
  if (p10v===0){
    var perD = g10[0]*sd10, perR = perD*m10;
    p10corr = perR+' m';
    p10opts = optN(perR, [perD, g10[0]*m10, g10[0]*(sd10+m10), sd10*m10*2, perD+m10], ' m');
    p10title = L({es:'Del plano al terreno completo', en:'From the plan to the whole plot'});
    p10q = L({es:'En un plano aparece un terreno con forma de polígono regular: cada lado del dibujo mide '+sd10+' cm y su ángulo central mide '+dg(g10[1])+'. Cada centímetro del plano representa '+m10+' metros. ¿Cuánto mide el contorno completo del terreno real?',
              en:'On a plan there is a plot shaped like a regular polygon: each side of the drawing measures '+sd10+' cm and its central angle measures '+dg(g10[1])+'. Each centimetre of the plan stands for '+m10+' metres. How long is the complete outline of the real plot?'});
    p10exp = L({es:'La vuelta completa se repartió en 360 ÷ '+g10[1]+' = '+g10[0]+' partes, así que la figura tiene '+g10[0]+' lados iguales y en el dibujo su contorno mide '+g10[0]+' × '+sd10+' = '+perD+' cm. Cada centímetro vale '+m10+' metros, de modo que el contorno real es '+perD+' × '+m10+' = '+perR+' metros.',
                en:'The full turn was shared into 360 ÷ '+g10[1]+' = '+g10[0]+' parts, so the figure has '+g10[0]+' equal sides and in the drawing its outline measures '+g10[0]+' × '+sd10+' = '+perD+' cm. Each centimetre is worth '+m10+' metres, so the real outline is '+perD+' × '+m10+' = '+perR+' metres.'});
    p10hint = L({es:'El ángulo central te dice cuántos lados hay; con eso arma el contorno del dibujo y hasta el final pásalo al terreno.',
                 en:'The central angle tells you how many sides there are; with that build the outline of the drawing and only at the end take it to the plot.'});
  } else {
    var perR2 = g10[0]*sd10*m10, ladoR2 = sd10*m10;
    p10corr = sd10+' cm';
    p10opts = optN(sd10, [ladoR2, g10[0], sd10*2, sd10+m10, ladoR2+m10], ' cm');
    p10title = L({es:'El lado que hay que trazar', en:'The side to be drawn'});
    p10q = L({es:'Un terreno con forma de polígono regular tiene un contorno de '+perR2+' m y su ángulo central mide '+dg(g10[1])+'. Se va a dibujar usando un centímetro por cada '+m10+' metros. ¿Cuánto debe medir cada lado del dibujo?',
              en:'A plot shaped like a regular polygon has an outline of '+perR2+' m and its central angle measures '+dg(g10[1])+'. It is going to be drawn using one centimetre for every '+m10+' metres. How much does each side of the drawing have to measure?'});
    p10exp = L({es:'El ángulo central indica cuántas partes tiene la vuelta: 360 ÷ '+g10[1]+' = '+g10[0]+' lados iguales. Cada lado real mide entonces '+perR2+' ÷ '+g10[0]+' = '+ladoR2+' metros, y en el papel ocupa '+ladoR2+' ÷ '+m10+' = '+sd10+' cm.',
                en:'The central angle shows how many parts the turn has: 360 ÷ '+g10[1]+' = '+g10[0]+' equal sides. Each real side then measures '+perR2+' ÷ '+g10[0]+' = '+ladoR2+' metres, and on paper it takes up '+ladoR2+' ÷ '+m10+' = '+sd10+' cm.'});
    p10hint = L({es:'Cuenta primero cuántos lados iguales se reparten el contorno y deja la reducción al papel para el último paso.',
                 en:'First count how many equal sides share the outline and leave the reduction to paper for the last step.'});
  }
  addProb({ title:p10title, q:p10q, hint:p10hint, exp:p10exp, correct:p10corr, options:p10opts, showWork:true });
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyjbSUYDHwe-0Hl5GnZC6mP3_iKPYnLqeUgbuhxARkW2-keCAAV6sSg0wYWJnJBhY7lUQ/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
