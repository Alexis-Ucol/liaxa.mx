<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formación, Estructura y Aprovechamiento de Compuestos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Formación, Estructura y Aprovechamiento de Compuestos</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Formación, Estructura y Aprovechamiento de Compuestos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c84', primaryDark:'#111d43', primaryBg:'#e8ebf5',
  accent:'#e42424', accentBg:'#fbdfdf',
  darkPrimary:'#4e69bb', darkPrimaryDark:'#7d95dd', darkPrimaryBg:'#0f1936',

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}

    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'qui3_t08_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'qui3_t08_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'qui3_t08_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });

  var total   = problems.length;

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();

  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

    { s:'Ne', es:'neón',      en:'neon',       g:18, v:8, q:0,  k:'ng' },
    { s:'Ar', es:'argón',     en:'argon',      g:18, v:8, q:0,  k:'ng' }
  ];
  var GROUPS = [1, 2, 13, 14, 15, 16, 17, 18];
  var MIS = shuffle(['q2p', 'q1m', 'q3m', 'share', 'noble'], rng).slice(0, 3);

  }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Tablero de la tabla periódica', en:'Periodic table board' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca cualquier elemento para verlo por dentro: sus electrones de valencia, cuántos le sobran o le faltan y el ion que resulta. Puedes cambiar de elemento las veces que quieras antes de comprobar.',
      en:'Tap any element to see it from inside: its valence electrons, how many it has left over or is missing and the ion that results. You can change elements as many times as you like before checking.'
    }) + '</div>' +
    '<div class="pt-grid" data-r="grid"></div>' +
    '<div class="pt-view" data-r="view"></div>' +
    '<div class="gw-read" data-r="info"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elG = host.querySelector('[data-r="grid"]'),
      elV = host.querySelector('[data-r="view"]'),
      elI = host.querySelector('[data-r="info"]'),
      elB = host.querySelector('[data-r="go"]'),
      elF = host.querySelector('[data-r="fb"]');

  function say(cls, msg){ elF.className = 'gw-fb' + (cls ? ' ' + cls : ''); elF.innerHTML = msg; }

  function view(){
    if (st.sel < 0){
      elV.innerHTML = '<div class="pt-empty">' + L({ es:'Ningún elemento elegido todavía.', en:'No element chosen yet.' }) + '</div>';
      elI.innerHTML = '';
      return;
    }
    var e = EL[st.sel];
    var mueve = e.q > 0
      ? L({ es:'cede ' + e.v + ' electrón(es)', en:'gives up ' + e.v + ' electron(s)' })
      : (e.q < 0
        ? L({ es:'gana ' + Math.abs(e.q) + ' electrón(es)', en:'gains ' + Math.abs(e.q) + ' electron(s)' })
        : (e.k === 'ng'
          ? L({ es:'no gana ni cede', en:'neither gains nor gives up' })
          : L({ es:'comparte 4 electrones', en:'shares 4 electrons' })));
    var res = e.q !== 0
      ? '<div class="pt-atom ' + (e.q > 0 ? 'pos' : 'neg') + '">' + ionLbl(e.s, e.q) + '<small>' + L({ es:'ion', en:'ion' }) + '</small></div>'
      : '<div class="pt-atom">' + e.s + '<small>' + (e.k === 'ng' ? L({ es:'estable', en:'stable' }) : L({ es:'comparte', en:'shares' })) + '</small></div>';
    elV.innerHTML =
      '<div class="pt-atom">' + e.s + '<small>' + e.v + ' e-</small></div>' +
      '<div class="pt-arrow">' + mueve + '<br>' + (e.q !== 0 ? '&#8594;' : '&#183;&#183;&#183;') + '</div>' +
      res;
    elI.innerHTML =
      '<span class="gw-pill">' + L(e) + '</span>' +
      '<span class="gw-pill">' + L({ es:'grupo', en:'group' }) + ': <b>' + e.g + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'electrones de valencia', en:'valence electrons' }) + ': <b>' + e.v + '</b></span>' +
      '<span class="gw-pill">' + (e.k === 'me'
        ? L({ es:'metal', en:'metal' })
        : (e.k === 'ng' ? L({ es:'capa completa', en:'complete shell' }) : L({ es:'no metal', en:'nonmetal' }))) + '</span>';
  }

  function render(){
    elQ.textContent = st.done
      ? L({ es:'Tablero resuelto: encontraste los tres elementos.', en:'Board solved: you found the three elements.' })
      : (st.r + 1) + ' / 3 · ' + misText(MIS[st.r]);
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.disabled = st.done;
    var h = '';
    GROUPS.forEach(function(g){
      var col = '<div class="pt-col"><div class="pt-g">' + g + '</div>';
      EL.forEach(function(e, i){
        if (e.g !== g) return;
        col += '<button class="pt-el ' + e.k + (st.sel === i ? ' sel' : '') + '" data-i="' + i + '"' + (st.done ? ' disabled' : '') + '>' + e.s + '</button>';
      });
      h += col + '</div>';
    });
    elG.innerHTML = h;
    elG.querySelectorAll('.pt-el').forEach(function(b){
      b.addEventListener('click', function(){
        if (st.done) return;
        var i = parseInt(b.getAttribute('data-i'), 10);
        st.sel = (st.sel === i ? -1 : i);
        render();
        view();
      });
    });
    view();
  }

  function reveal(){
    var idx = -1;
    for (var i = 0; i < EL.length; i++){ if (hits(MIS[st.r], EL[i])){ idx = i; break; } }
    st.sel = idx;
    render();
    var e = EL[idx];
    say('warm', L({ es:'Aquí está uno: el ', en:'Here is one: ' }) + L(e) + L({ es:'. Está en el grupo ', en:'. It sits in group ' }) + e.g +
      L({ es:', así que su capa externa tiene ', en:', so its outer shell has ' }) + e.v +
      L({ es:' electrones y eso decide lo que hace.', en:' electrons and that decides what it does.' }));
    st.tries = 0;
    setTimeout(function(){
      st.r++;
      if (st.r >= 3){ st.done = true; render(); say('good', L({ es:'Tablero cerrado. Ya puedes leer la columna y anticipar el ion.', en:'Board closed. You can now read the column and anticipate the ion.' })); }
      else { st.sel = -1; render(); say('', L({ es:'Siguiente encargo.', en:'Next assignment.' })); }
    }, 2200);
  }

  elB.addEventListener('click', function(){
    if (st.done) return;
    if (st.sel < 0){ say('warm', L({ es:'Elige primero un elemento del tablero.', en:'Pick an element from the board first.' })); return; }
    var e = EL[st.sel], m = MIS[st.r];
    if (hits(m, e)){
      st.tries = 0;
      st.r++;
      if (st.r >= 3){ st.done = true; render(); say('good', '&#127881; ' + L({ es:'¡Los tres encargos resueltos! La columna anuncia el ion antes de cualquier reacción.', en:'All three assignments solved! The column announces the ion before any reaction.' })); return; }
      st.sel = -1;
      render();
      say('good', '&#10003; ' + L({ es:'Correcto. Siguiente encargo.', en:'Correct. Next assignment.' }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){ reveal(); return; }
    var tgt = -1;
    for (var i = 0; i < EL.length; i++){ if (hits(m, EL[i])){ tgt = EL[i].g; break; } }
    var dir = tgt > e.g
      ? L({ es:'Muévete hacia la derecha de la tabla: necesitas una columna con más electrones de valencia.', en:'Move to the right of the table: you need a column with more valence electrons.' })
      : L({ es:'Muévete hacia la izquierda de la tabla: necesitas una columna con menos electrones de valencia.', en:'Move to the left of the table: you need a column with fewer valence electrons.' });
    say('miss', L({ es:'El ', en:'The ' }) + L(e) + L({ es:' está en el grupo ', en:' is in group ' }) + e.g +
      L({ es:' y no cumple el encargo. ', en:' and does not meet the assignment. ' }) + (tgt === e.g ? L({ es:'Estás en la columna correcta: revisa el elemento que elegiste dentro de ella.', en:'You are in the right column: check which element you picked inside it.' }) : dir));
  });

  render();
  say('', L({ es:'Empieza tocando el elemento que se te ocurra.', en:'Start by tapping whichever element comes to mind.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: caja de cristal
   El estudiante mete y saca iones de una caja; la balanza de carga y la
   formula se actualizan en cada toque. Gana cuando la caja queda neutra con
   la menor cantidad posible de iones. Tres rondas con parejas distintas.
   ══════════════════════════════════════════════════════════════════════════ */
function wCaja(rng, host){
  var PAIRS = [
    { c:{ s:'Na', d:'Na', q:1,  es:'sodio',    en:'sodium'    }, a:{ d:'O',                       q:-2, es:'óxido',    en:'oxide'     } },
    { c:{ s:'Mg', d:'Mg', q:2,  es:'magnesio', en:'magnesium' }, a:{ d:'Cl',                      q:-1, es:'cloruro',  en:'chloride'  } },
    { c:{ s:'Al', d:'Al', q:3,  es:'aluminio', en:'aluminium' }, a:{ d:'O',                       q:-2, es:'óxido',    en:'oxide'     } },
    { c:{ s:'Ca', d:'Ca', q:2,  es:'calcio',   en:'calcium'   }, a:{ d:'NO<sub>3</sub>', p:true,  q:-1, es:'nitrato',  en:'nitrate'   } },
    { c:{ s:'K',  d:'K',  q:1,  es:'potasio',  en:'potassium' }, a:{ d:'SO<sub>4</sub>', p:true,  q:-2, es:'sulfato',  en:'sulfate'   } },
    { c:{ s:'Ca', d:'Ca', q:2,  es:'calcio',   en:'calcium'   }, a:{ d:'PO<sub>4</sub>', p:true,  q:-3, es:'fosfato',  en:'phosphate' } }
  ];
  var ROUNDS = shuffle(PAIRS, rng).slice(0, 3);
  var st = { r:0, nc:0, na:0, tries:0, done:false };

  function target(p){
    var g = gcd2(p.c.q, Math.abs(p.a.q));
    return { nc: Math.abs(p.a.q) / g, na: p.c.q / g };
  }
  function formula(p, nc, na){
    if (nc === 0 && na === 0) return L({ es:'caja vacía', en:'empty box' });
    var left = nc > 0 ? sub(p.c.d, nc) : '';
    var right = na > 0 ? (p.a.p ? grpF(p.a.d, na) : sub(p.a.d, na)) : '';
    return left + right;
  }

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Caja de cristal', en:'Crystal box' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Mete y saca iones con los botones. La balanza y la fórmula cambian a cada toque, y puedes vaciar la caja cuando quieras.',
      en:'Put ions in and take them out with the buttons. The balance and the formula change with every tap, and you can empty the box whenever you like.'
    }) + '</div>' +
    '<div class="cx-box" data-r="box"></div>' +
    '<div class="cx-scale"><div class="cx-fill" data-r="fill"></div><div class="cx-mid"></div></div>' +
    '<div class="gw-read" data-r="info"></div>' +
    '<div class="cx-ctrl"><span class="cx-name" data-r="cn"></span><button class="gw-btn" data-r="cm">-</button><span class="cx-cnt" data-r="cc">0</span><button class="gw-btn" data-r="cp">+</button></div>' +
    '<div class="cx-ctrl"><span class="cx-name" data-r="an"></span><button class="gw-btn" data-r="am">-</button><span class="cx-cnt" data-r="ac">0</span><button class="gw-btn" data-r="ap">+</button></div>' +
    '<div class="cx-form" data-r="form"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button><button class="gw-btn" data-r="clr"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var q = host.querySelector('[data-r="q"]'), box = host.querySelector('[data-r="box"]'),
      fill = host.querySelector('[data-r="fill"]'), info = host.querySelector('[data-r="info"]'),
      cn = host.querySelector('[data-r="cn"]'), an = host.querySelector('[data-r="an"]'),
      cc = host.querySelector('[data-r="cc"]'), ac = host.querySelector('[data-r="ac"]'),
      form = host.querySelector('[data-r="form"]'), go = host.querySelector('[data-r="go"]'),
      clr = host.querySelector('[data-r="clr"]'), fb = host.querySelector('[data-r="fb"]');

  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }

  function render(){
    var p = ROUNDS[st.r];
    q.innerHTML = st.done
      ? L({ es:'Caja cerrada: las tres unidades quedaron neutras.', en:'Box closed: the three units came out neutral.' })
      : (st.r + 1) + ' / 3 · ' + L({ es:'Arma la unidad neutra más pequeña con iones ', en:'Build the smallest neutral unit with ' }) +
        ionLbl(p.c.d, p.c.q) + L({ es:' y ', en:' and ' }) + p.a.d + '<sup>' + (Math.abs(p.a.q) > 1 ? Math.abs(p.a.q) : '') + '-</sup>' +
        L({ es:'.', en:' ions.' });
    var cells = '';
    var total = st.nc + st.na, i;
    if (total === 0){
      cells = '<div class="cx-empty">' + L({ es:'La caja está vacía.', en:'The box is empty.' }) + '</div>';
    } else {
      var pos = st.nc, neg = st.na;
      while (pos > 0 || neg > 0){
        if (pos > 0){ cells += '<div class="cx-ion pos">' + p.c.d + '</div>'; pos--; }
        if (neg > 0){ cells += '<div class="cx-ion neg">' + p.a.d + '</div>'; neg--; }
      }
    }
    box.innerHTML = cells;
    var carga = st.nc * p.c.q + st.na * p.a.q;
    var w = Math.min(Math.abs(carga), 6) / 6 * 50;
    fill.className = 'cx-fill ' + (carga >= 0 ? 'pos' : 'neg');
    fill.style.left = carga >= 0 ? '50%' : (50 - w) + '%';
    fill.style.width = w + '%';
    info.innerHTML =
      '<span class="gw-pill">' + L({ es:'carga positiva', en:'positive charge' }) + ': <b>' + (st.nc * p.c.q) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'carga negativa', en:'negative charge' }) + ': <b>' + (st.na * p.a.q) + '</b></span>' +
      '<span class="gw-pill">' + L({ es:'total', en:'total' }) + ': <b>' + (carga > 0 ? '+' + carga : carga) + '</b></span>';
    cn.innerHTML = L(p.c) + ' ' + ionLbl(p.c.d, p.c.q);
    an.innerHTML = L(p.a);
    cc.textContent = st.nc;
    ac.textContent = st.na;
    form.innerHTML = formula(p, st.nc, st.na);
    go.textContent = L({ es:'Comprobar', en:'Check' });
    clr.textContent = L({ es:'Vaciar', en:'Empty' });
    go.disabled = st.done;
    clr.disabled = st.done;
  }

  function step(which, d){
    if (st.done) return;
    if (which === 'c') st.nc = Math.max(0, Math.min(9, st.nc + d));
    else st.na = Math.max(0, Math.min(9, st.na + d));
    render();
  }
  host.querySelector('[data-r="cp"]').addEventListener('click', function(){ step('c', 1); });
  host.querySelector('[data-r="cm"]').addEventListener('click', function(){ step('c', -1); });
  host.querySelector('[data-r="ap"]').addEventListener('click', function(){ step('a', 1); });
  host.querySelector('[data-r="am"]').addEventListener('click', function(){ step('a', -1); });
  clr.addEventListener('click', function(){ if (st.done) return; st.nc = 0; st.na = 0; render(); say('', L({ es:'Caja vacía otra vez.', en:'Box empty again.' })); });

  function next(){
    st.tries = 0;
    st.r++;
    if (st.r >= 3){ st.done = true; render(); say('good', '&#127881; ' + L({ es:'¡Tres unidades armadas! La fórmula no es un capricho: sale de las cargas.', en:'Three units built! The formula is no whim: it comes out of the charges.' })); return; }
    st.nc = 0; st.na = 0;
    render();
    say('', L({ es:'Nueva pareja de iones en la caja.', en:'New pair of ions in the box.' }));
  }

  go.addEventListener('click', function(){
    if (st.done) return;
    var p = ROUNDS[st.r], tg = target(p);
    var carga = st.nc * p.c.q + st.na * p.a.q;
    if (st.nc === 0 || st.na === 0){
      st.tries++;
      say('warm', L({ es:'Todavía falta uno de los dos tipos de ion: sin los dos no hay compuesto.', en:'One of the two kinds of ion is still missing: without both there is no compound.' }));
      if (st.tries >= 3) reveal();
      return;
    }
    if (carga === 0 && gcd2(st.nc, st.na) === 1){
      say('good', '&#10003; ' + L({ es:'Neutra y en la proporción más pequeña: ', en:'Neutral and at the smallest ratio: ' }) + formula(p, st.nc, st.na));
      setTimeout(next, 1400);
      return;
    }
    st.tries++;
    if (st.tries >= 3){ reveal(); return; }
    if (carga > 0) say('miss', L({ es:'La caja quedó con carga +', en:'The box came out with charge +' }) + carga + L({ es:'. Agrega iones negativos o quita positivos.', en:'. Add negative ions or take out positive ones.' }));
    else if (carga < 0) say('miss', L({ es:'La caja quedó con carga ', en:'The box came out with charge ' }) + carga + L({ es:'. Agrega iones positivos o quita negativos.', en:'. Add positive ions or take out negative ones.' }));
    else say('miss', L({ es:'Está neutra, pero te sobran iones: la misma proporción cabe en una caja más pequeña.', en:'It is neutral, but you have ions to spare: the same ratio fits in a smaller box.' }));
  });

  function reveal(){
    var p = ROUNDS[st.r], tg = target(p);
    st.nc = tg.nc; st.na = tg.na;
    render();
    say('warm', L({ es:'Así queda: ', en:'This is how it looks: ' }) + formula(p, tg.nc, tg.na) +
      L({ es:'. Con ', en:'. With ' }) + tg.nc + L({ es:' ion(es) positivos y ', en:' positive ion(s) and ' }) + tg.na +
      L({ es:' negativos las cargas se cancelan exactamente.', en:' negative ones the charges cancel exactly.' }));
    setTimeout(next, 2400);
  }

  render();
  say('', L({ es:'Empieza metiendo un ion de cada tipo y observa la balanza.', en:'Start by putting in one ion of each kind and watch the balance.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: horno de estructura
   Dos muestras dentro del horno: una red ionica y un solido molecular. El
   estudiante mueve la temperatura y ve en vivo cual se desarma y cual aguanta.
   Encargo: colocar la temperatura en la ventana donde solo una se derritio.
   ══════════════════════════════════════════════════════════════════════════ */
function wHorno(rng, host){
  var SETS = [
    { m:{ es:'parafina de vela', en:'candle paraffin',  t:60  }, i:{ es:'cloruro de sodio',    en:'sodium chloride',    t:801 } },
    { m:{ es:'azúcar de mesa',   en:'table sugar',      t:186 }, i:{ es:'cloruro de potasio',  en:'potassium chloride', t:770 } },
    { m:{ es:'yodo sólido',      en:'solid iodine',     t:114 }, i:{ es:'cloruro de calcio',   en:'calcium chloride',   t:772 } },
    { m:{ es:'naftaleno',        en:'naphthalene',      t:80  }, i:{ es:'fluoruro de sodio',   en:'sodium fluoride',    t:993 } }
  ];
  var ROUNDS = shuffle(SETS, rng).slice(0, 3);
  var st = { r:0, T:20, tries:0, done:false };

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Horno de estructura', en:'Structure furnace' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Mueve la temperatura del horno y observa las dos muestras al mismo tiempo. Puedes subir y bajar cuantas veces quieras antes de comprobar.',
      en:'Move the furnace temperature and watch both samples at the same time. You can go up and down as many times as you like before checking.'
    }) + '</div>' +
    '<div class="hz-temp" data-r="temp"></div>' +
    '<input class="hz-slider" type="range" min="0" max="1000" step="10" value="20" data-r="sl">' +
    '<div class="hz-lab">' +
      '<div class="hz-box"><div class="hz-name" data-r="mn"></div><div class="hz-grid" data-r="mg"></div><div class="hz-state" data-r="ms"></div></div>' +
      '<div class="hz-box"><div class="hz-name" data-r="in"></div><div class="hz-grid" data-r="ig"></div><div class="hz-state" data-r="is"></div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var q = host.querySelector('[data-r="q"]'), tempEl = host.querySelector('[data-r="temp"]'),
      sl = host.querySelector('[data-r="sl"]'), mn = host.querySelector('[data-r="mn"]'),
      mg = host.querySelector('[data-r="mg"]'), ms = host.querySelector('[data-r="ms"]'),
      inm = host.querySelector('[data-r="in"]'), ig = host.querySelector('[data-r="ig"]'),
      is = host.querySelector('[data-r="is"]'), go = host.querySelector('[data-r="go"]'),
      fb = host.querySelector('[data-r="fb"]');

  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }

  function render(){
    var p = ROUNDS[st.r];
    q.innerHTML = st.done
      ? L({ es:'Horno apagado: encontraste la ventana en las tres muestras.', en:'Furnace off: you found the window in all three samples.' })
      : (st.r + 1) + ' / 3 · ' + L({
          es:'Coloca la temperatura donde el sólido molecular ya se derritió y la red iónica sigue entera.',
          en:'Set the temperature where the molecular solid has already melted and the ionic lattice is still whole.'
        });
    tempEl.textContent = st.T + ' °C';
    sl.value = st.T;
    sl.disabled = st.done;
    go.textContent = L({ es:'Comprobar', en:'Check' });
    go.disabled = st.done;
    mn.textContent = L(p.m);
    inm.textContent = L(p.i);
    var molMelt = st.T >= p.m.t, ionMelt = st.T >= p.i.t;
    var cells = '', i;
    for (i = 0; i < 12; i++) cells += '<div class="hz-p mol"></div>';
    mg.innerHTML = cells;
    mg.className = 'hz-grid' + (molMelt ? ' melt' : '');
    cells = '';
    for (i = 0; i < 16; i++) cells += '<div class="hz-p ' + ((i + Math.floor(i / 4)) % 2 === 0 ? 'pos' : 'neg') + '"></div>';
    ig.innerHTML = cells;
    ig.className = 'hz-grid' + (ionMelt ? ' melt' : '');
    ms.textContent = (molMelt ? L({ es:'líquido', en:'liquid' }) : L({ es:'sólido', en:'solid' })) + ' · ' + p.m.t + ' °C';
    is.textContent = (ionMelt ? L({ es:'líquido', en:'liquid' }) : L({ es:'sólido', en:'solid' })) + ' · ' + p.i.t + ' °C';
  }

  sl.addEventListener('input', function(){
    if (st.done) return;
    st.T = parseInt(sl.value, 10);
    render();
    var p = ROUNDS[st.r];
    if (st.T < p.m.t) say('', L({ es:'Las dos muestras siguen enteras.', en:'Both samples are still whole.' }));
    else if (st.T < p.i.t) say('', L({ es:'Las moléculas ya se soltaron unas de otras; la red de iones no se ha movido.', en:'The molecules have already come loose from each other; the lattice of ions has not moved.' }));
    else say('', L({ es:'A esta temperatura hasta la red de iones se desarmó.', en:'At this temperature even the lattice of ions came apart.' }));
  });

  function next(){
    st.tries = 0;
    st.r++;
    if (st.r >= 3){ st.done = true; render(); say('good', '&#127881; ' + L({ es:'¡Horno dominado! La temperatura de fusión delata qué tan fuerte está sujeta cada partícula.', en:'Furnace mastered! The melting temperature gives away how tightly each particle is held.' })); return; }
    st.T = 20;
    render();

function ionOpts(e){
  var q = e.q, aq = Math.abs(q);
  var o1 = ionLbl(e.s, q);
  var o2 = ionLbl(e.s, -q);
  var o3 = q > 0 ? ionLbl(e.s, -(8 - e.v)) : ionLbl(e.s, e.v);
  var o4 = ionLbl(e.s, (aq === 1 ? 2 : aq - 1) * (q > 0 ? 1 : -1));
  return [o1, o2, o3, o4];
}

              : 'Le faltan ' + Math.abs(e.q) + ' para completar la capa, así que los toma y queda con carga ' + Math.abs(e.q) + '-, o sea ' + ionLbl(e.s, e.q) + '.'),

var POLY = [
  { c:{ d:'Ca', q:2, es:'calcio',   en:'calcium'   }, a:{ d:'NO<sub>3</sub>', q:-1, es:'nitrato',   en:'nitrate'   } },
  { c:{ d:'K',  q:1, es:'potasio',  en:'potassium' }, a:{ d:'PO<sub>4</sub>', q:-3, es:'fosfato',   en:'phosphate' } },
  { c:{ d:'Al', q:3, es:'aluminio', en:'aluminium' }, a:{ d:'SO<sub>4</sub>', q:-2, es:'sulfato',   en:'sulfate'   } },
  { c:{ d:'Mg', q:2, es:'magnesio', en:'magnesium' }, a:{ d:'OH',             q:-1, es:'hidróxido', en:'hydroxide' } },
  { c:{ d:'Na', q:1, es:'sodio',    en:'sodium'    }, a:{ d:'CO<sub>3</sub>', q:-2, es:'carbonato', en:'carbonate' } }
];

function mkP3(rng){
  var p = vpick(rng, POLY);
  var g = gcd2(p.c.q, Math.abs(p.a.q));
  var nc = Math.abs(p.a.q) / g, na = p.c.q / g;
  var good = sub(p.c.d, nc) + grpF(p.a.d, na);
  var swap = sub(p.c.d, na) + grpF(p.a.d, nc);
  var uno  = p.c.d + p.a.d;
  var dob  = sub(p.c.d, nc * 2) + grpF(p.a.d, na * 2);
  var anionLbl = p.a.d + '<sup>' + (Math.abs(p.a.q) > 1 ? Math.abs(p.a.q) : '') + '-</sup>';
  var v = Math.floor(rng() * 2);

      ci:0,
      hint:{ es:'Cada encargo pide algo distinto: uno necesita cargas que se muevan y el otro necesita pasar sin meter cargas nuevas.',
             en:'Each job asks for something different: one needs charges that move and the other needs to pass without bringing in new charges.' },
      exp:{ es:'La bebida repone la señal eléctrica, y para eso hacen falta iones móviles: compuestos iónicos que se disuelvan. El medicamento debe cruzar la membrana sin alterar las cargas, y eso lo hace bien una partícula neutra, es decir un compuesto molecular.',
            en:'The drink replaces the electrical signal, and for that mobile ions are needed: ionic compounds that dissolve. The medicine has to cross the membrane without disturbing the charges, and a neutral particle does that well, that is a molecular compound.' },
      showWork:false
    };
  }
  return {
    title:{ es:'Dos usos, dos estructuras', en:'Two uses, two structures' },
    q:{ es:'En una fábrica se necesita un material para un molde que trabaja al rojo vivo y, en la misma planta, un líquido que se evapore rápido para secar piezas. ¿Qué combinación es la adecuada?',
        en:'A factory needs a material for a mould that works red hot and, in the same plant, a liquid that evaporates fast to dry parts. Which combination is the right one?' },
    opts:{
      es:[
        'Un compuesto iónico para el molde y uno molecular para el líquido.',
        'Un compuesto molecular para el molde y uno iónico para el líquido.',
        'Compuestos iónicos para los dos, porque resisten mejor cualquier condición.',
        'Compuestos moleculares para los dos, porque son más fáciles de conseguir.'
      ],
      en:[
        'An ionic compound for the mould and a molecular one for the liquid.',
        'A molecular compound for the mould and an ionic one for the liquid.',
        'Ionic compounds for both, because they stand any condition better.',
        'Molecular compounds for both, because they are easier to obtain.'
      ]
    },
    ci:0,
    hint:{ es:'Un molde al rojo vivo pide partículas sujetas con mucha fuerza; un líquido que se evapore rápido pide justo lo contrario.',
           en:'A red hot mould asks for particles held very tightly; a liquid that evaporates fast asks for exactly the opposite.' },
    exp:{ es:'El molde necesita aguantar temperaturas altísimas, y eso lo da una red iónica que cuesta muchísimo desarmar. El líquido debe pasar a vapor con poco calor, y eso ocurre cuando solo hay fuerzas flojas entre moléculas, es decir en un compuesto molecular.',
          en:'The mould has to stand very high temperatures, and an ionic lattice that is very costly to take apart gives exactly that. The liquid must turn to vapour with little heat, and that happens when there are only loose forces between molecules, that is in a molecular compound.' },
    showWork:false
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   ARMADO DE LA LECCION - concepto, manipulativo, problema, sin lotes.
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Todo lo que tocas salió de la misma decisión', en:'Everything you touch came out of the same decision' }),
    '<p>' + L({
      es:'El hueso que sostiene tu brazo, la sal del salero, el gas que enciende la estufa y el plástico de tu mochila son compuestos. Ninguno existía como tal: todos se formaron cuando átomos distintos se encontraron y decidieron qué hacer con los electrones de su capa externa. Esa decisión, tomada en una escala imposible de ver, es la que explica por qué el hueso aguanta tu peso, por qué la sal se disuelve y transmite señales en tu sangre, y por qué el gas arde y desaparece.',
      en:'The bone that holds up your arm, the salt in the shaker, the gas that lights the stove and the plastic of your backpack are compounds. None of them existed as such: they all formed when different atoms met and decided what to do with the electrons of their outer shell. That decision, taken at a scale impossible to see, is what explains why bone carries your weight, why salt dissolves and carries signals in your blood, and why gas burns and disappears.'
    }) + '</p>' +
    '<p>' + L({
      es:'Lo interesante es que la decisión no es al azar y ni siquiera hay que hacer el experimento para anticiparla: la posición del elemento en la tabla periódica la delata. En esta guía vas a leer la tabla como quien lee una predicción, armarás fórmulas metiendo iones en una caja hasta que la carga quede en cero, meterás dos muestras al horno para ver cuál se rinde primero y decidirás, caso por caso, qué propiedad se aprovecha en el cuerpo humano y en la industria.',
      en:'The interesting part is that the decision is not random and you do not even need to run the experiment to anticipate it: the position of the element in the periodic table gives it away. In this guide you will read the table like someone reading a prediction, you will build formulas by putting ions into a box until the charge comes out zero, you will place two samples in a furnace to see which gives in first and you will decide, case by case, which property is used in the human body and in industry.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a poder anticipar', en:'What you will be able to anticipate' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'electrones de valencia', en:'valence electrons' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'carga del ion', en:'ion charge' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'transferir o compartir', en:'transfer or share' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'fórmula unitaria', en:'unit formula' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'iones poliatómicos', en:'polyatomic ions' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'red o molécula', en:'lattice or molecule' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'temperatura de fusión', en:'melting temperature' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'usos en el cuerpo', en:'uses in the body' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'La columna de la tabla anuncia el ion antes de que exista', en:'The column of the table announces the ion before it exists' }),
    '<p>' + L({
      es:'Los electrones que participan en la formación de un compuesto son solo los de la capa más externa, llamados electrones de valencia, y en los grupos principales el número del grupo los delata: el grupo 1 tiene uno, el grupo 2 tiene dos, el grupo 13 tiene tres, y del 14 al 17 se cuenta restando diez al número del grupo. Un átomo es estable cuando esa capa queda completa con ocho electrones, o con dos en los átomos más pequeños, y va a llegar ahí por el camino más corto que tenga disponible.',
      en:'The electrons taking part in the formation of a compound are only those of the outermost shell, called valence electrons, and in the main groups the group number gives them away: group 1 has one, group 2 has two, group 13 has three, and from 14 to 17 you count by subtracting ten from the group number. An atom is stable when that shell is complete with eight electrons, or with two in the smallest atoms, and it will get there by the shortest route available to it.'
    }) + '</p>' +
    '<p>' + L({
      es:'Para un metal de la izquierda el camino corto es soltar sus uno, dos o tres electrones externos: al quedarse sin ellos conserva más protones que electrones y se convierte en un ion positivo cuya carga es exactamente el número de electrones que soltó. Para un no metal de la derecha el camino corto es el contrario, tomar los pocos que le faltan y quedar con carga negativa. Si se encuentran uno de cada zona, los electrones pasan completos de un átomo al otro y nacen dos iones de carga opuesta que se atraen: eso es la formación de un compuesto iónico. Si en cambio se encuentran dos no metales, ninguno consigue arrancarle nada al otro y terminan compartiendo pares de electrones, sin que nadie quede cargado: eso es un compuesto molecular. Los del grupo 18 no hacen ninguna de las dos cosas, porque su capa ya está completa.',
      en:'For a metal on the left the short route is to let go of its one, two or three outer electrons: once they are gone it keeps more protons than electrons and becomes a positive ion whose charge is exactly the number of electrons it released. For a nonmetal on the right the route is the opposite, taking the few it is missing and being left with a negative charge. If one from each zone meets, the electrons pass whole from one atom to the other and two ions of opposite charge are born and attract each other: that is the formation of an ionic compound. If instead two nonmetals meet, neither manages to pull anything off the other and they end up sharing pairs of electrons, with nobody left charged: that is a molecular compound. Those of group 18 do neither, because their shell is already complete.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Grupos 1, 2 y 13', en:'Groups 1, 2 and 13' }), L({ es:'ceden 1, 2 o 3', en:'give up 1, 2 or 3' }), L({ es:'quedan iones positivos', en:'positive ions are left' })) +
      rcard(L({ es:'Grupos 15, 16 y 17', en:'Groups 15, 16 and 17' }), L({ es:'ganan 3, 2 o 1', en:'gain 3, 2 or 1' }), L({ es:'quedan iones negativos', en:'negative ions are left' })) +
      rcard(L({ es:'Grupo 14', en:'Group 14' }), L({ es:'comparte 4', en:'shares 4' }), L({ es:'ni cede ni gana, comparte pares', en:'neither gives nor gains, it shares pairs' })) +
      rcard(L({ es:'Grupo 18', en:'Group 18' }), L({ es:'capa completa', en:'complete shell' }), L({ es:'no necesita formar compuestos', en:'it needs no compounds' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'esta lectura directa funciona en los grupos principales, los de los extremos de la tabla. Los metales del bloque central, como el hierro o el cobre, pueden formar más de un ion distinto, y en esos casos la carga se indica aparte porque la columna ya no basta.',
      en:'this direct reading works in the main groups, those at the edges of the table. The metals of the central block, such as iron or copper, can form more than one different ion, and in those cases the charge is stated separately because the column is no longer enough.'
    }) + '</p></div>'
  );
  wTabla(rng, widgetHost(s1, 'wTabla', 'tabla'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'De los iones a la fórmula: la cuenta que debe quedar en cero', en:'From ions to formula: the tally that must come out zero' }),
    '<p>' + L({
      es:'Una vez que sabes qué ion forma cada elemento, la fórmula del compuesto deja de ser algo que se memoriza. La materia que tocas es neutra, así que dentro del compuesto la suma de todas las cargas positivas tiene que cancelar exactamente a la suma de todas las negativas. Esa única condición decide cuántos iones de cada tipo entran: si un ion aporta tres cargas positivas y el otro dos negativas, hacen falta dos del primero y tres del segundo para que la cuenta cierre. Después se comprueba que la proporción no se pueda reducir, porque la fórmula siempre expresa la relación más pequeña posible.',
      en:'Once you know which ion each element forms, the formula of the compound stops being something to memorize. The matter you touch is neutral, so inside the compound the sum of all the positive charges has to cancel the sum of all the negative ones exactly. That single condition decides how many ions of each kind go in: if one ion brings three positive charges and the other two negative ones, two of the first and three of the second are needed for the tally to close. Then you check that the ratio cannot be reduced, because the formula always states the smallest possible relation.'
    }) + '</p>' +
    '<p>' + L({
      es:'Hay iones que no son un solo átomo sino un grupo de átomos fuertemente unidos que se mueve como una sola pieza y lleva su carga en conjunto: el nitrato, el sulfato, el carbonato, el fosfato, el hidróxido. Cuando uno de estos bloques entra más de una vez en la fórmula se escribe entre paréntesis con el número afuera, para que quede claro que se repite el grupo completo y no solo su último átomo. Conviene además distinguir dos cosas que se ven parecidas: en un compuesto iónico la fórmula es una fórmula unitaria, la proporción de iones dentro de una red, mientras que en un compuesto molecular la fórmula cuenta los átomos que hay dentro de una partícula real y separable.',
      en:'There are ions that are not a single atom but a group of strongly joined atoms moving as one piece and carrying its charge as a whole: nitrate, sulfate, carbonate, phosphate, hydroxide. When one of these blocks goes into the formula more than once it is written in parentheses with the number outside, to make clear that the whole group repeats and not just its last atom. It is also worth telling apart two things that look alike: in an ionic compound the formula is a unit formula, the ratio of ions inside a lattice, while in a molecular compound the formula counts the atoms inside a real, separable particle.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Condición única', en:'Single condition' }), L({ es:'carga total cero', en:'total charge zero' }), L({ es:'lo positivo cancela a lo negativo', en:'positive cancels negative' })) +
      rcard(L({ es:'Proporción', en:'Ratio' }), L({ es:'la más pequeña', en:'the smallest one' }), L({ es:'si se puede reducir, se reduce', en:'if it can be reduced, it is' })) +
      rcard(L({ es:'Ion poliatómico', en:'Polyatomic ion' }), L({ es:'bloque con carga', en:'block with a charge' }), L({ es:'entra completo y va en paréntesis', en:'it enters whole and goes in parentheses' })) +
      rcard(L({ es:'Unitaria o molecular', en:'Unit or molecular' }), L({ es:'proporción o conteo', en:'ratio or count' }), L({ es:'red continua contra partícula real', en:'continuous lattice against real particle' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Escribir la fórmula de un compuesto iónico con los números duplicados no es un error de cálculo sino de significado: esa fórmula ya no describe una proporción, y la proporción es justo lo único que la red tiene para decir.',
      en:'Writing the formula of an ionic compound with doubled numbers is not a calculation mistake but a mistake of meaning: that formula no longer describes a ratio, and the ratio is precisely the only thing the lattice has to say.'
    }) + '</p></div>'
  );
  wCaja(rng, widgetHost(s2, 'wCaja', 'caja'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Dos arquitecturas: una red sin fin y unas partículas contables', en:'Two architectures: an endless lattice and some countable particles' }),
    '<p>' + L({
      es:'La forma en que se unieron los átomos deja una huella en la estructura del material, y esa estructura se puede ver en su comportamiento. En un compuesto iónico no existen parejas sueltas: cada ion positivo queda rodeado por varios negativos y cada negativo por varios positivos, en un arreglo que se repite en las tres direcciones hasta el borde del grano. No hay ninguna partícula que puedas separar y que siga siendo el compuesto, porque el compuesto es la red entera.',
      en:'The way the atoms joined leaves a trace in the structure of the material, and that structure can be seen in its behaviour. In an ionic compound there are no loose pairs: each positive ion is surrounded by several negative ones and each negative one by several positives, in an arrangement repeating in three directions out to the edge of the grain. There is no particle you can separate that is still the compound, because the compound is the whole lattice.'
    }) + '</p>' +
    '<p>' + L({
      es:'En un compuesto molecular ocurre justo lo contrario: la unidad real existe, tiene un número definido de átomos fuertemente unidos entre sí y se puede contar. Lo que es débil no está dentro de la molécula, sino entre una molécula y la siguiente. De ahí sale la consecuencia más útil: al calentar un sólido molecular basta con despegar unas partículas de otras, cosa que ocurre a temperaturas bajas y sin romper nada por dentro, mientras que fundir un sólido iónico exige desarmar la red completa de cargas que se atraen, y eso suele pedir cientos de grados más. La misma diferencia explica que el cristal iónico sea duro pero frágil, porque al deslizarse una capa las cargas iguales quedan enfrentadas y el cristal se parte con caras planas.',
      en:'In a molecular compound exactly the opposite happens: the real unit exists, has a definite number of strongly joined atoms and can be counted. What is weak is not inside the molecule but between one molecule and the next. From there comes the most useful consequence: heating a molecular solid only means unsticking some particles from others, which happens at low temperatures and without breaking anything inside, while melting an ionic solid demands taking apart the whole lattice of attracting charges, and that usually asks for hundreds of degrees more. The same difference explains why the ionic crystal is hard but brittle, because when a layer slides the like charges end up facing each other and the crystal splits along flat faces.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Sólido iónico', en:'Ionic solid' }), L({ es:'red continua', en:'continuous lattice' }), L({ es:'cargas alternadas, sin partículas sueltas', en:'alternating charges, no loose particles' })) +
      rcard(L({ es:'Sólido molecular', en:'Molecular solid' }), L({ es:'partículas contables', en:'countable particles' }), L({ es:'moléculas apiladas una junto a otra', en:'molecules stacked side by side' })) +
      rcard(L({ es:'Al calentar', en:'On heating' }), L({ es:'qué se rompe', en:'what breaks' }), L({ es:'lo de entre moléculas, nunca lo de adentro', en:'what is between molecules, never what is inside' })) +
      rcard(L({ es:'Al golpear', en:'On striking' }), L({ es:'frágil o blando', en:'brittle or soft' }), L({ es:'caras planas contra deformación', en:'flat faces against deformation' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Cuando el hielo se derrite no se rompe ninguna molécula de agua: el líquido y hasta el vapor siguen estando hechos de las mismas moléculas, solo que cada vez más sueltas unas de otras.',
      en:'When ice melts no water molecule is broken: the liquid and even the vapour are still made of the same molecules, only ever more loose from one another.'
    }) + '</p></div>'
  );
  wHorno(rng, widgetHost(s3, 'wHorno', 'horno'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Aprovechamiento: la propiedad decide el uso, dentro y fuera del cuerpo', en:'Uses: the property decides the job, inside and outside the body' }),
    '<p>' + L({
      es:'Tu cuerpo trabaja con los dos tipos al mismo tiempo y les asigna tareas opuestas. Los iones sodio, potasio, calcio y cloruro viajan disueltos en la sangre y dentro de las células, y como llevan carga y pueden atravesar las membranas, su movimiento es lo que produce el impulso nervioso y la contracción de un músculo; por eso una persona deshidratada mejora con una disolución que aporte esas sales. El fosfato de calcio, en cambio, se aprovecha por lo contrario: forma una red iónica rígida y muy poco soluble que endurece el hueso y el esmalte de los dientes. Los compuestos moleculares hacen el otro trabajo: agua, glucosa, urea, grasas y vitaminas circulan como partículas neutras completas, entran y salen de las células y se transforman sin liberar cargas por el camino.',
      en:'Your body works with both types at the same time and gives them opposite tasks. Sodium, potassium, calcium and chloride ions travel dissolved in the blood and inside the cells, and since they carry charge and can cross the membranes, their movement is what produces the nerve impulse and the contraction of a muscle; that is why a dehydrated person improves with a solution providing those salts. Calcium phosphate, on the other hand, is used for the opposite reason: it forms a rigid, barely soluble ionic lattice that hardens bone and tooth enamel. Molecular compounds do the other job: water, glucose, urea, fats and vitamins circulate as complete neutral particles, go in and out of the cells and are transformed without releasing charges along the way.'
    }) + '</p>' +
    '<p>' + L({
      es:'Fuera del cuerpo el reparto se repite con la misma lógica. Las cerámicas y los recubrimientos que forran un horno se hacen con óxidos iónicos porque su red aguanta miles de grados; los disolventes que limpian equipo electrónico son moleculares porque no dejan residuos con carga que puedan conducir corriente donde no debe; la sal que se esparce sobre el hielo funciona precisamente porque al disolverse se separa en iones; y las baterías necesitan una sustancia que aporte iones móviles para cerrar el circuito por dentro. Ninguno de los dos tipos es mejor: cada aplicación elige el que le sirve, y la elección siempre se justifica con una propiedad, no con el nombre del compuesto.',
      en:'Outside the body the split repeats with the same logic. The ceramics and linings covering a furnace are made of ionic oxides because their lattice stands thousands of degrees; the solvents that clean electronic equipment are molecular because they leave no charged residue able to carry current where it should not; the salt spread over ice works precisely because on dissolving it splits into ions; and batteries need a substance providing mobile ions to close the circuit from inside. Neither type is better: each application picks the one that suits it, and the choice is always justified by a property, not by the name of the compound.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Señales del cuerpo', en:'Body signals' }), L({ es:'iones móviles', en:'mobile ions' }), L({ es:'impulso nervioso y contracción', en:'nerve impulse and contraction' })) +
      rcard(L({ es:'Estructura del cuerpo', en:'Body structure' }), L({ es:'red poco soluble', en:'barely soluble lattice' }), L({ es:'hueso y esmalte dental', en:'bone and tooth enamel' })) +
      rcard(L({ es:'Transporte y energía', en:'Transport and energy' }), L({ es:'moléculas neutras', en:'neutral molecules' }), L({ es:'agua, glucosa, urea, vitaminas', en:'water, glucose, urea, vitamins' })) +
      rcard(L({ es:'Fuera del cuerpo', en:'Outside the body' }), L({ es:'calor o limpieza', en:'heat or cleaning' }), L({ es:'cerámicas iónicas y disolventes moleculares', en:'ionic ceramics and molecular solvents' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'que un compuesto sea iónico no lo vuelve automáticamente útil para conducir. Necesita además disolverse o fundirse, porque en el sólido sus iones están presentes pero atrapados en la red.',
      en:'a compound being ionic does not automatically make it useful for conducting. It also needs to dissolve or melt, because in the solid its ions are present but trapped in the lattice.'
    }) + '</p></div>'
  );
  wUsos(rng, widgetHost(s4, 'wUsos', 'usos'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  wCuaderno(rng, widgetHost(null, 'wCuaderno', 'reflect'));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Formación, Estructura y Aprovechamiento de Compuestos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
