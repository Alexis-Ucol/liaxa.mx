<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reacciones Endotérmicas y Exotérmicas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Reacciones Endotérmicas y Exotérmicas</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Reacciones Endotérmicas y Exotérmicas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c6cb4', primaryDark:'#032f50', primaryBg:'#e5f0f8',
  accent:'#9ccce4', accentBg:'#e3f0f7',
  darkPrimary:'#3191d8', darkPrimaryDark:'#64b7f6', darkPrimaryBg:'#052741',

function setLang(l){

    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'qui3_t10_g03__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'qui3_t10_g03__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {

  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);

  setTimeout(function() {

        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {

        pp.src = dataUrl; pp.style.display = 'block';

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

   GUIA :: qui3_t10_g03 - Reacciones endotérmicas y exotérmicas. Qué se mueve
   además de la materia cuando ocurre una reacción, cómo se lee el termómetro
   del entorno, dónde se escribe la energía dentro de la ecuación, qué dice el
   balance entre romper y formar enlaces, cómo se lee un perfil de energía y
   para qué se aprovechan estos intercambios en la vida diaria.
   Bilingüe (Rule 10), variantes por semilla (Rule 4), manipulativos marcados
   con data-widget (Part 0).

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function vpick(rng, list){ return list[Math.floor(rng() * list.length)]; }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function fm(s){ return String(s).replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>'); }
function enerWord(lang){ return (lang === 'en') ? 'energy' : 'energía'; }

function eqStr(left, right, side, lang){
  var l = left.map(function(x){ return fm(x); }).join(' + ');
  var r = right.map(function(x){ return fm(x); }).join(' + ');
  var w = '<span class="eq-en">' + enerWord(lang) + '</span>';
  if (side === 0) l = l + ' + ' + w;
  if (side === 1) r = r + ' + ' + w;
  return l + ' <span class="eq-ar">&#8594;</span> ' + r;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id, kind){
  var d = document.createElement('div');
  d.className = 'gw section';
  d.id = id;
  d.setAttribute('data-widget', kind);
  (parent || document.getElementById('lessonBody')).appendChild(d);
  return d;
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: v.fn ? L(v.fn) : '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

function wTermometro(rng, host){
  var ROUNDS = shuffle(ESCENAS_TERMO, rng).slice(0, 3).map(function(e){
    return { e:e, t0: ri(rng, 18, 24) };
  });
  var st = { r:0, d:0, tries:0, done:false, lock:false };

  function paint(){
    var R = ROUNDS[st.r];
    var m = host.querySelector('[data-r="merc"]');
    var rd = host.querySelector('[data-r="read"]');
    var nt = host.querySelector('[data-r="note"]');
    if (!m) return;
    m.style.height = (50 + st.d * 2.6) + '%';
    m.className = 'th-merc' + (st.d > 0 ? ' up' : (st.d < 0 ? ' down' : ''));
    rd.innerHTML = L({ es:'Inicio ', en:'Start ' }) + R.t0 + ' °C  ·  ' + L({ es:'tu lectura ', en:'your reading ' }) + (R.t0 + st.d) + ' °C';
    if (st.d > 0) nt.innerHTML = L({ es:'Subió ', en:'It rose ' }) + st.d + L({ es:' grados: el vaso se sentiría caliente en la mano.', en:' degrees: the glass would feel hot in your hand.' });
    else if (st.d < 0) nt.innerHTML = L({ es:'Bajó ', en:'It dropped ' }) + (-st.d) + L({ es:' grados: el vaso se sentiría frío en la mano.', en:' degrees: the glass would feel cold in your hand.' });
    else nt.innerHTML = L({ es:'Sin cambio: el vaso se sentiría igual que antes de empezar.', en:'No change: the glass would feel just as it did before starting.' });
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Termómetro del entorno', en:'Thermometer of the surroundings' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Listo. El termómetro nunca mide la reacción: mide lo que la rodea. Si lo de alrededor se calienta, la energía salió del sistema; si se enfría, la energía entró.',
          en:'Done. The thermometer never measures the reaction: it measures what surrounds it. If the surroundings heat up, energy left the system; if they cool down, energy came in.'
        }) + '</div>';
      return;
    }
    var R = ROUNDS[st.r];
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Termómetro del entorno', en:'Thermometer of the surroundings' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Mueve el control y mira cómo responde el termómetro que está en el agua del vaso. Déjalo en la temperatura que crees que marcará dos minutos después de empezar, y verifica.',
        en:'Move the control and watch the thermometer sitting in the water of the glass respond. Leave it at the temperature you think it will read two minutes after the start, and check.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + ROUNDS.length + '</div>' +
      '<div class="gw-case">' + L(R.e.txt) + '</div>' +
      '<div class="th-wrap">' +
        '<div class="th-tube"><div class="th-merc" data-r="merc"></div><div class="th-mid"></div></div>' +
        '<div class="th-side"><div class="th-read" data-r="read"></div><div class="th-note" data-r="note"></div></div>' +
      '</div>' +
      '<input class="gw-slider" type="range" min="-14" max="14" step="1" data-r="sl" value="' + st.d + '">' +
      '<div class="gw-row"><button class="gw-btn go" data-act="check">' + L({ es:'Verificar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb"></div>';
    paint();
  }

  host.addEventListener('input', function(e){
    if (st.done || st.lock) return;
    if (!e.target || e.target.getAttribute('data-r') !== 'sl') return;
    st.d = parseInt(e.target.value, 10) || 0;
    paint();
  });

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done || st.lock) return;
    if (b.getAttribute('data-act') !== 'check') return;
    var R = ROUNDS[st.r];
    var ok = (R.e.dir === 1) ? (st.d >= 3) : (st.d <= -3);
    if (ok){
      st.lock = true;
      say('good', (R.e.dir === 1
        ? L({ es:'Así es: el entorno terminó más caliente, o sea que la energía salió de las sustancias hacia el agua. A eso se le llama reacción exotérmica. ',
              en:'That is it: the surroundings ended up hotter, meaning energy left the substances and went into the water. That is called an exothermic reaction. ' })
        : L({ es:'Así es: el entorno terminó más frío, o sea que la energía viajó del agua hacia las sustancias. A eso se le llama reacción endotérmica. ',
              en:'That is it: the surroundings ended up colder, meaning energy travelled from the water into the substances. That is called an endothermic reaction. ' })) + L(R.e.why));
    } else {
      st.tries++;
      if (st.tries < 3){
        if (st.d === 0){
          say('warm', L({ es:'Con esa lectura no pasaría nada en el vaso, y en esta escena sí hay algo que se siente. Mueve el control hacia un lado.',
                          en:'With that reading nothing would happen in the glass, and in this scene there is something to feel. Move the control to one side.' }));
        } else if ((R.e.dir === 1) === (st.d > 0)){
          say('warm', L({ es:'Vas para el lado correcto, pero un cambio tan chico no se notaría al tocar el vaso. Aléjate más del valor de inicio.',
                          en:'You are heading the right way, but a change that small would not be noticed by touching the glass. Move further from the starting value.' }));
        } else if (R.e.dir === 1){
          say('miss', L({ es:'Fíjate en lo que pasa con las uniones de las sustancias: aquí las nuevas guardan menos energía que las viejas, y ese sobrante tiene que ir a algún lado. Sube el control.',
                          en:'Look at what happens to the joins of the substances: here the new ones store less energy than the old ones, and that surplus has to go somewhere. Raise the control.' }));
        } else {
          say('miss', L({ es:'Fíjate de dónde saldría la energía que hace falta: nadie está calentando el vaso, así que solo puede salir del agua misma. Baja el control.',
                          en:'Think about where the energy needed would come from: nobody is heating the glass, so it can only come out of the water itself. Lower the control.' }));
        }
        return;
      }
      st.lock = true;
      st.d = R.e.dir * 8;
      render();
      st.lock = true;
      say('warm', (R.e.dir === 1
        ? L({ es:'El termómetro sube: el entorno se calienta y la reacción es exotérmica. ', en:'The thermometer rises: the surroundings heat up and the reaction is exothermic. ' })
        : L({ es:'El termómetro baja: el entorno se enfría y la reacción es endotérmica. ', en:'The thermometer drops: the surroundings cool down and the reaction is endothermic. ' })) + L(R.e.why));
    }
    setTimeout(function(){
      st.r++; st.d = 0; st.tries = 0; st.lock = false;
      if (st.r >= ROUNDS.length) st.done = true;
      render();
    }, 2200);
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: a qué lado va cada proceso
   Escenas cotidianas que caen en una de dos cajas: la que entrega energía y la
   que la pide prestada. Cada intento equivocado responde con una pregunta que
   apunta al criterio, no con un tache. A la tercera se muestra la caja buena y
   avanza.
   ══════════════════════════════════════════════════════════════════════════ */
var CASOS_CLAS = [

    why:{ es:'Una vez encendida, la llama entrega calor todo el tiempo sin que nadie le dé nada.', en:'Once lit, the flame hands out heat all the time without anybody giving it anything.' } },
  { bin:1, txt:{ es:'Una planta fabrica glucosa con el agua, el aire y la luz del Sol.', en:'A plant makes glucose from water, air and sunlight.' },
    why:{ es:'Sin luz el proceso se detiene: esa luz es la energía que la planta guarda en el alimento.', en:'Without light the process stops: that light is the energy the plant stores in the food.' } },
  { bin:1, txt:{ es:'El nitrato de amonio de una compresa instantánea se disuelve en el agua del paquete.', en:'The ammonium nitrate of an instant pack dissolves in the water of the packet.' },
    why:{ es:'La sal jala energía del agua y del aire cercano mientras se separa.', en:'The salt pulls energy from the water and the nearby air as it separates.' } },

    why:{ es:'Entrega energía poco a poco, tan despacio que casi no se siente, pero la entrega.', en:'It hands out energy bit by bit, so slowly it is hardly felt, but it hands it out.' } },
  { bin:1, txt:{ es:'Con una pila conectada se separa el agua en hidrógeno y oxígeno.', en:'With a battery connected, water is split into hydrogen and oxygen.' },
    why:{ es:'Las burbujas solo salen mientras la pila trabaje: esa es la energía que entra.', en:'The bubbles only come out while the battery is working: that is the energy going in.' } },
  { bin:0, txt:{ es:'En una obra se apaga la cal viva con una manguera de agua.', en:'On a building site, quicklime is slaked with a water hose.' },
    why:{ es:'El bote termina humeando sin que nadie le acerque fuego.', en:'The bucket ends up steaming without anybody bringing fire near it.' } }
];

function wClasifica(rng, host){
  var ITEMS = shuffle(CASOS_CLAS, rng).slice(0, 5);
  var BINS = [
    { es:'Entrega energía al entorno', en:'Hands energy to the surroundings' },
    { es:'Toma energía del entorno', en:'Takes energy from the surroundings' }
  ];
  var st = { i:0, tries:0, hits:0, done:false, lock:false };

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'A qué lado va cada caso', en:'Which side each case goes to' }) + '</div>' +
        '<div class="gw-fb good">' + L({ es:'Terminaste la ronda con ', en:'You finished the round with ' }) + st.hits + ' / ' + ITEMS.length + '. ' +
        L({ es:'La pregunta que resuelve casi todos los casos es la misma: ¿continúa por su cuenta entregando calor, o se detiene en cuanto le quitas la fuente de energía?',
            en:'The question that settles almost every case is the same: does it keep going on its own handing out heat, or does it stop as soon as you take the energy source away?' }) + '</div>';

      '<div class="gw-mini iw-sub">' + L({
        es:'Lee el caso y elige la caja que le corresponde. Si te equivocas te doy una pista para pensarlo de otro modo y puedes volver a elegir.',
        en:'Read the case and choose the box it belongs to. If you get it wrong I give you a clue to think about it another way and you can choose again.'

      '</div>' +

  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done || st.lock) return;
    var it = ITEMS[st.i];
    var choice = parseInt(b.getAttribute('data-b'), 10);
    if (choice === it.bin){
      st.hits++;
      st.lock = true;
      say('good', L({ es:'Correcto. ', en:'Correct. ' }) + L(it.why) + ' ' +

    } else {
      st.tries++;
      if (st.tries < 3){
        say('miss', L({ es:'Todavía no. Pregúntate quién pone la energía: ¿el caso sigue avanzando solo, o se para en cuanto le quitas la llama, la luz o la pila?',
                        en:'Not yet. Ask yourself who puts the energy in: does the case keep going on its own, or does it stop as soon as you take away the flame, the light or the battery?' }));

      }

      say('warm', L({ es:'Aquí la respuesta era: ', en:'Here the answer was: ' }) + '<b>' + L(BINS[it.bin]) + '</b>. ' + L(it.why));

      st.i++; st.tries = 0; st.lock = false;

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: une la ecuación con lo que se siente
   Cuatro ecuaciones que ya traen la energía escrita de un lado y cuatro
   observaciones sueltas. Se toca una ecuación y luego la observación que
   predice. Los pares correctos quedan fijos en verde y los demás siguen
   disponibles, así que se puede rehacer cuantas veces haga falta.
   ══════════════════════════════════════════════════════════════════════════ */
var PARES_ENERGIA = [
  { left:['CH4','2 O2'], right:['CO2','2 H2O'], side:1,
    obs:{ es:'Un comal puesto encima llega a quemar aunque nadie lo caliente por otro lado.',
          en:'A griddle placed above gets hot enough to burn even though nobody heats it from elsewhere.' } },
  { left:['CaCO3'], right:['CaO','CO2'], side:0,
    obs:{ es:'El polvo blanco solo aparece si el horno se mantiene a más de novecientos grados.',
          en:'The white powder only appears if the kiln is kept above nine hundred degrees.' } },
  { left:['2 H2O'], right:['2 H2','O2'], side:0,
    obs:{ es:'Las burbujas de los dos gases dejan de salir en cuanto se desconecta la pila.',
          en:'The bubbles of the two gases stop coming out as soon as the battery is unplugged.' } },
  { left:['CaO','H2O'], right:['Ca(OH)2'], side:1,
    obs:{ es:'El bote de la mezcla queda ardiendo aunque nadie le acercó fuego.',
          en:'The bucket with the mixture ends up burning hot even though nobody brought fire near it.' } },
  { left:['6 CO2','6 H2O'], right:['C6H12O6','6 O2'], side:0,
    obs:{ es:'La hoja solo fabrica su alimento en las horas en que le llega la luz.',
          en:'The leaf only makes its food during the hours when light reaches it.' } },
  { left:['C6H12O6','6 O2'], right:['6 CO2','6 H2O'], side:1,
    obs:{ es:'Tu cuerpo se mantiene tibio aun cuando el aire de la mañana está frío.',
          en:'Your body stays warm even when the morning air is cold.' } }
];

function wUne(rng, host){
  var PAIRS = shuffle(PARES_ENERGIA, rng).slice(0, 4);
  var order = shuffle([0, 1, 2, 3], rng);
  var st = { sel:null, tied:{}, tries:0, done:false };

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function render(){
    var eqs = PAIRS.map(function(p, i){
      var cls = 'mt-it' + (st.tied[i] ? ' tied' : (st.sel === i ? ' sel' : ''));
      return '<button class="' + cls + '" data-act="eq" data-i="' + i + '">' +
        '<span class="mt-tag">' + L({ es:'Ecuación', en:'Equation' }) + '</span>' + eqStr(p.left, p.right, p.side, LANG) + '</button>';
    }).join('');
    var obs = order.map(function(i){
      var cls = 'mt-it' + (st.tied[i] ? ' tied' : '');
      return '<button class="' + cls + '" data-act="ob" data-i="' + i + '">' +
        '<span class="mt-tag">' + L({ es:'Lo que se observa', en:'What is observed' }) + '</span>' + L(PAIRS[i].obs) + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Une la ecuación con lo que se siente', en:'Match the equation with what is felt' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'Cada ecuación ya trae la energía escrita de un lado. Toca una ecuación y después la observación que ese lado predice; el par correcto se queda fijo.',
        en:'Each equation already has the energy written on one side. Tap an equation and then the observation that side predicts; a correct pair stays locked.'
      }) + '</div>' +
      '<div class="mt-grid"><div class="mt-col">' + eqs + '</div><div class="mt-col">' + obs + '</div></div>' +
      '<div class="gw-fb" data-r="fb"></div>';
    if (st.done){
      say('good', L({
        es:'Quedaron unidos los cuatro. Cuando la energía está escrita con los productos, la reacción la entrega y lo cercano se calienta; cuando está escrita con los reactivos, hay que dársela todo el tiempo.',
        en:'All four are matched. When the energy is written with the products, the reaction hands it over and nearby things heat up; when it is written with the reactants, it has to be supplied all the time.'
      }));
    }
  }

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done) return;
    var idx = parseInt(b.getAttribute('data-i'), 10);
    if (st.tied[idx]) return;
    if (b.getAttribute('data-act') === 'eq'){
      st.sel = (st.sel === idx) ? null : idx;
      render();
      return;
    }
    if (st.sel === null){
      say('warm', L({ es:'Primero toca una ecuación de la izquierda y después la observación que le corresponde.',
                      en:'First tap an equation on the left and then the observation that goes with it.' }));
      return;
    }
    if (st.sel === idx){
      st.tied[idx] = true;
      st.sel = null;
      var n = 0, k;
      for (k in st.tied) if (st.tied[k]) n++;
      if (n >= PAIRS.length) st.done = true;
      render();
      if (!st.done) say('good', L({ es:'Van ', en:'That is ' }) + n + ' / ' + PAIRS.length + '. ' +
        L({ es:'Sigue con otra ecuación.', en:'Carry on with another equation.' }));
      return;
    }
    st.tries++;
    var mine = PAIRS[st.sel];
    if (st.tries >= 3){
      for (var j = 0; j < PAIRS.length; j++) st.tied[j] = true;
      st.done = true; st.sel = null;
      render();
      say('warm', L({
        es:'Así quedan los cuatro pares. Busca de qué lado de la flecha está la palabra energía: ese solo dato ya dice si la escena se calienta sola o si necesita que la mantengan encendida.',
        en:'This is how the four pairs end up. Look at which side of the arrow the word energy is on: that one fact already says whether the scene heats up on its own or needs to be kept going.'
      }));
      return;
    }
    st.sel = null;
    render();
    say('miss', (mine.side === 1
      ? L({ es:'En esa ecuación la energía está del lado de los productos, o sea que la reacción la entrega. Busca una observación en la que algo se caliente sin que nadie lo caliente.',
            en:'In that equation the energy is on the products side, meaning the reaction hands it over. Look for an observation where something heats up without anybody heating it.' })
      : L({ es:'En esa ecuación la energía está del lado de los reactivos, o sea que hay que dársela. Busca una observación en la que el cambio se detenga al quitar la fuente de energía.',
            en:'In that equation the energy is on the reactants side, meaning it has to be supplied. Look for an observation where the change stops once the energy source is removed.' })));
  });

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: constructor del perfil de energía
   El nivel de los reactivos está fijo; el estudiante sube y baja el nivel de
   los productos con el control y la diferencia se recalcula en cada movimiento,
   junto con el nombre que le toca a esa reacción. Se pide un perfil concreto y
   la retroalimentación dice cuántos kilojoules faltan o sobran.
   ══════════════════════════════════════════════════════════════════════════ */
function wPerfil(rng, host){
  var kinds = shuffle([1, -1, (rng() < 0.5 ? 1 : -1)], rng);
  var ROUNDS = kinds.map(function(k){
    var er = ri(rng, 24, 46) * 10;
    var amt = ri(rng, 3, 9) * 20;
    return { er:er, amt:amt, kind:k, target: er - k * amt };
  });
  var st = { r:0, off:0, tries:0, done:false, lock:false };

  function prod(){ return ROUNDS[st.r].er + st.off; }

  function paint(){
    var R = ROUNDS[st.r];
    var lo = R.er - 260, hi = R.er + 260;
    var pb = host.querySelector('[data-r="pbar"]');
    var pl = host.querySelector('[data-r="plab"]');
    var rd = host.querySelector('[data-r="read"]');
    var nt = host.querySelector('[data-r="note"]');
    if (!pb) return;
    var pos = 6 + (prod() - lo) / (hi - lo) * 84;
    pb.style.bottom = pos + '%';
    pl.style.bottom = (pos + 3) + '%';
    pl.innerHTML = L({ es:'Productos ', en:'Products ' }) + prod() + ' kJ';
    var dif = R.er - prod();
    if (dif > 0) rd.innerHTML = '<span>' + L({ es:'Libera', en:'Releases' }) + '</span><span class="pf-big">' + dif + ' kJ</span>';
    else if (dif < 0) rd.innerHTML = '<span>' + L({ es:'Absorbe', en:'Absorbs' }) + '</span><span class="pf-big">' + (-dif) + ' kJ</span>';
    else rd.innerHTML = '<span>' + L({ es:'Sin diferencia', en:'No difference' }) + '</span><span class="pf-big">0 kJ</span>';
    if (dif > 0) nt.innerHTML = L({ es:'Los productos quedaron abajo: sobra energía y sale al entorno, así que el perfil es de una reacción exotérmica.', en:'The products ended up lower: energy is left over and goes out to the surroundings, so this profile is of an exothermic reaction.' });
    else if (dif < 0) nt.innerHTML = L({ es:'Los productos quedaron arriba: falta energía y hay que tomarla del entorno, así que el perfil es de una reacción endotérmica.', en:'The products ended up higher: energy is missing and has to be taken from the surroundings, so this profile is of an endothermic reaction.' });
    else nt.innerHTML = L({ es:'Los dos niveles están parejos: así dibujado, nada entraría ni saldría.', en:'The two levels are even: drawn like this, nothing would come in or go out.' });
  }

  function say(cls, msg){
    var fb = host.querySelector('[data-r="fb"]');
    if (fb){ fb.className = 'gw-fb ' + cls; fb.innerHTML = msg; }
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h iw-tag">' + L({ es:'Constructor del perfil de energía', en:'Energy profile builder' }) + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'Listo. La altura de cada nivel dice cuánta energía guardan las sustancias, y la distancia entre los dos niveles es exactamente la energía que la reacción entrega o pide.',
          en:'Done. The height of each level says how much energy the substances store, and the distance between the two levels is exactly the energy the reaction hands over or asks for.'
        }) + '</div>';
      return;
    }
    var R = ROUNDS[st.r];
    var lo = R.er - 260, hi = R.er + 260;
    var rpos = 6 + (R.er - lo) / (hi - lo) * 84;
    host.innerHTML =
      '<div class="gw-h iw-tag">' + L({ es:'Constructor del perfil de energía', en:'Energy profile builder' }) + '</div>' +
      '<div class="gw-mini iw-sub">' + L({
        es:'La barra verde marca la energía guardada en los reactivos y no se mueve. Sube o baja la barra dorada de los productos con el control y observa cómo cambia la diferencia.',
        en:'The green bar marks the energy stored in the reactants and does not move. Raise or lower the golden bar of the products with the control and watch the difference change.'
      }) + '</div>' +
      '<div class="gw-prog">' + (st.r + 1) + ' / ' + ROUNDS.length + '</div>' +
      '<div class="gw-case">' + L({ es:'Arma el perfil de una reacción que ', en:'Build the profile of a reaction that ' }) +
        (R.kind === 1 ? L({ es:'libere ', en:'releases ' }) : L({ es:'absorba ', en:'absorbs ' })) + '<b>' + R.amt + ' kJ</b>.</div>' +
      '<div class="pf-box">' +
        '<div class="pf-lvl rea" style="bottom:' + rpos + '%"></div>' +
        '<div class="pf-lab rea" style="bottom:' + (rpos + 3) + '%">' + L({ es:'Reactivos ', en:'Reactants ' }) + R.er + ' kJ</div>' +
        '<div class="pf-lvl pro" data-r="pbar"></div>' +
        '<div class="pf-lab pro" data-r="plab"></div>' +
      '</div>' +
      '<input class="gw-slider" type="range" min="-200" max="200" step="20" data-r="sl" value="' + st.off + '">' +
      '<div class="pf-read" data-r="read"></div>' +
      '<div class="th-note" data-r="note"></div>' +
      '<div class="gw-row"><button class="gw-btn go" data-act="check">' + L({ es:'Verificar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb" data-r="fb"></div>';
    paint();
  }

  host.addEventListener('input', function(e){
    if (st.done || st.lock) return;
    if (!e.target || e.target.getAttribute('data-r') !== 'sl') return;
    st.off = parseInt(e.target.value, 10) || 0;
    paint();
  });

  host.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || st.done || st.lock) return;
    if (b.getAttribute('data-act') !== 'check') return;
    var R = ROUNDS[st.r];
    var dif = R.er - prod();
    var want = R.kind * R.amt;
    if (dif === want){
      st.lock = true;
      say('good', L({ es:'Exacto. Entre ', en:'Exactly. Between ' }) + R.er + L({ es:' kJ y ', en:' kJ and ' }) + prod() +
        L({ es:' kJ hay ', en:' kJ there are ' }) + R.amt + L({ es:' kJ de diferencia, y ese hueco es la energía que ', en:' kJ of difference, and that gap is the energy the reaction ' }) +
        (R.kind === 1 ? L({ es:'la reacción entrega al entorno.', en:'hands to the surroundings.' }) : L({ es:'la reacción le pide al entorno.', en:'asks the surroundings for.' })));
    } else {
      st.tries++;
      if (st.tries < 3){
        if ((dif > 0) !== (want > 0)){
          say('miss', R.kind === 1
            ? L({ es:'Con los productos arriba de los reactivos el perfil está pidiendo energía, no entregándola. Baja la barra dorada por debajo de la verde.',
                  en:'With the products above the reactants the profile is asking for energy, not handing it over. Lower the golden bar below the green one.' })
            : L({ es:'Con los productos abajo de los reactivos el perfil está entregando energía, no pidiéndola. Sube la barra dorada por encima de la verde.',
                  en:'With the products below the reactants the profile is handing energy over, not asking for it. Raise the golden bar above the green one.' }));
        } else {
          var falta = Math.abs(want) - Math.abs(dif);
          say('warm', falta > 0
            ? L({ es:'Estás en el sentido correcto, pero te faltan ', en:'You are going the right way, but you are short by ' }) + falta + L({ es:' kJ de separación.', en:' kJ of separation.' })
            : L({ es:'Estás en el sentido correcto, pero te pasaste por ', en:'You are going the right way, but you went over by ' }) + (-falta) + L({ es:' kJ de separación.', en:' kJ of separation.' }));
        }
        return;
      }
      st.lock = true;
      st.off = R.target - R.er;
      render();
      st.lock = true;
      say('warm', L({ es:'Este era el perfil: los productos en ', en:'This was the profile: the products at ' }) + R.target +
        L({ es:' kJ, a ', en:' kJ, ' }) + R.amt + L({ es:' kJ del nivel de los reactivos.', en:' kJ away from the level of the reactants.' }));
    }
    setTimeout(function(){
      st.r++; st.off = 0; st.tries = 0; st.lock = false;
      if (st.r >= ROUNDS.length) st.done = true;
      render();
    }, 2200);
  });

  render();
}
