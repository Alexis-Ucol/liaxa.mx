        'That lime hardens the cooking water so the grain absorbs more minerals from the pot it is cooked in.' ] },
      correct:0,
      hint:{ es:'Piensa qué tipo de medio produce la cal al disolverse en agua, y sobre qué parte del grano actúa ese medio.',
             en:'Think about what kind of medium lime produces when it dissolves in water, and on which part of the grain that medium acts.' },
      explanation:{ es:'La cal disuelta forma hidróxido de calcio, es decir, un medio alcalino. Ese medio degrada la cubierta del grano, por eso la cáscara se desprende, y libera compuestos, entre ellos la niacina, que en el maíz sin tratar quedan ligados y no se aprovechan. El calor solo no consigue lo mismo, y el aroma o el color no son la razón del cambio.',
                    en:'Dissolved lime forms calcium hydroxide, that is, an alkaline medium. That medium degrades the coat of the grain, which is why the skin comes off, and it releases compounds, niacin among them, that stay bound and unavailable in untreated maize. Heat alone does not achieve the same, and aroma or color are not the reason for the change.' } },
    { title:{ es:'Un azul que no se destiñe', en:'A blue that does not fade' }, showWork:false,
      stmt:{ es:'El añil aplicado solo sobre un muro se destiñe en pocos años. El azul maya, que se prepara calentando ese mismo añil junto con una arcilla porosa, conserva su color a la intemperie durante siglos. ¿Qué explica la diferencia?',
             en:'Indigo applied on its own to a wall fades within a few years. Maya blue, prepared by heating that same indigo together with a porous clay, keeps its color outdoors for centuries. What explains the difference?' },
      options:{ es:[
        'Que al calentarse, las moléculas del colorante quedan alojadas dentro de los canales de la arcilla, donde el agua y la luz ya casi no las alcanzan.',
        'Que la arcilla transforma el añil en un mineral azul distinto, de modo que el colorante original desaparece durante el calentamiento.',
        'Que el calor evapora el agua del añil, y un colorante completamente seco resiste por sí solo cualquier condición del clima.',
        'Que la arcilla aporta su propio color azul, y el añil solo sirve para que la mezcla se adhiera bien a la superficie del muro.' ],
        en:[
        'That on heating, the dye molecules end up lodged inside the channels of the clay, where water and light barely reach them.',
        'That the clay transforms indigo into a different blue mineral, so the original dye disappears during heating.',
        'That heat evaporates the water in the indigo, and a completely dry dye withstands any weather condition on its own.',
        'That the clay contributes its own blue color, and the indigo only serves to make the mixture stick to the wall surface.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué papel puede cumplir un material poroso cuando aloja otra sustancia dentro de sus huecos.',
             en:'Ask what role a porous material can play when it lodges another substance inside its cavities.' },
      explanation:{ es:'La arcilla usada tiene canales internos. Al calentar la mezcla, las moléculas de añil entran en esos canales y quedan protegidas del agua, del oxígeno y de la luz, que son justamente los agentes que decoloran al tinte aplicado solo. El colorante sigue siendo el mismo: lo que cambia es dónde queda alojado.',
                    en:'The clay used has internal channels. On heating the mixture, the indigo molecules enter those channels and end up shielded from water, oxygen and light, which are precisely the agents that bleach the dye when it is applied alone. The dye is still the same: what changes is where it sits.' } }
  ], rng), rng);

  /* CONCEPTO 2 */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Los nombres que sí estaban','The names that were there all along') + '</h2>' +
    '<p>' + S('La química moderna la construyeron mujeres y hombres, casi siempre en equipo, y casi nunca de un solo golpe. Marie Curie trató toneladas de residuo mineral para reunir una fracción de gramo de radio. Dorothy Hodgkin dedujo con rayos X cómo están acomodados los átomos de la penicilina, y con esa estructura el antibiótico pudo sintetizarse. Alice Ball convirtió un aceite espeso en un preparado inyectable y volvió utilizable el único tratamiento que existía entonces contra la lepra. Stephanie Kwolek obtuvo una fibra que a igual peso resiste más que el acero. Rosalind Franklin midió el patrón de difracción del que se dedujo la forma del ADN.',
              'Modern chemistry was built by women and men, almost always in teams, and almost never in one stroke. Marie Curie processed tons of mineral residue to gather a fraction of a gram of radium. Dorothy Hodgkin worked out with X rays how the atoms of penicillin are arranged, and with that structure the antibiotic could be synthesized. Alice Ball turned a thick oil into an injectable preparation and made usable the only treatment that then existed against leprosy. Stephanie Kwolek obtained a fiber that at equal weight resists more than steel. Rosalind Franklin measured the diffraction pattern from which the shape of DNA was deduced.') + '</p>' +
    '<p>' + S('Del lado de los nombres que sí llegaron a los libros, Lavoisier midió en balanza y estableció que la masa se conserva, con Marie-Anne Paulze traduciendo y dibujando el laboratorio para que otros lo replicaran. Mendeleiev ordenó los elementos y dejó casillas vacías. En Mexico, Andres Manuel del Rio identificó en Zimapan un elemento nuevo, Luis Ernesto Miramontes sintetizó el compuesto base de la píldora anticonceptiva y Mario Molina explicó cómo unos gases de aerosol destruyen el ozono. Muchos de estos aportes se cuentan hoy con un solo nombre, y casi ninguno se hizo con una sola persona.',
              'Among the names that did reach the books, Lavoisier measured on a balance and established that mass is conserved, with Marie-Anne Paulze translating and drawing the laboratory so others could replicate it. Mendeleev ordered the elements and left empty boxes. In Mexico, Andres Manuel del Rio identified a new element at Zimapan, Luis Ernesto Miramontes synthesized the base compound of the contraceptive pill, and Mario Molina explained how certain aerosol gases destroy ozone. Many of these contributions are told today with a single name, and almost none of them was made by a single person.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('un aporte se entiende cuando se dice qué se volvió posible con él, no cuando solo se memoriza el nombre de quien lo firmó.',
        'a contribution is understood when you can say what became possible through it, not when you simply memorize the name that signed it.') + '</p></div>' +
    buildPares(rng));
  parRender();

  /* PROBLEMA 3 */
  addProblem(pick([
    { title:{ es:'Las casillas vacías', en:'The empty boxes' }, showWork:false,
      stmt:{ es:'Al ordenar los elementos conocidos, Mendeleiev dejó casillas vacías y describió cómo debía ser cada elemento faltante. Años después se hallaron elementos que coincidían con esas descripciones. ¿Qué muestra ese episodio sobre su ordenamiento?',
             en:'When ordering the known elements, Mendeleev left empty boxes and described what each missing element should be like. Years later elements matching those descriptions were found. What does that episode show about his ordering?' },
      options:{ es:[
        'Que el orden recogía una regularidad real de la materia, porque permitió anticipar propiedades de sustancias que nadie había medido todavía.',
        'Que el orden era una lista provisional, y los elementos nuevos se acomodaron después en los huecos por simple conveniencia.',
        'Que las casillas vacías probaban que la tabla estaba mal construida, y por eso tuvo que ser reemplazada por otra distinta.',
        'Que los elementos faltantes se fabricaron en el laboratorio siguiendo al pie de la letra las descripciones que la tabla había publicado.' ],
        en:[
        'That the ordering captured a real regularity of matter, because it allowed the properties of substances nobody had yet measured to be anticipated.',
        'That the ordering was a provisional list, and the new elements were later slotted into the gaps out of plain convenience.',
        'That the empty boxes proved the table was badly built, and that is why it had to be replaced by a different one.',
        'That the missing elements were manufactured in the laboratory by following to the letter the descriptions the table had published.' ] },
      correct:0,
      hint:{ es:'Distingue entre acomodar lo que ya se conoce y decir de antemano qué se va a encontrar.',
             en:'Distinguish between arranging what is already known and stating in advance what will be found.' },
      explanation:{ es:'Cualquier lista puede acomodar lo ya conocido. El ordenamiento de Mendeleiev hizo algo más exigente: predijo masa y comportamiento de elementos aún no descubiertos, y las mediciones posteriores coincidieron. Esa capacidad de predecir es la señal de que la regularidad estaba en la materia y no solo en el papel.',
                    en:'Any list can accommodate what is already known. Mendeleev ordering did something far more demanding: it predicted the mass and behavior of undiscovered elements, and later measurements agreed. That predictive power is the sign that the regularity was in matter and not only on paper.' } },
    { title:{ es:'Dos maneras de ordenar', en:'Two ways of ordering' }, showWork:false,
      stmt:{ es:'Dos personas proponen ordenar los elementos: una los acomoda alfabéticamente por su nombre y otra por la repetición de sus propiedades conforme aumenta la masa. ¿Cuál ordenamiento resulta útil para la química y por qué?',
             en:'Two people propose ways of ordering the elements: one arranges them alphabetically by name and the other by the repetition of their properties as mass increases. Which ordering is useful for chemistry and why?' },
      options:{ es:[
        'El segundo, porque coloca en una misma columna a los elementos que reaccionan de manera parecida y así el lugar en la tabla informa sobre el comportamiento.',
        'El primero, porque un orden alfabético permite localizar cualquier elemento sin necesidad de conocer sus propiedades previamente.',
        'Los dos por igual, ya que ambos contienen a todos los elementos conocidos y ninguno deja información fuera.',
        'El segundo, porque agrupa a los elementos según el país donde cada uno de ellos fue descubierto por primera vez.' ],
        en:[
        'The second, because it puts elements that react in similar ways into the same column, so the place in the table tells you about behavior.',
        'The first, because an alphabetical order lets you locate any element with no need to know its properties beforehand.',
        'Both equally, since both contain every known element and neither leaves information out.',
        'The second, because it groups elements according to the country where each of them was first discovered.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué te dice cada ordenamiento sobre un elemento que ves por primera vez.',
             en:'Ask what each ordering tells you about an element you are seeing for the first time.' },
      explanation:{ es:'Un orden alfabético depende del idioma y no dice nada del elemento. Ordenar por la repetición de propiedades agrupa en una columna a sustancias que reaccionan de forma parecida, de modo que la posición anticipa el comportamiento. Por eso la tabla periódica es una herramienta de trabajo y no solo un catálogo.',
                    en:'An alphabetical order depends on the language and says nothing about the element. Ordering by the repetition of properties groups substances that react alike into one column, so position anticipates behavior. That is why the periodic table is a working tool and not merely a catalogue.' } }
  ], rng), rng);

  ], rng), rng);

  /* CONCEPTO 3 */
  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Quién firma y quién sostiene un resultado','Who signs and who holds up a result') + '</h2>' +
    '<p>' + S('Un resultado químico no vale por quién lo anuncia, sino porque otro laboratorio, con el mismo procedimiento, obtiene lo mismo. Por eso se publica el método completo, se informan también las mediciones que no encajan y se guarda el registro de lo que salió mal. Ocultar un dato incómodo o ajustar un punto para que la gráfica se vea ordenada no engaña a la naturaleza: engaña al registro, y eso se descubre tarde, cuando alguien intenta repetirlo y no puede.',
              'A chemical result is not worth anything because of who announces it, but because another laboratory, using the same procedure, gets the same thing. That is why the full method is published, the measurements that do not fit are reported too, and the record of what went wrong is kept. Hiding an inconvenient data point or adjusting one point so the graph looks tidy does not deceive nature: it deceives the record, and that is discovered late, when somebody tries to repeat it and cannot.') + '</p>' +
    '<p>' + S('La segunda parte de la honestidad es el crédito. Un trabajo hecho entre varias personas se firma entre varias, y un método tomado de otro equipo se cita. Esta parte falló muchas veces con las mujeres del laboratorio, cuyas mediciones aparecieron en artículos que no llevaban su nombre, y falló también con comunidades que conservaban durante siglos el saber sobre una planta o un mineral y aparecieron después como simples proveedoras de materia prima. Reconocer un aporte no es cortesía: es decir con exactitud cómo se produjo el conocimiento.',

             en:'List everything that was needed to reach the result and compare it with the list of names published.' },
      explanation:{ es:'El resultado necesitó mediciones hechas por personas concretas y un método desarrollado antes por otro equipo. Nombrar a una sola persona borra las dos aportaciones y da una imagen falsa de cómo se produce el conocimiento. Dirigir un laboratorio no convierte el trabajo ajeno en propio, y el tipo de revista no cambia a quién le corresponde el crédito.',
                    en:'The result needed measurements made by specific people and a method developed earlier by another team. Naming a single person erases both contributions and gives a false picture of how knowledge is produced. Running a laboratory does not turn other people work into your own, and the kind of magazine does not change who the credit belongs to.' } },
    { title:{ es:'Un nombre que falta en el libro', en:'A name missing from the book' }, showWork:false,
      stmt:{ es:'Al preparar una exposición sobre la historia de un medicamento, un equipo descubre que la molécula fue aislada por una investigadora cuyo nombre no aparece en los libros que consultó, mientras que sí aparece el del director del instituto. ¿Cómo conviene que resuelvan la exposición?',
             en:'While preparing an exhibition on the history of a medicine, a team finds that the molecule was isolated by a researcher whose name does not appear in the books they consulted, while the name of the institute director does. How should they resolve the exhibition?' },
      options:{ es:[
        'Presentar la aportación de la investigadora con la fuente que la documenta y señalar que los libros consultados la omiten, porque esa omisión también es parte de la historia.',
        'Repetir lo que dicen los libros consultados, ya que son la fuente disponible y contradecirlos excedería el alcance de una exposición escolar.',
        'Retirar los dos nombres de la exposición y presentar el medicamento sin mencionar a ninguna de las personas involucradas.',
        'Nombrar únicamente a la investigadora y omitir al director, para compensar la desigualdad que los libros consultados produjeron.' ],
        en:[
        'Present the researcher contribution with the source documenting it and point out that the books consulted leave her out, because that omission is part of the history too.',
        'Repeat what the books consulted say, since they are the available source and contradicting them would go beyond a school exhibition.',
        'Remove both names from the exhibition and present the medicine without mentioning any of the people involved.',
        'Name only the researcher and leave out the director, to make up for the imbalance the books consulted produced.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué puede sostener el equipo con documentos y qué información necesita quien vea la exposición.',
             en:'Ask what the team can back up with documents and what information whoever visits the exhibition needs.' },
      explanation:{ es:'El equipo puede sostener aquello que una fuente documente, y decir además que los libros omiten ese nombre informa sobre cómo se construyó el relato. Repetir la omisión la prolonga; borrar los dos nombres deja la historia sin autores; y suprimir al director cambia una omisión por otra en lugar de corregir el registro.',
                    en:'The team can back up whatever a source documents, and saying in addition that the books leave that name out informs about how the account was built. Repeating the omission prolongs it; deleting both names leaves the history with no authors; and suppressing the director swaps one omission for another instead of correcting the record.' } }
  ], rng), rng);

  /* PROBLEMA 10 */
  addProblem(pick([
    { title:{ es:'El cartel del grupo', en:'The class poster' }, showWork:true,
      stmt:{ es:'Tu grupo preparará un cartel titulado De dónde viene lo que usamos, que debe conectar un producto de uso diario con el trabajo químico que hay detrás. Organiza tu propuesta y elige la que cumple mejor con lo revisado en esta guía.',
             en:'Your class will prepare a poster titled Where what we use comes from, connecting an everyday product with the chemical work behind it. Organize your proposal and choose the one that best meets what this guide has covered.' },
      options:{ es:[
        'Elegir un producto, rastrear los aportes de las distintas personas y culturas que hicieron posible obtenerlo, nombrar las fuentes consultadas y cerrar con una decisión de consumo que el grupo pueda sostener.',
        'Elegir el producto más vendido del país, copiar la descripción que da el fabricante y agregar fotografías llamativas del empaque y del anuncio.',
        'Presentar una lista de los diez químicos más famosos de la historia con su fecha de nacimiento y el premio más importante que recibió cada uno.',
        'Explicar con todo detalle la fórmula del producto y dejar fuera su historia, ya que el cartel es de química y no de historia.' ],
        en:[
        'Choose a product, trace the contributions of the different people and cultures that made obtaining it possible, name the sources consulted and close with a consumption decision the class can back up.',
        'Choose the best selling product in the country, copy the description given by the manufacturer and add striking photographs of the packaging and the advert.',
        'Present a list of the ten most famous chemists in history with their date of birth and the most important prize each one received.',
        'Explain the formula of the product in full detail and leave out its history, since the poster is about chemistry and not about history.' ] },
      correct:0,
      hint:{ es:'Revisa si la propuesta cumple tres cosas: de dónde viene el saber, quién lo aportó y qué decides tú con eso.',
             en:'Check whether the proposal does three things: where the knowledge comes from, who contributed it, and what you decide with that.' },
      explanation:{ es:'El cartel pedido conecta tres piezas: el recorrido del conocimiento, los nombres y culturas que lo aportaron y una decisión de consumo apoyada en eso. Copiar al fabricante entrega publicidad y no historia; la lista de famosos ordena nombres sin explicar ningún aporte; y quedarse solo en la fórmula deja fuera justamente lo que el cartel debía mostrar.',
                    en:'The poster asked for connects three pieces: the route of the knowledge, the names and cultures that contributed it, and a consumption decision resting on that. Copying the manufacturer delivers advertising rather than history; the list of famous names orders names without explaining any contribution; and stopping at the formula leaves out exactly what the poster was meant to show.' } },
    { title:{ es:'La ficha de una página', en:'The one page profile' }, showWork:true,
      stmt:{ es:'Van a escribir una ficha de una página sobre una persona que aportó a la química y su relación con algo que se usa hoy. Organiza tu propuesta y elige la ficha que cumple mejor con lo revisado en esta guía.',
             en:'You are going to write a one page profile about a person who contributed to chemistry and their connection with something used today. Organize your proposal and choose the profile that best meets what this guide has covered.' },
      options:{ es:[
        'Nombrar el aporte concreto, explicar qué se volvió posible con él que antes no lo era, citar de dónde salió la información y señalar un uso actual que dependa de ese aporte.',
        'Narrar la vida completa de la persona desde su infancia y cerrar la ficha con la lista de todos los premios y distinciones que recibió.',
        'Reunir las opiniones del grupo sobre quién fue el químico más importante y presentar en la ficha la que haya obtenido más votos.',
        'Copiar el resumen de la primera página que aparezca al buscar el nombre, ya que suele contener toda la información necesaria y ahorra tiempo.' ],
        en:[
        'Name the concrete contribution, explain what became possible through it that was not before, cite where the information came from and point to a current use that depends on it.',
        'Narrate the complete life of the person from childhood and close the profile with the list of every prize and distinction they received.',
        'Collect the opinions of the class about who was the most important chemist and put the one with the most votes in the profile.',
        'Copy the summary from the first page that comes up when searching the name, since it usually contains all the information needed and saves time.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué tendría que decir la ficha para que alguien entienda por qué ese aporte importa hoy.',
             en:'Ask what the profile would have to say for somebody to understand why that contribution matters today.' },
      explanation:{ es:'Una ficha útil dice qué se aportó, qué se volvió posible con ello, de dónde salió el dato y dónde se nota hoy. La biografía completa y la lista de premios no explican el aporte; la votación mide popularidad y no contribución; y copiar el primer resultado renuncia a verificar la fuente.',
                    en:'A useful profile says what was contributed, what became possible through it, where the information came from and where it shows today. The full biography and the prize list do not explain the contribution; a vote measures popularity and not contribution; and copying the first result gives up on verifying the source.' } }
  ], rng), rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Mujeres y Hombres en la Historia de la Química';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
