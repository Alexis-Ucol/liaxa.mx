<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ríos, Lagos, Aguas Subterráneas y Cuencas Hidrográficas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Ríos, Lagos, Aguas Subterráneas y Cuencas Hidrográficas</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Ríos, Lagos, Aguas Subterráneas y Cuencas Hidrográficas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c246c', primaryDark:'#07184c', primaryBg:'#e6eaf7',
  accent:'#8484b4', accentBg:'#e9e9f1',
  darkPrimary:'#385ed1', darkPrimaryDark:'#6a8bf0', darkPrimaryBg:'#08153e',

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'geo1_t03_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};

   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'geo1_t03_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'geo1_t03_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();

}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');

        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = 'geo1_t03_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function pickV(rng, V){ return V[Math.floor(rng() * V.length)]; }
function nums(a){ return [String(a[0]), String(a[1]), String(a[2]), String(a[3])]; }
function distinct4(a){ var m = {}, i; for (i = 0; i < a.length; i++){ var k = '' + a[i]; if (m[k]) return false; m[k] = 1; } return true; }
function mcSpec(v){
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:v.ci, hint:L(v.hint), exp:L(v.exp), showWork:false };
}
function numSpec(v, vals){
  return { title:L(v.title), q:L(v.q), fn:'', options:nums(vals), correct:0, hint:L(v.hint), exp:L(v.exp), showWork:true };
}

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Toda el agua cabe en una cubeta', en:'All the water fits in one bucket' }),
    '<p>' + L({
      es:'Imagina que toda el agua del planeta cabe en una cubeta de cien litros. Noventa y siete de esos litros son agua salada de los océanos. De los tres que quedan, casi dos están congelados en glaciares y casquetes polares, y el resto está sobre todo guardado bajo tierra. El agua de los ríos y los lagos, la que se ve, es apenas una película delgadísima de esa cubeta.',
      en:'Imagine that all the water on the planet fits into a hundred litre bucket. Ninety seven of those litres are salt water from the oceans. Of the three that are left, almost two are frozen in glaciers and polar ice caps, and the rest is mostly stored underground. The water in rivers and lakes, the water you can see, is barely a very thin film of that bucket.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'las aguas continentales son las que están sobre los continentes: ríos, lagos, humedales y acuíferos. Son poquísimas comparadas con el océano, se reparten de forma muy desigual y se organizan por cuencas. En esta guía las vas a recorrer una por una y terminarás en el mar que le pertenece a México.',
      en:'continental waters are the ones on the continents: rivers, lakes, wetlands and aquifers. They are tiny compared with the ocean, they are spread very unevenly and they are organized into basins. In this guide you will go through them one by one and finish at the sea that belongs to Mexico.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: distribución del agua ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Dónde está el agua del planeta', en:'Where the water of the planet is' }),
    '<p>' + L({
      es:'El agua del planeta se reparte de manera muy desigual. La inmensa mayoría es salada y está en los océanos, así que no sirve para beber ni para regar sin un tratamiento costoso. El agua dulce es apenas una porción diminuta de esa cubeta de cien litros.',
      en:'The water of the planet is spread very unevenly. The vast majority is salty and sits in the oceans, so it cannot be drunk or used for irrigation without costly treatment. Fresh water is only a tiny portion of that hundred litre bucket.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Océanos', en:'Oceans' }), L({ es:'97 de cada 100 L', en:'97 of every 100 L' }), L({ es:'agua salada', en:'salt water' })) +
      rcard(L({ es:'Agua dulce', en:'Fresh water' }), L({ es:'3 de cada 100 L', en:'3 of every 100 L' }), L({ es:'ríos, lagos, hielo y acuíferos', en:'rivers, lakes, ice and aquifers' })) +
    '</div>' +
    '<div class="gw" id="w_reparto"></div>' +
    '<p>' + L({
      es:'Esos 3 litros de agua dulce no se quedan quietos. Vamos a sacarlos de la cubeta y a repartirlos otra vez, esta vez solo entre ellos.',
      en:'Those 3 litres of fresh water do not stay still. Let\u2019s pull them out of the bucket and share them out again, this time only among themselves.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Hielos', en:'Ice' }), L({ es:'69 de cada 100 L de agua dulce', en:'69 of every 100 L of fresh water' }), L({ es:'glaciares y casquetes', en:'glaciers and ice caps' })) +
      rcard(L({ es:'Subsuelo', en:'Underground' }), L({ es:'30 de cada 100 L de agua dulce', en:'30 of every 100 L of fresh water' }), L({ es:'acuíferos', en:'aquifers' })) +
      rcard(L({ es:'A la vista', en:'In plain sight' }), L({ es:'menos de 1 de cada 100 L de agua dulce', en:'less than 1 of every 100 L of fresh water' }), L({ es:'ríos, lagos y humedales', en:'rivers, lakes and wetlands' })) +
    '</div>' +
    '<div class="gw" id="w_dulce"></div>' +
    '<div class="callout"><p>' + L({
      es:'Por eso el agua dulce se considera un recurso limitado aunque el planeta se vea azul desde el espacio. Lo que está en juego no es la cantidad total de agua, sino la parte que de verdad se puede usar y el estado en que se encuentra.',
      en:'That is why fresh water is considered a limited resource even though the planet looks blue from space. What is at stake is not the total amount of water, but the part that can really be used and the condition it is in.'
    }) + '</p></div>'
  );
  w1(rng, document.getElementById('w_reparto'));
  w1b(rng, document.getElementById('w_dulce'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 :: ríos y vertientes ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Los ríos y las tres vertientes de México', en:'Rivers and the three slopes of Mexico' }),
    '<p>' + L({
      es:'Un río nace en una parte alta, va recibiendo afluentes y termina en una desembocadura. El relieve manda: el agua siempre baja. En México las dos sierras madre funcionan como techos que reparten el escurrimiento hacia tres destinos distintos, y por eso los ríos del país se agrupan en tres vertientes.',
      en:'A river is born in a high area, picks up tributaries along the way and ends at a mouth. Relief is in charge: water always goes down. In Mexico the two Sierra Madre ranges work as roofs that share out the runoff towards three different destinations, and that is why the rivers of the country are grouped into three slopes.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Vertiente del Pacífico', en:'Pacific slope' }), L({ es:'hacia el oeste', en:'towards the west' }), L({ es:'Yaqui, Fuerte, Balsas, Lerma Santiago', en:'Yaqui, Fuerte, Balsas, Lerma Santiago' })) +
      rcard(L({ es:'Vertiente del Golfo y el Caribe', en:'Gulf and Caribbean slope' }), L({ es:'hacia el este', en:'towards the east' }), L({ es:'Bravo, Pánuco, Papaloapan, Grijalva, Usumacinta', en:'Bravo, Panuco, Papaloapan, Grijalva, Usumacinta' })) +
      rcard(L({ es:'Vertiente interior', en:'Interior slope' }), L({ es:'sin salida al mar', en:'no outlet to the sea' }), L({ es:'Nazas, Aguanaval, Casas Grandes', en:'Nazas, Aguanaval, Casas Grandes' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La vertiente del Golfo y el Caribe recibe mucha más lluvia, así que ahí corren los ríos más caudalosos del país, como el Grijalva y el Usumacinta. En cambio el norte tiene ríos escasos y algunos ni siquiera alcanzan el mar: se quedan en cuencas cerradas.',
      en:'The Gulf and Caribbean slope receives much more rain, so the rivers with the largest flow in the country run there, such as the Grijalva and the Usumacinta. The north, in contrast, has few rivers and some never even reach the sea: they stay in closed basins.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_vertientes'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 :: lagos y humedales ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Lagos, lagunas y humedales', en:'Lakes, lagoons and wetlands' }),
    '<p>' + L({
      es:'Un lago es agua acumulada en una depresión del terreno. Recibe lluvia, ríos y aportes del subsuelo, y pierde agua por evaporación y por lo que se extrae para las ciudades y los cultivos. Su nivel es una resta constante: si entra más de lo que sale, sube; si sale más de lo que entra, baja. El lago de Chapala es el mayor del país; Cuitzeo, Pátzcuaro y Catemaco también son conocidos. Las lagunas costeras, como la de Términos, se comunican con el mar.',
      en:'A lake is water gathered in a hollow of the land. It receives rain, rivers and contributions from underground, and it loses water through evaporation and through what is taken out for cities and crops. Its level is a constant subtraction: if more comes in than goes out, it rises; if more goes out than comes in, it falls. Lake Chapala is the largest in the country; Cuitzeo, Patzcuaro and Catemaco are also well known. Coastal lagoons, such as Terminos, connect with the sea.'
    }) + '</p>' +
    '<p>' + L({
      es:'Los humedales son terrenos que permanecen inundados o empapados buena parte del año: pantanos, manglares, marismas y llanuras que se inundan cuando crece el río. Los Pantanos de Centla en Tabasco y las Marismas Nacionales en la costa del Pacífico son ejemplos enormes. Retienen sedimentos, filtran el agua, amortiguan las crecidas, frenan el oleaje de las tormentas y sirven de criadero para peces, camarones y aves.',
      en:'Wetlands are areas that stay flooded or soaked for a good part of the year: swamps, mangroves, marshes and plains that flood when the river rises. The Centla Swamps in Tabasco and the Marismas Nacionales on the Pacific coast are huge examples. They hold back sediment, filter water, cushion floods, slow down storm waves and act as nurseries for fish, shrimp and birds.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Un humedal parece un terreno desaprovechado hasta que se rellena. Entonces aparecen las inundaciones que antes absorbía, el agua turbia que antes filtraba y la pesca que antes se criaba ahí.',
      en:'A wetland looks like wasted land until it is filled in. Then come the floods it used to absorb, the murky water it used to filter and the catch that used to be raised there.'
    }) + '</p></div>'
  );
  w3(rng, widgetHost(s3, 'w_lago'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 :: aguas subterráneas ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'El agua que no se ve: acuíferos y recarga', en:'The water you cannot see: aquifers and recharge' }),
    '<p>' + L({
      es:'Cuando llueve, una parte del agua escurre por la superficie y otra se infiltra. La que se infiltra baja entre los poros y las grietas de las rocas hasta formar un acuífero, una capa saturada de agua bajo tierra. La superficie superior de esa capa es el nivel freático, y se alcanza con pozos y norias. En México hay alrededor de seiscientos cincuenta acuíferos, y de ellos sale buena parte del agua que llega a las casas y a las parcelas.',
      en:'When it rains, part of the water runs off on the surface and part soaks in. The water that soaks in goes down through the pores and cracks of the rocks until it forms an aquifer, a layer underground saturated with water. The upper surface of that layer is the water table, and it is reached with wells. Mexico has around six hundred and fifty aquifers, and a large share of the water reaching homes and fields comes from them.'
    }) + '</p>' +
    '<p>' + L({
      es:'Cada año el acuífero recibe una recarga, que es lo que logra infiltrarse. Si se extrae más de lo que se recarga, se produce una sobreexplotación: el nivel freático baja, los pozos se secan, el terreno puede hundirse y cerca de la costa el agua salada entra en el acuífero. Cuánto se infiltra depende de la cubierta del suelo y de la pendiente: un bosque en terreno plano deja pasar mucha más agua que una superficie pavimentada en una ladera.',
      en:'Every year the aquifer receives a recharge, which is what manages to soak in. If more is taken out than is recharged, overexploitation happens: the water table drops, wells dry up, the ground can sink and near the coast salt water enters the aquifer. How much soaks in depends on the land cover and on the slope: a forest on flat ground lets far more water through than a paved surface on a hillside.'
    }) + '</p>'
  );
  w4(rng, widgetHost(s4, 'w_infiltra'));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 :: cuencas hidrográficas ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: Reparte los 100 litros (dos versiones, una sola escala cada una)
   ══════════════════════════════════════════════════════════════════════════ */
function buildShareWidget(rng, host, hdr, mini, pool, doneMsg){
  var R = shuffle(pool, rng);
  var rd = 0, tries = 0, cur = ri(rng, 12, 88), locked = false, done = false;

  var cells = '';
  for (var ci = 0; ci < 100; ci++) cells += '<div class="wg-cell" data-c="' + ci + '"></div>';
  host.innerHTML =
    '<div class="gw-h">' + L(hdr) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L(mini) + '</div>' +
    '<div class="wg-cells" data-r="cells">' + cells + '</div>' +
    '<div class="gw-num" data-r="num"></div>' +
    '<input class="gw-range" type="range" min="0" max="100" step="1" data-r="sl">' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elN = host.querySelector('[data-r="num"]'),
      elS = host.querySelector('[data-r="sl"]'),
      elK = host.querySelector('[data-r="chk"]'),
      cellEls = host.querySelectorAll('.wg-cell');

  function draw(){
    elQ.innerHTML = L(R[rd].q);
    elS.value = cur;
    elN.textContent = cur + ' / 100 ' + L({ es:'litros', en:'litres' });
    for (var i = 0; i < 100; i++) cellEls[i].className = 'wg-cell' + (i < cur ? ' on' : '');
  }
  function advance(){
    rd++;
    if (rd >= R.length){
      done = true; elS.disabled = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L(doneMsg));
      return;
    }
    locked = false; tries = 0; cur = ri(rng, 12, 88);
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otra pregunta. Vuelve a repartir los litros.', en:'Another question. Share out the litres again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = (rd === R.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente pregunta', en:'Next question' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = cur - R[rd].t;
    if (Math.abs(d) <= R[rd].tol){ close('good', L(R[rd].why)); return; }
    tries++;
    if (tries >= 3){
      cur = R[rd].t;
      close('warm', L({ es:'Este es el reparto real. ', en:'This is the real share out. ' }) + L(R[rd].why));
      return;
    }
    var far = Math.abs(d) > 40 ? L({ es:'muchísimos', en:'far too many' }) : (Math.abs(d) > 15 ? L({ es:'bastantes', en:'quite a few' }) : L({ es:'unos pocos', en:'a few' }));
    say(host, 'miss', L({
      es:'Pintaste ' + cur + ' litros: son ' + far + ' ' + (d > 0 ? 'de más' : 'de menos') + '. Mueve la barra hacia la ' + (d > 0 ? 'izquierda' : 'derecha') + ' y comprueba otra vez.',
      en:'You filled in ' + cur + ' litres: that is ' + far + ' ' + (d > 0 ? 'too many' : 'too few') + '. Move the bar to the ' + (d > 0 ? 'left' : 'right') + ' and check again.'
    }));
    draw();
  }

  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = cur; return; }
    cur = parseInt(elS.value, 10);
    draw();
  });
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Lee la pregunta, pinta los litros y comprueba.', en:'Read the question, fill in the litres and check.' }));
  draw();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: Manda cada río a su vertiente
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var LB = [
    { es:'Vertiente del Pacífico', en:'Pacific slope' },
    { es:'Vertiente del Golfo y el Caribe', en:'Gulf and Caribbean slope' },
    { es:'Vertiente interior', en:'Interior slope' }
  ];
  var GOLFO = [
    { n:'Bravo', v:1, why:{ es:'baja por la frontera norte y desemboca en el Golfo de México', en:'runs along the northern border and flows into the Gulf of Mexico' } },
    { n:'Pánuco', v:1, why:{ es:'cruza la Huasteca y sale al mar junto a Tampico', en:'crosses the Huasteca and reaches the sea beside Tampico' } },
    { n:'Papaloapan', v:1, why:{ es:'recoge las aguas del sur de Veracruz y sale al Golfo', en:'gathers the waters of southern Veracruz and reaches the Gulf' } },
    { n:'Grijalva', v:1, why:{ es:'nace en Chiapas y desemboca en la costa de Tabasco', en:'starts in Chiapas and reaches the coast of Tabasco' } },
    { n:'Usumacinta', v:1, why:{ es:'es el más caudaloso del país y termina en la llanura de Tabasco', en:'has the largest flow in the country and ends in the Tabasco plain' } },
    { n:'Coatzacoalcos', v:1, why:{ es:'atraviesa el istmo hacia el norte y sale al Golfo', en:'crosses the isthmus northwards and reaches the Gulf' } }
  ];
  var PACIF = [
    { n:'Yaqui', v:0, why:{ es:'baja de la Sierra Madre Occidental hacia la costa de Sonora', en:'comes down from the Sierra Madre Occidental to the coast of Sonora' } },
    { n:'Balsas', v:0, why:{ es:'recorre el sur del país y desemboca frente a Michoacán y Guerrero', en:'crosses the south of the country and reaches the sea off Michoacan and Guerrero' } },
    { n:'Lerma Santiago', v:0, why:{ es:'cruza el centro, pasa por Chapala y sale al mar en Nayarit', en:'crosses the centre, passes through Chapala and reaches the sea in Nayarit' } },
    { n:'Fuerte', v:0, why:{ es:'desciende hacia la costa de Sinaloa', en:'descends towards the coast of Sinaloa' } },
    { n:'Culiacán', v:0, why:{ es:'riega el valle de Sinaloa y llega al mar por el occidente', en:'irrigates the Sinaloa valley and reaches the sea in the west' } },
    { n:'Ameca', v:0, why:{ es:'separa Jalisco de Nayarit y desemboca en la bahía de Banderas', en:'separates Jalisco from Nayarit and flows into Banderas bay' } }
  ];
  var INTER = [
    { n:'Nazas', v:2, why:{ es:'termina en la laguna de Mayrán y nunca alcanza el mar', en:'ends in the Mayran lagoon and never reaches the sea' } },
    { n:'Aguanaval', v:2, why:{ es:'se pierde en la cuenca cerrada de la comarca lagunera', en:'is lost in the closed basin of the Laguna region' } },
    { n:'Casas Grandes', v:2, why:{ es:'desagua en las lagunas del desierto chihuahuense', en:'drains into the lagoons of the Chihuahuan desert' } }
  ];
  var G = shuffle(GOLFO, rng), P = shuffle(PACIF, rng), I = shuffle(INTER, rng);
  var R = [];
  for (var r = 0; r < 3; r++) R.push(shuffle([G[r], G[r + 3], P[r], I[r]], rng));
  var rd = 0, tries = 0, locked = false, done = false, cur = [];

  function seed(){
    cur = [];
    for (var i = 0; i < R[rd].length; i++) cur.push((R[rd][i].v + 1 + ri(rng, 0, 1)) % 3);
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Manda cada río a su vertiente', en:'Send each river to its slope' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'¿Hacia dónde va el agua de estos ríos?', en:'Where does the water of these rivers go?' }) + '</div>' +
    '<div class="gw-mini">' + L({ es:'Toca un río para cambiarle la vertiente. Cuando los cuatro te convenzan, comprueba.', en:'Tap a river to change its slope. When all four convince you, check.' }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="tiles"]'),
      elK = host.querySelector('[data-r="chk"]');

  function draw(){
    elT.innerHTML = R[rd].map(function(it, i){
      var cls = ['vA', 'vB', 'vC'][cur[i]];

             '><span class="gw-key">' + it.n + '</span><span class="gw-sub">' + L(LB[cur[i]]) + '</span></button>';
    }).join('');
  }
  function firstWrong(){
    for (var i = 0; i < R[rd].length; i++) if (cur[i] !== R[rd][i].v) return i;
    return -1;
  }
  function advance(){
    rd++;
    if (rd >= 3){

      }));
      return;

    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otros cuatro ríos. Vuelve a repartirlos.', en:'Four more rivers. Sort them again.' }));

    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (firstWrong() === -1){
      close('good', L({
        es:'Los cuatro quedaron en su vertiente. Cada río sigue la bajada del relieve hasta su desembocadura.',
        en:'All four ended up in their slope. Each river follows the descent of the relief down to its mouth.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      for (var i = 0; i < R[rd].length; i++) cur[i] = R[rd][i].v;
      close('warm', L({ es:'Este es el reparto correcto de los cuatro ríos.', en:'This is the correct sorting of the four rivers.' }));

    }
    var w = firstWrong();
    say(host, 'miss', L({
      es:'El río ' + R[rd][w].n + ' todavía no está en su sitio: ' + L(R[rd][w].why) + '. Tócalo para cambiarlo.',
      en:'The river ' + R[rd][w].n + ' is not in its place yet: ' + L(R[rd][w].why) + '. Tap it to change it.'
    }));
    draw();
  }

  elT.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    var i = parseInt(b.getAttribute('data-k'), 10);
    cur[i] = (cur[i] + 1) % 3;
    draw();
  });
  elK.addEventListener('click', check);
  seed();
  say(host, '', L({ es:'Toca los ríos hasta darles su vertiente y comprueba.', en:'Tap the rivers to give them their slope and check.' }));

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: El nivel del lago (entradas menos salidas)
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var rd = 0, tries = 0, locked = false, done = false, D = null, cur = 0;

  function build(){
    var d, sol;
    for (var g = 0; g < 60; g++){
      d = { lluvia:10 * ri(rng, 2, 6), rios:10 * ri(rng, 2, 6), evap:10 * ri(rng, 2, 5), meta:pk(rng, [0, 10, 20]) };
      sol = d.lluvia + d.rios - d.evap - d.meta;
      if (sol >= 10 && sol <= 90 && sol % 5 === 0) { d.sol = sol; return d; }
    }
    d.sol = Math.max(10, Math.min(90, sol));
    return d;
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Ajusta el lago', en:'Set the lake' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini" data-r="dat"></div>' +
    '<div class="lk"><div class="lk-water" data-r="water"></div><div class="lk-mark" data-r="mark"><span class="lk-tag">' + L({ es:'meta', en:'goal' }) + '</span></div></div>' +
    '<div class="gw-num" data-r="bal"></div>' +
    '<div class="gw-lbl">' + L({ es:'Agua que se extrae este mes', en:'Water taken out this month' }) + '</div>' +
    '<input class="gw-range" type="range" min="0" max="100" step="5" data-r="sl">' +
    '<div class="gw-row"><span class="gw-val" data-r="live"></span><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elD = host.querySelector('[data-r="dat"]'),
      elW = host.querySelector('[data-r="water"]'),
      elM = host.querySelector('[data-r="mark"]'),
      elB = host.querySelector('[data-r="bal"]'),
      elS = host.querySelector('[data-r="sl"]'),
      elL = host.querySelector('[data-r="live"]'),
      elK = host.querySelector('[data-r="chk"]');

  function bal(){ return D.lluvia + D.rios - D.evap - cur; }
  function pctOf(v){ return Math.max(6, Math.min(96, 46 + v * 1.6)); }
  function draw(){
    elQ.innerHTML = D.meta === 0
      ? L({ es:'Mantén el nivel del lago exactamente igual que el mes pasado.', en:'Keep the level of the lake exactly as it was last month.' })
      : L({ es:'Consigue que el lago gane ' + D.meta + ' hm³ este mes.', en:'Make the lake gain ' + D.meta + ' hm³ this month.' });
    elD.innerHTML = L({
      es:'Entra por lluvia: ' + D.lluvia + ' hm³. Entra por los ríos: ' + D.rios + ' hm³. Se evapora: ' + D.evap + ' hm³.',
      en:'Rain brings in: ' + D.lluvia + ' hm³. Rivers bring in: ' + D.rios + ' hm³. Evaporation takes: ' + D.evap + ' hm³.'
    });
    elS.value = cur;
    var b = bal();
    elW.style.height = pctOf(b) + '%';
    elM.style.bottom = pctOf(D.meta) + '%';
    elB.textContent = (b > 0 ? '+' : '') + b + ' hm³';
    elL.textContent = cur + ' hm³';
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true; elS.disabled = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Tres meses ajustados. El nivel de un lago es siempre una resta: lo que entra menos lo que sale, y la extracción es la parte que decidimos las personas.',
        en:'Three months adjusted. The level of a lake is always a subtraction: what comes in minus what goes out, and the water taken out is the part we people decide.'
      }));
      return;
    }
    locked = false; tries = 0; D = build(); cur = 5 * ri(rng, 0, 20);
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Nuevo mes, otros datos. Vuelve a ajustar la extracción.', en:'New month, different figures. Adjust the water taken out again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente mes', en:'Next month' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var b = bal();
    if (b === D.meta){
      close('good', L({
        es:'Justo. Con ' + cur + ' hm³ de extracción el lago queda como pedía la meta, porque ' + D.lluvia + ' más ' + D.rios + ' menos ' + D.evap + ' menos ' + cur + ' da ' + D.meta + '.',
        en:'Exactly. With ' + cur + ' hm³ taken out the lake ends as the goal asked, because ' + D.lluvia + ' plus ' + D.rios + ' minus ' + D.evap + ' minus ' + cur + ' gives ' + D.meta + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = D.sol;
      close('warm', L({
        es:'La extracción que cumple la meta es de ' + D.sol + ' hm³: es lo que sobra después de restar la evaporación y apartar la meta.',
        en:'The amount to take out that meets the goal is ' + D.sol + ' hm³: it is what is left after subtracting evaporation and setting the goal aside.'
      }));
      return;
    }
    say(host, 'miss', L({
      es: b < D.meta
        ? 'El lago se queda en ' + b + ' hm³ y la meta es ' + D.meta + ': estás sacando demasiada agua, extrae menos.'
        : 'El lago llega a ' + b + ' hm³ y la meta es ' + D.meta + ': está entrando más de lo necesario, puedes extraer más.',
      en: b < D.meta
        ? 'The lake stops at ' + b + ' hm³ and the goal is ' + D.meta + ': you are taking out too much water, take out less.'
        : 'The lake reaches ' + b + ' hm³ and the goal is ' + D.meta + ': more is coming in than needed, you can take out more.'
    }));
    draw();
  }

  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = cur; return; }
    cur = parseInt(elS.value, 10);
    draw();
  });
  elK.addEventListener('click', check);
  D = build(); cur = 5 * ri(rng, 0, 20);
  say(host, '', L({ es:'Mueve la extracción y observa cómo responde el nivel del lago.', en:'Move the amount taken out and watch how the lake level responds.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: ¿Cuánta lluvia se infiltra hasta el acuífero?
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var COB = [
    { v:60, n:{ es:'Bosque', en:'Forest' }, s:{ es:'raíces y hojarasca', en:'roots and leaf litter' } },
    { v:45, n:{ es:'Pastizal', en:'Grassland' }, s:{ es:'pasto continuo', en:'continuous grass' } },
    { v:30, n:{ es:'Cultivo', en:'Cropland' }, s:{ es:'suelo removido', en:'tilled soil' } },
    { v:10, n:{ es:'Pavimento', en:'Pavement' }, s:{ es:'superficie sellada', en:'sealed surface' } }
  ];
  var PEN = [
    { v:15, n:{ es:'Terreno plano', en:'Flat ground' } },
    { v:0,  n:{ es:'Pendiente media', en:'Medium slope' } },
    { v:-15, n:{ es:'Ladera fuerte', en:'Steep hillside' } }
  ];
  var METAS = shuffle([75, 60, 45, 30, 25], rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var c = ri(rng, 0, 3), p = ri(rng, 0, 2);

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Recarga el acuífero', en:'Recharge the aquifer' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({ es:'Elige la cubierta del suelo y la inclinación del terreno. La barra muestra cuánta lluvia se infiltra.', en:'Choose the land cover and the tilt of the ground. The bar shows how much rain soaks in.' }) + '</div>' +
    '<div class="gw-lbl">' + L({ es:'Cubierta del suelo', en:'Land cover' }) + '</div>' +
    '<div class="gw-grid" data-r="cob"></div>' +
    '<div class="gw-lbl">' + L({ es:'Inclinación', en:'Tilt' }) + '</div>' +
    '<div class="gw-grid" data-r="pen"></div>' +
    '<div class="bar"><div class="bar-fill" data-r="fill"></div><div class="bar-goal" data-r="goal"></div></div>' +
    '<div class="gw-num" data-r="num"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elC = host.querySelector('[data-r="cob"]'),
      elP = host.querySelector('[data-r="pen"]'),
      elF = host.querySelector('[data-r="fill"]'),
      elG = host.querySelector('[data-r="goal"]'),
      elN = host.querySelector('[data-r="num"]'),
      elK = host.querySelector('[data-r="chk"]');

  function val(){ return Math.max(0, Math.min(100, COB[c].v + PEN[p].v)); }
  function draw(){
    elQ.innerHTML = L({
      es:'Consigue que se infiltre exactamente el ' + METAS[rd] + ' por ciento de la lluvia.',
      en:'Get exactly ' + METAS[rd] + ' per cent of the rain to soak in.'
    });
    elC.innerHTML = COB.map(function(o, i){
      return '<button class="gw-tile' + (i === c ? ' on' : '') + '" data-c="' + i + '"' + (locked || done ? ' disabled' : '') +
             '><span class="gw-key">' + L(o.n) + '</span><span class="gw-sub">' + L(o.s) + '</span></button>';
    }).join('');
    elP.innerHTML = PEN.map(function(o, i){
      return '<button class="gw-tile' + (i === p ? ' on' : '') + '" data-p="' + i + '"' + (locked || done ? ' disabled' : '') +
             '><span class="gw-key">' + L(o.n) + '</span></button>';
    }).join('');
    elF.style.width = val() + '%';
    elG.style.left = METAS[rd] + '%';
    elN.textContent = L({ es:'Se infiltra ', en:'Soaking in ' }) + val() + '%';
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Ya viste de qué depende la recarga: cuanto más frena el suelo al agua y menos inclinado está el terreno, más lluvia llega al acuífero en lugar de escurrirse.',
        en:'Now you have seen what recharge depends on: the more the ground slows the water and the less tilted the land is, the more rain reaches the aquifer instead of running off.'
      }));
      return;
    }
    locked = false; tries = 0; c = ri(rng, 0, 3); p = ri(rng, 0, 2);
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Nueva meta de recarga. Prueba otra combinación.', en:'New recharge goal. Try another combination.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente meta', en:'Next goal' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function solve(){
    for (var i = 0; i < COB.length; i++)
      for (var j = 0; j < PEN.length; j++)
        if (Math.max(0, Math.min(100, COB[i].v + PEN[j].v)) === METAS[rd]) return [i, j];
    return [c, p];
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (val() === METAS[rd]){
      close('good', L({
        es:'Con ' + L(COB[c].n).toLowerCase() + ' en ' + L(PEN[p].n).toLowerCase() + ' se infiltra el ' + val() + ' por ciento y el acuífero recibe su recarga.',
        en:'With ' + L(COB[c].n).toLowerCase() + ' on ' + L(PEN[p].n).toLowerCase() + ' the water soaking in is ' + val() + ' per cent and the aquifer gets its recharge.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      var s = solve(); c = s[0]; p = s[1];
      close('warm', L({
        es:'Esta combinación llega a la meta: ' + L(COB[c].n).toLowerCase() + ' en ' + L(PEN[p].n).toLowerCase() + '.',
        en:'This combination reaches the goal: ' + L(COB[c].n).toLowerCase() + ' on ' + L(PEN[p].n).toLowerCase() + '.'
      }));
      return;
    }
    var lo = val() < METAS[rd];
    say(host, 'miss', L({
      es:'Se infiltra ' + val() + '% y la meta es ' + METAS[rd] + '%. ' + (lo
        ? 'El agua se está yendo por la superficie: prueba una cubierta que la frene más o un terreno menos inclinado.'
        : 'Está entrando demasiada: prueba una cubierta que retenga menos o un terreno más inclinado.'),
      en:'Soaking in is ' + val() + '% and the goal is ' + METAS[rd] + '%. ' + (lo
        ? 'The water is leaving over the surface: try a cover that slows it more or less tilted ground.'
        : 'Too much is going in: try a cover that holds less or more tilted ground.')
    }));
    draw();
  }

  elC.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-c]');
    if (!b || locked || done) return;
    c = parseInt(b.getAttribute('data-c'), 10);
    draw();
  });
  elP.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-p]');
    if (!b || locked || done) return;
    p = parseInt(b.getAttribute('data-p'), 10);
    draw();
  });
  elK.addEventListener('click', check);
  say(host, '', L({ es:'Combina cubierta e inclinación hasta alcanzar la meta.', en:'Combine cover and tilt until you reach the goal.' }));
  draw();
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: Encuentra el parteaguas
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var PAIRS = shuffle([
    [{ es:'río Verde', en:'Verde river' }, { es:'río Salado', en:'Salado river' }],
    [{ es:'río Azul', en:'Azul river' }, { es:'río Hondo', en:'Hondo river' }],
    [{ es:'arroyo del Molino', en:'Molino stream' }, { es:'arroyo de la Cueva', en:'Cueva stream' }],
    [{ es:'río Chico', en:'Chico river' }, { es:'río Grande', en:'Grande river' }]
  ], rng).slice(0, 3);
  var N = 21;
  var rd = 0, tries = 0, locked = false, done = false, D = null, cur = 0;

  function build(){
    var k = ri(rng, 6, 14), h = [], i;
    h[k] = 92;
    for (i = k - 1; i >= 0; i--) h[i] = h[i + 1] - ri(rng, 3, 6);
    for (i = k + 1; i < N; i++) h[i] = h[i - 1] - ri(rng, 3, 6);
    for (i = 0; i < N; i++) h[i] = Math.max(8, h[i]);
    return { k:k, h:h, izq:PAIRS[rd][0], der:PAIRS[rd][1] };
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Encuentra el parteaguas', en:'Find the divide' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'¿En qué punto del cerro se separan las dos cuencas?', en:'At which point of the hill do the two basins separate?' }) + '</div>' +
    '<div class="gw-mini">' + L({ es:'Coloca la gota y observa hacia qué río corre. El parteaguas es el punto donde deja de correr hacia uno para correr hacia el otro.', en:'Place the drop and watch which river it runs to. The divide is the point where it stops running to one and starts running to the other.' }) + '</div>' +
    '<div class="prof" data-r="prof"></div>' +
    '<div class="prof-lbl"><span data-r="li"></span><span data-r="ld"></span></div>' +
    '<div class="gw-num" data-r="num"></div>' +
    '<input class="gw-range" type="range" min="0" max="20" step="1" data-r="sl">' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elPr = host.querySelector('[data-r="prof"]'),
      elLi = host.querySelector('[data-r="li"]'),
      elLd = host.querySelector('[data-r="ld"]'),
      elN  = host.querySelector('[data-r="num"]'),
      elS  = host.querySelector('[data-r="sl"]'),
      elK  = host.querySelector('[data-r="chk"]');

  function draw(){
    var bars = '', i;
    for (i = 0; i < N; i++){
      var cls = i === cur ? 'here' : (i < D.k ? 'wl' : (i > D.k ? 'wr' : 'wl'));
      bars += '<div class="prof-b ' + cls + '" style="height:' + D.h[i] + '%"></div>';
    }
    elPr.innerHTML = bars;
    elLi.textContent = L({ es:'hacia el ', en:'towards the ' }) + L(D.izq);
    elLd.textContent = L({ es:'hacia el ', en:'towards the ' }) + L(D.der);
    elS.value = cur;
    var dest = cur < D.k ? L(D.izq) : (cur > D.k ? L(D.der) : L({ es:'los dos lados', en:'both sides' }));
    elN.innerHTML = L({ es:'Altura ', en:'Height ' }) + D.h[cur] + L({ es:' · el agua corre hacia ', en:' · the water runs towards ' }) + dest;
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true; elS.disabled = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Tres parteaguas encontrados. Esa línea de cumbres es el límite real de una cuenca, y por eso una cuenca no coincide con los límites de un municipio ni de un estado.',
        en:'Three divides found. That line of summits is the real limit of a basin, and that is why a basin does not match the limits of a municipality or a state.'
      }));
      return;
    }
    locked = false; tries = 0; D = build(); cur = ri(rng, 0, N - 1);
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otro cerro entre otras dos cuencas. Busca su parteaguas.', en:'Another hill between two other basins. Look for its divide.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente cerro', en:'Next hill' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (cur === D.k){
      close('good', L({
        es:'Ahí está: es el punto más alto, con ' + D.h[cur] + ' de altura. Una gota que caiga a la izquierda baja al ' + L(D.izq) + ' y una que caiga a la derecha baja al ' + L(D.der) + '.',
        en:'There it is: it is the highest point, at a height of ' + D.h[cur] + '. A drop falling to the left goes down to the ' + L(D.izq) + ' and one falling to the right goes down to the ' + L(D.der) + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = D.k;
      close('warm', L({
        es:'El parteaguas es este punto, el más alto del perfil. Desde aquí el agua se reparte hacia las dos cuencas.',
        en:'The divide is this point, the highest of the profile. From here the water is shared between the two basins.'
      }));
      return;
    }
    var izq = cur < D.k;
    say(host, 'miss', L({
      es:'Desde ahí la gota todavía baja hacia el ' + L(izq ? D.izq : D.der) + ', así que sigues dentro de esa cuenca. Muévete hacia la ' + (izq ? 'derecha' : 'izquierda') + ' y busca el punto más alto.',
      en:'From there the drop still goes down to the ' + L(izq ? D.izq : D.der) + ', so you are still inside that basin. Move to the ' + (izq ? 'right' : 'left') + ' and look for the highest point.'
    }));
    draw();
  }

  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = cur; return; }
    cur = parseInt(elS.value, 10);
    draw();
  });
  elK.addEventListener('click', check);
  D = build(); cur = ri(rng, 0, N - 1);
  say(host, '', L({ es:'Mueve la gota por el perfil del cerro y comprueba dónde está el parteaguas.', en:'Move the drop along the profile of the hill and check where the divide is.' }));
  draw();
}

  var elQ = host.querySelector('[data-r="q"]'),

  function draw(){
