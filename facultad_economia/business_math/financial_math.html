  var p9b1 = Math.round(p9a * 0.50 / 1000) * 1000;
  var p9b2 = Math.round(p9a * 0.62 / 1000) * 1000;
  var p10P = pick([300000, 420000, 540000], rng);     // item 10
  var p10j = pick([0.18, 0.24], rng);
  var p10n = pick([30, 36, 48], rng);
  var p10k = pick([6, 12, 18], rng);

  /* ═══════════════════════ CONCEPT 1 ═══════════════════════ */
  var c1M    = fvCompound(c1P, c1r, c1n);
  var c1S    = fvSimple(c1P, c1r, c1n);
  var c1yr1  = c1P * c1r;
  var c1yr2  = c1P * (1 + c1r) * c1r;
  var c1dbl  = doubleYears(c1r);

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>El dinero tiene fecha, y por eso tiene precio</h2>' +
      '<p>Todo lo que sigue en este tema descansa sobre una sola idea: un peso de hoy y un peso de dentro de un año no son la misma cosa. El de hoy puede colocarse, prestarse o invertirse, y por eso vale más. El <strong>interés</strong> es exactamente el precio de esa diferencia, es decir la renta que se cobra por dejar que otro use un dinero durante un plazo. De ahí se desprende la regla que gobierna todos los ejercicios de este tema y que conviene aprender antes que cualquier fórmula: <strong>dos cantidades solo pueden compararse o sumarse si están referidas a la misma fecha</strong>.</p>' +
      '<p>Hay dos maneras de cobrar esa renta. En el <strong>interés simple</strong> la renta de cada periodo se calcula siempre sobre el monto original, así que el interés del primer año y el del décimo son idénticos. Es el trato que aparece en documentos de corto plazo y en algunos préstamos entre particulares. En el <strong>interés compuesto</strong>, en cambio, la renta que no se retira se suma al capital y desde ese momento también genera renta. El saldo deja de crecer en línea recta y empieza a crecer multiplicándose.</p>' +
      '<p>El cambio matemático es preciso y vale la pena verlo con claridad. Con interés simple se suma la misma cantidad una y otra vez, lo que produce una recta. Con interés compuesto se multiplica repetidamente por un mismo factor, uno más la tasa, lo que produce una función <strong>exponencial</strong>. Al principio las dos curvas casi coinciden, y por eso la diferencia parece un detalle en plazos cortos; después se separan sin remedio, y por eso en plazos largos la diferencia deja de ser un detalle y se vuelve el asunto principal.</p>' +
      '<p>De la forma exponencial sale una consecuencia que sorprende a mucha gente: el tiempo que tarda un saldo en duplicarse <strong>no depende del monto</strong>, solo de la tasa. Un ahorrador que coloca una cantidad modesta y un fondo que coloca una fortuna tardan exactamente lo mismo en duplicar su dinero si les pagan la misma tasa. Y conviene recordar que esta mecánica no distingue entre ahorrar y deber: una tarjeta de crédito que no se liquida capitaliza a favor del banco con la misma curva con la que un fondo de retiro capitaliza a favor del ahorrador.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Interés simple</div><div class="rform">M = P·(1 + r·n)</div><div class="rnote">La renta siempre sobre el monto original.</div></div>' +
        '<div class="rcard"><div class="rname">Interés compuesto</div><div class="rform">M = P·(1 + i)<sup>n</sup></div><div class="rnote">Cada periodo multiplica al anterior.</div></div>' +
        '<div class="rcard"><div class="rname">Interés ganado</div><div class="rform">I = M − P</div><div class="rnote">El saldo final menos lo que se puso.</div></div>' +
        '<div class="rcard"><div class="rname">Duplicación</div><div class="rform">n = ' + frac('ln 2', 'ln(1 + i)') + '</div><div class="rnote">Solo la tasa decide el plazo.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una comercializadora de café en Colima cerró el año con ' + money(c1P) + ' de excedente de caja que no necesitará durante ' + intN(c1n) + ' años. Su banco le ofrece un pagaré que paga ' + pctS(c1r) + ' por ciento anual y que capitaliza los intereses cada año. La dirección quiere saber cuánto tendrá al final del plazo y cuánto perdería si en lugar de reinvertir retirara los intereses cada año.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se calcula el interés del primer año sobre el excedente colocado, que resulta ' + money(c1yr1) + '.<br>' +
      '<strong>Paso 2.</strong> Ese interés se queda adentro, de modo que el segundo año la tasa ya no corre sobre el monto original sino sobre el saldo acumulado, y el interés sube a ' + money(c1yr2) + '. Ese pequeño aumento es todo el fenómeno.<br>' +
      '<strong>Paso 3.</strong> Repetir la multiplicación ' + intN(c1n) + ' veces deja un saldo final de ' + money(c1M) + ', con intereses ganados por ' + money(c1M - c1P) + '.<br>' +
      '<strong>Paso 4.</strong> Si la empresa retirara los intereses cada año, cada uno valdría ' + money(c1yr1) + ' y el saldo final sería ' + money(c1S) + '.<br>' +
      '<strong>Lectura de negocio.</strong> La diferencia entre las dos políticas es de ' + money(c1M - c1S) + ', y no proviene de haber depositado un peso más: proviene solo de no haber tocado los intereses. Dos advertencias para la junta. La primera es que a esta tasa el excedente se duplicaría en ' + dec1(c1dbl) + ' años, cifra que depende de la tasa y no del monto, así que sirve como referencia rápida para cualquier propuesta que llegue. La segunda es que si la empresa tiene deuda de tarjeta corporativa a una tasa mayor que ' + pctS(c1r) + ' por ciento, esta inversión es una mala decisión aunque el pagaré sea seguro: pagar esa deuda rinde más y sin riesgo.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>Money carries a date, and that is why it carries a price</h2>' +
      '<p>Everything in this topic rests on a single idea: a peso today and a peso a year from now are not the same thing. Today one can be placed, lent or invested, and that is why it is worth more. <strong>Interest</strong> is exactly the price of that difference, the rent charged for letting somebody else use money for a term. From this comes the rule that governs every exercise in this topic and that is worth learning ahead of any formula: <strong>two amounts can only be compared or added when they refer to the same date</strong>.</p>' +
      '<p>There are two ways of charging that rent. Under <strong>simple interest</strong> the rent of every period is always computed on the original amount, so the interest of the first year and of the tenth are identical. It is the arrangement found in short term instruments and in some loans between private parties. Under <strong>compound interest</strong>, by contrast, the rent that is not withdrawn is added to the capital and from that moment it earns rent as well. The balance stops growing in a straight line and starts growing by multiplication.</p>' +
      '<p>The mathematical change is precise and worth seeing clearly. With simple interest the same amount is added over and over, which produces a straight line. With compound interest the balance is multiplied repeatedly by one and the same factor, one plus the rate, which produces an <strong>exponential</strong> function. At the start the two curves almost coincide, and that is why the difference looks like a detail over short terms; later they separate for good, and that is why over long terms the difference stops being a detail and becomes the main event.</p>' +
      '<p>Out of that exponential shape comes a consequence that surprises many people: the time a balance takes to double <strong>does not depend on the amount</strong>, only on the rate. A saver placing a modest sum and a fund placing a fortune take exactly the same time to double their money if they are paid the same rate. And it is worth remembering that this machinery does not tell saving from owing: a credit card left unpaid capitalizes in favour of the bank along the same curve a retirement fund capitalizes in favour of the saver.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Simple interest</div><div class="rform">M = P·(1 + r·n)</div><div class="rnote">Rent always on the original amount.</div></div>' +
        '<div class="rcard"><div class="rname">Compound interest</div><div class="rform">M = P·(1 + i)<sup>n</sup></div><div class="rnote">Each period multiplies the one before.</div></div>' +
        '<div class="rcard"><div class="rname">Interest earned</div><div class="rform">I = M − P</div><div class="rnote">The final balance less what was put in.</div></div>' +

      '<p>Un banco casi nunca capitaliza una sola vez al año. Cobra o abona cada mes, cada trimestre o cada quincena, y sin embargo anuncia una cifra anual. Esa cifra anunciada se llama <strong>tasa nominal</strong>, y no es una tasa que alguien pague en la práctica: es una etiqueta que hay que traducir antes de usarla. La traducción tiene dos pasos, y confundirlos es el error más caro de este tema.</p>' +

      '<div class="stag">Concepto 3</div>' +
      '<h2>Traer el futuro al presente para poder decidir</h2>' +
      '<p>Los dos conceptos anteriores empujaban una cantidad hacia adelante en el tiempo. Casi todas las decisiones de negocio piden lo contrario. Un cliente ofrece pagar después, un proveedor ofrece descuento por pagar antes, un proyecto promete flujos dentro de varios años: en todos esos casos hay cantidades con fecha futura que deben ponerse sobre la mesa de hoy para poder elegir. Esa operación se llama <strong>descontar</strong>, y el resultado es el <strong>valor presente</strong>.</p>' +
      '<p>Mecánicamente es la operación inversa de la capitalización. Si llevar un monto hacia el futuro consiste en multiplicarlo repetidamente por uno más la tasa, traerlo al presente consiste en dividirlo por ese mismo factor tantas veces como periodos falten. No hay una fórmula nueva que memorizar, sino la misma leída al revés, y esa lectura es la que convierte a las matemáticas financieras en una herramienta de decisión y no solo de cálculo.</p>' +
      '<p>La tasa que se usa para descontar merece atención aparte, porque no es un dato del papel sino de quien lo recibe. Se le llama <strong>tasa de descuento</strong> y representa lo que la empresa podría ganar con ese dinero si lo tuviera hoy, o lo que le cuesta conseguirlo. Por eso una misma promesa de pago vale distinto para dos empresas distintas: la que tiene mejores usos alternativos para su dinero descuenta más fuerte y valora menos cualquier cobro lejano. No es una discrepancia contable, es el reflejo de que el costo de esperar no es igual para todos.</p>' +
      '<p>Dos propiedades conviene tener presentes al leer resultados. La primera es que el descuento no es proporcional al plazo: el primer año de espera cuesta mucho más que el sexto, porque cada división actúa sobre un valor ya reducido. La segunda es la regla que abre todo el tema y que aquí se vuelve operativa: <strong>no se suman cantidades con fechas distintas</strong>. Un reporte que suma un cobro de hoy con uno de dentro de tres años está sumando unidades diferentes, y el error puede invertir por completo el orden entre dos ofertas.</p>' +

      '<div class="stag">Concept 3</div>' +
      '<h2>Bringing the future back to today in order to decide</h2>' +
      '<p>The two previous concepts pushed an amount forward in time. Almost every business decision asks for the opposite. A customer offers to pay later, a supplier offers a discount for paying earlier, a project promises cash flows several years out: in all of those cases there are amounts with future dates that have to be placed on the table of today before anything can be chosen. That operation is called <strong>discounting</strong>, and the result is <strong>present value</strong>.</p>' +
      '<p>Mechanically it is the inverse of capitalizing. If carrying an amount into the future means multiplying it repeatedly by one plus the rate, bringing it back to today means dividing it by that same factor as many times as there are periods left. There is no new formula to memorize, only the same one read backwards, and that reading is what turns financial mathematics into a decision tool rather than a calculation exercise.</p>' +
      '<p>The rate used to discount deserves separate attention, because it is not a fact printed on the paper but a fact about whoever receives it. It is called the <strong>discount rate</strong> and it stands for what the company could earn on that money if it held it today, or what it costs the company to raise it. That is why one and the same promise is worth different amounts to two different companies: the one with better alternative uses for its money discounts harder and values any distant collection less. It is not an accounting discrepancy, it reflects that the cost of waiting is not the same for everyone.</p>' +
      '<p>Two properties are worth keeping in mind when reading results. The first is that discounting is not proportional to the term: the first year of waiting costs far more than the sixth, because every division acts on an already reduced value. The second is the rule that opens the whole topic and that becomes operational here: <strong>amounts with different dates are not added</strong>. A report adding a collection from today to one due in three years is adding different units, and the error can completely reverse the ranking of two offers.</p>' +

    if (es) return '' +
      '<div class="stag">Concepto 4</div>' +
      '<h2>Muchos pagos iguales, y lo que esconde cada uno</h2>' +
      '<p>Hasta aquí se movió una cantidad sola. En la práctica el dinero casi siempre llega o sale en series: rentas mensuales, mensualidades de un crédito, aportaciones a un fondo. Una serie de pagos iguales, en fechas igualmente separadas y con la misma tasa a lo largo de todo el plazo, se llama <strong>anualidad</strong>, y valuarla no requiere nada nuevo: es descontar cada pago a su propia fecha y sumar los resultados, ahora sí legítimamente, porque una vez descontados todos están fechados hoy.</p>' +
      '<p>Sumar uno por uno es correcto pero lento, y por eso existe una expresión cerrada para esa suma. Lo importante no es la expresión sino lo que hace: convierte una serie de pagos futuros en <strong>un solo número de hoy</strong>. Con ese número se responden las dos preguntas que más se hacen en un banco. Cuánto vale hoy un plan de pagos, que es como se compara un arrendamiento contra una compra de contado. Y al revés, qué pago mensual liquida exactamente un préstamo, que es de donde sale la mensualidad de cualquier crédito.</p>' +
      '<p>Esa mensualidad esconde un reparto que cambia mes con mes y que conviene entender antes de firmar. Cada pago cubre primero el interés corrido sobre el saldo del periodo, y solo lo que sobra reduce la deuda. Como el saldo baja, el interés del mes siguiente es menor y la porción que abona a capital es mayor. Al principio casi todo el pago se va en intereses, y al final casi todo se va en capital. Esa tabla mes a mes se llama <strong>amortización</strong>.</p>' +
      '<p>De ahí salen dos consecuencias prácticas que corrigen intuiciones muy extendidas. La primera es que el saldo de un crédito no baja en línea recta, de modo que restar de la deuda los pagos ya hechos siempre subestima lo que el banco pedirá para liquidar: hay que valuar los pagos que faltan. La segunda es cómo se lee una oferta de crédito. Alargar el plazo baja la mensualidad, que es lo que el cliente ve, y sube el interés total, que es lo que no ve. Una mensualidad más pequeña casi nunca es un crédito más barato.</p>' +

        '<div class="rcard"><div class="rname">Mensualidad</div><div class="rform">A = ' + frac('P·i', '1 − (1 + i)<sup>−n</sup>') + '</div><div class="rnote">El pago que liquida el préstamo.</div></div>' +

      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una imprenta de Colima compra una máquina de ' + money(c4P) + ' con un crédito a ' + intN(c4n) + ' meses y una tasa anual de ' + pctS(c4j) + ' por ciento capitalizable cada mes. La dirección quiere la mensualidad, quiere saber cuánto del primer pago se va en intereses y quiere el costo total del financiamiento.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se lleva la tasa al periodo de los pagos: ' + pctS(c4j) + ' por ciento anual repartido entre doce meses deja ' + pct2(c4i) + ' mensual.<br>' +
      '<strong>Paso 2.</strong> Se busca el pago mensual cuyo valor presente, sumado a lo largo de los ' + intN(c4n) + ' meses, iguale exactamente el precio de la máquina. Ese pago es ' + money2(c4pmt) + '.<br>' +

    return '' +
      '<div class="stag">Concept 4</div>' +
      '<h2>Many equal payments, and what each one hides</h2>' +
      '<p>Up to here a single amount was moved. In practice money almost always arrives or leaves in series: monthly rents, loan instalments, contributions to a fund. A series of equal payments, at equally spaced dates and at the same rate throughout the term, is called an <strong>annuity</strong>, and valuing one requires nothing new: it is discounting every payment to its own date and adding the results, now legitimately, because once discounted they are all dated today.</p>' +
      '<p>Adding them one by one is correct but slow, which is why a closed expression for that sum exists. What matters is not the expression but what it does: it turns a series of future payments into <strong>a single figure dated today</strong>. With that figure the two questions most often asked in a bank are answered. What a payment plan is worth today, which is how a lease is compared against a cash purchase. And in reverse, what monthly payment exactly clears a loan, which is where the instalment on any credit comes from.</p>' +
      '<p>That instalment hides a split that changes month by month and that is worth understanding before signing. Every payment first covers the interest accrued on the balance of the period, and only what is left over reduces the debt. Since the balance falls, the interest of the following month is smaller and the portion paying off principal is larger. At the start almost the whole payment goes to interest, and at the end almost all of it goes to principal. That month by month table is called <strong>amortization</strong>.</p>' +

            en: 'What is being settled is not what was owed at the start but what still lies ahead. Think about what the bakery is buying from the bank: the right not to make the instalments that remain. That right is worth what those pending payments are worth today, each of them brought to today at the monthly rate.' },
    exp: { es: 'La tasa mensual es ' + pct2(s10i) + ' y la mensualidad es ' + money2(s10pmt) + '. Después de ' + intN(p10k) + ' pagos quedan ' + intN(p10n - p10k) + ' por delante, y el saldo para liquidar es lo que valen hoy esos pagos pendientes, es decir ' + money(s10bal) + '. La opción de ' + money(p10P - s10pmt * p10k) + ' resta del crédito original todo lo pagado, como si cada mensualidad hubiera bajado la deuda por completo, cuando buena parte de cada pago se fue en intereses: por eso queda muy por debajo del saldo real y es el error más caro de este tema. La de ' + money(p10P * (p10n - p10k) / p10n) + ' supone que la deuda baja en línea recta, en partes iguales por mes, lo que no ocurre en un crédito con pagos nivelados. Y la de ' + money(s10pmt * (p10n - p10k)) + ' suma las mensualidades que faltan sin descontarlas, cobrando hoy intereses que todavía no han corrido.',
           en: 'The monthly rate is ' + pct2(s10i) + ' and the instalment is ' + money2(s10pmt) + '. After ' + intN(p10k) + ' payments there are ' + intN(p10n - p10k) + ' still ahead, and the settlement balance is what those pending payments are worth today, that is ' + money(s10bal) + '. The option of ' + money(p10P - s10pmt * p10k) + ' subtracts everything paid from the original loan, as if every instalment had brought the debt down in full, when a good part of each payment went to interest: that is why it lands well below the real balance and it is the most expensive error in this topic. The one of ' + money(p10P * (p10n - p10k) / p10n) + ' assumes the debt falls in a straight line, in equal parts each month, which does not happen in a loan with level payments. And the one of ' + money(s10pmt * (p10n - p10k)) + ' adds the instalments still to come without discounting them, charging today for interest that has not yet accrued.' }
  };
  var d10 = mk(q10i, o10.correctIdx, true);
  problems.push({ i18n: d10.i18n, title: d10.title, questionText: d10.questionText, options: d10.options, correctIdx: d10.correctIdx, explanation: d10.explanation, hint: d10.hint, showWork: true, studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}

function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);
  set('lbl-name-el',  t('lbl-name'));
  set('lbl-group-el', t('lbl-group'));
  set('startBtn',     t('btn-start'));
  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));
  var ll = document.getElementById('logo-left');   if (ll) ll.alt = SCHOOL.logoLeftAlt;
  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.questionText;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

/* ════════════════════════════════════════════════════════════════════════
   PDF
   ════════════════════════════════════════════════════════════════════════ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/μ/g,'mu').replace(/σ/g,'sigma').replace(/α/g,'alpha').replace(/β/g,'beta')
      .replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/·/g,'*')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
