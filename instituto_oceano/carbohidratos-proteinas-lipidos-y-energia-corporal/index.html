<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carbohidratos, Proteínas, Lípidos y Energía Corporal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Carbohidratos, Proteínas, Lípidos y Energía Corporal</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Carbohidratos, Proteínas, Lípidos y Energía Corporal</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c6cb4', primaryDark:'#032f50', primaryBg:'#e5f0f8',
  accent:'#9ccce4', accentBg:'#e3f0f7',
  darkPrimary:'#3191d8', darkPrimaryDark:'#64b7f6', darkPrimaryBg:'#052741',

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');

  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });

      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'qui3_t09_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'qui3_t09_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('qui3_t09_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function vpick(rng, list){ return list[Math.floor(rng() * list.length)]; }
function uniq4(a){ for (var i = 0; i < a.length; i++) for (var j = i + 1; j < a.length; j++) if (a[i] === a[j]) return false; return true; }
function uniqOpts(o){ return uniq4(o.es) && uniq4(o.en); }
function kc(n){ return { es: n + ' kcal', en: n + ' kcal' }; }
function pct(n){ return { es: n + ' %', en: n + ' %' }; }
function minu(n){ return { es: n + ' minutos', en: n + ' minutes' }; }
function pairEs(list){ return list.map(function(x){ return x.es; }); }
function pairEn(list){ return list.map(function(x){ return x.en; }); }

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: mesa de la etiqueta nutrimental
   El estudiante mueve tres deslizadores (gramos de carbohidratos, proteinas y
   lipidos) y ve en vivo cuanta energia aporta cada nutrimento y el total. El
   encargo es armar una porcion que llegue a la energia pedida. Tres rondas con
   objetivos distintos; retroalimentacion que dice cuanto falta o cuanto sobra.
   ══════════════════════════════════════════════════════════════════════════ */
function wEtiqueta(rng, host){
  function mkRound(){
    var c = (4 + Math.floor(rng() * 9)) * 5;
    var p = (2 + Math.floor(rng() * 5)) * 5;
    var l = (2 + Math.floor(rng() * 5)) * 5;
    return { c:c, p:p, l:l, T: 4 * c + 4 * p + 9 * l };
  }
  var R = [mkRound(), mkRound(), mkRound()];
  var st = { r:0, c:0, p:0, l:0, tries:0, done:false };

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de la etiqueta', en:'Label bench' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve los tres deslizadores y observa cómo cambia la energía que aporta cada nutrimento. Puedes subir y bajar cuantas veces quieras antes de comprobar.',
      en:'Move the three sliders and watch how the energy contributed by each nutrient changes. You can go up and down as many times as you like before checking.'
    }) + '</div>' +
    '<div class="gw-prog" data-r="prog"></div>' +
    '<div class="et-row"><div class="et-name">' + L({ es:'Carbohidratos', en:'Carbohydrates' }) + '</div>' +
      '<input class="et-sl" type="range" min="0" max="120" step="5" value="0" data-r="slc"><div class="et-val" data-r="vc"></div></div>' +
    '<div class="et-row"><div class="et-name">' + L({ es:'Proteínas', en:'Proteins' }) + '</div>' +
      '<input class="et-sl" type="range" min="0" max="60" step="5" value="0" data-r="slp"><div class="et-val" data-r="vp"></div></div>' +
    '<div class="et-row"><div class="et-name">' + L({ es:'Lípidos', en:'Lipids' }) + '</div>' +
      '<input class="et-sl" type="range" min="0" max="60" step="5" value="0" data-r="sll"><div class="et-val" data-r="vl"></div></div>' +
    '<div class="et-bar"><div class="et-seg sc" data-r="bc"></div><div class="et-seg sp" data-r="bp"></div><div class="et-seg sl" data-r="bl"></div></div>' +
    '<div class="et-key">' +
      '<span><span class="et-dot sc"></span>' + L({ es:'carbohidratos', en:'carbohydrates' }) + '</span>' +
      '<span><span class="et-dot sp"></span>' + L({ es:'proteínas', en:'proteins' }) + '</span>' +
      '<span><span class="et-dot sl"></span>' + L({ es:'lípidos', en:'lipids' }) + '</span>' +
    '</div>' +
    '<div class="et-total" data-r="tot"></div>' +
    '<div class="et-goal" data-r="goal"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var q = host.querySelector('[data-r="q"]'), prog = host.querySelector('[data-r="prog"]'),
      slc = host.querySelector('[data-r="slc"]'), slp = host.querySelector('[data-r="slp"]'),
      sll = host.querySelector('[data-r="sll"]'), vc = host.querySelector('[data-r="vc"]'),
      vp = host.querySelector('[data-r="vp"]'), vl = host.querySelector('[data-r="vl"]'),
      bc = host.querySelector('[data-r="bc"]'), bp = host.querySelector('[data-r="bp"]'),
      bl = host.querySelector('[data-r="bl"]'), tot = host.querySelector('[data-r="tot"]'),
      goal = host.querySelector('[data-r="goal"]'), go = host.querySelector('[data-r="go"]'),
      fb = host.querySelector('[data-r="fb"]');

  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }
  function total(){ return 4 * st.c + 4 * st.p + 9 * st.l; }

  function render(){
    var T = R[st.r].T, kt = total();
    q.textContent = st.done
      ? L({ es:'Mesa cerrada: armaste las tres porciones.', en:'Bench closed: you built all three servings.' })
      : L({ es:'Arma una porción que aporte ', en:'Build a serving that provides ' }) + T + L({ es:' kcal.', en:' kcal.' });
    prog.textContent = (st.done ? 3 : st.r + 1) + ' / 3';
    slc.value = st.c; slp.value = st.p; sll.value = st.l;
    slc.disabled = slp.disabled = sll.disabled = st.done;
    vc.textContent = st.c + ' g = ' + (4 * st.c) + ' kcal';
    vp.textContent = st.p + ' g = ' + (4 * st.p) + ' kcal';
    vl.textContent = st.l + ' g = ' + (9 * st.l) + ' kcal';
    var base = Math.max(kt, T, 1);
    bc.style.width = (4 * st.c / base * 100) + '%';
    bp.style.width = (4 * st.p / base * 100) + '%';
    bl.style.width = (9 * st.l / base * 100) + '%';
    tot.textContent = kt + ' kcal';
    goal.textContent = L({ es:'objetivo: ', en:'target: ' }) + T + ' kcal';
    go.textContent = L({ es:'Comprobar', en:'Check' });
    go.disabled = st.done;
  }

  function live(){
    var T = R[st.r].T, d = total() - T;
    if (Math.abs(d) <= 10) say('', L({ es:'Estás dentro del objetivo.', en:'You are within the target.' }));
    else if (d < 0) say('', L({ es:'Te faltan ', en:'You are short by ' }) + (-d) + L({ es:' kcal.', en:' kcal.' }));
    else say('', L({ es:'Te pasas por ', en:'You are over by ' }) + d + L({ es:' kcal.', en:' kcal.' }));
  }

  [[slc, 'c'], [slp, 'p'], [sll, 'l']].forEach(function(pair){
    pair[0].addEventListener('input', function(){
      if (st.done) return;
      st[pair[1]] = parseInt(pair[0].value, 10);
      render(); live();
    });
  });

  function next(){
    st.tries = 0; st.r++;
    if (st.r >= 3){ st.done = true; render(); say('good', '&#127881; ' + L({
      es:'¡Etiqueta dominada! Cada gramo de lípido pesa el doble en energía que un gramo de carbohidrato o de proteína.',
      en:'Label mastered! Each gram of lipid weighs double in energy compared with a gram of carbohydrate or protein.'
    })); return; }
    st.c = 0; st.p = 0; st.l = 0;
    render();
    say('', L({ es:'Porción nueva sobre la mesa.', en:'New serving on the bench.' }));
  }

  go.addEventListener('click', function(){
    if (st.done) return;
    var T = R[st.r].T, d = total() - T;
    if (Math.abs(d) <= 10){
      say('good', '&#10003; ' + L({ es:'Llegaste: ', en:'You got there: ' }) + st.c + L({ es:' g de carbohidratos, ', en:' g of carbohydrates, ' }) + st.p +
        L({ es:' g de proteínas y ', en:' g of proteins and ' }) + st.l + L({ es:' g de lípidos suman ', en:' g of lipids add up to ' }) + total() + ' kcal.');
      setTimeout(next, 1700);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.c = R[st.r].c; st.p = R[st.r].p; st.l = R[st.r].l;
      render();
      say('warm', L({ es:'Una combinación que llega a ', en:'A combination that reaches ' }) + T + L({ es:' kcal es ', en:' kcal is ' }) +
        st.c + L({ es:' g de carbohidratos, ', en:' g of carbohydrates, ' }) + st.p + L({ es:' g de proteínas y ', en:' g of proteins and ' }) + st.l +
        L({ es:' g de lípidos. Fíjate cuánto sube el total con cada gramo de lípido.', en:' g of lipids. Notice how much the total rises with each gram of lipid.' }));
      setTimeout(next, 3000);
      return;
    }
    if (d < 0) say('miss', L({ es:'Aún faltan ', en:'Still short by ' }) + (-d) + L({ es:' kcal. Sube algún nutrimento; el que más rinde por gramo te acerca más rápido.', en:' kcal. Raise some nutrient; the one that yields most per gram gets you there faster.' }));
    else say('miss', L({ es:'Te pasaste por ', en:'You went over by ' }) + d + L({ es:' kcal. Baja algún nutrimento.', en:' kcal. Lower some nutrient.' }));
  });

  render();
  say('', L({ es:'Empieza moviendo los carbohidratos y observa el total.', en:'Start by moving the carbohydrates and watch the total.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: ruta de la energia
   Los pasos que van del bocado al ATP llegan desordenados. El estudiante toca
   dos pasos para intercambiarlos hasta dejar la ruta en orden. La ruta cambia
   con la semilla: puede tocar la de un pan o la de una cucharada de aceite.
   ══════════════════════════════════════════════════════════════════════════ */
function wRuta(rng, host){
  var CHAINS = [
    { name:{ es:'Ruta de un pan', en:'Route of a piece of bread' },
      steps:[
        { es:'Masticas el pan y la saliva empieza a partir el almidón', en:'You chew the bread and saliva starts splitting the starch' },
        { es:'En el intestino el almidón queda partido en moléculas de glucosa', en:'In the intestine the starch ends up split into glucose molecules' },
        { es:'La glucosa pasa a la sangre y viaja hasta las células', en:'The glucose passes into the blood and travels to the cells' },
        { es:'Dentro de la célula la glucosa se oxida con el oxígeno que respiraste', en:'Inside the cell the glucose is oxidized with the oxygen you breathed in' },
        { es:'La energía liberada queda guardada en ATP y salen dióxido de carbono y agua', en:'The released energy is stored in ATP and carbon dioxide and water leave' }
      ] },
    { name:{ es:'Ruta de una cucharada de aceite', en:'Route of a spoonful of oil' },
      steps:[
        { es:'El aceite llega al intestino y la bilis lo reparte en gotas diminutas', en:'The oil reaches the intestine and bile breaks it into tiny drops' },
        { es:'Las enzimas parten cada grasa en ácidos grasos', en:'Enzymes split each fat into fatty acids' },
        { es:'Los ácidos grasos entran a la sangre y llegan a la célula', en:'The fatty acids enter the blood and reach the cell' },
        { es:'La cadena de carbono e hidrógeno se oxida paso a paso con oxígeno', en:'The carbon and hydrogen chain is oxidized step by step with oxygen' },
        { es:'Se libera más energía por gramo que con la glucosa y se forma ATP', en:'More energy per gram is released than with glucose and ATP is formed' }
      ] }
  ];
  var CH = vpick(rng, CHAINS);
  var n = CH.steps.length;
  var perm = shuffle(CH.steps.map(function(_, i){ return i; }), rng);
  if (perm.every(function(v, i){ return v === i; })) { var tmp = perm[0]; perm[0] = perm[1]; perm[1] = tmp; }
  var st = { order:perm, sel:null, tries:0, done:false };

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Ruta de la energía', en:'Energy route' }) + '</div>' +
    '<div class="gw-q">' + L(CH.name) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Los pasos llegaron revueltos. Toca dos pasos para intercambiarlos y déjalos del primero al último. Puedes reacomodarlos las veces que quieras.',
      en:'The steps arrived scrambled. Tap two steps to swap them and leave them from first to last. You can rearrange as many times as you like.'
    }) + '</div>' +
    '<div class="rt-list" data-r="list"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var list = host.querySelector('[data-r="list"]'), go = host.querySelector('[data-r="go"]'),
      fb = host.querySelector('[data-r="fb"]');
  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }

  function render(){
    list.innerHTML = st.order.map(function(ei, pos){
      var cls = 'rt-chip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' fix' : '');
      return '<div class="' + cls + '" data-p="' + pos + '"><span class="rt-n">' + (pos + 1) + '</span><span>' + L(CH.steps[ei]) + '</span></div>';
    }).join('');
    if (!st.done){
      list.querySelectorAll('.rt-chip').forEach(function(ch){
        ch.addEventListener('click', function(){ tap(parseInt(ch.getAttribute('data-p'), 10)); });
      });
    }
    go.textContent = L({ es:'Comprobar', en:'Check' });
    go.disabled = st.done;
  }

  function tap(pos){
    if (st.done) return;
    if (st.sel === null) { st.sel = pos; render(); say('', L({ es:'Ahora toca el paso con el que quieres intercambiarlo.', en:'Now tap the step you want to swap it with.' })); return; }
    if (st.sel === pos) { st.sel = null; render(); say('', L({ es:'Selección cancelada.', en:'Selection cancelled.' })); return; }
    var t2 = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t2;
    st.sel = null; render();
    say('', L({ es:'Pasos intercambiados.', en:'Steps swapped.' }));
  }

  go.addEventListener('click', function(){
    if (st.done) return;
    var ok = st.order.every(function(ei, pos){ return ei === pos; });
    if (ok){
      st.done = true; render();
      say('good', '&#127881; ' + L({
        es:'¡Ruta completa! Ningún paso puede saltarse: la energía solo se libera cuando la molécula ya partida se oxida dentro de la célula.',
        en:'Route complete! No step can be skipped: energy is only released when the already split molecule is oxidized inside the cell.'
      }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.order = CH.steps.map(function(_, i){ return i; });
      st.done = true; render();
      say('warm', L({
        es:'Este es el orden correcto. Fíjate en la lógica: primero se parte el alimento en moléculas pequeñas, después esas moléculas viajan, y solo al final se oxidan y liberan energía.',
        en:'This is the correct order. Notice the logic: first the food is split into small molecules, then those molecules travel, and only at the end are they oxidized and release energy.'
      }));
      return;
    }
    var bad = 0;
    for (var i = 0; i < n; i++) { if (st.order[i] !== i) { bad = i; break; } }
    say('miss', L({ es:'Todavía no. Revisa el paso ', en:'Not yet. Check step ' }) + (bad + 1) +
      L({ es:': ¿ese proceso puede ocurrir antes de que el anterior haya terminado?', en:': can that process happen before the previous one has finished?' }));
  });

  render();
  say('', L({ es:'Lee los cinco pasos y decide cuál tiene que ocurrir primero.', en:'Read the five steps and decide which one has to happen first.' }));
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: consultorio de la deficiencia
   Llegan casos con una señal del cuerpo y el estudiante decide qué nutrimento
   sin energía está faltando. Las opciones cambian con la semilla. La
   retroalimentacion nombra la funcion, no el veredicto.
   ══════════════════════════════════════════════════════════════════════════ */
function wConsultorio(rng, host){
  var NUTR = {
    hierro:  { es:'Hierro', en:'Iron' },
    calcio:  { es:'Calcio', en:'Calcium' },
    yodo:    { es:'Yodo', en:'Iodine' },
    vitC:    { es:'Vitamina C', en:'Vitamin C' },
    vitA:    { es:'Vitamina A', en:'Vitamin A' },
    vitD:    { es:'Vitamina D', en:'Vitamin D' },
    agua:    { es:'Agua simple', en:'Plain water' },
    potasio: { es:'Potasio', en:'Potassium' }
  };
  var CASOS = [
    { es:'Una jugadora se cansa a los pocos minutos, se ve pálida y se queda sin aire al subir escaleras', en:'A player gets tired within minutes, looks pale and runs out of breath climbing stairs', k:'hierro',
      why:{ es:'ese mineral forma parte de la hemoglobina, la molécula que carga el oxígeno en la sangre', en:'that mineral is part of haemoglobin, the molecule that carries oxygen in the blood' } },
    { es:'A un niño se le fracturan los huesos con golpes leves y sus dientes se pican con facilidad', en:'A child breaks bones from light knocks and their teeth decay easily', k:'calcio',
      why:{ es:'ese mineral forma la red rígida que endurece huesos y esmalte dental', en:'that mineral forms the rigid lattice that hardens bone and tooth enamel' } },
    { es:'A una persona se le inflama la glándula del cuello y todo su cuerpo trabaja más lento de lo normal', en:'A person has a swollen gland in the neck and their whole body works slower than normal', k:'yodo',
      why:{ es:'ese mineral es indispensable para la hormona que regula la velocidad de las reacciones del cuerpo', en:'that mineral is essential for the hormone that sets the speed of the body reactions' } },
    { es:'A un adolescente le sangran las encías al cepillarse y sus heridas tardan semanas en cerrar', en:'A teenager bleeds from the gums when brushing and their wounds take weeks to close', k:'vitC',
      why:{ es:'esa vitamina se necesita para fabricar la proteína que sostiene encías, piel y vasos', en:'that vitamin is needed to build the protein that holds gums, skin and vessels together' } },
    { es:'Una persona ve muy mal apenas cae la noche, aunque de día distingue todo sin problema', en:'A person sees very poorly as soon as night falls, though by day they make out everything fine', k:'vitA',
      why:{ es:'esa vitamina forma parte del pigmento del ojo que responde a la luz débil', en:'that vitamin is part of the eye pigment that responds to dim light' } },
    { es:'Un corredor termina el entrenamiento con calambres, dolor de cabeza y muy poca orina', en:'A runner finishes training with cramps, a headache and very little urine', k:'agua',
      why:{ es:'sin ella la sangre no transporta ni el cuerpo puede enfriarse con el sudor', en:'without it the blood cannot transport and the body cannot cool itself through sweat' } },
    { es:'Un niño que casi no sale al sol tiene piernas arqueadas y huesos blandos pese a tomar leche', en:'A child who hardly goes outside has bowed legs and soft bones despite drinking milk', k:'vitD',
      why:{ es:'esa vitamina es la que permite absorber el calcio del alimento y fijarlo en el hueso', en:'that vitamin is what allows calcium from food to be absorbed and fixed in the bone' } },
    { es:'Una persona que vomitó todo el día siente el músculo débil y el corazón le late irregular', en:'A person who vomited all day feels their muscles weak and their heartbeat irregular', k:'potasio',
      why:{ es:'ese ion cruza la membrana y sin él la señal que ordena la contracción se descontrola', en:'that ion crosses the membrane and without it the signal ordering contraction goes out of control' } }
  ];
  var SEQ = shuffle(CASOS, rng).slice(0, 5);
  var st = { i:0, tries:0, hit:0, done:false, opts:[] };

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Consultorio', en:'Clinic' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Cada caso trae una señal del cuerpo. Decide qué le está faltando. Si te equivocas, el caso se queda abierto para que lo vuelvas a pensar.',
      en:'Each case brings a signal from the body. Decide what is missing. If you miss, the case stays open so you can think it over again.'
    }) + '</div>' +
    '<div class="gw-prog" data-r="prog"></div>' +
    '<div class="cs-card" data-r="card"></div>' +
    '<div class="cs-opts" data-r="opts"></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var q = host.querySelector('[data-r="q"]'), prog = host.querySelector('[data-r="prog"]'),
      card = host.querySelector('[data-r="card"]'), obox = host.querySelector('[data-r="opts"]'),
      fb = host.querySelector('[data-r="fb"]');
  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }

  function mkOpts(k){
    var otras = Object.keys(NUTR).filter(function(x){ return x !== k; });
    return shuffle([k].concat(shuffle(otras, rng).slice(0, 3)), rng);
  }

  function render(){
    if (st.done){
      q.textContent = L({ es:'Consultorio cerrado.', en:'Clinic closed.' });
      prog.textContent = st.hit + ' / ' + SEQ.length;
      card.textContent = L({
        es:'Ninguno de estos nutrimentos aporta una sola kcal, y sin ellos el cuerpo no funciona.',
        en:'None of these nutrients provides a single kcal, and without them the body does not work.'
      });

    }
    q.textContent = L({ es:'¿Qué nutrimento le está faltando?', en:'Which nutrient is missing?' });
    prog.textContent = (st.i + 1) + ' / ' + SEQ.length;

    obox.querySelectorAll('.cs-op').forEach(function(b){

    st.tries = 0; st.i++;
    if (st.i >= SEQ.length){ st.done = true; render(); say('good', '&#127881; ' + L({

      en:'Clinic complete! These substances give no energy: they make it possible for the energy in food to be used.'
    })); return; }
    st.opts = mkOpts(SEQ[st.i].k);
    render();
  }

  function choose(k){
    if (st.done) return;
    var caso = SEQ[st.i];
    if (k === caso.k){
      st.hit++;
      say('good', '&#10003; ' + L({ es:'Sí: ', en:'Yes: ' }) + L(caso.why) + '.');

      es:'Todavía no. Pregúntate qué parte del cuerpo dejó de trabajar bien y qué sustancia hace justo ese trabajo.',
      en:'Not yet. Ask yourself which part of the body stopped working well and which substance does exactly that job.'
    }));
  }

  st.opts = mkOpts(SEQ[0].k);
  render();
  say('', L({ es:'Lee el caso y elige.', en:'Read the case and choose.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: balance del dia
   El estudiante arma el menu tocando alimentos y mueve los minutos de
   actividad. Las dos barras (lo que entra y lo que se gasta) se mueven en
   vivo y el objetivo es dejarlas parejas. Tres personas distintas por semilla.
   ══════════════════════════════════════════════════════════════════════════ */
function wBalance(rng, host){
  var PERS = [
    { es:'Ana entrena voleibol por la tarde', en:'Ana trains volleyball in the afternoon', base:1500, act:{ es:'voleibol', en:'volleyball' }, r:8 },
    { es:'Beto reparte pedidos en bicicleta', en:'Beto delivers orders by bicycle', base:1600, act:{ es:'bicicleta', en:'cycling' }, r:7 },
    { es:'Cami camina a la escuela y baila en la tarde', en:'Cami walks to school and dances in the afternoon', base:1400, act:{ es:'baile', en:'dancing' }, r:6 },
    { es:'Dani nada en el club antes de clases', en:'Dani swims at the club before class', base:1550, act:{ es:'natación', en:'swimming' }, r:9 }
  ];
  var MENU = [
    { es:'Fruta con yogur', en:'Fruit with yogurt', k:180 },
    { es:'Torta de pollo', en:'Chicken sandwich', k:520 },
    { es:'Arroz con frijoles', en:'Rice with beans', k:380 },
    { es:'Dos quesadillas', en:'Two quesadillas', k:420 },
    { es:'Licuado de plátano', en:'Banana shake', k:250 },
    { es:'Puño de cacahuates', en:'Handful of peanuts', k:200 },
    { es:'Ensalada con aguacate', en:'Salad with avocado', k:160 },
    { es:'Agua simple', en:'Plain water', k:0 }
  ];
  var ROUNDS = shuffle(PERS, rng).slice(0, 3);
  var st = { r:0, on:[], min:0, tries:0, done:false };

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Balance del día', en:'Balance of the day' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca los alimentos para ponerlos o quitarlos del día y mueve los minutos de actividad. Las dos barras se mueven al instante: déjalas parejas.',
      en:'Tap foods to put them in or take them out of the day and move the minutes of activity. The two bars move instantly: leave them level.'
    }) + '</div>' +
    '<div class="gw-lbl">' + L({ es:'Lo que come', en:'What they eat' }) + '</div>' +
    '<div class="bl-chips" data-r="chips"></div>' +
    '<div class="gw-lbl" data-r="actlbl"></div>' +
    '<input class="bl-sl" type="range" min="0" max="90" step="5" value="0" data-r="sl">' +
    '<div class="gw-lbl">' + L({ es:'Energía que entra', en:'Energy coming in' }) + '</div>' +
    '<div class="bl-track"><div class="bl-fill in" data-r="fin"></div></div>' +
    '<div class="gw-lbl">' + L({ es:'Energía que se gasta', en:'Energy spent' }) + '</div>' +
    '<div class="bl-track"><div class="bl-fill out" data-r="fout"></div></div>' +
    '<div class="bl-num"><span data-r="nin"></span><span data-r="nout"></span></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var q = host.querySelector('[data-r="q"]'), chips = host.querySelector('[data-r="chips"]'),
      actlbl = host.querySelector('[data-r="actlbl"]'), sl = host.querySelector('[data-r="sl"]'),
      fin = host.querySelector('[data-r="fin"]'), fout = host.querySelector('[data-r="fout"]'),
      nin = host.querySelector('[data-r="nin"]'), nout = host.querySelector('[data-r="nout"]'),
      go = host.querySelector('[data-r="go"]'), fb = host.querySelector('[data-r="fb"]');
  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }

  function ingesta(){ var s = 0; st.on.forEach(function(i){ s += MENU[i].k; }); return s; }
  function gasto(){ var p = ROUNDS[st.r]; return p.base + p.r * st.min; }

  function render(){
    var p = ROUNDS[st.r], ei = ingesta(), eg = gasto(), top = 2800;
    q.textContent = st.done
      ? L({ es:'Día cerrado en las tres personas.', en:'Day closed for all three people.' })
      : (st.r + 1) + ' / 3 · ' + L(p) + '. ' + L({ es:'Deja el día en equilibrio.', en:'Leave the day in balance.' });
    actlbl.textContent = L({ es:'Minutos de ', en:'Minutes of ' }) + L(p.act) + ': ' + st.min +
      ' (' + p.r + L({ es:' kcal por minuto)', en:' kcal per minute)' });
    sl.value = st.min; sl.disabled = st.done;
    chips.innerHTML = MENU.map(function(m, i){
      return '<button class="bl-chip' + (st.on.indexOf(i) >= 0 ? ' on' : '') + '" data-i="' + i + '">' + L(m) + ' · ' + m.k + ' kcal</button>';
    }).join('');
    if (!st.done){
      chips.querySelectorAll('.bl-chip').forEach(function(b){
        b.addEventListener('click', function(){ toggle(parseInt(b.getAttribute('data-i'), 10)); });
      });
    }
    fin.style.width = Math.min(100, ei / top * 100) + '%';
    fout.style.width = Math.min(100, eg / top * 100) + '%';
    nin.textContent = L({ es:'entra ', en:'in ' }) + ei + ' kcal';
    nout.textContent = L({ es:'gasta ', en:'out ' }) + eg + ' kcal';
    go.textContent = L({ es:'Comprobar', en:'Check' });
    go.disabled = st.done;
  }

  function live(){
    var d = ingesta() - gasto();
    if (Math.abs(d) <= 60) say('', L({ es:'Las dos barras están casi parejas.', en:'The two bars are almost level.' }));
    else if (d > 0) say('', L({ es:'Entran ', en:'There are ' }) + d + L({ es:' kcal de más: esa reserva se guarda como grasa.', en:' kcal too many coming in: that reserve is stored as fat.' }));
    else say('', L({ es:'Faltan ', en:'There are ' }) + (-d) + L({ es:' kcal: el cuerpo tendría que echar mano de sus reservas.', en:' kcal missing: the body would have to draw on its reserves.' }));
  }

  function toggle(i){
    if (st.done) return;
    var at = st.on.indexOf(i);
    if (at >= 0) st.on.splice(at, 1); else st.on.push(i);
    render(); live();
  }

  sl.addEventListener('input', function(){
    if (st.done) return;
    st.min = parseInt(sl.value, 10);
    render(); live();
  });

  function next(){
    st.tries = 0; st.r++;
    if (st.r >= 3){ st.done = true; render(); say('good', '&#127881; ' + L({
      es:'¡Tres días equilibrados! La misma comida sobra o falta según cuánto se mueva la persona.',
      en:'Three balanced days! The same meal is too much or too little depending on how much the person moves.'
    })); return; }
    st.on = []; st.min = 0;
    render();
    say('', L({ es:'Persona nueva, otro gasto en reposo.', en:'New person, a different resting expenditure.' }));
  }

  go.addEventListener('click', function(){
    if (st.done) return;
    var p = ROUNDS[st.r], d = ingesta() - gasto();
    if (Math.abs(d) <= 60){
      say('good', '&#10003; ' + L({ es:'Equilibrado: entran ', en:'Balanced: ' }) + ingesta() + L({ es:' kcal y se gastan ', en:' kcal come in and ' }) + gasto() +
        L({ es:' kcal.', en:' kcal are spent.' }));
      setTimeout(next, 1700);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var need = Math.round((ingesta() - p.base) / p.r / 5) * 5;
      if (need >= 0 && need <= 90){
        st.min = need; render();
        say('warm', L({ es:'Con ese menú el equilibrio llega a los ', en:'With that menu the balance arrives at ' }) + need +
          L({ es:' minutos de actividad, porque cada minuto gasta ', en:' minutes of activity, because each minute spends ' }) + p.r + L({ es:' kcal.', en:' kcal.' }));
      } else {
        say('warm', L({ es:'Con ese menú no alcanza con mover los minutos: el gasto en reposo ya es de ', en:'With that menu moving the minutes is not enough: the resting expenditure alone is ' }) + p.base +
          L({ es:' kcal, así que hay que cambiar los alimentos.', en:' kcal, so the foods have to change.' }));
      }
      setTimeout(next, 3200);
      return;
    }

  datos = { es:'Al analizar ' + L(mn) + ' se obtiene que aporta ' + c + ' g de carbohidratos, ' + p + ' g de proteínas y ' + l + ' g de lípidos.',

  return {

}

/* ══════════════════════════════════════════════════════════════════════════

function buildLesson(rng){
  injectGuideCSS();

  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Tu cuerpo funciona con una reacción química que empieza en la cocina', en:'Your body runs on a chemical reaction that starts in the kitchen' }),
    '<p>' + L({
      es:'Ahora mismo tu corazón late, tu cerebro sostiene esta lectura y tus riñones filtran sangre. Nada de eso es gratis: cada uno de esos trabajos gasta energía, y toda esa energía entró por tu boca en forma de moléculas. Un plato de frijoles, una cucharada de aceite y un vaso de leche no son categorías de alimento, son depósitos de enlaces químicos que tu cuerpo sabe romper para quedarse con la diferencia.',
      en:'Right now your heart is beating, your brain is holding this reading together and your kidneys are filtering blood. None of that is free: every one of those jobs spends energy, and all of that energy came in through your mouth in the form of molecules. A plate of beans, a spoonful of oil and a glass of milk are not food categories, they are stores of chemical bonds that your body knows how to break in order to keep the difference.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a armar porciones moviendo gramos hasta llegar a la energía pedida, ordenar la ruta que sigue un bocado hasta convertirse en ATP dentro de una célula, atender casos en los que al cuerpo le falta algo que no aporta ni una sola kcal, y equilibrar el día de tres personas distintas moviendo lo que comen y lo que se mueven. Al final vas a poder mirar una etiqueta y anticipar qué le va a pasar a esa energía.',
      en:'In this guide you will build servings by moving grams until you reach the energy asked for, order the route a bite follows until it becomes ATP inside a cell, attend cases where the body is missing something that provides not a single kcal, and balance the day of three different people by moving what they eat and how much they move. By the end you will be able to look at a label and anticipate what is going to happen to that energy.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a poder anticipar', en:'What you will be able to anticipate' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'energía por gramo', en:'energy per gram' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'oxidación con oxígeno', en:'oxidation with oxygen' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'glucosa y ácidos grasos', en:'glucose and fatty acids' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'ATP', en:'ATP' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'función de las proteínas', en:'role of proteins' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'vitaminas y minerales', en:'vitamins and minerals' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'agua simple', en:'plain water' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'balance de energía', en:'energy balance' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Por qué un gramo de grasa vale por dos de azúcar', en:'Why one gram of fat is worth two of sugar' }),
    '<p>' + L({
      es:'De todo lo que comes, solo tres tipos de sustancia aportan energía: los carbohidratos, las proteínas y los lípidos. Las tres están hechas de cadenas de carbono e hidrógeno, y la energía no está guardada dentro de un enlace como si fuera una pila: aparece en la diferencia. Cuando esas cadenas reaccionan con oxígeno y se convierten en dióxido de carbono y agua, los enlaces nuevos son más estables que los originales, y esa diferencia sale como energía que la célula aprovecha.',
      en:'Of everything you eat, only three kinds of substance provide energy: carbohydrates, proteins and lipids. All three are made of carbon and hydrogen chains, and the energy is not stored inside a bond as if it were a battery: it shows up in the difference. When those chains react with oxygen and turn into carbon dioxide and water, the new bonds are more stable than the original ones, and that difference comes out as energy the cell puts to use.'
    }) + '</p>' +
    '<p>' + L({
      es:'De ahí sale el dato que decide todo lo demás. Un gramo de carbohidrato libera alrededor de 4 kcal y un gramo de proteína también 4 kcal, mientras que un gramo de lípido llega a 9 kcal, más del doble. La razón es la composición: la molécula de un carbohidrato ya trae mucho oxígeno unido a sus carbonos, es decir ya está oxidada en parte y le queda menos por entregar; la de un lípido es casi pura cadena de carbono e hidrógeno, con muy poco oxígeno, así que al quemarse recorre un camino mucho más largo. Por eso el cuerpo guarda sus reservas de largo plazo en forma de grasa: es la manera de almacenar más energía en menos masa.',
      en:'From there comes the figure that decides everything else. One gram of carbohydrate releases about 4 kcal and one gram of protein also 4 kcal, while one gram of lipid reaches 9 kcal, more than double. The reason is the composition: a carbohydrate molecule already carries plenty of oxygen attached to its carbons, that is, it is already partly oxidized and has less left to hand over; a lipid molecule is almost pure carbon and hydrogen chain, with very little oxygen, so on burning it travels a much longer road. That is why the body keeps its long term reserves as fat: it is the way to store more energy in less mass.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Carbohidratos', en:'Carbohydrates' }), '4 kcal / g', L({ es:'combustible de uso inmediato', en:'fuel for immediate use' })) +
      rcard(L({ es:'Proteínas', en:'Proteins' }), '4 kcal / g', L({ es:'material de construcción, no combustible principal', en:'building material, not the main fuel' })) +
      rcard(L({ es:'Lípidos', en:'Lipids' }), '9 kcal / g', L({ es:'reserva concentrada, cadenas casi sin oxígeno', en:'concentrated reserve, chains almost free of oxygen' })) +
      rcard(L({ es:'La reacción', en:'The reaction' }), L({ es:'alimento + O₂', en:'food + O₂' }), L({ es:'salen CO₂, agua y energía', en:'CO₂, water and energy come out' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'la kcal mide energía, no calidad. Un alimento puede aportar muchas kcal y casi nada más, y otro puede aportar pocas y traer justo los minerales y vitaminas que hacen falta.',
      en:'the kcal measures energy, not quality. One food can provide plenty of kcal and almost nothing else, and another can provide few and bring exactly the minerals and vitamins that are needed.'
    }) + '</p></div>'
  );
  wEtiqueta(rng, widgetHost(s1, 'wEtiqueta', 'etiqueta'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Del bocado al ATP: nada se salta un paso', en:'From bite to ATP: nothing skips a step' }),
    '<p>' + L({
      es:'La energía de un alimento no está disponible en el momento de masticarlo. Las moléculas de la comida son demasiado grandes para atravesar la pared del intestino, así que primero la digestión las parte: el almidón queda convertido en glucosa, las proteínas en aminoácidos y los lípidos en ácidos grasos. Solo entonces esas piezas pequeñas pasan a la sangre y viajan hasta cualquier célula del cuerpo.',
      en:'The energy of a food is not available at the moment of chewing it. The molecules of the meal are too large to cross the intestinal wall, so digestion first splits them: starch ends up turned into glucose, proteins into amino acids and lipids into fatty acids. Only then do those small pieces pass into the blood and travel to any cell in the body.'
    }) + '</p>' +
    '<p>' + L({
      es:'Dentro de la célula ocurre la reacción que sostiene todo: la respiración celular. La glucosa se combina con el oxígeno que acabas de respirar y de ahí salen dióxido de carbono, agua y energía. La ecuación es C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energía, y el gas que exhalas es literalmente el carbono de lo que comiste. Esa energía no queda suelta: se guarda en una molécula llamada ATP, que la célula gasta enseguida para contraer un músculo, fabricar sustancias o bombear iones. Los ácidos grasos entran a la misma vía y rinden más por gramo. Los aminoácidos, en cambio, se destinan primero a construir músculo, enzimas, defensas y hormonas, y solo se usan como combustible cuando ya no queda nada más, que es exactamente lo que pasa cuando alguien entrena sin haber desayunado.',
      en:'Inside the cell the reaction that sustains everything takes place: cellular respiration. Glucose combines with the oxygen you have just breathed in and out of it come carbon dioxide, water and energy. The equation is C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energy, and the gas you breathe out is literally the carbon of what you ate. That energy is not left loose: it is stored in a molecule called ATP, which the cell spends straight away to contract a muscle, build substances or pump ions. Fatty acids enter the same pathway and yield more per gram. Amino acids, on the other hand, go first to building muscle, enzymes, defences and hormones, and are used as fuel only when nothing else is left, which is exactly what happens when someone trains without having had breakfast.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Digestión', en:'Digestion' }), L({ es:'partir', en:'split' }), L({ es:'almidón a glucosa, grasa a ácidos grasos', en:'starch to glucose, fat to fatty acids' })) +
      rcard(L({ es:'Absorción', en:'Absorption' }), L({ es:'viajar', en:'travel' }), L({ es:'la sangre reparte a todas las células', en:'the blood distributes to every cell' })) +
      rcard(L({ es:'Respiración celular', en:'Cellular respiration' }), L({ es:'oxidar', en:'oxidize' }), L({ es:'ahí y solo ahí se libera la energía', en:'there and only there the energy is released' })) +
      rcard(L({ es:'ATP', en:'ATP' }), L({ es:'gastar', en:'spend' }), L({ es:'se fabrica y se usa dentro de la célula', en:'it is made and used inside the cell' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Respirar no es solo llenar los pulmones. El oxígeno que entra tiene un destino químico concreto: encontrarse con la glucosa dentro de tus células. Sin él, la energía del alimento se queda encerrada en sus enlaces.',
      en:'Breathing is not just filling the lungs. The oxygen coming in has a concrete chemical destination: meeting glucose inside your cells. Without it, the energy of the food stays locked in its bonds.'
    }) + '</p></div>'
  );
  wRuta(rng, widgetHost(s2, 'wRuta', 'ruta'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Los que no dan ni una kcal y aun así mandan', en:'The ones that give not a single kcal and still give the orders' }),
    '<p>' + L({
      es:'Las vitaminas, los minerales y el agua simple no se oxidan como combustible: aportan cero kcal. Eso no los vuelve prescindibles, al contrario. Las vitaminas trabajan junto a las enzimas que llevan a cabo las reacciones de la célula, incluidas las que liberan la energía de los alimentos; los minerales aparecen dentro de moléculas clave o viajan como iones que cruzan las membranas. El hierro está en la hemoglobina que carga el oxígeno, el calcio forma la red rígida del hueso y del esmalte, el yodo es indispensable para la hormona que marca el ritmo del cuerpo, y el sodio y el potasio son los que hacen posible la señal nerviosa y la contracción del músculo.',
      en:'Vitamins, minerals and plain water are not oxidized as fuel: they provide zero kcal. That does not make them dispensable, quite the opposite. Vitamins work alongside the enzymes that carry out the reactions of the cell, including those that release the energy of food; minerals appear inside key molecules or travel as ions crossing the membranes. Iron sits in the haemoglobin that carries oxygen, calcium forms the rigid lattice of bone and enamel, iodine is essential for the hormone that sets the pace of the body, and sodium and potassium are what make the nerve signal and muscle contraction possible.'
    }) + '</p>' +
    '<p>' + L({
      es:'La mejor prueba de que hacen falta es lo que ocurre cuando faltan, y cada deficiencia deja una huella distinta: sin hierro suficiente la sangre lleva menos oxígeno y aparece cansancio y palidez; sin calcio y sin vitamina D los huesos se ablandan; sin vitamina C sangran las encías y las heridas no cierran; sin yodo se inflama la glándula del cuello y todo el metabolismo se enlentece; sin vitamina A cuesta ver con poca luz. El agua merece un lugar aparte: es el disolvente donde ocurre todo, transporta nutrimentos y desechos, participa en las reacciones y saca calor del cuerpo por el sudor. Se pierde todo el día y hay que reponerla, sobre todo cuando hace calor o se hace ejercicio.',
      en:'The best proof that they are needed is what happens when they are missing, and each deficiency leaves a different mark: without enough iron the blood carries less oxygen and tiredness and pallor appear; without calcium and vitamin D the bones soften; without vitamin C the gums bleed and wounds do not close; without iodine the gland in the neck swells and the whole metabolism slows; without vitamin A it is hard to see in dim light. Water deserves a place of its own: it is the solvent where everything happens, it carries nutrients and waste, takes part in the reactions and pulls heat out of the body through sweat. It is lost all day long and has to be replaced, above all in the heat or during exercise.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Vitaminas', en:'Vitamins' }), '0 kcal', L({ es:'acompañan a las enzimas de cada reacción', en:'they accompany the enzymes of each reaction' })) +
