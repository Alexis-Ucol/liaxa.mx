<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recolección y Comunicación de Datos Estadísticos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Recolección y Comunicación de Datos Estadísticos</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Recolección y Comunicación de Datos Estadísticos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        
/* ── GUIDE-SPECIFIC: recolección y comunicación de datos ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.rverify-btn.ghostbtn { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.rverify-btn.ghostbtn:hover { background:var(--surface2); border-color:var(--green); color:var(--green); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; cursor:pointer; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.binrow { display:grid; grid-template-columns:repeat(5,1fr); gap:.4rem; margin-top:.7rem; }
.binbtn { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.78rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.35rem .2rem; }
.binbtn:hover { border-color:var(--green); color:var(--green); }
.bigval { font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:700; color:var(--green-dark); text-align:center; margin:.4rem 0; }
.steprow { display:grid; grid-template-columns:repeat(5,1fr); gap:.4rem; margin-top:.7rem; }
.stepcell { border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); padding:.4rem .2rem; text-align:center; }
.steplbl { font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--text3); }

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_mat2_t10_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_mat2_t10_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_mat2_t10_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat2_t10_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
/* ================================================
   buildLesson — mat2_t10_g02
   Recolección y Comunicación de Datos Estadísticos
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sumA(a){ var t=0, i; for (i=0;i<a.length;i++) t+=a[i]; return t; }
  var REDRAW = [];

  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w0 = cv.clientWidth || 320, h0 = cv.clientHeight || 240;
    cv.width = Math.round(w0*dpr); cv.height = Math.round(h0*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w0,h0);
    return { ctx:ctx, w:w0, h:h0 };
  }
  function uniq4(c, cands, fmt){
    var out=[c], i, v, k=1;
    for (i=0;i<cands.length && out.length<4;i++){ v=cands[i]; if (v>=0 && out.indexOf(v)<0) out.push(v); }
    while (out.length<4){
      if (c+k>=0 && out.indexOf(c+k)<0) out.push(c+k);
      if (out.length<4 && c-k>=0 && out.indexOf(c-k)<0) out.push(c-k);
      k++;
    }
    return out.map(fmt || String);
  }
  function pctS(v){ return v+' %'; }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ---- histograma en canvas ---- */
  function drawHist(cv, edges, counts, o){
    o = o || {};
    var g = fitCv(cv), ctx = g.ctx, W = g.w, H = g.h;
    var L = 34, Rm = 12, Tp = 14, B = 26;
    var n = counts.length, pw = W-L-Rm, ph = H-Tp-B, i, v, y;
    var mx = 1;
    for (i=0;i<n;i++) if (counts[i] > mx) mx = counts[i];
    if (o.mxMin && o.mxMin > mx) mx = o.mxMin;
    var bw = pw/n;
    var col = cssv('--green'), colA = cssv('--gold'), bd = cssv('--border');
    var tx = cssv('--text3'), sf = cssv('--surface');
    ctx.font = '500 10px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'right'; ctx.fillStyle = tx; ctx.strokeStyle = bd; ctx.lineWidth = 1;
    var stp = mx<=9 ? 1 : (mx<=18 ? 2 : 5);
    for (v=0; v<=mx; v+=stp){
      y = Tp+ph-(v/mx)*ph;
      ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-Rm,y); ctx.stroke();
      ctx.fillText(String(v), L-5, y+3);
    }
    for (i=0;i<n;i++){
      var bh = (counts[i]/mx)*ph;
      ctx.fillStyle = (o.hi===i) ? colA : col;
      ctx.globalAlpha = (o.hi===i) ? 0.95 : 0.78;
      ctx.fillRect(L+i*bw, Tp+ph-bh, bw, bh);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = sf; ctx.lineWidth = 1;
      ctx.strokeRect(L+i*bw, Tp+ph-bh, bw, bh);
    }
    ctx.strokeStyle = tx; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(L,Tp+ph); ctx.lineTo(W-Rm,Tp+ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(L,Tp); ctx.lineTo(L,Tp+ph); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = tx;
    for (i=0;i<=n;i++) ctx.fillText(String(edges[i]), L+i*bw, Tp+ph+13);
    return { L:L, Tp:Tp, ph:ph, bw:bw, mx:mx, n:n };
  }

  /* ---- retícula con puntos (polígono y línea) ---- */
  function drawGrid(cv, xl, ymin, ymax, step, pts, o){
    o = o || {};
    var g = fitCv(cv), ctx = g.ctx, W = g.w, H = g.h;
    var L = 38, Rm = 12, Tp = 14, B = 26;
    var n = xl.length, pw = W-L-Rm, ph = H-Tp-B, i, v, y;
    var cw = pw/n;
    var col = cssv('--green'), colA = cssv('--gold'), bd = cssv('--border');
    var tx = cssv('--text3');
    function yOf(val){ return Tp+ph-((val-ymin)/(ymax-ymin))*ph; }
    function xOf(k){ return L+(k+0.5)*cw; }
    ctx.font = '500 10px "IBM Plex Sans", sans-serif';
    if (o.ghost){
      ctx.fillStyle = col; ctx.globalAlpha = 0.16;
      for (i=0;i<n;i++){ var gy = yOf(o.ghost[i]); ctx.fillRect(L+i*cw, gy, cw, (Tp+ph)-gy); }
      ctx.globalAlpha = 1;
    }
    var nl = Math.round((ymax-ymin)/step)+1, every = nl<=13 ? 1 : 2, li = 0;
    ctx.textAlign = 'right'; ctx.strokeStyle = bd; ctx.lineWidth = 1;
    for (v=ymin; v<=ymax+0.001; v+=step){
      y = yOf(v);
      ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-Rm,y); ctx.stroke();
      if (li % every === 0){ ctx.fillStyle = tx; ctx.fillText(String(v), L-5, y+3); }
      li++;
    }
    ctx.strokeStyle = bd;
    for (i=0;i<n;i++){
      ctx.beginPath(); ctx.moveTo(xOf(i), Tp); ctx.lineTo(xOf(i), Tp+ph); ctx.stroke();
    }
    ctx.strokeStyle = tx; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(L,Tp+ph); ctx.lineTo(W-Rm,Tp+ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(L,Tp); ctx.lineTo(L,Tp+ph); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = tx;
    for (i=0;i<n;i++) ctx.fillText(String(xl[i]), xOf(i), Tp+ph+14);
    if (o.target){
      ctx.strokeStyle = colA; ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (i=0;i<n;i++){ if (i===0) ctx.moveTo(xOf(i), yOf(o.target[i])); else ctx.lineTo(xOf(i), yOf(o.target[i])); }
      ctx.stroke();
    }
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    var started = false;
    for (i=0;i<n;i++){
      if (pts[i] === null || pts[i] === undefined){ started = false; continue; }
      if (!started){ ctx.moveTo(xOf(i), yOf(pts[i])); started = true; }
      else ctx.lineTo(xOf(i), yOf(pts[i]));
    }
    ctx.stroke();
    for (i=0;i<n;i++){
      if (pts[i] === null || pts[i] === undefined) continue;
      ctx.beginPath(); ctx.arc(xOf(i), yOf(pts[i]), 4.5, 0, 6.2832);
      ctx.fillStyle = col; ctx.fill();
    }
    return { L:L, Tp:Tp, ph:ph, cw:cw, n:n };
  }

  /* ---- fábrica de manipulativos de puntos (reversible, pista dirigida, revelado) ---- */
  function plotWidget(cfg){
    var wrap = widget(cfg.kind);
    var pts = [], i;
    for (i=0;i<cfg.target.length;i++) pts.push(null);
    var st = { tries:0, done:false, reveal:false };
    var geom = null;
    function draw(){
      var cv = document.getElementById(cfg.kind+'Cv'); if (!cv) return;
      geom = drawGrid(cv, cfg.xl, cfg.ymin, cfg.ymax, cfg.step, pts,
        { ghost: st.reveal ? cfg.ghost : null, target: st.reveal ? cfg.target : null });
    }
    function fbSet(msg, ok){
      var e = document.getElementById(cfg.kind+'Fb'); if (!e) return;
      e.innerHTML = ok ? '<span class="okmsg">'+msg+'</span>' : msg;
    }
    function missMsg(k){
      var lab = cfg.labels[k], cur = pts[k], d;
      if (cur === null || cur === undefined){
        return T({ es:'Falta el punto de '+lab.es+'. Tócalo en su columna, a la altura que le corresponde.',
                   en:'The point for '+lab.en+' is missing. Tap it in its column, at the height it needs.' });
      }
      d = cfg.target[k] - cur;
      if (d > 0) return T({ es:'El punto de '+lab.es+' está '+d+' '+cfg.unit.es+' por debajo de '+cfg.ref.es+'. Súbelo.',
                            en:'The point for '+lab.en+' is '+d+' '+cfg.unit.en+' below '+cfg.ref.en+'. Move it up.' });
      return T({ es:'El punto de '+lab.es+' está '+(-d)+' '+cfg.unit.es+' por arriba de '+cfg.ref.es+'. Bájalo.',
                 en:'The point for '+lab.en+' is '+(-d)+' '+cfg.unit.en+' above '+cfg.ref.en+'. Move it down.' });
    }
    function onTap(ev){
      if (st.done || !geom) return;
      var cv = ev.currentTarget, r = cv.getBoundingClientRect();
      var x = ev.clientX - r.left, y = ev.clientY - r.top;
      var c = Math.floor((x - geom.L) / geom.cw);
      if (c < 0) c = 0;
      if (c >= geom.n) c = geom.n - 1;
      var frac = ((geom.Tp + geom.ph) - y) / geom.ph;
      var val = cfg.ymin + Math.round(frac*(cfg.ymax-cfg.ymin)/cfg.step)*cfg.step;
      if (val < cfg.ymin) val = cfg.ymin;
      if (val > cfg.ymax) val = cfg.ymax;
      pts[c] = val;
      draw();
      fbSet(T({ es:'Colocaste el punto de '+cfg.labels[c].es+' a la altura '+val+'. Puedes moverlo tocando otra vez su columna.',
                en:'You placed the point for '+cfg.labels[c].en+' at height '+val+'. You can move it by tapping its column again.' }));
    }
    function check(){
      if (st.done) return;
      var miss = -1, k;
      for (k=0;k<cfg.target.length;k++){ if (pts[k] === null || pts[k] !== cfg.target[k]){ miss = k; break; } }
      if (miss < 0){ st.done = true; draw(); fbSet(cfg.okMsg, true); return; }
      st.tries++;
      if (st.tries >= 3){
        for (k=0;k<cfg.target.length;k++) pts[k] = cfg.target[k];
        st.done = true; st.reveal = true; draw(); fbSet(cfg.revealMsg); return;
      }
      fbSet(missMsg(miss));
    }
    function clearPts(){
      if (st.done) return;
      for (var k=0;k<pts.length;k++) pts[k] = null;
      draw();
      fbSet(T({ es:'Retícula limpia. Empieza de nuevo por la izquierda.', en:'Grid cleared. Start again from the left.' }));
    }
    function render(){
      wrap.innerHTML =
        '<div class="iw-tag">'+cfg.tag+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-instr iw-sub">'+cfg.instr+'</div>'+
          '<div class="goalbar">'+cfg.goal+'</div>'+
          (cfg.tbl||'')+
          '<canvas class="gcanvas" id="'+cfg.kind+'Cv"></canvas>'+
          '<div class="krow">'+
            '<button class="rverify-btn" data-act="chk">'+T({es:'Verificar',en:'Check'})+'</button>'+
            '<button class="rverify-btn ghostbtn" data-act="clr">'+T({es:'Quitar los puntos',en:'Remove the points'})+'</button>'+
          '</div>'+
          '<div class="rfb" id="'+cfg.kind+'Fb"></div>'+
        '</div>';
      var cv = document.getElementById(cfg.kind+'Cv');
      if (cv) cv.addEventListener('click', onTap);
      wrap.querySelectorAll('[data-act]').forEach(function(b){
        b.addEventListener('click', function(){
          if (b.getAttribute('data-act') === 'chk') check(); else clearPts();
        });
      });
      draw();
    }
    render();
    REDRAW.push(draw);
  }

  /* ============================================================
     VALORES CON SEMILLA (en orden fijo)
     ============================================================ */
  var vsel = [], vi, SP, i, k;
  for (vi=0; vi<10; vi++) vsel.push(Math.floor(rng()*2));

  var CTXS = [
    { u:{es:'minutos', en:'minutes'}, base:0, w:10,
      lbl:{es:'minutos de lectura diaria', en:'daily reading minutes'},
      reg:function(n){ return { es:'los minutos que '+n+' estudiantes dedicaron a leer el día anterior',
                                en:'the minutes '+n+' students spent reading the day before' }; } },
    { u:{es:'mensajes', en:'messages'}, base:0, w:20,
      lbl:{es:'mensajes enviados en un día', en:'messages sent in one day'},
      reg:function(n){ return { es:'los mensajes que '+n+' estudiantes enviaron en un día',
                                en:'the messages '+n+' students sent in one day' }; } },
    { u:{es:'minutos', en:'minutes'}, base:0, w:10,
      lbl:{es:'minutos de traslado a la escuela', en:'travel minutes to school'},
      reg:function(n){ return { es:'los minutos que '+n+' estudiantes tardan en llegar a la escuela',
                                en:'the minutes '+n+' students take to get to school' }; } }
  ];
  var C = CTXS[Math.floor(rng()*CTXS.length)];
  var w = C.w;
  var s = C.base + w*ri(0,1);

  var FP = [[3,5,7,4,1],[2,6,8,3,1],[4,7,6,5,3],[3,6,9,5,2],[5,8,6,4,2],[2,5,9,3,1]];
  var f = FP[Math.floor(rng()*FP.length)];
  if (rng() < 0.5) f = f.slice().reverse();
  var N = sumA(f);

  var E5 = []; for (i=0;i<=5;i++) E5.push(s+i*w);
  function eLo(j){ return s + j*w; }
  function eHi(j){ return s + (j+1)*w; }
  function mcv(j){ return s + j*w + w/2; }
  var SEP = (LANG==='es') ? ' a ' : ' to ';
  function clsL(j){ return { es:'la clase de '+eLo(j)+' a '+eHi(j), en:'the class from '+eLo(j)+' to '+eHi(j) }; }

  var raw = [];
  for (i=0;i<5;i++) for (k=0;k<f[i];k++) raw.push(s + i*w + 1 + Math.floor(rng()*(w-1)));
  raw = shufA(raw);
  var listTxt = raw.join(', ');

  var maxF = f[0], modeIdx = 0, minF = f[0], minIdx = 0;
  for (i=1;i<5;i++){
    if (f[i] > maxF){ maxF = f[i]; modeIdx = i; }
    if (f[i] < minF){ minF = f[i]; minIdx = i; }
  }
  var secondF = -1, secondIdx = -1;
  for (i=0;i<5;i++){ if (i !== modeIdx && f[i] > secondF){ secondF = f[i]; secondIdx = i; } }

  function tblHTML(){
    var h = (LANG==='es') ? '<tr><th>Clase</th><th>Frecuencia</th></tr>'
                          : '<tr><th>Class</th><th>Frequency</th></tr>';
    var r = '', j;
    for (j=0;j<5;j++) r += '<tr><td>'+eLo(j)+SEP+eHi(j)+'</td><td>'+f[j]+'</td></tr>';
    return '<table class="dtable">'+h+r+'</table>';
  }

  /* datos del registro mensual */
  var MON = { es:['enero','febrero','marzo','abril','mayo','junio'],
              en:['January','February','March','April','May','June'] };
  var MSH = { es:['Ene','Feb','Mar','Abr','May','Jun'],
              en:['Jan','Feb','Mar','Apr','May','Jun'] };
  var LCTXS = [
    { n:{es:'los libros que la biblioteca escolar prestó cada mes', en:'the books the school library lent each month'}, u:{es:'libros',en:'books'} },
    { n:{es:'las botellas que el grupo juntó cada mes para reciclar', en:'the bottles the group collected each month for recycling'}, u:{es:'botellas',en:'bottles'} },
    { n:{es:'los litros de agua que la escuela ahorró cada mes', en:'the litres of water the school saved each month'}, u:{es:'litros',en:'litres'} }
  ];
  var LC = LCTXS[Math.floor(rng()*LCTXS.length)];
  var DP = [[10,-5,15,5,-10],[5,15,-10,10,-5],[15,5,-5,10,-10],[10,20,-15,5,-5],[-5,10,20,5,-10],[5,-10,15,20,-5]];
  var ld = DP[Math.floor(rng()*DP.length)];
  var lv = [5*ri(6,10)];
  for (i=0;i<5;i++) lv.push(lv[i]+ld[i]);
  var upIdx = 0, dnIdx = 0;
  for (i=1;i<5;i++){ if (ld[i] > ld[upIdx]) upIdx = i; if (ld[i] < ld[dnIdx]) dnIdx = i; }
  var dUp = ld[upIdx], dDn = -ld[dnIdx];
  var totChg = lv[5] - lv[0], totSum = sumA(lv);
  var lmin = lv[0], lmax = lv[0];
  for (i=1;i<6;i++){ if (lv[i] < lmin) lmin = lv[i]; if (lv[i] > lmax) lmax = lv[i]; }
  var gmin = Math.max(0, lmin-10), gmax = lmax+10;
  function ltblHTML(){
    var a = '<tr>', b = '<tr>', j;
    for (j=0;j<6;j++){ a += '<th>'+MON[LANG][j]+'</th>'; b += '<td>'+lv[j]+'</td>'; }
    return '<table class="dtable">'+a+'</tr>'+b+'</tr></table>';
  }

  /* selecciones de los problemas */
  var kp = ri(0,4);
  var k2 = ri(1,2);
  var j4 = ri(2,3);
  var kfix = 5*ri(1,3);
  var jm = ri(1,4);
  function cntAbove(j){ var c2 = 0, m; for (m=0;m<6;m++) if (lv[m] > lv[j]) c2++; return c2; }
  var jtC = [1,2,3].filter(function(x){ return cntAbove(x) > 0; });
  var jt = jtC[Math.floor(rng()*jtC.length)];

  /* ============================================================
     IDEA 1 — preguntar, registrar, contar
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Antes de la gráfica hay una pregunta', en:'Before the graph there is a question'}),

  (function(){
    var wrap = widget('registro');

    var cnt = [0,0,0,0,0];
    var st = { i:0, tries:0, done:false, lock:false, hot:-1 };
    function binOf(v){ return Math.max(0, Math.min(4, Math.floor((v-s)/w))); }
    function tally(n2){
      if (n2 === 0) return '·';
      var out = '', j;
      for (j=0;j<n2;j++) out += (j>0 && j%5===0) ? ' |' : '|';
      return out;
    }
    function tbl(){
      var h = (LANG==='es') ? '<tr><th>Clase</th><th>Conteo</th><th>Frecuencia</th></tr>'
                            : '<tr><th>Class</th><th>Tally</th><th>Frequency</th></tr>';
      var r = '', j;
      for (j=0;j<5;j++){
        r += '<tr'+(st.hot===j ? ' class="hot"' : '')+'><td>'+eLo(j)+SEP+eHi(j)+
             '</td><td class="tallymk">'+tally(cnt[j])+'</td><td>'+cnt[j]+'</td></tr>';
      }
      return '<table class="dtable">'+h+r+'</table>';
    }
    function fbSet(msg, ok){
      var e = document.getElementById('rgFb'); if (!e) return;
      e.innerHTML = ok ? '<span class="okmsg">'+msg+'</span>' : msg;
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Llena la tabla', en:'Fill in the table'})+'</div>'+
          '<div class="iw-box">'+
            '<div class="iw-instr iw-sub">'+T({es:'Los seis datos ya están registrados en la tabla.', en:'The six values are now recorded in the table.'})+'</div>'+
            tbl()+
            '<div class="rfb"><span class="okmsg">'+T({
              es:'Así se registra un conjunto de datos: '+cnt.join(' + ')+' = 6, la misma cantidad de datos que se repartieron.',
              en:'That is how a set of data is recorded: '+cnt.join(' + ')+' = 6, the same amount of data that was handed out.'
            })+'</span></div>'+
          '</div>';
        return;
      }
      var v = PICKS[st.i], b = '', j;
      for (j=0;j<5;j++) b += '<button class="binbtn" data-bin="'+j+'">'+eLo(j)+SEP+eHi(j)+'</button>';
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Llena la tabla', en:'Fill in the table'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Dato',en:'Value'})+' '+(st.i+1)+' / '+PICKS.length+'</div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'Toca la clase a la que pertenece el dato: la marca de conteo y la frecuencia se actualizan al instante.',
            en:'Tap the class the value belongs to: the tally mark and the frequency update instantly.'
          })+'</div>'+
          '<div class="goalbar">'+T({es:'Registra este dato en su clase.', en:'Record this value in its class.'})+'</div>'+
          '<div class="bigval">'+v+' '+T(C.u)+'</div>'+
          tbl()+
          '<div class="binrow">'+b+'</div>'+
          '<div class="rfb" id="rgFb"></div>'+
        '</div>';
      wrap.querySelectorAll('.binbtn').forEach(function(btn){
        btn.addEventListener('click', function(){ pick(parseInt(btn.getAttribute('data-bin'),10)); });
      });
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.i++; st.tries = 0; st.lock = false; st.hot = -1;
        if (st.i >= PICKS.length) st.done = true;
        render();
      }, ms);
    }
    function pick(bi){
      if (st.done || st.lock) return;
      var v = PICKS[st.i], c = binOf(v);
      if (bi === c){
        cnt[c]++; st.hot = c; render();
        fbSet(T({
          es:'Correcto: '+v+' está entre '+eLo(c)+' y '+eHi(c)+', y esa clase ya reúne '+cnt[c]+'.',
          en:'Correct: '+v+' lies between '+eLo(c)+' and '+eHi(c)+', and that class now holds '+cnt[c]+'.'
        }), true);
        adv(1300); return;
      }
      st.tries++;
      if (st.tries >= 3){
        cnt[c]++; st.hot = c; render();
        fbSet(T({
          es:'Aquí va: '+v+' es mayor que '+eLo(c)+' y menor que '+eHi(c)+', así que se registra en esa clase.',
          en:'Here it goes: '+v+' is greater than '+eLo(c)+' and smaller than '+eHi(c)+', so it is recorded in that class.'
        }));
        adv(2500); return;
      }
      fbSet((bi < c)
        ? T({ es:'Todavía no: '+v+' es mayor que '+eHi(bi)+', el final de la clase que tocaste. Busca una clase más a la derecha.',
              en:'Not yet: '+v+' is greater than '+eHi(bi)+', the end of the class you tapped. Look one class further right.' })
        : T({ es:'Todavía no: '+v+' es menor que '+eLo(bi)+', el inicio de la clase que tocaste. Busca una clase más a la izquierda.',
              en:'Not yet: '+v+' is smaller than '+eLo(bi)+', the start of the class you tapped. Look one class further left.' }));
    }
    render();
  })();

  (function(){

          '</div>'+
        '</div>';
      }

          '<canvas class="gcanvas" id="hgCv"></canvas>'+
          '<div class="steprow">'+cells+'</div>'+

          '<div class="rfb" id="hgFb"></div>'+

      wrap.querySelectorAll('.stepbtn').forEach(function(b){
        b.addEventListener('click', function(){

            es:'La barra de la clase de '+eLo(idx)+' a '+eHi(idx)+' mide '+cur[idx]+'.',
            en:'The bar of the class from '+eLo(idx)+' to '+eHi(idx)+' measures '+cur[idx]+'.'
          }));
        });
      });
      var chk = document.getElementById('hgChk');
      if (chk) chk.addEventListener('click', function(){
        if (st.done) return;
        var miss = -1, j2;
        for (j2=0;j2<5;j2++) if (cur[j2] !== f[j2]){ miss = j2; break; }
        if (miss < 0){
          st.done = true;
          fbSet(T({
            es:'Terminado: una barra por clase, pegadas entre sí, y cada altura es la frecuencia de su clase.',
            en:'Done: one bar per class, touching each other, and each height is the frequency of its class.'
          }), true);
          return;
        }
        st.tries++;
        if (st.tries >= 3){
          for (j2=0;j2<5;j2++) cur[j2] = f[j2];

          fbSet(T({
            es:'Estas son las alturas de la tabla. Observa que ninguna barra deja hueco con la siguiente, porque las clases tampoco lo dejan.',
            en:'These are the heights from the table. Notice that no bar leaves a gap with the next one, because the classes do not leave one either.'
          }));

        var d = f[miss] - cur[miss];
        fbSet(d > 0
          ? T({ es:'La barra de la clase de '+eLo(miss)+' a '+eHi(miss)+' está '+d+' por debajo de su frecuencia. Súbela.',
                en:'The bar of the class from '+eLo(miss)+' to '+eHi(miss)+' is '+d+' below its frequency. Raise it.' })
          : T({ es:'La barra de la clase de '+eLo(miss)+' a '+eHi(miss)+' está '+(-d)+' por arriba de su frecuencia. Bájala.',
                en:'The bar of the class from '+eLo(miss)+' to '+eHi(miss)+' is '+(-d)+' above its frequency. Lower it.' }));
      });
      draw();
    }
    render();
    REDRAW.push(draw);
  })();

              '<div class="cdot"     data-color="#1a1a16" style="background:#1a1a16"></div>'+
              '<div class="cdot"     data-color="#8b2500" style="background:#8b2500"></div>'+
              '<div class="cdot"     data-color="#1d4e89" style="background:#1d4e89"></div>'+
              '<button class="clrbtn">'+t('btn-clear')+'</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="krow"><button class="rverify-btn" id="rfSave">'+T({es:'Guardar',en:'Save'})+'</button></div>'+
        '<div class="rfb" id="rfFb"></div>'+
      '</div>';
    wrap.querySelectorAll('.wtab').forEach(function(b){
      b.addEventListener('click', function(){
        var p = b.getAttribute('data-p');
        document.getElementById('rfType').classList.toggle('active', p === 'type');
        document.getElementById('rfDraw').classList.toggle('active', p === 'draw');
        wrap.querySelectorAll('.wtab').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        if (p === 'draw') setTimeout(function(){
          var c = document.getElementById('rfCv');
          if (c && c.getAttribute('data-ready') !== '1'){ c.setAttribute('data-ready','1'); initCanvas(c); }
        }, 60);
      });
    });
    var sv = document.getElementById('rfSave');
    if (sv) sv.addEventListener('click', function(){
      var e = document.getElementById('rfFb'); if (!e) return;
      e.innerHTML = '<span class="okmsg">'+T({
        es:'Guardado. Un título claro y unos ejes con nombre hacen la mitad del trabajo de comunicar.',
        en:'Saved. A clear title and named axes do half the work of communicating.'
      })+'</span>';
    });
  })();

  /* ---- P9 ---- */
  (function(){
    if (vsel[8] === 0){
      SP = {
        title:{es:'Dos escalas, un registro', en:'Two scales, one record'},
        q:{ es:'Dos personas grafican el mismo registro mensual. Una empieza el eje vertical en cero y avanza de diez en diez; la otra lo empieza justo debajo del registro más pequeño y avanza de dos en dos. ¿Qué produce esa diferencia?',
            en:'Two people graph the same monthly record. One starts the vertical axis at zero and advances in tens; the other starts it just below the smallest record and advances in twos. What does that difference produce?' },
        options:{ es:['En la segunda gráfica las subidas y bajadas se ven mucho más pronunciadas',
                      'En la segunda gráfica los registros resultan mayores, porque la escala los aumenta',
                      'Las dos gráficas quedan idénticas, porque la escala no altera la línea',
                      'En la segunda gráfica desaparecen los meses en los que el registro bajó'],
                  en:['In the second graph the rises and falls look far steeper',
                      'In the second graph the records turn out larger, because the scale increases them',
                      'The two graphs come out identical, because the scale does not alter the line',
                      'In the second graph the months where the record fell disappear'] },
        correct:{ es:'En la segunda gráfica las subidas y bajadas se ven mucho más pronunciadas',
                  en:'In the second graph the rises and falls look far steeper' },
        hint:{ es:'Imagina un cambio de dos unidades dibujado en dos ejes: uno que abarca cien unidades de alto y otro que abarca solo diez.',
               en:'Imagine a change of two units drawn on two axes: one that spans one hundred units of height and another that spans only ten.' },
        exp:{ es:'Los datos no cambian; lo que cambia es cuánto espacio del dibujo ocupa cada unidad. Con el eje recortado y pasos pequeños, un cambio pequeño llena la altura y parece enorme, y por eso al comunicar hay que declarar la escala.',
              en:'The data do not change; what changes is how much drawing space each unit takes. With a cropped axis and small steps, a small change fills the height and looks huge, which is why the scale has to be declared when communicating.' },
        showWork:false
      };
    } else {
      SP = {
        title:{es:'Lo que sostiene el histograma', en:'What the histogram supports'},
        q:{ es:'Un equipo presenta el histograma de '+C.reg(N).es+', sin ningún otro texto. ¿Qué afirmación se puede sostener solo con esa gráfica?',
            en:'A team presents the histogram of '+C.reg(N).en+', with no other text. Which claim can be supported with that graph alone?' },
        options:{ es:['Que la mayor parte de los datos se concentra en un tramo de valores',
                      'Que un estudiante en particular registró el valor más alto de todos',
                      'Que otro grupo obtendría este mismo reparto si se le preguntara',
                      'Que cada valor posible de la variable apareció por lo menos una vez'],
                  en:['That most of the data pile up in one stretch of values',
                      'That one particular student recorded the highest value of all',
                      'That another group would get this same spread if it were asked',
                      'That every possible value of the variable showed up at least once'] },
        correct:{ es:'Que la mayor parte de los datos se concentra en un tramo de valores',
                  en:'That most of the data pile up in one stretch of values' },
        hint:{ es:'Pregúntate qué guarda una barra: cuántos datos cayeron en su tramo, o cuáles fueron esos datos uno por uno.',
               en:'Ask yourself what a bar keeps: how many values fell in its stretch, or which those values were one by one.' },
        exp:{ es:'La barra solo dice cuántos datos cayeron en su tramo, así que la gráfica sostiene afirmaciones sobre dónde se concentran los datos, no sobre un dato en particular, ni sobre otro grupo, ni sobre valores sueltos dentro de una clase.',
              en:'A bar only says how many values fell in its stretch, so the graph supports claims about where the data pile up, not about one particular value, nor about another group, nor about single values inside a class.' },
        showWork:false
      };
    }
    addProb(SP);
  })();

  /* ---- P10 ---- */
  (function(){
    if (vsel[9] === 0){
      var ref10 = lv[jt], cnt10 = cntAbove(jt), names = [], j;
      for (j=0;j<6;j++) if (lv[j] > ref10) names.push({ es:MON.es[j], en:MON.en[j] });
      var nES = names.map(function(o){ return o.es; }).join(', ');
      var nEN = names.map(function(o){ return o.en; }).join(', ');
      SP = {
        title:{es:'Meses por encima de la referencia', en:'Months above the reference'},
        q:{ es:'La tabla registra '+LC.n.es+'.'+ltblHTML()+'¿En cuántos meses el registro fue mayor que el de '+MON.es[jt]+'?',
            en:'The table records '+LC.n.en+'.'+ltblHTML()+'In how many months was the record greater than the one of '+MON.en[jt]+'?' },
        options: uniq4(cnt10, [cnt10+1, cnt10-1, 6-cnt10, 6]),
        correct: String(cnt10),
        hint:{ es:'Toma el registro de ese mes como referencia y recorre la tabla comparando uno por uno; el mes de referencia no se cuenta a sí mismo.',
               en:'Take that month record as the reference and go through the table comparing one by one; the reference month does not count itself.' },
        exp:{ es:'La referencia es '+ref10+'. Los meses por encima de esa referencia: '+nES+'. Total: '+cnt10+'.',
              en:'The reference is '+ref10+'. The months above that reference: '+nEN+'. Total: '+cnt10+'.' },
        showWork:true
      };
    } else {
      var out10 = N - maxF - secondF;
      SP = {
        title:{es:'Fuera de las dos clases mayores', en:'Outside the two largest classes'},
        q:{ es:'La tabla registra '+C.reg(N).es+'.'+tblHTML()+'¿Cuántos datos quedaron fuera de las dos clases con más registros?',
            en:'The table records '+C.reg(N).en+'.'+tblHTML()+'How many values ended up outside the two classes with the most records?' },
        options: uniq4(out10, [maxF+secondF, out10+1, out10-1, N-maxF]),
        correct: String(out10),
        hint:{ es:'Localiza las dos frecuencias mayores de la tabla, súmalas y quita esa suma del total de datos registrados.',
               en:'Locate the two largest frequencies of the table, add them and take that sum away from the total recorded data.' },
        exp:{ es:'Las dos clases con más registros reúnen '+maxF+' y '+secondF+' datos, así que '+N+' − '+maxF+' − '+secondF+' = '+out10+'.',
              en:'The two classes with the most records gather '+maxF+' and '+secondF+' values, so '+N+' − '+maxF+' − '+secondF+' = '+out10+'.' },
        showWork:true
      };
    }
    addProb(SP);
  })();

  /* los canvas se redibujan cuando la pantalla ya es visible */
  setTimeout(function(){
    for (var q=0;q<REDRAW.length;q++){ try { REDRAW[q](); } catch(e){} }
  }, 220);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Recolección y Comunicación de Datos Estadísticos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
