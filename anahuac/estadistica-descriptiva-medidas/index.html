<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadística Descriptiva: Medidas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Estadística Descriptiva: Medidas</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático I · Sem 1</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Estadística Descriptiva: Medidas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c3c6c', primaryDark:'#072a4c', primaryBg:'#e6eef7',
  accent:'#e46c0c', accentBg:'#fdebdd',
  darkPrimary:'#3885d1', darkPrimaryDark:'#6aadf0', darkPrimaryBg:'#08233e',

  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================

   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;

  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

/* ==========================================================================
   GUIA :: Estadistica descriptiva, medidas de tendencia central y de dispersion.
   Media aritmetica como punto de equilibrio, mediana y moda, efecto de un valor
   atipico, rango y desviacion estandar, y lectura conjunta de las medidas.
   Bilingue (Rule 10), variantes por semilla (Rule 4), manipulativos marcados
   con data-widget (Part 0).
   ========================================================================== */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function clampn(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lst(a){ return a.join(', '); }
function dat(a){ return '<span class="dat">' + lst(a) + '</span>'; }
function frac(a, b){ return '<span class="mf-outer"><span class="mf-num">' + a + '</span><span class="mf-den">' + b + '</span></span>'; }
function sgn(x){ return x < 0 ? '−' + Math.abs(x) : String(x); }

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id, kind){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  d.setAttribute('data-widget', kind);
  parent.appendChild(d);
  return d;
}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ==========================================================================
   MANIPULATIVO 1 :: el punto de equilibrio  (data-widget="balance")
   Cinco datos sobre una recta numerica. Cada boton mueve un dato una unidad y
   el marcador triangular de la media se desplaza en el momento. El alumno debe
   llevar la media al objetivo marcado en rojo. Tres rondas, retroalimentacion
   direccional en cada ajuste y revelacion de un reparto valido al tercer fallo.
   ========================================================================== */
function wEquilibrio(rng, host){
  var LO = 0, HI = 40, N = 5;

  function mkRound(){
    var tgt = ri(rng, 14, 26);
    var v = [];
    for (var i = 0; i < N; i++) v.push(clampn(tgt + ri(rng, -9, 9), 2, 38));
    var s = 0;
    for (i = 0; i < N; i++) s += v[i];
    if (s === tgt * N) v[0] = clampn(v[0] + 3, 2, 38);
    return { tgt: tgt, v: v, sol: [tgt - 6, tgt - 3, tgt, tgt + 3, tgt + 6] };
  }

  var rounds = [mkRound(), mkRound(), mkRound()];
  var round = 0, tries = 0, locked = false, finished = false;
  var cur = rounds[0];

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Punto de equilibrio', en: 'Balance point' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="iw-sub">' + L({
      es: 'Usa los botones para mover cada dato una unidad a la vez. El triángulo dorado marca la media y se desplaza al instante; la línea roja marca el objetivo. Puedes ajustar cuantas veces quieras.',
      en: 'Use the buttons to move each value one unit at a time. The gold triangle marks the mean and shifts instantly; the red line marks the target. You can adjust as often as you like.'
    }) + '</div>' +
    '<div class="nl" data-r="line"></div>' +
    '<div data-r="steps"></div>' +
    '<div class="gw-read">' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Suma', en: 'Sum' }) + '</div><div class="gw-cv" data-r="sum"></div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Media actual', en: 'Current mean' }) + '</div><div class="gw-cv acc" data-r="mean"></div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Objetivo', en: 'Target' }) + '</div><div class="gw-cv" data-r="tgt"></div></div>' +
    '</div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="check">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es: 'Siguiente conjunto', en: 'Next set' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elLine = host.querySelector('[data-r="line"]'),
      elSteps = host.querySelector('[data-r="steps"]'),
      elSum = host.querySelector('[data-r="sum"]'),
      elMean = host.querySelector('[data-r="mean"]'),
      elTgt = host.querySelector('[data-r="tgt"]'),
      elCheck = host.querySelector('[data-r="check"]'),
      elNext = host.querySelector('[data-r="next"]');

  function sum(){ var s = 0; for (var i = 0; i < N; i++) s += cur.v[i]; return s; }
  function mean(){ return sum() / N; }
  function px(x){ return ((x - LO) / (HI - LO) * 100); }

  function drawLine(){
    var parts = ['<div class="nl-ax"></div>'];
    parts.push('<div class="nl-t" style="left:' + px(cur.tgt) + '%"></div>');
    parts.push('<div class="nl-tl" style="left:' + px(cur.tgt) + '%">' + L({ es: 'objetivo ', en: 'target ' }) + cur.tgt + '</div>');
    for (var k = 0; k <= 40; k += 10) parts.push('<div class="nl-k" style="left:' + px(k) + '%">' + k + '</div>');
    for (var i = 0; i < N; i++) parts.push('<div class="nl-dot" style="left:' + px(cur.v[i]) + '%"></div>');
    parts.push('<div class="nl-f" style="left:' + px(mean()) + '%"></div>');
    elLine.innerHTML = parts.join('');
  }

  function drawSteps(){
    var parts = [];
    for (var i = 0; i < N; i++){
      parts.push('<div class="stp">' +
        '<button class="stp-b" data-i="' + i + '" data-s="-1"' + (locked ? ' disabled' : '') + '>−</button>' +
        '<span class="stp-n">' + L({ es: 'dato ', en: 'value ' }) + (i + 1) + '</span>' +
        '<span class="stp-v">' + cur.v[i] + '</span>' +
        '<button class="stp-b" data-i="' + i + '" data-s="1"' + (locked ? ' disabled' : '') + '>+</button>' +
      '</div>');
    }
    elSteps.innerHTML = parts.join('');
    elSteps.querySelectorAll('.stp-b').forEach(function(b){
      b.addEventListener('click', function(){
        if (locked) return;
        var i = parseInt(b.getAttribute('data-i'), 10);
        var s = parseInt(b.getAttribute('data-s'), 10);
        cur.v[i] = clampn(cur.v[i] + s, 1, 39);
        drawSteps(); drawLine(); readout(); live();
      });
    });
  }

  function readout(){
    elSum.textContent = String(sum());
    elMean.textContent = mean().toFixed(2);
    elTgt.textContent = String(cur.tgt);
    elQ.innerHTML = L({
      es: 'Conjunto ' + (round + 1) + ' de 3. Ajusta los cinco datos hasta que la media valga exactamente ' + cur.tgt + '.',
      en: 'Set ' + (round + 1) + ' of 3. Adjust the five values until the mean is exactly ' + cur.tgt + '.'
    });
  }

  function live(){
    if (locked) return;
    var falta = cur.tgt * N - sum();
    if (falta === 0){
      say(host, 'warm', L({
        es: 'La media coincide con el objetivo. Comprueba para confirmarlo.',
        en: 'The mean now matches the target. Check it to confirm.'
      }));
    } else if (falta > 0){
      say(host, '', L({
        es: 'El triángulo está a la izquierda de la línea roja: faltan ' + falta + ' unidades repartidas entre los datos para alcanzar el objetivo.',
        en: 'The triangle sits to the left of the red line: ' + falta + ' units spread across the values are still missing to reach the target.'
      }));
    } else {
      say(host, '', L({
        es: 'El triángulo está a la derecha de la línea roja: sobran ' + (-falta) + ' unidades repartidas entre los datos.',
        en: 'The triangle sits to the right of the red line: there are ' + (-falta) + ' units too many spread across the values.'
      }));
    }
  }

  elCheck.addEventListener('click', function(){
    if (locked || finished) return;
    var falta = cur.tgt * N - sum();
    if (falta === 0){
      locked = true; drawSteps();
      elCheck.style.display = 'none'; elNext.style.display = '';
      say(host, 'good', L({
        es: '¡Equilibrado! La suma es ' + sum() + ' y al repartirla entre 5 datos la media vale ' + cur.tgt + '.',
        en: 'Balanced! The sum is ' + sum() + ' and shared among 5 values the mean is ' + cur.tgt + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur.v = cur.sol.slice();
      locked = true; drawSteps(); drawLine(); readout();
      elCheck.style.display = 'none'; elNext.style.display = '';
      say(host, 'warm', L({
        es: 'Este reparto sí funciona: ' + lst(cur.sol) + '. Lo que sobra por encima del objetivo, 3 más 6 unidades, iguala a lo que falta por debajo, 6 más 3 unidades, y por eso la media cae justo en ' + cur.tgt + '.',
        en: 'This arrangement does work: ' + lst(cur.sol) + '. The surplus above the target, 3 plus 6 units, equals the shortfall below, 6 plus 3 units, and that is why the mean lands exactly on ' + cur.tgt + '.'
      }));
      return;
    }
    live();
  });

  elNext.addEventListener('click', function(){
    round++;
    if (round >= 3){
      finished = true; locked = true;
      elCheck.style.display = 'none'; elNext.style.display = 'none';
      drawSteps();
      say(host, 'good', L({
        es: 'Tres conjuntos equilibrados. La media es el punto donde lo que sobra por arriba compensa exactamente lo que falta por abajo.',
        en: 'Three balanced sets. The mean is the point where the surplus above exactly offsets the shortfall below.'
      }));
      return;
    }
    cur = rounds[round]; tries = 0; locked = false;
    elCheck.style.display = ''; elNext.style.display = 'none';
    drawSteps(); drawLine(); readout();
    say(host, '', L({ es: 'Conjunto nuevo. Vuelve a llevar la media al objetivo.', en: 'New set. Bring the mean to the target again.' }));
  });

  drawSteps(); drawLine(); readout();
  say(host, '', L({ es: 'Mueve un dato y observa hacia dónde se corre el triángulo.', en: 'Move a value and watch which way the triangle slides.' }));
}

/* ==========================================================================
   MANIPULATIVO 2 :: ordenar y localizar el centro  (data-widget="order")
   El alumno toca dos fichas para intercambiarlas. El contador de parejas fuera
   de orden baja al instante. Al quedar ordenado, la posicion central se ilumina
   y aparece la mediana. Tres rondas con 7, 8 y 9 datos.
   ========================================================================== */
function wOrdena(rng, host){
  var POOL = [-13, -11, -8, -6, -4, -2, 1, 3, 5, 7, 10, 12, 15];

  function mkRound(n){
    var b = ri(rng, 20, 34);
    var ch = shuffle(POOL, rng).slice(0, n);
    ch.sort(function(x, y){ return x - y; });
    var sorted = ch.map(function(k){ return b + k; });
    var arr = shuffle(sorted, rng);
    var same = true;
    for (var i = 0; i < n; i++) if (arr[i] !== sorted[i]) same = false;
    if (same){ var t = arr[0]; arr[0] = arr[n - 1]; arr[n - 1] = t; }
    return { n: n, sorted: sorted, arr: arr };
  }

  var rounds = [mkRound(7), mkRound(8), mkRound(9)];
  var round = 0, tries = 0, sel = null, locked = false, finished = false;
  var cur = rounds[0];

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Ordena y localiza el centro', en: 'Sort and locate the centre' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="iw-sub">' + L({
      es: 'Toca una ficha y luego otra para intercambiarlas. El contador de parejas fuera de orden se actualiza al instante. Cuando todo quede en orden creciente, la posición central se ilumina.',
      en: 'Tap one chip and then another to swap them. The counter of out of order pairs updates instantly. When everything is in increasing order, the central position lights up.'
    }) + '</div>' +
    '<div class="oc-list" data-r="chips"></div>' +
    '<div class="gw-read">' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Datos', en: 'Values' }) + '</div><div class="gw-cv" data-r="n"></div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Parejas fuera de orden', en: 'Out of order pairs' }) + '</div><div class="gw-cv acc" data-r="inv"></div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Mediana', en: 'Median' }) + '</div><div class="gw-cv" data-r="med"></div></div>' +
    '</div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="check">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es: 'Siguiente conjunto', en: 'Next set' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elChips = host.querySelector('[data-r="chips"]'),
      elN = host.querySelector('[data-r="n"]'),
      elInv = host.querySelector('[data-r="inv"]'),
      elMed = host.querySelector('[data-r="med"]'),
      elCheck = host.querySelector('[data-r="check"]'),
      elNext = host.querySelector('[data-r="next"]');

  function inversions(){
    var c = 0;
    for (var i = 0; i < cur.n; i++) for (var j = i + 1; j < cur.n; j++) if (cur.arr[i] > cur.arr[j]) c++;
    return c;
  }
  function isSorted(){ return inversions() === 0; }
  function medianOf(a){
    var n = a.length;
    return (n % 2 === 1) ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2;
  }
  function medText(){
    var m = medianOf(cur.sorted);
    return (m === Math.floor(m)) ? String(m) : m.toFixed(1);
  }

  function render(){
    var mids = [];
    if (isSorted()){
      if (cur.n % 2 === 1) mids.push((cur.n - 1) / 2);
      else { mids.push(cur.n / 2 - 1); mids.push(cur.n / 2); }
    }
    var parts = [];
    for (var i = 0; i < cur.n; i++){
      var cls = 'oc' + (sel === i ? ' sel' : '') + (mids.indexOf(i) >= 0 ? ' mid' : '') + (locked ? ' lock' : '');
      parts.push('<div class="' + cls + '" data-i="' + i + '">' + cur.arr[i] +
        '<span class="oc-p">' + L({ es: 'pos ', en: 'pos ' }) + (i + 1) + '</span></div>');
    }
    elChips.innerHTML = parts.join('');
    elChips.querySelectorAll('.oc').forEach(function(c){
      c.addEventListener('click', function(){
        if (locked) return;
        var i = parseInt(c.getAttribute('data-i'), 10);
        if (sel === null) sel = i;
        else if (sel === i) sel = null;
        else { var t = cur.arr[sel]; cur.arr[sel] = cur.arr[i]; cur.arr[i] = t; sel = null; }
        render(); readout(); live();
      });
    });
  }

  function readout(){
    elN.textContent = String(cur.n);
    elInv.textContent = String(inversions());
    elMed.textContent = isSorted() ? medText() : '?';
    elQ.innerHTML = L({
      es: 'Conjunto ' + (round + 1) + ' de 3, con ' + cur.n + ' datos. Ordénalos de menor a mayor.',
      en: 'Set ' + (round + 1) + ' of 3, with ' + cur.n + ' values. Sort them from lowest to highest.'
    });
  }

  function live(){
    if (locked) return;
    var inv = inversions();
    if (inv === 0){
      say(host, 'warm', L({ es: 'Ya no queda ninguna pareja fuera de orden. Comprueba para leer la mediana.', en: 'No out of order pairs remain. Check it to read the median.' }));
      return;
    }
    var bad = 0;
    for (var i = 0; i < cur.n - 1; i++) if (cur.arr[i] > cur.arr[i + 1]){ bad = i; break; }
    say(host, '', L({
      es: 'Quedan ' + inv + ' parejas fuera de orden. El dato de la posición ' + (bad + 1) + ' es mayor que el de la posición ' + (bad + 2) + '.',
      en: 'There are ' + inv + ' out of order pairs left. The value in position ' + (bad + 1) + ' is greater than the one in position ' + (bad + 2) + '.'
    }));
  }

  function solved(revealed){
    locked = true; sel = null; render(); readout();
    elCheck.style.display = 'none'; elNext.style.display = '';
    var m = medText();
    var msg;
    if (cur.n % 2 === 1){
      msg = L({
        es: 'Con ' + cur.n + ' datos hay una sola posición central, la número ' + ((cur.n + 1) / 2) + ', y el valor que la ocupa es la mediana: ' + m + '.',
        en: 'With ' + cur.n + ' values there is a single central position, number ' + ((cur.n + 1) / 2) + ', and the value sitting there is the median: ' + m + '.'
      });
    } else {
      msg = L({
        es: 'Con ' + cur.n + ' datos hay dos posiciones centrales, la ' + (cur.n / 2) + ' y la ' + (cur.n / 2 + 1) + '. La mediana es el promedio de esos dos valores: ' + m + '.',
        en: 'With ' + cur.n + ' values there are two central positions, ' + (cur.n / 2) + ' and ' + (cur.n / 2 + 1) + '. The median is the average of those two values: ' + m + '.'
      });
    }
    say(host, revealed ? 'warm' : 'good', (revealed ? L({ es: 'Este es el orden correcto. ', en: 'This is the correct order. ' }) : '') + msg);
  }

  elCheck.addEventListener('click', function(){
    if (locked || finished) return;
    if (isSorted()){ solved(false); return; }
    tries++;
    if (tries >= 3){ cur.arr = cur.sorted.slice(); solved(true); return; }
    live();
  });

  elNext.addEventListener('click', function(){
    round++;
    if (round >= 3){
      finished = true; locked = true;
      elNext.style.display = 'none';
      say(host, 'good', L({
        es: 'La mediana no depende del tamaño de los valores sino de la posición que ocupan una vez ordenados.',
        en: 'The median does not depend on how large the values are but on the position they occupy once sorted.'
      }));
      return;
    }
    cur = rounds[round]; tries = 0; locked = false; sel = null;
    elCheck.style.display = ''; elNext.style.display = 'none';
    render(); readout();
    say(host, '', L({ es: 'Conjunto nuevo. Ordénalo otra vez.', en: 'New set. Sort it again.' }));
  });

  render(); readout();
  say(host, '', L({ es: 'Intercambia dos fichas y observa cómo baja el contador.', en: 'Swap two chips and watch the counter drop.' }));
}

/* ==========================================================================
   MANIPULATIVO 3 :: el dato que jala la media  (data-widget="slider")
   Seis datos fijos y uno movil. El deslizador cambia el dato mas alto y las dos
   lineas horizontales, media y mediana, se recalculan al instante: una se mueve
   y la otra no. Reto por ronda: colocar la media en un valor exacto.
   ========================================================================== */
function wAtipico(rng, host){
  function mkRound(){
    var b = ri(rng, 12, 20);
    var base = [b - 6, b - 4, b - 1, b + 1, b + 3, b + 5];
    var S6 = 6 * b - 2;
    var T = b + ri(rng, 3, 8);
    return { base: base, S6: S6, med: b + 1, xmin: b + 6, xmax: b + 76, T: T, xt: 7 * T - S6, x: b + 6 };
  }

  var rounds = [mkRound(), mkRound(), mkRound()];
  var round = 0, tries = 0, locked = false, finished = false;
  var cur = rounds[0];

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'El dato que jala la media', en: 'The value that pulls the mean' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="iw-sub">' + L({
      es: 'La barra dorada es el dato más alto del conjunto y el deslizador lo mueve. La línea roja es la media y la línea verde es la mediana. Observa cuál de las dos se mueve contigo.',
      en: 'The gold bar is the highest value in the set and the slider moves it. The red line is the mean and the green line is the median. Watch which of the two moves with you.'
    }) + '</div>' +
    '<div class="chart" data-r="chart"></div>' +
    '<input class="gw-range" type="range" data-r="sl">' +
    '<div class="gw-read">' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Dato móvil', en: 'Movable value' }) + '</div><div class="gw-cv acc" data-r="x"></div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Media', en: 'Mean' }) + '</div><div class="gw-cv" data-r="mean"></div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Mediana', en: 'Median' }) + '</div><div class="gw-cv" data-r="med"></div></div>' +
    '</div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="check">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="next" style="display:none">' + L({ es: 'Siguiente conjunto', en: 'Next set' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elChart = host.querySelector('[data-r="chart"]'),
      elSl = host.querySelector('[data-r="sl"]'),
      elX = host.querySelector('[data-r="x"]'),
      elMean = host.querySelector('[data-r="mean"]'),
      elMed = host.querySelector('[data-r="med"]'),
      elCheck = host.querySelector('[data-r="check"]'),
      elNext = host.querySelector('[data-r="next"]');

  function mean(){ return (cur.S6 + cur.x) / 7; }

  function draw(){
    var vals = cur.base.concat([cur.x]);
    var top = cur.xmax;
    var parts = [];
    for (var i = 0; i < vals.length; i++){
      var h = Math.max(3, vals[i] / top * 100);
      parts.push('<div class="chcol"><div class="chv">' + vals[i] + '</div>' +
        '<div class="chbar' + (i === 6 ? ' mv' : '') + '" style="height:' + h.toFixed(1) + '%"></div></div>');
    }
    parts.push('<div class="chline" style="bottom:' + (mean() / top * 100).toFixed(1) + '%"></div>');
    parts.push('<div class="chline med" style="bottom:' + (cur.med / top * 100).toFixed(1) + '%"></div>');
    elChart.innerHTML = parts.join('');
    elX.textContent = String(cur.x);
    elMean.textContent = mean().toFixed(2);
    elMed.textContent = String(cur.med);
    elQ.innerHTML = L({
      es: 'Conjunto ' + (round + 1) + ' de 3. Coloca el dato más alto de modo que la media valga exactamente ' + cur.T + '.',
      en: 'Set ' + (round + 1) + ' of 3. Place the highest value so that the mean is exactly ' + cur.T + '.'
    });
  }

  function live(){
    if (locked) return;
    var d = mean() - cur.T;
    if (Math.abs(d) < 0.001){
      say(host, 'warm', L({ es: 'La media llegó al valor pedido. Comprueba para confirmarlo.', en: 'The mean reached the requested value. Check it to confirm.' }));
      return;
    }
    var a = Math.abs(d).toFixed(2);
    say(host, '', L({
      es: 'La media va en ' + mean().toFixed(2) + ', ' + a + ' unidades ' + (d < 0 ? 'por debajo' : 'por encima') + ' del valor pedido, y la mediana sigue clavada en ' + cur.med + '. Mueve el dato ' + (d < 0 ? 'hacia la derecha' : 'hacia la izquierda') + '.',
      en: 'The mean is at ' + mean().toFixed(2) + ', ' + a + ' units ' + (d < 0 ? 'below' : 'above') + ' the requested value, and the median is still stuck at ' + cur.med + '. Move the value ' + (d < 0 ? 'to the right' : 'to the left') + '.'
    }));
  }

  function setRound(){
    cur = rounds[round]; tries = 0; locked = false;
    elSl.min = cur.xmin; elSl.max = cur.xmax; elSl.step = 1; elSl.value = cur.x;
    elSl.disabled = false;
    elCheck.style.display = ''; elNext.style.display = 'none';
    draw();
  }

  elSl.addEventListener('input', function(){
    if (locked) return;
    cur.x = parseInt(elSl.value, 10);
    draw(); live();
  });

  elCheck.addEventListener('click', function(){
    if (locked || finished) return;
    if (cur.S6 + cur.x === 7 * cur.T){
      locked = true; elSl.disabled = true;
      elCheck.style.display = 'none'; elNext.style.display = '';
      say(host, 'good', L({
        es: '¡Exacto! Con el dato móvil en ' + cur.x + ' la media vale ' + cur.T + ', mientras que la mediana no se movió de ' + cur.med + ' en todo el recorrido.',
        en: 'Exactly! With the movable value at ' + cur.x + ' the mean is ' + cur.T + ', while the median never left ' + cur.med + ' throughout.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur.x = cur.xt; elSl.value = cur.xt; draw();
      locked = true; elSl.disabled = true;
      elCheck.style.display = 'none'; elNext.style.display = '';
      say(host, 'warm', L({
        es: 'El valor que lo consigue es ' + cur.xt + '. La media se calcula con la suma de los siete datos, así que un solo dato extremo la arrastra; la mediana solo mira qué valor ocupa la posición central y por eso se queda en ' + cur.med + '.',
        en: 'The value that achieves it is ' + cur.xt + '. The mean is computed from the sum of all seven values, so a single extreme value drags it along; the median only looks at which value holds the central position and therefore stays at ' + cur.med + '.'
      }));
      return;
    }
    live();
  });

  elNext.addEventListener('click', function(){
    round++;
    if (round >= 3){
      finished = true; locked = true; elSl.disabled = true;
      elNext.style.display = 'none';
      say(host, 'good', L({
        es: 'Un valor atípico desplaza la media y deja intacta la mediana. Por eso, cuando hay datos extremos, la mediana suele describir mejor al caso típico.',
        en: 'An outlier shifts the mean and leaves the median untouched. That is why, when extreme values are present, the median usually describes the typical case better.'
      }));
      return;
    }
    setRound();
    say(host, '', L({ es: 'Conjunto nuevo. Vuelve a colocar la media donde se pide.', en: 'New set. Place the mean where it is requested again.' }));
  });

  setRound();
  say(host, '', L({ es: 'Desliza y observa las dos líneas al mismo tiempo.', en: 'Slide it and watch both lines at the same time.' }));
}

/* ==========================================================================
   MANIPULATIVO 4 :: centro o dispersion  (data-widget="classify")
   Cada tarjeta describe una medida o una idea y el alumno decide en que columna
   entra. Tres intentos por tarjeta y luego se revela la respuesta con el motivo.
   ========================================================================== */
function wClasifica(rng, host){
  var BINS = L({ es: ['Describe el centro', 'Describe la dispersión'], en: ['Describes the centre', 'Describes the spread'] });
  var ITEMS = [
    { es: 'La media aritmética', en: 'The arithmetic mean', bin: 0 },
    { es: 'El rango', en: 'The range', bin: 1 },
    { es: 'La moda', en: 'The mode', bin: 0 },
    { es: 'La desviación estándar', en: 'The standard deviation', bin: 1 },
    { es: 'El valor que ocupa la posición central', en: 'The value in the central position', bin: 0 },
    { es: 'La diferencia entre el dato mayor y el menor', en: 'The difference between the largest and the smallest value', bin: 1 },
    { es: 'El dato que aparece con mayor frecuencia', en: 'The value that appears most often', bin: 0 },
    { es: 'Qué tan lejos se apartan los datos del promedio', en: 'How far the values sit from the average', bin: 1 }
  ];
  var seq = shuffle([0, 1, 2, 3, 4, 5, 6, 7], rng).slice(0, 6);
  var i = 0, tries = 0, correct = 0, done = false;

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Centro o dispersión', en: 'Centre or spread' }) + '</div>' +
    '<div class="gw-q">' + L({ es: 'Decide qué describe cada tarjeta.', en: 'Decide what each card describes.' }) + '</div>' +
    '<div class="iw-sub">' + L({
      es: 'Una medida de tendencia central responde dónde está el grupo; una medida de dispersión responde qué tan junto o separado está. Toca la columna que corresponda.',
      en: 'A measure of central tendency answers where the group is; a measure of spread answers how tightly or loosely it sits. Tap the column that fits.'
    }) + '</div>' +
    '<div class="cls-prog" data-r="prog"></div>' +
    '<div class="cls-card" data-r="card"></div>' +
    '<div class="cls-bins">' +
      '<button class="gw-btn" data-b="0" style="flex:1">' + BINS[0] + '</button>' +
      '<button class="gw-btn" data-b="1" style="flex:1">' + BINS[1] + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elProg = host.querySelector('[data-r="prog"]'),
      elCard = host.querySelector('[data-r="card"]');

  function render(){
    if (done){
      elProg.textContent = '';
      elCard.textContent = L({ es: 'Completado: ' + correct + ' de 6 a la primera.', en: 'Completed: ' + correct + ' out of 6 on the first try.' });
      host.querySelectorAll('.cls-bins .gw-btn').forEach(function(b){ b.disabled = true; });
      return;
    }
    elProg.textContent = (i + 1) + ' / 6';
    elCard.textContent = L(ITEMS[seq[i]]);
  }

  function step(){
    tries = 0; i++;
    if (i >= 6){
      done = true; render();
      say(host, 'good', L({
        es: 'Un informe honesto lleva las dos cosas: una medida de centro y una de dispersión. Con una sola se puede describir un grupo que no existe.',
        en: 'An honest report carries both: a measure of centre and a measure of spread. With only one of them you can describe a group that does not exist.'
      }));
      return;
    }
    render();
  }

  host.querySelectorAll('.cls-bins .gw-btn').forEach(function(b){
    b.addEventListener('click', function(){
      if (done) return;
      var bi = parseInt(b.getAttribute('data-b'), 10);
      var it = ITEMS[seq[i]];
      if (bi === it.bin){
        if (tries === 0) correct++;
        say(host, 'good', L({ es: 'Correcto. Sigue la siguiente tarjeta.', en: 'Correct. Next card.' }));
        setTimeout(step, 550);
        return;
      }
      tries++;
      if (tries >= 3){
        say(host, 'warm', L({
          es: 'Entra en ' + BINS[it.bin] + '. Pregunta clave: esta tarjeta te dice dónde está el grupo o qué tan repartido está.',
          en: 'It belongs in ' + BINS[it.bin] + '. Key question: does this card tell you where the group is or how spread out it is.'
        }));
        setTimeout(step, 1600);
        return;
      }
      say(host, 'miss', L({
        es: 'Todavía no. Pregúntate si esa idea señala un valor representativo o una distancia entre datos.',
        en: 'Not yet. Ask yourself whether that idea points to a representative value or to a distance between values.'
      }));
    });
  });

  render();
  say(host, '', L({ es: 'Seis tarjetas, dos columnas.', en: 'Six cards, two columns.' }));
}

/* ==========================================================================
   MANIPULATIVO 5 :: construir la desviacion paso a paso (data-widget="deviation")
   El alumno elige la desviacion de cada dato respecto de la media y la tabla se
   va llenando; al completarla aparecen la suma de cuadrados, la varianza y la
   desviacion estandar. Retroalimentacion direccional por signo y por tamano.
   ========================================================================== */
function wDesviacion(rng, host){
  function mkRound(){
    var m = ri(rng, 12, 24);
    var d = shuffle([-6, -2, 0, 2, 6], rng);
    var opts = d.map(function(dv){
      var out = [dv], cand = [-dv, dv + 2, dv - 2, dv + 1, dv - 1, dv + 4, dv - 4];
      for (var j = 0; j < cand.length && out.length < 4; j++) if (out.indexOf(cand[j]) < 0) out.push(cand[j]);
      return shuffle(out, rng);
    });
    return { m: m, d: d, v: d.map(function(k){ return m + k; }), opts: opts, got: [null, null, null, null, null] };
  }

  var rounds = [mkRound(), mkRound()];
  var round = 0, i = 0, tries = 0, finished = false;
  var cur = rounds[0];

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Construye la desviación', en: 'Build the deviation' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="iw-sub">' + L({
      es: 'Para cada dato, elige cuántas unidades lo separan de la media y con qué signo. La tabla se llena sola y al final aparece el resultado completo.',
      en: 'For each value, choose how many units separate it from the mean and with which sign. The table fills itself in and the full result appears at the end.'
    }) + '</div>' +
    '<table class="dvt"><thead><tr>' +
      '<th>' + L({ es: 'Dato', en: 'Value' }) + '</th>' +
      '<th>' + L({ es: 'Dato menos media', en: 'Value minus mean' }) + '</th>' +
      '<th>' + L({ es: 'Al cuadrado', en: 'Squared' }) + '</th>' +
    '</tr></thead><tbody data-r="rows"></tbody></table>' +
    '<div class="gw-lbl" data-r="ask"></div>' +
    '<div class="gw-row" data-r="opts"></div>' +
    '<div class="gw-read" data-r="res" style="display:none">' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Suma de cuadrados', en: 'Sum of squares' }) + '</div><div class="gw-cv" data-r="ss"></div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Varianza', en: 'Variance' }) + '</div><div class="gw-cv" data-r="va"></div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es: 'Desviación estándar', en: 'Standard deviation' }) + '</div><div class="gw-cv acc" data-r="sd"></div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="next" style="display:none">' + L({ es: 'Otro conjunto', en: 'Another set' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elRows = host.querySelector('[data-r="rows"]'),
      elAsk = host.querySelector('[data-r="ask"]'),
      elOpts = host.querySelector('[data-r="opts"]'),
      elRes = host.querySelector('[data-r="res"]'),
      elSS = host.querySelector('[data-r="ss"]'),
      elVA = host.querySelector('[data-r="va"]'),
      elSD = host.querySelector('[data-r="sd"]'),
      elNext = host.querySelector('[data-r="next"]');

  function render(){
    elQ.innerHTML = L({
      es: 'Conjunto ' + (round + 1) + ' de 2: ' + lst(cur.v) + '. Su media es ' + cur.m + '.',
      en: 'Set ' + (round + 1) + ' of 2: ' + lst(cur.v) + '. Its mean is ' + cur.m + '.'
    });
    var parts = [];
    for (var k = 0; k < 5; k++){
      var g = cur.got[k];
      parts.push('<tr' + (k === i ? ' class="now"' : '') + '><td>' + cur.v[k] + '</td>' +
        '<td' + (g !== null ? ' class="em"' : '') + '>' + (g !== null ? sgn(g) : '?') + '</td>' +
        '<td>' + (g !== null ? (g * g) : '?') + '</td></tr>');
    }
    elRows.innerHTML = parts.join('');
    if (i >= 5){ elAsk.textContent = ''; elOpts.innerHTML = ''; return; }
    elAsk.textContent = L({
      es: 'Desviación del dato ' + cur.v[i],
      en: 'Deviation of the value ' + cur.v[i]
    });
    elOpts.innerHTML = cur.opts[i].map(function(o){
      return '<button class="gw-btn" data-o="' + o + '">' + sgn(o) + '</button>';
    }).join('');
    elOpts.querySelectorAll('.gw-btn').forEach(function(b){
      b.addEventListener('click', function(){ choose(parseInt(b.getAttribute('data-o'), 10)); });
    });
  }

  function finish(){
    var ss = 0;
    for (var k = 0; k < 5; k++) ss += cur.d[k] * cur.d[k];
    var va = ss / 5, sd = Math.sqrt(va);
    elRes.style.display = '';
    elSS.textContent = String(ss);
    elVA.textContent = String(va);
    elSD.textContent = sd.toFixed(2);
    elNext.style.display = (round === 0) ? '' : 'none';
    if (round === 0){
      say(host, 'good', L({
        es: 'Los cuadrados suman ' + ss + '; al repartirlos entre los 5 datos se obtiene la varianza, ' + va + ', y su raíz cuadrada es la desviación estándar, ' + sd.toFixed(2) + '. Ese número se lee en las mismas unidades que los datos.',
        en: 'The squares add up to ' + ss + '; sharing them among the 5 values gives the variance, ' + va + ', and its square root is the standard deviation, ' + sd.toFixed(2) + '. That number is read in the same units as the data.'
      }));
    } else {
      finished = true;
      say(host, 'good', L({
        es: 'Otra vez la desviación estándar vale ' + sd.toFixed(2) + '. Elevar al cuadrado cumple dos funciones: borra los signos, para que las desviaciones no se cancelen entre sí, y castiga más a los datos que se apartan mucho.',
        en: 'Once again the standard deviation is ' + sd.toFixed(2) + '. Squaring does two jobs: it removes the signs, so the deviations do not cancel each other out, and it penalises more heavily the values that sit far away.'
      }));
    }
  }

  function choose(o){
    if (i >= 5) return;
    var dv = cur.d[i];
    if (o === dv){
      cur.got[i] = dv; i++; tries = 0; render();
      if (i >= 5) finish();
      else say(host, 'good', L({ es: 'Correcto. Sigue el siguiente dato.', en: 'Correct. On to the next value.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      var vi = cur.v[i];
      cur.got[i] = dv; i++; tries = 0; render();
      say(host, 'warm', L({
        es: 'La desviación de ' + vi + ' era ' + sgn(dv) + '. Se obtiene restando la media al dato, siempre en ese orden.',
        en: 'The deviation of ' + vi + ' was ' + sgn(dv) + '. It comes from subtracting the mean from the value, always in that order.'
      }));
      if (i >= 5) finish();
      return;
    }
    var msg;
    if (dv === 0) msg = L({ es: 'Ese dato coincide con la media, de modo que no se aparta nada de ella.', en: 'That value coincides with the mean, so it does not depart from it at all.' });
    else if ((o < 0) !== (dv < 0)) msg = L({
      es: 'El signo no cuadra: el dato ' + cur.v[i] + ' está ' + (dv > 0 ? 'por encima' : 'por debajo') + ' de la media ' + cur.m + '.',
      en: 'The sign does not fit: the value ' + cur.v[i] + ' sits ' + (dv > 0 ? 'above' : 'below') + ' the mean ' + cur.m + '.'
    });
    else msg = L({
      es: 'El signo es correcto, pero el tamaño no: cuenta cuántas unidades hay entre ' + cur.v[i] + ' y ' + cur.m + '.',
      en: 'The sign is right, but the size is not: count how many units lie between ' + cur.v[i] + ' and ' + cur.m + '.'
    });
    say(host, 'miss', msg);
  }

  elNext.addEventListener('click', function(){
    if (finished) return;
    round = 1; cur = rounds[1]; i = 0; tries = 0;
    elRes.style.display = 'none'; elNext.style.display = 'none';
    render();
    say(host, '', L({ es: 'Conjunto nuevo. Repite el recorrido con otros números.', en: 'New set. Walk through it again with other numbers.' }));
  });

  render();
  say(host, '', L({ es: 'Empieza por el primer dato de la tabla.', en: 'Start with the first value in the table.' }));
}

/* ==========================================================================
   EJERCICIO REFLEXIVO :: decidir que medida se reporta (data-widget="reflect")

function wReflect(rng, host){

    { es: 'Elige algo que se mida en tu escuela, por ejemplo el tiempo de traslado o las horas de estudio semanales. Escribe qué medida de tendencia central reportarías, por qué, y qué medida de dispersión la acompañaría.',

      '<button class="wtab active" onclick="reflectTab(\'type\',this)">' + L({ es: '⌨️ Escribir', en: '⌨️ Write' }) + '</button>' +
      '<button class="wtab" onclick="reflectTab(\'draw\',this)">' + L({ es: '✏️ Dibujar', en: '✏️ Sketch' }) + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="reflect_type"><textarea class="wtextarea" id="reflectTa" placeholder="' + L({ es: 'Tu respuesta...', en: 'Your answer...' }) + '"></textarea></div>' +
    '<div class="wpanel" id="reflect_draw">' +
      '<div class="cvwrap">' +
        '<canvas class="dcanvas" id="reflectCv"></canvas>' +
        '<div class="ctoolbar">' +
          '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
          '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
          '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
          '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
          '<div class="cdot"     data-color="#1a1a16" style="background:#1a1a16"></div>' +
          '<div class="cdot"     data-color="#8b2500" style="background:#8b2500"></div>' +
          '<div class="cdot"     data-color="#1d4e89" style="background:#1d4e89"></div>' +
          '<button class="clrbtn">' + t('btn-clear') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" onclick="reflectSave()">' + L({ es: 'Guardar', en: 'Save' }) + '</button></div>' +
    '<div class="gw-fb">' + L({
      es: 'Aquí no hay una sola respuesta correcta: lo que cuenta es que la medida elegida describa al grupo del que hablas.',
      en: 'There is no single right answer here: what counts is that the measure you choose actually describes the group you are talking about.'
    }) + '</div>';
}

function reflectTab(which, btn){
  ['type', 'draw'].forEach(function(k){
    var el = document.getElementById('reflect_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var tabs = btn.closest('.wtabs');
  if (tabs) tabs.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('reflectCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}

function reflectSave(){
  var host = document.getElementById('wReflexion');
  if (!host) return;
  say(host, 'good', L({
    es: '✓ Guardado. Buen razonamiento: describir un grupo con honestidad exige decir dónde está y qué tan disperso es.',
    en: '✓ Saved. Good thinking: describing a group honestly requires saying where it is and how spread out it is.'
  }));
}

/* ==========================================================================
   PROBLEMAS GRADUADOS :: cada ranura tiene variantes elegidas por la semilla
   ========================================================================== */
function mkP1(rng){
  var m = ri(rng, 14, 22);
  var vA = shuffle([m - 5, m - 3, m + 1, m + 2, m + 5], rng);
  var b = ri(rng, 30, 44);
  var vB = shuffle([b - 6, b - 4, b - 1, b + 2, b + 3, b + 6], rng);
  var vs = [
    {
      title: { es: 'La calificación promedio', en: 'The average grade' },
      q: { es: 'La coordinación académica registró la calificación final de cinco estudiantes de un mismo grupo: ' + dat(vA) + '. Determina la media aritmética del conjunto.',
           en: 'The academic office recorded the final grade of five students from the same group: ' + dat(vA) + '. Determine the arithmetic mean of the set.' },
      opts: { es: [String(m), String(m + 1), String(m + 2), String(m - 1)], en: [String(m), String(m + 1), String(m + 2), String(m - 1)] },
      ci: 0,
      hint: { es: 'La media aritmética es ' + frac('la suma de todos los datos', 'la cantidad de datos') + '. Suma primero los cinco valores.',
              en: 'The arithmetic mean is ' + frac('the sum of all the values', 'how many values there are') + '. Add the five values first.' },
      exp: { es: 'La suma de los cinco valores es ' + (5 * m) + ' y hay 5 datos, de modo que ' + (5 * m) + ' repartido entre 5 da = ' + m + '. El valor ' + (m + 1) + ' es la mediana del conjunto, no su media.',
             en: 'The five values add up to ' + (5 * m) + ' and there are 5 of them, so ' + (5 * m) + ' shared among 5 gives = ' + m + '. The value ' + (m + 1) + ' is the median of the set, not its mean.' },
      showWork: true
    },
    {
      title: { es: 'El tiempo de reacción promedio', en: 'The average reaction time' },
      q: { es: 'Un laboratorio escolar midió el tiempo de reacción, en centésimas de segundo, de seis participantes: ' + dat(vB) + '. Determina la media aritmética del conjunto.',
           en: 'A school laboratory measured the reaction time, in hundredths of a second, of six participants: ' + dat(vB) + '. Determine the arithmetic mean of the set.' },
      opts: { es: [String(b), String(b + 1), String(b - 1), String(b + 2)], en: [String(b), String(b + 1), String(b - 1), String(b + 2)] },
      ci: 0,
      hint: { es: 'La media aritmética es ' + frac('la suma de todos los datos', 'la cantidad de datos') + '. Suma primero los seis tiempos.',
              en: 'The arithmetic mean is ' + frac('the sum of all the values', 'how many values there are') + '. Add the six times first.' },
      exp: { es: 'Los seis tiempos suman ' + (6 * b) + ' y hay 6 datos, así que ' + (6 * b) + ' repartido entre 6 da = ' + b + '.',
             en: 'The six times add up to ' + (6 * b) + ' and there are 6 of them, so ' + (6 * b) + ' shared among 6 gives = ' + b + '.' },
      showWork: true
    }
  ];
  return pk(rng, vs);
}

function mkP2(rng){
  var m = ri(rng, 12, 18);
  var M = ri(rng, 16, 24);
  var four = shuffle([M - 6, M - 2, M + 3, M + 4], rng);
  var vs = [
    {
      title: { es: 'Un dato que no mueve nada', en: 'A value that moves nothing' },
      q: { es: 'En un grupo de ocho estudiantes la media de las calificaciones es ' + m + '. Se integra un noveno estudiante cuya calificación es exactamente ' + m + '. Determina qué ocurre con la media del grupo.',
           en: 'In a group of eight students the mean of the grades is ' + m + '. A ninth student joins with a grade of exactly ' + m + '. Determine what happens to the mean of the group.' },
      opts: {
        es: ['Permanece en ' + m + ', porque el dato agregado coincide con el valor de equilibrio',
             'Aumenta, porque el conjunto pasa a tener un dato más que antes',
             'Disminuye, porque la misma suma se reparte ahora entre nueve datos',
             'No puede determinarse sin conocer las ocho calificaciones individuales'],
        en: ['It stays at ' + m + ', because the added value coincides with the balance point',
             'It increases, because the set now holds one more value than before',
             'It decreases, because the same sum is now shared among nine values',
             'It cannot be determined without knowing the eight individual grades']
      },
      ci: 0,
      hint: { es: 'Escribe la suma total antes y después: la suma crece justo en el valor agregado y la cantidad de datos crece en uno.',
              en: 'Write the total sum before and after: the sum grows by exactly the added value and the count grows by one.' },
      exp: { es: 'La suma inicial equivale a ocho veces la media. Al agregar un dato igual a la media, la nueva suma equivale a nueve veces ese mismo valor y al repartirla entre nueve datos se recupera ' + m + '. Un dato que cae justo en el punto de equilibrio no lo desplaza.',
             en: 'The initial sum equals eight times the mean. Adding a value equal to the mean makes the new sum nine times that same value, and sharing it among nine values recovers ' + m + '. A value landing exactly on the balance point does not shift it.' },
      showWork: false
    },
    {
      title: { es: 'El dato que falta', en: 'The missing value' },
      q: { es: 'Se sabe que la media de cinco números es ' + M + ' y que cuatro de ellos son ' + dat(four) + '. Determina el quinto número del conjunto.',
           en: 'The mean of five numbers is known to be ' + M + ' and four of them are ' + dat(four) + '. Determine the fifth number of the set.' },
      opts: { es: [String(M + 1), String(M), String(M + 5), String(M - 1)], en: [String(M + 1), String(M), String(M + 5), String(M - 1)] },
      ci: 0,
      hint: { es: 'Si la media vale ' + M + ' con cinco datos, la suma total tiene que ser cinco veces ese valor. Resta a esa suma lo que ya aportan los cuatro números conocidos.',
              en: 'If the mean is ' + M + ' with five values, the total sum must be five times that value. Subtract from that sum what the four known numbers already contribute.' },
      exp: { es: 'La suma total requerida es ' + (5 * M) + ' y los cuatro números conocidos suman ' + (4 * M - 1) + '. La diferencia entre ambas cantidades es = ' + (M + 1) + '.',
             en: 'The required total sum is ' + (5 * M) + ' and the four known numbers add up to ' + (4 * M - 1) + '. The difference between the two amounts is = ' + (M + 1) + '.' },
      showWork: true
    }
  ];
  return pk(rng, vs);
}

function mkP3(rng){
  var b = ri(rng, 20, 30);
  var vA = shuffle([b - 9, b - 5, b - 3, b - 1, b + 1, b + 3, b + 6, b + 16], rng);
