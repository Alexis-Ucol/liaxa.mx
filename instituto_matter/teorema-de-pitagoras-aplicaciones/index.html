<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teorema de Pitágoras: Aplicaciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.mwrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; }
.mcv { display:block; width:100%; height:260px; touch-action:none; background:var(--surface); border:1px solid var(--border); border-radius:8px; }
.mhead { display:flex; justify-content:space-between; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.45rem; }
.mtitle { font-weight:600; font-size:.95rem; }
.mround { font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.mtask { font-size:.85rem; color:var(--text2); margin-bottom:.6rem; }
.mrow { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; margin-top:.6rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .85rem; font-size:.82rem; cursor:pointer; color:var(--text2); font-family:inherit; min-height:44px; transition:all .14s; }
.mbtn:hover { border-color:var(--green); color:var(--green); }
.mbtn.go { background:var(--green); color:#fff; border-color:var(--green); }
.mbtn.go:hover { background:var(--green-dark); color:#fff; }
.mval { font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--green); min-width:30px; display:inline-block; text-align:center; font-size:.95rem; }
.mfb { margin-top:.7rem; padding:.6rem .85rem; border-radius:8px; font-size:.84rem; background:var(--surface2); color:var(--text2); border-left:3px solid var(--border); }
.mfb.good { background:var(--ok-bg); color:var(--ok); border-left-color:var(--ok); }
.mfb.near { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.mstat { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.mtile { background:var(--surface2); border-radius:8px; padding:.55rem .35rem; text-align:center; border:1.5px solid var(--border); }
.mtile.hit { border-color:var(--ok); background:var(--ok-bg); }
.mtile .tl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.mtile .tv { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--text); }
.mslide { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-top:.7rem; }
.mslide label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.mslide input[type=range] { width:100%; accent-color:var(--green); height:28px; }
.mslide.one { grid-template-columns:1fr; }
.mslide.three { grid-template-columns:repeat(3,1fr); }
.mcard { border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); padding:.85rem; text-align:center; margin:.7rem 0; }
.mcard .cs { font-family:'IBM Plex Mono',monospace; font-size:1.1rem; font-weight:600; color:var(--text); letter-spacing:.04em; }
.mcard .cu { font-size:.7rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-top:.2rem; }
.mchips { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.6rem; }
.mchip { border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.82rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; flex:1 1 30%; display:flex; align-items:center; justify-content:center; text-align:center; font-family:inherit; }
.mchip:hover { border-color:var(--green); color:var(--green); }
.mprog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; }
.mdone { font-weight:700; color:var(--ok); text-align:center; padding:.7rem; }
@media (max-width:600px){
  .mstat { grid-template-columns:1fr 1fr; }
  .mslide, .mslide.three { grid-template-columns:1fr; }
  .mcv { height:225px; }
  .mbtn { font-size:.78rem; padding:.45rem .65rem; }
  .mchip { flex:1 1 100%; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Teorema de Pitágoras: Aplicaciones</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');

  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'mat3_t06_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'mat3_t06_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'mat3_t06_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');

  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip

function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return { options: a, correctIdx: a.indexOf(correct) };
}
function pushProb(spec, rng){
  var s = shuffleOpts(spec.options, spec.correct, rng);
  var prob = {
    title: spec.title, questionText: spec.questionText, fn: spec.fn || '',
    hint: spec.hint || '', explanation: spec.explanation || '',
    options: s.options, correctIdx: s.correctIdx, showWork: !!spec.showWork,
    studentChoice: null, pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}
/* Builds 4 distinct numeric options. The correct value is always index 0 of the
   returned array, so the caller passes options:o, correct:o[0]. */
function numOpts(correct, cands, unit){
  var vals = [correct];
  function has(v){ for (var i = 0; i < vals.length; i++){ if (Math.abs(vals[i] - v) < 0.005) return true; } return false; }
  for (var i = 0; i < cands.length && vals.length < 4; i++){
    var v = cands[i];
    if (typeof v !== 'number' || !isFinite(v) || v <= 0 || has(v)) continue;
    vals.push(v);
  }
  var step = correct > 20 ? 4 : 2, k = 1;
  while (vals.length < 4 && k < 80){
    if (!has(correct + k * step)) vals.push(correct + k * step);
    k++;
  }
  var u = unit ? ' ' + unit : '';
  return vals.map(function(v){ return nv(v) + u; });
}
function cvFit(id){
  var cv = document.getElementById(id);
  if (!cv) return null;
  var dpr = window.devicePixelRatio || 1;
  var r = cv.getBoundingClientRect();
  var w = Math.max(240, Math.round(r.width));
  var h = Math.max(180, Math.round(r.height));
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  return { ctx: ctx, w: w, h: h };
}
function cvLabel(ctx, txt, x, y, col, align, size){
  ctx.save();
  ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.font = '600 ' + (size || 11) + 'px "IBM Plex Sans", sans-serif';
  ctx.fillText(txt, x, y); ctx.restore();
}

var W1 = null, W2 = null, W3 = null, W4 = null;

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 1 : MOSAICO DE CUADRADOS
   Two sliders move the legs of a right triangle. A square is drawn on each of
   the three sides and its area is written inside, live. The student hunts a
   slanted side of an exact length, and the feedback says how many square units
   the two leg squares are short of, or over, the target square.
   Three rounds, reveal on the 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
var W1POOL = [{c:5,a:3,b:4},{c:10,a:6,b:8},{c:13,a:5,b:12},{c:15,a:9,b:12},
              {c:17,a:8,b:15},{c:20,a:12,b:16},{c:25,a:7,b:24},{c:26,a:10,b:24}];
function w1Build(rng){
  W1 = { rounds: shuffle(W1POOL, rng).slice(0, 3), round: 0, tries: 0, done: false, a: 3, b: 3 };
}
function w1Cur(){ return W1.rounds[W1.round]; }
function w1Html(){
  return '<div class="mhead"><div class="mtitle">' + L('Mosaico de cuadrados', 'Square mosaic') + '</div>' +
      '<div class="mround" id="w1r"></div></div>' +
    '<div class="mtask" id="w1task"></div>' +
    '<canvas class="mcv" id="w1cv"></canvas>' +
    '<div class="mslide">' +
      '<div><label>' + L('Cateto horizontal', 'Horizontal leg') + ': <span class="mval" id="w1av">3</span> u</label>' +
        '<input type="range" id="w1as" min="1" max="24" step="1" value="3" oninput="w1Input()"></div>' +
      '<div><label>' + L('Cateto vertical', 'Vertical leg') + ': <span class="mval" id="w1bv">3</span> u</label>' +
        '<input type="range" id="w1bs" min="1" max="24" step="1" value="3" oninput="w1Input()"></div>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile"><div class="tl">' + L('Cuadrado de abajo', 'Lower square') + '</div><div class="tv" id="w1s1">9</div></div>' +
      '<div class="mtile"><div class="tl">' + L('Cuadrado de la izquierda', 'Left square') + '</div><div class="tv" id="w1s2">9</div></div>' +
      '<div class="mtile" id="w1t3"><div class="tl">' + L('Los dos juntos', 'The two together') + '</div><div class="tv" id="w1s3">18</div></div>' +
    '</div>' +
    '<div class="mrow"><button class="mbtn go" onclick="w1Check()">' + L('Comprobar', 'Check') + '</button>' +
      '<button class="mbtn" onclick="w1Reset()">' + L('Empezar de nuevo', 'Start over') + '</button></div>' +
    '<div class="mfb" id="w1fb"></div>';
}
function w1Init(){ if (W1) w1Round(); }
function w1Round(){
  if (!W1) return;
  var c = w1Cur();
  setTxt('w1r', L('Reto ', 'Task ') + (W1.round + 1) + L(' de ', ' of ') + W1.rounds.length);
  setTxt('w1task', L('Ajusta los catetos hasta que el lado inclinado mida exactamente ' + c.c + ' u. El cuadrado apoyado en ese lado vale ' + (c.c * c.c) + ' u², y esa es la marca que deben alcanzar los dos cuadrados de los catetos juntos.',
                     'Adjust the legs until the slanted side measures exactly ' + c.c + ' u. The square resting on that side is worth ' + (c.c * c.c) + ' u², and that is the mark the two leg squares together have to reach.'));
  W1.a = 3; W1.b = 3; W1.tries = 0;
  setVal('w1as', 3); setVal('w1bs', 3);
  w1Update();
}
function w1Input(){
  if (!W1 || W1.done) return;
  var a = document.getElementById('w1as'), b = document.getElementById('w1bs');
  if (a) W1.a = parseInt(a.value, 10) || 1;
  if (b) W1.b = parseInt(b.value, 10) || 1;
  w1Update();
}
function w1Reset(){
  if (!W1 || W1.done) return;
  W1.a = 3; W1.b = 3; setVal('w1as', 3); setVal('w1bs', 3); w1Update();
}
function w1Update(){
  if (!W1) return;
  var c = w1Cur(), sa = W1.a * W1.a, sb = W1.b * W1.b, sum = sa + sb, tgt = c.c * c.c, d = sum - tgt;
  setTxt('w1av', W1.a); setTxt('w1bv', W1.b);
  setTxt('w1s1', sa + ' u²'); setTxt('w1s2', sb + ' u²'); setTxt('w1s3', sum + ' u²');
  var t3 = document.getElementById('w1t3'); if (t3) t3.classList.toggle('hit', d === 0);
  if (d === 0) setFb('w1fb', L('Los dos cuadrados juntos ya valen ' + tgt + ' u², así que el lado inclinado mide ' + c.c + ' u. Comprueba para cerrar el reto.',
                               'The two squares together are already worth ' + tgt + ' u², so the slanted side measures ' + c.c + ' u. Check to close the task.'), 'near');
  else if (d < 0) setFb('w1fb', L('El lado inclinado va en ' + nv(Math.sqrt(sum)) + ' u. Faltan ' + (-d) + ' u² para llegar a la marca: alarga cualquiera de los dos catetos.',
                                  'The slanted side is at ' + nv(Math.sqrt(sum)) + ' u. It is ' + (-d) + ' u² short of the mark: lengthen either of the two legs.'), '');
  else setFb('w1fb', L('El lado inclinado va en ' + nv(Math.sqrt(sum)) + ' u. Sobran ' + d + ' u² sobre la marca: acorta cualquiera de los dos catetos.',
                       'The slanted side is at ' + nv(Math.sqrt(sum)) + ' u. It is ' + d + ' u² over the mark: shorten either of the two legs.'), '');
  w1Draw();
}
function w1Check(){
  if (!W1 || W1.done) return;
  var c = w1Cur(), sum = W1.a * W1.a + W1.b * W1.b, tgt = c.c * c.c;
  if (sum === tgt){
    setFb('w1fb', L('🎉 Embonó. ' + (W1.a * W1.a) + ' u² más ' + (W1.b * W1.b) + ' u² dan ' + tgt + ' u², el área exacta del cuadrado del lado inclinado.',
                    '🎉 It fits. ' + (W1.a * W1.a) + ' u² plus ' + (W1.b * W1.b) + ' u² give ' + tgt + ' u², the exact area of the square on the slanted side.'), 'good');
    setTimeout(w1Advance, 1300);
    return;
  }
  W1.tries++;
  if (W1.tries >= 3){
    W1.a = c.a; W1.b = c.b;
    setVal('w1as', c.a); setVal('w1bs', c.b);
    setTxt('w1av', c.a); setTxt('w1bv', c.b);
    setTxt('w1s1', (c.a * c.a) + ' u²'); setTxt('w1s2', (c.b * c.b) + ' u²'); setTxt('w1s3', tgt + ' u²');
    w1Draw();
    setFb('w1fb', L('Una salida: catetos de ' + c.a + ' u y ' + c.b + ' u. Sus cuadrados valen ' + (c.a * c.a) + ' u² y ' + (c.b * c.b) + ' u², que juntos dan ' + tgt + ' u², y la raíz cuadrada de ' + tgt + ' es ' + c.c + '.',
                    'One way out: legs of ' + c.a + ' u and ' + c.b + ' u. Their squares are worth ' + (c.a * c.a) + ' u² and ' + (c.b * c.b) + ' u², which together give ' + tgt + ' u², and the square root of ' + tgt + ' is ' + c.c + '.'), 'near');
    setTimeout(w1Advance, 2200);
    return;
  }
  var sum2 = sum;
  setFb('w1fb', sum2 < tgt
    ? L('Todavía no. Los dos cuadrados juntos valen ' + sum2 + ' u² y la marca está en ' + tgt + ' u². Sube alguno de los catetos.',
        'Not yet. The two squares together are worth ' + sum2 + ' u² and the mark is at ' + tgt + ' u². Raise one of the legs.')
    : L('Todavía no. Los dos cuadrados juntos valen ' + sum2 + ' u² y la marca está en ' + tgt + ' u². Baja alguno de los catetos.',
        'Not yet. The two squares together are worth ' + sum2 + ' u² and the mark is at ' + tgt + ' u². Lower one of the legs.'), '');
}
function w1Advance(){
  if (!W1) return;
  W1.round++;
  if (W1.round >= W1.rounds.length){
    W1.done = true;
    setTxt('w1r', L('Completado', 'Completed'));
    setTxt('w1task', L('Los tres mosaicos embonaron. En cada uno, los cuadrados de los catetos llenaron exactamente el cuadrado del lado inclinado.',
                       'The three mosaics fitted. In every one of them, the leg squares filled the square on the slanted side exactly.'));
    setFb('w1fb', L('🎉 Mosaico terminado.', '🎉 Mosaic finished.'), 'good');
    return;
  }
  w1Round();
}
function w1Draw(){
  var g = cvFit('w1cv'); if (!g || !W1) return;
  var ctx = g.ctx, W = g.w, H = g.h;
  var A = W1.a, B = W1.b;
  var s = Math.min((W - 34) / (A + 2 * B), (H - 34) / (2 * A + B));
  var ox = 17 + B * s, oy = H - 17 - A * s;
  function X(x){ return ox + x * s; }
  function Y(y){ return oy - y * s; }
  var gr = cssv('--green'), grb = cssv('--green-bg'), gd = cssv('--gold'), gdb = cssv('--gold-bg');
  var ok = cssv('--ok'), okb = cssv('--ok-bg'), s2 = cssv('--surface2'), t3 = cssv('--text3'), t2 = cssv('--text2');
  var hit = (A * A + B * B) === (w1Cur().c * w1Cur().c);
  function poly(pts, fill, stroke){
    ctx.beginPath(); ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
    for (var i = 1; i < pts.length; i++) ctx.lineTo(X(pts[i][0]), Y(pts[i][1]));
    ctx.closePath();
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.6; ctx.stroke(); }
  }
  poly([[0,0],[A,0],[A,-A],[0,-A]], grb, gr);
  poly([[0,0],[0,B],[-B,B],[-B,0]], gdb, gd);
  poly([[A,0],[0,B],[B,A+B],[A+B,A]], hit ? okb : s2, hit ? ok : t3);
  poly([[0,0],[A,0],[0,B]], null, t2);
  var q = Math.min(A, B) * 0.16;
  ctx.beginPath(); ctx.moveTo(X(q), Y(0)); ctx.lineTo(X(q), Y(q)); ctx.lineTo(X(0), Y(q));
  ctx.strokeStyle = t2; ctx.lineWidth = 1.1; ctx.stroke();
  var fs = s * Math.min(A, B) > 46 ? 12 : 10;
  cvLabel(ctx, (A * A) + ' u²', X(A / 2), Y(-A / 2), gr, 'center', fs);
  cvLabel(ctx, (B * B) + ' u²', X(-B / 2), Y(B / 2), gd, 'center', fs);
  cvLabel(ctx, (A * A + B * B) + ' u²', X((A + B) / 2), Y((A + B) / 2), hit ? ok : t3, 'center', fs);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 2 : LA ESCALERA
   A ladder of fixed length leans on a wall. One slider moves its foot; the tip
   climbs or drops in real time and the height is read off the wall. The student
   parks the tip on a marked height. Feedback says which way to slide the foot.
   Three rounds, reveal on the 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
var W2POOL = [{ln:13,d:5,h:12},{ln:17,d:8,h:15},{ln:25,d:7,h:24},{ln:10,d:6,h:8},
              {ln:15,d:9,h:12},{ln:20,d:12,h:16},{ln:26,d:10,h:24},{ln:29,d:20,h:21}];
function w2Build(rng){
  W2 = { rounds: shuffle(W2POOL, rng).slice(0, 3), round: 0, tries: 0, done: false, d: 1 };
}
function w2Cur(){ return W2.rounds[W2.round]; }
function w2H(){ var c = w2Cur(); return Math.sqrt(c.ln * c.ln - W2.d * W2.d); }
function w2Html(){
  return '<div class="mhead"><div class="mtitle">' + L('La escalera', 'The ladder') + '</div>' +
      '<div class="mround" id="w2r"></div></div>' +
    '<div class="mtask" id="w2task"></div>' +
    '<canvas class="mcv" id="w2cv"></canvas>' +
    '<div class="mslide one">' +

function w2Init(){ if (W2) w2Round(); }
function w2Round(){

function w2Update(){

function w2Check(){

    setFb('w2fb', L('🎉 Justo en la marca. Con el pie a ' + c.d + ' m, al cuadrado de la escalera, que vale ' + (c.ln * c.ln) + ', le quitas ' + (c.d * c.d) + ' y quedan ' + (c.h * c.h) + ', cuya raíz cuadrada es ' + c.h + '.',

function w2Advance(){

    W2.done = true;

function w2Draw(){
  var g = cvFit('w2cv'); if (!g || !W2) return;
  var ctx = g.ctx, W = g.w, H = g.h;
  var c = w2Cur(), h = w2H();
  var s = Math.min((W - 90) / c.ln, (H - 50) / c.ln);
  var wx = 46, gy = H - 26;
  var gr = cssv('--green'), gd = cssv('--gold'), bd = cssv('--border'), t3 = cssv('--text3'), t2 = cssv('--text2'), ok = cssv('--ok');
  ctx.strokeStyle = bd; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(18, gy); ctx.lineTo(W - 12, gy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(wx, gy); ctx.lineTo(wx, 14); ctx.stroke();
  ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = gd; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(wx - 12, gy - c.h * s); ctx.lineTo(W - 16, gy - c.h * s); ctx.stroke(); ctx.restore();
  cvLabel(ctx, L('marca ', 'mark ') + c.h + ' m', W - 18, gy - c.h * s - 10, gd, 'right', 11);
  var bx = wx + W2.d * s, ty = gy - h * s;
  ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = t3; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(wx, ty); ctx.lineTo(bx, ty); ctx.stroke(); ctx.restore();

  ctx.beginPath(); ctx.moveTo(wx + 9, gy); ctx.lineTo(wx + 9, gy - 9); ctx.lineTo(wx, gy - 9);
  ctx.strokeStyle = t2; ctx.lineWidth = 1.1; ctx.stroke();
  cvLabel(ctx, nv(h) + ' m', wx - 6, ty - 12, t2, 'left', 11);
  cvLabel(ctx, W2.d + ' m', (wx + bx) / 2, gy + 13, t2, 'center', 11);
  cvLabel(ctx, c.ln + ' m', (wx + bx) / 2 + 12, (gy + ty) / 2 - 12, gr, 'left', 11);

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 3 : LA MESA DE ESCUADRAS
   Three measurements arrive from the workshop; the student decides whether the
   largest angle came out right, under, or over. Tap a bin, get directional
   feedback that points at the comparison to make, reveal on the 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
var W3POOL = [
  {s:[9,12,15],b:0},{s:[8,15,17],b:0},{s:[20,21,29],b:0},{s:[12,16,20],b:0},
  {s:[6,7,8],b:1},{s:[10,10,12],b:1},{s:[4,6,7],b:1},{s:[9,10,12],b:1},
  {s:[5,7,11],b:2},{s:[7,9,14],b:2},{s:[3,5,7],b:2},{s:[8,10,16],b:2}
];
function w3Bins(){ return L(['Recto', 'Menor que un recto', 'Mayor que un recto'],
                            ['Right', 'Smaller than a right angle', 'Larger than a right angle']); }
function w3Build(rng){
  var g0 = [], g1 = [], g2 = [], i;
  for (i = 0; i < W3POOL.length; i++){
    if (W3POOL[i].b === 0) g0.push(W3POOL[i]);
    else if (W3POOL[i].b === 1) g1.push(W3POOL[i]);
    else g2.push(W3POOL[i]);
  }
  var items = shuffle(g0, rng).slice(0, 2).concat(shuffle(g1, rng).slice(0, 2)).concat(shuffle(g2, rng).slice(0, 2));
  W3 = { items: shuffle(items, rng), i: 0, tries: 0, hits: 0, done: false };
}
function w3Html(){
  return '<div class="mhead"><div class="mtitle">' + L('La mesa de escuadras', 'The square-checking table') + '</div>' +
      '<div class="mprog" id="w3p"></div></div>' +
    '<div class="mtask">' + L('Llegan piezas de tres lados al taller. Decide cómo quedó el ángulo más grande de cada una.',
                              'Three sided pieces arrive at the workshop. Decide how the largest angle of each one came out.') + '</div>' +
    '<div id="w3body"></div>' +
    '<div class="mfb" id="w3fb"></div>';
}
function w3Init(){ if (W3) w3Render(); }
function w3Render(){
  if (!W3) return;
  var body = document.getElementById('w3body');
  if (!body) return;
  if (W3.done){
    setTxt('w3p', L('Completado', 'Completed'));
    body.innerHTML = '<div class="mdone">🎉 ' + L('Mesa revisada: ', 'Table checked: ') + W3.hits + ' / ' + W3.items.length + '</div>';
    return;
  }
  var it = W3.items[W3.i], bins = w3Bins();
  setTxt('w3p', (W3.i + 1) + ' / ' + W3.items.length);
  body.innerHTML =
    '<div class="mcard"><div class="cs">' + it.s[0] + ' · ' + it.s[1] + ' · ' + it.s[2] + '</div>' +
      '<div class="cu">' + L('medidas en cm', 'measurements in cm') + '</div></div>' +
    '<div class="mchips">' + bins.map(function(b, bi){
      return '<button class="mchip" onclick="w3Pick(' + bi + ')">' + b + '</button>';
    }).join('') + '</div>';
}
function w3Pick(bi){
  if (!W3 || W3.done) return;
  var it = W3.items[W3.i], bins = w3Bins();
  var small = it.s[0] * it.s[0] + it.s[1] * it.s[1], big = it.s[2] * it.s[2];
  if (bi === it.b){
    W3.hits++;
    setFb('w3fb', L('✓ Correcto. Los dos lados menores dan ' + small + ' y el mayor da ' + big + '.',
                    '✓ Correct. The two shorter sides give ' + small + ' and the longest one gives ' + big + '.'), 'good');
    W3.tries = 0; W3.i++;
    if (W3.i >= W3.items.length) W3.done = true;

    return;
  }
  W3.tries++;
  if (W3.tries >= 3){
    setFb('w3fb', L('Era <b>' + bins[it.b] + '</b>. Los dos lados menores dan ' + small + ' y el mayor da ' + big + ': ' +
                    (small === big ? 'empatan, así que el ángulo es recto exacto.' : (small < big ? 'la suma se queda corta, así que el ángulo se abrió más allá del recto.' : 'la suma rebasa, así que el ángulo se quedó por debajo del recto.')),
                    'It was <b>' + bins[it.b] + '</b>. The two shorter sides give ' + small + ' and the longest one gives ' + big + ': ' +
                    (small === big ? 'they tie, so the angle is exactly right.' : (small < big ? 'the sum falls short, so the angle opened beyond a right angle.' : 'the sum goes over, so the angle stayed under a right angle.'))), 'near');
    W3.tries = 0; W3.i++;
    if (W3.i >= W3.items.length) W3.done = true;
    setTimeout(w3Render, 2200);
    return;
  }
  setFb('w3fb', L('Todavía no. Eleva al cuadrado los dos lados menores, súmalos y compara ese total con el cuadrado del lado mayor.',
                  'Not yet. Square the two shorter sides, add them and compare that total with the square of the longest side.'), '');

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVE 4 : LA CAJA Y LA VARILLA
   Three sliders shape a box. The floor diagonal and the corner-to-corner rod
   are drawn and measured live, so the student sees the first triangle feeding
   the second. Hunt an exact rod length. Three rounds, reveal on the 3rd miss.
   ══════════════════════════════════════════════════════════════════════════ */
var W4POOL = [{t:7,l:2,w:3,h:6},{t:9,l:1,w:4,h:8},{t:9,l:4,w:4,h:7},{t:11,l:2,w:6,h:9},

function w4Floor(){ return Math.sqrt(W4.l * W4.l + W4.w * W4.w); }

function w4Html(){

    '<canvas class="mcv" id="w4cv"></canvas>' +
    '<div class="mslide three">' +
      '<div><label>' + L('Largo', 'Length') + ': <span class="mval" id="w4lv">2</span> dm</label>' +
        '<input type="range" id="w4ls" min="1" max="12" step="1" value="2" oninput="w4Input()"></div>' +
      '<div><label>' + L('Ancho', 'Width') + ': <span class="mval" id="w4wv">2</span> dm</label>' +
        '<input type="range" id="w4ws" min="1" max="12" step="1" value="2" oninput="w4Input()"></div>' +
      '<div><label>' + L('Alto', 'Height') + ': <span class="mval" id="w4hv">2</span> dm</label>' +
        '<input type="range" id="w4hs" min="1" max="12" step="1" value="2" oninput="w4Input()"></div>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile"><div class="tl">' + L('Diagonal del piso', 'Floor diagonal') + '</div><div class="tv" id="w4f">0</div></div>' +
      '<div class="mtile"><div class="tl">' + L('Alto', 'Height') + '</div><div class="tv" id="w4hh">0</div></div>' +
      '<div class="mtile" id="w4t3"><div class="tl">' + L('Varilla', 'Rod') + '</div><div class="tv" id="w4v">0</div></div>' +

    '<div class="mrow"><button class="mbtn go" onclick="w4Check()">' + L('Comprobar', 'Check') + '</button>' +

    '<div class="mfb" id="w4fb"></div>';
}
function w4Init(){ if (W4) w4Round(); }
function w4Round(){
  if (!W4) return;
  var c = w4Cur();

  setTxt('w4task', L('Da forma a una caja donde la varilla que va de una esquina de abajo a la esquina opuesta de arriba mida exactamente ' + c.t + ' dm.',

function w4Input(){

function w4Reset(){

function w4Hit(){ var c = w4Cur(); return (W4.l * W4.l + W4.w * W4.w + W4.h * W4.h) === c.t * c.t; }
function w4Update(){

  setTxt('w4lv', W4.l); setTxt('w4wv', W4.w); setTxt('w4hv', W4.h);

  else setFb('w4fb', L('La varilla se pasa por ' + nv(d) + ' dm. Recorta cualquiera de las tres medidas.',

function w4Check(){

                    'A box that works: ' + c.l + ' by ' + c.w + ' by ' + c.h + '. The three squares are ' + (c.l * c.l) + ', ' + (c.w * c.w) + ' and ' + (c.h * c.h) + ', and together they give ' + (c.t * c.t) + '.'), 'near');

    : L('Todavía no. La varilla va en ' + nv(rod) + ' dm y la meta es ' + c.t + ' dm. Baja alguna medida.',
        'Not yet. The rod is at ' + nv(rod) + ' dm and the goal is ' + c.t + ' dm. Lower one measurement.'), '');
}
function w4Advance(){
  if (!W4) return;
  W4.round++;
  if (W4.round >= W4.rounds.length){
    W4.done = true;
    setTxt('w4r', L('Completado', 'Completed'));
    setTxt('w4task', L('Las tres cajas quedaron armadas. En todas, la diagonal del piso sirvió de puente entre el piso y la varilla que cruza el aire.',
                       'The three boxes are built. In all of them, the floor diagonal acted as the bridge between the floor and the rod that crosses the air.'));
    setFb('w4fb', L('🎉 Cajas terminadas.', '🎉 Boxes finished.'), 'good');
    return;
  }

}
function w4Draw(){
  var g = cvFit('w4cv'); if (!g || !W4) return;
  var ctx = g.ctx, W = g.w, H = g.h;
  var l = W4.l, w = W4.w, h = W4.h;
  var u = Math.min((W - 46) / (l + 0.55 * w), (H - 46) / (h + 0.38 * w));
  if (u < 6) u = 6;

                      'A rhombus has sides of ' + LD + ' cm and one of its diagonals measures ' + D1 + ' cm. The diagonals cut each other at their midpoint forming a right angle. How long is the other diagonal?'),
      fn: L('lado: ' + LD + ' cm · una diagonal: ' + D1 + ' cm', 'side: ' + LD + ' cm · one diagonal: ' + D1 + ' cm'),
      hint: L('Trabaja con uno de los cuatro triángulos rectángulos en que las diagonales parten al rombo: conoces su hipotenusa y un cateto. Lo que obtengas es solo la mitad de la diagonal que falta.',
              'Work with one of the four right triangles the diagonals split the rhombus into: you know its hypotenuse and one leg. What you get is only half of the missing diagonal.'),
      explanation: L('Media diagonal conocida mide ' + rb[0] + ' cm. Al cuadrado del lado, que vale ' + (LD * LD) + ', le quitas ' + (rb[0] * rb[0]) + ' y quedan ' + (rb[1] * rb[1]) + ', cuya raíz cuadrada es ' + rb[1] + ' cm. Esa es la mitad, así que la diagonal completa mide ' + D2 + ' cm.',
                     'Half of the known diagonal is ' + rb[0] + ' cm. From the square of the side, which is ' + (LD * LD) + ', you take away ' + (rb[0] * rb[0]) + ' and ' + (rb[1] * rb[1]) + ' is left, whose square root is ' + rb[1] + ' cm. That is the half, so the whole diagonal measures ' + D2 + ' cm.'),
      options: o9b, correct: o9b[0], showWork: true
    };
  }
  pushProb(s9, rng);

  /* ── graded 10 ── */
  var s10, v10 = Math.floor(rng() * 2), t10 = pick([[6,8,10],[5,12,13],[9,12,15],[8,15,17],[12,16,20]], rng);
  if (v10 === 0){
    s10 = {
      title: L('Un cateto al doble', 'One leg doubled'),
      questionText: L('Un triángulo rectángulo tiene catetos de ' + t10[0] + ' y ' + t10[1] + ' unidades. Se construye otro duplicando únicamente el cateto de ' + t10[1] + ' unidades y dejando el otro como estaba. ¿Qué le pasa a la hipotenusa?',
                      'A right triangle has legs of ' + t10[0] + ' and ' + t10[1] + ' units. Another one is built by doubling only the leg of ' + t10[1] + ' units and leaving the other as it was. What happens to the hypotenuse?'),
      hint: L('Al duplicar un cateto, su cuadrado se hace cuatro veces mayor, pero el cuadrado del otro cateto no cambia nada. Compara ese total con el que tendrías si los dos catetos se hubieran duplicado.',
              'When a leg doubles, its square becomes four times bigger, but the square of the other leg does not change at all. Compare that total with the one you would have if both legs had doubled.'),
      explanation: L('El nuevo cuadrado de la hipotenusa vale ' + (t10[0] * t10[0]) + ' más ' + (4 * t10[1] * t10[1]) + ', o sea ' + (t10[0] * t10[0] + 4 * t10[1] * t10[1]) + ', y su raíz cuadrada es aproximadamente ' + nv(Math.sqrt(t10[0] * t10[0] + 4 * t10[1] * t10[1])) + '. La hipotenusa pasó de ' + t10[2] + ' a ese valor: creció, pero se quedó por debajo de ' + (2 * t10[2]) + '. Solo llegaría al doble si los dos catetos se duplicaran.',
                     'The new square of the hypotenuse is ' + (t10[0] * t10[0]) + ' plus ' + (4 * t10[1] * t10[1]) + ', that is ' + (t10[0] * t10[0] + 4 * t10[1] * t10[1]) + ', and its square root is about ' + nv(Math.sqrt(t10[0] * t10[0] + 4 * t10[1] * t10[1])) + '. The hypotenuse went from ' + t10[2] + ' to that value: it grew, but stayed below ' + (2 * t10[2]) + '. It would only reach double if both legs were doubled.'),
      options: [
        L('Crece, pero se queda por debajo del doble', 'It grows, but stays below double'),
        L('Crece exactamente al doble', 'It grows to exactly double'),
        L('Crece más del doble', 'It grows to more than double'),
        L('Se queda igual que antes', 'It stays the same as before')
      ],
      showWork: false
    };
    s10.correct = s10.options[0];
  } else {
    s10 = {
      title: L('Una unidad más', 'One more unit'),
      questionText: L('Un triángulo rectángulo tiene catetos de ' + t10[0] + ' y ' + t10[1] + ' unidades, y su hipotenusa mide ' + t10[2] + ' unidades. Se alarga el cateto de ' + t10[1] + ' unidades en una unidad más y el otro cateto no se toca. ¿Qué le pasa a la hipotenusa?',
                      'A right triangle has legs of ' + t10[0] + ' and ' + t10[1] + ' units, and its hypotenuse measures ' + t10[2] + ' units. The leg of ' + t10[1] + ' units is lengthened by one more unit and the other leg is left alone. What happens to the hypotenuse?'),
      hint: L('Compara el crecimiento del lado inclinado con el del cateto. El estirón se reparte entre el largo del cateto y una inclinación que casi no cambia, así que el lado inclinado no alcanza a ganar todo lo que ganó el cateto.',
              'Compare the growth of the slanted side with that of the leg. The stretch is shared between the length of the leg and a slant that barely changes, so the slanted side does not manage to gain everything the leg gained.'),
      explanation: L('El nuevo cuadrado de la hipotenusa vale ' + (t10[0] * t10[0]) + ' más ' + ((t10[1] + 1) * (t10[1] + 1)) + ', o sea ' + (t10[0] * t10[0] + (t10[1] + 1) * (t10[1] + 1)) + ', y su raíz cuadrada es aproximadamente ' + nv(Math.sqrt(t10[0] * t10[0] + (t10[1] + 1) * (t10[1] + 1))) + '. Pasó de ' + t10[2] + ' a ese valor, así que creció menos de una unidad completa.',
                     'The new square of the hypotenuse is ' + (t10[0] * t10[0]) + ' plus ' + ((t10[1] + 1) * (t10[1] + 1)) + ', that is ' + (t10[0] * t10[0] + (t10[1] + 1) * (t10[1] + 1)) + ', and its square root is about ' + nv(Math.sqrt(t10[0] * t10[0] + (t10[1] + 1) * (t10[1] + 1))) + '. It went from ' + t10[2] + ' to that value, so it grew by less than a whole unit.'),
      options: [
        L('Crece, pero menos de una unidad', 'It grows, but by less than one unit'),
        L('Crece exactamente una unidad', 'It grows by exactly one unit'),
        L('Crece más de una unidad', 'It grows by more than one unit'),
        L('No cambia de tamaño', 'It does not change size')
      ],
      showWork: false
    };
    s10.correct = s10.options[0];
  }
  pushProb(s10, rng);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Teorema de Pitágoras: Aplicaciones';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
