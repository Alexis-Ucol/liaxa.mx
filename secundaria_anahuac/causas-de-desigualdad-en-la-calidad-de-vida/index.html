    '<p>' + S('Cuando dos lugares viven de manera muy distinta, la explicación fácil es decir que unos se esforzaron más que otros. Al mirar de cerca casi siempre aparece otra cosa: condiciones que ya estaban ahí antes de que las personas actuaran.',

        'Que los resultados escolares dependen únicamente del empeño que pone cada grupo de estudiantes.' ],
        en:[
        'That giving the same amount to those who start from different conditions keeps the difference instead of reducing it.',
        'That the budget per student has no influence whatsoever on what happens inside a school.',
        'That the second school mismanaged its budget throughout the whole school year.',
        'That school results depend solely on the effort each group of students puts in.' ] },
      correct:0,
      hint:{ es:'Compara el punto de partida de cada escuela, no solamente lo que recibieron.',
             en:'Compare the starting point of each school, not only what they received.' },
      explanation:{ es:'Recibir lo mismo no compensa una desventaja previa. Si una escuela parte sin biblioteca, transporte ni conexión, el mismo monto rinde menos y la diferencia se mantiene. Reducir la brecha exige dar más a quien parte con menos.',
                    en:'Receiving the same does not offset a previous disadvantage. If a school starts with no library, transport or connection, the same amount yields less and the difference persists. Closing the gap requires giving more to whoever starts with less.' } }
  ], rng), rng);

  /* ── CONCEPTO 5 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('Igualdad sustantiva y vida digna','Substantive equality and a dignified life') + '</h2>' +
    '<p>' + S('La ley mexicana reconoce que todas las personas son iguales en derechos. A esa declaración se le llama igualdad formal: la misma regla para todo el mundo. Es indispensable, pero por sí sola no basta cuando alguien parte de una desventaja que la regla no ve.',
              'Mexican law recognizes that all people are equal in rights. That declaration is called formal equality: the same rule for everyone. It is indispensable, but on its own it is not enough when someone starts from a disadvantage the rule does not see.') + '</p>' +
    '<p>' + S('La igualdad sustantiva va un paso más allá: exige medidas concretas que remuevan el obstáculo, para que el derecho declarado pueda ejercerse de verdad. Su meta es que cada persona alcance una vida digna, es decir, un piso de condiciones mínimas: alimentación suficiente, vivienda adecuada, agua, salud y educación.',
              'Substantive equality goes one step further: it demands concrete measures that remove the obstacle, so the declared right can actually be exercised. Its aim is for every person to reach a dignified life, that is, a floor of minimum conditions: sufficient food, adequate housing, water, health and education.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Igualdad formal','Formal equality') + '</div><div class="rform">' + S('la misma regla','the same rule') + '</div><div class="rnote">' + S('Abre la puerta en el papel para todas las personas.','It opens the door on paper for everyone.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Igualdad sustantiva','Substantive equality') + '</div><div class="rform">' + S('quitar el obstáculo','removing the obstacle') + '</div><div class="rnote">' + S('Hace posible cruzar esa puerta a quien parte con menos.','It makes crossing that door possible for whoever starts with less.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Vida digna','Dignified life') + '</div><div class="rform">' + S('el piso mínimo','the minimum floor') + '</div><div class="rnote">' + S('Comida, casa, agua, salud y escuela garantizadas.','Food, housing, water, health and school guaranteed.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Trato distinto','Different treatment') + '</div><div class="rform">' + S('no es privilegio','it is not a privilege') + '</div><div class="rnote">' + S('Compensa una desventaja que nadie eligió tener.','It offsets a disadvantage nobody chose to have.') + '</div></div>' +
    '</div>' +
    buildMed(rng));
  medRender();

  /* ── PROBLEMA 8 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Dos anuncios del ayuntamiento', en:'Two announcements from the town hall' }, showWork:false,
      stmt:{ es:'Un ayuntamiento anuncia dos acciones. La primera indica que cualquier persona puede inscribirse en el centro deportivo. La segunda instala rampas, transporte adaptado y horarios flexibles para quienes usan silla de ruedas. ¿Qué distingue a la segunda acción?',
             en:'A town hall announces two actions. The first states that anyone may enroll at the sports center. The second installs ramps, adapted transport and flexible schedules for wheelchair users. What sets the second action apart?' },
      options:{ es:[
        'Que remueve un obstáculo concreto para que el acceso anunciado pueda ejercerse de verdad.',
        'Que repite con otras palabras la misma regla general que ya había anunciado la primera acción.',
        'Que otorga un privilegio a un grupo por encima del resto de la población del municipio.',
        'Que sustituye la inscripción abierta por un trámite reservado a un número limitado de personas.' ],
        en:[
        'That it removes a concrete obstacle so the announced access can actually be exercised.',
        'That it repeats in other words the same general rule the first action had already announced.',
        'That it grants a privilege to one group above the rest of the population of the municipality.',
        'That it replaces open enrollment with a procedure reserved for a limited number of people.' ] },
      correct:0,
      hint:{ es:'Pregúntate si con la primera acción, por sí sola, alguien en silla de ruedas ya podría entrar.',
             en:'Ask yourself whether with the first action alone a wheelchair user could already get in.' },
      explanation:{ es:'La primera acción abre la puerta en el papel; la segunda quita lo que impedía cruzarla. Esa es la diferencia entre declarar la igualdad y hacerla efectiva con medidas que compensan una desventaja real.',
                    en:'The first action opens the door on paper; the second removes what prevented crossing it. That is the difference between declaring equality and making it effective with measures that offset a real disadvantage.' } },
    { title:{ es:'Una convocatoria abierta', en:'An open call' }, showWork:false,
      stmt:{ es:'Una escuela publica que las becas están abiertas a cualquier estudiante y que la solicitud se llena únicamente en línea. Varias familias de la comunidad no tienen internet ni computadora. ¿Qué haría que esa apertura fuera real?',
             en:'A school announces that scholarships are open to any student and that the application is filled in only online. Several families in the community have no internet and no computer. What would make that openness real?' },
      options:{ es:[
        'Ofrecer también la solicitud en papel y abrir la sala de cómputo en horarios accesibles para esas familias.',
        'Repetir el anuncio de la convocatoria en más ocasiones para que nadie pueda decir que no se enteró.',
        'Reducir el número de becas hasta que alcance justo para las familias que sí pueden solicitarlas en línea.',
        'Pedir a esas familias que consigan por su cuenta el equipo necesario antes de la fecha límite.' ],
        en:[
        'Also offering the application on paper and opening the computer room at hours those families can reach.',
        'Repeating the announcement more often so nobody can say they did not find out about it.',
        'Cutting the number of scholarships until it just covers the families who can apply online.',
        'Asking those families to obtain the necessary equipment on their own before the deadline.' ] },
      correct:0,
      hint:{ es:'Identifica cuál es el obstáculo concreto y qué medida lo elimina.',
             en:'Identify the concrete obstacle and which measure removes it.' },
      explanation:{ es:'La convocatoria ya era igual para todos, pero el requisito en línea dejaba fuera a quienes no tienen conexión. Ofrecer la solicitud en papel y abrir un espacio con equipo elimina el obstáculo y convierte la apertura declarada en acceso real.',
                    en:'The call was already the same for everyone, but the online requirement left out those without a connection. Offering the application on paper and opening a space with equipment removes the obstacle and turns declared openness into real access.' } }
  ], rng), rng);

  /* ── CIERRE ─────────────────────────────────────────────────── */
  addSection(S('CIERRE','CLOSING'),
    '<h2>' + S('Pon a prueba tu análisis','Put your analysis to the test') + '</h2>' +
    '<p>' + S('Dos situaciones más para decidir por tu cuenta.','Two more situations to decide on your own.') + '</p>');

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El piso que no se cumple', en:'The floor that is not met' }, showWork:false,
      stmt:{ es:'Una familia trabaja jornadas largas, recibe un pago que solo alcanza para una comida al día y vive en un cuarto sin agua ni ventilación. ¿Por qué se dice que esa situación afecta el derecho a una vida digna?',
             en:'A family works long days, receives pay that covers only one meal a day and lives in a room with no water and no ventilation. Why is that situation said to affect the right to a dignified life?' },
      options:{ es:[
        'Porque no están cubiertas las condiciones mínimas de alimentación, vivienda y servicios que ese derecho exige para cualquier persona.',
        'Porque la familia todavía no ha presentado una queja por escrito ante la autoridad correspondiente.',
        'Porque las jornadas largas indican siempre que un trabajo se realiza sin ningún contrato firmado.',
        'Porque ese derecho solo se cumple cuando el ingreso de un hogar supera el promedio nacional del país.' ],
        en:[
        'Because the minimum conditions of food, housing and services that this right demands for anyone are not covered.',
        'Because the family has not yet filed a written complaint with the corresponding authority.',
        'Because long working days always indicate that a job is performed without any signed contract.',
        'Because that right is only met when the income of a household exceeds the national average of the country.' ] },
      correct:0,
      hint:{ es:'Repasa qué condiciones mínimas debe garantizar ese derecho.',
             en:'Review which minimum conditions that right must guarantee.' },
      explanation:{ es:'El derecho a una vida digna exige un piso de condiciones: alimentación suficiente, vivienda adecuada, agua y servicios. Cuando ese piso no se cumple, el derecho queda incumplido, con o sin queja presentada.',
                    en:'The right to a dignified life demands a floor of conditions: sufficient food, adequate housing, water and services. When that floor is not met, the right is unfulfilled, whether or not a complaint was filed.' } },
    { title:{ es:'No estorbar no es garantizar', en:'Not blocking is not guaranteeing' }, showWork:false,
      stmt:{ es:'En una comunidad, las autoridades aseguran que se respeta el derecho a una vida digna porque nadie impide a las personas buscar trabajo o mudarse. Sin embargo, no hay agua potable, ni clínica, ni escuela después de la primaria. ¿Qué falla en ese razonamiento?',
             en:'In one community, the authorities claim the right to a dignified life is respected because nobody stops people from looking for work or moving away. However, there is no drinking water, no clinic and no school after primary. What is wrong with that reasoning?' },
      options:{ es:[
        'Que ese derecho no se cumple con no estorbar: exige condiciones garantizadas como agua, salud y educación disponibles.',
        'Que las autoridades debieron consultar a la comunidad antes de emitir cualquier declaración pública sobre el tema.',
        'Que mudarse a otra comunidad es la única manera realista de mejorar la calidad de vida de esas familias.',
        'Que el derecho a una vida digna se refiere solamente al trabajo y no incluye ningún otro servicio público.' ],
        en:[
        'That this right is not met by simply not blocking: it demands guaranteed conditions such as available water, health care and education.',
        'That the authorities should have consulted the community before making any public statement on the matter.',
        'That moving to another community is the only realistic way to improve the quality of life of those families.',
        'That the right to a dignified life refers only to work and does not include any other public service.' ] },
      correct:0,
      hint:{ es:'Distingue entre no poner obstáculos y garantizar condiciones.',
             en:'Distinguish between not placing obstacles and guaranteeing conditions.' },
      explanation:{ es:'Dejar que alguien busque salida no equivale a garantizarle condiciones. El derecho a una vida digna obliga a que existan agua, salud y educación al alcance; sin eso, la sola libertad de moverse no lo satisface.',
                    en:'Letting someone look for a way out is not the same as guaranteeing them conditions. The right to a dignified life requires water, health care and education to be within reach; without that, the mere freedom to move does not satisfy it.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La conclusión del proyecto', en:'The conclusion of the project' }, showWork:false,
      stmt:{ es:'Al cerrar su proyecto, un equipo debe escribir una conclusión sobre por qué la calidad de vida es tan distinta entre regiones de México y del mundo. ¿Cuál conclusión se sostiene mejor con lo que analizaste?',
             en:'On closing their project, a team must write a conclusion about why quality of life is so different across regions of Mexico and the world. Which conclusion is best supported by what you analyzed?' },
      options:{ es:[
        'Las diferencias se explican sobre todo por condiciones desiguales de servicios, ingreso y oportunidades, que pueden modificarse con decisiones públicas.',
        'Las diferencias se explican por el esfuerzo desigual de las personas, así que cada quien obtiene exactamente lo que consigue por su cuenta.',
        'Las diferencias son naturales de cada región y permanecen igual sin importar lo que se decida sobre servicios e inversión.',
        'Las diferencias dependen del número de habitantes que vive en cada una de las regiones comparadas.' ],
        en:[
        'The differences are explained above all by unequal conditions of services, income and opportunities, which can be changed by public decisions.',
        'The differences are explained by the unequal effort of people, so everyone gets exactly what they obtain on their own.',
        'The differences are natural to each region and stay the same regardless of what is decided about services and investment.',
        'The differences depend on the number of inhabitants living in each of the regions compared.' ] },
      correct:0,
      hint:{ es:'Piensa qué tienen en común las causas que revisaste y si alguien puede modificarlas.',
             en:'Think about what the causes you reviewed have in common and whether anyone can change them.' },
      explanation:{ es:'A lo largo de la guía las causas fueron condiciones: servicios disponibles, ingreso del hogar, escuelas al alcance, decisiones de inversión. Todas ellas pueden cambiarse, y por eso la desigualdad no es un destino ni el resultado del esfuerzo individual.',
                    en:'Throughout the guide the causes were conditions: available services, household income, schools within reach, investment decisions. All of them can be changed, which is why inequality is not a destiny nor the result of individual effort.' } },
    { title:{ es:'Dos conclusiones en disputa', en:'Two conclusions in dispute' }, showWork:false,
      stmt:{ es:'Dos conclusiones compiten en el periódico mural. La primera sostiene que la desigualdad en la calidad de vida puede reducirse; la segunda, que siempre existirá porque unos se esfuerzan más que otros. ¿Qué argumento apoya mejor a la primera?',
             en:'Two conclusions compete on the wall newspaper. The first holds that inequality in quality of life can be reduced; the second, that it will always exist because some try harder than others. Which argument best supports the first?' },
      options:{ es:[
        'Que las causas identificadas son condiciones creadas por decisiones humanas, como dónde se construyen escuelas, clínicas y redes de agua.',
        'Que en todas las épocas ha habido personas que mejoraron su situación por su propia cuenta y sin ayuda.',
        'Que la mayoría de la población prefiere vivir en lugares donde hay más servicios disponibles.',
        'Que las cifras de calidad de vida cambian de un año a otro por razones difíciles de identificar.' ],
        en:[
        'That the identified causes are conditions created by human decisions, such as where schools, clinics and water networks are built.',
        'That in every era there have been people who improved their situation on their own and without help.',
        'That most of the population prefers to live in places where more services are available.',
        'That quality of life figures change from one year to the next for reasons that are hard to identify.' ] },
      correct:0,
      hint:{ es:'Busca el argumento que señala causas sobre las que sí se puede actuar.',
             en:'Look for the argument that points to causes that can actually be acted on.' },
      explanation:{ es:'Si las causas son decisiones sobre dónde se invierte y qué servicios se garantizan, entonces otras decisiones pueden reducir la brecha. Ese es el argumento que sostiene que la desigualdad se puede modificar.',
                    en:'If the causes are decisions about where investment goes and which services are guaranteed, then other decisions can reduce the gap. That is the argument supporting that inequality can be changed.' } }
  ], rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbwoSl0opNALX7IT8O9tk7xZoPU9LbrYvZ-n_p9u3R-pUlwi-rVTTfnYRaiKngnsY1QV/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
