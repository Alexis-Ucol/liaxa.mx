<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ondas y Fenómenos Ondulatorios</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS - INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGET CHROME (concept manipulatives) ── */
.iwbox { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1.1rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.35rem; }
.iw-sub { font-size:.86rem; color:var(--text2); margin-bottom:.75rem; }
.rfb { font-size:.84rem; color:var(--text2); min-height:1.35rem; margin-top:.6rem; line-height:1.5; }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { min-height:44px; padding:.55rem 1.1rem; border:none; border-radius:8px; background:var(--green); color:#fff; font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; margin-top:.6rem; }
.rverify-btn:hover { background:var(--green-dark); }
.wprog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.wgoal { font-size:.84rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.55rem .75rem; margin:.45rem 0 .7rem; }
.wgoal b { color:var(--green-dark); font-family:'IBM Plex Mono',monospace; }

/* ── SLIDER CONTROLS ── */
.ctrl { display:flex; align-items:center; gap:.6rem; margin:.4rem 0; flex-wrap:wrap; }
.ctrl-lbl { font-size:.76rem; color:var(--text3); min-width:112px; }
.ctrl-rng { flex:1; min-width:120px; accent-color:var(--green); height:44px; }
.ctrl-val { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--green); min-width:86px; text-align:right; font-size:.92rem; }

/* ── READOUTS AND BARS ── */
.readout { text-align:center; font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:700; margin:.7rem 0 .15rem; color:var(--text); }
.readout.pos { color:var(--ok); }
.readout.neg { color:var(--bad); }
.readout.zero { color:var(--text3); }
.rdlbl { text-align:center; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin-bottom:.5rem; }
.bars { margin-top:.8rem; }
.bar-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.34rem; }
.bar-name { font-size:.72rem; color:var(--text3); min-width:124px; }
.bar-track { flex:1; background:var(--surface2); border-radius:5px; height:16px; overflow:hidden; min-width:46px; }
.bar-fill { height:100%; border-radius:5px; transition:width .22s; background:var(--green); }
.bar-fill.hot { background:var(--gold); }
.bar-fill.cold { background:var(--green); }
.bar-fill.tgt { background:var(--green-dark); }
.bar-fill.q { background:var(--gold); }
.bar-fill.w { background:var(--green); }
.bar-fill.u { background:var(--green-dark); }
.bar-num { font-family:'IBM Plex Mono',monospace; font-size:.74rem; min-width:82px; text-align:right; color:var(--text2); }

/* ── TEMPERATURE AXIS ── */
.tax { position:relative; height:72px; margin:1.1rem 0 .3rem; }
.tax-line { position:absolute; left:0; right:0; top:34px; height:9px; border-radius:5px; background:linear-gradient(90deg,var(--green),var(--gold)); }
.tax-mark { position:absolute; top:26px; width:6px; height:25px; border-radius:3px; background:var(--text); transform:translateX(-3px); transition:left .18s; }
.tax-val { position:absolute; top:4px; font-family:'IBM Plex Mono',monospace; font-size:.86rem; font-weight:700; color:var(--green); transform:translateX(-50%); transition:left .18s; white-space:nowrap; }
.tax-lbl { position:absolute; top:52px; font-size:.7rem; color:var(--text3); font-family:'IBM Plex Mono',monospace; }
.tax-l { left:0; }
.tax-r { right:0; }

/* ── MATERIAL CHIPS ── */
.chips { display:flex; flex-wrap:wrap; gap:.4rem; margin:.5rem 0 .7rem; }
.chip { border:1.5px solid var(--border); border-radius:22px; background:var(--surface2); color:var(--text2); padding:.4rem .85rem; font-size:.76rem; cursor:pointer; min-height:44px; font-family:inherit; }
.chip.on { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }

/* ── CLASSIFIER ── */
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.9rem; text-align:center; font-weight:600; font-size:.88rem; margin:.6rem 0; color:var(--text); }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; }
.cls-bins { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
.cls-bin { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.8rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }

/* ── MATCHER ── */
.mt-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin:.6rem 0 .2rem; }
.mt-head { font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin-bottom:.35rem; }
.mt-col { display:flex; flex-direction:column; gap:.45rem; }
.mt-chip { border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); padding:.55rem .6rem; font-size:.79rem; line-height:1.35; cursor:pointer; min-height:44px; text-align:left; font-family:inherit; }
.mt-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.mt-chip.done { border-color:var(--ok); color:var(--ok); cursor:default; }

/* ── LIENZOS DE ONDA (SVG) ── */
.wvbox { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:.3rem; margin:.6rem 0 .25rem; }
.wvsvg { display:block; width:100%; height:auto; }
.wv-axis { stroke:var(--border); stroke-width:1.5; }
.wv-grid { stroke:var(--border); stroke-width:1; stroke-dasharray:3 6; }
.wv-target { fill:none; stroke:var(--gold); stroke-width:2.6; stroke-dasharray:8 6; stroke-linejoin:round; }
.wv-user { fill:none; stroke:var(--green); stroke-width:3; stroke-linejoin:round; }
.wv-a { fill:none; stroke:var(--text3); stroke-width:1.8; stroke-linejoin:round; }
.wv-b { fill:none; stroke:var(--gold); stroke-width:1.8; stroke-linejoin:round; }
.wv-sum { fill:none; stroke:var(--green); stroke-width:3.2; stroke-linejoin:round; }
.wv-lbl { font-family:'IBM Plex Mono',monospace; font-size:12px; fill:var(--text3); }
.wvkey { display:flex; flex-wrap:wrap; gap:.9rem; font-size:.72rem; color:var(--text3); margin-bottom:.55rem; }
.wvkey span { display:inline-flex; align-items:center; gap:.35rem; }
.wvdash { display:inline-block; width:22px; height:0; border-top:2.6px dashed var(--gold); }
.wvsolid { display:inline-block; width:22px; height:0; border-top:3px solid var(--green); }
.wvthin { display:inline-block; width:22px; height:0; border-top:2px solid var(--text3); }
.wvthin2 { display:inline-block; width:22px; height:0; border-top:2px solid var(--gold); }


@media (max-width: 600px) {
  .cls-bins { grid-template-columns:1fr; }
  .mt-grid { grid-template-columns:1fr; }
  .ctrl-lbl { min-width:84px; font-size:.72rem; }
  .ctrl-val { min-width:70px; font-size:.84rem; }
  .bar-name { min-width:84px; font-size:.66rem; }
  .bar-num { min-width:64px; font-size:.68rem; }
  .iwbox { padding:.8rem; }
  .readout { font-size:1.25rem; }
  .tax-lbl { font-size:.62rem; }
}
</style>

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_cneyt3_t04_g01__' + (n + '__' + g).replace(/\s+/g, '_');

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_cneyt3_t04_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER - two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm - used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS - INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB

  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);

  // ── Per-problem pages ──

  // ── SAVE / SHARE - iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'cneyt3_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ================================================
   buildLesson - OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  var VS = 340;    /* rapidez del sonido en el aire, m/s */
  var VW = 1500;   /* rapidez del sonido en el agua, m/s */

  /* ---------------- helpers ---------------- */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function pk(a){ return a[Math.floor(rng()*a.length)]; }
  function shufA(a){
    var b = a.slice(), i, j, t;
    for (i=b.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=b[i]; b[i]=b[j]; b[j]=t; }
    return b;
  }
  function rd(x,d){ var p = Math.pow(10,d); return Math.round(x*p)/p; }
  function num(x,d){
    var r = rd(x,d);
    if (Math.abs(r) < 1e-9) r = 0;
    return (r < 0 ? '−' : '') + String(Math.abs(r));
  }
  function n1(x){ return String(Math.round(x*10)/10); }
  function M(x){ return num(x,2)+' m'; }
  function CM(x){ return num(x,1)+' cm'; }
  function HZ(x){ return num(x,0)+' Hz'; }
  function MS(x){ return num(x,1)+' m/s'; }
  function SEG(x){ return num(x,3)+' s'; }
  function JOU(x){ return num(x,1)+' J'; }
  function CIC(x){ return num(x,0)+' '+T({es:'ciclos', en:'cycles'}); }
  function frac(a,b){
    return '<span class="mf-outer"><span class="mf-num">'+a+'</span><span class="mf-den">'+b+'</span></span>';
  }
  function sec(tag,title,html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w_' + kind;
    LB.appendChild(d);
    return d;
  }
  function rcard(name, form, note){
    return '<div class="rcard"><div class="rname">'+name+'</div><div class="rform">'+form+
           '</div><div class="rnote">'+note+'</div></div>';
  }
  /* builds 4 distinct option strings: the correct value first, then the
     wrong-method values, then a spread fallback if any of them collapsed */
  function optsFrom(correct, wrongs, fmt, positive){
    var strs = [fmt(correct)], i, s;
    for (i=0;i<wrongs.length && strs.length<4;i++){
      if (!isFinite(wrongs[i])) continue;
      if (positive && wrongs[i] <= 0) continue;
      s = fmt(wrongs[i]);
      if (strs.indexOf(s) === -1) strs.push(s);
    }
    var k = 1, base = Math.abs(correct) > 1e-9 ? Math.abs(correct) : 1;
    while (strs.length < 4 && k < 40){
      var cand = correct + (k % 2 === 0 ? 1 : -1) * base * (0.19 + 0.13*k);
      k++;
      if (positive && cand <= 0) continue;
      s = fmt(cand);
      if (strs.indexOf(s) === -1) strs.push(s);
    }
    return { options: strs, correct: strs[0] };
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: T(spec.fn) || '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ---------------- trazado de ondas (SVG) ---------------- */
  var SW = 600;            /* ancho del lienzo en unidades de viewBox */
  var PPM = 100;           /* pixeles por metro: la ventana muestra 6 m */
  function wavePts(A, lam, sh, mid, ampPx){
    var p = [], i, x, m;
    for (i=0;i<=140;i++){
      x = i*(SW/140); m = x/PPM;
      p.push(n1(x)+','+n1(mid - A*ampPx*Math.sin(2*Math.PI*(m/lam - sh))));
    }
    return p.join(' ');
  }
  function sumPts(A1, A2, lam, sh, mid, ampPx){
    var p = [], i, x, m, y;
    for (i=0;i<=140;i++){
      x = i*(SW/140); m = x/PPM;
      y = A1*Math.sin(2*Math.PI*(m/lam)) + A2*Math.sin(2*Math.PI*(m/lam - sh));
      p.push(n1(x)+','+n1(mid - y*ampPx));
    }
    return p.join(' ');
  }
  function gridLines(mid, H){
    var g = '<line class="wv-axis" x1="0" y1="'+mid+'" x2="'+SW+'" y2="'+mid+'"/>', i;
    for (i=1;i<6;i++) g += '<line class="wv-grid" x1="'+(i*PPM)+'" y1="6" x2="'+(i*PPM)+'" y2="'+(H-6)+'"/>';
    g += '<text class="wv-lbl" x="4" y="'+(H-4)+'">0 m</text>';
    g += '<text class="wv-lbl" x="'+(SW-46)+'" y="'+(H-4)+'">6 m</text>';
    return g;
  }
  function svgBox(inner, H){
    return '<div class="wvbox"><svg class="wvsvg" viewBox="0 0 '+SW+' '+H+'">'+inner+'</svg></div>';
  }

  /* ============================================================
     DATOS SEMBRADOS (se extraen una sola vez, en orden fijo)
     ============================================================ */
  var vb = [];
  (function(){ var i; for (i=0;i<8;i++) vb.push(Math.floor(rng()*2)); })();

  var LAMS = [0.5, 1, 1.5, 2, 2.5, 3];

  /* widget 1: tres ondas de referencia que hay que reproducir */
  var w1R = [];
  (function(){
    var AA = shufA([2,3,4,5]).slice(0,3), LL = shufA([1,1.5,2,3]).slice(0,3), i;
    for (i=0;i<3;i++) w1R.push({ A:AA[i], lam:LL[i] });
  })();

  /* widget 2: tres cuerdas con rapidez propia y una longitud de onda buscada */
  var w2R = [];
  (function(){
    var VV = shufA([12,18,24,30]).slice(0,3), FF = shufA([6,8,10,12]).slice(0,3), i;
    for (i=0;i<3;i++) w2R.push({ v:VV[i], ft:FF[i], lt:VV[i]/FF[i] });
  })();

  /* widget 3: tres encuentros de ondas con un objetivo de amplitud */
  var w3R = [];
  (function(){
    var A1 = shufA([4,5,6]).slice(0,3), A2 = shufA([2,3,2]).slice(0,3),
        KK = shufA(['max','min',(rng()<0.5?'max':'min')]), i;
    for (i=0;i<3;i++) w3R.push({ a1:A1[i], a2:A2[i], kind:KK[i] });
  })();

  /* widget 4: orden de los seis enunciados */
  var w4SEQ = shufA([0,1,2,3,4,5]);

  /* problema 1 */
  var p1v = vb[0];

  /* problema 2: registro de oscilaciones */
  var p2 = (function(){
    var f = pk([2,4,5,8,10]), t = pk([3,4,5,6]);
    return { f:f, t:t, n:f*t, T:1/f };
  })();
  var p2v = vb[1];

  /* problema 3: cuerda de laboratorio */
  var p3 = (function(){
    var lam = pk([0.4,0.5,0.8,1.2,1.5,2.5]), f = pk([12,15,20,25,40]);
    return { lam:lam, f:f, v:lam*f };
  })();
  var p3v = vb[2];

  /* problema 4: altavoz en aire */
  var p4 = (function(){
    var lam = pk([0.5,0.8,2]), t = pk([2,3,4,5]);
    return { lam:lam, t:t, f:VS/lam, n:(VS/lam)*t };
  })();

  /* problema 5: energia y amplitud */
  var p5 = (function(){ return { E: pk([8,12,16,20]) }; })();
  var p5v = vb[3];

  /* problema 6: superposicion */
  var p6 = (function(){
    var a1 = pk([4,5,6]), a2 = pk([2,3]);
    return { a1:a1, a2:a2 };
  })();
  var p6v = vb[4];

  /* problema 7: frontera entre medios */
  var p7v = vb[5];

  /* problema 8: refraccion con numeros */
  var p8 = (function(){
    var f = pk([20,25,50]), v1 = pk([20,30,40,50]), r = pk([1.5,2,0.5]);
    var v2 = v1*r;
    return { f:f, v1:v1, v2:v2, l1:v1/f, l2:v2/f, r:r };
  })();

  /* problema 9: boya en el mar */
  var p9 = (function(){
    var f = pk([3,4,5,6]), t = pk([3,4,5]), lam = pk([1.5,2,2.5,3,4]);
    return { f:f, t:t, n:f*t, lam:lam, v:f*lam };
  })();

  /* problema 10: eco en el agua */
  var p10 = (function(){
    var d = pk([30,45,60,75]);
    return { d:d, t:2*d/VW };
  })();
  var p10v = vb[6];

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'El patrón que viaja y la materia que se queda', en:'The pattern travels, the matter stays'}),
      '<p>'+T({
        es:'Una onda es una perturbación que avanza por un medio o por el espacio transportando energía sin arrastrar consigo la materia. El corcho que flota sobre el agua sube y baja mientras las crestas pasan bajo él, pero no viaja hacia la orilla. Lo que se desplaza es la forma de la perturbación y la energía que lleva asociada, de modo que describir una onda no consiste en seguir a una partícula, sino en medir el patrón que se repite.',
        en:'A wave is a disturbance that advances through a medium or through space carrying energy without dragging matter along with it. A cork floating on water rises and falls as the crests pass beneath it, yet it does not travel towards the shore. What moves is the shape of the disturbance and the energy bound to it, so describing a wave is not a matter of following one particle, but of measuring the pattern that repeats.'
      })+'</p>'+
      '<p>'+T({
        es:'Ese patrón queda determinado por unas pocas magnitudes. La amplitud es la separación máxima respecto de la posición de reposo, medida sobre el eje perpendicular al avance. La longitud de onda es la distancia entre dos puntos consecutivos que oscilan en el mismo estado, por ejemplo entre dos crestas seguidas. El periodo es el tiempo que tarda un punto del medio en completar una oscilación entera, y la frecuencia cuenta cuántas oscilaciones completas ocurren en cada segundo.',
        en:'That pattern is fixed by a handful of quantities. The amplitude is the maximum displacement away from the rest position, measured along the axis perpendicular to the advance. The wavelength is the distance between two consecutive points oscillating in the same state, for instance between two successive crests. The period is the time a point of the medium takes to complete one whole oscillation, and the frequency counts how many complete oscillations occur each second.'
      })+'</p>'+
      '<p>'+T({
        es:'Amplitud y longitud de onda son independientes entre sí: una onda muy alta puede ser larga o corta, y lo mismo vale para una onda de poca altura. Conviene además distinguir dos formas de vibrar. En una onda transversal las partículas oscilan perpendicularmente a la dirección de avance, como en una cuerda sacudida por un extremo; en una onda longitudinal oscilan a lo largo de esa misma dirección y el medio se comprime y se dilata de forma alternada, como ocurre con el sonido que atraviesa el aire.',
        en:'Amplitude and wavelength are independent of each other: a very tall wave may be long or short, and the same holds for a low one. It is also worth separating two ways of vibrating. In a transverse wave the particles oscillate perpendicular to the direction of advance, as in a rope shaken at one end; in a longitudinal wave they oscillate along that same direction and the medium is alternately compressed and expanded, as happens with sound crossing the air.'

  (function(){

      T({es:'Obstáculos, fronteras y aberturas', en:'Obstacles, boundaries and openings'}),
      '<p>'+T({
        es:'Ninguna onda se propaga indefinidamente sin encontrar un borde, un obstáculo o un cambio de medio, y en cada uno de esos encuentros su comportamiento delata su naturaleza ondulatoria. Tres situaciones bastan para clasificar casi todo lo que se observa.',
        en:'No wave propagates indefinitely without meeting an edge, an obstacle or a change of medium, and at each of those encounters its behaviour betrays its wave nature. Three situations are enough to classify almost everything that is observed.'
      })+'</p>'+
      '<p>'+T({
        es:'Al chocar con una superficie que no puede atravesar, la onda se refleja: regresa al medio del que venía conservando su rapidez y su ritmo de oscilación, y lo único que cambia es la dirección de avance. Si en cambio consigue pasar a un medio distinto, se refracta: el nuevo medio impone su propia rapidez de propagación, mientras la fuente original sigue marcando el ritmo con que las oscilaciones fueron generadas. Al cambiar la rapidez sin que cambie ese ritmo, el patrón espacial de la onda deja de tener el tamaño que traía.',
        en:'On striking a surface it cannot cross, the wave is reflected: it returns to the medium it came from keeping its speed and its rhythm of oscillation, and the only thing that changes is the direction of advance. If instead it manages to pass into a different medium, it is refracted: the new medium imposes its own propagation speed, while the original source keeps setting the rhythm at which the oscillations were generated. With the speed changing and that rhythm unchanged, the spatial pattern of the wave stops having the size it brought.'
      })+'</p>'+
      '<p>'+T({
        es:'La difracción aparece cuando la onda encuentra un obstáculo o una abertura de tamaño comparable a su longitud de onda: en lugar de proyectar una sombra de bordes nítidos, el frente se abre y ocupa la región que quedaba detrás. Por eso el sonido, cuyas longitudes de onda se miden en metros, rodea sin dificultad el marco de una puerta abierta, mientras que la luz visible, con longitudes de onda diminutas, deja contornos casi perfectos.',
        en:'Diffraction appears when the wave meets an obstacle or an opening of a size comparable to its wavelength: instead of casting a sharp edged shadow, the front spreads out and occupies the region that lay behind. That is why sound, whose wavelengths are measured in metres, rounds the frame of an open door with ease, while visible light, with tiny wavelengths, leaves almost perfect outlines.'
      })+'</p>'+
      '<div class="rules-grid">'+
        rcard(T({es:'Reflexión', en:'Reflection'}), 'v, f, λ',

        rcard(T({es:'Difracción', en:'Diffraction'}), 'λ ≈ '+T({es:'abertura', en:'opening'}),

  /* ---- MANIPULATIVO 4: clasificar observaciones ---- */
  (function(){
    var wrap = widget('classify');
    var BINS = [ T({es:'Reflexión', en:'Reflection'}), T({es:'Refracción', en:'Refraction'}), T({es:'Difracción', en:'Diffraction'}) ];
    var ITEMS = [
      { es:'Un pulso enviado por una cuerda regresa hacia la mano después de llegar al extremo amarrado al muro.',
        en:'A pulse sent along a rope comes back towards the hand after reaching the end tied to the wall.', bin:0 },
      { es:'El frente de las olas gira y se alinea con la playa conforme entra en la zona menos profunda.',
        en:'The front of the waves turns and lines up with the beach as it enters the shallower zone.', bin:1 },
      { es:'La música de la calle llena todo el patio interior aunque solo haya un portón angosto de acceso.',
        en:'Music from the street fills the whole inner courtyard even though the only access is a narrow gate.', bin:2 },
      { es:'El sonar de un barco recibe de vuelta el pulso que envió hacia el lecho marino.',
        en:'The sonar of a ship receives back the pulse it sent towards the seabed.', bin:0 },
      { es:'Un haz de luz se desvía de su trayectoria al entrar de forma oblicua en un bloque de vidrio.',
        en:'A light beam bends away from its path on entering a glass block at an oblique angle.', bin:1 },
      { es:'Las olas se abren en abanico detrás de la abertura estrecha de un rompeolas.',
        en:'Waves spread out like a fan behind the narrow opening of a breakwater.', bin:2 }
    ];
    var st = { i:0, tries:0, correct:0, done:false };
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Clasifica la observación', en:'Classify the observation'})+'</div>'+
          '<div class="iwbox"><div class="cls-done">🎉 '+T({es:'Completado', en:'Done'})+' '+st.correct+' / '+ITEMS.length+'</div>'+
          '<div class="rfb">'+T({
            es:'Tres preguntas resuelven cualquier caso: si la onda regresó al medio de partida, si cruzó hacia otro medio con distinta rapidez, o si se abrió detrás de una abertura comparable a su longitud de onda.',
            en:'Three questions settle any case: whether the wave returned to the medium it started in, whether it crossed into another medium with a different speed, or whether it spread out behind an opening comparable to its wavelength.'
          })+'</div></div>';
        return;
      }
      var it = ITEMS[w4SEQ[st.i]];
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Clasifica la observación', en:'Classify the observation'})+'</div>'+
        '<div class="iw-sub">'+T({
          es:'Cada tarjeta describe algo que se puede observar sin instrumentos. Decide qué fenómeno lo explica.',
          en:'Each card describes something that can be observed without instruments. Decide which phenomenon explains it.'
        })+'</div>'+
        '<div class="iwbox">'+
          '<div class="cls-prog">'+(st.i+1)+' / '+ITEMS.length+'</div>'+
          '<div class="cls-card">'+it[LANG]+'</div>'+
          '<div class="cls-bins">'+BINS.map(function(b,bi){
            return '<button class="cls-bin" onclick="w4Pick('+bi+')">'+b+'</button>';
          }).join('')+'</div>'+
          '<div class="rfb" id="w4fb"></div>'+
        '</div>';
    }
    var TIPS = [
      { es:'Fíjate si la onda terminó de regreso en el medio del que había salido.', en:'Check whether the wave ended up back in the medium it had left.' },
      { es:'Fíjate si la onda cruzó hacia un medio donde su rapidez es distinta.', en:'Check whether the wave crossed into a medium where its speed is different.' },
      { es:'Fíjate si la onda se abrió detrás de una abertura o de un obstáculo.', en:'Check whether the wave spread out behind an opening or an obstacle.' }
    ];
    window.w4Pick = function(bi){
      if (st.done) return;
      var it = ITEMS[w4SEQ[st.i]], fb = document.getElementById('w4fb');
      if (!fb) return;
      if (bi === it.bin){
        st.correct++; st.tries = 0; st.i++;
        if (st.i >= ITEMS.length) st.done = true;
        render();
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        fb.innerHTML = T({es:'Correspondía a <b>', en:'It belonged to <b>'})+BINS[it.bin]+'</b>. '+T(TIPS[it.bin]);
        st.tries = 0; st.i++;
        if (st.i >= ITEMS.length) st.done = true;
        setTimeout(render, 1900);
        return;
      }
      fb.textContent = T({es:'Todavía no. ', en:'Not yet. '}) + T(TIPS[bi]) +
        T({es:' Eso no es lo que describe la tarjeta.', en:' That is not what the card describes.'});
    };
    render();
  })();

  /* ---- PROBLEMA 7 ---- */
  (function(){

      {
        title:{es:'Del aire al agua', en:'From air into water'},
        q:{es:'Un tono puro emitido por un altavoz sobre la superficie pasa del aire al agua, donde el sonido se propaga con una rapidez notablemente mayor. Un micrófono sumergido registra ese mismo tono. Selecciona la afirmación que describe correctamente lo que el micrófono registra.',
           en:'A pure tone emitted by a loudspeaker above the surface passes from air into water, where sound propagates at a noticeably higher speed. A submerged microphone records that same tone. Select the statement that correctly describes what the microphone records.'},
        options:{es:[
          'La misma frecuencia que en el aire, con una longitud de onda mayor.',
          'La misma longitud de onda que en el aire, con una frecuencia mayor.',
          'Una frecuencia mayor y una longitud de onda mayor que en el aire.',
          'Una frecuencia menor y la misma longitud de onda que en el aire.'
        ], en:[
          'The same frequency as in air, with a longer wavelength.',
          'The same wavelength as in air, with a higher frequency.',
          'A higher frequency and a longer wavelength than in air.',

        ]},
        correct:{es:'La misma frecuencia que en el aire, con una longitud de onda mayor.',
                 en:'The same frequency as in air, with a longer wavelength.'},
        hint:{es:'El número de oscilaciones que llegan cada segundo a la frontera tiene que ser el mismo que el número que sale de ella, porque el medio no puede crear ni suprimir oscilaciones. Con ese dato fijo, la rapidez del agua obliga a reajustar la otra magnitud.',
              en:'The number of oscillations arriving each second at the boundary has to match the number leaving it, because the medium can neither create nor suppress oscillations. With that quantity fixed, the speed in water forces the other one to readjust.'},
        exp:{es:'La frecuencia la impone el altavoz y se conserva al cruzar la frontera. Como la rapidez en el agua es mayor y el producto de longitud de onda por frecuencia tiene que devolver esa rapidez, la longitud de onda aumenta en la misma proporción que la rapidez. Si la frecuencia cambiara, el tono percibido bajo el agua sería otro.',
             en:'The frequency is imposed by the loudspeaker and is conserved on crossing the boundary. Since the speed in water is higher and the product of wavelength and frequency must return that speed, the wavelength grows in the same proportion as the speed. If the frequency changed, the pitch heard under water would be a different one.'}
      },
      {
        title:{es:'Olas que llegan a la orilla', en:'Waves reaching the shore'},
        q:{es:'Un tren de olas generado mar adentro entra en la zona somera cercana a la playa, donde su rapidez de propagación se reduce a la mitad. La perturbación que las originó sigue actuando sin cambio mar adentro. Selecciona la afirmación que describe correctamente el tren de olas en la zona somera.',
           en:'A wave train generated offshore enters the shallow zone near the beach, where its propagation speed drops to half. The disturbance that generated it keeps acting unchanged offshore. Select the statement that correctly describes the wave train in the shallow zone.'},
        options:{es:[
          'Las crestas siguen llegando con el mismo ritmo, y la distancia entre ellas se reduce a la mitad.',
          'Las crestas llegan con la mitad del ritmo, y la distancia entre ellas no cambia.',

          'The crests keep arriving at the same rate, and the distance between them drops to half.',
          'The crests arrive at half the rate, and the distance between them does not change.',

          'The crests arrive at twice the rate, and the distance between them drops to half.'
        ]},
        correct:{es:'Las crestas siguen llegando con el mismo ritmo, y la distancia entre ellas se reduce a la mitad.',
                 en:'The crests keep arriving at the same rate, and the distance between them drops to half.'},
        hint:{es:'Cada cresta que entra en la zona somera tuvo que salir antes de la zona profunda, de modo que el conteo de crestas por segundo no puede alterarse. Con ese conteo fijo, una rapidez menor obliga a que cada ciclo ocupe menos espacio.',
              en:'Every crest entering the shallow zone had to leave the deep zone beforehand, so the count of crests per second cannot be altered. With that count fixed, a lower speed forces each cycle to occupy less space.'},
        exp:{es:'La frecuencia se conserva porque la fuente sigue generando el mismo número de oscilaciones por segundo y ninguna cresta se pierde en la frontera. Como el producto de longitud de onda por frecuencia debe devolver la nueva rapidez, y esa rapidez es la mitad, la distancia entre crestas también se reduce a la mitad. Ese acortamiento es lo que hace que las olas se apilen y rompan cerca de la orilla.',
             en:'The frequency is conserved because the source keeps generating the same number of oscillations per second and no crest is lost at the boundary. Since the product of wavelength and frequency must return the new speed, and that speed is half, the distance between crests also drops to half. That shortening is what makes the waves pile up and break near the shore.'}
      }
    ];
    var v = VAR[p7v];
    addProb({ title:v.title, q:v.q, hint:v.hint, exp:v.exp, options:v.options, correct:v.correct, showWork:false });

  /* ---- PROBLEMA 8 ---- */
  (function(){
    var o = optsFrom(p8.l2, [ p8.l1*p8.v1/p8.v2, p8.l1, p8.l2*p8.v2/p8.v1 ], M, true);
    addProb({
      title:{es:'Cruce hacia el segundo medio', en:'Crossing into the second medium'},
      q:{es:'Una onda avanza por un primer medio a '+MS(p8.v1)+' con crestas separadas '+M(p8.l1)+'. Al cruzar la frontera entra en un segundo medio donde su rapidez de propagación es de '+MS(p8.v2)+'. La fuente que la genera permanece en el primer medio y no se modifica. Determina la distancia que separa a dos crestas consecutivas dentro del segundo medio.',
         en:'A wave advances through a first medium at '+MS(p8.v1)+' with crests '+M(p8.l1)+' apart. On crossing the boundary it enters a second medium where its propagation speed is '+MS(p8.v2)+'. The source generating it stays in the first medium and is not modified. Determine the distance separating two consecutive crests inside the second medium.'},
      hint:{es:'Conviene averiguar primero cuántos ciclos por segundo produce la fuente, repartiendo la rapidez del primer medio entre la distancia entre crestas. Ese conteo se conserva al cruzar, así que la nueva rapidez repartida entre él da la nueva separación.',
            en:'It is worth first finding how many cycles per second the source produces, by sharing the speed in the first medium among the distance between crests. That count is conserved on crossing, so the new speed shared among it gives the new separation.'},
      exp:{es:'f = '+frac(MS(p8.v1), M(p8.l1))+' = '+HZ(p8.f)+', y esa frecuencia no cambia en la frontera. En el segundo medio, λ = '+frac(MS(p8.v2), HZ(p8.f))+' = '+M(p8.l2)+'. Invertir la proporción entrega '+M(p8.l1*p8.v1/p8.v2)+', y dejar '+M(p8.l1)+' equivale a suponer que el patrón espacial viaja intacto de un medio a otro.',
           en:'f = '+frac(MS(p8.v1), M(p8.l1))+' = '+HZ(p8.f)+', and that frequency does not change at the boundary. In the second medium, λ = '+frac(MS(p8.v2), HZ(p8.f))+' = '+M(p8.l2)+'. Inverting the proportion returns '+M(p8.l1*p8.v1/p8.v2)+', and leaving '+M(p8.l1)+' amounts to assuming the spatial pattern travels intact from one medium to the other.'},
      options:o.options, correct:o.correct, showWork:true
    });
  })();

  /* ---- PROBLEMA 9 ---- */
  (function(){
    var o = optsFrom(p9.v, [ p9.n*p9.lam, p9.lam/p9.f, p9.f/p9.lam ], MS, true);
    addProb({
      title:{es:'Boya en mar abierto', en:'Buoy in open sea'},
      q:{es:'Una boya anclada en mar abierto sube y baja '+p9.n+' veces completas en '+p9.t+' segundos mientras el oleaje pasa bajo ella. Desde la cubierta de un barco se estima que dos crestas consecutivas están separadas '+M(p9.lam)+'. Determina la rapidez con que avanza el oleaje.',
         en:'A buoy anchored in open sea rises and falls '+p9.n+' complete times in '+p9.t+' seconds while the swell passes beneath it. From the deck of a ship, two consecutive crests are estimated to be '+M(p9.lam)+' apart. Determine the speed at which the swell advances.'},
      hint:{es:'El movimiento vertical de la boya sirve para contar cuántas crestas la cruzan cada segundo. Cada una de esas crestas arrastra consigo la distancia que la separa de la siguiente, y esa combinación entrega los metros recorridos por segundo.',
            en:'The vertical motion of the buoy serves to count how many crests cross it each second. Each of those crests brings with it the distance separating it from the next, and that combination yields the metres covered per second.'},
      exp:{es:'f = '+frac(p9.n, p9.t+' s')+' = '+HZ(p9.f)+' y v = '+M(p9.lam)+' × '+HZ(p9.f)+' = '+MS(p9.v)+'. El valor '+MS(p9.n*p9.lam)+' se obtiene al multiplicar por el conteo total en lugar del conteo por segundo, es decir la distancia recorrida durante toda la observación.',
           en:'f = '+frac(p9.n, p9.t+' s')+' = '+HZ(p9.f)+' and v = '+M(p9.lam)+' × '+HZ(p9.f)+' = '+MS(p9.v)+'. The value '+MS(p9.n*p9.lam)+' comes from multiplying by the total count instead of the count per second, that is the distance covered over the whole observation.'},

  (function(){

           en:'A sonar unit mounted on the hull of a ship sends a vertical sound pulse towards the bottom and picks up its echo '+SEG(p10.t)+' after emitting it. The water stays homogeneous over the whole path. Determine the depth of the seabed beneath the ship.'},
        fn:{es:'rapidez del sonido en el agua = 1500 m/s', en:'speed of sound in water = 1500 m/s'},
        hint:{es:'El tiempo medido por el equipo cubre el viaje de ida y el de regreso, de modo que solo la mitad de ese tiempo corresponde al descenso. Con la rapidez del sonido en el agua se convierte ese tiempo en distancia.',
              en:'The time measured by the unit covers the trip down and the trip back, so only half of that time belongs to the descent. With the speed of sound in water, that time is turned into distance.'},
        exp:{es:'El pulso recorre 1500 m/s × '+SEG(p10.t)+' = '+num(VW*p10.t,1)+' m en total, y esa cifra incluye la ida y la vuelta. La profundidad es '+frac(num(VW*p10.t,1)+' m', 2)+' = '+num(p10.d,1)+' m. Informar '+num(VW*p10.t,1)+' m olvida que el eco tuvo que regresar hasta el casco.',
             en:'The pulse covers 1500 m/s × '+SEG(p10.t)+' = '+num(VW*p10.t,1)+' m in total, and that figure includes the trip down and back. The depth is '+frac(num(VW*p10.t,1)+' m', 2)+' = '+num(p10.d,1)+' m. Reporting '+num(VW*p10.t,1)+' m forgets that the echo had to travel back to the hull.'},
        options:o.options, correct:o.correct, showWork:true
      });
    } else {
      o = optsFrom(p10.t, [ p10.d/VW, 4*p10.d/VW, p10.d/(2*VW) ], SEG, true);
      addProb({
        title:{es:'Sondeo del lecho marino', en:'Sounding the seabed'},
        q:{es:'Un equipo de sonar instalado en el casco de un barco lanza un pulso sonoro vertical hacia el fondo, que se encuentra a '+num(p10.d,1)+' m bajo el casco. El agua se mantiene homogénea durante todo el trayecto. Determina el tiempo que transcurre entre la emisión del pulso y la captación de su eco.',
           en:'A sonar unit mounted on the hull of a ship sends a vertical sound pulse towards the bottom, which lies '+num(p10.d,1)+' m below the hull. The water stays homogeneous over the whole path. Determine the time elapsing between the emission of the pulse and the capture of its echo.'},
        fn:{es:'rapidez del sonido en el agua = 1500 m/s', en:'speed of sound in water = 1500 m/s'},
        hint:{es:'El pulso no se detiene en el fondo: se refleja y regresa hasta el casco, de modo que el trayecto que hay que considerar es el doble de la profundidad. Ese recorrido total, repartido entre la rapidez del sonido en el agua, entrega el tiempo buscado.',
              en:'The pulse does not stop at the bottom: it reflects and returns to the hull, so the path to consider is twice the depth. That total path, shared among the speed of sound in water, yields the time sought.'},
        exp:{es:'El recorrido completo mide 2 × '+num(p10.d,1)+' m = '+num(2*p10.d,1)+' m, y el tiempo es '+frac(num(2*p10.d,1)+' m', '1500 m/s')+' = '+SEG(p10.t)+'. Informar '+SEG(p10.d/VW)+' contabiliza únicamente el descenso y deja fuera el regreso del eco.',
             en:'The complete path measures 2 × '+num(p10.d,1)+' m = '+num(2*p10.d,1)+' m, and the time is '+frac(num(2*p10.d,1)+' m', '1500 m/s')+' = '+SEG(p10.t)+'. Reporting '+SEG(p10.d/VW)+' counts only the descent and leaves out the return of the echo.'},
        options:o.options, correct:o.correct, showWork:true
      });
    }
  })();
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Ondas y Fenómenos Ondulatorios';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
