<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabla Periódica y Enlace Químico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE WIDGETS (tabla periódica y enlace) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:34px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:96px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem; color:var(--green); min-width:44px; text-align:right; }
.readrow { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.8rem; }
.readcell { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.readlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.readnum { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:700; color:var(--green-dark); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.82rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.5rem .7rem; margin:.5rem 0; overflow-x:auto; white-space:nowrap; }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.85rem; text-align:center; font-weight:600; font-size:.9rem; margin:.6rem 0; color:var(--text); }
.cls-bins { display:flex; gap:.5rem; flex-wrap:wrap; }
.cls-bin { flex:1; min-width:112px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }
.lvlrow { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; margin-top:.5rem; }
.lvllbl { font-size:.78rem; color:var(--text3); min-width:104px; }
.lvlbtn { min-width:44px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:inherit; font-size:.85rem; font-weight:600; cursor:pointer; }
.lvlbtn:hover { border-color:var(--green); color:var(--green); }
.lvlbtn.on { background:var(--green); color:#fff; border-color:var(--green); }
.ptgrid { display:grid; grid-template-columns:repeat(8,1fr); gap:.25rem; margin:.7rem 0 .3rem; }
.ptcol { font-family:'IBM Plex Mono',monospace; font-size:.6rem; color:var(--text3); text-align:center; }
.ptcell { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.82rem; cursor:pointer; padding:.2rem; }
.ptcell:hover { border-color:var(--green); color:var(--green); }
.ptcell.empty { border-color:transparent; background:none; cursor:default; }
.ptcell.ok { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.ptcell.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.chiprow { display:flex; flex-wrap:wrap; gap:.35rem; margin:.3rem 0 .7rem; }
.echip { min-width:44px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.82rem; cursor:pointer; padding:.3rem .5rem; }
.echip:hover { border-color:var(--green); color:var(--green); }
.echip.on { background:var(--green); color:#fff; border-color:var(--green); }
.slotrow { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-top:.5rem; }
@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }
  .readrow { grid-template-columns:1fr; }
  .cls-bins { flex-direction:column; }
  .gcanvas { height:230px; }
  .klbl, .lvllbl { min-width:70px; }
  .ptgrid { gap:.18rem; }

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;

  saveSession();

}

async function generatePDF() {

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;

  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────

  // var logoRightB64 = '{{LOGO_RIGHT_B64}}';
  // doc.addImage(logoLeftB64,  'PNG', M,   4, 48, 22);
  // doc.addImage(logoRightB64, 'PNG', 130, 4, 48, 22);
  // ─────────────────────────────────────────────────────────────────────────

  // LIAXA logo — right side of white strip
  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');

  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');

  // ── Per-problem pages ──

    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('cneyt1_t03_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function one(arr){ return arr[Math.floor(rng()*arr.length)]; }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 240;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function d1(x){ return Math.round(x*10)/10; }
  function f1(x){ return d1(x).toFixed(1); }
  var SUPD = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻'};
  var SUBD = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
  function sup(s){ var o='', i; s=String(s); for(i=0;i<s.length;i++) o += (SUPD[s.charAt(i)] || s.charAt(i)); return o; }
  function sbs(s){ var o='', i; s=String(s); for(i=0;i<s.length;i++) o += (SUBD[s.charAt(i)] || s.charAt(i)); return o; }
  function uniq4(correct, cands){
    var out = [correct], i;
    for (i=0;i<cands.length && out.length<4;i++){
      if (out.indexOf(cands[i]) < 0) out.push(cands[i]);
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }
  var sp;

  /* ============================================================
     DATOS DE LOS 20 PRIMEROS ELEMENTOS
     s símbolo · p periodo · g grupo · x electronegatividad
     r radio atómico (pm) · i primera energía de ionización (kJ/mol)
     k naturaleza: me metal, nm no metal, md metaloide, ng gas noble
     ============================================================ */
  var EL = [
    {s:'H', z:1,  p:1, g:1,  x:2.1, r:37,  i:1312, k:'nm', es:'hidrógeno', en:'hydrogen'},
    {s:'He',z:2,  p:1, g:18, x:0,   r:31,  i:2372, k:'ng', es:'helio',      en:'helium'},
    {s:'Li',z:3,  p:2, g:1,  x:1.0, r:152, i:520,  k:'me', es:'litio',      en:'lithium'},
    {s:'Be',z:4,  p:2, g:2,  x:1.5, r:112, i:899,  k:'me', es:'berilio',    en:'beryllium'},
    {s:'B', z:5,  p:2, g:13, x:2.0, r:85,  i:801,  k:'md', es:'boro',       en:'boron'},
    {s:'C', z:6,  p:2, g:14, x:2.5, r:77,  i:1086, k:'nm', es:'carbono',    en:'carbon'},
    {s:'N', z:7,  p:2, g:15, x:3.0, r:75,  i:1402, k:'nm', es:'nitrógeno',  en:'nitrogen'},
    {s:'O', z:8,  p:2, g:16, x:3.5, r:73,  i:1314, k:'nm', es:'oxígeno',    en:'oxygen'},
    {s:'F', z:9,  p:2, g:17, x:4.0, r:72,  i:1681, k:'nm', es:'flúor',      en:'fluorine'},
    {s:'Ne',z:10, p:2, g:18, x:0,   r:71,  i:2081, k:'ng', es:'neón',       en:'neon'},
    {s:'Na',z:11, p:3, g:1,  x:0.9, r:186, i:496,  k:'me', es:'sodio',      en:'sodium'},
    {s:'Mg',z:12, p:3, g:2,  x:1.2, r:160, i:738,  k:'me', es:'magnesio',   en:'magnesium'},
    {s:'Al',z:13, p:3, g:13, x:1.5, r:143, i:578,  k:'me', es:'aluminio',   en:'aluminium'},
    {s:'Si',z:14, p:3, g:14, x:1.8, r:118, i:786,  k:'md', es:'silicio',    en:'silicon'},
    {s:'P', z:15, p:3, g:15, x:2.1, r:110, i:1012, k:'nm', es:'fósforo',    en:'phosphorus'},
    {s:'S', z:16, p:3, g:16, x:2.5, r:103, i:1000, k:'nm', es:'azufre',     en:'sulfur'},
    {s:'Cl',z:17, p:3, g:17, x:3.0, r:99,  i:1251, k:'nm', es:'cloro',      en:'chlorine'},
    {s:'Ar',z:18, p:3, g:18, x:0,   r:98,  i:1521, k:'ng', es:'argón',      en:'argon'},
    {s:'K', z:19, p:4, g:1,  x:0.8, r:227, i:419,  k:'me', es:'potasio',    en:'potassium'},
    {s:'Ca',z:20, p:4, g:2,  x:1.0, r:197, i:590,  k:'me', es:'calcio',     en:'calcium'}
  ];
  function E(sym){ var i; for(i=0;i<EL.length;i++){ if(EL[i].s===sym) return EL[i]; } return EL[0]; }
  function nm(sym){ return T(E(sym)); }
  function vale(e){ return e.g<=2 ? e.g : (e.g===18 ? (e.s==='He'?2:8) : e.g-10); }
  function ionq(e){
    if (e.g===1)  return 1;  if (e.g===2)  return 2;  if (e.g===13) return 3;
    if (e.g===15) return -3; if (e.g===16) return -2; if (e.g===17) return -1;
    return 0;
  }
  function chgTxt(q){ return q>0 ? (q+'+') : ((-q)+'−'); }
  function ionS(symb, q){ var n = Math.abs(q); return symb + sup((n>1?String(n):'') + (q>0?'+':'-')); }
  function ionTxt(e){ return ionS(e.s, ionq(e)); }
  function nElec(e){ return e.z - ionq(e); }
  function valCfg(e){
    return e.g<=2 ? (e.p + 's' + sup(e.g))
                  : (e.p + 's² ' + e.p + 'p' + sup(vale(e)-2));
  }
  function dEN(a,b){ return d1(Math.abs(a.x - b.x)); }
  function bondOf(a,b){
    if (a.k==='me' && b.k==='me') return 'met';
    var d = dEN(a,b);
    if (d >= 1.7) return 'ion';
    if (d >= 0.4) return 'pol';
    return 'apol';
  }
  var BONDN = {
    ion : {es:'enlace iónico',            en:'ionic bond'},
    pol : {es:'enlace covalente polar',   en:'polar covalent bond'},
    apol: {es:'enlace covalente no polar',en:'nonpolar covalent bond'},
    met : {es:'enlace metálico',          en:'metallic bond'}
  };
  function gcd(a,b){ return b===0 ? a : gcd(b, a%b); }
  function formula(mSym, xSym){
    var m = E(mSym), x = E(xSym);
    var qm = ionq(m), qx = -ionq(x);
    var g = gcd(qm, qx), a = qx/g, b = qm/g;
    return m.s + (a>1?sbs(a):'') + x.s + (b>1?sbs(b):'');
  }
  function formulaAB(mSym, xSym, a, b){
    return E(mSym).s + (a>1?sbs(a):'') + E(xSym).s + (b>1?sbs(b):'');
  }

  /* ============================================================
     VALORES CON SEMILLA (se extraen una sola vez, en orden fijo)
     ============================================================ */
  var vP1 = Math.floor(rng()*2), vP2 = Math.floor(rng()*2), vP4 = Math.floor(rng()*3);
  var vP5 = Math.floor(rng()*2), vP6 = Math.floor(rng()*2), vP7 = Math.floor(rng()*3);
  var vP8 = Math.floor(rng()*2), vP9 = Math.floor(rng()*2), vP10 = Math.floor(rng()*2);
  var vP3 = Math.floor(rng()*4);

  /* manipulativo 1: localizador */

  /* ---- MANIPULATIVO 2: explorador de tendencias ---- */
  (function(){
    var wrap = widget('tendencias');
    var PROPS = [
      { k:'r', n:{es:'Radio atómico', en:'Atomic radius'},        u:' pm' },
      { k:'i', n:{es:'Energía de ionización', en:'Ionization energy'}, u:' kJ/mol' },
      { k:'x', n:{es:'Electronegatividad', en:'Electronegativity'}, u:'' }
    ];
    var GOALS = [
      { p:3, k:'r', m:'max' }, { p:2, k:'x', m:'max' }, { p:3, k:'i', m:'max' },
      { p:2, k:'r', m:'min' }, { p:3, k:'x', m:'max' }, { p:2, k:'i', m:'min' }
    ];
    var st = { per:3, prop:0, i:0, r:0, tries:0, rev:false, done:false };
    function rowOf(per){
      return EL.filter(function(e){ return e.p===per && e.k!=='ng'; })
               .sort(function(a,b){ return a.z-b.z; });
    }
    function valOf(e,k){ return k==='r' ? e.r : (k==='i' ? e.i : e.x); }
    function fmtV(v,k){ return k==='x' ? f1(v) : String(v); }
    function goal(){ return GOALS[trSeq[st.r]]; }
    function target(){
      var g = goal(), row = rowOf(g.p), best = row[0], j;
      for (j=1;j<row.length;j++){
        if (g.m==='max' ? valOf(row[j],g.k) > valOf(best,g.k) : valOf(row[j],g.k) < valOf(best,g.k)) best = row[j];
      }
      return best;
    }
    function draw(){
      var cv = document.getElementById('trCv'); if (!cv) return;
      var g = fitCv(cv), ctx = g.ctx, w = g.w, h = g.h;
      var row = rowOf(st.per), k = PROPS[st.prop].k;
      var vals = row.map(function(e){ return valOf(e,k); });
      var mx = Math.max.apply(null, vals) * 1.12;
      var m = 10, bw = (w - 2*m) / row.length, base = h - 30;
      ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(m, base); ctx.lineTo(w-m, base); ctx.stroke();
      ctx.textAlign = 'center';
      row.forEach(function(e, idx){
        var v = vals[idx], hh = (v/mx) * (base - 34);
        var x = m + idx*bw + bw*0.17, ww = bw*0.66, y = base - hh;
        ctx.fillStyle = (idx===st.i) ? cssv('--green') : cssv('--green-bg');
        ctx.fillRect(x, y, ww, hh);
        ctx.strokeStyle = (idx===st.i) ? cssv('--gold') : cssv('--border');
        ctx.lineWidth = (idx===st.i) ? 2 : 1;
        ctx.strokeRect(x, y, ww, hh);
        ctx.fillStyle = (idx===st.i) ? cssv('--green-dark') : cssv('--text2');
        ctx.font = (idx===st.i ? 'bold ' : '') + '12px "IBM Plex Mono", monospace';
        ctx.fillText(e.s, x+ww/2, base+15);
        ctx.fillStyle = cssv('--text3');
        ctx.font = '10px "IBM Plex Sans", sans-serif';
        ctx.fillText(fmtV(v,k), x+ww/2, y-5);
      });
      ctx.textAlign = 'left';
      ctx.fillStyle = cssv('--text3');
      ctx.font = '11px "IBM Plex Sans", sans-serif';
      ctx.fillText(T(PROPS[st.prop].n)+T({es:' en el periodo ', en:' across period '})+st.per, m, 14);
      ctx.fillText(T({es:'grupo 1', en:'group 1'}), m, base+28);
      ctx.textAlign = 'right';
      ctx.fillText(T({es:'grupo 17', en:'group 17'}), w-m, base+28);
    }
    function readInner(){
      var row = rowOf(st.per), e = row[st.i], k = PROPS[st.prop].k;
      return '<div class="readcell"><div class="readlbl">'+T({es:'Elemento', en:'Element'})+'</div><div class="readnum">'+e.s+'</div></div>'+
             '<div class="readcell"><div class="readlbl">'+T({es:'Grupo', en:'Group'})+'</div><div class="readnum">'+e.g+'</div></div>'+
             '<div class="readcell"><div class="readlbl">'+T(PROPS[st.prop].n)+'</div><div class="readnum">'+fmtV(valOf(e,k),k)+PROPS[st.prop].u+'</div></div>';
    }
    function readouts(){ return '<div class="readrow" id="trRead">'+readInner()+'</div>'; }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Explorador de tendencias', en:'Trend explorer'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">🎉 '+T({es:'Las tres tendencias quedaron ubicadas en la tabla.',
                                                             en:'The three trends are now placed on the table.'})+'</div></div>';
        return;
      }
      var g = goal(), row = rowOf(st.per);
      if (st.i >= row.length) st.i = row.length-1;
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Explorador de tendencias', en:'Trend explorer'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda ', en:'Round '})+(st.r+1)+' / 3</div>'+
          '<div class="goalbar">'+T({
            es:'Objetivo: coloca el selector sobre el elemento del periodo '+g.p+' con '+(g.m==='max'?'el mayor ':'el menor ')+T(PROPS[[ 'r','i','x' ].indexOf(g.k)].n).toLowerCase()+'. Cambia de periodo y de propiedad las veces que necesites.',
            en:'Goal: place the selector on the period '+g.p+' element with the '+(g.m==='max'?'largest ':'smallest ')+T(PROPS[[ 'r','i','x' ].indexOf(g.k)].n).toLowerCase()+'. Switch period and property as often as you need.'})+'</div>'+
          '<div class="lvlrow">'+
            '<span class="lvllbl">'+T({es:'Periodo', en:'Period'})+'</span>'+
            '<button class="lvlbtn'+(st.per===2?' on':'')+'" onclick="trPer(2)">2</button>'+
            '<button class="lvlbtn'+(st.per===3?' on':'')+'" onclick="trPer(3)">3</button>'+
          '</div>'+
          '<div class="mtabs">'+PROPS.map(function(pp,idx){
            return '<button class="mtab'+(st.prop===idx?' active':'')+'" onclick="trProp('+idx+')">'+T(pp.n)+'</button>';
          }).join('')+'</div>'+
          '<canvas class="gcanvas" id="trCv"></canvas>'+
          '<div class="krow">'+
            '<span class="klbl">'+T({es:'Selector', en:'Selector'})+'</span>'+
            '<input type="range" min="0" max="'+(row.length-1)+'" step="1" value="'+st.i+'" oninput="trSlide(this.value)">'+
            '<span class="kval" id="trKv">'+row[st.i].s+'</span>'+
          '</div>'+
          readouts()+
          '<button class="rverify-btn" onclick="trCheck()">'+T({es:'Comprobar la posición', en:'Check the position'})+'</button>'+
          '<div class="rfb" id="trFb"></div>';
      draw();
    }
    window.trSlide = function(v){
      st.i = parseInt(v,10)||0;
      var row = rowOf(st.per);
      if (st.i >= row.length) st.i = row.length-1;
      var kv = document.getElementById('trKv'); if (kv) kv.textContent = row[st.i].s;
      var rd = document.getElementById('trRead'); if (rd) rd.innerHTML = readInner();
      draw();
    };
    window.trPer = function(p){ st.per = p; st.i = 0; render(); };
    window.trProp = function(k){ st.prop = k; render(); };
    window.trCheck = function(){
      if (st.done) return;
      var g = goal(), row = rowOf(st.per), e = row[st.i], t = target(), fb;
      if (st.per === g.p && e.s === t.s){
        st.r++; st.tries = 0; st.i = 0;
        if (st.r >= 3){ st.done = true; render(); return; }
        render();
        document.getElementById('trFb').innerHTML = '<span class="okmsg">✓ '+T({
          es:'Ahí está. Siguiente objetivo en pantalla.', en:'That is the one. Next goal on screen.'})+'</span>';
        return;
      }
      st.tries++;
      fb = document.getElementById('trFb');
      if (st.tries >= 3){
        st.per = g.p; st.prop = ['r','i','x'].indexOf(g.k);
        st.i = rowOf(g.p).map(function(q){ return q.s; }).indexOf(t.s);
        render();
        document.getElementById('trFb').innerHTML = T({
          es:'Es el '+T(t)+', del grupo '+t.g+', con '+fmtV(valOf(t,g.k),g.k)+PROPS[['r','i','x'].indexOf(g.k)].u+'. Recuerda que hacia la derecha el núcleo sujeta con más fuerza a los electrones de valencia.',
          en:'It is '+T(t)+', from group '+t.g+', with '+fmtV(valOf(t,g.k),g.k)+PROPS[['r','i','x'].indexOf(g.k)].u+'. Remember that towards the right the nucleus holds the valence electrons more tightly.'});
        st.r++; st.tries = 0;
        setTimeout(function(){
          if (st.r >= 3){ st.done = true; }
          st.i = 0; render();
        }, 3000);
        return;
      }
      if (st.per !== g.p){
        fb.textContent = T({es:'Estás mirando el periodo '+st.per+' y el objetivo vive en el periodo '+g.p+'. Cambia de fila antes de comparar.',
                            en:'You are looking at period '+st.per+' and the goal lives in period '+g.p+'. Switch rows before comparing.'});
        return;
      }
      var it = row.map(function(q){ return q.s; }).indexOf(t.s);
      fb.textContent = T({
        es:'Todavía no. En '+e.s+' el valor es '+fmtV(valOf(e,g.k),g.k)+' y el que buscas está '+(it>st.i?'hacia la derecha':'hacia la izquierda')+', a '+Math.abs(it-st.i)+' posición(es) de distancia.',
        en:'Not yet. At '+e.s+' the value is '+fmtV(valOf(e,g.k),g.k)+' and the one you want lies '+(it>st.i?'to the right':'to the left')+', '+Math.abs(it-st.i)+' position(s) away.'});
    };
    render();
  })();

        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Clasificador de evidencias', en:'Evidence sorter'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">🎉 '+T({es:'Evidencias clasificadas: ', en:'Evidence sorted: '})+st.good+' / '+ITEMS.length+'</div></div>';
        return;
      }
      var it = ITEMS[clSeq[st.i]];
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Clasificador de evidencias', en:'Evidence sorter'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="cls-prog">'+(st.i+1)+' / '+ITEMS.length+'</div>'+
          '<div class="iw-sub">'+T({es:'Un laboratorio reporta esta observación. Decide qué enlace la produce.',
                                    en:'A laboratory reports this observation. Decide which bond produces it.'})+'</div>'+
          '<div class="cls-card">'+T(it.t)+'</div>'+
          '<div class="cls-bins">'+BINS.map(function(b,bi){
            return '<button class="cls-bin" onclick="clPick('+bi+')">'+T(b)+'</button>';
          }).join('')+'</div>'+
          '<div class="rfb" id="clFb"></div>'+
        '</div>';
    }
    window.clPick = function(bi){
      if (st.done) return;
      var it = ITEMS[clSeq[st.i]], fb = document.getElementById('clFb');
      if (bi === it.b){
        st.good++; st.tries = 0; st.i++;
        if (st.i >= ITEMS.length){ st.done = true; render(); return; }
        render();
        document.getElementById('clFb').innerHTML = '<span class="okmsg">✓ '+T(it.w)+'</span>';
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        fb.innerHTML = T({es:'Correspondía a <b>', en:'It belonged to <b>'})+T(BINS[it.b])+'</b>. '+T(it.w);
        st.tries = 0; st.i++;
        if (st.i >= ITEMS.length) st.done = true;
        setTimeout(render, 2600);
        return;
      }
      fb.textContent = bi === 2
        ? T({es:'Todavía no. Pregúntate si hay electrones libres moviéndose por toda la muestra o si las cargas están amarradas a posiciones fijas.',
             en:'Not yet. Ask yourself whether free electrons move through the whole sample or whether the charges are tied to fixed positions.'})
        : T({es:'Todavía no. Fíjate en cuánta energía hace falta para separar las unidades y en si aparecen cargas capaces de desplazarse.',
             en:'Not yet. Look at how much energy is needed to separate the units and whether charges able to move appear.'});
    };
    render();
  })();

  /* ---- P7 ---- */
  (function(){
    var prof, cor, cands;
    function pairTxt(pp){ return T({es:nm(pp[0])+' y '+nm(pp[1]), en:nm(pp[0])+' and '+nm(pp[1])}); }
    if (vP7 === 0){
      prof = {es:'funde a temperatura elevada, es duro y frágil, no conduce la corriente en estado sólido y sí la conduce una vez fundido',
              en:'melts at a high temperature, is hard and brittle, conducts no current in the solid state and does conduct once molten'};
      cor = pairTxt(p7Pairs);
      cands = [pairTxt(p7Met), pairTxt(p7Mol), pairTxt(p7Md)];
    } else if (vP7 === 1){
      prof = {es:'conduce la electricidad en estado sólido, se deja laminar sin romperse y presenta brillo en la superficie recién cortada',
              en:'conducts electricity in the solid state, can be rolled into sheets without breaking and shows luster on a freshly cut surface'};
      cor = pairTxt(p7Met);
      cands = [pairTxt(p7Pairs), pairTxt(p7Mol), pairTxt(p7Md)];
    } else {
      prof = {es:'hierve por debajo de la temperatura de ebullición del agua, no conduce la corriente en ningún estado y se disuelve mejor en disolventes no polares',
              en:'boils below the boiling temperature of water, conducts no current in any state and dissolves better in nonpolar solvents'};
      cor = pairTxt(p7Mol);
      cands = [pairTxt(p7Pairs), pairTxt(p7Met), pairTxt(p7Md)];
    }
    var oo = uniq4(cor, cands);
    addProb({
      title:{es:'Del comportamiento a la pareja de elementos', en:'From behaviour to the pair of elements'},
      q:{es:'Una sustancia desconocida '+T(prof)+'. Identifica el par de elementos que puede haberla formado.',
         en:'An unknown substance '+T(prof)+'. Identify the pair of elements that may have formed it.'},
      options:{es:oo, en:oo}, correct:cor,
      hint:{es:'Traduce cada observación a una condición sobre las cargas: pregúntate si están fijas, si pueden moverse y qué tan fuerte es la unión que hay que vencer.',
            en:'Translate each observation into a condition on the charges: ask whether they are fixed, whether they can move and how strong the union to be overcome is.'},
      exp: vP7===0
        ? {es:'Ese perfil describe una red iónica: cargas opuestas fijas en el sólido, liberadas al fundir. Solo la combinación de un metal con un no metal produce una ΔEN suficiente para transferir electrones, y esa es la pareja '+cor+'. Dos metales conducirían ya en estado sólido, dos no metales darían moléculas de fusión baja y un gas noble, con la capa de valencia completa, no forma compuesto en estas condiciones.',
           en:'That profile describes an ionic network: opposite charges fixed in the solid, released on melting. Only the combination of a metal with a nonmetal produces a ΔEN large enough to transfer electrons, and that is the pair '+cor+'. Two metals would conduct already in the solid state, two nonmetals would give molecules with a low melting point and a noble gas, with its valence shell complete, forms no compound under these conditions.'}
        : (vP7===1
        ? {es:'La conducción en estado sólido junto con la maleabilidad y el brillo solo se explica por electrones deslocalizados, es decir por dos metales: '+cor+'. Un sólido iónico se rompería en lugar de laminarse y no conduciría hasta fundirse, una pareja de no metales no aportaría cargas móviles y un gas noble no llega a combinarse.',
           en:'Conduction in the solid state together with malleability and luster is explained only by delocalized electrons, that is by two metals: '+cor+'. An ionic solid would shatter instead of rolling out and would not conduct until molten, a pair of nonmetals would provide no mobile charges and a noble gas does not combine at all.'}
        : {es:'Una ebullición baja y la ausencia total de conducción señalan unidades moleculares unidas entre sí por fuerzas débiles, lo que exige dos no metales: '+cor+'. La presencia de un metal habría producido cargas móviles en alguno de los estados y un gas noble no habría formado compuesto alguno.',
           en:'A low boiling point and the complete absence of conduction point to molecular units held together by weak forces, which requires two nonmetals: '+cor+'. The presence of a metal would have produced mobile charges in one of the states and a noble gas would have formed no compound at all.'}),
      showWork:false });
  })();

  /* ============================================================
     CIERRE
     ============================================================ */
  sec(T({es:'Cierre', en:'Closing'}),
      T({es:'Situaciones para decidir', en:'Situations to decide'}),
      '<p>'+T({es:'Las siguientes situaciones se resuelven con la tabla a la vista y sin más datos que la posición de los elementos implicados.',
               en:'The following situations are solved with the table in view and with no data beyond the position of the elements involved.'})+'</p>');

  /* ---- P8 ---- */
  (function(){
    function pairTxt(pp){ return T({es:nm(pp[0])+' y '+nm(pp[1]), en:nm(pp[0])+' and '+nm(pp[1])}); }
    var best = p8[0], j, dv;
    for (j=1;j<p8.length;j++){
      dv = dEN(E(p8[j][0]), E(p8[j][1]));
      if (vP8===0 ? dv > dEN(E(best[0]),E(best[1])) : dv < dEN(E(best[0]),E(best[1]))) best = p8[j];
    }
    var oo = p8.map(pairTxt);
    var dbest = dEN(E(best[0]), E(best[1]));
    addProb({
      title:{es:'Carácter iónico en competencia', en:'Ionic character in competition'},
      q:{es:'Se comparan cuatro parejas de elementos que forman compuestos binarios. Determina cuál de ellas origina el enlace con '+(vP8===0?'mayor':'menor')+' carácter iónico.',
         en:'Four pairs of elements that form binary compounds are compared. Determine which of them gives rise to the bond with the '+(vP8===0?'greatest':'smallest')+' ionic character.'},
      options:{es:oo, en:oo}, correct:pairTxt(best),
      hint:{es:'El carácter iónico crece con la separación entre los valores de electronegatividad de los dos elementos; conviene calcular las cuatro diferencias antes de decidir.',
            en:'Ionic character grows with the separation between the electronegativity values of the two elements; it is worth working out the four differences before deciding.'},
      exp:{es:'Las diferencias son '+p8.map(function(pp){ return E(pp[0]).s+'/'+E(pp[1]).s+' = '+f1(dEN(E(pp[0]),E(pp[1]))); }).join(', ')+'. La pareja '+pairTxt(best)+' alcanza ΔEN = '+f1(dbest)+', el valor '+(vP8===0?'más alto':'más bajo')+' del conjunto, porque sus elementos están '+(vP8===0?'en extremos opuestos de la tabla':'muy próximos en la tabla')+'.',
           en:'The differences are '+p8.map(function(pp){ return E(pp[0]).s+'/'+E(pp[1]).s+' = '+f1(dEN(E(pp[0]),E(pp[1]))); }).join(', ')+'. The pair '+pairTxt(best)+' reaches ΔEN = '+f1(dbest)+', the '+(vP8===0?'highest':'lowest')+' value of the set, because its elements sit '+(vP8===0?'at opposite ends of the table':'very close together in the table')+'.'},
      showWork:true });
  })();

  /* ---- P9 ---- */
  (function(){
    var m = E(p9[0]), x = E(p9[1]), y = E(p9[2]);
    if (vP9 === 0){
      var cor = T({es:'La sustancia A, porque su red de iones de carga opuesta exige mucha energía para separarse',
                   en:'Substance A, because its network of oppositely charged ions demands a great deal of energy to come apart'});
      var oo = uniq4(cor, [
        T({es:'La sustancia B, porque el enlace covalente dentro de cada molécula es de los más fuertes que se conocen',
           en:'Substance B, because the covalent bond inside each molecule is among the strongest that are known'}),
        T({es:'La sustancia A, porque sus moléculas resultan más pesadas que las de la sustancia B',
           en:'Substance A, because its molecules turn out to be heavier than those of substance B'}),
        T({es:'La sustancia B, porque el '+T(y)+' posee una electronegatividad mayor que la del '+T(m),
           en:'Substance B, because '+T(y)+' has a higher electronegativity than '+T(m)})
      ]);
      sp = {
        title:{es:'Cuál funde primero', en:'Which one melts first'},
        q:{es:'La sustancia A se forma entre el '+T(m)+' y el '+T(x)+'. La sustancia B está formada por moléculas de dos átomos de '+T(y)+'. Determina cuál de las dos necesita mayor temperatura para fundir y la razón que lo sostiene.',
           en:'Substance A forms between '+T(m)+' and '+T(x)+'. Substance B is made of molecules of two '+T(y)+' atoms. Determine which of the two needs a higher temperature to melt and the reason that supports it.'},
        options:{es:oo, en:oo}, correct:cor,
        hint:{es:'Identifica qué unión hay que vencer al fundir cada sustancia: en un caso es la red completa y en el otro solo la fuerza entre moléculas vecinas.',
              en:'Identify which union must be overcome on melting each substance: in one case the complete network and in the other only the force between neighbouring molecules.'},
        exp:{es:'La sustancia A combina un metal con un no metal, ΔEN = '+f1(dEN(m,x))+', de modo que es una red iónica extendida y fundirla implica vencer atracciones en las tres direcciones. La sustancia B está hecha de moléculas neutras: al fundir solo se separan unas de otras, no se rompe el enlace interno, y para eso basta muy poca energía. Comparar masas moleculares o electronegatividades aisladas no informa sobre la energía de la red.',
             en:'Substance A combines a metal with a nonmetal, ΔEN = '+f1(dEN(m,x))+', so it is an extended ionic network and melting it means overcoming attractions in all three directions. Substance B is made of neutral molecules: on melting they only separate from one another, the internal bond is not broken, and very little energy suffices for that. Comparing molecular masses or isolated electronegativities says nothing about the network energy.'},
        showWork:false };
    } else {
      var cor2 = T({es:'Solo el metal, porque sus electrones deslocalizados se desplazan sin que la muestra se funda',
                    en:'Only the metal, because its delocalized electrons move without the sample melting'});
      var oo2 = uniq4(cor2, [
        T({es:'Solo el compuesto iónico, porque contiene cargas eléctricas y el metal es eléctricamente neutro',
           en:'Only the ionic compound, because it contains electric charges and the metal is electrically neutral'}),
        T({es:'Las dos, porque cualquier sólido con enlaces fuertes deja pasar la corriente eléctrica',
           en:'Both, because any solid with strong bonds lets electric current through'}),
        T({es:'Ninguna, porque en todo sólido las partículas ocupan posiciones fijas de la estructura',
           en:'Neither, because in every solid the particles occupy fixed positions of the structure'})
      ]);
      sp = {
        title:{es:'Cuál conduce sin fundirse', en:'Which one conducts without melting'},
        q:{es:'Sobre la mesa hay dos muestras sólidas: una es el compuesto formado entre el '+T(m)+' y el '+T(x)+', la otra es una lámina del propio '+T(m)+'. Se aplica un voltaje pequeño a cada muestra sin calentarlas. Determina cuál de las dos conduce la corriente y la razón que lo explica.',
           en:'On the bench there are two solid samples: one is the compound formed between '+T(m)+' and '+T(x)+', the other is a sheet of '+T(m)+' itself. A small voltage is applied to each sample without heating them. Determine which of the two conducts the current and the reason that explains it.'},
        options:{es:oo2, en:oo2}, correct:cor2,
        hint:{es:'Para conducir hace falta que exista carga capaz de desplazarse; revisa en cada muestra si esa carga está libre o atrapada en la estructura.',
              en:'Conduction requires charge that is able to move; check in each sample whether that charge is free or trapped in the structure.'},
        exp:{es:'El '+T(m)+' metálico mantiene sus cationes en posiciones ordenadas mientras los electrones de valencia recorren toda la muestra, y ese movimiento es la corriente. El compuesto entre '+T(m)+' y '+T(x)+' tiene iones con carga, pero en el sólido esos iones están fijos en la red: solo conduce fundido o en disolución. Tener carga no basta, la carga debe poder desplazarse.',
             en:'Metallic '+T(m)+' keeps its cations in ordered positions while the valence electrons travel through the whole sample, and that movement is the current. The compound between '+T(m)+' and '+T(x)+' does hold charged ions, but in the solid those ions are fixed in the network: it conducts only when molten or in solution. Having charge is not enough, the charge must be able to move.'},
        showWork:false };
    }
    addProb(sp);
  })();

  /* ---- P10 ---- */
  (function(){
    var m = E(p10[0]), x = E(p10[1]), dd = dEN(m,x), fq = formula(m.s, x.s);
    if (vP10 === 0){
      var cor = T({es:'Enlace iónico; el sólido no conduce, pero conduce una vez fundido',
                   en:'Ionic bond; the solid does not conduct, but it conducts once molten'});
      var oo = uniq4(cor, [
        T({es:'Enlace iónico; el sólido conduce gracias al movimiento de sus iones',
           en:'Ionic bond; the solid conducts thanks to the movement of its ions'}),
        T({es:'Enlace covalente polar; el compuesto no conduce en ningún estado',
           en:'Polar covalent bond; the compound conducts in no state'}),
        T({es:'Enlace metálico; el sólido conduce y además resulta maleable',
           en:'Metallic bond; the solid conducts and turns out to be malleable as well'})
      ]);
      sp = {
        title:{es:'Predicción a partir de dos casillas', en:'A prediction from two cells'},
        q:{es:'Un elemento Q ocupa el periodo '+m.p+' y el grupo '+m.g+'; un elemento Z ocupa el periodo '+x.p+' y el grupo '+x.g+'. Los dos se combinan. Predice el tipo de enlace del compuesto resultante y su comportamiento eléctrico.',
           en:'An element Q occupies period '+m.p+' and group '+m.g+'; an element Z occupies period '+x.p+' and group '+x.g+'. The two combine. Predict the type of bond of the resulting compound and its electrical behaviour.'},
        options:{es:oo, en:oo}, correct:cor,
        hint:{es:'Ubica primero cada casilla para saber si se trata de un metal o de un no metal, estima la separación entre sus electronegatividades y de ahí deduce si las cargas quedan fijas o móviles.',
              en:'First place each cell to know whether it is a metal or a nonmetal, estimate the separation between their electronegativities and from there deduce whether the charges end up fixed or mobile.'},
        exp:{es:'Q corresponde al '+T(m)+', un metal, y Z al '+T(x)+', un no metal; su ΔEN vale '+f1(dd)+', dentro de la zona iónica, y el compuesto es '+fq+'. En la red los iones ocupan posiciones fijas, así que el sólido no conduce; al fundir, los iones ganan movilidad y la muestra sí conduce. La opción metálica exigiría dos metales y la covalente polar exigiría una ΔEN por debajo de 1.7.',
             en:'Q corresponds to '+T(m)+', a metal, and Z to '+T(x)+', a nonmetal; their ΔEN equals '+f1(dd)+', inside the ionic zone, and the compound is '+fq+'. In the network the ions occupy fixed positions, so the solid does not conduct; on melting, the ions gain mobility and the sample does conduct. The metallic option would require two metals and the polar covalent one would require a ΔEN below 1.7.'},
        showWork:false };
    } else {
      var cor2 = T({es:'El '+T(m)+' es un metal y el '+T(x)+' un no metal: la ΔEN de '+f1(dd)+' predice un sólido iónico de fusión alta, no un gas',
                    en:T(m)+' is a metal and '+T(x)+' a nonmetal: their ΔEN of '+f1(dd)+' predicts a high melting ionic solid, not a gas'});
      var oo2 = uniq4(cor2, [
        T({es:'El error está en la conducción: cualquier compuesto entre dos elementos distintos conduce la corriente en estado sólido',
           en:'The error lies in conduction: any compound between two different elements conducts current in the solid state'}),
        T({es:'El error está en la fórmula: los dos elementos se combinan siempre en proporción uno a uno',
           en:'The error lies in the formula: the two elements always combine in a one to one proportion'}),
        T({es:'No hay error, porque ambos elementos pertenecen al mismo periodo y comparten su nivel de valencia',
           en:'There is no error, because both elements belong to the same period and share their valence level'})
      ]);
      sp = {
        title:{es:'Revisar una predicción ajena', en:'Reviewing someone else prediction'},
        q:{es:'Una compañera afirma que el compuesto formado entre el '+T(m)+' y el '+T(x)+' es un gas a temperatura ambiente que no conduce la corriente en ningún estado. Identifica el error de esa predicción.',
           en:'A classmate claims that the compound formed between '+T(m)+' and '+T(x)+' is a gas at room temperature that conducts no current in any state. Identify the error in that prediction.'},
        options:{es:oo2, en:oo2}, correct:cor2,
        hint:{es:'Revisa a qué lado de la tabla pertenece cada elemento y qué tipo de estructura predice esa combinación antes de juzgar el estado de agregación.',
              en:'Check which side of the table each element belongs to and what kind of structure that combination predicts before judging the state of matter.'},
        exp:{es:'El '+T(m)+' está en el grupo '+m.g+' y el '+T(x)+' en el grupo '+x.g+', de modo que ΔEN = '+f1(dd)+' y el compuesto '+fq+' es una red iónica: funde a temperatura elevada y conduce fundido o disuelto. Un gas que no conduce en ningún estado corresponde a una sustancia molecular formada entre no metales, que no es el caso aquí.',
             en:'Element '+T(m)+' sits in group '+m.g+' and '+T(x)+' in group '+x.g+', so ΔEN = '+f1(dd)+' and the compound '+fq+' is an ionic network: it melts at a high temperature and conducts when molten or dissolved. A gas that conducts in no state corresponds to a molecular substance formed between nonmetals, which is not the case here.'},
        showWork:false };
    }
    addProb(sp);
  })();
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
