  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Tabla de rasgos', en:'Trait table' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini" data-r="mini"></div>' +
    '<div style="overflow-x:auto"><table class="ttab" data-r="tab" style="font-size:.74rem;"></table></div>' +
    '<div class="gw-note" data-r="cnt" style="margin:.4rem 0;font-weight:600;"></div>' +
    '<div class="gw-grid3" data-r="cands" style="margin:.3rem 0;"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Proponer mi hipótesis', en:'Propose my hypothesis' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="tab"]'),
      elD = host.querySelector('[data-r="cands"]'),
      elN = host.querySelector('[data-r="cnt"]'),
      elQ = host.querySelector('[data-r="q"]'),
      elM = host.querySelector('[data-r="mini"]'),
      elK = host.querySelector('[data-r="chk"]');

  /* Event delegation on the table for cell clicks */
  elT.addEventListener('click', function(e){
    if (done || revealed) return;
    var td = e.target.closest('td[data-ci][data-ri]');
    if (!td) return;
    var ci = parseInt(td.getAttribute('data-ci'), 10);
    var ri = parseInt(td.getAttribute('data-ri'), 10);
    studentV[ci][ri] = !studentV[ci][ri];
    renderTable();
    renderCount();
  });

  /* Event delegation on candidate buttons */
  elD.addEventListener('click', function(e){
    if (done) return;
    var btn = e.target.closest('[data-k]');
    if (!btn) return;
    /* candidate buttons are now used to confirm hypothesis */
    /* they just highlight; actual proposal via chk button */
  });

  function renderTable(){
    var r = RD[rd];
    var candidateHeaders = r.c.map(function(c, k){
      return '<th style="background:var(--surface2);min-width:70px;">' + L(c.n) + '</th>';
    }).join('');
    var head = '<tr>' +
      '<th style="text-align:left;background:var(--green-bg);color:var(--green-dark);">' + L({ es:'Característica', en:'Characteristic' }) + '</th>' +
      '<th style="background:var(--green-bg);color:var(--green-dark);">' + L(r.focal) + '</th>' +
      candidateHeaders +
      '</tr>';
    var rows = r.tr.map(function(tn, i){
      var focalCell = r.f[i]
        ? '<span class="yes">✓</span>'
        : '<span class="no">·</span>';
      var candCells = r.c.map(function(c, k){
        var stVal = studentV[k][i];
        var ansVal = c.v[i];
        var cellStyle = 'cursor:pointer;min-width:70px;';
        if (revealed){
          /* Show correct answer with student comparison */
          if (ansVal && stVal) cellStyle += 'background:var(--ok-bg);';
          else if (ansVal && !stVal) cellStyle += 'background:var(--bad-bg);'; /* missed a ✓ */
          else if (!ansVal && stVal) cellStyle += 'background:var(--gold-bg);'; /* added wrong ✓ */
          return '<td data-ci="' + k + '" data-ri="' + i + '" style="text-align:center;' + cellStyle + '">' +
            (ansVal ? '<span class="yes">✓</span>' : '<span class="no">·</span>') + '</td>';
        }
        return '<td data-ci="' + k + '" data-ri="' + i + '" style="text-align:center;' + cellStyle + '">' +
          (stVal ? '<span class="yes" style="font-size:1.1rem;">✓</span>' : '<span class="no" style="font-size:1rem;">□</span>') + '</td>';
      }).join('');
      return '<tr><td class="rn">' + L(tn) + '</td><td style="text-align:center;">' + focalCell + '</td>' + candCells + '</tr>';
    }).join('');
    elT.innerHTML = head + rows;
  }

  function renderCount(){
    var r = RD[rd];
    if (revealed) { elN.textContent = ''; return; }
    var parts = r.c.map(function(c, k){
      var n = countShared(r, k, true);
      return L(c.n) + ': ' + n + '/' + r.f.filter(function(x){ return x; }).length;
    });
    elN.textContent = L({ es:'Rasgos en común con ', en:'Traits shared with ' }) + L(r.focal) + ': ' + parts.join('  |  ');
  }

  function renderCands(sel){
    var r = RD[rd];
    elD.innerHTML = r.c.map(function(c, k){
      var sh = countShared(r, k, true);
      return '<button class="gw-tile' + (sel === k ? ' on' : '') + '" data-k="' + k + '"' + (done ? ' disabled' : '') + '>' +
        '<span class="gw-key">' + L(c.n) + '</span>' +
        '<span class="gw-sub">' + L({ es:'Compartes que marcaste: ', en:'Shared traits you marked: ' }) + sh + '</span>' +
        '</button>';
    }).join('');
  }

  function render(selOverride){
    var r = RD[rd];
    elQ.innerHTML = L({
      es:'Ronda ' + (rd + 1) + ' de 3: ¿con cuál candidato está más emparentado el ' + L(r.focal) + '?',
      en:'Round ' + (rd + 1) + ' of 3: which candidate is ' + L(r.focal) + ' most closely related to?'
    });
    elM.innerHTML = L({
      es:'Llena los cuadros (□) de la tabla: marca ✓ en cada rasgo que <em>tú creas</em> que tiene cada candidato. Compara cuántos rasgos comparten con ' + L(r.focal) + ' y luego selecciona tu hipótesis abajo.',
      en:'Fill in the boxes (□) in the table: tick ✓ for each trait you <em>think</em> each candidate has. Compare how many traits they share with ' + L(r.focal) + ', then select your hypothesis below.'
    });
    renderTable();
    renderCount();
    renderCands(selOverride !== undefined ? selOverride : -1);
  }

  var selectedHyp = -1;
  /* candidate tile click → set hypothesis candidate */
  elD.addEventListener('click', function(e){
    if (done) return;
    var btn = e.target.closest('[data-k]');
    if (!btn) return;
    selectedHyp = parseInt(btn.getAttribute('data-k'), 10);
    renderCands(selectedHyp);
    say(host, '', L({
      es:'Hipótesis provisional: el pariente más cercano del ' + L(RD[rd].focal) + ' es ' + L(RD[rd].c[selectedHyp].n) + '. Presiona "Proponer" cuando estés seguro.',
      en:'Provisional hypothesis: the closest relative of ' + L(RD[rd].focal) + ' is ' + L(RD[rd].c[selectedHyp].n) + '. Press "Propose" when you are sure.'
    }));
  });

  function advance(){
    rd++; tries = 0; revealed = false; selectedHyp = -1;
    if (rd >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      elK.disabled = true;
      say(host, 'good', L({
        es:'En los tres casos, comparar los rasgos heredables (nutrición, reproducción, estructura) llevó a un parentesco diferente del que sugería el parecido visual. Una buena hipótesis de parentesco se apoya en esos rasgos, no en la silueta.',
        en:'In all three cases, comparing inherited traits (nutrition, reproduction, structure) led to a different kinship than visual resemblance suggested. A good kinship hypothesis rests on those traits, not on the silhouette.'
      }));
      return;
    }
    initStudentV();
    elK.textContent = L({ es:'Proponer mi hipótesis', en:'Propose my hypothesis' });
    elK.className = 'gw-btn';
    render();
    say(host, '', L({ es:'Nueva tabla. Empieza llenando los cuadros antes de decidir.', en:'New table. Start by filling in the boxes before deciding.' }));
  }

  elK.addEventListener('click', function(){
    if (done) return;
    if (revealed){ advance(); return; }
    var r = RD[rd];
    if (selectedHyp < 0){
      say(host, 'warm', L({ es:'Selecciona primero un candidato tocando uno de los botones de abajo.', en:'First select a candidate by tapping one of the buttons below.' }));
      return;
    }
    if (selectedHyp === r.ok){
      revealed = true;
      renderTable();
      say(host, 'good', L({
        es:'Correcto: ' + L(r.c[selectedHyp].n) + ' comparte con ' + L(r.focal) + ' los rasgos que se heredan. Las celdas verdes muestran los rasgos en común; el fondo rojo indica los que te faltó marcar.',
        en:'Correct: ' + L(r.c[selectedHyp].n) + ' shares with ' + L(r.focal) + ' the inherited traits. Green cells show matching traits; red background shows ones you missed.'
      }));
      setTimeout(advance, 1500);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      selectedHyp = r.ok;
      renderTable();
      renderCands(r.ok);
      elK.textContent = L({ es:'Siguiente', en:'Next' });
      var sh = countShared(r, r.ok, false);
      say(host, 'miss', L({
        es:'El pariente más cercano es ' + L(r.c[r.ok].n) + ' (' + sh + ' rasgos heredables en común). Lo que confundía: ' + L(r.why) + '. Las celdas de la tabla ahora muestran las respuestas correctas.',
        en:'The closest relative is ' + L(r.c[r.ok].n) + ' (' + sh + ' shared inherited traits). What confused things: ' + L(r.why) + '. The table cells now show the correct answers.'
      }));
      return;
    }
    say(host, 'warm', L({
      es:'No es el más cercano. Fíjate en los rasgos de cómo se alimenta y se reproduce. ' + L(r.why) + '. Prueba con otro candidato.',
      en:'That is not the closest. Look at feeding and reproduction traits. ' + L(r.why) + '. Try another candidate.'
    }));
  });

  initStudentV();
  render();
  say(host, '', L({ es:'Toca los cuadros □ en la tabla para marcar los rasgos de cada candidato. Luego selecciona tu hipótesis.', en:'Tap the □ boxes in the table to mark each candidate\'s traits. Then select your hypothesis.' }));
}
