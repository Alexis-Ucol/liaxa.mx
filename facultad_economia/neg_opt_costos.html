    if (es) return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>Comprar afuera o producir adentro</h2>' +
      '<p>La decisión más frecuente de optimización de costos en una empresa mediana no tiene que ver con derivadas sino con una elección entre dos estructuras. Un proveedor cobra una cantidad por pieza y nada más: si la empresa no le compra nada, no le paga nada. Producir esa misma pieza adentro exige comprometer una renta, una máquina y un supervisor, que se pagan aunque la línea esté parada, a cambio de que cada pieza salga más barata. La pregunta no es cuál de las dos opciones es mejor en abstracto, porque ninguna lo es: la pregunta es a partir de qué volumen conviene cada una.</p>' +
      '<p>Conviene ver la estructura de cada alternativa antes que sus números. Comprar es una recta que sale del origen: cero piezas, cero pesos, y de ahí sube al ritmo del precio del proveedor. Producir es una recta que arranca arriba, en el nivel del <strong>costo fijo comprometido</strong>, y sube más despacio porque su pendiente es el costo variable propio. Dos rectas que empiezan en distinto lugar y suben a distinto ritmo se cruzan exactamente una vez, y ese cruce es lo único que hay que encontrar.</p>' +
      '<p>El razonamiento que lleva al cruce se puede decir sin álgebra. Cada pieza producida adentro ahorra la diferencia entre lo que cobra el proveedor y lo que cuesta hacerla, y ese ahorro por pieza es lo único con lo que la empresa puede pagar el costo fijo en el que incurrió. El <strong>volumen de indiferencia</strong> es simplemente cuántas piezas hacen falta para que esos ahorros terminen de cubrirlo. Por debajo de ese volumen el compromiso fijo no alcanza a pagarse y comprar sale más barato; por encima, cada pieza adicional ahorra sin nada que cubrir y producir sale mejor.</p>' +
      '<p>Dos advertencias antes de llevar esta cuenta a una junta, porque son las que separan un análisis útil de uno peligroso. La primera es que el volumen de indiferencia es una frontera, no una recomendación: si la demanda esperada queda muy cerca de esa cifra, la decisión es frágil, y conviene decirlo con esas palabras en lugar de presentar un ganador. La segunda es que las dos opciones no son igual de reversibles. El contrato con el proveedor se cancela con un correo; la renta del local, la maquinaria comprada y la gente contratada siguen costando durante meses después de que la empresa cambie de opinión. Esa asimetría no aparece en ninguna de las dos rectas y sin embargo es decisiva cuando la demanda es incierta.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Comprar</div><div class="rform">C = p·q</div><div class="rnote">Sin compromiso fijo.</div></div>' +
        '<div class="rcard"><div class="rname">Producir</div><div class="rform">C = F + v·q</div><div class="rnote">Compromiso fijo, unidad más barata.</div></div>' +
        '<div class="rcard"><div class="rname">Volumen de indiferencia</div><div class="rform">q = ' + frac('F', 'p − v') + '</div><div class="rnote">El ahorro por pieza cubre lo fijo.</div></div>' +
        '<div class="rcard"><div class="rname">Regla de decisión</div><div class="rform">abajo comprar, arriba producir</div><div class="rnote">Y cerca del cruce, dudar.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una embotelladora de agua en Manzanillo compra sus tapas a un proveedor que cobra ' + money(c2p) + ' por millar. Instalar una tapadora propia costaría ' + money(c2F) + ' al año entre renta del espacio, depreciación y sueldo del operador, y cada millar saldría en ' + money(c2v) + '. El área de compras quiere saber a partir de qué consumo anual conviene el cambio.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Cada millar producido adentro ahorra ' + money(c2gap) + ' frente al proveedor. Ese ahorro es lo único disponible para pagar el compromiso fijo de ' + money(c2F) + '.<br>' +
      '<strong>Paso 2.</strong> Los ahorros terminan de cubrir ese compromiso en ' + intN(c2mult) + ' millares al año, que es el volumen de indiferencia. Ahí las dos alternativas cuestan lo mismo, ' + money(buyCost(c2p, c2mult)) + '.<br>' +

    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Buy outside or make inside</h2>' +
      '<p>The most common cost optimisation decision in a medium sized company has nothing to do with derivatives and everything to do with a choice between two structures. A supplier charges an amount per piece and nothing else: if the company buys nothing, it pays nothing. Making that same piece in house means committing to a rent, a machine and a supervisor, all paid even when the line is idle, in exchange for each piece coming out cheaper. The question is not which of the two is better in the abstract, because neither is: the question is from what volume onwards each one wins.</p>' +
      '<p>It helps to look at the structure of each alternative before its numbers. Buying is a straight line out of the origin: zero pieces, zero pesos, and from there it climbs at the pace of the supplier price. Making is a line that starts high, at the level of the <strong>committed fixed cost</strong>, and climbs more slowly because its slope is the own variable cost. Two lines that begin in different places and climb at different speeds cross exactly once, and that crossing is the only thing to find.</p>' +
      '<p>The reasoning that leads to the crossing can be stated without algebra. Every piece made in house saves the difference between what the supplier charges and what it costs to make, and that saving per piece is the only thing the company has with which to pay the fixed cost it took on. The <strong>indifference volume</strong> is simply how many pieces are needed for those savings to finish covering it. Below that volume the fixed commitment does not get paid for and buying is cheaper; above it, every extra piece saves with nothing left to cover and making wins.</p>' +

      '<div class="stag">Concepto 3</div>' +
      '<h2>Pedir seguido o pedir mucho</h2>' +
      '<p>El almacén de cualquier empresa que compra para revender o para producir plantea el mismo problema de optimización, y es el ejemplo más limpio del tema porque las dos fuerzas que se oponen se pueden tocar. Comprar en lotes grandes significa hacer pocos pedidos al año, y cada pedido cuesta trabajo administrativo: levantar la orden, dar seguimiento, recibir, revisar la factura. Comprar en lotes chicos significa tener poco inventario parado, y el inventario cuesta bodega, seguro, merma y sobre todo dinero inmovilizado. Cada estrategia ahorra en un lado exactamente lo que gasta en el otro.</p>' +
      '<p>Antes de la aritmética conviene definir bien las dos cifras, porque son las que se estiman mal en la práctica. El <strong>costo de pedir</strong> no es el precio de la mercancía: es lo que le cuesta a la empresa procesar una orden, y su rasgo importante es que no cambia porque el pedido sea grande o chico. El <strong>costo de guardar</strong> tampoco es solo la renta de la bodega. Incluye el seguro, la obsolescencia, la merma y, casi siempre en primer lugar, el rendimiento que la empresa deja de ganar por tener su dinero convertido en mercancía. Ese último componente es el que suele omitirse y es el que más pesa.</p>' +
      '<p>Con esas dos definiciones el problema se arma solo. Si la empresa consume una cantidad conocida al año y pide en lotes de cierto tamaño, el número de pedidos es la demanda entre el lote, y el inventario promedio es la mitad del lote, porque el almacén se llena al recibir y se vacía hasta el siguiente pedido. Lo primero hace que el costo de pedir baje cuando el lote crece; lo segundo hace que el costo de guardar suba cuando el lote crece. La suma de los dos, que es lo único que la empresa paga de verdad, tiene forma de tazón, y el fondo de ese tazón es el <strong>lote económico</strong>.</p>' +
      '<p>En ese fondo ocurre algo que conviene memorizar porque sirve para verificar cualquier resultado en segundos: el costo anual de pedir y el costo anual de guardar son iguales. Si al revisar una propuesta de compras las dos cifras salen muy desparejas, el lote no está optimizado, y el lado que salió más grande indica hacia dónde hay que moverlo. Es una comprobación que no requiere recordar ninguna fórmula y que en una junta vale más que la fórmula misma.</p>' +

        '<div class="rcard"><div class="rname">Verificación rápida</div><div class="rform">pedir = guardar</div><div class="rnote">Si no coinciden, no es el óptimo.</div></div>' +

    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>Order often or order a lot</h2>' +
      '<p>The warehouse of any company that buys to resell or to produce raises the same optimisation problem, and it is the cleanest example in the topic because the two opposing forces can be touched. Buying in large lots means placing few orders a year, and every order costs administrative work: raising the order, chasing it, receiving it, checking the invoice. Buying in small lots means little stock standing idle, and stock costs warehouse space, insurance, spoilage and above all money locked up. Each strategy saves on one side exactly what it spends on the other.</p>' +
      '<p>Before the arithmetic it is worth defining the two figures properly, because these are the ones badly estimated in practice. The <strong>cost of ordering</strong> is not the price of the goods: it is what processing one order costs the company, and its important feature is that it does not change with the size of the order. The <strong>cost of holding</strong> is not just the warehouse rent either. It takes in insurance, obsolescence, spoilage and, almost always first among them, the return the company gives up by having its money turned into goods. That last component is the one usually left out and the one that weighs most.</p>' +
      '<p>With those two definitions the problem assembles itself. If the company uses a known amount a year and orders in lots of a given size, the number of orders is demand divided by the lot, and average stock is half the lot, because the warehouse fills on delivery and empties by the next order. The first makes the cost of ordering fall as the lot grows; the second makes the cost of holding rise as the lot grows. The sum of the two, which is the only thing the company actually pays, is shaped like a bowl, and the bottom of that bowl is the <strong>economic lot</strong>.</p>' +
      '<p>Something happens at that bottom which is worth memorising, because it checks any result in seconds: the annual cost of ordering and the annual cost of holding are equal. If, on reviewing a purchasing proposal, those two figures come out very uneven, the lot is not optimised, and whichever side came out larger points to the direction it should move. It is a check that requires no formula and that in a meeting is worth more than the formula itself.</p>' +

        '<div class="rcard"><div class="rname">Quick check</div><div class="rform">ordering = holding</div><div class="rnote">If they differ, it is not the optimum.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A wholesale hardware business in Colima sells ' + unitsEn(c3s.D) + ' of one pump model a year. Each order to the manufacturer costs it ' + money(c3s.S) + ' in purchasing time, receiving and invoice checking, whatever the size. Keeping one pump in the warehouse for a year costs it ' + money(c3s.H) + ' in space, insurance and locked up capital. Purchasing asks how much to order at a time.</p>' +

      '<h2>Qué tan caro sale equivocarse, y qué mueve de verdad la respuesta</h2>' +
      '<p>Los dos conceptos anteriores entregan un número exacto, y esa exactitud invita a un error de criterio: creer que el valor del análisis está en el número. En la práctica ninguna de las cifras que alimentan estas cuentas se conoce con precisión. El costo de procesar un pedido es una estimación, el costo de guardar depende de un rendimiento exigido que cambia, y la demanda del año que viene es un pronóstico. Por eso la pregunta que sigue no es cuál es el óptimo, sino cuánto cuesta no estar exactamente en él.</p>' +
      '<p>La respuesta es tranquilizadora y tiene consecuencias prácticas inmediatas. Alrededor del punto óptimo, la curva de costo total es notablemente <strong>plana</strong>. Pedir el doble del lote económico no duplica el costo de pedidos y bodega: lo aumenta apenas una cuarta parte. Pedir la mitad tiene exactamente el mismo efecto. Un error del veinte por ciento en el lote encarece la operación en menos del dos por ciento. Esto significa que discutir el tercer decimal de una estimación es tiempo perdido, y que redondear el resultado al empaque del proveedor, al camión completo o a un número cómodo de manejar es una decisión sensata y no una concesión.</p>' +
      '<p>El otro punto que conviene fijar es cuáles datos mueven la respuesta y cuáles no. El precio de compra de la mercancía es, con diferencia, la cifra más grande de todo el presupuesto de abastecimiento, y sin embargo <strong>no cambia el lote óptimo</strong>: si el precio es el mismo cualquiera que sea el tamaño del pedido, la empresa pagará esa cantidad completa a lo largo del año pida como pida, así que esa parte del costo no participa en la comparación. Lo que sí mueve el lote es la demanda, el costo de pedir y el costo de guardar, y ninguno de los tres en proporción directa: por estar bajo una raíz, cuadruplicar la demanda solo duplica el lote.</p>' +

function applyUIStrings() {

  set('htitle-el',    SCHOOL.guideTitle[LANG]);

  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));

  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.questionText;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/μ/g,'mu').replace(/σ/g,'sigma').replace(/α/g,'alpha').replace(/β/g,'beta')
      .replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/·/g,'*')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save(SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
