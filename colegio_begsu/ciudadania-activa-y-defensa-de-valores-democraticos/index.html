  addProblem(pick([
    { title:{ es:'Tres reacciones ante el mismo problema', en:'Three reactions to the same problem' }, showWork:false,
      stmt:{ es:'El patio de una secundaria se inunda. Alguien publica una foto quejándose; otra persona lleva su cubeta y saca agua cada mañana; un grupo levanta el registro de los días perdidos, lo presenta al consejo escolar y acuerda con la dirección una fecha de reparación con responsable. ¿Cuál corresponde a la ciudadanía activa?',
             en:'The yard of a secondary school floods. Somebody posts a photo complaining; another person brings a bucket and bails water every morning; a group compiles a record of the days lost, presents it to the school council and agrees with the head office on a repair date with a named responsible. Which one amounts to active citizenship?' },
      options:{ es:[
        'La tercera, porque convierte el problema en un asunto público con acuerdo, responsable y plazo que se puede exigir después.',
        'La segunda, porque es la única que resuelve el problema de inmediato sin depender de que alguien más se sume.',
        'La primera, porque hacer visible el problema ante muchas personas es lo que termina obligando a la autoridad.',
        'Las tres por igual, porque cualquier reacción ante un problema del plantel cuenta como participación ciudadana.' ],
        en:[
        'The third, because it turns the problem into a public matter with an agreement, a responsible party and a deadline that can be demanded later.',
        'The second, because it is the only one that solves the problem at once without depending on anybody else joining in.',
        'The first, because making the problem visible to many people is what ends up forcing the authority to act.',
        'All three equally, because any reaction to a problem in the school counts as citizen participation.' ] },
      correct:0,
      hint:{ es:'Pregúntate cuál de las tres deja algo que se pueda reclamar la semana siguiente, y ante quién.',
             en:'Ask which of the three leaves something that can be claimed the following week, and before whom.' },
      explanation:{ es:'La foto informa y la cubeta alivia, y ninguna de las dos está de más. Lo que les falta es obligación: al día siguiente todo depende otra vez de la buena voluntad de alguien. La tercera lleva el problema al órgano que puede resolverlo y lo deja fijado con responsable y plazo, de modo que puede reclamarse si no se cumple.',
                    en:'The photo informs and the bucket relieves, and neither is worthless. What they lack is obligation: the next day everything depends again on somebody being willing. The third takes the problem to the body that can resolve it and pins it down with a responsible party and a deadline, so it can be claimed if it goes unmet.' } },
    { title:{ es:'Tres reacciones ante el mismo problema', en:'Three reactions to the same problem' }, showWork:false,
      stmt:{ es:'Una plaza amanece llena de basura porque no hay contenedores. Una tienda dona bolsas cada semana; alguien publica fotos de la plaza sucia; un comité levanta el diagnóstico, lo lleva al municipio, acuerda la instalación de contenedores y define quién revisa su mantenimiento. ¿Cuál corresponde a la ciudadanía activa?',
             en:'A square wakes up full of rubbish because there are no bins. A shop donates bags every week; somebody posts photos of the dirty square; a committee builds the diagnosis, takes it to the town hall, agrees on installing bins and defines who checks their upkeep. Which one amounts to active citizenship?' },
      options:{ es:[
        'La del comité, porque deja un acuerdo con la autoridad y alguien encargado de verificar que se sostenga.',
        'La donación de bolsas, porque atiende la necesidad cada semana sin tener que esperar ninguna respuesta oficial.',
        'La publicación de fotos, porque la presión pública es el único recurso con que cuenta quien no ocupa un cargo.',
        'Las tres por igual, porque las tres nacen de la preocupación por un espacio que la colonia comparte.' ],
        en:[
        'The committee one, because it leaves an agreement with the authority and somebody in charge of verifying that it holds.',
        'The bag donation, because it meets the need every week without having to wait for any official answer.',
        'The photo posting, because public pressure is the only resource available to whoever holds no office.',
        'All three equally, because all three come from concern for a space the neighborhood shares.' ] },
      correct:0,
      hint:{ es:'Compara qué queda en la plaza si mañana se retiran la tienda, la persona que publica y el comité.',
             en:'Compare what is left in the square if tomorrow the shop, the person posting and the committee all withdraw.' },
      explanation:{ es:'Las bolsas alivian mientras alguien las siga donando y las fotos informan mientras alguien las siga publicando: las dos dependen de una voluntad que puede terminarse. El comité deja instalada una obligación de la autoridad y una persona que verifica, de modo que el resultado no se apoya en la constancia de nadie en particular.',
                    en:'The bags relieve as long as somebody keeps donating them and the photos inform as long as somebody keeps posting them: both depend on a willingness that can end. The committee leaves in place an obligation of the authority and a person who verifies, so the outcome does not rest on the persistence of any one individual.' } }
  ], rng), rng);

  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Cómo decide un grupo sin aplastar a nadie','How a group decides without steamrolling anyone') + '</h2>' +
    '<p>' + S('Una decisión colectiva no se vuelve democrática por el solo hecho de votarse. La votación reparte una decisión, pero lo que la sostiene ocurre antes y después: quién alcanzó a enterarse, quién pudo objetar, si esas objeciones recibieron respuesta, y si el acuerdo quedó escrito de forma que alguien pueda reclamarlo dentro de un mes.',
              'A collective decision does not become democratic merely by being voted on. The vote distributes a decision, but what holds it up happens before and after: who managed to find out, who was able to object, whether those objections were answered, and whether the agreement was written down so that somebody can claim it a month later.') + '</p>' +
    '<p>' + S('Cuatro valores hacen ese trabajo. La pluralidad reconoce que hay intereses distintos y no los trata como estorbo. La deliberación obliga a dar razones y a responder las contrarias, no solo a contar manos levantadas. La legalidad fija las reglas antes de empezar, para que no se cambien a media decisión. La rendición de cuentas mantiene obligada a mostrar resultados a la persona que recibió un encargo. Defenderlos no es pronunciar un discurso: es exigir la convocatoria a tiempo, el turno de palabra y el acta.',
              'Four values do that work. Plurality acknowledges that interests differ and does not treat them as a nuisance. Deliberation forces people to give reasons and to answer the opposing ones, not merely to count raised hands. Legality fixes the rules before starting, so they are not changed halfway through. Accountability keeps whoever received a mandate obliged to show results. Defending them is not delivering a speech: it is demanding the call on time, the speaking turn and the minutes.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('una mayoría obliga a la minoría solo si la minoría pudo hablar antes de que se contaran los votos.',
        'a majority binds the minority only if the minority was able to speak before the votes were counted.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Pluralidad','Plurality') + '</div><div class="rform">' + S('caben los distintos','the different ones fit') + '</div><div class="rnote">' + S('El desacuerdo es parte del proceso, no una falla.','Disagreement is part of the process, not a fault.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Deliberación','Deliberation') + '</div><div class="rform">' + S('razones antes que votos','reasons before votes') + '</div><div class="rnote">' + S('Cada objeción recibe una respuesta.','Every objection gets an answer.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Legalidad','Legality') + '</div><div class="rform">' + S('reglas fijadas antes','rules set beforehand') + '</div><div class="rnote">' + S('No se cambian a mitad de la decisión.','They are not changed halfway through.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Rendición de cuentas','Accountability') + '</div><div class="rform">' + S('mostrar qué se hizo','showing what was done') + '</div><div class="rnote">' + S('Quien recibe un encargo responde por él.','Whoever takes a mandate answers for it.') + '</div></div>' +
    '</div>' +
    buildAsamblea(rng));
  asmRender();

  addProblem(pick([
    { title:{ es:'Ganó la votación y nadie quedó conforme', en:'The vote was won and nobody was satisfied' }, showWork:false,
      stmt:{ es:'En la asamblea del grupo se decide el destino del dinero reunido. La mesa presenta una opción, se vota en dos minutos y gana por un voto. Quienes se oponían no alcanzaron a exponer sus razones y se retiran molestos. Más allá de la votación, ¿qué le faltó a esa decisión?',
             en:'In the class assembly the use of the money raised is decided. The panel presents one option, a vote is taken in two minutes and it wins by a single vote. Those against never got to state their reasons and leave annoyed. Beyond the vote itself, what did that decision lack?' },
      options:{ es:[
        'Deliberación: la mayoría reparte la decisión, pero solo obliga cuando las razones contrarias se escucharon y se respondieron.',
        'Una mayoría más amplia: una decisión ganada por un solo voto no puede considerarse válida en ningún caso.',
        'Que la mesa se abstuviera de proponer, porque quien organiza la asamblea no debería influir en el resultado.',
        'Nada: hubo votación y una opción obtuvo más votos, así que la decisión ya cumple con lo que la democracia exige.' ],
        en:[
        'Deliberation: a majority distributes the decision, but it only binds when the opposing reasons were heard and answered.',
        'A wider majority: a decision won by a single vote cannot be considered valid under any circumstances.',
        'That the panel refrain from proposing, because whoever organizes the assembly should not influence the outcome.',
        'Nothing: there was a vote and one option got more votes, so the decision already meets what democracy demands.' ] },
      correct:0,
      hint:{ es:'Piensa en qué hace que quienes perdieron la votación acepten cumplir el acuerdo de todos modos.',
             en:'Think about what makes those who lost the vote accept the agreement anyway.' },
      explanation:{ es:'Votar reparte una decisión, pero no la legitima por sí solo. Lo que sostiene el acuerdo es que las objeciones se hayan dicho y respondido antes de contar: entonces quien pierde sigue obligado, porque estuvo dentro del proceso. Un voto de diferencia es perfectamente válido; lo que no lo es, es votar sin haber deliberado.',
                    en:'Voting distributes a decision but does not legitimize it on its own. What holds the agreement up is that the objections were stated and answered before the count: then whoever loses is still bound, because they were inside the process. A one vote margin is perfectly valid; what is not valid is voting without having deliberated.' } },
    { title:{ es:'La consulta que casi nadie alcanzó', en:'The consultation almost nobody reached' }, showWork:false,
      stmt:{ es:'Una consulta vecinal se anuncia el mismo día, en un solo idioma, en horario de trabajo y en el salón del propio comité. Vota el seis por ciento de la colonia y el resultado se presenta como la voluntad del vecindario. ¿Cuál es el problema de fondo?',
             en:'A neighborhood consultation is announced the same day, in one language only, during working hours and in the hall of the committee itself. Six percent of the neighborhood votes and the result is presented as the will of the residents. What is the underlying problem?' },
      options:{ es:[
        'Las condiciones de la convocatoria excluyeron de antemano a la mayoría, así que el resultado no puede presentarse como voluntad del conjunto.',
        'El problema es el porcentaje: ninguna consulta puede tomarse en serio si no participa más de la mitad del padrón.',
        'El problema es haber consultado, porque estos asuntos corresponden a la autoridad y no al vecindario.',
        'No hay problema de fondo: quienes no asistieron renunciaron a opinar y aceptaron por adelantado el resultado.' ],
        en:[
        'The conditions of the call excluded the majority in advance, so the result cannot be presented as the will of the whole.',
        'The problem is the percentage: no consultation can be taken seriously unless more than half the register takes part.',
        'The problem is that it was consulted at all, because these matters belong to the authority and not to the residents.',
        'There is no underlying problem: those who did not attend gave up their say and accepted the result in advance.' ] },
      correct:0,
      hint:{ es:'Revisa quién podía llegar a esa consulta y quién quedó fuera antes de que empezara.',
             en:'Check who could get to that consultation and who was left out before it even started.' },
      explanation:{ es:'Aviso el mismo día, un solo idioma, horario laboral y sede del propio comité: cada condición filtra a un grupo distinto de personas. Cuando la convocatoria decide de antemano quién puede participar, el resultado mide la asistencia posible y no la voluntad de la colonia. El seis por ciento es la consecuencia visible, no la causa.',
                    en:'Same day notice, a single language, working hours and the committee own hall: each condition filters out a different group of people. When the call itself decides in advance who may take part, the result measures possible attendance, not the will of the neighborhood. The six percent is the visible consequence, not the cause.' } }
  ], rng), rng);

  /* PROBLEMA 4 */
  addProblem(pick([
    { title:{ es:'Preguntar por los recibos', en:'Asking for the receipts' }, showWork:false,
      stmt:{ es:'Un comité de familias recaudó dinero para la biblioteca y a los seis meses informa que se gastó en lo que hacía falta y que todo está en orden. Cuando alguien pide ver los comprobantes, se le responde que dudar del comité divide al grupo. ¿Qué principio se está incumpliendo y cómo se repara?',
             en:'A family committee raised money for the library and after six months reports that it went on what was needed and that everything is in order. When somebody asks to see the receipts, the answer is that doubting the committee divides the group. Which principle is being breached and how is it repaired?' },
      options:{ es:[
        'La rendición de cuentas: quien administra recursos ajenos debe presentar comprobantes verificables ante la asamblea que lo eligió.',
        'La pluralidad: el comité tendría que incluir a más familias en su composición para que su informe resulte aceptable.',
        'La legalidad: el comité no puede recaudar dinero, así que el asunto se resuelve devolviendo lo que se juntó.',
        'Ninguno: si la asamblea eligió al comité, su informe basta y revisarlo excedería las facultades de quien pregunta.' ],
        en:[
        'Accountability: whoever administers other people resources must present verifiable receipts before the assembly that elected them.',
        'Plurality: the committee would have to include more families in its makeup for its report to be acceptable.',
        'Legality: the committee may not raise money at all, so the matter is settled by returning what was collected.',
        'None: if the assembly elected the committee, its report is enough and reviewing it would exceed the powers of whoever asks.' ] },
      correct:0,
      hint:{ es:'Distingue entre confiar en una persona y poder comprobar qué hizo con recursos que no eran suyos.',
             en:'Distinguish between trusting a person and being able to verify what they did with resources that were not theirs.' },
      explanation:{ es:'Quien recibe un encargo colectivo queda obligado a mostrar qué hizo con él, y esa obligación no nace de la sospecha sino del encargo mismo. Convertir la pregunta en un problema de lealtad invierte la relación y trata el dinero de todos como asunto privado. La reparación es concreta: informe con comprobantes ante la misma asamblea.',
                    en:'Whoever receives a collective mandate is obliged to show what they did with it, and that obligation comes from the mandate itself, not from suspicion. Turning the question into a matter of loyalty inverts the relationship and treats shared money as a private affair. The repair is concrete: a report with receipts before that same assembly.' } },
    { title:{ es:'El saldo que se reinvirtió', en:'The balance that got reinvested' }, showWork:false,
      stmt:{ es:'Tres personas del grupo organizaron la feria escolar, decidieron todo entre ellas y no levantaron acta. Al final anuncian que el saldo se reinvirtió. Un compañero pide las cifras y le contestan que ya pasó demasiado tiempo. ¿Qué exige la cultura democrática en este punto?',
             en:'Three people from the class organized the school fair, decided everything among themselves and kept no minutes. At the end they announce that the balance was reinvested. A classmate asks for the figures and is told that too much time has gone by. What does democratic culture require at this point?' },
      options:{ es:[
        'Que presenten las cifras y los comprobantes ante el grupo, porque el paso del tiempo no cancela la obligación de responder por un encargo.',
        'Que el grupo elija un comité nuevo, ya que sustituir a quienes organizaron es la única forma de corregir lo ocurrido.',
        'Que se acepte el informe verbal, porque las tres personas trabajaron sin cobrar y exigirles cuentas sería injusto.',
        'Que se repita la feria con más participantes, de modo que la próxima recaudación compense lo que no se aclaró.' ],
        en:[
        'That they present the figures and the receipts before the class, because the passing of time does not cancel the duty to answer for a mandate.',
        'That the class elect a new committee, since replacing the organizers is the only way to correct what happened.',
        'That the spoken report be accepted, because the three worked unpaid and demanding accounts from them would be unfair.',
        'That the fair be repeated with more participants, so the next collection makes up for what was never clarified.' ] },
      correct:0,
      hint:{ es:'Pregúntate si la obligación de informar nació del acta o del hecho de haber manejado dinero del grupo.',
             en:'Ask whether the duty to report came from the minutes or from having handled money belonging to the group.' },
      explanation:{ es:'La obligación de rendir cuentas nace de haber administrado algo ajeno, no de que exista un acta ni de que alguien reclame a tiempo. Trabajar sin cobrar merece reconocimiento y no sustituye al informe. Cambiar de comité o recaudar de nuevo tampoco aclara lo anterior: solo las cifras con comprobantes cierran el encargo.',
                    en:'The duty to account arises from having administered something that belonged to others, not from minutes existing or from somebody complaining in time. Working unpaid deserves recognition and does not replace the report. Changing the committee or raising money again clarifies nothing either: only figures with receipts close the mandate.' } }
  ], rng), rng);

  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Un proyecto que sigue en pie cuando baja el entusiasmo','A project still standing when the enthusiasm drops') + '</h2>' +
    '<p>' + S('Colaborar y ser solidario no equivale a ayudar una vez. Un proyecto con la comunidad responde a una necesidad colectiva y se juzga por lo que queda funcionando meses después, no por el día de la jornada. Por eso tiene una ruta: sin diagnóstico no hay qué acordar; sin acuerdo en asamblea nadie está autorizado a gestionar en nombre del grupo; sin plan con responsables la tarea recae en quien se acuerde de hacerla; sin gestión escrita la autoridad no queda obligada; y sin evaluación pública el proyecto no le rinde cuentas a nadie.',
              'Collaborating and being in solidarity is not the same as helping once. A project with the community answers a collective need and is judged by what is still working months later, not by the day of the event. That is why it has a route: with no diagnosis there is nothing to agree; with no assembly agreement nobody is authorized to file anything in the name of the group; with no plan naming responsibilities the task falls to whoever remembers it; with no written request the authority is not bound; and with no public evaluation the project accounts to nobody.') + '</p>' +
    '<p>' + S('Sustentable quiere decir que el resultado se sostiene con lo que la comunidad ya tiene: alguien que le da mantenimiento, un acuerdo que dice quién lo hará y una fecha en que se revisa. En esa clave, la solidaridad no consiste en resolverle el problema a otras personas, sino en aumentar su capacidad de resolverlo, incluso cuando quien apoyó se retire.',
              'Sustainable means the outcome holds up with what the community already has: somebody who maintains it, an agreement naming who will do it and a date when it gets reviewed. In that light, solidarity does not consist of solving the problem for other people, but of increasing their capacity to solve it, even once whoever helped has withdrawn.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('un proyecto termina cuando queda escrito quién lo sostiene y cuándo se revisa, no cuando se corta el listón.',
        'a project ends when it is written down who sustains it and when it gets reviewed, not when the ribbon is cut.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Diagnóstico','Diagnosis') + '</div><div class="rform">' + S('qué pasa y a quiénes','what happens and to whom') + '</div><div class="rnote">' + S('Datos y fechas que sostienen el reclamo.','Data and dates that hold the claim up.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Acuerdo','Agreement') + '</div><div class="rform">' + S('mandato de la asamblea','mandate from the assembly') + '</div><div class="rnote">' + S('Autoriza a gestionar en nombre del grupo.','It authorizes filing in the name of the group.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Plan','Plan') + '</div><div class="rform">' + S('quién, qué y cuándo','who, what and when') + '</div><div class="rnote">' + S('La tarea deja de depender de la memoria.','The task stops depending on memory.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Evaluación','Evaluation') + '</div><div class="rform">' + S('revisión pública','public review') + '</div><div class="rnote">' + S('Se comprueba en asamblea si se cumplió.','The assembly checks whether it was fulfilled.') + '</div></div>' +
    '</div>' +
    buildRuta(rng));
  rutRender();

  addProblem(pick([

      stmt:{ es:'Un grupo quiere reforestar el camellón de su calle. Alguien propone comprar los árboles el viernes y plantarlos el sábado para no perder tiempo en trámites. ¿Qué debe ocurrir antes y por qué?',

      options:{ es:[
        'Un diagnóstico del sitio y un acuerdo con quien lo administra y con quien regará después, porque de otro modo el árbol se planta y se pierde.',
        'Una campaña en redes que reúna al mayor número posible de personas, porque la asistencia del día define el éxito del proyecto.',
        'La compra de más árboles de los necesarios, porque conviene prever pérdidas antes de conocer las condiciones del camellón.',

        en:[

        'A social media campaign gathering as many people as possible, because turnout on the day defines the success of the project.',

      explanation:{ es:'Un proyecto comunitario no se mide por el día de la jornada sino por lo que queda vivo después. Saber qué especie resiste ahí, quién administra el camellón y quién riega convierte una jornada en un resultado que se sostiene; sin eso se repite el ciclo de plantar y perder, que gasta trabajo y desanima al grupo.',

    { title:{ es:'Antes de comprar los botes', en:'Before buying the bins' }, showWork:false,
      stmt:{ es:'Un grupo quiere instalar botes para separar residuos en el plantel y propone comprarlos el viernes con lo que se junte en la semana. ¿Qué debe ocurrir antes y por qué?',
             en:'A group wants to install waste separation bins at school and proposes buying them on Friday with whatever is collected during the week. What has to happen first and why?' },
      options:{ es:[
        'Registrar qué residuos genera el plantel y acordar con la dirección quién recoge y a dónde va cada fracción, porque si todo termina en el mismo camión la separación se deshace.',
        'Elegir el color y el diseño de los botes, porque la señalización es lo que determina si el estudiantado los usa o los ignora.',
        'Comprar el mayor número posible de botes, porque conviene cubrir todos los pasillos antes de conocer qué residuos predominan.',
        'Nada más: instalar cuanto antes es lo correcto, porque el hábito de separar se aprende únicamente con los botes ya puestos.' ],
        en:[
        'Recording what waste the school generates and agreeing with the head office who collects each fraction and where it goes, because if it all ends in the same truck the separation comes undone.',
        'Choosing the color and design of the bins, because signage is what determines whether students use them or ignore them.',
        'Buying as many bins as possible, because it is wise to cover every corridor before knowing which waste predominates.',
        'Nothing else: installing as soon as possible is right, because the habit of separating is learned only once the bins are in place.' ] },
      correct:0,
      hint:{ es:'Sigue el recorrido de una botella desde el bote hasta su destino final y busca dónde se rompe la cadena.',
             en:'Follow a bottle from the bin to its final destination and find where the chain breaks.' },
      explanation:{ es:'Separar solo sirve si lo separado sigue separado después. Saber qué residuos predominan decide cuántos botes y de qué tipo, y el acuerdo con quien recoge decide si el esfuerzo llega a algún lado. Sin esas dos cosas los botes quedan como mobiliario y el grupo concluye, con razón, que separar no sirve de nada.',
                    en:'Separating only works if what was separated stays separated afterwards. Knowing which waste predominates decides how many bins and of what kind, and the agreement with whoever collects decides whether the effort reaches anywhere. Without those two things the bins become furniture and the group concludes, reasonably, that separating is pointless.' } }
  ], rng), rng);

  addProblem(pick([
    { title:{ es:'La autoridad no responde', en:'The authority does not answer' }, showWork:true,
      stmt:{ es:'El comité vecinal ya tiene el diagnóstico, el acta con el acuerdo y el plan con responsables y fechas. Envió dos oficios a la autoridad municipal y no ha recibido respuesta. ¿Cuál es el siguiente paso que mantiene el proyecto exigible?',
             en:'The neighborhood committee already has the diagnosis, the minutes with the agreement and the plan with responsibilities and dates. It sent two written requests to the town authority and has received no answer. Which next step keeps the project enforceable?' },
      options:{ es:[
        'Presentar el caso por escrito ante el órgano de control con los acuses de los dos oficios, y llevar esa constancia a la siguiente asamblea.',
        'Suspender el proyecto hasta que la autoridad decida responder, porque insistir podría interpretarse como una presión indebida.',
        'Ejecutar la obra con recursos del propio comité, ya que la necesidad existe y la autoridad no ha querido atenderla.',
        'Publicar el reclamo en redes sociales y esperar a que la difusión obligue a la autoridad a comunicarse con el comité.' ],
        en:[
        'Filing the case in writing with the oversight body, attaching the acknowledgments of both requests, and taking that record to the next assembly.',
        'Suspending the project until the authority chooses to answer, because insisting could be read as improper pressure.',
        'Carrying out the works with the committee own resources, since the need exists and the authority has been unwilling to attend to it.',
        'Posting the complaint on social media and waiting for the exposure to force the authority to contact the committee.' ] },
      correct:0,
      hint:{ es:'Busca el paso que agrega una obligación nueva sin perder nada de lo ya construido.',
             en:'Look for the step that adds a new obligation without losing anything already built.' },
      explanation:{ es:'El silencio de una autoridad también deja rastro cuando existen los acuses. Llevarlos ante el órgano que puede revisarla convierte la falta de respuesta en un expediente con obligación de resolver, y regresar a la asamblea mantiene la decisión en manos del colectivo. Difundir suma presión pero no obliga a nadie, y ejecutar por cuenta propia libera a la autoridad de una responsabilidad que era suya.',
                    en:'The silence of an authority also leaves a trace when the acknowledgments exist. Taking them to the body that can review it turns the lack of an answer into a file with a duty to resolve, and returning to the assembly keeps the decision in the hands of the collective. Publicizing adds pressure but binds nobody, and doing the works yourselves releases the authority from a responsibility that was its own.' } },
    { title:{ es:'La dirección no contesta', en:'The head office does not reply' }, showWork:true,
      stmt:{ es:'La sociedad de alumnos tiene el registro de las fallas de la escalera, el acta de la asamblea y el plan con responsables. Entregó dos solicitudes a la dirección y lleva un mes sin respuesta. ¿Cuál es el siguiente paso que mantiene el proyecto exigible?',
             en:'The student council has the record of the stairway faults, the assembly minutes and the plan with responsibilities. It handed in two requests to the head office and has gone a month with no reply. Which next step keeps the project enforceable?' },
      options:{ es:[
        'Llevar el expediente con los acuses al consejo escolar y a la autoridad educativa de la zona, e informar el resultado a la asamblea.',
        'Reunir firmas para pedir la salida de quien dirige el plantel, ya que el silencio demuestra que no está cumpliendo su función.',
        'Reparar la escalera con lo que el estudiantado logre reunir, porque el riesgo es inmediato y la espera lo prolonga.',
        'Dejar el asunto para el siguiente ciclo escolar, cuando la dirección tenga menos carga de trabajo y pueda atenderlo con calma.' ],
        en:[
        'Taking the file with the acknowledgments to the school council and the district education authority, and reporting the outcome to the assembly.',
        'Collecting signatures to demand the removal of the head of the school, since the silence proves they are not doing their job.',
        'Repairing the stairway with whatever the students manage to raise, because the risk is immediate and waiting prolongs it.',
        'Leaving the matter for the next school year, when the head office has a lighter workload and can attend to it calmly.' ] },
      correct:0,
      hint:{ es:'Piensa qué instancia está por encima del silencio y qué documento la obliga a mirar el caso.',
             en:'Think about which body sits above the silence and which document forces it to look at the case.' },
      explanation:{ es:'El expediente ya existe: registro, acta y acuses. Presentarlo ante el consejo y la autoridad de la zona introduce a quien sí puede requerir una respuesta, y devolver el resultado a la asamblea impide que el asunto se vuelva personal. Reparar por cuenta propia traslada al estudiantado un riesgo y un costo ajenos, y posponerlo deja intacto el peligro.',
                    en:'The file already exists: record, minutes and acknowledgments. Presenting it to the council and the district authority brings in whoever can actually demand an answer, and reporting the outcome back to the assembly keeps the matter from turning personal. Repairing it yourselves shifts a risk and a cost that belong elsewhere onto the students, and postponing leaves the danger untouched.' } }
  ], rng), rng);

  /* CONCEPTO 4 */
  addSection(S('CONCEPTO 4','CONCEPT 4'),
    '<h2>' + S('Lo que desgasta la vida democrática, y cómo se responde','What wears democratic life down, and how to answer it') + '</h2>' +
    '<p>' + S('La cultura democrática rara vez se pierde de golpe. Se desgasta con prácticas que parecen menores: condicionar un apoyo al voto o a la asistencia, decidir en corto y avisar después, negar información que es pública, convocar de modo que casi nadie alcance a llegar, impedir una crítica, negar un servicio por el origen o la lengua de quien lo solicita. Cada una deja intacta la apariencia del procedimiento y le quita el contenido.',
              'Democratic culture is rarely lost all at once. It wears down through practices that look minor: conditioning support on a vote or on attendance, deciding in private and announcing later, withholding information that is public, calling a meeting so that almost nobody can get there, blocking a criticism, refusing a service because of where the applicant comes from or which language they speak. Each one leaves the appearance of the procedure intact and strips out its content.') + '</p>' +
    '<p>' + S('Defender los valores democráticos consiste en responder a cada una de esas prácticas con un mecanismo concreto y no con una declaración de principios: reglas de operación públicas, informe con comprobantes, derecho de réplica, convocatoria anticipada, solicitud de transparencia, trato igual en la ventanilla. Cada mecanismo devuelve a su lugar algo que se había desviado: la decisión, la información o el acceso.',
              'Defending democratic values consists of answering each of those practices with a concrete mechanism rather than a statement of principle: public operating rules, a report with receipts, a right of reply, an early call, a transparency request, equal treatment at the counter. Each mechanism returns to its place something that had been diverted: the decision, the information or the access.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Clave: ','Key: ') + '</strong>' +
      S('una práctica que desgasta se corrige con una regla que se pueda comprobar; el enojo por sí solo no repara nada.',
        'a practice that wears things down is corrected with a rule that can be verified; anger on its own repairs nothing.') + '</p></div>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Condicionar','Conditioning') + '</div><div class="rform">' + S('apoyo a cambio de voto','support in exchange for a vote') + '</div><div class="rnote">' + S('Se corrige con reglas públicas y padrón abierto.','Corrected with public rules and an open register.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Opacidad','Opacity') + '</div><div class="rform">' + S('información retenida','information withheld') + '</div><div class="rnote">' + S('Se corrige con transparencia y resolución obligatoria.','Corrected with transparency and a binding resolution.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Simulación','Simulation') + '</div><div class="rform">' + S('consulta que excluye','a consultation that excludes') + '</div><div class="rnote">' + S('Se corrige con convocatoria anticipada y difundida.','Corrected with an early, widely spread call.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Exclusión','Exclusion') + '</div><div class="rform">' + S('acceso negado','access denied') + '</div><div class="rnote">' + S('Se corrige con trato igual y apoyos para ejercerlo.','Corrected with equal treatment and support to exercise it.') + '</div></div>' +
    '</div>' +
    buildAntidoto(rng));
  antRender();

  addProblem(pick([
    { title:{ es:'La lista de quienes se comprometieron', en:'The list of those who committed' }, showWork:false,
      stmt:{ es:'Un candidato a presidir la sociedad de alumnos ofrece pases de salida a quienes voten por él y muestra una lista con los nombres de quienes ya se comprometieron. ¿Qué valor democrático resulta dañado y por qué?',
             en:'A candidate for the student council presidency offers exit passes to whoever votes for him and shows a list with the names of those who have already committed. Which democratic value is damaged and why?' },
      options:{ es:[
        'El voto libre: condicionar el beneficio al sentido del voto y registrar quién se comprometió permite vigilar y castigar después la decisión de cada quien.',
        'La legalidad, porque una sociedad de alumnos carece de facultades para otorgar pases de salida a cualquier persona.',
        'La pluralidad, porque el candidato tendría que ofrecer el mismo beneficio a quienes apoyan a las otras planillas.',
        'Ninguno: ofrecer beneficios concretos es una forma legítima de campaña y cada quien decide si le convienen o no.' ],
        en:[
        'The free vote: making the benefit conditional on how you vote and recording who committed makes it possible to watch and later punish each person decision.',
        'Legality, because a student council has no power to grant exit passes to anybody at all.',
        'Plurality, because the candidate would have to offer the same benefit to those backing the other tickets.',
        'None: offering concrete benefits is a legitimate form of campaigning and each person decides whether it suits them.' ] },
      correct:0,
      hint:{ es:'Fíjate en lo que la lista permite hacer el día después de la elección.',
             en:'Look at what the list makes possible the day after the election.' },
      explanation:{ es:'El problema no es prometer algo, sino que el beneficio dependa de cómo votes y que exista un registro para comprobarlo. Con esa lista el voto deja de ser una decisión propia y se convierte en un compromiso vigilado. Ofrecer lo mismo a todos no repara nada, porque el daño está en la condición y en el registro, no en el reparto.',
                    en:'The problem is not promising something, but that the benefit depends on how you vote and that a record exists to check it. With that list the vote stops being a decision of your own and becomes a supervised commitment. Offering the same to everyone repairs nothing, because the damage lies in the condition and the record, not in the distribution.' } },
    { title:{ es:'El padrón que castiga las faltas', en:'The register that punishes absences' }, showWork:false,
      stmt:{ es:'Un programa municipal de despensas registra quién asiste a los actos públicos de la funcionaria que lo encabeza y avisa que quien falte quedará fuera del padrón. ¿Qué valor democrático resulta dañado y por qué?',
             en:'A town food aid program records who attends the public events of the official who heads it and warns that whoever misses one will be dropped from the register. Which democratic value is damaged and why?' },
      options:{ es:[
        'La igualdad ante el derecho: el apoyo deja de depender de la necesidad y pasa a depender de la lealtad demostrada a quien lo entrega.',
        'La pluralidad, porque el programa tendría que invitar también a los actos de las demás autoridades del municipio.',
        'La legalidad, porque ningún gobierno municipal puede repartir despensas sin la aprobación previa del vecindario.',
        'Ninguno: pedir asistencia a los actos es una manera de informar a las familias sobre los programas disponibles.' ],
        en:[
        'Equality before the right: the support stops depending on need and starts depending on loyalty shown to whoever hands it out.',
        'Plurality, because the program should also invite people to the events of the other town authorities.',
        'Legality, because no town government may distribute food aid without prior approval from the neighborhood.',
        'None: asking for attendance at the events is a way of informing families about the programs available.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué determina, en los hechos, quién come y quién no en ese padrón.',
             en:'Ask what actually determines, in practice, who eats and who does not on that register.' },
      explanation:{ es:'Un apoyo público se entrega porque alguien cumple los requisitos, no porque acompañe a quien lo firma. Al atar el padrón a la asistencia, el derecho se transforma en un favor revocable y la necesidad deja de ser el criterio. La reparación no pasa por repartir invitaciones a más actos, sino por reglas de operación públicas que digan quién tiene derecho y por qué.',
                    en:'Public support is delivered because somebody meets the requirements, not because they accompany whoever signs it. By tying the register to attendance, the right turns into a revocable favor and need stops being the criterion. The repair is not handing out invitations to more events, but public operating rules stating who is entitled and why.' } }
  ], rng), rng);

  addProblem(pick([
    { title:{ es:'Dos formas de ayudar', en:'Two ways of helping' }, showWork:false,
      stmt:{ es:'Después de una inundación, dos organizaciones actúan en la misma colonia. Una entrega despensas cada mes y decide sola qué contienen. La otra acompaña al comité vecinal a levantar un censo, gestionar el desazolve del canal y capacitar a un grupo para darle mantenimiento. ¿Qué distingue a la segunda desde el punto de vista de la colaboración solidaria?',
             en:'After a flood, two organizations act in the same neighborhood. One delivers food parcels every month and decides on its own what goes in them. The other supports the residents committee in building a census, filing for the canal to be dredged and training a group to maintain it. What sets the second apart from the standpoint of collaborative solidarity?' },
      options:{ es:[
        'Deja capacidad instalada y transfiere decisiones, de modo que el resultado no depende de que la organización siga presente.',
        'Atiende una necesidad más urgente, porque el desazolve resuelve el problema completo mientras la despensa solo alivia el hambre.',
        'Gasta menos recursos, y ese ahorro es lo que convierte un apoyo cualquiera en una acción verdaderamente solidaria.',
        'Trabaja con la autoridad, y toda acción coordinada con el gobierno resulta preferible a la que emprende una organización por su cuenta.' ],
        en:[
        'It leaves capacity installed and transfers decisions, so the outcome does not depend on the organization staying around.',
        'It addresses a more urgent need, because dredging solves the whole problem while a food parcel only relieves hunger.',
        'It spends fewer resources, and that saving is what turns any kind of help into a truly solidary action.',
        'It works with the authority, and any action coordinated with government is preferable to one an organization undertakes alone.' ] },
      correct:0,
      hint:{ es:'Imagina que ambas organizaciones se retiran mañana y compara lo que queda en la colonia.',
             en:'Imagine both organizations withdraw tomorrow and compare what is left in the neighborhood.' },
      explanation:{ es:'La despensa cubre una carencia inmediata y eso tiene valor, pero la decisión permanece fuera de la colonia y el efecto termina cuando termina la entrega. La segunda deja un censo, una gestión abierta y personas capacitadas: la colonia queda en mejores condiciones para actuar sin ayuda. En clave sustentable, la solidaridad aumenta la capacidad de quien recibe, no su dependencia.',
                    en:'The food parcel covers an immediate shortage and that has value, but the decision stays outside the neighborhood and the effect ends when the delivery ends. The second leaves a census, an open filing and trained people: the neighborhood is better placed to act without help. In sustainable terms, solidarity increases the capacity of those who receive, not their dependence.' } },
    { title:{ es:'Dos formas de ayudar', en:'Two ways of helping' }, showWork:false,
      stmt:{ es:'Ante una sequía prolongada, una brigada reparte pipas de agua cada quince días y define ella misma las rutas. Otra acompaña a la comunidad a reparar la red, formar un comité del agua y acordar un calendario de mantenimiento. ¿Qué distingue a la segunda desde el punto de vista de la colaboración solidaria?',
             en:'Facing a long drought, one brigade delivers water tankers every two weeks and sets the routes itself. Another supports the community in repairing the network, forming a water committee and agreeing a maintenance calendar. What sets the second apart from the standpoint of collaborative solidarity?' },
      options:{ es:[
        'Traslada a la comunidad la decisión y el mantenimiento, de modo que el abasto se sostiene sin la brigada.',
        'Entrega una cantidad mayor de agua, y ese volumen es lo que mide si una acción solidaria valió la pena.',
        'Evita tratar con la autoridad, lo que le permite avanzar más rápido que cualquier gestión de tipo oficial.',
        'Responde con más urgencia, porque reparar la red alivia la sed antes que cualquier entrega en pipa.' ],
        en:[
        'It hands the decision and the maintenance over to the community, so the supply holds up without the brigade.',
        'It delivers a larger amount of water, and that volume is what measures whether a solidary action was worthwhile.',
        'It avoids dealing with the authority, which lets it move faster than any official procedure.',
        'It responds more urgently, because repairing the network relieves thirst sooner than any tanker delivery.' ] },
      correct:0,
      hint:{ es:'Pregúntate quién decide y quién sostiene el resultado en cada uno de los dos casos.',
             en:'Ask who decides and who sustains the result in each of the two cases.' },
      explanation:{ es:'La pipa resuelve el día y mantiene la decisión en manos de quien la reparte; cuando la brigada se va, la sed vuelve intacta. La red reparada, el comité y el calendario dejan a la comunidad decidiendo y sosteniendo su propio abasto. La urgencia no es el criterio: lo es quién queda con la capacidad de responder mañana.',
                    en:'The tanker solves the day and keeps the decision in the hands of whoever distributes it; when the brigade leaves, the thirst returns untouched. The repaired network, the committee and the calendar leave the community deciding and sustaining its own supply. Urgency is not the criterion: what matters is who is left able to respond tomorrow.' } }
  ], rng), rng);

        en:[

    { title:{ es:'Cuatro propuestas para la colonia', en:'Four proposals for the neighborhood' }, showWork:true,

             en:'A youth group has one month and a very small budget to answer a need in their neighborhood, and four proposals come in. Which one best meets the conditions of an active citizenship project?' },
      options:{ es:[
        'Un censo de las esquinas sin alumbrado, acordado en asamblea vecinal, con responsables por calle y presentación pública del resultado ante el municipio.',
        'Una jornada de limpieza de un solo día, organizada por quienes tengan disponibilidad esa mañana.',

        'A single day cleanup, organized by whoever happens to be free that morning.',

                    en:'The cleanup, the collection and the festival keep many people busy, but the decision stays in few hands or is postponed until after the money is in. The census comes from an assembly agreement, distributes the work street by street and ends in a public presentation that leaves the town hall with a document it has to answer.' } }
  ], rng), rng);

  addProblem(pick([
    { title:{ es:'El día que se cortó el listón', en:'The day the ribbon was cut' }, showWork:false,
      stmt:{ es:'El proyecto se cumplió: la escalera del plantel ya tiene barandal. En la asamblea de cierre alguien propone dar el tema por terminado y no volver a tocarlo. ¿Qué conviene hacer y por qué?',
             en:'The project came through: the school stairway now has a handrail. At the closing assembly somebody proposes considering the matter finished and never raising it again. What is worth doing and why?' },
      options:{ es:[
        'Registrar en el acta quién dará mantenimiento y en qué fecha se revisará, porque un resultado sin seguimiento vuelve a depender de que alguien lo note a tiempo.',
        'Disolver el comité, porque una vez alcanzado el objetivo su permanencia podría interpretarse como un intento de conservar el cargo.',
        'Repetir el mismo proyecto el próximo ciclo, ya que un procedimiento que funcionó una vez conviene aplicarlo de nuevo sin cambios.',
        'Dar el tema por terminado, porque el barandal ya está instalado y volver sobre un asunto resuelto resta tiempo a necesidades nuevas.' ],
        en:[
        'Recording in the minutes who will maintain it and on what date it gets reviewed, because a result with no follow-up depends again on somebody noticing in time.',

        'Repeating the same project next year, since a procedure that worked once is worth applying again unchanged.',

      correct:0,
      hint:{ es:'Piensa en ese barandal dentro de dos años y en quién se daría cuenta si empieza a aflojarse.',
             en:'Think about that handrail two years from now and who would notice if it starts coming loose.' },
      explanation:{ es:'Un proyecto termina cuando queda quién lo sostiene y cuándo se revisa, no cuando se corta el listón. Dejarlo en el acta convierte el mantenimiento en una obligación verificable y libera al comité para atender lo siguiente. Sin ese registro, el barandal vuelve a depender de que alguien, algún día, se dé cuenta.',
                    en:'A project ends when there is somebody sustaining it and a date for review, not when the ribbon is cut. Putting it in the minutes turns maintenance into a verifiable obligation and frees the committee to take on the next thing. Without that record, the handrail depends again on somebody, some day, noticing.' } },
    { title:{ es:'El bebedero ya funciona', en:'The drinking fountain works now' }, showWork:false,
      stmt:{ es:'El bebedero que la comunidad escolar gestionó durante meses quedó instalado y funciona. En la asamblea de cierre se propone celebrar y cerrar el expediente. ¿Qué conviene hacer y por qué?',

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Ciudadanía Activa y Defensa de Valores Democráticos';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
