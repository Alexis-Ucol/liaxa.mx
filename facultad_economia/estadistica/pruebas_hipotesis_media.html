        '<div class="rcard"><div class="rname">What it is not</div><div class="rform">p ≠ P( H₀ true )</div><div class="rnote">Nor does it measure importance.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> An insurer reserves an average amount of ' + money(c2mu0) + ' per paid claim. The reserving team suspects no direction: it wants to know whether the true average amount changed, either way. It reviews ' + intN(c2n) + ' random files and finds an average of ' + money2(c2xb) + '. The known standard deviation is ' + money(c2sd) + ' and the significance level is ' + pct1(c2al) + ' percent.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> With no prior direction, the null says the true average amount is ' + money(c2mu0) + ' and the alternative that it is different from that figure. The test is two tailed.<br>' +
      '<strong>Step 2.</strong> The standard error is ' + dec2(c2se) + ' pesos and the statistic is ' + dec3(c2z) + '.<br>' +
      '<strong>Step 3.</strong> The two tailed p value is ' + pr(c2p) + ', twice the area beyond ' + dec3(Math.abs(c2z)) + ' in a single tail.<br>' +
      '<strong>Step 4.</strong> Since the p value ' + (c2R ? 'does not exceed' : 'exceeds') + ' the significance level ' + pr(c2al) + ', ' + (c2R ? 'the null is rejected.' : 'the null is not rejected.') + ' The critical value rule lands in the same place: the boundary is ' + dec3(c2zc) + ' and the statistic in absolute value is ' + dec3(Math.abs(c2z)) + '.<br>' +

  /* ── Item 3 ── */

      '<p>Eso lleva a la última pieza, la que se decide antes de recoger un solo dato: el <strong>tamaño de muestra</strong>. Si la empresa sabe qué diferencia le importaría de verdad, puede calcular cuántas observaciones necesita para detectarla con una probabilidad razonable, combinando el valor crítico del nivel de significancia con el que corresponde a la potencia deseada. Diseñar el estudio en ese orden evita el desenlace más caro de todos: gastar en un estudio que nunca tuvo posibilidad de encontrar lo que se buscaba.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Intervalo</div><div class="rform">x̄ ± z꜀ · σ/√n</div><div class="rnote">Todos los valores compatibles con la muestra.</div></div>' +

        '<div class="rcard"><div class="rname">Tamaño de muestra</div><div class="rform">n = ((z_α + z_β)·σ / d)²</div><div class="rnote">Se decide antes de medir.</div></div>' +
        '<div class="rcard"><div class="rname">Cuidado</div><div class="rform">no rechazar ≠ demostrar</div><div class="rnote">Puede ser falta de potencia.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Un fondo administra cuentas de inversión y una muestra aleatoria de ' + intN(c4n) + ' cuentas arroja una utilidad promedio de ' + money(c4xb) + ' por cuenta, con una desviación conocida de ' + money(c4sd) + '. Un folleto de la competencia afirma que la utilidad promedio del fondo es de ' + money(c4cl) + '.</p>' +

    return '' +
      '<div class="stag">Concept 4</div>' +
      '<h2>The interval, the test and the sample size</h2>' +
      '<p>The hypothesis test and the confidence interval are usually taught apart, but they are the same computation with two presentations. Both start from the observed average, both use the same standard error and both use the same critical value. The test asks whether one concrete figure is compatible with the sample; the interval hands over at once every figure that is.</p>' +
      '<p>From there follows a practical equivalence worth keeping in mind: a two tailed test at significance level alpha rejects a claim <strong>exactly when</strong> that claim falls outside the confidence interval built with the complement of alpha. Not one peso sooner, not one peso later. That is why anyone presenting an interval has implicitly presented the result of infinitely many hypothesis tests.</p>' +
      '<p>The difference lies in what each brings to a decision. The test hands over a yes or a no, convenient for an opinion. The interval also hands over the range of values the evidence leaves standing, which is what budgeting, negotiating or deciding whether to keep measuring actually needs. A very wide interval next to a result that does not reject does not mean the claim is right: it means the study had no power to tell anything apart.</p>' +
      '<p>That leads to the last piece, the one decided before a single observation is collected: the <strong>sample size</strong>. If the company knows which difference would genuinely matter, it can compute how many observations it needs to detect it with a reasonable probability, combining the critical value of the significance level with the one matching the desired power. Designing the study in that order avoids the most expensive ending of all: paying for a study that never had a chance of finding what it was looking for.</p>' +

function applyUIStrings() {

  var lr = document.getElementById('logo-right');  if (lr) lr.alt = SCHOOL.logoRightAlt;

/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');
    if (st) st.innerHTML = p.questionText + '<span class="pfn">' + (p.fn || '') + '</span>';
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
