<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Derivada: Concepto y Reglas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}


/* ── GUIDE WIDGETS (derivada) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.92rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.55rem .7rem; margin:.6rem 0; overflow-x:auto; text-align:center; }
.defgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.binrow { display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0 .2rem; }
.binbtn { flex:1 1 40%; min-height:48px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.82rem; font-weight:600; cursor:pointer; padding:.4rem .5rem; font-family:inherit; }
.binbtn:hover { border-color:var(--green); color:var(--green); }
.cls-card { border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); padding:.7rem .8rem; text-align:center; font-weight:600; font-size:.9rem; margin:.6rem 0; }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }
.gcv { display:block; width:100%; height:215px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.slrow { display:flex; align-items:center; gap:.6rem; margin-top:.55rem; flex-wrap:wrap; }
.slrow input[type=range] { flex:1; min-width:130px; accent-color:var(--green); height:34px; }
.sllbl { font-family:'IBM Plex Mono',monospace; font-size:.82rem; color:var(--text3); min-width:78px; }
.slval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1rem; color:var(--green); min-width:60px; text-align:right; }
.statgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.45rem; margin-top:.6rem; }
.statcell { background:var(--surface2); border-radius:8px; padding:.5rem; text-align:center; }
.statlbl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); margin-bottom:.15rem; }
.statnum { font-family:'IBM Plex Mono',monospace; font-size:.92rem; font-weight:700; color:var(--green-dark); }
.tickrow { display:flex; flex-wrap:wrap; gap:.4rem; margin:.8rem 0 .2rem; justify-content:center; }
.tickbtn { flex:0 0 54px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text2); font-family:'IBM Plex Mono',monospace; font-size:.86rem; font-weight:600; cursor:pointer; padding:0; }
.tickbtn:hover { border-color:var(--green); }
.tickbtn.hit { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.chiprow { display:flex; flex-wrap:wrap; gap:.5rem; margin:.6rem 0 .2rem; }
.chipbtn { flex:1 1 30%; min-height:46px; border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); color:var(--text2); font-family:'IBM Plex Mono',monospace; font-size:.88rem; font-weight:600; cursor:pointer; padding:.4rem .5rem; }
.chipbtn:hover { border-color:var(--green); color:var(--green); }
.termline { font-family:'IBM Plex Mono',monospace; font-size:.86rem; color:var(--text3); text-align:center; margin-top:.4rem; }
.buildline { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:600; color:var(--green); background:var(--green-bg); border-radius:8px; padding:.55rem .7rem; text-align:center; margin-top:.6rem; overflow-x:auto; }
@media (max-width: 600px) {
  .defgrid { grid-template-columns:1fr; }
  .statgrid { grid-template-columns:1fr 1fr; }
  .binbtn { flex:1 1 100%; }
  .chipbtn { flex:1 1 100%; }
  .gcv { height:190px; }
  .sllbl { min-width:64px; font-size:.74rem; }
  .tickbtn { flex:0 0 48px; font-size:.78rem; }
  .buildline { font-size:.86rem; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">La Derivada: Concepto y Reglas</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático III · Sem 3</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">

function setLang(l){

    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_pm3_t05_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_pm3_t05_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_pm3_t05_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB

    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ---------- helpers ---------- */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function EN(){ return LANG === 'en'; }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function pickOne(arr){ return arr[Math.floor(rng()*arr.length)]; }
  function shufA(arr){ var a=arr.slice(),i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function perm(n){ var a=[],i; for(i=0;i<n;i++) a.push(i); return shufA(a); }
  function sec(tag,title,html){
    var d=document.createElement('div'); d.className='section';
    d.innerHTML='<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d); return d;
  }
  function widget(kind){
    var d=document.createElement('div'); d.className=kind+'wrap section';
    d.setAttribute('data-widget', kind); d.id='w'+kind; LB.appendChild(d); return d;
  }
  function cssv(n){ try{ var v=getComputedStyle(document.documentElement).getPropertyValue(n); return v?v.trim():'#000'; }catch(e){ return '#000'; } }
  function fitCv(cv){
    var dpr=window.devicePixelRatio||1, w=cv.clientWidth||320, h=cv.clientHeight||200;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function plot(cv, xmin, xmax, ymin, ymax, ystep){
    var f=fitCv(cv), ctx=f.ctx, w=f.w, h=f.h, pad=8, i;
    function X(x){ return pad + (x-xmin)/(xmax-xmin)*(w-2*pad); }
    function Y(y){ return h - pad - (y-ymin)/(ymax-ymin)*(h-2*pad); }
    ctx.strokeStyle=cssv('--border'); ctx.lineWidth=1;
    for(i=Math.ceil(xmin);i<=xmax;i++){ ctx.beginPath(); ctx.moveTo(X(i),Y(ymin)); ctx.lineTo(X(i),Y(ymax)); ctx.stroke(); }
    for(i=Math.ceil(ymin/ystep)*ystep;i<=ymax;i+=ystep){ ctx.beginPath(); ctx.moveTo(X(xmin),Y(i)); ctx.lineTo(X(xmax),Y(i)); ctx.stroke(); }
    ctx.strokeStyle=cssv('--text3'); ctx.lineWidth=1.4;
    if (ymin<=0 && ymax>=0){ ctx.beginPath(); ctx.moveTo(X(xmin),Y(0)); ctx.lineTo(X(xmax),Y(0)); ctx.stroke(); }
    if (xmin<=0 && xmax>=0){ ctx.beginPath(); ctx.moveTo(X(0),Y(ymin)); ctx.lineTo(X(0),Y(ymax)); ctx.stroke(); }
    return { ctx:ctx, X:X, Y:Y, w:w, h:h, xmin:xmin, xmax:xmax, ymin:ymin, ymax:ymax };
  }
  function curve(P, fn, x0, x1){
    var ctx=P.ctx, step=(x1-x0)/300, x, y, first=true;
    ctx.beginPath();
    for(x=x0; x<=x1+1e-9; x+=step){
      y=fn(x);
      if (!isFinite(y) || y<P.ymin || y>P.ymax){ first=true; continue; }
      if (first){ ctx.moveTo(P.X(x),P.Y(y)); first=false; } else ctx.lineTo(P.X(x),P.Y(y));
    }
    ctx.stroke();
  }
  function straight(P, x0, y0, m, col, wid){
    var ctx=P.ctx;
    ctx.strokeStyle=cssv(col); ctx.lineWidth=wid;
    ctx.beginPath();
    ctx.moveTo(P.X(P.xmin), P.Y(y0 + m*(P.xmin-x0)));
    ctx.lineTo(P.X(P.xmax), P.Y(y0 + m*(P.xmax-x0)));
    ctx.stroke();
  }
  function dot(P, x, y, col){
    var ctx=P.ctx;
    ctx.fillStyle=cssv(col); ctx.beginPath(); ctx.arc(P.X(x),P.Y(y),5.5,0,Math.PI*2); ctx.fill();
  }
  var MIN = '−';
  function num(n){ return n<0 ? MIN+Math.abs(n) : ''+n; }
  function fmt(n){ var s=(Math.round(n*100)/100).toFixed(2); return s.charAt(0)==='-' ? MIN+s.slice(1) : s; }
  function lead(c, body){ return c===1 ? body : (c===-1 ? MIN+body : num(c)+body); }
  function frac(a,b){ return '<span class="mf-outer"><span class="mf-num">'+a+'</span><span class="mf-den">'+b+'</span></span>'; }
  function addProb(spec){
    var so = shufA(T(spec.options)), cor = T(spec.correct);
    problems.push({
      title: T(spec.title), questionText: T(spec.q), fn:'',
      hint: T(spec.hint), explanation: T(spec.exp),
      options: so, correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork, studentChoice:null, pendingChoice:null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES CON SEMILLA (orden fijo: la reconstrucción por idioma
     usa la misma semilla y produce exactamente los mismos datos)
     ============================================================ */
  var vP1 = Math.floor(rng()*2);
  var a1 = ri(2,5), t1 = ri(1,3), dt1 = ri(2,3), t2 = t1 + dt1, b1 = ri(1,3);
  var avgA = a1*(t1+t2), avgB = a1*(t1+t2) + b1;

  var vP2 = Math.floor(rng()*2);
  var tm2 = ri(5,9), r2 = ri(2,5), q2 = pickOne([20,30,40]), k2 = ri(3,8);

  var vP3 = Math.floor(rng()*2);
  var a3 = pickOne([2,3,5]), x3 = pickOne([3,4]), c3 = ri(1,4);

  var vP4 = Math.floor(rng()*2);
  var L4 = ri(4,9);

  var vP5 = Math.floor(rng()*2);
  var a5 = ri(2,4), b5 = ri(2,5), c5 = ri(2,6);

  var vP6 = Math.floor(rng()*2);
  var a6 = pickOne([2,3]), b6 = pickOne([3,5,7]), c6 = ri(1,4), x6 = pickOne([2,3]);
  var k6 = ri(2,4), B6 = 2*a6*k6;

  var vP7 = Math.floor(rng()*2);
  var a7 = ri(2,4), b7 = ri(2,5), c7 = ri(2,6), d7 = ri(2,7);

  var vP8 = Math.floor(rng()*2);
  var a8 = pickOne([1,2,3]), x8 = pickOne([3,4]);
  var m8 = 2*a8*x8, v8 = a8*x8*x8;

  var vP9 = Math.floor(rng()*2);
  var a9 = pickOne([3,4,5]), k9 = ri(3,5), t9 = ri(1,2), b9 = 2*a9*k9;

  var vP10 = Math.floor(rng()*2);
  var a10 = pickOne([2,3]), t10 = pickOne([2,4]), b10 = ri(2,5), q10 = pickOne([10,20,30]);

  /* datos de los manipulativos */
  var W1ORD = perm(6);
  var W2R = [];
  (function(){ var xs = shufA([1,2,3]), i; for(i=0;i<3;i++) W2R.push({ x0: xs[i] }); })();
  var W3R = [];
  (function(){ var i, j, o;
    for(i=0;i<3;i++){
      o = [];
      for(j=0;j<4;j++) o.push(perm(3));
      W3R.push({ A: ri(2,4), B: ri(2,5), C: ri(2,6), D: ri(2,9), ord: o });
    }
  })();
  var W4R = [];
  (function(){ var i, c, xs, sgn;
    for(i=0;i<3;i++){
      c = pickOne([1,-1]); xs = ri(-2,2); sgn = pickOne([-3,3]);
      W4R.push({ c:c, d:-2*c*xs, xs:xs, start: xs + sgn });
    }
  })();

  /* ============================================================
     CONCEPTO 1
     ============================================================ */
  sec(T({es:'Concepto 1', en:'Concept 1'}),
      T({es:'Del promedio al instante', en:'From the average to the instant'}),
      '<p>'+T({
        es:'Cuando una cantidad depende de otra, la razón de cambio mide cuánto responde la primera al variar la segunda. Si la posición de un móvil pasa de s(t₁) a s(t₂), el cociente entre lo que cambió la posición y lo que cambió el tiempo entrega una velocidad media: un solo número que resume todo el intervalo.',
        en:'When one quantity depends on another, the rate of change measures how much the first responds when the second varies. If the position of a body goes from s(t₁) to s(t₂), the quotient between the change in position and the change in time gives an average velocity: a single number that summarizes the whole interval.'
      })+'</p>'+
      '<div class="callout"><p><strong>'+T({es:'Razón de cambio promedio.',en:'Average rate of change.'})+'</strong> '+T({
        es:'Es el cociente '+frac('Δy','Δx')+' entre dos puntos de la gráfica y coincide con la pendiente de la recta secante que los une. Depende del intervalo completo, no de un instante.',
        en:'It is the quotient '+frac('Δy','Δx')+' between two points of the graph and it coincides with the slope of the secant line joining them. It depends on the whole interval, not on one instant.'
      })+'</p></div>'+
      '<p>'+T({
        es:'El velocímetro de un automóvil no informa un promedio: marca la rapidez en ese instante. Esa segunda idea, la razón de cambio instantánea, aparece al mirar intervalos cada vez más cortos alrededor de un punto y observar hacia qué número se estabilizan los promedios. Todo el cálculo diferencial nace de esa distinción.',
        en:'The speedometer of a car does not report an average: it marks the speed at that instant. That second idea, the instantaneous rate of change, appears when you look at shorter and shorter intervals around a point and watch which number the averages settle on. All of differential calculus is born from that distinction.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Intervalo',en:'Interval'})+'</div><div class="deftxt">'+T({es:'La razón promedio necesita dos puntos y describe el comportamiento global entre ellos.', en:'The average rate needs two points and describes the global behaviour between them.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Instante',en:'Instant'})+'</div><div class="deftxt">'+T({es:'La razón instantánea se refiere a un solo valor de la variable y responde a la pregunta: ¿qué tan rápido cambia aquí?', en:'The instantaneous rate refers to a single value of the variable and answers the question: how fast does it change here?'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Unidades',en:'Units'})+'</div><div class="deftxt">'+T({es:'Ambas se expresan en unidades de la variable dependiente sobre unidades de la independiente, por ejemplo metros por segundo o litros por minuto.', en:'Both are expressed in units of the dependent variable over units of the independent one, for example metres per second or litres per minute.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 1: promedio o instantánea ---- */
  (function(){
    var wrap = widget('clasifica');
    var BINS = { es:['Razón de cambio promedio','Razón de cambio instantánea'],
                 en:['Average rate of change','Instantaneous rate of change'] };
    var ITEMS = [
      { es:'La lectura del velocímetro justo cuando el cronómetro marca 4 segundos', en:'The speedometer reading exactly when the stopwatch shows 4 seconds', bin:1 },
      { es:'El cambio total de temperatura dividido entre las 6 horas que duró el registro', en:'The total temperature change divided by the 6 hours the record lasted', bin:0 },
      { es:'La pendiente de la recta secante que une dos puntos de la gráfica', en:'The slope of the secant line joining two points of the graph', bin:0 },
      { es:'La pendiente de la recta tangente en un punto de la gráfica', en:'The slope of the tangent line at one point of the graph', bin:1 },
      { es:'El número que se obtiene al evaluar f′ en un valor fijo de x', en:'The number obtained by evaluating f′ at a fixed value of x', bin:1 },
      { es:'El cociente entre el aumento de población y los 10 años transcurridos', en:'The quotient between the population increase and the 10 years elapsed', bin:0 }
    ];
    var st = { i:0, tries:0, ok:0, done:false, lock:false };
    function it(){ return ITEMS[W1ORD[st.i]]; }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Promedio o instante',en:'Average or instant'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Actividad completa',en:'Activity complete'})+' '+st.ok+' / '+ITEMS.length+'</div>'+
          '<div class="rfb">'+T({
            es:'Cada vez que la descripción menciona un intervalo, un lapso o dos puntos, la cantidad es un promedio. Cuando señala un solo instante o un solo punto de la gráfica, la cantidad es instantánea y es justo la que la derivada calcula.',
            en:'Whenever the description mentions an interval, a span or two points, the quantity is an average. When it points at a single instant or a single point of the graph, the quantity is instantaneous and it is exactly the one the derivative computes.'
          })+'</div></div>';
        return;
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Promedio o instante',en:'Average or instant'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Lee cada descripción y decide de qué tipo de razón de cambio habla. Si te equivocas, la tarjeta se queda para que lo vuelvas a intentar.',
            en:'Read each description and decide which kind of rate of change it talks about. If you miss, the card stays so you can try again.'
          })+'</div>'+
          '<div class="rondas">'+(st.i+1)+' / '+ITEMS.length+'</div>'+
          '<div class="cls-card">'+it()[LANG]+'</div>'+
          '<div class="binrow">'+
            '<button class="binbtn" onclick="w1Pick(0)">'+T(BINS)[0]+'</button>'+
            '<button class="binbtn" onclick="w1Pick(1)">'+T(BINS)[1]+'</button>'+
          '</div>'+
          '<div class="rfb" id="w1fb"></div>'+
        '</div>';
    }
    function advance(){
      st.i++; st.tries=0; st.lock=false;
      if (st.i>=ITEMS.length){ st.done=true; }
      render();
    }
    window.w1Pick = function(bi){
      if (st.lock) return;
      var cur = it(), fb = document.getElementById('w1fb');
      if (bi === cur.bin){
        st.ok++; st.lock=true;
        fb.innerHTML = '<span class="okmsg">'+T({
          es:'Correcto. '+(cur.bin===1 ? 'La descripción apunta a un solo instante.' : 'La descripción abarca todo un intervalo.'),
          en:'Correct. '+(cur.bin===1 ? 'The description points at a single instant.' : 'The description covers a whole interval.')
        })+'</span>';

      if (st.tries>=3){

          en:'It was '+BINS.en[cur.bin]+'. Look for the signal: a span, two points or a division by the elapsed time indicate an average; a single instant or a single point indicate an instantaneous rate.'
        });
        setTimeout(advance, 2600); return;
      }
      fb.textContent = T({
        es:'Todavía no. Pregúntate si la cantidad necesita dos momentos para calcularse o si basta con uno solo.',
        en:'Not yet. Ask yourself whether the quantity needs two moments to be computed or whether a single one is enough.'
      });
    };
    render();
  })();

  /* ---- PROBLEMA 1 ---- */
  (function(){
    if (vP1 === 0){

  (function(){
    var wrap = widget('secante');
    var HS = [2, 1.5, 1, 0.5, 0.25, 0.1, 0.05];
    var st = { r:0, hi:0, tries:0, done:false, lock:false };
    function R(){ return W2R[st.r]; }
    function fx(x){ return x*x; }
    function mSec(){ return 2*R().x0 + HS[st.hi]; }
    function draw(){
      var cv=document.getElementById('w2cv'); if(!cv) return;
      var r=R(), h=HS[st.hi];
      var xmin=r.x0-2, xmax=r.x0+2.6, ymax=fx(r.x0+2.6)+1, ymin=-2;
      var P=plot(cv, xmin, xmax, ymin, ymax, Math.max(2, Math.round((ymax-ymin)/8)));
      P.ctx.strokeStyle=cssv('--green'); P.ctx.lineWidth=2.2;
      curve(P, fx, xmin, xmax);
      straight(P, r.x0, fx(r.x0), (fx(r.x0+h)-fx(r.x0))/h, '--gold', 2);
      dot(P, r.x0, fx(r.x0), '--green');
      dot(P, r.x0+h, fx(r.x0+h), '--gold');
    }
    function live(){
      var h=HS[st.hi], m=mSec();
      if (st.hi === 0) return T({es:'Los dos puntos están muy separados: la secante promedia un tramo largo de la parábola y su pendiente vale '+fmt(m)+'.',
                                 en:'The two points are far apart: the secant averages a long stretch of the parabola and its slope is '+fmt(m)+'.'});
      if (st.hi < HS.length-1) return T({es:'Con h = '+fmt(h)+' el segundo punto se acercó y la pendiente bajó a '+fmt(m)+'. Sigue reduciendo h.',
                                         en:'With h = '+fmt(h)+' the second point moved closer and the slope dropped to '+fmt(m)+'. Keep reducing h.'});
      return T({es:'Con h = '+fmt(h)+' los dos puntos casi se tocan y la secante ya se apoya en la curva: la pendiente vale '+fmt(m)+'.',
                en:'With h = '+fmt(h)+' the two points almost touch and the secant already rests on the curve: the slope is '+fmt(m)+'.'});
    }
    function ticks(){
      var r=R(), out='', i, v;
      for(i=-2;i<=2;i++){ v=2*r.x0+i; out += '<button class="tickbtn" onclick="w2Pick('+v+')">'+num(v)+'</button>'; }
      return out;

        wrap.innerHTML =

          '<div class="rfb">'+T({
            es:'En los tres casos la pendiente de la secante valía 2a + h, así que al encoger h el sobrante desaparece y queda 2a. Ese número, el límite de las pendientes, es la derivada de x² en a.',
            en:'In all three cases the slope of the secant was 2a + h, so as h shrinks the leftover disappears and 2a remains. That number, the limit of the slopes, is the derivative of x² at a.'
          })+'</div></div>';
        return;
      }
      var r=R();
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'De secante a tangente',en:'From secant to tangent'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'El punto verde está fijo en x = '+r.x0+' sobre la curva f(x) = x². Mueve el deslizador para acercar el punto dorado y observa cómo cambia la pendiente de la secante. Cuando reconozcas el número al que se acerca, tócalo abajo.',

          '<canvas class="gcv" id="w2cv"></canvas>'+
          '<div class="slrow"><span class="sllbl">h</span>'+
            '<input type="range" min="0" max="'+(HS.length-1)+'" step="1" value="'+st.hi+'" oninput="w2Slide(this.value)">'+
            '<span class="slval" id="w2h">'+fmt(HS[st.hi])+'</span></div>'+
          '<div class="statgrid">'+
            '<div class="statcell"><div class="statlbl">'+T({es:'punto fijo',en:'fixed point'})+'</div><div class="statnum">'+r.x0+' · '+fx(r.x0)+'</div></div>'+
            '<div class="statcell"><div class="statlbl">'+T({es:'punto móvil',en:'moving point'})+'</div><div class="statnum" id="w2q">'+fmt(r.x0+HS[st.hi])+'</div></div>'+
            '<div class="statcell"><div class="statlbl">'+T({es:'pendiente',en:'slope'})+'</div><div class="statnum" id="w2m">'+fmt(mSec())+'</div></div>'+

      if (st.lock) return;
      st.hi = parseInt(v,10);

      e=document.getElementById('w2m'); if(e) e.textContent=fmt(mSec());

      e=document.getElementById('w2fb'); if(e) e.textContent=live();
      draw();

      st.r++; st.tries=0; st.hi=0; st.lock=false;

          en:'Correct. The slopes approach '+target+', so f′('+r.x0+') = '+target+'.'
        })+'</span>';
        setTimeout(advance, 1700); return;

      st.tries++;
      if (st.tries>=3){
        st.lock=true; st.hi=HS.length-1; render();
        document.getElementById('w2fb').innerHTML = T({
          es:'El valor límite es '+target+'. Con h muy pequeño la pendiente ya casi no cambia y se estabiliza en ese número: esa es la pendiente de la tangente en x = '+r.x0+'.',

             en:'Your number is larger than the value the slopes approach. Reduce h and read the panel again.'})
        : T({es:'Tu número es menor que el valor al que se acercan las pendientes. Reduce h y vuelve a leer el tablero.',
             en:'Your number is smaller than the value the slopes approach. Reduce h and read the panel again.'});
    };
    render();
  })();

  (function(){
    var wrap = widget('reglas');
    var st = { r:0, k:0, tries:0, built:[], done:false, lock:false };
    function R(){ return W3R[st.r]; }
    function terms(){
      var r=R();
      return [
        { src: r.A+'x³', opts:[ (3*r.A)+'x²', (3*r.A)+'x³', r.A+'x²' ],
          tip:{es:'El exponente 3 baja como factor y el nuevo exponente es 2.', en:'The exponent 3 comes down as a factor and the new exponent is 2.'} },
        { src: r.B+'x²', opts:[ (2*r.B)+'x', (2*r.B)+'x²', r.B+'x' ],
          tip:{es:'El exponente 2 multiplica al coeficiente y la potencia baja a 1.', en:'The exponent 2 multiplies the coefficient and the power drops to 1.'} },
        { src: r.C+'x', opts:[ ''+r.C, r.C+'x', '0' ],
          tip:{es:'Un término lineal cambia a ritmo constante: su derivada es el coeficiente, sin x.', en:'A linear term changes at a constant rate: its derivative is the coefficient, with no x.'} },
        { src: ''+r.D, opts:[ '0', ''+r.D, r.D+'x' ],
          tip:{es:'Un término constante no cambia, así que su aporte a la derivada es cero.', en:'A constant term does not change, so its contribution to the derivative is zero.'} }
      ];
    }
    function fsrc(){
      var r=R();
      return 'f(x) = '+r.A+'x³ + '+r.B+'x² + '+r.C+'x + '+r.D;
    }
    function built(){
      if (!st.built.length) return 'f′(x) = ?';
      var s='f′(x) = '+st.built[0], i;
      for(i=1;i<st.built.length;i++){ if (st.built[i]!=='0') s += ' + '+st.built[i]; }
      return s;
    }
    function chips(){
      var t=terms()[st.k], o=R().ord[st.k], out='', i;
      for(i=0;i<3;i++){ out += '<button class="chipbtn" onclick="w3Pick('+o[i]+')">'+t.opts[o[i]]+'</button>'; }
      return out;
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Arma la derivada',en:'Build the derivative'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Actividad completa',en:'Activity complete'})+'</div>'+
          '<div class="rfb">'+T({
            es:'Derivar un polinomio es repetir el mismo gesto en cada término: baja el exponente como factor, resta uno al exponente y respeta el signo. Los términos constantes se van.',
            en:'Differentiating a polynomial is repeating the same gesture on each term: bring the exponent down as a factor, subtract one from the exponent and respect the sign. Constant terms vanish.'
          })+'</div></div>';
        return;
      }
      var t=terms()[st.k];
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Arma la derivada',en:'Build the derivative'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Deriva la función término por término. Toca la pieza que corresponde al término resaltado y observa cómo se arma la derivada completa.',
            en:'Differentiate the function term by term. Tap the piece matching the highlighted term and watch the full derivative assemble itself.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="dataline">'+fsrc()+'</div>'+
          '<div class="termline">'+T({es:'Término en turno',en:'Current term'})+': <b>'+t.src+'</b></div>'+
          '<div class="chiprow">'+chips()+'</div>'+
          '<div class="buildline">'+built()+'</div>'+
          '<div class="rfb" id="w3fb"></div>'+
        '</div>';
    }
    function advance(){
      st.k++; st.tries=0; st.lock=false;
      if (st.k>=4){
        st.r++; st.k=0; st.built=[];
        if (st.r>=3){ st.done=true; }
      }
      render();
    }
    window.w3Pick = function(oi){
      if (st.lock) return;
      var t=terms()[st.k], fb=document.getElementById('w3fb');
      if (oi === 0){
        st.built.push(t.opts[0]); st.lock=true;
        var bl=wrap.querySelector('.buildline'); if(bl) bl.textContent=built();
        fb.innerHTML = '<span class="okmsg">'+T({es:'Correcto. '+t.tip.es, en:'Correct. '+t.tip.en})+'</span>';
        setTimeout(advance, 1200); return;
      }
      st.tries++;
      if (st.tries>=3){
        st.built.push(t.opts[0]); st.lock=true;
        var b2=wrap.querySelector('.buildline'); if(b2) b2.textContent=built();
        fb.innerHTML = T({es:'La pieza correcta era '+t.opts[0]+'. '+t.tip.es, en:'The correct piece was '+t.opts[0]+'. '+t.tip.en});
        setTimeout(advance, 2500); return;
      }
      fb.textContent = (oi===1)
        ? T({es:'Ese coeficiente ya es el correcto, pero el exponente quedó igual que en la función original. Revisa la potencia.',
             en:'That coefficient is already right, but the exponent stayed the same as in the original function. Check the power.'})
        : T({es:'La potencia bajó bien, pero falta multiplicar por el exponente que bajó. Revisa el coeficiente.',
             en:'The power dropped correctly, but you still have to multiply by the exponent that came down. Check the coefficient.'});
    };
    render();
  })();

    function fdesc(){
      var r=R();
      return 'f(x) = '+lead(r.c,'x²')+(r.d===0 ? '' : (r.d>0 ? ' + '+r.d+'x' : ' '+MIN+' '+Math.abs(r.d)+'x'));
    }
    function draw(){
      var cv=document.getElementById('w4cv'); if(!cv) return;
      var P=plot(cv,-6,6,-14,14,4);
      P.ctx.strokeStyle=cssv('--green'); P.ctx.lineWidth=2.2;
      curve(P, fx, -6, 6);
      straight(P, st.a, fx(st.a), slope(), '--gold', 2);
      dot(P, st.a, fx(st.a), '--green');
    }
    function live(){
      var m=slope(), r=R();
      if (m === 0) return T({es:'La tangente quedó horizontal. Confirma con el botón.', en:'The tangent is horizontal now. Confirm with the button.'});
      var right = (m*2*r.c < 0);
      if (m > 0) return T({es:'La tangente sube: la pendiente vale '+num(m)+'. Mueve el punto hacia la '+(right?'derecha':'izquierda')+' para aplanarla.',
                           en:'The tangent rises: the slope is '+num(m)+'. Move the point to the '+(right?'right':'left')+' to flatten it.'});
      return T({es:'La tangente baja: la pendiente vale '+num(m)+'. Mueve el punto hacia la '+(right?'derecha':'izquierda')+' para aplanarla.',
                en:'The tangent falls: the slope is '+num(m)+'. Move the point to the '+(right?'right':'left')+' to flatten it.'});
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Tangente deslizante',en:'Sliding tangent'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Actividad completa',en:'Activity complete'})+'</div>'+
          '<div class="rfb">'+T({
            es:'La tangente se aplana justo donde la derivada se anula. Mientras la pendiente es positiva la curva sube, mientras es negativa baja, y el punto de cambio es el que resuelve f′(x) = 0.',
            en:'The tangent flattens exactly where the derivative vanishes. While the slope is positive the curve rises, while it is negative it falls, and the turning point is the one solving f′(x) = 0.'
          })+'</div></div>';
        return;
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Tangente deslizante',en:'Sliding tangent'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Desliza el punto verde sobre la curva y observa cómo gira su recta tangente. Detenlo donde la tangente quede horizontal y verifica.',
            en:'Slide the green point along the curve and watch its tangent line rotate. Stop it where the tangent becomes horizontal and check.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="dataline">'+fdesc()+'</div>'+
          '<canvas class="gcv" id="w4cv"></canvas>'+
          '<div class="slrow"><span class="sllbl">x =</span>'+
            '<input type="range" min="-6" max="6" step="1" value="'+st.a+'" oninput="w4Slide(this.value)">'+
            '<span class="slval" id="w4a">'+num(st.a)+'</span></div>'+
          '<div class="statgrid">'+
            '<div class="statcell"><div class="statlbl">'+T({es:'altura',en:'height'})+'</div><div class="statnum" id="w4y">'+num(fx(st.a))+'</div></div>'+
            '<div class="statcell"><div class="statlbl">'+T({es:'pendiente',en:'slope'})+'</div><div class="statnum" id="w4m">'+num(slope())+'</div></div>'+
            '<div class="statcell"><div class="statlbl">'+T({es:'inclinación',en:'tilt'})+'</div><div class="statnum" id="w4s">'+(slope()>0?'↗':(slope()<0?'↘':'→'))+'</div></div>'+
          '</div>'+
          '<button class="rverify-btn" onclick="w4Check()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="w4fb">'+live()+'</div>'+
        '</div>';
      draw();
    }
    window.w4Slide = function(v){
      if (st.lock) return;
      st.a = parseInt(v,10);
      var e;
      e=document.getElementById('w4a'); if(e) e.textContent=num(st.a);
      e=document.getElementById('w4y'); if(e) e.textContent=num(fx(st.a));
      e=document.getElementById('w4m'); if(e) e.textContent=num(slope());
      e=document.getElementById('w4s'); if(e) e.textContent=(slope()>0?'↗':(slope()<0?'↘':'→'));
      e=document.getElementById('w4fb'); if(e) e.textContent=live();
      draw();
    };
    function advance(){
      st.r++; st.tries=0; st.lock=false;
      if (st.r>=3){ st.done=true; render(); return; }
      st.a = W4R[st.r].start; render();
    }
    window.w4Check = function(){
      if (st.lock) return;
      var r=R(), fb=document.getElementById('w4fb');
      if (slope() === 0){
        st.lock=true;
        fb.innerHTML = '<span class="okmsg">'+T({
          es:'Correcto. En x = '+num(r.xs)+' la derivada se anula y la tangente queda horizontal.',
          en:'Correct. At x = '+num(r.xs)+' the derivative vanishes and the tangent becomes horizontal.'
        })+'</span>';
        setTimeout(advance, 1600); return;
      }
      st.tries++;
      if (st.tries>=3){
        st.lock=true; st.a=r.xs; render();
        document.getElementById('w4fb').innerHTML = T({
          es:'El punto buscado es x = '+num(r.xs)+'. Ahí la pendiente pasa de un signo al otro, así que vale cero y la tangente se aplana.',
          en:'The point you were looking for is x = '+num(r.xs)+'. There the slope changes from one sign to the other, so it is zero and the tangent flattens.'
        });
        setTimeout(advance, 2800); return;
      }
      fb.textContent = live()+' '+T({es:'Sigue ajustando.', en:'Keep adjusting.'});
    };
    render();
  })();

  /* ---- PROBLEMA 8 ---- */
  (function(){
    if (vP8 === 0){
      addProb({
        title:{es:'La recta tangente', en:'The tangent line'},
        q:{es:'Considera la función f(x) = '+lead(a8,'x²')+'. Determina la ecuación de la recta tangente a su gráfica en el punto donde x = '+x8+'.',
           en:'Consider the function f(x) = '+lead(a8,'x²')+'. Determine the equation of the tangent line to its graph at the point where x = '+x8+'.'},
        options:['y = '+m8+'x '+MIN+' '+v8, 'y = '+m8+'x + '+v8, 'y = '+v8+'x '+MIN+' '+m8, 'y = '+m8+'x'],
        correct:'y = '+m8+'x '+MIN+' '+v8,
        hint:{es:'Necesitas dos datos: la altura de la curva en ese valor de x y la pendiente que entrega la derivada ahí. Con ellos escribe la recta que pasa por el punto con esa inclinación.',
              en:'You need two pieces of data: the height of the curve at that value of x and the slope the derivative gives there. With them write the line through the point with that steepness.'},
        exp:{es:'La curva pasa por el punto ('+x8+', '+v8+') y la derivada f′(x) = '+m8/x8+'x entrega la pendiente '+m8+' en ese punto. La recta que pasa por ese punto con esa pendiente es y = '+m8+'x '+MIN+' '+v8+', que efectivamente vale '+v8+' cuando x = '+x8+'. La opción sin término independiente pasa por el origen y no toca la curva ahí.',
             en:'The curve passes through the point ('+x8+', '+v8+') and the derivative f′(x) = '+m8/x8+'x gives the slope '+m8+' at that point. The line through that point with that slope is y = '+m8+'x '+MIN+' '+v8+', which indeed equals '+v8+' when x = '+x8+'. The option with no constant term passes through the origin and does not touch the curve there.'},
        showWork:true
      });
    } else {
      addProb({
        title:{es:'La recta tangente', en:'The tangent line'},
        q:{es:'Considera la función f(x) = '+lead(a8,'x²')+'. La recta tangente a su gráfica en el punto donde x = '+x8+' corta al eje vertical. Determina la ordenada de ese corte.',
           en:'Consider the function f(x) = '+lead(a8,'x²')+'. The tangent line to its graph at the point where x = '+x8+' crosses the vertical axis. Determine the ordinate of that crossing.'},
        options:[num(-v8), num(v8), num(m8), '0'],
        correct:num(-v8),
        hint:{es:'Escribe primero la recta que pasa por el punto de la curva con la pendiente que entrega la derivada, y después evalúala en x = 0.',
              en:'First write the line through the point of the curve with the slope given by the derivative, and then evaluate it at x = 0.'},
        exp:{es:'El punto de tangencia es ('+x8+', '+v8+') y la pendiente ahí vale '+m8+'. La recta es entonces y = '+m8+'x '+MIN+' '+v8+', porque debe valer '+v8+' cuando x = '+x8+'. Al evaluarla en x = 0 queda su corte con el eje vertical: y = '+num(-v8)+'.',
             en:'The point of tangency is ('+x8+', '+v8+') and the slope there is '+m8+'. The line is then y = '+m8+'x '+MIN+' '+v8+', because it must equal '+v8+' when x = '+x8+'. Evaluating it at x = 0 leaves its crossing with the vertical axis: y = '+num(-v8)+'.'},
        showWork:true
      });
    }
  })();

  /* ============================================================
     BLOQUE FINAL
     ============================================================ */
  sec(T({es:'Cierre', en:'Closing'}),
      T({es:'Dos situaciones para resolver', en:'Two situations to solve'}),
      '<p>'+T({
        es:'Las dos situaciones siguientes combinan lo que trabajaste: obtener la derivada con las reglas y después leer el número que entrega dentro de un contexto con unidades.',
        en:'The next two situations combine what you worked on: obtaining the derivative with the rules and then reading the number it gives inside a context with units.'
      })+'</p>');

  /* ---- PROBLEMA 9 ---- */
  (function(){
    if (vP9 === 0){
      addProb({
        title:{es:'Velocidad en un instante', en:'Velocity at an instant'},
        q:{es:'Una pelota se lanza hacia arriba y su altura sobre el suelo es h(t) = '+b9+'t '+MIN+' '+a9+'t² metros, con t en segundos. Determina la velocidad instantánea de la pelota a los '+t9+' segundos.',
           en:'A ball is thrown upwards and its height above the ground is h(t) = '+b9+'t '+MIN+' '+a9+'t² metres, with t in seconds. Determine the instantaneous velocity of the ball at '+t9+' seconds.'},
        options:[(b9-2*a9*t9)+' m/s', (b9+2*a9*t9)+' m/s', b9+' m/s', (a9*(k9-t9))+' m/s'],
        correct:(b9-2*a9*t9)+' m/s',
        hint:{es:'La velocidad instantánea es la derivada de la altura respecto del tiempo. Obtén esa función cuidando el signo del término cuadrático y evalúala en el instante pedido.',
              en:'The instantaneous velocity is the derivative of the height with respect to time. Obtain that function taking care of the sign of the quadratic term and evaluate it at the requested instant.'},
        exp:{es:'Derivando término a término se obtiene h′(t) = '+b9+' '+MIN+' '+(2*a9)+'t, en metros por segundo. Al evaluar en t = '+t9+' resulta '+b9+' menos '+(2*a9*t9)+', es decir '+(b9-2*a9*t9)+' m/s. El signo positivo indica que la pelota todavía sube; perder el signo del término cuadrático produce '+(b9+2*a9*t9)+' m/s, que corresponde a la opción equivocada más frecuente.',
             en:'Differentiating term by term gives h′(t) = '+b9+' '+MIN+' '+(2*a9)+'t, in metres per second. Evaluating at t = '+t9+' yields '+b9+' minus '+(2*a9*t9)+', that is '+(b9-2*a9*t9)+' m/s. The positive sign indicates the ball is still rising; losing the sign of the quadratic term produces '+(b9+2*a9*t9)+' m/s, which is the most frequent wrong option.'},
        showWork:true
      });
    } else {
      addProb({
        title:{es:'El instante más alto', en:'The highest instant'},
        q:{es:'Una pelota se lanza hacia arriba y su altura sobre el suelo es h(t) = '+b9+'t '+MIN+' '+a9+'t² metros, con t en segundos. Determina el instante en el que la velocidad instantánea de la pelota es nula.',
           en:'A ball is thrown upwards and its height above the ground is h(t) = '+b9+'t '+MIN+' '+a9+'t² metres, with t in seconds. Determine the instant at which the instantaneous velocity of the ball is zero.'},
        options:['t = '+k9+' s', 't = '+(2*k9)+' s', 't = '+b9+' s', 't = 0 s'],
        correct:'t = '+k9+' s',
        hint:{es:'La velocidad instantánea es la derivada de la altura. Plantea la condición de que esa derivada valga cero y despeja el tiempo.',
              en:'The instantaneous velocity is the derivative of the height. Set the condition that this derivative equals zero and solve for the time.'},
        exp:{es:'La velocidad es h′(t) = '+b9+' '+MIN+' '+(2*a9)+'t. Se anula cuando '+(2*a9)+'t = '+b9+', es decir en t = '+k9+' s, que es justo cuando la pelota deja de subir y alcanza su altura máxima. En t = 0 la velocidad vale '+b9+' m/s, que es la velocidad de lanzamiento y no cero.',
             en:'The velocity is h′(t) = '+b9+' '+MIN+' '+(2*a9)+'t. It vanishes when '+(2*a9)+'t = '+b9+', that is at t = '+k9+' s, which is exactly when the ball stops rising and reaches its maximum height. At t = 0 the velocity is '+b9+' m/s, the launch velocity and not zero.'},
        showWork:true
      });
    }
  })();

  /* ---- PROBLEMA 10 ---- */
  (function(){
    if (vP10 === 0){
      addProb({
        title:{es:'Rapidez de llenado', en:'Filling speed'},
        q:{es:'Un tanque se llena de modo que el volumen acumulado es V(t) = '+a10+'t³ litros, con t medido en minutos. Determina la razón de cambio instantánea del volumen a los '+t10+' minutos.',
           en:'A tank fills up so that the accumulated volume is V(t) = '+a10+'t³ litres, with t measured in minutes. Determine the instantaneous rate of change of the volume at '+t10+' minutes.'},
        options:[(3*a10*t10*t10)+' L/min', (a10*t10*t10*t10)+' L/min', (3*a10*t10)+' L/min', (2*a10*t10)+' L/min'],
        correct:(3*a10*t10*t10)+' L/min',
        hint:{es:'Obtén primero la función derivada con la regla de la potencia y después sustituye el instante indicado; las unidades del resultado son litros por minuto.',
              en:'First obtain the derivative function with the power rule and then substitute the requested instant; the units of the result are litres per minute.'},
        exp:{es:'La derivada es V′(t) = '+(3*a10)+'t², medida en litros por minuto. Al sustituir t = '+t10+' se obtiene '+(3*a10)+' por '+(t10*t10)+', es decir '+(3*a10*t10*t10)+' L/min. El valor '+(a10*t10*t10*t10)+' L/min es el volumen acumulado, no su rapidez de cambio, y las otras dos opciones bajan mal el exponente.',
             en:'The derivative is V′(t) = '+(3*a10)+'t², measured in litres per minute. Substituting t = '+t10+' gives '+(3*a10)+' times '+(t10*t10)+', that is '+(3*a10*t10*t10)+' L/min. The value '+(a10*t10*t10*t10)+' L/min is the accumulated volume, not its rate of change, and the other two options bring the exponent down incorrectly.'},
        showWork:true
      });
    } else {
      addProb({
        title:{es:'Costo de una pieza más', en:'Cost of one more piece'},
        q:{es:'El costo total de producir q piezas es C(q) = '+a10+'q² + '+b10+'q pesos. Determina la razón de cambio instantánea del costo cuando la producción es de '+q10+' piezas.',
           en:'The total cost of producing q pieces is C(q) = '+a10+'q² + '+b10+'q pesos. Determine the instantaneous rate of change of the cost when production is '+q10+' pieces.'},
        options:[(2*a10*q10+b10)+' pesos por pieza', (2*a10*q10)+' pesos por pieza', (a10*q10+b10)+' pesos por pieza', (a10*q10*q10+b10*q10)+' pesos por pieza'],
        correct:(2*a10*q10+b10)+' pesos por pieza',
        hint:{es:'Deriva el costo respecto de la cantidad producida sin descartar el término lineal y evalúa en el nivel indicado; el resultado se mide en pesos por pieza.',
              en:'Differentiate the cost with respect to the quantity produced without dropping the linear term and evaluate at the given level; the result is measured in pesos per piece.'},
        exp:{es:'La derivada es C′(q) = '+(2*a10)+'q + '+b10+', en pesos por pieza. Al sustituir q = '+q10+' se obtiene '+(2*a10*q10)+' más '+b10+', es decir '+(2*a10*q10+b10)+' pesos por pieza. El valor '+(a10*q10*q10+b10*q10)+' pesos por pieza es el costo total de esa producción, no la rapidez con la que el costo crece.',
             en:'The derivative is C′(q) = '+(2*a10)+'q + '+b10+', in pesos per piece. Substituting q = '+q10+' gives '+(2*a10*q10)+' plus '+b10+', that is '+(2*a10*q10+b10)+' pesos per piece. The value '+(a10*q10*q10+b10*q10)+' pesos per piece is the total cost of that production, not the speed at which the cost grows.'},
        showWork:true
      });
    }
  })();
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'La Derivada: Concepto y Reglas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
