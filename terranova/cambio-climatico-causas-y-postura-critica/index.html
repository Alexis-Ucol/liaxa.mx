function buildLesson(rng) {
  injectGuideCSS();

  /* ══ INTRO ══ */
  sec(
    L({ es:'Para empezar', en:'To begin' }),
    L({ es:'Lo que se mide cuando se dice que el clima cambió', en:'What gets measured when we say the climate changed' }),
    '<p>' + L({
      es:'Hay una frase que escuchas por todos lados y que casi nadie explica: el clima está cambiando. Detrás de ella hay estaciones que llevan más de un siglo anotando temperatura y lluvia todos los días, boyas en el mar, globos en la atmósfera y hielo perforado en los polos que guarda burbujas de aire de hace miles de años. El cambio climático no es una impresión, es lo que aparece cuando se ordenan esos registros.',
      en:'There is a phrase you hear everywhere and that almost nobody explains: the climate is changing. Behind it there are stations that have been writing down temperature and rainfall every day for over a century, buoys at sea, balloons in the atmosphere and ice drilled at the poles that keeps air bubbles from thousands of years ago. Climate change is not an impression, it is what appears when those records are put in order.'
    }) + '</p>' +
    '<p>' + L({
      es:'Para discutirlo con cabeza propia necesitas tres cosas: saber de qué está hecho el clima de un lugar, saber por dónde entra la actividad humana en ese sistema, y saber distinguir un argumento que se apoya en datos de uno que solo suena convincente. De eso se trata esta guía.',
      en:'To discuss it with a mind of your own you need three things: to know what the climate of a place is made of, to know where human activity enters that system, and to tell an argument that rests on data from one that merely sounds convincing. That is what this guide is about.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a armar el clima de tres lugares moviendo solo su latitud y su altitud, a rastrear de qué fuente sale cada gas de efecto invernadero, a ordenar la cadena que va de la quema de combustibles hasta un clima distinto, a emparejar los cambios ya medidos con lo que provocan en México y en el mundo, y a pesar afirmaciones que circulan para quedarte con las que se sostienen.',
      en:'you are going to build the climate of three places by moving only their latitude and altitude, track which source each greenhouse gas comes from, order the chain that runs from burning fuel to a different climate, pair the changes already measured with what they bring about in Mexico and the world, and weigh claims going around so you keep the ones that hold up.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'De qué está hecho el clima de un lugar', en:'What the climate of a place is made of' }),
    '<p>' + L({
      es:'El estado del tiempo es lo que ocurre hoy afuera de tu ventana y puede cambiar mañana. El clima es el comportamiento promedio de esa atmósfera durante muchos años, treinta o más, en una región entera. Son dos escalas distintas, y confundirlas es el error más común de toda esta conversación.',
      en:'Weather is what is going on outside your window today and it can change tomorrow. Climate is the average behaviour of that atmosphere over many years, thirty or more, across a whole region. They are two different scales, and confusing them is the commonest mistake in this whole conversation.'
    }) + '</p>' +
    '<p>' + L({
      es:'El clima se describe con sus elementos, que son las magnitudes que se miden en una estación: temperatura, precipitación, humedad, viento y presión. Y se explica con sus factores, que son los rasgos del lugar que deciden cuánto vale cada elemento ahí: la latitud, la altitud, el relieve, la distancia al mar y las corrientes marinas. Los elementos son el resultado; los factores son la razón.',
      en:'Climate is described with its elements, the quantities measured at a station: temperature, precipitation, humidity, wind and pressure. And it is explained with its factors, the features of the place that decide how much each element comes to there: latitude, altitude, relief, distance from the sea and ocean currents. The elements are the result; the factors are the reason.'
    }) + '</p>' +
    '<p>' + L({
      es:'Ese juego de factores es lo que reparte los climas por el planeta y, con ellos, las regiones naturales: la selva húmeda cerca del ecuador, el desierto en las franjas secas, el bosque templado en las latitudes medias, la tundra cerca de los polos. Cada región natural es la vegetación y la fauna que un clima hace posible, y por eso un clima que se mueve arrastra consigo a los seres vivos que dependían de él.',
      en:'That set of factors is what spreads climates across the planet and, with them, the natural regions: the rainforest near the equator, the desert in the dry belts, the temperate forest at middle latitudes, the tundra near the poles. Each natural region is the vegetation and wildlife a climate makes possible, and that is why a climate on the move drags with it the living things that depended on it.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Latitud', en:'Latitude' }), L({ es:'distancia al ecuador', en:'distance to the equator' }), L({ es:'decide con qué inclinación llega el Sol', en:'it decides at what angle the Sun arrives' })) +
      rcard(L({ es:'Altitud', en:'Altitude' }), L({ es:'metros sobre el mar', en:'metres above the sea' }), L({ es:'a mayor altura, menor temperatura', en:'the higher up, the lower the temperature' })) +
      rcard(L({ es:'Relieve', en:'Relief' }), L({ es:'montañas y valles', en:'mountains and valleys' }), L({ es:'frena o deja pasar los vientos húmedos', en:'it blocks or lets through the damp winds' })) +
      rcard(L({ es:'Distancia al mar', en:'Distance from the sea' }), L({ es:'costa o interior', en:'coast or interior' }), L({ es:'el agua suaviza los extremos', en:'water softens the extremes' })) +
      rcard(L({ es:'Corrientes marinas', en:'Ocean currents' }), L({ es:'agua fría o cálida', en:'cold or warm water' }), L({ es:'llevan calor de una costa a otra', en:'they carry heat from one coast to another' })) +
    '</div>'
  );
  wFichas(rng, widgetHost(s1, 'w_fichas', 'dial'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'La manta de la atmósfera y quién la engrosa', en:'The blanket of the atmosphere and who thickens it' }),
    '<p>' + L({
      es:'La energía del Sol atraviesa la atmósfera, calienta la superficie y la superficie devuelve ese calor hacia el espacio. Algunos gases de la atmósfera retienen una parte de ese calor de salida y lo regresan hacia abajo. A eso se le llama efecto invernadero, es natural, y sin él la temperatura promedio del planeta estaría muy por debajo del punto de congelación. No es un problema: es la condición que hace habitable a la Tierra.',
      en:'The energy of the Sun crosses the atmosphere, warms the surface and the surface returns that heat towards space. Some gases in the atmosphere hold back part of that outgoing heat and send it back down. This is called the greenhouse effect, it is natural, and without it the average temperature of the planet would be well below freezing. It is not a problem: it is the condition that makes the Earth liveable.'
    }) + '</p>' +
    '<p>' + L({
      es:'El problema es la cantidad. Desde hace poco más de siglo y medio, la concentración de esos gases sube sin parar, y cada uno tiene su propio origen. El dióxido de carbono viene sobre todo de quemar carbón, petróleo y gas, y de los incendios y desmontes. El metano viene de la digestión del ganado, de la basura orgánica que se pudre sin aire y de las fugas de gas natural. El óxido nitroso viene principalmente de los fertilizantes con nitrógeno que se aplican en los cultivos. Los tres retienen calor, y saber de dónde sale cada uno es lo que permite señalar dónde intervenir.',
      en:'The problem is the amount. For a little over a century and a half, the concentration of those gases has risen without stopping, and each one has its own origin. Carbon dioxide comes mostly from burning coal, oil and gas, and from fires and land clearing. Methane comes from cattle digestion, from organic rubbish rotting without air and from natural gas leaks. Nitrous oxide comes mainly from nitrogen fertilisers applied to crops. All three hold heat, and knowing where each one comes from is what allows you to point at where to step in.'
    }) + '</p>'
  );
  wGases(rng, widgetHost(s2, 'w_gases', 'classify'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La cadena que va de la chimenea al clima', en:'The chain that runs from the chimney to the climate' }),
    '<p>' + L({
      es:'Entre encender un motor y que cambie el clima de una región hay una cadena de eslabones, y cada uno solo ocurre si el anterior ya ocurrió. Se queman combustibles, sube la concentración de gases, la atmósfera retiene más calor, sube la temperatura promedio del planeta y con ella se mueven los patrones de lluvia y de temporada. Ese último eslabón es el que la gente nota; el primero es el único que se puede decidir.',
      en:'Between switching on an engine and the climate of a region changing there is a chain of links, and each one only happens if the previous one already did. Fuels are burned, the concentration of gases rises, the atmosphere holds more heat, the average temperature of the planet rises and with it the rain and season patterns move. That last link is the one people notice; the first one is the only one that can be decided.'
    }) + '</p>' +
    '<p>' + L({
      es:'Dos detalles de la cadena valen oro para discutirla. El primero es que los gases ya emitidos permanecen en el aire durante décadas, así que dejar de emitir hoy no devuelve el clima de ayer mañana. El segundo es que hay actividades que pesan dos veces: derribar y quemar un bosque suelta el carbono que estaba guardado y, al mismo tiempo, elimina la vegetación que seguía retirando carbono del aire.',
      en:'Two details of the chain are worth gold when discussing it. The first is that gases already emitted stay in the air for decades, so stopping emissions today does not give back yesterday climate tomorrow. The second is that some activities weigh twice: felling and burning a forest releases the carbon that was stored and, at the same time, removes the vegetation that went on taking carbon out of the air.'
    }) + '</p>'
  );
  wCadena(rng, widgetHost(s3, 'w_cadena', 'timeline'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Lo que ya se registra en México y en el mundo', en:'What is already recorded in Mexico and the world' }),
    '<p>' + L({
      es:'La subida del promedio global parece pequeña escrita en grados, y sin embargo se traduce en cambios grandes donde vive la gente. En el norte de México las temporadas de sequía se alargan y las presas bajan; en el centro y el sur la lluvia anual llega concentrada en menos días, lo que significa laderas arrastradas y calles inundadas con el mismo total de agua de siempre. En las costas del Golfo y el Caribe, un mar más cálido entrega más energía a los huracanes y blanquea los arrecifes.',
      en:'The rise of the global average looks small written in degrees, and yet it turns into large changes where people live. In northern Mexico drought seasons stretch out and dams drop; in the centre and south the annual rain arrives concentrated into fewer days, which means slopes dragged away and streets flooded with the same total water as always. On the Gulf and Caribbean coasts, a warmer sea hands more energy to hurricanes and bleaches the reefs.'
    }) + '</p>' +
    '<p>' + L({
      es:'En el resto del mundo la lista es de la misma familia: glaciares que retroceden, nivel del mar que sube porque el agua caliente ocupa más lugar y porque el hielo derretido se suma, inviernos más cortos que dejan sobrevivir a plagas que antes morían de frío, y regiones naturales cuyos límites se desplazan porque las especies siguen al clima que les sirve. Cada uno de estos puntos es un registro, no un pronóstico.',
      en:'In the rest of the world the list is of the same family: glaciers retreating, sea level rising because warm water takes up more room and because melted ice adds to it, shorter winters that let pests survive when they used to die of cold, and natural regions whose limits shift because species follow the climate that suits them. Each of these points is a record, not a forecast.'
    }) + '</p>'
  );
  wEfectos(rng, widgetHost(s4, 'w_efectos', 'match'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Sostener una postura y no una consigna', en:'Holding a stand and not a slogan' }),
    '<p>' + L({
      es:'Tomar postura crítica ante el calentamiento global no es escoger bando ni repetir frases. Es hacerle a cada afirmación las mismas preguntas: cuánto tiempo abarca el dato que trae, qué tan grande es el territorio del que habla, quién lo midió y si se puede consultar. Con esas cuatro preguntas se cae sola la mayor parte de lo que circula, tanto lo que niega el problema como lo que lo exagera.',
      en:'Taking a critical stand on global warming is not picking a side nor repeating phrases. It is asking every claim the same questions: how much time the figure it brings covers, how large the territory it speaks of is, who measured it and whether it can be checked. With those four questions most of what goes around falls on its own, both what denies the problem and what exaggerates it.'
    }) + '</p>' +
    '<p>' + L({
      es:'La postura se vuelve activa cuando pasa del juicio a la acción, y una acción sirve cuando dice qué se hace, quién lo hace, cada cuándo y con qué dato se sabrá después si funcionó. Ahí caben las dos familias de respuestas: reducir lo que se emite, que es cortar el primer eslabón, y prepararse para lo que ya viene en camino, que es proteger a la gente y a los lugares del cambio que ya está medido. Una comunidad que solo se prepara nunca frena la causa; una que solo promete reducir deja desprotegidos a los suyos mientras tanto.',
      en:'The stand becomes active when it moves from judgement to action, and an action works when it says what is done, who does it, how often and which figure will show afterwards whether it worked. Both families of answers fit there: cutting what is emitted, which is breaking the first link, and getting ready for what is already on its way, which is protecting people and places from the change already measured. A community that only gets ready never slows the cause; one that only promises to cut leaves its own unprotected in the meantime.'
    }) + '</p>'
  );
  wArgumentos(rng, widgetHost(s5, 'w_argumentos', 'weigh'));
  wPostura(rng, widgetHost(s5, 'w_postura', 'reflect'));
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Para cerrar', en:'To finish' }),
    L({ es:'Un expediente completo', en:'A complete file' }),
    '<p>' + L({
      es:'El caso que sigue junta todas las piezas: registros de muchos años, actividades locales, efectos que ya se sienten y una decisión que tomar. Léelo con calma y elige el planteamiento que no deja nada fuera ni agrega nada que los datos no digan.',
      en:'The case below brings all the pieces together: records over many years, local activities, effects already felt and a decision to make. Read it calmly and choose the statement that leaves nothing out and adds nothing the data do not say.'
    }) + '</p>'
  );
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Cambio Climático: Causas y Postura Crítica';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
