<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mezclas Homogéneas y Heterogéneas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Mezclas Homogéneas y Heterogéneas</div>
    <div class="wcourse" id="wcourse-el">Química · Tercero de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Mezclas Homogéneas y Heterogéneas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1e1f47', primaryDark:'#18193b', primaryBg:'#eaeaf3',
  accent:'#c9a84c', accentBg:'#f7f1e3',
  darkPrimary:'#5e60ab', darkPrimaryDark:'#8b8dcf', darkPrimaryBg:'#151631',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function r1(x){ return Math.round(x * 10) / 10; }
function fmt(x){ var v = r1(x); return (Math.round(v) === v) ? String(Math.round(v)) : String(v); }
function lc(s){ return s.charAt(0).toLowerCase() + s.slice(1); }

/* cuatro opciones numericas distintas, la correcta en la posicion 0 */
function opts4(rng, correct, cands, unit){
  var u = unit || '', c0 = r1(correct);
  var out = [c0], pool = shuffle(cands, rng), i, k = 1, c;
  for (i = 0; i < pool.length && out.length < 4; i++){
    c = r1(pool[i]);
    if (c > 0 && out.indexOf(c) === -1) out.push(c);
  }
  while (out.length < 4){
    c = r1(c0 + k);
    if (c > 0 && out.indexOf(c) === -1) out.push(c);
    k++;
  }
  return out.map(function(x){ return fmt(x) + u; });
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ==========================================================================
   MANIPULATIVO 1 :: la lupa sobre el vaso, sube el aumento y clasifica
   ========================================================================== */
function w1(rng, host){
  var R = shuffle(MX, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false, z = 1, ch = '';

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Acerca la lupa', en:'Bring in the magnifier' }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Sube el aumento y observa el vaso. Cuando sepas si el contenido tiene una sola fase o varias, elige la clasificación y comprueba.',
      en:'Raise the magnification and watch the glass. When you know whether the contents have one phase or several, choose the classification and check.'
    }) + '</div>' +
    '<div class="mx-wrap">' +
      '<div class="mx-vessel" data-r="ves"></div>' +
      '<div class="mx-side">' +
        '<div class="gw-q" data-r="ttl"></div>' +
        '<div class="gw-mini" data-r="desc"></div>' +
        '<input class="gw-rng" type="range" min="1" max="24" step="1" value="1" data-r="z">' +
        '<div class="mx-zoom" data-r="zl"></div>' +
        '<div class="mx-note" data-r="note"></div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-lbl">' + L({ es:'Cómo se clasifica esta mezcla', en:'How this mixture is classified' }) + '</div>' +
    '<div class="gw-grid" data-r="cls"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elV = host.querySelector('[data-r="ves"]'),
      elT = host.querySelector('[data-r="ttl"]'),
      elD = host.querySelector('[data-r="desc"]'),
      elZ = host.querySelector('[data-r="z"]'),
      elZl = host.querySelector('[data-r="zl"]'),
      elN = host.querySelector('[data-r="note"]'),
      elC = host.querySelector('[data-r="cls"]'),
      elB = host.querySelector('[data-r="chk"]');

  function vessel(m){
    var html = '', bottom = 0, i;
    for (i = m.layers.length - 1; i >= 0; i--){
      html += '<div class="mx-fill ' + m.layers[i].c + '" style="bottom:' + bottom + '%;height:' + m.layers[i].h + '%"></div>';
      bottom += m.layers[i].h;
    }
    if (m.dots && z >= m.zmin){
      var sz = Math.min(10, Math.max(3, Math.round(2 + z * 0.35)));
      for (i = 0; i < m.dots; i++){
        var px = 6 + ((i * 37) % 84);
        var py = 8 + ((i * 53) % 62);
        html += '<div class="mx-dot ' + m.dcls + '" style="left:' + px + '%;bottom:' + py + '%;width:' + sz + 'px;height:' + sz + 'px"></div>';
      }
    }
    return html;
  }

  function draw(){
    var m = R[rd];
    elV.innerHTML = vessel(m);
    elT.innerHTML = L(m);
    elD.innerHTML = L(m.desc);
    elZl.innerHTML = L({ es:'Aumento: ', en:'Magnification: ' }) + z + 'x';
    if (m.kind === 'het' && z >= m.zmin){
      elN.innerHTML = L({ es:'Con este aumento se distinguen partes separadas dentro del vaso.',
                          en:'At this magnification, separate parts can be told apart inside the glass.' });
    } else if (m.kind === 'het'){
      elN.innerHTML = L({ es:'Por ahora todo se ve parejo. Prueba con más aumento antes de decidir.',
                          en:'So far everything looks even. Try more magnification before deciding.' });
    } else {
      elN.innerHTML = L({ es:'El contenido se sigue viendo continuo, sin partes que se puedan señalar aparte.',
                          en:'The contents still look continuous, with no parts that can be pointed at separately.' });
    }
    elC.innerHTML =
      '<button class="gw-tile' + (ch === 'hom' ? ' on' : '') + '" data-k="hom"' + (locked || done ? ' disabled' : '') + '>' + L({ es:'Homogénea', en:'Homogeneous' }) + '<small>' + L({ es:'una sola fase', en:'a single phase' }) + '</small></button>' +
      '<button class="gw-tile' + (ch === 'het' ? ' on' : '') + '" data-k="het"' + (locked || done ? ' disabled' : '') + '>' + L({ es:'Heterogénea', en:'Heterogeneous' }) + '<small>' + L({ es:'dos o más fases', en:'two or more phases' }) + '</small></button>';
    elZ.disabled = done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres mezclas revisadas. Lo que decide la clasificación no es el número de componentes, sino cuántas fases se pueden distinguir en la mezcla.',
        en:'Three mixtures reviewed. What decides the classification is not the number of components but how many phases can be told apart in the mixture.'
      }));
      return;
    }
    locked = false; tries = 0; z = 1; ch = '';
    elZ.value = '1';
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro vaso en la mesa. Vuelve a acercar la lupa.', en:'Another glass on the bench. Bring the magnifier in again.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente vaso', en:'Next glass' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var m = R[rd];
    if (ch === ''){
      say(host, 'warm', L({ es:'Falta elegir una clasificación.', en:'A classification is still missing.' }));
      return;
    }
    if (ch === m.kind){ close('good', L(m.role)); return; }
    tries++;
    if (tries >= 3){
      ch = m.kind;
      close('warm', L({ es:'Así queda: ', en:'This is how it reads: ' }) + L(m.role));
      return;
    }
    if (m.kind === 'het' && z < m.zmin){
      say(host, 'miss', L({ es:'Todavía no has usado suficiente aumento. Sube la lupa y mira de nuevo antes de decidir.',
                            en:'You have not used enough magnification yet. Raise the magnifier and look again before deciding.' }));
    } else if (m.kind === 'het'){
      say(host, 'miss', L({ es:'Fíjate en el vaso: hay partes que se pueden señalar por separado, y eso no ocurre cuando hay una sola fase.',
                            en:'Look at the glass: there are parts that can be pointed at separately, and that does not happen when there is a single phase.' }));
    } else {
      say(host, 'miss', L({ es:'Por más aumento que pongas no aparece ninguna frontera dentro del vaso. Revisa qué significa tener una sola fase.',
                            en:'No matter how much magnification you use, no boundary appears inside the glass. Review what having a single phase means.' }));
    }
  }

  elZ.addEventListener('input', function(){
    if (done) return;
    z = parseInt(elZ.value, 10);
    draw();
    var m = R[rd];
    if (m.kind === 'het' && z >= m.zmin){
      say(host, 'warm', L({ es:'Aparecieron partes separadas. Ya puedes decidir.', en:'Separate parts appeared. You can decide now.' }));
    } else if (z >= 20){
      say(host, '', L({ es:'Aumento al máximo. Si a 24x no aparece ninguna frontera, la mezcla no la tiene.',
                        en:'Magnification at maximum. If no boundary appears at 24x, the mixture does not have one.' }));
    }
  });
  elC.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || locked || done) return;
    ch = b.getAttribute('data-k');
    draw();
  });
  elB.addEventListener('click', check);
  draw();
  say(host, '', L({ es:'Mueve el control del aumento y observa qué cambia en el vaso.', en:'Move the magnification control and watch what changes in the glass.' }));
}

  host.innerHTML =

    '<div class="gw-q" data-r="ttl"></div>' +

      es:'Lee las propiedades que trae la mezcla y elige un método. Al elegirlo verás en qué se apoya; puedes cambiarlo cuantas veces quieras antes de comprobar.',
      en:'Read the properties the mixture carries and choose a method. Choosing it shows what it relies on; you may change it as often as you like before checking.'
    }) + '</div>' +
    '<div data-r="props"></div>' +
    '<div class="gw-lbl">' + L({ es:'Métodos disponibles', en:'Available methods' }) + '</div>' +
    '<div class="gw-grid wide" data-r="meth"></div>' +
    '<div class="mx-note" data-r="note"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elP = host.querySelector('[data-r="props"]'),
      elM = host.querySelector('[data-r="meth"]'),
      elN = host.querySelector('[data-r="note"]'),
      elB = host.querySelector('[data-r="chk"]');

  function draw(){
    var c = R[rd];
    elT.innerHTML = L(c.ttl);
    elP.innerHTML = c.props.map(function(p){ return chip(L(p)); }).join('');
    elM.innerHTML = METH.map(function(m){
      return '<button class="gw-tile' + (sel === m.k ? ' on' : '') + '" data-m="' + m.k + '"' + (locked || done ? ' disabled' : '') + '>' + L(m) + '</button>';
    }).join('');
    elN.innerHTML = sel
      ? '<span class="gw-val">' + L(methByK(sel)) + '</span> ' + L(methByK(sel).note) + '.'
      : L({ es:'Elige un método para ver en qué propiedad se apoya.', en:'Choose a method to see which property it relies on.' });
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres mezclas resueltas. El método nunca se escoge por costumbre: se escoge por la propiedad física en la que los componentes se diferencian.',
        en:'Three mixtures solved. The method is never chosen out of habit: it is chosen for the physical property in which the components differ.'
      }));
      return;
    }
    locked = false; tries = 0; sel = '';
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Llegó otra mezcla a la mesa. Revisa sus propiedades.', en:'Another mixture arrived at the bench. Review its properties.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente mezcla', en:'Next mixture' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var c = R[rd];
    if (!sel){
      say(host, 'warm', L({ es:'Todavía no hay un método elegido.', en:'No method has been chosen yet.' }));
      return;
    }
    if (sel === c.right){ close('good', L(c.why)); return; }
    tries++;
    if (tries >= 3){
      sel = c.right;
      close('warm', L({ es:'El método que funciona es ', en:'The method that works is ' }) + L(methByK(c.right)).toLowerCase() + '. ' + L(c.why));
      return;
    }
    var mn = L(methByK(sel));
    say(host, 'miss',
      (LANG === 'es' ? 'La ' + mn.toLowerCase() : mn) + ' ' + L(methByK(sel).note) +
      L({ es:', pero ', en:', but ' }) + L(c.nudge) + '.');
  }

  elM.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-m]');
    if (!b || locked || done) return;
    sel = b.getAttribute('data-m');
    draw();
  });
  elB.addEventListener('click', check);
  draw();
  say(host, '', L({ es:'Compara las propiedades de la mezcla con lo que aprovecha cada método.', en:'Compare the properties of the mixture with what each method relies on.' }));
}

/* ==========================================================================
   MANIPULATIVO 3 :: ajusta la etiqueta hasta dar la concentración pedida
   ========================================================================== */
function w3(rng, host){
  var R = shuffle(PROD, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false;
  var p = null, total = 0, tgt = 0, exact = 0, cur = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma la etiqueta', en:'Build the label' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve el control para cambiar la cantidad del componente activo. La etiqueta se recalcula al instante: detente cuando la concentración coincida con el objetivo.',
      en:'Move the control to change the amount of the active component. The label recalculates instantly: stop when the concentration matches the target.'
    }) + '</div>' +
    '<input class="gw-rng" type="range" min="0" max="100" step="1" value="0" data-r="rng">' +
    '<div class="lb-card" data-r="lab"></div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elR = host.querySelector('[data-r="rng"]'),
      elL = host.querySelector('[data-r="lab"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function modeName(){
    return p.mode === 'm'
      ? L({ es:'porcentaje en masa', en:'percentage by mass' })
      : L({ es:'porcentaje en volumen', en:'percentage by volume' });
  }

  function roundData(){
    var guard = 0;
    do {
      total = pk(rng, p.totals);
      tgt = pk(rng, p.pcts);
      exact = total * tgt / 100;
      guard++;
    } while (exact !== Math.round(exact) && guard < 40);
    exact = Math.round(exact);
    var f = pk(rng, [0.35, 0.5, 0.6, 1.4, 1.6]);
    cur = Math.min(total, Math.max(0, Math.round(exact * f)));
    if (cur === exact) cur = Math.max(0, exact - Math.max(2, Math.round(total * 0.05)));
    tries = 0; locked = false;
    elR.min = '0'; elR.max = String(total); elR.step = '1';
    elR.value = String(cur);
  }

  function pct(){ return total > 0 ? cur / total * 100 : 0; }

  function draw(){
    var pc = r1(pct());
    elT.innerHTML = L(p) + L({ es:'  ·  envase de ', en:'  ·  container of ' }) + total + ' ' + p.unit;
    elL.innerHTML =
      '<div class="lb-t">' + L({ es:'Etiqueta', en:'Label' }) + '</div>' +
      '<div class="lb-n">' + L(p) + '</div>' +
      '<div class="lb-r"><span>' + L({ es:'Contenido de ', en:'Content of ' }) + L(p.comp) + '</span><b>' + cur + ' ' + p.unit + '</b></div>' +
      '<div class="lb-r"><span>' + L({ es:'Producto completo', en:'Whole product' }) + '</span><b>' + total + ' ' + p.unit + '</b></div>' +
      '<div class="lb-r"><span>' + modeName() + '</span><b>' + fmt(pc) + ' %</b></div>' +
      '<div class="lb-bar"><span style="width:' + Math.min(100, pc) + '%"></span></div>' +
      '<div class="lb-tgt">' + L({ es:'Objetivo de esta etiqueta: ', en:'Target for this label: ' }) + tgt + ' % ' +
        (p.mode === 'm' ? L({ es:'en masa', en:'by mass' }) : L({ es:'en volumen', en:'by volume' })) + '</div>';
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Componente', en:'Component' }) + '</div><div class="v">' + cur + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Producto', en:'Product' }) + '</div><div class="v">' + total + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Diferencia', en:'Difference' }) + '</div><div class="v">' + fmt(r1(Math.abs(pc - tgt))) + '</div></div>';
    elR.disabled = locked || done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres etiquetas armadas. El porcentaje siempre compara la parte activa contra el producto completo, no contra el resto de los ingredientes.',
        en:'Three labels built. The percentage always compares the active part against the whole product, not against the rest of the ingredients.'
      }));
      return;
    }
    p = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro producto en el mostrador. Ajusta su etiqueta.', en:'Another product on the counter. Adjust its label.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente producto', en:'Next product' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = pct() - tgt;
    if (Math.abs(d) <= 0.25){
      close('good', L({ es:'Coincide. Con ' + cur + ' ' + p.unit + ' de ' + L(p.comp) + ' en ' + total + ' ' + p.unit + ' de producto, el ' + modeName() + ' es ' + cur + ' ÷ ' + total + ' × 100 = ' + fmt(r1(pct())) + ' %.',
                        en:'It matches. With ' + cur + ' ' + p.unit + ' of ' + L(p.comp) + ' in ' + total + ' ' + p.unit + ' of product, the ' + modeName() + ' is ' + cur + ' ÷ ' + total + ' × 100 = ' + fmt(r1(pct())) + ' %.' }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = exact;
      elR.value = String(cur);
      close('warm', L({ es:'La cantidad que da ' + tgt + ' % es ' + exact + ' ' + p.unit + ', porque esa parte cabe ' + fmt(r1(100 / tgt)) + ' veces en el producto completo.',
                        en:'The amount that gives ' + tgt + ' % is ' + exact + ' ' + p.unit + ', because that part fits ' + fmt(r1(100 / tgt)) + ' times into the whole product.' }));
      return;
    }
    say(host, 'miss', d > 0
      ? L({ es:'Vas ' + fmt(r1(d)) + ' puntos por arriba del objetivo: quita ' + L(p.comp) + '.',
            en:'You are ' + fmt(r1(d)) + ' points above the target: remove ' + L(p.comp) + '.' })
      : L({ es:'Faltan ' + fmt(r1(-d)) + ' puntos para el objetivo: agrega ' + L(p.comp) + '.',
            en:'You are ' + fmt(r1(-d)) + ' points short of the target: add ' + L(p.comp) + '.' }));
  }

  elR.addEventListener('input', function(){
    if (locked || done) return;
    cur = parseInt(elR.value, 10);
    draw();
    var d = pct() - tgt;
    if (Math.abs(d) <= 0.25){
      say(host, 'warm', L({ es:'La etiqueta ya marca el objetivo. Comprueba para confirmarlo.', en:'The label already shows the target. Check to confirm it.' }));
    } else if (d > 0){
      say(host, '', L({ es:'La etiqueta marca ' + fmt(r1(d)) + ' puntos de más.', en:'The label shows ' + fmt(r1(d)) + ' points too many.' }));
    } else {
      say(host, '', L({ es:'La etiqueta marca ' + fmt(r1(-d)) + ' puntos de menos.', en:'The label shows ' + fmt(r1(-d)) + ' points too few.' }));
    }
  });
  elB.addEventListener('click', check);
  p = R[0];
  roundData();
  draw();
  say(host, '', L({ es:'Mueve el control y observa cómo cambia el porcentaje de la etiqueta.', en:'Move the control and watch how the label percentage changes.' }));
}

/* ==========================================================================
   MANIPULATIVO 4 :: arma el tren de separación en el orden correcto
   ========================================================================== */
function w4(rng, host){
  var R = shuffle(TRAINS, rng);
  var rd = 0, tries = 0, locked = false, done = false, seq = [], pool = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Arma el tren de separación', en:'Build the separation train' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini" data-r="goal"></div>' +
    '<div class="gw-lbl">' + L({ es:'Tu secuencia', en:'Your sequence' }) + '</div>' +
    '<div class="sq-line" data-r="seq"></div>' +
    '<div class="gw-lbl">' + L({ es:'Toca un método para agregarlo, o toca un paso para quitarlo', en:'Tap a method to add it, or tap a step to remove it' }) + '</div>' +
    '<div class="gw-grid wide" data-r="pool"></div>' +
    '<div class="mx-note" data-r="note"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elG = host.querySelector('[data-r="goal"]'),
      elS = host.querySelector('[data-r="seq"]'),
      elP = host.querySelector('[data-r="pool"]'),
      elN = host.querySelector('[data-r="note"]'),
      elB = host.querySelector('[data-r="chk"]');

  function roundData(){
    pool = shuffle(R[rd].pool, rng);
    seq = []; tries = 0; locked = false;
  }

  function draw(){
    var t = R[rd];
    elT.innerHTML = L(t.ttl);
    elG.innerHTML = L(t.goal);
    if (seq.length === 0){
      elS.innerHTML = '<span class="sq-empty">' + L({ es:'Aún no hay pasos: la mezcla sigue igual.', en:'No steps yet: the mixture is unchanged.' }) + '</span>';
    } else {
      elS.innerHTML = seq.map(function(k, i){
        return (i > 0 ? '<span class="sq-arrow">→</span>' : '') +
          '<span class="sq-item" data-s="' + i + '"><b>' + (i + 1) + '</b>' + L(methByK(k)) + '</span>';
      }).join('');
    }
    elP.innerHTML = pool.map(function(k){
      var used = seq.indexOf(k) !== -1;
      return '<button class="gw-tile' + (used ? ' on' : '') + '" data-m="' + k + '"' + (locked || done || used ? ' disabled' : '') + '>' + L(methByK(k)) + '</button>';
    }).join('');
    elN.innerHTML = seq.length
      ? '<span class="gw-val">' + L(methByK(seq[seq.length - 1])) + '</span> ' + L(methByK(seq[seq.length - 1]).note) + '.'
      : L({ es:'La secuencia necesita ' + R[rd].order.length + ' pasos.', en:'The sequence needs ' + R[rd].order.length + ' steps.' });
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres trenes armados. En una mezcla de varios componentes el orden manda: primero se retira lo que sigue entero y al final se trabaja con lo que está disuelto.',
        en:'Three trains built. In a mixture of several components the order rules: first remove what is still whole and work with what is dissolved at the end.'
      }));
      return;
    }
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otra mezcla de varios componentes. Arma su tren.', en:'Another mixture of several components. Build its train.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente mezcla', en:'Next mixture' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var t = R[rd], i, first = -1;
    if (seq.length < t.order.length){
      say(host, 'warm', L({ es:'Falta al menos un paso para terminar el tren.', en:'At least one step is still missing to finish the train.' }));
      return;
    }
    for (i = 0; i < t.order.length; i++){ if (seq[i] !== t.order[i]){ first = i; break; } }
    if (first === -1){
      close('good', L(t.s1) + ' ' + L(t.s2));
      return;
    }
    tries++;
    if (tries >= 3){
      seq = t.order.slice();
      close('warm', L(t.s1) + ' ' + L(t.s2));
      return;
    }
    if (seq.length === t.order.length && seq[0] === t.order[1]){
      say(host, 'miss', L({ es:'Los dos métodos son los correctos, pero en ese orden no funciona. ', en:'Both methods are the right ones, but that order does not work. ' }) + L(t.bad));
      return;
    }
    say(host, 'miss',
      L({ es:'El paso ', en:'Step ' }) + (first + 1) +
      L({ es:' no encaja todavía: ', en:' does not fit yet: ' }) + L(methByK(seq[first])) + ' ' + L(methByK(seq[first]).note) +
      L({ es:', y eso no es lo que esta mezcla necesita en ese momento.', en:', and that is not what this mixture needs at that moment.' }));
  }

  elP.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-m]');
    if (!b || locked || done) return;
    var k = b.getAttribute('data-m');
    if (seq.indexOf(k) !== -1) return;
    if (seq.length >= R[rd].order.length){
      say(host, 'warm', L({ es:'El tren ya tiene todos sus pasos. Quita uno si quieres cambiarlo.', en:'The train already has all its steps. Remove one if you want to change it.' }));
      return;
    }
    seq.push(k);
    draw();
    say(host, '', L({ es:'Paso ' + seq.length + ' colocado. Puedes quitarlo tocándolo.', en:'Step ' + seq.length + ' placed. You can remove it by tapping it.' }));
  });
  elS.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-s]');
    if (!b || locked || done) return;
    seq.splice(parseInt(b.getAttribute('data-s'), 10), 1);
    draw();
    say(host, '', L({ es:'Paso retirado. Vuelve a armar la secuencia.', en:'Step removed. Build the sequence again.' }));
  });
  elB.addEventListener('click', check);
  roundData();
  draw();
  say(host, '', L({ es:'Piensa qué componente conviene retirar primero y arma la secuencia.', en:'Think which component is worth removing first and build the sequence.' }));
}

             en:'Percentages are not averaged when the masses differ: gather first the solute from both solutions and the total mass.' }),
    exp:L({ es:'La primera aporta ' + m1 + ' × ' + k1 + ' ÷ 100 = ' + x1 + ' g de soluto y la segunda ' + m2 + ' × ' + k2 + ' ÷ 100 = ' + x2 + ' g, en total ' + (x1 + x2) + ' g dentro de ' + m1 + ' + ' + m2 + ' = ' + tt + ' g de mezcla: ' + (x1 + x2) + ' ÷ ' + tt + ' × 100 = ' + res,
            en:'The first supplies ' + m1 + ' × ' + k1 + ' ÷ 100 = ' + x1 + ' g of solute and the second ' + m2 + ' × ' + k2 + ' ÷ 100 = ' + x2 + ' g, in total ' + (x1 + x2) + ' g inside ' + m1 + ' + ' + m2 + ' = ' + tt + ' g of mixture: ' + (x1 + x2) + ' ÷ ' + tt + ' × 100 = ' + res }),
    showWork:true
  };
}

function mkP10(rng){
  var V = [
    { title:{ es:'La leche vista de cerca', en:'Milk seen up close' },
      q:{ es:'La leche entera se ve como un líquido blanco parejo a simple vista, pero al microscopio se distinguen gotas de grasa repartidas en un líquido acuoso. ¿Cómo se describe esa mezcla?',
          en:'Whole milk looks like an even white liquid to the naked eye, but under the microscope fat droplets can be told apart, spread through a watery liquid. How is that mixture described?' },
      opts:{ es:['Heterogénea, con la grasa como fase dispersa en un medio acuoso','Homogénea, con la grasa como disolvente y el agua como soluto','Homogénea, porque a simple vista no se distinguen sus fases','Heterogénea, con el agua como fase dispersa dentro de la grasa'],
             en:['Heterogeneous, with the fat as the dispersed phase in a watery medium','Homogeneous, with the fat as the solvent and the water as the solute','Homogeneous, because its phases cannot be told apart with the naked eye','Heterogeneous, with the water as the dispersed phase inside the fat'] }, ci:0,
      hint:{ es:'Una mezcla se clasifica por las fases que existen en ella, y para reconocerlas vale usar aumento. Además, el medio continuo es el que contiene al otro.',

      exp:{ es:'Aunque parezca uniforme sin ayuda, hay más de una fase: las gotas de grasa forman la fase dispersa y el líquido acuoso, que las contiene, la fase dispersante. Por eso la leche es heterogénea.',
            en:'Even though it looks uniform without help, there is more than one phase: the fat droplets form the dispersed phase and the watery liquid holding them the dispersing phase. That is why milk is heterogeneous.' } },
    { title:{ es:'Dos vasos con azúcar', en:'Two glasses with sugar' },
      q:{ es:'Una alumna compara dos vasos: en el primero el azúcar desapareció por completo en el agua y en el segundo quedaron granos en el fondo por más que agitó. ¿Qué diferencia hay entre las dos mezclas?',
          en:'A student compares two glasses: in the first the sugar disappeared completely into the water and in the second grains stayed at the bottom no matter how much she stirred. What is the difference between the two mixtures?' },
      opts:{ es:['La primera tiene una sola fase y la segunda tiene dos','La primera tiene dos fases y la segunda tiene una sola','Las dos son homogéneas porque el soluto es el mismo','Las dos son heterogéneas porque en ambas hubo granos al inicio'],
             en:['The first has a single phase and the second has two','The first has two phases and the second has a single one','Both are homogeneous because the solute is the same','Both are heterogeneous because both had grains at the start'] }, ci:0,
      hint:{ es:'La clasificación describe cómo quedó la mezcla, no con qué materiales empezó ni cuánto se agitó.',
             en:'The classification describes how the mixture ended up, not what materials it started with nor how much it was stirred.' },
      exp:{ es:'En el primer vaso el azúcar quedó repartida hasta dejar una sola fase, así que esa mezcla es homogénea; en el segundo los granos que no se disolvieron forman una segunda fase, así que es heterogénea.',
            en:'In the first glass the sugar spread out until a single phase was left, so that mixture is homogeneous; in the second the grains that did not dissolve form a second phase, so it is heterogeneous.' } },
    { title:{ es:'La gelatina ya cuajada', en:'The set gelatine' },
      q:{ es:'Al preparar gelatina el polvo se reparte en agua caliente y la mezcla se ve uniforme; al enfriarse queda firme y al microscopio se distinguen fibras que retienen el agua entre ellas. ¿Cómo se describe la mezcla ya cuajada?',
          en:'When gelatine is prepared the powder spreads through hot water and the mixture looks uniform; on cooling it becomes firm and under the microscope fibres can be told apart, holding water between them. How is the set mixture described?' },
      opts:{ es:['Heterogénea, con las fibras como fase dispersa y el agua retenida entre ellas','Homogénea, porque el polvo se repartió por completo en el agua caliente','Homogénea, porque la gelatina firme se ve igual en todos sus puntos','Heterogénea, porque el agua caliente convirtió al polvo en otra sustancia'],
             en:['Heterogeneous, with the fibres as the dispersed phase and water held between them','Homogeneous, because the powder spread completely through the hot water','Homogeneous, because the firm gelatine looks the same at every point','Heterogeneous, because the hot water turned the powder into another substance'] }, ci:0,
      hint:{ es:'Fíjate en lo que revela el aumento y recuerda que mezclar no convierte una sustancia en otra.',
             en:'Notice what magnification reveals and remember that mixing does not turn one substance into another.' },
      exp:{ es:'El aumento revela dos fases: las fibras repartidas y el agua que queda retenida entre ellas, así que la mezcla es heterogénea. El polvo tampoco se convirtió en otra sustancia, solo quedó repartido.',
            en:'Magnification reveals two phases: the spread fibres and the water held between them, so the mixture is heterogeneous. The powder did not turn into another substance either, it only spread out.' } }
  ];
  var v = V[Math.floor(rng() * V.length)];
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:v.ci, hint:L(v.hint), exp:L(v.exp), showWork:false };
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
