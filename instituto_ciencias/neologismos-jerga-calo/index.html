<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neologismos, Jerga, Caló y Préstamos Lingüísticos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Neologismos, Jerga, Caló y Préstamos Lingüísticos</div>
    <div class="wcourse" id="wcourse-el">Español · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Neologismos, Jerga, Caló y Préstamos Lingüísticos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#cc243c', primaryDark:'#480b14', primaryBg:'#f6e7e9',
  accent:'#fc0c24', accentBg:'#ffdbdf',
  darkPrimary:'#c74255', darkPrimaryDark:'#e87283', darkPrimaryBg:'#3b0b12',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });
    if (answeredCount === problems.length && problems.length > 0) {

    }
  }

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });

}

  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp3_t07_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

        advance('');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.marks = {}; st.marks[it.k] = 'rev';
        paint(T('La palabra era ' + L(goal.p) + ', y significa ' + L(goal.g) + '. Vuelve a leer la línea donde aparece.',
                'The word was ' + L(goal.p) + ', and it means ' + L(goal.g) + '. Read again the line where it appears.'));
        advance('');
        return;
      }
      st.marks = {}; st.marks[key] = 'miss';
      paint(got.tipo === goal.tipo
        ? T('Esa palabra pertenece al mismo vocabulario que buscas, pero nombra otra cosa. Relee la pregunta y fíjate de qué se habla.',
            'That word belongs to the same vocabulary you are after, but it names something else. Reread the question and see what is being talked about.')
        : (goal.tipo === 0

                'That word is shared by the whole neighbourhood, and what you are after is used only inside the workshop.')));
    };
    paint('');
  }

  function widgetPrestamos() {
    var LG = [
      { n:{ es:'náhuatl',  en:'Nahuatl' },
        z:{ es:'plantas, animales y alimentos del centro de México',    en:'plants, animals and foods of central Mexico' } },
      { n:{ es:'árabe',    en:'Arabic' },
        z:{ es:'la agricultura, la casa y las ciencias del medievo, y muchas empiezan por al-', en:'farming, the house and medieval sciences, and many begin with al-' } },
      { n:{ es:'inglés',   en:'English' },
        z:{ es:'la tecnología y el deporte, y son las llegadas más recientes', en:'technology and sport, and they are the most recent arrivals' } },
      { n:{ es:'francés',  en:'French' },
        z:{ es:'la cocina, la moda y los oficios que se pusieron de moda en el siglo XIX', en:'cooking, fashion and the trades that came into fashion in the nineteenth century' } },
      { n:{ es:'italiano', en:'Italian' },
        z:{ es:'la música y la comida que viajó con los migrantes', en:'music and the food that travelled with migrants' } }
    ];
    var PAL = [
      { p:{ es:'jitomate', en:'jitomate' }, lg:0 },
      { p:{ es:'almohada', en:'almohada' }, lg:1 },
      { p:{ es:'software', en:'software' }, lg:2 },
      { p:{ es:'chofer',   en:'chofer'   }, lg:3 },
      { p:{ es:'pizza',    en:'pizza'    }, lg:4 }
    ];
    var st = { left: perm(PAL.length), right: perm(LG.length), sel:null, ok:{}, tries:0, n:0, done:false };
    var w = widgetBox('wPrest', 'match');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('De dónde llegó cada palabra', 'Where each word arrived from') + '</div>' +
          '<div class="iw-sub">' + T('Las cinco palabras quedaron unidas a la lengua que las trajo al español.',
                                     'The five words are now joined to the language that brought them into Spanish.') + '</div>' +
          '<div class="iw-fb"><span class="iw-ok">' + T('Mesa completa: ', 'Table complete: ') + st.n + ' / ' + PAL.length + '</span></div>';
        return;
      }
      var lcol = st.left.map(function (pi) {
        var cls = 'mtchip' + (st.ok[pi] ? ' done' : (st.sel === pi ? ' sel' : ''));
        return '<button class="' + cls + '" onclick="prLeft(' + pi + ')">' + L(PAL[pi].p) + '</button>';
      }).join('');
      var rcol = st.right.map(function (gi) {
        var used = PAL.some(function (p, pi) { return st.ok[pi] && p.lg === gi; });
        return '<button class="mtchip' + (used ? ' done' : '') + '" onclick="prRight(' + gi + ')">' + L(LG[gi].n) + '</button>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('De dónde llegó cada palabra', 'Where each word arrived from') + '</div>' +
        '<div class="iw-sub">' + T('Toca una palabra del español y después la lengua de la que proviene.',
                                   'Tap a Spanish word and then the language it comes from.') + '</div>' +
        '<div class="mtcols"><div><div class="mthead">' + T('Palabras del español', 'Spanish words') + '</div>' + lcol + '</div>' +
        '<div><div class="mthead">' + T('Lenguas de origen', 'Source languages') + '</div>' + rcol + '</div></div>' +
        '<div class="iw-fb" id="prFb">' + (fb || '') + '</div>';
    }
    window.prLeft = function (pi) {
      if (st.done || st.ok[pi]) return;
      st.sel = (st.sel === pi ? null : pi);
      st.tries = 0;
      paint('');
    };
    window.prRight = function (gi) {
      if (st.done) return;
      if (st.sel === null) {
        var f0 = document.getElementById('prFb');
        if (f0) f0.textContent = T('Elige primero una palabra del español, y después la lengua.',
                                   'Choose a Spanish word first, and then the language.');
        return;
      }
      var pal = PAL[st.sel];
      if (pal.lg === gi) {
        st.ok[st.sel] = true; st.n++; st.tries = 0;
        var m = T('Correcto: ' + L(pal.p) + ' llegó del ' + L(LG[gi].n) + ', de donde el español tomó sobre todo ' + L(LG[gi].z) + '.',
                  'Correct: ' + L(pal.p) + ' came from ' + L(LG[gi].n) + ', from which Spanish took above all ' + L(LG[gi].z) + '.');
        st.sel = null;
        if (st.n >= PAL.length) { st.done = true; paint(''); return; }
        paint('<span class="iw-ok">' + m + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var g = pal.lg;
        st.ok[st.sel] = true; st.n++; st.tries = 0; st.sel = null;
        var rev = T('Era el ' + L(LG[g].n) + ': de esa lengua el español tomó ' + L(LG[g].z) + ', y ' + L(pal.p) + ' viajó con ese grupo.',
                    'It was ' + L(LG[g].n) + ': from that language Spanish took ' + L(LG[g].z) + ', and ' + L(pal.p) + ' travelled with that group.');
        if (st.n >= PAL.length) { st.done = true; paint(''); return; }
        paint(rev);
        return;
      }
      document.getElementById('prFb').textContent =
        T('Todavía no. De esa lengua el español tomó sobre todo ' + L(LG[gi].z) + ', y la palabra que elegiste no pertenece a ese campo.',
          'Not yet. From that language Spanish took above all ' + L(LG[gi].z) + ', and the word you chose does not belong to that field.');
    };
    paint('');
  }

  /* ═════════ constructor de tarjetas ═════════ */
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: false,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }
  function put(spec) {
    addP({
      title: spec.title, q: spec.q, hint: spec.hint, exp: spec.exp,
      options: spec.options, correct: spec.options[spec.ci]
    });
  }

               en:'All three are answers of Spanish to the need to name something, and each one arrived by a different route: one was formed with pieces of the language, another reassigned the meaning of an existing word and the third was taken from another language and adapted. The dynamism of the language consists exactly in that.' },

          { es:'Que las tres resuelven una necesidad de nombrar, y cada una lo hace por una vía distinta del mismo idioma.',
            en:'That all three solve a need to name, and each one does it by a different route of the same language.' },
          { es:'Que las tres se formaron añadiendo una pieza inicial a una palabra que el español ya tenía registrada.',
            en:'That all three were formed by adding an initial piece to a word Spanish already had registered.' },
          { es:'Que las tres proceden de una lengua distinta del español y conservan la forma con la que llegaron.',
            en:'That all three come from a language other than Spanish and keep the form they arrived with.' },
          { es:'Que las tres circulan solo dentro de un grupo reducido y fuera de él resultan incomprensibles.',
            en:'That all three circulate only inside a small group and outside it they are incomprehensible.' }
        ],
        ci: 0
      };
    }
    return {
      title: { es:'El argumento del compañero', en:'The argument of the classmate' },
      q: { es:'Un compañero sostiene que el español ya no crea palabras y que ahora solo copia las del inglés. Determina qué evidencia de los tres textos desmiente esa afirmación con mayor fuerza.',
           en:'A classmate maintains that Spanish no longer creates words and now only copies those of English. Determine which evidence from the three texts refutes that claim most strongly.' },
        hint: { es:'Busca los casos en los que no entró nada de fuera: palabras armadas con material del idioma y significados nuevos dados a palabras viejas.',
                en:'Look for the cases where nothing came in from outside: words assembled from the material of the language and new meanings given to old words.' },
        exp: { es:'La evidencia más fuerte son los casos en los que no interviene ninguna lengua extranjera: el poema forma palabras nuevas con prefijos, sufijos y palabras del propio español, y el taller produce significados nuevos para palabras que ya existían. Los préstamos son una vía más, no la única.',
               en:'The strongest evidence are the cases where no foreign language intervenes: the poem forms new words with prefixes, suffixes and words of Spanish itself, and the workshop produces new meanings for words that already existed. Borrowings are one more route, not the only one.' },
        options: [
          { es:'Que el poema arma palabras con piezas del propio español y el taller da significados nuevos a palabras que ya existían.',
            en:'That the poem assembles words from pieces of Spanish itself and the workshop gives new meanings to words that already existed.' },
          { es:'Que la bitácora traduce al español todos los términos del inglés antes de escribirlos en el reporte del club.',
            en:'That the logbook translates every English term into Spanish before writing it in the club report.' },
          { es:'Que en la lista del club quedaron dos palabras que provienen de una lengua distinta del inglés.',
            en:'That two words coming from a language other than English remained on the club list.' },
          { es:'Que el cuento evita por completo las palabras llegadas de otras lenguas en boca de todos sus personajes.',
            en:'That the story completely avoids words arrived from other languages in the mouth of all its characters.' }
        ],
        ci: 0
      };
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Una lengua que sigue fabricando palabras', 'A language that keeps manufacturing words'),
      '<p>' + T('Ninguna lengua viva tiene su lista de palabras terminada. Todos los días aparecen objetos, oficios, aparatos y sensaciones que todavía no tienen nombre, y los hablantes resuelven ese hueco sin pedirle permiso a nadie. A cada palabra recién creada, o a cada significado nuevo que recibe una palabra vieja, se le llama neologismo. Una palabra nueva no es un error: es una respuesta. Y no llega de cualquier manera, sino por unas pocas vías que se pueden reconocer. Unas veces el idioma fabrica la palabra con material propio, pegándole a una base un prefijo o un sufijo, o juntando dos palabras enteras en una sola. Otras veces la toma de una lengua vecina y la adopta, con su escritura original o con la nuestra. Otras veces recorta una expresión larga hasta dejar una forma breve. Y hay una vía más, la que menos se nota: un grupo se queda con una palabra que ya existía y le da un significado propio, que solo entiende quien pertenece a ese grupo. Los tres textos que siguen fueron reunidos para ver esas vías trabajando por separado.',
                'No living language has its list of words finished. Every day objects, trades, devices and sensations appear that still have no name, and speakers fill that gap without asking anyone for permission. Every freshly created word, or every new meaning an old word receives, is called a neologism. A new word is not a mistake: it is an answer. And it does not arrive in just any way, but through a few routes that can be recognised. Sometimes the language manufactures the word from its own material, attaching a prefix or a suffix to a base, or joining two whole words into one. Sometimes it takes it from a neighbouring language and adopts it, with its original spelling or with ours. Sometimes it clips a long expression down to a short form. And there is one more route, the least noticed: a group keeps a word that already existed and gives it a meaning of its own, understood only by whoever belongs to that group. The three texts that follow were gathered to see those routes working separately.') + '</p>' +
      block1() + block2() + block3() +
      '<div class="notebox"><div class="notelbl">' + T('Las vías que vas a rastrear', 'The routes you are going to trace') + '</div>' +
        '<div class="glosslist">' + VIA.map(function (v) {
          return '<div class="gloss"><div class="glossn">' + L(v.n) + '</div><div class="glossd">' + L(v.d) + '</div></div>';
        }).join('') + '</div></div>' +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('ante cada palabra rara pregunta si el español pudo fabricarla con piezas propias, si vino de otra lengua, o si es una palabra común a la que un grupo le cambió el significado. Esa pregunta ordena todo lo que sigue.',
          'faced with each strange word, ask whether Spanish could have manufactured it from its own pieces, whether it came from another language, or whether it is a common word a group changed the meaning of. That question orders everything that follows.') +
        (ES ? '' : ' The words under study stay in Spanish, since they are the object of the analysis.') + '</p></div>');
  widgetVias();
  put(q1());
  put(q2());

  sec(T('Invención', 'Invention'),
      T('Palabras que un autor pone a funcionar', 'Words an author sets to work'),
      '<p>' + T('El Texto II hace algo que la literatura ha hecho siempre: inventar palabras a propósito y confiar en que el lector las entienda. Ese es el neologismo de autor, y su regla es más estricta de lo que parece. Para que funcione, la palabra inventada tiene que estar construida con piezas que el idioma ya emplea en otras palabras, porque solo así el lector puede deducir su sentido sin detenerse a preguntar. Los prefijos y los sufijos del español son productivos, es decir, siguen sirviendo para formar palabras nuevas: la terminación que forma verbos de acción a partir de un sustantivo, la que nombra a quien ejecuta una acción, la pieza inicial que invierte lo que dice la base, la que añade repetición. Junto a estos recursos existe otro, todavía más antiguo, que consiste en imitar con sonidos aquello que se nombra, y a ese se le llama onomatopeya. Conviene separar dos cosas que suelen confundirse: una palabra puede estar perfectamente formada y no aparecer en ningún diccionario, porque el diccionario registra lo que la comunidad ya usa y llega siempre después. Un neologismo de autor vive en su texto; un neologismo de uso lo repite todo el mundo.',
                'Text II does what literature has always done: invent words on purpose and trust the reader to understand them. That is the author neologism, and its rule is stricter than it seems. For it to work, the invented word has to be built with pieces the language already employs in other words, because only then can the reader deduce its sense without stopping to ask. Spanish prefixes and suffixes are productive, that is, they still serve to form new words: the ending that forms action verbs out of a noun, the one that names whoever performs an action, the initial piece that reverses what the base says, the one that adds repetition. Alongside these resources there is another, even older, which consists of imitating with sounds the thing being named, and that one is called onomatopoeia. Two things that are often confused are worth separating: a word may be perfectly formed and not appear in any dictionary, because the dictionary records what the community already uses and always arrives afterwards. An author neologism lives in its text; a neologism of use is repeated by everybody.') + '</p>');
  widgetLab();
  put(q3());
  put(q4());

  sec(T('Grupos', 'Groups'),
      T('Jerga y caló: dos vocabularios que se aprenden por dentro', 'Jargon and caló: two vocabularies learned from inside'),
      '<p>' + T('El Texto I pone en la misma escena dos vocabularios que suelen confundirse y que conviene separar con cuidado. La jerga es el vocabulario técnico de un oficio, una profesión o una afición, y existe porque ese trabajo necesita distinguir cosas que el español general no distingue con una sola palabra. Quien repara motores tiene que nombrar con exactitud una falla concreta, y por eso dispone de un término que fuera del taller no le hace falta a nadie. La jerga no oculta: precisa. El caló, en cambio, nació en los barrios y funciona de otro modo. Casi nunca inventa formas nuevas: toma palabras comunes del español y les asigna un significado propio que un oyente externo no puede adivinar. Ese desplazamiento cumple dos funciones a la vez, porque expresa con humor y con fuerza lo que la palabra corriente diría de manera plana, y al mismo tiempo marca quién pertenece al grupo y quién viene de fuera. En un texto literario, ninguno de los dos aparece por adorno. Cuando un narrador conserva las palabras de su taller y de su barrio, está construyendo su voz: sin ellas, el personaje podría ser cualquiera, de cualquier edad y de cualquier lugar.',
                'Text I puts in the same scene two vocabularies that are often confused and worth separating carefully. Jargon is the technical vocabulary of a trade, a profession or a hobby, and it exists because that work needs to distinguish things general Spanish does not distinguish with a single word. Whoever repairs engines has to name a specific fault exactly, and that is why they have a term nobody needs outside the workshop. Jargon does not hide: it specifies. Caló, on the other hand, was born in the neighbourhoods and works another way. It almost never invents new forms: it takes common Spanish words and assigns them a meaning of their own that an outside listener cannot guess. That displacement fulfils two functions at once, because it expresses with humour and force what the ordinary word would say flatly, and at the same time marks who belongs to the group and who comes from outside. In a literary text, neither of the two appears as ornament. When a narrator keeps the words of his workshop and his neighbourhood, he is building his voice: without them, the character could be anybody, of any age and from any place.') + '</p>');
  widgetCaza();
  put(q5());
  put(q6());

  sec(T('Préstamos', 'Borrowings'),
      T('Palabras que llegaron desde otra lengua', 'Words that arrived from another language'),
      '<p>' + T('Un préstamo lingüístico es una palabra que el español tomó de otra lengua y adoptó como propia. El español lleva siglos haciéndolo, y por eso buena parte del vocabulario que usamos a diario entró alguna vez desde fuera: del árabe llegaron cientos de términos de la agricultura y de la casa, del náhuatl y de otras lenguas americanas llegaron los nombres de plantas, animales y alimentos, del francés vinieron palabras de cocina y de oficios, del italiano las de la música. Cuando el préstamo es reciente y todavía conserva la forma de la lengua de origen se le llama extranjerismo crudo, y suele escribirse en cursiva para marcar que sigue siendo ajeno. Con el tiempo, muchos se adaptan: cambian su escritura, se acentúan según nuestras reglas, forman plural como cualquier palabra nuestra y, si son verbos, se conjugan. Un tercer caso no copia la forma sino la estructura: cada pieza del término extranjero se traduce por una palabra española y el resultado queda armado con material propio, y a eso se le llama calco. La prueba de que un préstamo terminó de instalarse no es su origen, que no cambia nunca, sino que los hablantes hayan dejado de percibirlo como venido de fuera.',
                'A linguistic borrowing is a word Spanish took from another language and adopted as its own. Spanish has been doing it for centuries, and that is why a good part of the vocabulary we use daily once came in from outside: from Arabic hundreds of farming and household terms arrived, from Nahuatl and other American languages came the names of plants, animals and foods, from French came words of cooking and trades, from Italian those of music. When the borrowing is recent and still keeps the form of the source language it is called a raw foreign word, and it is usually written in italics to mark that it remains alien. Over time many adapt: they change their spelling, take accents according to our rules, form plurals like any of our words and, if they are verbs, get conjugated. A third case copies not the form but the structure: each piece of the foreign term is translated by a Spanish word and the result ends up assembled from native material, and that is called a calque. The proof that a borrowing finished settling in is not its origin, which never changes, but that speakers have stopped perceiving it as coming from outside.') + '</p>');
  widgetPrestamos();
  put(q7());
  put(q8());

  sec(T('Valoración', 'Appraisal'),
      T('Novedad no es error', 'Novelty is not error'),
      '<p>' + T('Queda una última pieza, y es la que más consecuencias tiene fuera del salón. Las palabras nuevas y las palabras de grupo despiertan con frecuencia un rechazo que se presenta como defensa del idioma, y conviene mirarlo de cerca. Un diccionario no autoriza palabras: las registra cuando el uso ya las fijó, de modo que su ausencia prueba que una palabra es reciente, no que sea incorrecta. Y decir que el habla de un barrio o de un oficio está mal dicha no describe la lengua, describe a las personas que la hablan, y a eso se le llama prejuicio lingüístico. Lo que sí existe es la adecuación: una palabra encaja o no encaja en la situación donde se usa. El vocabulario del taller es exacto frente a un motor abierto y opaco en un examen de física; el caló sostiene la voz de un narrador y desentona en una carta a una autoridad. Por eso, en literatura, la pregunta útil nunca es si una palabra es correcta, sino qué hace ahí: a quién retrata, qué situación reconstruye y qué se perdería si se sustituyera por su equivalente general.',
                'One last piece remains, and it is the one with the most consequences outside the classroom. New words and group words frequently awaken a rejection presented as defence of the language, and it is worth looking at closely. A dictionary does not authorise words: it records them when use has already fixed them, so their absence proves a word is recent, not that it is incorrect. And saying that the speech of a neighbourhood or a trade is badly spoken does not describe the language, it describes the people who speak it, and that is called linguistic prejudice. What does exist is suitability: a word fits or does not fit the situation where it is used. The vocabulary of the workshop is exact in front of an open engine and opaque in a physics exam; caló sustains the voice of a narrator and jars in a letter to an authority. That is why, in literature, the useful question is never whether a word is correct, but what it is doing there: whom it portrays, what situation it reconstructs and what would be lost if it were replaced by its general equivalent.') + '</p>');
  put(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('El idioma se mueve mientras lo usas', 'The language moves while you use it'),
      '<p>' + T('Lo que hiciste con estos tres textos puedes hacerlo con cualquier conversación de tu día. En la escuela, en la cancha, en el trabajo de alguien de tu familia hay palabras que un diccionario no registra todavía y que sin embargo funcionan perfectamente, porque están armadas con piezas del idioma, porque llegaron de otra lengua o porque un grupo decidió darles un significado nuevo. Reconocer por dónde llegó cada una es lo que te permite usarlas donde encajan y explicarlas cuando alguien de fuera no las entiende.',
                'What you did with these three texts you can do with any conversation of your day. At school, on the court, in the work of somebody in your family there are words a dictionary does not record yet and which nevertheless work perfectly, because they are assembled from pieces of the language, because they arrived from another tongue or because a group decided to give them a new meaning. Recognising which route each one came by is what lets you use them where they fit and explain them when somebody from outside does not understand them.') + '</p>');
  widgetCuaderno();
  put(q10());
}
</script>
