      hint: L({es:'Escribe una ecuación para la suma y otra para la diferencia usando las mismas dos letras. Súmalas y observa qué pasa con la letra del número menor.',
               en:'Write one equation for the sum and another for the difference using the same two letters. Add them and watch what happens to the letter of the smaller number.'}),
      exp: L({es:'Con m + n = '+S+' y m − n = '+D+', al sumar las dos ecuaciones la columna de n se anula y queda 2m = '+(S+D)+', de donde m = '+mayor+'. El otro número resulta '+menor+', y la comprobación da '+mayor+' + '+menor+' = '+S+'.',
              en:'With m + n = '+S+' and m − n = '+D+', adding the two equations cancels the n column and leaves 2m = '+(S+D)+', so m = '+mayor+'. The other number turns out to be '+menor+', and the check gives '+mayor+' + '+menor+' = '+S+'.'})
    });
    var ancho=ri(8,18), exceso=ri(3,12), largo=ancho+exceso, Per=2*(largo+ancho);
    V.push({
      title: L({es:'La cancha rectangular', en:'The rectangular court'}),
      q: L({es:'Una cancha rectangular tiene '+Per+' metros de perímetro y su largo excede al ancho en '+exceso+' metros. ¿Cuánto mide el largo?',
            en:'A rectangular court has a perimeter of '+Per+' meters and its length exceeds its width by '+exceso+' meters. How long is the length?'}),
      fn:'',
      options: optsN(largo, [ancho, largo+2, largo-5, Math.round(Per/4)]), correct: num(largo), showWork:true,
      hint: L({es:'Una letra para el largo y otra para el ancho. El perímetro da una ecuación y la frase sobre el exceso da la otra; conviene simplificar la del perímetro antes de combinarlas.',
               en:'One letter for the length and another for the width. The perimeter gives one equation and the sentence about the excess gives the other; it helps to simplify the perimeter one before combining them.'}),
      exp: L({es:'Del perímetro sale l + a = '+(Per/2)+' y del enunciado l − a = '+exceso+'. Al sumar ambas ecuaciones la columna de a se anula y queda 2l = '+(Per/2+exceso)+', así que el largo mide '+largo+'.',
              en:'From the perimeter comes l + a = '+(Per/2)+' and from the wording l − a = '+exceso+'. Adding both equations cancels the a column and leaves 2l = '+(Per/2+exceso)+', so the length measures '+largo+'.'})
    });
    addProb(V[Math.floor(rng()*V.length)]);
  })();

  /* ── PROBLEMA 10 ── */
  (function(){
    var V = [];
    var m5=ri(7,16), m10=ri(6,15), NM=m5+m10, TM=5*m5+10*m10;
    V.push({
      title: L({es:'La alcancía del grupo', en:'The group piggy bank'}),
      q: L({es:'En la alcancía de un grupo hay '+NM+' monedas, todas de cinco o de diez pesos, y juntas suman '+TM+' pesos. ¿Cuántas monedas de diez pesos hay?',
            en:'A group piggy bank holds '+NM+' coins, all of five or ten pesos, and together they add up to '+TM+' pesos. How many ten peso coins are there?'}),
      fn:'',
      options: optsN(m10, [m5, m10+4, m10-3, NM-2]), correct: num(m10), showWork:true,
      hint: L({es:'Una letra cuenta monedas de cinco y otra monedas de diez. El conteo de monedas da una ecuación y el dinero da la otra; multiplica la del conteo por cinco antes de restarla.',
               en:'One letter counts five peso coins and another counts ten peso coins. The coin count gives one equation and the money gives the other; multiply the counting one by five before subtracting it.'}),
      exp: L({es:'El sistema es c + d = '+NM+' junto con 5c + 10d = '+TM+'. Multiplicando el primero por 5 y restándolo del segundo queda 5d = '+(TM-5*NM)+', de donde d = '+m10+'.',
              en:'The system is c + d = '+NM+' together with 5c + 10d = '+TM+'. Multiplying the first by 5 and subtracting it from the second leaves 5d = '+(TM-5*NM)+', so d = '+m10+'.'})
    });
    var gan=ri(5,12), emp=ri(3,9), JU=gan+emp, PU=3*gan+emp;
    V.push({
      title: L({es:'Puntos del torneo', en:'Tournament points'}),
      q: L({es:'Un equipo escolar jugó '+JU+' partidos, todos ganados o empatados, y terminó con '+PU+' puntos. Cada partido ganado da tres puntos y cada empate da uno. ¿Cuántos partidos ganó el equipo?',
            en:'A school team played '+JU+' matches, all of them won or drawn, and finished with '+PU+' points. Each win gives three points and each draw gives one. How many matches did the team win?'}),
      fn:'',
      options: optsN(gan, [emp, gan+3, gan-2, JU-1]), correct: num(gan), showWork:true,
      hint: L({es:'Una letra para los partidos ganados y otra para los empatados. Un dato cuenta partidos y el otro cuenta puntos; al restar el conteo de partidos del conteo de puntos, los empates desaparecen.',
               en:'One letter for matches won and another for matches drawn. One fact counts matches and the other counts points; subtracting the match count from the point count makes the draws disappear.'}),
      exp: L({es:'El sistema es g + e = '+JU+' junto con 3g + e = '+PU+'. Al restar la primera ecuación de la segunda, la columna de e se anula y queda 2g = '+(PU-JU)+', de donde g = '+gan+'.',
              en:'The system is g + e = '+JU+' together with 3g + e = '+PU+'. Subtracting the first equation from the second cancels the e column and leaves 2g = '+(PU-JU)+', so g = '+gan+'.'})
    });
    addProb(V[Math.floor(rng()*V.length)]);
  })();
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Sistemas de Ecuaciones: Eliminación y Problemas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
