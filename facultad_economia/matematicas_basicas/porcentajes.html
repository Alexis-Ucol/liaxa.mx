<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porcentajes y Razones Proporcionales · Matemáticas Básicas</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#1a4a8a;--green-dark:#0f2d5a;--green-bg:#e8edf5;--gold:#c9a84c;--gold-bg:#faf3e0;--bg:#f8f6f1;--surface:#fff;--surface2:#f0ede6;--border:#ddd8cc;--text:#1a1a16;--text2:#4a4640;--text3:#7a7468;--ok:#2d6a4f;--ok-bg:rgba(45,106,79,.10);--bad:#8b2500;--bad-bg:rgba(139,37,0,.08);--shadow:0 4px 20px rgba(0,0,0,.09);}
[data-theme="dark"]{--bg:#18181a;--surface:#242420;--surface2:#2e2e28;--border:#3a3830;--text:#e8e4da;--text2:#b0aa9e;--text3:#7a7468;--green:#4a7abf;--green-dark:#7aaae0;--green-bg:#0e1e38;--gold:#d4b86a;--gold-bg:#241e0e;--ok:#4a9a6f;--ok-bg:rgba(74,154,111,.12);--bad:#c05030;--bad-bg:rgba(192,80,48,.10);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;}
#welcomeScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;}
.wcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:2.4rem 2rem;width:100%;max-width:460px;text-align:center;border-top:4px solid var(--gold);}
.wlogos{display:flex;justify-content:center;align-items:center;gap:1.4rem;margin-bottom:1.6rem;padding-bottom:1.6rem;border-bottom:1px solid var(--border);}
.wtitle{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.25rem;}
.wcourse{font-size:.78rem;color:var(--gold);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1.6rem;}
.flabel{display:block;font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;text-align:left;}
.finput{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:.95rem;font-family:inherit;margin-bottom:.9rem;}
.finput:focus{outline:none;border-color:var(--green);}
.sbtn{width:100%;padding:.85rem;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.sbtn:hover{background:var(--green-dark);}
.serr{min-height:1.2rem;font-size:.82rem;color:var(--bad);margin-top:.4rem;}
#restoreBar{display:none;background:var(--gold-bg);border:1.5px solid var(--gold);border-radius:10px;padding:.85rem 1.1rem;margin-top:.9rem;font-size:.88rem;color:var(--text);}
.rbar-btns{display:flex;gap:.6rem;margin-top:.6rem;}
.rbtn{padding:.45rem 1rem;border-radius:8px;border:none;font-size:.82rem;font-weight:600;cursor:pointer;}
.rbtn-yes{background:var(--green);color:#fff;}.rbtn-no{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
#lessonScreen{display:none;}
.stickybar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:.55rem 1.2rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.htitle{font-family:'Crimson Pro',serif;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.halexis{flex:1;display:flex;justify-content:center;}
.hchip{font-size:.7rem;background:var(--green-bg);color:var(--green-dark);padding:.2rem .65rem;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.tbtn{background:none;border:1px solid var(--border);border-radius:7px;padding:.28rem .55rem;cursor:pointer;font-size:.82rem;color:var(--text2);flex-shrink:0;}
.progbar{height:3px;background:var(--border);position:sticky;top:47px;z-index:99;}
.progfill{height:100%;background:var(--green);width:0%;transition:width .4s;}
.lang-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0;}
.lang-btn{padding:.28rem .7rem;font-size:.72rem;font-weight:600;letter-spacing:.06em;cursor:pointer;border:none;background:none;color:var(--text3);font-family:inherit;}
.lang-btn.active{background:var(--green);color:#fff;}
.lbody{max-width:760px;margin:0 auto;padding:2rem 1.2rem 4rem;}
.section{opacity:0;transform:translateY(16px);transition:opacity .48s,transform .48s;margin-bottom:2.8rem;}
.section.vis{opacity:1;transform:none;}
.stag{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.45rem;}
.section h2{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.7rem;}
.section p{color:var(--text2);margin-bottom:.8rem;}
.callout{background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1rem 0;}
.callout strong{color:var(--green-dark);}
/* Formula blocks */
.fblock{display:flex;flex-direction:column;gap:.55rem;margin:1.1rem 0;}
.frow{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.75rem 1rem;display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;}
.frow-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);flex-shrink:0;min-width:90px;}
.frow-eq{font-family:'IBM Plex Mono',monospace;font-size:.9rem;font-weight:600;color:var(--green-dark);}
.frow-note{font-size:.76rem;color:var(--text3);margin-left:auto;}
/* Terminology box */
.termbox{background:var(--gold-bg);border:1px solid var(--gold);border-radius:10px;padding:.85rem 1.1rem;margin:1rem 0;}
.termbox-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700;margin-bottom:.55rem;}
.term-row{display:flex;gap:.7rem;margin-bottom:.3rem;font-size:.84rem;}
.term-abbr{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--green-dark);min-width:60px;}
.term-def{color:var(--text2);}
/* Rules grid */
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:.75rem;margin:1.1rem 0;}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem;border-top:3px solid var(--green);}
.rname{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.35rem;}
.rform{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--green-dark);font-weight:500;margin-bottom:.3rem;}
.rnote{font-size:.76rem;color:var(--text3);}
/* Drill sets with input */
.drill-set{background:var(--surface);border:1.5px solid var(--gold);border-radius:12px;padding:1.2rem;margin:1.2rem 0;}
.drill-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;}
.drill-tag{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;background:var(--gold-bg);border-radius:20px;padding:.2rem .65rem;}
.drill-title{font-family:'Crimson Pro',serif;font-size:1.05rem;font-weight:700;}
.drill-items{display:flex;flex-direction:column;gap:.7rem;}
.drill-item{background:var(--surface2);border-radius:8px;padding:.75rem .9rem;}
.di-top{display:flex;align-items:flex-start;gap:.75rem;}
.di-num{background:var(--gold);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;margin-top:.1rem;}
.di-q{font-size:.87rem;flex:1;color:var(--text2);}
.di-answer-row{display:flex;align-items:center;gap:.5rem;margin-top:.6rem;flex-wrap:wrap;}
.di-input{font-family:'IBM Plex Mono',monospace;font-size:.9rem;padding:.35rem .6rem;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);width:110px;}
.di-input:focus{outline:none;border-color:var(--green);}
.di-unit{font-size:.82rem;color:var(--text3);font-family:'IBM Plex Mono',monospace;}
.di-vbtn{background:var(--green);color:#fff;border:none;border-radius:6px;padding:.35rem .8rem;font-size:.78rem;font-weight:600;cursor:pointer;}
.di-vbtn:hover:not(:disabled){background:var(--green-dark);}
.di-vbtn:disabled{opacity:.35;cursor:not-allowed;}
.di-fb{margin-top:.4rem;font-size:.82rem;padding:.3rem .65rem;border-radius:5px;display:none;}
.di-fb.ok{display:block;background:var(--ok-bg);color:var(--ok);}
.di-fb.bad{display:block;background:var(--bad-bg);color:var(--bad);}
/* Widgets */
.gcrd{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.3rem;margin:.9rem 0;}
.iw-head{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.3rem;flex-wrap:wrap;}
.iw-tag{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;}
.iw-title{font-family:'Crimson Pro',serif;font-size:1.08rem;font-weight:700;}
.iw-sub{font-size:.8rem;color:var(--text2);margin-bottom:.85rem;}
.metric{background:var(--surface2);border-radius:8px;padding:.65rem;text-align:center;}
.mlbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.15rem;}
.mnum{font-family:'IBM Plex Mono',monospace;font-size:.95rem;font-weight:600;}
.mnum.cs{color:var(--green);}.mnum.ps{color:var(--gold);}
/* Problem cards */
.pcrd{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;margin-bottom:1.3rem;overflow:hidden;}
.pcrd.ok{border-color:var(--ok);}.pcrd.bad{border-color:var(--bad);}
.phdr{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border);}
.pnum{background:var(--green);color:#fff;width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;flex-shrink:0;}
.ptitle{font-weight:600;font-size:.88rem;}.pbody{padding:1rem;}
.pstmt{background:var(--surface2);border-radius:8px;padding:.85rem .95rem;margin-bottom:.9rem;font-size:.88rem;}
.pfn{display:block;font-family:'IBM Plex Mono',monospace;font-size:.76rem;color:var(--green-dark);margin-top:.45rem;font-weight:500;}
.wtabs{display:flex;gap:.35rem;margin-bottom:.5rem;flex-wrap:wrap;}
.wtab{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.26rem .68rem;font-size:.78rem;cursor:pointer;color:var(--text2);}
.wtab.active{background:var(--green);color:#fff;border-color:var(--green);}
.wpanel{display:none;}.wpanel.active{display:block;}
.cvwrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.dcanvas{display:block;touch-action:none;cursor:crosshair;width:100%;height:190px;}
.ctoolbar{display:flex;align-items:center;gap:.35rem;padding:.35rem .55rem;background:var(--surface2);border-top:1px solid var(--border);flex-wrap:wrap;}
.tbtn2{background:none;border:1px solid var(--border);border-radius:5px;padding:.22rem .45rem;font-size:.72rem;cursor:pointer;color:var(--text2);}
.tbtn2.on{background:var(--green);color:#fff;border-color:var(--green);}
.cdot{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.cdot.sel{border-color:var(--gold);}
.clrbtn{background:none;border:1px solid var(--border);border-radius:5px;padding:.22rem .45rem;font-size:.72rem;cursor:pointer;color:var(--bad);margin-left:auto;}
.wtextarea{width:100%;min-height:120px;padding:.65rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.8rem;resize:vertical;}
.wtextarea:focus{outline:none;border-color:var(--green);}
.pzone{border:2px dashed var(--border);border-radius:8px;padding:1.4rem;text-align:center;cursor:pointer;position:relative;}
.pzone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.pzicon{font-size:1.7rem;margin-bottom:.35rem;}.pztxt{font-size:.8rem;color:var(--text3);}
.ppreview{display:none;width:100%;border-radius:8px;margin-top:.5rem;max-height:280px;object-fit:contain;}
.hintbtn{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:.28rem .65rem;font-size:.78rem;cursor:pointer;margin-bottom:.45rem;}
.hintbox{display:none;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:.65rem .85rem;font-size:.83rem;color:var(--text2);}
.hintbox.show{display:block;}
.mcopt.pending{border-color:var(--gold);background:var(--gold-bg);}
.mcopts{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.6rem;}
.mcopt{display:flex;align-items:center;gap:.65rem;padding:.65rem .85rem;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:.86rem;user-select:none;}
.mcopt:hover:not(.dis){border-color:var(--green);background:var(--green-bg);}
.mcopt.dis{cursor:default;pointer-events:none;}
.mcopt.sc{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
.mcopt.sw{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}
.mcopt.rc{border-color:var(--ok);background:var(--ok-bg);}
.mcfb{display:none;padding:.65rem .85rem;border-radius:8px;font-size:.83rem;margin-top:.25rem;}
.mcfb.show{display:block;}.mcfb.fbok{background:var(--ok-bg);color:var(--ok);}.mcfb.fbbad{background:var(--bad-bg);color:var(--bad);}
.rpanel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.8rem;text-align:center;}
.dlbtn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:.8rem 1.8rem;font-size:.95rem;font-weight:600;cursor:pointer;}
.dlbtn:hover{background:var(--green-dark);}.dlbtn:disabled{opacity:.6;cursor:wait;}
.verify-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.55rem 1.2rem;font-size:.85rem;font-weight:600;cursor:pointer;margin-top:.6rem;}
.verify-btn:hover{background:var(--green-dark);}
.iw-fb{margin-top:.7rem;padding:.7rem .9rem;border-radius:8px;font-size:.83rem;display:none;}
.iw-fb.ok{display:block;background:var(--ok-bg);color:var(--ok);}
.iw-fb.bad{display:block;background:var(--bad-bg);color:var(--bad);}
.iw-fb.info{display:block;background:var(--green-bg);color:var(--green-dark);}
.cl-items{display:flex;flex-direction:column;gap:.6rem;}
.cl-item{display:flex;align-items:center;gap:.6rem;background:var(--surface2);border-radius:8px;padding:.7rem .9rem;font-size:.85rem;}
.cl-stmt{flex:1;}.cl-btns{display:flex;gap:.4rem;flex-shrink:0;}
.cl-btn{padding:.28rem .65rem;border-radius:6px;border:1.5px solid var(--border);font-size:.75rem;cursor:pointer;background:var(--surface);color:var(--text2);font-family:inherit;}
.cl-btn:hover{border-color:var(--green);color:var(--green);}
.cl-btn.correct-pick{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
.cl-btn.wrong-pick{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
.cl-btn.reveal-ans{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
@media(max-width:600px){.wcard{padding:1.6rem 1.1rem;}.stickybar{padding:.5rem .55rem;}.htitle{display:none;}.halexis{display:none;}.lbody{padding:1.2rem .7rem 3rem;}.section h2{font-size:1.3rem;}.rules-grid{grid-template-columns:1fr;}.frow{flex-direction:column;gap:.3rem;}.frow-note{margin-left:0;}}
</style>
</head>

<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos"><div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.28em;color:#1a4a8a;text-indent:.28em">ALEXIS</div></div>
    <div class="wtitle" id="wtitle-el">Porcentajes y Razones Proporcionales</div>

</div>

      <svg width="110" height="28" viewBox="0 0 160 34" xmlns="http://www.w3.org/2000/svg">
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" fill="#c9a84c"/>
        <line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/>

      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">&#11015; &nbsp;<span id="pdf-lbl">Descargar resultados en PDF</span></button>

  </div>
</div>

      doc.text(SCHOOL.courseName[LANG]+'  \xb7  '+SCHOOL.guideTitle[LANG],M,10);
      doc.setTextColor(240,244,238);doc.setFontSize(10.5);doc.setFont('helvetica','bold');
      doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total,M,17);
      wy=25;

      /* Question box */
      var qRaw=pdfText(p.questionText);
      doc.setFontSize(8.5);doc.setFont('helvetica','normal');
      var qLines=doc.splitTextToSize(qRaw,TW-10);
      var qBoxH=8+qLines.length*5+3;
      doc.setFillColor(237,240,245);doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
      doc.setTextColor(pBR,pBG,pBB);doc.setFontSize(6.5);doc.setFont('helvetica','bold');
      doc.text(t('pdf-question'),M+4,wy+6);
      doc.setTextColor(20,24,32);doc.setFontSize(8.5);doc.setFont('helvetica','normal');
      var qy=wy+12;
      qLines.forEach(function(ln,li){doc.text(ln,M+4,qy+li*5);});
      wy+=qBoxH+4;

      /* Answer box */
      var isOk=p.studentChoice===p.correctIdx;
      var chosenText=p.studentChoice!==null&&p.options?pdfText(p.options[p.studentChoice]||''):'';
      var corrText=p.options?pdfText(p.options[p.correctIdx]||''):'';
      var expRaw=pdfText(p.explanation||'');

      doc.setFontSize(8.5);var chLines=doc.splitTextToSize(t('pdf-yours')+chosenText,TW-18);
      doc.setFontSize(8);  var coLines=doc.splitTextToSize(t('pdf-key')+corrText,TW-18);
      doc.setFontSize(7.5);var exLines=doc.splitTextToSize(t('pdf-sol')+expRaw,TW-18).slice(0,4);
      var ansBoxH=8+chLines.length*5.5+coLines.length*5+exLines.length*5+6;
      doc.setFillColor(isOk?232:255,isOk?240:232,isOk?232:228);
      doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
      doc.setFillColor(isOk?26:176,isOk?106:48,isOk?74:16);
      doc.circle(M+7,wy+8,3.5,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
      doc.text(isOk?'v':'x',M+5.2,wy+10.5);
      var ay=wy+7;
      doc.setTextColor(20,24,32);doc.setFontSize(8.5);doc.setFont('helvetica','bold');
      chLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5.5);});
      ay+=chLines.length*5.5+3;
      doc.setTextColor(26,106,74);doc.setFontSize(8);doc.setFont('helvetica','normal');
      coLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5);});
      ay+=coLines.length*5+3;
      doc.setTextColor(90,85,80);doc.setFontSize(7.5);
      exLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5);});
      wy+=ansBoxH+5;
    });

    /* ── Footer on every page ── */
    var pages=doc.internal.getNumberOfPages();
    for(var pg=1;pg<=pages;pg++){
      doc.setPage(pg);
      doc.setFillColor(pAR,pAG,pAB);doc.rect(0,PH-3,PW,3,'F');
      doc.setTextColor(130,140,160);doc.setFontSize(6.5);doc.setFont('helvetica','normal');
      doc.text(name+'  \xb7  '+group+'  \xb7  '+t('pdf-code')+code+'  \xb7  '+t('pdf-page')+pg+'/'+pages,PW/2,PH-5,{align:'center'});
    }

    /* ── Delivery ── */
    var _fn=SCHOOL.filePrefix+'_'+name.replace(/\s+/g,'_')+'_'+group.replace(/\s+/g,'_')+'.pdf';
    var _blob=doc.output('blob');
    var _isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(_isIOS){
      var _file=new File([_blob],_fn,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[_file]})){
        navigator.share({files:[_file],title:_fn}).then(function(){_rb();}).catch(function(e){if(e&&e.name==='AbortError'){_rb();return;}_oi(_blob);_rb();});
        return;
      }
      _oi(_blob);_rb();return;
    }
    var _u=URL.createObjectURL(_blob);
    var _a=document.createElement('a');_a.href=_u;_a.download=_fn;
    document.body.appendChild(_a);_a.click();
    setTimeout(function(){document.body.removeChild(_a);URL.revokeObjectURL(_u);},200);
    _rb();
  }catch(err){console.error(err);_rb();}
}
</script>
</body>
</html>
