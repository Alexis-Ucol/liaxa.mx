<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saberes Tradicionales en Agricultura y Pesca Sustentables</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Saberes Tradicionales en Agricultura y Pesca Sustentables</div>
    <div class="wcourse" id="wcourse-el">Biología · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Saberes Tradicionales en Agricultura y Pesca Sustentables</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c6cb4', primaryDark:'#032f50', primaryBg:'#e5f0f8',
  accent:'#9ccce4', accentBg:'#e3f0f7',
  darkPrimary:'#3191d8', darkPrimaryDark:'#64b7f6', darkPrimaryBg:'#052741',

function setLang(l){

    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'bio1_t04_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'bio1_t04_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {

        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;

        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';

        if (pz) pz.style.opacity = '0.4';

    }

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'bio1_t04_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }

function mcSpec(v){
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:(v.ci||0), hint:L(v.hint), exp:L(v.exp), showWork:false };
}

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Sacar del ecosistema sin dejarlo vacío', en:'Taking from an ecosystem without emptying it' }),
    '<p>' + L({
      es:'Una laguna puede dar pescado toda la vida o quedarse sin peces en pocos años. Una ladera puede sostener maíz durante siglos o perder su suelo en tres temporadas. Lo que decide una cosa o la otra no es la suerte: es la manera de trabajar. Muchas comunidades de este país llevan generaciones afinando esa manera, y sus reglas siguen funcionando.',
      en:'A lagoon can give fish for a lifetime or run out of fish in a few years. A hillside can hold maize for centuries or lose its soil in three seasons. What decides between one and the other is not luck: it is the way the work is done. Many communities in this country have spent generations fine tuning that way of working, and their rules still work.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a tomar las mismas decisiones que toman quienes viven del campo, del monte y del mar. Vas a fijar cuánto se saca, elegir la técnica que pide cada terreno, guardar semilla, mover un rebaño y decidir qué peces regresan al agua. Cada decisión te va a mostrar su consecuencia de inmediato.',
      en:'You are going to make the same decisions made by people who live off the fields, the woodland and the sea. You will set how much is taken, choose the technique each piece of land calls for, save seed, move a flock and decide which fish go back into the water. Every decision will show you its consequence right away.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: la regla del aprovechamiento ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'La regla que sostiene todo: reponer más de lo que se saca', en:'The rule that holds it all up: replace more than you take' }),
    '<p>' + L({
      es:'Todo ser vivo que aprovechamos se repone a cierta velocidad. Un pastizal rebrota, un banco de peces tiene crías, un bosque suma madera nueva cada año. Esa velocidad de reposición no se puede apurar a voluntad: depende de la lluvia, del suelo, de la temperatura y del tiempo que tarda cada especie en crecer y reproducirse.',
      en:'Every living thing we make use of replaces itself at a certain speed. A pasture regrows, a fish stock has young, a forest adds new wood every year. That replacement speed cannot be hurried at will: it depends on rain, soil, temperature and the time each species needs to grow and reproduce.'
    }) + '</p>' +
    '<p>' + L({
      es:'De ahí sale una regla sencilla de decir y difícil de cumplir cuando hay hambre o prisa: si cada año se saca menos o igual que lo que el ecosistema repone, el recurso se mantiene y sigue dando. Si se saca de más, aunque sea poco de más, la reserva baja un escalón cada año y llega el momento en que ya no hay de dónde. Aprovechar de forma sustentable significa exactamente eso: satisfacer lo que hoy se necesita sin dejar sin recurso a quien venga después.',
      en:'From this comes a rule that is easy to say and hard to follow when there is hunger or hurry: if each year as much as or less than the ecosystem replaces is taken out, the resource holds and keeps giving. If too much is taken, even a little too much, the reserve drops one step every year and a moment comes when there is nothing left. Sustainable use means exactly that: meeting what is needed today without leaving whoever comes next without the resource.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Reposición', en:'Replacement' }), L({ es:'lo que vuelve a crecer', en:'what grows back' }), L({ es:'cada especie tiene su propio ritmo', en:'each species has its own pace' })) +
      rcard(L({ es:'Extracción', en:'Extraction' }), L({ es:'lo que se saca al año', en:'what is taken per year' }), L({ es:'es la única parte que decidimos', en:'it is the only part we decide' })) +
      rcard(L({ es:'Reserva', en:'Reserve' }), L({ es:'lo que queda en pie', en:'what is left standing' }), L({ es:'sube, se mantiene o baja', en:'it rises, holds or falls' })) +
      rcard(L({ es:'Señal de alarma', en:'Warning signal' }), L({ es:'cuesta más obtener lo mismo', en:'the same yield costs more' }), L({ es:'más lejos, más horas, piezas menores', en:'farther away, more hours, smaller pieces' })) +
    '</div>'
  );
  w1(rng, widgetHost(s1, 'w_reposicion'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 :: cada terreno pide su técnica ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Agricultura hecha a la medida del terreno', en:'Farming cut to the shape of the land' }),
    '<p>' + L({
      es:'No existe una sola forma correcta de sembrar. Existe la forma que le queda a cada terreno, y los pueblos originarios llegaron a ella observando qué fallaba. En las laderas del centro y del sur el problema es que la lluvia arrastra el suelo cuesta abajo, así que se construyen terrazas: escalones sostenidos por muros de piedra que frenan el agua y retienen la tierra fértil donde está la raíz.',
      en:'There is no single correct way to sow. There is the way that fits each piece of land, and indigenous peoples arrived at it by watching what failed. On the hillsides of central and southern Mexico the problem is that rain drags the soil downhill, so terraces are built: steps held by stone walls that slow the water and keep the fertile earth where the roots are.'
    }) + '</p>' +
    '<p>' + L({
      es:'En la zona de canales de Xochimilco y Tláhuac el problema es el contrario: hay agua de sobra y poca tierra firme. La respuesta fueron las chinampas, parcelas construidas sobre el lago con capas de lodo y vegetación, sostenidas por sauces sembrados en la orilla. Cada temporada se les devuelve el lodo del fondo del canal, cargado de materia orgánica, y el agua mantiene la raíz húmeda todo el año. En los valles secos del altiplano, los metepantles ordenan la parcela entre hileras de magueyes y árboles que frenan el viento y el escurrimiento. Y en las zonas de selva, donde el suelo da bien solo unos años, la parcela se trabaja un tiempo y luego se deja descansar mientras la vegetación regresa y el suelo recupera nutrientes.',
      en:'In the canal zone of Xochimilco and Tlahuac the problem is the opposite: there is water to spare and little solid ground. The answer was the chinampas, plots built over the lake with layers of mud and vegetation, held in place by willows planted along the edge. Every season the mud from the bottom of the canal, loaded with organic matter, is returned to them, and the water keeps the roots damp all year. In the dry valleys of the highlands, the metepantles arrange the plot between rows of agaves and trees that slow the wind and the runoff. And in forest areas, where the soil yields well only for a few years, the plot is worked for a while and then left to rest while the vegetation returns and the soil recovers nutrients.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Todas estas obras responden a la misma pregunta: qué le falta o qué le sobra a este terreno, y qué arreglo lo compensa. Por eso una técnica que salva una ladera puede ser inútil en una zona de canales.',
      en:'All these works answer the same question: what does this piece of land lack or have too much of, and what arrangement makes up for it. That is why a technique that saves a hillside can be useless in a zone of canals.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_terrenos'));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 :: semillas criollas ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La semilla que se guarda es la que aprendió del lugar', en:'The seed that gets saved is the one that learned from the place' }),
    '<p>' + L({
      es:'Al final de cada cosecha, en muchas casas del campo se aparta la semilla del año siguiente. No se aparta cualquiera: se escogen las mazorcas de las plantas que respondieron mejor a lo que pasó ese año, la que aguantó la seca, la que no se venció con el viento, la que salió sin daño de gusano. Repetida durante generaciones, esa selección va dejando una semilla ajustada al clima, al suelo y a las plagas de ese lugar concreto. A esas variedades locales se les llama semillas criollas o nativas.',
      en:'At the end of every harvest, in many rural homes the seed for the following year is set aside. Not just any seed: the cobs chosen are from the plants that responded best to what happened that year, the one that stood the drought, the one that did not fall with the wind, the one that came out with no worm damage. Repeated over generations, that selection leaves a seed tuned to the climate, the soil and the pests of that particular place. Those local varieties are called criollo or native seeds.'
    }) + '</p>' +
    '<p>' + L({
      es:'Por eso en México hay decenas de razas de maíz distintas, cada una nacida de una región y de una necesidad: maíces de tierra fría y de tierra caliente, de ciclo corto para donde la lluvia dura poco, de grano duro para almacenar. Guardar varias y no una sola es una forma de seguro: si un año llega una helada temprana o una plaga nueva, alguna de las variedades responde y la familia no lo pierde todo. Ese intercambio de semillas y de experiencias entre familias y entre comunidades es lo que mantiene viva la diversidad.',
      en:'That is why in Mexico there are dozens of different maize races, each one born of a region and a need: maize for cold land and for hot land, short cycle maize for places where the rain is brief, hard grain maize for storing. Keeping several instead of only one is a kind of insurance: if an early frost or a new pest arrives one year, one of the varieties responds and the family does not lose everything. That exchange of seeds and experiences between families and between communities is what keeps the diversity alive.'
    }) + '</p>'

  w3(rng, widgetHost(s3, 'w_semilla'));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 4 :: pastoreo ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Pastoreo: el pasto también necesita su descanso', en:'Herding: the grass needs its rest too' }),
    '<p>' + L({
      es:'Una planta de pasto que pierde sus hojas vuelve a brotar usando las reservas guardadas en la raíz. Si el animal la come otra vez antes de que haya repuesto esas reservas, la planta rebrota más débil, y a la tercera o cuarta vez ya no rebrota. El suelo queda descubierto, la lluvia lo golpea directo y se lo lleva. Así empieza la degradación de un pastizal, y no se nota de golpe: se nota cuando el terreno ya está pelado.',
      en:'A grass plant that loses its leaves sprouts again using the reserves stored in its root. If the animal eats it again before it has rebuilt those reserves, the plant regrows weaker, and by the third or fourth time it no longer regrows. The soil is left bare, the rain hits it directly and washes it away. That is how the degradation of a pasture begins, and it is not noticed all at once: it is noticed when the ground is already stripped.'
    }) + '</p>' +
    '<p>' + L({
      es:'La respuesta que han dado los pueblos pastores es mover a los animales. En muchas comunidades el terreno se divide en potreros y el rebaño pasa de uno a otro, regresando solo cuando el pasto ya rebrotó. En otras regiones el movimiento es más largo: en la trashumancia, los rebaños suben al monte en la temporada de lluvias y bajan al valle en la seca, siguiendo dónde hay pasto disponible. También se cuida la carga animal, es decir, cuántos animales puede sostener un terreno sin agotarlo. Y el ganado, al pastar y caminar, deja estiércol que devuelve nutrientes al suelo, siempre que no se concentre demasiado en un solo punto.',
      en:'The answer herding peoples have given is to move the animals. In many communities the land is divided into paddocks and the flock moves from one to another, coming back only when the grass has regrown. In other regions the movement is longer: in transhumance, flocks climb to the highlands in the rainy season and come down to the valley in the dry season, following where grass is available. The stocking rate is also watched, that is, how many animals a piece of land can support without exhausting it. And livestock, by grazing and walking, leave manure that returns nutrients to the soil, as long as it does not pile up in one single spot.'
    }) + '</p>'
  );
  w4(rng, widgetHost(s4, 'w_potreros'));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 5 :: pesca ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Pesca: dejar que se reproduzcan antes de capturarlos', en:'Fishing: letting them reproduce before catching them' }),
    '<p>' + L({
      es:'Un pez capturado antes de reproducirse por primera vez no deja descendencia: se pierde ese individuo y también todas las crías que habría dejado. Por eso las comunidades pesqueras aprendieron a leer el ciclo de cada especie y a acomodar su trabajo alrededor de él. Cuando llega la temporada en que las hembras vienen cargadas de huevos, se suspende la captura de esa especie; hoy esa medida se conoce como veda.',
      en:'A fish caught before it reproduces for the first time leaves no offspring: that individual is lost and so are all the young it would have left. That is why fishing communities learned to read the cycle of each species and to arrange their work around it. When the season arrives in which the females come loaded with eggs, catching that species is suspended; today that measure is known as a closed season.'
    }) + '</p>' +
    '<p>' + L({
      es:'Junto a la veda van otras reglas del mismo tipo. Se usan redes de malla amplia para que los peces pequeños pasen y sigan creciendo, y se regresa al agua lo que sale por debajo de la talla en que la especie ya se reproduce. Se reconocen sitios de crianza, sobre todo los manglares y los arrecifes, donde las crías crecen protegidas entre raíces y grietas: ahí no se pesca, porque de ahí sale la pesca de mar abierto de los años siguientes. Y se rotan las zonas de captura para que ninguna quede bajo presión todo el año.',
      en:'Alongside the closed season go other rules of the same kind. Wide mesh nets are used so small fish pass through and keep growing, and anything below the size at which the species already reproduces is returned to the water. Nursery sites are recognised, above all mangroves and reefs, where the young grow protected among roots and crevices: nobody fishes there, because the open sea catch of the following years comes from there. And fishing zones are rotated so that none is under pressure all year long.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Todas estas reglas apuntan al mismo punto del ciclo de vida: proteger a los que todavía no se han reproducido y a los que están reproduciéndose. Lo demás se puede aprovechar.',
      en:'All these rules aim at the same point of the life cycle: protecting those that have not reproduced yet and those that are in the middle of reproducing. The rest can be used.'
    }) + '</p></div>'
  );
  w5(rng, widgetHost(s5, 'w_red'));
  addProblem(rng, mkP6(rng));
  w6(rng, widgetHost(s5, 'w_veda'));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 6 :: diálogo de saberes ══ */
  var s6 = sec(
    L({ es:'Concepto 6', en:'Concept 6' }),
    L({ es:'Dos formas de saber que se necesitan', en:'Two ways of knowing that need each other' }),
    '<p>' + L({
      es:'Un saber tradicional no compite con una investigación científica. Cada uno aporta algo que al otro le falta. La comunidad tiene siglos de observación en un lugar concreto: sabe en qué mes desova cada especie, qué ladera se lava primero, qué planta anuncia la lluvia. La investigación aporta instrumentos para medir, comparar zonas distintas y explicar el mecanismo detrás de lo que se observa. Cuando se juntan, el resultado es mejor que cualquiera de los dos por separado: reglas que ya funcionaban ahora se pueden sostener con registros, y los registros ganan una historia larga que ningún proyecto de tres años podría reunir.',
      en:'Traditional knowledge is not in competition with scientific research. Each one brings something the other lacks. The community has centuries of observation in one specific place: it knows in which month each species spawns, which hillside washes away first, which plant announces the rain. Research brings instruments to measure, to compare different areas and to explain the mechanism behind what is observed. When they come together the result is better than either one alone: rules that already worked can now be backed with records, and the records gain a long history that no three year project could gather.'
    }) + '</p>' +
    '<p>' + L({
      es:'Ese trabajo conjunto tiene una condición: reconocer de quién es el conocimiento. Las prácticas y las innovaciones de los pueblos originarios les pertenecen, y usarlas sin nombrarlos ni acordar con ellos cómo se usan es despojarlos de algo que construyeron durante generaciones. Registrar junto con la comunidad, decidir con ella y compartir el beneficio es parte del método, no un trámite aparte. Y cuando quieras contar lo que encontraste, importa cómo lo cuentas: un dato se sostiene con registros hechos durante varias temporadas, no con una impresión suelta, y se comunica mejor con una tabla, un mapa de la comunidad, un cartel o una entrevista grabada que con una afirmación sin respaldo.',
      en:'That joint work has one condition: recognising whose knowledge it is. The practices and innovations of indigenous peoples belong to them, and using them without naming them or agreeing with them on how they are used strips them of something they built over generations. Recording together with the community, deciding with them and sharing the benefit is part of the method, not a separate formality. And when you want to tell what you found, how you tell it matters: a claim holds up with records made across several seasons, not with a loose impression, and it is better communicated with a table, a community map, a poster or a recorded interview than with an unsupported statement.'
    }) + '</p>'
  );
  w7(rng, widgetHost(s6, 'w_cadena'));
  addProblem(rng, mkP8(rng));

      en:'Two more situations, with everything you have already worked on in hand.'

  addProblem(rng, mkP10(rng));

/* ── 1 · extracción frente a reposición ── */

    {
      title:{ es:'Leña de la sierra', en:'Firewood from the sierra' },
      q:{ es:'En una comunidad de la sierra se sacan cada año 9 cargas de leña de un bosque que alcanza a reponer 6 cargas al año. Las familias quieren que sus nietos sigan teniendo leña de ese mismo monte. Si nadie cambia nada, ¿qué va a ocurrir con el bosque?',
          en:'In a sierra community, 9 loads of firewood are taken each year from a forest that manages to replace 6 loads a year. The families want their grandchildren to still have firewood from that same woodland. If nobody changes anything, what will happen to the forest?' },
      opts:{ es:[
        'La reserva de leña baja un poco cada año, porque sale más de lo que el bosque alcanza a reponer, hasta que ya no haya de dónde cortar.',
        'La reserva se mantiene igual, porque los árboles vuelven a crecer con cada temporada de lluvias del año siguiente.',
        'La reserva aumenta poco a poco, porque cortar leña deja espacio y luz para que broten muchos árboles jóvenes.',
        'La reserva depende solo de cuántas familias vivan en la comunidad, no del ritmo con el que se corta la leña.'
      ], en:[
        'The firewood reserve drops a little every year, because more goes out than the forest manages to replace, until there is nothing left to cut.',
        'The reserve stays the same, because the trees grow back with each rainy season of the following year.',
        'The reserve grows little by little, because cutting firewood leaves space and light for many young trees to sprout.',
        'The reserve depends only on how many families live in the community, not on the pace at which firewood is cut.'
      ] },
      hint:{ es:'Compara lo que sale del bosque cada año con lo que ese mismo bosque logra reponer en ese mismo año.',
             en:'Compare what leaves the forest each year with what that same forest manages to replace in that same year.' },
      exp:{ es:'La reposición del bosque es de 6 cargas al año y la extracción es mayor. Esa diferencia se descuenta de lo que queda en pie, y se descuenta otra vez cada año, así que la reserva va cayendo escalón por escalón hasta agotarse. Mientras la extracción no baje al ritmo de reposición, el resultado es el mismo.',
            en:'The forest replaces 6 loads a year and the extraction is larger. That difference is subtracted from what is left standing, and it is subtracted again every year, so the reserve keeps falling step by step until it runs out. As long as extraction does not come down to the pace of replacement, the result is the same.' }
    },
    {
      title:{ es:'Cuatro decisiones', en:'Four decisions' },
      q:{ es:'Cuatro comunidades aprovechan un recurso distinto. ¿Cuál de estas decisiones permite que el recurso siga dando dentro de veinte años?',
          en:'Four communities use a different resource. Which of these decisions lets the resource keep giving twenty years from now?' },
      opts:{ es:[
        'Cortar cada año una cantidad de madera igual a la que el bosque suma con su crecimiento anual.',
        'Aumentar cada año un poco la captura en la laguna, porque los peces se reproducen todos los años.',
        'Mantener el rebaño en el mismo potrero todo el año para no perder tiempo trasladando animales.',
        'Sembrar la misma parcela sin descanso mientras siga dando algo de cosecha cada temporada.'
      ], en:[
        'Cutting each year an amount of timber equal to what the forest adds with its annual growth.',
        'Raising the lagoon catch a little every year, because the fish reproduce every year.',
        'Keeping the flock in the same paddock all year so as not to lose time moving animals.',
        'Sowing the same plot with no rest as long as it still gives some harvest each season.'
      ] },
      hint:{ es:'Pregúntate en cada caso si lo que se saca cabe dentro de lo que el ecosistema alcanza a reponer en ese mismo tiempo.',
             en:'Ask yourself in each case whether what is taken fits inside what the ecosystem manages to replace in that same time.' },
      exp:{ es:'Solo la primera decisión ajusta la extracción a la reposición: se corta lo que el bosque acaba de sumar y la reserva queda igual. Las otras tres sacan más de lo que se repone o no dan tiempo de reposición: la captura creciente rebasa a las crías, el potrero único no deja rebrotar el pasto y la parcela sin descanso agota los nutrientes del suelo.',
            en:'Only the first decision matches extraction to replacement: what the forest has just added is cut and the reserve stays the same. The other three take more than is replaced or leave no time to replace: a growing catch outruns the young fish, a single paddock never lets the grass regrow, and a plot with no rest exhausts the nutrients in the soil.' }
    }
  ];
  return mcSpec(pk(rng, V));

/* ── 2 · leer el registro / evidencia de sobreexplotación ── */
function mkP2(rng){

    {
      title:{ es:'El registro de la laguna', en:'The lagoon record' },
      q:{ es:'Durante diez años, las familias pescadoras de una laguna anotaron sus salidas. Con las mismas redes y las mismas horas de trabajo, cada vez tienen que ir más lejos y regresan con peces más chicos. ¿Qué es lo que mejor indica ese registro?',
          en:'For ten years, the fishing families of a lagoon wrote down their trips. With the same nets and the same hours of work, they have to go farther every time and come back with smaller fish. What does that record best indicate?' },
      opts:{ es:[
        'Que se está capturando más de lo que la población de peces alcanza a reponer, y quedan cada vez menos adultos.',
        'Que los peces de la laguna aprendieron a reconocer las redes y por eso se alejan de la orilla.',
        'Que la temporada de lluvias llegó tarde ese año y por eso el agua de la laguna bajó de nivel.',
        'Que las redes se desgastaron con el uso y ya no logran retener a los peces de mayor tamaño.'
      ], en:[
        'That more is being caught than the fish population manages to replace, and there are fewer and fewer adults left.',
        'That the fish in the lagoon learned to recognise the nets and for that reason move away from the shore.',
        'That the rainy season arrived late that year and that is why the water level in the lagoon dropped.',
        'That the nets wore out with use and no longer manage to hold the larger fish.'
      ] },
      hint:{ es:'Fíjate en que el esfuerzo es el mismo desde hace diez años y en qué cambió: la distancia y el tamaño de lo que se captura.',
             en:'Notice that the effort has been the same for ten years and what changed: the distance and the size of what is caught.' },
      exp:{ es:'Cuando hay que buscar más lejos y las piezas son menores con el mismo esfuerzo, la señal es que quedan pocos adultos cerca y se están capturando peces cada vez más jóvenes. Eso ocurre cuando la captura supera a la reposición durante varios años seguidos. Un cambio de una sola temporada, como una lluvia tardía, no produce una caída sostenida durante diez años.',
            en:'When you have to search farther and the pieces are smaller for the same effort, the signal is that few adults are left nearby and that younger and younger fish are being caught. That happens when the catch exceeds replacement for several years in a row. A change in a single season, such as a late rain, does not produce a sustained decline over ten years.' }
    },
    {
      title:{ es:'El agostadero', en:'The grazing land' },
      q:{ es:'En un terreno de pastoreo, quien cuida el rebaño observa año con año lo mismo: el pasto tarda más en cubrir el suelo después de las lluvias, aparecen manchones de tierra desnuda y en las cañadas el agua baja cargada de lodo. ¿Qué está mostrando esa observación?',
          en:'On a grazing area, the person who tends the flock observes the same thing year after year: the grass takes longer to cover the ground after the rains, patches of bare earth appear and in the gullies the water runs down loaded with mud. What is that observation showing?' },
      opts:{ es:[
        'Que el pastizal se está degradando porque no alcanza a rebrotar antes de volver a ser pastoreado.',
        'Que el pasto de ese terreno cambió por otra especie que crece más pegada al suelo.',
        'Que el ganado está comiendo menos que en años anteriores y deja pasto sin aprovechar.',
        'Que las lluvias de la región traen desde hace años más lodo del que traían antes.'
      ], en:[
        'That the pasture is degrading because it does not manage to regrow before being grazed again.',
        'That the grass on that land was replaced by another species that grows closer to the ground.',
        'That the livestock are eating less than in previous years and leave grass unused.',
        'That the rains of the region have for years been carrying more mud than they used to.'
      ] },
      hint:{ es:'Une las tres observaciones: rebrote lento, suelo descubierto y agua con lodo. ¿Qué las produce a las tres?',
             en:'Put the three observations together: slow regrowth, bare soil and muddy water. What produces all three?' },
      exp:{ es:'Las tres señales son parte de la misma cadena. El pasto pastoreado antes de reponer las reservas de su raíz rebrota más débil, deja huecos de suelo descubierto, y la lluvia que cae sobre ese suelo sin cubierta lo arrastra hacia las cañadas. El lodo en el agua es el suelo del pastizal yéndose.',
            en:'The three signals are part of the same chain. Grass grazed before it rebuilds the reserves in its root regrows weaker, leaves gaps of bare soil, and the rain falling on that uncovered ground drags it into the gullies. The mud in the water is the soil of the pasture leaving.' }
    }
  ];
  return mcSpec(pk(rng, V));
}

          en:'On a steep hillside, every rainy season the water runs down dragging away the layer of dark earth where the roots grow. The community builds terraces held up by stone walls. Why does that work solve the problem?' },
      opts:{ es:[
        'Porque parte la pendiente en tramos casi planos, el agua baja despacio y la tierra fértil se queda donde está la raíz.',
        'Porque los muros de piedra aportan al terreno los nutrientes que la lluvia se había llevado en años anteriores.',

             en:'Think about what the slope does to the speed of the water, and what happens to what the water carries when it moves slowly.' },
      exp:{ es:'El suelo se pierde porque el agua corre rápido cuesta abajo y se lleva las partículas más finas, que son las más fértiles. La terraza convierte la pendiente en escalones: el agua pierde velocidad, se infiltra en lugar de correr y deja el suelo en el terreno. La piedra no aporta nutrientes ni tapa la lluvia, solo sostiene el escalón.',

    {
      title:{ es:'Parcelas sobre el agua', en:'Plots on the water' },
      q:{ es:'Las chinampas de la zona de canales producen desde hace siglos en el mismo lugar, sin que la parcela pierda fertilidad. ¿Qué explica que puedan sostener esa producción?',

        'Que el agua del canal arrastra hacia otras parcelas las plagas y las hierbas que competirían con el cultivo.',
        'Que la parcela flota y por eso la planta no necesita tomar nutrientes del suelo para desarrollarse.',

      exp:{ es:'La rotación de potreros deja que cada zona rebrote y sostiene más animales sin pelar el terreno: sube lo obtenido y la reserva se mantiene. Las otras tres ganan este año a costa de los siguientes: la malla cerrada se lleva a los peces que aún no se reproducen, la parcela sin descanso agota los nutrientes y la ladera cortada de golpe pierde su suelo antes de que los árboles nuevos crezcan.',
            en:'Paddock rotation lets each area regrow and supports more animals without stripping the land: what is obtained goes up and the reserve holds. The other three gain this year at the cost of the following ones: tight mesh takes fish that have not reproduced yet, a plot with no rest exhausts the nutrients and a hillside cut all at once loses its soil before the new trees grow.' }
    }
  ];
  return mcSpec(pk(rng, V));
}
