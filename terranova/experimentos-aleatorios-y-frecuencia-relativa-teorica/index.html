<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experimentos Aleatorios, Frecuencia Relativa y Teórica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE-SPECIFIC: manipulativos de azar y frecuencia ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; cursor:pointer; }
.binrow { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.7rem; }
.binbtn { flex:1 1 150px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.4rem .5rem; }
.binbtn:hover { border-color:var(--green); color:var(--green); }
.simrow { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.75rem; }
.simbtn { flex:1 1 92px; min-height:44px; border:1.5px solid var(--green); border-radius:8px; background:var(--green); color:#fff; font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.4rem .5rem; }
.simbtn.alt { background:var(--surface2); color:var(--text2); border-color:var(--border); }
.facegrid { display:grid; grid-template-columns:repeat(6,1fr); gap:.4rem; margin:.75rem 0 .2rem; }
.facebtn { min-height:46px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:700; cursor:pointer; }
.facebtn.on { background:var(--gold-bg); border-color:var(--gold); }
.facebtn.good { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
.pbarwrap { position:relative; height:26px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; overflow:hidden; margin:.65rem 0 .2rem; }
.pbarfill { position:absolute; left:0; top:0; bottom:0; background:var(--green); opacity:.72; transition:width .14s; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:36px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1rem; color:var(--green); min-width:120px; text-align:right; }
.livelbl { margin-top:.55rem; font-size:.88rem; color:var(--text2); }
.livelbl b { color:var(--green-dark); }
.bigval { font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:700; color:var(--green-dark); text-align:center; margin:.45rem 0; }
.dtable { width:100%; border-collapse:collapse; margin:.7rem 0; font-size:.83rem; }
.dtable th, .dtable td { border:1px solid var(--border); padding:.35rem .5rem; text-align:center; }
.dtable th { background:var(--surface2); color:var(--text3); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.dtable td { color:var(--text2); font-family:'IBM Plex Mono',monospace; }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.stepslist { margin:.9rem 0 0; padding-left:1.1rem; }
.stepslist li { font-size:.86rem; color:var(--text2); margin-bottom:.35rem; }
@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }
  .gcanvas { height:225px; }
  .facegrid { grid-template-columns:repeat(3,1fr); }
  .dtable th, .dtable td { padding:.28rem .25rem; font-size:.76rem; }
  .kval { min-width:100px; font-size:.9rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Experimentos Aleatorios, Frecuencia Relativa y Teórica</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');

  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {

    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_mat2_t11_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_mat2_t11_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_mat2_t11_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;

  var group   = studentData.group;
  var total   = problems.length;

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  var REDRAW = [];
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320, h = cv.clientHeight || 230;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function d2(v){ return String(Math.round(v*100)/100); }
  function frac(n,d){ return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>'; }
  function gcd(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; }
  function pickD(c, cands, fmt, step, lo, hi){
    var out = [fmt(c)], i, k = 1, v;
    for (i=0;i<cands.length && out.length<4;i++){
      v = cands[i];
      if (v < lo || v > hi) continue;
      if (out.indexOf(fmt(v)) < 0) out.push(fmt(v));
    }
    while (out.length < 4 && k < 60){
      v = c + k*step; if (v <= hi && out.indexOf(fmt(v)) < 0) out.push(fmt(v));
      v = c - k*step; if (out.length < 4 && v >= lo && out.indexOf(fmt(v)) < 0) out.push(fmt(v));
      k++;
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES CON SEMILLA (en orden fijo)
     ============================================================ */
  var vsel = [], vi, SP, i, j;
  for (vi=0; vi<10; vi++) vsel.push(Math.floor(rng()*2));

  var CTXS = [
    { it:{es:'canicas',en:'marbles'}, it1:{es:'canica',en:'marble'}, art:{es:'una',en:'a'}, qm:{es:'¿Cuántas',en:'How many'},
      box:{es:'una bolsa',en:'a bag'}, boxD:{es:'la bolsa',en:'the bag'},
      cs:[{es:'roja',en:'red'},{es:'azul',en:'blue'},{es:'verde',en:'green'}],
      cp:[{es:'rojas',en:'red'},{es:'azules',en:'blue'},{es:'verdes',en:'green'}] },
    { it:{es:'fichas',en:'counters'}, it1:{es:'ficha',en:'counter'}, art:{es:'una',en:'a'}, qm:{es:'¿Cuántas',en:'How many'},
      box:{es:'una caja',en:'a box'}, boxD:{es:'la caja',en:'the box'},
      cs:[{es:'amarilla',en:'yellow'},{es:'blanca',en:'white'},{es:'negra',en:'black'}],
      cp:[{es:'amarillas',en:'yellow'},{es:'blancas',en:'white'},{es:'negras',en:'black'}] },
    { it:{es:'cubos',en:'cubes'}, it1:{es:'cubo',en:'cube'}, art:{es:'un',en:'a'}, qm:{es:'¿Cuántos',en:'How many'},
      box:{es:'una urna',en:'an urn'}, boxD:{es:'la urna',en:'the urn'},
      cs:[{es:'naranja',en:'orange'},{es:'morado',en:'purple'},{es:'gris',en:'grey'}],
      cp:[{es:'naranjas',en:'orange'},{es:'morados',en:'purple'},{es:'grises',en:'grey'}] }
  ];
  var CX = CTXS[Math.floor(rng()*CTXS.length)];
  function itm(k){ return T({ es: CX.art.es+' '+CX.it1.es+' '+CX.cs[k].es, en: 'a '+CX.cs[k].en+' '+CX.it1.en }); }
  function colP(k){ return T(CX.cp[k]); }
  function colS(k){ return T(CX.cs[k]); }

  var NPOOL = [20,25,50];
  var N = NPOOL[Math.floor(rng()*NPOOL.length)];
  var SETS = {
    20: [[7,8,5],[9,6,5],[6,10,4],[8,5,7]],
    25: [[9,10,6],[8,12,5],[11,9,5],[10,8,7]],
    50: [[17,20,13],[16,22,12],[19,15,16],[21,14,15]]
  };
  var cnt = SETS[N][Math.floor(rng()*SETS[N].length)].slice();
  var p = [cnt[0]/N, cnt[1]/N, cnt[2]/N];
  var pct = [Math.round(cnt[0]*100/N), Math.round(cnt[1]*100/N), Math.round(cnt[2]*100/N)];

  function comp(){
    return T({
      es: 'En '+CX.box.es+' hay '+N+' '+CX.it.es+': '+cnt[0]+' '+CX.cp[0].es+', '+cnt[1]+' '+CX.cp[1].es+' y '+cnt[2]+' '+CX.cp[2].es+'.',
      en: 'In '+CX.box.en+' there are '+N+' '+CX.it.en+': '+cnt[0]+' '+CX.cp[0].en+', '+cnt[1]+' '+CX.cp[1].en+' and '+cnt[2]+' '+CX.cp[2].en+'.'
    });
  }

  /* dos tandas de extracciones con devolución */
  var NT  = [25,50][Math.floor(rng()*2)];
  var NT2 = (NT === 25) ? 50 : 25;
  function tanda(tot){
    var q = [Math.round(tot*cnt[0]/N), Math.round(tot*cnt[1]/N), 0], z, big, oth, dd;
    q[2] = tot - q[0] - q[1];
    big = 0;
    for (z=1;z<3;z++) if (q[z] > q[big]) big = z;
    oth = (big + 1 + Math.floor(rng()*2)) % 3;
    dd  = ri(1,2);
    q[oth] += dd; q[big] -= dd;
    return q;
  }
  var g = tanda(NT), h = tanda(NT2);
  var rel  = [g[0]/NT,  g[1]/NT,  g[2]/NT];
  var rel2 = [h[0]/NT2, h[1]/NT2, h[2]/NT2];

  /* dado de seis caras */
  var DEVS = shufA([
    { es:'un número par',            en:'an even number',              fav:[2,4,6] },
    { es:'un número impar',          en:'an odd number',               fav:[1,3,5] },
    { es:'un número mayor que 4',    en:'a number greater than 4',     fav:[5,6]   },
    { es:'un número menor que 3',    en:'a number smaller than 3',     fav:[1,2]   },
    { es:'un múltiplo de 3',         en:'a multiple of 3',             fav:[3,6]   },
    { es:'un número mayor que 1',    en:'a number greater than 1',     fav:[2,3,4,5,6] }
  ]);
  var DE = DEVS[0];
  var deG = gcd(DE.fav.length, 6);
  var deN = DE.fav.length / deG, deD = 6 / deG;

  /* selecciones para problemas */
  var j2 = ri(0,2);              // color observado en la tanda 1
  var j3 = ri(0,2);              // color de la frecuencia faltante
  var j6 = ri(0,2);              // color del porcentaje
  var j8 = ri(0,2);              // color del complemento
  var j9 = ri(0,2);              // color del conteo esperado
  var kR = ri(2,4);
  var M  = N * kR;               // repeticiones del problema de cierre
  var esp = cnt[j9] * kR;

  /* ============================================================
     IDEA 1: experimento aleatorio
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Cuándo un experimento es aleatorio', en:'When an experiment is random'}),
      '<p>'+T({
        es:'Un experimento es aleatorio cuando, aunque sepas exactamente cómo se realiza, no puedes decir de antemano cuál va a ser el resultado: lo único que conoces por adelantado es la lista de resultados que podrían aparecer. Repetirlo en las mismas condiciones puede dar cosas distintas, y ahí está toda la gracia.',
        en:'An experiment is random when, even though you know exactly how it is carried out, you cannot say beforehand what the result will be: the only thing you know in advance is the list of results that could show up. Repeating it under the same conditions may give different things, and that is the whole point.'
      })+'</p>'+
      '<p>'+T({
        es:'A esa lista completa de resultados posibles se le llama espacio muestral. Cualquier grupo de resultados que te interese observar, por ejemplo que salga un número par, se llama evento. Un cálculo como el área de una figura no es un experimento aleatorio: por más veces que lo repitas, el resultado ya estaba decidido antes de empezar.',
        en:'That complete list of possible results is called the sample space. Any group of results you want to watch, for example that an even number comes up, is called an event. A calculation such as the area of a figure is not a random experiment: no matter how many times you repeat it, the result was already settled before you started.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Experimento aleatorio',en:'Random experiment'})+'</div><div class="deftxt">'+T({es:'Se puede repetir y el resultado no se conoce hasta que ocurre.',en:'It can be repeated and the result is unknown until it happens.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Espacio muestral',en:'Sample space'})+'</div><div class="deftxt">'+T({es:'Todos los resultados distintos que pueden aparecer.',en:'Every different result that can show up.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Evento',en:'Event'})+'</div><div class="deftxt">'+T({es:'Un grupo de resultados dentro del espacio muestral.',en:'A group of results inside the sample space.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Repetición',en:'Trial'})+'</div><div class="deftxt">'+T({es:'Cada vez que se realiza el experimento y se anota lo que salió.',en:'Each time the experiment is run and the result is written down.'})+'</div></div>'+
      '</div>'+
      '<div class="callout"><p>'+T({
        es:'El espacio muestral depende de qué decides registrar: no es lo mismo anotar el resultado completo que anotar solo una característica de ese resultado.',
        en:'The sample space depends on what you decide to record: writing down the full result is not the same as writing down only one feature of that result.'
      })+'</p></div>');

  /* ---- MANIPULATIVO 1: aleatorio o no ---- */
  (function(){
    var wrap = widget('azar');
    var BINS = T({ es:['Aleatorio','Se sabe de antemano'], en:['Random','Known beforehand'] });
    var ITEMS = [
      { es:'Girar una ruleta de colores y anotar en qué color se detiene', en:'Spin a colour wheel and record which colour it stops on', bin:0 },
      { es:'Calcular el área de un cuadrado que mide 6 centímetros por lado', en:'Work out the area of a square measuring 6 centimetres on each side', bin:1 },
      { es:'Sacar una carta de un mazo revuelto sin verla', en:'Take a card from a shuffled deck without looking at it', bin:0 },
      { es:'Contar cuántos días tiene el mes de marzo', en:'Count how many days the month of March has', bin:1 },
      { es:'Lanzar dos dados y anotar la suma de los puntos', en:'Roll two dice and record the sum of the dots', bin:0 },
      { es:'Sumar los puntos de dos dados que ya cayeron y están a la vista', en:'Add the dots of two dice that already landed and are in plain sight', bin:1 }
    ];
    var seq = shufA([0,1,2,3,4,5]);
    var st = { i:0, tries:0, hits:0, done:false, lock:false };
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Azar o certeza', en:'Chance or certainty'})+'</div>'+
          '<div class="iw-box"><div class="rfb"><span class="okmsg">'+T({
            es:'Ya tienes el criterio: si antes de hacerlo puedes decir el resultado con seguridad, no hay azar; si solo puedes decir qué cosas podrían pasar, el experimento es aleatorio.',
            en:'You now have the test: if before doing it you can state the result for sure, there is no chance involved; if you can only say which things could happen, the experiment is random.'
          })+'</span></div></div>';
        return;
      }
      var it = ITEMS[seq[st.i]];
      var bt = '', z;
      for (z=0;z<2;z++) bt += '<button class="binbtn" onclick="azPick('+z+')">'+BINS[z]+'</button>';
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Azar o certeza', en:'Chance or certainty'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Situación',en:'Situation'})+' '+(st.i+1)+' / '+ITEMS.length+'</div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'Lee la situación y toca el recuadro que le corresponde. Si te equivocas, la pista te dice en qué fijarte.',
            en:'Read the situation and tap the box it belongs to. If you miss, the feedback tells you what to look at.'
          })+'</div>'+
          '<div class="goalbar">'+T({es:'¿El resultado se puede saber antes de realizarlo?', en:'Can the result be known before running it?'})+'</div>'+
          '<div class="bigval" style="font-size:.95rem;line-height:1.4">'+T(it)+'</div>'+
          '<div class="binrow">'+bt+'</div>'+
          '<div class="rfb" id="azFb"></div>'+
        '</div>';
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.i++; st.tries = 0; st.lock = false;
        if (st.i >= ITEMS.length) st.done = true;
        render();
      }, ms);
    }
    window.azPick = function(bi){
      if (st.done || st.lock) return;
      var fb = document.getElementById('azFb'); if (!fb) return;
      var it = ITEMS[seq[st.i]];
      if (bi === it.bin){
        st.hits++;

    var EVS = [
      { es:'Al lanzar un dado, obtener un número menor que 7', en:'When rolling a die, getting a number smaller than 7', v:1 },
      { es:'Al lanzar un dado de seis caras, obtener el número 8', en:'When rolling a six sided die, getting the number 8', v:0 },
      { es:'Al lanzar una moneda, obtener sol', en:'When tossing a coin, getting heads', v:0.5 },
      { es:'Al lanzar un dado, obtener el número 3', en:'When rolling a die, getting the number 3', v:1/6 },
      { es:'Al lanzar un dado, obtener un número mayor que 2', en:'When rolling a die, getting a number greater than 2', v:4/6 }
    ];
    var RS = shufA(EVS).slice(0,3);
    var st = { r:0, tries:0, mark:null, shown:false, done:false, lock:false };
    var GEO = { x0:0, x1:0, y:0 };
    function draw(){
      var cv = document.getElementById('rcCv'); if (!cv) return;
      var G = fitCv(cv), ctx = G.ctx, W = G.w, H = G.h;
      var x0 = 34, x1 = W-34, y = Math.round(H*0.55), z, x;
      GEO = { x0:x0, x1:x1, y:y };
      var col = cssv('--green'), gold = cssv('--gold'), tx = cssv('--text3'), ok = cssv('--ok');
      ctx.strokeStyle = tx; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
      ctx.font = '500 11px "IBM Plex Sans", sans-serif';
      ctx.textAlign = 'center'; ctx.fillStyle = tx;
      for (z=0; z<=4; z++){
        x = x0 + (z/4)*(x1-x0);
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(x, y-7); ctx.lineTo(x, y+7); ctx.stroke();
        ctx.fillText(d2(z/4), x, y+22);
      }
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      ctx.fillText(T({es:'imposible',en:'impossible'}), x0, y-16);
      ctx.fillText(T({es:'seguro',en:'certain'}), x1, y-16);
      if (st.mark !== null){
        x = x0 + st.mark*(x1-x0);
        ctx.fillStyle = gold;
        ctx.beginPath(); ctx.moveTo(x, y-2); ctx.lineTo(x-7, y-16); ctx.lineTo(x+7, y-16); ctx.closePath(); ctx.fill();
        ctx.font = '600 11px "IBM Plex Mono", monospace';
        ctx.fillText(d2(st.mark), x, y+38);
      }
      if (st.shown){
        x = x0 + RS[st.r].v*(x1-x0);
        ctx.strokeStyle = ok; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, y-14); ctx.lineTo(x, y+14); ctx.stroke();
        ctx.fillStyle = ok; ctx.font = '600 11px "IBM Plex Mono", monospace';
        ctx.fillText(d2(RS[st.r].v), x, y-20);
      }
      ctx.fillStyle = col;
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'La recta de la probabilidad', en:'The probability line'})+'</div>'+
          '<div class="iw-box"><div class="rfb"><span class="okmsg">'+T({
            es:'Toda probabilidad vive en ese tramo: pegada al 0 cuando el evento casi no ocurre y pegada al 1 cuando casi siempre ocurre.',
            en:'Every probability lives on that stretch: near 0 when the event hardly ever happens and near 1 when it almost always happens.'
          })+'</span></div></div>';
        return;
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'La recta de la probabilidad', en:'The probability line'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'Toca la recta donde creas que va la probabilidad del evento. Puedes volver a tocar cuantas veces quieras antes de verificar.',
            en:'Tap the line where you think the probability of the event belongs. You can tap again as many times as you like before checking.'
          })+'</div>'+
          '<div class="goalbar">'+T(RS[st.r])+'</div>'+
          '<canvas class="gcanvas" id="rcCv" style="height:170px" onclick="rcTap(event)"></canvas>'+
          '<button class="rverify-btn" onclick="rcCheck()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="rcFb"></div>';
      draw();
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.r++; st.tries = 0; st.mark = null; st.shown = false; st.lock = false;
        if (st.r >= 3) st.done = true;
        render();
      }, ms);
    }
    window.rcTap = function(ev){
      if (st.done || st.lock) return;
      var cv = document.getElementById('rcCv'); if (!cv) return;
      var r = cv.getBoundingClientRect();
      var x = ev.clientX - r.left;
      var v = (x - GEO.x0) / (GEO.x1 - GEO.x0);
      if (v < 0) v = 0; if (v > 1) v = 1;
      st.mark = Math.round(v*100)/100;
      draw();
      var fb = document.getElementById('rcFb');
      if (fb) fb.textContent = T({ es:'Tu marca está en '+d2(st.mark)+'. Ajústala o toca Verificar.',
                                   en:'Your mark sits at '+d2(st.mark)+'. Adjust it or tap Check.' });
    };
    window.rcCheck = function(){
      if (st.done || st.lock) return;
      var fb = document.getElementById('rcFb'); if (!fb) return;
      if (st.mark === null){
        fb.textContent = T({es:'Primero toca la recta para colocar tu marca.', en:'First tap the line to place your mark.'});
        return;
      }
      var tv = RS[st.r].v, dif = st.mark - tv;
      if (Math.abs(dif) <= 0.06){
        st.shown = true; draw();
        fb.innerHTML = '<span class="okmsg">'+T({
          es:'Muy bien: ese evento vale '+d2(tv)+' en la recta.',
          en:'Nicely done: that event is worth '+d2(tv)+' on the line.'
        })+'</span>';
        adv(2100); return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.shown = true; draw();
        fb.innerHTML = T({ es:'La marca verde señala el valor correcto, '+d2(tv)+'. Cuenta los casos favorables del evento y compáralos con los posibles para ubicarlo.',
                           en:'The green mark shows the correct value, '+d2(tv)+'. Count the favourable cases of the event and compare them with the possible ones to place it.' });
        adv(3000); return;
      }
      var lejos = Math.abs(dif) > 0.25;
      fb.textContent = (dif > 0)
        ? T({ es:'Tu marca quedó a la derecha del valor: ese evento es'+(lejos?' bastante':'')+' menos probable de lo que marcaste.',
              en:'Your mark landed to the right of the value: that event is'+(lejos?' quite a bit':'')+' less likely than you marked.' })
        : T({ es:'Tu marca quedó a la izquierda del valor: ese evento es'+(lejos?' bastante':'')+' más probable de lo que marcaste.',
              en:'Your mark landed to the left of the value: that event is'+(lejos?' quite a bit':'')+' more likely than you marked.' });
    };
    render();
    REDRAW.push(draw);
  })();

  /* ---- P8 ---- */
  (function(){
    var o1 = (j8+1)%3, o2 = (j8+2)%3;
    if (vsel[7] === 0){
      var cval8 = 1 - p[j8];
      var op8 = pickD(cval8, [p[j8], p[o1], p[o2], cval8-0.1], d2, 0.05, 0.02, 0.98);
      SP = {
        title:{es:'Lo que le falta al evento', en:'What the event is missing'},
        q:{ es: comp()+' Se saca '+T(CX.art)+' '+T(CX.it1)+' sin mirar. ¿Cuál es la probabilidad de que no sea '+colS(j8)+'?',
            en: comp()+' One '+T(CX.it1)+' is drawn without looking. What is the probability that it is not '+colS(j8)+'?' },
        options: op8,
        correct: d2(cval8),
        hint:{ es:'Todos los resultados posibles reparten entre sí una probabilidad total de 1, así que el evento contrario se lleva lo que le falta al evento. También puedes contar directamente los objetos de los otros dos colores.',
               en:'All the possible results share out a total probability of 1, so the opposite event takes what the event is missing. You can also count directly the objects of the other two colours.' },
        exp:{ es:'Los objetos que no son '+colP(j8)+' son '+(cnt[o1]+cnt[o2])+' de '+N+', o sea '+frac(cnt[o1]+cnt[o2],N)+' = '+d2(cval8)+'. Es lo mismo que quitarle '+d2(p[j8])+' al total de 1.',
              en:'The objects that are not '+colP(j8)+' are '+(cnt[o1]+cnt[o2])+' out of '+N+', that is '+frac(cnt[o1]+cnt[o2],N)+' = '+d2(cval8)+'. It is the same as taking '+d2(p[j8])+' away from the total of 1.' },
        showWork:true
      };
    } else {
      var cval8b = p[j8] + p[o1];
      var op8b = pickD(cval8b, [p[j8], p[o1], p[o2], 1-cval8b], d2, 0.05, 0.02, 0.98);
      SP = {
        title:{es:'Dos colores a la vez', en:'Two colours at once'},
        q:{ es: comp()+' Se saca '+T(CX.art)+' '+T(CX.it1)+' sin mirar. ¿Cuál es la probabilidad de que sea '+colS(j8)+' o '+colS(o1)+'?',
            en: comp()+' One '+T(CX.it1)+' is drawn without looking. What is the probability that it is '+colS(j8)+' or '+colS(o1)+'?' },
        options: op8b,
        correct: d2(cval8b),
        hint:{ es:'El evento ocurre con los objetos de cualquiera de esos dos colores, así que los casos favorables son los de ambos grupos juntos frente al total.',
               en:'The event happens with objects of either of those two colours, so the favourable cases are both groups together against the total.' },
        exp:{ es:'Los casos favorables son '+cnt[j8]+' y '+cnt[o1]+', en total '+(cnt[j8]+cnt[o1])+' de '+N+', o sea '+frac(cnt[j8]+cnt[o1],N)+' = '+d2(cval8b)+'.',
              en:'The favourable cases are '+cnt[j8]+' and '+cnt[o1]+', in total '+(cnt[j8]+cnt[o1])+' out of '+N+', that is '+frac(cnt[j8]+cnt[o1],N)+' = '+d2(cval8b)+'.' },
        showWork:true
      };
    }
    addProb(SP);
  })();

  /* ============================================================
     CIERRE
     ============================================================ */
  sec(T({es:'Cierre', en:'Wrap up'}),
      T({es:'Dos situaciones para terminar', en:'Two situations to finish'}),
      '<p>'+T({
        es:'Las dos situaciones que siguen juntan todo lo anterior.',
        en:'The two situations that follow bring everything above together.'
      })+'</p>');

  /* ---- P9 ---- */
  (function(){
    var fmtV9 = function(v){ return T({ es: v+' veces', en: v+' times' }); };
    if (vsel[8] === 0){
      var op9 = pickD(esp, [cnt[j9], M-esp, Math.round(M/3), esp+kR], fmtV9, kR, 1, M);
      SP = {
        title:{es:'Cuántas veces se espera', en:'How many times to expect'},
        q:{ es: comp()+' Se va a repetir '+M+' veces la extracción, devolviendo cada vez el objeto a su lugar. ¿Cuántas veces se espera obtener '+colS(j9)+' aproximadamente?',
            en: comp()+' The draw is going to be repeated '+M+' times, putting the object back each time. Roughly how many times is '+colS(j9)+' expected to come up?' },
        options: op9,
        correct: fmtV9(esp),
        hint:{ es:'La probabilidad de ese color dice qué parte del total de repeticiones se espera para él; aplica esa parte a las repeticiones que se van a hacer.',
               en:'The probability of that colour says what share of all the trials is expected for it; apply that share to the trials that are going to be run.' },
        exp:{ es:'La probabilidad de ese color es '+d2(p[j9])+', y esa parte de '+M+' repeticiones da alrededor de '+esp+'. Es una estimación: en una tanda real el conteo queda cerca, no clavado.',
              en:'The probability of that colour is '+d2(p[j9])+', and that share of '+M+' trials gives around '+esp+'. It is an estimate: in a real run the count lands close, not exactly on it.' },
        showWork:true
      };
    } else {
      var noEsp = M - esp;
      var op9b = pickD(noEsp, [esp, N-cnt[j9], Math.round(M*2/3), noEsp-kR], fmtV9, kR, 1, M);
      SP = {
        title:{es:'Las veces que no', en:'The times it does not'},
        q:{ es: comp()+' Se va a repetir '+M+' veces la extracción, devolviendo cada vez el objeto a su lugar. ¿Cuántas veces se espera que el objeto extraído no sea '+colS(j9)+'?',
            en: comp()+' The draw is going to be repeated '+M+' times, putting the object back each time. How many times is the drawn object expected not to be '+colS(j9)+'?' },
        options: op9b,
        correct: fmtV9(noEsp),
        hint:{ es:'Averigua primero qué parte del total le toca al evento contrario y después aplícala al número de repeticiones que se van a hacer.',
               en:'First work out what share of the total goes to the opposite event and then apply it to the number of trials that will be run.' },
        exp:{ es:'La probabilidad de que no sea ese color es '+d2(1-p[j9])+', y esa parte de '+M+' repeticiones da alrededor de '+noEsp+'.',
              en:'The probability that it is not that colour is '+d2(1-p[j9])+', and that share of '+M+' trials gives around '+noEsp+'.' },
        showWork:true
      };
    }
    addProb(SP);
  })();

  /* ---- P10 ---- */
  (function(){
    if (vsel[9] === 0){
      var opsES = ['Lanzarla muchas veces y usar la frecuencia relativa obtenida',
                   'Repartir la probabilidad entre las dos posiciones en que puede caer',
                   'Lanzarla dos veces y quedarse con la posición que salió primero',
                   'Suponer que se comporta igual que una moneda bien equilibrada'];
      var opsEN = ['Tossing it many times and using the relative frequency obtained',
                   'Sharing the probability out between the two positions it can land in',
                   'Tossing it twice and keeping the position that came up first',
                   'Assuming it behaves just like a well balanced coin'];
      SP = {
        title:{es:'Cuando no se puede contar', en:'When counting is not possible'},
        q:{ es:'Se quiere conocer la probabilidad de que una tachuela caiga con la punta hacia arriba. La tachuela puede caer de dos maneras, pero por su forma una es más fácil que la otra. ¿Cómo conviene estimar esa probabilidad?',
            en:'The aim is to find the probability that a drawing pin lands point up. The pin can land in two ways, but because of its shape one is easier than the other. How is it best to estimate that probability?' },
        options:{ es:opsES, en:opsEN },
        correct:{ es:opsES[0], en:opsEN[0] },
        hint:{ es:'Recuerda qué condición se necesita para calcular una probabilidad contando casos, y qué herramienta queda cuando esa condición no se cumple.',
               en:'Recall which condition is needed to work out a probability by counting cases, and which tool is left when that condition does not hold.' },
        exp:{ es:'Contar las dos posiciones supondría que ambas son igual de fáciles, y no lo son. Al repetir el lanzamiento muchas veces, la frecuencia relativa se estabiliza y sirve como estimación de la probabilidad.',
              en:'Counting the two positions would assume both are equally easy, and they are not. By repeating the toss many times, the relative frequency settles down and works as an estimate of the probability.' },
        showWork:false
      };
    } else {
      var opsES2 = ['Lanzar una tachuela y anotar si la punta queda hacia arriba',
                    'Lanzar un dado común y anotar el número que queda arriba',
                    'Sacar sin mirar un objeto de una caja donde solo se distinguen por el color',
                    'Girar una ruleta dividida en sectores del mismo tamaño y anotar el sector'];
      var opsEN2 = ['Tossing a drawing pin and recording whether the point ends up facing up',
                    'Rolling an ordinary die and recording the number facing up',
                    'Drawing an object without looking from a box where they differ only in colour',
                    'Spinning a wheel divided into sectors of the same size and recording the sector'];
      SP = {
        title:{es:'El conteo no siempre sirve', en:'Counting does not always work'},
        q:{ es:'¿En cuál de estos experimentos no se puede obtener la probabilidad contando los casos favorables frente a los posibles?',
            en:'In which of these experiments can the probability not be obtained by counting favourable cases against possible ones?' },
        options:{ es:opsES2, en:opsEN2 },
        correct:{ es:opsES2[0], en:opsEN2[0] },
        hint:{ es:'Revisa en cuál de los cuatro experimentos los resultados posibles no tienen todos la misma facilidad de ocurrir.',
               en:'Check which of the four experiments has possible results that are not all equally easy to happen.' },
        exp:{ es:'En los otros tres los resultados son igual de fáciles y basta contarlos. La tachuela cae con más facilidad de una manera que de la otra, así que su probabilidad se estima repitiendo el lanzamiento.',
              en:'In the other three the results are equally easy and counting them is enough. The pin lands more easily one way than the other, so its probability is estimated by repeating the toss.' },
        showWork:false
      };
    }
    addProb(SP);
  })();

  /* los canvas se dibujan de nuevo cuando la pantalla ya es visible */
  setTimeout(function(){
    for (var q=0;q<REDRAW.length;q++){ try { REDRAW[q](); } catch(e){} }
  }, 220);
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Experimentos Aleatorios y Frecuencia Relativa/Teórica';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
