<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igualdad de Derechos y Bienestar Colectivo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS (concept manipulatives) ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1.1rem 0; }
.wgt-h { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.2rem; }
.wgt-q { font-size:.82rem; color:var(--text3); margin-bottom:.85rem; }
.wmsg { margin-top:.75rem; padding:.6rem .85rem; border-radius:0 8px 8px 0; border-left:3px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.83rem; }
.wmsg.ok   { background:var(--ok-bg);   color:var(--ok);    border-left-color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.wbtn { margin-top:.75rem; margin-right:.4rem; background:var(--green); color:#fff; border:none; border-radius:8px; padding:.55rem 1.1rem; font-size:.83rem; font-weight:600; cursor:pointer; min-height:44px; }
.wbtn:hover { background:var(--green-dark); }
.wbtn.alt { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.55rem; }
.wcase { background:var(--surface2); border-radius:8px; padding:.75rem .9rem; font-size:.86rem; color:var(--text); margin-bottom:.55rem; }
.chips { display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0; }
.chip { border:1.5px solid var(--border); border-radius:22px; padding:.4rem .85rem; font-size:.8rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:38px; display:flex; align-items:center; transition:all .14s; }
.chip:hover { border-color:var(--green); }
.chip.sel  { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.chip.good { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.chip.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.chip.used { opacity:.5; }

/* bars: reparte los apoyos */
.brow { display:grid; grid-template-columns:1fr; gap:.35rem; padding:.6rem .7rem; border:1px solid var(--border); border-radius:9px; margin-bottom:.55rem; background:var(--surface2); }
.bhead { display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
.bname { font-size:.84rem; font-weight:600; }
.bwhy  { font-size:.74rem; color:var(--text3); }
.btrack { position:relative; height:20px; border:1px solid var(--border); border-radius:6px; background:var(--surface); overflow:hidden; }
.bfill { height:100%; width:0%; background:var(--green); transition:width .28s; }
.bfill.full { background:var(--ok); }
.bfill.over { background:var(--gold); }
.bline { position:absolute; top:0; bottom:0; width:2px; background:var(--bad); }
.bctrl { display:flex; align-items:center; gap:.4rem; }
.bbtn { width:34px; height:34px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text2); font-size:1rem; cursor:pointer; }
.bbtn:hover { border-color:var(--green); color:var(--green); }
.bcount { font-family:'IBM Plex Mono',monospace; font-size:.82rem; min-width:2.6rem; text-align:center; color:var(--text2); }

/* meters: constructor de propuestas */
.wcols { display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem; }
.colh { font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); margin-bottom:.35rem; }
.optbox { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .65rem; font-size:.78rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; transition:all .14s; }
.optbox:hover { border-color:var(--green); }
.optbox.sel { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.mtr { margin-bottom:.5rem; }
.mtrlbl { display:flex; justify-content:space-between; font-size:.73rem; color:var(--text3); margin-bottom:.2rem; }
.mtrtrack { height:12px; border:1px solid var(--border); border-radius:6px; background:var(--surface2); overflow:hidden; }
.mtrfill { height:100%; width:0%; background:var(--gold); transition:width .3s; }
.mtrfill.ok { background:var(--ok); }

/* sliders: presupuesto */
.sldrow { margin-bottom:.75rem; }
.sldlbl { display:flex; justify-content:space-between; gap:.5rem; font-size:.79rem; color:var(--text2); margin-bottom:.25rem; }
.sldrow input[type=range] { width:100%; accent-color:var(--green); height:24px; }
.sldnote { font-size:.72rem; color:var(--text3); }
.metrics4 { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; margin-top:.8rem; }

/* ruta: ordena los pasos */
.seq { display:flex; flex-wrap:wrap; gap:.35rem; margin:.5rem 0; min-height:1.9rem; }
.seqitem { background:var(--green-bg); color:var(--green-dark); border-radius:6px; padding:.3rem .6rem; font-size:.74rem; font-weight:600; }
.step { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .75rem; font-size:.81rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; transition:all .14s; }
.step:hover { border-color:var(--green); }
.step.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); opacity:.6; cursor:default; }
@media (max-width:600px) {
  .wcols { grid-template-columns:1fr; }
  .metrics4 { grid-template-columns:repeat(2,1fr); }
  .wgt { padding:.85rem; }
  .bhead { flex-direction:column; align-items:flex-start; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->

    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce2_t02_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce2_t02_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce2_t02_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

var correctCount  = 0;

      });
    }
  } catch(e) {}
})();

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-gen');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line

  var lx = PW - M - 36;

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'fce2_t02_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* Four distinct numeric options, correct first (shuffled later by addProblem). */
function numOpts(correct, cands){
  var out = [String(correct)], i, v;
  for (i = 0; i < cands.length && out.length < 4; i++) {
    v = String(cands[i]);
    if (cands[i] > 0 && out.indexOf(v) < 0) out.push(v);
  }
  var extra = 1;
  while (out.length < 4) { v = String(correct + extra); if (out.indexOf(v) < 0) out.push(v); extra++; }
  return out;
}

/* ================================================
   WIDGET 1 - REPARTE LOS APOYOS
   Three people start from different levels; the student hands out a fixed
   number of supports. Bars redraw live, the message names who is short and
   who is over the line. Reveal on the third failed check (Rule 8, A).
   ================================================ */
var APY = null;
function buildApoyos(rng){
  var sets = [
    [ { name:'Nadia',   base:70, wes:'vive a cuarenta minutos y el camión pasa dos veces al día',
                                 wen:'lives forty minutes away and the bus passes only twice a day' },
      { name:'Beto',    base:50, wes:'usa silla de ruedas y el taller está en el segundo piso',
                                 wen:'uses a wheelchair and the workshop is on the second floor' },
      { name:'Citlali', base:40, wes:'las tareas se entregan en línea y en su casa no hay conexión',
                                 wen:'homework is handed in online and there is no connection at home' } ],
    [ { name:'Rubén',   base:80, wes:'llega tarde porque acompaña a su hermana a la primaria',
                                 wen:'arrives late because he walks his sister to primary school' },
      { name:'Amaya',   base:60, wes:'oye poco y en el salón nadie usa el micrófono del maestro',
                                 wen:'has low hearing and nobody in the room uses the teacher microphone' },
      { name:'Toño',    base:30, wes:'trabaja en la milpa por la tarde y no alcanza la hora de asesoría',
                                 wen:'works in the cornfield in the afternoon and misses the tutoring hour' } ],
    [ { name:'Lucía',   base:70, wes:'lee en tsotsil y los materiales solo están en español',
                                 wen:'reads in Tsotsil and the materials are only in Spanish' },
      { name:'Marcos',  base:50, wes:'su familia no puede pagar el uniforme deportivo que se pide',
                                 wen:'his family cannot pay for the sports uniform that is required' },
      { name:'Fer',     base:40, wes:'la ruta a la escuela se inunda tres meses al año',
                                 wen:'the road to school floods three months a year' } ]
  ];
  var pp = sets[Math.floor(rng() * sets.length)];
  var total = 0, i;
  for (i = 0; i < pp.length; i++) total += (100 - pp[i].base) / 10;
  APY = { people:pp, c:[0,0,0], total:total, tries:0, revealed:false, msg:null };
  return '<div class="wgt" id="wApoyos">' +
      '<div class="wgt-h">' + S('Reparte los apoyos','Hand out the supports') + '</div>' +
      '<div class="wgt-q">' + S('Cada persona parte de un punto distinto. Cada apoyo suma 10 puntos y la línea roja marca el acceso pleno al derecho.',
                                'Each person starts from a different point. Each support adds 10 points and the red line marks full access to the right.') + '</div>' +
      '<div id="apyBox"></div>' +
    '</div>';
}
function apyRender(){
  if (!APY) return;
  var box = document.getElementById('apyBox');
  if (!box) return;
  var used = 0, i;
  for (i = 0; i < APY.c.length; i++) used += APY.c[i];
  var left = APY.total - used;
  var h = '', short = [], over = [];
  for (i = 0; i < APY.people.length; i++) {
    var p = APY.people[i], val = p.base + APY.c[i] * 10;
    if (val < 100) short.push({ n:p.name, d:100 - val });
    if (val > 100) over.push({ n:p.name, d:val - 100 });
    var w = Math.min(val, 130) / 130 * 100;
    var cls = val === 100 ? 'bfill full' : (val > 100 ? 'bfill over' : 'bfill');
    h += '<div class="brow">' +
        '<div class="bhead">' +
          '<div><div class="bname">' + p.name + '</div>' +
          '<div class="bwhy">' + (LANG === 'es' ? p.wes : p.wen) + '</div></div>' +
          '<div class="bctrl">' +
            '<button class="bbtn" onclick="apyAdd(' + i + ',-1)">−</button>' +
            '<div class="bcount">' + val + '</div>' +
            '<button class="bbtn" onclick="apyAdd(' + i + ',1)">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="btrack"><div class="' + cls + '" style="width:' + w.toFixed(1) + '%"></div>' +
        '<div class="bline" style="left:76.9%"></div></div>' +
      '</div>';
  }
  var solved = (left === 0 && short.length === 0);
  var msg, mc = 'wmsg';
  if (APY.revealed) { msg = APY.msg; mc = 'wmsg warn'; }
  else if (solved) {
    msg = S('Las tres personas llegaron a la línea y no sobró ningún apoyo. Para que el resultado fuera igual, el apoyo tuvo que ser distinto.',
            'All three reached the line and no support was left over. For the result to be equal, the support had to be different.');
    mc = 'wmsg ok';
  } else if (left > 0) {
    msg = S('Te quedan ' + left + ' apoyos por repartir. Observa quién está más lejos de la línea.',
            'You still have ' + left + ' supports to hand out. Look at who is furthest from the line.');
    mc = 'wmsg warn';
  } else {
    var s0 = short[0];
    msg = over.length
      ? S('A ' + s0.n + ' le faltan ' + s0.d + ' puntos y ' + over[0].n + ' quedó ' + over[0].d + ' puntos arriba de la línea. Mueve apoyos de quien ya pasó hacia quien no llega.',
          s0.n + ' is still ' + s0.d + ' points short while ' + over[0].n + ' ended ' + over[0].d + ' points above the line. Move supports from whoever passed to whoever has not arrived.')
      : S('A ' + s0.n + ' le faltan ' + s0.d + ' puntos. Revisa de dónde puedes tomar ese apoyo.',
          s0.n + ' is still ' + s0.d + ' points short. Check where you can take that support from.');
    mc = 'wmsg warn';
  }
  box.innerHTML = h +
    '<div class="' + mc + '">' + msg + '</div>' +
    ((APY.revealed || solved) ? '' :
      '<button class="wbtn" onclick="apyCheck()">' + S('Comprobar reparto','Check the split') + '</button>') +
    '<div class="wprog">' + S('Apoyos disponibles: ','Supports available: ') + left + S(' de ',' of ') + APY.total + '</div>';
}
function apyAdd(i, d){
  if (!APY || APY.revealed) return;
  var used = 0, k;
  for (k = 0; k < APY.c.length; k++) used += APY.c[k];
  if (d > 0 && used >= APY.total) return;
  if (d < 0 && APY.c[i] <= 0) return;
  APY.c[i] += d;
  apyRender();
}
function apyCheck(){
  if (!APY || APY.revealed) return;
  var k, ok = true;
  for (k = 0; k < APY.c.length; k++) if (APY.people[k].base + APY.c[k] * 10 !== 100) ok = false;
  if (!ok) {
    APY.tries++;
    if (APY.tries >= 3) {
      var sol = [], txt = [];
      for (k = 0; k < APY.people.length; k++) {
        var nd = (100 - APY.people[k].base) / 10;
        sol.push(nd); txt.push(APY.people[k].name + ': ' + nd);
      }
      APY.c = sol; APY.revealed = true;
      APY.msg = S('Reparto que iguala el resultado, ' + txt.join(', ') + '. Quien parte más abajo necesita más apoyo para alcanzar la misma línea.',
                  'The split that equalizes the result, ' + txt.join(', ') + '. Whoever starts lower needs more support to reach the same line.');
    }
  }
  apyRender();
}

function brrRender(){

  }
  var c = BRR.rounds[BRR.i];
  var chips = BRR.kinds.map(function(kd){
    var cls = 'chip';
    if (BRR.revealed && kd.k === c.k) cls += ' good';
    else if (BRR.wrong.indexOf(kd.k) >= 0) cls += ' miss used';

  }).join('');

}
function brrPick(k){
  if (!BRR || BRR.revealed || BRR.done) return;
  var c = BRR.rounds[BRR.i], i;
  if (k === c.k) {
    BRR.revealed = true;
    BRR.msg = S('Exacto. ','Exactly. ') + (LANG === 'es' ? c.wes : c.wen);
    BRR.msgCls = 'wmsg ok';
  } else {
    if (BRR.wrong.indexOf(k) < 0) BRR.wrong.push(k);
    BRR.tries++;
    var kd = null, right = null;
    for (i = 0; i < BRR.kinds.length; i++) {
      if (BRR.kinds[i].k === k) kd = BRR.kinds[i];
      if (BRR.kinds[i].k === c.k) right = BRR.kinds[i];
    }
    if (BRR.tries >= 3) {
      BRR.revealed = true;
      BRR.msg = S('La barrera era ','The barrier was ') + '<strong>' + right[LANG] + '</strong>. ' +
                (LANG === 'es' ? c.wes : c.wen);
      BRR.msgCls = 'wmsg warn';
    } else {
      BRR.msg = (LANG === 'es' ? kd.nes : kd.nen);
      BRR.msgCls = 'wmsg warn';
    }
  }
  brrRender();
}
function brrNext(){
  if (!BRR) return;
  BRR.i++; BRR.tries = 0; BRR.wrong = []; BRR.revealed = false; BRR.msg = null; BRR.msgCls = null;
  if (BRR.i >= BRR.rounds.length) BRR.done = true;
  brrRender();
}

  ];
  var colB = [
    { es:'Quita la barrera concreta: instala la rampa y la señalización', en:'Removes the concrete barrier: installs the ramp and the signage',
      al:85, dg:90, ct:85, nes:'', nen:'' },
    { es:'Organiza una campaña para que la gente sea más amable', en:'Organizes a campaign asking people to be kinder',
      al:55, dg:70, ct:45,
      nes:'La buena intención no mueve el escalón: la causa del caso sigue en su lugar.',
      nen:'Good intentions do not move the step: the cause of the case stays where it was.' },
    { es:'Publica en el periódico mural la lista de quienes tienen la carencia', en:'Posts on the wall newspaper the list of those who lack the service',
      al:50, dg:10, ct:40,
      nes:'Exhibir a las personas por su carencia les cobra un precio en dignidad.',
      nen:'Displaying people for what they lack charges them a price in dignity.' }
  ];
  var colC = [
    { es:'Con una colecta única el día del festival', en:'With a one time collection on festival day',
      al:60, dg:70, ct:30,
      nes:'Un ingreso de una sola vez termina cuando termina la fiesta.',
      nen:'A one time income ends when the party ends.' },
    { es:'Con una partida del comité revisada cada ciclo y una persona responsable', en:'With a committee budget line reviewed each school year and a person in charge',
      al:70, dg:80, ct:98, nes:'', nen:'' },
    { es:'Con la voluntad de quien esté en la dirección ese año', en:'With the goodwill of whoever runs the school that year',
      al:55, dg:65, ct:35,
      nes:'Si todo depende de una persona, la medida se cae en cuanto esa persona cambia.',
      nen:'If everything depends on one person, the measure falls as soon as that person changes.' }
  ];
  PRP = { a:shuffle(colA, rng), b:shuffle(colB, rng), c:shuffle(colC, rng),
          sa:-1, sb:-1, sc:-1, tries:0, revealed:false, msg:null, msgCls:null };
  return '<div class="wgt" id="wPropuesta">' +
      '<div class="wgt-h">' + S('Constructor de propuestas','Proposal builder') + '</div>' +
      '<div class="wgt-q">' + S('Arma una propuesta eligiendo una pieza de cada columna. Los tres medidores se mueven mientras eliges.',
                                'Build a proposal by picking one piece from each column. The three meters move as you choose.') + '</div>' +
      '<div id="prpBox"></div>' +
    '</div>';
}
function prpCol(list, sel, letter){
  return list.map(function(o, i){
    return '<div class="optbox' + (sel === i ? ' sel' : '') + '" onclick="prpPick(\'' + letter + '\',' + i + ')">' +
      o[LANG] + '</div>';
  }).join('');
}
function prpMeter(lbl, val){
  return '<div class="mtr"><div class="mtrlbl"><span>' + lbl + '</span><span>' + val + '</span></div>' +
    '<div class="mtrtrack"><div class="mtrfill' + (val >= 80 ? ' ok' : '') + '" style="width:' + val + '%"></div></div></div>';
}
function prpScores(){
  if (!PRP || PRP.sa < 0 || PRP.sb < 0 || PRP.sc < 0) return null;
  var x = PRP.a[PRP.sa], y = PRP.b[PRP.sb], z = PRP.c[PRP.sc];
  return {
    al: Math.round((x.al + y.al + z.al) / 3),
    dg: Math.round((x.dg + y.dg + z.dg) / 3),
    ct: Math.round((x.ct + y.ct + z.ct) / 3),
    parts: [x, y, z]
  };
}
function prpRender(){
  if (!PRP) return;
  var box = document.getElementById('prpBox');
  if (!box) return;
  var sc = prpScores();
  var al = sc ? sc.al : 0, dg = sc ? sc.dg : 0, ct = sc ? sc.ct : 0;
  var solved = !!(sc && al >= 80 && dg >= 80 && ct >= 80);
  var msg, mc = 'wmsg';
  if (PRP.revealed) { msg = PRP.msg; mc = 'wmsg warn'; }
  else if (!sc) {
    msg = S('Elige una pieza de cada columna para ver cómo se comporta tu propuesta.',
            'Pick one piece from each column to see how your proposal behaves.');
  } else if (solved) {
    msg = S('Tu propuesta llega a todo el grupo, no exhibe a nadie y tiene quién la sostenga el próximo ciclo.',
            'Your proposal reaches the whole group, exposes nobody and has someone to sustain it next school year.');
    mc = 'wmsg ok';
  } else {
    var low = 'al', lv = al;
    if (dg < lv) { low = 'dg'; lv = dg; }
    if (ct < lv) { low = 'ct'; lv = ct; }
    var worst = null, i;
    for (i = 0; i < sc.parts.length; i++) {
      if (worst === null || sc.parts[i][low] < worst[low]) worst = sc.parts[i];
    }
    var lbl = low === 'al' ? S('el alcance','reach') : (low === 'dg' ? S('la dignidad','dignity') : S('la continuidad','continuity'));
    msg = S('Lo más bajo es ' + lbl + '. ', 'The lowest is ' + lbl + '. ') +
          (LANG === 'es' ? (worst.nes || 'Cambia una pieza y observa el medidor.')
                         : (worst.nen || 'Change one piece and watch the meter.'));
    mc = 'wmsg warn';
  }
  box.innerHTML =
    '<div class="wcols">' +
      '<div><div class="colh">' + S('¿A quién llega?','Who does it reach?') + '</div>' + prpCol(PRP.a, PRP.sa, 'a') + '</div>' +
      '<div><div class="colh">' + S('¿Qué hace?','What does it do?') + '</div>' + prpCol(PRP.b, PRP.sb, 'b') + '</div>' +
      '<div><div class="colh">' + S('¿Cómo se sostiene?','How is it sustained?') + '</div>' + prpCol(PRP.c, PRP.sc, 'c') + '</div>' +
    '</div>' +
    '<div style="margin-top:.9rem">' +
      prpMeter(S('Alcance','Reach'), al) +
      prpMeter(S('Dignidad','Dignity'), dg) +
      prpMeter(S('Continuidad','Continuity'), ct) +
    '</div>' +
    '<div class="' + mc + '">' + msg + '</div>' +
    ((PRP.revealed || solved) ? '' :
      '<button class="wbtn" onclick="prpCheck()">' + S('Comprobar propuesta','Check the proposal') + '</button>');
}
function prpPick(col, i){
  if (!PRP || PRP.revealed) return;
  if (col === 'a') PRP.sa = i;
  if (col === 'b') PRP.sb = i;
  if (col === 'c') PRP.sc = i;
  prpRender();
}
function prpCheck(){
  if (!PRP || PRP.revealed) return;
  var sc = prpScores();
  if (!sc || sc.al < 80 || sc.dg < 80 || sc.ct < 80) {
    PRP.tries++;
    if (PRP.tries >= 3) {
      var best = function(list){
        var bi = 0, i;
        for (i = 1; i < list.length; i++) {
          if (list[i].al + list[i].dg + list[i].ct > list[bi].al + list[bi].dg + list[bi].ct) bi = i;
        }
        return bi;
      };
      PRP.sa = best(PRP.a); PRP.sb = best(PRP.b); PRP.sc = best(PRP.c);
      PRP.revealed = true;
      PRP.msg = S('Esta combinación sostiene los tres medidores: alcanza a todo el grupo afectado, se dirige a la barrera concreta y tiene recursos y responsable para el próximo ciclo.',
                  'This combination holds the three meters up: it reaches the whole affected group, aims at the concrete barrier, and has resources and a person in charge for next school year.');
    }
  }
  prpRender();
}

/* ================================================
   WIDGET 4 - EL PRESUPUESTO DEL COMITÉ
   Four sliders share one budget. Coverage, people served and people left out
   recalculate on every drag; the message points at what is off.
   ================================================ */
var PRS = null;
function buildPresu(rng){
  var sets = [
    { budget:46000, r:[
      { es:'Rampa y señalización en la entrada', en:'Ramp and signage at the entrance', people:40,  cost:300 },
      { es:'Becas de transporte escolar',        en:'School transport grants',          people:60,  cost:200 },
      { es:'Intérprete y materiales en lengua originaria', en:'Interpreter and materials in an Indigenous language', people:25, cost:400 },
      { es:'Taller de buen trato en cada grupo', en:'Respectful treatment workshop in every group', people:120, cost:100 } ] },
    { budget:48000, r:[
      { es:'Banqueta y cruce accesible en la esquina', en:'Accessible sidewalk and crossing at the corner', people:50, cost:300 },
      { es:'Becas de transporte escolar',        en:'School transport grants',          people:40,  cost:250 },
      { es:'Avisos en lengua de señas y en lengua originaria', en:'Notices in sign language and in an Indigenous language', people:20, cost:400 },
      { es:'Taller de buen trato en cada grupo', en:'Respectful treatment workshop in every group', people:150, cost:100 } ] }
  ];
  var st = sets[Math.floor(rng() * sets.length)];
  PRS = { budget:st.budget, r:st.r };
  var rows = st.r.map(function(rb, i){
    var full = rb.people * rb.cost;
    return '<div class="sldrow">' +
      '<div class="sldlbl"><span>' + rb[LANG] + '</span><span id="prv' + i + '">0</span></div>' +
      '<input type="range" id="prs' + i + '" min="0" max="' + (full + 4000) + '" step="1000" value="0" oninput="preUpdate()">' +
      '<div class="sldnote" id="prn' + i + '"></div>' +
    '</div>';
  }).join('');
  return '<div class="wgt" id="wPresupuesto">' +
      '<div class="wgt-h">' + S('El presupuesto del comité','The committee budget') + '</div>' +
      '<div class="wgt-q">' + S('El comité tiene ' + st.budget + ' pesos. Reparte el dinero y observa a cuántas personas alcanza cada rubro.',
                                'The committee has ' + st.budget + ' pesos. Split the money and watch how many people each item reaches.') + '</div>' +
      rows +
      '<div class="metrics4">' +
        '<div class="metric"><div class="mlbl">' + S('Asignado','Assigned') + '</div><div class="mnum cs" id="prTot">0</div></div>' +
        '<div class="metric"><div class="mlbl">' + S('Disponible','Available') + '</div><div class="mnum ps" id="prLeft">' + st.budget + '</div></div>' +
        '<div class="metric"><div class="mlbl">' + S('Personas atendidas','People served') + '</div><div class="mnum ts" id="prIn">0</div></div>' +
        '<div class="metric"><div class="mlbl">' + S('Personas fuera','People left out') + '</div><div class="mnum ts" id="prOut">0</div></div>' +
      '</div>' +
      '<div class="wmsg" id="prMsg"></div>' +
    '</div>';
}
function preUpdate(){
  if (!PRS) return;
  var i, assigned = 0, served = 0, out = 0, waste = -1, wasteAmt = 0, gap = -1, gapPeople = 0;
  for (i = 0; i < PRS.r.length; i++) {
    var el = document.getElementById('prs' + i);
    if (!el) return;
    var v = parseInt(el.value, 10) || 0;
    var rb = PRS.r[i];
    var full = rb.people * rb.cost;
    var can = Math.min(Math.floor(v / rb.cost), rb.people);
    assigned += v; served += can; out += (rb.people - can);
    if (v > full && (v - full) > wasteAmt) { waste = i; wasteAmt = v - full; }
    if (can < rb.people && (rb.people - can) > gapPeople) { gap = i; gapPeople = rb.people - can; }
    var lv = document.getElementById('prv' + i);
    if (lv) lv.textContent = v;
    var ln = document.getElementById('prn' + i);
    if (ln) ln.textContent = S('Atiende a ' + can + ' de ' + rb.people + ' personas',
                               'Serves ' + can + ' of ' + rb.people + ' people');
  }
  var left = PRS.budget - assigned;
  var set = function(id, val){ var e = document.getElementById(id); if (e) e.textContent = val; };
  set('prTot', assigned); set('prLeft', left); set('prIn', served); set('prOut', out);
  var m = document.getElementById('prMsg');
  if (!m) return;
  var msg, cls = 'wmsg';
  if (left < 0) {
    msg = S('Te pasaste por ' + (-left) + ' pesos. El comité no puede gastar lo que no tiene.',
            'You went over by ' + (-left) + ' pesos. The committee cannot spend what it does not have.');
    cls = 'wmsg warn';
  } else if (out === 0 && left === 0) {
    msg = S('Ningún grupo quedó fuera y no sobró un peso. Eso es bienestar colectivo: la cobertura llega hasta el último grupo.',
            'No group was left out and not a single peso was left over. That is collective wellbeing: coverage reaches the last group.');
    cls = 'wmsg ok';
  } else if (waste >= 0) {
    msg = S('En "' + PRS.r[waste][LANG] + '" asignaste ' + wasteAmt + ' pesos de más. Ese dinero deja fuera a personas en otro rubro.',
            'In "' + PRS.r[waste][LANG] + '" you assigned ' + wasteAmt + ' pesos too many. That money leaves people out in another item.');
    cls = 'wmsg warn';
  } else if (gap >= 0) {
    msg = S('Todavía quedan ' + out + ' personas fuera. Las que más faltan están en "' + PRS.r[gap][LANG] + '", con ' + gapPeople + ' sin atender.',
            'There are still ' + out + ' people left out. Most of them are in "' + PRS.r[gap][LANG] + '", with ' + gapPeople + ' unserved.');
    cls = 'wmsg warn';
  } else {
    msg = S('Te quedan ' + left + ' pesos disponibles.','You still have ' + left + ' pesos available.');
    cls = 'wmsg warn';
  }
  m.className = cls; m.innerHTML = msg;
}

/* ================================================
   WIDGET 5 - ORDENA LA RUTA DE LA PROPUESTA
   Steps are tapped in order; a wrong pick explains what has to come first.
   The last step can be removed at any time; reveal on the third miss.
   ================================================ */
var RUT = null;
function buildRuta(rng){
  var steps = [
    { o:1, es:'Reconocer quiénes quedan fuera y por qué', en:'Recognize who is left out and why',
      wes:'Sin saber a quiénes afecta la barrera y de dónde viene, cualquier medida se elige a ciegas.',
      wen:'Without knowing who the barrier affects and where it comes from, any measure is chosen blindly.' },
    { o:2, es:'Escuchar a las personas afectadas', en:'Listen to the people affected',
      wes:'Quien vive la barrera sabe qué la quita de verdad y qué solo la disimula.',
      wen:'Whoever lives the barrier knows what really removes it and what only hides it.' },
    { o:3, es:'Elegir la medida que se dirige a esa causa', en:'Choose the measure aimed at that cause',
      wes:'La medida se decide después del diagnóstico, no antes.',
      wen:'The measure is decided after the diagnosis, not before.' },
    { o:4, es:'Definir quién la sostiene y con qué recursos', en:'Define who sustains it and with what resources',
      wes:'Una medida sin responsable ni recursos dura lo que dura el entusiasmo.',
      wen:'A measure with no one in charge and no resources lasts as long as the enthusiasm lasts.' },
    { o:5, es:'Revisar los resultados y corregir', en:'Review the results and correct',
      wes:'Al final se comprueba si la barrera cayó de verdad y se ajusta lo que haga falta.',
      wen:'At the end you check whether the barrier really fell and adjust whatever is needed.' }
  ];
  RUT = { steps:shuffle(steps, rng), placed:[], tries:0, revealed:false, msg:null, msgCls:null };
  return '<div class="wgt" id="wRuta">' +
      '<div class="wgt-h">' + S('Ordena la ruta de la propuesta','Put the proposal route in order') + '</div>' +
      '<div class="wgt-q">' + S('Toca los pasos en el orden que seguirías para que una propuesta funcione.',
                                'Tap the steps in the order you would follow for a proposal to work.') + '</div>' +
      '<div id="rutBox"></div>' +
    '</div>';
}
function rutRender(){
  if (!RUT) return;
  var box = document.getElementById('rutBox');
  if (!box) return;
  var seq = RUT.placed.map(function(o, i){
    return '<div class="seqitem">' + (i + 1) + '. ' + o[LANG] + '</div>';
  }).join('');
  var list = RUT.steps.map(function(o, i){
    var done = RUT.placed.indexOf(o) >= 0;
    return '<div class="step' + (done ? ' done' : '') + '"' +
      (done ? '' : ' onclick="rutTap(' + i + ')"') + '>' + o[LANG] + '</div>';
  }).join('');
  var msg = RUT.msg || S('Empieza por el paso que da la información que todo lo demás necesita.',
                         'Start with the step that gives the information everything else needs.');
  box.innerHTML =
    '<div class="seq">' + (seq || '<span class="wprog">' + S('Aún no colocas ningún paso.','No step placed yet.') + '</span>') + '</div>' +
    list +
    '<div class="' + (RUT.msgCls || 'wmsg') + '">' + msg + '</div>' +
    (RUT.placed.length > 0 && !RUT.revealed && RUT.placed.length < RUT.steps.length
      ? '<button class="wbtn alt" onclick="rutUndo()">' + S('Quitar el último','Remove the last one') + '</button>' : '');
}
function rutTap(i){
  if (!RUT || RUT.revealed) return;
  var o = RUT.steps[i];
  if (RUT.placed.indexOf(o) >= 0) return;
  var expected = RUT.placed.length + 1;
  if (o.o === expected) {
    RUT.placed.push(o);
    if (RUT.placed.length === RUT.steps.length) {
      RUT.msg = S('Esa es la ruta completa: diagnóstico, escucha, medida, recursos y seguimiento.',
                  'That is the full route: diagnosis, listening, measure, resources and follow up.');
      RUT.msgCls = 'wmsg ok';
    } else {
      RUT.msg = S('Va bien. ','Going well. ') + (LANG === 'es' ? o.wes : o.wen);
      RUT.msgCls = 'wmsg ok';
    }
  } else {
    RUT.tries++;
    var right = null, k;
    for (k = 0; k < RUT.steps.length; k++) if (RUT.steps[k].o === expected) right = RUT.steps[k];
    if (RUT.tries >= 3) {
      RUT.placed = RUT.steps.slice().sort(function(a, b){ return a.o - b.o; });
      RUT.revealed = true;
      RUT.msg = S('Esta es la ruta completa. Cada paso entrega lo que el siguiente necesita para no fallar.',
                  'This is the full route. Each step delivers what the next one needs in order not to fail.');
      RUT.msgCls = 'wmsg warn';
    } else {
      RUT.msg = S('Todavía no toca ese paso. ','That step is not next yet. ') + (LANG === 'es' ? right.wes : right.wen);
      RUT.msgCls = 'wmsg warn';
    }
  }
  rutRender();
}
function rutUndo(){
  if (!RUT || RUT.revealed) return;
  RUT.placed.pop();
  RUT.msg = S('Quitaste el último paso. Puedes volver a intentarlo.','You removed the last step. You can try again.');
  RUT.msgCls = 'wmsg';
  rutRender();
}

             en:'At one secondary school every notice is posted on the same board, in Spanish. A family that reads only in Tseltal never finds out about the calls. What does this case show?' },

                    en:'The rule is the same for every family, so formal equality holds. The result is not the same: one family ends up without the information. Substantive equality forces you to look at that result and remove the language barrier, for instance by translating the calls.' } },

      options:{ es:[
        'Que el requisito es idéntico para todas las personas, pero el acceso real no lo es y hay que ofrecer otra vía de registro.',

        'Que la beca dejó de ser un derecho en el momento en que el trámite se volvió electrónico.',

        en:[
        'That the requirement is identical for everyone, but real access is not, and another registration route has to be offered.',
        'That communities without signal should wait for next year call instead.',
        'That the grant stopped being a right the moment the procedure became electronic.',
        'That the town hall must cut the number of grants until every community has signal.' ] },

      hint:{ es:'Pregúntate si el trámite tratado igual para todas produjo también el mismo acceso para todas.',
             en:'Ask whether a procedure applied equally to everyone also produced the same access for everyone.' },
      explanation:{ es:'El requisito escrito es el mismo, pero el resultado depende de algo que no está en manos de las familias: la señal. La igualdad sustantiva pide abrir una vía presencial o comunitaria para que la convocatoria alcance a todos los hogares.',
                    en:'The written requirement is the same, but the result depends on something families do not control: the signal. Substantive equality asks for an in person or community route so the call reaches every household.' } }

  /* ── PROBLEMA 2 (numérico) ──────────────────────────────────── */
  var c2 = pick([300, 400], rng);
  var m2 = pick([9, 10], rng);
  var k2 = pick([7, 8], rng);
  var f2 = pick([4, 5, 6], rng);
  var a2 = c2 * m2 * k2;
  var e2 = k2 + f2;
  addProblem({
    title:{ es:'Becas de transporte', en:'Transport grants' }, showWork:true,
    stmt:{ es:'El comité de una secundaria reunió ' + a2 + ' pesos para becas de transporte. Cada beca cubre ' + c2 + ' pesos al mes durante ' + m2 + ' meses del ciclo escolar. En la escuela hay ' + e2 + ' estudiantes que viven lejos y necesitan la beca. ¿Cuántos de ellos quedarán sin beca?',
           en:'The committee of a secondary school gathered ' + a2 + ' pesos for transport grants. Each grant covers ' + c2 + ' pesos per month for ' + m2 + ' months of the school year. At the school there are ' + e2 + ' students who live far away and need the grant. How many of them will be left without a grant?' },
    options:{ es: numOpts(f2, [k2, e2, m2 * k2]), en: numOpts(f2, [k2, e2, m2 * k2]) },
    correct:0,
    hint:{ es:'Averigua primero cuánto cuesta una beca durante todo el ciclo, y con eso cuántas becas completas alcanza el dinero reunido.',
           en:'First work out what one grant costs for the whole year, and from there how many complete grants the money covers.' },
    explanation:{ es:'Una beca cuesta ' + c2 + ' × ' + m2 + ' = ' + (c2 * m2) + ' pesos en el ciclo. Con ' + a2 + ' pesos alcanzan ' + a2 + ' ÷ ' + (c2 * m2) + ' = ' + k2 + ' becas. Si ' + e2 + ' estudiantes la necesitan, quedan sin beca ' + e2 + ' − ' + k2 + ' = ' + f2,
                  en:'One grant costs ' + c2 + ' × ' + m2 + ' = ' + (c2 * m2) + ' pesos for the year. With ' + a2 + ' pesos the money covers ' + a2 + ' ÷ ' + (c2 * m2) + ' = ' + k2 + ' grants. If ' + e2 + ' students need it, the ones left without a grant are ' + e2 + ' − ' + k2 + ' = ' + f2 }
  }, rng);

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2','CONCEPT 2'),
    '<h2>' + S('Discriminación y desventajas que vienen de lejos','Discrimination and disadvantages that come from far back') + '</h2>' +
    '<p>' + S('No toda diferencia de trato es discriminación. Pedir el mismo examen a todo el grupo o dar un lugar a quien llegó primero son distinciones que cualquiera puede cumplir. Hay discriminación cuando la distinción se apoya en una característica de la persona, como su origen, su lengua, su discapacidad, su edad, su género o la comunidad donde vive, y tiene como efecto anular o limitar un derecho.',
              'Not every difference in treatment is discrimination. Asking the whole group for the same exam, or giving a seat to whoever arrived first, are distinctions anyone can meet. Discrimination happens when the distinction rests on a characteristic of the person, such as their origin, language, disability, age, gender or the community they live in, and has the effect of cancelling or limiting a right.') + '</p>' +
    '<p>' + S('Algunos grupos han cargado con esa limitación durante generaciones: pueblos indígenas y afromexicanos, personas con discapacidad, niñas y mujeres, personas adultas mayores, comunidades rurales alejadas, familias jornaleras y personas migrantes. Cuando una desventaja se repite durante tanto tiempo, ya no basta con no discriminar hoy: hay que reparar la distancia acumulada.',
              'Some groups have carried that limitation for generations: Indigenous and Afro Mexican peoples, people with disabilities, girls and women, older adults, remote rural communities, farmworker families and migrants. When a disadvantage repeats for that long, not discriminating today is no longer enough: the accumulated distance has to be repaired.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Física','Physical') + '</div><div class="rform">' + S('¿el espacio lo impide?','does the space block it?') + '</div><div class="rnote">' + S('Escalones, banquetas rotas, puertas estrechas.','Steps, broken sidewalks, narrow doors.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Económica','Economic') + '</div><div class="rform">' + S('¿cuesta cumplirlo?','does meeting it cost?') + '</div><div class="rnote">' + S('Cuotas, uniformes, copias, pasajes.','Fees, uniforms, copies, bus fares.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('De lengua','Language') + '</div><div class="rform">' + S('¿se entiende?','is it understood?') + '</div><div class="rnote">' + S('Mensajes en una sola lengua o un solo formato.','Messages in a single language or a single format.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('De trato','Attitude') + '</div><div class="rform">' + S('¿quién decide, qué cree?','what does the decider believe?') + '</div><div class="rnote">' + S('Prejuicios sobre lo que alguien puede hacer.','Prejudices about what someone can do.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('De información','Information') + '</div><div class="rform">' + S('¿el aviso llegó?','did the notice arrive?') + '</div><div class="rnote">' + S('Convocatorias que casi nadie alcanza a ver.','Calls that almost nobody gets to see.') + '</div></div>' +
    '</div>' +
    buildBarreras(rng));
  brrRender();

  /* ── PROBLEMA 3 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Distinción o discriminación', en:'Distinction or discrimination' }, showWork:false,
      stmt:{ es:'En una escuela pasan dos cosas. Un club rechaza a un estudiante porque no entregó su proyecto en la fecha acordada. Otro club rechaza a una estudiante porque su familia viene de una comunidad indígena. ¿Qué distingue al segundo caso del primero?',
             en:'Two things happen at a school. One club turns down a student who did not hand in his project by the agreed date. Another club turns down a student because her family comes from an Indigenous community. What sets the second case apart from the first?' },
      options:{ es:[
        'Que el rechazo se apoya en el origen de la persona, algo que ella no puede ni debe cambiar, y por eso limita un derecho.',
        'Que en el segundo caso el club contaba con menos lugares disponibles que en el primero.',
        'Que el primer caso ocurrió antes de que existieran reglas escritas para los clubes escolares.',
        'Que en el segundo caso la estudiante no presentó una queja formal ante la dirección de la escuela.' ],
        en:[
        'That the refusal rests on the person origin, something she cannot and should not change, and that limits a right.',
        'That in the second case the club had fewer places available than in the first one.',
        'That the first case happened before written rules for school clubs existed.',
        'That in the second case the student did not file a formal complaint with the school office.' ] },
      correct:0,
      hint:{ es:'Fíjate en si el motivo del rechazo es algo que la persona pueda cumplir o algo que forma parte de quién es.',
             en:'Look at whether the reason for the refusal is something the person can meet or something that is part of who they are.' },
      explanation:{ es:'Una fecha de entrega es una condición que cualquier integrante puede cumplir. El origen de la familia no lo es: no depende de la persona y no se relaciona con la actividad. Rechazar por esa razón anula el acceso a un derecho y eso es discriminación.',
                    en:'A due date is a condition any member can meet. Family origin is not: it does not depend on the person and has nothing to do with the activity. Refusing for that reason cancels access to a right, and that is discrimination.' } },
    { title:{ es:'Distinción o discriminación', en:'Distinction or discrimination' }, showWork:false,
      stmt:{ es:'Una biblioteca presta libros solo a quien devuelve a tiempo los anteriores. La misma biblioteca niega la credencial a una señora de setenta años porque, dice el encargado, a esa edad ya no se lee. ¿Qué distingue a la segunda decisión de la primera?',
             en:'A library lends books only to those who return the previous ones on time. The same library refuses a card to a woman of seventy because, says the clerk, people do not read at that age. What sets the second decision apart from the first?' },
      options:{ es:[
        'Que la negativa se basa en un prejuicio sobre su edad y no en una conducta que ella pueda cambiar.',
        'Que la biblioteca no tenía ejemplares suficientes para atender a todas las personas del barrio.',
        'Que la señora podía conseguir esos mismos libros en otra biblioteca del municipio.',
        'Que la primera regla está escrita en el reglamento y la segunda decisión se tomó de palabra.' ],
        en:[
        'That the refusal rests on a prejudice about her age and not on conduct she could change.',
        'That the library did not have enough copies to serve everyone in the neighborhood.',
        'That the woman could get those same books at another library in town.',
        'That the first rule is written in the regulations while the second decision was made verbally.' ] },
      correct:0,
      hint:{ es:'Distingue entre una condición que la persona puede cumplir y una creencia sobre lo que alguien de su edad puede hacer.',
             en:'Tell apart a condition the person can meet from a belief about what someone their age can do.' },
      explanation:{ es:'Devolver a tiempo depende de la conducta de cada persona y se puede cumplir. La edad no es una conducta: negar el servicio por ella parte de un prejuicio y limita el derecho a la cultura y a la información.',
                    en:'Returning on time depends on each person conduct and can be met. Age is not conduct: refusing service because of it starts from a prejudice and limits the right to culture and information.' } }

             en:'In one community the health center hands out its instructions only in writing and in Spanish. Several older adults speak Nahuatl and do not read. The committee wants everyone to understand their treatment. Which measure aims at the barrier in this case?' },
      options:{ es:[

                    en:'The barrier is language and format: the message exists but it does not arrive in the language or the medium the patients use. Only explaining in Nahuatl and out loud acts on that cause. The other options repeat the same written channel or shift the problem to the family.' } },
    { title:{ es:'La medida que sí destraba', en:'The measure that really unblocks' }, showWork:false,
      stmt:{ es:'La única entrada del auditorio escolar tiene cinco escalones y dos estudiantes que usan silla de ruedas se quedan fuera de las asambleas. La escuela quiere que participen. ¿Qué medida se dirige a la barrera de este caso?',
             en:'The only entrance to the school auditorium has five steps and two students who use wheelchairs are left out of the assemblies. The school wants them to take part. Which measure aims at the barrier in this case?' },
      options:{ es:[
        'Construir una rampa con la inclinación adecuada y dejar libre el paso hacia la entrada.',

                    en:'The barrier is physical and sits at the entrance. The ramp removes it and gives back participation on equal terms. Video replaces the assembly with something else, being carried depends on goodwill and guarantees nothing, and posters do not move the step.' } }

  /* ── CONCEPTO 3 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 3','CONCEPT 3'),
    '<h2>' + S('Acciones afirmativas y ajustes razonables','Affirmative actions and reasonable adjustments') + '</h2>' +
    '<p>' + S('Cuando una desventaja viene de lejos, dar exactamente lo mismo a todas las personas conserva la distancia que ya existía. Una acción afirmativa es una medida temporal que ofrece un apoyo adicional a un grupo que ha estado en desventaja, hasta que esa distancia se cierre. Un ajuste razonable es un cambio concreto en un espacio, un horario o un material para que una persona pueda ejercer su derecho.',
              'When a disadvantage comes from far back, giving exactly the same to everyone preserves the distance that already existed. An affirmative action is a temporary measure that offers extra support to a group that has been at a disadvantage, until that distance closes. A reasonable adjustment is a concrete change to a space, a schedule or a material so that a person can exercise their right.') + '</p>' +
    '<p>' + S('Ninguna de las dos es un favor ni un premio, y no cualquier medida sirve. Una propuesta se sostiene cuando se dirige a la causa, alcanza a todo el grupo afectado, no señala ni exhibe a nadie y tiene con qué continuar el próximo ciclo.',
              'Neither one is a favor or a prize, and not every measure works. A proposal holds up when it aims at the cause, reaches the whole affected group, singles nobody out, and has the means to continue next school year.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Causa','Cause') + '</div><div class="rform">' + S('¿ataca la barrera?','does it hit the barrier?') + '</div><div class="rnote">' + S('Actúa sobre lo que realmente impide el derecho.','It acts on what actually blocks the right.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Alcance','Reach') + '</div><div class="rform">' + S('¿llega a todo el grupo?','does it reach everyone?') + '</div><div class="rnote">' + S('No solo a quien se acerque a pedirlo.','Not only those who come forward to ask.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Dignidad','Dignity') + '</div><div class="rform">' + S('¿exhibe a alguien?','does it expose anyone?') + '</div><div class="rnote">' + S('El apoyo no se cobra en vergüenza.','Support is not paid for with shame.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Continuidad','Continuity') + '</div><div class="rform">' + S('¿quién la sostiene?','who sustains it?') + '</div><div class="rnote">' + S('Recursos y una persona responsable.','Resources and a person in charge.') + '</div></div>' +
    '</div>' +
    buildPropuesta(rng));
  prpRender();

             en:'A town hall reviews twenty years of records and finds that almost no young woman from the remote communities reached high school, while in the main town most did. Which of these measures is an affirmative action?' },
      options:{ es:[

        en:[
