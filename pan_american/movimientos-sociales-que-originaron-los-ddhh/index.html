<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movimientos Sociales que Originaron los DDHH</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.wgt-q { font-size:.9rem; font-weight:600; margin-bottom:.6rem; }
.wcase { background:var(--surface2); border-left:4px solid var(--gold); border-radius:0 8px 8px 0; padding:.75rem .9rem; font-size:.88rem; color:var(--text2); margin-bottom:.8rem; }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.04em; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.45rem .9rem; font-size:.78rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; }
.wbtn:hover { border-color:var(--green); color:var(--green); }

/* tarjetas que se abren (movimiento -> derecho) */
.fgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.6rem; }
.fcard { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.75rem .8rem; font-size:.82rem; cursor:pointer; transition:all .16s; min-height:44px; }
.fcard:hover { border-color:var(--green); }
.fcard.open { border-color:var(--ok); background:var(--ok-bg); }
.fmov { color:var(--text2); margin-bottom:.45rem; }
.fval { font-size:.78rem; color:var(--ok); font-weight:600; }
.fhint { font-size:.7rem; color:var(--text3); }

/* linea del tiempo */
.tlrail { position:relative; border-left:3px solid var(--gold); margin:.7rem 0 .9rem .6rem; padding-left:.9rem; }
.tlslot { background:var(--green-bg); border:1.5px solid var(--green); border-radius:8px; padding:.45rem .75rem; font-size:.79rem; color:var(--text); margin-bottom:.45rem; }
.tlslot.empty { background:var(--surface2); border:1.5px dashed var(--border); color:var(--text3); }
.tlyear { font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--green-dark); font-weight:600; margin-right:.4rem; }
.evlist { display:flex; flex-direction:column; gap:.45rem; }
.ev { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.ev:hover { border-color:var(--green); color:var(--green); }
.ev.used { opacity:.35; pointer-events:none; }
.ev.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }

/* cadena de la conquista */
.chainrow { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; margin:.7rem 0; min-height:44px; }
.link { background:var(--green-bg); border:1.5px solid var(--green); color:var(--green-dark); border-radius:8px; padding:.42rem .7rem; font-size:.79rem; }
.link.start { background:var(--gold-bg); border-color:var(--gold); color:var(--text); }
.link.ghost { background:var(--surface2); border:1.5px dashed var(--border); color:var(--text3); }
.arw { color:var(--text3); font-weight:700; }
.opts2 { display:flex; flex-direction:column; gap:.45rem; margin-top:.6rem; }
.opt2 { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.opt2:hover { border-color:var(--green); color:var(--green); }
.opt2.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.opt2.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }

/* reloj del voto: canvas + control de año */
.votewrap { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.votecv { display:block; width:100%; height:225px; }
.yearrow { display:flex; align-items:center; gap:.7rem; margin-bottom:.6rem; flex-wrap:wrap; }
.yearrow input[type=range] { flex:1; min-width:180px; accent-color:var(--green); height:32px; }
.yearval { font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:600; color:var(--green); min-width:56px; }
.tgt { font-size:.85rem; background:var(--green-bg); border-radius:8px; padding:.55rem .8rem; margin-bottom:.75rem; color:var(--text); }
.tgt strong { color:var(--green-dark); }

/* documentos */
.chips { display:flex; flex-wrap:wrap; gap:.45rem; }
.chip { background:var(--surface2); border:1.5px solid var(--border); border-radius:22px; padding:.45rem .9rem; font-size:.8rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.chip:hover { border-color:var(--green); color:var(--green); }
.chip.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.chip.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.chip.used { opacity:.4; pointer-events:none; }

/* constructor de postura */
.slotgrid { display:grid; gap:.5rem; margin-bottom:.85rem; }
.slot { border:1.5px dashed var(--border); border-radius:8px; padding:.55rem .8rem; font-size:.82rem; color:var(--text3); min-height:44px; display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
.slot.filled { border-style:solid; border-color:var(--green); background:var(--green-bg); color:var(--text); }
.slotlbl { font-size:.64rem; text-transform:uppercase; letter-spacing:.09em; color:var(--gold); font-weight:700; flex-shrink:0; }
.frag { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.81rem; cursor:pointer; color:var(--text2); transition:all .14s; min-height:44px; display:flex; align-items:center; }
.frag:hover { border-color:var(--green); color:var(--green); }
.frag.used { opacity:.35; pointer-events:none; }
.fraglist { display:flex; flex-direction:column; gap:.45rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Movimientos Sociales que Originaron los DDHH</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Movimientos Sociales que Originaron los DDHH</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')

function S(es, en){ return LANG === 'es' ? es : en; }

function addSection(tag, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ================================================
   WIDGET 1 - TARJETAS: DE LA PROTESTA AL DERECHO
   Tap a card to open the right that the movement won; tap again to close it.
   Fully reversible, live counter, no verdict.
   ================================================ */
var FLIP = null;
function buildFlip(rng){
  var cards = [
    { mov:{ es:'Durante décadas, personas esclavizadas se rebelaron y miles de aliados firmaron peticiones para terminar con la esclavitud.',
            en:'For decades, enslaved people rebelled and thousands of allies signed petitions to end slavery.' },
      got:{ es:'Ninguna persona puede ser propiedad de otra.',
            en:'No person can be the property of another.' } },
    { mov:{ es:'Obreras y obreros del siglo XIX pararon las fábricas para reclamar horarios que les dejaran tiempo de vivir.',
            en:'Nineteenth century workers stopped the factories to demand hours that left them time to live.' },
      got:{ es:'La jornada máxima de ocho horas y el descanso semanal.',
            en:'The eight hour working day limit and the weekly rest day.' } },
    { mov:{ es:'Las sufragistas publicaron periódicos y se manifestaron frente a los congresos durante más de setenta años.',
            en:'Suffragists published newspapers and demonstrated in front of congresses for more than seventy years.' },
      got:{ es:'El derecho de las mujeres a votar y a ser votadas.',
            en:'The right of women to vote and to be elected.' } },
    { mov:{ es:'Familias, médicas y maestras denunciaron que niñas y niños pasaran el día en minas y fábricas en lugar de estudiar.',
            en:'Families, doctors and teachers denounced that girls and boys spent the day in mines and factories instead of studying.' },
      got:{ es:'La protección de la niñez y el derecho a la educación.',
            en:'The protection of childhood and the right to education.' } },
    { mov:{ es:'Personas afrodescendientes en Estados Unidos se negaron a usar los espacios separados que la ley les imponía.',
            en:'Afrodescendant people in the United States refused to use the separate spaces the law imposed on them.' },
      got:{ es:'La igualdad ante la ley sin separación por el color de la piel.',
            en:'Equality before the law with no separation by skin color.' } },
    { mov:{ es:'Comunidades indígenas reclamaron durante años que se reconocieran sus lenguas y sus formas de organizarse.',
            en:'Indigenous communities demanded for years that their languages and their ways of organizing be recognized.' },
      got:{ es:'El reconocimiento de los pueblos indígenas y el derecho a usar la lengua propia.',
            en:'The recognition of indigenous peoples and the right to use their own language.' } }
  ];
  FLIP = { cards: shuffle(cards, rng).slice(0, 4), open:[false,false,false,false] };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('De la protesta al derecho','From protest to right') + '</div>' +
      '<div id="flipBox"></div>' +
    '</div>';
}
function flipRender(){
  if (!FLIP) return;
  var box = document.getElementById('flipBox');
  if (!box) return;
  var open = 0, i;
  for (i = 0; i < FLIP.open.length; i++) if (FLIP.open[i]) open++;
  var grid = FLIP.cards.map(function(c, k){
    var body = FLIP.open[k]
      ? '<div class="fval">' + S('Conquistó: ','Won: ') + c.got[LANG] + '</div>'
      : '<div class="fhint">' + S('Toca la tarjeta para ver qué derecho abrió esta lucha.','Tap the card to see which right this struggle opened.') + '</div>';
    return '<div class="fcard' + (FLIP.open[k] ? ' open' : '') + '" onclick="flipTap(' + k + ')">' +
             '<div class="fmov">' + c.mov[LANG] + '</div>' + body +
           '</div>';
  }).join('');
  var msg = open === 0
    ? S('Cuatro luchas distintas, cuatro conquistas. Ábrelas en el orden que quieras.','Four different struggles, four conquests. Open them in any order you like.')
    : (open < 4
      ? S('Llevas ' + open + ' de 4 abiertas. Fíjate en algo que se repite: en todas hubo gente organizada antes que ley escrita.',
          'You have opened ' + open + ' of 4. Notice something repeated: in all of them there were organized people before there was written law.')
      : S('Las cuatro abiertas. Ninguna de esas conquistas apareció sola: en todas hubo personas que sostuvieron el reclamo durante años.',
          'All four are open. None of those conquests appeared on its own: in all of them people sustained the demand for years.'));
  box.innerHTML = '<div class="fgrid">' + grid + '</div>' +
    '<div class="wmsg' + (open === 4 ? ' ok' : '') + '">' + msg + '</div>' +
    '<div class="wprog">' + S('Tarjetas abiertas: ','Cards opened: ') + open + ' / 4</div>';
}
function flipTap(i){ if (!FLIP) return; FLIP.open[i] = !FLIP.open[i]; flipRender(); }

/* ================================================
   WIDGET 2 - LINEA DEL TIEMPO DE LAS CONQUISTAS
   Three rounds, four events each, placed oldest first. Wrong tap says how many
   years later the event happened; full order revealed on the third miss.
   ================================================ */
var TL = null;
function buildTimeline(rng){
  var sets = [
    { evs:[
      { y:1789, es:'En Francia se proclama la Declaración de los Derechos del Hombre y del Ciudadano.',
                en:'France proclaims the Declaration of the Rights of Man and of the Citizen.' },
      { y:1848, es:'En Seneca Falls, un grupo de mujeres firma una declaración que exige igualdad de derechos.',
                en:'At Seneca Falls, a group of women signs a declaration demanding equal rights.' },
      { y:1948, es:'La Organización de las Naciones Unidas aprueba la Declaración Universal de los Derechos Humanos.',
                en:'The United Nations approves the Universal Declaration of Human Rights.' },
      { y:1989, es:'Se aprueba la Convención sobre los Derechos del Niño.',
                en:'The Convention on the Rights of the Child is approved.' } ] },
    { evs:[
      { y:1810, es:'Miguel Hidalgo firma en Guadalajara el decreto que ordena el fin de la esclavitud.',
                en:'Miguel Hidalgo signs in Guadalajara the decree ordering the end of slavery.' },
      { y:1906, es:'Los mineros de Cananea se van a la huelga por un salario y un trato iguales.',
                en:'The miners of Cananea go on strike for equal pay and equal treatment.' },
      { y:1917, es:'La Constitución mexicana escribe los derechos del trabajo, de la tierra y de la educación.',
                en:'The Mexican Constitution writes down labor, land and education rights.' },
      { y:1953, es:'Se reconoce en México el voto de las mujeres en elecciones federales.',
                en:'Mexico recognizes the vote of women in federal elections.' } ] },
    { evs:[
      { y:1833, es:'El Reino Unido aprueba la abolición de la esclavitud en sus colonias.',
                en:'The United Kingdom passes the abolition of slavery in its colonies.' },
      { y:1886, es:'Trabajadores de Chicago paran las fábricas para exigir la jornada de ocho horas.',
                en:'Workers in Chicago stop the factories to demand the eight hour working day.' },
      { y:1893, es:'Nueva Zelanda es el primer país donde las mujeres votan en elecciones nacionales.',
                en:'New Zealand becomes the first country where women vote in national elections.' },
      { y:1948, es:'La Organización de las Naciones Unidas aprueba la Declaración Universal de los Derechos Humanos.',
                en:'The United Nations approves the Universal Declaration of Human Rights.' } ] },
    { evs:[
      { y:1917, es:'México escribe en su Constitución los primeros derechos sociales del mundo.',
                en:'Mexico writes the first social rights in the world into its Constitution.' },
      { y:1948, es:'Se aprueba la Declaración Universal de los Derechos Humanos.',
                en:'The Universal Declaration of Human Rights is approved.' },
      { y:1968, es:'El movimiento estudiantil mexicano sale a las calles a pedir libertades políticas.',
                en:'The Mexican student movement takes to the streets asking for political freedoms.' },
      { y:2011, es:'Una reforma coloca los derechos humanos en el primer artículo de la Constitución mexicana.',
                en:'A reform places human rights in the first article of the Mexican Constitution.' } ] }
  ];
  var rounds = shuffle(sets, rng).slice(0, 3).map(function(s){
    return { evs: s.evs, pool: shuffle(s.evs, rng) };
  });
  TL = { rounds:rounds, i:0, placed:[], tries:0, revealed:false, done:false, msg:null, msgCls:null, miss:-1 };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Línea del tiempo de las conquistas','Timeline of the conquests') + '</div>' +
      '<div id="tlBox"></div>' +
    '</div>';
}
function tlRender(){
  if (!TL) return;
  var box = document.getElementById('tlBox');
  if (!box) return;
  if (TL.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Tres líneas armadas. Entre un reclamo y el siguiente pasaron décadas: los derechos se ganaron poco a poco y en muchos lugares a la vez.',
        'Three timelines built. Decades passed between one demand and the next: rights were won little by little and in many places at once.') +
      '</div>';
    return;
  }
  var r = TL.rounds[TL.i];
  var rail = TL.placed.map(function(e){
    return '<div class="tlslot"><span class="tlyear">' + e.y + '</span>' + e[LANG] + '</div>';
  }).join('');
  var k;
  for (k = TL.placed.length; k < r.evs.length; k++) {
    rail += '<div class="tlslot empty">' + S('lugar ','slot ') + (k + 1) + '</div>';
  }
  var list = r.pool.map(function(e, idx){
    if (TL.placed.indexOf(e) >= 0) return '';
    return '<div class="ev' + (TL.miss === idx ? ' miss' : '') + '" onclick="tlPick(' + idx + ')">' + e[LANG] + '</div>';
  }).join('');
  box.innerHTML =
    '<div class="wgt-q">' + S('Coloca los hechos del más antiguo al más reciente: toca el que ocurrió primero.',
                              'Place the events from oldest to most recent: tap the one that happened first.') + '</div>' +
    '<div class="tlrail">' + rail + '</div>' +
    (list ? '<div class="evlist">' + list + '</div>' : '') +
    '<div class="wmsg' + (TL.msgCls ? ' ' + TL.msgCls : '') + '">' +
      (TL.msg || S('El año se descubre solo cuando el hecho queda colocado.','The year shows up only once the event is placed.')) + '</div>' +
    (TL.placed.length > 0 && !TL.revealed ? '<button class="wbtn" onclick="tlUndo()">' + S('Quitar el último','Remove the last one') + '</button> ' : '') +
    (TL.revealed ? '<button class="wbtn" onclick="tlNext()">' + S('Siguiente ronda →','Next round →') + '</button>' : '') +
    '<div class="wprog">' + S('Ronda ','Round ') + (TL.i + 1) + S(' de 3',' of 3') + '</div>';
}
function tlPick(idx){
  if (!TL || TL.revealed || TL.done) return;
  var r = TL.rounds[TL.i];
  var e = r.pool[idx];
  if (!e || TL.placed.indexOf(e) >= 0) return;
  var remaining = r.pool.filter(function(x){ return TL.placed.indexOf(x) < 0; });
  var earliest = remaining[0];
  remaining.forEach(function(x){ if (x.y < earliest.y) earliest = x; });
  if (e.y === earliest.y) {
    TL.placed.push(e); TL.miss = -1;
    if (TL.placed.length === r.evs.length) {
      TL.revealed = true;
      TL.msg = S('Línea completa. Cada hecho de la lista abrió la puerta al siguiente.',
                 'Timeline complete. Each event on the list opened the door to the next one.');
      TL.msgCls = 'ok';
    } else {
      TL.msg = S('Correcto: ese era el más antiguo de los que quedaban. Sigue con el siguiente.',
                 'Correct: that was the oldest of the remaining ones. Keep going with the next.');
      TL.msgCls = 'ok';
    }
  } else {
    TL.tries++; TL.miss = idx;
    if (TL.tries >= 3) {
      TL.revealed = true; TL.miss = -1;
      remaining.slice().sort(function(a,b){ return a.y - b.y; }).forEach(function(x){ TL.placed.push(x); });
      TL.msg = S('Este es el orden completo, con los años a la vista. Observa cuánto tiempo separa un reclamo del siguiente.',
                 'This is the full order with the years in view. Notice how much time separates one demand from the next.');
      TL.msgCls = 'warn';
    } else {
      var diff = e.y - earliest.y;
      TL.msg = S('Ese hecho es posterior: ocurrió ' + diff + ' años después de otro que sigue en la lista. Busca uno más antiguo.',
                 'That event comes later: it happened ' + diff + ' years after another one still on the list. Look for an older one.');
      TL.msgCls = 'warn';
    }
  }
  tlRender();
}
function tlUndo(){
  if (!TL || TL.revealed || TL.placed.length === 0) return;
  TL.placed.pop(); TL.miss = -1;
  TL.msg = S('Hecho retirado. Puedes colocarlo de nuevo cuando quieras.','Event removed. You can place it again whenever you want.');
  TL.msgCls = null;
  tlRender();
}
function tlNext(){
  if (!TL) return;
  TL.i++; TL.placed = []; TL.tries = 0; TL.revealed = false; TL.msg = null; TL.msgCls = null; TL.miss = -1;
  if (TL.i >= TL.rounds.length) TL.done = true;
  tlRender();
}

/* ================================================
   WIDGET 3 - CADENA DE LA CONQUISTA
   Four links from injustice to daily life. Each wrong chip answers with a nudge
   that points to what the link is missing; the link is revealed on the third miss.
   ================================================ */
var CHN = null;
function buildChain(rng){

    { name:{ es:'la jornada de ocho horas','en':'the eight hour working day' },

        { lbl:{ es:'La gente se organiza','en':'People organize' },

            { ok:true, es:'Las y los trabajadores forman sindicatos, convocan huelgas y marchan con una misma demanda.',

            { ok:false, es:'Cada trabajador negocia en privado con su jefe el horario que más le conviene.',

              nes:'Un arreglo privado alcanza a una persona a la vez y se pierde si esa persona se va. Para cambiar la regla hace falta actuar en conjunto.',
              nen:'A private arrangement reaches one person at a time and is lost if that person leaves. Changing the rule needs collective action.' },
            { ok:false, es:'Las familias esperan a que la situación mejore sola con el paso de los años.',
                        en:'Families wait for the situation to improve on its own as the years pass.',
              nes:'Esperar no mueve la regla. El segundo eslabón es la organización sostenida.',
              nen:'Waiting does not move the rule. The second link is sustained organization.' } ] },
        { lbl:{ es:'La demanda se vuelve norma','en':'The demand becomes a rule' },
          opts:[
            { ok:true, es:'La demanda entra al debate público y la jornada máxima de ocho horas queda escrita en la ley.',
                       en:'The demand enters public debate and the eight hour limit is written into law.' },
            { ok:false, es:'Los dueños de las fábricas prometen de palabra que en adelante serán más considerados.',
                        en:'The factory owners promise verbally that from now on they will be more considerate.',
              nes:'Una promesa de palabra no obliga a nadie y se puede retirar mañana. Falta que la demanda quede escrita.',
              nen:'A verbal promise binds nobody and can be withdrawn tomorrow. The demand still needs to be written down.' },
            { ok:false, es:'El movimiento se disuelve porque ya consiguió aparecer en los periódicos.',
                        en:'The movement dissolves because it already made it into the newspapers.',
              nes:'Aparecer en los periódicos da visibilidad, no obligación. El tercer eslabón es que la demanda se convierta en norma.',
              nen:'Making the newspapers gives visibility, not obligation. The third link is the demand becoming a rule.' } ] },
        { lbl:{ es:'La norma se vigila','en':'The rule is watched over' },
          opts:[
            { ok:true, es:'Hoy se revisa que la jornada se cumpla y se puede reclamar ante una autoridad cuando no ocurre.',
                       en:'Today it is checked that the working day is respected and a complaint can be filed when it is not.' },
            { ok:false, es:'Una vez escrita la ley, el tema queda cerrado para siempre y ya no hace falta revisarlo.',

              nes:'Una norma escrita puede incumplirse en silencio. El último eslabón es vigilar que se cumpla.',

            { ok:false, es:'Cada empresa decide libremente si aplica la ley o si prefiere otro horario.',
                        en:'Each company freely decides whether to apply the law or prefer another schedule.',

    { name:{ es:'el voto de las mujeres en México','en':'the vote of women in Mexico' },
      steps:[
        { lbl:{ es:'La injusticia se hace visible','en':'The injustice becomes visible' },
          opts:[
            { ok:true, es:'Las mujeres trabajan y pagan impuestos, pero la ley no les permite votar, y ellas nombran esa exclusión en público.',

              nes:'Ese arreglo esquiva la regla, no la cambia. La cadena empieza al nombrar la exclusión como injusta.',

            { ok:false, es:'Un periódico publica una nota sobre la moda femenina en la capital.',
                        en:'A newspaper publishes a piece about womens fashion in the capital.',
              nes:'Esa nota no nombra ninguna exclusión. El primer eslabón es reconocer el daño.',
              nen:'That piece names no exclusion. The first link is recognizing the harm.' } ] },
        { lbl:{ es:'La gente se organiza','en':'People organize' },
          opts:[
            { ok:true, es:'Se forman clubes y congresos de mujeres que publican periódicos y llevan la demanda a las plazas durante décadas.',
                       en:'Womens clubs and congresses form, publish newspapers and take the demand to public squares for decades.' },
            { ok:false, es:'Cada mujer escribe una carta personal pidiendo un permiso especial para votar.',

            { ok:false, es:'El tema se comenta en casa y se deja para cuando cambien los tiempos.',
                        en:'The topic is discussed at home and left for when times change.',
              nes:'Conversar en privado no llega a quien decide. El segundo eslabón es organizarse y hacerse oír.',

        { lbl:{ es:'La demanda se vuelve norma','en':'The demand becomes a rule' },

              nes:'Celebrar no cambia la regla que excluye. El tercer eslabón es la norma escrita.',
              nen:'Celebrating does not change the rule that excludes. The third link is the written rule.' } ] },
        { lbl:{ es:'La norma se vigila','en':'The rule is watched over' },
          opts:[

function chnRender(){
  if (!CHN) return;
  var box = document.getElementById('chnBox');
  if (!box) return;
  var chain = '<span class="link start">' + S('Punto de partida','Starting point') + '</span>';
  CHN.placed.forEach(function(p){
    chain += '<span class="arw">→</span><span class="link">' + p + '</span>';
  });
  var k;
  for (k = CHN.placed.length; k < CHN.steps.length; k++) {
    chain += '<span class="arw">→</span><span class="link ghost">' + CHN.steps[k].lbl[LANG] + '</span>';
  }
  if (CHN.done) {
    box.innerHTML = '<div class="chainrow">' + chain + '</div>' +
      '<div class="wmsg ok">' +
      S('Cadena completa. Un derecho no nace de un solo acto: necesita que alguien nombre el daño, que la gente se organice, que la norma se escriba y que después se vigile.',
        'Chain complete. A right is not born from a single act: someone must name the harm, people must organize, the rule must be written and then watched over.') +
      '</div>' +
      '<button class="wbtn" onclick="chnReset()">' + S('Armarla otra vez','Build it again') + '</button>';
    return;
  }
  var st = CHN.steps[CHN.i];
  var opts = st.opts.map(function(o, oi){
    var cls = 'opt2';
    if (CHN.revealed && o.ok) cls += ' good';
    else if (CHN.miss === oi) cls += ' miss';
    return '<div class="' + cls + '" onclick="chnPick(' + oi + ')">' + o[LANG] + '</div>';
  }).join('');
  box.innerHTML =
    '<div class="wgt-q">' + S('Arma la ruta que siguió ','Build the route followed by ') + CHN.name[LANG] +
      S('. Elige el eslabón que corresponde a: ','. Choose the link matching: ') + '<strong>' + st.lbl[LANG] + '</strong></div>' +
    '<div class="chainrow">' + chain + '</div>' +
    '<div class="opts2">' + opts + '</div>' +
    '<div class="wmsg' + (CHN.msgCls ? ' ' + CHN.msgCls : '') + '">' +
      (CHN.msg || S('Cada eslabón sostiene al siguiente: si falta uno, la cadena se rompe.','Each link holds the next one: if one is missing, the chain breaks.')) + '</div>' +
    (CHN.placed.length > 0 && !CHN.revealed ? '<button class="wbtn" onclick="chnUndo()">' + S('Quitar el último eslabón','Remove the last link') + '</button> ' : '') +
    (CHN.revealed ? '<button class="wbtn" onclick="chnNext()">' + S('Siguiente eslabón →','Next link →') + '</button>' : '') +
    '<div class="wprog">' + S('Eslabón ','Link ') + (CHN.i + 1) + S(' de 4',' of 4') + '</div>';
}
function chnPick(oi){
  if (!CHN || CHN.revealed || CHN.done) return;
  var o = CHN.steps[CHN.i].opts[oi];
  if (o.ok) {
    CHN.revealed = true; CHN.miss = -1;
    CHN.msg = S('Ese es el eslabón. ','That is the link. ') +
      S('Sin él, lo que sigue no tendría dónde apoyarse.','Without it, what comes next would have nothing to lean on.');
    CHN.msgCls = 'ok';
  } else {
    CHN.tries++; CHN.miss = oi;
    if (CHN.tries >= 3) {
      CHN.revealed = true; CHN.miss = -1;
      var right = null;
      CHN.steps[CHN.i].opts.forEach(function(x){ if (x.ok) right = x; });
      CHN.msg = S('El eslabón era: ','The link was: ') + '<strong>' + right[LANG] + '</strong>';
      CHN.msgCls = 'warn';
    } else {
      CHN.msg = (LANG === 'es' ? o.nes : o.nen);
      CHN.msgCls = 'warn';
    }
  }
  chnRender();
}
function chnNext(){
  if (!CHN) return;
  CHN.placed.push(CHN.steps[CHN.i].lbl[LANG]);
  CHN.i++; CHN.tries = 0; CHN.revealed = false; CHN.msg = null; CHN.msgCls = null; CHN.miss = -1;
  if (CHN.i >= CHN.steps.length) CHN.done = true;
  chnRender();
}
function chnUndo(){
  if (!CHN || CHN.placed.length === 0 || CHN.revealed) return;
  CHN.placed.pop(); CHN.i--; CHN.tries = 0; CHN.miss = -1;
  CHN.msg = S('Eslabón retirado. Puedes volver a elegirlo.','Link removed. You can choose it again.');
  CHN.msgCls = null;
  chnRender();
}
function chnReset(){
  if (!CHN) return;
  CHN.i = 0; CHN.placed = []; CHN.tries = 0; CHN.revealed = false; CHN.done = false; CHN.msg = null; CHN.msgCls = null; CHN.miss = -1;
  chnRender();
}

/* ================================================
   WIDGET 4 - RELOJ DEL VOTO (canvas + control de año)
   Moving the year redraws who was allowed to vote in Mexico, live. Three targets
   to find; wrong marks say whether to move forward or back; reveal on third miss.
   ================================================ */
var VOT = null, VOT_BOUND = false;
function buildVote(rng){
  var groups = [
    { since:1900, es:'Hombres mayores de edad',              en:'Adult men' },
    { since:1953, es:'Mujeres mayores de edad',              en:'Adult women' },
    { since:1969, es:'Jóvenes de 18 a 20 años',              en:'Young people aged 18 to 20' },
    { since:2005, es:'Personas mexicanas en el extranjero',  en:'Mexican citizens living abroad' }
  ];
  var targets = [
    { y:1953,
      q:{ es:'¿En qué año se reconoció el voto de las mujeres en elecciones federales en México?',
          en:'In which year was the vote of women in federal elections recognized in Mexico?' },
      w:{ es:'En 1953 se publicó la reforma que reconoció ese derecho, después de décadas de clubes, congresos y publicaciones de mujeres. La primera votación federal con su participación fue en 1955.',
          en:'In 1953 the reform recognizing that right was published, after decades of womens clubs, congresses and publications. The first federal election with their participation was in 1955.' } },
    { y:1969,
      q:{ es:'¿En qué año se reformó la Constitución para que la ciudadanía se alcanzara a los 18 años?',
          en:'In which year was the Constitution reformed so that citizenship was reached at age 18?' },
      w:{ es:'En 1969 la reforma fijó los 18 años para todas las personas. Antes, la edad dependía del estado civil, y miles de jóvenes quedaban fuera de las decisiones que les afectaban.',
          en:'In 1969 the reform set 18 years for everyone. Before that, the age depended on marital status, and thousands of young people were left out of decisions that affected them.' } },
    { y:2005,
      q:{ es:'¿En qué año se aprobó que las personas mexicanas pudieran votar desde el extranjero?',
          en:'In which year was voting from abroad approved for Mexican citizens?' },
      w:{ es:'En 2005 se aprobó la reforma legal y en 2006 se usó por primera vez. Fue el resultado de años de reclamo de comunidades migrantes.',
          en:'In 2005 the legal reform was approved and in 2006 it was used for the first time. It resulted from years of demands by migrant communities.' } }
  ];
  VOT = { groups:groups, targets:targets, year: 1900 + 5 * Math.floor(rng() * 8),
          i:0, tries:0, revealed:false, done:false, msg:null, msgCls:null };
  if (!VOT_BOUND) { window.addEventListener('resize', function(){ votDraw(); }); VOT_BOUND = true; }
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('Reloj del voto en México','Voting clock in Mexico') + '</div>' +
      '<div class="votewrap"><canvas class="votecv" id="votCv"></canvas></div>' +
      '<div class="yearrow">' +
        '<span class="yearval" id="votYearV">' + VOT.year + '</span>' +
        '<input type="range" id="votYear" min="1900" max="2020" step="1" value="' + VOT.year + '" oninput="votIn()">' +
      '</div>' +
      '<div id="votBox"></div>' +
    '</div>';
}
function votDraw(){
  var cv = document.getElementById('votCv');
  if (!cv || !VOT) return;
  var r = cv.getBoundingClientRect();
  if (!r.width) return;
  var dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = r.width, H = r.height;
  var cs = getComputedStyle(document.documentElement);
  var CG = cs.getPropertyValue('--green').trim() || '#1a4a8a';
  var CA = cs.getPropertyValue('--gold').trim()  || '#c9a84c';
  var CT = cs.getPropertyValue('--text2').trim() || '#4a4640';
  var C3 = cs.getPropertyValue('--text3').trim() || '#7a7468';
  var CB = cs.getPropertyValue('--border').trim()|| '#ddd8cc';
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'left';
  ctx.fillStyle = CT; ctx.font = '600 13px IBM Plex Sans, sans-serif';
  ctx.fillText(S('Quiénes podían votar en ','Who could vote in ') + VOT.year, 12, 19);
  var rowH = (H - 34) / 4;
  VOT.groups.forEach(function(g, gi){
    var y = 34 + rowH * gi + rowH * 0.45;
    var on = VOT.year >= g.since;
    var i, x0 = 12, sp = 18;
    for (i = 0; i < 3; i++) {
      var cx = x0 + i * sp + 6;
      ctx.beginPath(); ctx.arc(cx, y - 9, 4.5, 0, Math.PI * 2);
      if (on) { ctx.fillStyle = CG; ctx.fill(); }
      else { ctx.strokeStyle = CB; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(cx - 6, y + 7);
      ctx.quadraticCurveTo(cx, y - 6, cx + 6, y + 7);
      ctx.closePath();
      if (on) { ctx.fillStyle = CG; ctx.fill(); }
      else { ctx.strokeStyle = CB; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
    var lx = x0 + 3 * sp + 10;
    var maxW = W - lx - 10;
    var fs = 11;
    ctx.font = '600 ' + fs + 'px IBM Plex Sans, sans-serif';
    while (ctx.measureText(g[LANG]).width > maxW && fs > 8) {
      fs--; ctx.font = '600 ' + fs + 'px IBM Plex Sans, sans-serif';
    }
    ctx.fillStyle = on ? CT : C3;
    ctx.fillText(g[LANG], lx, y - 2);
    ctx.font = '10px IBM Plex Sans, sans-serif';
    ctx.fillStyle = on ? CG : C3;
    ctx.fillText(on ? S('puede votar','can vote') : S('todavía no','not yet'), lx, y + 12);
  });
  var frac = Math.max(0, Math.min(1, (VOT.year - 1900) / 120));
  ctx.fillStyle = CA; ctx.fillRect(0, H - 3, W * frac, 3);
}
function votIn(){
  if (!VOT) return;
  var sl = document.getElementById('votYear');
  if (sl) VOT.year = parseInt(sl.value, 10);
  var lv = document.getElementById('votYearV');
  if (lv) lv.textContent = VOT.year;
  votDraw();
}
function votRender(){
  if (!VOT) return;
  var box = document.getElementById('votBox');
  if (!box) return;
  if (VOT.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Cada franja de este reloj se abrió porque alguien la reclamó: el voto no se amplió solo con el paso del tiempo.',
        'Every band on this clock opened because someone demanded it: the vote did not widen just because time passed.') +
      '</div>';
    return;
  }
  var tg = VOT.targets[VOT.i];
  box.innerHTML =
    '<div class="tgt"><strong>' + S('Busca: ','Find: ') + '</strong>' + tg.q[LANG] + '</div>' +
    (VOT.revealed ? '' : '<button class="wbtn" onclick="votMark()">' + S('Marcar este año','Mark this year') + '</button>') +
    '<div class="wmsg' + (VOT.msgCls ? ' ' + VOT.msgCls : '') + '">' +
      (VOT.msg || S('Mueve el año y observa el dibujo: alguna franja se enciende justo cuando llega su reforma.',
                    'Move the year and watch the drawing: a band lights up exactly when its reform arrives.')) + '</div>' +
    (VOT.revealed ? '<button class="wbtn" onclick="votNext()">' + S('Siguiente búsqueda →','Next search →') + '</button>' : '') +
    '<div class="wprog">' + S('Búsqueda ','Search ') + (VOT.i + 1) + S(' de 3',' of 3') + '</div>';
}
function votMark(){
  if (!VOT || VOT.done || VOT.revealed) return;
  var tg = VOT.targets[VOT.i];
  var d = VOT.year - tg.y;
  if (d === 0) {
    VOT.revealed = true;
    VOT.msg = S('¡Ese es el año! ','That is the year! ') + tg.w[LANG];
    VOT.msgCls = 'ok';
  } else {
    VOT.tries++;
    if (VOT.tries >= 3) {
      VOT.revealed = true;
      VOT.year = tg.y;
      var sl = document.getElementById('votYear'); if (sl) sl.value = tg.y;
      var lv = document.getElementById('votYearV'); if (lv) lv.textContent = tg.y;
      votDraw();
      VOT.msg = S('El año era ','The year was ') + tg.y + '. ' + tg.w[LANG];
      VOT.msgCls = 'warn';
    } else {
      var far = Math.abs(d) > 15 ? S('Te faltan varias décadas. ','You are several decades off. ')
                                 : S('Estás muy cerca. ','You are very close. ');
      VOT.msg = far + (d < 0
        ? S('En ese año ese grupo todavía no aparecía en la papeleta: avanza en el tiempo.',
            'In that year that group was still not on the ballot: move forward in time.')
        : S('Te pasaste: para ese año ese grupo ya llevaba tiempo votando. Regresa un poco.',
            'You went too far: by that year that group had been voting for a while. Move back a little.'));
      VOT.msgCls = 'warn';
    }
  }
  votRender();
}
function votNext(){
  if (!VOT) return;
  VOT.i++; VOT.tries = 0; VOT.revealed = false; VOT.msg = null; VOT.msgCls = null;
  if (VOT.i >= VOT.targets.length) VOT.done = true;
  votRender();
}

/* ================================================

               en:'With the Second World War over, countries look for a common list of rights valid for every person anywhere.',
      wes:'Ese acuerdo se firmó en 1948 y desde entonces sirve de referencia para reclamar en cualquier país.',

    { k:'nin', es:'Organizaciones y familias piden que niñas y niños sean escuchados, protegidos del trabajo peligroso y tratados según su edad.',
               en:'Organizations and families ask that girls and boys be heard, protected from dangerous work and treated according to their age.',
      wes:'Ese reclamo se recogió en 1989 y México se sumó al año siguiente.',
      wen:'That demand was taken up in 1989 and Mexico joined the following year.' },
    { k:'fr', es:'Al caer el antiguo régimen, se proclama que la ley debe ser la misma para todas las personas y que nadie nace con privilegios.',
              en:'When the old regime falls, it is proclaimed that the law must be the same for everyone and that nobody is born with privileges.',
      wes:'Ese fue el texto de 1789, uno de los primeros en poner por escrito la igualdad ante la ley.',
      wen:'That was the 1789 text, one of the first to put equality before the law in writing.' },
    { k:'mx', es:'Un país exige que la educación gratuita y el reparto de la tierra dejen de ser promesas y queden escritos como derechos.',
              en:'A country demands that free education and land distribution stop being promises and be written down as rights.',
      wes:'Los artículos 3 y 27 de la Constitución de 1917 nacieron de ese reclamo.',
      wen:'Articles 3 and 27 of the 1917 Constitution were born from that demand.' }
  ];
  DOC = { docs:docs, rounds: shuffle(cases, rng).slice(0, 3), i:0, tries:0, wrong:[], revealed:false, done:false, msg:null, msgCls:null };
  return '<div class="wgt">' +
      '<div class="wgt-h">' + S('El reclamo y su documento','The demand and its document') + '</div>' +
      '<div id="docBox"></div>' +
    '</div>';
}
function docRender(){
  if (!DOC) return;
  var box = document.getElementById('docBox');
  if (!box) return;
  if (DOC.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Tres reclamos, tres documentos. Detrás de cada texto famoso hubo gente que lo exigió antes de que existiera.',
        'Three demands, three documents. Behind every famous text there were people who demanded it before it existed.') +
      '</div>';
    return;
  }
  var c = DOC.rounds[DOC.i];
  var chips = DOC.docs.map(function(d){
    var cls = 'chip';
    if (DOC.revealed && d.k === c.k) cls += ' good';
    else if (DOC.wrong.indexOf(d.k) >= 0) cls += ' miss used';
    else if (DOC.revealed) cls += ' used';
    return '<div class="' + cls + '" onclick="docPick(\'' + d.k + '\')">' + d[LANG] + '</div>';
  }).join('');
  box.innerHTML =
    '<div class="wgt-q">' + S('¿En qué documento quedó escrito este reclamo?','In which document was this demand written down?') + '</div>' +
    '<div class="wcase">' + c[LANG] + '</div>' +
    '<div class="chips">' + chips + '</div>' +
    '<div class="wmsg' + (DOC.msgCls ? ' ' + DOC.msgCls : '') + '">' +
      (DOC.msg || S('Fíjate en quién reclama y en qué lugar del mundo ocurre.','Look at who is demanding and where in the world it happens.')) + '</div>' +
    (DOC.revealed ? '<button class="wbtn" onclick="docNext()">' + S('Siguiente reclamo →','Next demand →') + '</button>' : '') +
    '<div class="wprog">' + S('Reclamo ','Demand ') + (DOC.i + 1) + S(' de 3',' of 3') + '</div>';
}
function docPick(k){
  if (!DOC || DOC.revealed || DOC.done) return;
  var c = DOC.rounds[DOC.i], i, d = null, right = null;
  for (i = 0; i < DOC.docs.length; i++) {
    if (DOC.docs[i].k === k) d = DOC.docs[i];
    if (DOC.docs[i].k === c.k) right = DOC.docs[i];
  }
  if (k === c.k) {
    DOC.revealed = true;
    DOC.msg = S('¡Exacto! ','Exactly! ') + (LANG === 'es' ? c.wes : c.wen);
    DOC.msgCls = 'ok';
  } else {
    if (DOC.wrong.indexOf(k) < 0) DOC.wrong.push(k);
    DOC.tries++;
    if (DOC.tries >= 3) {
      DOC.revealed = true;
      DOC.msg = S('Era la ','It was the ') + '<strong>' + right[LANG] + '</strong>. ' + (LANG === 'es' ? c.wes : c.wen);
      DOC.msgCls = 'warn';
    } else {
      DOC.msg = (LANG === 'es' ? d.nes : d.nen);
      DOC.msgCls = 'warn';
    }
  }
  docRender();
}
function docNext(){
  if (!DOC) return;
  DOC.i++; DOC.tries = 0; DOC.wrong = []; DOC.revealed = false; DOC.msg = null; DOC.msgCls = null;
  if (DOC.i >= DOC.rounds.length) DOC.done = true;
  docRender();
}

/* ================================================
   WIDGET 6 - CONSTRUCTOR DE POSTURA
   Three slots (hecho, derecho, compromiso) filled with fragments. A fragment
   that does not fit answers why; the fitting one is revealed on the third miss.
   ================================================ */
var STC = null;
function buildStance(rng){
  var scen = [
    { sit:{ es:'En tu escuela, varios estudiantes que usan silla de ruedas no pueden llegar a los salones del segundo piso porque no hay rampa ni elevador. Un grupo propone juntar firmas.',
             en:'At your school, several students who use wheelchairs cannot reach the second floor classrooms because there is no ramp or elevator. A group proposes collecting signatures.' },
      frags:[
        { slot:0, es:'Varios estudiantes no pueden entrar a la mitad de los salones por una barrera física del edificio.',
                  en:'Several students cannot enter half of the classrooms because of a physical barrier in the building.' },
        { slot:1, es:'Está en juego el derecho a estudiar en condiciones de igualdad.',
                  en:'What is at stake is the right to study under equal conditions.' },
        { slot:2, es:'Firmo la petición y pido a la dirección un calendario con fechas concretas para construir la rampa.',
                  en:'I sign the petition and ask the school office for a schedule with concrete dates to build the ramp.' },
        { slot:-1, es:'Cada quien debería resolver como pueda, porque no es asunto del resto del grupo.',
                   en:'Everyone should sort it out as best they can, because it is not the business of the rest of the group.',
          nes:'Esa frase convierte un derecho en un problema privado. Los derechos alcanzan a toda la comunidad escolar.',
          nen:'That sentence turns a right into a private problem. Rights reach the whole school community.' },
        { slot:-1, es:'Es cuestión de mala suerte y no de derechos.',
                   en:'It is a matter of bad luck and not of rights.',
          nes:'La mala suerte no explica un edificio sin rampa: hay una decisión que se puede cambiar.',
          nen:'Bad luck does not explain a building without a ramp: there is a decision that can be changed.' },
        { slot:-1, es:'Lo mejor es esperar a que alguien más lo denuncie en otro momento.',
                   en:'The best thing is to wait for somebody else to report it some other time.',
          nes:'Esperar deja el reclamo sin quien lo sostenga, y sin eso ningún derecho ha avanzado.',
          nen:'Waiting leaves the demand with nobody to sustain it, and without that no right has ever advanced.' },
        { slot:-1, es:'Basta con mover a esos estudiantes a los salones de abajo para no gastar en obras.',
                   en:'It is enough to move those students to the downstairs classrooms so as not to spend on construction.',
          nes:'Esa salida acomoda a la escuela y no a las personas: separa en vez de dar acceso igual.',
          nen:'That way out suits the school and not the people: it separates instead of giving equal access.' } ] },
    { sit:{ es:'En una comunidad, varias familias hablan una lengua indígena. En la clínica nadie les explica en su lengua qué tratamiento reciben y salen sin entender las indicaciones.',
             en:'In a community, several families speak an indigenous language. At the clinic nobody explains their treatment in their language and they leave without understanding the instructions.' },
      frags:[
        { slot:0, es:'Varias personas reciben atención médica sin entender lo que se les explica.',
                  en:'Several people receive medical care without understanding what is explained to them.' },
        { slot:1, es:'Está en juego el derecho a la salud y el derecho a usar la lengua propia.',
                  en:'What is at stake is the right to health and the right to use their own language.' },
        { slot:2, es:'Propongo que la clínica cuente con personal intérprete y con carteles en las dos lenguas.',
                  en:'I propose that the clinic have interpreter staff and signs in both languages.' },
        { slot:-1, es:'Quien no hable español debería aprenderlo antes de pedir atención.',
                   en:'Whoever does not speak Spanish should learn it before asking for care.',
          nes:'Esa frase pone la carga en quien recibe el daño. El derecho no depende de la lengua que se hable.',
          nen:'That sentence puts the burden on the person harmed. The right does not depend on the language spoken.' },
        { slot:-1, es:'Es un problema de cada familia y no de la clínica.',
                   en:'It is a problem of each family and not of the clinic.',
          nes:'El servicio público tiene la obligación de hacerse entender: por eso es un asunto de derechos.',
          nen:'A public service is obliged to make itself understood: that is why it is a rights issue.' },
        { slot:-1, es:'Conviene esperar a que el problema se resuelva solo con el tiempo.',
                   en:'It is better to wait for the problem to solve itself over time.',
          nes:'Ningún derecho se reconoció solo con el paso del tiempo: alguien lo reclamó primero.',
          nen:'No right was ever recognized just with the passing of time: somebody demanded it first.' },
        { slot:-1, es:'Basta con que el personal hable más fuerte y más despacio.',
                   en:'It is enough for the staff to speak louder and more slowly.',
          nes:'Subir la voz no traduce nada. Lo que falta es que la información llegue en la lengua de la persona.',
          nen:'Raising your voice translates nothing. What is missing is information arriving in the language of the person.' } ] }
  ];
  var s = pick(scen, rng);
  STC = { sit:s.sit, frags: shuffle(s.frags, rng), filled:[], tries:0, revealed:false, done:false, msg:null, msgCls:null, miss:-1 };
