/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: Armador de hadrones (carga en tercios, con signo)
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var TG = [
    { th:3,  q:['u','u','d'], nm:{ es:'un protón, de carga total +1', en:'a proton, of total charge +1' } },
    { th:0,  q:['u','d','d'], nm:{ es:'un neutrón, de carga total 0', en:'a neutron, of total charge 0' } },
    { th:6,  q:['u','u','u'], nm:{ es:'una partícula delta, de carga total +2', en:'a delta particle, of total charge +2' } },
    { th:-3, q:['d','d','d'], nm:{ es:'una partícula delta, de carga total −1', en:'a delta particle, of total charge −1' } }
  ];
  var R = shuffle(TG, rng).slice(0, 3);
  var st = [one(['u','d'], rng), one(['u','d'], rng), one(['u','d'], rng)];
  var rd = 0, tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Armador de hadrones', en:'Hadron builder' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs" data-r="cvs"></canvas>' +
    '<div class="gw-row" data-r="slots"></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es:'suma en tercios', en:'sum in thirds' }) + '</div><div class="gw-cv" data-r="th">0</div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es:'carga total', en:'total charge' }) + '</div><div class="gw-cv" data-r="tot">0</div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es:'ronda', en:'round' }) + '</div><div class="gw-cv" data-r="rd">1/3</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-mini">' + L({ es:'Toca un quark para cambiarlo de tipo.', en:'Tap a quark to change its type.' }) + '</span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var elTask = host.querySelector('[data-r="task"]');
  var elSlots = host.querySelector('[data-r="slots"]');
  var elTh = host.querySelector('[data-r="th"]');
  var elTot = host.querySelector('[data-r="tot"]');
  var elRd = host.querySelector('[data-r="rd"]');
  var elChk = host.querySelector('[data-r="chk"]');
  var W = 300, H = 206;

  function val(k){ return k === 'u' ? 2 : -1; }
  function thirds(){ return val(st[0]) + val(st[1]) + val(st[2]); }

  function fit(){
    var dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth || 300; H = cv.clientHeight || 206;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(){
    fit();
    ctx.clearRect(0, 0, W, H);
    var cx = W / 2, cy = H / 2, big = Math.min(W, H) * 0.40;
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, big, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);
    var ang = [-Math.PI / 2, Math.PI / 6, 5 * Math.PI / 6], i;
    for (i = 0; i < 3; i++){
      var x = cx + Math.cos(ang[i]) * big * 0.52, y = cy + Math.sin(ang[i]) * big * 0.52;
      ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = st[i] === 'u' ? cssv('--green') : cssv('--gold');
      ctx.beginPath(); ctx.arc(x, y, 21, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 17px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(st[i], x, y - 1);
      ctx.fillStyle = cssv('--text2');
      ctx.font = '600 12px "IBM Plex Sans", sans-serif';
      ctx.fillText(sgnv(val(st[i])), x, y + 32);
    }
    ctx.fillStyle = cssv('--text3');
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(L({ es:'cargas anotadas en tercios', en:'charges written in thirds' }), 10, 10);
  }

  function slots(){
    var h = '', i;
    for (i = 0; i < 3; i++){
      h += '<button class="gw-slot ' + (st[i] === 'u' ? 'qu' : 'qd') + '" data-s="' + i + '">' + st[i] + '<br><span style="font-size:.7rem;color:var(--text3)">' + sgnv(val(st[i])) + '</span></button>';
    }
    elSlots.innerHTML = h;
    elSlots.querySelectorAll('[data-s]').forEach(function(b){
      b.addEventListener('click', function(){
        if (done) return;
        var i = parseInt(b.getAttribute('data-s'), 10);
        st[i] = st[i] === 'u' ? 'd' : 'u';
        refresh();
      });
    });
  }

  function refresh(){
    var th = thirds();
    elTh.textContent = sgnv(th);
    elTot.textContent = sgnv(th / 3);
    slots(); draw();
    if (done) return;
    var tg = R[rd];
    if (th === tg.th) {
      say(host, 'warm', L({ es:'La carga total ya vale ', en:'The total charge is now ' }) + '<span class="gw-val">' + sgnv(th / 3) + '</span>' + L({ es:'. Comprueba para confirmar el hadrón.', en:'. Check to confirm the hadron.' }));
    } else {
      say(host, '', L({ es:'Ahora mismo la suma vale ', en:'Right now the sum is ' }) + '<span class="gw-val">' + sgnv(th) + '</span>' + L({ es:' tercios.', en:' thirds.' }));
    }
  }

  function nextRound(){
    rd++;
    if (rd >= R.length) {
      done = true;
      elRd.textContent = '3/3';
      elChk.classList.add('solved'); elChk.disabled = true;
      elSlots.querySelectorAll('[data-s]').forEach(function(b){ b.disabled = true; });
      say(host, 'good', L({ es:'Los tres hadrones quedaron armados. La suma de tercios siempre cae en un número entero de cargas.', en:'The three hadrons are built. The sum of thirds always lands on a whole number of charges.' }));
      return;
    }
    tries = 0;
    st = [one(['u','d'], rng), one(['u','d'], rng), one(['u','d'], rng)];
    elRd.textContent = (rd + 1) + '/3';
    elTask.innerHTML = L({ es:'Arma ', en:'Build ' }) + L(R[rd].nm) + '.';
    refresh();
  }

  elChk.addEventListener('click', function(){
    if (done) return;
    var tg = R[rd], th = thirds();
    if (th === tg.th) {
      say(host, 'good', L({ es:'Correcto: ', en:'Correct: ' }) + sgnv(val(st[0])) + ' ' + (val(st[1]) < 0 ? '−' : '+') + ' ' + Math.abs(val(st[1])) + ' ' + (val(st[2]) < 0 ? '−' : '+') + ' ' + Math.abs(val(st[2])) + ' = ' + sgnv(th) + L({ es:' tercios, es decir una carga de ', en:' thirds, that is a charge of ' }) + sgnv(th / 3) + '.');
      setTimeout(nextRound, 900);
      return;
    }
    tries++;
    if (tries >= 3) {
      st = tg.q.slice();
      refresh();
      say(host, 'miss', L({ es:'La combinación que da esa carga es ', en:'The combination that gives that charge is ' }) + tg.q.join(' + ') + L({ es:', porque suma ', en:', because it adds up to ' }) + sgnv(tg.th) + L({ es:' tercios.', en:' thirds.' }));
      setTimeout(nextRound, 1600);
      return;
    }
    if (th < tg.th) {
      say(host, 'miss', L({ es:'Te quedaste corto por ', en:'You are short by ' }) + (tg.th - th) + L({ es:' tercios. Cambia un quark abajo por uno arriba y vuelve a mirar la suma.', en:' thirds. Change a down quark for an up one and look at the sum again.' }));
    } else {
      say(host, 'miss', L({ es:'Te pasaste por ', en:'You went over by ' }) + (th - tg.th) + L({ es:' tercios. Cambia un quark arriba por uno abajo y vuelve a mirar la suma.', en:' thirds. Change an up quark for a down one and look at the sum again.' }));
    }
  });

  elTask.innerHTML = L({ es:'Arma ', en:'Build ' }) + L(R[0].nm) + '.';
  refresh();
  window.addEventListener('resize', function(){ if (document.body.contains(cv)) draw(); });
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: Clasificador de familias del inventario de partículas
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var FAM = [
    { k:'q', nm:{ es:'quark', en:'quark' } },
    { k:'l', nm:{ es:'leptón', en:'lepton' } },
    { k:'b', nm:{ es:'bosón portador', en:'carrier boson' } }
  ];
  var POOL = {
    q:[ { es:'quark arriba', en:'up quark' }, { es:'quark abajo', en:'down quark' }, { es:'quark cima', en:'top quark' } ],
    l:[ { es:'electrón', en:'electron' }, { es:'neutrino', en:'neutrino' }, { es:'muón', en:'muon' } ],
    b:[ { es:'fotón', en:'photon' }, { es:'gluón', en:'gluon' }, { es:'bosón Z', en:'Z boson' } ]
  };
  var TIPS = [
    { es:'Las piezas que solo existen unidas dentro de protones y neutrones son quarks.', en:'The pieces that only exist bound inside protons and neutrons are quarks.' },
    { es:'Las que transmiten una fuerza de una partícula a otra son bosones portadores.', en:'The ones that carry a force from one particle to another are carrier bosons.' }
  ];
  var rd = 0, tries = 0, done = false, tiles = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de clasificación', en:'Sorting table' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Coloca cada partícula en su familia. Cada toque avanza a la siguiente familia.', en:'Place each particle in its family. Each tap moves on to the next family.' }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es:'colocadas', en:'placed' }) + '</div><div class="gw-cv" data-r="pl">0/6</div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es:'intento', en:'attempt' }) + '</div><div class="gw-cv" data-r="tr">1</div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es:'tanda', en:'set' }) + '</div><div class="gw-cv" data-r="rd">1/2</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="tiles"]');
  var elPl = host.querySelector('[data-r="pl"]');
  var elTr = host.querySelector('[data-r="tr"]');
  var elRd = host.querySelector('[data-r="rd"]');
  var elChk = host.querySelector('[data-r="chk"]');

  function famName(k){
    var i; for (i = 0; i < FAM.length; i++) if (FAM[i].k === k) return L(FAM[i].nm);
    return L({ es:'sin colocar', en:'not placed' });
  }
  function nextFam(k){
    if (k === null) return 'q';
    if (k === 'q') return 'l';
    if (k === 'l') return 'b';
    return null;
  }

  function build(){
    var picked = [], ks = ['q','l','b'], i;
    for (i = 0; i < ks.length; i++){
      var two = shuffle(POOL[ks[i]], rng).slice(0, 2), j;
      for (j = 0; j < two.length; j++) picked.push({ nm:two[j], f:ks[i], cur:null });
    }
    tiles = shuffle(picked, rng);
    render();
  }

  function render(){
    var h = '', i, placed = 0;
    for (i = 0; i < tiles.length; i++){
      if (tiles[i].cur) placed++;
      h += '<button class="gw-tile' + (tiles[i].cur ? ' on' : '') + (tiles[i].fix ? ' fix' : '') + '" data-i="' + i + '">' +
        L(tiles[i].nm) + '<br><span style="font-size:.72rem;color:var(--text3)">' + famName(tiles[i].cur) + '</span></button>';
    }
    elT.innerHTML = h;
    elPl.textContent = placed + '/6';
    elT.querySelectorAll('[data-i]').forEach(function(b){
      b.addEventListener('click', function(){
        if (done) return;
        var i = parseInt(b.getAttribute('data-i'), 10);
        tiles[i].cur = nextFam(tiles[i].cur);
        tiles[i].fix = false;
        render();
        var pl = 0, j; for (j = 0; j < tiles.length; j++) if (tiles[j].cur) pl++;
        if (pl < tiles.length) say(host, '', L({ es:'Quedan ', en:'There are ' }) + (tiles.length - pl) + L({ es:' partículas sin colocar.', en:' particles still unplaced.' }));
        else say(host, 'warm', L({ es:'Ya no queda ninguna suelta. Comprueba la mesa.', en:'None are left loose. Check the table.' }));
      });
    });
  }

  elChk.addEventListener('click', function(){
    if (done) return;
    var ok = 0, miss = 0, i;
    for (i = 0; i < tiles.length; i++){
      if (!tiles[i].cur) { miss++; continue; }
      if (tiles[i].cur === tiles[i].f) ok++;
    }
    if (miss > 0) { say(host, 'warm', L({ es:'Faltan ', en:'There are ' }) + miss + L({ es:' partículas por colocar antes de comprobar.', en:' particles still to place before checking.' })); return; }
    if (ok === tiles.length) {
      for (i = 0; i < tiles.length; i++) tiles[i].fix = true;
      render();
      say(host, 'good', L({ es:'Mesa completa: las seis quedaron en su familia.', en:'Table complete: all six are in their family.' }));
      rd++;
      if (rd >= 2) {
        done = true; elRd.textContent = '2/2';
        elChk.classList.add('solved'); elChk.disabled = true;
        elT.querySelectorAll('[data-i]').forEach(function(b){ b.disabled = true; });
        return;
      }
      setTimeout(function(){ tries = 0; elTr.textContent = '1'; elRd.textContent = (rd + 1) + '/2'; build(); say(host, '', L({ es:'Nueva tanda de partículas sobre la mesa.', en:'A new set of particles on the table.' })); }, 1100);
      return;
    }
    tries++;
    elTr.textContent = String(tries);
    if (tries >= 3) {
      for (i = 0; i < tiles.length; i++){ tiles[i].cur = tiles[i].f; tiles[i].fix = true; }
      render();
      say(host, 'miss', L({ es:'Así quedan acomodadas: los quarks nunca aparecen sueltos, los leptones sí, y los bosones portadores transmiten las fuerzas.', en:'This is how they line up: quarks never appear loose, leptons do, and carrier bosons transmit the forces.' }));
      rd++;
      if (rd >= 2) {
        done = true; elRd.textContent = '2/2';
        elChk.classList.add('solved'); elChk.disabled = true;
        elT.querySelectorAll('[data-i]').forEach(function(b){ b.disabled = true; });
        return;
      }
      setTimeout(function(){ tries = 0; elTr.textContent = '1'; elRd.textContent = (rd + 1) + '/2'; build(); }, 1800);
      return;
    }
    say(host, 'miss', ok + L({ es:' de 6 están en su familia. ', en:' of 6 are in their family. ' }) + L(TIPS[(tries - 1) % TIPS.length]));
  });

  build();
  elRd.textContent = '1/2';
}
/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: Colisionador (energía disponible y umbral de producción)
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var PART = [
    { m:0.14, nm:{ es:'un pion', en:'a pion' } },
    { m:0.94, nm:{ es:'un protón', en:'a proton' } },
    { m:3.1,  nm:{ es:'una partícula J/psi', en:'a J/psi particle' } },
    { m:80,   nm:{ es:'un bosón W', en:'a W boson' } },
    { m:91,   nm:{ es:'un bosón Z', en:'a Z boson' } },
    { m:125,  nm:{ es:'un bosón de Higgs', en:'a Higgs boson' } },
    { m:173,  nm:{ es:'un quark cima', en:'a top quark' } }
  ];
  var order = shuffle([3, 4, 5, 6], rng).slice(0, 3);
  var rd = 0, tries = 0, done = false, E = ri(rng, 5, 200), tt = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Sala de control del colisionador', en:'Collider control room' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'energía del choque', en:'collision energy' }) + '</span>' +
      '<input type="range" min="0" max="220" step="1" data-r="sl">' +
      '<span class="gw-val" data-r="ev"></span></div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Lanzar el choque', en:'Fire the collision' }) + '</button>' +
      '<span class="gw-val" data-r="rd">1/3</span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var elSl = host.querySelector('[data-r="sl"]');
  var elEv = host.querySelector('[data-r="ev"]');
  var elLive = host.querySelector('[data-r="live"]');
  var elTask = host.querySelector('[data-r="task"]');
  var elRd = host.querySelector('[data-r="rd"]');
  var elChk = host.querySelector('[data-r="chk"]');
  var W = 300, H = 206;
  elSl.value = E;

  function prod(e){ var i, k = -1; for (i = 0; i < PART.length; i++) if (e >= PART[i].m) k = i; return k; }

  function fit(){
    var dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth || 300; H = cv.clientHeight || 206;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(){
    fit();
    ctx.clearRect(0, 0, W, H);
    var cx = W / 2, cy = H / 2 + 6;
    var rx = Math.min(W * 0.40, 150), ry = Math.min(H * 0.30, 58);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 8;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832); ctx.stroke();
    var a = (tt % 1);
    var a1 = -Math.PI + a * Math.PI, a2 = -a * Math.PI;
    ctx.fillStyle = cssv('--green-dark');
    ctx.beginPath(); ctx.arc(cx + Math.cos(a1) * rx, cy + Math.sin(a1) * ry, 5, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + Math.cos(a2) * rx, cy + Math.sin(a2) * ry, 5, 0, 6.2832); ctx.fill();
    var k = prod(E);
    var rad = 6 + (E / 220) * 34 + Math.sin(tt * 4) * 2;
    ctx.fillStyle = cssv('--gold-bg');
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.2832); ctx.stroke();
    var i;
    for (i = 0; i < 8; i++){
      var an = i * 0.7854 + tt * 0.6;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(an) * rad, cy + Math.sin(an) * rad);
      ctx.lineTo(cx + Math.cos(an) * (rad + 12 + (E / 220) * 20), cy + Math.sin(an) * (rad + 12 + (E / 220) * 20));
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 1.2; ctx.stroke();
    }
    ctx.fillStyle = cssv('--text');
    ctx.font = '600 13px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(E + ' GeV', cx, 10);
    ctx.fillStyle = cssv('--text3');
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.fillText(k < 0 ? L({ es:'sin producción', en:'no production' }) : L(PART[k].nm), cx, H - 22);
  }

  function live(){
    var k = prod(E);
    elEv.textContent = E + ' GeV';
    elLive.innerHTML = k < 0
      ? L({ es:'Con esta energía el detector no registra ninguna partícula nueva.', en:'With this energy the detector records no new particle.' })
      : L({ es:'Con esta energía el detector registraría ', en:'With this energy the detector would record ' }) + '<span class="gw-val">' + L(PART[k].nm) + '</span>.';
  }

  elSl.addEventListener('input', function(){ if (done) return; E = parseInt(elSl.value, 10); live(); });

  function nextRound(){
    rd++;
    if (rd >= order.length) {
      done = true; elRd.textContent = '3/3';
      elChk.classList.add('solved'); elChk.disabled = true; elSl.disabled = true;
      say(host, 'good', L({ es:'Tres partículas producidas. La energía del choque marca el techo de lo que una máquina puede descubrir.', en:'Three particles produced. The collision energy sets the ceiling of what a machine can discover.' }));
      return;
    }
    tries = 0;
    elRd.textContent = (rd + 1) + '/3';
    elTask.innerHTML = L({ es:'Ajusta el dial para producir ', en:'Set the dial to produce ' }) + L(PART[order[rd]].nm) + '.';
    live();
  }

  elChk.addEventListener('click', function(){
    if (done) return;
    var tgt = order[rd], k = prod(E);
    if (k === tgt) {
      say(host, 'good', L({ es:'Producción lograda: ', en:'Production achieved: ' }) + L(PART[tgt].nm) + L({ es:' aparece a partir de ', en:' appears from ' }) + PART[tgt].m + ' GeV.');
      setTimeout(nextRound, 1000);
      return;
    }
    tries++;
    if (tries >= 3) {
      var hi = (tgt + 1 < PART.length) ? PART[tgt + 1].m : 220;
      E = Math.min(220, Math.round(PART[tgt].m + Math.max(1, (hi - PART[tgt].m) / 3)));
      elSl.value = E; live();
      say(host, 'miss', L({ es:'La ventana buena empieza en ', en:'The good window starts at ' }) + PART[tgt].m + L({ es:' GeV. El dial quedó dentro de ella.', en:' GeV. The dial is now inside it.' }));
      setTimeout(nextRound, 1700);
      return;
    }
    if (E < PART[tgt].m) {
      say(host, 'miss', L({ es:'La colisión se quedó corta por ', en:'The collision fell short by ' }) + Math.round(PART[tgt].m - E) + L({ es:' GeV. Sube el dial.', en:' GeV. Raise the dial.' }));
    } else {
      say(host, 'miss', L({ es:'Con tanta energía el detector registra ', en:'With that much energy the detector records ' }) + L(PART[k].nm) + L({ es:', que es más pesada. Baja el dial.', en:', which is heavier. Lower the dial.' }));
    }
  });

  elTask.innerHTML = L({ es:'Ajusta el dial para producir ', en:'Set the dial to produce ' }) + L(PART[order[0]].nm) + '.';
  live();
  (function loop(){
    if (!document.body.contains(cv)) return;
    tt += 0.02; draw();
    requestAnimationFrame(loop);
  })();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: Regla de escalas (del metro al límite de los aceleradores)
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var SC = [
    { e:0,   u:{ es:'1 metro', en:'1 metre' },          o:{ es:'un pupitre del salón', en:'a classroom desk' } },
    { e:-3,  u:{ es:'1 milímetro', en:'1 millimetre' }, o:{ es:'el grosor de una moneda', en:'the thickness of a coin' } },
    { e:-6,  u:{ es:'1 micrómetro', en:'1 micrometre' },o:{ es:'una bacteria', en:'a bacterium' } },
    { e:-9,  u:{ es:'1 nanómetro', en:'1 nanometre' },  o:{ es:'una molécula pequeña', en:'a small molecule' } },
    { e:-10, u:{ es:'0.1 nanómetros', en:'0.1 nanometres' }, o:{ es:'un átomo', en:'an atom' } },
    { e:-15, u:{ es:'1 femtómetro', en:'1 femtometre' },o:{ es:'el núcleo de un átomo', en:'the nucleus of an atom' } },
    { e:-18, u:{ es:'1 attómetro', en:'1 attometre' },  o:{ es:'la distancia más pequeña explorada en un acelerador', en:'the smallest distance explored in an accelerator' } }
  ];
  var order = shuffle([1, 2, 3, 4, 5, 6], rng).slice(0, 3);
  var rd = 0, tries = 0, done = false, idx = ri(rng, 0, 6);

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Regla de escalas', en:'Ladder of scales' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'escalón', en:'rung' }) + '</span>' +
      '<input type="range" min="0" max="6" step="1" data-r="sl">' +
      '<span class="gw-val" data-r="uv"></span></div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Fijar la regla', en:'Lock the ruler' }) + '</button>' +
      '<span class="gw-val" data-r="rd">1/3</span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var elSl = host.querySelector('[data-r="sl"]');
  var elUv = host.querySelector('[data-r="uv"]');
  var elLive = host.querySelector('[data-r="live"]');
  var elTask = host.querySelector('[data-r="task"]');
  var elRd = host.querySelector('[data-r="rd"]');
  var elChk = host.querySelector('[data-r="chk"]');
  var W = 300, H = 206;
  elSl.value = idx;

  function fit(){
    var dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth || 300; H = cv.clientHeight || 206;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(){
    fit();
    ctx.clearRect(0, 0, W, H);
    var pad = 26, y = H - 46, step = (W - pad * 2) / 6, i;
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
    for (i = 0; i < 7; i++){
      var x = pad + step * i;
      ctx.strokeStyle = i === idx ? cssv('--green') : cssv('--border');
      ctx.lineWidth = i === idx ? 3 : 2;
      ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.stroke();
      ctx.fillStyle = i === idx ? cssv('--green') : cssv('--text3');
      ctx.font = '10px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(String(SC[i].e), x, y + 14);
    }
    var mx = pad + step * idx;
    ctx.fillStyle = cssv('--gold');
    ctx.beginPath(); ctx.moveTo(mx, y - 12); ctx.lineTo(mx - 7, y - 24); ctx.lineTo(mx + 7, y - 24); ctx.closePath(); ctx.fill();
    var rad = Math.max(4, 52 - idx * 8);
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, 58, rad, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = cssv('--green-bg');
    ctx.beginPath(); ctx.arc(W / 2, 58, rad, 0, 6.2832); ctx.fill();
    ctx.fillStyle = cssv('--text');
    ctx.font = '600 13px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(L(SC[idx].u), W / 2, 8);
    ctx.fillStyle = cssv('--text3');
    ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.fillText(L(SC[idx].o), W / 2, H - 18);
  }

  function live(){
    elUv.textContent = '10^' + SC[idx].e + ' m';
    elLive.innerHTML = L({ es:'La regla está en ', en:'The ruler is at ' }) + '<span class="gw-val">' + L(SC[idx].u) + '</span>' + L({ es:', la escala de ', en:', the scale of ' }) + L(SC[idx].o) + '.';
    draw();
  }

  elSl.addEventListener('input', function(){ if (done) return; idx = parseInt(elSl.value, 10); live(); });

  function nextRound(){
    rd++;
    if (rd >= order.length) {
      done = true; elRd.textContent = '3/3';
      elChk.classList.add('solved'); elChk.disabled = true; elSl.disabled = true;
      say(host, 'good', L({ es:'Escalera recorrida. Cada escalón hacia la derecha achica el mundo mil veces o más.', en:'Ladder covered. Each rung to the right shrinks the world a thousand times or more.' }));
      return;
    }
    tries = 0;
    elRd.textContent = (rd + 1) + '/3';
    elTask.innerHTML = L({ es:'Lleva la regla a la escala de ', en:'Move the ruler to the scale of ' }) + L(SC[order[rd]].o) + '.';
    live();
  }

  elChk.addEventListener('click', function(){
    if (done) return;
    var tgt = order[rd];
    if (idx === tgt) {
      say(host, 'good', L({ es:'Ahí es: ', en:'That is it: ' }) + L(SC[tgt].o) + L({ es:' se mide en ', en:' is measured in ' }) + L(SC[tgt].u) + '.');
      setTimeout(nextRound, 950);
      return;
    }
    tries++;
    if (tries >= 3) {
      idx = tgt; elSl.value = idx; live();
      say(host, 'miss', L({ es:'La regla queda en ', en:'The ruler belongs at ' }) + L(SC[tgt].u) + L({ es:', que es la escala de ', en:', which is the scale of ' }) + L(SC[tgt].o) + '.');
      setTimeout(nextRound, 1700);
      return;
    }
    if (idx < tgt) {
      say(host, 'miss', L({ es:'Todavía estás en una escala más grande. Te faltan ', en:'You are still at a larger scale. You are ' }) + (tgt - idx) + L({ es:' escalones hacia lo pequeño.', en:' rungs away towards the small.' }));
    } else {
      say(host, 'miss', L({ es:'Te pasaste hacia lo pequeño por ', en:'You went too far towards the small by ' }) + (idx - tgt) + L({ es:' escalones. Regresa hacia la izquierda.', en:' rungs. Move back to the left.' }));
    }
  });

  elTask.innerHTML = L({ es:'Lleva la regla a la escala de ', en:'Move the ruler to the scale of ' }) + L(SC[order[0]].o) + '.';
  live();
  window.addEventListener('resize', function(){ if (document.body.contains(cv)) draw(); });
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: Barrido con punta de microscopio de efecto túnel
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var N = 6, K = 4;
  var rd = 0, done = false, atoms = [], taps = 0, found = 0, state = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Barrido con la punta', en:'Scanning with the tip' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Toca una casilla para bajar la punta y leer la corriente. Localiza los 4 átomos escondidos en la superficie.', en:'Tap a square to lower the tip and read the current. Locate the 4 atoms hidden on the surface.' }) + '</div>' +
    '<div class="gw-bar"><div class="gw-bin" data-r="bin"></div></div>' +
    '<div class="gw-map" data-r="map"></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es:'corriente', en:'current' }) + '</div><div class="gw-cv" data-r="cur">0</div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es:'átomos', en:'atoms' }) + '</div><div class="gw-cv" data-r="fo">0/4</div></div>' +
      '<div class="gw-cell"><div class="gw-cl">' + L({ es:'sondeos', en:'probes' }) + '</div><div class="gw-cv" data-r="tp">0</div></div>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elMap = host.querySelector('[data-r="map"]');
  var elBin = host.querySelector('[data-r="bin"]');
  var elCur = host.querySelector('[data-r="cur"]');
  var elFo = host.querySelector('[data-r="fo"]');
  var elTp = host.querySelector('[data-r="tp"]');

  function build(){
    atoms = []; state = []; taps = 0; found = 0;
    var used = {}, i;
    while (atoms.length < K){
      var r = ri(rng, 0, N - 1), c = ri(rng, 0, N - 1), key = r + '_' + c;
      if (used[key]) continue;
      used[key] = 1; atoms.push([r, c]);
    }
    for (i = 0; i < N * N; i++) state.push('');
    render();
    elFo.textContent = '0/' + K; elTp.textContent = '0'; elCur.textContent = '0';
    elBin.style.width = '0%';
  }

  function isAtom(r, c){ var i; for (i = 0; i < atoms.length; i++) if (atoms[i][0] === r && atoms[i][1] === c) return true; return false; }
  function nearAtom(r, c){
    var i; for (i = 0; i < atoms.length; i++){
      if (Math.abs(atoms[i][0] - r) <= 1 && Math.abs(atoms[i][1] - c) <= 1) return true;
    }
    return false;
  }

  function render(){
    var h = '', i;
    for (i = 0; i < N * N; i++){
      h += '<button class="gw-px ' + state[i] + '" data-p="' + i + '">' + (state[i] === 'hit' ? '●' : (state[i] === 'near' ? '·' : '')) + '</button>';
    }
    elMap.innerHTML = h;
    elMap.querySelectorAll('[data-p]').forEach(function(b){
      b.addEventListener('click', function(){ probe(parseInt(b.getAttribute('data-p'), 10)); });
    });
  }

  function reveal(){
    var i;
    for (i = 0; i < atoms.length; i++) state[atoms[i][0] * N + atoms[i][1]] = 'hit';
    render();
  }

  function nextRound(){
    rd++;
    if (rd >= 2) {
      done = true;
      elMap.querySelectorAll('[data-p]').forEach(function(b){ b.disabled = true; });
      return;
    }
    setTimeout(function(){
      build();
      say(host, '', L({ es:'Superficie nueva bajo la punta. Vuelve a barrer.', en:'A new surface under the tip. Scan again.' }));
    }, 1500);
  }

  function probe(i){
    if (done) return;
    if (state[i]) return;
    var r = Math.floor(i / N), c = i % N;
    taps++; elTp.textContent = String(taps);
    var lvl, cls, msg;
    if (isAtom(r, c)) {
      lvl = 100; cls = 'hit'; found++;
      elFo.textContent = found + '/' + K;
      msg = L({ es:'Corriente alta: la punta quedó justo encima de un átomo.', en:'High current: the tip landed right above an atom.' });
    } else if (nearAtom(r, c)) {
      lvl = 42; cls = 'near';
      msg = L({ es:'La corriente sube un poco: hay un átomo en una casilla vecina.', en:'The current rises a little: there is an atom in a neighbouring square.' });
    } else {
      lvl = 7; cls = 'cold';
      msg = L({ es:'Corriente casi nula: por aquí la superficie está vacía. Prueba más lejos.', en:'Almost no current: the surface is empty here. Try further away.' });
    }
    state[i] = cls;
    render();
    elCur.textContent = lvl;
    elBin.style.width = lvl + '%';
    if (found >= K) {
      say(host, 'good', L({ es:'Los 4 átomos quedaron marcados. Así se arma una imagen: corriente por corriente, punto por punto.', en:'All 4 atoms are marked. That is how an image is assembled: current by current, point by point.' }));
      nextRound();
      return;
    }
    if (taps >= 18) {
      reveal();
      say(host, 'miss', L({ es:'Se acabó el barrido. La imagen completa muestra dónde estaban los átomos que faltaban.', en:'The scan is over. The complete image shows where the missing atoms were.' }));
      nextRound();
      return;
    }
    say(host, cls === 'hit' ? 'good' : (cls === 'near' ? 'warm' : ''), msg + ' <span class="gw-val">' + found + '/' + K + '</span>');
  }

  build();
}
/* ══════════════════════════════════════════════════════════════════════════
   PROBLEMAS  ::  cada ranura con su propia bolsa de variantes (Rule 4)
   ══════════════════════════════════════════════════════════════════════════ */
var _p1tot = null;

function qword(n, kind){
  var words = { es:['cero','un','dos','tres'], en:['zero','one','two','three'] };
  var nm = kind === 'u'
    ? { es:['quark arriba','quarks arriba'], en:['up quark','up quarks'] }
    : { es:['quark abajo','quarks abajo'], en:['down quark','down quarks'] };
  var wl = words[LANG] || words.es, nl = nm[LANG] || nm.es;
  return wl[n] + ' ' + (n === 1 ? nl[0] : nl[1]);
}

function mkP1(rng){
  var V = [
    { nu:2, nd:1, tot:'+1' },
    { nu:1, nd:2, tot:'0' },
    { nu:3, nd:0, tot:'+2' },
    { nu:0, nd:3, tot:'−1' }
  ];
  var v = V[Math.floor(rng() * V.length)];
  _p1tot = v.tot;
  var th = 2 * v.nu - v.nd, i;
  var terms = [];
  for (i = 0; i < v.nu; i++) terms.push(2);
  for (i = 0; i < v.nd; i++) terms.push(-1);
  var ex = '';
  for (i = 0; i < terms.length; i++){
    if (i === 0) ex += (terms[i] < 0 ? '−' : '') + Math.abs(terms[i]);
    else ex += (terms[i] < 0 ? ' − ' : ' + ') + Math.abs(terms[i]);
  }
  var parts = [];
  if (v.nu > 0) parts.push(qword(v.nu, 'u'));
  if (v.nd > 0) parts.push(qword(v.nd, 'd'));
  var lista = parts.join(L({ es:' y ', en:' and ' }));
  return {
    title: L({ es:'Carga total de un hadrón', en:'Total charge of a hadron' }),
    q: L({
      es:'Un detector registra un hadrón formado por tres quarks: ' + lista + '. Cada quark arriba aporta una carga de +' + mf(2,3) + ' y cada quark abajo aporta una carga de −' + mf(1,3) + ', medidas en cargas elementales. ¿Cuál es la carga total de ese hadrón?',
      en:'A detector records a hadron made of three quarks: ' + lista + '. Each up quark contributes a charge of +' + mf(2,3) + ' and each down quark contributes a charge of −' + mf(1,3) + ', measured in elementary charges. What is the total charge of that hadron?'
    }),
    hint: L({

             en:ro + ' × ' + co + ' = ' + full + ', and ' + full + ' − ' + ms + ' = ' + n }),
    showWork: true
  };
}

(function(){

    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
