        '<div class="rcard"><div class="rname">Puntos contra por ciento</div><div class="rform">' + frac('nuevo − anterior', 'anterior') + '</div><div class="rnote">Dos lecturas del mismo cambio.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Café de Colima cotiza la caja en ' + money(c2L) + ' de lista. A una cadena regional le concede ' + pct0(c2d1) + ' por volumen y, encima, ' + pct0(c2d2) + ' por pagar el mismo día. El pedido es de ' + boxesEs(c2q) + ' y la factura lleva ' + pct0(IVA) + ' de impuesto.</p>' +

    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Fractions, decimals and percentages: one part written three ways</h2>' +
      '<p>A part of a quantity can be written as a fraction, as a decimal or as a percentage, and all three say the same thing. The fraction shows the structure, with the denominator saying into how many parts the whole was cut; the decimal is the convenient form for calculating; the percentage is the form a company converses in. Moving from one to another does not change the number, it changes who understands it without an explanation.</p>' +
      '<p>A percentage always carries a hidden base, and that is where nearly every mistake in this block begins. When somebody says they gave a fifteen percent discount, the figure means nothing until you know fifteen percent <strong>of what</strong>. Two percentages hanging from different bases cannot be added, just as two fractions with different denominators cannot be added without converting them first. It is the same rule in different clothes, and it is the one broken every day inside price lists.</p>' +
      '<p>The case that turns up most in practice is the <strong>chained discount</strong>. A volume discount followed by one for immediate payment does not amount to the sum of the two, because the second applies to whatever the first one left and not to the list price. Each discount is really a factor that multiplies: taking off ten percent is multiplying by nine tenths. Chaining discounts is multiplying factors, and the product of two factors below one always comes out larger than one minus the sum of the two discounts. That is why the single equivalent discount always lands below the sum.</p>' +
      '<p>One distinction remains, and a badly written report confuses it daily: <strong>percentage points</strong> against <strong>percent</strong>. If the margin rises from twelve to fifteen, it rose three percentage points, and in relative terms it rose by a quarter of where it stood. Both sentences are correct and they say very different things; writing one in place of the other is the cheapest way to exaggerate a result. The block closes with a reassuring observation: since a discount and a tax are both factors that multiply, the order between them does not alter the total, even though the law does require the tax to be worked out on the already discounted base.</p>' +

  addSection(function(L) {

      '<div class="stag">Concepto 3</div>' +
      '<h2>Orden, valor absoluto y el redondeo que se acumula</h2>' +
      '<p>Los números reales están ordenados, y ese orden es lo que permite decir que un resultado es mejor que otro. Comparar dos decimales es directo, comparar dos fracciones exige llevarlas a una escritura común, y comparar cantidades negativas invierte la intuición: entre dos pérdidas, la mayor en tamaño es la menor en la recta. Antes de comparar conviene siempre poner las cantidades en la misma forma, porque la mitad de las discusiones de una junta se resuelven cuando alguien escribe los tres números en la misma unidad.</p>' +
      '<p>El <strong>valor absoluto</strong> no es un borrador de signos, es la distancia entre dos puntos de la recta. En el control presupuestal esa distancia tiene nombre propio: la desviación entre lo que se gastó y lo que se había planeado. La desviación con signo dice hacia qué lado se movió la partida y la distancia dice qué tan lejos quedó del plan. Las dos hacen falta, y confundirlas tiene una consecuencia concreta: si las desviaciones de varias partidas se suman con su signo, un ahorro tapa un sobregiro y el reporte concluye que el mes salió conforme al presupuesto cuando en realidad ninguna partida se cumplió.</p>' +
      '<p>La desviación también admite dos escrituras, y conviene reportar las dos. La <strong>desviación absoluta</strong> está en pesos y responde a la pregunta de cuánto dinero hay que conseguir. La <strong>desviación relativa</strong> divide esa cantidad entre lo presupuestado y responde a qué tan mal se hizo la estimación. Una partida pequeña puede desviarse muchísimo en términos relativos sin mover la caja, y una partida grande puede desviarse poco en términos relativos y aun así llevarse el resultado del mes. Sobre la desviación relativa se construye la <strong>tolerancia</strong>, que es el intervalo alrededor del presupuesto dentro del cual nadie tiene que dar explicaciones.</p>' +
      '<p>Queda la letra chica: el <strong>redondeo</strong>. Redondear sustituye un número por otro cercano y el error de cada redondeo es a lo sumo la mitad de la última cifra conservada. Parece despreciable y deja de serlo cuando la operación se repite miles de veces, porque los errores se acumulan. Truncar, que es cortar sin mirar la cifra siguiente, es peor todavía: su error siempre va en la misma dirección y por eso no se compensa nunca. De ahí la regla que conviene grabarse: se redondea al presentar el resultado, no en cada paso intermedio.</p>' +

      '<strong>Lectura de negocio.</strong> Reportar solo los pesos deja al consejo sin saber si la desviación es grande o pequeña para el tamaño de la partida, y reportar solo el porcentaje deja a la tesorería sin saber cuánto dinero conseguir. Nota además que el redondeo de la letra chica es de un orden completamente distinto al de la desviación de fletes, y esa comparación es la que decide cuál de los dos merece la atención de una junta.</p></div>';
    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>Order, absolute value and the rounding that piles up</h2>' +
      '<p>The real numbers are ordered, and that order is what lets anyone say one result is better than another. Comparing two decimals is direct, comparing two fractions calls for bringing them to a common writing, and comparing negative amounts turns intuition around: between two losses, the larger in size is the smaller on the line. Before comparing it is always worth putting the quantities in the same form, because half the arguments in a meeting dissolve the moment somebody writes the three numbers in the same unit.</p>' +
      '<p><strong>Absolute value</strong> is not a sign eraser, it is the distance between two points on the line. In budget control that distance has a name of its own: the deviation between what was spent and what had been planned. The signed deviation says which way the line moved and the distance says how far it landed from the plan. Both are needed, and confusing them has a concrete consequence: if the deviations of several lines are added with their signs, a saving buries an overspend and the report concludes the month went to budget when in truth not one line was met.</p>' +
      '<p>A deviation also admits two writings, and both belong in the report. The <strong>absolute deviation</strong> is in pesos and answers the question of how much money has to be found. The <strong>relative deviation</strong> divides that amount by the budgeted figure and answers how badly the estimate was made. A small line can deviate enormously in relative terms without moving the bank account, and a large line can deviate slightly in relative terms and still carry off the result of the month. On the relative deviation rests the <strong>tolerance</strong>, which is the interval around the budget inside which nobody has to explain anything.</p>' +
      '<p>The small print remains: <strong>rounding</strong>. Rounding replaces a number with a nearby one and the error of each rounding is at most half of the last digit kept. It looks negligible and stops being so when the operation repeats thousands of times, because the errors accumulate. Truncating, which is cutting without looking at the next digit, is worse still: its error always goes the same way and therefore never cancels. Hence the rule worth memorising: round when presenting the result, not at every intermediate step.</p>' +

      '<h2>Racionales, irracionales y el centavo que sobra</h2>' +
      '<p>Todo número racional, es decir toda razón entre dos enteros, tiene escritura decimal de una de dos formas y no hay una tercera: o termina, o se repite para siempre en un bloque de cifras. Cuál de las dos ocurre lo decide el denominador una vez reducida la fracción. Si ese denominador se arma solo con doses y cincos, el decimal cierra; con cualquier otro factor primo el decimal se repite. La razón es que nuestro sistema escribe en base diez y diez se factoriza justamente en dos por cinco, así que la escritura decimal no es una propiedad del número sino de la base en que se escribe.</p>' +
      '<p>Esto tiene una consecuencia práctica el día que hay que repartir dinero. Un excedente dividido entre tres socios no cierra en centavos, y el sistema tiene que cortar en algún lado porque la moneda de medio centavo no existe. El corte deja un sobrante que no se evapora: alguien se lo queda. Ignorarlo es la peor opción, porque el residuo se acumula reparto tras reparto hasta que aparece como una diferencia sin explicación. La solución no es aritmética sino de acuerdo: se fija por escrito una regla, por ejemplo asignar el sobrante por turnos, y se documenta.</p>' +
      '<p>Los <strong>irracionales</strong> entran al negocio en cuanto aparece una raíz. El caso típico es la tasa media anual de dos años de crecimiento, que no es el promedio de las dos tasas sino la raíz del producto de sus factores. La media aritmética siempre queda por encima de la verdadera y esa exageración no es un detalle: aplicada varias veces promete un crecimiento que no ocurrió. El número que sale de esa raíz casi nunca es racional, así que no tiene escritura decimal exacta y solo se puede aproximar.</p>' +

      '<div class="stag">Concept 4</div>' +
      '<h2>Rational numbers, irrational numbers and the leftover cent</h2>' +
      '<p>Every rational number, that is, every ratio of two whole numbers, has a decimal writing of one of two kinds and there is no third: either it terminates, or it repeats forever in a block of digits. Which of the two happens is decided by the denominator once the fraction is reduced. If that denominator is built only out of twos and fives, the decimal closes; with any other prime factor the decimal repeats. The reason is that our system writes in base ten and ten factors into exactly two times five, so decimal writing is not a property of the number but of the base it is written in.</p>' +
      '<p>This has a practical consequence the day money has to be split. A surplus divided among three partners does not close in cents, and the system has to cut somewhere because there is no half-cent coin. The cut leaves a remainder that does not evaporate: somebody keeps it. Ignoring it is the worst option, because the residue piles up payout after payout until it shows up as a difference nobody can explain. The solution is not arithmetic but an agreement: a rule is written down, for instance assigning the remainder in turns, and it is documented.</p>' +

/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title        = p.i18n.title[LANG];
    p.questionText = p.i18n.q[LANG];
    p.hint         = p.i18n.hint[LANG];
    p.explanation  = p.i18n.exp[LANG];
    p.options      = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.questionText;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.options[oi] !== undefined) o.innerHTML = p.options[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.explanation;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/’/g, String.fromCharCode(39))
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/μ/g,'mu').replace(/σ/g,'sigma').replace(/α/g,'alpha').replace(/β/g,'beta')
      .replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/·/g,'*')
      .replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
