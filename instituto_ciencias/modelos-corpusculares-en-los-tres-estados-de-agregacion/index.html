<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelos Corpusculares en los Tres Estados de Agregación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Modelos Corpusculares en los Tres Estados de Agregación</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Modelos Corpusculares en los Tres Estados de Agregación</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#cc243c', primaryDark:'#480b14', primaryBg:'#f6e7e9',
  accent:'#fc0c24', accentBg:'#ffdbdf',
  darkPrimary:'#c74255', darkPrimaryDark:'#e87283', darkPrimaryBg:'#3b0b12',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  doc.save('qui3_t06_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');

/* ══════════════════════════════════════════════════════════════════════════
   GUÍA :: Modelos corpusculares en los tres estados de agregación
   Qué se dibuja y qué no se dibuja al representar una sustancia con
   partículas; cómo la separación, el acomodo y el movimiento explican forma,

   y por qué la sustancia sigue siendo la misma en los tres estados.
   Bilingüe (Rule 10), variantes por semilla (Rule 4), manipulativos marcados
   con data-widget (Part 0).
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }

function alive(host){ return document.body.contains(host); }
function nopts(a){ var s = a.map(function(x){ return String(x); }); return { es:s, en:s.slice() }; }

function addProblem(rng, v){

    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ── campo de partículas :: posiciones deterministas ─────────────────────── */
function jr(k){ var x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function spField(dist, ord, mov, n){
  var h = '', i, x, y, c, r;
  for (i = 0; i < n; i++){
    c = i % 6; r = Math.floor(i / 6);
    if (dist === 'junta'){
      if (ord === 'ord'){ x = 20 + c * 10.5; y = 16 + r * 20; }
      else { x = 17 + c * 11 + (jr(i * 2 + 1) - 0.5) * 8; y = 14 + r * 20 + (jr(i * 2 + 2) - 0.5) * 11; }
    } else { x = 5 + jr(i * 2 + 1) * 82; y = 7 + jr(i * 2 + 2) * 76; }
    h += '<i class="sp ' + mov + '" style="left:' + x.toFixed(1) + '%;bottom:' + y.toFixed(1) + '%"></i>';
  }
  return h;
}

function heatField(z){
  var h = '', i, x, y, cls, c, r;
  for (i = 0; i < 12; i++){
    c = i % 6; r = Math.floor(i / 6);
    if (z === 0){ x = 20 + c * 10.5; y = 16 + r * 20; cls = 'vib'; }
    else if (z === 1){
      if (i < 6){ x = 20 + c * 10.5; y = 14; cls = 'vib'; }
      else { x = 17 + (i - 6) * 11 + (jr(i * 2 + 1) - 0.5) * 8; y = 38 + (jr(i * 2 + 2) - 0.5) * 12; cls = 'flow'; }
    }
    else if (z === 2){ x = 17 + c * 11 + (jr(i * 2 + 1) - 0.5) * 8; y = 14 + r * 20 + (jr(i * 2 + 2) - 0.5) * 11; cls = 'flow'; }
    else if (z === 3){
      if (i < 6){ x = 17 + c * 11 + (jr(i * 2 + 1) - 0.5) * 8; y = 12 + (jr(i * 2 + 2) - 0.5) * 10; cls = 'flow'; }
      else { x = 6 + jr(i * 2 + 1) * 80; y = 46 + jr(i * 2 + 2) * 44; cls = 'fly'; }
    }
    else { x = 5 + jr(i * 2 + 1) * 82; y = 7 + jr(i * 2 + 2) * 76; cls = 'fly'; }
    h += '<i class="sp ' + cls + '" style="left:' + x.toFixed(1) + '%;bottom:' + y.toFixed(1) + '%"></i>';
  }
  return h;
}

/* ══ MANIPULATIVO 1 :: mesa de modelado ════════════════════════════════════
   El alumno arma la caja eligiendo separación, acomodo y movimiento. La caja
   se redibuja al instante y el pie de la caja dice a qué estado corresponde
   la combinación actual, incluso cuando no corresponde a ninguno.          */
function wModel(rng, host){
  var CFG = {
    sol: { dist:'junta', ord:'ord', mov:'vib' },
    liq: { dist:'junta', ord:'des', mov:'flow' },
    gas: { dist:'lejos', ord:'des', mov:'fly' }
  };
  var NAME = { sol:{es:'sólido',en:'solid'}, liq:{es:'líquido',en:'liquid'}, gas:{es:'gas',en:'gas'} };
  var DIMN = { dist:{es:'Separación',en:'Separation'}, ord:{es:'Acomodo',en:'Arrangement'}, mov:{es:'Movimiento',en:'Motion'} };
  var LB = {
    dist: { junta:{es:'en contacto',en:'touching'}, lejos:{es:'muy separadas',en:'far apart'} },
    ord: { ord:{es:'acomodo regular',en:'regular arrangement'}, des:{es:'sin acomodo regular',en:'no regular arrangement'} },
    mov: { vib:{es:'vibran en su sitio',en:'vibrate in place'}, flow:{es:'se deslizan sin salir del grupo',en:'slide without leaving the group'}, fly:{es:'recorren todo el recipiente',en:'travel the whole container'} }
  };
  var SEQ = shuffle(['sol','liq','gas'], rng);
  var st = { round:0, tries:0, done:false, locked:false, dist:'junta', ord:'ord', mov:'fly' };

  function target(){ return CFG[SEQ[st.round]]; }
  function combo(){
    var k;
    for (k in CFG){ if (CFG[k].dist === st.dist && CFG[k].ord === st.ord && CFG[k].mov === st.mov) return k; }
    return null;
  }
  function reset(){ st.dist = 'junta'; st.ord = 'ord'; st.mov = 'fly'; st.tries = 0; st.locked = false; }

  function row(dim, vals){
    return '<div class="gw-lbl">' + L(DIMN[dim]) + '</div><div class="gw-row">' +
      vals.map(function(v){
        return '<button class="gw-btn' + (st[dim] === v ? ' on' : '') + '" data-d="' + dim + '" data-v="' + v + '">' + L(LB[dim][v]) + '</button>';
      }).join('') + '</div>';
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'Mesa de modelado', en:'Modelling bench' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Armaste los tres modelos. Fíjate en lo que nunca tocaste: el número de esferas y su tamaño. Lo único que moviste fue separación, acomodo y movimiento.',
          en:'You built all three models. Notice what you never touched: the number of spheres and their size. All you moved was separation, arrangement and motion.'
        }) + '</div>';
      return;
    }
    var tg = SEQ[st.round];
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Mesa de modelado', en:'Modelling bench' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'Arma la caja de una sustancia en estado ', en:'Build the box of a substance in the ' }) + '<b>' + L(NAME[tg]) + '</b>' + L({ es:'.', en:' state.' }) + '</div>' +
      '<div class="gw-mini">' + L({ es:'Modelo ', en:'Model ' }) + (st.round + 1) + L({ es:' de tres', en:' of three' }) + '</div>' +
      '<div class="stbox">' + spField(st.dist, st.ord, st.mov, 12) + '</div>' +
      '<div class="gw-read">' +
        '<span class="gw-pill">' + L(DIMN.dist) + ': <b>' + L(LB.dist[st.dist]) + '</b></span>' +
        '<span class="gw-pill">' + L(DIMN.ord) + ': <b>' + L(LB.ord[st.ord]) + '</b></span>' +
        '<span class="gw-pill">' + L(DIMN.mov) + ': <b>' + L(LB.mov[st.mov]) + '</b></span>' +
      '</div>' +
      row('dist', ['junta','lejos']) + row('ord', ['ord','des']) + row('mov', ['vib','flow','fly']) +
      '<div class="gw-row"><button class="gw-btn" data-a="check">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb"></div>';
  }

  function live(){
    var c = combo();
    if (c) say(host, 'warm', L({ es:'Tal como está, la caja representa un ', en:'As it stands, the box shows a substance in the ' }) + '<b>' + L(NAME[c]) + '</b>' + L({ es:'.', en:' state.' }));
    else say(host, '', L({ es:'Tal como está, ninguna sustancia se comporta así: revisa qué combinación pediste.', en:'As it stands, no substance behaves like this: look again at the combination you set.' }));
  }

  function nudge(){
    var tg = target();
    if (st.dist !== tg.dist){
      return tg.dist === 'junta'
        ? L({ es:'La separación no corresponde: ahí las partículas se tocan unas con otras.', en:'The separation is off: there the particles touch one another.' })
        : L({ es:'La separación no corresponde: ahí queda mucho espacio vacío entre partícula y partícula.', en:'The separation is off: there a lot of empty space is left between one particle and the next.' });
    }
    if (st.ord !== tg.ord){
      return tg.ord === 'ord'
        ? L({ es:'Falta el acomodo: ahí cada partícula tiene un sitio fijo dentro de una red repetida.', en:'The arrangement is missing: there each particle has a fixed spot inside a repeating network.' })
        : L({ es:'Sobra el acomodo: ahí las partículas no guardan posiciones fijas ni forman filas.', en:'The arrangement is too rigid: there particles keep no fixed positions and form no rows.' });
    }
    return tg.mov === 'vib'
      ? L({ es:'El movimiento no corresponde: ahí cada partícula solo vibra alrededor de su sitio.', en:'The motion is off: there each particle only vibrates around its spot.' })
      : (tg.mov === 'flow'
        ? L({ es:'El movimiento no corresponde: ahí las partículas se deslizan pero no abandonan el grupo.', en:'The motion is off: there particles slide over each other but never leave the group.' })
        : L({ es:'El movimiento no corresponde: ahí las partículas recorren todo el recipiente.', en:'The motion is off: there particles travel across the whole container.' }));
  }

  function check(){
    if (st.locked) return;
    var tg = SEQ[st.round];
    if (combo() === tg){
      st.round++;
      if (st.round >= 3){ st.done = true; render(); return; }
      reset(); render();
      say(host, 'good', '🎉 ' + L({ es:'Correcto. Va la siguiente caja.', en:'Correct. On to the next box.' }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var c = target();
      st.dist = c.dist; st.ord = c.ord; st.mov = c.mov; st.locked = true;
      render();
      say(host, 'warm', L({ es:'Así se arma: ', en:'This is how it is built: ' }) +
        L(LB.dist[c.dist]) + ', ' + L(LB.ord[c.ord]) + ', ' + L(LB.mov[c.mov]) + '.');
      setTimeout(function(){
        if (!alive(host)) return;
        st.round++;
        if (st.round >= 3){ st.done = true; render(); return; }
        reset(); render(); live();
      }, 2100);
      return;
    }
    say(host, 'miss', nudge());
  }

  host.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null;
    if (!b || st.done) return;
    if (b.getAttribute('data-d')){
      if (st.locked) return;
      st[b.getAttribute('data-d')] = b.getAttribute('data-v');
      render(); live(); return;
    }
    if (b.getAttribute('data-a') === 'check') check();
  });

  render();
  say(host, '', L({
    es:'Mueve los tres controles y observa la caja: cada cambio se dibuja al momento.',
    en:'Move the three controls and watch the box: every change is drawn at once.'
  }));
}

/* ══ MANIPULATIVO 2 :: el émbolo ═══════════════════════════════════════════
   Tres muestras del mismo volumen bajo el mismo émbolo. Solo el gas cede.  */
function wPiston(rng, host){
  var TARGETS = shuffle([50,45,40,30,25], rng).slice(0,3);
  var st = { push:0, round:0, tries:0, done:false, locked:false };
  function vg(){ return 60 - st.push / 2; }

  function col(lbl, v, cls){
    return '<div class="tcol"><div class="tube"><i class="tfill ' + cls + '" style="height:' + (v / 60 * 100).toFixed(1) + '%"></i></div>' +
      '<div class="tlbl">' + lbl + '</div><div class="tval">' + v + ' cm³</div></div>';
  }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'La jeringa', en:'The syringe' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Solo el gas cedió. En el líquido y en el sólido las partículas ya se tocan y no queda hueco que quitar.',
          en:'Only the gas gave way. In the liquid and the solid the particles already touch and there is no gap left to remove.'
        }) + '</div>';
      return;
    }
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'La jeringa', en:'The syringe' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'Empuja el émbolo hasta dejar el gas en ', en:'Push the plunger until the gas sits at ' }) + '<b>' + TARGETS[st.round] + ' cm³</b>' + '</div>' +
      '<div class="gw-mini">' + L({ es:'Intento ', en:'Round ' }) + (st.round + 1) + L({ es:' de tres. Las tres muestras parten del mismo volumen.', en:' of three. All three samples start from the same volume.' }) + '</div>' +
      '<div class="tubes">' +
        col(L({ es:'gas', en:'gas' }), vg(), 'tg') +
        col(L({ es:'líquido', en:'liquid' }), 60, 'tl') +
        col(L({ es:'sólido', en:'solid' }), 60, 'ts') +
      '</div>' +
      '<div class="gw-row">' +
        '<button class="gw-btn" data-a="push">' + L({ es:'Empujar', en:'Push' }) + '</button>' +
        '<button class="gw-btn" data-a="pull">' + L({ es:'Soltar', en:'Release' }) + '</button>' +
        '<button class="gw-btn" data-a="check">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '</div>' +
      '<div class="gw-fb"></div>';
  }

  function live(){
    var v = vg(), tgt = TARGETS[st.round];
    if (v > tgt) say(host, '', L({ es:'El gas va en ', en:'The gas is at ' }) + '<b>' + v + ' cm³</b>' + L({ es:' y buscas ', en:' and you want ' }) + tgt + L({ es:' cm³: sigue empujando.', en:' cm³: keep pushing.' }));
    else if (v < tgt) say(host, '', L({ es:'Te pasaste: el gas va en ', en:'You went too far: the gas is at ' }) + '<b>' + v + ' cm³</b>' + L({ es:'. Suelta un poco.', en:'. Release a little.' }));
    else say(host, 'warm', L({ es:'El gas ya está en ', en:'The gas is now at ' }) + '<b>' + v + ' cm³</b>' + L({ es:'. Y el líquido y el sólido siguen igual: sus partículas ya se tocaban.', en:'. And the liquid and the solid have not moved: their particles were already touching.' }));
  }

  function check(){
    if (st.locked) return;
    var tgt = TARGETS[st.round];
    if (vg() === tgt){
      st.round++;
      if (st.round >= 3){ st.done = true; render(); return; }
      st.push = 0; st.tries = 0; render();
      say(host, 'good', '🎉 ' + L({ es:'Ese es el volumen. Va la siguiente medida.', en:'That is the volume. On to the next reading.' }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.push = (60 - tgt) * 2; st.locked = true; render();
      say(host, 'warm', L({ es:'Este es el punto: el gas queda en ', en:'This is the point: the gas ends at ' }) + tgt + L({

        if (!alive(host)) return;
        st.round++;
        if (st.round >= 3){ st.done = true; render(); return; }

  }

  host.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null;
    if (!b || st.done) return;

    if (a === 'check'){ check(); return; }
    if (st.locked) return;
    if (a === 'push') st.push = Math.min(80, st.push + 10);
    if (a === 'pull') st.push = Math.max(0, st.push - 10);
    render(); live();
  });

  render();
  say(host, '', L({
    es:'Empuja y suelta cuantas veces quieras: mira cuál de las tres columnas baja.',

/* ══ MANIPULATIVO 3 :: energía y termómetro ════════════════════════════════
   Un control de energía; la caja y el termómetro responden al instante y las
   mesetas aparecen solas.                                                  */
function wHeat(rng, host){
  function T(e){
    if (e <= 20) return 2 * e - 40;
    if (e <= 40) return 0;
    if (e < 65) return 4 * (e - 40);
    if (e <= 90) return 100;
    return 100 + 4 * (e - 90);
  }
  function zone(e){
    if (e < 20) return 0;
    if (e <= 40) return 1;
    if (e < 65) return 2;
    if (e <= 90) return 3;
    return 4;
  }
  var ZN = [
    { es:'sólido', en:'solid' },
    { es:'sólido y líquido a la vez', en:'solid and liquid at once' },
    { es:'líquido', en:'liquid' },
    { es:'líquido y gas a la vez', en:'liquid and gas at once' },
    { es:'gas', en:'gas' }
  ];
  var TASKS = [
    { z:1, q:{ es:'Lleva la muestra al punto donde el termómetro deja de subir por primera vez y conviven dos estados.', en:'Take the sample to the point where the thermometer stops rising for the first time and two states coexist.' } },
    { z:2, q:{ es:'Lleva la muestra al punto donde ya no queda nada de sólido y la temperatura vuelve a subir.', en:'Take the sample to the point where no solid is left and the temperature rises again.' } },
    { z:3, q:{ es:'Lleva la muestra al punto donde el termómetro se queda quieto por segunda vez y todavía hay líquido.', en:'Take the sample to the point where the thermometer stalls a second time and there is still liquid.' } },
    { z:4, q:{ es:'Lleva la muestra al punto donde ya no queda líquido y las partículas recorren todo el recipiente.', en:'Take the sample to the point where no liquid is left and the particles travel the whole container.' } }
  ];
  var SEQ = shuffle(TASKS, rng).slice(0, 3);
  var st = { e:0, round:0, tries:0, done:false, locked:false };

  function tstr(v){ return (v < 0 ? '−' + Math.abs(v) : String(v)) + ' °C'; }

  function render(){
    if (st.done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'Termómetro de partículas', en:'Particle thermometer' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Ubicaste los tres puntos. Los tramos planos son justamente aquellos en los que la energía separa partículas en vez de acelerarlas.',
          en:'You found all three points. The flat stretches are exactly the ones where energy pulls particles apart instead of speeding them up.'
        }) + '</div>';
      return;
    }
    var z = zone(st.e);
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Termómetro de partículas', en:'Particle thermometer' }) + '</div>' +
      '<div class="gw-q">' + L(SEQ[st.round].q) + '</div>' +
      '<div class="gw-mini">' + L({ es:'Punto ', en:'Point ' }) + (st.round + 1) + L({ es:' de tres', en:' of three' }) + '</div>' +
      '<div class="stbox" data-r="box">' + heatField(z) + '</div>' +
      '<input type="range" class="yr" min="0" max="100" step="5" value="' + st.e + '"' + (st.locked ? ' disabled' : '') + '>' +
      '<div class="gw-read">' +
        '<span class="gw-pill">' + L({ es:'energía', en:'energy' }) + ': <b data-r="e">' + st.e + '</b></span>' +
        '<span class="gw-pill">' + L({ es:'termómetro', en:'thermometer' }) + ': <b data-r="t">' + tstr(T(st.e)) + '</b></span>' +
        '<span class="gw-pill">' + L({ es:'estado', en:'state' }) + ': <b data-r="z">' + L(ZN[z]) + '</b></span>' +
      '</div>' +
      '<div class="gw-row"><button class="gw-btn" data-a="check">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb"></div>';
  }

  function refresh(){
    var z = zone(st.e);
    var box = host.querySelector('[data-r="box"]'); if (box) box.innerHTML = heatField(z);
    var pe = host.querySelector('[data-r="e"]'); if (pe) pe.textContent = st.e;
    var pt = host.querySelector('[data-r="t"]'); if (pt) pt.textContent = tstr(T(st.e));
    var pz = host.querySelector('[data-r="z"]'); if (pz) pz.textContent = L(ZN[z]);
  }

  function live(){
    var z = zone(st.e), tz = SEQ[st.round].z;
    if (z < tz) say(host, '', L({ es:'Todavía no: con esa energía la muestra sigue en ', en:'Not yet: with that energy the sample is still ' }) + L(ZN[z]) + L({ es:'. Dale más energía.', en:'. Give it more energy.' }));
    else if (z > tz) say(host, '', L({ es:'Te pasaste: con esa energía la muestra ya va en ', en:'Too far: with that energy the sample is already ' }) + L(ZN[z]) + L({ es:'. Baja la energía.', en:'. Lower the energy.' }));
    else say(host, 'warm', L({ es:'Ahí está la zona pedida. Comprueba para confirmarla.', en:'That is the zone asked for. Check to confirm it.' }));
  }

  function check(){
    if (st.locked) return;
    if (zone(st.e) === SEQ[st.round].z){
      st.round++;
      if (st.round >= 3){ st.done = true; render(); return; }
      st.e = 0; st.tries = 0; render();
      say(host, 'good', '🎉 ' + L({ es:'Ese es el punto. Va el siguiente.', en:'That is the point. On to the next one.' }));
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var tz = SEQ[st.round].z;
      st.e = [10, 30, 55, 80, 100][tz];
      st.locked = true; render();
      say(host, 'warm', L({ es:'Aquí estaba: la muestra queda como ', en:'Here it was: the sample sits as ' }) + L(ZN[tz]) +
        L({ es:' y el termómetro marca ', en:' and the thermometer reads ' }) + tstr(T(st.e)) + '.');
      setTimeout(function(){
        if (!alive(host)) return;
        st.round++;
        if (st.round >= 3){ st.done = true; render(); return; }
        st.e = 0; st.tries = 0; st.locked = false; render(); live();
      }, 2300);
      return;
    }
    live();
  }

  host.addEventListener('input', function(ev){
    if (st.done || st.locked) return;
    if (ev.target && ev.target.classList.contains('yr')){
      st.e = parseInt(ev.target.value, 10);
      refresh(); live();
    }
  });
  host.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('button') : null;
    if (!b || st.done) return;
    if (b.getAttribute('data-a') === 'check') check();
  });

  render();
  say(host, '', L({
    es:'Desliza el control despacio y no pierdas de vista el termómetro: hay tramos en los que se queda quieto.',
    en:'Slide the control slowly and keep an eye on the thermometer: there are stretches where it stalls.'
  }));
}

             en:['Particles do not change size on boiling: only their separation and their speed change',
                 'The vapour particles should be drawn closer together than those of the liquid water',
                 'The vapour particles should be drawn in regular rows and in contact',
                 'The vapour particles should be drawn with one sphere fewer each'] },
      ci:0,
      hint:{ es:'Separa las dos cosas que el dibujo mezcló: cuánto mide una partícula y cuánto hay entre una y la siguiente.',
             en:'Separate the two things the drawing mixed up: how big one particle is, and how much room lies between one and the next.' },
      exp:{ es:'El vapor ocupa más espacio porque entre partícula y partícula queda mucho hueco, no porque cada partícula se haya inflado. Al hervir cambia el arreglo y la rapidez, nunca el tamaño de la partícula.',
            en:'The vapour takes up more room because a lot of gap is left between one particle and the next, not because each particle has swollen. On boiling the arrangement and the speed change, never the size of the particle.' } },
    { title:{ es:'Revisa la conclusión', en:'Check the conclusion' },
      q:{ es:'Un compañero dibuja el hielo con las mismas esferas del agua líquida pero acomodadas en filas regulares y en contacto, y escribe debajo que el hielo es por lo tanto una sustancia distinta del agua. ¿Qué parte de su trabajo hay que corregir?',
          en:'A classmate draws ice with the same spheres as liquid water but set in regular rows and in contact, and writes underneath that ice is therefore a substance different from water. Which part of the work needs correcting?' },
      opts:{ es:['El dibujo está bien, pero la conclusión no: el hielo y el agua líquida son la misma sustancia',
                 'El dibujo está mal: en el hielo las partículas quedan desordenadas, y la conclusión es correcta',
                 'El dibujo está mal: en el hielo las partículas quedan muy separadas, y la conclusión es correcta',
                 'Todo está bien: al acomodarse en filas, las partículas forman una sustancia distinta'],
             en:['The drawing is right, but the conclusion is not: ice and liquid water are the same substance',
                 'The drawing is wrong: in ice the particles end up disordered, and the conclusion is right',
                 'The drawing is wrong: in ice the particles end up far apart, and the conclusion is right',
                 'Everything is right: on settling into rows, the particles form a different substance'] },
      ci:0,
      hint:{ es:'Revisa por separado las dos afirmaciones: cómo están colocadas las partículas y de qué clase son.',
             en:'Review the two claims separately: how the particles are placed, and what kind they are.' },
      exp:{ es:'El acomodo dibujado corresponde al sólido y está bien resuelto. Lo que falla es la conclusión: congelar solo reacomoda partículas que siguen siendo de la misma clase, así que el hielo y el agua líquida son la misma sustancia en dos estados.',
            en:'The arrangement drawn matches a solid and is correctly done. What fails is the conclusion: freezing only rearranges particles that are still of the same kind, so ice and liquid water are the same substance in two states.' } }
  ];
  return pick(V, rng);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un vaso de agua, tres veces', en:'One glass of water, three times' }),
    '<p>' + L({
      es:'Toma un vaso con hielo, déjalo un rato al sol y vuelve más tarde: primero tienes un bloque duro que conserva su forma, luego un líquido que se acomoda al vaso y al final una parte se ha ido al aire sin dejar rastro. No entró ni salió ninguna sustancia nueva, y sin embargo el material se comporta de tres maneras distintas.',
      en:'Take a glass with ice, leave it in the sun for a while and come back later: first you have a hard block that keeps its shape, then a liquid that settles into the glass, and in the end part of it has gone into the air leaving no trace. No new substance came in or went out, and yet the material behaves in three different ways.'
    }) + '</p>' +
    '<p>' + L({
      es:'La explicación no está en el vaso sino en la escala de las partículas, y se dibuja. En esta guía vas a armar cajas de partículas eligiendo tres cosas, vas a comprimir gas, líquido y sólido bajo el mismo émbolo, vas a mover la energía de una muestra para encontrar los tramos en que el termómetro se queda quieto y vas a decidir qué cosas cambian y cuáles no cuando el agua hierve.',
      en:'The explanation is not in the glass but at the scale of the particles, and it can be drawn. In this guide you will assemble boxes of particles by choosing three things, you will compress gas, liquid and solid under the same plunger, you will move the energy of a sample to find the stretches where the thermometer stalls, and you will decide which things change and which do not when water boils.'
    }) + '</p>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Tres decisiones para dibujar cualquier estado', en:'Three decisions for drawing any state' }),
    '<p>' + L({
      es:'Un modelo corpuscular de un estado de agregación se arma tomando tres decisiones independientes sobre las mismas partículas. La primera es la separación: si se tocan unas con otras o si entre ellas queda mucho espacio vacío. La segunda es el acomodo: si ocupan posiciones fijas que se repiten formando una red, o si no guardan ninguna posición fija. La tercera es el movimiento: si cada partícula solo vibra alrededor de su sitio, si se desliza sobre sus vecinas sin abandonar el grupo o si recorre libremente todo el recipiente.',
      en:'A particle model of a state of matter is assembled by taking three independent decisions about the same particles. The first is separation: whether they touch one another or a lot of empty space is left between them. The second is arrangement: whether they occupy fixed positions that repeat into a network, or keep no fixed position at all. The third is motion: whether each particle merely vibrates around its spot, slides over its neighbours without leaving the group, or travels freely through the whole container.'
    }) + '</p>' +
    '<p>' + L({
      es:'De las combinaciones posibles, solo tres describen a la materia real. El sólido lleva partículas en contacto, ordenadas y vibrando en su sitio. El líquido lleva partículas igual de juntas, pero sin acomodo regular y deslizándose entre ellas. El gas lleva partículas muy separadas, sin acomodo y moviéndose libres y rápido. Conviene tener presente que juntas y ordenadas son cosas distintas: el líquido y el sólido comparten la primera y se distinguen por la segunda.',
      en:'Of all the possible combinations, only three describe real matter. A solid carries particles in contact, ordered and vibrating in place. A liquid carries particles just as close, but with no regular arrangement and sliding among themselves. A gas carries particles far apart, unarranged and moving free and fast. It is worth keeping in mind that close and ordered are different things: liquid and solid share the first and are told apart by the second.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Sólido', en:'Solid' }), L({ es:'juntas + ordenadas + vibran', en:'close + ordered + vibrating' }), L({ es:'forma y volumen propios', en:'its own shape and volume' })) +
      rcard(L({ es:'Líquido', en:'Liquid' }), L({ es:'juntas + sin orden + deslizan', en:'close + unordered + sliding' }), L({ es:'volumen propio, forma del recipiente', en:'own volume, shape of the container' })) +
      rcard(L({ es:'Gas', en:'Gas' }), L({ es:'separadas + sin orden + libres', en:'apart + unordered + free' }), L({ es:'llena todo el recipiente', en:'fills the whole container' })) +
      rcard(L({ es:'Las tres decisiones', en:'The three decisions' }), L({ es:'separación, acomodo, movimiento', en:'separation, arrangement, motion' }), L({ es:'se eligen por separado', en:'each one is chosen separately' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'estar juntas no implica estar ordenadas. Esa distinción es la que separa al líquido del sólido.',
      en:'being close does not imply being ordered. That distinction is what separates the liquid from the solid.'
    }) + '</p></div>'
  );
  wModel(rng, widgetHost(s1, 'w_modelo', 'build'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Del dibujo a lo que se ve en la mesa', en:'From the drawing to what you see on the bench' }),
    '<p>' + L({
      es:'Cada propiedad que se observa a simple vista sale de una de las tres decisiones del modelo. Un sólido conserva su forma porque cada partícula tiene un sitio del que no se mueve. Un líquido se derrama y toma la forma del recipiente porque sus partículas se deslizan, pero conserva su volumen porque siguen tocándose. Un gas llena por completo cualquier recipiente porque nada mantiene juntas a sus partículas.',
      en:'Every property observed with the naked eye comes out of one of the three decisions in the model. A solid keeps its shape because each particle has a spot it does not leave. A liquid spills and takes the shape of its container because its particles slide, yet it keeps its volume because they still touch. A gas completely fills any container because nothing holds its particles together.'
    }) + '</p>' +
    '<p>' + L({
      es:'La propiedad que mejor distingue al gas es la compresibilidad. Al empujar un émbolo sobre un gas encerrado, el volumen se reduce mucho, porque lo único que se quita es el espacio vacío que había entre partículas. Sobre un líquido o un sólido el mismo empujón casi no consigue nada: sus partículas ya están en contacto y no queda hueco que eliminar. Comprimir nunca achica una partícula ni la parte: solo acerca partículas que estaban lejos.',
      en:'The property that best singles out a gas is compressibility. Pushing a plunger onto a trapped gas reduces its volume a great deal, because the only thing removed is the empty space that lay between particles. On a liquid or a solid the same push achieves almost nothing: their particles are already in contact and no gap is left to remove. Compressing never shrinks a particle or splits it: it only brings closer particles that were far apart.'
    }) + '</p>'
  );
  wPiston(rng, widgetHost(s2, 'w_embolo', 'piston'));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Qué hace la energía que entra', en:'What the incoming energy does' }),
    '<p>' + L({
      es:'La temperatura que marca un termómetro informa de la rapidez media con que se mueven las partículas. Mientras una muestra está en un solo estado, la energía que entra se emplea en acelerarlas y la lectura sube. Pero llega un momento en que la energía se dedica a otra cosa: a vencer lo que mantiene unidas a las partículas. En ese tramo la muestra sigue recibiendo calor y el termómetro se queda quieto.',
      en:'The temperature a thermometer reads reports the average speed at which the particles move. While a sample sits in a single state, the incoming energy goes into speeding them up and the reading rises. But a moment comes when the energy is devoted to something else: overcoming what holds the particles together. Along that stretch the sample keeps receiving heat and the thermometer stalls.'
    }) + '</p>' +
    '<p>' + L({
      es:'Por eso la gráfica de un calentamiento tiene tramos que suben y tramos planos. Los tramos planos son justamente los cambios de estado, y en ellos conviven dos estados a la vez: mientras quede algo de hielo sin fundir, la mezcla de hielo y agua se mantiene en la misma lectura. Cuando el último resto termina de cambiar, la energía vuelve a emplearse en acelerar partículas y la lectura sube otra vez.',
      en:'That is why a heating graph has rising stretches and flat stretches. The flat stretches are precisely the changes of state, and along them two states coexist at once: as long as some unmelted ice remains, the mixture of ice and water holds the same reading. When the last remnant finishes changing, the energy goes back to speeding up particles and the reading rises again.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Un tramo plano no significa que la muestra dejó de recibir energía. Significa que la energía se está gastando en separar partículas en lugar de acelerarlas.',
      en:'A flat stretch does not mean the sample stopped receiving energy. It means the energy is being spent separating particles instead of speeding them up.'
    }) + '</p></div>'
  );
  wHeat(rng, widgetHost(s3, 'w_energia', 'slider'));
  addProblem(rng, mkP4(rng));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Seis viajes con nombre propio', en:'Six trips with names of their own' }),
    '<p>' + L({
      es:'Entre tres estados hay seis viajes posibles y cada uno tiene nombre. Del sólido al líquido, fusión; del líquido al sólido, solidificación. Del líquido al gas, vaporización; del gas al líquido, condensación. Y quedan dos que se saltan el estado intermedio: del sólido al gas directamente, sublimación, y del gas al sólido directamente, sublimación inversa.',
      en:'Between three states there are six possible trips and each one has a name. Solid to liquid, melting; liquid to solid, freezing. Liquid to gas, vaporization; gas to liquid, condensation. And two more skip the middle state: solid straight to gas, sublimation, and gas straight to solid, deposition.'
    }) + '</p>' +
    '<p>' + L({
      es:'Para reconocer cuál es cuál conviene leer el modelo por su punto de partida y su punto de llegada, y no por si algo se calienta o se enfría. Basta con preguntar dos cosas: al final del proceso, ¿las partículas quedan en contacto o separadas? Y si quedan en contacto, ¿quedan además en un acomodo regular? La primera pregunta separa al gas de los otros dos; la segunda separa al sólido del líquido.',
      en:'To tell which is which it helps to read the model by where it starts and where it ends, and not by whether something heats or cools. Two questions are enough: at the end of the process, do the particles end up in contact or apart? And if they end up in contact, do they also end up in a regular arrangement? The first question separates the gas from the other two; the second separates the solid from the liquid.'
    }) + '</p>'
  );
  wNames(rng, widgetHost(s4, 'w_nombres', 'match'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Lo que sobrevive a los tres estados', en:'What survives all three states' }),
    '<p>' + L({
      es:'Un cambio de estado mueve el arreglo y la rapidez de las partículas, y nada más. Las partículas no se hacen más grandes, no se parten, no se unen entre sí y no se transforman en otras. Por eso el hielo, el agua líquida y el vapor son la misma sustancia en tres presentaciones, y por eso un cambio de estado es un cambio físico: se puede deshacer devolviendo o quitando energía, y se recupera exactamente lo que había.',
      en:'A change of state moves the arrangement and the speed of the particles, and nothing more. The particles do not grow bigger, do not split, do not join to each other and do not turn into others. That is why ice, liquid water and vapour are the same substance in three presentations, and why a change of state is a physical change: it can be undone by giving back or taking away energy, and exactly what was there is recovered.'
    }) + '</p>' +
    '<p>' + L({
      es:'Esto vale para cualquier material, no solo para una sustancia pura. Un elemento, un compuesto y una mezcla pueden representarse en los tres estados, y en cada dibujo hay que decidir dos cosas por separado: qué clases de partícula aparecen, que es asunto de la composición, y cómo están colocadas, que es asunto del estado. Congelar agua de mar no le quita la sal ni la une al agua: sigue habiendo dos clases de partícula, ahora quietas y ordenadas.',
      en:'This holds for any material, not only for a pure substance. An element, a compound and a mixture can all be represented in the three states, and in each drawing two things must be decided separately: which kinds of particle appear, which is a matter of composition, and how they are placed, which is a matter of state. Freezing sea water neither removes its salt nor joins it to the water: there are still two kinds of particle, now still and ordered.'
    }) + '</p>'
  );
  wChange(rng, widgetHost(s5, 'w_cambia', 'classify'));
  addProblem(rng, mkP8(rng));
  wReflect(rng, widgetHost(s5, 'w_cuaderno', 'reflect'));

  /* ══ CIERRE :: sin explicación previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Dos situaciones más, sin pistas previas. Léelas despacio y decide con el modelo en la cabeza.',
      en:'Two more situations, with no clues beforehand. Read them slowly and decide with the model in mind.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
</script>
