<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitaminas, Minerales, Agua y Aporte Energético</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Vitaminas, Minerales, Agua y Aporte Energético</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Vitaminas, Minerales, Agua y Aporte Energético</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c84', primaryDark:'#111d43', primaryBg:'#e8ebf5',
  accent:'#e42424', accentBg:'#fbdfdf',
  darkPrimary:'#4e69bb', darkPrimaryDark:'#7d95dd', darkPrimaryBg:'#0f1936',

function setLang(l){

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'qui3_t09_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'qui3_t09_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'qui3_t09_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('qui3_t09_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function vpick(rng, list){ return list[Math.floor(rng() * list.length)]; }
function uniq4(a){ for (var i = 0; i < a.length; i++) for (var j = i + 1; j < a.length; j++) if (a[i] === a[j]) return false; return true; }
function uniqOpts(o){ return uniq4(o.es) && uniq4(o.en); }
function kc(n){ return { es: n + ' kcal', en: n + ' kcal' }; }
function mL(n){ return { es: n + ' mL', en: n + ' mL' }; }
function minu(n){ return { es: n + ' minutos', en: n + ' minutes' }; }
function sobran(n){ return { es: 'Sobran ' + n + ' kcal', en: 'A surplus of ' + n + ' kcal' }; }
function faltan(n){ return { es: 'Faltan ' + n + ' kcal', en: 'A shortfall of ' + n + ' kcal' }; }
function bal(d){ return d >= 0 ? sobran(d) : faltan(-d); }
function pairEs(list){ return list.map(function(x){ return x.es; }); }
function pairEn(list){ return list.map(function(x){ return x.en; }); }

function rcard(name, form, note){

}

function addProblem(rng, v){
  var idx = problems.length;
  var opts = L(v.opts).slice();
  var correctVal = opts[v.ci];
  var sh = shuffle(opts, rng);
  var prob = {
    title: L(v.title),
    questionText: L(v.q),
    fn: '',
    hint: L(v.hint),
    explanation: L(v.exp),
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!v.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: tablero de los micronutrimentos
   El estudiante toca un nutrimento y luego el trabajo que cree que realiza en
   el cuerpo. Si acierta, la pareja queda fija en verde con su fuente de
   alimento; si falla, la retroalimentación apunta hacia dónde pertenece esa
   función. A la tercera falla de un nutrimento se revela su pareja.
   ══════════════════════════════════════════════════════════════════════════ */
function wTablero(rng, host){
  var P = shuffle(MICROS, rng).slice(0, 5);
  var order = shuffle([0, 1, 2, 3, 4], rng);
  var st = { sel:null, fixed:[false, false, false, false, false], tries:[0, 0, 0, 0, 0], done:false };

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Tablero de los micronutrimentos', en:'Micronutrient board' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Toca un nutrimento de la izquierda y luego el trabajo que crees que realiza. Si no coinciden, la pareja se suelta y puedes volver a intentarlo.',
      en:'Tap a nutrient on the left and then the job you think it does. If they do not match, the pair is released and you can try again.'
    }) + '</div>' +
    '<div class="gw-prog" data-r="prog"></div>' +
    '<div class="tb-grid">' +
      '<div class="tb-col"><div class="gw-lbl">' + L({ es:'Nutrimento', en:'Nutrient' }) + '</div><div data-r="left"></div></div>' +
      '<div class="tb-col"><div class="gw-lbl">' + L({ es:'Lo que hace en el cuerpo', en:'What it does in the body' }) + '</div><div data-r="right"></div></div>' +
    '</div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var q = host.querySelector('[data-r="q"]'), prog = host.querySelector('[data-r="prog"]'),
      left = host.querySelector('[data-r="left"]'), right = host.querySelector('[data-r="right"]'),
      fb = host.querySelector('[data-r="fb"]');

  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }
  function nfixed(){ var n = 0; st.fixed.forEach(function(f){ if (f) n++; }); return n; }

  function render(){
    q.textContent = st.done
      ? L({ es:'Tablero completo: cada micronutrimento con su trabajo.', en:'Board complete: each micronutrient with its job.' })
      : L({ es:'Empareja cada micronutrimento con lo que hace dentro del cuerpo.', en:'Match each micronutrient with what it does inside the body.' });
    prog.textContent = nfixed() + ' / 5';
    left.innerHTML = P.map(function(m, i){
      var cls = 'tb-chip nut' + (st.fixed[i] ? ' fix' : (st.sel === i ? ' sel' : ''));
      return '<div class="' + cls + '" data-n="' + i + '">' + L(m.name) + '</div>';
    }).join('');
    right.innerHTML = order.map(function(i){
      var cls = 'tb-chip' + (st.fixed[i] ? ' fix' : '');
      return '<div class="' + cls + '" data-f="' + i + '">' + L(P[i].fn) + '</div>';
    }).join('');
  }

  function fixPair(i){
    st.fixed[i] = true; st.sel = null; render();
    if (nfixed() >= 5){
      st.done = true; render();
      say('good', '&#127881; ' + L({
        es:'Tablero cerrado. Ninguno de estos aporta una sola kcal y aun así, si falta uno, la reacción que sí libera energía se queda a medias.',
        en:'Board closed. Not one of these provides a single kcal and even so, if one is missing, the reaction that does release energy stalls halfway.'
      }));
    }
  }

  host.addEventListener('click', function(ev){
    if (st.done) return;
    var el = ev.target.closest('[data-n],[data-f]');
    if (!el) return;
    if (el.hasAttribute('data-n')){
      var i = parseInt(el.getAttribute('data-n'), 10);
      if (st.fixed[i]) return;
      st.sel = (st.sel === i) ? null : i;
      render();
      if (st.sel !== null) say('', L({ es:'Ahora busca a la derecha el trabajo de ', en:'Now look on the right for the job of ' }) + L(P[i].name) + '.');
      return;
    }
    var j = parseInt(el.getAttribute('data-f'), 10);
    if (st.fixed[j]) return;
    if (st.sel === null){ say('warm', L({ es:'Elige primero un nutrimento de la columna izquierda.', en:'Choose a nutrient from the left column first.' })); return; }
    var s = st.sel;
    if (j === s){
      say('good', '&#10003; ' + L(P[s].name) + L({ es:'. Lo encuentras en ', en:'. You find it in ' }) + L(P[s].food) + '.');
      fixPair(s);
      return;
    }
    st.tries[s]++;
    if (st.tries[s] >= 3){
      say('warm', L({ es:'Esta era la pareja de ', en:'This was the match for ' }) + L(P[s].name) + ': ' + L(P[s].fn) + '. ' +
        L({ es:'Se queda fija para que compares con las demás.', en:'It stays fixed so you can compare it with the rest.' }));
      fixPair(s);
      return;
    }
    st.sel = null; render();
    say('miss', L({ es:'Ese trabajo pertenece a otro nutrimento: ', en:'That job belongs to another nutrient: ' }) + L(P[j].clue) + '. ' +
      L({ es:'Para ', en:'For ' }) + L(P[s].name) + L({ es:', ', en:', ' }) + L(P[s].clue) + '.');
  });

  render();
  say('', L({ es:'Empieza por el que creas más fácil; cada pareja que fijas deja menos opciones para las demás.',
             en:'Start with whichever you find easiest; each pair you fix leaves fewer options for the rest.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: canasta que corrige la falta
   Llega un caso con dos nutrimentos ausentes. El estudiante enciende y apaga
   alimentos y ve en vivo cuáles carencias ya quedaron cubiertas y cuánta
   energía suma la canasta. Tres casos distintos por intento.
   ══════════════════════════════════════════════════════════════════════════ */
function wCanasta(rng, host){
  var TAGN = {
    hierro:{ es:'hierro', en:'iron' }, calcio:{ es:'calcio', en:'calcium' }, yodo:{ es:'yodo', en:'iodine' },
    potasio:{ es:'potasio', en:'potassium' }, vitC:{ es:'vitamina C', en:'vitamin C' },
    vitA:{ es:'vitamina A', en:'vitamin A' }, vitD:{ es:'vitamina D', en:'vitamin D' },
    agua:{ es:'agua simple', en:'plain water' }
  };
  var TIP = {
    hierro:{ es:'busca entre las leguminosas o las hojas verdes oscuras', en:'look among the legumes or the dark green leaves' },
    calcio:{ es:'busca entre los lácteos o la tortilla de nixtamal', en:'look among the dairy or the nixtamal tortilla' },
    yodo:{ es:'busca lo que viene del mar o la sal yodada', en:'look for what comes from the sea or the iodized salt' },
    potasio:{ es:'busca entre las frutas y los tubérculos', en:'look among the fruits and the tubers' },
    vitC:{ es:'busca entre las frutas ácidas', en:'look among the sour fruits' },
    vitA:{ es:'busca entre las verduras de color naranja o verde intenso', en:'look among the orange or deep green vegetables' },
    vitD:{ es:'busca el pescado azul o el huevo', en:'look for the oily fish or the egg' },
    agua:{ es:'no todo se resuelve con alimento sólido', en:'not everything is solved with solid food' }
  };
  var FOODS = [
    { es:'lentejas guisadas', en:'stewed lentils', tags:['hierro'], k:230 },
    { es:'frijoles de la olla', en:'pot beans', tags:['hierro','potasio'], k:180 },
    { es:'espinacas al vapor', en:'steamed spinach', tags:['hierro','vitA'], k:60 },
    { es:'guayabas frescas', en:'fresh guavas', tags:['vitC'], k:70 },
    { es:'jugo de naranja natural', en:'fresh orange juice', tags:['vitC','potasio'], k:110 },
    { es:'leche', en:'milk', tags:['calcio'], k:150 },
    { es:'tortillas de nixtamal', en:'nixtamal tortillas', tags:['calcio'], k:200 },
    { es:'sardina con espina', en:'sardine with bone', tags:['calcio','vitD','yodo'], k:190 },
    { es:'pescado a la plancha', en:'grilled fish', tags:['yodo','vitD'], k:160 },
    { es:'sal yodada en la comida', en:'iodized salt in the meal', tags:['yodo'], k:0 },
    { es:'zanahoria rallada', en:'grated carrot', tags:['vitA'], k:45 },
    { es:'huevo cocido', en:'boiled egg', tags:['vitD'], k:80 },
    { es:'plátano', en:'banana', tags:['potasio'], k:100 },
    { es:'agua simple', en:'plain water', tags:['agua'], k:0 }
  ];
  var CASES = [
    { es:'Mariana se queda sin aire al subir escaleras, se ve pálida y además le sangran las encías al cepillarse.',
      en:'Mariana runs out of breath climbing stairs, looks pale and her gums bleed when she brushes.',
      need:['hierro','vitC'] },
    { es:'En una comunidad de montaña un niño tiene inflamada la glándula del cuello y sus huesos se fracturan con golpes leves.',
      en:'In a mountain community a child has a swollen gland in the neck and bones that fracture with light knocks.',
      need:['yodo','calcio'] },
    { es:'Un adolescente ve muy mal al anochecer y le dan calambres después de cada entrenamiento largo.',
      en:'A teenager sees very poorly at dusk and gets cramps after every long training session.',
      need:['vitA','potasio'] },
    { es:'Una jugadora entrena en pleno calor, termina con la boca seca y la orina oscura, y en su casa casi no se consumen lácteos.',
      en:'A player trains in full heat, ends up with a dry mouth and dark urine, and at home dairy is hardly ever consumed.',
      need:['agua','calcio'] },
    { es:'Alguien pasa el día entero en interiores, casi nunca le da el sol y su médico encuentra huesos blandos.',
      en:'Someone spends the whole day indoors, hardly ever gets any sun and the doctor finds soft bones.',
      need:['vitD','calcio'] }
  ];
  var R = shuffle(CASES, rng).slice(0, 3);
  var st = { r:0, on:[], tries:0, done:false };

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Canasta que corrige la falta', en:'Basket that fixes the gap' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Arma una canasta que cubra lo que a esta persona le está faltando.', en:'Build a basket that covers what this person is missing.' }) + '</div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Enciende y apaga los alimentos que quieras. Las etiquetas de arriba se encienden cuando la canasta ya cubre esa carencia.',
      en:'Switch foods on and off as you like. The tags above light up when the basket already covers that gap.'
    }) + '</div>' +
    '<div class="gw-prog" data-r="prog"></div>' +
    '<div class="cn-case" data-r="case"></div>' +
    '<div class="cn-need" data-r="need"></div>' +
    '<div class="cn-foods" data-r="foods"></div>' +
    '<div class="cn-sum" data-r="sum"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var prog = host.querySelector('[data-r="prog"]'), cas = host.querySelector('[data-r="case"]'),
      need = host.querySelector('[data-r="need"]'), foods = host.querySelector('[data-r="foods"]'),
      sum = host.querySelector('[data-r="sum"]'), go = host.querySelector('[data-r="go"]'),
      fb = host.querySelector('[data-r="fb"]');

  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }
  function covered(tag){ return st.on.some(function(i){ return FOODS[i].tags.indexOf(tag) >= 0; }); }
  function kcal(){ var s = 0; st.on.forEach(function(i){ s += FOODS[i].k; }); return s; }
  function missing(){ return R[st.r].need.filter(function(tg){ return !covered(tg); }); }

  function render(){
    prog.textContent = (st.done ? 3 : st.r + 1) + ' / 3';
    cas.textContent = st.done
      ? L({ es:'Tres canastas armadas. Ninguna de esas carencias se resolvía con más kcal.', en:'Three baskets built. None of those gaps was solved with more kcal.' })
      : L(R[st.r]);
    need.innerHTML = st.done ? '' : R[st.r].need.map(function(tg){
      return '<span class="cn-tag' + (covered(tg) ? ' ok' : '') + '">' + (covered(tg) ? '&#10003; ' : '') + L(TAGN[tg]) + '</span>';
    }).join('');
    foods.innerHTML = st.done ? '' : FOODS.map(function(f, i){
      return '<button class="cn-food' + (st.on.indexOf(i) >= 0 ? ' on' : '') + '" data-f="' + i + '">' + L(f) + '</button>';
    }).join('');
    sum.textContent = st.done ? '' : L({ es:'energía de la canasta: ', en:'energy of the basket: ' }) + kcal() + ' kcal';
    go.textContent = L({ es:'Entregar canasta', en:'Hand in basket' });
    go.disabled = st.done;
    go.style.display = st.done ? 'none' : '';
  }

  function next(){
    st.tries = 0; st.on = []; st.r++;
    if (st.r >= 3){ st.done = true; render(); return; }
    render();
    say('', L({ es:'Caso nuevo en el mostrador.', en:'New case at the counter.' }));
  }

  host.addEventListener('click', function(ev){
    if (st.done) return;
    var el = ev.target.closest('[data-f]');
    if (!el) return;
    var i = parseInt(el.getAttribute('data-f'), 10);
    var at = st.on.indexOf(i);
    if (at >= 0) st.on.splice(at, 1); else st.on.push(i);
    render();
    var falta = missing();
    if (falta.length === 0) say('', L({ es:'La canasta ya cubre las dos carencias. Puedes entregarla.', en:'The basket already covers both gaps. You can hand it in.' }));
    else say('', L({ es:'Todavía falta cubrir: ', en:'Still to cover: ' }) + falta.map(function(tg){ return L(TAGN[tg]); }).join(', ') + '.');
  });

  go.addEventListener('click', function(){
    if (st.done) return;
    var falta = missing();
    if (falta.length === 0){
      say('good', '&#10003; ' + L({ es:'Canasta aceptada: ', en:'Basket accepted: ' }) + kcal() +
        L({ es:' kcal que, además de energía, traen justo lo que hacía falta.', en:' kcal that, besides energy, bring exactly what was missing.' }));
      setTimeout(next, 1800);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var need2 = R[st.r].need;
      st.on = [];
      need2.forEach(function(tg){
        for (var i = 0; i < FOODS.length; i++){
          if (FOODS[i].tags.indexOf(tg) >= 0 && st.on.indexOf(i) < 0){ st.on.push(i); break; }
        }
      });
      render();
      say('warm', L({ es:'Una canasta que sí funciona: ', en:'A basket that does work: ' }) +
        st.on.map(function(i){ return L(FOODS[i]); }).join(', ') + '. ' +
        L({ es:'Fíjate que la energía casi no cambia; lo que cambia es lo que trae dentro.',
            en:'Notice that the energy hardly changes; what changes is what it brings inside.' }));
      setTimeout(next, 3200);
      return;
    }
    say('miss', L({ es:'Aún no: falta ', en:'Not yet: ' }) + falta.map(function(tg){ return L(TAGN[tg]); }).join(L({ es:' y ', en:' and ' })) +
      L({ es:'. Pista: ', en:' is still missing. Hint: ' }) + L(TIP[falta[0]]) + '.');
  });

  render();
  say('', L({ es:'Lee el caso y decide qué le está faltando antes de tocar un alimento.', en:'Read the case and decide what is missing before tapping a food.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: hidrómetro del día
   El estudiante mueve el número de vasos de 250 mL y compara en vivo lo que
   entra contra lo que el cuerpo pierde ese día por sudor, orina, respiración
   y piel. Tres días distintos, con calor y actividad variables.
   ══════════════════════════════════════════════════════════════════════════ */
function wHidro(rng, host){
  var CLIMA = [
    { es:'un día fresco', en:'a cool day', s:8 },
    { es:'un día templado', en:'a mild day', s:12 },
    { es:'un día de mucho calor', en:'a very hot day', s:16 }
  ];
  function mkRound(){
    var c = CLIMA[Math.floor(rng() * CLIMA.length)];
    var min = 30 + 15 * Math.floor(rng() * 5);
    var base = 1500 + 100 * Math.floor(rng() * 6);
    return { c:c, min:min, base:base, out: base + c.s * min };
  }
  var R = [mkRound(), mkRound(), mkRound()];
  var st = { r:0, g:0, tries:0, done:false };

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Hidrómetro del día', en:'Day hydrometer' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Mueve los vasos de 250 mL hasta que lo que entra alcance lo que el cuerpo perdió. Puedes subir y bajar cuantas veces quieras antes de cerrar el día.',
      en:'Move the 250 mL glasses until what comes in reaches what the body lost. You can go up and down as many times as you like before closing the day.'
    }) + '</div>' +
    '<div class="gw-prog" data-r="prog"></div>' +
    '<div class="gw-lbl">' + L({ es:'Lo que sale', en:'What goes out' }) + '</div>' +
    '<div class="hd-track"><div class="hd-fill out" data-r="bout"></div></div>' +
    '<div class="hd-num"><span data-r="lout"></span><span data-r="dout"></span></div>' +
    '<div class="gw-lbl">' + L({ es:'Lo que entra', en:'What comes in' }) + '</div>' +
    '<div class="hd-track"><div class="hd-fill in" data-r="bin"></div></div>' +
    '<div class="hd-num"><span data-r="lin"></span><span data-r="din"></span></div>' +
    '<input class="hd-sl" type="range" min="0" max="16" step="1" value="0" data-r="sl">' +
    '<div class="hd-glass" data-r="glass"></div>' +
    '<div class="hd-delta" data-r="delta"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var q = host.querySelector('[data-r="q"]'), prog = host.querySelector('[data-r="prog"]'),
      bout = host.querySelector('[data-r="bout"]'), bin = host.querySelector('[data-r="bin"]'),
      lout = host.querySelector('[data-r="lout"]'), lin = host.querySelector('[data-r="lin"]'),
      dout = host.querySelector('[data-r="dout"]'), din = host.querySelector('[data-r="din"]'),
      sl = host.querySelector('[data-r="sl"]'), glass = host.querySelector('[data-r="glass"]'),
      delta = host.querySelector('[data-r="delta"]'), go = host.querySelector('[data-r="go"]'),
      fb = host.querySelector('[data-r="fb"]');

  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }
  function inMl(){ return st.g * 250; }

  function render(){
    var d = R[st.r];
    q.textContent = st.done
      ? L({ es:'Tres días cerrados. El agua no aporta energía y aun así se repone todos los días.', en:'Three days closed. Water provides no energy and even so it is replaced every day.' })
      : L({ es:'En ', en:'On ' }) + L(d.c) + L({ es:' esta persona hace ', en:' this person does ' }) + d.min +
        L({ es:' minutos de actividad. Repón lo que perdió.', en:' minutes of activity. Replace what was lost.' });
    prog.textContent = (st.done ? 3 : st.r + 1) + ' / 3';
    var base = Math.max(d.out, inMl(), 1);
    bout.style.width = (d.out / base * 100) + '%';
    bin.style.width = (inMl() / base * 100) + '%';
    lout.textContent = L({ es:'sudor ', en:'sweat ' }) + (d.c.s * d.min) + L({ es:' mL + resto del cuerpo ', en:' mL + rest of the body ' }) + d.base + ' mL';
    dout.textContent = d.out + ' mL';
    lin.textContent = st.g + L({ es:' vasos de 250 mL', en:' glasses of 250 mL' });
    din.textContent = inMl() + ' mL';
    sl.value = st.g; sl.disabled = st.done;
    var gl = ''; for (var i = 0; i < st.g; i++) gl += '▮';
    glass.textContent = gl;
    var df = inMl() - d.out;
    delta.textContent = (df === 0 ? L({ es:'en equilibrio', en:'in balance' })
      : (df > 0 ? '+' : '−') + Math.abs(df) + ' mL');
    go.textContent = L({ es:'Cerrar el día', en:'Close the day' });
    go.disabled = st.done;
    go.style.display = st.done ? 'none' : '';
  }

  sl.addEventListener('input', function(){
    if (st.done) return;
    st.g = parseInt(sl.value, 10);
    render();
    var df = inMl() - R[st.r].out;
    if (Math.abs(df) <= 150) say('', L({ es:'Estás dentro del equilibrio de este día.', en:'You are within the balance of this day.' }));
    else if (df < 0) say('', L({ es:'Te faltan ', en:'You are short by ' }) + (-df) + L({ es:' mL por reponer.', en:' mL still to replace.' }));
    else say('', L({ es:'Vas ', en:'You are ' }) + df + L({ es:' mL por encima de lo perdido.', en:' mL above what was lost.' }));
  });

  function next(){
    st.tries = 0; st.g = 0; st.r++;
    if (st.r >= 3){ st.done = true; render(); return; }
    render();
    say('', L({ es:'Día nuevo, condiciones nuevas.', en:'New day, new conditions.' }));
  }

  go.addEventListener('click', function(){
    if (st.done) return;
    var d = R[st.r], df = inMl() - d.out;
    if (Math.abs(df) <= 150){
      say('good', '&#10003; ' + L({ es:'Día cerrado: ', en:'Day closed: ' }) + st.g +
        L({ es:' vasos son ', en:' glasses are ' }) + inMl() + L({ es:' mL frente a los ', en:' mL against the ' }) + d.out +
        L({ es:' mL que se perdieron.', en:' mL that were lost.' }));
      setTimeout(next, 1800);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.g = Math.round(d.out / 250);
      render();
      say('warm', L({ es:'Con ', en:'With ' }) + st.g + L({ es:' vasos se llega a ', en:' glasses you reach ' }) + inMl() +
        L({ es:' mL, que es lo que pedía este día. Cuando sube el calor y la actividad, sube el sudor y con él lo que hay que reponer.',
            en:' mL, which is what this day asked for. When heat and activity rise, sweat rises and with it what has to be replaced.' }));
      setTimeout(next, 3200);
      return;
    }
    if (df < 0) say('miss', L({ es:'Todavía faltan ', en:'Still short by ' }) + (-df) + L({ es:' mL. Sube los vasos; cada uno suma 250 mL.', en:' mL. Raise the glasses; each one adds 250 mL.' }));
    else say('miss', L({ es:'Te pasaste por ', en:'You went over by ' }) + df + L({ es:' mL. Baja algún vaso.', en:' mL. Lower a glass.' }));
  });

  render();
  say('', L({ es:'Fíjate primero cuánto sudor genera la actividad de este día.', en:'First look at how much sweat this day of activity generates.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: reloj de la actividad
   Aparece un alimento con sus gramos de cada nutrimento. El estudiante elige
   una actividad y desliza los minutos hasta gastar la energía que ese alimento
   aporta. La barra doble compara alimento contra movimiento en tiempo real.
   ══════════════════════════════════════════════════════════════════════════ */
function wMinutos(rng, host){
  var ACTS = [
    { es:'caminata rápida', en:'brisk walk', r:5 },
    { es:'baile', en:'dancing', r:7 },
    { es:'bicicleta', en:'cycling', r:8 },
    { es:'natación', en:'swimming', r:9 },
    { es:'carrera', en:'running', r:10 }
  ];
  var PLATOS = [
    { es:'un tamal de la mañana', en:'a morning tamal', c:38, p:6, l:12 },
    { es:'dos quesadillas de queso', en:'two cheese quesadillas', c:36, p:14, l:15 },
    { es:'una bolsa de papas fritas', en:'a bag of crisps', c:30, p:4, l:18 },
    { es:'un licuado de plátano', en:'a banana shake', c:46, p:9, l:6 },
    { es:'una torta de jamón', en:'a ham sandwich', c:44, p:17, l:11 },
    { es:'un pan dulce', en:'a sweet bread roll', c:50, p:7, l:13 }
  ];
  function mkRound(){
    var f = PLATOS[Math.floor(rng() * PLATOS.length)];
    var E = 4 * f.c + 4 * f.p + 9 * f.l;
    var ok = ACTS.filter(function(a){ return E / a.r <= 115; });
    var a = ok[Math.floor(rng() * ok.length)];
    return { f:f, E:E, a:a };
  }
  var R = [mkRound(), mkRound(), mkRound()];
  var st = { r:0, min:0, act:null, tries:0, done:false };

  host.innerHTML =
    '<div class="gw-h iw-tag">' + L({ es:'Reloj de la actividad', en:'Activity clock' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini iw-sub">' + L({
      es:'Elige una actividad y desliza los minutos hasta que el movimiento alcance la energía del alimento. La barra de arriba es el alimento, la de abajo lo que llevas gastado.',
      en:'Choose an activity and slide the minutes until the movement reaches the energy of the food. The top bar is the food, the bottom one is what you have spent so far.'
    }) + '</div>' +
    '<div class="gw-prog" data-r="prog"></div>' +
    '<div class="ac-food" data-r="food"></div>' +
    '<div class="ac-acts" data-r="acts"></div>' +
    '<div class="ac-gauge"><div class="ac-seg food" data-r="gf"></div></div>' +
    '<div class="ac-gauge"><div class="ac-seg move" data-r="gm"></div></div>' +
    '<div class="hd-num"><span data-r="lmin"></span><span data-r="lsp"></span></div>' +
    '<input class="ac-sl" type="range" min="0" max="120" step="1" value="0" data-r="sl">' +
    '<div class="gw-row"><button class="gw-btn" data-r="go"></button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  var q = host.querySelector('[data-r="q"]'), prog = host.querySelector('[data-r="prog"]'),
      food = host.querySelector('[data-r="food"]'), acts = host.querySelector('[data-r="acts"]'),
      gf = host.querySelector('[data-r="gf"]'), gm = host.querySelector('[data-r="gm"]'),
      lmin = host.querySelector('[data-r="lmin"]'), lsp = host.querySelector('[data-r="lsp"]'),
      sl = host.querySelector('[data-r="sl"]'), go = host.querySelector('[data-r="go"]'),
      fb = host.querySelector('[data-r="fb"]');

  function say(cls, msg){ fb.className = 'gw-fb' + (cls ? ' ' + cls : ''); fb.innerHTML = msg; }
  function rate(){ return st.act === null ? 0 : R[st.r].a2[st.act].r; }
  function spent(){ return rate() * st.min; }

  R.forEach(function(d){
    d.a2 = shuffle(ACTS, rng).slice(0, 3);
    if (d.a2.indexOf(d.a) < 0) d.a2[0] = d.a;
  });

  function render(){
    var d = R[st.r];
    q.textContent = st.done
      ? L({ es:'Tres alimentos convertidos en minutos de movimiento.', en:'Three foods turned into minutes of movement.' })
      : L({ es:'Gasta con actividad la energía que aporta este alimento.', en:'Spend the energy this food provides through activity.' });
    prog.textContent = (st.done ? 3 : st.r + 1) + ' / 3';
    food.innerHTML = st.done ? '' : L(d.f) +
      '<div class="ac-macros">' + d.f.c + L({ es:' g carbohidratos · ', en:' g carbohydrates · ' }) + d.f.p +
      L({ es:' g proteínas · ', en:' g proteins · ' }) + d.f.l + L({ es:' g lípidos', en:' g lipids' }) + '</div>';
    acts.innerHTML = st.done ? '' : d.a2.map(function(a, i){
      return '<button class="ac-act' + (st.act === i ? ' on' : '') + '" data-a="' + i + '">' + L(a) + ' · ' + a.r + L({ es:' kcal/min', en:' kcal/min' }) + '</button>';
    }).join('');
    var base = Math.max(d.E, spent(), 1);
    gf.style.width = (d.E / base * 100) + '%';
    gm.style.width = (spent() / base * 100) + '%';
    lmin.textContent = st.min + L({ es:' min de movimiento', en:' min of movement' });
    lsp.textContent = spent() + L({ es:' kcal gastadas', en:' kcal spent' });
    sl.value = st.min; sl.disabled = st.done;
    go.textContent = L({ es:'Comprobar', en:'Check' });
    go.disabled = st.done;
    go.style.display = st.done ? 'none' : '';
  }

  function live(){
    if (st.act === null){ say('warm', L({ es:'Elige primero una actividad.', en:'Choose an activity first.' })); return; }
    var d = R[st.r], df = spent() - d.E;
    if (Math.abs(df) <= 15) say('', L({ es:'El movimiento ya alcanza la energía del alimento.', en:'The movement already matches the energy of the food.' }));
    else if (df < 0) say('', L({ es:'Faltan ', en:'Short by ' }) + (-df) + L({ es:' kcal por gastar.', en:' kcal still to spend.' }));
    else say('', L({ es:'Ya gastaste ', en:'You have already spent ' }) + df + L({ es:' kcal de más.', en:' kcal too many.' }));
  }

  sl.addEventListener('input', function(){
    if (st.done) return;
    st.min = parseInt(sl.value, 10);
    render(); live();
  });

  host.addEventListener('click', function(ev){
    if (st.done) return;
    var el = ev.target.closest('[data-a]');
    if (!el) return;
    st.act = parseInt(el.getAttribute('data-a'), 10);
    render(); live();
  });

  function next(){
    st.tries = 0; st.min = 0; st.act = null; st.r++;
    if (st.r >= 3){ st.done = true; render(); return; }
    render();
    say('', L({ es:'Otro alimento sobre la mesa.', en:'Another food on the table.' }));
  }

  go.addEventListener('click', function(){
    if (st.done) return;
    if (st.act === null){ say('warm', L({ es:'Elige una actividad antes de comprobar.', en:'Choose an activity before checking.' })); return; }
    var d = R[st.r], df = spent() - d.E;
    if (Math.abs(df) <= 15){
      say('good', '&#10003; ' + st.min + L({ es:' minutos de ', en:' minutes of ' }) + L(d.a2[st.act]) +
        L({ es:' gastan ', en:' spend ' }) + spent() + L({ es:' kcal, la energía de ', en:' kcal, the energy of ' }) + L(d.f) + '.');
      setTimeout(next, 1800);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.min = Math.round(d.E / rate());
      render();
      say('warm', L({ es:'Este alimento aporta ', en:'This food provides ' }) + d.E +
        L({ es:' kcal, así que a ', en:' kcal, so at ' }) + rate() + L({ es:' kcal por minuto hacen falta unos ', en:' kcal per minute it takes about ' }) + st.min +
        L({ es:' minutos. Cambiar de actividad cambia los minutos, no la energía del alimento.',
            en:' minutes. Changing the activity changes the minutes, not the energy of the food.' }));
      setTimeout(next, 3200);
      return;
    }
    if (df < 0) say('miss', L({ es:'Aún faltan ', en:'Still short by ' }) + (-df) + L({ es:' kcal. Sube los minutos o elige una actividad más intensa.', en:' kcal. Raise the minutes or choose a more intense activity.' }));
    else say('miss', L({ es:'Te pasaste por ', en:'You went over by ' }) + df + L({ es:' kcal. Baja los minutos.', en:' kcal. Lower the minutes.' }));
  });

  render();
  say('', L({ es:'Calcula primero cuánta energía trae el alimento y después decide los minutos.', en:'Work out first how much energy the food carries and then decide the minutes.' }));
}

        en:'Sofía ate ' + d1 + ' kcal, ' + d2 + ' kcal and ' + d3 + ' kcal during the day. Her resting expenditure is ' + base + ' kcal and she has already done ' + min + ' minutes of ' + L(a) + ', which spends ' + a.r + ' kcal per minute. How many more minutes of that same activity would she need to leave the balance of the day at zero?' },

function mkP9(rng){
  var s = 30 + 5 * Math.floor(rng() * 9);
  var n = 1 + Math.floor(rng() * 2);
  var dias = 5 + Math.floor(rng() * 3);
  var v = Math.floor(rng() * 2);
  if (v === 0){
    var A = 4 * s * n * dias, B = 4 * s * n, C = 9 * s * n * dias, D = s * n * dias;
    var o1 = [kc(A), kc(B), kc(C), kc(D)];
    return {
      title:{ es:'Cambiar el refresco por agua', en:'Swapping the soft drink for water' },
      q:{ es:'Una persona toma ' + n + ' refresco(s) al día y cada envase contiene ' + s + ' g de azúcar. Decide cambiarlos por agua simple durante ' + dias + ' días. ¿Cuánta energía deja de ingerir en ese periodo?',
          en:'A person drinks ' + n + ' soft drink(s) a day and each container holds ' + s + ' g of sugar. They decide to swap them for plain water for ' + dias + ' days. How much energy do they stop taking in over that period?' },
      opts:{ es:pairEs(o1), en:pairEn(o1) },
      ci:0,
      hint:{ es:'El azúcar es un carbohidrato y cada gramo libera 4 kcal al oxidarse. Calcula la energía de un día y multiplícala por los días; el agua simple aporta cero, así que todo lo que se quita es lo que se ahorra.',
             en:'Sugar is a carbohydrate and each gram releases 4 kcal on being oxidized. Work out the energy of one day and multiply it by the days; plain water provides zero, so everything removed is what is saved.' },
      exp:{ es:'Azúcar al día: ' + s + ' × ' + n + ' = ' + (s * n) + ' g, que son 4 × ' + (s * n) + ' = ' + B + ' kcal. En ' + dias + ' días: ' + B + ' × ' + dias + ' = ' + A + ' kcal. El agua simple aporta 0 kcal y repone el mismo líquido, de modo que el cambio quita energía sin quitar hidratación.',
            en:'Sugar per day: ' + s + ' × ' + n + ' = ' + (s * n) + ' g, which are 4 × ' + (s * n) + ' = ' + B + ' kcal. Over ' + dias + ' days: ' + B + ' × ' + dias + ' = ' + A + ' kcal. Plain water provides 0 kcal and replaces the same fluid, so the swap removes energy without removing hydration.' },
      showWork:true
    };
  }
  var r = (Math.floor(rng() * 2) === 0) ? 5 : 10;
  var otro = (r === 5) ? 10 : 5;
  var Ed = 4 * s * n;
  var M = Ed / r;
  var B2 = Ed / otro, C2 = Math.round(9 * s * n / r), D2 = Math.round(s * n / r);
  var g = 0;
  while (!uniq4([M, B2, C2, D2]) && g < 20){
    s += 5; Ed = 4 * s * n; M = Ed / r; B2 = Ed / otro; C2 = Math.round(9 * s * n / r); D2 = Math.round(s * n / r); g++;
  }
  var nom = (r === 5) ? { es:'caminata rápida', en:'brisk walk' } : { es:'carrera', en:'running' };
  var o2 = [minu(M), minu(B2), minu(C2), minu(D2)];
  return {
    title:{ es:'El azúcar del día en minutos', en:'The sugar of the day in minutes' },
    q:{ es:'Una persona toma ' + n + ' refresco(s) al día y cada envase contiene ' + s + ' g de azúcar. Una ' + L(nom) + ' gasta alrededor de ' + r + ' kcal por minuto. ¿Cuántos minutos de esa actividad hacen falta para gastar la energía del azúcar de un día?',
        en:'A person drinks ' + n + ' soft drink(s) a day and each container holds ' + s + ' g of sugar. A ' + L(nom) + ' spends around ' + r + ' kcal per minute. How many minutes of that activity are needed to spend the energy of one day of sugar?' },
    opts:{ es:pairEs(o2), en:pairEn(o2) },
    ci:0,
    hint:{ es:'Primero convierte los gramos de azúcar del día en energía, recordando cuánto libera cada gramo de carbohidrato. Después reparte esa energía entre lo que gasta un minuto de la actividad.',
           en:'First turn the grams of sugar of the day into energy, recalling how much each gram of carbohydrate releases. Then divide that energy by what one minute of the activity spends.' },
    exp:{ es:'Azúcar del día: ' + s + ' × ' + n + ' = ' + (s * n) + ' g, que dan 4 × ' + (s * n) + ' = ' + Ed + ' kcal. A ' + r + ' kcal por minuto: ' + Ed + ' ÷ ' + r + ' = ' + M + ' minutos. Esa energía entra en unos minutos de bebida y sale en bastantes más de movimiento, y además llega sin vitaminas ni minerales.',
          en:'Sugar of the day: ' + s + ' × ' + n + ' = ' + (s * n) + ' g, which give 4 × ' + (s * n) + ' = ' + Ed + ' kcal. At ' + r + ' kcal per minute: ' + Ed + ' ÷ ' + r + ' = ' + M + ' minutes. That energy comes in over a few minutes of drinking and goes out over a good many more of movement, and it arrives with no vitamins or minerals.' },
    showWork:true
  };
}

      es:'Cuando alguien mira una etiqueta suele buscar un solo número: las kcal. Ese número contesta una pregunta importante, cuánta energía trae el alimento, y deja sin contestar otra igual de importante, qué más trae. Un puño de frituras y un plato de espinacas con limón pueden estar lejísimos en el primer número y todavía más lejos en el segundo. Hay sustancias que el cuerpo necesita en cantidades diminutas, que no se queman como combustible y sin las cuales la energía de los alimentos se queda encerrada en sus enlaces.',
      en:'When someone looks at a label they usually search for a single number: the kcal. That number answers an important question, how much energy the food carries, and leaves another equally important one unanswered, what else it carries. A handful of crisps and a plate of spinach with lime can be miles apart in the first number and further still in the second. There are substances the body needs in tiny amounts, which are not burned as fuel and without which the energy of foods stays locked inside its bonds.'

      es:'Toda la energía que obtiene tu cuerpo sale de oxidar tres tipos de sustancia: los carbohidratos y las proteínas entregan alrededor de 4 kcal por gramo y los lípidos alrededor de 9 kcal por gramo. Esas cadenas de carbono e hidrógeno reaccionan con oxígeno, se convierten en dióxido de carbono y agua, y la diferencia entre los enlaces viejos y los nuevos aparece como energía. Ese es el papel de los macronutrimentos, y ahí termina.',
      en:'All the energy your body obtains comes from oxidizing three kinds of substance: carbohydrates and proteins deliver around 4 kcal per gram and lipids around 9 kcal per gram. Those carbon and hydrogen chains react with oxygen, turn into carbon dioxide and water, and the difference between the old bonds and the new ones shows up as energy. That is the role of the macronutrients, and there it ends.'
    }) + '</p>' +
    '<p>' + L({
      es:'Las vitaminas, los minerales y el agua siguen otra lógica. El cuerpo los necesita en cantidades muy pequeñas y no los usa como leña, sino como piezas de trabajo: por eso aportan 0 kcal. Las vitaminas son moléculas orgánicas que acompañan a las enzimas encargadas de las reacciones de la célula, incluidas las que liberan la energía de los alimentos. Los minerales son elementos inorgánicos que no se pueden oxidar hasta dióxido de carbono: aparecen como iones que cruzan membranas o como parte de estructuras, del hierro dentro de la hemoglobina al calcio dentro del hueso. El agua es el disolvente donde ocurre toda esa química. Por eso una etiqueta que presume vitaminas y minerales añadidos no sube ni una kcal del total: lo que sube es lo que el cuerpo podrá hacer con la energía que ya traía.',
      en:'Vitamins, minerals and water follow another logic. The body needs them in very small amounts and does not use them as firewood, but as working parts: that is why they provide 0 kcal. Vitamins are organic molecules that accompany the enzymes in charge of the reactions of the cell, including those that release the energy of foods. Minerals are inorganic elements that cannot be oxidized down to carbon dioxide: they appear as ions crossing membranes or as part of structures, from the iron inside haemoglobin to the calcium inside bone. Water is the solvent where all that chemistry takes place. That is why a label boasting added vitamins and minerals does not raise the total by a single kcal: what it raises is what the body will be able to do with the energy it already carried.'

    '<div class="rules-grid">' +

    '<p>' + L({
      es:'La mejor prueba de que un micronutrimento hace falta es lo que ocurre cuando falta, y la huella nunca es genérica. Sin hierro suficiente la sangre transporta menos oxígeno y aparecen cansancio, palidez y falta de aire: es la anemia. Sin yodo la glándula del cuello no fabrica bien su hormona, crece de tamaño y el metabolismo se enlentece. Sin vitamina C sangran las encías y las heridas no terminan de cerrar, porque esa vitamina acompaña a las enzimas que fabrican colágeno. Sin calcio y sin vitamina D los huesos se ablandan y se fracturan con golpes leves. Sin vitamina A cuesta ver cuando baja la luz. Cada señal apunta a una función concreta que se quedó sin su pieza.',
      en:'The best proof that a micronutrient is needed is what happens when it is missing, and the mark is never generic. Without enough iron the blood carries less oxygen and tiredness, pallor and shortness of breath appear: that is anaemia. Without iodine the gland in the neck does not make its hormone properly, it grows in size and metabolism slows. Without vitamin C the gums bleed and wounds never quite close, because that vitamin accompanies the enzymes that build collagen. Without calcium and vitamin D the bones soften and fracture with light knocks. Without vitamin A it is hard to see when the light fades. Each sign points to one concrete function left without its piece.'

      es:'Dos ideas cambian la manera de leer un menú. La primera es que estos nutrimentos se acompañan entre sí: la vitamina C mejora la absorción del hierro que viene de las plantas y la vitamina D permite que el calcio pase del intestino al hueso, así que a veces el problema no es cuánto entra sino con qué entra. La segunda es que una dieta puede cubrir de sobra las kcal del día y aun así dejar carencias, porque los alimentos que solo aportan azúcar y grasa no traen consigo estos elementos. De ahí que en muchos lugares se añada yodo a la sal o hierro a las harinas: se corrige una falta a través de un alimento que ya se consume a diario, sin sumar energía.',
      en:'Two ideas change the way a menu is read. The first is that these nutrients accompany one another: vitamin C improves the absorption of the iron that comes from plants and vitamin D lets calcium pass from the intestine into the bone, so sometimes the problem is not how much comes in but what it comes in with. The second is that a diet can more than cover the kcal of the day and still leave gaps, because foods that only provide sugar and fat do not bring these elements along. Hence that in many places iodine is added to salt or iron to flours: a gap is fixed through a food already eaten daily, without adding energy.'

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
