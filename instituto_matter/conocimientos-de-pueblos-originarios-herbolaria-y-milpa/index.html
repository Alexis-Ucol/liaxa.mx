<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conocimientos de Pueblos Originarios: Herbolaria y Milpa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Conocimientos de Pueblos Originarios: Herbolaria y Milpa</div>
    <div class="wcourse" id="wcourse-el">Biología · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Conocimientos de Pueblos Originarios: Herbolaria y Milpa</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c3c84', primaryDark:'#05224e', primaryBg:'#e5edf7',
  accent:'#fc0c0c', accentBg:'#ffdbdb',
  darkPrimary:'#3575d4', darkPrimaryDark:'#679ff3', darkPrimaryBg:'#061d3f',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'bio1_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

   Herbolaria, milpa, manejo del bosque, pesca y pastoreo sustentables.

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }

function mcSpec(v){
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:v.ci, hint:L(v.hint), exp:L(v.exp), showWork:false };
}

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

    '.pond{display:flex;align-items:flex-end;gap:4px;height:104px;border-bottom:2px solid var(--border);margin:.5rem 0 .2rem;}',
    '.pond-y{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;}',
    '.pond-b{width:100%;background:var(--green);border-radius:3px 3px 0 0;transition:height .3s;}',
    '.pond-b.low{background:var(--bad);}',
    '.pond-l{font-size:.62rem;color:var(--text3);margin-top:.15rem;}',
    '.mcopt.pending{background:var(--gold-bg);}',
    '@media (max-width:600px){.gw{padding:.8rem;}.gw-grid{grid-template-columns:1fr;}.plot{grid-template-columns:repeat(4,1fr);}.forest{height:92px;}}'
  ].join('');
  document.head.appendChild(s);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un invento que sigue dando de comer', en:'An invention that still feeds people' }),
    '<p>' + L({
      es:'Hace miles de años, en los valles de este territorio, alguien se dio cuenta de que el maíz crecía mejor si al lado había frijol, y de que la calabaza tendida en el suelo mantenía la tierra fresca. Nadie tenía microscopio ni laboratorio. Tenían algo distinto: la costumbre de mirar la misma parcela un año tras otro y contarle a la siguiente generación lo que habían visto.',
      en:'Thousands of years ago, in the valleys of this territory, someone noticed that maize grew better when beans were beside it, and that squash lying on the ground kept the soil cool. Nobody had a microscope or a laboratory. They had something different: the habit of watching the same plot year after year and telling the next generation what they had seen.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'los conocimientos de los pueblos originarios sobre los seres vivos no son adornos del pasado. Son sistemas de observación puestos a prueba durante generaciones en un lugar concreto, y de ellos siguen saliendo alimento, medicina y formas de aprovechar un ecosistema sin agotarlo. En esta guía vas a operar esos sistemas por dentro.',
      en:'The knowledge that indigenous peoples hold about living things is not an ornament from the past. It is a system of observation tested over generations in one specific place, and food, medicine and ways of using an ecosystem without exhausting it still come out of it. In this guide you are going to operate those systems from the inside.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: cómo se construye ese saber ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Un conocimiento construido mirando', en:'Knowledge built by watching' }),
    '<p>' + L({
      es:'Un pueblo que vive del mismo territorio durante siglos acumula una enorme cantidad de datos sobre los seres vivos que lo rodean: qué planta brota primero, qué animal avisa la lluvia, en qué luna conviene cortar la madera para que no se apolille. Ese conocimiento se construye igual que cualquier conocimiento sobre la naturaleza: observar, probar, comparar el resultado y quedarse con lo que funciona. La diferencia es que la prueba dura generaciones y el registro no se guarda en un cuaderno, sino en la lengua, en los relatos, en las fiestas y en el trabajo compartido.',
      en:'A people that lives off the same territory for centuries builds up an enormous amount of data about the living things around them: which plant sprouts first, which animal announces the rain, in which moon it is best to cut timber so that it is not eaten by insects. That knowledge is built like any knowledge about nature: observe, try, compare the result and keep what works. The difference is that the test lasts generations and the record is not kept in a notebook, but in the language, in the stories, in the festivals and in shared work.'
    }) + '</p>' +
    '<p>' + L({
      es:'Una parte importante de ese sistema son los bioindicadores: seres vivos cuyo comportamiento anuncia un cambio en el ambiente. Las plantas florecen y los animales migran respondiendo a la temperatura, a la humedad y a las horas de luz, es decir, a las mismas señales que marcan la temporada de siembra. Por eso una comunidad puede leer el calendario agrícola en los seres vivos que tiene enfrente.',
      en:'An important part of that system are bioindicators: living things whose behaviour announces a change in the environment. Plants flower and animals migrate in response to temperature, humidity and hours of daylight, that is, to the same signals that mark the planting season. That is why a community can read the farming calendar in the living things right in front of them.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Observación larga', en:'Long observation' }), L({ es:'muchas generaciones', en:'many generations' }), L({ es:'el mismo lugar, revisado una y otra vez', en:'the same place, checked again and again' })) +
      rcard(L({ es:'Transmisión', en:'Transmission' }), L({ es:'lengua y práctica', en:'language and practice' }), L({ es:'se aprende haciendo junto a quien ya sabe', en:'learned by doing beside someone who knows' })) +
      rcard(L({ es:'Bioindicadores', en:'Bioindicators' }), L({ es:'seres vivos que avisan', en:'living things that warn' }), L({ es:'floración, canto, migración', en:'flowering, calls, migration' })) +
      rcard(L({ es:'Ajuste local', en:'Local fit' }), L({ es:'clima y suelo propios', en:'its own climate and soil' }), L({ es:'sirve para ese ecosistema en particular', en:'it works for that particular ecosystem' })) +
    '</div>'
  );
  w1(rng, widgetHost(s1, 'w_senales'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 :: la milpa ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'La milpa: tres plantas que se sostienen', en:'The milpa: three plants that hold each other up' }),
    '<p>' + L({
      es:'La milpa no es un campo de maíz. Es un sistema en el que varias especies crecen juntas en la misma parcela y cada una cumple una función. El maíz levanta una caña alta y firme. El frijol trepa por esa caña y, en sus raíces, aloja bacterias que toman el nitrógeno del aire y lo dejan en el suelo en una forma que las plantas sí pueden aprovechar. La calabaza se extiende a ras del suelo con hojas anchas que dan sombra, conservan la humedad y estorban el crecimiento de las hierbas que competirían con el cultivo.',
      en:'The milpa is not a maize field. It is a system in which several species grow together in the same plot and each one has a job. Maize raises a tall, firm stalk. Beans climb up that stalk and, in their roots, host bacteria that take nitrogen from the air and leave it in the soil in a form plants can actually use. Squash spreads at ground level with broad leaves that give shade, keep the moisture in and get in the way of the weeds that would compete with the crop.'
    }) + '</p>' +
    '<p>' + L({
      es:'A esas tres se suman muchas más según la región: chile, tomate de cáscara, chayote, amaranto y los quelites, que brotan solos entre los surcos y se recolectan tiernos. En la milpa también entran insectos, aves y hongos comestibles. Es un cultivo y a la vez un pequeño ecosistema manejado por la gente.',
      en:'Many more join those three depending on the region: chilli, husk tomato, chayote, amaranth and the quelites, wild greens that come up on their own between the rows and are gathered while tender. Insects, birds and edible fungi also belong to the milpa. It is a crop and at the same time a small ecosystem managed by people.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Quitar una de las tres no deja el sistema igual con una planta menos: deja una función sin cubrir. Sin maíz el frijol no tiene por dónde trepar; sin frijol el suelo pierde su fuente de nitrógeno; sin calabaza la tierra queda descubierta al sol.',
      en:'Removing one of the three does not leave the system the same minus one plant: it leaves a job undone. Without maize the beans have nothing to climb; without beans the soil loses its source of nitrogen; without squash the ground is left bare under the sun.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_milpa'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 :: por qué funciona ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Por qué funciona: relaciones entre seres vivos', en:'Why it works: relationships between living things' }),
    '<p>' + L({
      es:'Detrás de cada práctica de la milpa hay una cadena de causas que se puede seguir paso a paso. El frijol no fertiliza el suelo por magia: hospeda bacterias en unos abultamientos de sus raíces llamados nódulos, esas bacterias convierten el nitrógeno del aire en compuestos que las raíces absorben, y al terminar el ciclo los restos de la planta dejan ese nitrógeno en la tierra. Lo mismo pasa con las plagas: en una parcela con muchas especies conviven arañas, avispas y aves que se alimentan de los insectos que dañan al maíz, así que la plaga encuentra enemigos naturales y comida más dispersa.',
      en:'Behind every milpa practice there is a chain of causes that can be followed step by step. Beans do not fertilise the soil by magic: they host bacteria in swellings on their roots called nodules, those bacteria turn nitrogen from the air into compounds the roots absorb, and when the cycle ends the remains of the plant leave that nitrogen in the ground. The same happens with pests: in a plot with many species there are spiders, wasps and birds that feed on the insects damaging the maize, so the pest meets natural enemies and finds its food more spread out.'
    }) + '</p>' +
    '<p>' + L({
      es:'Comparar la milpa con un monocultivo hace visible la diferencia. En una parcela sembrada solo de maíz, una plaga que ataca al maíz puede llevarse la cosecha completa y la familia se queda sin nada que comer de ahí. En una milpa, esa misma plaga daña una parte y quedan el frijol, la calabaza y los quelites. La diversidad funciona como un seguro.',
      en:'Comparing the milpa with a monoculture makes the difference visible. In a plot sown only with maize, a pest that attacks maize can take the whole harvest and the family is left with nothing to eat from it. In a milpa, that same pest damages one part and the beans, the squash and the quelites remain. Diversity works like an insurance policy.'
    }) + '</p>'
  );
  w3(rng, widgetHost(s3, 'w_cadena'));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 :: herbolaria ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'La herbolaria: un catálogo vivo de plantas', en:'Herbal medicine: a living catalogue of plants' }),
    '<p>' + L({
      es:'La herbolaria es el conjunto de conocimientos sobre plantas que alivian malestares. No consiste en saber que una hierba sirve, sino en algo mucho más preciso: reconocer la especie exacta, saber qué parte se usa, en qué cantidad y de qué forma se prepara. En México se han documentado miles de especies con uso medicinal, y ese catálogo se construyó comparando resultados durante siglos, primero en las comunidades y después también en herbolarios y mercados.',
      en:'Herbal medicine is the body of knowledge about plants that relieve ailments. It is not about knowing that some herb helps, but about something far more precise: recognising the exact species, knowing which part is used, in what amount and in what way it is prepared. In Mexico thousands of species with medicinal use have been documented, and that catalogue was built by comparing results over centuries, first in the communities and later also in herb shops and markets.'
    }) + '</p>' +
    '<p>' + L({
      es:'Ese saber ha aportado directamente a la ciencia. Muchos medicamentos actuales partieron de plantas que los pueblos ya usaban: el conocimiento tradicional señaló qué especies valía la pena estudiar y los laboratorios después aislaron y midieron sus compuestos. Un caso conocido en México es el barbasco, una planta trepadora de los bosques del sureste que fue clave para producir ciertos medicamentos.',
      en:'That knowledge has contributed directly to science. Many present day medicines started from plants that peoples were already using: traditional knowledge pointed out which species were worth studying and laboratories later isolated and measured their compounds. A well known case in Mexico is barbasco, a climbing plant from the forests of the southeast that was key to producing certain medicines.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Con cuidado: ', en:'With care: ' }) + '</strong>' + L({
      es:'que una planta sea natural no significa que sea inofensiva. Una especie mal identificada, una dosis equivocada o una mezcla con un medicamento pueden hacer daño. Por eso el uso responsable pasa siempre por identificar bien la planta y consultar a personas con formación, sean médicas o conocedoras reconocidas de la comunidad.',
      en:'A plant being natural does not mean it is harmless. A wrongly identified species, a mistaken dose or a mix with a medicine can cause harm. That is why responsible use always goes through identifying the plant properly and consulting people with training, whether medical staff or recognised knowledge holders in the community.'
    }) + '</p></div>'
  );
  w4(rng, widgetHost(s4, 'w_herbario'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 :: bosque y descanso de la tierra ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Aprovechar sin acabar: bosques y tierra en descanso', en:'Using without using up: forests and resting land' }),
    '<p>' + L({
      es:'Muchas comunidades de Oaxaca, Michoacán, Durango y Chihuahua manejan su bosque en común desde hace generaciones. La regla que sostiene ese manejo es sencilla de enunciar y difícil de cumplir: no se puede sacar cada año más de lo que el bosque logra reponer. Si se corta menos o igual que lo que crece, el bosque se mantiene y sigue dando madera, resina, hongos y agua limpia. Si se corta de más, el bosque se adelgaza año con año hasta que ya no hay de dónde sacar.',
      en:'Many communities in Oaxaca, Michoacan, Durango and Chihuahua have managed their forest in common for generations. The rule that holds that management together is easy to state and hard to follow: you cannot take out each year more than the forest manages to replace. If as much as or less than the growth is cut, the forest holds and keeps giving timber, resin, mushrooms and clean water. If too much is cut, the forest thins out year after year until there is nothing left to take.'
    }) + '</p>' +
    '<p>' + L({
      es:'La misma idea aparece en la parcela. En el sistema de roza y descanso, un terreno se cultiva unos años y luego se deja descansar mientras la vegetación regresa y el suelo recupera nutrientes; entre tanto se trabaja otro terreno. En los metepantles del centro del país se siembra entre hileras de magueyes y árboles que frenan el agua en la ladera y evitan que el suelo se lave. En las chinampas de Xochimilco el lodo del canal se devuelve a la tierra cada temporada. Todas son formas de dejar que el ecosistema se reponga al ritmo que puede.',
      en:'The same idea appears in the plot. In the slash and rest system, a piece of land is cultivated for a few years and then left to rest while the vegetation returns and the soil recovers nutrients; meanwhile another piece is worked. In the metepantles of central Mexico, crops are sown between rows of agaves and trees that slow the water on the slope and stop the soil from washing away. In the chinampas of Xochimilco the mud of the canal is returned to the land every season. All of them are ways of letting the ecosystem recover at the pace it can.'
    }) + '</p>'
  );
  w5(rng, widgetHost(s5, 'w_bosque'));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 6 :: pesca, pastoreo y reconocimiento ══ */
  var s6 = sec(
    L({ es:'Concepto 6', en:'Concept 6' }),
    L({ es:'Pesca, pastoreo y el derecho de quien sabe', en:'Fishing, herding and the rights of those who know' }),
    '<p>' + L({
      es:'La misma lógica del bosque rige el mar y el pastizal. Los pueblos pesqueros conocen las épocas en que cada especie se reproduce y suspenden la captura durante esos meses, una medida que hoy se llama veda. Usan redes de malla amplia para que los peces jóvenes escapen y lleguen a reproducirse, y reconocen sitios de crianza, como manglares y arrecifes, donde no se pesca. En el pastoreo, mover el rebaño de un potrero a otro y regresar solo cuando el pasto se ha recuperado permite que la hierba vuelva a crecer desde la raíz en lugar de quedar arrasada.',
      en:'The same logic as the forest governs the sea and the pasture. Fishing peoples know the seasons when each species reproduces and stop fishing during those months, a measure known today as a closed season. They use wide mesh nets so that young fish escape and get to reproduce, and they recognise nursery sites, such as mangroves and reefs, where nobody fishes. In herding, moving the flock from one paddock to another and coming back only when the grass has recovered lets the grass grow again from the root instead of being stripped bare.'
    }) + '</p>' +
    '<p>' + L({
      es:'Estos saberes están vivos, pero también en riesgo. Se pierden cuando desaparece la lengua en que se nombran las especies, cuando la gente joven deja la comunidad o cuando alguien de fuera usa el conocimiento sin reconocer a quien lo construyó. Por eso hoy se habla de proteger los saberes tradicionales igual que se protege una especie: registrando con las comunidades, respetando su decisión sobre cómo se usa lo que saben y garantizando que reciban el reconocimiento y el beneficio de su aporte.',
      en:'This knowledge is alive, but it is also at risk. It is lost when the language in which the species are named disappears, when young people leave the community or when someone from outside uses the knowledge without acknowledging those who built it. That is why people now speak of protecting traditional knowledge just as a species is protected: recording it together with the communities, respecting their decision about how what they know is used and making sure they receive recognition and benefit for their contribution.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Un saber tradicional y una investigación científica no compiten. Se necesitan: la comunidad aporta siglos de observación en un lugar concreto y la investigación aporta instrumentos para medir y explicar lo que ahí ocurre.',
      en:'Traditional knowledge and scientific research are not in competition. They need each other: the community brings centuries of observation in one specific place and research brings instruments to measure and explain what happens there.'
    }) + '</p></div>'
  );
  w6(rng, widgetHost(s6, 'w_pesca'));
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: Lee las señales de los seres vivos
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var LB = [
    { es:'Anuncia las lluvias', en:'Announces the rains' },
    { es:'Anuncia la temporada fría', en:'Announces the cold season' },
    { es:'Anuncia que hay algo que recolectar', en:'Announces there is something to gather' }
  ];
  var LLUVIA = [
    { n:{ es:'Las hormigas con alas salen en enjambre', en:'Winged ants swarm out' }, v:0,
      why:{ es:'los enjambres salen cuando la humedad del aire sube, poco antes del temporal', en:'the swarms come out when air humidity rises, shortly before the rainy season' } },
    { n:{ es:'Los sapos cantan al anochecer', en:'Toads call at dusk' }, v:0,
      why:{ es:'los sapos cantan y se reproducen cuando llegan las primeras lluvias', en:'toads call and breed when the first rains arrive' } },
    { n:{ es:'Florece el árbol de primavera en la ladera', en:'The primavera tree blooms on the hillside' }, v:0,
      why:{ es:'florece al final de la seca, justo antes de que empiecen las lluvias', en:'it blooms at the end of the dry season, just before the rains start' } },
    { n:{ es:'Las golondrinas vuelan bajo sobre la milpa', en:'Swallows fly low over the milpa' }, v:0,
      why:{ es:'vuelan bajo persiguiendo insectos que la humedad mantiene cerca del suelo', en:'they fly low chasing insects that the humidity keeps close to the ground' } }
  ];
  var FRIO = [
    { n:{ es:'Llegan las mariposas monarca a los oyameles', en:'Monarch butterflies reach the fir forests' }, v:1,
      why:{ es:'llegan cada otoño escapando del frío del norte del continente', en:'they arrive every autumn escaping the cold of the north of the continent' } },
    { n:{ es:'Los patos migratorios bajan a la laguna', en:'Migratory ducks land on the lagoon' }, v:1,
      why:{ es:'las aves migratorias bajan al inicio de la temporada fría', en:'migratory birds come down at the start of the cold season' } },
    { n:{ es:'Los fresnos empiezan a tirar la hoja', en:'The ash trees start dropping their leaves' }, v:1,
      why:{ es:'pierden la hoja cuando bajan la temperatura y las horas de luz', en:'they drop their leaves when temperature and daylight hours go down' } },
    { n:{ es:'El ganado busca el abrigo del monte al atardecer', en:'The cattle look for shelter in the scrub at dusk' }, v:1,
      why:{ es:'buscan resguardo cuando las noches comienzan a enfriar', en:'they look for shelter when the nights begin to get cold' } }
  ];
  var COSECHA = [
    { n:{ es:'La caña del maíz se dobla y la hoja se seca', en:'The maize stalk bends and the leaf dries out' }, v:2,
      why:{ es:'la planta ya terminó de llenar el grano y la mazorca está lista', en:'the plant has finished filling the grain and the cob is ready' } },
    { n:{ es:'Los hongos brotan bajo los pinos', en:'Mushrooms come up under the pines' }, v:2,
      why:{ es:'brotan con el suelo húmedo y tibio, que es cuando se recolectan', en:'they come up when the soil is damp and warm, which is when they are gathered' } },
    { n:{ es:'Los quelites tiernos llenan los surcos', en:'Tender quelites fill the furrows' }, v:2,
      why:{ es:'se recogen jóvenes, antes de que endurezcan sus tallos', en:'they are picked young, before their stems turn tough' } },
    { n:{ es:'Las mazorcas endurecen su grano', en:'The cobs harden their grain' }, v:2,
      why:{ es:'el grano duro avisa que la mazorca ya se puede almacenar', en:'hard grain shows the cob can now be stored' } }
  ];
  var A = shuffle(LLUVIA, rng), B = shuffle(FRIO, rng), C = shuffle(COSECHA, rng);
  var EX = shuffle([A[3], B[3], C[3]], rng);
  var R = [];
  for (var r = 0; r < 3; r++) R.push(shuffle([A[r], B[r], C[r], EX[r]], rng));
  var rd = 0, tries = 0, locked = false, done = false, cur = [];

  function seed(){
    cur = [];
    for (var i = 0; i < R[rd].length; i++) cur.push((R[rd][i].v + 1 + ri(rng, 0, 1)) % 3);
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Lee las señales de los seres vivos', en:'Read the signals of living things' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'¿Qué está anunciando cada señal?', en:'What is each signal announcing?' }) + '</div>' +
    '<div class="gw-mini">' + L({ es:'Toca una señal para cambiar lo que anuncia. Cuando las cuatro te convenzan, comprueba.', en:'Tap a signal to change what it announces. When all four convince you, check.' }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="tiles"]'),
      elK = host.querySelector('[data-r="chk"]');

  function draw(){
    elT.innerHTML = R[rd].map(function(it, i){
      var cls = ['vA', 'vB', 'vC'][cur[i]];
      return '<button class="gw-tile ' + cls + '" data-k="' + i + '"' + (locked || done ? ' disabled' : '') +
             '><span class="gw-key">' + L(it.n) + '</span><span class="gw-sub">' + L(LB[cur[i]]) + '</span></button>';
    }).join('');
  }
  function firstWrong(){
    for (var i = 0; i < R[rd].length; i++) if (cur[i] !== R[rd][i].v) return i;
    return -1;
  }
  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Doce señales leídas. Ninguna es adivinanza: las plantas y los animales responden a la humedad, a la temperatura y a las horas de luz, las mismas señales que marcan el calendario de la milpa.',
        en:'Twelve signals read. None of them is guesswork: plants and animals respond to humidity, temperature and daylight hours, the same signals that set the calendar of the milpa.'
      }));
      return;
    }
    locked = false; tries = 0; seed();
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Otras cuatro señales. Vuelve a leerlas.', en:'Four more signals. Read them again.' }));
    draw();
  }
  function close(cls, msg){
    locked = true;
    elK.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguientes señales', en:'Next signals' });
    elK.className = 'gw-btn solved';
    draw();
    say(host, cls, msg);
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (firstWrong() === -1){
      close('good', L({

}
