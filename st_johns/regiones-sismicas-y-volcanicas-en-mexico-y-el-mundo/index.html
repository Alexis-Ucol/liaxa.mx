    r:{ tag:{ es:'Rojo', en:'Red' }, li:{
        es:['Evacuación de las comunidades del radio de riesgo', 'Refugios temporales abiertos y atención médica lista', 'Tránsito restringido en los caminos de la zona'],
        en:['Evacuation of the communities inside the risk radius', 'Temporary shelters open and medical care ready', 'Restricted traffic on the roads of the area'] } }
  };
  var SC = [
    { k:'v', s:{ es:'Solo se observan fumarolas de vapor leves y no se registran sismos volcánicos desde hace meses.', en:'Only faint steam plumes are seen and no volcanic earthquakes have been recorded for months.' },
      why:{ es:'Sin señales de ascenso de magma, corresponde la vigilancia normal: instrumentos encendidos y comunidades informadas, sin restricciones.',
            en:'With no signs of magma rising, normal monitoring applies: instruments on and communities informed, with no restrictions.' } },
    { k:'a', s:{ es:'Aumentan los sismos volcánicos y hay pequeñas explosiones con ceniza que cae dentro del cráter.', en:'Volcanic earthquakes increase and there are small explosions with ash falling inside the crater.' },
      why:{ es:'Hay cambios claros pero el material no sale del cráter: toca reforzar la vigilancia, marcar el radio de seguridad y preparar a la gente.',
            en:'There are clear changes but the material does not leave the crater: it is time to reinforce monitoring, mark the safety radius and prepare people.' } },
    { k:'a', s:{ es:'Cae ceniza fina sobre los poblados cercanos y se forman columnas de vapor y gas de varios kilómetros.', en:'Fine ash falls on nearby towns and steam and gas columns several kilometres high form.' },
      why:{ es:'La ceniza ya afecta a la población, pero no hay material caliente bajando por las laderas: alerta intermedia, con avisos, radio de seguridad y preparativos.',
            en:'Ash already affects the population, but there is no hot material coming down the slopes: intermediate alert, with notices, a safety radius and preparations.' } },
    { k:'r', s:{ es:'Se registran explosiones grandes y material caliente desciende por las laderas hacia los poblados.', en:'Large explosions are recorded and hot material comes down the slopes towards the towns.' },
      why:{ es:'El peligro alcanza directamente a las comunidades: corresponde la evacuación ordenada y la apertura de refugios.',
            en:'The danger reaches the communities directly: orderly evacuation and the opening of shelters are called for.' } },
    { k:'v', s:{ es:'Después de una temporada intensa, hace semanas que no hay ceniza ni sismos y la montaña vuelve a la calma.', en:'After an intense period, there has been no ash and no earthquakes for weeks and the mountain is calm again.' },
      why:{ es:'Cuando los registros vuelven a la normalidad, la alerta baja y la comunidad recupera su vida cotidiana sin dejar de vigilar.',
            en:'When the records return to normal, the alert goes down and the community recovers its daily life without stopping the monitoring.' } }
  ];
  var rounds = shuffle(SC, rng).slice(0, 3);
  var ri = 0, tries = 0, done = false, chosen = null;

  shell(host,
    L({ es:'Semáforo de alerta volcánica', en:'Volcanic alert light' }),
    L({ es:'Eres parte del comité que traduce lo que miden los instrumentos en acciones para la comunidad.', en:'You are part of the committee that turns what the instruments measure into actions for the community.' }),
    L({ es:'Toca un color y el panel de acciones cambia al instante. Cuando estés convencido, confirma.', en:'Tap a colour and the actions panel changes instantly. When you are convinced, confirm.' }),
    '<div class="gw-num" id="' + host.id + '_r"></div>' +
    '<div class="gw-clue"><b>!</b><span id="' + host.id + '_s"></span></div>' +
    '<div class="sem">' +
      '<div class="sem-box">' +
        '<div class="sem-l r" data-c="r"></div>' +
        '<div class="sem-l a" data-c="a"></div>' +
        '<div class="sem-l v" data-c="v"></div>' +
      '</div>' +
      '<div class="sem-p" id="' + host.id + '_p"></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-act="ok">' + L({ es:'Confirmar el nivel', en:'Confirm the level' }) + '</button></div>'
  );

  function panel(c){
    var e = document.getElementById(host.id + '_p');
    if (!c) {
      e.innerHTML = '<i>' + L({ es:'Elige un color para ver qué haría la comunidad con ese nivel.', en:'Choose a colour to see what the community would do at that level.' }) + '</i>';
      return;
    }
    e.innerHTML = '<span class="sem-tag ' + c + '">' + L(ACT[c].tag) + '</span><ul>' +
      L(ACT[c].li).map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>';
  }
  function render(){
    chosen = null; tries = 0;
    document.getElementById(host.id + '_r').textContent = L({ es:'Situación ' + (ri + 1) + ' de 3', en:'Situation ' + (ri + 1) + ' of 3' });
    document.getElementById(host.id + '_s').innerHTML = L(rounds[ri].s);
    host.querySelectorAll('.sem-l').forEach(function(l){ l.classList.remove('on'); });

  }
  function advance(){
    ri++;
    if (ri >= rounds.length) {

      var bt = host.querySelector('[data-act="ok"]'); bt.disabled = true; bt.classList.add('solved');
      say(host, 'good', L({
        es:'Tres situaciones resueltas. El semáforo no mide el miedo, mide el alcance del peligro: verde cuando el volcán se comporta como siempre, amarillo cuando algo cambia y hay que prepararse, rojo cuando el material puede alcanzar a la gente.',

    }
    setTimeout(render, 950);
  }
  host.querySelectorAll('.sem-l').forEach(function(l){
    l.addEventListener('click', function(){
      if (done) return;
      chosen = l.dataset.c;
      host.querySelectorAll('.sem-l').forEach(function(x){ x.classList.remove('on'); });
      l.classList.add('on');
      panel(chosen);
      say(host, '', L({ es:'Así se vería la comunidad con ese nivel. Puedes cambiarlo las veces que quieras antes de confirmar.', en:'This is how the community would look at that level. You can change it as many times as you like before confirming.' }));
    });
  });
  host.querySelector('[data-act="ok"]').addEventListener('click', function(){
    if (done) return;
    var cs = rounds[ri];
    if (!chosen) { say(host, 'warm', L({ es:'Primero enciende un color del semáforo.', en:'First switch on a colour of the alert light.' })); return; }
    if (chosen === cs.k) { say(host, 'good', L(cs.why)); advance(); return; }
    tries++;
    if (tries >= 3) {
      host.querySelectorAll('.sem-l').forEach(function(x){ x.classList.toggle('on', x.dataset.c === cs.k); });
      panel(cs.k);
      say(host, 'warm', L(cs.why));
      advance();
      return;
    }
    var rank = { v:0, a:1, r:2 };
    var msg = rank[chosen] > rank[cs.k]
      ? L({ es:'Subiste demasiado el nivel. Con esta situación nadie está en peligro inmediato, y evacuar sin necesidad desgasta la confianza de la gente para cuando de verdad haga falta.',
            en:'You raised the level too far. In this situation nobody is in immediate danger, and evacuating without need wears down the trust people will need when it really matters.' })
      : L({ es:'Te quedaste corto. Vuelve a leer la situación: fíjate si el material solo se queda en el cráter o si ya llega a donde vive la gente.',
            en:'You fell short. Read the situation again: notice whether the material stays in the crater or already reaches where people live.' });
    say(host, 'miss', msg);
  });
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: Mesa de prevención (antes / durante / después)
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var BN = {
    ant:{ es:'Antes', en:'Before' }, dur:{ es:'Durante', en:'During' }, des:{ es:'Después', en:'After' }
  };
  var A = [
    { b:'ant', t:{ es:'Identificar las zonas más seguras de la casa y de la escuela', en:'Identify the safest zones at home and at school' },
      w:{ es:'Esto se decide con calma, cuando nada se está moviendo.', en:'This is decided calmly, when nothing is moving.' } },

      w:{ es:'La revisión ocurre al final, antes de recuperar el espacio.', en:'The check happens at the end, before taking the space back.' } }
  ];
  function three(b){ return shuffle(A.filter(function(x){ return x.b === b; }), rng).slice(0, 3); }
  var items = shuffle(three('ant').concat(three('dur')).concat(three('des')), rng);
  items.forEach(function(x, i){ x.id = 'i' + i; });

  var pool = items.map(function(x){
    return '<button class="pv-i" data-id="' + x.id + '">' + L(x.t) + '</button>';
  }).join('');

  shell(host,
    L({ es:'Mesa de prevención', en:'Prevention table' }),

    L({ es:'Toca una acción para tomarla y luego toca una columna para dejarla ahí. Si tocas una acción ya colocada, regresa a la lista.', en:'Tap an action to pick it up and then tap a column to drop it there. If you tap an action already placed, it returns to the list.' }),
    '<div class="pv">' +
      '<div class="pv-b" data-b="ant"><div class="pv-t">' + L(BN.ant) + ' <span data-role="n">0</span></div><div data-role="in"></div></div>' +
      '<div class="pv-b" data-b="dur"><div class="pv-t">' + L(BN.dur) + ' <span data-role="n">0</span></div><div data-role="in"></div></div>' +
      '<div class="pv-b" data-b="des"><div class="pv-t">' + L(BN.des) + ' <span data-role="n">0</span></div><div data-role="in"></div></div>' +
    '</div>' +
    '<div class="gw-lbl">' + L({ es:'Acciones por colocar', en:'Actions to place' }) + '</div>' +
    '<div class="pv-pool" id="' + host.id + '_pool">' + pool + '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-act="chk">' + L({ es:'Revisar la mesa', en:'Review the table' }) + '</button></div>'
  );
  say(host, '', L({ es:'Una pregunta ayuda con casi todas: esta acción, se puede hacer mientras el suelo se mueve.', en:'One question helps with almost all of them: can this action be done while the ground is moving.' }));

  function counts(){
    host.querySelectorAll('.pv-b').forEach(function(b){
      b.querySelector('[data-role="n"]').textContent = b.querySelectorAll('.pv-i').length;
    });
  }
  function clearArm(){
    armed = null;
    host.querySelectorAll('.pv-i').forEach(function(x){ x.classList.remove('sel'); });
    host.querySelectorAll('.pv-b').forEach(function(x){ x.classList.remove('armed'); });
  }
  function bind(el){
    el.addEventListener('click', function(ev){
      if (done) return;
      ev.stopPropagation();
      var inBucket = !!el.closest('.pv-b');
      if (inBucket) {
        document.getElementById(host.id + '_pool').appendChild(el);
        el.classList.remove('sel', 'good', 'bad');
        clearArm(); counts();
        var it0 = items.filter(function(x){ return x.id === el.dataset.id; })[0];
        say(host, '', L({ es:'Devolviste una acción a la lista. ', en:'You put an action back in the list. ' }) + L(it0.w));
        return;
      }
      if (armed === el) { clearArm(); say(host, '', L({ es:'Soltaste la acción.', en:'You released the action.' })); return; }
      clearArm();
      armed = el; el.classList.add('sel');
      host.querySelectorAll('.pv-b').forEach(function(x){ x.classList.add('armed'); });
      var it = items.filter(function(x){ return x.id === el.dataset.id; })[0];
      say(host, 'warm', L(it.w) + ' ' + L({ es:'Ahora toca la columna que le corresponde.', en:'Now tap the column it belongs to.' }));
    });
  }
  host.querySelectorAll('.pv-i').forEach(bind);

  host.querySelectorAll('.pv-b').forEach(function(b){
    b.addEventListener('click', function(){
      if (done || !armed) return;
      b.querySelector('[data-role="in"]').appendChild(armed);
      armed.classList.remove('sel');
      clearArm(); counts();
      say(host, '', L({ es:'Colocada. Puedes moverla de nuevo tocándola dentro de la columna.', en:'Placed. You can move it again by tapping it inside the column.' }));
    });
  });

  function reveal(){
    done = true;
    ['ant', 'dur', 'des'].forEach(function(bk){
      var box = host.querySelector('.pv-b[data-b="' + bk + '"] [data-role="in"]');
      items.filter(function(x){ return x.b === bk; }).forEach(function(x){
        var el = host.querySelector('.pv-i[data-id="' + x.id + '"]');
        box.appendChild(el);
        el.classList.remove('bad', 'sel'); el.classList.add('good');
      });
    });
    counts();
    var bt = host.querySelector('[data-act="chk"]'); bt.disabled = true; bt.classList.add('solved');
    say(host, 'good', L({
      es:'Mesa ordenada. Nota que casi todo el trabajo está en la columna de antes: lo que se decide con calma es lo que sostiene los otros dos momentos.',
      en:'Table sorted. Notice that almost all the work sits in the before column: what is decided calmly is what holds up the other two moments.'
    }));
  }

  host.querySelector('[data-act="chk"]').addEventListener('click', function(){
    if (done) return;
    var left = document.getElementById(host.id + '_pool').querySelectorAll('.pv-i').length;
    if (left > 0) {
      say(host, 'warm', L({ es:'Todavía quedan ' + left + ' acciones sin colocar.', en:'There are still ' + left + ' actions to place.' }));
      return;
    }
    var bad = [];
    host.querySelectorAll('.pv-b').forEach(function(b){
      b.querySelectorAll('.pv-i').forEach(function(el){
        var it = items.filter(function(x){ return x.id === el.dataset.id; })[0];
        el.classList.remove('good', 'bad');
        if (it.b === b.dataset.b) el.classList.add('good');
        else { el.classList.add('bad'); bad.push(it); }
      });
    });
    if (bad.length === 0) {
      done = true;
      var bt = host.querySelector('[data-act="chk"]'); bt.disabled = true; bt.classList.add('solved');
      say(host, 'good', L({
        es:'Mesa completa. Los tres momentos se sostienen entre sí: sin la preparación previa, las acciones del momento y las posteriores llegan tarde.',
        en:'Table complete. The three moments hold each other up: without the earlier preparation, the actions during and after arrive late.'
      }));
      return;
    }
    tries++;
    if (tries >= 3) { reveal(); return; }
    say(host, 'miss', L({ es:'Hay ' + bad.length + ' acciones fuera de lugar, marcadas en rojo. ', en:'There are ' + bad.length + ' actions out of place, marked in red. ' }) + L(bad[0].w));
  });
  counts();
}

             en:'One of the two figures describes what happened at a single point inside; the other describes what was experienced at the surface.' },
      exp:{ es:'La magnitud es un valor único porque se refiere a la energía liberada donde se rompió la roca. La intensidad describe los efectos observados en un sitio concreto y depende de la distancia, del tipo de suelo y de las construcciones, por eso cambia de una ciudad a otra en el mismo sismo.',

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Regiones Sísmicas y Volcánicas en México y el Mundo';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
