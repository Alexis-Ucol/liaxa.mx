<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuidad de Funciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

/* ── GUIDE WIDGETS (continuidad) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.92rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.55rem .7rem; margin:.6rem 0; overflow-x:auto; text-align:center; }
.defgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
/* clasificador */
.binrow { display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0 .2rem; }
.binbtn { flex:1 1 30%; min-height:48px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.82rem; font-weight:600; cursor:pointer; padding:.4rem .5rem; font-family:inherit; }
.binbtn:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; }
/* lienzos y deslizadores */
.gcv { display:block; width:100%; height:215px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.slrow { display:flex; align-items:center; gap:.6rem; margin-top:.55rem; flex-wrap:wrap; }
.slrow input[type=range] { flex:1; min-width:130px; accent-color:var(--green); height:34px; }
.sllbl { font-family:'IBM Plex Mono',monospace; font-size:.82rem; color:var(--text3); min-width:78px; }
.slval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1rem; color:var(--green); min-width:52px; text-align:right; }
.statgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.45rem; margin-top:.6rem; }
.statcell { background:var(--surface2); border-radius:8px; padding:.5rem; text-align:center; }
.statlbl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); margin-bottom:.15rem; }
.statnum { font-family:'IBM Plex Mono',monospace; font-size:.92rem; font-weight:700; color:var(--green-dark); }
/* recta numérica */
.tickrow { display:flex; flex-wrap:wrap; gap:.35rem; margin:.8rem 0 .2rem; justify-content:center; }
.tickbtn { flex:0 0 44px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text2); font-family:'IBM Plex Mono',monospace; font-size:.82rem; font-weight:600; cursor:pointer; padding:0; }
.tickbtn:hover { border-color:var(--green); }
.tickbtn.on { border-color:var(--gold); background:var(--gold-bg); color:var(--green-dark); }
.tickbtn.hit { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.axisnote { font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--text3); text-align:center; }
@media (max-width: 600px) {
  .defgrid { grid-template-columns:1fr; }
  .statgrid { grid-template-columns:1fr 1fr; }
  .binbtn { flex:1 1 100%; }
  .gcv { height:185px; }
  .sllbl { min-width:64px; font-size:.74rem; }
  .tickbtn { flex:0 0 40px; font-size:.76rem; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Continuidad de Funciones</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático III · Sem 3</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var M       = 18;

  var name    = studentData.name;

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)

      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

    var ok = document.getElementById('pc'+i).classList.contains('ok');

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);

    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }

    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('pm3_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ---------- helpers ---------- */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function EN(){ return LANG === 'en'; }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function pickOne(arr){ return arr[Math.floor(rng()*arr.length)]; }
  function shufA(arr){ var a=arr.slice(),i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function sec(tag,title,html){
    var d=document.createElement('div'); d.className='section';
    d.innerHTML='<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d); return d;
  }
  function widget(kind){
    var d=document.createElement('div'); d.className=kind+'wrap section';
    d.setAttribute('data-widget', kind); d.id='w'+kind; LB.appendChild(d); return d;
  }
  function cssv(n){ try{ var v=getComputedStyle(document.documentElement).getPropertyValue(n); return v?v.trim():'#000'; }catch(e){ return '#000'; } }
  function fitCv(cv){
    var dpr=window.devicePixelRatio||1, w=cv.clientWidth||320, h=cv.clientHeight||200;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function plot(cv, xmin, xmax, ymin, ymax){
    var f=fitCv(cv), ctx=f.ctx, w=f.w, h=f.h, pad=8, i;
    function X(x){ return pad + (x-xmin)/(xmax-xmin)*(w-2*pad); }
    function Y(y){ return h - pad - (y-ymin)/(ymax-ymin)*(h-2*pad); }
    ctx.strokeStyle=cssv('--border'); ctx.lineWidth=1;
    for(i=Math.ceil(xmin);i<=xmax;i++){ ctx.beginPath(); ctx.moveTo(X(i),Y(ymin)); ctx.lineTo(X(i),Y(ymax)); ctx.stroke(); }
    for(i=Math.ceil(ymin);i<=ymax;i+=2){ ctx.beginPath(); ctx.moveTo(X(xmin),Y(i)); ctx.lineTo(X(xmax),Y(i)); ctx.stroke(); }
    ctx.strokeStyle=cssv('--text3'); ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(X(xmin),Y(0)); ctx.lineTo(X(xmax),Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0),Y(ymin)); ctx.lineTo(X(0),Y(ymax)); ctx.stroke();
    return { ctx:ctx, X:X, Y:Y, w:w, h:h, xmin:xmin, xmax:xmax, ymin:ymin, ymax:ymax };
  }
  function curve(P, fn, x0, x1){
    var ctx=P.ctx, step=(x1-x0)/260, x, y, first=true;
    ctx.beginPath();
    for(x=x0; x<=x1+1e-9; x+=step){
      y=fn(x);
      if (!isFinite(y) || y<P.ymin || y>P.ymax){ first=true; continue; }
      if (first){ ctx.moveTo(P.X(x),P.Y(y)); first=false; } else ctx.lineTo(P.X(x),P.Y(y));
    }
    ctx.stroke();
  }
  function hole(P, x, y){
    var ctx=P.ctx;
    ctx.fillStyle=cssv('--surface'); ctx.strokeStyle=cssv('--green'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(P.X(x),P.Y(y),5.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
  function dot(P, x, y, col){
    var ctx=P.ctx;
    ctx.fillStyle=cssv(col); ctx.beginPath(); ctx.arc(P.X(x),P.Y(y),5.5,0,Math.PI*2); ctx.fill();
  }
  var MIN = '−';
  function num(n){ return n<0 ? MIN+Math.abs(n) : ''+n; }
  function lin(k){ return k===0 ? 'x' : '(x ' + (k>0?MIN:'+') + ' ' + Math.abs(k) + ')'; }
  function tail(k){ return k===0 ? '' : (k>0 ? ' + '+k : ' '+MIN+' '+Math.abs(k)); }
  function addProb(spec){
    var so = shufA(T(spec.options)), cor = T(spec.correct);
    problems.push({
      title: T(spec.title), questionText: T(spec.q), fn:'',
      hint: T(spec.hint), explanation: T(spec.exp),
      options: so, correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork, studentChoice:null, pendingChoice:null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES CON SEMILLA (orden fijo: la reconstrucción por idioma
     usa la misma semilla y produce exactamente los mismos datos)
     ============================================================ */
  var vP1 = Math.floor(rng()*2);
  var a1  = (vP1===0) ? ri(3,4) : pickOne([2,4]);
  var vP2 = Math.floor(rng()*2);
  var c2  = ri(2,4), L2 = ri(3,5), M2 = L2 + ri(2,4), pL2 = ri(1,3), pR2 = pL2 + ri(2,4);
  var vP3 = Math.floor(rng()*2);
  var m3  = pickOne([4,5,6,7]);
  var n3  = pickOne([2,3,4,5]);
  var vP4 = Math.floor(rng()*2);
  var p4  = ri(2,5), d4 = ri(1,3);
  var q4  = (rng() < 0.5 && p4 - d4 >= 1) ? (p4 - d4) : (p4 + d4);
  var S4  = p4 + q4, C4c = p4 * q4, ans4 = p4 - q4;
  var vP5 = Math.floor(rng()*2);
  var u5  = ri(2,4), v5 = u5 + ri(1,3), t5 = ri(1,3);
  var w5  = ri(2,5);
  var vP6 = Math.floor(rng()*2);
  var m6  = pickOne([2,3,5]);
  var w6  = pickOne([2,3]), c6 = pickOne([1,3,5]);
  var vP7 = Math.floor(rng()*2);
  var c7  = pickOne([2,3]), m7 = ri(2,3), b7 = ri(2,4), inc7 = pickOne([1,2]);
  var k7  = m7 + inc7, b7b = b7 - inc7*c7;
  var a7  = pickOne([2,3]), e7 = ri(1,2), D7 = a7*c7 + e7 - c7*c7;
  var vP8 = Math.floor(rng()*2);
  var g8  = ri(2,5), h8 = ri(1,4), j8 = ri(2,4), k8 = ri(2,4);
  var vP9 = Math.floor(rng()*2);
  var c9  = ri(2,3), m9 = ri(3,4), b9 = ri(1,2), b9b = ri(3,5);
  var L9  = m9*c9 + b9, R9 = c9 + b9b, J9 = Math.abs(L9 - R9), guard9 = 0;
  while ((J9===0 || J9===L9 || J9===R9 || J9===L9+R9) && guard9 < 12){
    b9b = b9b - 1; R9 = c9 + b9b; J9 = Math.abs(L9 - R9); guard9++;
  }
  var vP10 = Math.floor(rng()*2);
  var n10 = ri(1,3), r10 = ri(2,4);

  /* datos de los manipulativos */
  var W1R = [];
  (function(){ var i, a, m, L;
    for(i=0;i<3;i++){
      a = ri(-3,3); m = pickOne([-2,-1,1,2]); L = ri(-3,3);
      W1R.push({ a:a, m:m, L:L, k0:L + pickOne([-3,-2,2,3]) });
    }
  })();
  var W3R = [];
  (function(){ var i, q, r, p, pool=[-5,-4,-3,-2,-1,1,2,3,4,5], s;
    for(i=0;i<3;i++){
      s = shufA(pool); q = s[0]; r = s[1];
      p = (rng() < 0.4) ? q : s[2];
      W3R.push({ p:p, q:q, r:r });
    }
  })();
  var W4R = [];
  (function(){ var i, c, m1, b1, m2, b2;
    for(i=0;i<3;i++){
      c = pickOne([-2,-1,1,2]); m1 = pickOne([-1,1,2]); b1 = ri(-2,2);
      m2 = pickOne([-2,1,3]); if (m2===m1) m2 = m1 + 1;
      b2 = m1*c + b1 - m2*c;
      W4R.push({ c:c, m1:m1, b1:b1, m2:m2, b2:b2, start:b2 + pickOne([-3,-2,2,3]) });
    }
  })();

  /* ============================================================
     CONCEPTO 1
     ============================================================ */
  sec(T({es:'Concepto 1', en:'Concept 1'}),
      T({es:'Continuidad en un punto: tres condiciones', en:'Continuity at a point: three conditions'}),
      '<p>'+T({
        es:'Una función f es continua en x = a cuando su gráfica se recorre alrededor de ese punto sin interrupciones: sin huecos, sin brincos y sin ramas que se disparen. Esa idea visual se vuelve precisa con tres condiciones que deben cumplirse a la vez.',
        en:'A function f is continuous at x = a when its graph runs around that point without interruptions: no holes, no jumps and no branches shooting off. That visual idea becomes precise through three conditions that must hold at the same time.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Primera condición',en:'First condition'})+'</div><div class="deftxt">'+T({es:'f(a) existe. El punto a pertenece al dominio, de modo que la función tiene ahí un valor asignado.', en:'f(a) exists. The point a belongs to the domain, so the function has a value assigned there.'})+'</div></div>'+

  (function(){

    function live(){

      if (st.k > r.L) return T({es:'El punto relleno quedó por encima del hueco. Baja el valor de f(' + num(r.a) + ').',
                               en:'The solid point sits above the hole. Lower the value of f(' + num(r.a) + ').'});
      if (st.k < r.L) return T({es:'El punto relleno quedó por debajo del hueco. Sube el valor de f(' + num(r.a) + ').',
                               en:'The solid point sits below the hole. Raise the value of f(' + num(r.a) + ').'});
      return T({es:'El punto encaja justo en el hueco. Confirma con el botón.', en:'The point fits right into the hole. Confirm with the button.'});
    }

      var cv=document.getElementById('w1cv'); if(!cv) return;
      var r=R(), P=plot(cv,-6,6,-8,8);
      P.ctx.strokeStyle=cssv('--green'); P.ctx.lineWidth=2.2;
      curve(P, function(x){ return r.m*(x-r.a)+r.L; }, -6, 6);

            en:'The line has a hole at x = ' + num(r.a) + '. Move the slider to place the point f(' + num(r.a) + ') and watch it travel on the graph. When you think the function became continuous, check it.'

            '<span class="slval" id="w1val">'+num(st.k)+'</span></div>'+

      if (st.lock) return;

      fb.textContent = live() + ' ' + T({es:'Sigue ajustando.', en:'Keep adjusting.'});

  (function(){

             en:'The expression reduces to (x + 3)/x for x other than 3, and there the limit is 2: the hole is patched by assigning that value.'} },
      { k:1, pt:1, fx:'f(x) = |x '+MIN+' 1|/(x '+MIN+' 1)',

      { k:2, pt:4, fx:'f(x) = (x + 1)/(x '+MIN+' 4)²',

  (function(){

    function marked(){ var out=[], i; for(i=0;i<TICKS.length;i++){ if(st.marks[TICKS[i]]) out.push(TICKS[i]); } return out; }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Cazador de rupturas',en:'Break hunter'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Actividad completa',en:'Activity complete'})+'</div>'+
          '<div class="rfb">'+T({
            es:'En un cociente de polinomios los únicos puntos sospechosos son los ceros del denominador. En todos los demás la función es continua sin necesidad de comprobar nada más.',
            en:'In a quotient of polynomials the only suspicious points are the zeros of the denominator. At every other point the function is continuous without any further checking.'
          })+'</div></div>';
        return;
      }
      var tg=targets(), chips='', i, t, cls;
      for(i=0;i<TICKS.length;i++){
        t=TICKS[i]; cls='tickbtn';
        if (st.reveal && (t===tg[0]||t===tg[1])) cls+=' hit';
        else if (st.marks[t]) cls+=' on';
        chips += '<button class="'+cls+'" onclick="w3Tap('+t+')">'+num(t)+'</button>';
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Cazador de rupturas',en:'Break hunter'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'Marca en la recta numérica todos los valores donde esta función deja de ser continua. Toca un número para marcarlo y tócalo otra vez para quitarlo; puedes reacomodar tus marcas cuantas veces quieras antes de verificar.',
            en:'Mark on the number line every value where this function stops being continuous. Tap a number to mark it and tap it again to remove it; you can rearrange your marks as many times as you want before checking.'
          })+'</div>'+

          '<div class="tickrow">'+chips+'</div>'+
          '<div class="axisnote">'+T({es:'recta real de '+MIN+'6 a 6',en:'real line from '+MIN+'6 to 6'})+'</div>'+
          '<button class="rverify-btn" onclick="w3Check()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="w3fb"></div>'+
        '</div>';
    }
    window.w3Tap = function(t){
      if (st.lock) return;
      if (st.marks[t]) delete st.marks[t]; else st.marks[t]=1;
      render();
    };
    function advance(){
      st.r++; st.tries=0; st.marks={}; st.lock=false; st.reveal=false;
      if (st.r>=3) st.done=true;
      render();
    }
    window.w3Check = function(){
      if (st.lock) return;
      var tg=targets(), mk=marked(), fb=document.getElementById('w3fb'), i, extra=null, miss=false;
      for(i=0;i<mk.length;i++){ if(mk[i]!==tg[0] && mk[i]!==tg[1]) extra=mk[i]; }
      for(i=0;i<tg.length;i++){ if(!st.marks[tg[i]]) miss=true; }
      if (!extra && !miss){
        st.lock=true; st.reveal=true; render();
        document.getElementById('w3fb').innerHTML = '<span class="okmsg">'+T({
          es:'Correcto: el denominador se anula en '+num(tg[0])+' y en '+num(tg[1])+', y solo ahí.',

        })+'</span>';

        st.lock=true; st.reveal=true; render();
        document.getElementById('w3fb').innerHTML = T({
          es:'Los puntos son '+num(tg[0])+' y '+num(tg[1])+': son los que anulan el denominador. Que el numerador también se anule en uno de ellos cambia el tipo de ruptura, pero no la elimina.',
          en:'The points are '+num(tg[0])+' and '+num(tg[1])+': they are the ones cancelling the denominator. If the numerator also vanishes at one of them the type of break changes, but the break does not disappear.'

        setTimeout(advance, 3000); return;

        fb.textContent = T({es:'En x = '+num(extra)+' el denominador no se anula, así que ahí la función es continua. Quita esa marca.',

      } else {

                            en:'You are missing at least one point. Set each factor of the denominator equal to zero separately.'});

  /* ---- MANIPULATIVO 4: empalma los trozos ---- */
  (function(){
    var wrap = widget('empalme');
    var st = { r:0, tries:0, b:W4R[0].start, done:false, lock:false };
    function R(){ return W4R[st.r]; }
    function leftVal(){ var r=R(); return r.m1*r.c + r.b1; }
    function rightVal(){ var r=R(); return r.m2*r.c + st.b; }
    function gap(){ return rightVal() - leftVal(); }
    function fdesc(){
      var r=R();
      return 'f(x) = ' + (r.m1===1?'x':(r.m1===-1?MIN+'x':r.m1+'x')) + tail(r.b1) + '  ' + (EN()?'if':'si') + '  x ' + '≤' + ' ' + num(r.c) +
             ' ,   f(x) = ' + (r.m2===1?'x':(r.m2===-1?MIN+'x':r.m2+'x')) + tail(st.b) + '  ' + (EN()?'if':'si') + '  x > ' + num(r.c);
    }
    function live(){
      var g=gap();
      if (g > 0) return T({es:'El trozo de la derecha arranca '+g+' unidades por encima. Baja el término independiente.',
                          en:'The right piece starts '+g+' units above. Lower the constant term.'});
      if (g < 0) return T({es:'El trozo de la derecha arranca '+Math.abs(g)+' unidades por debajo. Sube el término independiente.',
                          en:'The right piece starts '+Math.abs(g)+' units below. Raise the constant term.'});
      return T({es:'Los dos trozos llegan a la misma altura. Confirma con el botón.', en:'Both pieces reach the same height. Confirm with the button.'});
    }
    function draw(){
      var cv=document.getElementById('w4cv'); if(!cv) return;
      var r=R(), P=plot(cv,-6,6,-8,8), b=st.b;
      P.ctx.strokeStyle=cssv('--green'); P.ctx.lineWidth=2.2;
      curve(P, function(x){ return r.m1*x + r.b1; }, -6, r.c);
      P.ctx.strokeStyle=cssv('--gold'); P.ctx.lineWidth=2.2;
      curve(P, function(x){ return r.m2*x + b; }, r.c, 6);
      dot(P, r.c, leftVal(), '--green');
      if (gap()===0) dot(P, r.c, rightVal(), '--ok'); else hole(P, r.c, rightVal());
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Empalma los trozos',en:'Stitch the pieces'})+'</div>'+
          '<div class="iw-box"><div class="cls-done">'+T({es:'Actividad completa',en:'Activity complete'})+'</div>'+
          '<div class="rfb">'+T({
            es:'Cada vez que el salto se anuló, los dos trozos llegaron al mismo número en el punto de empalme. Esa igualdad es exactamente la ecuación que se resuelve cuando un trozo lleva un parámetro.',
            en:'Every time the jump vanished, both pieces reached the same number at the joining point. That equality is exactly the equation solved when a piece carries a parameter.'
          })+'</div></div>';
        return;
      }
      var r=R();
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Empalma los trozos',en:'Stitch the pieces'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="iw-sub">'+T({
            es:'El trozo dorado se puede subir y bajar con el deslizador. Muévelo hasta que los dos tramos se junten en x = ' + num(r.c) + ' y el salto desaparezca; el tamaño del salto se actualiza mientras arrastras.',
            en:'The golden piece can be raised and lowered with the slider. Move it until both branches meet at x = ' + num(r.c) + ' and the jump disappears; the size of the jump updates while you drag.'
          })+'</div>'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="dataline">'+fdesc()+'</div>'+
          '<canvas class="gcv" id="w4cv"></canvas>'+
          '<div class="slrow"><span class="sllbl">'+T({es:'término',en:'constant'})+'</span>'+
            '<input type="range" min="'+(R().b2-4)+'" max="'+(R().b2+4)+'" step="1" value="'+st.b+'" oninput="w4Slide(this.value)">'+
            '<span class="slval" id="w4val">'+num(st.b)+'</span></div>'+
          '<div class="statgrid">'+
            '<div class="statcell"><div class="statlbl">'+T({es:'por la izquierda',en:'from the left'})+'</div><div class="statnum" id="w4L">'+num(leftVal())+'</div></div>'+
            '<div class="statcell"><div class="statlbl">'+T({es:'por la derecha',en:'from the right'})+'</div><div class="statnum" id="w4R">'+num(rightVal())+'</div></div>'+
            '<div class="statcell"><div class="statlbl">'+T({es:'salto',en:'jump'})+'</div><div class="statnum" id="w4G">'+Math.abs(gap())+'</div></div>'+
          '</div>'+
          '<button class="rverify-btn" onclick="w4Check()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="w4fb">'+live()+'</div>'+
        '</div>';
      draw();
    }
    window.w4Slide = function(v){
      if (st.lock) return;
      st.b = parseInt(v,10);
      var e;
      e=document.getElementById('w4val'); if(e) e.textContent=num(st.b);
      e=document.getElementById('w4R');   if(e) e.textContent=num(rightVal());
      e=document.getElementById('w4G');   if(e) e.textContent=Math.abs(gap());
      e=wrap.querySelector('.dataline');  if(e) e.textContent=fdesc();
      e=document.getElementById('w4fb');  if(e) e.textContent=live();
      draw();
    };
    function advance(){
      st.r++; st.tries=0; st.lock=false;
      if (st.r>=3){ st.done=true; render(); return; }
      st.b = W4R[st.r].start; render();
    }
    window.w4Check = function(){
      if (st.lock) return;
      var r=R(), fb=document.getElementById('w4fb');
      if (gap()===0){
        st.lock=true;
        fb.innerHTML='<span class="okmsg">'+T({
          es:'Correcto. Los dos trozos valen '+num(leftVal())+' en x = '+num(r.c)+', así que f es continua ahí.',
          en:'Correct. Both pieces equal '+num(leftVal())+' at x = '+num(r.c)+', so f is continuous there.'
        })+'</span>';
        setTimeout(advance, 1600); return;
      }
      st.tries++;
      if (st.tries>=3){
        st.lock=true; st.b=r.b2; render();
        document.getElementById('w4fb').innerHTML = T({
          es:'El término que cose los trozos es '+num(r.b2)+'. Con él, los dos tramos llegan a '+num(leftVal())+' en x = '+num(r.c)+' y el salto vale cero.',
          en:'The constant that stitches the pieces is '+num(r.b2)+'. With it, both branches reach '+num(leftVal())+' at x = '+num(r.c)+' and the jump is zero.'
        });
        setTimeout(advance, 2800); return;
      }
      fb.textContent = live() + ' ' + T({es:'Sigue ajustando.', en:'Keep adjusting.'});
    };
    render();
  })();

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbz210eFtEC9kduZdp_1O9aPwr3-z0tob2zILE8PxXj-Ms6tT3F9VIgH7mRpKwVluogp/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
