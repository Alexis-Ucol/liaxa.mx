<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Géneros Literarios y Recursos para Expresar lo Real y lo Ficticio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Géneros Literarios y Recursos para Expresar lo Real y lo Ficticio</div>
    <div class="wcourse" id="wcourse-el">Español · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Géneros Literarios y Recursos para Expresar lo Real y lo Ficticio</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c3c9c', primaryDark:'#041d4f', primaryBg:'#e5ebf8',
  accent:'#9cb4e4', accentBg:'#e3e9f7',
  darkPrimary:'#3369d6', darkPrimaryDark:'#6595f5', darkPrimaryBg:'#061940',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });
    if (answeredCount === problems.length && problems.length > 0) {
      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);
    }
  }
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;

  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }

    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);

    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');

    var dc = document.getElementById('dc'+i);

    var ta = document.getElementById('ta'+i);

      if (wy > PH-30) { doc.addPage(); wy = 20; }

  // ── Footer on every page ──

  for (var p = 1; p <= pages; p++) {

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp3_t04_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

  function qs(o)   { return '«' + o.es + '»'; }
  function qe(o)   { return '“' + o.en + '”'; }
  function Q(o)    { return ES ? qs(o) : qe(o); }
  function QO(o)   { return { es: qs(o), en: qe(o) }; }

  function sec(tag, title, html) {
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
    host.appendChild(d);

  function widgetBox(id, kind) {

    var a = [], i;
    for (i = 0; i < n; i++) a.push(i);

  /* ───────── los recursos que se rastrean ───────── */
  var REC = {
    metafora:       { n:{ es:'Metáfora',       en:'Metaphor'        }, d:{ es:'nombra una cosa con el nombre de otra sin dejar a la vista el enlace de la comparación',        en:'names one thing with the name of another without leaving the link of the comparison in sight' } },
    simil:          { n:{ es:'Símil',          en:'Simile'          }, d:{ es:'compara dos cosas y deja a la vista el enlace que las une',                                     en:'compares two things and leaves in sight the link that joins them' } },
    personificacion:{ n:{ es:'Personificación',en:'Personification' }, d:{ es:'atribuye a algo que no es humano una conducta que sí lo es',                                     en:'gives something that is not human a behaviour that is' } },
    hiperbole:      { n:{ es:'Hipérbole',      en:'Hyperbole'       }, d:{ es:'exagera la medida de algo hasta lo imposible para hacer sentir su tamaño',                       en:'exaggerates the measure of something to the impossible in order to make its size felt' } },
    anafora:        { n:{ es:'Anáfora',        en:'Anaphora'        }, d:{ es:'repite el mismo comienzo en frases o versos seguidos',                                           en:'repeats the same opening in consecutive sentences or lines' } },
    acotacion:      { n:{ es:'Acotación',      en:'Stage direction' }, d:{ es:'indica, fuera del diálogo, lo que debe ocurrir en escena',                                       en:'indicates, outside the dialogue, what must happen on stage' } },
    encabezado:     { n:{ es:'Encabezado',     en:'Slug line'       }, d:{ es:'fija en una sola línea si la escena es interior o exterior, el lugar y el momento',              en:'sets in a single line whether the scene is interior or exterior, the place and the time' } },
    plano:          { n:{ es:'Plano',          en:'Shot'            }, d:{ es:'decide qué encuadra la cámara y de qué tamaño lo ve el espectador',                              en:'decides what the camera frames and at what size the viewer sees it' } },
    elipsis:        { n:{ es:'Elipsis',        en:'Ellipsis'        }, d:{ es:'salta un tramo de tiempo y deja que el público reponga lo que ocurrió en medio',                 en:'skips a stretch of time and lets the audience supply what happened in between' } }
  };

  /* ───────── material común a los dos casos ───────── */
  var GEN = {
    realFic: {
      c:{ es:'El suceso conserva su origen real, pero pasa a estar gobernado por una forma que decide qué se ve, con qué palabras y en qué orden.',
          en:'The event keeps its real origin, but it comes to be governed by a form that decides what is seen, with which words and in what order.' },
      d:[ { es:'El suceso deja de ser real y se vuelve ficción en cuanto alguien lo escribe con imágenes.',

    guionRasgo: {

      d:[ { es:'Escribir los nombres de los personajes con mayúsculas, ya que de otro modo el lector confundiría quién habla.',

  function figOf(tx, type) {
    var i;
    for (i = 0; i < tx.figs.length; i++) { if (tx.figs[i].type === type) return tx.figs[i]; }
    return tx.figs[0];
  }
  function fq(tx, type) { return QO(figOf(tx, type).q); }

  /* ───────── los textos en pantalla ───────── */
  function textHTML(tx, marks) {
    var out = '', i, j, s, f, ph, at, cls;
    for (i = 0; i < tx.lines.length; i++) {
      s = L(tx.lines[i]);
      if (marks) {
        for (j = 0; j < tx.figs.length; j++) {
          f = tx.figs[j];
          if (f.line !== i) continue;
          ph = L(f.q);
          at = s.indexOf(ph);
          if (at < 0) continue;
          cls = 'xchip' + (marks[j] || '');
          s = s.slice(0, at) + '<span class="' + cls + '" onclick="huTap(' + j + ')">' + ph + '</span>' + s.slice(at + ph.length);
        }
      }
      out += '<span class="dpara">' + s + '</span>';
    }
    return out;
  }
  function textBlock(tx, label, genero) {
    return '<div class="dtext"><div class="dtitle">' + label + ' · ' + genero + ' · ' + L(tx.title) + '</div>' +
           textHTML(tx, null) + '</div>';
  }

  /* ═════════ WIDGET 2 · caza de recursos ═════════ */
  function widgetCaza() {
    var TXS = [ C.n, C.p, C.d, C.g ];
    var pool = [], i, j;
    for (i = 0; i < TXS.length; i++) {
      for (j = 0; j < TXS[i].figs.length; j++) pool.push({ t:i, i:j });
    }
    var order = shuffle(pool, rng).slice(0, 3);
    var st = { r:0, tries:0, marks:{}, done:false };
    var w = widgetBox('wCaza', 'hunt');

    function curTx() { return TXS[order[st.r].t]; }

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Caza de recursos', 'Resource hunt') + '</div>' +
          '<div class="iw-sub">' + T('Recorriste las tres marcas de esta ronda dentro de los textos.',
                                     'You worked through the three marks of this round inside the texts.') + '</div>' +
          '<div class="iw-fb">' + (fb || '') + '</div>';
        return;
      }
      var tp = REC[curTx().figs[order[st.r].i].type];
      w.innerHTML =
        '<div class="iw-tag">' + T('Caza de recursos', 'Resource hunt') + '</div>' +
        '<div class="iw-sub">' + T('Este texto tiene cuatro fragmentos subrayados. Toca aquel en el que el texto ',
                                   'This text has four underlined fragments. Tap the one where the text ') + L(tp.d) + '.</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + order.length + '</div>' +
        '<div class="dtext"><div class="dtitle">' + LBL[order[st.r].t] + ' · ' + GNM[order[st.r].t] + ' · ' + L(curTx().title) + '</div>' +
          textHTML(curTx(), st.marks) + '</div>' +
        '<div class="iw-fb" id="huFb">' + (fb || '') + '</div>';
    }
    function advance(fb) {
      st.r++; st.tries = 0; st.marks = {};
      if (st.r >= order.length) { st.done = true; }
      if (st.done) { paint(''); return; }
      st.locked = true;
      var _fe = document.getElementById('clFb');
      if (_fe) _fe.innerHTML = (fb || '') + '<br><button onclick="clSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.binbtn');
      if (_bs) _bs.forEach(function(b){ b.style.opacity='0.35'; b.style.pointerEvents='none'; });
    }
    window.huTap = function (j) {
      if (st.done) return;
      var tx = curTx(), ti = order[st.r].i;
      var tp = REC[tx.figs[ti].type];
      if (j === ti) {
        st.marks[j] = ' hit';
        advance('<span class="iw-ok">' + Q(tx.figs[j].q) + ': ' + L(tx.figs[j].eff) + '</span>');
        return;
      }
      st.tries++;
      var got = REC[tx.figs[j].type];
      if (st.tries >= 3) {
        st.marks[ti] = ' rev';
        advance(T('El fragmento buscado era ', 'The fragment you were after was ') + Q(tx.figs[ti].q) + ': ' + L(tx.figs[ti].eff));
        return;
      }
      st.marks[j] = ' miss';
      paint(T('Ese fragmento ', 'That fragment ') + L(got.d) + T('. Busca el que ', '. Look for the one that ') + L(tp.d) + '.');
      st.marks[j] = '';
    };
    paint('');
  }

  /* ═════════ WIDGET 3 · del recurso al efecto ═════════ */
  function widgetEfecto() {
    var a = shuffle(C.n.figs, rng).slice(0, 1);
    var b = shuffle(C.p.figs, rng).slice(0, 1);
    var c = shuffle(C.d.figs, rng).slice(0, 1);
    var d = shuffle(C.g.figs, rng).slice(0, 1);
    var use = a.concat(b, c, d);
    var lo = perm(use.length), ro = perm(use.length);
    while (ro.every(function (v, k) { return v === lo[k]; })) { ro.push(ro.shift()); }
    var st = { sel:null, done:{}, tries:0, over:false };
    var w = widgetBox('wEfecto', 'match');

    function paint(fb) {
      var left = lo.map(function (i) {
        var cls = 'mtchip' + (st.done[i] ? ' done' : (st.sel === i ? ' sel' : ''));
        return '<button class="' + cls + '" onclick="efL(' + i + ')">' + Q(use[i].q) + '</button>';
      }).join('');
      var right = ro.map(function (i) {
        var cls = 'mtchip' + (st.done[i] ? ' done' : '');
        return '<button class="' + cls + '" onclick="efR(' + i + ')">' + L(use[i].eff) + '</button>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('Del recurso al efecto', 'From the resource to the effect') + '</div>' +
        '<div class="iw-sub">' + T('Toca un fragmento y después aquello que produce en quien lee o mira. Un recurso vale por lo que hace, no por su nombre.',
                                   'Tap a fragment and then what it produces in the reader or viewer. A resource is worth what it does, not what it is called.') + '</div>' +
        '<div class="mtcols">' +
          '<div><div class="mthead">' + T('Fragmento', 'Fragment') + '</div>' + left + '</div>' +
          '<div><div class="mthead">' + T('Efecto', 'Effect') + '</div>' + right + '</div>' +
        '</div>' +
        '<div class="iw-fb" id="efFb">' + (fb || '') + '</div>';
    }
    function allDone() {
      var i;
      for (i = 0; i < use.length; i++) { if (!st.done[i]) return false; }
      return true;
    }
    window.efL = function (i) {
      if (st.over || st.done[i]) return;
      st.sel = (st.sel === i) ? null : i;
      paint('');
    };
    window.efR = function (i) {
      if (st.over || st.done[i]) return;
      if (st.sel === null) { paint(T('Elige primero un fragmento.', 'Choose a fragment first.')); return; }
      if (st.sel === i) {
        st.done[i] = true; st.sel = null; st.tries = 0;
        if (allDone()) {
          st.over = true;
          paint('<span class="iw-ok">' + T('Las cuatro parejas quedaron completas: cada género produce su efecto con recursos distintos, y por eso se elige uno y no otro.',
                                           'All four pairs are complete: each genre produces its effect with different resources, and that is why one is chosen and not another.') + '</span>');
          return;
        }
        paint('<span class="iw-ok">' + T('Pareja correcta. Ahí el texto ', 'Correct pair. There the text ') + L(REC[use[i].type].d) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var k;
        for (k = 0; k < use.length; k++) { st.done[k] = true; }
        st.over = true; st.sel = null;
        paint(T('Estas son las parejas correctas. Fíjate en que el efecto dice, con otras palabras, lo que hace el fragmento.',
                'These are the correct pairs. Notice how the effect says, in other words, what the fragment does.'));
        return;
      }
      var mine = st.sel;
      st.sel = null;
      paint(T('Ese efecto pertenece a otro fragmento. El que elegiste ', 'That effect belongs to a different fragment. The one you chose ') +
            L(REC[use[mine].type].d) + T('; busca el efecto que diga eso mismo.', '; look for the effect that says exactly that.'));
    };
    paint('');
  }

  /* ═════════ WIDGET 4 · sala de encabezados ═════════ */
  function widgetEncabezado() {
    var ESPACIO = [ { es:'INT.', en:'INT.' }, { es:'EXT.', en:'EXT.' } ];
    var MOMENTO = [ { es:'DÍA', en:'DAY' }, { es:'NOCHE', en:'NIGHT' }, { es:'AMANECER', en:'DAWN' } ];
    var LUG = C.lugares;
    var seq = perm(C.casos.length);
    var st = { r:0, esp:null, lug:null, mom:null, tries:0, done:false, msg:'' };
    var w = widgetBox('wEncab', 'build');

    function caso() { return C.casos[seq[st.r]]; }
    function slug() {
      return (st.esp === null ? '____' : L(ESPACIO[st.esp])) + ' ' +
             (st.lug === null ? '____________' : L(LUG[st.lug])) + '. ' +
             (st.mom === null ? '________' : L(MOMENTO[st.mom]));
    }
    function paint() {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Sala de encabezados', 'Slug line room') + '</div>' +
          '<div class="iw-sub">' + T('Armaste los tres encabezados de la secuencia.', 'You built the three slug lines of the sequence.') + '</div>' +
          '<div class="iw-fb">' + st.msg + '</div>';
        return;
      }
      var cs = caso();
      w.innerHTML =
        '<div class="iw-tag">' + T('Sala de encabezados', 'Slug line room') + '</div>' +
        '<div class="iw-sub">' + T('Un encabezado dice en una línea si la cámara está dentro o fuera, en qué lugar y en qué momento. Arma el que corresponde a esta escena y luego comprueba.',
                                   'A slug line says in one line whether the camera is inside or outside, in what place and at what time. Build the one for this scene and then check.') + '</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + C.casos.length + '</div>' +
        '<div class="bwcase">' + L(cs.sit) + '</div>' +
        '<div class="bwgrp"><div class="bwlbl">' + T('Interior o exterior', 'Interior or exterior') + '</div><div class="bwrow">' +
          ESPACIO.map(function (o, i) { return '<button class="bwopt' + (st.esp === i ? ' on' : '') + '" onclick="bwPick(0,' + i + ')">' + L(o) + '</button>'; }).join('') +
        '</div></div>' +
        '<div class="bwgrp"><div class="bwlbl">' + T('Lugar', 'Place') + '</div><div class="bwrow">' +
          LUG.map(function (o, i) { return '<button class="bwopt' + (st.lug === i ? ' on' : '') + '" onclick="bwPick(1,' + i + ')">' + L(o) + '</button>'; }).join('') +
        '</div></div>' +
        '<div class="bwgrp"><div class="bwlbl">' + T('Momento', 'Time') + '</div><div class="bwrow">' +
          MOMENTO.map(function (o, i) { return '<button class="bwopt' + (st.mom === i ? ' on' : '') + '" onclick="bwPick(2,' + i + ')">' + L(o) + '</button>'; }).join('') +
        '</div></div>' +
        '<div class="bwslug">' + slug() + '</div>' +
        '<button class="iwbtn" onclick="bwCheck()">' + T('Comprobar', 'Check') + '</button>' +
        '<div class="iw-fb" id="bwFb">' + st.msg + '</div>';
    }
    function nextRound(msg) {
      st.r++; st.tries = 0; st.esp = null; st.lug = null; st.mom = null; st.msg = msg;
      if (st.r >= C.casos.length) st.done = true;
      if (st.done) { paint(); return; }
      st.locked = true;
      var _fe = document.getElementById('bwFb');
      var _msg = arguments[0] || '';
      if (_fe) _fe.innerHTML = _msg + '<br><button onclick="bwSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.bwopt');
      if (_bs) _bs.forEach(function(b){ b.style.opacity='0.35'; b.style.pointerEvents='none'; });
    }
    window.bwPick = function (grp, i) {
      if (st.done) return;
      if (grp === 0) st.esp = (st.esp === i ? null : i);
      if (grp === 1) st.lug = (st.lug === i ? null : i);
      if (grp === 2) st.mom = (st.mom === i ? null : i);
      st.msg = '';
      paint();
    };
    window.bwCheck = function () {
      if (st.done || st.locked) return;
      if (st.done) return;
      var cs = caso(), fb = document.getElementById('bwFb');
      if (st.esp === null || st.lug === null || st.mom === null) {
        fb.textContent = T('Falta una de las tres piezas. Un encabezado incompleto no permite filmar la escena.',
                           'One of the three pieces is missing. An incomplete slug line does not allow the scene to be filmed.');
        return;
      }
      if (st.esp === cs.in && st.lug === cs.lu && st.mom === cs.mo) {
        nextRound('<span class="iw-ok">' + T('Correcto: ', 'Correct: ') + slug() + T('. Con esas tres piezas el equipo sabe dónde colocar la cámara y con qué luz.',
                                                                                     '. With those three pieces the crew knows where to place the camera and with what light.') + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.esp = cs.in; st.lug = cs.lu; st.mom = cs.mo;
        nextRound(T('El encabezado era ', 'The slug line was ') + slug() +
                  T('. Vuelve a leer la escena: cada dato del encabezado está dicho en ella.',
                    '. Read the scene again: every piece of the slug line is stated in it.'));
        return;
      }
      var tip;
      if (st.esp !== cs.in) {
        tip = T('El lugar y el momento pueden esperar: primero decide si la cámara queda dentro o fuera de un techo.',
                'Place and time can wait: first decide whether the camera stays inside or outside a roof.');
      } else if (st.lug !== cs.lu) {
        tip = T('Dentro o fuera ya está bien. Revisa el lugar: el encabezado nombra el sitio exacto donde ocurre la escena.',
                'Inside or outside is right. Check the place: the slug line names the exact spot where the scene happens.');
      } else {
        tip = T('El espacio ya está bien. Revisa el momento: la escena dice a qué hora ocurre, y de ahí depende la luz del rodaje.',
                'The space is right. Check the time: the scene says at what hour it happens, and the light of the shoot depends on that.');
      }
      fb.textContent = tip;
    };

    window.bwSig = function(){
      st.locked = false;
      paint();
    };
    paint();
  }

  /* ═════════ WIDGET 5 · ruta de escritura ═════════ */
  function widgetRuta() {
    var PASOS = [
      { es:'Anotar el suceso tal como ocurrió, con los datos que cualquiera podría comprobar.',
        en:'Note the event as it happened, with the facts anyone could check.' },
      { es:'Decidir qué quiero que sienta quien lea o mire, y en qué momento del texto.',
        en:'Decide what I want the reader or viewer to feel, and at what moment of the text.' },
      { es:'Elegir el género capaz de producir ese efecto.',
        en:'Choose the genre able to produce that effect.' },
      { es:'Escoger los recursos que van a trabajar dentro de ese género.',
        en:'Pick the resources that are going to work inside that genre.' },
      { es:'Escribir el borrador y comprobar en él si el efecto llega.',
        en:'Write the draft and check in it whether the effect arrives.' }
    ];
    var st = { order: perm(PASOS.length), sel:null, tries:0, done:false };
    var w = widgetBox('wRuta', 'timeline');

    function paint(fb) {
      var chips = st.order.map(function (ei, pos) {
        var cls = 'tchip' + (st.done ? ' lock' : (st.sel === pos ? ' sel' : ''));
        return '<div class="' + cls + '" onclick="tlTap(' + pos + ')"><span class="tnum">' + (pos + 1) + '</span><span>' + L(PASOS[ei]) + '</span></div>';
      }).join('');
      w.innerHTML =
        '<div class="iw-tag">' + T('Ruta de escritura', 'Writing route') + '</div>' +
        '<div class="iw-sub">' + T('Estos cinco pasos llevan de un suceso real a un texto literario, pero están desordenados. Colócalos de modo que cada paso solo pueda darse después del anterior. Toca dos tarjetas para intercambiarlas.',
                                   'These five steps lead from a real event to a literary text, but they are out of order. Place them so that each step can only be taken after the previous one. Tap two cards to swap them.') + '</div>' +
        '<div class="tlist">' + chips + '</div>' +
        (st.done ? '' : '<button class="iwbtn" onclick="tlCheck()">' + T('Comprobar', 'Check') + '</button>') +
        '<div class="iw-fb" id="tlFb">' + (fb || '') + '</div>';
    }
    window.tlTap = function (pos) {
      if (st.done) return;
      if (st.sel === null) { st.sel = pos; }
      else if (st.sel === pos) { st.sel = null; }
      else { var t = st.order[st.sel]; st.order[st.sel] = st.order[pos]; st.order[pos] = t; st.sel = null; }
      paint('');
    };
    window.tlCheck = function () {
      if (st.done) return;
      var ok = st.order.every(function (ei, pos) { return ei === pos; });
      if (ok) {
        st.done = true;
        paint('<span class="iw-ok">' + T('Esa es la ruta: el género no se elige al principio, sino después de saber qué debe ocurrir en quien lee, y los recursos se escogen ya dentro del género.',
                                         'That is the route: the genre is not chosen at the start but after knowing what must happen in the reader, and the resources are picked once inside the genre.') + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.order = PASOS.map(function (_, i) { return i; });
        st.done = true;
        paint(T('Este es el orden. Compáralo con el tuyo y fíjate en qué paso queda sin apoyo si lo adelantas.',
                'This is the order. Compare it with yours and notice which step is left unsupported if you move it earlier.'));
        return;
      }
      var bad = 0, i;
      for (i = 0; i < st.order.length; i++) { if (st.order[i] !== i) { bad = i; break; } }
      paint(T('Todavía no. Revisa la tarjeta número ', 'Not yet. Look at card number ') + (bad + 1) +
            T(': ¿podrías darla sin haber dado antes alguna de las que están debajo?',
              ': could you take it without having taken one of the ones below it first?'));
    };
    paint('');
  }

  /* ═════════ constructor de tarjetas ═════════ */
  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: false,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Lo real, lo ficticio y la forma', 'The real, the fictional and the form'),
      '<p>' + T('Todo lo que se escribe parte de algo: un suceso que ocurrió, una escena que alguien contó, una situación que solo existe en la cabeza de quien escribe. Un registro informativo trata ese material de una sola manera: comprueba y consigna. Un texto literario hace algo distinto. No niega los hechos ni necesita inventarlos, pero los somete a una forma que decide quién habla, qué se ve, con qué palabras y en qué orden. Por eso lo real y lo ficticio no son dos materiales distintos, sino dos orígenes posibles del mismo trabajo: en ambos casos el texto se juega en la forma. Abajo tienes el registro de un suceso y cuatro textos que parten de él, uno por cada género. Los cuatro cuentan lo mismo y ninguno se parece a los otros.',
                'Everything that gets written starts from something: an event that happened, a scene someone told, a situation that only exists in the head of the writer. An informative record treats that material in one single way: it checks and it records. A literary text does something different. It does not deny the facts nor does it need to invent them, but it submits them to a form that decides who speaks, what is seen, with which words and in what order. That is why the real and the fictional are not two different materials but two possible origins of the same work: in both cases the text is played out in the form. Below you have the record of an event and four texts that start from it, one for each genre. All four tell the same thing and none of them resembles the others.') + '</p>' +
      '<div class="notebox"><div class="notelbl">' + T('Registro del suceso', 'Record of the event') + '</div>' + L(C.nota) + '</div>' +
      textBlock(C.n, LBL[0], GNM[0]) +
      textBlock(C.p, LBL[1], GNM[1]) +
      textBlock(C.d, LBL[2], GNM[2]) +
      textBlock(C.g, LBL[3], GNM[3]) +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('pregunta en cada texto quién habla, qué alcanzas a ver gracias a esa voz y qué te quedas sin saber.',
          'in each text ask who is speaking, what you get to see thanks to that voice and what you are left not knowing.') + '</p></div>');

  sec(T('Recursos', 'Resources'),
      T('Las marcas que quedan en la página', 'The marks left on the page'),
      '<p>' + T('Un recurso literario no es un adorno que se añade al final: es una decisión que cambia lo que le ocurre a quien lee. La metáfora afirma que una cosa es otra y traslada de golpe todo lo que asociamos con la segunda. El símil deja la comparación a la vista y presta al suceso una experiencia que el lector ya tuvo. La personificación da conducta humana a lo que no la tiene, y un accidente pasa a parecer una intención. La hipérbole exagera hasta lo imposible, y esa imposibilidad mide algo que ninguna cifra mediría. La anáfora repite el mismo comienzo e instala un compás. A estos se suman los recursos propios de la escena: la acotación indica lo que debe verse sin que nadie lo pronuncie, el encabezado fija espacio y momento, el plano decide el encuadre y la elipsis salta un tramo de tiempo. Todos dejan una marca localizable, y esa marca es la que después podrás citar.',
                'A literary resource is not a decoration added at the end: it is a decision that changes what happens to the reader. The metaphor states that one thing is another and carries over at once everything we associate with the second. The simile leaves the comparison in sight and lends the event an experience the reader has already had. Personification gives human behaviour to what has none, and an accident starts to look like an intention. Hyperbole exaggerates to the impossible, and that impossibility measures something no figure would measure. Anaphora repeats the same opening and installs a beat. To these are added the resources belonging to the scene: the stage direction indicates what must be seen without anyone uttering it, the slug line sets space and time, the shot decides the framing and the ellipsis skips a stretch of time. All of them leave a locatable mark, and that mark is what you will later be able to quote.') + '</p>' +
      '<div class="glosslist">' +
        '<div class="gloss"><div class="glossn">' + L(REC.metafora.n)        + '</div><div class="glossd">' + L(REC.metafora.d)        + '</div></div>' +

        '<div class="gloss"><div class="glossn">' + L(REC.anafora.n)         + '</div><div class="glossd">' + L(REC.anafora.d)         + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(REC.acotacion.n)       + '</div><div class="glossd">' + L(REC.acotacion.d)       + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(REC.encabezado.n)      + '</div><div class="glossd">' + L(REC.encabezado.d)      + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(REC.plano.n)           + '</div><div class="glossd">' + L(REC.plano.d)           + '</div></div>' +
        '<div class="gloss"><div class="glossn">' + L(REC.elipsis.n)         + '</div><div class="glossd">' + L(REC.elipsis.d)         + '</div></div>' +
      '</div>');
  widgetCaza();

  sec(T('Efecto', 'Effect'),
      T('Un recurso vale por lo que hace', 'A resource is worth what it does'),
      '<p>' + T('Reconocer el nombre de una figura sirve de poco si no puedes decir qué produce. El trabajo verdadero empieza en el paso siguiente: del fragmento al efecto. Ese paso se comprueba con una prueba sencilla. Quita el recurso, escribe la misma información en palabras planas y compara lo que queda. Si nada cambia en quien lee, el recurso estaba de adorno. Si al quitarlo se pierde la prisa, la distancia, la sospecha o el frío, entonces el recurso estaba haciendo el trabajo del texto. Por eso una lectura atenta no colecciona figuras: sigue lo que cada una provoca y comprueba si eso era lo que el texto necesitaba provocar.',
                'Recognising the name of a figure is of little use if you cannot say what it produces. The real work begins at the next step: from the fragment to the effect. That step is checked with a simple test. Remove the resource, write the same information in plain words and compare what is left. If nothing changes for the reader, the resource was decoration. If removing it loses the rush, the distance, the suspicion or the cold, then the resource was doing the work of the text. That is why an attentive reading does not collect figures: it follows what each one provokes and checks whether that was what the text needed to provoke.') + '</p>');
  widgetEfecto();

  addP(q6());

  sec(T('La escena', 'The scene'),
      T('Cuando el texto se escribe para verse', 'When the text is written to be seen'),
      '<p>' + T('Dos de los cuatro géneros no terminan en la página. Un texto dramático se escribe para que alguien lo diga en voz alta delante de un público, y por eso reparte todo entre réplicas y acotaciones: nadie relata, nadie explica lo que los personajes piensan, y lo que no se dice tiene que verse. Un guion audiovisual va un paso más allá, porque quien lo lee no es el público sino el equipo que va a filmarlo. Necesita saber si la cámara está dentro o fuera, en qué lugar exacto y en qué momento del día, y eso se declara en el encabezado. Necesita saber qué entra en el cuadro y de qué tamaño, y eso lo decide el plano. Y cuando la historia salta de un momento a otro, el corte deja fuera lo que el espectador podrá reponer solo.',
                'Two of the four genres do not end on the page. A dramatic text is written so that someone says it out loud in front of an audience, and that is why it distributes everything between spoken lines and stage directions: nobody relates, nobody explains what the characters think, and what is not said has to be seen. An audiovisual script goes one step further, because whoever reads it is not the audience but the crew that is going to film it. It needs to know whether the camera is inside or outside, in what exact place and at what time of day, and that is declared in the slug line. It needs to know what enters the frame and at what size, and the shot decides that. And when the story jumps from one moment to another, the cut leaves out what the viewer will be able to supply alone.') + '</p>');
  widgetEncabezado();
  addP(q7());
  addP(q8());

  sec(T('Elegir', 'Choosing'),
      T('El género se elige por lo que debe ocurrir', 'The genre is chosen for what must happen'),
      '<p>' + T('Ningún género es mejor que otro: cada uno puede hacer cosas que los demás no. Si quieres que el lector se quede a solas con una imagen y sin desenlace, el verso lo consigue en cuatro líneas y una narración necesitaría tres páginas. Si quieres que dos personas se enfrenten en tiempo real y nadie interprete por ellas, la escena dramática lo resuelve sin narrador. Si quieres que el público vea una mano antes que una cara, lo que necesitas es un plano. Por eso el género no se elige al empezar, por costumbre o por gusto, sino después de decidir qué debe ocurrirle a quien lee o mira. Primero el efecto, luego el género, y solo entonces los recursos que van a trabajar dentro de él.',
                'No genre is better than another: each can do things the others cannot. If you want the reader left alone with an image and no outcome, verse achieves it in four lines and a narration would need three pages. If you want two people confronting each other in real time and nobody interpreting for them, the dramatic scene solves it with no narrator. If you want the audience to see a hand before a face, what you need is a shot. That is why the genre is not chosen at the start, out of habit or taste, but after deciding what must happen to the reader or viewer. First the effect, then the genre, and only then the resources that are going to work inside it.') + '</p>');
  widgetRuta();
  addP(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('Tu propio texto', 'Your own text'),
      '<p>' + T('Lo que hiciste con estos cuatro textos es lo mismo que harás al escribir el tuyo, solo que en sentido contrario: aquí partiste de la forma para encontrar el efecto, y al escribir partirás del efecto para elegir la forma.',
                'What you did with these four texts is the same thing you will do when writing your own, only in the opposite direction: here you started from the form to find the effect, and when writing you will start from the effect to choose the form.') + '</p>');
  widgetCuaderno();
  addP(q10());
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Géneros Literarios y Recursos para Expresar lo Real y lo Ficticio';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
