<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matemáticas Financieras</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Matemáticas Financieras</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático II · Sem 2</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Matemáticas Financieras</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c6c', primaryDark:'#14223f', primaryBg:'#e9edf4',
  accent:'#849cb4', accentBg:'#e9edf1',
  darkPrimary:'#5575b4', darkPrimaryDark:'#839fd7', darkPrimaryBg:'#121d34',

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');

  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'pm2_t05_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'pm2_t05_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'pm2_t05_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

   GUÍA :: Matemáticas Financieras  (Pensamiento Matemático II · Sem 2)
   Interés simple, interés compuesto, periodos de capitalización, tasa
   efectiva anual y comparación de opciones financieras.
   Bilingüe (Rule 10), variantes por semilla (Rule 4), manipulativos marcados

   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function r2(v){ return Math.round(v * 100) / 100; }

function money(v){
  var s = r2(Math.abs(v)).toFixed(2).split('.');
  return '$' + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + s[1];
}
function pctv(v){ return (Math.round(v * 10000) / 100).toFixed(2) + '%'; }
function pct1(v){ return (Math.round(v * 1000) / 10).toFixed(1) + '%'; }
function pts(v){ return (Math.round(v * 10000) / 100).toFixed(2) + L({ es:' puntos porcentuales', en:' percentage points' }); }
function anios(n){ return n + ' ' + (n === 1 ? L({ es:'año', en:'year' }) : L({ es:'años', en:'years' })); }
function num0(v){ return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* opciones siempre distintas: si dos valores coinciden al formatearse, el
   distractor se separa en pasos hasta quedar único (Rule 7 / 4 opciones) */
function uniqBy(vals, fmt, step){
  var out = [], seen = {};
  for (var k = 0; k < vals.length; k++){
    var v = vals[k], g = 0;
    while (seen[fmt(v)] && g < 60){ g++; v = vals[k] + step * g; }
    seen[fmt(v)] = 1;
    out.push(v);
  }
  return out;
}
function optsFrom(vals, fmt, step){
  return uniqBy(vals, fmt, step).map(function(v){ return fmt(v); });
}

/* ── modelos financieros ── */
function montoSimple(C, i, pl){ return C * (1 + i * pl); }
function montoComp(C, i, pl, m){ var f = m || 1; return C * Math.pow(1 + i / f, f * pl); }
function tasaEfectiva(i, m){ return Math.pow(1 + i / m, m) - 1; }

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: meta de interés simple  (data-widget="simple")
   Dos controles vivos. Cada columna es un año: verde el capital, dorado los
   intereses acumulados. El interés simple agrega la misma franja cada año, y
   el alumno busca una combinación de tasa y plazo que caiga en el rango.
   ══════════════════════════════════════════════════════════════════════════ */
function wSimple(rng, host){
  function mkRound(){
    var C  = 1000 * ri(rng, 6, 18);
    var iS = ri(rng, 6, 16) / 100;
    var pS = ri(rng, 3, 9);
    var I  = C * iS * pS;
    return { C:C, iS:iS, pS:pS, lo: Math.round(I * 0.93 / 50) * 50, hi: Math.round(I * 1.07 / 50) * 50 };
  }
  var rounds = [mkRound(), mkRound(), mkRound()];
  var idx = 0, tries = 0, done = false;
  var cur = { i: 10, p: 4 };
  function q(k){ return host.querySelector('[data-r="' + k + '"]'); }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Meta de interés', en:'Interest target' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve los dos controles cuantas veces quieras. Cada columna es un año: la parte verde es el capital y la dorada son los intereses acumulados hasta ese año.',
      en:'Move both controls as often as you like. Each column is one year: the green part is the capital and the gold part is the interest built up to that year.'
    }) + '</div>' +
    '<div class="gw-lbl">' + L({ es:'Tasa de interés simple anual', en:'Annual simple interest rate' }) + '</div>' +
    '<input class="gw-range" type="range" min="4" max="24" step="1" data-r="ri">' +
    '<div class="gw-num" data-r="iv"></div>' +
    '<div class="gw-lbl">' + L({ es:'Plazo', en:'Term' }) + '</div>' +
    '<input class="gw-range" type="range" min="1" max="12" step="1" data-r="rp">' +
    '<div class="gw-num" data-r="pv"></div>' +
    '<div class="chart" data-r="chart"></div>' +
    '<div class="metrics">' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Interés de cada año', en:'Interest each year' }) + '</div><div class="mnum cs" data-r="mA"></div></div>' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Interés total', en:'Total interest' }) + '</div><div class="mnum ps" data-r="mB"></div></div>' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Monto final', en:'Final amount' }) + '</div><div class="mnum ts" data-r="mC"></div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  function total(){ var d = rounds[idx]; return d.C * (cur.i / 100) * cur.p; }
  function inRange(){ var d = rounds[idx]; var T = total(); return T >= d.lo && T <= d.hi; }

  function liveFb(){
    var d = rounds[idx], T = total();
    if (T < d.lo){
      sayIn(q('fb'), 'warm', L({ es:'El interés total va en ', en:'Total interest is at ' }) + money(T) +
        L({ es:'. Faltan ', en:'. It is short by ' }) + money(d.lo - T) +
        L({ es:' para entrar al rango: sube la tasa o alarga el plazo.', en:' to reach the range: raise the rate or lengthen the term.' }));
    } else if (T > d.hi){
      sayIn(q('fb'), 'warm', L({ es:'El interés total va en ', en:'Total interest is at ' }) + money(T) +
        L({ es:'. Te pasaste por ', en:'. It overshoots by ' }) + money(T - d.hi) +
        L({ es:': baja la tasa o acorta el plazo.', en:': lower the rate or shorten the term.' }));
    } else {
      sayIn(q('fb'), 'good', L({ es:'Vas dentro del rango con ', en:'You are inside the range with ' }) + money(T) +
        L({ es:'. Confirma con Comprobar.', en:'. Confirm with Check.' }));
    }
  }

  function render(){
    if (done) return;
    var d = rounds[idx], i = cur.i / 100, pl = cur.p;
    var perYear = d.C * i, T = perYear * pl;
    q('q').textContent =
      L({ es:'Ronda ', en:'Round ' }) + (idx + 1) + L({ es:' de 3. Un capital de ', en:' of 3. A capital of ' }) + money(d.C) +
      L({ es:' debe producir entre ', en:' must produce between ' }) + money(d.lo) + L({ es:' y ', en:' and ' }) + money(d.hi) +
      L({ es:' de interés simple.', en:' of simple interest.' });
    q('iv').textContent = cur.i + '%';
    q('pv').textContent = anios(pl);
    q('mA').textContent = money(perYear);
    q('mB').textContent = money(T);
    q('mC').textContent = money(d.C + T);
    var maxM = d.C + perYear * 12;
    if (maxM <= 0) maxM = 1;
    var cols = '';
    for (var y = 1; y <= pl; y++){
      var hCap = 100 * d.C / maxM;
      var hInt = 100 * perYear * y / maxM;
      cols += '<div class="chcol"><div class="chstack">' +
        '<div class="chseg acc" style="height:' + hInt.toFixed(1) + '%"></div>' +
        '<div class="chseg" style="height:' + hCap.toFixed(1) + '%"></div>' +
        '</div><div class="chl">' + y + '</div></div>';
    }
    q('chart').innerHTML = cols;
  }

  function next(){
    idx++; tries = 0;
    if (idx >= rounds.length){
      done = true;
      host.innerHTML = '<div class="gw-h">' + L({ es:'Meta de interés', en:'Interest target' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Tres rondas resueltas. Con interés simple la misma franja se repite año con año, así que tasa y plazo se pueden intercambiar: la mitad de tasa durante el doble de tiempo produce lo mismo.',
          en:'Three rounds solved. With simple interest the same band repeats year after year, so rate and term can be traded off: half the rate for twice the time produces the same.'
        }) + '</div>';
      return;
    }
    cur = { i: 10, p: 4 };
    q('ri').value = cur.i; q('rp').value = cur.p;
    render();
    liveFb();
  }

  function check(){
    if (done) return;
    var d = rounds[idx];
    if (inRange()){
      sayIn(q('fb'), 'good', '🎉 ' + L({ es:'Dentro del rango: ', en:'Inside the range: ' }) + money(total()) +
        L({ es:' con ', en:' with ' }) + cur.i + '% ' + L({ es:'durante ', en:'for ' }) + anios(cur.p) + '.');
      setTimeout(next, 1200);
      return;
    }
    tries++;
    if (tries >= 3){
      cur.i = Math.round(d.iS * 100); cur.p = d.pS;
      q('ri').value = cur.i; q('rp').value = cur.p;
      render();
      sayIn(q('fb'), 'warm', L({ es:'Una combinación que sí entra: ', en:'A combination that does fit: ' }) + cur.i + '% ' +
        L({ es:'durante ', en:'for ' }) + anios(cur.p) + '. ' + L({
          es:'El interés simple suma cada año la misma cantidad, el capital por la tasa, y por eso el total sube en línea recta.',
          en:'Simple interest adds the same amount every year, the capital times the rate, and that is why the total rises in a straight line.'
        }));
      setTimeout(next, 2600);
      return;
    }
    liveFb();
  }

  q('ri').addEventListener('input', function(){ cur.i = parseInt(this.value, 10); render(); liveFb(); });
  q('rp').addEventListener('input', function(){ cur.p = parseInt(this.value, 10); render(); liveFb(); });
  q('chk').addEventListener('click', check);
  q('ri').value = cur.i; q('rp').value = cur.p;
  render();
  liveFb();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: la brecha entre simple y compuesto  (data-widget="crecimiento")
   Dos columnas por año, una por cada modelo. El alumno alarga el plazo y ve
   cómo la distancia entre las dos barras se abre despacio y luego se dispara.
   Reto: hallar el menor plazo en que la brecha supera una cantidad dada.
   ══════════════════════════════════════════════════════════════════════════ */
function wCrece(rng, host){
  function brecha(C, i, n){ return montoComp(C, i, n) - montoSimple(C, i, n); }
  function mkRound(){
    var C = 1000 * ri(rng, 8, 20), i = ri(rng, 8, 16) / 100, nS = ri(rng, 4, 11);
    var D = Math.round(((brecha(C, i, nS) + brecha(C, i, nS - 1)) / 2) / 100) * 100;
    if (D < 100) D = 100;
    var nMin = 1;
    while (nMin < 40 && brecha(C, i, nMin) <= D) nMin++;
    return { C:C, i:i, D:D, nMin:nMin };
  }
  var rounds = [mkRound(), mkRound(), mkRound()];
  var idx = 0, tries = 0, done = false, plazo = 3;
  function q(k){ return host.querySelector('[data-r="' + k + '"]'); }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La brecha', en:'The gap' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Cada año tiene dos columnas: verde el monto con interés simple, dorada el monto con interés compuesto. Alarga y acorta el plazo las veces que necesites.',
      en:'Each year has two columns: green is the amount with simple interest, gold is the amount with compound interest. Lengthen and shorten the term as often as you need.'
    }) + '</div>' +
    '<div class="chart" data-r="chart"></div>' +
    '<div class="gw-lbl">' + L({ es:'Plazo', en:'Term' }) + '</div>' +
    '<input class="gw-range" type="range" min="1" max="20" step="1" data-r="rp">' +
    '<div class="gw-num" data-r="pv"></div>' +
    '<div class="metrics">' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Monto simple', en:'Simple amount' }) + '</div><div class="mnum cs" data-r="mA"></div></div>' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Monto compuesto', en:'Compound amount' }) + '</div><div class="mnum ps" data-r="mB"></div></div>' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Brecha', en:'Gap' }) + '</div><div class="mnum ts" data-r="mC"></div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  function liveFb(){
    var d = rounds[idx], g = brecha(d.C, d.i, plazo);
    if (g <= d.D){
      sayIn(q('fb'), 'warm', L({ es:'Con ', en:'With ' }) + anios(plazo) + L({ es:' la brecha es ', en:' the gap is ' }) + money(g) +
        L({ es:', todavía no supera ', en:', it still does not pass ' }) + money(d.D) + L({ es:'. Prueba un plazo mayor.', en:'. Try a longer term.' }));
    } else if (plazo > d.nMin){
      sayIn(q('fb'), 'warm', L({ es:'Con ', en:'With ' }) + anios(plazo) + L({ es:' la brecha ya supera ', en:' the gap already passes ' }) + money(d.D) +
        L({ es:', pero se busca el plazo más corto que lo logra. Prueba con menos años.', en:', but we want the shortest term that manages it. Try fewer years.' }));
    } else {
      sayIn(q('fb'), 'good', L({ es:'La brecha llega a ', en:'The gap reaches ' }) + money(brecha(d.C, d.i, plazo)) +
        L({ es:' y ningún plazo menor lo consigue. Confirma con Comprobar.', en:' and no shorter term manages it. Confirm with Check.' }));
    }
  }

  function render(){
    if (done) return;
    var d = rounds[idx];
    q('q').textContent =
      L({ es:'Ronda ', en:'Round ' }) + (idx + 1) + L({ es:' de 3. ', en:' of 3. ' }) + money(d.C) +
      L({ es:' al ', en:' at ' }) + pct1(d.i) + L({ es:' anual. Encuentra el menor plazo entero en el que el interés compuesto le saca más de ', en:' per year. Find the shortest whole term in which compound interest pulls ahead of simple interest by more than ' }) +
      money(d.D) + L({ es:' al interés simple.', en:'.' });
    q('pv').textContent = anios(plazo);
    var ms = montoSimple(d.C, d.i, plazo), mc = montoComp(d.C, d.i, plazo);
    q('mA').textContent = money(ms);
    q('mB').textContent = money(mc);
    q('mC').textContent = money(mc - ms);
    var maxM = montoComp(d.C, d.i, plazo);
    var cols = '';
    for (var y = 1; y <= plazo; y++){
      var hs = 100 * montoSimple(d.C, d.i, y) / maxM;
      var hc = 100 * montoComp(d.C, d.i, y) / maxM;
      cols += '<div class="chcol"><div class="chpair">' +
        '<div class="chbar" style="height:' + hs.toFixed(1) + '%"></div>' +
        '<div class="chbar acc" style="height:' + hc.toFixed(1) + '%"></div>' +
        '</div><div class="chl">' + y + '</div></div>';
    }
    q('chart').innerHTML = cols;
  }

  function next(){
    idx++; tries = 0;
    if (idx >= rounds.length){
      done = true;
      host.innerHTML = '<div class="gw-h">' + L({ es:'La brecha', en:'The gap' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Tres rondas resueltas. La brecha empieza casi invisible y luego se abre cada vez más rápido, porque el interés compuesto multiplica mientras el simple solo suma.',
          en:'Three rounds solved. The gap starts almost invisible and then opens faster and faster, because compound interest multiplies while simple interest only adds.'
        }) + '</div>';
      return;
    }
    plazo = 3;
    q('rp').value = plazo;
    render(); liveFb();
  }

  function check(){
    if (done) return;
    var d = rounds[idx];
    if (plazo === d.nMin){
      sayIn(q('fb'), 'good', '🎉 ' + L({ es:'Correcto: ', en:'Correct: ' }) + anios(d.nMin) +
        L({ es:'. Antes de ese año la brecha todavía no alcanzaba ', en:'. Before that year the gap had not reached ' }) + money(d.D) + '.');
      setTimeout(next, 1400);
      return;
    }
    tries++;
    if (tries >= 3){
      plazo = d.nMin;
      q('rp').value = plazo;
      render();
      sayIn(q('fb'), 'warm', L({ es:'El menor plazo es ', en:'The shortest term is ' }) + anios(d.nMin) + '. ' + L({
        es:'El interés compuesto tarda en despegar porque los primeros intereses son pequeños, pero cada año la base sobre la que se calcula es mayor.',
        en:'Compound interest takes time to lift off because the first interest amounts are small, but every year the base it is calculated on is larger.'
      }));
      setTimeout(next, 2800);
      return;
    }
    liveFb();
  }

  q('rp').addEventListener('input', function(){ plazo = parseInt(this.value, 10); render(); liveFb(); });
  q('chk').addEventListener('click', check);
  q('rp').value = plazo;
  render(); liveFb();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: la frecuencia de capitalización  (data-widget="capitaliza")
   La misma tasa nominal repartida en más periodos. Al tocar cada ficha el
   monto y la tasa efectiva se recalculan al instante; el reto es hallar la
   frecuencia más baja que alcanza la meta.
   ══════════════════════════════════════════════════════════════════════════ */
function wCapitaliza(rng, host){
  var FREQ = [1, 2, 4, 12, 365];
  function mkRound(){
    var C = 1000 * ri(rng, 10, 20), i = ri(rng, 9, 16) / 100, pl = ri(rng, 2, 4);
    var k = ri(rng, 1, 3);
    var hi = montoComp(C, i, pl, FREQ[k]), lo = montoComp(C, i, pl, FREQ[k - 1]);
    var T = Math.round(((hi + lo) / 2) / 10) * 10;
    var ans = FREQ[FREQ.length - 1];
    for (var z = 0; z < FREQ.length; z++){
      if (montoComp(C, i, pl, FREQ[z]) >= T){ ans = FREQ[z]; break; }
    }
    return { C:C, i:i, pl:pl, T:T, ans:ans };
  }
  var rounds = [mkRound(), mkRound(), mkRound()];
  var idx = 0, tries = 0, done = false, sel = null;
  function q(k){ return host.querySelector('[data-r="' + k + '"]'); }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Frecuencia de capitalización', en:'Compounding frequency' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'La tasa anual anunciada es siempre la misma; lo único que cambia es cada cuánto se agregan los intereses al capital. Toca las fichas que quieras antes de decidir.',
      en:'The advertised annual rate is always the same; the only thing that changes is how often interest joins the capital. Tap as many tiles as you like before deciding.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="tiles"></div>' +
    '<div class="metrics">' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Periodos totales', en:'Total periods' }) + '</div><div class="mnum cs" data-r="mA">-</div></div>' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Monto final', en:'Final amount' }) + '</div><div class="mnum ps" data-r="mB">-</div></div>' +
      '<div class="metric"><div class="mlbl">' + L({ es:'Tasa efectiva anual', en:'Effective annual rate' }) + '</div><div class="mnum ts" data-r="mC">-</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  function render(){
    if (done) return;
    var d = rounds[idx];
    q('q').textContent =
      L({ es:'Ronda ', en:'Round ' }) + (idx + 1) + L({ es:' de 3. ', en:' of 3. ' }) + money(d.C) +
      L({ es:' a una tasa nominal de ', en:' at a nominal rate of ' }) + pct1(d.i) +
      L({ es:' anual durante ', en:' per year for ' }) + anios(d.pl) +
      L({ es:'. ¿Cuál es la frecuencia más baja que llega al menos a ', en:'. Which is the lowest frequency that reaches at least ' }) + money(d.T) + '?';
    var html = '';
    for (var z = 0; z < FREQ.length; z++){
      var m = FREQ[z];
      html += '<button class="gw-tile' + (sel === m ? ' on' : '') + '" data-m="' + m + '">' +
        '<span class="gw-key">' + freqName(m) + '</span>' +
        '<span class="gw-sub">' + m + L({ es:' vez(ces) al año', en:' time(s) a year' }) + '</span></button>';
    }
    q('tiles').innerHTML = html;
    var btns = q('tiles').querySelectorAll('.gw-tile');
    for (var b = 0; b < btns.length; b++){
      btns[b].addEventListener('click', function(){ tap(parseInt(this.getAttribute('data-m'), 10)); });
    }
    if (sel === null){
      q('mA').textContent = '-'; q('mB').textContent = '-'; q('mC').textContent = '-';
    } else {
      q('mA').textContent = num0(sel * d.pl);
      q('mB').textContent = money(montoComp(d.C, d.i, d.pl, sel));
      q('mC').textContent = pctv(tasaEfectiva(d.i, sel));
    }
  }

  function liveFb(){
    var d = rounds[idx];
    if (sel === null){ sayIn(q('fb'), '', L({ es:'Toca una frecuencia para ver a dónde llega el dinero.', en:'Tap a frequency to see where the money lands.' })); return; }
    var M = montoComp(d.C, d.i, d.pl, sel);
    var base = L({ es:'Con capitalización ', en:'With ' }) + freqName(sel) + L({ es:' el monto llega a ', en:' compounding the amount reaches ' }) + money(M) +
      L({ es:' y la tasa efectiva anual es ', en:' and the effective annual rate is ' }) + pctv(tasaEfectiva(d.i, sel)) + '. ';
    if (M < d.T){
      sayIn(q('fb'), 'warm', base + L({ es:'La meta es ', en:'The target is ' }) + money(d.T) +
        L({ es:', así que hace falta capitalizar más seguido.', en:', so interest needs to join the capital more often.' }));
    } else if (sel > d.ans){
      sayIn(q('fb'), 'warm', base + L({ es:'Sí alcanza la meta, pero hay una frecuencia más baja que también la alcanza.', en:'It does reach the target, but a lower frequency reaches it too.' }));
    } else {
      sayIn(q('fb'), 'good', base + L({ es:'Alcanza la meta y ninguna frecuencia más baja lo hace. Confirma con Comprobar.', en:'It reaches the target and no lower frequency does. Confirm with Check.' }));
    }
  }

  function tap(m){ if (done) return; sel = (sel === m ? null : m); render(); liveFb(); }

  function next(){
    idx++; tries = 0; sel = null;
    if (idx >= rounds.length){
      done = true;
      host.innerHTML = '<div class="gw-h">' + L({ es:'Frecuencia de capitalización', en:'Compounding frequency' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Tres rondas resueltas. La misma tasa anunciada rinde distinto según cada cuánto se capitalice, y la tasa efectiva anual es la que permite comparar de verdad.',
          en:'Three rounds solved. The same advertised rate pays differently depending on how often it compounds, and the effective annual rate is what allows a real comparison.'
        }) + '</div>';
      return;
    }
    render(); liveFb();
  }

  function check(){
    if (done) return;
    var d = rounds[idx];
    if (sel === d.ans){
      sayIn(q('fb'), 'good', '🎉 ' + L({ es:'Correcto: capitalización ', en:'Correct: ' }) + freqName(d.ans) +
        L({ es:'. Con menos periodos el monto se queda por debajo de la meta.', en:' compounding. With fewer periods the amount stays below the target.' }));
      setTimeout(next, 1400);
      return;
    }
    tries++;
    if (tries >= 3){
      sel = d.ans; render();
      sayIn(q('fb'), 'warm', L({ es:'La respuesta es capitalización ', en:'The answer is ' }) + freqName(d.ans) +
        L({ es:'. Cada periodo extra parte la tasa en pedazos más pequeños, pero los aplica sobre un capital que ya creció.', en:' compounding. Each extra period splits the rate into smaller pieces, but applies them to a capital that has already grown.' }));
      setTimeout(next, 2800);
      return;
    }
    liveFb();
  }

  q('chk').addEventListener('click', check);
  render(); liveFb();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: empata la oferta  (data-widget="compara")
   Un plan de interés simple ya fijado y un plan compuesto cuya tasa mueve el
   alumno hasta que los dos montos coinciden. Las dos barras crecen en vivo y
   el texto dice de qué lado y por cuánto se está quedando.
   ══════════════════════════════════════════════════════════════════════════ */
function wIguala(rng, host){
  function mkRound(){
    var C = 1000 * ri(rng, 8, 18), a = ri(rng, 9, 18) / 100, pl = ri(rng, 2, 5);
    var MA = montoSimple(C, a, pl);
    var rS = 12 * (Math.pow(MA / C, 1 / (12 * pl)) - 1);
    return { C:C, a:a, pl:pl, MA:MA, rS: Math.round(rS * 1000) / 1000, tol: Math.max(25, MA * pl * 0.0009) };
  }
  var rounds = [mkRound(), mkRound(), mkRound()];
  var idx = 0, tries = 0, done = false, tasa = 120;
  function q(k){ return host.querySelector('[data-r="' + k + '"]'); }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Empata la oferta', en:'Match the offer' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve la tasa de tu banco hasta que las dos barras terminen a la misma altura. Puedes ajustarla las veces que quieras.',
      en:'Move your bank rate until both bars end at the same height. You can adjust it as often as you like.'
    }) + '</div>' +
    '<div class="mtr"><div class="mtr-t"><span data-r="lA"></span><span data-r="vA"></span></div><div class="mtr-b"><div class="mtr-f" data-r="fA"></div></div></div>' +
    '<div class="mtr"><div class="mtr-t"><span data-r="lB"></span><span data-r="vB"></span></div><div class="mtr-b"><div class="mtr-f acc" data-r="fB"></div></div></div>' +
    '<div class="gw-lbl">' + L({ es:'Tasa anual de tu banco, capitalizable cada mes', en:'Your bank annual rate, compounded every month' }) + '</div>' +
    '<input class="gw-range" type="range" min="40" max="260" step="1" data-r="rt">' +
    '<div class="gw-num" data-r="tv"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb" data-r="fb"></div>';

  function mb(){ var d = rounds[idx]; return montoComp(d.C, tasa / 1000, d.pl, 12); }

  function render(){
    if (done) return;
    var d = rounds[idx], MB = mb(), top = Math.max(d.MA, MB, 1);
    q('q').textContent =
      L({ es:'Ronda ', en:'Round ' }) + (idx + 1) + L({ es:' de 3. Una financiera presta ', en:' of 3. A lender offers ' }) + money(d.C) +
      L({ es:' con interés simple de ', en:' with simple interest of ' }) + pct1(d.a) + L({ es:' anual a ', en:' per year over ' }) + anios(d.pl) +
      L({ es:'. Ajusta la tasa de tu banco para que su monto final quede igual.', en:'. Adjust your bank rate so that its final amount ends up the same.' });
    q('lA').textContent = L({ es:'Financiera, interés simple', en:'Lender, simple interest' });
    q('vA').textContent = money(d.MA);
    q('lB').textContent = L({ es:'Tu banco, capitalización mensual', en:'Your bank, monthly compounding' });
    q('vB').textContent = money(MB);
    q('fA').style.width = (100 * d.MA / top).toFixed(1) + '%';
    q('fB').style.width = (100 * MB / top).toFixed(1) + '%';
    q('tv').textContent = pct1(tasa / 1000);
  }

  function liveFb(){
    var d = rounds[idx], MB = mb(), dif = MB - d.MA;
    if (Math.abs(dif) <= d.tol){
      sayIn(q('fb'), 'good', L({ es:'Las dos ofertas quedan prácticamente iguales, con una diferencia de ', en:'Both offers are practically level, with a difference of ' }) +
        money(Math.abs(dif)) + L({ es:'. Confirma con Comprobar.', en:'. Confirm with Check.' }));
    } else if (dif < 0){
      sayIn(q('fb'), 'warm', L({ es:'Tu banco se queda ', en:'Your bank falls ' }) + money(-dif) +
        L({ es:' por debajo de la financiera: sube la tasa.', en:' below the lender: raise the rate.' }));
    } else {
      sayIn(q('fb'), 'warm', L({ es:'Tu banco se pasa ', en:'Your bank goes ' }) + money(dif) +
        L({ es:' por arriba de la financiera: bájala.', en:' above the lender: lower it.' }));
    }
  }

  function next(){
    idx++; tries = 0; tasa = 120;
    if (idx >= rounds.length){
      done = true;
      host.innerHTML = '<div class="gw-h">' + L({ es:'Empata la oferta', en:'Match the offer' }) + '</div>' +
        '<div class="gw-fb good">🎉 ' + L({
          es:'Tres ofertas empatadas. Dos tasas que se ven distintas pueden costar exactamente lo mismo, y dos que se ven parecidas pueden costar muy distinto: lo que decide es el monto final.',
          en:'Three offers matched. Two rates that look different can cost exactly the same, and two that look alike can cost very differently: what decides is the final amount.'
        }) + '</div>';
      return;
    }
    q('rt').value = tasa;
    render(); liveFb();
  }

  function check(){
    if (done) return;
    var d = rounds[idx];
    if (Math.abs(mb() - d.MA) <= d.tol){
      sayIn(q('fb'), 'good', '🎉 ' + L({ es:'Empatadas. Una tasa de ', en:'Level. A rate of ' }) + pct1(tasa / 1000) +
        L({ es:' con capitalización mensual equivale a ', en:' with monthly compounding is equivalent to ' }) + pct1(d.a) +
        L({ es:' de interés simple en este plazo.', en:' of simple interest over this term.' }));
      setTimeout(next, 1600);
      return;
    }
    tries++;
    if (tries >= 3){
      tasa = Math.round(d.rS * 1000);
      q('rt').value = tasa;
      render();
      sayIn(q('fb'), 'warm', L({ es:'La tasa que empata es ', en:'The matching rate is ' }) + pct1(d.rS) + '. ' + L({
        es:'Es menor que la de la financiera porque, al capitalizar cada mes, los intereses empiezan a trabajar mucho antes.',
        en:'It is lower than the lender rate because, by compounding every month, the interest starts working much earlier.'
      }));
      setTimeout(next, 3000);
      return;
    }
    liveFb();
  }

  q('rt').addEventListener('input', function(){ tasa = parseInt(this.value, 10); render(); liveFb(); });
  q('chk').addEventListener('click', check);
  q('rt').value = tasa;
  render(); liveFb();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: tu decisión financiera  (data-widget="reflect")
   ══════════════════════════════════════════════════════════════════════════ */
function reflectTab(which, btn){
  ['type', 'draw'].forEach(function(k){
    var el = document.getElementById('reflect_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var tabs = btn.closest('.wtabs');
  if (tabs) tabs.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('reflectCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}
function reflectSave(){
  var el = document.getElementById('reflectFb');
  if (el) sayIn(el, 'good', '✓ ' + L({
    es:'Guardado. Aquí lo que cuenta es el criterio con el que decides, y ese criterio se sostiene con números.',
    en:'Saved. What counts here is the criterion you decide with, and that criterion holds up with numbers.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   PROBLEMAS GRADUADOS :: cada uno con variantes por semilla (Rule 4)
   ══════════════════════════════════════════════════════════════════════════ */
function mkP1(rng){
  var C = 1000 * ri(rng, 6, 20), i = ri(rng, 6, 15) / 100, pl = ri(rng, 2, 6);
  var I = C * i * pl, M = C + I, step = Math.max(35, C * 0.011);
  if (ri(rng, 1, 2) === 1){
    return {
      title:{ es:'Un ahorro a plazo fijo', en:'A fixed term saving' },
      q:{ es:'Una cuenta de ahorro recibe un depósito de ' + money(C) + ' y paga interés simple a una tasa de ' + pct1(i) + ' anual. El dinero permanece ' + anios(pl) + ' sin retiros ni depósitos nuevos. ¿Cuánto interés produce en todo el plazo?',
          en:'A savings account receives a deposit of ' + money(C) + ' and pays simple interest at a rate of ' + pct1(i) + ' per year. The money stays ' + anios(pl) + ' with no withdrawals and no new deposits. How much interest does it produce over the whole term?' },
      hint:{ es:'En el interés simple los intereses no se reinvierten: I = C · i · t, con la tasa en forma decimal y el tiempo en la misma unidad que la tasa.',
             en:'With simple interest the interest is not reinvested: I = C · i · t, with the rate in decimal form and the time in the same unit as the rate.' },
      exp:{ es:'I = ' + num0(C) + ' × ' + (i).toFixed(2) + ' × ' + pl + ' = ' + money(I) + '. Cada año produce ' + money(C * i) + ', siempre sobre el capital original, y el monto final sería ' + money(M) + '.',
            en:'I = ' + num0(C) + ' × ' + (i).toFixed(2) + ' × ' + pl + ' = ' + money(I) + '. Each year it produces ' + money(C * i) + ', always on the original capital, and the final amount would be ' + money(M) + '.' },
      opts: optsFrom([I, C * i, M, C * (Math.pow(1 + i, pl) - 1)], money, step),
      ci: 0, showWork: true
    };
  }
  return {
    title:{ es:'El monto que se retira', en:'The amount withdrawn' },
    q:{ es:'Un depósito de ' + money(C) + ' se coloca a interés simple de ' + pct1(i) + ' anual durante ' + anios(pl) + '. ¿Cuánto dinero se retira al final del plazo?',
        en:'A deposit of ' + money(C) + ' is placed at simple interest of ' + pct1(i) + ' per year for ' + anios(pl) + '. How much money is withdrawn at the end of the term?' },
    hint:{ es:'El monto es el capital más los intereses: M = C + C · i · t, que también se escribe M = C(1 + i · t).',
           en:'The amount is the capital plus the interest: M = C + C · i · t, which is also written M = C(1 + i · t).' },
    exp:{ es:'M = ' + num0(C) + '(1 + ' + (i).toFixed(2) + ' × ' + pl + ') = ' + money(M) + ', de los cuales ' + money(I) + ' son intereses.',
          en:'M = ' + num0(C) + '(1 + ' + (i).toFixed(2) + ' × ' + pl + ') = ' + money(M) + ', of which ' + money(I) + ' is interest.' },
    opts: optsFrom([M, I, montoComp(C, i, pl), C * (1 + i)], money, step),
    ci: 0, showWork: true
  };
}

function mkP2(rng){
  var C = 1000 * ri(rng, 5, 15), i = ri(rng, 5, 12) / 100, pl = ri(rng, 3, 7);
  var I = C * i * pl;
  if (ri(rng, 1, 2) === 1){
    var nComp = Math.round(Math.log(1 + I / C) / Math.log(1 + i));
    return {
      title:{ es:'Cuánto tiempo estuvo prestado', en:'How long the loan ran' },
      q:{ es:'Un préstamo de ' + money(C) + ' cobra interés simple a razón de ' + pct1(i) + ' anual. Al liquidarlo, los intereses acumulados fueron ' + money(I) + '. ¿Cuánto tiempo estuvo vigente el préstamo?',
          en:'A loan of ' + money(C) + ' charges simple interest at ' + pct1(i) + ' per year. On settlement, the accumulated interest came to ' + money(I) + '. How long was the loan running?' },
      hint:{ es:'De I = C · i · t se despeja el tiempo: t = I / (C · i). El denominador es el interés que se genera en un solo año.',
             en:'From I = C · i · t the time is isolated: t = I / (C · i). The denominator is the interest generated in a single year.' },
      exp:{ es:'El interés de un año es ' + num0(C) + ' × ' + (i).toFixed(2) + ' = ' + money(C * i) + '. Entonces t = ' + num0(I) + ' / ' + num0(C * i) + ' = ' + pl + ', es decir ' + anios(pl) + '.',
            en:'One year of interest is ' + num0(C) + ' × ' + (i).toFixed(2) + ' = ' + money(C * i) + '. So t = ' + num0(I) + ' / ' + num0(C * i) + ' = ' + pl + ', that is ' + anios(pl) + '.' },
      opts: optsFrom([pl, pl + 1, Math.max(1, pl - 1), nComp], anios, 1),
      ci: 0, showWork: true
    };
  }
  var iTot = I / C, iComp = Math.pow(1 + I / C, 1 / pl) - 1;
  return {
    title:{ es:'La tasa que se cobró', en:'The rate that was charged' },
    q:{ es:'Un capital de ' + money(C) + ' se prestó ' + anios(pl) + ' a interés simple y generó ' + money(I) + ' de intereses. ¿Qué tasa anual se aplicó?',
        en:'A capital of ' + money(C) + ' was lent for ' + anios(pl) + ' at simple interest and generated ' + money(I) + ' in interest. What annual rate was applied?' },
    hint:{ es:'De I = C · i · t se despeja la tasa: i = I / (C · t). El resultado sale en forma decimal y se convierte a porcentaje multiplicando por 100.',
           en:'From I = C · i · t the rate is isolated: i = I / (C · t). The result comes out in decimal form and becomes a percentage by multiplying by 100.' },
    exp:{ es:'i = ' + num0(I) + ' / (' + num0(C) + ' × ' + pl + ') = ' + (i).toFixed(4) + ', es decir ' + pctv(i) + ' anual. Dividir solo entre el capital daría el rendimiento de todo el plazo, no el de un año.',
          en:'i = ' + num0(I) + ' / (' + num0(C) + ' × ' + pl + ') = ' + (i).toFixed(4) + ', that is ' + pctv(i) + ' per year. Dividing only by the capital would give the yield of the whole term, not of one year.' },
    opts: optsFrom([i, iTot, iComp, I / (C * (pl + 1))], pctv, 0.004),
    ci: 0, showWork: true
  };
}

function mkP3(rng){
  var C = 1000 * ri(rng, 8, 20), i = ri(rng, 5, 12) / 100, n = ri(rng, 3, 6);
  var M = montoComp(C, i, n), Ic = M - C, step = Math.max(45, C * 0.013);
  if (ri(rng, 1, 2) === 1){
    return {
      title:{ es:'Un pagaré que se renueva', en:'A note that rolls over' },
      q:{ es:'Un pagaré de ' + money(C) + ' gana ' + pct1(i) + ' anual con interés compuesto y se renueva automáticamente cada año durante ' + anios(n) + '. ¿Cuál es el monto al final del plazo?',
          en:'A note of ' + money(C) + ' earns ' + pct1(i) + ' per year with compound interest and rolls over automatically every year for ' + anios(n) + '. What is the amount at the end of the term?' },
      hint:{ es:'Cada año el capital se multiplica por el mismo factor (1 + i), así que M = C(1 + i)^n con n el número de capitalizaciones.',
             en:'Every year the capital is multiplied by the same factor (1 + i), so M = C(1 + i)^n where n is the number of compounding periods.' },
      exp:{ es:'M = ' + num0(C) + ' × (1 + ' + (i).toFixed(2) + ')^' + n + ' = ' + money(M) + '. Con interés simple el mismo plazo daría ' + money(montoSimple(C, i, n)) + ', porque ahí los intereses nunca se suman al capital.',
            en:'M = ' + num0(C) + ' × (1 + ' + (i).toFixed(2) + ')^' + n + ' = ' + money(M) + '. With simple interest the same term would give ' + money(montoSimple(C, i, n)) + ', because there the interest is never added to the capital.' },
      opts: optsFrom([M, montoSimple(C, i, n), montoComp(C, i, n - 1), Ic], money, step),
      ci: 0, showWork: true
    };
  }
  return {
    title:{ es:'Lo que dejó el pagaré', en:'What the note earned' },
    q:{ es:'Una inversión de ' + money(C) + ' se mantiene ' + anios(n) + ' a ' + pct1(i) + ' anual con interés compuesto ' + freqPhrase(1) + '. ¿Cuánto interés se acumuló en total?',
        en:'An investment of ' + money(C) + ' is held for ' + anios(n) + ' at ' + pct1(i) + ' per year with compound interest ' + freqPhrase(1) + '. How much interest accumulated in total?' },
    hint:{ es:'Primero se obtiene el monto con M = C(1 + i)^n y después se resta el capital: I = M − C.',
           en:'First get the amount with M = C(1 + i)^n and then subtract the capital: I = M − C.' },
    exp:{ es:'M = ' + num0(C) + ' × (1 + ' + (i).toFixed(2) + ')^' + n + ' = ' + money(M) + ', así que I = ' + money(M) + ' − ' + money(C) + ' = ' + money(Ic) + '. El interés simple habría dado solo ' + money(C * i * n) + '.',
          en:'M = ' + num0(C) + ' × (1 + ' + (i).toFixed(2) + ')^' + n + ' = ' + money(M) + ', so I = ' + money(M) + ' − ' + money(C) + ' = ' + money(Ic) + '. Simple interest would have given only ' + money(C * i * n) + '.' },
    opts: optsFrom([Ic, C * i * n, M, C * (Math.pow(1 + i, n - 1) - 1)], money, step),
    ci: 0, showWork: true
  };
}

function mkP4(rng){
  var C = 1000 * ri(rng, 5, 12), i = ri(rng, 6, 12) / 100;
  if (ri(rng, 1, 2) === 1){
    var meta = Math.round(C * pk(rng, [1.5, 1.75, 2]) / 500) * 500;
    var n = 1;
    while (n < 60 && montoComp(C, i, n) < meta) n++;
    var nSim = 1;
    while (nSim < 200 && montoSimple(C, i, nSim) < meta) nSim++;
    return {
      title:{ es:'Alcanzar la meta', en:'Reaching the target' },
      q:{ es:'Un depósito de ' + money(C) + ' gana ' + pct1(i) + ' anual con interés compuesto ' + freqPhrase(1) + '. ¿Cuántos años completos deben pasar para que el monto llegue a ' + money(meta) + ' o lo supere?',
          en:'A deposit of ' + money(C) + ' earns ' + pct1(i) + ' per year with compound interest ' + freqPhrase(1) + '. How many whole years must pass for the amount to reach ' + money(meta) + ' or go past it?' },
      hint:{ es:'Se busca el menor entero n que cumple C(1 + i)^n ≥ meta. Se puede tantear multiplicando año con año por el factor (1 + i), o despejar con logaritmos y redondear hacia arriba.',
             en:'Look for the smallest whole n satisfying C(1 + i)^n ≥ target. You can test year by year multiplying by the factor (1 + i), or isolate it with logarithms and round up.' },
      exp:{ es:'Con ' + anios(n - 1) + ' el monto es ' + money(montoComp(C, i, n - 1)) + ', todavía por debajo; con ' + anios(n) + ' llega a ' + money(montoComp(C, i, n)) + '. La respuesta es ' + anios(n) + '. Con interés simple harían falta ' + anios(nSim) + '.',
            en:'After ' + anios(n - 1) + ' the amount is ' + money(montoComp(C, i, n - 1)) + ', still below; after ' + anios(n) + ' it reaches ' + money(montoComp(C, i, n)) + '. The answer is ' + anios(n) + '. With simple interest it would take ' + anios(nSim) + '.' },
      opts: optsFrom([n, Math.max(1, n - 1), n + 1, nSim], anios, 1),
      ci: 0, showWork: true
    };
  }
  var n2 = ri(rng, 4, 8);
  var dif = montoComp(C, i, n2) - montoSimple(C, i, n2);
  var difPrev = montoComp(C, i, n2 - 1) - montoSimple(C, i, n2 - 1);
  return {
    title:{ es:'Cuánto pesa reinvertir', en:'What reinvesting is worth' },
    q:{ es:'Dos cuentas reciben ' + money(C) + ' cada una a ' + pct1(i) + ' anual durante ' + anios(n2) + '. Una paga interés simple y la otra interés compuesto ' + freqPhrase(1) + '. ¿Cuánto más tiene al final la cuenta de interés compuesto?',
        en:'Two accounts each receive ' + money(C) + ' at ' + pct1(i) + ' per year for ' + anios(n2) + '. One pays simple interest and the other compound interest ' + freqPhrase(1) + '. How much more does the compound interest account hold at the end?' },
    hint:{ es:'Se calculan los dos montos por separado, M = C(1 + i · t) y M = C(1 + i)^n, y se restan. La diferencia es lo que aportó reinvertir los intereses.',
           en:'Work out both amounts separately, M = C(1 + i · t) and M = C(1 + i)^n, and subtract. The difference is what reinvesting the interest contributed.' },
    exp:{ es:'Compuesto: ' + money(montoComp(C, i, n2)) + '. Simple: ' + money(montoSimple(C, i, n2)) + '. La diferencia es ' + money(dif) + ', y un año antes era apenas ' + money(difPrev) + ': la brecha se abre cada vez más rápido.',
          en:'Compound: ' + money(montoComp(C, i, n2)) + '. Simple: ' + money(montoSimple(C, i, n2)) + '. The difference is ' + money(dif) + ', and one year earlier it was only ' + money(difPrev) + ': the gap opens faster and faster.' },
    opts: optsFrom([dif, montoComp(C, i, n2) - C, C * i * n2, difPrev], money, Math.max(30, C * 0.008)),
    ci: 0, showWork: true
  };
}

function mkP5(rng){
  var C = 1000 * ri(rng, 10, 25), i = ri(rng, 6, 15) / 100, pl = ri(rng, 2, 4), m = pk(rng, [4, 12]);
  var M = montoComp(C, i, pl, m), step = Math.max(50, C * 0.012);
  if (ri(rng, 1, 2) === 1){
    return {
      title:{ es:'La misma tasa, más cortes', en:'Same rate, more cuts' },
      q:{ es:'Una inversión de ' + money(C) + ' se contrata a una tasa nominal de ' + pct1(i) + ' anual ' + freqPhrase(m) + ', y se deja ' + anios(pl) + '. ¿Cuál es el monto al final?',
          en:'An investment of ' + money(C) + ' is arranged at a nominal rate of ' + pct1(i) + ' per year ' + freqPhrase(m) + ', and is left for ' + anios(pl) + '. What is the amount at the end?' },
      hint:{ es:'Cuando la capitalización no es anual, la tasa se reparte entre los periodos del año y el exponente cuenta todos los periodos: M = C(1 + i/m)^(m · t).',

      exp:{ es:'La tasa por periodo es ' + (i).toFixed(2) + ' / ' + m + ' = ' + (i / m).toFixed(5) + ' y hay ' + (m * pl) + ' periodos. M = ' + num0(C) + ' × (1 + ' + (i / m).toFixed(5) + ')^' + (m * pl) + ' = ' + money(M) + '. Capitalizando una sola vez al año habría dado ' + money(montoComp(C, i, pl)) + '.',
            en:'The rate per period is ' + (i).toFixed(2) + ' / ' + m + ' = ' + (i / m).toFixed(5) + ' and there are ' + (m * pl) + ' periods. M = ' + num0(C) + ' × (1 + ' + (i / m).toFixed(5) + ')^' + (m * pl) + ' = ' + money(M) + '. Compounding just once a year would have given ' + money(montoComp(C, i, pl)) + '.' },
      opts: optsFrom([M, montoComp(C, i, pl), montoSimple(C, i, pl), C * Math.pow(1 + i / m, pl)], money, step),
      ci: 0, showWork: true
    };
  }
  return {
    title:{ es:'El rendimiento del periodo', en:'The yield of the term' },
    q:{ es:'Un fondo recibe ' + money(C) + ' a una tasa nominal de ' + pct1(i) + ' anual ' + freqPhrase(m) + ' y se mantiene ' + anios(pl) + '. ¿Cuánto interés se acumula en todo el plazo?',
        en:'A fund receives ' + money(C) + ' at a nominal rate of ' + pct1(i) + ' per year ' + freqPhrase(m) + ' and is held for ' + anios(pl) + '. How much interest accumulates over the whole term?' },
    hint:{ es:'Primero el monto con M = C(1 + i/m)^(m · t), donde m son las capitalizaciones por año, y después I = M − C.',
           en:'First the amount with M = C(1 + i/m)^(m · t), where m is the number of compounding periods per year, and then I = M − C.' },
    exp:{ es:'M = ' + num0(C) + ' × (1 + ' + (i / m).toFixed(5) + ')^' + (m * pl) + ' = ' + money(M) + ', de modo que I = ' + money(M - C) + '. El interés simple del mismo plazo sería ' + money(C * i * pl) + '.',
          en:'M = ' + num0(C) + ' × (1 + ' + (i / m).toFixed(5) + ')^' + (m * pl) + ' = ' + money(M) + ', so I = ' + money(M - C) + '. Simple interest over the same term would be ' + money(C * i * pl) + '.' },
    opts: optsFrom([M - C, C * i * pl, montoComp(C, i, pl) - C, M], money, step),
    ci: 0, showWork: true
  };
}

function mkP6(rng){
  var i = ri(rng, 8, 22) / 100, m = pk(rng, [2, 4, 12]);
  var ie = tasaEfectiva(i, m);
  if (ri(rng, 1, 2) === 1){
    return {
      title:{ es:'Lo que de verdad cuesta al año', en:'What it really costs per year' },
      q:{ es:'Una tarjeta de crédito anuncia una tasa nominal de ' + pct1(i) + ' anual ' + freqPhrase(m) + '. ¿Cuál es su tasa efectiva anual?',
          en:'A credit card advertises a nominal rate of ' + pct1(i) + ' per year ' + freqPhrase(m) + '. What is its effective annual rate?' },
      hint:{ es:'La tasa efectiva anual es lo que rinde un peso en un año completo con esa capitalización: i efectiva = (1 + i/m)^m − 1.',
             en:'The effective annual rate is what one peso yields over a full year with that compounding: effective i = (1 + i/m)^m − 1.' },
      exp:{ es:'(1 + ' + (i / m).toFixed(5) + ')^' + m + ' − 1 = ' + (ie).toFixed(5) + ', es decir ' + pctv(ie) + '. Siempre queda por encima de la nominal ' + pct1(i) + ' porque los intereses de cada periodo generan intereses en los siguientes.',
            en:'(1 + ' + (i / m).toFixed(5) + ')^' + m + ' − 1 = ' + (ie).toFixed(5) + ', that is ' + pctv(ie) + '. It always ends up above the nominal ' + pct1(i) + ' because each period interest generates interest in the following ones.' },
      opts: optsFrom([ie, i, i / m, m * (Math.pow(1 + i, 1 / m) - 1)], pctv, 0.006),
      ci: 0, showWork: true
    };
  }
  var brecha = ie - i;
  return {
    title:{ es:'La letra pequeña', en:'The small print' },
    q:{ es:'Dos anuncios ofrecen la misma tasa nominal de ' + pct1(i) + ' anual, pero uno capitaliza una vez al año y el otro ' + freqPhrase(m) + '. ¿Por cuánto supera la tasa efectiva anual del segundo a la tasa nominal anunciada?',
        en:'Two adverts offer the same nominal rate of ' + pct1(i) + ' per year, but one compounds once a year and the other ' + freqPhrase(m) + '. By how much does the effective annual rate of the second exceed the advertised nominal rate?' },
    hint:{ es:'Se calcula la tasa efectiva con (1 + i/m)^m − 1 y se le resta la nominal. La diferencia se expresa en puntos porcentuales, no en pesos.',
           en:'Work out the effective rate with (1 + i/m)^m − 1 and subtract the nominal one. The difference is expressed in percentage points, not in pesos.' },
    exp:{ es:'La efectiva es ' + pctv(ie) + ' y la nominal ' + pct1(i) + ', así que la diferencia es ' + pts(brecha) + '. Cuando la capitalización es anual la efectiva y la nominal coinciden y la diferencia sería cero.',
          en:'The effective rate is ' + pctv(ie) + ' and the nominal one ' + pct1(i) + ', so the difference is ' + pts(brecha) + '. When compounding is yearly the effective and nominal rates coincide and the difference would be zero.' },
    opts: optsFrom([brecha, ie, i / m, tasaEfectiva(i, 365) - i], pts, 0.0031),

}
