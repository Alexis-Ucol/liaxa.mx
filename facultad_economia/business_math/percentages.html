<style>

.mcopt.pending{border-color:var(--gold);background:var(--gold-bg);}

.mcfb.show{display:block;}.mcfb.fbok{background:var(--ok-bg);color:var(--ok);}.mcfb.fbbad{background:var(--bad-bg);color:var(--bad);}
.rpanel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.8rem;text-align:center;}

.iw-fb{margin-top:.7rem;padding:.7rem .9rem;border-radius:8px;font-size:.83rem;display:none;}
.iw-fb.ok{display:block;background:var(--ok-bg);color:var(--ok);}
.iw-fb.bad{display:block;background:var(--bad-bg);color:var(--bad);}
.iw-fb.info{display:block;background:var(--green-bg);color:var(--green-dark);}
.cl-items{display:flex;flex-direction:column;gap:.6rem;}
.cl-item{display:flex;align-items:center;gap:.6rem;background:var(--surface2);border-radius:8px;padding:.7rem .9rem;font-size:.85rem;}

.cl-btn{padding:.28rem .65rem;border-radius:6px;border:1.5px solid var(--border);font-size:.75rem;cursor:pointer;background:var(--surface);color:var(--text2);font-family:inherit;transition:all .14s;}
.cl-btn:hover{border-color:var(--green);color:var(--green);}

.cl-btn.wrong-pick{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
.cl-btn.reveal-ans{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
.drill-set{background:var(--surface);border:1.5px solid var(--gold);border-radius:12px;padding:1.2rem;margin:1.2rem 0;}
.drill-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap;}

.drill-items{display:flex;flex-direction:column;gap:.7rem;}
.drill-item{background:var(--surface2);border-radius:8px;padding:.75rem .9rem;}
.di-top{display:flex;align-items:flex-start;gap:.75rem;}
.di-num{background:var(--gold);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;margin-top:.1rem;}

.di-fb{margin-top:.4rem;font-size:.82rem;padding:.35rem .65rem;border-radius:5px;display:none;}

.di-fb.bad{display:block;background:var(--bad-bg);color:var(--bad);}

.cstep.active{border-left-color:var(--gold);}
.cstep.done{border-left-color:var(--ok);}

.cs-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem;}
.cs-num{background:var(--green);color:#fff;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;}
.cs-title{font-size:.84rem;font-weight:600;}
.cs-given{font-size:.82rem;color:var(--text2);margin-bottom:.5rem;}

.cs-fb.ok{display:block;background:var(--ok-bg);color:var(--ok);}
.cs-fb.bad{display:block;background:var(--bad-bg);color:var(--bad);}

@media(max-width:600px){.wcard{padding:1.6rem 1.1rem;}.wtitle{font-size:1.35rem;}.stickybar{padding:.5rem .55rem;gap:.38rem;}.htitle{display:none;}.halexis{display:none;}.lbody{padding:1.2rem .7rem 3rem;}.section h2{font-size:1.3rem;}.rules-grid{grid-template-columns:1fr;}.metrics{grid-template-columns:repeat(2,1fr);}.gcrd{padding:.9rem .75rem;}.pbody{padding:.75rem;}.pstmt{font-size:.84rem;}.mcopt{font-size:.83rem;padding:.58rem .7rem;}.dcanvas{height:220px;}.sc-numbers{grid-template-columns:1fr 1fr;}.drill-set{padding:.9rem .75rem;}.di-input{width:100%;}.di-answer-row{gap:.4rem;}.di-vbtn{min-height:44px;padding:.5rem 1rem;}.cl-item{flex-direction:column;align-items:flex-start;gap:.5rem;}.cl-btn{min-height:44px;padding:.5rem 1rem;}.cl-btns{width:100%;}.cl-btns .cl-btn{flex:1;}.verify-btn{min-height:44px;}.iwbtn{min-height:44px;}.cs-row{flex-direction:column;align-items:stretch;}.cs-row label{margin-bottom:.2rem;}}

<body>
<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.28em;color:#1a4a8a;line-height:1;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Pricing Math in Business</div>

    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>

    <div class="serr" id="startErr"></div>
    <div id="restoreBar">

    </div>

        <line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/>
        <text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text>
      </svg>
    </div>
  </div>
</div>
<!-- LESSON -->

function buildLesson(rng) {
  /*
   * CONCEPT ARC
   * topic        : Pricing Math in Business — Markup, Margin, Discounts, Taxes
   * prerequisite : Basic algebra; ability to multiply and divide decimals.
   * sequence     :
   *   1. How businesses set prices — the markup decision (context-first)
   *   2. Gross margin — reading profitability from the income side
   *   3. Discount strategy — single and compound discounts in retail/supply chain
   *   4. Tax pass-through — how IVA/sales tax flows through the pricing chain
   *   5. Full pricing chain — real business scenarios combining all four
   * why_this_order: Markup is the entry point (businesses price before they sell);
   *   margin requires knowing markup to contrast the two bases; discounts require
   *   understanding the factor structure before composing two reductions; tax is
   *   always last in the chain, so it comes last conceptually.

  var lb = document.getElementById('lessonBody');

    {name:'TechZone', type:'Retail: electronics', icon:'💻', product:'wireless headphones'},
    {name:'Fresh & Co.', type:'Grocery retail', icon:'🥑', product:'specialty produce pack'},
    {name:'SportMax', type:'Sporting goods', icon:'⚽', product:'running shoes'},
    {name:'Bella Cucina', type:'Restaurant supply', icon:'🍽️', product:'kitchen equipment set'},
  ];
  var restaurantScenarios = [
    {name:'La Palapa', type:'Casual dining', icon:'🌮', product:'signature taco plate'},
    {name:'The Corner Café', type:'Coffee shop', icon:'☕', product:'specialty latte'},
    {name:'Sakura Grill', type:'Japanese restaurant', icon:'🍱', product:'bento box lunch'},

    {name:'ProBuild Supply', type:'Building materials distributor', icon:'🏗️', product:'lumber bundle'},
    {name:'MediCare Logistics', type:'Medical supply distributor', icon:'🏥', product:'PPE kit'},

  /* ── Random numbers ── */

  var sp2 = cost2*(1+rate2/100), margin2 = (sp2-cost2)/sp2*100;
  var sp3 = cost3*(1+rate3/100), margin3 = (sp3-cost3)/sp3*100;
  var listD = ri(rng,500,2500), d1 = ri(rng,10,25), d2 = ri(rng,5,18);
  var aft1 = listD*(1-d1/100), finalD = aft1*(1-d2/100);
  var equiv = (1-(1-d1/100)*(1-d2/100))*100;

  /* Problem seeds */

  var p2sp=ri(rng,400,1800),p2c=Math.round(p2sp*(ri(rng,35,65)/100)),p2m=(p2sp-p2c)/p2sp*100;
  var p3sp=ri(rng,600,2000),p3m=ri(rng,22,55),p3c=p3sp*(1-p3m/100);

  var p8tot=ri(rng,600,2200),p8pre=p8tot/1.16;
  var p9c=ri(rng,50,400),p9r=ri(rng,150,350),p9sp=p9c*(1+p9r/100),p9mg=(p9sp-p9c)/p9sp*100;
  var p10l=ri(rng,1000,4000),p10d1=ri(rng,10,20),p10d2=ri(rng,5,15),p10f=p10l*(1-p10d1/100)*(1-p10d2/100)*1.16;

  /* ── Drill Set 1: markup mechanics ── */

  var k1b=ri(rng,120,1100),k1br=ri(rng,20,70);
  var k1c=ri(rng,90,800),  k1cr=ri(rng,25,65), k1csp=k1c*(1+k1cr/100);
  var k1d=ri(rng,110,950), k1dr=ri(rng,18,55), k1dsp=k1d*(1+k1dr/100);
  var k1e=ri(rng,60,700),  k1er=ri(rng,30,80), k1esp=k1e*(1+k1er/100);

  /* ── Drill Set 2: margin mechanics ── */
  var k2sp=ri(rng,400,1900), k2c=Math.round(k2sp*(ri(rng,35,68)/100));
  var k2m=(k2sp-k2c)/k2sp*100, k2mu=(k2sp-k2c)/k2c*100;
  var k2bsp=ri(rng,500,2200), k2bm=ri(rng,25,58), k2bc=k2bsp*(1-k2bm/100);
  var k2cc=ri(rng,150,900),   k2cr=ri(rng,25,70);
  var k2csp=k2cc*(1+k2cr/100), k2cmg=(k2csp-k2cc)/k2csp*100;
  var k2dc=ri(rng,120,800),   k2dm=ri(rng,30,60), k2dsp=k2dc/(1-k2dm/100);

  /* ── Drill Set 3: discount mechanics ── */
  var k3l=ri(rng,400,2400),  k3d=ri(rng,8,35);
  var k3bl=ri(rng,600,2800), k3bd1=ri(rng,10,28), k3bd2=ri(rng,5,20);
  var k3cl=ri(rng,500,2000), k3cd=ri(rng,12,30), k3cf=k3cl*(1-k3cd/100);
  var k3ed1=ri(rng,10,30),   k3ed2=ri(rng,6,22);
  var k3fl=ri(rng,700,2600), k3fd1=ri(rng,12,26), k3fd2=ri(rng,5,18);

  /* ── Drill Set 4: IVA mechanics ── */
  var k4pre=ri(rng,250,1600);
  var k4tot=ri(rng,500,2400);
  var k4tot2=ri(rng,400,2000);
  var k4l=ri(rng,600,2200), k4d=ri(rng,10,30);

  /* ── Widget rounds ── */
  var wdRounds=[
    {l:ri(rng,600,1800), a:ri(rng,12,25), b:ri(rng,6,16)},
    {l:ri(rng,900,2600), a:ri(rng,15,30), b:ri(rng,8,20)},
    {l:ri(rng,400,1500), a:ri(rng,10,22), b:ri(rng,5,14)}
  ];
  var wvRounds=[
    {kind:'add',    v:ri(rng,280,1500)},
    {kind:'strip',  v:ri(rng,600,2400)},
    {kind:'taxonly',v:ri(rng,500,2100)}
  ];
  var cbCost=ri(rng,180,900), cbMk=ri(rng,25,65), cbDisc=ri(rng,10,28);
  var cbSp=cbCost*(1+cbMk/100), cbAfter=cbSp*(1-cbDisc/100);
  var cbTotal=cbAfter*1.16, cbMargin=(cbAfter-cbCost)/cbAfter*100;

  /* ── Final assessment: compare two supplier offers ── */
  var cmpL=ri(rng,1200,3600), cmpA=ri(rng,22,32), cmpB1=ri(rng,12,18), cmpB2=ri(rng,8,14);
  var cmpAf=cmpL*(1-cmpA/100), cmpBf=cmpL*(1-cmpB1/100)*(1-cmpB2/100);
  if(Math.abs(cmpAf-cmpBf)<cmpL*0.02){cmpA=cmpA+5;cmpAf=cmpL*(1-cmpA/100);}
  var cmpBest=Math.min(cmpAf,cmpBf), cmpWorst=Math.max(cmpAf,cmpBf);
  var cmpSum=cmpL*(1-(cmpB1+cmpB2)/100), cmpMix=cmpL*(1-cmpA/100)*(1-cmpB1/100);

  /* ══════════════════════════════════════════
     SECTION 1 — Markup: How businesses set prices
  ══════════════════════════════════════════ */
  addSection(function(L){
    var es=L==='es';
    return '<div class="stag">'+(es?'Sección 1':'Section 1')+'</div>'+
    '<h2>'+(es?'Recargo: cómo los negocios fijan sus precios':'Markup: how businesses set their prices')+'</h2>'+
    '<p>'+(es?'Toda decisión de precio comienza con el costo. El recargo es el porcentaje que un negocio agrega al costo para obtener el precio de venta, de modo que cubra los gastos generales y aún genere utilidad.':'Every pricing decision starts with cost. Markup is the percentage a business adds to its cost to arrive at the selling price, so that it covers overhead and still generates profit.')+'</p>'+

    '</div></div>'+

  });

  /* Widget 1 — Mode B: Pricing Simulator */

    var indScenarios=[

      var corrText=p.options?pdfText(p.options[p.correctIdx]||''):'';
      var expRaw=pdfText(p.explanation||'');

      doc.setFontSize(8.5);var chLines=doc.splitTextToSize(t('pdf-yours')+chosenText,TW-18);
      doc.setFontSize(8);  var coLines=doc.splitTextToSize(t('pdf-key')+corrText,TW-18);
      doc.setFontSize(7.5);var exLines=doc.splitTextToSize(t('pdf-sol')+expRaw,TW-18).slice(0,4);
      var ansBoxH=8+chLines.length*5.5+coLines.length*5+exLines.length*5+6;
      doc.setFillColor(isOk?232:255,isOk?240:232,isOk?232:228);
      doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
      doc.setFillColor(isOk?26:176,isOk?106:48,isOk?74:16);
      doc.circle(M+7,wy+8,3.5,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
      doc.text(isOk?'v':'x',M+5.2,wy+10.5);
      var ay=wy+7;
      doc.setTextColor(20,24,32);doc.setFontSize(8.5);doc.setFont('helvetica','bold');
      chLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5.5);});
      ay+=chLines.length*5.5+3;
      doc.setTextColor(26,106,74);doc.setFontSize(8);doc.setFont('helvetica','normal');
      coLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5);});
      ay+=coLines.length*5+3;
      doc.setTextColor(90,85,80);doc.setFontSize(7.5);
      exLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5);});
      wy+=ansBoxH+5;
    });

    /* ── Footer on every page ── */
    var pages=doc.internal.getNumberOfPages();
    for(var pg=1;pg<=pages;pg++){
      doc.setPage(pg);
      doc.setFillColor(pAR,pAG,pAB);doc.rect(0,PH-3,PW,3,'F');
      doc.setTextColor(130,140,160);doc.setFontSize(6.5);doc.setFont('helvetica','normal');
      doc.text(name+'  \xb7  '+group+'  \xb7  '+t('pdf-code')+code+'  \xb7  '+t('pdf-page')+pg+'/'+pages,PW/2,PH-5,{align:'center'});
    }

    /* ── Delivery ── */
    var _fn=SCHOOL.filePrefix+'_'+name.replace(/\s+/g,'_')+'_'+group.replace(/\s+/g,'_')+'.pdf';
    var _blob=doc.output('blob');
    var _isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(_isIOS){
      var _file=new File([_blob],_fn,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[_file]})){
        navigator.share({files:[_file],title:_fn}).then(function(){_rb();}).catch(function(e){if(e&&e.name==='AbortError'){_rb();return;}_oi(_blob);_rb();});
        return;
      }
      _oi(_blob);_rb();return;
    }
    var _u=URL.createObjectURL(_blob);
    var _a=document.createElement('a');_a.href=_u;_a.download=_fn;
    document.body.appendChild(_a);_a.click();
    setTimeout(function(){document.body.removeChild(_a);URL.revokeObjectURL(_u);},200);
    _rb();
  }catch(err){console.error(err);_rb();}
}
</script>
