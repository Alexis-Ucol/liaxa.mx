<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distancia entre Puntos y Distancia Punto-Recta</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS DE ESTA GUÍA (distancias) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:250px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:130px; accent-color:var(--green); height:34px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:74px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:62px; text-align:right; }
.livelbl { margin-top:.55rem; font-size:.88rem; color:var(--text2); }
.livelbl b { color:var(--green-dark); }
.statline { margin-top:.35rem; font-size:.84rem; color:var(--text3); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.stepslist { margin:.9rem 0 0; padding-left:1.1rem; }
.stepslist li { font-size:.86rem; color:var(--text2); margin-bottom:.35rem; }
@media (max-width: 600px) {
  .defgrid { grid-template-columns:1fr; }
  .gcanvas { height:225px; }
  .klbl { min-width:62px; font-size:.74rem; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Distancia entre Puntos y Distancia Punto-Recta</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Distancia entre Puntos y Distancia Punto-Recta</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

  var lx = PW - M - 36;

  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];

  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {

      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');

    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');

  // ── Per-problem pages ──

    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');

    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);

    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;

      } catch(e) {}

      if (wy > PH-30) { doc.addPage(); wy = 20; }

      var taLines = doc.splitTextToSize(ta.value, TW);

      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat1_t11_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
/* ================================================
   buildLesson: Distancia entre puntos y distancia punto-recta (1o de Secundaria)
   Interleaved: idea -> manipulativo -> problema(s). Cards built inline.
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 330;
    var h = cv.clientHeight || 250;
    cv.width  = Math.round(w*dpr);
    cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function dot(ctx, x, y, r, col){
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  function label(ctx, s, x, y, col, w, h){
    ctx.fillStyle = col;
    ctx.font = '600 13px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s, Math.max(18, Math.min(w-18, x)), Math.max(13, Math.min(h-4, y)));
  }
  function num1(x){ return (Math.round(x*10)/10).toFixed(1); }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES SEMBRADOS (se sacan una sola vez, en orden fijo)
     ============================================================ */
  var v1 = Math.floor(rng()*2), v2 = Math.floor(rng()*2), v3 = Math.floor(rng()*2);
  var v4 = Math.floor(rng()*2), v5 = Math.floor(rng()*2), v6 = Math.floor(rng()*2);
  var v7 = Math.floor(rng()*2), v8 = Math.floor(rng()*2), v9 = Math.floor(rng()*2);
  var v10 = Math.floor(rng()*2);

  var a1 = ri(1,4), b1 = a1 + ri(5,8), k1 = ri(2,9), d1 = b1 - a1;      // P1
  var p2 = ri(2,5), d2 = ri(6,9), q2 = p2 + d2;                          // P2
  var L4 = ri(1,4), d4 = ri(5,9), ph4 = L4 + d4, px4 = ri(2,9);          // P4
  var h6 = ri(1,4), d6 = ri(6,10), h6b = h6 + d6;                        // P6
  var s1 = ri(4,7), s2 = s1 + ri(2,5);                                   // P8
  var t9 = ri(3,6);                                                      // P9
  var hr = ri(1,3), A10 = 2*ri(2,3), D10 = 2*ri(1,2)+1;                  // P10
  var B10 = A10 + D10, hs = hr + A10, ht = hs + B10;

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Qué número es una distancia', en:'What number a distance is'}),
      '<p>'+T({
        es:'Cuando dices que dos puntos están a cierta distancia estás hablando de una sola cosa: la longitud del segmento que va de uno al otro sin desviarse. Ese segmento es único, porque por dos puntos pasa una sola recta, y el número que mide su longitud es lo que llamamos distancia entre esos dos puntos.',
        en:'When you say that two points are a certain distance apart you are talking about one single thing: the length of the segment that goes from one to the other without turning. That segment is unique, because only one line passes through two points, and the number that measures its length is what we call the distance between those two points.'
      })+'</p>'+
      '<p>'+T({
        es:'En una cuadrícula esto es muy fácil de contar cuando los dos puntos comparten fila o comparten columna: basta con contar las casillas que hay que recorrer de uno al otro. Y da lo mismo desde cuál de los dos empieces, porque de A hasta B hay exactamente lo mismo que de B hasta A. Una distancia nunca lleva dirección, solo tamaño.',
        en:'On a grid this is very easy to count when the two points share a row or share a column: you just count the cells you have to travel from one to the other. And it makes no difference which one you start from, because from A to B there is exactly the same as from B to A. A distance never carries direction, only size.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Distancia',en:'Distance'})+'</div><div class="deftxt">'+T({es:'La longitud del segmento que une los dos puntos.',en:'The length of the segment joining the two points.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Misma fila',en:'Same row'})+'</div><div class="deftxt">'+T({es:'Se cuentan las casillas que separan una columna de la otra.',en:'You count the cells separating one column from the other.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Misma columna',en:'Same column'})+'</div><div class="deftxt">'+T({es:'Se cuentan las casillas que separan una altura de la otra.',en:'You count the cells separating one height from the other.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Sin dirección',en:'No direction'})+'</div><div class="deftxt">'+T({es:'De A a B y de B a A dan el mismo número.',en:'From A to B and from B to A give the same number.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 1: estira el segmento sobre la regla ---- */
  (function(){
    var wrap = widget('segmento');
    var MAXU = 14;
    var RS = [
      { a: ri(1,3),  t: ri(5,8), side:'der' },
      { a: ri(9,12), t: ri(5,8), side:'izq' },
      { a: ri(5,7),  t: ri(4,6), side:'der' }
    ];
    var st = { r:0, b:0, tries:0, done:false, lock:false };
    function rd(){ return RS[st.r]; }
    function tgtB(){ var o=rd(); return o.side==='der' ? o.a+o.t : o.a-o.t; }
    function reset(){
      var o = rd();
      st.b = o.side==='der' ? Math.max(0, o.a-3) : Math.min(MAXU, o.a+3);
      st.tries = 0;
    }
    function dAB(){ return Math.abs(st.b - rd().a); }
    function sideOk(){ var o=rd(); return o.side==='der' ? (st.b > o.a) : (st.b < o.a); }
    function draw(){
      var cv = document.getElementById('sgCv'); if (!cv) return;
      var g = fitCv(cv), ctx = g.ctx, w = g.w, h = g.h, i;
      var s  = (w-36)/MAXU, x0 = 18, yl = h*0.6;
      var bd = cssv('--border'), sub = cssv('--text3'), txt = cssv('--text');
      var col = cssv('--green'), dk = cssv('--green-dark'), acc = cssv('--gold');
      var o = rd();
      ctx.strokeStyle = bd; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, yl); ctx.lineTo(x0+MAXU*s, yl); ctx.stroke();
      ctx.font = '500 10px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
      for (i=0;i<=MAXU;i++){
        ctx.strokeStyle = bd;
        ctx.beginPath(); ctx.moveTo(x0+i*s, yl-4); ctx.lineTo(x0+i*s, yl+4); ctx.stroke();
        if (i % 2 === 0){ ctx.fillStyle = sub; ctx.fillText(String(i), x0+i*s, yl+18); }
      }
      var xa = x0 + o.a*s, xb = x0 + st.b*s;
      ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(xa, yl-16); ctx.lineTo(xb, yl-16); ctx.stroke();
      dot(ctx, xa, yl-16, 5.5, dk);
      dot(ctx, xb, yl-16, 5.5, acc);
      label(ctx, 'A', xa, yl-26, dk, w, h);
      label(ctx, 'B', xb, yl-26, acc, w, h);
      label(ctx, dAB()+' '+T({es:'u',en:'u'}), (xa+xb)/2, yl-40, txt, w, h);
    }
    function upd(){
      var e1 = document.getElementById('sgPos'); if (e1) e1.textContent = st.b;
      var e2 = document.getElementById('sgLen'); if (e2) e2.textContent = dAB()+' u';
      var e3 = document.getElementById('sgStat');
      if (e3){
        var o = rd();
        e3.textContent = sideOk()
          ? T({es:'B está del lado pedido y el segmento mide '+dAB()+' unidades.',
               en:'B is on the requested side and the segment measures '+dAB()+' units.'})
          : T({es:'Ojo: B todavía no está del lado que pide la instrucción.',
               en:'Careful: B is not yet on the side the instruction asks for.'});
      }
    }
    function goalTxt(){
      var o = rd();
      return o.side === 'der'
        ? T({es:'Coloca B a la derecha de A de modo que el segmento AB mida '+o.t+' unidades.',
             en:'Place B to the right of A so that segment AB measures '+o.t+' units.'})
        : T({es:'Coloca B a la izquierda de A de modo que el segmento AB mida '+o.t+' unidades.',
             en:'Place B to the left of A so that segment AB measures '+o.t+' units.'});
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Estira el segmento', en:'Stretch the segment'})+'</div>'+
          '<div class="iw-box"><div class="rfb"><span class="okmsg">'+T({
            es:'Listo. Armaste el mismo tipo de segmento hacia la derecha y hacia la izquierda: la distancia salió del conteo de casillas, no del lado hacia el que apunta.',
            en:'Done. You built the same kind of segment to the right and to the left: the distance came out of counting cells, not out of the side it points to.'
          })+'</span></div></div>';
        return;
      }
      var o = rd();
      wrap.innerHTML =

  (function(){

    function reset(){
      var o = rd();
      if (o.mode === 'max'){ st.b = 3; st.c = Math.min(MAXS, o.cF + 2); }
      else { st.b = 2; st.c = 2; }
      st.tries = 0;
    }

      var cv = document.getElementById('trCv'); if (!cv) return;

        if (st.b + st.c < a){
          ctx.strokeStyle = bad; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(X(st.b), yo); ctx.lineTo(X(a-st.c), yo); ctx.stroke();
          label(ctx, T({es:'faltan ',en:'missing '})+(a-st.b-st.c)+' u', X((st.b+a-st.c)/2), yo-9, bad, w, h);
        }
      }
    }
    function statTxt(){
      var o = rd(), a = o.a, sum = st.b + st.c;
      if (valid()) return T({es:'Los dos brazos se juntan arriba de la base: el triángulo cierra.',
                             en:'The two arms meet above the base: the triangle closes.'});
      if (st.b > a + st.c) return T({es:'El brazo izquierdo mide más que la base y el brazo derecho juntos, así que nunca se cierra.',
                                     en:'The left arm measures more than the base and the right arm together, so it never closes.'});
      if (st.c > a + st.b) return T({es:'El brazo derecho mide más que la base y el brazo izquierdo juntos, así que nunca se cierra.',
                                     en:'The right arm measures more than the base and the left arm together, so it never closes.'});
      if (sum === a) return T({es:'Los brazos se tocan justo sobre la base: la figura queda plana y no es un triángulo.',
                               en:'The arms touch right on the base: the figure lies flat and is not a triangle.'});
      return T({es:'A los dos brazos les faltan '+(a-sum)+' unidades para tocarse.',
                en:'The two arms are '+(a-sum)+' units short of touching.'});
    }
    function upd(){
      var e1 = document.getElementById('trB'); if (e1) e1.textContent = st.b+' u';
      var e2 = document.getElementById('trC'); if (e2) e2.textContent = st.c+' u';
      var e3 = document.getElementById('trSum'); if (e3) e3.textContent = (st.b+st.c)+' u';
      var e4 = document.getElementById('trStat'); if (e4) e4.textContent = statTxt();
    }
    function goalTxt(){
      var o = rd();
      if (o.mode === 'close') return T({es:'Ajusta los dos brazos hasta que el triángulo cierre.',
                                        en:'Adjust both arms until the triangle closes.'});
      if (o.mode === 'flat')  return T({es:'Consigue que los dos brazos juntos midan exactamente lo mismo que la base y observa qué figura queda.',
                                        en:'Make the two arms together measure exactly the same as the base and see what figure is left.'});
      return T({es:'Deja el brazo derecho en '+o.cF+' unidades y encuentra el brazo izquierdo entero más largo con el que el triángulo todavía cierra.',
                en:'Leave the right arm at '+o.cF+' units and find the longest whole left arm for which the triangle still closes.'});
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Cierra el triángulo', en:'Close the triangle'})+'</div>'+
          '<div class="iw-box"><div class="rfb"><span class="okmsg">'+T({
            es:'Ya viste los tres casos: brazos que alcanzan, brazos que quedan exactamente planos y el punto justo donde uno de ellos deja de servir. La figura cierra mientras dos lados juntos superen al tercero.',
            en:'You have seen the three cases: arms that reach, arms that end up exactly flat and the precise point where one of them stops working. The figure closes as long as two sides together beat the third.'
          })+'</span></div></div>';
        return;
      }
      var o = rd();
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Cierra el triángulo', en:'Close the triangle'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'La base está fija y mide '+o.a+' unidades. Alarga o acorta los dos brazos y observa si sus puntas alcanzan a juntarse.',
            en:'The base is fixed and measures '+o.a+' units. Lengthen or shorten the two arms and watch whether their tips manage to meet.'
          })+'</div>'+
          '<div class="goalbar">'+goalTxt()+'</div>'+
          '<canvas class="gcanvas" id="trCv"></canvas>'+
          '<div class="krow"><span class="klbl">'+T({es:'Brazo izq.',en:'Left arm'})+'</span><input type="range" min="1" max="'+MAXS+'" value="'+st.b+'" oninput="trSlideB(this.value)"><span class="kval" id="trB">'+st.b+' u</span></div>'+
          '<div class="krow"><span class="klbl">'+T({es:'Brazo der.',en:'Right arm'})+'</span><input type="range" min="1" max="'+MAXS+'" value="'+st.c+'" oninput="trSlideC(this.value)"><span class="kval" id="trC">'+st.c+' u</span></div>'+
          '<div class="livelbl">'+T({es:'Los dos brazos juntos miden ',en:'The two arms together measure '})+'<b id="trSum">'+(st.b+st.c)+' u</b></div>'+
          '<div class="statline" id="trStat"></div>'+
          '<button class="rverify-btn" onclick="trChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="trFb"></div>'+
        '</div>';
      draw(); upd();
      setTimeout(function(){ draw(); }, 160);
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.r++; st.lock = false;
        if (st.r >= 3) st.done = true; else reset();
        render();
      }, ms);
    }
    window.trSlideB = function(val){
      if (st.done || st.lock) return;
      st.b = parseInt(val,10) || 1;
      draw(); upd();
    };
    window.trSlideC = function(val){
      if (st.done || st.lock) return;
      st.c = parseInt(val,10) || 1;
      draw(); upd();
    };
    window.trChk = function(){
      if (st.done || st.lock) return;
      var fb = document.getElementById('trFb'); if (!fb) return;
      var o = rd(), a = o.a, sum = st.b + st.c;
      if (o.mode === 'close'){
        if (valid()){
          fb.innerHTML = '<span class="okmsg">'+T({
            es:'Cerró: los brazos suman '+sum+' unidades y eso alcanza a superar los '+a+' de la base.',
            en:'It closed: the arms add up to '+sum+' units and that is enough to beat the '+a+' of the base.'
          })+'</span>';
          adv(1900); return;
        }
        st.tries++;
        if (st.tries >= 3){
          st.b = Math.ceil(a/2)+1; st.c = Math.ceil(a/2)+1; draw(); upd();
          fb.innerHTML = T({es:'Así cierra: con brazos de '+st.b+' y '+st.c+' unidades, su suma pasa de los '+a+' de la base.',
                            en:'Like this it closes: with arms of '+st.b+' and '+st.c+' units, their sum goes past the '+a+' of the base.'});
          adv(2800); return;
        }
        fb.textContent = (st.b > a + st.c || st.c > a + st.b)
          ? T({es:'Un brazo se alargó demasiado y ya rebasa a los otros dos lados juntos. Recórtalo.',
               en:'One arm grew too long and now beats the other two sides together. Cut it back.'})
          : T({es:'Los brazos suman '+sum+' y la base mide '+a+': todavía no alcanzan. Alarga alguno de los dos.',
               en:'The arms add up to '+sum+' and the base measures '+a+': they still do not reach. Lengthen one of them.'});
        return;
      }
      if (o.mode === 'flat'){
        if (sum === a){
          fb.innerHTML = '<span class="okmsg">'+T({
            es:'Ahí está el caso límite: los brazos suman exactamente '+a+' y la figura se aplasta sobre la base, así que no hay triángulo.',
            en:'There is the borderline case: the arms add up to exactly '+a+' and the figure flattens onto the base, so there is no triangle.'
          })+'</span>';
          adv(2400); return;
        }
        st.tries++;
        if (st.tries >= 3){
          st.b = Math.floor(a/2); st.c = a - st.b; draw(); upd();
          fb.innerHTML = T({es:'Así queda: '+st.b+' y '+st.c+' suman los '+a+' de la base y la figura se aplasta.',
                            en:'Here it is: '+st.b+' and '+st.c+' add up to the '+a+' of the base and the figure flattens.'});
          adv(2800); return;
        }
        fb.textContent = sum < a
          ? T({es:'Los brazos suman '+sum+' y la base mide '+a+': alárgalos hasta que la suma llegue a '+a+'.',
               en:'The arms add up to '+sum+' and the base measures '+a+': lengthen them until the sum reaches '+a+'.'})
          : T({es:'Los brazos suman '+sum+' y la base mide '+a+': recórtalos hasta que la suma baje a '+a+'.',
               en:'The arms add up to '+sum+' and the base measures '+a+': shorten them until the sum drops to '+a+'.'});
        return;
      }
      var tgt = a + o.cF - 1;
      if (st.c === o.cF && st.b === tgt){
        fb.innerHTML = '<span class="okmsg">'+T({
          es:'Correcto: con '+tgt+' todavía cierra, y una unidad más ya rebasaría a la base y al otro brazo juntos.',
          en:'Correct: with '+tgt+' it still closes, and one unit more would already beat the base and the other arm together.'
        })+'</span>';
        adv(2400); return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.c = o.cF; st.b = tgt; draw(); upd();
        fb.innerHTML = T({es:'Así queda: el brazo izquierdo más largo que todavía cierra mide '+tgt+' unidades.',
                          en:'Here it is: the longest left arm that still closes measures '+tgt+' units.'});
        adv(2900); return;
      }
      if (st.c !== o.cF){
        fb.textContent = T({es:'Primero deja el brazo derecho exactamente en '+o.cF+' unidades.',
                            en:'First leave the right arm at exactly '+o.cF+' units.'});
        return;
      }
      fb.textContent = valid()
        ? T({es:'Con '+st.b+' el triángulo todavía cierra, así que puedes estirar más el brazo izquierdo.',
             en:'With '+st.b+' the triangle still closes, so you can stretch the left arm further.'})
        : T({es:'Con '+st.b+' el brazo izquierdo ya rebasa a los otros dos lados juntos. Recórtalo un poco.',
             en:'With '+st.b+' the left arm already beats the other two sides together. Cut it back a little.'});
    };
    reset(); render();
  })();

  /* ---- PROBLEMA 8 ---- */
  addProb(v8 === 0 ? {
    title:{es:'El tercer lado más largo', en:'The longest third side'},
    q:{es:'Dos lados de un triángulo miden '+s1+' y '+s2+' unidades. El tercer lado debe medir un número entero de unidades. ¿Cuál es el mayor valor que puede tomar?',
       en:'Two sides of a triangle measure '+s1+' and '+s2+' units. The third side must measure a whole number of units. What is the largest value it can take?'},
    options:[String(s1+s2-1), String(s1+s2), String(s1+s2+1), String(s2-s1+1)],
    correct:String(s1+s2-1),
    hint:{es:'Los dos lados conocidos forman un camino de dos tramos entre los extremos del tercero, y ese camino tiene que resultar más largo que el tercer lado.',
          en:'The two known sides form a two stretch path between the ends of the third one, and that path has to come out longer than the third side.'},
    exp:{es:'Los dos lados conocidos suman '+s1+' + '+s2+' = '+(s1+s2)+' unidades. Si el tercero llegara a esa medida la figura quedaría plana, así que debe quedar por debajo: el mayor entero posible es '+(s1+s2)+' − 1 = '+(s1+s2-1)+'.',
         en:'The two known sides add up to '+s1+' + '+s2+' = '+(s1+s2)+' units. If the third one reached that measure the figure would lie flat, so it must stay below: the largest whole number possible is '+(s1+s2)+' − 1 = '+(s1+s2-1)+'.'},
    showWork:true
  } : {
    title:{es:'El tercer lado más corto', en:'The shortest third side'},
    q:{es:'Dos lados de un triángulo miden '+s1+' y '+s2+' unidades. El tercer lado debe medir un número entero de unidades. ¿Cuál es el menor valor que puede tomar?',
       en:'Two sides of a triangle measure '+s1+' and '+s2+' units. The third side must measure a whole number of units. What is the smallest value it can take?'},
    options:[String(s2-s1+1), String(s2-s1), String(s2-s1-1), String(s1+s2-1)],
    correct:String(s2-s1+1),
    hint:{es:'Ahora el lado largo es el de '+s2+' unidades, y los otros dos juntos tienen que superarlo para que la figura cierre.',
          en:'Now the long side is the one of '+s2+' units, and the other two together have to beat it for the figure to close.'},
    exp:{es:'El tercer lado junto con el de '+s1+' debe superar al de '+s2+', así que tiene que pasar de '+s2+' − '+s1+' = '+(s2-s1)+' unidades. El menor entero que lo logra es '+(s2-s1)+' + 1 = '+(s2-s1+1)+'.',
         en:'The third side together with the one of '+s1+' must beat the one of '+s2+', so it has to go past '+s2+' − '+s1+' = '+(s2-s1)+' units. The smallest whole number that manages it is '+(s2-s1)+' + 1 = '+(s2-s1+1)+'.'},
    showWork:true
  });

  /* ============================================================
     CIERRE
     ============================================================ */
  sec(T({es:'Cierre', en:'Wrap up'}), T({es:'Junta todo lo anterior', en:'Put it all together'}), '');

  /* ---- PROBLEMA 9 ---- */
  addProb(v9 === 0 ? {
    title:{es:'La terna que sí arma', en:'The triple that works'},
    q:{es:'¿Cuál de estas ternas de longitudes sí puede formar un triángulo?',
       en:'Which of these triples of lengths can actually form a triangle?'},
    options:{es:[t9+', '+(t9+2)+' y '+(t9+3)+' unidades',
                 t9+', '+(t9+1)+' y '+(2*t9+2)+' unidades',
                 t9+', '+(t9+3)+' y '+(2*t9+4)+' unidades',
                 (t9+1)+', '+(t9+2)+' y '+(2*t9+3)+' unidades'],
             en:[t9+', '+(t9+2)+' and '+(t9+3)+' units',
                 t9+', '+(t9+1)+' and '+(2*t9+2)+' units',
                 t9+', '+(t9+3)+' and '+(2*t9+4)+' units',
                 (t9+1)+', '+(t9+2)+' and '+(2*t9+3)+' units']},
    correct:{es:t9+', '+(t9+2)+' y '+(t9+3)+' unidades',
             en:t9+', '+(t9+2)+' and '+(t9+3)+' units'},
    hint:{es:'En cada terna, junta las dos longitudes más chicas y compáralas con la más grande.',
          en:'In each triple, put the two smaller lengths together and compare them with the largest one.'},
    exp:{es:'En la terna correcta, las dos longitudes más chicas juntas dan '+(2*t9+2)+' unidades y eso supera a la más grande, que es '+(t9+3)+', así que la figura cierra. En las otras tres las dos chicas se quedan cortas o apenas empatan con la grande, y el triángulo no se arma.',
         en:'In the correct triple, the two smaller lengths together give '+(2*t9+2)+' units and that beats the largest one, which is '+(t9+3)+', so the figure closes. In the other three the two small ones fall short or barely tie the large one, and the triangle does not come together.'},
    showWork:true
  } : {
    title:{es:'La terna que no arma', en:'The triple that fails'},
    q:{es:'¿Cuál de estas ternas de longitudes NO puede formar un triángulo?',
       en:'Which of these triples of lengths does NOT form a triangle?'},
    options:{es:[t9+', '+(t9+1)+' y '+(2*t9+2)+' unidades',
                 t9+', '+(t9+2)+' y '+(t9+3)+' unidades',
                 (t9+1)+', '+(t9+2)+' y '+(t9+3)+' unidades',
                 (t9+2)+', '+(t9+3)+' y '+(t9+4)+' unidades'],
             en:[t9+', '+(t9+1)+' and '+(2*t9+2)+' units',
                 t9+', '+(t9+2)+' and '+(t9+3)+' units',
                 (t9+1)+', '+(t9+2)+' and '+(t9+3)+' units',
                 (t9+2)+', '+(t9+3)+' and '+(t9+4)+' units']},
    correct:{es:t9+', '+(t9+1)+' y '+(2*t9+2)+' unidades',
             en:t9+', '+(t9+1)+' and '+(2*t9+2)+' units'},
    hint:{es:'En cada terna, junta las dos longitudes más chicas y compáralas con la más grande.',
          en:'In each triple, put the two smaller lengths together and compare them with the largest one.'},
    exp:{es:'En esa terna las dos longitudes más chicas juntas dan '+(2*t9+1)+' unidades y la más grande mide '+(2*t9+2)+', así que las puntas nunca se tocan. En las otras tres, las dos chicas siempre superan a la grande.',
         en:'In that triple the two smaller lengths together give '+(2*t9+1)+' units while the largest measures '+(2*t9+2)+', so the tips never touch. In the other three, the two small ones always beat the large one.'},
    showWork:true
  });

  /* ---- PROBLEMA 10 ---- */
  addProb(v10 === 0 ? {
    title:{es:'Tres rectas horizontales', en:'Three horizontal lines'},
    q:{es:'En una cuadrícula hay tres rectas horizontales: la recta r pasa por la altura '+hr+', la recta s pasa por la altura '+hs+' y la recta t pasa por la altura '+ht+'. ¿Cuántas unidades más grande es la distancia de s a t que la distancia de r a s?',
       en:'On a grid there are three horizontal lines: line r passes through height '+hr+', line s passes through height '+hs+' and line t passes through height '+ht+'. How many units bigger is the distance from s to t than the distance from r to s?'},
    options:[String(D10), String(A10), String(B10), String(A10+B10)],
    correct:String(D10),
    hint:{es:'Saca por separado el ancho de cada franja y luego compara los dos resultados.',
          en:'Work out the width of each band separately and then compare the two results.'},
    exp:{es:'De r a s hay '+hs+' − '+hr+' = '+A10+' unidades y de s a t hay '+ht+' − '+hs+' = '+B10+' unidades. La segunda franja supera a la primera por '+B10+' − '+A10+' = '+D10+'.',
         en:'From r to s there are '+hs+' − '+hr+' = '+A10+' units and from s to t there are '+ht+' − '+hs+' = '+B10+' units. The second band beats the first one by '+B10+' − '+A10+' = '+D10+'.'},
    showWork:true
  } : {
    title:{es:'La tercera paralela', en:'The third parallel'},
    q:{es:'En una cuadrícula, la recta r es horizontal y pasa por la altura '+hr+'. La recta s es paralela a r y está '+A10+' unidades por encima de ella. La recta t es paralela a las dos y está '+B10+' unidades por encima de s. ¿Por qué altura pasa la recta t?',
       en:'On a grid, line r is horizontal and passes through height '+hr+'. Line s is parallel to r and sits '+A10+' units above it. Line t is parallel to both and sits '+B10+' units above s. Through which height does line t pass?'},
    options:[String(ht), String(hs), String(A10+B10), String(hr+B10)],
    correct:String(ht),
    hint:{es:'Cada distancia dice cuántas unidades hay que subir desde la recta anterior, y las subidas se acumulan.',
          en:'Each distance says how many units to climb from the previous line, and the climbs pile up.'},
    exp:{es:'Desde la altura '+hr+' se suben '+A10+' unidades hasta s y luego '+B10+' más hasta t: '+hr+' + '+A10+' + '+B10+' = '+ht+'.',
         en:'From height '+hr+' you climb '+A10+' units up to s and then '+B10+' more up to t: '+hr+' + '+A10+' + '+B10+' = '+ht+'.'},
    showWork:true
  });
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbztwM8nSIbA895DNHtDQGU9fYXDiK9QpxSCUjnBwP1XkAZtJ2B2eIUOgGHmZz8wVQSx/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
