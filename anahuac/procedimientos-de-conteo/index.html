<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedimientos de Conteo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── WIDGETS DE ESTA GUÍA (procedimientos de conteo) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.86rem; color:var(--text2); margin-bottom:.7rem; }
.iw-sub { color:var(--text3); font-size:.82rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.wdone { font-weight:700; color:var(--ok); text-align:center; padding:.7rem; font-size:.95rem; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.goalbar b { color:var(--green-dark); }
.livelbl { margin-top:.6rem; font-size:.88rem; color:var(--text2); }
.livelbl b { color:var(--green-dark); }

/* tabla de doble entrada */
.tb-grid { display:grid; gap:.3rem; margin:.6rem 0 .2rem; }
.tb-h { font-size:.74rem; color:var(--text3); text-align:center; padding:.35rem .2rem; font-weight:600; overflow-wrap:anywhere; }
.tb-cell { border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); min-height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; font-size:1rem; color:var(--green-dark); }
.tb-cell.on { background:var(--green-bg); border-color:var(--green); font-weight:700; }
.tb-cell.lock { cursor:default; }
.predrow { display:flex; align-items:center; gap:.5rem; margin-top:.5rem; flex-wrap:wrap; }
.predlbl { font-size:.82rem; color:var(--text2); }
.stepbtn { border:1.5px solid var(--border); background:var(--surface2); color:var(--green-dark); border-radius:8px; min-width:44px; min-height:44px; font-size:1.05rem; font-weight:700; cursor:pointer; font-family:inherit; }
.stepval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1.1rem; color:var(--green); min-width:34px; text-align:center; }

/* máquina de caminos */
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.5rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:120px; accent-color:var(--green); height:34px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:86px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:26px; text-align:right; }
.gcanvas { display:block; width:100%; height:240px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }

/* clasificador */
.cls-card { border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); padding:.7rem .8rem; font-weight:600; text-align:center; font-size:.86rem; margin:.6rem 0; }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; }
.cls-bin { border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text2); padding:.5rem .9rem; font-size:.84rem; cursor:pointer; min-height:44px; flex:1; font-family:inherit; }
.cls-bin:hover { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); }

/* definiciones y datos */
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.qdata { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.5rem .7rem; margin:.55rem 0 .1rem; font-size:.84rem; color:var(--text2); }
.qdata b { color:var(--green-dark); }
.reflect-prompt { font-size:.9rem; color:var(--text2); margin:.4rem 0 .8rem; }
@media (max-width: 600px) {
  .defgrid { grid-template-columns:1fr; }
  .gcanvas { height:215px; }
  .klbl { min-width:70px; font-size:.74rem; }
  .tb-h { font-size:.68rem; }
  .cls-bin { flex:1 1 100%; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Procedimientos de Conteo</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');

  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'mat1_t13_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'mat1_t13_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'mat1_t13_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');

    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;

  // ── Footer on every page ──

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
/* ================================================
   buildLesson: Procedimientos de conteo (1° de Secundaria).
   Interleaved: idea -> manipulativo -> problema(s). Tarjetas inline.
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320;
    var h = cv.clientHeight || 240;
    cv.width  = Math.round(w*dpr);
    cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  /* cuatro opciones numéricas distintas: la correcta y los distractores que sí quepan */
  function opt4(correct, cands){
    var out = [String(correct)], i, v, k = 1;
    for (i=0;i<cands.length && out.length<4;i++){
      v = cands[i];
      if (v === null || v === undefined || isNaN(v) || v < 0) continue;
      v = String(Math.round(v));
      if (out.indexOf(v) === -1) out.push(v);
    }
    while (out.length < 4){
      v = String(Number(correct) + k);
      if (out.indexOf(v) === -1) out.push(v);
      k++;
    }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = String(T(spec.correct));
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES SEMBRADOS (se sacan una sola vez, en orden fijo)
     ============================================================ */
  var v1 = ri(0,1), a1 = ri(3,4), b1 = ri(3,5);
  var v2 = ri(0,1);
  var a3 = ri(2,3), b3 = ri(3,4), c3 = ri(2,3), ans3 = a3*b3*c3;
  var a4 = ri(3,4), b4 = ri(3,5), t4 = a4*b4;
  var v5 = ri(0,1), L5 = ri(3,4);
  var ans5 = (v5 === 0) ? L5*L5 : L5*(L5-1);
  var LT5 = (L5 === 3) ? { es:'A, B y C', en:'A, B and C' } : { es:'A, B, C y D', en:'A, B, C and D' };
  var v6 = ri(0,1);
  var v7 = ri(0,1), C7 = ri(3,4);
  var ans7 = (v7 === 0) ? C7*(C7-1) : C7;
  var v8 = ri(0,1), k8 = ri(3,5);
  var ans8 = (v8 === 0) ? 2*k8 : 6*k8;
  var v9 = ri(0,1), g9 = ri(3,4), n9 = ri(3,4);
  var v10 = ri(0,1), N10 = ri(5,6), M10 = ri(4,5);
  var ans10 = (v10 === 0) ? N10*(N10-1) : M10*(M10-1)*(M10-2);

  /* rondas de la tabla de doble entrada */
  var TBC = [
    { nm:{es:'Nieves: sabor y presentación', en:'Ice cream: flavor and serving'},
      rows:[{es:'fresa',en:'strawberry'},{es:'chocolate',en:'chocolate'},{es:'limón',en:'lemon'},{es:'mango',en:'mango'}],
      cols:[{es:'cono',en:'cone'},{es:'vaso',en:'cup'},{es:'paleta',en:'popsicle'}] },
    { nm:{es:'Ropa: playera y pantalón', en:'Clothes: shirt and pants'},
      rows:[{es:'playera roja',en:'red shirt'},{es:'playera azul',en:'blue shirt'},{es:'playera blanca',en:'white shirt'}],
      cols:[{es:'pantalón negro',en:'black pants'},{es:'mezclilla',en:'jeans'},{es:'pantalón beige',en:'beige pants'}] },
    { nm:{es:'Comida: sopa y guisado', en:'Meal: soup and main dish'},
      rows:[{es:'sopa de fideo',en:'noodle soup'},{es:'sopa de verduras',en:'vegetable soup'},{es:'arroz',en:'rice'}],
      cols:[{es:'pollo',en:'chicken'},{es:'pescado',en:'fish'},{es:'bistec',en:'steak'}] },
    { nm:{es:'Rutas: calle y cruce', en:'Routes: street and crossing'},
      rows:[{es:'calle Norte',en:'North street'},{es:'calle Centro',en:'Center street'},{es:'calle Sur',en:'South street'}],
      cols:[{es:'puente',en:'bridge'},{es:'túnel',en:'tunnel'},{es:'andador',en:'walkway'}] },
    { nm:{es:'Desayuno: platillo y bebida', en:'Breakfast: dish and drink'},
      rows:[{es:'torta',en:'sandwich'},{es:'tamal',en:'tamal'},{es:'quesadilla',en:'quesadilla'}],
      cols:[{es:'atole',en:'atole'},{es:'café',en:'coffee'},{es:'jugo',en:'juice'},{es:'leche',en:'milk'}] }
  ];
  var TBR = [];
  (function(){
    var ord = shufA([0,1,2,3,4]).slice(0,3), i, c, nr, nc;
    for (i=0;i<3;i++){
      c = TBC[ord[i]];
      nr = ri(2, c.rows.length);
      nc = ri(2, c.cols.length);
      TBR.push({ nm:c.nm, rows:c.rows.slice(0,nr), cols:c.cols.slice(0,nc) });
    }
  })();

  /* rondas de la máquina de caminos */
  var MQR = [];
  (function(){
    var i, a, b, c;
    for (i=0;i<3;i++){
      a = ri(2,5); b = ri(2,4); c = ri(1,3);
      if (a*b*c < 8){ a = ri(3,5); b = ri(3,4); c = ri(2,3); }
      MQR.push({ a:a, b:b, c:c, t:a*b*c });
    }
  })();

  /* tarjetas del clasificador */
  var CLI = shufA([
    { es:'Lanzar un dado, anotar el número y volver a lanzarlo.', en:'Rolling a die, writing the number and rolling it again.', bin:0 },
    { es:'Elegir quién llega en primer lugar y quién en segundo en una carrera.', en:'Choosing who finishes first and who finishes second in a race.', bin:1 },
    { es:'Girar dos veces una ruleta de colores y anotar los dos colores.', en:'Spinning a color wheel twice and writing down both colors.', bin:0 },
    { es:'Sentar a tres amigos distintos en tres sillas.', en:'Seating three different friends in three chairs.', bin:1 },
    { es:'Escoger la letra de la primera casilla y la de la segunda casilla de una clave.', en:'Choosing the letter for the first slot and for the second slot of a code.', bin:0 },
    { es:'Repartir dos premios distintos entre dos ganadores distintos.', en:'Handing two different prizes to two different winners.', bin:1 }
  ]).slice(0,5);

  /* ============================================================
     IDEA 1
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Juntar dos elecciones sin perder ninguna', en:'Pairing two choices without losing any'}),
      '<p>'+T({
        es:'Muy seguido hay que contar de cuántas formas distintas se pueden juntar dos elecciones: una playera con un pantalón, una sopa con un guisado, una calle con un cruce. Si vas anotando las parejas de memoria, es facilísimo repetir una o dejar otra fuera, y entonces la cuenta sale mal aunque el razonamiento parezca bueno.',
        en:'Very often you need to count how many different ways two choices can be joined: a shirt with pants, a soup with a main dish, a street with a crossing. If you jot down the pairs from memory, it is very easy to repeat one or leave another out, and then the count comes out wrong even if the reasoning looked fine.'
      })+'</p>'+
      '<p>'+T({
        es:'Una tabla de doble entrada acomoda ese desorden: una elección va en las filas, la otra en las columnas, y cada casilla guarda exactamente una pareja. Ninguna casilla se repite y ninguna pareja se queda afuera, así que contar casillas es lo mismo que contar parejas.',
        en:'A double entry table tidies that up: one choice goes in the rows, the other in the columns, and each box holds exactly one pair. No box repeats and no pair is left out, so counting boxes is the same as counting pairs.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Fila',en:'Row'})+'</div><div class="deftxt">'+T({es:'Una opción de la primera elección, con todas sus parejas a lo largo.',en:'One option of the first choice, with all its pairs along it.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Columna',en:'Column'})+'</div><div class="deftxt">'+T({es:'Una opción de la segunda elección, con todas sus parejas hacia abajo.',en:'One option of the second choice, with all its pairs going down.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Casilla',en:'Box'})+'</div><div class="deftxt">'+T({es:'El cruce de una fila con una columna: una sola pareja posible.',en:'The crossing of a row with a column: one single possible pair.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Ojo',en:'Careful'})+'</div><div class="deftxt">'+T({es:'Una tabla con huecos no es una lista completa: cada casilla cuenta.',en:'A table with gaps is not a complete list: every box counts.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 1: predice y llena la tabla ---- */
  (function(){
    var wrap = widget('tabla');
    var st = { r:0, sel:[], pred:2, tries:0, lock:false, done:false };
    function R(){ return TBR[st.r]; }
    function total(){ return R().rows.length * R().cols.length; }
    function reset(){
      st.sel = []; st.pred = 2; st.tries = 0; st.lock = false;
      var n = total(), i;
      for (i=0;i<n;i++) st.sel.push(false);
    }
    function filled(){ var n=0,i; for(i=0;i<st.sel.length;i++) if(st.sel[i]) n++; return n; }
    function live(){
      var e = document.getElementById('tbLive'); if (!e) return;
      e.innerHTML = T({es:'Tu predicción: ',en:'Your prediction: '})+'<b>'+st.pred+'</b>'+
                    T({es:' · casillas marcadas: ',en:' · boxes marked: '})+'<b>'+filled()+'</b>';
    }
    function render(){
      if (st.done){
        wrap.innerHTML = '<div class="iw-tag">'+T({es:'Predice y llena la tabla',en:'Predict and fill the table'})+'</div>'+
          '<div class="iw-box"><div class="wdone">🎉 '+T({es:'Tres tablas armadas.',en:'Three tables built.'})+'</div></div>';
        return;
      }
      var r = R(), grid = '', i, j, k;
      grid += '<div class="tb-grid" style="grid-template-columns:repeat('+(r.cols.length+1)+',1fr)">';
      grid += '<div class="tb-h"></div>';
      for (j=0;j<r.cols.length;j++) grid += '<div class="tb-h">'+T(r.cols[j])+'</div>';
      for (i=0;i<r.rows.length;i++){
        grid += '<div class="tb-h">'+T(r.rows[i])+'</div>';
        for (j=0;j<r.cols.length;j++){
          k = i*r.cols.length + j;
          grid += '<div class="tb-cell'+(st.sel[k]?' on':'')+(st.lock?' lock':'')+'" onclick="tbTap('+k+')">'+(st.sel[k]?'✓':'')+'</div>';
        }
      }
      grid += '</div>';
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Predice y llena la tabla',en:'Predict and fill the table'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Tabla ',en:'Table '})+(st.r+1)+T({es:' de 3',en:' of 3'})+'</div>'+
          '<div class="goalbar"><b>'+T(r.nm)+'</b></div>'+
          '<div class="iw-instr">'+T({
            es:'Primero ajusta tu predicción de cuántas parejas distintas salen. Luego toca cada casilla que se pueda armar; si te arrepientes, tócala otra vez para quitarla.',
            en:'First set your prediction of how many different pairs come out. Then tap each box that can be formed; if you change your mind, tap it again to remove it.'
          })+'</div>'+
          '<div class="predrow">'+
            '<span class="predlbl">'+T({es:'Creo que son',en:'I think there are'})+'</span>'+
            '<button class="stepbtn" onclick="tbPred(-1)">−</button>'+
            '<span class="stepval">'+st.pred+'</span>'+
            '<button class="stepbtn" onclick="tbPred(1)">+</button>'+
            '<span class="predlbl">'+T({es:'parejas',en:'pairs'})+'</span>'+
          '</div>'+
          grid+
          '<div class="livelbl" id="tbLive"></div>'+
          '<button class="rverify-btn" onclick="tbCheck()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="tbFb"></div>';
      live();
    }
    function nextRound(){
      st.r++;
      if (st.r >= 3){ st.done = true; render(); return; }
      reset(); render();
    }
    window.tbTap = function(k){
      if (st.lock) return;
      st.sel[k] = !st.sel[k];
      var cells = wrap.querySelectorAll('.tb-cell');
      if (cells[k]){ cells[k].classList.toggle('on', st.sel[k]); cells[k].innerHTML = st.sel[k] ? '✓' : ''; }
      live();
    };
    window.tbPred = function(d){
      if (st.lock) return;
      st.pred = Math.max(1, Math.min(30, st.pred + d));
      var sv = wrap.querySelector('.stepval');
      if (sv) sv.textContent = st.pred;
      live();
    };
    window.tbCheck = function(){
      if (st.lock) return;
      var r = R(), tot = total(), fb = document.getElementById('tbFb');
      if (st.pred === tot && filled() === tot){
        st.lock = true;
        fb.innerHTML = '<span class="okmsg">🎉 '+T({
          es:'Predicción y tabla coinciden: '+r.rows.length+' filas por '+r.cols.length+' columnas dan '+tot+' parejas.',
          en:'Prediction and table agree: '+r.rows.length+' rows by '+r.cols.length+' columns give '+tot+' pairs.'
        })+'</span>';
        setTimeout(nextRound, 1500);
        return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.lock = true;
        var i;
        for (i=0;i<st.sel.length;i++) st.sel[i] = true;
        st.pred = tot;
        render();
        document.getElementById('tbFb').innerHTML = T({
          es:'Mira la tabla llena: cada fila aporta una casilla por cada columna, así que '+r.rows.length+' × '+r.cols.length+' = '+tot+' parejas.',
          en:'Look at the full table: each row adds one box per column, so '+r.rows.length+' × '+r.cols.length+' = '+tot+' pairs.'
        });
        setTimeout(nextRound, 2600);
        return;
      }
      if (filled() < tot){
        fb.textContent = T({
          es:'Todavía hay casillas vacías: revisa si cada fila ya se cruzó con todas las columnas.',
          en:'There are still empty boxes: check whether each row has been crossed with every column.'
        });
      } else if (st.pred < tot){
        fb.textContent = T({
          es:'Tu predicción se quedó corta: ya marcaste más casillas de las que predijiste. Súbela.',
          en:'Your prediction fell short: you already marked more boxes than you predicted. Raise it.'
        });

            ctx.lineTo(pts[i+1][k][0], pts[i+1][k][1]);

         en:'The first slot takes '+L5+' letters and, once one is used, '+(L5-1)+' remain for the second: '+L5+' × '+(L5-1)+' = '+ans5+'.'},
    showWork:true
  });

  /* ---- PROBLEMA 6 ---- */
  addProb(v6 === 0 ? {
    title:{es:'Se gasta o regresa', en:'Used up or back again'},
    q:{es:'¿En cuál de estas situaciones una misma opción ya NO puede volver a usarse en la segunda etapa?',

    options:{
      es:['Elegir quién gana el primer lugar y quién gana el segundo lugar de una carrera.',
          'Lanzar un dado, anotar el número y volver a lanzarlo.',
          'Girar una ruleta de colores, anotar el color y girarla otra vez.',
          'Escoger la letra de la primera casilla y la de la segunda casilla de una clave que admite letras repetidas.'],
      en:['Choosing who wins first place and who wins second place in a race.',
          'Rolling a die, writing the number and rolling it again.',
          'Spinning a color wheel, writing the color and spinning it again.',
          'Choosing the letter of the first slot and of the second slot of a code that allows repeated letters.']
    },
    correct:{es:'Elegir quién gana el primer lugar y quién gana el segundo lugar de una carrera.',
             en:'Choosing who wins first place and who wins second place in a race.'},
    hint:{es:'Pregúntate en cada caso si lo que se usó en la primera etapa sigue disponible para la segunda o si quedó ocupado.',
          en:'Ask yourself in each case whether what was used in the first stage is still available for the second or is already taken.'},
    exp:{es:'El corredor que se llevó el primer lugar queda fuera de la disputa por el segundo, así que la segunda etapa tiene una opción menos. En los otros casos el dado, la ruleta y las letras siguen completos para la segunda etapa.',
         en:'The runner who took first place is out of the running for second, so the second stage has one option fewer. In the other cases the die, the wheel and the letters are still complete for the second stage.'},
    showWork:false
  } : {
    title:{es:'Se gasta o regresa', en:'Used up or back again'},
    q:{es:'¿En cuál de estas situaciones una misma opción SÍ puede volver a aparecer en la segunda etapa?',
       en:'In which of these situations CAN the same option show up again in the second stage?'},
    options:{
      es:['Sacar una canica de una bolsa, regresarla a la bolsa y sacar otra vez.',

          'Repartir dos premios distintos entre dos ganadores distintos.',

      en:['Drawing a marble from a bag, putting it back and drawing again.',
          'Choosing the captain and the vice captain of a team, who must be different people.',
          'Handing two different prizes to two different winners.',
          'Choosing who wins first place and who wins second place in a race.']
    },
    correct:{es:'Sacar una canica de una bolsa, regresarla a la bolsa y sacar otra vez.',
             en:'Drawing a marble from a bag, putting it back and drawing again.'},
    hint:{es:'Pregúntate en cada caso si lo que se usó en la primera etapa sigue disponible para la segunda o si quedó ocupado.',
          en:'Ask yourself in each case whether what was used in the first stage is still available for the second or is already taken.'},
    exp:{es:'Al regresar la canica, la bolsa queda igual que al principio y la segunda extracción tiene las mismas opciones que la primera. En los otros casos la persona o el premio ya se ocupó y no vuelve a estar disponible.',
         en:'Putting the marble back leaves the bag just as it started, and the second draw has the same options as the first. In the other cases the person or the prize is already taken and is not available again.'},

  });

  /* ============================================================
     IDEA 4
     ============================================================ */
  sec(T({es:'Idea 4', en:'Idea 4'}),
      T({es:'Contar para decidir qué es más probable', en:'Counting to decide what is more likely'}),
      '<p>'+T({
        es:'Cuando ya sabes cuántos resultados posibles tiene un experimento, comparar eventos deja de ser cuestión de opinión: basta contar cuántos de esos resultados le sirven a cada evento. Entre dos eventos del mismo experimento, el que tiene más resultados a su favor es el más probable.',
        en:'Once you know how many possible results an experiment has, comparing events stops being a matter of opinion: you just count how many of those results work for each event. Between two events of the same experiment, the one with more results in its favor is the more likely one.'
      })+'</p>'+
      '<p>'+T({
        es:'Por eso el conteo y la probabilidad viajan juntos: primero se arma la lista completa de resultados posibles, y luego se cuenta cuántos cumplen la condición del evento. Un evento sin resultados a su favor es imposible, y uno que se lleva todos los resultados es seguro.',
        en:'That is why counting and probability travel together: first you build the complete list of possible results, then you count how many meet the condition of the event. An event with no results in its favor is impossible, and one that takes every result is certain.'
      })+'</p>');

  /* ---- PROBLEMA 7 ---- */
  addProb(v7 === 0 ? {
    title:{es:'Dos giros de la ruleta', en:'Two spins of the wheel'},

       en:'A wheel is split into '+C7+' equal parts, each one a different color. It is spun twice and the color of each spin is written down, in order. In how many of the possible results are the two colors written down different?'},
    options: opt4(ans7, [C7*C7, C7, C7+C7, C7*C7-1]),
    correct: String(ans7),
    hint:{es:'Cuenta primero todos los resultados posibles de los dos giros; luego quita los que repiten color, que son uno por cada color.',
          en:'First count all the possible results of the two spins; then remove the ones that repeat a color, which are one per color.'},
    exp:{es:'Los resultados posibles son '+C7+' × '+C7+' = '+(C7*C7)+'. En '+C7+' de ellos el segundo giro cae en el mismo color que el primero, así que los de colores distintos son '+(C7*C7)+' − '+C7+' = '+ans7+'.',
         en:'The possible results are '+C7+' × '+C7+' = '+(C7*C7)+'. In '+C7+' of them the second spin lands on the same color as the first, so the ones with different colors are '+(C7*C7)+' − '+C7+' = '+ans7+'.'},
    showWork:true
  } : {
    title:{es:'Dos giros de la ruleta', en:'Two spins of the wheel'},
    q:{es:'Una ruleta está partida en '+C7+' partes iguales, cada una de un color distinto. Se gira dos veces y se anota el color de cada giro, en orden. ¿En cuántos de los resultados posibles los dos giros dan el mismo color?',
       en:'A wheel is split into '+C7+' equal parts, each one a different color. It is spun twice and the color of each spin is written down, in order. In how many of the possible results do the two spins give the same color?'},
    options: opt4(ans7, [C7*C7, C7*(C7-1), C7+C7, C7*C7-1]),
    correct: String(ans7),
    hint:{es:'Los dos giros coinciden cuando el segundo cae justo donde cayó el primero: hay un caso así por cada color.',
          en:'The two spins match when the second lands exactly where the first did: there is one such case per color.'},
    exp:{es:'Los resultados posibles son '+C7+' × '+C7+' = '+(C7*C7)+'. Coinciden solo cuando el segundo giro repite el color del primero, y eso ocurre una vez por cada color: '+C7+' × 1 = '+ans7+'.',
         en:'The possible results are '+C7+' × '+C7+' = '+(C7*C7)+'. They match only when the second spin repeats the color of the first, and that happens once per color: '+C7+' × 1 = '+ans7+'.'},
    showWork:true
  });

  /* ---- MANIPULATIVO 4: cuaderno de conteo ---- */
  (function(){
    var wrap = widget('reflect');
    var PROMPTS = [
      { es:'Inventa una situación de tu escuela que se cuente con una tabla de doble entrada, dibuja la tabla y escribe cuántas casillas tiene y por qué.',
        en:'Invent a situation from your school that can be counted with a double entry table, sketch the table and write how many boxes it has and why.' },
      { es:'Explica con tus palabras, y con un dibujo si te ayuda, por qué agregar una opción a una etapa no agrega un solo camino sino varios.',
        en:'Explain in your own words, with a sketch if it helps, why adding one option to a stage does not add a single path but several.' },
      { es:'Inventa dos situaciones parecidas, una donde la opción se pueda repetir y otra donde no, y escribe en qué cambia el conteo.',
        en:'Invent two similar situations, one where the option can repeat and one where it cannot, and write what changes in the count.' }
    ];
    var pk = PROMPTS[Math.floor(rng()*PROMPTS.length)];
    wrap.innerHTML =
      '<div class="iw-tag">'+T({es:'Cuaderno de conteo', en:'Counting notebook'})+'</div>'+
      '<div class="iw-box">'+
        '<div class="iw-instr iw-sub">'+T({es:'Aquí no hay un solo camino bueno: escribe o dibuja lo que se te ocurra.', en:'There is no single good path here: write or sketch whatever comes to mind.'})+'</div>'+
        '<div class="reflect-prompt">'+T(pk)+'</div>'+
        '<div class="wtabs">'+
          '<button class="wtab active" onclick="rfTab(\'type\',this)">'+t('tab-type')+'</button>'+
          '<button class="wtab" onclick="rfTab(\'draw\',this)">'+t('tab-draw')+'</button>'+
        '</div>'+
        '<div class="wpanel active" id="rf_type"><textarea class="wtextarea" id="rfTa" placeholder="'+t('ph-work')+'"></textarea></div>'+
        '<div class="wpanel" id="rf_draw">'+
          '<div class="cvwrap">'+
            '<canvas class="dcanvas" id="rfCv"></canvas>'+
            '<div class="ctoolbar">'+
              '<button class="tbtn2 bpen on">'+t('btn-pen')+'</button>'+
              '<button class="tbtn2 bmarker">'+t('btn-marker')+'</button>'+
              '<button class="tbtn2 beraser">'+t('btn-eraser')+'</button>'+
              '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>'+
              '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>'+
              '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>'+
              '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>'+
              '<button class="clrbtn">'+t('btn-clear')+'</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<button class="rverify-btn" onclick="rfSave()">'+T({es:'Guardar en el cuaderno', en:'Save to the notebook'})+'</button>'+
        '<div class="rfb" id="rfFb"></div>'+
      '</div>';
    window.rfTab = function(which, btn){
      ['type','draw'].forEach(function(k){
        var p = document.getElementById('rf_'+k);
        if (p) p.classList.toggle('active', k === which);
      });
      wrap.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function(){ var c = document.getElementById('rfCv'); if (c) initCanvas(c); }, 60);
    };
    window.rfSave = function(){
      var f = document.getElementById('rfFb');
      if (f) f.innerHTML = '<span class="okmsg">'+T({
        es:'Guardado. Esa idea es tuya y sirve para amarrar lo que ya viste.',
        en:'Saved. That idea is yours and it helps tie together what you have already seen.'
      })+'</span>';
    };
  })();

  /* ---- PROBLEMA 8 ---- */
  addProb(v8 === 0 ? {
    title:{es:'Moneda y ruleta', en:'Coin and wheel'},
    q:{es:'Se lanza una moneda y se gira una ruleta partida en '+k8+' partes de colores distintos. Se anota la cara de la moneda y el color de la ruleta. ¿Cuántos resultados distintos puede tener este experimento?',
       en:'A coin is tossed and a wheel split into '+k8+' parts of different colors is spun. The face of the coin and the color of the wheel are written down. How many different results can this experiment have?'},
    options: opt4(ans8, [k8+2, k8, ans8+2, 4*k8]),
    correct: String(ans8),
    hint:{es:'La moneda aporta dos caras y cada una se junta con cada color de la ruleta.',
          en:'The coin contributes two faces and each one joins with every color of the wheel.'},
    exp:{es:'La moneda da 2 resultados y la ruleta da '+k8+'. Cada cara se junta con cada color: 2 × '+k8+' = '+ans8+'.',
         en:'The coin gives 2 results and the wheel gives '+k8+'. Each face joins with each color: 2 × '+k8+' = '+ans8+'.'},
    showWork:true
  } : {
    title:{es:'Dado y ruleta', en:'Die and wheel'},
    q:{es:'Se lanza un dado común y se gira una ruleta partida en '+k8+' partes de colores distintos. Se anota el número del dado y el color de la ruleta. ¿Cuántos resultados distintos puede tener este experimento?',
       en:'A common die is rolled and a wheel split into '+k8+' parts of different colors is spun. The number of the die and the color of the wheel are written down. How many different results can this experiment have?'},
    options: opt4(ans8, [6+k8, ans8-k8, ans8+k8, 6*6]),
    correct: String(ans8),
    hint:{es:'El dado aporta seis caras y cada una se junta con cada color de la ruleta.',
          en:'The die contributes six faces and each one joins with every color of the wheel.'},
    exp:{es:'El dado da 6 resultados y la ruleta da '+k8+'. Cada número se junta con cada color: 6 × '+k8+' = '+ans8+'.',
         en:'The die gives 6 results and the wheel gives '+k8+'. Each number joins with each color: 6 × '+k8+' = '+ans8+'.'},
    showWork:true
  });

  /* ---- PROBLEMA 9 ---- */
  addProb(v9 === 0 ? {
    title:{es:'El conteo de Rosa', en:'The count Rosa made'},
    q:{es:'Rosa quiso contar los resultados de girar una ruleta de '+g9+' colores y luego lanzar una moneda. Anotó que hay '+(g9+2)+' resultados posibles, y su cuenta no es la correcta. ¿Cuál fue su error?',
       en:'Rosa tried to count the results of spinning a wheel with '+g9+' colors and then tossing a coin. She wrote that there are '+(g9+2)+' possible results, and her count is not the right one. What was her mistake?'},
    options:{
      es:['Juntó en un solo montón las opciones de cada etapa, en lugar de acompañar cada color con cada cara.',
          'Olvidó que la moneda tiene dos caras distintas.',
          'Contó dos veces uno de los colores de la ruleta.',
          'Supuso que la ruleta tiene más colores de los que realmente tiene.'],
      en:['She put the options of each stage into a single pile, instead of pairing each color with each face.',
          'She forgot that the coin has two different faces.',
          'She counted one of the colors of the wheel twice.',
          'She assumed the wheel has more colors than it really has.']
    },
    correct:{es:'Juntó en un solo montón las opciones de cada etapa, en lugar de acompañar cada color con cada cara.',
             en:'She put the options of each stage into a single pile, instead of pairing each color with each face.'},
    hint:{es:'Arma la tabla: los colores en las filas y las dos caras en las columnas, y cuenta las casillas que aparecen.',
          en:'Build the table: the colors in the rows and the two faces in the columns, and count the boxes that appear.'},
    exp:{es:'Rosa usó las opciones de las dos etapas por separado. La tabla de esta situación tiene '+g9+' filas y 2 columnas, y cada casilla es un resultado, así que hay '+(2*g9)+' resultados y no '+(g9+2)+'.',
         en:'Rosa used the options of the two stages separately. The table of this situation has '+g9+' rows and 2 columns, and each box is a result, so there are '+(2*g9)+' results and not '+(g9+2)+'.'},
    showWork:false
  } : {
    title:{es:'El conteo de Tomás', en:'The count Tomas made'},
    q:{es:'Para contar cuántas parejas de baile se pueden formar con '+(n9+1)+' niñas y '+n9+' niños, tomando una niña y un niño, Tomás anotó '+(2*n9+1)+' parejas, y su cuenta no es la correcta. ¿Cuál fue su error?',
       en:'To count how many dance pairs can be formed with '+(n9+1)+' girls and '+n9+' boys, taking one girl and one boy, Tomas wrote down '+(2*n9+1)+' pairs, and his count is not the right one. What was his mistake?'},
    options:{
      es:['Juntó en un solo montón a los dos grupos, en lugar de acompañar a cada niña con cada niño.',
          'Dejó fuera del conteo a una de las niñas.',
          'Contó dos veces a uno de los niños.',
          'Formó parejas de dos niñas, que no valen en este conteo.'],
      en:['He put the two groups into a single pile, instead of pairing each girl with each boy.',
          'He left one of the girls out of the count.',
          'He counted one of the boys twice.',
          'He formed pairs of two girls, which do not count here.']
    },
    correct:{es:'Juntó en un solo montón a los dos grupos, en lugar de acompañar a cada niña con cada niño.',
             en:'He put the two groups into a single pile, instead of pairing each girl with each boy.'},
    hint:{es:'Arma la tabla: las niñas en las filas y los niños en las columnas, y cuenta las casillas que aparecen.',
          en:'Build the table: the girls in the rows and the boys in the columns, and count the boxes that appear.'},
    exp:{es:'Tomás usó los dos grupos por separado. La tabla tiene '+(n9+1)+' filas y '+n9+' columnas, y cada casilla es una pareja distinta, así que hay '+(n9*(n9+1))+' parejas y no '+(2*n9+1)+'.',
         en:'Tomas used the two groups separately. The table has '+(n9+1)+' rows and '+n9+' columns, and each box is a different pair, so there are '+(n9*(n9+1))+' pairs and not '+(2*n9+1)+'.'},
    showWork:false
  });

  /* ---- PROBLEMA 10 ---- */
  addProb(v10 === 0 ? {
    title:{es:'Primero y segundo', en:'First and second'},
    q:{es:'En una carrera de la escuela corren '+N10+' niños y no hay empates. ¿De cuántas maneras distintas pueden quedar el primer lugar y el segundo lugar?',
       en:'In a school race '+N10+' children run and there are no ties. In how many different ways can first place and second place turn out?'},
    options: opt4(ans10, [N10*N10, ans10/2, N10+N10, N10-1]),
    correct: String(ans10),
    hint:{es:'Piensa en dos etapas: primero se decide quién gana, y para el segundo lugar ya no está disponible quien ganó.',
          en:'Think of two stages: first you decide who wins, and for second place the winner is no longer available.'},
    exp:{es:'Para el primer lugar hay '+N10+' corredores; ocupado ese lugar, para el segundo quedan '+(N10-1)+': '+N10+' × '+(N10-1)+' = '+ans10+'.',
         en:'For first place there are '+N10+' runners; with that place taken, '+(N10-1)+' remain for second: '+N10+' × '+(N10-1)+' = '+ans10+'.'},
    showWork:true
  } : {
    title:{es:'El podio completo', en:'The full podium'},
    q:{es:'En una carrera de la escuela corren '+M10+' niños y no hay empates. ¿De cuántas maneras distintas puede quedar el podio con el primer, el segundo y el tercer lugar?',
       en:'In a school race '+M10+' children run and there are no ties. In how many different ways can the podium of first, second and third place turn out?'},
    options: opt4(ans10, [M10*M10*M10, M10*(M10-1), ans10/2, M10+M10+M10]),
    correct: String(ans10),
    hint:{es:'Son tres etapas seguidas, y en cada una queda un corredor menos disponible que en la anterior.',
          en:'There are three stages in a row, and in each one there is one runner fewer available than in the previous one.'},
    exp:{es:'Para el primer lugar hay '+M10+' corredores, para el segundo quedan '+(M10-1)+' y para el tercero '+(M10-2)+': '+M10+' × '+(M10-1)+' × '+(M10-2)+' = '+ans10+'.',
         en:'For first place there are '+M10+' runners, for second '+(M10-1)+' remain and for third '+(M10-2)+': '+M10+' × '+(M10-1)+' × '+(M10-2)+' = '+ans10+'.'},
    showWork:true
  });
}
