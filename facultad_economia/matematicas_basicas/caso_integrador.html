/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · el precio que conviene
   Al subir el precio se venden menos botellas, de modo que el ingreso es un
   producto de dos cantidades que se mueven en sentidos opuestos y describe
   una curva que sube y baja. La utilidad es otra curva, y su punto mas alto
   no cae en el mismo precio: esa distancia es la leccion del tablero.
   ════════════════════════════════════════════════════════════════════════ */
function widgetPrecio(b, D, v, F, t0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { t: t0 };
  var tR = D / 2, tU = (D + v) / 2;

  function qAt(t) { return t >= D ? 0 : b * (D - t); }
  function rAt(t) { return t * qAt(t); }
  function uAt(t) { return (t - v) * qAt(t) - F; }

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var q = qAt(state.t), R = rAt(state.t), U = uAt(state.t);
    var YMAX = roundUpTo(rAt(tR) * 1.1, 20000);
    var YMIN = -roundUpTo(F * 1.4, 20000);

    var xt = [{ v: 0, t: '0' }, { v: D / 4, t: money(D / 4) }, { v: D / 2, t: money(D / 2) }, { v: 3 * D / 4, t: money(3 * D / 4) }, { v: D, t: money(D) }];
    var yt = [{ v: YMIN, t: intN(YMIN / 1000) + ' k' }, { v: 0, t: '0' }, { v: YMAX, t: intN(YMAX / 1000) + ' k' }];
    var inner = gridSvg(0, D, YMIN, YMAX,
      es ? 'precio por botella' : 'price per bottle',
      es ? 'pesos del mes' : 'pesos in the month', xt, yt);
    inner += curveSvg(rAt, 0, D, YMIN, YMAX, 'var(--green)', '2.3');
    inner += curveSvg(uAt, 0, D, YMIN, YMAX, 'var(--gold)', '2.3');
    inner += vlineSvg(state.t, 0, D, YMIN, YMAX, 'var(--text3)');
    inner += dotSvg(state.t, R, 0, D, YMIN, YMAX, 'var(--green-dark)', '4.2');
    inner += dotSvg(state.t, U, 0, D, YMIN, YMAX, 'var(--gold)', '4.2');
    set('#w3svg', svgOpen() + inner + '</svg>');

    set('#w3tl', money(state.t));
    set('#w3q2', intN(q));
    set('#w3r',  money(R));
    set('#w3u',  money(U));
    set('#w3eq',
      '<span class="ec">' + money(state.t) + (es ? ' por botella' : ' per bottle') + '</span>' +
      '<span style="color:var(--text3)">' + (es ? '  lleva a  ' : '  leads to  ') + '</span>' +
      '<span class="ev">' + intN(q) + (es ? ' botellas' : ' bottles') + '</span>');

    var vd = host.querySelector('#w3verd');
    if (vd) {
      if (state.t === tR) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Este es el precio más alto de la curva verde: aquí el ingreso del mes llega a su máximo.'
                            : 'This is the top of the green curve: here the revenue of the month reaches its maximum.';
      } else if (state.t === tU) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Este es el precio más alto de la curva dorada: aquí la utilidad del mes llega a su máximo.'
                            : 'This is the top of the gold curve: here the profit of the month reaches its maximum.';
      } else if (state.t < tR) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Vas por la parte que sube de las dos curvas: subir el precio todavía deja más pesos en la caja.'
                            : 'You are on the rising part of both curves: raising the price still leaves more pesos in the till.';
      } else {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Ya pasaste la cima del ingreso: de aquí en adelante el precio ahuyenta más botellas de las que compensa.'
                            : 'You are past the revenue peak: from here on the price drives away more bottles than it makes up for.';
      }
    }

    set('#w3read', (state.t <= v)
      ? (es
        ? '<strong>Lectura de negocio:</strong> a ' + money(state.t) + ' la botella se vende por debajo de los ' + money(v) + ' que cuesta producirla. Aquí se ve con claridad que la curva verde y la dorada no cuentan la misma historia: el ingreso sigue siendo positivo y en cambio la utilidad se hunde. Facturar mucho y perder dinero es perfectamente posible, y este es el precio que lo consigue.'
        : '<strong>Business reading:</strong> at ' + money(state.t) + ' the bottle sells below the ' + money(v) + ' it costs to make. Here you can see plainly that the green and gold curves do not tell the same story: revenue stays positive while profit sinks. Invoicing a lot and losing money is entirely possible, and this is the price that manages it.')
      : (es
        ? '<strong>Lectura de negocio:</strong> a ' + money(state.t) + ' la botella, La Palma colocaría ' + intN(q) + ' botellas, facturaría ' + money(R) + ' y su resultado sería ' + money(U) + '. Compara las dos cimas: el ingreso llega a su máximo en ' + money(tR) + ' y la utilidad en ' + money(tU) + '. La utilidad manda su máximo a un precio más alto porque al ingreso no le cuesta nada vender una botella más, mientras que a la utilidad le cuesta ' + money(v) + ' cada vez. Cobrar el precio que maximiza la facturación es un error caro y frecuente.'
        : '<strong>Business reading:</strong> at ' + money(state.t) + ' a bottle, La Palma would place ' + intN(q) + ' bottles, invoice ' + money(R) + ' and end with ' + money(U) + '. Compare the two peaks: revenue tops out at ' + money(tR) + ' and profit at ' + money(tU) + '. Profit pushes its peak to a higher price because revenue pays nothing to sell one more bottle, while profit pays ' + money(v) + ' every time. Charging the price that maximises invoicing is an expensive and common mistake.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="precio-ingreso-y-utilidad">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El precio que conviene cobrar' : 'The price worth charging') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'El área comercial midió que por cada peso que sube el precio, La Palma deja de colocar ' + intN(b) + ' botellas al mes, y que a ' + money(D) + ' ya no vendería ninguna. Cada botella cuesta ' + money(v) + ' de producir y la planta paga ' + money(F) + ' fijos al mes. Mueve el precio y sigue las dos curvas: la verde es la facturación y la dorada es la utilidad. Localiza la cima de cada una y anota que no caen en el mismo precio.'
          : 'The commercial desk measured that for every peso the price goes up, La Palma stops placing ' + intN(b) + ' bottles a month, and that at ' + money(D) + ' it would sell none at all. Each bottle costs ' + money(v) + ' to make and the plant pays ' + money(F) + ' fixed a month. Move the price and follow the two curves: green is invoicing and gold is profit. Find the peak of each and note that they do not fall at the same price.') + '</div>' +
        '<div class="iw-expr" id="w3eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'ingreso del mes' : 'revenue of the month') + '</span><span><i class="lg-out"></i>' + (es ? 'utilidad del mes' : 'profit of the month') + '</span></div>' +
        '<div class="plane" id="w3svg"></div>' +
        '<div class="verdict" id="w3verd"></div>' +
        '<div class="cg" style="margin-bottom:.9rem">' +
          '<label>' + (es ? 'Precio por botella' : 'Price per bottle') + ': <span class="cval" id="w3tl"></span></label>' +
          '<input type="range" min="2" max="' + D + '" step="1" id="w3t" value="' + state.t + '">' +
        '</div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Botellas del mes' : 'Bottles in the month') + '</div><div class="mnum ts" id="w3q2"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ingreso del mes' : 'Revenue of the month') + '</div><div class="mnum cs" id="w3r"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Utilidad del mes' : 'Profit of the month') + '</div><div class="mnum ps" id="w3u"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    var ts = host.querySelector('#w3t');
    ts.addEventListener('input', function() { state.t = parseInt(ts.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 4 · crecer por porcentaje y el plazo para llegar
   La curva verde crece un porcentaje fijo cada mes y la recta dorada suma
   siempre la misma cantidad del primer mes. Se separan despacio y luego sin
   remedio. La lectura clave es el plazo: en que mes cada una alcanza la
   meta de volumen que la planta necesita para justificar la segunda linea.
   ════════════════════════════════════════════════════════════════════════ */
function widgetPlazo(e0, pct0, mult) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { p: pct0 };
  var META = e0 * mult;
  var MESES = 12;

  function expAt(i, p) { return e0 * Math.pow(1 + p / 100, i); }
  function linAt(i, p) { return e0 + i * (e0 * p / 100); }
  function plazo(f, p) {
    for (var i = 0; i <= MESES; i++) { if (f(i, p) >= META) return i; }
    return null;
  }

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var p = state.p;
    var pe = plazo(expAt, p), pl = plazo(linAt, p);
    var YMAX = roundUpTo(Math.max(expAt(MESES, p), META * 1.15), 5000);
    var YMIN = 0;

    var xt = [{ v: 0, t: '0' }, { v: 3, t: '3' }, { v: 6, t: '6' }, { v: 9, t: '9' }, { v: 12, t: '12' }];
    var yt = [{ v: 0, t: '0' }, { v: META, t: intN(META / 1000) + ' k' }, { v: YMAX, t: intN(YMAX / 1000) + ' k' }];
    var inner = gridSvg(0, MESES, YMIN, YMAX,
      es ? 'meses' : 'months',
      es ? 'litros al mes' : 'litres a month', xt, yt);
    inner += '<line x1="' + SVL + '" y1="' + svgNum(mapY(META, YMIN, YMAX)) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(mapY(META, YMIN, YMAX)) + '" stroke="var(--text3)" stroke-width="1" stroke-dasharray="4 3"/>';
    inner += curveSvg(function(i) { return linAt(i, p); }, 0, MESES, YMIN, YMAX, 'var(--gold)', '2.2');
    inner += curveSvg(function(i) { return expAt(i, p); }, 0, MESES, YMIN, YMAX, 'var(--green)', '2.4');
    if (pe !== null) inner += dotSvg(pe, expAt(pe, p), 0, MESES, YMIN, YMAX, 'var(--green-dark)', '4.2');
    if (pl !== null) inner += dotSvg(pl, linAt(pl, p), 0, MESES, YMIN, YMAX, 'var(--gold)', '4.2');
    set('#w4svg', svgOpen() + inner + '</svg>');

    set('#w4pl', intN(p) + '%');
    set('#w4pe', pe === null ? (es ? 'más de 12' : 'over 12') : intN(pe) + (es ? ' meses' : ' months'));
    set('#w4plz', pl === null ? (es ? 'más de 12' : 'over 12') : intN(pl) + (es ? ' meses' : ' months'));
    set('#w4v12', intN(expAt(MESES, p)));
    set('#w4eq',
      '<span class="ec">' + intN(e0) + (es ? ' litros hoy' : ' litres today') + '</span>' +
      '<span style="color:var(--text3)">' + (es ? '  meta  ' : '  target  ') + '</span>' +
      '<span class="ev">' + intN(META) + (es ? ' litros al mes' : ' litres a month') + '</span>');

    var vd = host.querySelector('#w4verd');
    if (vd) {
      if (pe === null) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'A este ritmo la meta no se alcanza dentro del año: el plazo se sale del horizonte de la decisión.'
                            : 'At this rate the target is not reached within the year: the term runs past the decision horizon.';
      } else if (pl === null) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'La curva llega a la meta en ' + intN(pe) + ' meses y la recta ni siquiera la alcanza dentro del año.'
                            : 'The curve hits the target in ' + intN(pe) + ' months and the line does not reach it within the year at all.';
      } else {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'La curva llega a la meta en ' + intN(pe) + ' meses y la recta tarda ' + intN(pl) + '.'
                            : 'The curve reaches the target in ' + intN(pe) + ' months and the line takes ' + intN(pl) + '.';
      }
    }

    set('#w4read', (pe === null)
      ? (es
        ? '<strong>Lectura de negocio:</strong> con un crecimiento de ' + intN(p) + '% mensual el volumen sube, pero la meta de ' + intN(META) + ' litros queda fuera del año. Aquí la pregunta del negocio no es cuánto crece sino en cuánto tiempo llega, y esa pregunta se responde al revés que las demás: se conoce el destino y se busca el plazo. Sube el ritmo unos puntos y observa lo rápido que se acorta el plazo, porque el efecto no es proporcional.'
        : '<strong>Business reading:</strong> at ' + intN(p) + '% monthly growth the volume rises, but the target of ' + intN(META) + ' litres falls outside the year. Here the business question is not how much it grows but how long it takes to arrive, and that question is answered backwards from the others: the destination is known and the term is what you look for. Raise the rate a few points and watch how sharply the term shortens, because the effect is not proportional.')
      : (es
        ? '<strong>Lectura de negocio:</strong> las dos series arrancan en los mismos ' + intN(e0) + ' litros y suben lo mismo el primer mes, y aun así la curva llega a la meta en ' + intN(pe) + ' meses mientras la recta ' + (pl === null ? 'no la alcanza dentro del año' : 'tarda ' + intN(pl)) + '. La diferencia está en la base: la curva aplica el ' + intN(p) + '% sobre un volumen cada vez mayor y la recta suma siempre la cantidad del primer mes. Para la planta esto decide cuándo contratar la segunda línea de envasado, y equivocarse de familia significa comprar equipo con años de anticipación o quedarse corto en plena temporada.'
        : '<strong>Business reading:</strong> both series start from the same ' + intN(e0) + ' litres and rise by the same amount in the first month, and even so the curve reaches the target in ' + intN(pe) + ' months while the line ' + (pl === null ? 'does not reach it within the year' : 'takes ' + intN(pl)) + '. The difference is the base: the curve applies the ' + intN(p) + '% to an ever larger volume and the line always adds the first month amount. For the plant this decides when to commission the second bottling line, and getting the family wrong means buying equipment years early or falling short in mid-season.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="crecimiento-compuesto-y-plazo">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Cuántos meses faltan para la meta' : 'How many months to the target') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La Palma envasa hoy ' + intN(e0) + ' litros al mes y necesita llegar a ' + intN(META) + ' litros para justificar una segunda línea de envasado. Mueve el ritmo de crecimiento mensual y compara las dos series: la curva verde crece ese porcentaje sobre el volumen del mes anterior y la recta dorada suma cada mes la misma cantidad de litros que ganó el primer mes. Los puntos marcan el mes en que cada una cruza la meta.'
          : 'La Palma bottles ' + intN(e0) + ' litres a month today and needs to reach ' + intN(META) + ' litres to justify a second bottling line. Move the monthly growth rate and compare the two series: the green curve grows that percentage on the previous month volume and the gold line adds each month the same number of litres it gained in the first month. The dots mark the month each one crosses the target.') + '</div>' +
        '<div class="iw-expr" id="w4eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'crecimiento por porcentaje' : 'percentage growth') + '</span><span><i class="lg-out"></i>' + (es ? 'crecimiento por cantidad fija' : 'fixed amount growth') + '</span></div>' +
        '<div class="plane" id="w4svg"></div>' +
        '<div class="verdict" id="w4verd"></div>' +
        '<div class="cg" style="margin-bottom:.9rem">' +
          '<label>' + (es ? 'Crecimiento mensual' : 'Monthly growth') + ': <span class="cval" id="w4pl"></span></label>' +
          '<input type="range" min="5" max="40" step="5" id="w4p" value="' + state.p + '">' +
        '</div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Plazo por porcentaje' : 'Term at percentage growth') + '</div><div class="mnum cs" id="w4pe"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Plazo por cantidad fija' : 'Term at fixed amount') + '</div><div class="mnum ps" id="w4plz"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Litros al mes 12' : 'Litres at month 12') + '</div><div class="mnum ts" id="w4v12"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w4read"></div>' +
      '</div>';
    var ps = host.querySelector('#w4p');
    ps.addEventListener('input', function() { state.p = parseInt(ps.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   BUILD LESSON · concepto, herramienta, reactivos, y otra vez
   Todos los numeros salen del rng sembrado, de modo que dos alumnos nunca
   comparten una sola cifra y un mismo alumno nunca repite un intento.
   El caso entero sigue a un negocio: Agroindustria La Palma, una planta de
   Armeria que envasa agua de coco y aceite de coco para tiendas de Colima.
   Cada concepto recupera una herramienta distinta del curso y la aplica a
   la misma empresa, que es lo que hace de esta guia un caso integrador.
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];
  document.getElementById('lessonBody').innerHTML = '';

  /* ── Concepto 1 · estructura de costos, margen y equilibrio ── */
  var c1qe = pick([3000, 3600, 4000], rng);
  var c1m  = pick([15, 18, 20], rng);
  var c1F  = c1qe * c1m;
  var c1v  = pick([9, 11, 13], rng);
  var c1p  = c1v + c1m;
  var c1q  = c1qe + pick([1000, 1200, 1500], rng);
  var c1R  = c1p * c1q;
  var c1C  = c1F + c1v * c1q;
  var c1U  = c1R - c1C;
  var c1mp = c1m / c1p * 100;
  var c1mc = c1m / c1v * 100;
  var c1cu = c1C / c1q;
  var c1cu2 = (c1F + c1v * c1qe) / c1qe;

  var w1F  = pick([45000, 54000, 60000], rng);
  var w1v  = pick([9, 11, 13], rng);
  var w1p0 = pick([16, 18, 20], rng);
  var w1q0 = pick([2000, 2400, 2800], rng);

  /* ── Reactivo 1 · el volumen que alcanza la utilidad pedida ── */
  var p1qe = pick([2800, 3200, 3600], rng);
  var p1m  = pick([14, 16, 20], rng);
  var p1F  = p1qe * p1m;
  var p1v  = pick([10, 12, 14], rng);
  var p1p  = p1v + p1m;
  var p1g  = pick([600, 750, 900], rng);
  var p1G  = p1m * p1g;
  var p1ok = p1qe + p1g;
  var p1d1 = Math.round((p1F + p1G) / p1p);
  var p1d2 = p1qe;
  var p1d3 = p1qe + Math.round(p1G / p1p);

  /* ── Reactivo 2 · diez por ciento mas de botellas ── */
  var p2qe = pick([3000, 3500, 4000], rng);
  var p2m  = pick([15, 18, 20], rng);
  var p2F  = p2qe * p2m;
  var p2q  = p2qe + pick([500, 1000, 1500], rng);
  var p2U  = p2m * p2q - p2F;
  var p2q2 = Math.round(p2q * 1.1);
  var p2U2 = p2m * p2q2 - p2F;
  var p2ri = (p2U2 / p2U - 1) * 100;

  /* ═══════════════════════ CONCEPTO 1 ═══════════════════════ */
  addSection(function(L) {
    if (L === 'es') return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>La estructura de costos de una planta y el punto donde deja de perder</h2>' +
      '<p>Agroindustria La Palma es una planta de Armería que compra coco de la costa de Colima y lo convierte en dos productos: agua de coco embotellada, que sale hacia las tiendas de conveniencia de Colima y Villa de Álvarez, y aceite de coco en caja, que se vende a distribuidores. El consejo se reúne cada mes para tomar decisiones que parecen distintas entre sí, cambiar el precio, contratar otro turno, aceptar un pedido grande, y todas terminan apoyándose en las mismas cuatro herramientas que este caso va a recorrer.</p>' +
      '<p>La primera es la más básica y la que más se maltrata: separar el gasto en dos partes. La renta de la planta, los sueldos base, la certificación sanitaria y el seguro se pagan aunque la línea no encienda un solo día. Son <strong>costo fijo</strong>, y se miden en pesos por mes. La fruta, el envase, la tapa y la etiqueta solo aparecen cuando se produce una botella más. Son <strong>costo variable</strong>, y se miden en pesos por botella. Confundir las dos partidas es el origen de casi todos los pronósticos que fallan.</p>' +
      '<p>De esa separación sale la cifra que dirige la operación diaria: el <strong>margen de contribución</strong>, que es lo que queda de cada botella después de pagar su propio costo variable. Ese margen no es utilidad todavía. Es el único recurso disponible para ir cubriendo el costo fijo del mes, y solo cuando se termina de cubrir aparece la utilidad. El volumen exacto en el que eso ocurre es el <strong>punto de equilibrio</strong>.</p>' +
      '<p>Hay una consecuencia que sorprende incluso a quien lleva años firmando estados de resultados. El costo por botella que reporta la contabilidad, el que sale de repartir el costo total del mes entre las botellas producidas, <strong>no es constante</strong>: baja conforme sube el volumen, porque la parte fija se reparte entre más unidades. Sirve para explicar un mes que ya cerró, pero no sirve para decidir si conviene producir una botella más. Para esa decisión la cifra relevante es el costo variable, que es lo único que realmente agrega la botella adicional.</p>' +
      '<p>Conviene además fijar el vocabulario del porcentaje, porque en una junta se usan dos bases distintas y casi nadie las nombra. El margen puede expresarse <strong>sobre el precio</strong>, que es lo que usa el área comercial para comparar productos, o <strong>sobre el costo</strong>, que es lo que usa compras para negociar con proveedores. Es el mismo peso de margen y son dos porcentajes distintos, así que un porcentaje sin su base es un dato incompleto.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Costo total</div><div class="rform">C = F + v · q</div><div class="rnote">Fijo del mes más variable por botella.</div></div>' +
        '<div class="rcard"><div class="rname">Margen de contribución</div><div class="rform">m = p − v</div><div class="rnote">Lo que deja cada botella.</div></div>' +
        '<div class="rcard"><div class="rname">Punto de equilibrio</div><div class="rform">' + frac('F', 'm') + '</div><div class="rnote">Botellas que cubren lo fijo.</div></div>' +
        '<div class="rcard"><div class="rname">Costo por botella</div><div class="rform">' + frac('C', 'q') + '</div><div class="rnote">Baja al crecer el volumen.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> La Palma paga ' + money(c1F) + ' al mes de renta, sueldos base, certificación y seguro. Cada botella de agua de coco le cuesta ' + money(c1v) + ' de fruta, envase, tapa y etiqueta, y se vende en ' + money(c1p) + '. En el mes que acaba de cerrar colocó ' + intN(c1q) + ' botellas. El consejo pide el resultado del mes, el volumen mínimo para no perder y el costo por botella.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Cada botella deja ' + money(c1m) + ' después de pagar su propio costo variable. Las unidades cierran: pesos por botella menos pesos por botella siguen siendo pesos por botella.<br>' +
      '<strong>Paso 2.</strong> Para cubrir los ' + money(c1F) + ' fijos hacen falta ' + intN(c1qe) + ' botellas. Ese es el punto de equilibrio del mes.<br>' +
      '<strong>Paso 3.</strong> Con ' + intN(c1q) + ' botellas se rebasa el equilibrio en ' + intN(c1q - c1qe) + ' botellas, y cada una de esas aporta su margen completo, así que la utilidad del mes es ' + money(c1U) + '. El ingreso fue ' + money(c1R) + ' y el costo total ' + money(c1C) + '.<br>' +
      '<strong>Paso 4.</strong> El costo por botella del mes fue ' + money1(c1cu) + '. En el mes del equilibrio habría sido ' + money1(c1cu2) + ', más alto, porque los mismos ' + money(c1F) + ' se habrían repartido entre menos botellas.<br>' +
      '<strong>Lectura.</strong> El margen sobre el precio es ' + pct1(c1mp) + ' y sobre el costo variable es ' + pct1(c1mc) + '. Son el mismo margen de ' + money(c1m) + ' leído sobre dos bases distintas, y quien reporte uno de esos números sin decir sobre qué lo calculó está dando un dato que no se puede usar.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>The cost structure of a plant and the point where it stops losing</h2>' +
      '<p>Agroindustria La Palma is a plant in Armería that buys coconut from the Colima coast and turns it into two products: bottled coconut water, which goes out to the convenience stores of Colima and Villa de Álvarez, and boxed coconut oil, sold to distributors. The board meets every month to take decisions that look unrelated, changing the price, adding a shift, accepting a large order, and every one of them ends up leaning on the same four tools this case will work through.</p>' +
      '<p>The first is the most basic and the most abused: splitting spending into two parts. Plant rent, base wages, the sanitary certification and insurance are paid even if the line never runs a single day. They are <strong>fixed cost</strong>, measured in pesos per month. Fruit, bottle, cap and label appear only when one more bottle is made. They are <strong>variable cost</strong>, measured in pesos per bottle. Mixing the two items is where nearly every failed forecast begins.</p>' +
      '<p>Out of that split comes the figure that runs the daily operation: the <strong>contribution margin</strong>, what is left of each bottle once it has paid its own variable cost. That margin is not profit yet. It is the only resource available to chip away at the fixed cost of the month, and profit appears only once the fixed cost is fully covered. The exact volume where that happens is the <strong>break-even point</strong>.</p>' +
      '<p>There is a consequence that surprises even people who have been signing income statements for years. The cost per bottle that accounting reports, the one from spreading the month total cost over the bottles produced, is <strong>not constant</strong>: it falls as volume rises, because the fixed part is spread over more units. It explains a month that has already closed, but it cannot decide whether making one more bottle pays. For that decision the relevant figure is the variable cost, the only thing the extra bottle really adds.</p>' +
      '<p>It is also worth fixing the vocabulary of percentages, because a meeting uses two different bases and almost nobody names them. Margin can be stated <strong>on the price</strong>, which is what the commercial desk uses to compare products, or <strong>on the cost</strong>, which is what purchasing uses to negotiate with suppliers. It is the same peso of margin and two different percentages, so a percentage without its base is an incomplete figure.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Total cost</div><div class="rform">C = F + v · q</div><div class="rnote">Monthly fixed plus variable per bottle.</div></div>' +
        '<div class="rcard"><div class="rname">Contribution margin</div><div class="rform">m = p − v</div><div class="rnote">What each bottle leaves.</div></div>' +
        '<div class="rcard"><div class="rname">Break-even point</div><div class="rform">' + frac('F', 'm') + '</div><div class="rnote">Bottles that cover the fixed part.</div></div>' +
        '<div class="rcard"><div class="rname">Cost per bottle</div><div class="rform">' + frac('C', 'q') + '</div><div class="rnote">It falls as volume grows.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> La Palma pays ' + money(c1F) + ' a month in rent, base wages, certification and insurance. Each bottle of coconut water costs it ' + money(c1v) + ' in fruit, bottle, cap and label, and sells for ' + money(c1p) + '. In the month just closed it placed ' + intN(c1q) + ' bottles. The board asks for the result of the month, the minimum volume not to lose money and the cost per bottle.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Each bottle leaves ' + money(c1m) + ' once it has paid its own variable cost. The units close: pesos per bottle minus pesos per bottle are still pesos per bottle.<br>' +
      '<strong>Step 2.</strong> Covering the ' + money(c1F) + ' of fixed cost takes ' + intN(c1qe) + ' bottles. That is the break-even point of the month.<br>' +
      '<strong>Step 3.</strong> With ' + intN(c1q) + ' bottles the plant clears break-even by ' + intN(c1q - c1qe) + ' bottles, and every one of those contributes its full margin, so the profit of the month is ' + money(c1U) + '. Revenue was ' + money(c1R) + ' and total cost ' + money(c1C) + '.<br>' +
      '<strong>Step 4.</strong> The cost per bottle for the month was ' + money1(c1cu) + '. In a break-even month it would have been ' + money1(c1cu2) + ', higher, because the same ' + money(c1F) + ' would have been spread over fewer bottles.<br>' +
      '<strong>Reading.</strong> The margin on price is ' + pct1(c1mp) + ' and on variable cost it is ' + pct1(c1mc) + '. It is the same ' + money(c1m) + ' of margin read against two different bases, and anyone reporting one of those numbers without saying what it was computed on is handing over a figure nobody can use.</p></div>';
  });

  widgetEquilibrio(w1F, w1v, w1p0, w1q0);

  /* ── Reactivo 1 · el volumen que alcanza la utilidad pedida ── */
  var o1es = [intN(p1ok) + ' botellas', intN(p1d1) + ' botellas', intN(p1d2) + ' botellas', intN(p1d3) + ' botellas'];
  var o1en = [intN(p1ok) + ' bottles', intN(p1d1) + ' bottles', intN(p1d2) + ' bottles', intN(p1d3) + ' bottles'];
  var o1 = shuffleOpts(o1es, o1en, rng);
  addItem({
    title: { es: 'El volumen que pide el consejo', en: 'The volume the board is asking for' },
    q: { es: 'Agroindustria La Palma paga ' + money(p1F) + ' al mes de renta de la planta, sueldos base y certificación sanitaria, sin importar cuánto produzca. Cada botella de agua de coco le cuesta además ' + money(p1v) + ' de fruta, envase y tapa, y se vende en ' + money(p1p) + '. Para el próximo mes el consejo pidió cerrar con una utilidad de ' + money(p1G) + '. ¿Cuántas botellas tendría que colocar la planta?',
        en: 'Agroindustria La Palma pays ' + money(p1F) + ' a month in plant rent, base wages and sanitary certification, whatever it produces. Each bottle of coconut water costs it a further ' + money(p1v) + ' in fruit, bottle and cap, and sells for ' + money(p1p) + '. For next month the board asked it to close with a profit of ' + money(p1G) + '. How many bottles would the plant have to place?' },
    hint: { es: 'Empieza por preguntarte qué le queda a la empresa de cada botella una vez que esa botella pagó lo que costó producirla. Esa cantidad es lo único que puede ir cubriendo el gasto del mes, y después de cubrirlo, lo único que puede construir la utilidad pedida.',
            en: 'Start by asking what the firm keeps from each bottle once that bottle has paid what it cost to make. That amount is the only thing that can cover the monthly outlay, and once it is covered, the only thing that can build the profit the board wants.' },
    opts: { es: o1.es, en: o1.en },
    exp: { es: 'Cada botella deja ' + money(p1m) + ' limpios después de su costo variable. Con ese margen, cubrir los ' + money(p1F) + ' fijos exige ' + intN(p1qe) + ' botellas, y construir además los ' + money(p1G) + ' de utilidad exige ' + intN(p1g) + ' botellas más, así que la meta es ' + intN(p1ok) + ' botellas. La cifra de ' + intN(p1d2) + ' es exactamente el punto de equilibrio: deja a la planta sin pérdida pero también sin la utilidad que pidió el consejo. La de ' + intN(p1d1) + ' reparte todo el dinero necesario entre el precio de venta, como si la botella entregara ' + money(p1p) + ' limpios a la empresa, y se olvida de que ' + money(p1v) + ' de cada botella se van en producirla. Y la de ' + intN(p1d3) + ' arranca bien del equilibrio pero convierte la utilidad pedida a botellas usando otra vez el precio en lugar del margen, de modo que se queda corta justo en el tramo que interesa.',
           en: 'Each bottle leaves ' + money(p1m) + ' clear after its variable cost. On that margin, covering the ' + money(p1F) + ' of fixed cost takes ' + intN(p1qe) + ' bottles, and building the ' + money(p1G) + ' of profit on top takes ' + intN(p1g) + ' bottles more, so the target is ' + intN(p1ok) + ' bottles. The figure of ' + intN(p1d2) + ' is exactly the break-even point: it leaves the plant with no loss but also without the profit the board asked for. The figure of ' + intN(p1d1) + ' spreads all the money needed over the selling price, as if the bottle handed the firm ' + money(p1p) + ' clear, and forgets that ' + money(p1v) + ' of every bottle goes into making it. And ' + intN(p1d3) + ' starts correctly from break-even but converts the requested profit into bottles using the price again instead of the margin, so it falls short over exactly the stretch that matters.' }
  }, o1.correctIdx, true);

  /* ── Reactivo 2 · diez por ciento mas de botellas ── */
  var o2es = [
    'Se equivoca: el gasto fijo del mes no crece con el volumen, así que las botellas adicionales aportan su margen completo y la utilidad sube bastante más que 10%.',
    'Se equivoca: como el costo variable también sube con cada botella, la utilidad crecería menos de 10%.',
    'Tiene razón: si el precio y el costo por botella no cambian, la utilidad se mueve en la misma proporción que las ventas.',
    'Se equivoca: la utilidad no cambiaría, porque cada botella adicional se vende con el mismo margen que las anteriores.'
  ];
  var o2en = [
    'He is wrong: the fixed outlay of the month does not grow with volume, so the extra bottles contribute their full margin and profit rises by considerably more than 10%.',
    'He is wrong: since variable cost also rises with each bottle, profit would grow by less than 10%.',
    'He is right: if the price and the cost per bottle do not change, profit moves in the same proportion as sales.',
    'He is wrong: profit would not change at all, because each extra bottle sells at the same margin as the previous ones.'
  ];
  var o2 = shuffleOpts(o2es, o2en, rng);
  addItem({
    title: { es: 'Diez por ciento más de botellas', en: 'Ten percent more bottles' },
    q: { es: 'La Palma cerró el mes con ' + intN(p2q) + ' botellas colocadas y una utilidad de ' + money(p2U) + '. Un practicante del área de finanzas presenta al consejo la siguiente conclusión: si el próximo mes se colocan 10% más botellas al mismo precio y con el mismo costo por botella, la utilidad también subirá 10%. ¿Qué opinas de su conclusión?',
        en: 'La Palma closed the month with ' + intN(p2q) + ' bottles placed and a profit of ' + money(p2U) + '. A trainee in the finance desk brings the board this conclusion: if next month places 10% more bottles at the same price and the same cost per bottle, profit will also rise by 10%. What do you make of his conclusion?' },
    hint: { es: 'Piensa en qué partidas del mes cambian cuando la planta produce más y en cuáles se quedan exactamente igual. La respuesta depende de esa segunda lista, no de la primera.',
            en: 'Think about which items of the month change when the plant produces more and which stay exactly as they were. The answer depends on that second list, not on the first.' },
    opts: { es: o2.es, en: o2.en },
    exp: { es: 'Con 10% más botellas la planta llegaría a ' + intN(p2q2) + ' unidades, y como el gasto fijo del mes no se mueve, la utilidad pasaría de ' + money(p2U) + ' a ' + money(p2U2) + ', es decir un aumento de ' + pct1(p2ri) + '. Ese efecto se llama apalancamiento operativo y aparece siempre que hay costo fijo: por encima del equilibrio, la utilidad crece en proporción mayor que las ventas, y por debajo cae también más rápido. La respuesta que espera un crecimiento menor a 10% supone que el costo variable se come parte del avance, pero ese costo ya está descontado dentro del margen de cada botella. La que da por buena la proporción trata a la utilidad como si fuera ingreso. Y la que afirma que la utilidad no cambiaría confunde tener el mismo margen por botella con vender el mismo número de botellas.',
           en: 'With 10% more bottles the plant would reach ' + intN(p2q2) + ' units, and since the fixed outlay of the month does not move, profit would go from ' + money(p2U) + ' to ' + money(p2U2) + ', a rise of ' + pct1(p2ri) + '. That effect is called operating leverage and appears whenever there is fixed cost: above break-even, profit grows proportionally faster than sales, and below it falls faster too. The answer expecting growth under 10% assumes variable cost eats into the gain, but that cost is already deducted inside each bottle margin. The one that accepts the proportion treats profit as if it were revenue. And the one claiming profit would not change confuses keeping the same margin per bottle with selling the same number of bottles.' }
  }, o2.correctIdx, false);

  /* ── Concepto 2 · dos productos, dos condiciones ── */
  var c2x  = pick([150, 160, 170], rng);
  var c2y  = pick([60, 70, 80], rng);
  var c2pA = pick([180, 200, 220], rng);
  var c2pB = pick([340, 380, 420], rng);
  var c2N  = c2x + c2y;
  var c2R  = c2pA * c2x + c2pB * c2y;
  var c2dif = c2pB - c2pA;
  var c2todoA = c2pA * c2N;
  var c2sob = c2R - c2todoA;

  var w2x  = pick([150, 160, 170], rng);
  var w2y  = pick([60, 70, 80], rng);
  var w2pA = pick([180, 200, 220], rng);
  var w2pB = pick([340, 380, 420], rng);

  /* ── Reactivo 3 · las cajas de aceite del turno ── */
  var p3x  = pick([150, 160, 170], rng);
  var p3y  = pick([60, 70, 80], rng);
  var p3pA = pick([180, 200, 220], rng);
  var p3pB = pick([340, 380, 420], rng);
  var p3N  = p3x + p3y;
  var p3R  = p3pA * p3x + p3pB * p3y;
  var p3ok = p3y;
  var p3d1 = p3x;
  var p3d2 = p3N / 2;
  var p3d3 = p3N;

  /* ═══════════════════════ CONCEPTO 2 ═══════════════════════ */
  addSection(function(L) {
    if (L === 'es') return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>Dos productos en la misma línea: cuando un dato no alcanza</h2>' +
      '<p>La planta de La Palma envasa agua de coco y aceite de coco en el mismo turno y con el mismo personal. Al cierre, el sistema no guarda cuántas cajas salieron de cada producto: guarda dos totales, las cajas que pasaron por la banda y los pesos que se facturaron. La contadora necesita separar los dos productos para calcular el margen de cada uno, y para eso tiene que reconstruir dos cantidades desconocidas a partir de dos totales conocidos.</p>' +
      '<p>El primer reflejo es intentarlo con un solo dato, y ahí está la lección. Si solo se conoce el total de cajas, cualquier reparto que sume ese total es compatible con el reporte: hay tantas soluciones como maneras de partir el número. Una sola condición con dos cantidades desconocidas no determina nada; describe una recta entera de posibilidades. Hace falta una <strong>segunda condición independiente</strong>, y el ingreso facturado lo es porque los dos productos no se venden al mismo precio.</p>' +
      '<p>Esa última observación es la que decide todo. Si la caja de agua y la de aceite se facturaran igual, el ingreso ya no diría nada nuevo: sería el total de cajas multiplicado por un precio común, la misma información contada de otra forma. Dos condiciones sirven solo cuando aportan información distinta. Cuando una es la repetición de la otra, el sistema tiene infinitas soluciones; cuando se contradicen entre sí, no tiene ninguna, y eso casi siempre significa que un dato del reporte está mal capturado.</p>' +
      '<p>Para resolverlo conviene un razonamiento que se sostiene sin álgebra y que después se traduce a ella. Se supone primero que todas las cajas fueron del producto barato y se calcula cuánto se habría facturado. La diferencia entre esa cifra y la factura real es dinero que solo pudo entrar cambiando cajas baratas por caras, y cada cambio de ese tipo agrega exactamente la diferencia de precios. Dividir el faltante entre esa diferencia dice cuántas cajas caras hubo. Es el método de sustitución escrito en el idioma del negocio.</p>' +
      '<p>Queda un paso que nunca hay que saltarse: <strong>verificar</strong>. Los valores encontrados deben reproducir los dos totales del reporte, no solo el que se usó al final. Y deben ser razonables como cantidades reales, es decir no negativos y no fraccionarios cuando se trata de cajas completas. Un resultado que satisface las cuentas pero no la realidad de la planta es la señal de que los datos de entrada tienen un problema.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Dos incógnitas</div><div class="rform">x + y = N</div><div class="rnote">Una sola condición no basta.</div></div>' +
        '<div class="rcard"><div class="rname">Segunda condición</div><div class="rform">pA·x + pB·y = R</div><div class="rnote">Debe aportar información nueva.</div></div>' +
        '<div class="rcard"><div class="rname">Sustitución</div><div class="rform">y = ' + frac('R − pA·N', 'pB − pA') + '</div><div class="rnote">El faltante entre la diferencia.</div></div>' +

      '<p><strong>Ejemplo resuelto.</strong> El turno del martes reportó ' + intN(c2N) + ' cajas envasadas en total y ' + money(c2R) + ' facturados. La caja de agua de coco se factura en ' + money(c2pA) + ' y la de aceite en ' + money(c2pB) + '. Hay que reconstruir cuántas cajas fueron de cada producto.</p>' +

      '<strong>Paso 2.</strong> La factura real fue ' + money(c2R) + ', es decir ' + money(c2sob) + ' por encima. Ese exceso solo pudo entrar por las cajas de aceite.<br>' +

      '<strong>Lectura.</strong> La contadora ya puede calcular el margen por producto, que era el objetivo. Nótese que el método falla si los dos productos se facturan al mismo precio, porque entonces cambiar una caja por otra no movería la factura y el segundo dato no aportaría nada.</p></div>';
    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Two products on one line: when a single figure is not enough</h2>' +
      '<p>The La Palma plant packs coconut water and coconut oil on the same shift with the same crew. At closing, the system does not store how many cases came from each product: it stores two totals, the cases that ran along the belt and the pesos that were invoiced. The accountant needs to separate the two products to work out the margin of each, and for that she has to reconstruct two unknown quantities from two known totals.</p>' +
      '<p>The first instinct is to try it with a single figure, and there lies the lesson. If only the case total is known, any split adding up to that total fits the report: there are as many solutions as ways of breaking the number apart. One condition with two unknown quantities determines nothing; it describes a whole line of possibilities. A <strong>second independent condition</strong> is needed, and the invoiced revenue is one because the two products do not sell at the same price.</p>' +
      '<p>That last remark decides everything. If a case of water and a case of oil invoiced the same, revenue would say nothing new: it would be the case total times a common price, the same information told differently. Two conditions are useful only when they carry different information. When one is a restatement of the other, the system has infinitely many solutions; when they contradict each other, it has none, and that almost always means a figure in the report was captured wrongly.</p>' +
      '<p>To solve it, a piece of reasoning works without algebra and translates into it afterwards. Suppose first that every case was of the cheaper product and work out what would have been invoiced. The difference between that figure and the real invoice is money that could only have come in by swapping cheap cases for expensive ones, and each such swap adds exactly the price difference. Dividing the shortfall by that difference says how many expensive cases there were. It is the substitution method written in the language of the business.</p>' +
      '<p>One step must never be skipped: <strong>checking</strong>. The values found have to reproduce both totals in the report, not just the one used last. And they have to be sensible as real quantities, that is, not negative and not fractional when whole cases are involved. A result that satisfies the arithmetic but not the reality of the plant is the sign that the input data has a problem.</p>' +

        '<div class="rcard"><div class="rname">Two unknowns</div><div class="rform">x + y = N</div><div class="rnote">One condition is not enough.</div></div>' +

        '<div class="rcard"><div class="rname">Substitution</div><div class="rform">y = ' + frac('R − pA·N', 'pB − pA') + '</div><div class="rnote">The shortfall over the difference.</div></div>' +

    exp: { es: 'Cuando las dos condiciones se contradicen, el sistema no tiene solución, y eso no es un problema de método sino de datos: no existe producción real que genere a la vez ese total de cajas y esa factura, así que uno de los dos números se capturó mal o hubo una venta que no pasó por la línea. La opción de los infinitos repartos describe el caso contrario, el de dos condiciones que dicen lo mismo, y ahí el sistema sí tiene solución, solo que no una sola. Tomar valores negativos en valor absoluto es inventar producción que no ocurrió: un resultado negativo también sería una señal de datos inconsistentes, nunca una cantidad que se corrige cambiándole el signo. Y que los dos productos se facturaran al mismo precio explicaría una indeterminación, no una contradicción.',
           en: 'When the two conditions contradict each other the system has no solution, and that is not a problem of method but of data: no real output produces that case total and that invoice at once, so one of the two numbers was captured wrongly or a sale never went through the line. The option of infinitely many splits describes the opposite case, two conditions saying the same thing, and there the system does have solutions, only not a single one. Taking negative values in absolute terms invents output that never happened: a negative result would also be a sign of inconsistent data, never a quantity fixed by flipping its sign. And both products invoicing at the same price would explain an indeterminacy, not a contradiction.' }

  var c3t  = pick([24, 26, 30], rng);

  addSection(function(L) {
    if (L === 'es') return '' +
      '<div class="stag">Concepto 3</div>' +
      '<h2>El precio que conviene: una curva que sube y luego baja</h2>' +
      '<p>Hasta aquí el precio de la botella se ha tratado como un dato. En la realidad de La Palma es una decisión, y es la más delicada de todas, porque el precio no solo cambia lo que entra por cada botella: cambia también cuántas botellas entran. Las tiendas de conveniencia comparan marcas en el mismo anaquel, así que cada peso de aumento aleja a una parte de la clientela.</p>' +
      '<p>Con eso, la cantidad colocada deja de ser un número suelto y pasa a depender del precio. El área comercial mide esa dependencia con dos cifras: cuántas botellas se dejan de colocar por cada peso de aumento, y a qué precio las ventas llegarían a cero. Ese segundo número es el precio de choque, y no es una cifra teórica: es donde la marca sale del anaquel.</p>' +
      '<p>La facturación del mes es entonces el producto de dos cantidades que se mueven en sentidos opuestos, y ese producto es una <strong>parábola</strong>. Empieza en cero cuando el precio es cero, porque regalar el producto no factura nada, y vuelve a cero en el precio de choque, porque a ese precio no se vende ninguna botella. Entre esos dos extremos hay un máximo, y por la simetría de la parábola ese máximo cae exactamente a la mitad del camino entre ambos ceros. Ese es el <strong>vértice</strong>, y es el precio que maximiza la facturación.</p>' +
      '<p>Aquí aparece el error caro. Facturar el máximo y ganar el máximo no son la misma decisión. La facturación no paga nada por vender una botella más, pero la utilidad sí paga su costo variable cada vez, así que la utilidad prefiere vender menos botellas más caras. El precio que maximiza la utilidad siempre queda <strong>por encima</strong> del que maximiza la facturación, y la distancia entre los dos es exactamente la mitad del costo variable. Una empresa que fija su precio mirando solo la facturación está regalando margen de forma sistemática.</p>' +
      '<p>Conviene además leer la curva y no solo su punto más alto. Cerca del vértice la parábola es casi plana, de modo que un peso arriba o abajo del precio óptimo casi no cambia el resultado; en cambio, lejos del vértice la caída se acelera. Esa forma explica por qué equivocarse un poco en el precio se perdona y equivocarse mucho no.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Cantidad</div><div class="rform">q = b · (D − p)</div><div class="rnote">Baja al subir el precio.</div></div>' +
        '<div class="rcard"><div class="rname">Ingreso</div><div class="rform">R = p · q</div><div class="rnote">Producto de dos rectas opuestas.</div></div>' +
        '<div class="rcard"><div class="rname">Vértice</div><div class="rform">' + frac('D', '2') + '</div><div class="rnote">A la mitad entre los dos ceros.</div></div>' +
        '<div class="rcard"><div class="rname">Precio de mayor utilidad</div><div class="rform">' + frac('D + v', '2') + '</div><div class="rnote">Siempre arriba del anterior.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> El área comercial de La Palma midió que por cada peso de aumento se dejan de colocar ' + intN(c3b) + ' botellas al mes, y que a ' + money(c3D) + ' la botella ya no se vendería ninguna. Cada botella cuesta ' + money(c3v) + ' de producir y la planta paga ' + money(c3F) + ' fijos al mes. El consejo quiere saber a qué precio conviene vender.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> A ' + money(c3tb) + ' la planta colocaría ' + intN(c3qb) + ' botellas y facturaría ' + money(c3Rb) + '.<br>' +
      '<strong>Paso 2.</strong> A ' + money(c3ta) + ' colocaría menos, ' + intN(c3qa) + ' botellas, y facturaría ' + money(c3Ra) + '. Subir el precio no siempre sube la factura ni bajarlo tampoco.<br>' +
      '<strong>Paso 3.</strong> La facturación vale cero en ' + money(0) + ' y en ' + money(c3D) + ', así que su máximo cae a la mitad, en ' + money(c3t) + '. Ahí se colocan ' + intN(c3q) + ' botellas y se factura ' + money(c3R) + ', más que en los dos precios anteriores.<br>' +
      '<strong>Paso 4.</strong> La utilidad es otra historia. A ' + money(c3t) + ' la planta ganaría ' + money(c3Ur) + ', mientras que a ' + money(c3tu) + ' colocaría solo ' + intN(c3qu) + ' botellas y ganaría ' + money(c3Uu) + '.<br>' +
      '<strong>Lectura.</strong> El precio que más factura y el que más gana están separados por ' + money(c3v / 2) + ', que es la mitad del costo variable. Vender menos botellas y ganar más dinero no es una paradoja: es lo que ocurre cuando cada botella cuesta producirla.</p></div>';
    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>The price worth charging: a curve that climbs and then falls</h2>' +
      '<p>So far the price of the bottle has been treated as a given. In the reality of La Palma it is a decision, and the most delicate of all, because the price does not only change what comes in per bottle: it also changes how many bottles come in. Convenience stores compare brands on the same shelf, so every peso of increase drives away part of the custom.</p>' +
      '<p>With that, the quantity placed stops being a loose number and starts depending on the price. The commercial desk measures that dependence with two figures: how many bottles are lost per peso of increase, and at what price sales would reach zero. That second number is the choke price, and it is not a theoretical figure: it is where the brand leaves the shelf.</p>' +
      '<p>Monthly invoicing is then the product of two quantities moving in opposite directions, and that product is a <strong>parabola</strong>. It starts at zero when the price is zero, because giving the product away invoices nothing, and returns to zero at the choke price, because at that price not a bottle sells. Between those two ends there is a maximum, and by the symmetry of the parabola that maximum falls exactly halfway between the two zeros. That is the <strong>vertex</strong>, and it is the price that maximises invoicing.</p>' +
      '<p>Here the expensive mistake appears. Invoicing the most and earning the most are not the same decision. Invoicing pays nothing to sell one more bottle, but profit pays its variable cost every time, so profit prefers to sell fewer bottles at a higher price. The price that maximises profit always sits <strong>above</strong> the one that maximises invoicing, and the distance between them is exactly half the variable cost. A firm that sets its price looking only at invoicing is giving away margin systematically.</p>' +
      '<p>It is also worth reading the curve and not just its highest point. Near the vertex the parabola is almost flat, so a peso above or below the optimal price barely changes the result; far from the vertex, in contrast, the fall accelerates. That shape explains why being slightly wrong about a price is forgiven and being very wrong is not.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Quantity</div><div class="rform">q = b · (D − p)</div><div class="rnote">It falls as the price rises.</div></div>' +
        '<div class="rcard"><div class="rname">Revenue</div><div class="rform">R = p · q</div><div class="rnote">Product of two opposite lines.</div></div>' +
        '<div class="rcard"><div class="rname">Vertex</div><div class="rform">' + frac('D', '2') + '</div><div class="rnote">Halfway between the two zeros.</div></div>' +
        '<div class="rcard"><div class="rname">Profit-maximising price</div><div class="rform">' + frac('D + v', '2') + '</div><div class="rnote">Always above the previous one.</div></div>' +
      '</div>' +

            en: 'Each month the percentage applies to the previous month volume and not to today. Step forward month by month and watch carefully how many months separate today from the one that closes the quarter.' },
    opts: { es: o8.es, en: o8.en },

  var o9en = [

        en: 'Each bottle of coconut water at La Palma sells for ' + money(p9p) + ' and costs ' + money(p9v) + ' to make. At the monthly meeting, finance states that the product margin is ' + pct1(p9sp) + ' and purchasing replies that the margin is ' + pct1(p9sc) + '. Neither of them made an arithmetic slip. Who is right?' },
    hint: { es: 'Los dos porcentajes salen del mismo peso de margen. Fíjate en qué cantidad usó cada área como referencia para dividir, porque ahí está toda la diferencia.',
            en: 'Both percentages come from the same peso of margin. Look at which quantity each desk used as the reference for dividing, because that is where the whole difference lies.' },
    opts: { es: o9.es, en: o9.en },
    exp: { es: 'La botella deja ' + money(p9m) + ' de margen. Ese mismo margen comparado con el precio de ' + money(p9p) + ' da ' + pct1(p9sp) + ', que es la base que usa el área comercial para comparar productos entre sí, y comparado con el costo de ' + money(p9v) + ' da ' + pct1(p9sc) + ', que es la base con la que compras negocia con proveedores. Ninguna de las dos bases es la correcta en abstracto: lo incorrecto es reportar el porcentaje sin decir sobre cuál se calculó, porque el margen sobre costo siempre resulta mayor que el margen sobre precio y confundirlos infla la rentabilidad aparente del producto. La opción que exige calcular sobre el costo total del mes mezcla una medida por unidad con una del periodo completo, que además incluye el costo fijo y por lo tanto depende del volumen.',

  }, o9.correctIdx, false);

  /* ── Reactivo 10 · cuando encender la segunda linea ── */
  var oAes = [intN(pAok) + ' meses', intN(pAx1) + ' meses', intN(pAx2) + ' meses', intN(pAx3) + ' meses'];
  var oAen = [intN(pAok) + ' months', intN(pAx1) + ' months', intN(pAx2) + ' months', intN(pAx3) + ' months'];
  var oA = shuffleOpts(oAes, oAen, rng);
  addItem({
    title: { es: 'Cuándo encender la segunda línea', en: 'When to switch on the second line' },
    q: { es: 'La Palma envasa hoy ' + intN(pAe0) + ' litros al mes y ese volumen viene creciendo ' + intN(pAp) + '% mensual de forma sostenida. La segunda línea de envasado se justifica cuando la planta llegue a ' + intN(pAT) + ' litros al mes, y su instalación tarda un trimestre, así que el consejo necesita la fecha con anticipación. ¿En cuántos meses alcanzará la planta ese volumen?',

            en: 'This question runs backwards from the earlier ones: you already know where to get to and what is missing is the time. Count how many times one month of growth has to be applied to go from today volume to the target.' },
    opts: { es: oA.es, en: oA.en },
    exp: { es: 'Cada mes el volumen queda multiplicado por ' + dec2(pAr) + ', y hacen falta ' + intN(pAok) + ' aplicaciones de ese factor para pasar de ' + intN(pAe0) + ' a ' + intN(pAT) + ' litros, así que el plazo es de ' + intN(pAok) + ' meses y la obra tendría que arrancar de inmediato. La opción de ' + intN(pAx1) + ' se pasa un mes y la de ' + intN(pAx2) + ' se queda uno corto; en una decisión de inversión con un trimestre de instalación, cualquiera de esos dos errores deja a la planta sin capacidad en plena temporada o con equipo parado. La de ' + intN(pAx3) + ' divide todo el aumento que falta entre los litros que se ganaron el primer mes, es decir supone que cada mes agrega siempre esa misma cantidad, y por eso alarga tanto el plazo: es el error de tratar como lineal un crecimiento porcentual.',
           en: 'Each month the volume is multiplied by ' + dec2(pAr) + ', and it takes ' + intN(pAok) + ' applications of that factor to go from ' + intN(pAe0) + ' to ' + intN(pAT) + ' litres, so the term is ' + intN(pAok) + ' months and the work would have to start at once. The option of ' + intN(pAx1) + ' overshoots by a month and ' + intN(pAx2) + ' falls a month short; in an investment decision with a quarter of installation time, either slip leaves the plant without capacity in mid-season or with equipment standing idle. The one at ' + intN(pAx3) + ' divides the whole increase still needed by the litres gained in the first month, that is, it assumes every month adds that same amount, which is why it stretches the term so far: it is the mistake of treating percentage growth as linear.' }
  }, oA.correctIdx, true);
}

/* ════════════════════════════════════════════════════════════════════════
   LANGUAGE
   Switching rebuilds visible text only. The numbers were drawn once by the
   seeded rng and never change with the language.
   ════════════════════════════════════════════════════════════════════════ */
function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);
  set('lbl-name-el',  t('lbl-name'));
  set('lbl-group-el', t('lbl-group'));
  set('startBtn',     t('btn-start'));
  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));
  var ll = document.getElementById('logo-left');  if (ll) ll.alt = SCHOOL.logoLeftAlt;
  var lr = document.getElementById('logo-right'); if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title = p.i18n.title[LANG];
    p.q     = p.i18n.q[LANG];
    p.hint  = p.i18n.hint[LANG];
    p.exp   = p.i18n.exp[LANG];
    p.opts  = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.q;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.opts[oi] !== undefined) o.innerHTML = p.opts[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.exp;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

/* ════════════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════════════ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  /* Flattens the fraction markup into a slash before the tags are stripped,
     so a rational expression stays readable in the printed sheet. */
  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<span class="mf-den">/g, ' / ')
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/’/g, String.fromCharCode(39))
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/·/g,'*').replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.q);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.opts[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.opts[prob.correctIdx]||'');
    var expRaw = pdfText(prob.exp||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
</body>
</html>
