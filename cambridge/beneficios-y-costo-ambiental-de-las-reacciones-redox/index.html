             en:['Asking for recycled aluminium for as much as possible and showing how much energy it saves compared with taking it from the mineral',
                 'Asking only for aluminium freshly obtained from the mineral, because recycled metal is never good for a building',
                 'Giving up aluminium in the building altogether, because obtaining that metal always uses energy',
                 'Choosing the cheapest material the supplier offers, because environmental cost cannot be compared'] },
      ci:0,
      hint:{ es:'La postura mejor sostenida es la que se puede defender con una cifra y que no exige renunciar al material ni negar su costo.',
             en:'The best supported position is the one that can be defended with a figure and that neither gives up the material nor denies its cost.' },
      exp:{ es:'Reciclar aluminio consume una fracción de la energía que pide reducir el mineral, y esa diferencia se puede calcular y presentar. Las otras posturas se apoyan en una afirmación falsa, renuncian al beneficio o niegan que el costo se pueda medir.',
            en:'Recycling aluminium uses a fraction of the energy that reducing the mineral demands, and that difference can be calculated and presented. The other positions rest on a false claim, give up the benefit or deny that the cost can be measured.' },
      showWork:false }
  ]);
}

function mkP10(rng){
  var Lt = [30, 40, 50][Math.floor(rng() * 3)];
  var k10 = [25, 26, 27][Math.floor(rng() * 3)];
  var d = [5, 6, 7][Math.floor(rng() * 3)];
  var kk = k10 / 10;
  if (rng() < 0.5){
    var tot = Lt * k10 * d / 10;
    return {
      title:{ es:'La cuenta del reparto', en:'The delivery bill' },
      q:{ es:'Un camión de reparto quema ' + Lt + ' litros de diésel al día. Por cada litro que se quema se liberan ' + nf(kk) + ' kg de dióxido de carbono al aire. ¿Cuántos kilogramos de dióxido de carbono deja ese camión en ' + d + ' días de trabajo?',
          en:'A delivery truck burns ' + Lt + ' litres of diesel a day. For each litre burned, ' + nf(kk) + ' kg of carbon dioxide are released into the air. How many kilograms of carbon dioxide does that truck leave in ' + d + ' working days?' },
      opts:{ es:[nf(tot) + ' kg', nf(Lt * k10 / 10) + ' kg', (Lt * d) + ' kg', nf(k10 * d / 10) + ' kg'],
             en:[nf(tot) + ' kg', nf(Lt * k10 / 10) + ' kg', (Lt * d) + ' kg', nf(k10 * d / 10) + ' kg'] },
      ci:0,
      hint:{ es:'Obtén primero lo que deja un solo día de trabajo y después extiéndelo a todos los días. Los litros por sí solos no son kilogramos de gas.',
             en:'First get what a single working day leaves and then extend it to all the days. Litres on their own are not kilograms of gas.' },
      exp:{ es:'Cada día el camión libera ' + nf(Lt * k10 / 10) + ' kg y en ' + d + ' días acumula ' + nf(tot) + ' kg. Ese carbono venía en el combustible y terminó unido al oxígeno del aire al entregarle electrones.',
            en:'Each day the truck releases ' + nf(Lt * k10 / 10) + ' kg and over ' + d + ' days it builds up ' + nf(tot) + ' kg. That carbon came in the fuel and ended up joined to the oxygen of the air after handing electrons to it.' },
      showWork:true };
  }
  var Lt2 = Lt + 20;
  var dif = (Lt2 - Lt) * k10 * d / 10;
  return {
    title:{ es:'Dos camiones comparados', en:'Two trucks compared' },
    q:{ es:'Dos camiones hacen la misma ruta durante ' + d + ' días. El primero quema ' + Lt + ' litros de diésel al día y el segundo, más viejo, quema ' + Lt2 + ' litros al día. Por cada litro quemado se liberan ' + nf(kk) + ' kg de dióxido de carbono. ¿Cuántos kilogramos de más deja el camión viejo en esos días?',
        en:'Two trucks cover the same route for ' + d + ' days. The first burns ' + Lt + ' litres of diesel a day and the second, an older one, burns ' + Lt2 + ' litres a day. For each litre burned, ' + nf(kk) + ' kg of carbon dioxide are released. How many extra kilograms does the old truck leave over those days?' },
    opts:{ es:[nf(dif) + ' kg', nf((Lt2 - Lt) * k10 / 10) + ' kg', ((Lt2 - Lt) * d) + ' kg', nf(Lt2 * k10 * d / 10) + ' kg'],
           en:[nf(dif) + ' kg', nf((Lt2 - Lt) * k10 / 10) + ' kg', ((Lt2 - Lt) * d) + ' kg', nf(Lt2 * k10 * d / 10) + ' kg'] },
    ci:0,
    hint:{ es:'Trabaja con la diferencia de litros diarios, conviértela a kilogramos de gas y solo entonces multiplícala por los días.',
           en:'Work with the difference in daily litres, turn it into kilograms of gas and only then multiply by the days.' },
    exp:{ es:'El camión viejo quema ' + (Lt2 - Lt) + ' litros más al día, que equivalen a ' + nf((Lt2 - Lt) * k10 / 10) + ' kg de gas diarios, y en ' + d + ' días eso da ' + nf(dif) + ' kg de más. Los ' + nf(Lt2 * k10 * d / 10) + ' kg son todo lo que libera el viejo, no la diferencia.',
          en:'The old truck burns ' + (Lt2 - Lt) + ' more litres a day, which come to ' + nf((Lt2 - Lt) * k10 / 10) + ' kg of gas daily, and over ' + d + ' days that gives ' + nf(dif) + ' extra kg. The ' + nf(Lt2 * k10 * d / 10) + ' kg is everything the old one releases, not the difference.' },
    showWork:true };
}

/* ══════════════════════════════════════════════════════════════════════════
   BUILD LESSON - conceptos, manipulativos y problemas intercalados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Lo que estas reacciones te dan y lo que te cobran', en:'What these reactions give you and what they charge you' }),
    '<p>' + L({
      es:'La lámpara de tu bicicleta, el camión que trae la fruta al mercado, las ventanas de aluminio del salón, el blanqueador del baño y hasta el aire que tus células usan para vivir dependen del mismo trato: una sustancia entrega electrones y otra los recibe. Casi todo lo que tu comunidad usa a diario pasa, en algún punto, por una reacción de óxido reducción.',
      en:'The lamp on your bicycle, the truck that brings fruit to the market, the aluminium windows of your classroom, the bleach in the bathroom and even the air your cells use to stay alive all depend on the same deal: one substance hands electrons over and another receives them. Almost everything your community uses every day passes, at some point, through an oxidation reduction reaction.'
    }) + '</p>' +
    '<p>' + L({
      es:'El trato tiene dos caras. La misma transferencia que enciende una lámpara deja metales pesados cuando la pila se rompe en un tiradero; la que mueve un camión deja gases en el aire de la ciudad; la que da forma a una reja termina comiéndosela. En esta guía vas a seguir los electrones, a etiquetarlos con números de oxidación, a medir con cifras concretas lo que se gana y lo que se pierde, y a construir una postura que puedas defender sin negar ninguna de las dos caras.',
      en:'The deal has two faces. The same transfer that lights a lamp leaves heavy metals when the battery breaks open in a dump; the one that moves a truck leaves gases in the city air; the one that shapes a railing ends up eating it away. In this guide you will follow the electrons, label them with oxidation numbers, measure with concrete figures what is gained and what is lost, and build a position you can defend without denying either face.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a poder decidir', en:'What you will be able to decide' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'redox en tu entorno', en:'redox around you' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'transferencia de electrones', en:'transfer of electrons' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'número de oxidación', en:'oxidation number' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'corrosión y protección', en:'corrosion and protection' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'beneficio y costo ambiental', en:'benefit and environmental cost' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'argumentar una postura', en:'arguing a position' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Detrás de cada proceso útil hay alguien que suelta electrones', en:'Behind every useful process someone releases electrons' }),
    '<p>' + L({
      es:'Una reacción de óxido reducción ocurre cuando los electrones cambian de dueño. La sustancia que los suelta se oxida y la que los recoge se reduce, y las dos cosas suceden en el mismo instante: los electrones no se quedan sueltos ni desaparecen en el camino. Por eso, si cuentas los que salen de un lado, tienes también los que entran del otro.',
      en:'An oxidation reduction reaction happens when electrons change owner. The substance that releases them is oxidized and the one that picks them up is reduced, and both things happen at the same instant: electrons are neither left loose nor lost on the way. So if you count the ones leaving on one side, you also have the ones arriving on the other.'
    }) + '</p>' +
    '<p>' + L({
      es:'Ese intercambio es justamente lo que hace útiles a muchos procesos. Una pila entrega corriente mientras su zinc se oxida; un horno saca metal de un mineral porque le entrega electrones; una fogata libera calor porque el carbono se los cede al oxígeno; un objeto queda plateado porque el metal de abajo se los pasa a los iones plata. Reconocer quién entrega y quién recibe es el primer paso para poder juzgar después qué cuesta cada uno de esos beneficios. Hay cambios que parecen reacciones pero no lo son: cuando un antiácido neutraliza al ácido del estómago, los iones solo se reacomodan y nadie pierde ni gana electrones.',
      en:'That exchange is exactly what makes many processes useful. A battery delivers current while its zinc is oxidized; a furnace pulls metal out of a mineral by handing it electrons; a campfire releases heat because carbon passes them to oxygen; an object turns silvery because the metal underneath passes them to silver ions. Recognizing who gives and who receives is the first step towards judging later what each of those benefits costs. Some changes look like reactions but are not: when an antacid neutralizes stomach acid, the ions only rearrange and nobody loses or gains electrons.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Se oxida', en:'Is oxidized' }), L({ es:'pierde electrones', en:'loses electrons' }), L({ es:'el zinc de la pila, el hierro de la reja, el carbono de la leña', en:'the zinc of the battery, the iron of the railing, the carbon of the wood' })) +
      rcard(L({ es:'Se reduce', en:'Is reduced' }), L({ es:'gana electrones', en:'gains electrons' }), L({ es:'el oxígeno del aire, los iones plata, el mineral en el horno', en:'the oxygen of the air, silver ions, the mineral in the furnace' })) +
      rcard(L({ es:'La cuenta cierra', en:'The count closes' }), L({ es:'cedidos = ganados', en:'given up = gained' }), L({ es:'lo que sale de una sustancia entra completo en la otra', en:'what leaves one substance enters the other in full' })) +
      rcard(L({ es:'No siempre hay redox', en:'Not always redox' }), L({ es:'iones que se reacomodan', en:'ions that rearrange' }), L({ es:'disolver, evaporar, precipitar y neutralizar no mueven electrones', en:'dissolving, evaporating, precipitating and neutralizing move no electrons' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Ojo: ', en:'Careful: ' }) + '</strong>' + L({
      es:'oxidarse no exige que haya oxígeno presente. El zinc de una pila se oxida dentro de una pasta donde el oxígeno del aire no participa.',
      en:'being oxidized does not require oxygen to be present. The zinc of a battery is oxidized inside a paste where the oxygen of the air takes no part.'
    }) + '</p></div>'
  );
  wRastro(rng, widgetHost(s1, 'wRastro', 'match'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El número de oxidación: la etiqueta que delata la transferencia', en:'The oxidation number: the label that gives the transfer away' }),
    '<p>' + L({
      es:'Nadie ve los electrones, así que la química usa una etiqueta para seguirlos: el número de oxidación. Es la carga que tendría cada átomo si los electrones compartidos se le adjudicaran por completo al elemento que los jala con más fuerza. Comparando la etiqueta antes y después de un proceso se sabe quién subió, quién bajó y, por lo tanto, en qué dirección viajaron los electrones.',
      en:'Nobody sees electrons, so chemistry uses a label to follow them: the oxidation number. It is the charge each atom would have if the shared electrons were awarded entirely to the element that pulls at them hardest. By comparing the label before and after a process you know who went up, who went down and therefore which way the electrons travelled.'
    }) + '</p>' +
    '<p>' + L({
      es:'Las etiquetas se reparten con unos pocos acuerdos. Un elemento sin combinar vale 0. Un ion sencillo vale lo mismo que su carga. El hidrógeno suele valer +1 y el oxígeno suele valer −2, salvo en los peróxidos como el agua oxigenada, donde vale −1. Y para cerrar la cuenta hay dos reglas de suma: en un compuesto sin carga todos los números juntos deben dar 0, y en un ion poliatómico deben dar la carga del ion. De esas sumas sale el valor del elemento que falta, siempre repartido por átomo. Con la etiqueta puesta puedes reconocer la transferencia en cosas tan distintas como la herrumbre de una reja, el polvo negro de una pila o el azufre que la lluvia ácida deja en las fachadas.',
      en:'The labels are handed out with a few agreements. An uncombined element is worth 0. A simple ion is worth the same as its charge. Hydrogen is usually worth +1 and oxygen is usually worth −2, except in peroxides such as hydrogen peroxide, where it is worth −1. And to close the count there are two adding rules: in a compound with no charge all the numbers together must give 0, and in a polyatomic ion they must give the charge of the ion. Out of those sums comes the value of the missing element, always shared per atom. With the label in place you can recognize the transfer in things as different as the rust on a railing, the black powder in a battery or the sulfur acid rain leaves on facades.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Elemento libre', en:'Free element' }), '0', L({ es:'el hierro de una reja recién pintada sigue valiendo 0', en:'the iron of a freshly painted railing is still worth 0' })) +
      rcard(L({ es:'Hidrógeno y oxígeno', en:'Hydrogen and oxygen' }), '+1 / −2', L({ es:'el oxígeno vale −1 en los peróxidos', en:'oxygen is worth −1 in peroxides' })) +
      rcard(L({ es:'Compuesto neutro', en:'Neutral compound' }), L({ es:'la suma da 0', en:'the total gives 0' }), L({ es:'sirve para Fe<sub>2</sub>O<sub>3</sub>, MnO<sub>2</sub> o SO<sub>2</sub>', en:'works for Fe<sub>2</sub>O<sub>3</sub>, MnO<sub>2</sub> or SO<sub>2</sub>' })) +
      rcard(L({ es:'Ion poliatómico', en:'Polyatomic ion' }), L({ es:'la suma da su carga', en:'the total gives its charge' }), L({ es:'sirve para NO<sub>3</sub><sup>−</sup> o SO<sub>4</sub><sup>2−</sup>', en:'works for NO<sub>3</sub><sup>−</sup> or SO<sub>4</sub><sup>2−</sup>' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La etiqueta se asigna por átomo. Si un elemento aparece dos veces en la fórmula, lo que falta se reparte entre esas dos apariciones.',
      en:'The label is assigned per atom. If an element appears twice in the formula, what is missing is shared between those two appearances.'
    }) + '</p></div>'
  );
  wNumOx(rng, widgetHost(s2, 'wNumOx', 'oxnum'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La corrosión: el costo que nadie pidió', en:'Corrosion: the cost nobody asked for' }),
    '<p>' + L({
      es:'Hay reacciones redox que trabajan a favor de tu comunidad y otras que trabajan en contra sin que nadie las encienda. La corrosión es la más cara de las segundas: el hierro de rejas, puentes, tuberías y barcos entrega electrones al oxígeno del aire y se convierte poco a poco en herrumbre, un material frágil que ya no sostiene nada. Reponer lo que la corrosión destruye consume dinero, energía y metal nuevo, es decir, otra ronda de procesos con su propio costo.',
      en:'Some redox reactions work in your community favour and others work against it without anyone switching them on. Corrosion is the most expensive of the second kind: the iron of railings, bridges, pipes and ships hands electrons over to the oxygen of the air and slowly turns into rust, a brittle material that holds nothing up. Replacing what corrosion destroys uses money, energy and new metal, that is, another round of processes with a cost of their own.'
    }) + '</p>' +
    '<p>' + L({
      es:'La velocidad de ese daño no es fija: depende de las condiciones. El agua es indispensable, así que la humedad del aire acelera el proceso; la sal disuelta permite que la carga circule con facilidad entre las zonas del metal, y por eso una reja frente al mar se carcome mucho más rápido que otra idéntica tierra adentro. Contra eso se usan barreras que impiden el contacto con el agua y el oxígeno, como la pintura, y recubrimientos de un metal que entrega electrones más fácilmente que el hierro, como el zinc del galvanizado, que se oxida en su lugar. Ninguna medida detiene la reacción para siempre, pero cada una cambia la cifra de metal perdido por año.',
      en:'The speed of that damage is not fixed: it depends on conditions. Water is essential, so damp air speeds the process up; dissolved salt lets charge circulate easily between areas of the metal, which is why a railing facing the sea is eaten away far faster than an identical one inland. Against this we use barriers that block contact with water and oxygen, such as paint, and coatings of a metal that hands electrons over more readily than iron, such as the zinc of galvanizing, which is oxidized in its place. No measure stops the reaction forever, but each one changes the figure of metal lost per year.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Qué se oxida', en:'What is oxidized' }), L({ es:'el hierro', en:'the iron' }), L({ es:'entrega electrones y se vuelve herrumbre frágil', en:'hands electrons over and turns into brittle rust' })) +
      rcard(L({ es:'Qué la acelera', en:'What speeds it up' }), L({ es:'humedad y sal', en:'damp and salt' }), L({ es:'el agua es indispensable y la sal deja circular la carga', en:'water is essential and salt lets charge circulate' })) +
      rcard(L({ es:'Barrera', en:'Barrier' }), L({ es:'pintura', en:'paint' }), L({ es:'no cambia el número de oxidación, corta el contacto', en:'it does not change the oxidation number, it cuts contact' })) +
      rcard(L({ es:'Metal de sacrificio', en:'Sacrificial metal' }), L({ es:'zinc', en:'zinc' }), L({ es:'se oxida antes que el hierro y lo mantiene intacto', en:'it is oxidized before the iron and keeps it intact' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'El costo de la corrosión se mide: gramos de metal perdidos por año, piezas repuestas, obras detenidas. Cuando hay cifras, la discusión sobre qué conviene hacer deja de ser una opinión.',
      en:'The cost of corrosion can be measured: grams of metal lost per year, parts replaced, works halted. Once there are figures, the discussion about what to do stops being an opinion.'
    }) + '</p></div>'
  );
  wCorros(rng, widgetHost(s3, 'wCorros', 'slider'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Beneficio y costo, uno junto al otro y con cifras', en:'Benefit and cost, side by side and with figures' }),
    '<p>' + L({
      es:'Valorar un proceso no es decidir si te cae bien: es poner en una columna lo que entrega y en otra lo que cobra, y ver el tamaño de cada cosa. Las pilas dan energía donde no hay enchufe, y a cambio dejan metales que en un tiradero pasan al suelo y al agua. La reducción de minerales entrega el aluminio de una ventana y el cobre de un cable, y a cambio consume enormes cantidades de energía y genera residuos. La combustión mueve camiones y calienta hornos, y a cambio deja gases en el aire que respira la ciudad.',
      en:'Weighing a process up is not deciding whether you like it: it is putting what it delivers in one column and what it charges in another, and looking at the size of each. Batteries give energy where there is no socket, and in exchange they leave metals that in a dump pass into the soil and the water. Reducing minerals delivers the aluminium of a window and the copper of a cable, and in exchange it uses enormous amounts of energy and generates waste. Burning moves trucks and heats furnaces, and in exchange it leaves gases in the air the city breathes.'
    }) + '</p>' +
    '<p>' + L({
      es:'Entre esas dos columnas cabe una tercera, que es la más interesante: las medidas. Reciclar aluminio en vez de sacarlo del mineral consume una fracción de la energía, porque el metal ya fue reducido una vez y solo hay que fundirlo. Un punto de acopio de pilas evita que sus metales terminen en el suelo. Reparar un aparato alarga su vida y ahorra toda la cadena de fabricación. Ninguna medida vuelve el costo cero, pero cada una lo baja en una cantidad que se puede calcular, y esa cifra es lo que convierte una buena intención en un argumento.',
      en:'Between those two columns fits a third, which is the most interesting: measures. Recycling aluminium instead of taking it from the mineral uses a fraction of the energy, because the metal was already reduced once and only needs melting. A battery collection point keeps its metals out of the soil. Repairing a device extends its life and saves the whole manufacturing chain. No measure brings the cost to zero, but each one lowers it by an amount that can be calculated, and that figure is what turns a good intention into an argument.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Pilas', en:'Batteries' }), L({ es:'energía portátil', en:'portable energy' }), L({ es:'a cambio: metales que dañan suelo y agua al desecharlas', en:'in exchange: metals that damage soil and water when discarded' })) +
      rcard(L({ es:'Metales', en:'Metals' }), L({ es:'cables y ventanas', en:'cables and windows' }), L({ es:'a cambio: mucha energía y residuos al reducir el mineral', en:'in exchange: a lot of energy and waste when reducing the mineral' })) +
      rcard(L({ es:'Combustión', en:'Burning' }), L({ es:'transporte y calor', en:'transport and heat' }), L({ es:'a cambio: gases que se quedan en el aire de la ciudad', en:'in exchange: gases that stay in the city air' })) +
      rcard(L({ es:'Medidas', en:'Measures' }), L({ es:'acopio y reciclaje', en:'collection and recycling' }), L({ es:'bajan el costo en una cantidad que se puede calcular', en:'they lower the cost by an amount that can be calculated' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Una afirmación sobre el ambiente vale más cuando trae un número al lado: kilogramos evitados, kilowatt hora ahorrados, gramos de metal que no se perdieron.',
      en:'A claim about the environment is worth more when it comes with a number beside it: kilograms avoided, kilowatt hours saved, grams of metal that were not lost.'
    }) + '</p></div>'
  );
  wBalance(rng, widgetHost(s4, 'wBalance', 'classify'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Sostener una postura sin negar ninguna de las dos caras', en:'Holding a position without denying either face' }),
    '<p>' + L({
      es:'En un debate real casi nadie discute los hechos: se discute qué hacer con ellos. Por eso las posturas más débiles son las que se quedan con la mitad de la historia. Quien pide prohibir de inmediato todo proceso que deje residuos ignora que muchos de esos procesos sostienen el transporte de alimentos o la energía de un hospital. Quien dice que el daño es tan pequeño que no cuenta ignora que los daños pequeños se suman y se miden. Y quien afirma que no hay información confiable suele estar evitando la parte incómoda de la discusión.',
      en:'In a real debate almost nobody argues about the facts: what is argued is what to do with them. That is why the weakest positions are the ones that keep only half the story. Someone who calls for an immediate ban on every process that leaves waste ignores that many of those processes support food transport or the energy of a hospital. Someone who says the harm is so small it does not count ignores that small harms add up and can be measured. And someone who claims there is no reliable information is usually dodging the uncomfortable part of the discussion.'
    }) + '</p>' +
    '<p>' + L({
      es:'Una postura sostenible se arma en tres pasos: reconocer el beneficio real, reconocer el costo real y proponer una acción posible con lo que hay, acompañada de una cifra. No se trata de renunciar a las pilas, a los metales o al transporte, sino de decidir dónde usarlos, qué se recupera después y qué alternativa existe hoy. Cuando además puedes decir cuánto se ahorra o cuánto se evita, tu argumento deja de ser una preferencia y se vuelve algo que otro puede comprobar, discutir o mejorar.',
      en:'A sustainable position is built in three steps: acknowledge the real benefit, acknowledge the real cost and propose an action that is possible with what exists, backed by a figure. It is not about giving up batteries, metals or transport, but about deciding where to use them, what gets recovered afterwards and what alternative exists today. When you can also say how much is saved or how much is avoided, your argument stops being a preference and becomes something someone else can check, discuss or improve.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Paso 1', en:'Step 1' }), L({ es:'reconoce el beneficio', en:'acknowledge the benefit' }), L({ es:'di para qué sirve el proceso y quién depende de él', en:'say what the process is for and who depends on it' })) +
      rcard(L({ es:'Paso 2', en:'Step 2' }), L({ es:'reconoce el costo', en:'acknowledge the cost' }), L({ es:'di qué deja atrás y a quién le llega', en:'say what it leaves behind and who it reaches' })) +
      rcard(L({ es:'Paso 3', en:'Step 3' }), L({ es:'propone y mide', en:'propose and measure' }), L({ es:'una acción posible hoy, con la cifra que la respalda', en:'an action possible today, with the figure that backs it' })) +
      rcard(L({ es:'Postura débil', en:'Weak position' }), L({ es:'media historia', en:'half the story' }), L({ es:'prohibir sin alternativa, minimizar el daño o negar los datos', en:'banning with no alternative, playing harm down or denying the data' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Una buena postura admite objeciones. Si nadie puede discutirte con datos, probablemente todavía no dijiste nada concreto.',
      en:'A good position admits objections. If nobody can argue back with data, you probably have not said anything concrete yet.'
    }) + '</p></div>'
  );
  wPlan(rng, widgetHost(s5, 'wPlan', 'weigh'));
  wPostura(rng, widgetHost(s5, 'wPostura', 'reflect'));
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  addProblem(rng, mkP10(rng));
}
</script>
