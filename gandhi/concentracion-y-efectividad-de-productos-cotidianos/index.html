<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concentración y Efectividad de Productos Cotidianos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Concentración y Efectividad de Productos Cotidianos</div>
    <div class="wcourse" id="wcourse-el">Química · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Concentración y Efectividad de Productos Cotidianos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#4a8a1e', primaryDark:'#24460e', primaryBg:'#edf5e7',
  accent:'#1a1a1a', accentBg:'#ededed',
  darkPrimary:'#79c247', darkPrimaryDark:'#a3e377', darkPrimaryBg:'#1f390d',

function saveSession() {

  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_qui3_t04_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('qui3_t04_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

/* ==========================================================================
   MANIPULATIVO 1 :: prueba de eficacia
   Dos medidores responden al instante mientras el alumno mueve la
   concentración: uno mide el efecto que se busca y otro el desperdicio.
   El reto es hallar el punto más bajo que ya entrega el efecto completo.
   ========================================================================== */
function w1(rng, host){
  var R = shuffle(EFIC, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false, p = null, cur = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Prueba de eficacia', en:'Effectiveness test' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve la concentración y observa los dos medidores. Detente en el valor más bajo con el que el efecto ya llega al máximo.',
      en:'Move the concentration and watch the two meters. Stop at the lowest value at which the effect already reaches its maximum.'
    }) + '</div>' +
    '<div class="gw-lbl" data-r="ctl"></div>' +
    '<input class="gw-rng" type="range" data-r="rng">' +
    '<div class="ef-scale"><i class="ef-band" data-r="band" style="display:none"></i><span class="ef-mark" data-r="mark" style="left:0%"></span></div>' +
    '<div class="ef-ends"><span>0 %</span><span data-r="end"></span></div>' +
    '<div class="ef-grid">' +
      '<div><div class="gw-lbl">' + L({ es:'Efecto que se busca', en:'Effect you are after' }) + '</div><div class="ef-bar"><i data-r="b1"></i></div></div>' +
      '<div><div class="gw-lbl">' + L({ es:'Desperdicio y daño', en:'Waste and damage' }) + '</div><div class="ef-bar"><i class="warn" data-r="b2"></i></div></div>' +
    '</div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elC = host.querySelector('[data-r="ctl"]'),
      elR = host.querySelector('[data-r="rng"]'),
      elBand = host.querySelector('[data-r="band"]'),
      elMk = host.querySelector('[data-r="mark"]'),
      elEnd = host.querySelector('[data-r="end"]'),
      el1 = host.querySelector('[data-r="b1"]'),
      el2 = host.querySelector('[data-r="b2"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function efecto(){
    var r = cur / p.lo;
    if (r >= 1) return 100;
    return Math.max(0, Math.round(100 * r * r * r));
  }
  function gasto(){
    if (cur <= p.hi) return 0;
    return Math.min(100, Math.round(100 * (cur - p.hi) / (p.max - p.hi)));
  }
  function snap(x){ return r2(Math.round(x / p.step) * p.step); }

  function roundData(){
    var f = pk(rng, [0.25, 0.4, 0.55, 1.7, 2.1]);
    cur = Math.max(0, Math.min(p.max, snap(p.lo * f)));
    if (Math.abs(cur - p.lo) < p.step / 2) cur = Math.max(0, snap(p.lo - 2 * p.step));
    tries = 0; locked = false;
    elR.min = '0'; elR.max = String(p.max); elR.step = String(p.step); elR.value = String(cur);
    elBand.style.display = 'none';
  }

  function draw(){
    var e = efecto(), g = gasto();
    elT.innerHTML = L(p.name);
    elC.innerHTML = L({ es:'Concentración de ', en:'Concentration of ' }) + L(p.comp) +
      ': <span class="gw-val">' + fmt(cur) + ' %</span>';
    elEnd.textContent = fmt(p.max) + ' %';
    elMk.style.left = (cur / p.max * 100) + '%';
    el1.style.width = e + '%';
    el2.style.width = g + '%';
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Concentración', en:'Concentration' }) + '</div><div class="v">' + fmt(cur) + ' %</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Efecto', en:'Effect' }) + '</div><div class="v">' + e + ' %</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Desperdicio', en:'Waste' }) + '</div><div class="v">' + g + ' %</div></div>';
    elR.disabled = locked || done;
  }

  function reveal(){
    elBand.style.display = 'block';
    elBand.style.left = (p.lo / p.max * 100) + '%';
    elBand.style.width = ((p.hi - p.lo) / p.max * 100) + '%';
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres productos probados. En los tres, el efecto aparece a partir de cierta concentración y deja de crecer: pasado ese punto solo sube el desperdicio.',
        en:'Three products tested. In all three, the effect appears from a certain concentration onwards and stops growing: past that point only the waste goes up.'
      }));
      return;
    }
    p = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro producto en la mesa. Busca su punto de arranque.', en:'Another product on the bench. Look for its starting point.' }));
  }

  function close(cls, txt){
    locked = true;
    reveal();
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente producto', en:'Next product' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (Math.abs(cur - p.lo) < p.step / 2){
      close('good', L({
        es:'Ese es el punto. Con ' + fmt(p.lo) + ' % el efecto ya está completo, y la franja verde muestra hasta dónde sigue conviniendo: ' + fmt(p.hi) + ' %.',
        en:'That is the point. At ' + fmt(p.lo) + ' % the effect is already complete, and the green band shows how far it is still worth going: ' + fmt(p.hi) + ' %.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = p.lo;
      elR.value = String(cur);
      close('warm', L({
        es:'El arranque está en ' + fmt(p.lo) + ' %. ' + L(p.under) + ' ' + L(p.over),
        en:'The starting point is at ' + fmt(p.lo) + ' %. ' + L(p.under) + ' ' + L(p.over)
      }));
      return;
    }
    say(host, 'miss', cur < p.lo
      ? L({ es:'Todavía no. El medidor de efecto marca ' + efecto() + ' %: sube la concentración.',
            en:'Not yet. The effect meter reads ' + efecto() + ' %: raise the concentration.' })
      : L({ es:'El efecto ya está completo, pero puedes bajar y conservarlo. Busca más abajo.',
            en:'The effect is already complete, but you can go lower and keep it. Look further down.' }));
  }

  elR.addEventListener('input', function(){
    if (locked || done) return;
    cur = r2(parseFloat(elR.value));
    draw();
    var e = efecto(), g = gasto();
    if (Math.abs(cur - p.lo) < p.step / 2){
      say(host, 'warm', L({ es:'Aquí el efecto llega al máximo por primera vez. Comprueba para confirmarlo.',
                            en:'Here the effect reaches its maximum for the first time. Check to confirm it.' }));
    } else if (e < 100){
      say(host, '', L({ es:'El efecto va en ' + e + ' %. Falta concentración para que el producto haga su trabajo.',
                        en:'The effect stands at ' + e + ' %. More concentration is needed for the product to do its job.' }));
    } else if (g > 0){
      say(host, '', L({ es:'Efecto completo, pero el segundo medidor ya subió a ' + g + ' %: estás gastando de más.',
                        en:'Full effect, but the second meter already rose to ' + g + ' %: you are spending more than needed.' }));
    } else {
      say(host, '', L({ es:'Efecto completo y sin desperdicio. Aun así, prueba valores más bajos.',
                        en:'Full effect and no waste. Even so, try lower values.' }));
    }
  });
  elB.addEventListener('click', check);
  p = R[0];
  roundData();
  draw();
  say(host, '', L({ es:'Mueve el control y observa cuándo despega el medidor de efecto.',
                    en:'Move the control and watch when the effect meter takes off.' }));
}

/* ==========================================================================
   MANIPULATIVO 2 :: dosificador masa sobre volumen
   El volumen de la disolución queda fijo y el alumno agrega o retira gramos
   del componente; la etiqueta en g por cada 100 mL se recalcula al instante.
   ========================================================================== */
function w2(rng, host){
  var R = shuffle(DOSIS, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false, p = null, cur = 0, i;
  var pos = [];
  for (i = 0; i < 30; i++) pos.push([7 + Math.floor(rng() * 100), 6 + Math.floor(rng() * 96)]);

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Dosificador de la disolución', en:'Solution dispenser' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'El volumen del frasco ya está medido y no cambia. Ajusta los gramos del componente hasta que la etiqueta marque lo que pide la preparación.',
      en:'The volume in the bottle is already measured and does not change. Adjust the grams of the component until the label shows what the preparation asks for.'
    }) + '</div>' +
    '<div class="dz-wrap">' +
      '<div><div class="dz-jar" data-r="jar"></div><div class="dz-cap" data-r="cap"></div></div>' +
      '<div class="dz-side">' +
        '<div class="gw-lbl" data-r="ctl"></div>' +
        '<input class="gw-rng" type="range" data-r="rng">' +
        '<div class="gw-read" data-r="read"></div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elJ = host.querySelector('[data-r="jar"]'),
      elCap = host.querySelector('[data-r="cap"]'),
      elC = host.querySelector('[data-r="ctl"]'),
      elR = host.querySelector('[data-r="rng"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function pct(){ return cur / p.V * 100; }

  function roundData(){
    var f = pk(rng, [0.25, 0.5, 0.6, 1.5, 1.8]);
    cur = Math.max(0, Math.min(p.max, r2(Math.round(p.s * f / p.step) * p.step)));
    if (Math.abs(cur - p.s) < p.step / 2) cur = Math.max(0, r2(cur - 2 * p.step));
    tries = 0; locked = false;
    elR.min = '0'; elR.max = String(p.max); elR.step = String(p.step); elR.value = String(cur);
  }

  function draw(){
    var nd = Math.round(30 * cur / p.max), dots = '', k;
    for (k = 0; k < nd; k++) dots += '<div class="dz-gr" style="left:' + pos[k][0] + 'px;bottom:' + pos[k][1] + 'px"></div>';
    elJ.innerHTML = '<div class="dz-liq" style="height:112px"></div>' + dots;
    elCap.innerHTML = fmt(p.V) + ' mL ' + L({ es:'de disolución', en:'of solution' });
    elT.innerHTML = L(p.name) + '  ·  ' + L({ es:'la receta pide ', en:'the recipe asks for ' }) + fmt(p.p) + ' % m/v';
    elC.innerHTML = L({ es:'Masa de ', en:'Mass of ' }) + L(p.comp) + ': <span class="gw-val">' + fmt(cur) + ' g</span>';
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Componente', en:'Component' }) + '</div><div class="v">' + fmt(cur) + ' g</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Disolución', en:'Solution' }) + '</div><div class="v">' + fmt(p.V) + ' mL</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Etiqueta', en:'Label' }) + '</div><div class="v">' + fmt(pct()) + ' %</div></div>';
    elR.disabled = locked || done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres preparaciones listas. En todas, la etiqueta contó los gramos del componente por cada 100 mL de disolución terminada, no por cada 100 mL de agua.',
        en:'Three preparations ready. In all of them, the label counted the grams of the component in every 100 mL of finished solution, not in every 100 mL of water.'
      }));
      return;
    }
    p = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro frasco en la mesa. Ajusta su etiqueta.', en:'Another bottle on the bench. Adjust its label.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente frasco', en:'Next bottle' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = pct() - p.p;
    if (Math.abs(d) < 0.03){
      close('good', L({
        es:'Coincide. ' + fmt(cur) + ' g repartidos en ' + fmt(p.V) + ' mL equivalen a ' + fmt(p.p) + ' g en cada 100 mL.',
        en:'It matches. ' + fmt(cur) + ' g spread through ' + fmt(p.V) + ' mL is the same as ' + fmt(p.p) + ' g in every 100 mL.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cur = p.s;
      elR.value = String(cur);
      close('warm', L({
        es:'La masa exacta es ' + fmt(p.s) + ' g: repartida en ' + fmt(p.V) + ' mL, la etiqueta marca ' + fmt(p.p) + ' % m/v.',
        en:'The exact mass is ' + fmt(p.s) + ' g: spread through ' + fmt(p.V) + ' mL, the label reads ' + fmt(p.p) + ' % m/v.'
      }));
      return;
    }
    say(host, 'miss', d > 0
      ? L({ es:'La etiqueta va ' + fmt(d) + ' puntos arriba de lo pedido: retira componente.',
            en:'The label is ' + fmt(d) + ' points above what was asked: take out some component.' })
      : L({ es:'Faltan ' + fmt(-d) + ' puntos para lo pedido: agrega componente.',
            en:'You are ' + fmt(-d) + ' points short of what was asked: add more component.' }));
  }

  elR.addEventListener('input', function(){
    if (locked || done) return;
    cur = r2(parseFloat(elR.value));
    draw();
    var d = pct() - p.p;
    if (Math.abs(d) < 0.03){
      say(host, 'warm', L({ es:'La etiqueta ya marca lo que pide la receta. Comprueba para confirmarlo.',
                            en:'The label already shows what the recipe asks for. Check to confirm it.' }));
    } else if (d > 0){
      say(host, '', L({ es:'Vas ' + fmt(d) + ' puntos arriba. El volumen sigue fijo, así que solo cambia la parte de arriba.',
                        en:'You are ' + fmt(d) + ' points over. The volume stays fixed, so only the top part changes.' }));
    } else {
      say(host, '', L({ es:'Vas ' + fmt(-d) + ' puntos abajo. El volumen sigue fijo, así que solo cambia la parte de arriba.',
                        en:'You are ' + fmt(-d) + ' points under. The volume stays fixed, so only the top part changes.' }));
    }
  });
  elB.addEventListener('click', check);
  p = R[0];
  roundData();
  draw();
  say(host, '', L({ es:'Agrega o retira componente y mira cómo responde la etiqueta.',
                    en:'Add or remove component and watch how the label responds.' }));
}

/* ==========================================================================
   MANIPULATIVO 3 :: estante comparado
   Tres etiquetas escritas de formas distintas. El alumno las acomoda de menor
   a mayor concentración tocándolas; puede sacarlas y volverlas a poner.
   ========================================================================== */
function w3(rng, host){
  var R = shuffle(ESTANTE, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false, c = null, pool = [], slots = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Estante comparado', en:'Compared shelf' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca cada etiqueta para colocarla y toca una casilla para regresarla al estante. Acomódalas de la menos concentrada a la más concentrada.',
      en:'Tap each label to place it and tap a slot to send it back to the shelf. Arrange them from the least concentrated to the most concentrated.'
    }) + '</div>' +
    '<div class="so-cap"><span>' + L({ es:'menos concentrada', en:'least concentrated' }) + '</span><span>' + L({ es:'más concentrada', en:'most concentrated' }) + '</span></div>' +
    '<div class="so-slots" data-r="slots"></div>' +
    '<div class="gw-lbl">' + L({ es:'Etiquetas del estante', en:'Labels on the shelf' }) + '</div>' +
    '<div class="so-pool" data-r="pool"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elS = host.querySelector('[data-r="slots"]'),
      elP = host.querySelector('[data-r="pool"]'),
      elB = host.querySelector('[data-r="chk"]');

  function roundData(){
    pool = shuffle(c.items, rng).slice();
    slots = [null, null, null];
    tries = 0; locked = false;
  }

  function drawSlots(state){
    var h = '', k, it;
    for (k = 0; k < 3; k++){
      it = slots[k];
      var cls = 'so-slot' + (it ? ' full' : '') + (it && state ? ' ' + state[k] : '');
      h += '<div class="' + cls + '" data-k="' + k + '">' +
        (it ? '<span><strong>' + L(it.n) + '</strong><br>' + L(it.raw) + (locked ? '<br>' + fmt(it.pc) + ' ' + L({ es:'por cada 100', en:'in every 100' }) : '') + '</span>'
            : (k + 1)) +
        '</div>';
    }
    elS.innerHTML = h;
    elS.querySelectorAll('.so-slot').forEach(function(d){
      d.addEventListener('click', function(){
        if (locked || done) return;
        var k2 = parseInt(d.dataset.k, 10);
        if (!slots[k2]) return;
        pool.push(slots[k2]); slots[k2] = null;
        drawAll();
        say(host, '', L({ es:'Etiqueta devuelta al estante. Puedes reacomodar cuantas veces quieras.',
                          en:'Label sent back to the shelf. You can rearrange as many times as you like.' }));
      });
    });
  }

  function drawPool(){
    elP.innerHTML = pool.map(function(it, idx){
      return '<button class="gw-tile" data-i="' + idx + '"' + ((locked || done) ? ' disabled' : '') + '><strong>' + L(it.n) + '</strong><small>' + L(it.raw) + '</small></button>';
    }).join('');
    elP.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){
        if (locked || done) return;
        var k = slots.indexOf(null);
        if (k === -1) return;
        var it = pool.splice(parseInt(b.dataset.i, 10), 1)[0];
        slots[k] = it;
        drawAll();
        if (slots.indexOf(null) === -1){
          say(host, 'warm', L({ es:'Las tres están colocadas. Comprueba tu orden.', en:'All three are placed. Check your order.' }));
        } else {
          say(host, '', L({ es:'Colocada en el lugar ' + (k + 1) + '. Piensa cuánto componente hay en cada 100 de producto.',
                            en:'Placed in position ' + (k + 1) + '. Think about how much component there is in every 100 of product.' }));
        }
      });
    });
  }

  function drawAll(state){
    elT.innerHTML = L({ es:'Etiquetas de ', en:'Labels of ' }) + L(c.comp) + '  ·  ' + L(c.ask);
    drawSlots(state);
    drawPool();
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      drawAll();
      say(host, 'good', L({
        es:'Tres estantes ordenados. Cuando las etiquetas se llevan todas a una base de 100, los productos se pueden comparar aunque estén escritos de formas distintas.',
        en:'Three shelves sorted. When every label is taken to a base of 100, the products can be compared even if they are written in different ways.'
      }));
      return;
    }
    c = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    drawAll();
    say(host, '', L({ es:'Otro estante. Vuelve a acomodar de menor a mayor.', en:'Another shelf. Sort again from lowest to highest.' }));
  }

  function close(cls, txt, state){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente estante', en:'Next shelf' });
    elB.className = 'gw-btn solved';
    drawAll(state);
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (slots.indexOf(null) !== -1){
      say(host, 'miss', L({ es:'Todavía falta colocar etiquetas en el estante.', en:'There are still labels to place on the shelf.' }));
      return;
    }
    var sorted = c.items.slice().sort(function(a, b){ return a.pc - b.pc; });
    var state = slots.map(function(it, k){ return it.pc === sorted[k].pc ? 'ok' : 'bad'; });
    var hits = state.filter(function(x){ return x === 'ok'; }).length;
    if (hits === 3){
      close('good', L({
        es:'Orden correcto: ' + sorted.map(function(x){ return L(x.n) + ' (' + fmt(x.pc) + ')'; }).join(', ') + '. Cada número dice cuánto componente hay en cada 100 de producto.',
        en:'Correct order: ' + sorted.map(function(x){ return L(x.n) + ' (' + fmt(x.pc) + ')'; }).join(', ') + '. Each number states how much component there is in every 100 of product.'
      }), state);
      return;
    }
    tries++;
    if (tries >= 3){
      slots = sorted.slice();
      pool = [];
      close('warm', L({
        es:'Así queda el estante: ' + sorted.map(function(x){ return L(x.n) + ' (' + fmt(x.pc) + ')'; }).join(', ') + '. Las etiquetas que no venían en porcentaje había que llevarlas primero a base de 100.',
        en:'This is how the shelf ends up: ' + sorted.map(function(x){ return L(x.n) + ' (' + fmt(x.pc) + ')'; }).join(', ') + '. The labels that did not come as a percentage had to be taken to a base of 100 first.'
      }), sorted.map(function(){ return 'ok'; }));
      return;
    }
    say(host, 'miss', hits === 0
      ? L({ es:'Ninguna quedó en su lugar. Convierte cada etiqueta a cuánto componente hay en cada 100 antes de compararlas.',
            en:'None ended up in its place. Convert each label to how much component there is in every 100 before comparing them.' })
      : L({ es:'Van ' + hits + ' de 3 en su lugar. Revisa las que traen cantidades sobre volúmenes distintos de 100.',
            en:'You have ' + hits + ' of 3 in place. Check the ones with amounts over volumes other than 100.' }));
  }

  elB.addEventListener('click', check);
  c = R[0];
  roundData();
  drawAll();
  say(host, '', L({ es:'Toca una etiqueta para colocarla en el estante.', en:'Tap a label to place it on the shelf.' }));
}

/* ==========================================================================
   MANIPULATIVO 4 :: mezclador de dilución
   El alumno reparte partes de concentrado y partes de agua en la cubeta; la
   concentración de uso se recalcula sola y hay más de una mezcla válida.
   ========================================================================== */
function w4(rng, host){
  var R = shuffle(DILU, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, done = false, p = null, cp = 1, wp = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mezclador de la cubeta', en:'Bucket mixer' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Reparte partes de concentrado y partes de agua hasta que la mezcla quede en la concentración que indica el envase. Hay más de una manera de lograrlo.',
      en:'Share out parts of concentrate and parts of water until the mixture reaches the concentration stated on the container. There is more than one way to do it.'
    }) + '</div>' +
    '<div class="dl-need" data-r="need"></div>' +
    '<div class="dl-wrap" style="margin-top:.7rem">' +
      '<div class="dl-bucket" data-r="bkt"></div>' +
      '<div class="dl-side">' +
        '<div class="dl-ctrl"><span class="gw-lbl" style="margin:0;flex:1">' + L({ es:'Partes de concentrado', en:'Parts of concentrate' }) + '</span>' +
          '<button class="gw-btn" data-r="cm">−</button><span class="dl-num" data-r="cn"></span><button class="gw-btn" data-r="cp">+</button></div>' +
        '<div class="dl-ctrl"><span class="gw-lbl" style="margin:0;flex:1">' + L({ es:'Partes de agua', en:'Parts of water' }) + '</span>' +
          '<button class="gw-btn" data-r="wm">−</button><span class="dl-num" data-r="wn"></span><button class="gw-btn" data-r="wp">+</button></div>' +
        '<div class="gw-read" data-r="read"></div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elN = host.querySelector('[data-r="need"]'),
      elBk = host.querySelector('[data-r="bkt"]'),
      elCn = host.querySelector('[data-r="cn"]'),
      elWn = host.querySelector('[data-r="wn"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function fin(){ return p.p0 * cp / (cp + wp); }

  function roundData(){
    cp = 1;
    wp = pk(rng, [0, 1, 8, 10]);
    tries = 0; locked = false;
  }

  function draw(){
    var f = fin(), tot = cp + wp;
    var hc = Math.round(126 * cp / tot);
    elBk.innerHTML = '<div class="dl-water" style="height:126px"></div><div class="dl-conc" style="height:' + hc + 'px"></div>';
    elT.innerHTML = L(p.name) + '  ·  ' + fmt(p.p0) + ' % ' + L({ es:'en el envase', en:'in the container' });
    elN.innerHTML = '<strong>' + L({ es:'Indicación de uso: ', en:'Directions for use: ' }) + '</strong>' +
      L({ es:'para ' + L(p.use) + ', la mezcla debe quedar al ' + fmt(p.tgt) + ' % de ' + L(p.comp) + '.',
          en:'for ' + L(p.use) + ', the mixture must end up at ' + fmt(p.tgt) + ' % of ' + L(p.comp) + '.' });
    elCn.textContent = String(cp);
    elWn.textContent = String(wp);
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Concentrado', en:'Concentrate' }) + '</div><div class="v">' + cp + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Mezcla total', en:'Whole mixture' }) + '</div><div class="v">' + tot + '</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Queda al', en:'Ends up at' }) + '</div><div class="v">' + fmt(f) + ' %</div></div>';
    host.querySelectorAll('.dl-ctrl .gw-btn').forEach(function(b){ b.disabled = locked || done; });
  }

  function live(){
    var d = fin() - p.tgt;
    if (Math.abs(d) < 0.02){
      say(host, 'warm', L({ es:'La mezcla ya quedó en la concentración que pide el envase. Comprueba para confirmarlo.',
                            en:'The mixture is already at the concentration the container asks for. Check to confirm it.' }));
    } else if (d > 0){
      say(host, '', L({ es:'Va ' + fmt(d) + ' puntos arriba de lo indicado: falta agua en la cubeta.',
                        en:'It is ' + fmt(d) + ' points above the directions: the bucket needs more water.' }));
    } else {
      say(host, '', L({ es:'Va ' + fmt(-d) + ' puntos abajo de lo indicado: hay demasiada agua para ese concentrado.',
                        en:'It is ' + fmt(-d) + ' points below the directions: there is too much water for that concentrate.' }));
    }
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres cubetas preparadas. En las tres, lo que decide la mezcla es la proporción entre el concentrado y el total, no cuántas cubetas se preparen.',
        en:'Three buckets prepared. In all three, what decides the mixture is the proportion between the concentrate and the whole, not how many buckets are prepared.'
      }));
      return;
    }
    p = R[rd];
    roundData();
    elB.textContent = L({ es:'Comprobar', en:'Check' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otro producto concentrado. Lee su indicación y reparte las partes.',
                      en:'Another concentrated product. Read its directions and share out the parts.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente producto', en:'Next product' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = fin() - p.tgt;
    if (Math.abs(d) < 0.02){
      close('good', L({
        es:'Queda al ' + fmt(p.tgt) + ' %. De cada ' + (cp + wp) + ' partes de mezcla, ' + cp + ' son de un producto al ' + fmt(p.p0) + ' %, y el resto es agua.',
        en:'It ends up at ' + fmt(p.tgt) + ' %. Out of every ' + (cp + wp) + ' parts of mixture, ' + cp + ' come from a product at ' + fmt(p.p0) + ' %, and the rest is water.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      cp = 1; wp = Math.round(p.p0 / p.tgt) - 1;
      close('warm', L({
        es:'Una mezcla que cumple es 1 parte de concentrado con ' + wp + ' de agua: el producto se reparte en ' + (wp + 1) + ' partes de mezcla y baja de ' + fmt(p.p0) + ' % a ' + fmt(p.tgt) + ' %.',
        en:'One mixture that works is 1 part of concentrate with ' + wp + ' of water: the product spreads through ' + (wp + 1) + ' parts of mixture and drops from ' + fmt(p.p0) + ' % to ' + fmt(p.tgt) + ' %.'
      }));
      return;
    }
    say(host, 'miss', d > 0
      ? L({ es:'Todavía queda ' + fmt(d) + ' puntos más concentrada de lo indicado. Agrega agua o quita concentrado.',
            en:'It is still ' + fmt(d) + ' points more concentrated than the directions. Add water or take out concentrate.' })
      : L({ es:'Quedó ' + fmt(-d) + ' puntos más diluida de lo indicado. Quita agua o agrega concentrado.',
            en:'It ended up ' + fmt(-d) + ' points more diluted than the directions. Take out water or add concentrate.' }));
  }

  function bind(sel, fn){
    host.querySelector(sel).addEventListener('click', function(){
      if (locked || done) return;
      fn();
      draw();
      live();
    });
  }
  bind('[data-r="cp"]', function(){ if (cp < 6) cp++; });
  bind('[data-r="cm"]', function(){ if (cp > 1) cp--; });
  bind('[data-r="wp"]', function(){ if (wp < 15) wp++; });
  bind('[data-r="wm"]', function(){ if (wp > 0) wp--; });
  elB.addEventListener('click', check);
  p = R[0];
  roundData();
  draw();
  say(host, '', L({ es:'Cambia las partes y observa cómo se mueve la concentración final.',
                    en:'Change the parts and watch how the final concentration moves.' }));
}

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
