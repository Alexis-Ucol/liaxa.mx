      '<div class="pstmt">' + prob.q + '</div>' +
      work +
      '<button class="hintbtn" onclick="toggleHint(' + i + ')">' + t('btn-hint') + '</button>' +
      '<div class="hintbox" id="hint' + i + '">' + (prob.hint || '') + '</div>' +
      '<div style="margin-top:.7rem">' +
        '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:.65rem;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin-bottom:.5rem">' + t('lbl-answer') + '</div>' +
        '<div class="mcopts">' + opts + '</div>' +
        '<div class="mcfb" id="fb' + i + '"></div>' +
      '</div>' +
    '</div>';
  document.getElementById('lessonBody').appendChild(card);
  if (prob.showWork) setTimeout(function() { var c = document.getElementById('dc' + i); if (c) initCanvas(c); }, 80);
}

/* ════════════════════════════════════════════════════════════════════════
   SECTION REGISTRY  (concept text is re-rendered on language switch)
   ════════════════════════════════════════════════════════════════════════ */
function addSection(fn) {
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = fn(LANG);
  document.getElementById('lessonBody').appendChild(d);
  sectionDefs.push({ el: d, fn: fn });
}
function applySectionLang() {
  sectionDefs.forEach(function(s) { s.el.innerHTML = s.fn(LANG); });
}

/* ════════════════════════════════════════════════════════════════════════
   ITEM ASSEMBLY
   Each item keeps both languages in i18n. The student always reads one of
   them: q, opts, hint and exp hold the active language and are the only
   fields the cards and the PDF ever touch.
   The runtime gate dumps questionText, options and explanation for external
   review, so those three carry both versions tagged ES and EN. They are an
   audit surface, never rendered anywhere in the guide.
   ════════════════════════════════════════════════════════════════════════ */
function bothTxt(o) {
  return (o.es === o.en) ? o.es : ('[ES] ' + o.es + '\n[EN] ' + o.en);
}
function bothOpts(o) {
  return o.es.map(function(s, i) {
    return (s === o.en[i]) ? s : ('[ES] ' + s + '   [EN] ' + o.en[i]);
  });
}
function mk(i18n, correctIdx, showWork) {
  return {
    i18n: i18n, correctIdx: correctIdx, showWork: showWork,
    title: i18n.title[LANG],
    q:     i18n.q[LANG],
    hint:  i18n.hint[LANG],
    exp:   i18n.exp[LANG],
    opts:  i18n.opts[LANG].slice(),
    questionText: bothTxt(i18n.q),
    explanation:  bothTxt(i18n.exp),
    options:      bothOpts(i18n.opts)
  };
}
function addItem(i18n, correctIdx, showWork) {
  var d = mk(i18n, correctIdx, showWork);
  problems.push({
    i18n: d.i18n, title: d.title, q: d.q, hint: d.hint, exp: d.exp, opts: d.opts,
    questionText: d.questionText, options: d.options, explanation: d.explanation,
    correctIdx: d.correctIdx, showWork: d.showWork,
    studentChoice: null, pendingChoice: null
  });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}

/* ════════════════════════════════════════════════════════════════════════
   PLANE PRIMITIVES
   The three tools draw on the same kind of plane, so the axes, the grid and
   the scale always look alike and the student reads one picture, not three.
   Colours come from the CSS tokens, so the plane follows the theme.
   ════════════════════════════════════════════════════════════════════════ */
var SVW = 340, SVH = 232, SVL = 42, SVR = 12, SVT = 14, SVB = 30;
function mapX(x, xmin, xmax) { return SVL + (x - xmin) / (xmax - xmin) * (SVW - SVL - SVR); }
function mapY(y, ymin, ymax) { return (SVH - SVB) - (y - ymin) / (ymax - ymin) * (SVH - SVB - SVT); }
function svgNum(v) { return (Math.round(v * 10) / 10).toString(); }
function svgOpen() {
  return '<svg viewBox="0 0 ' + SVW + ' ' + SVH + '" xmlns="http://www.w3.org/2000/svg" role="img">';
}
function gridSvg(xmin, xmax, ymin, ymax, xlab, ylab, xticks, yticks) {
  var s = '', i, gx, gy;
  for (i = 0; i <= 4; i++) {
    gx = xmin + (xmax - xmin) * i / 4;
    s += '<line x1="' + svgNum(mapX(gx, xmin, xmax)) + '" y1="' + SVT + '" x2="' + svgNum(mapX(gx, xmin, xmax)) + '" y2="' + (SVH - SVB) + '" stroke="var(--border)" stroke-width="0.6"/>';
    gy = ymin + (ymax - ymin) * i / 4;
    s += '<line x1="' + SVL + '" y1="' + svgNum(mapY(gy, ymin, ymax)) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(mapY(gy, ymin, ymax)) + '" stroke="var(--border)" stroke-width="0.6"/>';
  }
  var y0 = mapY(Math.max(ymin, Math.min(ymax, 0)), ymin, ymax);
  var x0 = mapX(Math.max(xmin, Math.min(xmax, 0)), xmin, xmax);
  s += '<line x1="' + SVL + '" y1="' + svgNum(y0) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(y0) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  s += '<line x1="' + svgNum(x0) + '" y1="' + SVT + '" x2="' + svgNum(x0) + '" y2="' + (SVH - SVB) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  for (i = 0; i < xticks.length; i++) {
    s += '<text x="' + svgNum(mapX(xticks[i].v, xmin, xmax)) + '" y="' + (SVH - SVB + 12) + '" font-size="8" fill="var(--text3)" text-anchor="middle">' + xticks[i].t + '</text>';
  }
  for (i = 0; i < yticks.length; i++) {
    s += '<text x="' + (SVL - 4) + '" y="' + svgNum(mapY(yticks[i].v, ymin, ymax) + 3) + '" font-size="8" fill="var(--text3)" text-anchor="end">' + yticks[i].t + '</text>';
  }
  s += '<text x="' + (SVW - SVR) + '" y="' + (SVH - 4) + '" font-size="8.5" fill="var(--text2)" text-anchor="end">' + xlab + '</text>';
  s += '<text x="2" y="10" font-size="8.5" fill="var(--text2)" text-anchor="start">' + ylab + '</text>';
  return s;
}
/* Returns the piece of the line y = b + m x that actually fits inside the
   drawing box, so a steep line never spills over the axes. */
function clipSeg(m, b, xmin, xmax, ymin, ymax) {
  var lo = xmin, hi = xmax;
  if (m !== 0) {
    var xa = (ymin - b) / m, xb = (ymax - b) / m;
    lo = Math.max(lo, Math.min(xa, xb));
    hi = Math.min(hi, Math.max(xa, xb));
  } else if (b < ymin || b > ymax) { return null; }
  if (hi - lo < 1e-9) return null;
  return [lo, b + m * lo, hi, b + m * hi];
}
function lineSvg(m, b, xmin, xmax, ymin, ymax, color, width) {
  var g = clipSeg(m, b, xmin, xmax, ymin, ymax);
  if (!g) return '';
  return '<line x1="' + svgNum(mapX(g[0], xmin, xmax)) + '" y1="' + svgNum(mapY(g[1], ymin, ymax)) +
         '" x2="' + svgNum(mapX(g[2], xmin, xmax)) + '" y2="' + svgNum(mapY(g[3], ymin, ymax)) +
         '" stroke="' + color + '" stroke-width="' + width + '"/>';
}

/* ════════════════════════════════════════════════════════════════════════
   CURVE PRIMITIVE
   Una parabola se dibuja por muestreo y se corta en los bordes del cuadro,
   de modo que la parte que se sale por abajo no ensucia el eje.
   ════════════════════════════════════════════════════════════════════════ */
function curveSvg(f, xmin, xmax, ymin, ymax, color, width) {
  var N = 96, run = [], segs = [], i, x, y;
  for (i = 0; i <= N; i++) {
    x = xmin + (xmax - xmin) * i / N;
    y = f(x);
    if (isFinite(y) && y >= ymin && y <= ymax) {
      run.push(svgNum(mapX(x, xmin, xmax)) + ',' + svgNum(mapY(y, ymin, ymax)));
    } else {
      if (run.length > 1) segs.push(run);
      run = [];
    }
  }
  if (run.length > 1) segs.push(run);
  return segs.map(function(p) {
    return '<polyline points="' + p.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="' + width + '"/>';
  }).join('');
}
function dotSvg(x, y, xmin, xmax, ymin, ymax, color, r) {
  if (!(x >= xmin && x <= xmax && y >= ymin && y <= ymax)) return '';
  return '<circle cx="' + svgNum(mapX(x, xmin, xmax)) + '" cy="' + svgNum(mapY(y, ymin, ymax)) +
         '" r="' + r + '" fill="' + color + '"/>';
}
function vlineSvg(x, xmin, xmax, ymin, ymax, color) {
  if (!(x >= xmin && x <= xmax)) return '';
  return '<line x1="' + svgNum(mapX(x, xmin, xmax)) + '" y1="' + SVT +
         '" x2="' + svgNum(mapX(x, xmin, xmax)) + '" y2="' + (SVH - SVB) +
         '" stroke="' + color + '" stroke-width="1" stroke-dasharray="3 3"/>';
}
function roundUpTo(v, step) { return Math.ceil(v / step) * step; }

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · el precio y el ingreso
   Subir el precio mejora lo que deja cada bolsa y empeora cuantas bolsas
   salen. El alumno mueve el precio y ve la curva subir, llegar a su punto
   mas alto y volver a bajar, y mueve tambien la sensibilidad del cliente.
   ════════════════════════════════════════════════════════════════════════ */
function widgetIngreso(A, B0, p0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { B: B0, p: p0 };
  var XMIN = 0, XMAX = 240, YMIN = 0;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var B = state.B;
    var D = A / B;
    var pStar = A / (2 * B);
    var Rmax  = A * A / (4 * B);
    var YMAX  = roundUpTo(Rmax * 1.12, 5000);
    var q = Math.max(0, A - B * state.p);
    var R = state.p * q;
    var xt = [{ v: 0, t: '0' }, { v: 60, t: '60' }, { v: 120, t: '120' }, { v: 180, t: '180' }, { v: 240, t: '240' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: intN(YMAX / 2000) + ' k' }, { v: YMAX, t: intN(YMAX / 1000) + ' k' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'precio por bolsa, $' : 'price per bag, $',
      es ? 'ingreso, $' : 'revenue, $', xt, yt);
    inner += curveSvg(function(x) { return x * Math.max(0, A - B * x); }, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    inner += vlineSvg(pStar, XMIN, XMAX, YMIN, YMAX, 'var(--text3)');
    inner += dotSvg(pStar, Rmax, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '4');
    inner += dotSvg(state.p, R, XMIN, XMAX, YMIN, YMAX, 'var(--text)', '4.5');
    set('#w1svg', svgOpen() + inner + '</svg>');

    set('#w1pl', money(state.p));
    set('#w1bl', intN(B));
    set('#w1q', intN(q) + (es ? ' bolsas' : ' bags'));
    set('#w1r', money(R));
    set('#w1best', money(Rmax));
    set('#w1eq', (es ? 'a ' : 'at ') + '<span class="ec">' + money(state.p) + (es ? ' por bolsa' : ' per bag') + '</span>' +
      '<span style="color:var(--text3)"> se colocan </span>' +
      '<span class="ev">' + intN(q) + (es ? ' bolsas' : ' bags') + '</span>');

    var vd = host.querySelector('#w1verd');
    if (vd) {
      if (q <= 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'A ese precio ya nadie compra: sin bolsas vendidas el ingreso es cero por caro que sea el café.'
                            : 'At that price nobody buys: with no bags sold the revenue is zero however dear the coffee is.';
      } else if (Math.abs(state.p - pStar) < 0.51) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Estás en el punto más alto de la curva: ningún otro precio deja más ingreso con esta demanda.'
                            : 'You are at the highest point of the curve: no other price brings in more revenue with this demand.';
      } else if (state.p < pStar) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Estás del lado barato de la curva: cada peso que subas todavía deja más ingreso del que quita.'
                            : 'You are on the cheap side of the curve: every peso you add still brings in more than it takes away.';
      } else {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Estás del lado caro de la curva: cada peso que subas quita más bolsas de las que compensa el margen.'
                            : 'You are on the dear side of the curve: every peso you add drives off more bags than the extra margin makes up for.';
      }
    }

    set('#w1read', (q <= 0)
      ? (es
        ? '<strong>Lectura de negocio:</strong> con clientes que dejan de comprar ' + intN(B) + ' bolsas por cada peso de aumento, el precio de ' + money(D) + ' vacía por completo el pedido. El ingreso vuelve a cero, igual que si el café se regalara. Ese es el segundo cruce de la parábola con el eje horizontal, y explica por qué el ingreso no es una recta: entre regalar el café y espantar a toda la clientela existe un punto intermedio que deja lo máximo, y está justo a la mitad del camino, en ' + money(pStar) + '.'
        : '<strong>Business reading:</strong> with customers who drop ' + intN(B) + ' bags for every peso of increase, a price of ' + money(D) + ' empties the order sheet completely. Revenue falls back to zero, exactly as it would if the coffee were given away. That is the second crossing of the parabola with the horizontal axis, and it explains why revenue is not a straight line: between giving the coffee away and driving every customer off there is a middle point that brings in the most, and it sits halfway along, at ' + money(pStar) + '.')
      : (es
        ? '<strong>Lectura de negocio:</strong> a ' + money(state.p) + ' la bolsa salen ' + intN(q) + ' bolsas y entran ' + money(R) + ' a la semana. El precio que más ingreso deja con esta clientela es ' + money(pStar) + ', que produce ' + money(Rmax) + '. Sube la sensibilidad del cliente y observa el detalle que casi nadie espera: el punto más alto se recorre hacia la izquierda, es decir, entre más rápido huye la clientela con cada peso de aumento, más barato conviene vender. La curva no premia al que cobra caro ni al que regala, premia al que encuentra el punto medio entre esos dos extremos.'
        : '<strong>Business reading:</strong> at ' + money(state.p) + ' a bag, ' + intN(q) + ' bags go out and ' + money(R) + ' comes in over the week. The price that brings in the most from this clientele is ' + money(pStar) + ', which produces ' + money(Rmax) + '. Push the customer sensitivity up and watch the detail almost nobody expects: the highest point slides to the left, meaning the faster customers walk away with each peso of increase, the cheaper it pays to sell. The curve rewards neither the shop that charges dearly nor the one that gives coffee away, it rewards the one that finds the middle ground between those extremes.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="precio-e-ingreso">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El precio que más ingreso deja' : 'The price that brings in the most') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Si el café fuera gratis, Café Volcán colocaría ' + intN(A) + ' bolsas a la semana, y cada peso de aumento espanta a una parte de esa clientela. Mueve el precio de izquierda a derecha y sigue el punto negro sobre la curva: verás el ingreso subir, tocar un techo y caer, aunque el precio no deje de crecer en ningún momento. Después mueve la sensibilidad del cliente y fíjate hacia dónde se corre el punto dorado, que marca siempre el precio más conveniente.'
          : 'If the coffee were free, Café Volcán would move ' + intN(A) + ' bags a week, and every peso of increase scares off part of that clientele. Slide the price from left to right and follow the black dot along the curve: revenue climbs, hits a ceiling and falls, even though the price never stops rising. Then move the customer sensitivity and watch where the golden dot travels, since it always marks the most convenient price.') + '</div>' +
        '<div class="iw-expr" id="w1eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'ingreso semanal' : 'weekly revenue') + '</span><span><i class="lg-out"></i>' + (es ? 'punto más alto' : 'highest point') + '</span></div>' +
        '<div class="plane" id="w1svg"></div>' +
        '<div class="verdict" id="w1verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Precio por bolsa' : 'Price per bag') + ': <span class="cval" id="w1pl"></span></label>' +
          '<input type="range" min="10" max="240" step="5" id="w1p" value="' + state.p + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Bolsas que se pierden por cada peso de aumento' : 'Bags lost for each peso of increase') + ': <span class="cval" id="w1bl"></span></label>' +
          '<input type="range" min="2" max="6" step="1" id="w1b" value="' + state.B + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Bolsas de la semana' : 'Bags for the week') + '</div><div class="mnum cs" id="w1q"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ingreso semanal' : 'Weekly revenue') + '</div><div class="mnum ps" id="w1r"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ingreso más alto posible' : 'Highest revenue possible') + '</div><div class="mnum ts" id="w1best"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w1read"></div>' +
      '</div>';
    var ps = host.querySelector('#w1p'), bs = host.querySelector('#w1b');
    ps.addEventListener('input', function() { state.p = parseInt(ps.value, 10); render(); });
    bs.addEventListener('input', function() { state.B = parseInt(bs.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · el vertice manda
   Con costo de por medio, el precio que deja mas utilidad ya no es el que
   deja mas ingreso. El alumno mueve el costo por bolsa y ve el vertice
   caminar hacia la derecha exactamente la mitad de lo que subio el costo.
   ════════════════════════════════════════════════════════════════════════ */
function widgetVertice(B, D, c0, p0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { c: c0, p: p0 };
  var XMIN = 0, XMAX = 240;
  var A = B * D;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var pStar = (D + state.c) / 2;
    var half  = (D - state.c) / 2;
    var Umax  = B * half * half;
    var q  = Math.max(0, A - B * state.p);
    var U  = (state.p - state.c) * q;
    var YMAX = roundUpTo(Math.max(Umax * 1.15, 2000), 2000);
    var YMIN = -roundUpTo(YMAX * 0.35, 1000);
    var xt = [{ v: 0, t: '0' }, { v: 60, t: '60' }, { v: 120, t: '120' }, { v: 180, t: '180' }, { v: 240, t: '240' }];
    var yt = [{ v: YMIN, t: '−' + intN(-YMIN / 1000) + ' k' }, { v: 0, t: '0' }, { v: YMAX, t: intN(YMAX / 1000) + ' k' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'precio por bolsa, $' : 'price per bag, $',
      es ? 'utilidad, $' : 'profit, $', xt, yt);
    inner += curveSvg(function(x) { return (x - state.c) * Math.max(0, A - B * x); }, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    inner += vlineSvg(pStar, XMIN, XMAX, YMIN, YMAX, 'var(--text3)');
    inner += dotSvg(pStar, Umax, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '4');
    inner += dotSvg(state.p, U, XMIN, XMAX, YMIN, YMAX, 'var(--text)', '4.5');
    set('#w2svg', svgOpen() + inner + '</svg>');

    set('#w2cl', money(state.c));
    set('#w2pl', money(state.p));
    set('#w2star', money(pStar));
    set('#w2u', money(U));
    set('#w2best', money(Umax));
    set('#w2eq', (es ? 'margen de ' : 'margin of ') + '<span class="ec">' + money(state.p - state.c) + (es ? ' por bolsa' : ' per bag') + '</span>' +
      '<span style="color:var(--text3)"> sobre </span>' +
      '<span class="ev">' + intN(q) + (es ? ' bolsas' : ' bags') + '</span>');

    var vd = host.querySelector('#w2verd');
    if (vd) {
      if (state.p <= state.c) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'El precio no llega a cubrir lo que cuesta la bolsa: cada venta agranda la pérdida en lugar de reducirla.'
                            : 'The price does not even cover what the bag costs: every sale widens the loss instead of closing it.';
      } else if (Math.abs(state.p - pStar) < 2.6) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Estás en el vértice: ese precio deja la utilidad más alta que permite esta demanda y este costo.'
                            : 'You are at the vertex: that price yields the highest profit this demand and this cost allow.';
      } else if (state.p < pStar) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'El precio se quedó corto: hay volumen de sobra, pero el margen por bolsa todavía puede crecer.'
                            : 'The price fell short: there is volume to spare, but the margin per bag still has room to grow.';
      } else {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'El precio se pasó del vértice: el margen por bolsa es alto y quedan pocas bolsas sobre las cuales cobrarlo.'
                            : 'The price went past the vertex: the margin per bag is high and there are few bags left to charge it on.';
      }
    }

    set('#w2read', (state.p <= state.c)
      ? (es
        ? '<strong>Lectura de negocio:</strong> mientras el precio no rebase los ' + money(state.c) + ' que cuesta producir la bolsa, la parábola vive por debajo del eje y cada bolsa vendida suma pérdida. Ese punto donde la curva cruza el eje por primera vez es el precio de costo, y es uno de los dos precios en los que la utilidad vale exactamente cero. El otro es ' + money(D) + ', donde ya no hay compradores. El vértice está siempre a la mitad de esos dos, en ' + money(pStar) + '.'
        : '<strong>Business reading:</strong> as long as the price stays below the ' + money(state.c) + ' the bag costs to produce, the parabola lives under the axis and every bag sold adds to the loss. The point where the curve first crosses the axis is the cost price, and it is one of the two prices at which profit is exactly zero. The other is ' + money(D) + ', where buyers have all gone. The vertex always sits halfway between those two, at ' + money(pStar) + '.')
      : (es
        ? '<strong>Lectura de negocio:</strong> con un costo de ' + money(state.c) + ' por bolsa, el precio que más utilidad deja es ' + money(pStar) + ' y produce ' + money(Umax) + ' a la semana. Ahora sube el costo por bolsa y vigila el punto dorado: se mueve hacia la derecha, pero solo la mitad de lo que subió el costo. Ese resultado es el que sorprende en una junta de precios: cuando el proveedor encarece el grano ' + money(20) + ', trasladar los ' + money(20) + ' completos al cliente deja menos utilidad que trasladar ' + money(10) + ', porque la clientela reacciona al precio final y el volumen perdido pesa más que el margen ganado.'
        : '<strong>Business reading:</strong> with a cost of ' + money(state.c) + ' per bag, the price that yields the most profit is ' + money(pStar) + ' and produces ' + money(Umax) + ' a week. Now raise the cost per bag and keep an eye on the golden dot: it moves right, but only half as far as the cost moved. That is the result that surprises people in a pricing meeting: when the supplier raises the green coffee by ' + money(20) + ', passing the whole ' + money(20) + ' on to the customer leaves less profit than passing on ' + money(10) + ', because the clientele reacts to the final price and the lost volume outweighs the gained margin.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="vertice-y-precio-optimo">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El vértice se mueve con el costo' : 'The vertex moves with the cost') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La curva ya no mide ingreso sino utilidad, así que cae por debajo del eje cuando el precio no alcanza a cubrir el costo. A ' + money(D) + ' la bolsa la clientela desaparece por completo. Mueve el precio hasta encontrar el punto más alto y compáralo con el punto dorado. Después sube el costo por bolsa de a poco, sin tocar el precio, y anota cuánto se recorre el vértice por cada peso de costo: esa proporción es el corazón de cualquier decisión de traslado de costos al cliente.'
          : 'The curve no longer measures revenue but profit, so it drops below the axis whenever the price fails to cover the cost. At ' + money(D) + ' a bag the clientele disappears entirely. Move the price until you find the highest point and compare it with the golden dot. Then raise the cost per bag little by little, leaving the price alone, and note how far the vertex travels for each peso of cost: that ratio is the heart of any decision about passing costs on to the customer.') + '</div>' +
        '<div class="iw-expr" id="w2eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'utilidad semanal' : 'weekly profit') + '</span><span><i class="lg-out"></i>' + (es ? 'vértice' : 'vertex') + '</span></div>' +
        '<div class="plane" id="w2svg"></div>' +
        '<div class="verdict" id="w2verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo por bolsa' : 'Cost per bag') + ': <span class="cval" id="w2cl"></span></label>' +
          '<input type="range" min="20" max="120" step="10" id="w2c" value="' + state.c + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Precio por bolsa' : 'Price per bag') + ': <span class="cval" id="w2pl"></span></label>' +
          '<input type="range" min="20" max="240" step="5" id="w2p" value="' + state.p + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Precio del vértice' : 'Price at the vertex') + '</div><div class="mnum cs" id="w2star"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Utilidad al precio elegido' : 'Profit at the chosen price') + '</div><div class="mnum ps" id="w2u"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Utilidad más alta posible' : 'Highest profit possible') + '</div><div class="mnum ts" id="w2best"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w2read"></div>' +
      '</div>';
    var cs = host.querySelector('#w2c'), ps = host.querySelector('#w2p');
    cs.addEventListener('input', function() { state.c = parseInt(cs.value, 10); render(); });
    ps.addEventListener('input', function() { state.p = parseInt(ps.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · el discriminante decide cuantos equilibrios hay
   Al subir la renta la parabola baja entera. Primero los dos puntos de
   equilibrio se acercan, luego se funden en uno y despues desaparecen.
   ════════════════════════════════════════════════════════════════════════ */
function widgetDiscriminante(k, alfa, v0, F0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { F: F0, v: v0 };
  var XMIN = 0, XMAX = 200;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var m  = alfa - state.v;
    var qv = m / (2 * k);
    var Umax = m * m / (4 * k) - state.F;
    var disc = m * m - 4 * k * state.F;
    var r1 = null, r2 = null;
    if (disc >= 0) { r1 = (m - Math.sqrt(disc)) / (2 * k); r2 = (m + Math.sqrt(disc)) / (2 * k); }
    var YMAX = roundUpTo(Math.max(Umax * 1.3, 3000), 2000);
    var YMIN = -roundUpTo(Math.max(state.F * 0.75, 4000), 2000);
    var xt = [{ v: 0, t: '0' }, { v: 50, t: '50' }, { v: 100, t: '100' }, { v: 150, t: '150' }, { v: 200, t: '200' }];
    var yt = [{ v: YMIN, t: '−' + intN(-YMIN / 1000) + ' k' }, { v: 0, t: '0' }, { v: YMAX, t: intN(YMAX / 1000) + ' k' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'bolsas por semana' : 'bags per week',
      es ? 'utilidad, $' : 'profit, $', xt, yt);
    inner += curveSvg(function(x) { return -k * x * x + m * x - state.F; }, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.4');
    inner += dotSvg(qv, Umax, XMIN, XMAX, YMIN, YMAX, 'var(--text)', '4');
    if (r1 !== null) {
      inner += dotSvg(r1, 0, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '4.5');
      inner += dotSvg(r2, 0, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '4.5');
    }
    set('#w3svg', svgOpen() + inner + '</svg>');

    set('#w3fl', money(state.F));
    set('#w3vl', money(state.v));
    set('#w3type', disc > 0 ? (es ? 'dos' : 'two') : (disc === 0 ? (es ? 'uno' : 'one') : (es ? 'ninguno' : 'none')));
    set('#w3roots', disc > 0 ? (dec1(r1) + (es ? ' y ' : ' and ') + dec1(r2))
                             : (disc === 0 ? dec1(qv) : (es ? 'no existen' : 'they do not exist')));
    set('#w3best', money(Umax));
    set('#w3eq', (es ? 'costo fijo de ' : 'fixed cost of ') + '<span class="ec">' + money(state.F) + (es ? ' a la semana' : ' a week') + '</span>' +
      '<span style="color:var(--text3)"> y </span>' +
      '<span class="ev">' + money(state.v) + (es ? ' por bolsa producida' : ' per bag produced') + '</span>');

    var vd = host.querySelector('#w3verd');
    if (vd) {
      if (disc > 0) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'La parábola corta el eje en dos volúmenes: entre ellos el taller gana, fuera de ellos pierde.'
                            : 'The parabola cuts the axis at two volumes: between them the roaster earns, outside them it loses.';
      } else if (disc === 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'La parábola apenas toca el eje en un solo punto: existe un único volumen que empata, y ni ese deja ganancia.'
                            : 'The parabola barely touches the axis at a single point: exactly one volume breaks even, and even that one leaves nothing.';
      } else {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'La parábola quedó completa por debajo del eje: no hay ningún volumen que deje utilidad.'
                            : 'The parabola sits entirely below the axis: no volume whatsoever leaves a profit.';
      }
    }

    set('#w3read', (disc > 0)
      ? (es
        ? '<strong>Lectura de negocio:</strong> con ' + money(state.F) + ' de costo fijo y ' + money(state.v) + ' de costo por bolsa, el taller empata en ' + dec1(r1) + ' y en ' + dec1(r2) + ' bolsas, y su mejor semana deja ' + money(Umax) + '. Los dos puntos de equilibrio no son intercambiables: el primero es el volumen mínimo que hay que alcanzar para dejar de perder, y el segundo es el volumen a partir del cual el precio que hay que aceptar para colocar tanta bolsa ya no cubre lo que cuesta producirla. Sube el costo fijo poco a poco y verás que los dos puntos se acercan, porque la parábola entera baja sin cambiar de forma.'
        : '<strong>Business reading:</strong> with ' + money(state.F) + ' of fixed cost and ' + money(state.v) + ' of cost per bag, the roaster breaks even at ' + dec1(r1) + ' and at ' + dec1(r2) + ' bags, and its best week leaves ' + money(Umax) + '. The two break-even points are not interchangeable: the first is the minimum volume needed to stop losing money, and the second is the volume beyond which the price you must accept to move that many bags no longer covers what it costs to make them. Raise the fixed cost step by step and you will see the two points converge, because the whole parabola drops without changing shape.')
      : (disc === 0)
      ? (es
        ? '<strong>Lectura de negocio:</strong> el costo fijo llegó justo al techo que el negocio aguanta. La parábola toca el eje en ' + dec1(qv) + ' bolsas y en ningún otro punto: existe un único volumen que no deja pérdida, y tampoco deja ganancia. En la práctica esa es una situación insostenible, porque cualquier desviación en el volumen, en el precio o en el costo empuja la curva hacia abajo. Un peso más de renta y el negocio se queda sin ningún volumen rentable.'
        : '<strong>Business reading:</strong> the fixed cost has reached the exact ceiling the business can bear. The parabola touches the axis at ' + dec1(qv) + ' bags and nowhere else: exactly one volume avoids a loss, and it leaves no gain either. In practice this is an untenable position, because any drift in volume, price or cost pushes the curve down. One more peso of rent and the business is left with no profitable volume at all.')
      : (es
        ? '<strong>Lectura de negocio:</strong> con este costo fijo la mejor semana posible todavía pierde ' + money(-Umax) + '. No hay volumen que salve al negocio, y producir más solo cambia el tamaño de la pérdida. El discriminante negativo es exactamente eso traducido a un número: la ecuación de equilibrio no tiene solución real porque no existe el volumen que se le pide. La salida no está en el volumen sino en bajar el costo fijo, bajar el costo por bolsa o conseguir una clientela dispuesta a pagar más.'
        : '<strong>Business reading:</strong> with this fixed cost the best possible week still loses ' + money(-Umax) + '. No volume saves the business, and producing more only changes the size of the loss. A negative discriminant is precisely that translated into a number: the break-even equation has no real solution because the volume it asks for does not exist. The way out is not volume but a lower fixed cost, a lower cost per bag, or a clientele willing to pay more.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="discriminante-y-equilibrio">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Dos equilibrios, uno o ninguno' : 'Two break-even points, one, or none') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La curva mide la utilidad semanal según cuántas bolsas produzca Café Volcán, contando que para colocar más bolsas hay que aceptar un precio más bajo. Los puntos dorados son los volúmenes de equilibrio. Sube el costo fijo de a poco y observa cómo se acercan hasta juntarse y desaparecer, y localiza la renta exacta en la que la curva apenas roza el eje. Prueba después qué hace el costo por bolsa: no baja la curva igual que la renta, también corre el punto más alto.'
          : 'The curve measures weekly profit against the number of bags Café Volcán produces, allowing for the fact that moving more bags means accepting a lower price. The golden dots are the break-even volumes. Raise the fixed cost gradually and watch them close in, merge and vanish, and locate the exact rent at which the curve barely grazes the axis. Then try what the cost per bag does: it does not lower the curve the way rent does, it also shifts the highest point.') + '</div>' +
        '<div class="iw-expr" id="w3eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'utilidad semanal' : 'weekly profit') + '</span><span><i class="lg-out"></i>' + (es ? 'puntos de equilibrio' : 'break-even points') + '</span></div>' +
        '<div class="plane" id="w3svg"></div>' +
        '<div class="verdict" id="w3verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Costo fijo de la semana' : 'Fixed cost for the week') + ': <span class="cval" id="w3fl"></span></label>' +
          '<input type="range" min="0" max="' + (F0 + 12000) + '" step="100" id="w3f" value="' + state.F + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Costo por bolsa producida' : 'Cost per bag produced') + ': <span class="cval" id="w3vl"></span></label>' +
          '<input type="range" min="' + Math.max(20, v0 - 40) + '" max="' + (v0 + 60) + '" step="10" id="w3v" value="' + state.v + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Puntos de equilibrio' : 'Break-even points') + '</div><div class="mnum cs" id="w3type"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Volúmenes de equilibrio' : 'Break-even volumes') + '</div><div class="mnum ps" id="w3roots"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Utilidad más alta posible' : 'Highest profit possible') + '</div><div class="mnum ts" id="w3best"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    var fs = host.querySelector('#w3f'), vs = host.querySelector('#w3v');
    fs.addEventListener('input', function() { state.F = parseInt(fs.value, 10); render(); });
    vs.addEventListener('input', function() { state.v = parseInt(vs.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   BUILD LESSON · concepto, herramienta, reactivos, y otra vez
   Todos los numeros salen del rng sembrado, de modo que dos alumnos nunca
   comparten una sola cifra y un mismo alumno nunca repite un intento.
   La guia entera sigue a un negocio: Cafe Volcan, un tostador de Comala
   que vende bolsas de cafe molido a cafeterias y tiendas de Colima.
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];
  document.getElementById('lessonBody').innerHTML = '';

  /* ── Concepto 1 · de la demanda al ingreso ── */
  var c1B  = pick([2, 3, 4], rng);
  var c1P  = pick([60, 70, 80], rng);
  var c1d  = pick([10, 15, 20], rng);
  var c1A  = 2 * c1B * c1P;
  var c1pL = c1P - c1d, c1pH = c1P + c1d;
  var c1qL = c1A - c1B * c1pL;
  var c1qH = c1A - c1B * c1pH;
  var c1qT = c1A - c1B * c1P;
  var c1RL = c1pL * c1qL;
  var c1RT = c1P * c1qT;
  var c1gap = c1RT - c1RL;
  var c1D  = 2 * c1P;

  var w1A = pick([360, 420, 480], rng);
  var w1B = pick([3, 4, 5], rng);
  var w1p = pick([40, 60, 80], rng);

  /* ── Reactivo 1 · dos precios, el mismo ingreso ── */
  var p1B  = pick([2, 3, 4], rng);
  var p1P  = pick([55, 65, 75], rng);
  var p1d  = pick([10, 15, 20], rng);
  var p1A  = 2 * p1B * p1P;
  var p1pL = p1P - p1d, p1pH = p1P + p1d;
  var p1qL = p1A - p1B * p1pL;
  var p1qH = p1A - p1B * p1pH;
  var p1R  = p1pL * p1qL;
  var p1RT = p1P * (p1A - p1B * p1P);
  var p1gap = p1RT - p1R;

  /* ── Reactivo 2 · el ingreso despues del aumento ── */
  var p2B   = pick([2, 3, 4], rng);
  var p2P   = pick([70, 80, 90], rng);
  var p2p0  = pick([40, 50, 60], rng);
  var p2inc = pick([20, 30], rng);
  if (2 * p2p0 + p2inc === 2 * p2P) p2inc = p2inc + 10;   /* evita dos precios simetricos al vertice */
  var p2A  = 2 * p2B * p2P;
  var p2q0 = p2A - p2B * p2p0;
  var p2p1 = p2p0 + p2inc;
  var p2q1 = p2A - p2B * p2p1;
  var p2R1 = p2p1 * p2q1;
  var p2D1 = p2p1 * p2q0;
  var p2D2 = p2p1 * (p2q0 - p2inc);
  var p2D3 = p2p0 * p2q0;
  var p2drop = p2B * p2inc;

  /* ── Concepto 2 · el vertice ── */
  var c2B  = pick([2, 3, 4], rng);
  var c2c  = pick([40, 60, 80], rng);
  var c2D  = pick([180, 200, 220], rng);
  var c2A  = c2B * c2D;
  var c2P  = (c2D + c2c) / 2;
  var c2h  = (c2D - c2c) / 2;
  var c2q  = c2B * c2h;
  var c2U  = c2B * c2h * c2h;
  var c2dd = pick([20, 30], rng);
  var c2U2 = c2U - c2B * c2dd * c2dd;
  var c2q2 = c2B * (c2h - c2dd);
  var c2rev = c2D / 2;
  var c2Ur = (c2rev - c2c) * (c2A - c2B * c2rev);

  var w2B = pick([2, 3, 4], rng);
  var w2D = pick([180, 200, 220], rng);
  var w2c = pick([40, 60, 80], rng);
  var w2p = pick([80, 100, 120], rng);

  /* ── Reactivo 3 · el precio que deja mas utilidad ── */
  var p3B   = pick([2, 3, 4], rng);
  var p3c   = pick([40, 60, 80], rng);
  var p3D   = pick([180, 200, 220], rng);
  var p3ref = pick([100, 120], rng);
  var p3P   = (p3D + p3c) / 2;
  var p3q   = p3B * (p3D - p3ref);
  var p3qP  = p3B * (p3D - p3P);
  var p3U   = p3B * ((p3D - p3c) / 2) * ((p3D - p3c) / 2);
  var p3Ur  = (p3D / 2 - p3c) * p3B * (p3D - p3D / 2);
  var p3alt = p3D / 2 + p3c;

  /* ── Reactivo 4 · subir el precio mas alla del vertice ── */
  var p4B  = pick([2, 3, 4], rng);
  var p4c  = pick([40, 60, 80], rng);
  var p4D  = pick([180, 200, 220], rng);
  var p4z  = pick([15, 20, 25], rng);
  var p4P  = (p4D + p4c) / 2;
  var p4h  = (p4D - p4c) / 2;
  var p4U  = p4B * p4h * p4h;
  var p4U2 = p4U - p4B * p4z * p4z;
  var p4q  = p4B * p4h;
  var p4q2 = p4B * (p4h - p4z);

  /* ═══════════════════════ CONCEPTO 1 ═══════════════════════ */
  addSection(function(L) {
    if (L === 'es') return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>De la demanda al ingreso: por qué aparece una función cuadrática</h2>' +
      '<p>Café Volcán es un tostador de Comala que vende bolsas de café molido a cafeterías y tiendas de Colima. Cada semana toma una sola decisión que arrastra a todas las demás: a qué precio ofrece la bolsa. La tentación es pensar que cobrar más siempre deja más dinero, pero cualquiera que haya vendido algo sabe que no es así. El precio empuja en dos direcciones opuestas al mismo tiempo: sube lo que deja cada bolsa y baja el número de bolsas que salen.</p>' +
      '<p>El ingreso semanal es el producto de esos dos factores, precio por cantidad, y ahí está el detalle que cambia todo. Si la cantidad vendida baja de forma pareja con el precio, es decir si la demanda es una recta, entonces el ingreso es un producto de dos expresiones lineales, y al desarrollarlo aparece un término con el precio elevado al cuadrado. Esa es la puerta de entrada a las <strong>funciones cuadráticas</strong> en economía: no son un capricho algebraico, salen solas en cuanto dos cantidades ligadas por una recta se multiplican entre sí.</p>' +
      '<p>Una función es cuadrática cuando se puede escribir en la <strong>forma general</strong> f(x) = ax² + bx + c con el coeficiente a distinto de cero. Ese coeficiente manda sobre la figura: su gráfica es una <strong>parábola</strong>, y si a es negativo la parábola abre hacia abajo, sube hasta un punto máximo y vuelve a bajar. En el caso del ingreso el coeficiente del término cuadrático es negativo, y por eso existe un precio que deja el ingreso más alto de todos.</p>' +
      '<p>La parábola tiene además una propiedad que conviene tener a la mano desde el principio: es <strong>simétrica</strong> respecto de la recta vertical que pasa por su punto más alto. Dos precios que estén a la misma distancia de ese punto, uno de cada lado, producen exactamente el mismo ingreso. Un precio bajo y un precio alto pueden dejar la misma cifra en caja por razones opuestas: el barato vende mucho con poco margen, el caro vende poco con mucho margen. Confundir esas dos situaciones es uno de los errores caros de una junta de precios.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Forma general</div><div class="rform">f(x) = ax² + bx + c</div><div class="rnote">Con a distinto de cero.</div></div>' +
        '<div class="rcard"><div class="rname">Signo de a</div><div class="rform">a menor que 0</div><div class="rnote">La parábola abre hacia abajo y tiene máximo.</div></div>' +
        '<div class="rcard"><div class="rname">Ingreso</div><div class="rform">precio por cantidad</div><div class="rnote">Dos factores que se mueven al revés.</div></div>' +
        '<div class="rcard"><div class="rname">Simetría</div><div class="rform">misma distancia</div><div class="rnote">Dos precios opuestos, un mismo ingreso.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> El área comercial de Café Volcán midió que por cada peso que sube el precio se dejan de vender ' + intN(c1B) + ' bolsas a la semana, y que si el café se regalara saldrían ' + intN(c1A) + ' bolsas. El gerente quiere comparar tres precios: ' + money(c1pL) + ', ' + money(c1P) + ' y ' + money(c1pH) + '.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se escribe la cantidad como una recta: a ' + money(c1pL) + ' salen ' + intN(c1qL) + ' bolsas, a ' + money(c1P) + ' salen ' + intN(c1qT) + ' y a ' + money(c1pH) + ' salen ' + intN(c1qH) + '.<br>' +
      '<strong>Paso 2.</strong> El ingreso de cada precio es el producto del precio por su cantidad. A ' + money(c1pL) + ' la semana deja ' + money(c1RL) + '.<br>' +
      '<strong>Paso 3.</strong> A ' + money(c1P) + ' la semana deja ' + money(c1RT) + ', que es ' + money(c1gap) + ' más que el precio anterior aunque se vendan menos bolsas.<br>' +
      '<strong>Paso 4.</strong> A ' + money(c1pH) + ' la semana vuelve a dejar ' + money(c1RL) + ', exactamente lo mismo que el precio bajo. Los dos están a ' + money(c1d) + ' del punto más alto, uno de cada lado.<br>' +
      '<strong>Lectura.</strong> El ingreso no crece ni decrece de forma pareja con el precio: sube, llega a un techo en ' + money(c1P) + ' y cae. A ' + money(c1D) + ' la bolsa ya no habría compradores y el ingreso volvería a cero, igual que si el café se regalara.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>From demand to revenue: why a quadratic function shows up</h2>' +
      '<p>Café Volcán is a coffee roaster in Comala that sells bags of ground coffee to cafés and shops around Colima. Every week it makes one decision that drags all the others along with it: the price of a bag. The temptation is to assume that charging more always brings in more money, but anyone who has ever sold anything knows better. Price pushes in two opposite directions at once: it raises what each bag leaves behind and lowers the number of bags that go out.</p>' +
      '<p>Weekly revenue is the product of those two factors, price times quantity, and that is where everything changes. If the quantity sold falls evenly as the price rises, that is, if demand is a straight line, then revenue is the product of two linear expressions, and expanding it produces a term with the price squared. That is the doorway to <strong>quadratic functions</strong> in economics: they are no algebraic whim, they appear on their own the moment two quantities tied by a straight line are multiplied together.</p>' +
      '<p>A function is quadratic when it can be written in the <strong>general form</strong> f(x) = ax² + bx + c with the coefficient a different from zero. That coefficient rules the shape: the graph is a <strong>parabola</strong>, and when a is negative the parabola opens downwards, climbs to a highest point and comes back down. In the revenue case the coefficient of the squared term is negative, and that is exactly why there is a price that brings in more than any other.</p>' +
      '<p>The parabola also has a property worth keeping at hand from the start: it is <strong>symmetric</strong> about the vertical line through its highest point. Two prices the same distance from that point, one on each side, produce exactly the same revenue. A low price and a high price can leave the same figure in the till for opposite reasons: the cheap one sells a great deal on a thin margin, the dear one sells little on a fat margin. Confusing those two situations is one of the expensive mistakes made in pricing meetings.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">General form</div><div class="rform">f(x) = ax² + bx + c</div><div class="rnote">With a different from zero.</div></div>' +
        '<div class="rcard"><div class="rname">Sign of a</div><div class="rform">a below 0</div><div class="rnote">The parabola opens downwards and has a maximum.</div></div>' +
        '<div class="rcard"><div class="rname">Revenue</div><div class="rform">price times quantity</div><div class="rnote">Two factors moving opposite ways.</div></div>' +

      '<strong>Step 2.</strong> The revenue of each price is that price times its quantity. At ' + money(c1pL) + ' the week brings in ' + money(c1RL) + '.<br>' +
      '<strong>Step 3.</strong> At ' + money(c1P) + ' the week brings in ' + money(c1RT) + ', which is ' + money(c1gap) + ' more than the previous price even though fewer bags are sold.<br>' +
      '<strong>Step 4.</strong> At ' + money(c1pH) + ' the week brings in ' + money(c1RL) + ' once more, exactly the same as the low price. Both sit ' + money(c1d) + ' away from the highest point, one on each side.<br>' +
      '<strong>Reading.</strong> Revenue neither climbs nor falls evenly with price: it rises, reaches a ceiling at ' + money(c1P) + ' and drops. At ' + money(c1D) + ' a bag there would be no buyers left and revenue would return to zero, exactly as if the coffee were given away.</p></div>';
  });

  addItem({
    title: { es: 'Dos precios distintos, el mismo ingreso', en: 'Two different prices, the same revenue' },
    q: { es: 'Café Volcán probó su café de temporada a ' + money(p1pL) + ' la bolsa durante una semana y colocó ' + intN(p1qL) + ' bolsas. A la semana siguiente lo ofreció a ' + money(p1pH) + ' y colocó ' + intN(p1qH) + ' bolsas. Las dos semanas dejaron ' + money(p1R) + ' de ingreso. Un practicante concluye que el precio no influye en el ingreso. ¿Qué se puede afirmar?',
        en: 'Café Volcán tried its seasonal coffee at ' + money(p1pL) + ' a bag for one week and moved ' + intN(p1qL) + ' bags. The following week it offered the coffee at ' + money(p1pH) + ' and moved ' + intN(p1qH) + ' bags. Both weeks brought in ' + money(p1R) + '. A trainee concludes that price has no bearing on revenue. What can be stated?' },
    hint: { es: 'Fíjate en que las dos semanas dan la misma cifra por caminos opuestos: una vende muchas bolsas baratas y la otra pocas bolsas caras. Pregúntate qué pasaría con un precio que quedara justo entre esos dos.',
            en: 'Notice that the two weeks reach the same figure by opposite routes: one sells many cheap bags and the other few dear ones. Ask yourself what would happen at a price sitting right between those two.' },

           en: 'The two weeks agree because ' + money(p1pL) + ' and ' + money(p1pH) + ' both lie ' + money(p1d) + ' from the highest point of the curve, which is ' + money(p1P) + '. At that middle price the roaster would move ' + intN(p1A - p1B * p1P) + ' bags and bring in ' + money(p1RT) + ', that is ' + money(p1gap) + ' more than either of the weeks it tried, so price does matter. The answer calling revenue constant across the range stretches two observations into a whole curve: testing ' + money(p1P) + ' would be enough to refute it. The answer that sees an error in the figures overlooks the symmetry of the parabola, which takes every value twice, once on each side of the maximum. And the answer recommending the deepest possible price cut forgets the other extreme: give the coffee away and a great many bags would move while revenue sat at zero.' }

        en: 'Café Volcán currently sells its flagship bag at ' + money(p2p0) + ' and moves ' + intN(p2q0) + ' bags a week. The sales team estimates that every peso added to the price costs ' + intN(p2B) + ' bags of weekly sales. Management proposes lifting the price to ' + money(p2p1) + '. What would the weekly revenue be at that price?' },

           en: 'The increase is ' + money(p2inc) + ', and since each peso costs ' + intN(p2B) + ' bags, ' + intN(p2drop) + ' bags are lost and ' + intN(p2q1) + ' remain. Revenue is therefore ' + money(p2R1) + '. The figure of ' + money(p2D1) + ' comes from charging the new price on today’s ' + intN(p2q0) + ' bags, that is, from assuming the increase scares nobody off, which is precisely what the sales study denies. The figure of ' + money(p2D2) + ' loses only ' + intN(p2inc) + ' bags, one per peso, and forgets that each peso takes ' + intN(p2B) + ' with it. And ' + money(p2D3) + ' is the revenue the roaster already earns today at ' + money(p2p0) + ', useful for comparison but not an answer to the question.' }

  /* ═══════════════════════ CONCEPTO 2 ═══════════════════════ */
  addSection(function(L) {
    if (L === 'es') return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>El vértice: el punto donde la utilidad deja de crecer</h2>' +
      '<p>El ingreso más alto casi nunca es el objetivo real de una empresa. Lo que se reparte al final del mes es la <strong>utilidad</strong>, y para calcularla hay que restar lo que cuesta producir cada bolsa. Ese descuento cambia la pregunta por completo: el precio que deja el mayor ingreso y el precio que deja la mayor utilidad no coinciden nunca, salvo en el caso irreal de que producir no costara nada.</p>' +
      '<p>Con un costo de c pesos por bolsa, la utilidad es el margen unitario multiplicado por la cantidad vendida. Los dos factores vuelven a ser rectas y el producto vuelve a ser una parábola que abre hacia abajo, pero desplazada. Al desarrollar el producto queda una expresión de la forma ax² + bx + c en la que el término cuadrático conserva el mismo coeficiente negativo que traía el ingreso, mientras que el término lineal y el término constante cambian.</p>' +
      '<p>El punto más alto de una parábola se llama <strong>vértice</strong>, y su ubicación se calcula directamente a partir de los coeficientes: la coordenada horizontal del vértice es ' + frac('−b', '2a') + ' . La recta vertical que pasa por ese punto es el <strong>eje de simetría</strong>, y de ahí viene la propiedad que ya se usó en el concepto anterior. Para la utilidad de Café Volcán ese cálculo produce un resultado que se recuerda mejor que la fórmula: el precio que deja la mayor utilidad está exactamente a la mitad entre el costo por bolsa y el precio al que ya nadie compraría.</p>' +
      '<p>De esa lectura sale la regla que más se discute en una junta de precios. Si el proveedor encarece el grano, el costo por bolsa sube y el vértice se recorre, pero solo <strong>la mitad</strong> de lo que subió el costo. Trasladar el aumento completo al cliente deja menos utilidad que trasladar la mitad, porque la clientela responde al precio final y el volumen que se pierde pesa más que el margen que se gana. Es un resultado contraintuitivo que se sigue de la geometría de la parábola, no de una opinión comercial.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Vértice</div><div class="rform">x = ' + frac('−b', '2a') + '</div><div class="rnote">Máximo si a es negativo.</div></div>' +
        '<div class="rcard"><div class="rname">Eje de simetría</div><div class="rform">recta vertical</div><div class="rnote">Pasa por el vértice.</div></div>' +
        '<div class="rcard"><div class="rname">Precio óptimo</div><div class="rform">punto medio</div><div class="rnote">Entre el costo y el precio sin compradores.</div></div>' +
        '<div class="rcard"><div class="rname">Traslado</div><div class="rform">la mitad</div><div class="rnote">El vértice se mueve la mitad del costo.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Producir una bolsa le cuesta a Café Volcán ' + money(c2c) + ', y el estudio de mercado indica que a ' + money(c2D) + ' la bolsa ya no quedarían compradores, perdiéndose ' + intN(c2B) + ' bolsas semanales por cada peso de aumento. El gerente quiere el precio que deja la mayor utilidad.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> El margen por bolsa es el precio menos los ' + money(c2c) + ' de costo, y la cantidad es una recta que llega a cero en ' + money(c2D) + '. La utilidad es el producto de esas dos rectas.<br>' +
      '<strong>Paso 2.</strong> Ese producto es una parábola que abre hacia abajo y que vale cero en dos precios: en ' + money(c2c) + ', donde el margen desaparece, y en ' + money(c2D) + ', donde desaparecen los clientes.<br>' +
      '<strong>Paso 3.</strong> El vértice está a la mitad de esos dos precios, es decir en ' + money(c2P) + '. A ese precio salen ' + intN(c2q) + ' bolsas con un margen de ' + money(c2h) + ' cada una, lo que deja ' + money(c2U) + ' a la semana.<br>' +
      '<strong>Paso 4.</strong> Conviene comprobar con un precio vecino. A ' + money(c2P + c2dd) + ' el margen sube a ' + money(c2h + c2dd) + ', pero las bolsas caen a ' + intN(c2q2) + ' y la utilidad baja a ' + money(c2U2) + '.<br>' +
      '<strong>Comparación.</strong> El precio que deja el mayor ingreso es ' + money(c2rev) + ', más barato que el que deja la mayor utilidad, y a ese precio la utilidad sería de solo ' + money(c2Ur) + '. Maximizar ventas y maximizar utilidad son dos decisiones distintas.</p></div>';
    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>The vertex: the point where profit stops growing</h2>' +
      '<p>The highest revenue is almost never a firm’s real target. What gets shared out at the end of the month is <strong>profit</strong>, and calculating it means subtracting what each bag costs to make. That deduction changes the question entirely: the price that yields the most revenue and the price that yields the most profit never coincide, except in the unreal case where production costs nothing.</p>' +
      '<p>With a cost of c pesos per bag, profit is the unit margin multiplied by the quantity sold. Both factors are straight lines again and the product is again a downward parabola, only shifted. Expanding the product leaves an expression of the form ax² + bx + c in which the squared term keeps the same negative coefficient revenue had, while the linear and constant terms change.</p>' +
      '<p>The highest point of a parabola is called the <strong>vertex</strong>, and its position follows straight from the coefficients: the horizontal coordinate of the vertex is ' + frac('−b', '2a') + ' . The vertical line through that point is the <strong>axis of symmetry</strong>, which is where the property used in the previous concept comes from. For Café Volcán’s profit that calculation produces a result easier to remember than the formula itself: the price yielding the most profit sits exactly halfway between the cost per bag and the price at which nobody would buy.</p>' +
      '<p>Out of that reading comes the rule most argued over in pricing meetings. If the supplier raises the price of green coffee, the cost per bag rises and the vertex travels, but only <strong>half</strong> as far as the cost moved. Passing the full increase on to the customer leaves less profit than passing on half of it, because the clientele responds to the final price and the volume lost outweighs the margin gained. It is a counter-intuitive result that follows from the geometry of the parabola, not from a commercial opinion.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Vertex</div><div class="rform">x = ' + frac('−b', '2a') + '</div><div class="rnote">A maximum when a is negative.</div></div>' +
        '<div class="rcard"><div class="rname">Axis of symmetry</div><div class="rform">vertical line</div><div class="rnote">It runs through the vertex.</div></div>' +
        '<div class="rcard"><div class="rname">Best price</div><div class="rform">midpoint</div><div class="rnote">Between cost and the buyerless price.</div></div>' +
        '<div class="rcard"><div class="rname">Pass-through</div><div class="rform">one half</div><div class="rnote">The vertex moves half the cost.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> Making one bag costs Café Volcán ' + money(c2c) + ', and the market study says that at ' + money(c2D) + ' a bag no buyers would be left, with ' + intN(c2B) + ' weekly bags lost for every peso of increase. The manager wants the price that yields the most profit.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> The margin per bag is the price minus the ' + money(c2c) + ' of cost, and the quantity is a straight line reaching zero at ' + money(c2D) + '. Profit is the product of those two lines.<br>' +
      '<strong>Step 2.</strong> That product is a downward parabola worth zero at two prices: at ' + money(c2c) + ', where the margin vanishes, and at ' + money(c2D) + ', where the customers vanish.<br>' +
      '<strong>Step 3.</strong> The vertex sits halfway between those two prices, that is at ' + money(c2P) + '. At that price ' + intN(c2q) + ' bags go out with a margin of ' + money(c2h) + ' each, leaving ' + money(c2U) + ' a week.<br>' +
      '<strong>Step 4.</strong> It pays to check a neighbouring price. At ' + money(c2P + c2dd) + ' the margin climbs to ' + money(c2h + c2dd) + ', but the bags fall to ' + intN(c2q2) + ' and profit drops to ' + money(c2U2) + '.<br>' +
      '<strong>Comparison.</strong> The price yielding the most revenue is ' + money(c2rev) + ', cheaper than the one yielding the most profit, and at that price profit would be only ' + money(c2Ur) + '. Maximising sales and maximising profit are two different decisions.</p></div>';
  });

  widgetVertice(w2B, w2D, w2c, w2p);

  /* ── Reactivo 3 · el precio que deja mas utilidad ── */
  var o3es = [
    money(p3P) + ' por bolsa',

  ];

  var o3 = shuffleOpts(o3es, o3en, rng);
  addItem({
    title: { es: 'El precio que deja la mayor utilidad', en: 'The price that yields the most profit' },
    q: { es: 'Producir una bolsa de café molido le cuesta a Café Volcán ' + money(p3c) + '. Hoy la vende en ' + money(p3ref) + ' y coloca ' + intN(p3q) + ' bolsas por semana, y sabe que por cada peso que suba el precio venderá ' + intN(p3B) + ' bolsas menos. ¿Qué precio por bolsa le deja la mayor utilidad semanal?',
        en: 'Making one bag of ground coffee costs Café Volcán ' + money(p3c) + '. Today it sells at ' + money(p3ref) + ' and moves ' + intN(p3q) + ' bags a week, and it knows that every peso added to the price costs ' + intN(p3B) + ' bags of sales. Which price per bag yields the highest weekly profit?' },
    hint: { es: 'Averigua primero a qué precio la clientela desaparecería por completo, partiendo del precio de hoy y de cuántas bolsas se pierden por peso. La utilidad vale cero en ese precio y también en el costo por bolsa, y el vértice está justo entre los dos.',

      '<h2>Puntos de equilibrio: dónde la parábola cruza el eje</h2>' +
      '<p>Hasta aquí la variable de decisión fue el precio. Un taller de producción suele plantear la misma pregunta al revés: cuántas bolsas conviene producir. Las dos versiones son la misma historia contada desde lados distintos, porque para colocar más bolsas hay que aceptar un precio más bajo. Esa relación, llamada <strong>demanda inversa</strong>, es de nuevo una recta: el precio que se puede cobrar baja una cantidad fija por cada bolsa adicional que se quiere vender.</p>' +
      '<p>Con esa recta la utilidad semanal vuelve a ser cuadrática, ahora en función de la cantidad producida. El ingreso es la cantidad por el precio que admite el mercado, de donde sale el término al cuadrado con signo negativo. A eso se le resta el <strong>costo variable</strong>, que crece de forma pareja con cada bolsa, y el <strong>costo fijo</strong>, que se paga aunque no salga ni una bolsa: renta del local, sueldos base, luz contratada.</p>' +
      '<p>La pregunta clave del negocio es dónde esa parábola cruza el eje horizontal, porque ahí la utilidad vale cero. Esos cruces son las <strong>raíces</strong> de la ecuación cuadrática y en lenguaje de negocio se llaman <strong>puntos de equilibrio</strong>. La herramienta que los encuentra es la <strong>fórmula general</strong>, que resuelve cualquier ecuación de la forma ax² + bx + c igualada a cero: x = ' + frac('−b ± √(b² − 4ac)', '2a') + ' . El signo más y el signo menos dan las dos raíces, y la expresión bajo la raíz, llamada <strong>discriminante</strong>, decide cuántas hay.</p>' +
      '<p>Los dos puntos de equilibrio no significan lo mismo y confundirlos sale caro. El primero es el volumen mínimo que hay que alcanzar para dejar de perder: por debajo de él las ventas no alcanzan a cubrir el costo fijo. El segundo es el volumen a partir del cual el negocio vuelve a perder, porque para colocar tanta bolsa hay que bajar tanto el precio que ya no cubre lo que cuesta producirla. Entre los dos está la zona rentable, y el punto más alto de esa zona, el vértice, está exactamente a la mitad de las dos raíces.</p>' +

      '<div class="stag">Concept 3</div>' +
      '<h2>Break-even points: where the parabola crosses the axis</h2>' +
      '<p>So far the decision variable has been the price. A production workshop usually asks the same question the other way round: how many bags to make. Both versions are the same story told from different sides, because moving more bags means accepting a lower price. That relation, called <strong>inverse demand</strong>, is a straight line once again: the price that can be charged falls by a fixed amount for every additional bag the shop wants to sell.</p>' +

      '<h2>El discriminante: dos, uno o ningún punto de equilibrio</h2>' +
      '<p>La expresión que vive bajo el signo de raíz en la fórmula general, b² − 4ac, se llama <strong>discriminante</strong>, y su signo se puede leer antes de terminar cualquier cuenta. Si es positivo hay dos raíces distintas y la parábola cruza el eje en dos puntos. Si vale cero hay una sola raíz y la parábola apenas roza el eje. Si es negativo no hay raíz real y la parábola pasa completa por un lado del eje, sin tocarlo.</p>' +
      '<p>Traducido al negocio, el discriminante contesta una pregunta que ningún empresario quiere improvisar: ¿existe algún volumen de producción que evite la pérdida? Con discriminante positivo existen dos volúmenes de equilibrio y una franja rentable entre ellos. Con discriminante cero existe un único volumen que empata, y ni siquiera deja ganancia. Con discriminante negativo no existe ninguno, y ninguna cantidad de esfuerzo comercial cambia eso.</p>' +
      '<p>El puente entre el álgebra y la decisión es más directo de lo que parece: la utilidad máxima que puede alcanzar el negocio, es decir la altura del vértice, vale exactamente el discriminante dividido entre cuatro veces el coeficiente del término cuadrático. Por eso el signo del discriminante y el signo de la mejor utilidad posible son el mismo signo. Preguntar si hay punto de equilibrio y preguntar si la mejor semana posible deja ganancia son la misma pregunta.</p>' +
      '<p>De ahí sale un criterio práctico para evaluar cualquier compromiso de costo fijo, como rentar un local más grande o contratar personal de planta. El costo fijo no cambia el punto más alto de izquierda a derecha, solo baja la curva entera. Existe entonces un <strong>techo de costo fijo</strong> que el negocio aguanta: mientras la renta se quede por debajo de ese techo hay franja rentable, y en cuanto lo rebase la franja desaparece de golpe, sin aviso gradual.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Discriminante</div><div class="rform">b² − 4ac</div><div class="rnote">Vive bajo la raíz.</div></div>' +
        '<div class="rcard"><div class="rname">Positivo</div><div class="rform">dos raíces</div><div class="rnote">Hay franja rentable.</div></div>' +
        '<div class="rcard"><div class="rname">Cero</div><div class="rform">una raíz</div><div class="rnote">Un solo volumen empata.</div></div>' +

    return '' +
      '<div class="stag">Concept 4</div>' +
      '<h2>The discriminant: two break-even points, one, or none</h2>' +
      '<p>The expression living under the radical in the quadratic formula, b² − 4ac, is called the <strong>discriminant</strong>, and its sign can be read before any calculation is finished. If it is positive there are two distinct roots and the parabola cuts the axis at two points. If it is zero there is a single root and the parabola merely grazes the axis. If it is negative there is no real root and the parabola passes entirely on one side of the axis without touching it.</p>' +
      '<p>Translated into business terms, the discriminant answers a question no owner wants to improvise: is there any production volume that avoids a loss? With a positive discriminant there are two break-even volumes and a profitable band between them. With a discriminant of zero there is a single volume that breaks even, and it leaves no gain at all. With a negative discriminant there is none, and no amount of sales effort changes that.</p>' +
      '<p>The bridge between the algebra and the decision is more direct than it looks: the highest profit the business can reach, that is the height of the vertex, equals exactly the discriminant divided by four times the coefficient of the squared term. That is why the sign of the discriminant and the sign of the best possible profit are one and the same. Asking whether a break-even point exists and asking whether the best possible week leaves a gain are the same question.</p>' +

    'Conviene el plan de ' + intN(p10hi) + ' bolsas, porque un volumen mayor siempre deja más utilidad.',
    'Conviene el plan de ' + intN(p10lo) + ' bolsas, porque producir menos siempre reduce el costo total y protege el margen.',
    'Conviene el plan de ' + intN(p10hi) + ' bolsas, pero solo si baja el costo fijo, porque con el costo fijo actual los dos planes cierran en pérdida.'
  ];
  var o10en = [
    'Both plans leave exactly the same profit of ' + money(p10Ua) + ', and neither is the best: producing ' + intN(p10v) + ' bags leaves ' + money(p10U) + '.',
    'The plan for ' + intN(p10hi) + ' bags wins, because a larger volume always leaves more profit.',
    'The plan for ' + intN(p10lo) + ' bags wins, because producing less always cuts total cost and protects the margin.',
    'The plan for ' + intN(p10hi) + ' bags wins, but only if the fixed cost comes down, because at the current fixed cost both plans close at a loss.'
  ];
  var o10 = shuffleOpts(o10es, o10en, rng);
  addItem({
    title: { es: 'Dos planes de producción sobre la mesa', en: 'Two production plans on the table' },
    q: { es: 'El comité de Café Volcán tiene dos planes para la próxima semana: producir ' + intN(p10lo) + ' bolsas o producir ' + intN(p10hi) + ' bolsas. El costo fijo semanal es de ' + money(p10F) + ', cada bolsa cuesta ' + money(p10vc) + ' y la demanda inversa parte de ' + money(p10al) + ' bajando ' + money(p10k) + ' por cada bolsa adicional. ¿Qué plan conviene y por qué?',
        en: 'The committee at Café Volcán has two plans for next week: produce ' + intN(p10lo) + ' bags or produce ' + intN(p10hi) + ' bags. The weekly fixed cost is ' + money(p10F) + ', each bag costs ' + money(p10vc) + ' and inverse demand starts at ' + money(p10al) + ', falling ' + money(p10k) + ' for every additional bag. Which plan wins, and why?' },
    hint: { es: 'Antes de calcular las dos utilidades por separado, localiza el volumen del vértice y mide a qué distancia queda cada plan. La simetría de la parábola puede ahorrarte la mitad del trabajo.',
            en: 'Before working out the two profits separately, locate the vertex volume and measure how far each plan sits from it. The symmetry of the parabola can save you half the work.' },
    opts: { es: o10.es, en: o10.en },
    exp: { es: 'El vértice está en ' + intN(p10v) + ' bolsas, y los dos planes quedan a ' + intN(p10a) + ' bolsas de distancia, uno de cada lado. Por la simetría de la parábola ambos dejan la misma utilidad, ' + money(p10Ua) + ', mientras que producir ' + intN(p10v) + ' bolsas dejaría ' + money(p10U) + ', es decir ' + money(p10k * p10a * p10a) + ' más. La respuesta que prefiere las ' + intN(p10hi) + ' bolsas por ser más volumen supone que la utilidad crece sin techo, cuando el precio que hay que aceptar para colocar cada bolsa adicional es justo lo que le pone techo. La que prefiere las ' + intN(p10lo) + ' bolsas por costar menos mira solo el costo y olvida que el ingreso también baja al producir menos. Y la que da los dos planes por perdedores se equivoca en el signo: con ' + money(p10F) + ' de costo fijo la mejor semana deja ' + money(p10U) + ', así que la franja rentable existe y los dos planes caen dentro de ella.',
           en: 'The vertex sits at ' + intN(p10v) + ' bags, and both plans lie ' + intN(p10a) + ' bags away from it, one on each side. By the symmetry of the parabola both leave the same profit, ' + money(p10Ua) + ', whereas producing ' + intN(p10v) + ' bags would leave ' + money(p10U) + ', that is ' + money(p10k * p10a * p10a) + ' more. The answer favouring ' + intN(p10hi) + ' bags for being the larger volume assumes profit grows without a ceiling, when the price that must be accepted to move each additional bag is exactly what puts the ceiling there. The answer favouring ' + intN(p10lo) + ' bags for costing less looks only at cost and forgets that revenue falls too when less is produced. And the answer writing both plans off as losers has the sign wrong: at ' + money(p10F) + ' of fixed cost the best week leaves ' + money(p10U) + ', so the profitable band does exist and both plans fall inside it.' }
  }, o10.correctIdx, true);
}

/* ════════════════════════════════════════════════════════════════════════
   LANGUAGE
   Switching rebuilds visible text only. The numbers were drawn once by the
   seeded rng and never change with the language.
   ════════════════════════════════════════════════════════════════════════ */
function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);
  set('lbl-name-el',  t('lbl-name'));
  set('lbl-group-el', t('lbl-group'));
  set('startBtn',     t('btn-start'));
  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));
  var ll = document.getElementById('logo-left');  if (ll) ll.alt = SCHOOL.logoLeftAlt;
  var lr = document.getElementById('logo-right'); if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title = p.i18n.title[LANG];
    p.q     = p.i18n.q[LANG];
    p.hint  = p.i18n.hint[LANG];
    p.exp   = p.i18n.exp[LANG];
    p.opts  = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.q;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.opts[oi] !== undefined) o.innerHTML = p.opts[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.exp;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();
