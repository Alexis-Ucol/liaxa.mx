        en: 'For next month Aromas de Comala has scheduled ' + intN(p2q) + ' bags. The expenses that do not depend on volume add up to ' + money(p2F) + ' a month, every bag takes ' + money(p2v) + ' of material and the price each one sells for is ' + money(p2p) + '. What does the total cost of that month come to?' },
    opts: { es: o2.es, en: o2.en },
    hint: { es: 'Arma primero la expresión general y solo después sustituye el volumen. Revisa además qué dato del enunciado no interviene en un costo: hay una cifra que pertenece al lado de las ventas, no al de los gastos.',
            en: 'Build the general expression first and only then substitute the volume. Check as well which figure in the statement plays no part in a cost: one of them belongs to the sales side, not to the expenses side.' },
    exp: { es: 'El material del mes es ' + money(p2v) + ' repetido en ' + intN(p2q) + ' bolsas, es decir ' + money(p2v * p2q) + ', y a eso se le suman los ' + money(p2F) + ' que no dependen del volumen, de modo que el costo total es ' + money(p2correct) + '. La opción de ' + money(p2v * p2q) + ' se queda solo con el término variable y olvida que la renta se paga aunque no se tueste nada. La de ' + money(p2F + p2v + p2q) + ' suma las tres cifras del enunciado sin multiplicar el costo unitario por el volumen, y además suma bolsas con pesos. La de ' + money(p2F + p2p * p2q) + ' usa el precio de venta en lugar del costo de material: eso no es un costo sino una mezcla de ingreso con gasto fijo, y el precio pertenece a otra pregunta.',
           en: 'The material of the month is ' + money(p2v) + ' repeated over ' + intN(p2q) + ' bags, that is ' + money(p2v * p2q) + ', and to that the ' + money(p2F) + ' that do not depend on volume are added, so the total cost is ' + money(p2correct) + '. The option of ' + money(p2v * p2q) + ' keeps only the variable term and forgets that the rent is paid even if nothing is roasted. The one of ' + money(p2F + p2v + p2q) + ' adds the three figures in the statement without multiplying the unit cost by the volume, and on top of that adds bags to pesos. The one of ' + money(p2F + p2p * p2q) + ' uses the selling price instead of the material cost: that is not a cost but a mix of revenue and fixed expense, and the price belongs to a different question.' }
  }, o2.correctIdx, true);

  /* ═══════════════════════ CONCEPT 2 ═══════════════════════ */
  var c2coef  = 2 * c2v + c2s;
  var c2konst = c2F + (c2v + c2s) * c2a;

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>Términos semejantes y el paréntesis que hay que repartir</h2>' +
      '<p>Dos términos son <strong>semejantes</strong> cuando llevan exactamente la misma parte literal, es decir la misma letra elevada al mismo exponente. Solo entre términos semejantes se puede sumar, y sumarlos consiste en sumar sus coeficientes dejando la letra intacta: ' + intN(c2v) + 'q más ' + intN(c2s) + 'q son ' + intN(c2v + c2s) + 'q. En cambio ' + intN(c2v) + 'q más ' + intN(c2F) + ' no se pueden juntar en un solo término, y no por una prohibición arbitraria del álgebra sino porque cuentan cosas distintas: pesos por bolsa y pesos por mes. Una expresión que ya no admite más reducciones no está incompleta, está terminada.</p>' +
      '<p>La <strong>propiedad distributiva</strong> es la segunda herramienta del tema y la que más errores produce en un examen. Cuando un factor multiplica a una suma encerrada en un paréntesis, ese factor alcanza a todos los términos de adentro, sin excepción. Escrito con letras, m(q + b) es igual a mq + mb. Escrito en el idioma del negocio: si el maquilador cobra una tarifa por cada bolsa que pasa por sus manos, y por sus manos pasan las bolsas de tienda más las de muestra, esa tarifa se cobra por unas y por otras. Dejar una de las dos sin multiplicar equivale a suponer que alguien trabaja gratis.</p>' +
      '<p>Hay un caso que merece atención aparte: el <strong>signo menos delante del paréntesis</strong>. Restar un paréntesis es restar todo lo que hay dentro, así que cada término de adentro cambia de signo al salir. Este detalle aparecerá otra vez en el siguiente concepto, cuando al ingreso se le reste el costo completo, y es responsable de una porción notable de los resultados equivocados en la práctica profesional.</p>' +
      '<p>Conviene cerrar con una costumbre barata y muy rentable: la <strong>comprobación numérica</strong>. Si una expresión se simplificó bien, la original y la reducida tienen que dar el mismo número al evaluarlas en cualquier valor. Basta elegir un volumen cómodo, sustituirlo en las dos y comparar. Cuando los dos resultados no coinciden, el error se localiza en segundos en lugar de arrastrarse hasta el presupuesto final.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Semejantes</div><div class="rform">' + intN(c2v) + 'q + ' + intN(c2s) + 'q = ' + intN(c2v + c2s) + 'q</div><div class="rnote">Misma letra: se suman coeficientes.</div></div>' +
        '<div class="rcard"><div class="rname">No semejantes</div><div class="rform">' + intN(c2v) + 'q + ' + intN(c2F) + '</div><div class="rnote">Ya está simplificado.</div></div>' +
        '<div class="rcard"><div class="rname">Distributiva</div><div class="rform">m(q + b) = mq + mb</div><div class="rnote">El de afuera alcanza a todos.</div></div>' +
        '<div class="rcard"><div class="rname">Menos delante</div><div class="rform">−(a + b) = −a − b</div><div class="rnote">Cambian todos los signos.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Aromas de Comala vende q bolsas en el mostrador y, por su tienda en línea, ' + intN(c2a) + ' bolsas más que las del mostrador. Cada bolsa cuesta ' + money(c2v) + ' de material, y las que salen en línea pagan además ' + money(c2s) + ' de envío. La renta y los sueldos suman ' + money(c2F) + ' al mes. La contadora quiere una sola expresión simplificada del costo total.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se escriben las bolsas de cada canal. En mostrador son q y en línea son q + ' + intN(c2a) + ', porque son las mismas del mostrador más ' + intN(c2a) + '.<br>' +
      '<strong>Paso 2.</strong> Se escribe el costo de cada canal. El mostrador cuesta ' + intN(c2v) + 'q. En línea cada bolsa cuesta ' + money(c2v + c2s) + ' entre material y envío, así que su costo es ' + intN(c2v + c2s) + '(q + ' + intN(c2a) + ').<br>' +
      '<strong>Paso 3.</strong> Se reparte el factor del paréntesis sobre sus dos términos, con lo que el canal en línea queda como ' + intN(c2v + c2s) + 'q + ' + intN((c2v + c2s) * c2a) + '.<br>' +
      '<strong>Paso 4.</strong> Se agrupan los semejantes. Los términos con q suman ' + intN(c2coef) + 'q y los constantes, incluida la renta, suman ' + intN(c2konst) + ', de modo que la expresión final es ' + intN(c2coef) + 'q + ' + intN(c2konst) + '.<br>' +
      '<strong>Comprobación.</strong> Con q = 100 la forma larga y la reducida dan lo mismo, ' + money(c2coef * 100 + c2konst) + '. Si al comprobar no coincidieran, el sospechoso número uno sería el paréntesis: casi siempre falta multiplicar el segundo término de adentro.</p></div>';
    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Like terms and the parenthesis that has to be shared out</h2>' +
      '<p>Two terms are <strong>like terms</strong> when they carry exactly the same literal part, that is the same letter raised to the same exponent. Only like terms can be added, and adding them means adding their coefficients while leaving the letter untouched: ' + intN(c2v) + 'q plus ' + intN(c2s) + 'q makes ' + intN(c2v + c2s) + 'q. By contrast ' + intN(c2v) + 'q plus ' + intN(c2F) + ' cannot be merged into one term, and not because of an arbitrary ban in algebra but because they count different things: pesos per bag and pesos per month. An expression that admits no further reduction is not unfinished, it is finished.</p>' +
      '<p>The <strong>distributive property</strong> is the second tool of the topic and the one that produces the most mistakes in an exam. When a factor multiplies a sum enclosed in a parenthesis, that factor reaches every term inside, without exception. Written with letters, m(q + b) equals mq + mb. Written in the language of the business: if the packer charges a fee for every bag that passes through their hands, and through their hands pass the shop bags plus the sample bags, that fee is charged on both. Leaving one of the two unmultiplied amounts to assuming somebody works for free.</p>' +
      '<p>One case deserves separate attention: the <strong>minus sign in front of a parenthesis</strong>. Subtracting a parenthesis means subtracting everything inside it, so every term within changes sign on the way out. This detail will come back in the next concept, when the full cost is subtracted from revenue, and it is responsible for a sizeable share of the wrong results in professional practice.</p>' +
      '<p>It is worth closing with a cheap and very profitable habit: the <strong>numerical check</strong>. If an expression has been simplified correctly, the original and the reduced one must give the same number when evaluated at any value. It is enough to choose a comfortable volume, substitute it into both and compare. When the two results disagree, the mistake is located in seconds instead of being dragged all the way into the final budget.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Like terms</div><div class="rform">' + intN(c2v) + 'q + ' + intN(c2s) + 'q = ' + intN(c2v + c2s) + 'q</div><div class="rnote">Same letter: add coefficients.</div></div>' +
        '<div class="rcard"><div class="rname">Unlike terms</div><div class="rform">' + intN(c2v) + 'q + ' + intN(c2F) + '</div><div class="rnote">Already simplified.</div></div>' +
        '<div class="rcard"><div class="rname">Distributive</div><div class="rform">m(q + b) = mq + mb</div><div class="rnote">The outside factor reaches all.</div></div>' +
        '<div class="rcard"><div class="rname">Minus in front</div><div class="rform">−(a + b) = −a − b</div><div class="rnote">Every sign flips.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> Aromas de Comala sells q bags over the counter and, through its online shop, ' + intN(c2a) + ' bags more than the counter ones. Every bag costs ' + money(c2v) + ' of material, and the ones going out online also pay ' + money(c2s) + ' of shipping. Rent and salaries add up to ' + money(c2F) + ' a month. The accountant wants a single simplified expression for the total cost.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Write the bags of each channel. Over the counter they are q and online they are q + ' + intN(c2a) + ', because they are the same counter bags plus ' + intN(c2a) + '.<br>' +
      '<strong>Step 2.</strong> Write the cost of each channel. The counter costs ' + intN(c2v) + 'q. Online every bag costs ' + money(c2v + c2s) + ' between material and shipping, so its cost is ' + intN(c2v + c2s) + '(q + ' + intN(c2a) + ').<br>' +
      '<strong>Step 3.</strong> Share out the factor of the parenthesis over its two terms, which leaves the online channel as ' + intN(c2v + c2s) + 'q + ' + intN((c2v + c2s) * c2a) + '.<br>' +
      '<strong>Step 4.</strong> Group the like terms. The terms with q add up to ' + intN(c2coef) + 'q and the constants, rent included, add up to ' + intN(c2konst) + ', so the final expression is ' + intN(c2coef) + 'q + ' + intN(c2konst) + '.<br>' +
      '<strong>Check.</strong> At q = 100 the long form and the reduced one give the same figure, ' + money(c2coef * 100 + c2konst) + '. If they disagreed, suspect number one would be the parenthesis: almost always the second term inside is the one left unmultiplied.</p></div>';
  });

  widgetLikeTerms([
    { n: w2c1, perBag: true,  es: 'Grano por bolsa',        en: 'Beans per bag' },
    { n: w2c2, perBag: true,  es: 'Empaque por bolsa',      en: 'Packaging per bag' },
    { n: w2c3, perBag: true,  es: 'Envío por bolsa en línea', en: 'Shipping per online bag' },
    { n: w2k1, perBag: false, es: 'Renta del local',        en: 'Rent of the shop' },
    { n: w2k2, perBag: false, es: 'Sueldo base del tostador', en: 'Roaster base salary' },
    { n: w2k3, perBag: false, es: 'Cuota de la plataforma', en: 'Platform fee' }
  ], w2q);

  /* ── Item 3 · distribute, then collect like terms ── */
  var p3coef  = 2 * p3v + p3s;
  var p3konst = p3F + (p3v + p3s) * p3a;
  var o3raw = [
    intN(p3coef) + 'q + ' + intN(p3konst),
    intN(p3v + p3s) + 'q + ' + intN(p3konst),
    intN(p3coef) + 'q + ' + intN(p3F),
    intN(p3coef + p3konst) + 'q'
  ];
  var o3 = shuffleOpts(o3raw, o3raw, rng);
  addItem({
    title: { es: 'Dos canales en una sola expresión', en: 'Two channels in a single expression' },
    q: { es: 'Aromas de Comala vende q bolsas en el mostrador y, por su tienda en línea, ' + intN(p3a) + ' bolsas más que las del mostrador. Cada bolsa consume ' + money(p3v) + ' de material, y las que salen en línea pagan además ' + money(p3s) + ' de envío. La renta y los sueldos suman ' + money(p3F) + ' al mes. ¿Cuál expresión simplificada representa el costo total del mes?',
        en: 'Aromas de Comala sells q bags over the counter and, through its online shop, ' + intN(p3a) + ' bags more than the counter ones. Every bag takes ' + money(p3v) + ' of material, and the ones going out online also pay ' + money(p3s) + ' of shipping. Rent and salaries add up to ' + money(p3F) + ' a month. Which simplified expression represents the total cost of the month?' },
    opts: { es: o3.es, en: o3.en },
    hint: { es: 'Escribe primero cada canal por separado, sin prisa por juntar nada. Cuando llegues al canal en línea, cuenta cuántos términos hay dentro del paréntesis y asegúrate de que el factor de afuera toque a todos. Al final agrupa por unidades: pesos por bolsa con pesos por bolsa, pesos al mes con pesos al mes.',
            en: 'Write each channel separately first, without rushing to merge anything. When you get to the online channel, count how many terms sit inside the parenthesis and make sure the outside factor touches all of them. Then group by units: pesos per bag with pesos per bag, pesos per month with pesos per month.' },
    exp: { es: 'El mostrador cuesta ' + intN(p3v) + 'q. En línea cada bolsa cuesta ' + money(p3v + p3s) + ' y son q + ' + intN(p3a) + ' bolsas, así que ese canal cuesta ' + intN(p3v + p3s) + 'q + ' + intN((p3v + p3s) * p3a) + ' una vez repartido el paréntesis. Sumando los dos canales y la renta, los términos con q dan ' + intN(p3coef) + 'q y los constantes ' + intN(p3konst) + ', es decir ' + o3raw[0] + '. La opción ' + o3raw[1] + ' cobra el material una sola vez y deja fuera las bolsas del mostrador. La opción ' + o3raw[2] + ' reparte bien el coeficiente pero olvida multiplicar el factor por las ' + intN(p3a) + ' bolsas adicionales, que es justo el término que suele perderse. Y la opción ' + o3raw[3] + ' junta en un solo término el costo por bolsa con el costo mensual, que no son semejantes: al evaluarla en cualquier volumen da una cifra muy distinta de la real.',
           en: 'The counter costs ' + intN(p3v) + 'q. Online every bag costs ' + money(p3v + p3s) + ' and there are q + ' + intN(p3a) + ' bags, so that channel costs ' + intN(p3v + p3s) + 'q + ' + intN((p3v + p3s) * p3a) + ' once the parenthesis is shared out. Adding both channels and the rent, the terms with q give ' + intN(p3coef) + 'q and the constants ' + intN(p3konst) + ', that is ' + o3raw[0] + '. Option ' + o3raw[1] + ' charges the material only once and leaves the counter bags out. Option ' + o3raw[2] + ' shares out the coefficient correctly but forgets to multiply the factor by the ' + intN(p3a) + ' extra bags, which is exactly the term that usually goes missing. And option ' + o3raw[3] + ' merges the cost per bag with the monthly cost into a single term, and those are not like terms: evaluated at any volume it gives a figure far from the real one.' }
  }, o3.correctIdx, true);

  /* ── Item 4 · spotting a distributive error ── */
  var p4prod = p4m * p4b;
  var o4es = [
    'El factor de afuera debe multiplicar a los dos términos de adentro, así que el desarrollo correcto es ' + intN(p4m) + 'q + ' + intN(p4prod) + '.',
    'El resultado correcto es ' + intN(p4m) + 'q + ' + intN(p4b + p4m) + ', porque el ' + intN(p4m) + ' se suma al ' + intN(p4b) + '.',
    'No hay error: dentro del paréntesis solo el término con q se multiplica y el número se queda igual.',
    'El paréntesis no se puede desarrollar mientras no se conozca el valor de q.'
  ];
  var o4en = [
    'The outside factor must multiply both terms inside, so the correct expansion is ' + intN(p4m) + 'q + ' + intN(p4prod) + '.',
    'The right result is ' + intN(p4m) + 'q + ' + intN(p4b + p4m) + ', because the ' + intN(p4m) + ' is added to the ' + intN(p4b) + '.',
    'There is no error: inside the parenthesis only the term with q is multiplied and the number stays as it is.',
    'The parenthesis cannot be expanded until the value of q is known.'
  ];
  var o4 = shuffleOpts(o4es, o4en, rng);
  addItem({
    title: { es: 'Un paso del presupuesto que no cuadra', en: 'A budget step that does not add up' },
    q: { es: 'Al preparar el presupuesto del trimestre, un socio necesitaba multiplicar por ' + intN(p4m) + ' la cantidad de bolsas del periodo, que había escrito como (q + ' + intN(p4b) + '), y anotó que ' + intN(p4m) + '(q + ' + intN(p4b) + ') es igual a ' + intN(p4m) + 'q + ' + intN(p4b) + '. ¿Cuál es la observación correcta sobre ese paso?',
        en: 'While preparing the quarterly budget, a partner needed to multiply by ' + intN(p4m) + ' the number of bags of the period, which had been written as (q + ' + intN(p4b) + '), and wrote down that ' + intN(p4m) + '(q + ' + intN(p4b) + ') equals ' + intN(p4m) + 'q + ' + intN(p4b) + '. What is the correct observation about that step?' },
    opts: { es: o4.es, en: o4.en },
    hint: { es: 'Sustituye un valor cómodo de q, por ejemplo q = 10, en el paréntesis original y en lo que anotó el socio. Si las dos versiones fueran equivalentes tendrían que dar el mismo número.',
            en: 'Substitute a comfortable value of q, for instance q = 10, into the original parenthesis and into what the partner wrote down. If the two versions were equivalent they would have to give the same number.' },
    exp: { es: 'Multiplicar por ' + intN(p4m) + ' un grupo de bolsas significa multiplicar todo el grupo, y el grupo tiene dos partes: las q y las ' + intN(p4b) + '. El desarrollo correcto es ' + intN(p4m) + 'q + ' + intN(p4prod) + ', y la comprobación lo confirma: con q = 10 el paréntesis original vale ' + intN(p4m) + ' por ' + intN(10 + p4b) + ', mientras que lo anotado por el socio da una cifra menor. La opción que propone ' + intN(p4m) + 'q + ' + intN(p4b + p4m) + ' confunde multiplicar con sumar. La que sostiene que no hay error defiende justamente el paso equivocado, y en un presupuesto real dejaría fuera ' + intN(p4prod - p4b) + ' pesos de trabajo pagado. Y la que dice que hace falta conocer q confunde desarrollar con evaluar: repartir un factor es válido para cualquier valor de la variable, precisamente porque no depende de cuál sea.',
           en: 'Multiplying a group of bags by ' + intN(p4m) + ' means multiplying the whole group, and the group has two parts: the q and the ' + intN(p4b) + '. The correct expansion is ' + intN(p4m) + 'q + ' + intN(p4prod) + ', and the check confirms it: at q = 10 the original parenthesis is worth ' + intN(p4m) + ' times ' + intN(10 + p4b) + ', while what the partner wrote gives a smaller figure. The option proposing ' + intN(p4m) + 'q + ' + intN(p4b + p4m) + ' confuses multiplying with adding. The one claiming there is no error defends precisely the wrong step, and in a real budget it would leave ' + intN(p4prod - p4b) + ' pesos of paid work out. And the one saying q has to be known confuses expanding with evaluating: sharing out a factor is valid for any value of the variable, precisely because it does not depend on which value it takes.' }
  }, o4.correctIdx, false);

  /* ═══════════════════════ CONCEPT 3 ═══════════════════════ */
  var c3mg  = c3p - c3v;
  var c3pr  = c3mg * c3q - c3F;
  var c3avg = c3F / c3q + c3v;

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 3</div>' +
      '<h2>Factor común: el margen que estaba escondido</h2>' +
      '<p>Sacar <strong>factor común</strong> es el camino de regreso de la propiedad distributiva. Si repartir consistía en pasar de m(q + b) a mq + mb, factorizar consiste en reconocer que dos términos comparten una misma pieza y escribirla una sola vez por fuera. En una expresión de negocio esa pieza compartida suele ser precisamente la variable, y el resultado no es un adorno algebraico: es una frase distinta sobre el mismo negocio.</p>' +
      '<p>Véalo en la utilidad, que es ingreso menos costo. El ingreso del mes son las bolsas vendidas por su precio. El costo son los gastos fijos más el material de cada bolsa. Al restar el costo completo hay que restar todo lo que hay dentro del paréntesis, con lo que el término del material entra restando. Quedan entonces dos términos que contienen q, uno con el precio y otro con el costo unitario, y un término constante con los gastos fijos. Sacando la q como factor común, los dos primeros se funden en uno solo cuyo coeficiente es la resta del precio menos el costo unitario.</p>' +
      '<p>Ese coeficiente tiene nombre propio en economía: <strong>margen de contribución</strong>. Dice cuántos pesos aporta cada bolsa vendida para cubrir los gastos fijos y, una vez cubiertos, para la ganancia. Nótese lo que la forma factorizada permite decidir de un vistazo. Si el margen es positivo, vender más acerca el negocio a la ganancia. Si es cero o negativo, ningún volumen salva el mes: vender más solo agranda la pérdida, y lo que hay que mover es el precio o el costo unitario, no la cantidad. Esa conclusión estaba en la expresión original, pero escondida entre dos términos separados.</p>' +
      '<p>La otra operación que reordena una expresión de costos es <strong>dividirla entre la variable</strong>. El costo total dividido entre las bolsas producidas da el costo promedio por bolsa, y al repartir la división entre los dos términos aparece una suma de dos piezas muy distintas: los gastos fijos repartidos entre las bolsas, que se encogen conforme el volumen crece, y el costo unitario, que no se mueve nunca. Esa expresión es una <strong>expresión racional</strong>, con una advertencia que conviene decir en voz alta: la variable no puede valer cero, porque no se puede repartir un gasto entre cero bolsas, y en el negocio eso corresponde al mes en que no se produjo nada y el costo por unidad simplemente no existe.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Factor común</div><div class="rform">aq − bq = (a − b)q</div><div class="rnote">La pieza compartida sale una vez.</div></div>' +
        '<div class="rcard"><div class="rname">Utilidad</div><div class="rform">' + intN(c3mg) + 'q − ' + intN(c3F) + '</div><div class="rnote">Margen por bolsa menos lo fijo.</div></div>' +
        '<div class="rcard"><div class="rname">Margen</div><div class="rform">' + intN(c3p) + ' − ' + intN(c3v) + ' = ' + intN(c3mg) + '</div><div class="rnote">Lo que aporta cada bolsa.</div></div>' +
        '<div class="rcard"><div class="rname">Costo promedio</div><div class="rform">' + frac(intN(c3F), 'q') + ' + ' + intN(c3v) + '</div><div class="rnote">Con q distinta de cero.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Aromas de Comala vende cada bolsa en ' + money(c3p) + ', gasta ' + money(c3v) + ' de material por bolsa y carga con ' + money(c3F) + ' de gastos fijos al mes. La dirección quiere una expresión de la utilidad que se lea de un golpe y saber qué deja un mes de ' + intN(c3q) + ' bolsas.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se escribe la utilidad como ingreso menos costo, dejando el costo dentro de un paréntesis para no perder ningún término.<br>' +
      '<strong>Paso 2.</strong> Se quita el paréntesis con cuidado: al restarlo, tanto los gastos fijos como el material del mes entran restando.<br>' +
      '<strong>Paso 3.</strong> Se sacan como factor común las bolsas, que aparecen en el término del precio y en el del material. El coeficiente que queda es ' + intN(c3p) + ' − ' + intN(c3v) + ', es decir ' + money(c3mg) + ' por bolsa, y la expresión final es ' + intN(c3mg) + 'q − ' + intN(c3F) + '.<br>' +
      '<strong>Paso 4.</strong> Se evalúa en q = ' + intN(c3q) + ': las bolsas aportan ' + money(c3mg * c3q) + ', y descontando los ' + money(c3F) + ' fijos el mes deja ' + money(c3pr) + '.<br>' +
      '<strong>Lectura de negocio.</strong> El margen de ' + money(c3mg) + ' por bolsa es el número que sirve para negociar. Si el proveedor sube el grano un peso, el margen baja un peso y la utilidad del mes cae en ' + money(c3q) + ' con el mismo volumen. Y el costo promedio por bolsa de ese mes, ' + money2(c3avg) + ', se acerca a ' + money(c3v) + ' conforme el volumen crece, pero nunca lo alcanza: el material se paga entero en cada bolsa.</p></div>';
    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>Common factor: the margin that was hiding</h2>' +
      '<p>Taking out a <strong>common factor</strong> is the way back from the distributive property. If sharing out meant going from m(q + b) to mq + mb, factoring means recognising that two terms share one and the same piece and writing it just once on the outside. In a business expression that shared piece is usually the variable itself, and the result is not an algebraic ornament: it is a different sentence about the same business.</p>' +
      '<p>See it in profit, which is revenue minus cost. The revenue of the month is the bags sold times their price. The cost is the fixed expenses plus the material of every bag. Subtracting the whole cost means subtracting everything inside the parenthesis, so the material term comes in as a subtraction. What is left is two terms carrying q, one with the price and one with the unit cost, and a constant term with the fixed expenses. Taking q out as a common factor, the first two melt into a single one whose coefficient is the price minus the unit cost.</p>' +
      '<p>That coefficient has its own name in economics: <strong>contribution margin</strong>. It says how many pesos every bag sold contributes towards covering the fixed expenses and, once those are covered, towards profit. Notice what the factored form settles at a glance. If the margin is positive, selling more moves the business towards profit. If it is zero or negative, no volume saves the month: selling more only widens the loss, and what has to move is the price or the unit cost, not the quantity. That conclusion was already in the original expression, but hidden between two separate terms.</p>' +
      '<p>The other operation that reorders a cost expression is <strong>dividing it by the variable</strong>. Total cost divided by the bags produced gives the average cost per bag, and sharing that division across the two terms brings out a sum of two very different pieces: the fixed expenses spread over the bags, which shrink as volume grows, and the unit cost, which never moves. That is a <strong>rational expression</strong>, with a warning worth saying out loud: the variable cannot be zero, because an expense cannot be spread over zero bags, and in the business that corresponds to the month when nothing was produced and the cost per unit simply does not exist.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Common factor</div><div class="rform">aq − bq = (a − b)q</div><div class="rnote">The shared piece comes out once.</div></div>' +
        '<div class="rcard"><div class="rname">Profit</div><div class="rform">' + intN(c3mg) + 'q − ' + intN(c3F) + '</div><div class="rnote">Margin per bag minus the fixed part.</div></div>' +
        '<div class="rcard"><div class="rname">Margin</div><div class="rform">' + intN(c3p) + ' − ' + intN(c3v) + ' = ' + intN(c3mg) + '</div><div class="rnote">What every bag contributes.</div></div>' +
        '<div class="rcard"><div class="rname">Average cost</div><div class="rform">' + frac(intN(c3F), 'q') + ' + ' + intN(c3v) + '</div><div class="rnote">With q other than zero.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> Aromas de Comala sells every bag at ' + money(c3p) + ', spends ' + money(c3v) + ' of material per bag and carries ' + money(c3F) + ' of fixed expenses a month. Management wants a profit expression that reads in one go, and wants to know what a month of ' + intN(c3q) + ' bags leaves.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Write profit as revenue minus cost, keeping the cost inside a parenthesis so that no term goes missing.<br>' +
      '<strong>Step 2.</strong> Remove the parenthesis carefully: as it is being subtracted, both the fixed expenses and the material of the month come in as subtractions.<br>' +
      '<strong>Step 3.</strong> Take the bags out as a common factor, since they appear in the price term and in the material term. The coefficient left behind is ' + intN(c3p) + ' − ' + intN(c3v) + ', that is ' + money(c3mg) + ' per bag, and the final expression is ' + intN(c3mg) + 'q − ' + intN(c3F) + '.<br>' +
      '<strong>Step 4.</strong> Evaluate it at q = ' + intN(c3q) + ': the bags contribute ' + money(c3mg * c3q) + ', and after the ' + money(c3F) + ' of fixed expenses the month leaves ' + money(c3pr) + '.<br>' +
      '<strong>Business reading.</strong> The margin of ' + money(c3mg) + ' a bag is the number to negotiate with. If the supplier raises the beans by one peso, the margin drops by one peso and the profit of the month falls by ' + money(c3q) + ' at the same volume. And the average cost per bag that month, ' + money2(c3avg) + ', moves towards ' + money(c3v) + ' as volume grows, but never reaches it: the material is paid in full on every bag.</p></div>';
  });

  widgetMarginFactor(w3p, w3v, w3F, w3q);

  /* ── Item 5 · factoring the profit expression ── */
  var p5mg = p5p - p5v;
  var o5raw = [
    intN(p5mg) + 'q − ' + intN(p5F),
    intN(p5p + p5v) + 'q − ' + intN(p5F),
    intN(p5mg) + 'q + ' + intN(p5F),
    intN(p5F) + ' − ' + intN(p5mg) + 'q'
  ];
  var o5 = shuffleOpts(o5raw, o5raw, rng);
  addItem({
    title: { es: 'La utilidad escrita de un solo golpe', en: 'Profit written in one go' },
    q: { es: 'Aromas de Comala vende cada bolsa en ' + money(p5p) + ' y gasta ' + money(p5v) + ' de material por bolsa. Los gastos que no dependen del volumen suman ' + money(p5F) + ' al mes. La dirección pide la utilidad mensual escrita en función de las q bolsas vendidas, en su forma más compacta. ¿Cuál expresión corresponde?',
        en: 'Aromas de Comala sells every bag at ' + money(p5p) + ' and spends ' + money(p5v) + ' of material per bag. The expenses that do not depend on volume add up to ' + money(p5F) + ' a month. Management asks for the monthly profit written in terms of the q bags sold, in its most compact form. Which expression matches?' },
    opts: { es: o5.es, en: o5.en },
    hint: { es: 'Escribe la utilidad como lo que entra menos lo que sale, y encierra todo el costo en un paréntesis antes de quitarlo. Vigila el signo de cada término al salir del paréntesis y luego busca qué pieza comparten los dos términos que contienen bolsas.',
            en: 'Write profit as what comes in minus what goes out, and enclose the whole cost in a parenthesis before removing it. Watch the sign of every term as it leaves the parenthesis and then look for the piece shared by the two terms carrying bags.' },
    exp: { es: 'El ingreso es ' + intN(p5p) + 'q y el costo es ' + intN(p5F) + ' + ' + intN(p5v) + 'q. Al restar todo el costo, ambos términos entran restando, y sacando las bolsas como factor común el coeficiente queda ' + intN(p5p) + ' − ' + intN(p5v) + ', o sea ' + money(p5mg) + ' por bolsa: la expresión es ' + o5raw[0] + '. La opción ' + o5raw[1] + ' suma el precio con el costo en lugar de restarlos, lo que supondría que producir aumenta el margen. La opción ' + o5raw[2] + ' deja los gastos fijos sumando, con lo cual el negocio ganaría dinero por tener renta: el signo se perdió al quitar el paréntesis. Y la opción ' + o5raw[3] + ' invierte la resta y describe lo contrario de la utilidad, algo que crece cuando se vende menos.',
           en: 'Revenue is ' + intN(p5p) + 'q and cost is ' + intN(p5F) + ' + ' + intN(p5v) + 'q. Subtracting the whole cost brings both terms in as subtractions, and taking the bags out as a common factor leaves the coefficient ' + intN(p5p) + ' − ' + intN(p5v) + ', that is ' + money(p5mg) + ' a bag: the expression is ' + o5raw[0] + '. Option ' + o5raw[1] + ' adds the price to the cost instead of subtracting, which would mean that producing raises the margin. Option ' + o5raw[2] + ' leaves the fixed expenses adding, so the business would earn money for paying rent: the sign was lost when the parenthesis came off. And option ' + o5raw[3] + ' reverses the subtraction and describes the opposite of profit, something that grows when less is sold.' }
  }, o5.correctIdx, true);

  /* ── Item 6 · the average cost, a rational expression ── */
  var o6raw = [
    frac(intN(p6F) + ' + ' + intN(p6v) + 'q', 'q'),
    frac(intN(p6F) + ' + ' + intN(p6v), 'q'),
    frac(intN(p6F), 'q') + ' + ' + intN(p6v) + 'q',
    frac('q', intN(p6F) + ' + ' + intN(p6v) + 'q')
  ];
  var o6 = shuffleOpts(o6raw, o6raw, rng);
  addItem({
    title: { es: 'Lo que sale cada bolsa en promedio', en: 'What each bag costs on average' },
    q: { es: 'Con gastos fijos de ' + money(p6F) + ' al mes y ' + money(p6v) + ' de material por bolsa, el dueño quiere una expresión que le diga cuánto le sale en promedio cada bolsa cuando el mes cierra con q bolsas producidas. ¿Cuál es esa expresión?',
        en: 'With fixed expenses of ' + money(p6F) + ' a month and ' + money(p6v) + ' of material per bag, the owner wants an expression giving what each bag costs on average when the month closes with q bags produced. Which is that expression?' },
    opts: { es: o6.es, en: o6.en },
    hint: { es: 'Un promedio es un reparto: lo que se gastó en total repartido entre las unidades que se produjeron. Arma primero el costo total del mes completo y solo después decide entre qué se está repartiendo.',
            en: 'An average is a sharing out: what was spent in total shared among the units produced. Build the total cost of the whole month first and only then decide what it is being shared among.' },
    exp: { es: 'El costo total del mes es ' + intN(p6F) + ' + ' + intN(p6v) + 'q, y el promedio por bolsa es ese total repartido entre las q bolsas producidas, es decir ' + o6raw[0] + '. Al repartir la división entre los dos términos se ve mejor lo que ocurre: los gastos fijos se reparten y se encogen conforme el volumen crece, mientras que los ' + money(p6v) + ' de material siguen ahí en cada bolsa, y por eso el promedio se acerca a ' + money(p6v) + ' sin llegar nunca. La opción ' + o6raw[1] + ' reparte el material una sola vez, como si comprarlo para todo el mes costara ' + money(p6v) + '. La opción ' + o6raw[2] + ' reparte lo fijo pero vuelve a multiplicar el material por las bolsas, con lo que el promedio crecería sin límite al producir más. Y la última opción invierte la división y da bolsas por peso, no pesos por bolsa.',
           en: 'The total cost of the month is ' + intN(p6F) + ' + ' + intN(p6v) + 'q, and the average per bag is that total shared among the q bags produced, that is ' + o6raw[0] + '. Sharing the division across the two terms shows what happens more clearly: the fixed expenses are spread out and shrink as volume grows, while the ' + money(p6v) + ' of material stay there on every bag, and that is why the average moves towards ' + money(p6v) + ' without ever arriving. Option ' + o6raw[1] + ' shares out the material only once, as if buying it for the whole month cost ' + money(p6v) + '. Option ' + o6raw[2] + ' shares out the fixed part but multiplies the material by the bags again, so the average would grow without limit as more is produced. And the last option turns the division upside down and gives bags per peso, not pesos per bag.' }
  }, o6.correctIdx, true);

  /* ═══════════════════════ FINAL ASSESSMENT ═══════════════════════ */
  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Cierre</div>' +
      '<h2>Evaluación final</h2>' +
      '<p>Los cuatro reactivos que siguen no vienen precedidos de explicación. Mezclan todo lo anterior: traducir una situación, evaluar, repartir un paréntesis, agrupar semejantes y leer lo que dice un coeficiente. Trabaja cada uno con el mismo orden de siempre: nombra la variable, clasifica cada partida según se pague por bolsa o por mes, y comprueba con un valor cómodo antes de elegir.</p>'
      ;
    return '' +
      '<div class="stag">Closing</div>' +
      '<h2>Final assessment</h2>' +
      '<p>The four items that follow come with no explanation before them. They mix everything above: translating a situation, evaluating, sharing out a parenthesis, collecting like terms and reading what a coefficient says. Work through each one in the usual order: name the variable, classify every line according to whether it is paid per bag or per month, and check with a comfortable value before choosing.</p>';
  });

  /* ── Item 7 · evaluating the factored profit ── */
  var p7mg = p7p - p7v;
  var p7correct = p7mg * p7q - p7F;
  var o7raw = [ money(p7correct), money(p7mg * p7q), money(p7p * p7q - p7F), money(p7mg * p7q + p7F) ];
  var o7 = shuffleOpts(o7raw, o7raw, rng);
  addItem({
    title: { es: 'El cierre del mes en una tostadora vecina', en: 'Month end at a neighbouring roastery' },
    q: { es: 'Una tostadora vecina vende cada bolsa en ' + money(p7p) + ', gasta ' + money(p7v) + ' de material por bolsa y carga con ' + money(p7F) + ' de gastos fijos al mes. El mes cerró con ' + intN(p7q) + ' bolsas vendidas. ¿Cuánto dejó de utilidad ese mes?',
        en: 'A neighbouring roastery sells every bag at ' + money(p7p) + ', spends ' + money(p7v) + ' of material per bag and carries ' + money(p7F) + ' of fixed expenses a month. The month closed with ' + intN(p7q) + ' bags sold. How much profit did that month leave?' },
    opts: { es: o7.es, en: o7.en },
    hint: { es: 'Averigua primero cuánto aporta una sola bolsa antes de pensar en el mes completo. Con ese aporte por bolsa y el número de bolsas tienes lo que el volumen puso sobre la mesa, y todavía falta descontar lo que se paga sin importar el volumen.',
            en: 'Work out what a single bag contributes before thinking about the whole month. With that contribution per bag and the number of bags you have what volume put on the table, and there is still the part that is paid regardless of volume to take off.' },
    exp: { es: 'Cada bolsa deja ' + money(p7p) + ' menos ' + money(p7v) + ', es decir ' + money(p7mg) + ' de aporte. Con ' + intN(p7q) + ' bolsas el aporte del mes es ' + money(p7mg * p7q) + ', y descontando los ' + money(p7F) + ' fijos la utilidad es ' + money(p7correct) + '. La opción de ' + money(p7mg * p7q) + ' se detiene en el aporte total y nunca descuenta lo fijo. La de ' + money(p7p * p7q - p7F) + ' resta lo fijo pero olvida el material, es decir trata el precio completo como si fuera margen. Y la de ' + money(p7mg * p7q + p7F) + ' suma los gastos fijos en lugar de restarlos, un error de signo que hace ver rentable a un mes que apenas alcanzó ' + money(p7correct) + '.',
           en: 'Every bag leaves ' + money(p7p) + ' less ' + money(p7v) + ', that is ' + money(p7mg) + ' of contribution. With ' + intN(p7q) + ' bags the contribution of the month is ' + money(p7mg * p7q) + ', and after the ' + money(p7F) + ' of fixed expenses the profit is ' + money(p7correct) + '. The option of ' + money(p7mg * p7q) + ' stops at the total contribution and never takes off the fixed part. The one of ' + money(p7p * p7q - p7F) + ' subtracts the fixed part but forgets the material, that is, it treats the whole price as if it were margin. And the one of ' + money(p7mg * p7q + p7F) + ' adds the fixed expenses instead of subtracting them, a sign mistake that makes a month which barely reached ' + money(p7correct) + ' look rewarding.' }
  }, o7.correctIdx, true);

  /* ── Item 8 · one more parenthesis to share out ── */
  var o8raw = [
    intN(p8m + p8k) + 'q + ' + intN(p8m * p8b),
    intN(p8m + p8k) + 'q + ' + intN(p8b),
    intN(p8m) + 'q + ' + intN(p8m * p8b),
    intN(p8m + p8k) + 'q + ' + intN((p8m + p8k) * p8b)
  ];
  var o8 = shuffleOpts(o8raw, o8raw, rng);
  addItem({
    title: { es: 'Maquila y transporte del mes', en: 'Packing and transport for the month' },
    q: { es: 'El maquilador cobra ' + money(p8m) + ' por cada bolsa que empaca. El mes próximo empacará las q bolsas de tienda más ' + intN(p8b) + ' bolsas de muestra para una feria. El transporte cuesta ' + money(p8k) + ' por bolsa, pero solo se paga por las q bolsas de tienda, porque las muestras las recoge la organizadora de la feria. ¿Cuál expresión simplificada da el costo de maquila más transporte?',
        en: 'The packer charges ' + money(p8m) + ' for every bag packed. Next month the packer will pack the q shop bags plus ' + intN(p8b) + ' sample bags for a trade fair. Transport costs ' + money(p8k) + ' a bag, but it is paid only on the q shop bags, because the samples are collected by the fair organiser. Which simplified expression gives the cost of packing plus transport?' },
    opts: { es: o8.es, en: o8.en },
    hint: { es: 'Trata cada servicio por separado antes de juntarlos, y fíjate bien en cuántas bolsas pasan por cada uno: no son las mismas. Solo al final agrupa lo que comparte unidades.',
            en: 'Treat each service separately before joining them, and look closely at how many bags go through each one: they are not the same. Only at the end group what shares units.' },
    exp: { es: 'La maquila cubre q + ' + intN(p8b) + ' bolsas a ' + money(p8m) + ' cada una, lo que al repartir el paréntesis da ' + intN(p8m) + 'q + ' + intN(p8m * p8b) + '. El transporte cubre solo las de tienda y aporta ' + intN(p8k) + 'q. Agrupando los términos con q se obtiene ' + o8raw[0] + '. La opción ' + o8raw[1] + ' deja las ' + intN(p8b) + ' muestras sin multiplicar por la tarifa, como si empacarlas no costara. La opción ' + o8raw[2] + ' olvida el transporte en el coeficiente y cobra de menos en cada bolsa de tienda. Y la opción ' + o8raw[3] + ' cobra transporte también por las muestras, que según el enunciado no lo pagan: reparte un factor sobre un paréntesis que no le correspondía.',
           en: 'Packing covers q + ' + intN(p8b) + ' bags at ' + money(p8m) + ' each, which after sharing out the parenthesis gives ' + intN(p8m) + 'q + ' + intN(p8m * p8b) + '. Transport covers only the shop ones and brings in ' + intN(p8k) + 'q. Grouping the terms with q gives ' + o8raw[0] + '. Option ' + o8raw[1] + ' leaves the ' + intN(p8b) + ' samples unmultiplied by the fee, as if packing them cost nothing. Option ' + o8raw[2] + ' forgets transport in the coefficient and undercharges every shop bag. And option ' + o8raw[3] + ' charges transport on the samples too, which by the statement do not pay it: it shares out a factor over a parenthesis that was not its own.' }
  }, o8.correctIdx, true);

  /* ── Item 9 · reading what a coefficient says ── */
  var p9mg = p9p - p9v;
  var o9es = [
    'Lo que aporta cada bolsa vendida para cubrir los gastos fijos y, una vez cubiertos, para la ganancia.',
    'La ganancia que deja el mes una vez descontados los gastos fijos.',
    'Lo que cuesta producir una bolsa más, contando su parte de renta.',
    'El precio mínimo al que hay que vender cada bolsa para no perder dinero.'
  ];
  var o9en = [
    'What every bag sold contributes towards covering the fixed expenses and, once those are covered, towards profit.',
    'The profit the month leaves once the fixed expenses have been taken off.',
    'What it costs to produce one more bag, counting its share of the rent.',
    'The lowest price each bag has to sell at in order not to lose money.'
  ];
  var o9 = shuffleOpts(o9es, o9en, rng);
  addItem({
    title: { es: 'Qué dice el coeficiente', en: 'What the coefficient says' },
    q: { es: 'La utilidad mensual de Aromas de Comala quedó expresada como ' + intN(p9mg) + 'q − ' + intN(p9F) + ', donde q son las bolsas vendidas en el mes. El dueño pregunta qué le dice, en términos de su negocio, el ' + intN(p9mg) + ' que multiplica a la q. ¿Cuál respuesta es la correcta?',
        en: 'The monthly profit of Aromas de Comala ended up written as ' + intN(p9mg) + 'q − ' + intN(p9F) + ', where q is the bags sold in the month. The owner asks what the ' + intN(p9mg) + ' multiplying q says in terms of the business. Which answer is the right one?' },
    opts: { es: o9.es, en: o9.en },
    hint: { es: 'Piensa en las unidades del coeficiente y en qué cambia si se vende una bolsa más. Un coeficiente nunca es un total: es lo que ocurre por cada unidad de la variable.',
            en: 'Think about the units of the coefficient and about what changes if one more bag is sold. A coefficient is never a total: it is what happens for every unit of the variable.' },
    exp: { es: 'El coeficiente de la q está medido en pesos por bolsa y dice cuánto cambia la utilidad al vender una bolsa más: ' + money(p9mg) + ', que es el precio menos el costo de material. Ese aporte se va acumulando hasta cubrir los ' + money(p9F) + ' fijos, y de ahí en adelante es ganancia. Confundirlo con la ganancia del mes es el error más común: la ganancia es el valor de toda la expresión y depende del volumen, mientras que el coeficiente es fijo. Tampoco es el costo de producir una bolsa más, que sería ' + money(p9v) + ' y además no incluye reparto de renta, porque la renta no aumenta al producir una bolsa adicional. Y no es un precio mínimo: el precio aparece dentro de esa resta, no es su resultado.',
           en: 'The coefficient of q is measured in pesos per bag and says how much profit changes when one more bag is sold: ' + money(p9mg) + ', which is the price minus the material cost. That contribution piles up until the ' + money(p9F) + ' of fixed expenses are covered, and from there on it is profit. Confusing it with the profit of the month is the commonest mistake: profit is the value of the whole expression and depends on volume, while the coefficient is fixed. Nor is it the cost of producing one more bag, which would be ' + money(p9v) + ' and carries no share of rent either, because the rent does not rise when one extra bag is produced. And it is not a minimum price: the price sits inside that subtraction, it is not its result.' }
  }, o9.correctIdx, false);

  /* ── Item 10 · a simplification that was never available ── */
  var o10es = [
    'No se pueden sumar: uno cuenta pesos por bolsa y el otro son pesos del mes, así que la expresión ya estaba simplificada.',
    'El paso es correcto, porque simplificar consiste en sumar los números que aparecen.',
    'El resultado correcto es ' + intN(p10c + p10k) + ', sin la q.',
    'El paso solo es válido si q vale 1, y como el volumen del mes es mayor habría que multiplicar por él.'
  ];
  var o10en = [
    'They cannot be added: one counts pesos per bag and the other is pesos for the month, so the expression was already simplified.',
    'The step is correct, because simplifying means adding up the numbers that appear.',
    'The right result is ' + intN(p10c + p10k) + ', without the q.',
    'The step is valid only if q equals 1, and since the volume of the month is larger it would have to be multiplied by it.'
  ];
  var o10 = shuffleOpts(o10es, o10en, rng);
  addItem({
    title: { es: 'Una simplificación que nunca existió', en: 'A simplification that never existed' },
    q: { es: 'Un asistente registró el costo de un pedido como ' + intN(p10c) + 'q + ' + intN(p10k) + ', donde q son las bolsas del pedido, y en la siguiente línea lo dejó escrito como ' + intN(p10c + p10k) + 'q. ¿Cuál es la observación correcta sobre ese paso?',
        en: 'An assistant recorded the cost of an order as ' + intN(p10c) + 'q + ' + intN(p10k) + ', where q is the bags in the order, and on the next line left it written as ' + intN(p10c + p10k) + 'q. What is the correct observation about that step?' },
    opts: { es: o10.es, en: o10.en },
    hint: { es: 'Prueba con dos bolsas y compara las dos versiones. Y antes de eso, pregúntate qué mide cada término: si uno se paga por bolsa y el otro por pedido, no están contando lo mismo.',
            en: 'Try it with two bags and compare the two versions. And before that, ask what each term measures: if one is paid per bag and the other per order, they are not counting the same thing.' },
    exp: { es: 'Los dos términos no son semejantes: ' + intN(p10c) + 'q está medido en pesos por bolsa y el ' + intN(p10k) + ' es un monto del pedido completo, así que la expresión original ya estaba en su forma final. La comprobación lo confirma: con q = 2 la expresión correcta vale ' + money(p10c * 2 + p10k) + ' y lo que anotó el asistente da ' + money((p10c + p10k) * 2) + '. La opción que defiende el paso convierte el monto fijo en un cargo por bolsa. La que propone ' + intN(p10c + p10k) + ' sin la q hace lo contrario, borrar la variable, y deja una cifra que no depende del tamaño del pedido. Y la que apela a q igual a 1 confunde una coincidencia numérica con una equivalencia: dos expresiones son iguales solo si coinciden para todos los valores, no para uno.',
           en: 'The two terms are not like terms: ' + intN(p10c) + 'q is measured in pesos per bag and the ' + intN(p10k) + ' is an amount for the whole order, so the original expression was already in its final form. The check confirms it: at q = 2 the correct expression is worth ' + money(p10c * 2 + p10k) + ' and what the assistant wrote gives ' + money((p10c + p10k) * 2) + '. The option defending the step turns the fixed amount into a charge per bag. The one proposing ' + intN(p10c + p10k) + ' without the q does the opposite, erasing the variable, and leaves a figure that does not depend on the size of the order. And the one appealing to q equal to 1 confuses a numerical coincidence with an equivalence: two expressions are equal only if they agree at every value, not at one.' }
  }, o10.correctIdx, false);
}

/* ════════════════════════════════════════════════════════════════════════
   LANGUAGE
   Switching rebuilds visible text only. The numbers were drawn once by the
   seeded rng and never change with the language.
   ════════════════════════════════════════════════════════════════════════ */
function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);
  set('lbl-name-el',  t('lbl-name'));
  set('lbl-group-el', t('lbl-group'));
  set('startBtn',     t('btn-start'));
  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));
  var ll = document.getElementById('logo-left');  if (ll) ll.alt = SCHOOL.logoLeftAlt;
  var lr = document.getElementById('logo-right'); if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title = p.i18n.title[LANG];
    p.q     = p.i18n.q[LANG];
    p.hint  = p.i18n.hint[LANG];
    p.exp   = p.i18n.exp[LANG];
    p.opts  = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.q;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.opts[oi] !== undefined) o.innerHTML = p.opts[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.exp;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

/* ════════════════════════════════════════════════════════════════════════
   PDF
   ════════════════════════════════════════════════════════════════════════ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  /* Flattens the fraction markup into a slash before the tags are stripped,
     so a rational expression stays readable in the printed sheet. */
  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<span class="mf-den">/g, ' / ')
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/’/g, String.fromCharCode(39))
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/·/g,'*').replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(15); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.q);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.opts[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.opts[prob.correctIdx]||'');
    var expRaw = pdfText(prob.exp||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  var _fn = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');
  var _blobUrl = URL.createObjectURL(_pdfBlob);
  var _a = document.createElement('a');
  _a.href = _blobUrl;
  _a.download = _fn;
  document.body.appendChild(_a);
  _a.click();
  setTimeout(function(){ document.body.removeChild(_a); URL.revokeObjectURL(_blobUrl); }, 200);
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
</script>
