<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrumentos de Medición para Identificar Sustancias</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Instrumentos de Medición para Identificar Sustancias</div>
    <div class="wcourse" id="wcourse-el">Química · Tercero de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Instrumentos de Medición para Identificar Sustancias</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a4a8a', primaryDark:'#0c2547', primaryBg:'#e7edf6',
  accent:'#e07b1a', accentBg:'#fbeddf',
  darkPrimary:'#437bc6', darkPrimaryDark:'#74a5e6', darkPrimaryBg:'#0c203a',

  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });

function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function rN(x, n){ var p = Math.pow(10, n); return Math.round(x * p) / p; }
function fmtN(x, n){ var v = rN(x, n); return (Math.round(v) === v) ? String(Math.round(v)) : String(v); }
function fmt(x){ return fmtN(x, 1); }

/* cuatro opciones distintas, la correcta en la posicion 0 */
function optsF(correct, others, unit, dec){
  var d = (dec === undefined) ? 1 : dec;
  var c = rN(correct, d), out = [c], i, k = 1, v;
  for (i = 0; i < others.length && out.length < 4; i++){
    v = rN(others[i], d);
    if (v > 0 && out.indexOf(v) === -1) out.push(v);
  }
  while (out.length < 4){
    v = rN(c * (1 + 0.18 * k), d);
    if (v > 0 && out.indexOf(v) === -1) out.push(v);
    k++;
  }
  return out.map(function(x){ return fmtN(x, d) + (unit ? ' ' + unit : ''); });
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

  function draw(){
    var n = cap / dv, i, ticks = '';
    for (i = 1; i <= n; i++){
      var maj = (i % 5 === 0);
      ticks += '<div class="gw-tick' + (maj ? ' maj' : '') + '" style="bottom:' + (i / n * 100) + '%;width:' + (maj ? 30 : 16) + 'px">' +
        (maj ? '<span>' + (i * dv) + '</span>' : '') + '</div>';
    }
    elC.innerHTML =
      '<div class="gw-liq" style="height:' + (lev / cap * 100) + '%"></div>' + ticks +
      '<div class="gw-mark" style="bottom:' + (read / cap * 100) + '%"><b>' + read + '</b></div>';
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Capacidad', en:'Capacity' }) + '</div><div class="v">' + cap + ' mL</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Cada marca', en:'Each mark' }) + '</div><div class="v">' + dv + ' mL</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Tu lectura', en:'Your reading' }) + '</div><div class="v">' + read + ' mL</div></div>';
    elG.disabled = locked || done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres probetas leídas. La misma cantidad de líquido se anota distinto según lo que valga cada marca: leer un instrumento es contar sus divisiones, no adivinar el número.',
        en:'Three cylinders read. The same amount of liquid is recorded differently depending on what each mark is worth: reading an instrument means counting its divisions, not guessing the number.'
      }));
      return;
    }
    roundData();
    elB.textContent = L({ es:'Anotar lectura', en:'Record reading' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Llega otra probeta y sus marcas ya no valen lo mismo. Vuelve a leer.', en:'Another cylinder arrives and its marks are no longer worth the same. Read it again.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente probeta', en:'Next cylinder' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (read === lev){
      close('good', L({
        es:'Lectura correcta: ' + lev + ' mL. Contaste ' + (lev / dv) + ' marcas de ' + dv + ' mL cada una.',
        en:'Correct reading: ' + lev + ' mL. You counted ' + (lev / dv) + ' marks of ' + dv + ' mL each.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      read = lev;
      elG.value = String(lev);
      close('warm', L({
        es:'El menisco estaba en ' + lev + ' mL: son ' + (lev / dv) + ' marcas de ' + dv + ' mL. Cuando cambia el valor de la marca, cambia el número que anotas.',
        en:'The meniscus was at ' + lev + ' mL: that is ' + (lev / dv) + ' marks of ' + dv + ' mL. When the value of the mark changes, the number you record changes.'
      }));
      return;
    }
    var dif = lev - read;
    say(host, 'miss', dif > 0
      ? L({ es:'Tu línea quedó ' + dif + ' mL por debajo del menisco. Súbela.', en:'Your line is ' + dif + ' mL below the meniscus. Move it up.' })
      : L({ es:'Tu línea quedó ' + (-dif) + ' mL por encima del menisco. Bájala.', en:'Your line is ' + (-dif) + ' mL above the meniscus. Move it down.' }));
  }

  elG.addEventListener('input', function(){
    if (locked || done) return;
    read = parseInt(elG.value, 10);
    draw();
    var dif = lev - read;
    if (dif === 0) say(host, 'warm', L({ es:'La línea coincide con el menisco. Anota la lectura.', en:'The line matches the meniscus. Record the reading.' }));
    else if (dif > 0) say(host, '', L({ es:'Te faltan ' + dif + ' mL para alcanzar el menisco.', en:'You are ' + dif + ' mL short of the meniscus.' }));
    else say(host, '', L({ es:'Te pasaste del menisco por ' + (-dif) + ' mL.', en:'You went past the meniscus by ' + (-dif) + ' mL.' }));
  });
  elB.addEventListener('click', check);
  roundData();
  elT.innerHTML = L({ es:'Probeta con líquido sin medir', en:'Cylinder with unmeasured liquid' });
  draw();
  say(host, '', L({ es:'Primero fíjate cuánto vale cada marca y después mueve la línea.', en:'First check what each mark is worth and then move the line.' }));
}

/* ==========================================================================
   MANIPULATIVO 2 :: que balanza alcanza a separar dos muestras
   ========================================================================== */
function wRes(rng, host){
  var RES = [
    { r:1000, dec:0, lbl:'10 g' },
    { r:100,  dec:0, lbl:'1 g' },
    { r:10,   dec:1, lbl:'0.1 g' },
    { r:1,    dec:2, lbl:'0.01 g' }
  ];
  var rd = 0, tries = 0, locked = false, done = false;
  var mA = 0, mB = 0, sel = -1, key = 3;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'¿Qué balanza las separa?', en:'Which balance tells them apart?' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca una balanza y mira lo que marcaría cada muestra en ella. Busca la balanza más sencilla que todavía muestre dos números distintos.',
      en:'Tap a balance and look at what each sample would read on it. Look for the simplest balance that still shows two different numbers.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="bal"></div>' +
    '<div class="gw-lbl">' + L({ es:'Lo que marcaría cada muestra', en:'What each sample would read' }) + '</div>' +
    '<div class="gw-read" data-r="read"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Elegir esta balanza', en:'Choose this balance' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elL = host.querySelector('[data-r="bal"]'),
      elD = host.querySelector('[data-r="read"]'),
      elB = host.querySelector('[data-r="chk"]');

  function rdg(m, o){ return fmtN(Math.round(m / o.r) * o.r / 100, o.dec); }
  function sep(o){ return rdg(mA, o) !== rdg(mB, o); }

  function roundData(){
    var base = ri(rng, 900, 4200), delta = pk(rng, [3, 8, 15, 35, 70, 140]);
    mA = base; mB = base + delta;
    var i, k = 3;
    for (i = 0; i < RES.length; i++){ if (sep(RES[i])){ k = i; break; } }
    key = k;
    sel = -1; tries = 0; locked = false;
  }

  function draw(){
    elT.innerHTML = L({ es:'Dos muestras del mismo tamaño, número ', en:'Two samples of the same size, number ' }) + (rd + 1);
    elL.innerHTML = RES.map(function(o, i){
      return '<button class="gw-tile' + (sel === i ? ' on' : '') + '" data-b="' + i + '"' + (locked || done ? ' disabled' : '') + '>' +
        L({ es:'Balanza de ', en:'Balance of ' }) + o.lbl + '<small>' + L({ es:'divisiones de ', en:'divisions of ' }) + o.lbl + '</small></button>';
    }).join('');
    if (sel < 0){
      elD.innerHTML =
        '<div class="gw-rd"><div class="k">' + L({ es:'Muestra A', en:'Sample A' }) + '</div><div class="v">?</div></div>' +
        '<div class="gw-rd"><div class="k">' + L({ es:'Muestra B', en:'Sample B' }) + '</div><div class="v">?</div></div>' +
        '<div class="gw-rd"><div class="k">' + L({ es:'Se distinguen', en:'Told apart' }) + '</div><div class="v">?</div></div>';
    } else {
      var o = RES[sel];
      elD.innerHTML =
        '<div class="gw-rd"><div class="k">' + L({ es:'Muestra A', en:'Sample A' }) + '</div><div class="v">' + rdg(mA, o) + ' g</div></div>' +
        '<div class="gw-rd"><div class="k">' + L({ es:'Muestra B', en:'Sample B' }) + '</div><div class="v">' + rdg(mB, o) + ' g</div></div>' +
        '<div class="gw-rd"><div class="k">' + L({ es:'Se distinguen', en:'Told apart' }) + '</div><div class="v">' + (sep(o) ? L({ es:'sí', en:'yes' }) : L({ es:'no', en:'no' })) + '</div></div>';
    }
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres parejas revisadas. Una diferencia existe aunque la balanza no la note: lo que decide si dos muestras se pueden separar es el tamaño de la división del instrumento.',
        en:'Three pairs reviewed. A difference exists even when the balance cannot notice it: what decides whether two samples can be separated is the size of the instrument division.'
      }));
      return;
    }
    roundData();
    elB.textContent = L({ es:'Elegir esta balanza', en:'Choose this balance' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Llegan otras dos muestras, ahora más parecidas entre sí. Prueba de nuevo.', en:'Two more samples arrive, now more alike. Try again.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente pareja', en:'Next pair' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (sel < 0){
      say(host, 'warm', L({ es:'Toca una balanza para ver qué marcaría cada muestra en ella.', en:'Tap a balance to see what each sample would read on it.' }));
      return;
    }
    var o = RES[sel], ky = RES[key];
    if (sel === key){
      close('good', L({
        es:'Esa es la balanza que buscabas: con divisiones de ' + o.lbl + ' las muestras marcan ' + rdg(mA, o) + ' g y ' + rdg(mB, o) + ' g, y ninguna balanza más sencilla las separa.',
        en:'That is the balance you were after: with divisions of ' + o.lbl + ' the samples read ' + rdg(mA, o) + ' g and ' + rdg(mB, o) + ' g, and no simpler balance separates them.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      sel = key;
      close('warm', L({
        es:'La balanza de ' + ky.lbl + ' es la más sencilla que aún las separa: marca ' + rdg(mA, ky) + ' g y ' + rdg(mB, ky) + ' g.',
        en:'The balance of ' + ky.lbl + ' is the simplest one that still separates them: it reads ' + rdg(mA, ky) + ' g and ' + rdg(mB, ky) + ' g.'
      }));
      return;
    }
    if (!sep(o)){
      say(host, 'miss', L({
        es:'Con esta balanza las dos muestras marcan ' + rdg(mA, o) + ' g: sus divisiones son demasiado grandes para notar la diferencia. Busca una de divisiones más finas.',
        en:'On this balance both samples read ' + rdg(mA, o) + ' g: its divisions are too large to notice the difference. Look for one with finer divisions.'
      }));
    } else {
      say(host, 'miss', L({
        es:'Con esta balanza sí se ven distintas, pero hay otra de divisiones más grandes que también las separa. Pruébala.',
        en:'On this balance they do look different, but there is another one with larger divisions that also separates them. Try it.'
      }));
    }
  }

  elL.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-b]');
    if (!b || locked || done) return;
    sel = parseInt(b.getAttribute('data-b'), 10);
    draw();
    var o = RES[sel];
    say(host, sep(o) ? '' : 'warm', sep(o)
      ? L({ es:'Con divisiones de ' + o.lbl + ' aparecen dos números distintos: ' + rdg(mA, o) + ' g y ' + rdg(mB, o) + ' g.', en:'With divisions of ' + o.lbl + ' two different numbers appear: ' + rdg(mA, o) + ' g and ' + rdg(mB, o) + ' g.' })
      : L({ es:'Con divisiones de ' + o.lbl + ' las dos marcan ' + rdg(mA, o) + ' g.', en:'With divisions of ' + o.lbl + ' both read ' + rdg(mA, o) + ' g.' }));
  });
  elB.addEventListener('click', check);
  roundData();
  draw();
  say(host, '', L({ es:'Prueba las balanzas de la mesa antes de decidir.', en:'Try the balances on the table before deciding.' }));
}


/* ==========================================================================
   MANIPULATIVO 3 :: volumen por desplazamiento de agua
   ========================================================================== */
function wDisp(rng, host){
  var CAP = 100;
  var rd = 0, tries = 0, locked = false, done = false, dropped = false;
  var mt = MAT[0], vol = 20, v1 = 30, claim = 0, mass = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Sumerge y mide', en:'Submerge and measure' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Sumerge la pieza y observa hasta dónde llega el agua. Después mueve el control hasta que la franja dorada cubra exactamente lo que subió el nivel.',
      en:'Submerge the piece and watch how far the water goes. Then move the control until the golden band covers exactly how much the level rose.'
    }) + '</div>' +
    '<div class="gw-stage">' +
      '<div class="gw-cyl" data-r="cyl"></div>' +
      '<div class="gw-side">' +
        '<div class="gw-read" data-r="read"></div>' +
        '<div class="gw-row"><button class="gw-btn" data-r="drop">' + L({ es:'Sumergir la pieza', en:'Submerge the piece' }) + '</button></div>' +
        '<div class="gw-lbl">' + L({ es:'Volumen que le atribuyes a la pieza', en:'Volume you attribute to the piece' }) + '</div>' +
        '<input class="gw-rng" type="range" min="0" max="50" step="1" value="0" data-r="rng">' +
        '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Anotar volumen', en:'Record volume' }) + '</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elC = host.querySelector('[data-r="cyl"]'),
      elD = host.querySelector('[data-r="read"]'),
      elP = host.querySelector('[data-r="drop"]'),
      elG = host.querySelector('[data-r="rng"]'),
      elB = host.querySelector('[data-r="chk"]');

  function roundData(){
    mt = pk(rng, [MAT[0], MAT[3], MAT[4], MAT[5]]);
    vol = pk(rng, [10, 15, 20, 25, 30]);
    v1 = pk(rng, [20, 30, 40, 50]);
    if (v1 + vol > 90) v1 = 20;
    mass = rN(mt.d * vol, 1);
    claim = 0; dropped = false; tries = 0; locked = false;
    elG.value = '0';
  }

  function lvl(){ return dropped ? v1 + vol : v1; }

  function draw(){
    var n = 20, i, ticks = '';
    for (i = 1; i <= n; i++){
      var maj = (i % 5 === 0);
      ticks += '<div class="gw-tick' + (maj ? ' maj' : '') + '" style="bottom:' + (i / n * 100) + '%;width:' + (maj ? 30 : 16) + 'px">' +
        (maj ? '<span>' + (i * 5) + '</span>' : '') + '</div>';
    }
    var band = claim > 0
      ? '<div class="gw-band" style="bottom:' + (v1 / CAP * 100) + '%;height:' + (claim / CAP * 100) + '%"></div>'
      : '';
    var solid = dropped
      ? '<div class="gw-solid" style="bottom:2px;height:' + Math.max(14, vol / CAP * 160) + 'px"></div>'
      : '<div class="gw-solid" style="bottom:' + Math.min(86, (lvl() / CAP * 100) + 6) + '%;height:' + Math.max(14, vol / CAP * 160) + 'px"></div>';
    elC.innerHTML =
      '<div class="gw-liq" style="height:' + (lvl() / CAP * 100) + '%"></div>' + ticks + band + solid;
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Nivel inicial', en:'Starting level' }) + '</div><div class="v">' + v1 + ' mL</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Nivel actual', en:'Current level' }) + '</div><div class="v">' + lvl() + ' mL</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Balanza', en:'Balance' }) + '</div><div class="v">' + fmt(mass) + ' g</div></div>';
    elG.disabled = locked || done;
    elP.disabled = dropped || locked || done;
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres piezas medidas. Una probeta no mide directamente un sólido: mide cuánto se corrió el agua, y ese corrimiento es el volumen de la pieza.',
        en:'Three pieces measured. A cylinder does not measure a solid directly: it measures how far the water moved, and that movement is the volume of the piece.'
      }));
      return;
    }
    roundData();
    elB.textContent = L({ es:'Anotar volumen', en:'Record volume' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otra pieza sin identificar y otro nivel de partida. Vuelve a medir.', en:'Another unidentified piece and another starting level. Measure again.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente pieza', en:'Next piece' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (!dropped){
      say(host, 'warm', L({ es:'Todavía no sumerges la pieza: sin ese cambio de nivel no hay nada que medir.', en:'You have not submerged the piece yet: without that change of level there is nothing to measure.' }));
      return;
    }
    if (claim === vol){
      close('good', L({
        es:'Exacto: el agua pasó de ' + v1 + ' mL a ' + (v1 + vol) + ' mL, así que la pieza ocupa ' + vol + ' cm³. Con los ' + fmt(mass) + ' g de la balanza, su densidad resulta ' + fmt(mt.d) + ' g/cm³, el valor del ' + L(mt).toLowerCase() + '.',
        en:'Exactly: the water went from ' + v1 + ' mL to ' + (v1 + vol) + ' mL, so the piece takes up ' + vol + ' cm³. With the ' + fmt(mass) + ' g from the balance, its density comes out as ' + fmt(mt.d) + ' g/cm³, the value for ' + L(mt).toLowerCase() + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      claim = vol;
      elG.value = String(vol);
      close('warm', L({
        es:'La franja que cuenta va de ' + v1 + ' mL a ' + (v1 + vol) + ' mL: son ' + vol + ' cm³. El nivel final por sí solo no es el volumen de la pieza.',
        en:'The band that counts goes from ' + v1 + ' mL to ' + (v1 + vol) + ' mL: that is ' + vol + ' cm³. The final level on its own is not the volume of the piece.'
      }));
      return;
    }
    var dif = vol - claim;
    say(host, 'miss', dif > 0
      ? L({ es:'Tu franja se queda ' + dif + ' mL por debajo del nivel que alcanzó el agua. Auméntala.', en:'Your band stays ' + dif + ' mL below the level the water reached. Increase it.' })
      : L({ es:'Tu franja rebasa por ' + (-dif) + ' mL el nivel que alcanzó el agua. Redúcela.', en:'Your band goes ' + (-dif) + ' mL past the level the water reached. Reduce it.' }));
  }

  elP.addEventListener('click', function(){
    if (dropped || locked || done) return;
    dropped = true;
    draw();
    say(host, '', L({
      es:'El agua subió y ahora marca ' + (v1 + vol) + ' mL. Antes marcaba ' + v1 + ' mL.',
      en:'The water rose and now reads ' + (v1 + vol) + ' mL. Before it read ' + v1 + ' mL.'
    }));
  });
  elG.addEventListener('input', function(){
    if (locked || done) return;
    claim = parseInt(elG.value, 10);
    draw();
    if (!dropped){
      say(host, 'warm', L({ es:'Sumerge la pieza primero: sin el cambio de nivel la franja no se puede comparar con nada.', en:'Submerge the piece first: without the change of level the band has nothing to compare with.' }));
      return;
    }
    var top = v1 + claim, dif = vol - claim;
    if (dif === 0) say(host, 'warm', L({ es:'La franja termina justo en ' + top + ' mL, donde quedó el agua. Anótalo.', en:'The band ends exactly at ' + top + ' mL, where the water settled. Record it.' }));
    else say(host, '', L({ es:'Tu franja llega a ' + top + ' mL y el agua quedó en ' + (v1 + vol) + ' mL.', en:'Your band reaches ' + top + ' mL and the water settled at ' + (v1 + vol) + ' mL.' }));
  });
  elB.addEventListener('click', check);
  roundData();
  elT.innerHTML = L({ es:'Pieza sin identificar sobre la probeta', en:'Unidentified piece above the cylinder' });
  draw();
  say(host, '', L({ es:'Anota el nivel inicial antes de sumergir nada.', en:'Note the starting level before submerging anything.' }));
}


/* ==========================================================================
   MANIPULATIVO 4 :: curva de calentamiento y termometro
   ========================================================================== */
function wHeat(rng, host){
  var T0 = 20, T1 = 24, PLAT = 12, TMAXT = 60;
  var rd = 0, tries = 0, locked = false, done = false;
  var mt = FUND[0], tcur = 0, sel = '', maxSeen = T0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Calienta e identifica', en:'Heat and identify' }) + '</div>' +
    '<div class="gw-q" data-r="ttl"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve el control para calentar la muestra y observa el termómetro. Cuando la temperatura deje de subir, esa pausa es la firma del material.',
      en:'Move the control to heat the sample and watch the thermometer. When the temperature stops rising, that pause is the signature of the material.'
    }) + '</div>' +
    '<div class="gw-stage">' +
      '<div class="gw-thermo" data-r="th"></div>' +
      '<div class="gw-side">' +
        '<canvas class="gw-plot" width="560" height="200" data-r="cv"></canvas>' +
        '<div class="gw-read" data-r="read"></div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-lbl">' + L({ es:'Tiempo de calentamiento', en:'Heating time' }) + '</div>' +
    '<input class="gw-rng" type="range" min="0" max="60" step="1" value="0" data-r="rng">' +
    '<div class="gw-lbl">' + L({ es:'Materiales de referencia', en:'Reference materials' }) + '</div>' +
    '<div class="gw-grid" data-r="subs"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Identificar', en:'Identify' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elT = host.querySelector('[data-r="ttl"]'),
      elH = host.querySelector('[data-r="th"]'),
      elV = host.querySelector('[data-r="cv"]'),
      elD = host.querySelector('[data-r="read"]'),
      elG = host.querySelector('[data-r="rng"]'),
      elS = host.querySelector('[data-r="subs"]'),
      elB = host.querySelector('[data-r="chk"]');

  function scale(){ return Math.ceil(mt.mp * 1.35 / 100) * 100; }
  function temp(t){
    var rate = (mt.mp - T0) / T1;
    if (t <= T1) return T0 + rate * t;
    if (t <= T1 + PLAT) return mt.mp;
    return mt.mp + rate * 0.55 * (t - T1 - PLAT);
  }
  function state(t){
    if (t < T1) return { es:'sólido, calentándose', en:'solid, warming up' };
    if (t <= T1 + PLAT) return { es:'fundiéndose', en:'melting' };
    return { es:'líquido, calentándose', en:'liquid, warming up' };
  }

  function roundData(){
    mt = pk(rng, FUND);
    tcur = 0; sel = ''; maxSeen = T0; tries = 0; locked = false;
    elG.value = '0';
  }

  function css(v){
    try { return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#888888'; }
    catch(e){ return '#888888'; }
  }

  function plot(){
    if (!elV || !elV.getContext) return;
    try {
      var ctx = elV.getContext('2d'), W = 560, H = 200, sc = scale(), i, x, y;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = css('--border'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(34, 8); ctx.lineTo(34, H - 20); ctx.lineTo(W - 8, H - 20); ctx.stroke();
      ctx.fillStyle = css('--text3'); ctx.font = '11px monospace';
      ctx.fillText('°C', 6, 16);
      ctx.fillText(String(sc), 4, 30);
      ctx.fillText('0', 22, H - 24);
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = css('--gold');
      var ym = H - 20 - (mt.mp / sc) * (H - 34);
      ctx.beginPath(); ctx.moveTo(34, ym); ctx.lineTo(W - 8, ym); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = css('--green'); ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (i = 0; i <= tcur; i++){
        x = 34 + (i / TMAXT) * (W - 46);
        y = H - 20 - (temp(i) / sc) * (H - 34);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    } catch(e){}
  }

  function draw(){
    var T = temp(tcur), sc = scale();
    if (T > maxSeen) maxSeen = T;
    elT.innerHTML = L({ es:'Muestra sólida sin identificar número ', en:'Unidentified solid sample number ' }) + (rd + 1);
    elH.innerHTML =
      '<div class="gw-merc" style="height:' + Math.min(100, T / sc * 100) + '%"></div>' +
      '<div class="gw-tmark" style="bottom:' + (mt.mp / sc * 100) + '%"></div>';
    elD.innerHTML =
      '<div class="gw-rd"><div class="k">' + L({ es:'Termómetro', en:'Thermometer' }) + '</div><div class="v">' + Math.round(T) + ' °C</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Tiempo', en:'Time' }) + '</div><div class="v">' + tcur + ' s</div></div>' +
      '<div class="gw-rd"><div class="k">' + L({ es:'Estado', en:'State' }) + '</div><div class="v">' + L(state(tcur)) + '</div></div>';
    elS.innerHTML = FUND.map(function(o){
      return '<button class="gw-tile' + (sel === o.k ? ' on' : '') + '" data-s="' + o.k + '"' + (locked || done ? ' disabled' : '') + '>' +
        L(o) + '<small>' + L({ es:'funde a ', en:'melts at ' }) + o.mp + ' °C</small></button>';
    }).join('');
    elG.disabled = locked || done;
    plot();
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elB.textContent = L({ es:'Completado', en:'Completed' });
      elB.className = 'gw-btn solved';
      draw();
      say(host, 'good', L({
        es:'Tres muestras identificadas con un solo termómetro. Mientras un sólido se funde, toda la energía que entra se usa en el cambio de estado y la temperatura se queda quieta en un valor propio de cada sustancia.',
        en:'Three samples identified with a single thermometer. While a solid melts, all the energy going in is used for the change of state and the temperature stays put at a value that belongs to each substance.'
      }));
      return;
    }
    roundData();
    elB.textContent = L({ es:'Identificar', en:'Identify' });
    elB.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Otra muestra sobre la parrilla. Vuelve a calentar desde el principio.', en:'Another sample on the hot plate. Heat it again from the start.' }));
  }

  function close(cls, txt){
    locked = true;
    elB.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente muestra', en:'Next sample' });
    elB.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (tcur < T1){
      say(host, 'warm', L({
        es:'La temperatura todavía va subiendo. Sigue calentando hasta que el termómetro se detenga en un valor.',
        en:'The temperature is still rising. Keep heating until the thermometer stops at one value.'
      }));
      return;
    }
    if (!sel){
      say(host, 'warm', L({ es:'Ya viste la pausa del termómetro. Ahora elige un material de la lista.', en:'You have seen the pause of the thermometer. Now choose a material from the list.' }));
      return;
    }
    var ch = null, i;
    for (i = 0; i < FUND.length; i++) if (FUND[i].k === sel) ch = FUND[i];
    if (ch.k === mt.k){
      close('good', L({
        es:'Correcto: la meseta se formó en ' + mt.mp + ' °C y ese es el valor de fusión del ' + L(mt).toLowerCase() + '.',
        en:'Correct: the plateau formed at ' + mt.mp + ' °C and that is the melting value of ' + L(mt).toLowerCase() + '.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      sel = mt.k;
      close('warm', L({
        es:'La muestra era de ' + L(mt).toLowerCase() + ': su temperatura de fusión es ' + mt.mp + ' °C, justo donde el termómetro se quedó quieto.',
        en:'The sample was ' + L(mt).toLowerCase() + ': its melting temperature is ' + mt.mp + ' °C, exactly where the thermometer stood still.'
      }));
      return;
    }
    say(host, 'miss', ch.mp > mt.mp
      ? L({ es:'El termómetro se detuvo en ' + mt.mp + ' °C, por debajo de los ' + ch.mp + ' °C del ' + L(ch).toLowerCase() + '. Busca un material que funda antes.', en:'The thermometer stopped at ' + mt.mp + ' °C, below the ' + ch.mp + ' °C of ' + L(ch).toLowerCase() + '. Look for a material that melts earlier.' })
      : L({ es:'El termómetro se detuvo en ' + mt.mp + ' °C, por encima de los ' + ch.mp + ' °C del ' + L(ch).toLowerCase() + '. Busca un material que aguante más calor antes de fundirse.', en:'The thermometer stopped at ' + mt.mp + ' °C, above the ' + ch.mp + ' °C of ' + L(ch).toLowerCase() + '. Look for a material that takes more heat before melting.' }));
  }

  elG.addEventListener('input', function(){
    if (locked || done) return;
    tcur = parseInt(elG.value, 10);
    draw();
    var T = Math.round(temp(tcur));
    if (tcur > T1 && tcur <= T1 + PLAT){
      say(host, 'warm', L({
        es:'El termómetro se quedó en ' + T + ' °C aunque sigues calentando: la muestra está cambiando de estado.',
        en:'The thermometer stays at ' + T + ' °C even though you keep heating: the sample is changing state.'
      }));
    } else if (tcur > T1 + PLAT){
      say(host, '', L({ es:'Ya se fundió toda la muestra y la temperatura vuelve a subir: ahora marca ' + T + ' °C.', en:'The whole sample has melted and the temperature rises again: it now reads ' + T + ' °C.' }));
    } else {
      say(host, '', L({ es:'La muestra sigue sólida y el termómetro marca ' + T + ' °C.', en:'The sample is still solid and the thermometer reads ' + T + ' °C.' }));
    }
  });
  elS.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-s]');
    if (!b || locked || done) return;
    sel = b.getAttribute('data-s');
    draw();
  });
  elB.addEventListener('click', check);
  roundData();
  draw();
  say(host, '', L({ es:'Empieza por calentar poco a poco y observa cuándo deja de subir la temperatura.', en:'Start by heating little by little and watch when the temperature stops rising.' }));
}

    '<p>' + L({
      es:'Para una pieza irregular la regla no sirve, así que el volumen se obtiene con la probeta: se anota el nivel del agua, se sumerge la pieza y se anota el nivel nuevo. Lo que subió el agua es el espacio que ocupa la pieza, y conviene recordar que 1 mL y 1 cm³ son el mismo tamaño.',
      en:'For an irregular piece the ruler is useless, so the volume is obtained with the cylinder: the water level is recorded, the piece is submerged and the new level is recorded. What the water rose by is the space the piece takes up, and it is worth remembering that 1 mL and 1 cm³ are the same size.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Aluminio', en:'Aluminium' }), '2.7 g/cm³', L({ es:'ligero para su tamaño', en:'light for its size' })) +
      rcard(L({ es:'Zinc', en:'Zinc' }), '7.1 g/cm³', L({ es:'gris azulado', en:'bluish grey' })) +
      rcard(L({ es:'Estaño', en:'Tin' }), '7.3 g/cm³', L({ es:'gris brillante', en:'shiny grey' })) +
      rcard(L({ es:'Hierro', en:'Iron' }), '7.9 g/cm³', L({ es:'gris oscuro', en:'dark grey' })) +
      rcard(L({ es:'Cobre', en:'Copper' }), '8.9 g/cm³', L({ es:'rojizo', en:'reddish' })) +
      rcard(L({ es:'Plomo', en:'Lead' }), '11.3 g/cm³', L({ es:'muy pesado para su tamaño', en:'very heavy for its size' })) +
    '</div>'
  );
  wDisp(rng, widgetHost(s3, 'w_disp'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* CONCEPTO 4 */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'El termómetro como identificador', en:'The thermometer as an identifier' }),
    '<p>' + L({
      es:'Cuando dos materiales tienen densidades muy parecidas, la balanza y la probeta se quedan cortas y hace falta otra propiedad que tampoco dependa de la cantidad. La temperatura a la que una sustancia se funde cumple ese papel y se mide con un solo instrumento.',
      en:'When two materials have very similar densities, the balance and the cylinder fall short and another property that also does not depend on the amount is needed. The temperature at which a substance melts plays that role and is measured with a single instrument.'
    }) + '</p>' +
    '<p>' + L({
      es:'Al calentar un sólido la temperatura sube hasta cierto valor y ahí se detiene: mientras conviven el sólido y el líquido, la energía que entra se ocupa en el cambio de estado. Esa pausa del termómetro, la misma en un trocito o en un bloque, es la firma de la sustancia.',
      en:'When a solid is heated the temperature rises up to a certain value and stops there: while solid and liquid coexist, the energy going in is spent on the change of state. That pause of the thermometer, the same in a small piece or in a whole block, is the signature of the substance.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Estaño', en:'Tin' }), '232 °C', L({ es:'funde en una parrilla común', en:'melts on an ordinary hot plate' })) +
      rcard(L({ es:'Plomo', en:'Lead' }), '327 °C', L({ es:'funde antes de ponerse al rojo', en:'melts before glowing red' })) +
      rcard(L({ es:'Zinc', en:'Zinc' }), '420 °C', L({ es:'pide un horno pequeño', en:'needs a small furnace' })) +
      rcard(L({ es:'Aluminio', en:'Aluminium' }), '660 °C', L({ es:'pide un horno de laboratorio', en:'needs a laboratory furnace' })) +
    '</div>'
  );
  wHeat(rng, widgetHost(s4, 'w_heat'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* CIERRE */
  sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Un plan de medición completo', en:'A complete measuring plan' }),
    '<p>' + L({
      es:'Las dos últimas situaciones piden decidir qué medir, con qué instrumento y qué hacer con los números que salgan. Anota tus pasos antes de elegir.',
      en:'The last two situations ask you to decide what to measure, with which instrument and what to do with the numbers that come out. Write down your steps before choosing.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}

</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Instrumentos de Medición para Identificar Sustancias';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
