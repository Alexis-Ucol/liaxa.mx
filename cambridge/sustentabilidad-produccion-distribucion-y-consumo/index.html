<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sustentabilidad: Producción, Distribución y Consumo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.iw-sub { font-size:.82rem; color:var(--text2); margin-bottom:.7rem; }
.wtask { background:var(--green-bg); border-radius:8px; padding:.55rem .8rem; font-size:.85rem; color:var(--text); margin-bottom:.75rem; }
.wtask strong { color:var(--green-dark); }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-bottom:.4rem; letter-spacing:.04em; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.5rem 1rem; font-size:.8rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; }
.wbtn:hover { border-color:var(--green); color:var(--green); }

/* tablero de los tres pilares */
.ch-list { display:flex; flex-direction:column; gap:.45rem; margin:.6rem 0; }
.ch-chip { display:flex; align-items:center; gap:.6rem; border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.55rem .75rem; font-size:.85rem; cursor:pointer; min-height:44px; transition:all .13s; }
.ch-chip:hover { border-color:var(--green); }
.ch-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.ch-chip.locked { cursor:default; border-color:var(--ok); background:var(--ok-bg); }
.ch-num { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--text3); flex-shrink:0; width:1.3rem; text-align:center; }

/* clasificador de momentos del ciclo */
.cls-card { border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.7rem .85rem; font-size:.86rem; font-weight:600; text-align:center; margin:.6rem 0; }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; }
.cls-bin { flex:1; min-width:120px; min-height:44px; border:1.5px solid var(--border); border-radius:9px; background:var(--surface); padding:.55rem .7rem; font-size:.83rem; font-family:inherit; color:var(--text2); cursor:pointer; transition:all .14s; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }

/* tablero y despensa: canvas, palancas y totales */
.cvbox { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.wcv { display:block; width:100%; height:auto; }
.srow { display:flex; align-items:center; gap:.7rem; margin-bottom:.5rem; flex-wrap:wrap; }
.slbl { font-size:.76rem; color:var(--text3); min-width:118px; }
.srow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:32px; }
.sval { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; color:var(--green); min-width:74px; text-align:right; }
.readout { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.rout { background:var(--surface2); border-radius:8px; padding:.55rem; text-align:center; }
.rlbl { font-size:.63rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); }
.rnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; color:var(--green); }

/* emparejar problemas con alternativas */
.mt-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin:.6rem 0; }
.mt-col { display:flex; flex-direction:column; gap:.45rem; }
.mt-hd { font-size:.65rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); font-weight:600; margin-bottom:.1rem; }
.mt-chip { border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.5rem .65rem; font-size:.8rem; cursor:pointer; min-height:44px; transition:all .13s; }
.mt-chip:hover { border-color:var(--green); }
.mt-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.mt-chip.done { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default; }

/* reflexión */
.reflect-prompt { font-size:.92rem; margin:.5rem 0 .8rem; color:var(--text2); }

@media (max-width:600px){
  .readout { grid-template-columns:repeat(3,1fr); gap:.3rem; }
  .rnum { font-size:.8rem; }
  .rlbl { font-size:.56rem; }
  .slbl { min-width:96px; font-size:.72rem; }
  .mt-grid { grid-template-columns:1fr; }
  .cls-bin { min-width:100%; }
  .ch-chip { font-size:.82rem; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Sustentabilidad: Producción, Distribución y Consumo</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'geo1_t07_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'geo1_t07_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'geo1_t07_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip

  var lx = PW - M - 36;

function cvar(name, fb){

function fmtN(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           v.fn || '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ================================================
   WIDGET 1 - TABLERO DE LOS TRES PILARES
   Three levers of one cooperative. Every move redraws the three pillar bars
   and the goal line at once, so the student sees that raising one pillar
   pushes another one down. Three goals; the third miss shows a combination
   that reaches the goal.
   ================================================ */
var PI = null;
function buildPillars(rng){
  var pools = [[45, 50, 55], [40, 50, 55]];
  PI = { v:5, r:3, l:4, goals: pick(pools, rng), round:0, tries:0, shown:false, done:false };
  return addWidget('pilares', 'wPillarsW',
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('Tablero de los tres pilares','Board of the three pillars') + '</div>' +
      '<div class="iw-sub">' + S('Mueve las tres palancas de una cooperativa y mira cómo suben y bajan las tres barras al instante.','Move the three levers of a cooperative and watch the three bars rise and fall instantly.') + '</div>' +
      '<div id="piBox"></div>' +
    '</div>');
}
function piAmb(){ return 70 - 5 * PI.v + 4 * PI.r; }
function piSoc(){ return 30 + 5 * PI.l + 2 * PI.v; }
function piEco(){ return 20 + 6 * PI.v - 2 * PI.r - PI.l; }
function piSetV(x){ if (!PI || PI.done || PI.shown) return; PI.v = parseInt(x, 10) / 10; piRender(); }
function piSetR(x){ if (!PI || PI.done || PI.shown) return; PI.r = parseInt(x, 10) / 10; piRender(); }
function piSetL(x){ if (!PI || PI.done || PI.shown) return; PI.l = parseInt(x, 10) / 10; piRender(); }
function piSolve(T){
  for (var v = 2; v <= 10; v++) for (var r = 0; r <= 10; r++) for (var l = 0; l <= 10; l++) {
    var a = 70 - 5 * v + 4 * r, s = 30 + 5 * l + 2 * v, e = 20 + 6 * v - 2 * r - l;
    if (a >= T && s >= T && e >= T) return { v:v, r:r, l:l };
  }
  return null;
}
function piRender(msg, cls){
  if (!PI) return;
  var box = document.getElementById('piBox');
  if (!box) return;
  var T = PI.goals[Math.min(PI.round, PI.goals.length - 1)];
  var task = PI.done
    ? S('Las tres metas quedaron atrás. Sigue moviendo las palancas para ver qué gana y qué pierde cada decisión.',
        'The three goals are behind you. Keep moving the levers to see what each decision gains and what it loses.')
    : S('Meta ' + (PI.round + 1) + ' de 3: deja los tres pilares en <strong>' + T + ' puntos o más</strong> al mismo tiempo.',
        'Goal ' + (PI.round + 1) + ' of 3: leave the three pillars at <strong>' + T + ' points or more</strong> at the same time.');
  var deflt = S('Cada palanca levanta un pilar y empuja otro hacia abajo. Muévelas las veces que quieras.',
                'Each lever lifts one pillar and pushes another one down. Move them as many times as you like.');
  box.innerHTML =
    '<div class="wtask">' + task + '</div>' +
    '<div class="cvbox"><canvas class="wcv" id="piCv" width="600" height="230"></canvas></div>' +
    '<div class="srow"><div class="slbl">' + S('Toneladas al año','Tonnes per year') + '</div>' +
      '<input type="range" min="20" max="100" step="10" value="' + (PI.v * 10) + '" oninput="piSetV(this.value)">' +
      '<div class="sval">' + (PI.v * 10) + '</div></div>' +
    '<div class="srow"><div class="slbl">' + S('Agua reutilizada','Water reused') + '</div>' +
      '<input type="range" min="0" max="100" step="10" value="' + (PI.r * 10) + '" oninput="piSetR(this.value)">' +
      '<div class="sval">' + (PI.r * 10) + ' %</div></div>' +
    '<div class="srow"><div class="slbl">' + S('Empleo del pueblo','Hiring from the town') + '</div>' +
      '<input type="range" min="0" max="100" step="10" value="' + (PI.l * 10) + '" oninput="piSetL(this.value)">' +
      '<div class="sval">' + (PI.l * 10) + ' %</div></div>' +
    '<div class="readout">' +
      '<div class="rout"><div class="rlbl">' + S('Ambiental','Environmental') + '</div><div class="rnum">' + piAmb() + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Social','Social') + '</div><div class="rnum">' + piSoc() + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Económico','Economic') + '</div><div class="rnum">' + piEco() + '</div></div>' +
    '</div>' +
    (PI.done ? ''
      : (PI.shown
          ? '<button class="wbtn" onclick="piNext()">' + S('Siguiente meta','Next goal') + '</button>'
          : '<button class="wbtn" onclick="piCheck()">' + S('Comprobar','Check') + '</button>')) +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
  piDraw(T);
}
function piDraw(T){
  var cv = document.getElementById('piCv');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var cSurf = cvar('--surface2', '#f0ede6');
  var cFaint = cvar('--border', '#ddd8cc');
  var cTxt = cvar('--text3', '#7a7468');
  var cols = [cvar('--ok', '#2d6a4f'), cvar('--gold', '#c9a84c'), cvar('--green', '#1a4a8a')];
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = cSurf; ctx.fillRect(0, 0, W, H);
  var vals = [piAmb(), piSoc(), piEco()];
  var labels = S(['Ambiental','Social','Económico'], ['Environmental','Social','Economic']);
  var L = 20, R = W - 20, Tp = 22, B = H - 28, i;
  ctx.strokeStyle = cFaint; ctx.lineWidth = 1;
  for (i = 0; i <= 4; i++) {
    var gy = Tp + (B - Tp) * i / 4;
    ctx.beginPath(); ctx.moveTo(L, gy); ctx.lineTo(R, gy); ctx.stroke();
  }
  var bw = (R - L) / 3 * 0.46;
  for (i = 0; i < 3; i++) {
    var cx = L + (R - L) * (i + 0.5) / 3;
    var h = (B - Tp) * Math.max(0, Math.min(100, vals[i])) / 100;
    ctx.fillStyle = (!PI.done && vals[i] < T) ? cFaint : cols[i];
    ctx.fillRect(cx - bw / 2, B - h, bw, h);
    ctx.fillStyle = cTxt; ctx.textAlign = 'center'; ctx.font = '13px sans-serif';
    ctx.fillText(String(vals[i]), cx, B - h - 7);
    ctx.font = '12px sans-serif';
    ctx.fillText(labels[i], cx, H - 9);
  }
  if (!PI.done) {
    var y = B - (B - Tp) * T / 100;
    ctx.setLineDash([6, 5]); ctx.strokeStyle = cvar('--gold', '#c9a84c'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = cvar('--gold', '#c9a84c'); ctx.textAlign = 'left'; ctx.font = '12px sans-serif';
    ctx.fillText(S('meta ', 'goal ') + T, L + 4, y - 6);
  }
}
function piCheck(){
  if (!PI || PI.done || PI.shown) return;
  var T = PI.goals[PI.round];
  var a = piAmb(), s = piSoc(), e = piEco();
  if (a >= T && s >= T && e >= T) {
    PI.shown = true;
    piRender(S('Lo lograste. Ninguna palanca sola alcanza la meta: los tres pilares subieron porque repartiste el esfuerzo entre las tres.',
               'You did it. No lever alone reaches the goal: the three pillars rose because you shared the effort among the three.'), 'ok');
    return;
  }
  PI.tries++;
  if (PI.tries >= 3) {
    var sol = piSolve(T);
    if (sol) { PI.v = sol.v; PI.r = sol.r; PI.l = sol.l; }
    PI.shown = true;
    piRender(S('Con estas tres posiciones los tres pilares llegan a la meta. Fíjate en que ninguna quedó en su valor máximo.',
               'With these three positions the three pillars reach the goal. Notice that none of them ended at its maximum value.'), 'warn');
    return;
  }
  var low = (a < T) ? 0 : ((s < T) ? 1 : 2);
  var msg;
  if (low === 0) {
    msg = S('El pilar ambiental se quedó en ' + a + ' y la meta es ' + T + '. Baja las toneladas o sube el agua reutilizada.',
            'The environmental pillar stayed at ' + a + ' and the goal is ' + T + '. Lower the tonnes or raise the reused water.');
  } else if (low === 1) {
    msg = S('El pilar social se quedó en ' + s + ' y la meta es ' + T + '. Contrata a más gente del pueblo.',
            'The social pillar stayed at ' + s + ' and the goal is ' + T + '. Hire more people from the town.');
  } else {
    msg = S('El pilar económico se quedó en ' + e + ' y la meta es ' + T + '. Sube las toneladas, o suelta un poco el agua reutilizada o el empleo, que cuestan dinero.',
            'The economic pillar stayed at ' + e + ' and the goal is ' + T + '. Raise the tonnes, or ease off the reused water or the hiring, which cost money.');
  }
  piRender(msg, 'warn');
}
function piNext(){
  if (!PI || PI.done) return;
  PI.round++; PI.tries = 0; PI.shown = false;
  if (PI.round >= PI.goals.length) PI.done = true;
  piRender();
}

/* ================================================
   WIDGET 2 - CADA PROBLEMA Y SU ALTERNATIVA
   Tap a problem on the left, then the alternative that attacks its cause.
   A wrong pair gives a nudge about what to look for; the third miss on the

   ================================================ */
var MT = null;
function buildMatch(rng){

    { l:{ es:'El invernadero riega inundando los surcos y en la temporada seca se queda sin agua',
          en:'The greenhouse irrigates by flooding the furrows and runs out of water in the dry season' },
      r:{ es:'Poner riego por goteo y guardar en un aljibe el agua de lluvia del techo',
          en:'Install drip irrigation and store the roof rainwater in a cistern' },
      tip:{ es:'busca la alternativa que use menos agua por planta', en:'look for the alternative that uses less water per plant' } },
    { l:{ es:'El taller de muebles tira el aserrín y compra gas para secar la madera',
          en:'The furniture workshop throws away the sawdust and buys gas to dry the wood' },
      r:{ es:'Quemar el aserrín en el secador y dejar de comprar el gas',
          en:'Burn the sawdust in the drier and stop buying the gas' },
      tip:{ es:'busca qué residuo puede convertirse en insumo', en:'look for the waste that can become an input' } },
    { l:{ es:'La parcela queda desnuda entre una cosecha y otra y la lluvia se lleva el suelo',
          en:'The plot is left bare between harvests and the rain washes the soil away' },
      r:{ es:'Sembrar una cubierta vegetal entre cosechas para sostener la tierra',
          en:'Sow a cover crop between harvests to hold the soil' },
      tip:{ es:'busca qué puede proteger el suelo mientras no hay cultivo', en:'look for what can protect the soil while there is no crop' } },
    { l:{ es:'La cooperativa pesquera saca también los peces pequeños que todavía no se reproducen',
          en:'The fishing cooperative also lands the small fish that have not reproduced yet' },
      r:{ es:'Usar redes de malla más abierta y respetar la temporada de veda',
          en:'Use nets with a wider mesh and respect the closed season' },
      tip:{ es:'busca la alternativa que deje crecer a los peces jóvenes', en:'look for the alternative that lets the young fish grow' } }
  ];
  MT = { pairs:PAIRS, right: shuffle([0,1,2,3], rng), sel:null, tries:0,
         doneL:[false,false,false,false], doneR:[false,false,false,false], solved:0, done:false };
  return addWidget('match', 'wMatchW',
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('Cada problema y su alternativa','Each problem and its alternative') + '</div>' +
      '<div class="iw-sub">' + S('Toca un problema y luego la alternativa que ataca su causa, hasta emparejar los cuatro.','Tap a problem and then the alternative that attacks its cause, until all four are paired.') + '</div>' +
      '<div id="mtBox"></div>' +
    '</div>');
}
function mtRender(msg, cls){
  if (!MT) return;
  var box = document.getElementById('mtBox');
  if (!box) return;
  if (MT.done) {
    box.innerHTML = '<div class="wmsg ok">' +
      S('Los cuatro quedaron emparejados. Ninguna alternativa consistió en producir menos: en las cuatro se cambió la manera de producir para que el recurso siguiera estando ahí el año siguiente.',
        'The four are paired up. None of the alternatives consisted of producing less: in all four the way of producing was changed so that the resource would still be there the following year.') + '</div>';
    return;
  }
  var left = MT.pairs.map(function(p, i){
    var cl = 'mt-chip' + (MT.doneL[i] ? ' done' : '') + (MT.sel === i ? ' sel' : '');
    return '<div class="' + cl + '" onclick="mtPickL(' + i + ')">' + p.l[LANG] + '</div>';
  }).join('');
  var right = MT.right.map(function(ri, pos){
    var cl = 'mt-chip' + (MT.doneR[pos] ? ' done' : '');
    return '<div class="' + cl + '" onclick="mtPickR(' + pos + ')">' + MT.pairs[ri].r[LANG] + '</div>';
  }).join('');
  var deflt = S('Toca un problema y después la alternativa que le corresponde.',
                'Tap a problem and then the alternative that goes with it.');
  box.innerHTML =
    '<div class="wprog">' + MT.solved + ' / ' + MT.pairs.length + '</div>' +
    '<div class="mt-grid">' +
      '<div class="mt-col"><div class="mt-hd">' + S('Problema','Problem') + '</div>' + left + '</div>' +
      '<div class="mt-col"><div class="mt-hd">' + S('Alternativa','Alternative') + '</div>' + right + '</div>' +
    '</div>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}
function mtLock(li){
  MT.doneL[li] = true;
  for (var pos = 0; pos < MT.right.length; pos++) if (MT.right[pos] === li) MT.doneR[pos] = true;
  MT.solved++; MT.sel = null; MT.tries = 0;
  if (MT.solved >= MT.pairs.length) MT.done = true;
}
function mtPickL(li){
  if (!MT || MT.done || MT.doneL[li]) return;
  MT.sel = (MT.sel === li) ? null : li;
  MT.tries = 0;
  mtRender();
}
function mtPickR(pos){
  if (!MT || MT.done || MT.doneR[pos]) return;
  if (MT.sel === null) {
    mtRender(S('Elige primero un problema de la columna izquierda.','Choose a problem from the left column first.'), 'warn');
    return;
  }
  var li = MT.sel;
  if (MT.right[pos] === li) {
    mtLock(li);
    mtRender(S('Emparejado. Esa alternativa no tapa el daño después, cambia lo que lo provoca.',
               'Paired. That alternative does not cover the damage afterwards, it changes what causes it.'), 'ok');
    return;
  }
  MT.tries++;
  if (MT.tries >= 3) {
    var tip = MT.pairs[li].tip[LANG];
    mtLock(li);
    mtRender(S('Esta era su alternativa. Para la próxima, ' + MT.pairs[li].tip.es + '.',
               'This was its alternative. Next time, ' + MT.pairs[li].tip.en + '.'), 'warn');
    return;
  }
  mtRender(S('Esa alternativa resuelve otro problema. Vuelve a leer el que elegiste: ' + MT.pairs[li].tip.es + '.',
             'That alternative solves another problem. Read again the one you chose: ' + MT.pairs[li].tip.en + '.'), 'warn');
}

function stBins(){ return S(['Producción','Distribución','Consumo'], ['Production','Distribution','Consumption']); }
function stRender(msg, cls){

                'Read the practice and decide in which part of the cycle the change happens.');
  box.innerHTML =
    '<div class="wprog">' + (ST.i + 1) + ' / ' + ST.items.length + '</div>' +
    '<div class="cls-card">' + it[LANG] + '</div>' +
    '<div class="cls-bins">' +
      '<button class="cls-bin" onclick="stPick(0)">' + B[0] + '</button>' +
      '<button class="cls-bin" onclick="stPick(1)">' + B[1] + '</button>' +
      '<button class="cls-bin" onclick="stPick(2)">' + B[2] + '</button>' +
    '</div>' +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}
function stPick(bi){
  if (!ST || ST.done || ST.lock) return;
  var it = ST.items[ST.seq[ST.i]];
  var B = stBins();
  if (bi === it.bin) {
    ST.correct++; ST.tries = 0; ST.i++;
    if (ST.i >= ST.items.length) ST.done = true;
    stRender(S('Correcto: esa práctica ' + it.why.es + '. Sigue con la siguiente.',
               'Correct: that practice ' + it.why.en + '. On to the next one.'), 'ok');
    return;
  }
  ST.tries++;
  if (ST.tries >= 3) {
    ST.tries = 0; ST.i++; ST.lock = true;
    if (ST.i >= ST.items.length) ST.done = true;
    stRender(S('Era <b>' + B[it.bin] + '</b>, porque esa práctica ' + it.why.es + '.',
               'It was <b>' + B[it.bin] + '</b>, because that practice ' + it.why.en + '.'), 'warn');
    setTimeout(function(){ if (ST) { ST.lock = false; stRender(); } }, 1600);
    return;
  }
  var nudge = (bi === 0)
    ? S('Todavía no. ¿Ese cambio ocurre mientras se elabora el producto, o cuando ya está hecho?',
        'Not yet. Does that change happen while the product is being made, or when it is already finished?')
    : (bi === 1
        ? S('Todavía no. ¿Ese cambio mueve el producto de un lugar a otro, o pasa antes o después de ese viaje?',
            'Not yet. Does that change move the product from one place to another, or does it happen before or after that journey?')
        : S('Todavía no. ¿Ese cambio lo decide quien compra y usa, o alguien más antes de que llegue a la tienda?',
            'Not yet. Is that change decided by whoever buys and uses, or by someone else before it reaches the shop?'));
  stRender(nudge, 'warn');
}

/* ================================================
   WIDGET 4 - LA DESPENSA DE LA SEMANA
   Four decisions, two options each. Every tap recalculates the kilometres
   travelled and the packaging waste of the whole basket, and the message
   names the line that weighs most. Three goals, tighter each time.
   ================================================ */
var BK = null;
function bkRows(){
  return [
    { name:{ es:'Fruta', en:'Fruit' }, opts:[
      { es:'De temporada, de un huerto a 40 km', en:'In season, from an orchard 40 km away', km:40, res:0 },
      { es:'Fuera de temporada, traída de 900 km', en:'Out of season, brought from 900 km away', km:900, res:120 } ] },
    { name:{ es:'Frijol', en:'Beans' }, opts:[
      { es:'A granel, en tu propia bolsa de tela', en:'Loose, in your own cloth bag', km:120, res:0 },
      { es:'En bolsas selladas de medio kilo', en:'In sealed half kilo bags', km:120, res:150 } ] },
    { name:{ es:'Agua', en:'Water' }, opts:[
      { es:'Garrafón que se rellena en la esquina', en:'Refillable jug filled around the corner', km:15, res:20 },
      { es:'Botellas de 600 ml para toda la semana', en:'600 ml bottles for the whole week', km:15, res:300 } ] },
    { name:{ es:'Reparto', en:'Delivery' }, opts:[
      { es:'Una sola entrega para todo el barrio', en:'A single delivery for the whole neighbourhood', km:30, res:0 },
      { es:'Una entrega por casa', en:'One delivery per house', km:210, res:0 } ] }
  ];
}
function buildBasket(rng){
  var pools = [
    [ { km:600, res:350 }, { km:400, res:200 }, { km:250, res:100 } ],
    [ { km:700, res:300 }, { km:450, res:180 }, { km:260, res:60 } ]
  ];
  BK = { pick:[1,1,1,1], goals: pick(pools, rng), round:0, tries:0, shown:false, done:false };
  return addWidget('canasta', 'wBasketW',
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('La despensa de la semana','The weekly shopping') + '</div>' +
      '<div class="iw-sub">' + S('Cambia cualquier renglón y los dos totales se recalculan de inmediato.','Change any line and the two totals are recalculated immediately.') + '</div>' +
      '<div id="bkBox"></div>' +
    '</div>');
}
function bkTotals(){
  var rows = bkRows(), km = 0, res = 0, i;
  for (i = 0; i < rows.length; i++) { var o = rows[i].opts[BK.pick[i]]; km += o.km; res += o.res; }
  return { km:km, res:res };
}
function bkWorst(field){
  var rows = bkRows(), bi = -1, bd = 0, i;
  for (i = 0; i < rows.length; i++) {
    var cur = rows[i].opts[BK.pick[i]][field];
    var alt = rows[i].opts[1 - BK.pick[i]][field];
    if (cur - alt > bd) { bd = cur - alt; bi = i; }
  }
  return bi < 0 ? null : rows[bi].name[LANG];
}
function bkPick(ri, oi){
  if (!BK || BK.done || BK.shown) return;
  BK.pick[ri] = oi;
  bkRender();
}
function bkRender(msg, cls){
  if (!BK) return;
  var box = document.getElementById('bkBox');
  if (!box) return;
  var g = BK.goals[Math.min(BK.round, BK.goals.length - 1)];
  var tot = bkTotals();
  var rows = bkRows();
  var task = BK.done
    ? S('Las tres despensas quedaron dentro de la meta. Sigue cambiando renglones para ver cuánto pesa cada decisión.',
        'The three baskets came in under the goal. Keep changing lines to see how much each decision weighs.')
    : S('Despensa ' + (BK.round + 1) + ' de 3: arma una compra de <strong>' + fmtN(g.km) + ' km o menos</strong> y <strong>' + g.res + ' g de envase o menos</strong>.',
        'Basket ' + (BK.round + 1) + ' of 3: build a shopping list of <strong>' + fmtN(g.km) + ' km or less</strong> and <strong>' + g.res + ' g of packaging or less</strong>.');
  var lines = rows.map(function(rw, ri){
    var chips = rw.opts.map(function(op, oi){
      var cl = 'mt-chip' + (BK.pick[ri] === oi ? ' sel' : '');
      return '<div class="' + cl + '" style="flex:1;min-width:44%" onclick="bkPick(' + ri + ',' + oi + ')">' +
        op[LANG] + '<div class="rlbl">' + op.km + ' km · ' + op.res + ' g</div></div>';
    }).join('');
    return '<div class="mt-hd">' + rw.name[LANG] + '</div><div class="cls-bins">' + chips + '</div>';
  }).join('');
  var deflt = S('Los dos totales se mueven con cada renglón que cambies. Prueba las combinaciones que quieras.',
                'The two totals move with every line you change. Try as many combinations as you like.');
  box.innerHTML =
    '<div class="wtask">' + task + '</div>' +
    lines +
    '<div class="readout">' +
      '<div class="rout"><div class="rlbl">' + S('Kilómetros','Kilometres') + '</div><div class="rnum">' + fmtN(tot.km) + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Envase (g)','Packaging (g)') + '</div><div class="rnum">' + tot.res + '</div></div>' +
      '<div class="rout"><div class="rlbl">' + S('Meta','Goal') + '</div><div class="rnum">' + (BK.done ? '-' : (fmtN(g.km) + ' / ' + g.res)) + '</div></div>' +
    '</div>' +
    (BK.done ? ''
      : (BK.shown
          ? '<button class="wbtn" onclick="bkNext()">' + S('Siguiente despensa','Next basket') + '</button>'
          : '<button class="wbtn" onclick="bkCheck()">' + S('Comprobar','Check') + '</button>')) +
    '<div class="wmsg' + (cls ? ' ' + cls : '') + '">' + (msg || deflt) + '</div>';
}
function bkCheck(){
  if (!BK || BK.done || BK.shown) return;
  var g = BK.goals[BK.round];
  var tot = bkTotals();
  if (tot.km <= g.km && tot.res <= g.res) {
    BK.shown = true;
    bkRender(S('Dentro de la meta. La misma despensa, con las mismas cosas dentro, puede viajar mucho menos y dejar mucho menos envase.',
               'Under the goal. The same basket, with the same things inside, can travel far less and leave far less packaging.'), 'ok');
    return;
  }
  BK.tries++;
  if (BK.tries >= 3) {
    BK.pick = [0,0,0,0];
    BK.shown = true;
    bkRender(S('Con esta compra los dos totales quedan dentro de la meta: fruta de temporada, granel, garrafón y una sola entrega.',
               'With this shopping list both totals come under the goal: fruit in season, loose beans, refillable jug and a single delivery.'), 'warn');
    return;
  }
  var msg;
  if (tot.km > g.km) {
    msg = S('Te pasas por ' + fmtN(tot.km - g.km) + ' km. El renglón que más kilómetros suma ahora es <b>' + bkWorst('km') + '</b>.',
            'You are over by ' + fmtN(tot.km - g.km) + ' km. The line adding the most kilometres right now is <b>' + bkWorst('km') + '</b>.');
  } else {
    msg = S('Los kilómetros ya están bien, pero te pasas por ' + (tot.res - g.res) + ' g de envase. El renglón que más envase deja es <b>' + bkWorst('res') + '</b>.',
            'The kilometres are fine now, but you are over by ' + (tot.res - g.res) + ' g of packaging. The line leaving the most packaging is <b>' + bkWorst('res') + '</b>.');
  }
  bkRender(msg, 'warn');
}
function bkNext(){
  if (!BK || BK.done) return;
  BK.round++; BK.tries = 0; BK.shown = false;
  if (BK.round >= BK.goals.length) BK.done = true;
  bkRender();
}

function reflectTab(which, btn){
  ['type','draw'].forEach(function(k){
    var el = document.getElementById('reflect_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var tabs = btn.closest('.wtabs');
  if (tabs) tabs.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){
    var c = document.getElementById('reflectCv');
    if (c && !c.width) initCanvas(c);
  }, 60);
}
function reflectSave(){
  var fb = document.getElementById('reflectFb');
  if (fb) {
    fb.className = 'wmsg ok';
    fb.textContent = S('Guardado. Buen razonamiento: aquí no hay una sola respuesta correcta.',
                       'Saved. Good thinking: there is no single right answer here.');

}

/* ================================================

function buildLesson(rng) {

    '<p>' + S('La sustentabilidad es una manera de producir y de consumir que cubre lo que la gente necesita hoy sin dejar sin recursos a quienes vienen después. No consiste en dejar de usar la naturaleza, sino en usarla al ritmo en que ella se repone.',
              'Sustainability is a way of producing and consuming that covers what people need today without leaving those who come later without resources. It does not consist of ceasing to use nature, but of using it at the rate at which nature replenishes itself.') + '</p>' +

             en:'A community cuts firewood in the woodland it owns and sells it in the village. Which piece of information is needed before saying whether that use is sustainable?' },
      options:{ es:[

        'Cuántas familias del pueblo cocinan con leña y cuántas ya cambiaron a gas.',

             en:'First work out how much is missing each year and then repeat that shortfall over the four years.' },
      explanation:{ es:'Cada año se cortan 1 500 y solo vuelven a crecer 1 200, así que cada año faltan 1 500 − 1 200 = 300 metros cúbicos. En cuatro años: 300 × 4 = 1 200 metros cúbicos de más. Los 4 800 son todo lo que crece en ese tiempo y los 6 000 todo lo que se corta.',

      correct:0,
      hint:{ es:'Averigua primero cuánto falta cada año y después repite ese faltante durante los seis años.',

      explanation:{ es:'El agua es la misma para el riego y para el pueblo, así que hay que ajustar la extracción a lo que la zona repone. Repartir botellas atiende el síntoma y no la causa; perforar más hondo saca todavía más agua del mismo lugar; y cerrar de golpe deja el pilar social por los suelos.',
                    en:'The water is the same for irrigation and for the village, so the extraction has to be adjusted to what the area replaces. Handing out bottles treats the symptom and not the cause; drilling deeper takes even more water from the same place; and closing suddenly knocks the social pillar down.' } },
    { title:{ es:'El taller junto al arroyo', en:'The workshop next to the stream' }, showWork:false,
      stmt:{ es:'Un taller de curtido emplea a treinta personas del barrio y descarga sus residuos en el arroyo donde antes se pescaba. Los vecinos piden una solución y el taller responde que no puede perder a sus clientes. ¿Qué habría que exigirle a una propuesta que quiera resolver esta situación?',
             en:'A tannery employs thirty people from the neighbourhood and discharges its waste into the stream where people used to fish. The neighbours ask for a solution and the workshop replies that it cannot lose its customers. What should be demanded of a proposal that aims to solve this situation?' },
      options:{ es:[
        'Que el taller trate sus residuos antes de descargarlos, con un plazo y un costo que pueda cubrir sin cerrar ni despedir al barrio.',
        'Que el taller siga descargando igual y pague cada año una cantidad de dinero a los vecinos del arroyo.',
        'Que los vecinos dejen de usar el arroyo y traigan el agua que necesitan desde otra parte del municipio.',
        'Que el taller cierre de inmediato, aunque las treinta personas del barrio pierdan su empleo ese mismo día.' ],
        en:[
        'That the workshop treat its waste before discharging it, with a deadline and a cost it can cover without closing or laying off the neighbourhood.',
        'That the workshop keep discharging the same and pay the neighbours by the stream a sum of money every year.',
        'That the neighbours stop using the stream and bring the water they need from another part of the municipality.',
        'That the workshop close immediately, even if the thirty people of the neighbourhood lose their jobs that same day.' ] },
      correct:0,
      hint:{ es:'Una propuesta sirve si atiende a la vez el daño al arroyo y el empleo de quienes trabajan ahí.',
             en:'A proposal works if it deals at the same time with the damage to the stream and with the jobs of those working there.' },
      explanation:{ es:'Tratar los residuos cambia lo que provoca el daño y deja al taller trabajando, que es lo que sostiene el pilar social. Pagar por seguir descargando compra el permiso pero no limpia el arroyo; pedirle al barrio que se aleje traslada el costo a quien no lo generó; y el cierre inmediato resuelve un pilar tirando otro.',
                    en:'Treating the waste changes what causes the damage and leaves the workshop working, which is what holds the social pillar up. Paying to go on discharging buys permission but does not clean the stream; asking the neighbourhood to move away shifts the cost to those who did not cause it; and immediate closure fixes one pillar by knocking down another.' } }
  ], rng), rng);

  /* ── GRADED 9 ───────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'El agua que regresa al taller', en:'The water that returns to the workshop' }, showWork:true,
      stmt:{ es:'Un taller usa 8 000 litros de agua al día. Con un sistema de filtrado recupera 3 de cada 10 litros que usa y los vuelve a meter al proceso. ¿Cuánta agua recupera en 5 días de trabajo?',
             en:'A workshop uses 8 000 litres of water a day. With a filtering system it recovers 3 out of every 10 litres it uses and puts them back into the process. How much water does it recover over 5 working days?' },
      options:{ es:['12 000 litros','2 400 litros','28 000 litros','40 000 litros'],
                en:['12 000 litres','2 400 litres','28 000 litres','40 000 litres'] },
      correct:0,
      hint:{ es:'Obtén primero la parte que se recupera en un día y después repítela en los cinco días.',
             en:'First get the part recovered in one day and then repeat it over the five days.' },
      explanation:{ es:'De cada 10 litros regresan 3, así que en un día se recuperan 8 000 ÷ 10 × 3 = 2 400 litros. En cinco días: 2 400 × 5 = 12 000 litros. Los 28 000 son el agua que no se recupera en esos días y los 40 000 toda la que se usó.',
                    en:'Out of every 10 litres, 3 come back, so in one day 8 000 ÷ 10 × 3 = 2 400 litres are recovered. In five days: 2 400 × 5 = 12 000 litres. The 28 000 is the water not recovered in those days and the 40 000 all the water used.' } },
    { title:{ es:'El agua que regresa a la planta', en:'The water that returns to the plant' }, showWork:true,
      stmt:{ es:'Una planta usa 6 000 litros de agua al día. Con un sistema de filtrado recupera 4 de cada 10 litros que usa y los vuelve a meter al proceso. ¿Cuánta agua recupera en 6 días de trabajo?',
             en:'A plant uses 6 000 litres of water a day. With a filtering system it recovers 4 out of every 10 litres it uses and puts them back into the process. How much water does it recover over 6 working days?' },
      options:{ es:['14 400 litros','2 400 litros','21 600 litros','36 000 litros'],
                en:['14 400 litres','2 400 litres','21 600 litres','36 000 litres'] },
      correct:0,
      hint:{ es:'Obtén primero la parte que se recupera en un día y después repítela en los seis días.',
             en:'First get the part recovered in one day and then repeat it over the six days.' },
      explanation:{ es:'De cada 10 litros regresan 4, así que en un día se recuperan 6 000 ÷ 10 × 4 = 2 400 litros. En seis días: 2 400 × 6 = 14 400 litros. Los 21 600 son el agua que no se recupera en esos días y los 36 000 toda la que se usó.',
                    en:'Out of every 10 litres, 4 come back, so in one day 6 000 ÷ 10 × 4 = 2 400 litres are recovered. In six days: 2 400 × 6 = 14 400 litres. The 21 600 is the water not recovered in those days and the 36 000 all the water used.' } }
  ], rng), rng);

  /* ── GRADED 10 ──────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'La cooperativa de la escuela', en:'The school cooperative' }, showWork:false,
      stmt:{ es:'Una escuela quiere cambiar su cooperativa y recibe cuatro propuestas. ¿Cuál sostiene a la vez el pilar ambiental, el social y el económico?',
             en:'A school wants to change its cooperative and receives four proposals. Which one holds up the environmental, the social and the economic pillar at the same time?' },
      options:{ es:[
        'Vender fruta de temporada comprada a productores de la región, servirla sin envase desechable y destinar la ganancia al huerto escolar.',
        'Cerrar la cooperativa el resto del año, para que dentro de la escuela no se genere ningún residuo.',
        'Comprar siempre el producto más barato aunque venga de muy lejos y servirlo en vasos desechables para atender más rápido.',
        'Cambiar los empaques por otros con etiqueta verde, sin revisar de dónde vienen los productos ni quién los produjo.' ],
        en:[
        'Selling fruit in season bought from producers in the region, serving it without disposable packaging and putting the profit into the school garden.',
        'Closing the cooperative for the rest of the year, so that no waste at all is generated inside the school.',
        'Always buying the cheapest product even if it comes from very far away and serving it in disposable cups to serve faster.',
        'Changing the packaging for one with a green label, without checking where the products come from or who produced them.' ] },
      correct:0,
      hint:{ es:'Revisa cada propuesta con las tres preguntas: qué cambia de verdad, quién carga el costo y si se puede sostener el año que viene.',
             en:'Check each proposal with the three questions: what really changes, who carries the cost and whether it can be kept up next year.' },
      explanation:{ es:'La primera acorta el viaje del producto, evita el desechable, deja el dinero con productores cercanos y reinvierte la ganancia, así que los tres pilares se sostienen. Cerrar quita el servicio y el ingreso, lo más barato de lejos multiplica kilómetros y basura, y la etiqueta sola no cambia el proceso.',
                    en:'The first shortens the journey of the product, avoids the disposable, leaves the money with nearby producers and reinvests the profit, so the three pillars hold up. Closing removes the service and the income, the cheapest from far away multiplies kilometres and rubbish, and the label alone changes nothing in the process.' } },
    { title:{ es:'El mercado del municipio', en:'The municipal market' }, showWork:false,
      stmt:{ es:'El mercado de un municipio quiere reducir la basura que genera cada semana y recibe cuatro propuestas. ¿Cuál sostiene a la vez el pilar ambiental, el social y el económico?',
             en:'The market of a municipality wants to reduce the rubbish it generates each week and receives four proposals. Which one holds up the environmental, the social and the economic pillar at the same time?' },
      options:{ es:[
        'Vender a granel con envases que traiga la clientela, separar lo orgánico y convertirlo en composta que se venda a las huertas cercanas.',
        'Cobrar una multa a cada puesto que genere basura, sin ofrecerle ninguna manera distinta de empacar lo que vende.',
        'Repartir bolsas de plástico más delgadas, para que la misma cantidad de bolsas pese menos en el camión de la basura.',
        'Cerrar los puestos que más basura generan, aunque de ellos vivan varias familias del propio municipio.' ],
        en:[
        'Selling loose into containers brought by the customers, separating the organic waste and turning it into compost sold to nearby plots.',
        'Charging a fine to every stall that generates rubbish, without offering it any different way of packing what it sells.',
        'Handing out thinner plastic bags, so that the same number of bags weighs less in the rubbish truck.',
        'Closing the stalls that generate the most rubbish, even though several families of the municipality live off them.' ] },
      correct:0,
      hint:{ es:'Revisa cada propuesta con las tres preguntas: qué cambia de verdad, quién carga el costo y si se puede sostener el año que viene.',
             en:'Check each proposal with the three questions: what really changes, who carries the cost and whether it can be kept up next year.' },
      explanation:{ es:'La primera evita el envase desde el principio, aprovecha lo orgánico y hasta genera un ingreso con la composta. La multa carga el costo al puesto sin darle salida, las bolsas delgadas siguen siendo la misma cantidad de bolsas y cerrar puestos derriba el pilar social.',
                    en:'The first avoids the packaging from the start, makes use of the organic waste and even generates income with the compost. The fine loads the cost onto the stall without giving it a way out, thinner bags are still the same number of bags and closing stalls knocks down the social pillar.' } }
  ], rng), rng);
}
