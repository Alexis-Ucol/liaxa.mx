      es: 'Un campo eléctrico que cambia crea un campo magnético, y un campo magnético que cambia crea un campo eléctrico. Si las cargas de una antena se sacuden muy rápido, esos dos campos se van creando uno al otro sin parar y terminan por desprenderse del cable y viajar solos por el espacio. Eso es una onda electromagnética, y la luz que ves es exactamente eso.',
      en: 'A changing electric field creates a magnetic field, and a changing magnetic field creates an electric field. If the charges of an antenna are shaken very fast, those two fields keep creating each other without stopping and end up breaking away from the wire and travelling alone through space. That is an electromagnetic wave, and the light you see is exactly that.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Como no necesitan materia para avanzar, estas ondas cruzan el vacío, y todas lo hacen a la misma velocidad: 300 000 km cada segundo. Lo que las distingue es su frecuencia, es decir cuántas oscilaciones completan por segundo, y su longitud de onda, es decir cuánto mide cada oscilación. Las dos van al revés una de la otra: más frecuencia significa onda más corta. Ordenadas de onda más larga a más corta aparecen las ondas de radio, las microondas, el infrarrojo, la estrecha franja de luz visible, el ultravioleta y los rayos X.',
      en: 'Since they need no matter to advance, these waves cross vacuum, and all of them do it at the same speed: 300 000 km each second. What tells them apart is their frequency, that is how many oscillations they complete per second, and their wavelength, that is how long each oscillation is. The two run opposite to each other: more frequency means a shorter wave. Ordered from longest to shortest wave come radio waves, microwaves, infrared, the narrow strip of visible light, ultraviolet and X rays.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'La familia completa está revuelta abajo. Acomódala de la onda más larga a la más corta tocando dos tarjetas para intercambiarlas; puedes reacomodarlas cuantas veces quieras antes de comprobar.',
      en: 'The whole family is scrambled below. Put it in order from the longest wave to the shortest by tapping two cards to swap them; you can rearrange them as many times as you like before checking.'
    }) + '</p></div>'
  );
  wEspectro(rng);
  addProb(mkP7(rng), rng);
  addProb(mkP8(rng), rng);

  /* ══ CONCEPTO 5 ══ */
  sec(
    L({ es: 'Concepto 5', en: 'Concept 5' }),
    L({ es: 'Aparatos que hablan con ondas', en: 'Devices that talk with waves' }),
    '<p>' + L({
      es: 'Un aparato de comunicación siempre hace lo mismo en dos tiempos. Primero convierte la información en una corriente que sube y baja con cierto ritmo y la manda a una antena, donde esa corriente lanza una onda electromagnética. Después, a kilómetros de distancia, la onda llega a otra antena, sacude las cargas de ese metal y produce en ella una corriente débil con el mismo ritmo, que el aparato receptor traduce de vuelta en sonido, imagen o texto.',
      en: 'A communication device always does the same thing in two steps. First it turns the information into a current that rises and falls with a certain rhythm and sends it to an antenna, where that current launches an electromagnetic wave. Then, kilometres away, the wave reaches another antenna, shakes the charges of that metal and produces in it a weak current with the same rhythm, which the receiving device turns back into sound, image or text.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Cada servicio tiene asignada su propia frecuencia para no estorbarse: la radio FM ronda los cien millones de oscilaciones por segundo, el teléfono y el wifi trabajan con microondas de frecuencia mucho más alta, y un satélite retransmite hacia una zona enorme desde muy arriba. Como la frecuencia y el tamaño de la onda van al revés, la antena de una radio mide varios metros y la de un teléfono cabe escondida en su carcasa.',
      en: 'Each service is given its own frequency so they do not get in each other way: FM radio is around one hundred million oscillations per second, phones and wifi work with microwaves of much higher frequency, and a satellite relays to a huge area from very high up. Since frequency and wave size run opposite to each other, a radio antenna is several metres long and a phone antenna fits hidden inside its case.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'El dial de abajo mueve la frecuencia y dibuja la onda que sale de la antena. Consigue las ondas que se te piden y observa qué le pasa al dibujo cada vez que subes de frecuencia.',
      en: 'The dial below moves the frequency and draws the wave leaving the antenna. Reach the waves you are asked for and watch what happens to the drawing every time you raise the frequency.'
    }) + '</p></div>'
  );
  wDial(rng);
  addProb(mkP9(rng), rng);

  /* ══ CIERRE ══ */
  sec(
    L({ es: 'Cierre', en: 'Closing' }),
    L({ es: 'Todo junto', en: 'Everything together' }),
    '<p>' + L({
      es: 'Lo que sigue reúne el imán, la bobina y la antena en una sola situación.',
      en: 'What comes next brings the magnet, the coil and the antenna together in a single situation.'
    }) + '</p>'
  );
  addProb(mkP10(rng), rng);
}

/* ══ MANIPULATIVO 1 · BRÚJULA ALREDEDOR DEL IMÁN ═══════════════════════════
   El alumno coloca una brújula en un punto y predice hacia dónde apunta su
   punta roja. La aguja del dibujo gira en vivo con la dirección elegida, así
   que puede corregir cuantas veces quiera. Tres rondas, con el imán girado al
   azar, pistas direccionales y revelado al tercer intento fallido.
   ═══════════════════════════════════════════════════════════════════════════ */
function wBrujula(rng){
  var host = iw('brujula', 'wBrujula');
  var POS = [
    { es: 'frente al extremo derecho del imán', en: 'facing the right end of the magnet', dx: 1.5, dy: 0, base: 'der' },
    { es: 'frente al extremo izquierdo del imán', en: 'facing the left end of the magnet', dx: -1.5, dy: 0, base: 'der' },
    { es: 'justo encima del centro del imán', en: 'right above the centre of the magnet', dx: 0, dy: -1, base: 'izq' },
    { es: 'justo debajo del centro del imán', en: 'right below the centre of the magnet', dx: 0, dy: 1, base: 'izq' }
  ];
  var ORD = shuffle([0, 1, 2, 3], rng).slice(0, 3);
  var FLIP = [rng() < 0.5, rng() < 0.5, rng() < 0.5];
  var st = { r: 0, tries: 0, sel: null, done: false };
  function P(){ return POS[ORD[Math.min(st.r, ORD.length - 1)]]; }
  function flip(){ return FLIP[Math.min(st.r, FLIP.length - 1)]; }
  function answer(){ var b = P().base; return flip() ? (b === 'der' ? 'izq' : 'der') : b; }
  function dirTxt(d){
    return d === 'der' ? L({ es: 'a la derecha', en: 'to the right' })
         : d === 'izq' ? L({ es: 'a la izquierda', en: 'to the left' })
         : d === 'arr' ? L({ es: 'hacia arriba', en: 'upwards' })
                       : L({ es: 'hacia abajo', en: 'downwards' });
  }
  var DIRS = [['izq', '←'], ['der', '→'], ['arr', '↑'], ['aba', '↓']];

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Mesa de brújulas', en: 'Compass table' }) + '</div>' +
    '<div class="iw-task" id="wBruTask"></div>' +
    '<div class="iw-cv"><canvas id="wBruCv"></canvas></div>' +
    '<div class="optrow">' + DIRS.map(function(d){
      return '<button class="optbtn" id="wBru_' + d[0] + '" onclick="wBruPick(\'' + d[0] + '\')">' + d[1] + ' ' + dirTxt(d[0]) + '</button>';
    }).join('') + '</div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Ronda', en: 'Round' }) + '</div><div class="ro-v" id="wBruR"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Polo derecho', en: 'Right end' }) + '</div><div class="ro-v" id="wBruPol"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Tu aguja', en: 'Your needle' }) + '</div><div class="ro-v" id="wBruSel"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wBruCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wBruFb"></div>';

  function draw(){
    var cv = document.getElementById('wBruCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 200;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var mid = W / 2, cy = H / 2, mw = Math.min(150, W * 0.42), mh = 34;
    c.strokeStyle = CV('--border'); c.lineWidth = 1.5;
    [1.5, 2.1].forEach(function(k){
      c.beginPath(); c.ellipse(mid, cy, mw * 0.5 * k, mh * k * 0.95, 0, 0, Math.PI * 2); c.stroke();
    });
    var rightIsN = !flip();
    c.fillStyle = rightIsN ? CV('--neg') : CV('--pos');
    c.fillRect(mid - mw / 2, cy - mh / 2, mw / 2, mh);
    c.fillStyle = rightIsN ? CV('--pos') : CV('--neg');
    c.fillRect(mid, cy - mh / 2, mw / 2, mh);
    c.strokeStyle = CV('--border'); c.lineWidth = 2;
    c.strokeRect(mid - mw / 2, cy - mh / 2, mw, mh);
    c.fillStyle = CV('--surface'); c.font = 'bold 17px IBM Plex Sans, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(rightIsN ? 'S' : 'N', mid - mw / 4, cy + 1);
    c.fillText(rightIsN ? 'N' : 'S', mid + mw / 4, cy + 1);
    var p = P();
    var bx = mid + p.dx * (mw * 0.5 + 34), by = cy + p.dy * 58, br = 22;
    c.beginPath(); c.arc(bx, by, br, 0, Math.PI * 2);
    c.fillStyle = CV('--surface2'); c.fill();
    c.strokeStyle = CV('--green'); c.lineWidth = 2.5; c.stroke();
    if (st.sel === null) {
      c.fillStyle = CV('--text3'); c.font = 'bold 18px IBM Plex Sans, sans-serif';
      c.fillText('?', bx, by + 1);
    } else {
      var ang = st.sel === 'der' ? 0 : st.sel === 'izq' ? Math.PI : st.sel === 'arr' ? -Math.PI / 2 : Math.PI / 2;
      var ex = bx + Math.cos(ang) * (br - 5), ey = by + Math.sin(ang) * (br - 5);
      var sx = bx - Math.cos(ang) * (br - 5), sy = by - Math.sin(ang) * (br - 5);
      c.strokeStyle = CV('--text3'); c.lineWidth = 4;
      c.beginPath(); c.moveTo(sx, sy); c.lineTo(bx, by); c.stroke();
      c.strokeStyle = CV('--pos'); c.lineWidth = 4;
      c.beginPath(); c.moveTo(bx, by); c.lineTo(ex, ey); c.stroke();
      c.fillStyle = CV('--pos');
      c.beginPath();
      c.arc(ex, ey, 3.5, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = CV('--text2'); c.font = '12px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'punta roja = norte de la aguja', en: 'red tip = north of the needle' }), 12, 16);
  }
  function paint(){
    document.getElementById('wBruR').textContent = st.done ? L({ es: 'libre', en: 'free' }) : ((st.r + 1) + ' / 3');
    document.getElementById('wBruPol').textContent = flip() ? L({ es: 'sur', en: 'south' }) : L({ es: 'norte', en: 'north' });
    document.getElementById('wBruSel').textContent = st.sel === null ? '?' : dirTxt(st.sel);
    DIRS.forEach(function(d){
      var b = document.getElementById('wBru_' + d[0]);
      if (b) b.classList.toggle('on', st.sel === d[0]);
    });
    document.getElementById('wBruTask').textContent = st.done
      ? L({ es: 'Mesa libre: cambia la dirección de la aguja y compara con las líneas dibujadas alrededor del imán.',
            en: 'Free table: change the direction of the needle and compare it with the lines drawn around the magnet.' })
      : L({ es: 'Ronda ' + (st.r + 1) + ' de 3: la brújula está ' + P().es + '. Elige hacia dónde apuntará su punta roja.',
            en: 'Round ' + (st.r + 1) + ' of 3: the compass is ' + P().en + '. Choose where its red tip will point.' });
    draw();
  }
  window.wBruPick = function(d){ st.sel = d; paint(); };
  window.wBruCheck = function(){
    var fb = document.getElementById('wBruFb');
    if (st.lock) return;
    if (st.done) { fb.textContent = L({ es: 'Aguja apuntando ' + dirTxt(st.sel || 'der') + '.', en: 'Needle pointing ' + dirTxt(st.sel || 'der') + '.' }); return; }
    if (st.sel === null) {
      fb.textContent = L({ es: 'Elige primero una dirección para la aguja.', en: 'Choose a direction for the needle first.' });
      return;
    }
    var ok = (st.sel === answer());
    if (ok) {
      st.r++; st.tries = 0; st.sel = null;
      if (st.r >= ORD.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Las tres rondas resueltas. Ya sabes leer el campo punto por punto.', en: 'All three rounds solved. You can now read the field point by point.' })
        : L({ es: 'Correcto: la aguja se acomoda con la línea de campo que pasa por ese punto. Va la siguiente.', en: 'Correct: the needle settles along the field line passing through that point. Here comes the next one.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.sel = answer(); st.tries = 0; st.lock = true;
      paint();
      fb.textContent = L({ es: 'Ahí la aguja apunta ' + dirTxt(answer()) + '. Fuera del imán las líneas salen por el polo norte y regresan por el polo sur, y la punta roja sigue esa línea.',
                           en: 'There the needle points ' + dirTxt(answer()) + '. Outside the magnet the lines leave through the north pole and return through the south pole, and the red tip follows that line.' });
      setTimeout(function(){
        st.r++; st.sel = null; st.lock = false;
        if (st.r >= ORD.length) st.done = true;
        paint();
      }, 2200);
      return;
    }
    if (st.sel === 'arr' || st.sel === 'aba') {
      fb.textContent = L({ es: 'En ese punto la línea de campo corre horizontal, no sube ni baja: elige entre izquierda y derecha.',
                           en: 'At that point the field line runs horizontal, it neither rises nor falls: choose between left and right.' });
      return;
    }
    fb.textContent = (P().dy === 0)
      ? L({ es: 'Estás sobre la línea que une los dos polos. Recorre esa línea por fuera del imán: sale por el norte y entra por el sur. ¿Hacia qué lado va aquí?',
            en: 'You are on the line joining the two poles. Follow that line outside the magnet: it leaves through the north and enters through the south. Which way does it go here?' })
      : L({ es: 'Por encima y por debajo del imán, la línea de campo hace el viaje de regreso del norte al sur, en sentido contrario al que llevaría dentro. Prueba con el otro lado.',
            en: 'Above and below the magnet, the field line makes the return trip from north to south, opposite to the way it would run inside. Try the other side.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 2 · CONSTRUCTOR DE ELECTROIMÁN ═══════════════════════════
   Vueltas, corriente y núcleo se ajustan en vivo; el dibujo del clavo y los
   clips responde a cada movimiento. Tres metas de clips, pista direccional y
   revelado con una combinación válida al tercer fallo.
   ═══════════════════════════════════════════════════════════════════════════ */
function wElectroiman(rng){
  var host = iw('electroiman', 'wElectroiman');
  var METAS = shuffle([6, 8, 9, 12], rng).slice(0, 3);
  var st = { v: 20, i: 1, nuc: 'aire', r: 0, tries: 0, done: false };
  function factor(){ return st.nuc === 'hierro' ? 4 : 1; }
  function clips(){ return Math.floor(st.v * st.i * factor() / 40); }
  function meta(){ return METAS[Math.min(st.r, METAS.length - 1)]; }
  function solve(target){
    for (var i = 1; i <= 4; i++) for (var v = 10; v <= 60; v += 10) {
      if (Math.floor(v * i * 4 / 40) === target) return { v: v, i: i };
    }
    return { v: 60, i: 4 };
  }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Taller de electroimanes', en: 'Electromagnet workshop' }) + '</div>' +
    '<div class="iw-task" id="wEleTask"></div>' +
    '<div class="iw-cv"><canvas id="wEleCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Vueltas de alambre', en: 'Turns of wire' }) + ': <b id="wEleVL"></b></label>' +
      '<input type="range" id="wEleV" min="10" max="60" step="10" value="20" oninput="wEleIn()"></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Corriente', en: 'Current' }) + ': <b id="wEleIL"></b> A</label>' +
      '<input type="range" id="wEleI" min="1" max="4" step="1" value="1" oninput="wEleIn()"></div>' +
    '<div class="sgnrow"><span class="sgnlbl">' + L({ es: 'Núcleo', en: 'Core' }) + '</span>' +
      '<button class="sgnbtn" id="wEleNa" onclick="wEleNuc(\'aire\')">' + L({ es: 'aire', en: 'air' }) + '</button>' +
      '<button class="sgnbtn" id="wEleNh" onclick="wEleNuc(\'hierro\')">' + L({ es: 'hierro', en: 'iron' }) + '</button></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Clips levantados', en: 'Clips lifted' }) + '</div><div class="ro-v" id="wEleC"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Meta', en: 'Target' }) + '</div><div class="ro-v" id="wEleT"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Ronda', en: 'Round' }) + '</div><div class="ro-v" id="wEleR"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wEleCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wEleFb"></div>';

  function draw(){
    var cv = document.getElementById('wEleCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 200;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var x0 = 30, x1 = W - 30, cy = 66, nh = 26;
    c.fillStyle = st.nuc === 'hierro' ? CV('--wire') : CV('--surface2');
    c.fillRect(x0, cy - nh / 2, x1 - x0, nh);
    c.strokeStyle = CV('--border'); c.lineWidth = 2;
    c.strokeRect(x0, cy - nh / 2, x1 - x0, nh);
    c.fillStyle = CV('--text2'); c.font = '11px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillText(st.nuc === 'hierro' ? L({ es: 'clavo de hierro', en: 'iron nail' }) : L({ es: 'aire', en: 'air' }), (x0 + x1) / 2, cy + 34);
    var n = st.v / 10, span = (x1 - x0) - 24, step = span / (n + 1);
    c.strokeStyle = CV('--pos'); c.lineWidth = 1 + st.i * 0.9;
    for (var k = 1; k <= n; k++) {
      var xx = x0 + 12 + step * k;
      c.beginPath(); c.ellipse(xx, cy, 7, nh / 2 + 9, 0, 0, Math.PI * 2); c.stroke();
    }
    var cl = clips(), maxShow = Math.min(cl, 14);
    c.fillStyle = CV('--wire');
    for (var j = 0; j < maxShow; j++) {
      var px = x0 + 16 + (j % 7) * ((x1 - x0 - 32) / 7);
      var py = 122 + Math.floor(j / 7) * 26;
      c.fillRect(px, py, 24, 8);
      c.fillRect(px + 3, py + 10, 18, 5);
    }
    c.fillStyle = CV('--text2'); c.font = '12px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'clips levantados: ', en: 'clips lifted: ' }) + cl, 12, 190);
  }
  function paint(){
    document.getElementById('wEleVL').textContent = st.v;
    document.getElementById('wEleIL').textContent = st.i;
    document.getElementById('wEleC').textContent = clips();
    document.getElementById('wEleT').textContent = st.done ? L({ es: 'libre', en: 'free' }) : meta();
    document.getElementById('wEleR').textContent = st.done ? '3 / 3' : ((st.r + 1) + ' / 3');
    document.getElementById('wEleNa').classList.toggle('on', st.nuc === 'aire');
    document.getElementById('wEleNh').classList.toggle('on', st.nuc === 'hierro');
    document.getElementById('wEleTask').textContent = st.done
      ? L({ es: 'Taller libre: mueve vueltas, corriente y núcleo y observa cuántos clips levanta cada combinación.',
            en: 'Free workshop: move turns, current and core and watch how many clips each combination lifts.' })
      : L({ es: 'Reto ' + (st.r + 1) + ' de 3: ajusta el electroimán para levantar exactamente ' + meta() + ' clips.',
            en: 'Challenge ' + (st.r + 1) + ' of 3: tune the electromagnet to lift exactly ' + meta() + ' clips.' });
    draw();
  }
  window.wEleIn = function(){
    st.v = parseInt(document.getElementById('wEleV').value, 10);
    st.i = parseInt(document.getElementById('wEleI').value, 10);
    paint();
  };
  window.wEleNuc = function(n){ st.nuc = n; paint(); };
  window.wEleCheck = function(){
    var fb = document.getElementById('wEleFb');
    if (st.lock) return;
    if (st.done) { fb.textContent = L({ es: 'Con esta combinación levantas ' + clips() + ' clips.', en: 'With this combination you lift ' + clips() + ' clips.' }); return; }
    var cl = clips(), m = meta();
    if (cl === m) {
      st.r++; st.tries = 0;
      if (st.r >= METAS.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres retos resueltos. Vueltas, corriente y núcleo ya están en tus manos.', en: 'All three challenges solved. Turns, current and core are now in your hands.' })
        : L({ es: 'Exacto, esa combinación levanta justo los clips pedidos. Prueba a llegar al mismo número por otro camino en el siguiente reto.', en: 'Exactly, that combination lifts just the clips asked for. Try reaching the same number another way in the next challenge.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      var s = solve(m);
      st.v = s.v; st.i = s.i; st.nuc = 'hierro'; st.tries = 0; st.lock = true;
      document.getElementById('wEleV').value = st.v;
      document.getElementById('wEleI').value = st.i;
      paint();
      fb.textContent = L({ es: 'Una combinación que sirve: ' + s.v + ' vueltas, ' + s.i + ' A y núcleo de hierro. Con el hierro dentro, los clips levantados salen de multiplicar las decenas de vueltas por los amperes.',
                           en: 'One combination that works: ' + s.v + ' turns, ' + s.i + ' A and an iron core. With iron inside, the clips lifted come from multiplying the tens of turns by the amperes.' });
      setTimeout(function(){
        st.r++; st.lock = false;
        if (st.r >= METAS.length) st.done = true;
        paint();
      }, 2200);
      return;
    }
    if (st.nuc === 'aire' && cl < m) {
      fb.textContent = L({ es: 'Con aire dentro de la bobina el efecto se queda corto: levantas ' + cl + ' y se piden ' + m + '. Prueba a poner un clavo de hierro en el centro.',
                           en: 'With air inside the coil the effect falls short: you lift ' + cl + ' and ' + m + ' are asked for. Try putting an iron nail in the centre.' });
      return;
    }
    fb.textContent = (cl < m)
      ? L({ es: 'Levantas ' + cl + ' clips y la meta es ' + m + ': te falta fuerza, sube la corriente o agrega vueltas.',
            en: 'You lift ' + cl + ' clips and the target is ' + m + ': you need more force, raise the current or add turns.' })
      : L({ es: 'Levantas ' + cl + ' clips y la meta es ' + m + ': te pasaste, baja la corriente o quita vueltas.',
            en: 'You lift ' + cl + ' clips and the target is ' + m + ': you overshot, lower the current or take off turns.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 3 · GENERADOR DE INDUCCIÓN ═══════════════════════════════
   El alumno decide si el imán entra, sale o se queda quieto y con qué rapidez.
   La aguja del medidor se mueve en vivo. Tres lecturas por conseguir, con
   pista direccional y revelado al tercer fallo.
   ═══════════════════════════════════════════════════════════════════════════ */
function wInduccion(rng){
  var host = iw('induccion', 'wInduccion');
  var VALS = shuffle([2, 3, 4, 5], rng);
  var RETOS = shuffle([
    { lado: 'der', val: VALS[0] },
    { lado: 'izq', val: VALS[1] },
    { lado: 'cero', val: 0 }
  ], rng);
  var st = { acc: 'quieto', vel: 3, r: 0, tries: 0, done: false };
  function lectura(){ return st.acc === 'quieto' ? 0 : st.vel; }
  function lado(){ return st.acc === 'dentro' ? 'der' : st.acc === 'fuera' ? 'izq' : 'cero'; }
  function reto(){ return RETOS[Math.min(st.r, RETOS.length - 1)]; }
  function ladoTxt(l){
    return l === 'der' ? L({ es: 'derecha', en: 'right' })
         : l === 'izq' ? L({ es: 'izquierda', en: 'left' })
                       : L({ es: 'sin desvío', en: 'no deflection' });
  }
  function retoTxt(){
    var r = reto();
    return r.lado === 'cero'
      ? L({ es: 'aguja en cero, con el imán todavía dentro de la bobina', en: 'needle at zero, with the magnet still inside the coil' })
      : L({ es: 'desvío de ' + r.val + ' hacia la ' + ladoTxt(r.lado), en: 'deflection of ' + r.val + ' to the ' + ladoTxt(r.lado) });
  }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Generador de bolsillo', en: 'Pocket generator' }) + '</div>' +
    '<div class="iw-task" id="wIndTask"></div>' +
    '<div class="iw-cv"><canvas id="wIndCv"></canvas></div>' +
    '<div class="sgnrow"><span class="sgnlbl">' + L({ es: 'Movimiento', en: 'Motion' }) + '</span>' +
      '<button class="sgnbtn" id="wInd_dentro" onclick="wIndAcc(\'dentro\')">' + L({ es: 'entra', en: 'in' }) + '</button>' +
      '<button class="sgnbtn" id="wInd_quieto" onclick="wIndAcc(\'quieto\')">' + L({ es: 'quieto', en: 'still' }) + '</button>' +
      '<button class="sgnbtn" id="wInd_fuera" onclick="wIndAcc(\'fuera\')">' + L({ es: 'sale', en: 'out' }) + '</button></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Rapidez del movimiento', en: 'Speed of the motion' }) + ': <b id="wIndVL"></b></label>' +
      '<input type="range" id="wIndV" min="1" max="5" step="1" value="3" oninput="wIndIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Lectura', en: 'Reading' }) + '</div><div class="ro-v" id="wIndL"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Lado', en: 'Side' }) + '</div><div class="ro-v" id="wIndS"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Ronda', en: 'Round' }) + '</div><div class="ro-v" id="wIndR"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wIndCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wIndFb"></div>';

  function draw(){
    var cv = document.getElementById('wIndCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 210;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var cy = 62, cxo = W * 0.6;
    c.strokeStyle = CV('--pos'); c.lineWidth = 2.5;
    for (var k = 0; k < 5; k++) {
      c.beginPath(); c.ellipse(cxo - 34 + k * 17, cy, 8, 30, 0, 0, Math.PI * 2); c.stroke();
    }
    var off = st.acc === 'dentro' ? -6 : st.acc === 'fuera' ? -78 : -40;
    var mx = cxo + off, mw = 74, mh = 20;
    c.fillStyle = CV('--neg'); c.fillRect(mx - mw / 2, cy - mh / 2, mw / 2, mh);
    c.fillStyle = CV('--pos'); c.fillRect(mx, cy - mh / 2, mw / 2, mh);
    c.strokeStyle = CV('--border'); c.lineWidth = 1.5;
    c.strokeRect(mx - mw / 2, cy - mh / 2, mw, mh);
    if (st.acc !== 'quieto') {
      var dir = st.acc === 'dentro' ? 1 : -1;
      c.strokeStyle = CV('--gold'); c.fillStyle = CV('--gold'); c.lineWidth = 3;
      var ax = mx + dir * (mw / 2 + 8), ax2 = ax + dir * (10 + st.vel * 5);
      c.beginPath(); c.moveTo(ax, cy - 34); c.lineTo(ax2, cy - 34); c.stroke();
      c.beginPath(); c.moveTo(ax2 + dir * 7, cy - 34); c.lineTo(ax2, cy - 39); c.lineTo(ax2, cy - 29); c.closePath(); c.fill();
    }
    var gx = W * 0.22, gy = 168, gr = 52;
    c.strokeStyle = CV('--border'); c.lineWidth = 2;
    c.beginPath(); c.arc(gx, gy, gr, Math.PI, 0); c.stroke();
    c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx, gy - gr); c.setLineDash([4, 4]); c.stroke(); c.setLineDash([]);
    var sgn = lado() === 'der' ? 1 : lado() === 'izq' ? -1 : 0;
    var ang = -Math.PI / 2 + sgn * (lectura() / 5) * (Math.PI / 2.4);
    c.strokeStyle = CV('--green'); c.lineWidth = 3.5;
    c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx + Math.cos(ang) * (gr - 6), gy + Math.sin(ang) * (gr - 6)); c.stroke();
    c.fillStyle = CV('--text2'); c.font = '11px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillText(L({ es: 'medidor', en: 'meter' }), gx, gy + 16);
    c.textAlign = 'left';
    c.fillText(L({ es: 'bobina y medidor conectados', en: 'coil and meter connected' }), 12, 16);
  }
  function paint(){
    document.getElementById('wIndVL').textContent = st.vel;
    document.getElementById('wIndL').textContent = lectura();
    document.getElementById('wIndS').textContent = ladoTxt(lado());
    document.getElementById('wIndR').textContent = st.done ? '3 / 3' : ((st.r + 1) + ' / 3');
    ['dentro', 'quieto', 'fuera'].forEach(function(a){
      var b = document.getElementById('wInd_' + a);
      if (b) b.classList.toggle('on', st.acc === a);
    });
    document.getElementById('wIndTask').textContent = st.done
      ? L({ es: 'Generador libre: prueba entradas y salidas a distintas rapideces y observa la aguja.',
            en: 'Free generator: try going in and out at different speeds and watch the needle.' })
      : L({ es: 'Ronda ' + (st.r + 1) + ' de 3: consigue ' + retoTxt() + '.',
            en: 'Round ' + (st.r + 1) + ' of 3: get ' + retoTxt() + '.' });
    draw();
  }
  window.wIndAcc = function(a){ st.acc = a; paint(); };
  window.wIndIn = function(){ st.vel = parseInt(document.getElementById('wIndV').value, 10); paint(); };
  window.wIndCheck = function(){
    var fb = document.getElementById('wIndFb');
    if (st.lock) return;
    if (st.done) { fb.textContent = L({ es: 'Lectura actual: ' + lectura() + ' hacia la ' + ladoTxt(lado()) + '.', en: 'Current reading: ' + lectura() + ' to the ' + ladoTxt(lado()) + '.' }); return; }
    var r = reto();
    var ok = (r.lado === 'cero') ? (lectura() === 0) : (lado() === r.lado && lectura() === r.val);
    if (ok) {
      st.r++; st.tries = 0;
      if (st.r >= RETOS.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Tres rondas resueltas. El sentido lo pone el movimiento y el tamaño lo pone la rapidez.', en: 'Three rounds solved. The direction comes from the motion and the size from the speed.' })
        : L({ es: 'Correcto. Fíjate en qué tuviste que cambiar para lograrlo y pasa al siguiente reto.', en: 'Correct. Notice what you had to change to get it and move to the next challenge.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      if (r.lado === 'cero') { st.acc = 'quieto'; }
      else { st.acc = (r.lado === 'der') ? 'dentro' : 'fuera'; st.vel = r.val; document.getElementById('wIndV').value = r.val; }
      st.tries = 0; st.lock = true;
      var msg = (r.lado === 'cero')
        ? L({ es: 'Así queda: con el imán detenido dentro de la bobina no hay cambio y la aguja marca cero, aunque el imán siga ahí.',
              en: 'This is how it looks: with the magnet at rest inside the coil there is no change and the needle reads zero, even though the magnet is still there.' })
        : L({ es: 'Así queda: el imán ' + (r.lado === 'der' ? L({ es: 'entrando', en: 'going in' }) : L({ es: 'saliendo', en: 'coming out' })) + ' manda la aguja a la ' + ladoTxt(r.lado) + ', y la rapidez ' + r.val + ' fija el tamaño del desvío.',
              en: 'This is how it looks: the magnet ' + (r.lado === 'der' ? 'going in' : 'coming out') + ' sends the needle to the ' + ladoTxt(r.lado) + ', and speed ' + r.val + ' sets the size of the deflection.' });
      paint();
      fb.textContent = msg;
      setTimeout(function(){
        st.r++; st.lock = false;
        if (st.r >= RETOS.length) st.done = true;
        paint();
      }, 2200);
      return;
    }
    if (r.lado === 'cero') {
      fb.textContent = L({ es: 'La aguja marca ' + lectura() + '. Para dejarla en cero sin retirar el imán, deja de moverlo: lo que genera corriente es el cambio.',
                           en: 'The needle reads ' + lectura() + '. To leave it at zero without removing the magnet, stop moving it: what generates current is change.' });
      return;
    }
    if (lado() !== r.lado) {
      fb.textContent = L({ es: 'La aguja cae hacia la ' + ladoTxt(lado()) + ' y se pide hacia la ' + ladoTxt(r.lado) + ': invierte el sentido del movimiento del imán.',
                           en: 'The needle falls to the ' + ladoTxt(lado()) + ' and the ' + ladoTxt(r.lado) + ' is asked for: reverse the direction the magnet moves.' });
      return;
    }
    fb.textContent = (lectura() < r.val)
      ? L({ es: 'Buen lado, pero marcas ' + lectura() + ' y se piden ' + r.val + ': mueve el imán más rápido.',
            en: 'Right side, but you read ' + lectura() + ' and ' + r.val + ' is asked for: move the magnet faster.' })
      : L({ es: 'Buen lado, pero marcas ' + lectura() + ' y se piden ' + r.val + ': mueve el imán más despacio.',
            en: 'Right side, but you read ' + lectura() + ' and ' + r.val + ' is asked for: move the magnet more slowly.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 4 · ORDENAR EL ESPECTRO ══════════════════════════════════
   Seis tarjetas revueltas que el alumno acomoda de onda más larga a más corta
   tocando dos para intercambiarlas. Reordenable cuantas veces quiera, pista
   sobre la primera tarjeta fuera de lugar y revelado al tercer intento.
   ═══════════════════════════════════════════════════════════════════════════ */
function wEspectro(rng){
  var host = iw('espectro', 'wEspectro');
  var BANDAS = [
    { es: 'Ondas de radio', en: 'Radio waves' },
    { es: 'Microondas', en: 'Microwaves' },
    { es: 'Infrarrojo', en: 'Infrared' },
    { es: 'Luz visible', en: 'Visible light' },
    { es: 'Ultravioleta', en: 'Ultraviolet' },
    { es: 'Rayos X', en: 'X rays' }
  ];
  var ord = shuffle([0, 1, 2, 3, 4, 5], rng);
  if (ord.every(function(e, i){ return e === i; })) { var tmp = ord[0]; ord[0] = ord[5]; ord[5] = tmp; }
  var st = { ord: ord, sel: null, tries: 0, done: false };

  function render(){
    var chips = st.ord.map(function(ei, pos){
      var cls = 'tl-chip' + (st.sel === pos ? ' sel' : '') + (st.done ? ' locked' : '');
      return '<div class="' + cls + '" onclick="wEspTap(' + pos + ')"><span class="tl-num">' + (pos + 1) + '</span> ' + BANDAS[ei][LANG] + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="iw-tag">' + L({ es: 'La familia de las ondas', en: 'The family of waves' }) + '</div>' +
      '<div class="iw-task">' + L({ es: 'Acomoda las seis de la onda más larga a la más corta. Toca dos tarjetas para intercambiarlas.',
                                    en: 'Arrange the six from the longest wave to the shortest. Tap two cards to swap them.' }) + '</div>' +
      '<div class="tl-list">' + chips + '</div>' +
      '<button class="rverify-btn" onclick="wEspCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
      '<div class="rfb" id="wEspFb"></div>';
  }
  window.wEspTap = function(pos){
    if (st.done) return;
    if (st.sel === null) st.sel = pos;
    else if (st.sel === pos) st.sel = null;
    else { var t = st.ord[st.sel]; st.ord[st.sel] = st.ord[pos]; st.ord[pos] = t; st.sel = null; }
    render();
  };
  window.wEspCheck = function(){
    var ok = st.ord.every(function(ei, pos){ return ei === pos; });
    if (ok) {
      st.done = true; render();
      document.getElementById('wEspFb').innerHTML = '<span class="okfb">🎉 ' +
        L({ es: 'Orden correcto. De arriba abajo la onda se acorta y la frecuencia sube; la luz que ves ocupa apenas una franja en medio.',
            en: 'Correct order. From top to bottom the wave gets shorter and the frequency rises; the light you see takes up barely a strip in the middle.' }) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.ord = [0, 1, 2, 3, 4, 5]; st.done = true; render();
      document.getElementById('wEspFb').textContent =
        L({ es: 'Este es el orden correcto. Las de arriba miden metros y oscilan pocas veces por segundo; las de abajo miden menos que un átomo y oscilan muchísimas veces por segundo.',
            en: 'This is the correct order. The ones at the top measure metres and oscillate few times per second; the ones at the bottom measure less than an atom and oscillate a great many times per second.' });
      return;
    }
    var firstBad = 0;
    for (var i = 0; i < st.ord.length; i++) { if (st.ord[i] !== i) { firstBad = i; break; } }
    render();
    document.getElementById('wEspFb').textContent =
      L({ es: 'Aún no. Revisa la tarjeta número ' + (firstBad + 1) + ': ¿su onda es más larga o más corta que la de arriba?',
          en: 'Not yet. Look at card number ' + (firstBad + 1) + ': is its wave longer or shorter than the one above?' });
  };
  render();
}

/* ══ MANIPULATIVO 5 · DIAL DE ONDAS ════════════════════════════════════════
   Al mover la frecuencia, el dibujo de la onda se estira o se comprime en
   vivo y la longitud de onda se recalcula. Tres ondas por conseguir, con
   pista direccional y revelado al tercer fallo.
   ═══════════════════════════════════════════════════════════════════════════ */
function wDial(rng){
  var host = iw('dial', 'wDial');
  var DIAL = [ { f: 50, l: 6 }, { f: 60, l: 5 }, { f: 75, l: 4 }, { f: 100, l: 3 }, { f: 150, l: 2 }, { f: 300, l: 1 } ];
  var METAS = shuffle([5, 4, 3, 2], rng).slice(0, 3);
  var st = { k: 0, r: 0, tries: 0, done: false };
  function cur(){ return DIAL[st.k]; }
  function meta(){ return METAS[Math.min(st.r, METAS.length - 1)]; }
  function idxOf(l){ for (var i = 0; i < DIAL.length; i++) if (DIAL[i].l === l) return i; return 0; }
  function banda(f){
    return f < 88 ? L({ es: 'banda de TV baja', en: 'low TV band' })
         : f <= 108 ? L({ es: 'banda de radio FM', en: 'FM radio band' })
                    : L({ es: 'banda de TV alta', en: 'high TV band' });
  }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Dial de la antena', en: 'Antenna dial' }) + '</div>' +
    '<div class="iw-task" id="wDiaTask"></div>' +
    '<div class="iw-cv"><canvas id="wDiaCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Frecuencia', en: 'Frequency' }) + ': <b id="wDiaFL"></b> MHz</label>' +
      '<input type="range" id="wDiaF" min="0" max="5" step="1" value="0" oninput="wDiaIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Longitud de onda', en: 'Wavelength' }) + '</div><div class="ro-v" id="wDiaL"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Meta', en: 'Target' }) + '</div><div class="ro-v" id="wDiaT"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Banda', en: 'Band' }) + '</div><div class="ro-v" id="wDiaB"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wDiaCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wDiaFb"></div>';

  function draw(){
    var cv = document.getElementById('wDiaCv');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 170;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var x0 = 34, x1 = W - 14, cy = 86;
    c.strokeStyle = CV('--border'); c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x0, cy); c.lineTo(x1, cy); c.stroke();
    c.strokeStyle = CV('--wire'); c.lineWidth = 3;
    c.beginPath(); c.moveTo(20, cy + 46); c.lineTo(20, cy - 46); c.stroke();
    c.beginPath(); c.moveTo(10, cy - 46); c.lineTo(30, cy - 46); c.stroke();
    var pxm = (x1 - x0) / 6, lam = cur().l * pxm;
    c.strokeStyle = CV('--green'); c.lineWidth = 2.6;
    c.beginPath();
    for (var x = x0; x <= x1; x += 2) {
      var y = cy - Math.sin((x - x0) / lam * Math.PI * 2) * 38;
      if (x === x0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
    c.strokeStyle = CV('--gold'); c.lineWidth = 2;
    c.beginPath(); c.moveTo(x0, cy + 54); c.lineTo(x0 + lam, cy + 54); c.stroke();
    c.beginPath(); c.moveTo(x0, cy + 49); c.lineTo(x0, cy + 59); c.stroke();
    c.beginPath(); c.moveTo(x0 + lam, cy + 49); c.lineTo(x0 + lam, cy + 59); c.stroke();
    c.fillStyle = CV('--text2'); c.font = '12px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(cur().l + ' m', x0 + 6, cy + 72);
    c.fillText(cur().f + ' MHz', x0 + 6, 20);
  }
  function paint(){
    document.getElementById('wDiaFL').textContent = cur().f;
    document.getElementById('wDiaL').textContent = cur().l + ' m';
    document.getElementById('wDiaT').textContent = st.done ? L({ es: 'libre', en: 'free' }) : (meta() + ' m');
    document.getElementById('wDiaB').textContent = banda(cur().f);
    document.getElementById('wDiaTask').textContent = st.done
      ? L({ es: 'Dial libre: recorre la escala y observa cómo se comprime la onda al subir la frecuencia.',
            en: 'Free dial: run through the scale and watch the wave squeeze together as the frequency rises.' })
      : L({ es: 'Ronda ' + (st.r + 1) + ' de 3: sintoniza la frecuencia cuya onda mida ' + meta() + ' m.',
            en: 'Round ' + (st.r + 1) + ' of 3: tune the frequency whose wave measures ' + meta() + ' m.' });
    draw();
  }
  window.wDiaIn = function(){ st.k = parseInt(document.getElementById('wDiaF').value, 10); paint(); };
  window.wDiaCheck = function(){
    var fb = document.getElementById('wDiaFb');
    if (st.lock) return;
    if (st.done) { fb.textContent = L({ es: 'A ' + cur().f + ' MHz la onda mide ' + cur().l + ' m.', en: 'At ' + cur().f + ' MHz the wave measures ' + cur().l + ' m.' }); return; }
    var m = meta();
    if (cur().l === m) {
      var fnow = cur().f;
      st.r++; st.tries = 0;
      if (st.r >= METAS.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Las tres sintonías conseguidas. Frecuencia y longitud de onda van siempre al revés una de la otra.',
              en: 'All three tunings reached. Frequency and wavelength always run opposite to each other.' })
        : L({ es: 'Exacto: a ' + fnow + ' MHz cada onda mide ' + m + ' m. Va la siguiente sintonía.',
              en: 'Exactly: at ' + fnow + ' MHz each wave measures ' + m + ' m. Here comes the next tuning.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3) {
      st.k = idxOf(m); st.tries = 0; st.lock = true;
      document.getElementById('wDiaF').value = st.k;
      paint();
      fb.textContent = L({ es: 'Es esta: ' + DIAL[idxOf(m)].f + ' MHz da una onda de ' + m + ' m. En un segundo la onda avanza 300 millones de metros, y esos metros se reparten entre las oscilaciones de ese segundo.',
                           en: 'It is this one: ' + DIAL[idxOf(m)].f + ' MHz gives a wave of ' + m + ' m. In one second the wave advances 300 million metres, and those metres are shared out among the oscillations of that second.' });
      setTimeout(function(){
        st.r++; st.lock = false;
        if (st.r >= METAS.length) st.done = true;
        paint();
      }, 2200);
      return;
    }
    fb.textContent = (cur().l < m)
      ? L({ es: 'Tu onda mide ' + cur().l + ' m y se piden ' + m + ' m: es demasiado corta, baja la frecuencia.',
            en: 'Your wave measures ' + cur().l + ' m and ' + m + ' m are asked for: it is too short, lower the frequency.' })
      : L({ es: 'Tu onda mide ' + cur().l + ' m y se piden ' + m + ' m: es demasiado larga, sube la frecuencia.',
            en: 'Your wave measures ' + cur().l + ' m and ' + m + ' m are asked for: it is too long, raise the frequency.' });
  };
  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Magnetismo y Electromagnetismo';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
