<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Cuatro Operaciones y sus Relaciones Inversas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── MANIPULATIVES ── */
.mexpr { font-family:'IBM Plex Mono',monospace; font-size:1.12rem; font-weight:600; color:var(--green-dark); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.75rem .8rem; text-align:center; overflow-x:auto; white-space:nowrap; }
.mexpr.big { font-size:1.24rem; }
.mstage { font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text3); margin-bottom:.45rem; }
.mrow { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; margin-top:.65rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.83rem; cursor:pointer; color:var(--text); font-family:inherit; min-height:44px; text-align:left; }
.mbtn:hover { border-color:var(--green); background:var(--green-bg); }
.mbtn.on { background:var(--green); color:var(--green-bg); border-color:var(--green); }
.mbtn.done { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
.mbtn.mono { font-family:'IBM Plex Mono',monospace; font-size:.92rem; font-weight:600; }
.mfb { margin-top:.7rem; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.6rem .8rem; font-size:.82rem; color:var(--text2); min-height:2.6rem; }
.mfb.good { background:var(--ok-bg); border-left-color:var(--ok); color:var(--ok); }
.mfb.warn { background:var(--bad-bg); border-left-color:var(--bad); color:var(--bad); }
.mcanvas { display:block; width:100%; height:132px; }
.mtrack { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.03em; }
.eqbox { display:grid; grid-template-columns:1fr auto 1fr; gap:.5rem; align-items:center; margin-top:.7rem; }
@media(max-width:500px){ .eqbox { grid-template-columns:1fr; } }
.eqside { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.6rem .5rem; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:.86rem; }
.eqside b { display:block; font-size:1.05rem; color:var(--green-dark); margin-top:.2rem; }
.eqsign { font-family:'IBM Plex Mono',monospace; font-size:1.3rem; font-weight:700; text-align:center; color:var(--gold); }

.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Las Cuatro Operaciones y sus Relaciones Inversas</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Las Cuatro Operaciones y sus Relaciones Inversas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>

    var prev = problems.map(function(p){ return p.studentChoice; });

    document.getElementById('lessonBody').innerHTML = '';

    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });
    if (answeredCount === problems.length && problems.length > 0) {
      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);
    }
  }
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-gen');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG==='es'?'es-MX':'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;

function L(o){ if(o===null||o===undefined) return ''; if(typeof o!=='object') return String(o); return (o[LANG]!==undefined?o[LANG]:o.es); }
function numStr(n){ return n<0 ? '−'+Math.abs(n) : String(n); }
function par(n){ return n<0 ? '(−'+Math.abs(n)+')' : String(n); }
function cssVar(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
function shuffleOpts(opts, correct, rng){ var a=shuffle(opts,rng); return { options:a, correctIdx:a.indexOf(correct) }; }
function mkNums(correct, cands){
  var out=[correct], i;
  for(i=0;i<cands.length && out.length<4;i++){ if(out.indexOf(cands[i])<0) out.push(cands[i]); }
  var d=1;
  while(out.length<4){
    if(out.indexOf(correct+d)<0) out.push(correct+d);
    if(out.length<4 && out.indexOf(correct-d)<0) out.push(correct-d);
    d++;
  }
  return out;
}
function numOptions(correct, cands, unit){
  var u = unit||'';
  return { options: mkNums(correct,cands).map(function(v){ return numStr(v)+u; }), correct: numStr(correct)+u };
}
function addSection(html){
  var d=document.createElement('div'); d.className='section'; d.innerHTML=html;
  document.getElementById('lessonBody').appendChild(d); return d;
}
function addProblem(rng, cfg){
  var so = shuffleOpts(cfg.options, cfg.correct, rng);
  problems.push({ title:cfg.title, questionText:cfg.questionText, fn:cfg.fn||'', hint:cfg.hint,
    explanation:cfg.explanation, options:so.options, correctIdx:so.correctIdx,
    showWork:!!cfg.showWork, studentChoice:null, pendingChoice:null });
  buildOneCard(problems[problems.length-1], problems.length-1);
}
function subRng(rng, tag){ return seededRng(tag + Math.floor(rng()*1000000)); }
function setFb(id, txt, kind){

function m1DrawBase(){
  // Draws the number line with start dot and goal marker only — no arc, no landing dot
  var c=document.getElementById('m1canvas'); if(!c) return;
  var rect=c.getBoundingClientRect(); if(!rect.width) return;
  var dpr=window.devicePixelRatio||1;
  c.width=Math.round(rect.width*dpr); c.height=Math.round(rect.height*dpr);
  var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  var W=rect.width, H=rect.height, lo=-12, hi=12, pad=16;
  function X(v){ return pad + (v-lo)*(W-2*pad)/(hi-lo); }
  var y = H*0.66;
  g.clearRect(0,0,W,H);
  g.strokeStyle=cssVar('--border'); g.lineWidth=2;
  g.beginPath(); g.moveTo(pad,y); g.lineTo(W-pad,y); g.stroke();
  g.font='10px "IBM Plex Mono", monospace'; g.textAlign='center';
  for(var v=lo; v<=hi; v++){
    var xx=X(v);
    g.strokeStyle=cssVar('--border'); g.beginPath(); g.moveTo(xx,y-4); g.lineTo(xx,y+4); g.stroke();
    if(v%3===0){ g.fillStyle=cssVar('--text3'); g.fillText(numStr(v), xx, y+18); }
  }
  // goal marker
  g.strokeStyle=cssVar('--gold'); g.lineWidth=3;
  g.beginPath(); g.moveTo(X(M1.goal), y-22); g.lineTo(X(M1.goal), y+9); g.stroke();
  // start dot
  g.fillStyle=cssVar('--text2'); g.beginPath(); g.arc(X(M1.start), y, 5, 0, 6.2832); g.fill();
}
function m1Draw(){
  // Full draw including arc and landing dot — called only after Comprobar
  var c=document.getElementById('m1canvas'); if(!c) return;
  var rect=c.getBoundingClientRect(); if(!rect.width) return;
  var dpr=window.devicePixelRatio||1;
  c.width=Math.round(rect.width*dpr); c.height=Math.round(rect.height*dpr);
  var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  var W=rect.width, H=rect.height, lo=-12, hi=12, pad=16;
  function X(v){ return pad + (v-lo)*(W-2*pad)/(hi-lo); }
  var y = H*0.66;
  g.clearRect(0,0,W,H);
  g.strokeStyle=cssVar('--border'); g.lineWidth=2;
  g.beginPath(); g.moveTo(pad,y); g.lineTo(W-pad,y); g.stroke();
  g.font='10px "IBM Plex Mono", monospace'; g.textAlign='center';
  for(var v=lo; v<=hi; v++){
    var xx=X(v);
    g.strokeStyle=cssVar('--border'); g.beginPath(); g.moveTo(xx,y-4); g.lineTo(xx,y+4); g.stroke();
    if(v%3===0){ g.fillStyle=cssVar('--text3'); g.fillText(numStr(v), xx, y+18); }
  }
  g.strokeStyle=cssVar('--gold'); g.lineWidth=3;
  g.beginPath(); g.moveTo(X(M1.goal), y-22); g.lineTo(X(M1.goal), y+9); g.stroke();
  g.fillStyle=cssVar('--text2'); g.beginPath(); g.arc(X(M1.start), y, 5, 0, 6.2832); g.fill();
  var land = M1.start + M1.jump;
  if(M1.jump !== 0){
    var x0=X(M1.start), x1=X(Math.max(lo,Math.min(hi,land)));
    g.strokeStyle=cssVar('--green'); g.lineWidth=2.5;
    g.beginPath(); g.moveTo(x0,y-6); g.quadraticCurveTo((x0+x1)/2, y-40, x1, y-6); g.stroke();
    var dir = land>M1.start ? 1 : -1;
    g.fillStyle=cssVar('--green');
    g.beginPath(); g.moveTo(x1,y-1); g.lineTo(x1-6*dir,y-12); g.lineTo(x1+6*dir,y-12); g.closePath(); g.fill();
  }
  g.fillStyle=cssVar('--green-dark');
  g.beginPath(); g.arc(X(Math.max(lo,Math.min(hi,land))), y, 4, 0, 6.2832); g.fill();
}
function m1DrawAnimated(onDone){
  // Animated version: arc grows from start to landing over ~450ms
  var c=document.getElementById('m1canvas'); if(!c){ if(onDone) onDone(); return; }
  var rect=c.getBoundingClientRect(); if(!rect.width){ if(onDone) onDone(); return; }
  var dpr=window.devicePixelRatio||1;
  var W=rect.width, H=rect.height, lo=-12, hi=12, pad=16;
  function X(v){ return pad + (v-lo)*(W-2*pad)/(hi-lo); }
  var y = H*0.66;
  var land = M1.start + M1.jump;
  var x0=X(M1.start), x1=X(Math.max(lo,Math.min(hi,land)));
  var cx=(x0+x1)/2, cy=y-40;  // control point of the quadratic
  var dir = land>=M1.start ? 1 : -1;
  var duration = 450, start = null;

  function drawFrame(t){
    if(!start) start = t;
    var prog = Math.min((t - start) / duration, 1);
    // ease out
    var ease = 1 - Math.pow(1 - prog, 2);

    c.width=Math.round(rect.width*dpr); c.height=Math.round(rect.height*dpr);
    var g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,W,H);

    // base line + ticks + labels
    g.strokeStyle=cssVar('--border'); g.lineWidth=2;
    g.beginPath(); g.moveTo(pad,y); g.lineTo(W-pad,y); g.stroke();
    g.font='10px "IBM Plex Mono", monospace'; g.textAlign='center';
    for(var v=lo; v<=hi; v++){
      var xx=X(v);
      g.strokeStyle=cssVar('--border'); g.beginPath(); g.moveTo(xx,y-4); g.lineTo(xx,y+4); g.stroke();
      if(v%3===0){ g.fillStyle=cssVar('--text3'); g.fillText(numStr(v), xx, y+18); }
    }
    // goal marker
    g.strokeStyle=cssVar('--gold'); g.lineWidth=3;
    g.beginPath(); g.moveTo(X(M1.goal), y-22); g.lineTo(X(M1.goal), y+9); g.stroke();
    // start dot
    g.fillStyle=cssVar('--text2'); g.beginPath(); g.arc(x0, y, 5, 0, 6.2832); g.fill();

    if(M1.jump !== 0){
      // Draw partial arc up to ease progress using quadratic interpolation
      // Current tip position along the quadratic curve
      var tipX = (1-ease)*(1-ease)*x0 + 2*(1-ease)*ease*cx + ease*ease*x1;
      var tipY = (1-ease)*(1-ease)*(y-6) + 2*(1-ease)*ease*cy + ease*ease*(y-6);

      g.strokeStyle=cssVar('--green'); g.lineWidth=2.5;
      g.beginPath();
      // Draw arc from x0 up to tipX by sampling the curve
      var steps = Math.max(12, Math.round(ease * 30));
      g.moveTo(x0, y-6);
      for(var s=1; s<=steps; s++){
        var p = (ease * s) / steps;
        var px=(1-p)*(1-p)*x0 + 2*(1-p)*p*cx + p*p*x1;
        var py=(1-p)*(1-p)*(y-6) + 2*(1-p)*p*cy + p*p*(y-6);
        g.lineTo(px, py);
      }
      g.stroke();

      // Arrowhead tip moves with the arc
      if(ease > 0.85){
        var arrowEase = (ease - 0.85) / 0.15; // fade in arrow in last 15%
        g.globalAlpha = arrowEase;
        g.fillStyle=cssVar('--green');
        g.beginPath(); g.moveTo(x1,y-1); g.lineTo(x1-6*dir,y-12); g.lineTo(x1+6*dir,y-12); g.closePath(); g.fill();
        g.globalAlpha = 1;
      }

      // Landing dot appears at end
      if(ease === 1){
        g.fillStyle=cssVar('--green-dark');
        g.beginPath(); g.arc(x1, y, 4, 0, 6.2832); g.fill();
      }
    }

    if(prog < 1){
      requestAnimationFrame(drawFrame);
    } else {
      // Final frame: draw complete
      m1Draw();
      if(onDone) onDone();
    }
  }
  requestAnimationFrame(drawFrame);
}
function m1Slide(){
  var s=document.getElementById('m1slider'); if(!s) return;
  M1.jump = parseInt(s.value,10)||0;
  M1.checked = false;  // student is adjusting — arc goes away until next Comprobar
  var j=document.getElementById('m1jump'); if(j) j.textContent = numStr(M1.jump);
  var l=document.getElementById('m1land'); if(l) l.textContent = '?';
  m1DrawBase();
  if(M1.done) return;
  setFb('m1fb', '');
  // Hide siguiente ronda, re-show comprobar when slider moves
  var nxt=document.getElementById('m1next'); if(nxt) nxt.style.display='none';
  var btn=document.getElementById('m1btn'); if(btn) btn.style.display='';
}
function m1Check(){
  if(M1.done || M1.checked) return;
  M1.checked = true;
  var land = M1.start + M1.jump, need = M1.goal - M1.start;
  // Reveal landing in metric
  var l=document.getElementById('m1land'); if(l) l.textContent = numStr(land);
  // Animate the arc, then show feedback and next-round button
  m1DrawAnimated(function(){
    if(land === M1.goal){
      M1.round++;
      if(M1.round >= 3){
        M1.done = true;
        setFb('m1fb', L({ es:'¡Caes exactamente en <b>'+numStr(land)+'</b>! Tres saltos perfectos. El salto siempre es la meta menos la salida.',
                          en:'You land exactly on <b>'+numStr(land)+'</b>! Three perfect jumps. The jump is always the goal minus the start.'}), 'good');
        var btn=document.getElementById('m1btn'); if(btn) btn.classList.add('done');
        var nxt=document.getElementById('m1next'); if(nxt) nxt.style.display='none';
        return;
      }
      setFb('m1fb', L({ es:'¡Caes exactamente en <b>'+numStr(land)+'</b>! Pulsa <b>Siguiente ronda</b> cuando estés listo.',
                         en:'You land exactly on <b>'+numStr(land)+'</b>! Press <b>Next round</b> when you are ready.'}), 'good');
    } else {
      M1.tries++;
      var d = M1.goal - land;
      if(M1.tries >= 3){
        setFb('m1fb', L({ es:'Caes en <b>'+numStr(land)+'</b>. El salto correcto era <b>'+numStr(need)+'</b>, porque '+numStr(M1.goal)+' − '+par(M1.start)+' = '+numStr(need)+'. Pulsa <b>Siguiente ronda</b> para continuar.',
                          en:'You land on <b>'+numStr(land)+'</b>. The correct jump was <b>'+numStr(need)+'</b>, because '+numStr(M1.goal)+' − '+par(M1.start)+' = '+numStr(need)+'. Press <b>Next round</b> to continue.'}), 'warn');
        M1.round++;
        if(M1.round >= 3){ M1.done = true; var nxt2=document.getElementById('m1next'); if(nxt2) nxt2.style.display='none'; return; }
      } else {
        setFb('m1fb', L({ es:'Caes en <b>'+numStr(land)+'</b>: '+(d>0?'no alcanzaste a llegar a la meta':'te pasaste de la meta')+'. Mueve el deslizador '+(d>0?'hacia la derecha':'hacia la izquierda')+' y vuelve a comprobar.',
                          en:'You land on <b>'+numStr(land)+'</b>: '+(d>0?'you did not reach the goal':'you went past the goal')+'. Move the slider '+(d>0?'right':'left')+' and check again.'}), 'warn');
        // On wrong (non-3rd) try: arc stays visible but student can move slider to try again
        return;  // don't show siguiente ronda yet
      }
    }
    // Show siguiente ronda button, hide comprobar
    var btn=document.getElementById('m1btn'); if(btn) btn.style.display='none';
    var nxt=document.getElementById('m1next'); if(nxt) nxt.style.display='';
  });
}
function m1Next(){
  if(M1.done) return;
  m1NewRound();
}

/* ═════════ WIDGET 2a: explorador de signos ═════════ */
var M2S = { s1:1, s2:1, op:'mul' };
function m2sToggle(which){
  if(which===1) M2S.s1 = -M2S.s1; else M2S.s2 = -M2S.s2;
  m2sRender();
}
function m2sOp(op, btn){
  M2S.op = op;
  var row = btn.parentNode.querySelectorAll('.mbtn');
  for(var i=0;i<row.length;i++) row[i].classList.remove('on');
  btn.classList.add('on');
  m2sRender();
}
function m2sRender(){
  var a = M2S.op==='mul' ? 4 : 12, b = 3;
  var v1 = M2S.s1*a, v2 = M2S.s2*b;
  var res = M2S.op==='mul' ? v1*v2 : v1/v2;
  var sym = M2S.op==='mul' ? '×' : '÷';
  var e = document.getElementById('m2sexpr');
  if(e) e.innerHTML = par(v1)+' '+sym+' '+par(v2)+' = <span style="color:var(--gold)">'+numStr(res)+'</span>';
  var b1=document.getElementById('m2sb1'), b2=document.getElementById('m2sb2');
  if(b1) b1.textContent = (M2S.s1>0?'+':'−')+a;
  if(b2) b2.textContent = (M2S.s2>0?'+':'−')+b;
  var same = (M2S.s1 === M2S.s2);
  setFb('m2sfb', L({
    es: same ? 'Los dos números tienen el mismo signo, así que el resultado sale positivo: '+numStr(res)+'.'
             : 'Los dos números tienen signos distintos, así que el resultado sale negativo: '+numStr(res)+'.',
    en: same ? 'Both numbers share the same sign, so the result comes out positive: '+numStr(res)+'.'
             : 'The two numbers have different signs, so the result comes out negative: '+numStr(res)+'.'}),
    same ? 'good' : 'warn');
}

/* ═════════ WIDGET 2b: maquina inversa ═════════ */
var M2 = { round:0, tries:0, done:false, rng:null, keys:[], a:0, n:2, kind:'mul', out:0 };
function m2NewRound(){
  var r = M2.rng;
  M2.a = pick([-9,-8,-7,-6,-5,-4,-3,3,4,5,6,7,8,9], r);
  M2.kind = pick(['mul','add'], r);
  M2.n = 2 + Math.floor(r()*5);
  M2.out = M2.kind==='mul' ? M2.a*M2.n : M2.a + M2.n;
  M2.tries = 0;
  var n = M2.n;
  var keys = [
    { lbl:'÷ '+n, kind:'div' },
    { lbl:'× '+n, kind:'mul' },
    { lbl:'− '+n, kind:'sub' },
    { lbl:'+ '+n,      kind:'add' }
  ];
  M2.keys = shuffle(keys, r);
  m2Render();
  var sym = M2.kind==='mul' ? '× '+M2.n : '+ '+M2.n;
  setFb('m2fb', L({ es:'La máquina aplicó [ '+sym+' ] al número de entrada. Elige qué operación deshace eso y regresa el número de salida <b>'+numStr(M2.out)+'</b> a la entrada <b>'+numStr(M2.a)+'</b>.',
                    en:'The machine applied [ '+sym+' ] to the input. Choose the operation that undoes that and brings the output <b>'+numStr(M2.out)+'</b> back to the input <b>'+numStr(M2.a)+'</b>.'}));
}
function m2Apply(kind, v){
  if(kind==='div') return v/M2.n;
  if(kind==='mul') return v*M2.n;
  if(kind==='sub') return v-M2.n;
  return v+M2.n;
}
function m2Render(){
  var sym = M2.kind==='mul' ? '× '+M2.n : '+ '+M2.n;
  var e=document.getElementById('m2expr');
  if(e) e.innerHTML =
    L({es:'entrada',en:'input'})+' <span style="color:var(--green-dark);font-weight:700">'+numStr(M2.a)+'</span>' +
    ' → [ '+sym+' ] → ' +
    L({es:'salida',en:'output'})+' <span style="color:var(--gold);font-weight:700">'+numStr(M2.out)+'</span>' +
    '<span style="display:block;font-size:.75rem;color:var(--text3);margin-top:.3rem">'+
    L({es:'Aplica tu operación al número de salida ('+numStr(M2.out)+') y comprueba si obtienes la entrada ('+numStr(M2.a)+')',
       en:'Apply your operation to the output ('+numStr(M2.out)+') and check if you get back the input ('+numStr(M2.a)+')'})+
    '</span>';
  var box=document.getElementById('m2keys');
  if(box){
    var h='';
    for(var i=0;i<M2.keys.length;i++) h += '<button class="mbtn mono" onclick="m2Try('+i+')">'+M2.out+' '+M2.keys[i].lbl+'</button>';
    box.innerHTML = h;
  }
  var rd=document.getElementById('m2round');
  if(rd) rd.textContent = L({es:'Ronda '+(M2.round+1)+' de 3', en:'Round '+(M2.round+1)+' of 3'});
}
function m2Try(i){
  if(M2.done) return;
  var k = M2.keys[i];
  var res = m2Apply(k.kind, M2.out);
  if(res === M2.a){
    M2.round++;
    if(M2.round >= 3){
      M2.done = true;
      setFb('m2fb', L({ es:'Tres veces de vuelta al inicio. Dividir deshace multiplicar y restar deshace sumar.',
                        en:'Back to the start three times. Dividing undoes multiplying and subtracting undoes adding.'}), 'good');
      return;
    }
    setFb('m2fb', L({ es:'Regresaste a '+numStr(M2.a)+'. La máquina se recarga con otro número.',
                      en:'You are back at '+numStr(M2.a)+'. The machine reloads with another number.'}), 'good');
    setTimeout(m2NewRound, 800);
    return;
  }
  M2.tries++;
  if(M2.tries >= 3){
    var right = M2.kind==='mul' ? ('÷ '+M2.n) : ('− '+M2.n);
    setFb('m2fb', L({ es:'La tecla que regresa el valor es <b>'+right+'</b>: '+par(M2.out)+' '+right+' = '+numStr(M2.a)+'. Vamos con otra máquina.',
                      en:'The key that brings the value back is <b>'+right+'</b>: '+par(M2.out)+' '+right+' = '+numStr(M2.a)+'. On to another machine.'}), 'warn');
    M2.round++;
    if(M2.round >= 3){ M2.done = true; return; }
    setTimeout(m2NewRound, 1500);
    return;
  }
  var far = Math.abs(res - M2.a), near = Math.abs(M2.out - M2.a);
  setFb('m2fb', L({ es:'Con esa operación obtienes '+numStr(M2.out)+' '+k.lbl+' = '+numStr(res)+', no '+numStr(M2.a)+'. '+(far>near?'Prueba la operación contraria a la que usó la máquina.':'Vas en la dirección correcta, pero no es exactamente la operación inversa.'),
                    en:'With that operation you get '+numStr(M2.out)+' '+k.lbl+' = '+numStr(res)+', not '+numStr(M2.a)+'. '+(far>near?'Try the operation opposite to what the machine used.':'You are heading the right way, but it is not exactly the inverse operation.')}), 'warn');
}

/* ═════════ WIDGET 3: comparador de propiedades ═════════ */
var M3 = { mode:'com', a:5, b:3, c:2, hit:{} };
function m3Mode(mode, btn){
  M3.mode = mode;
  var row = btn.parentNode.querySelectorAll('.mbtn');
  for(var i=0;i<row.length;i++) row[i].classList.remove('on');
  btn.classList.add('on');
  m3Update();
}
function m3Update(){
  var s;
  s=document.getElementById('m3a'); if(s) M3.a=parseInt(s.value,10);
  s=document.getElementById('m3b'); if(s) M3.b=parseInt(s.value,10);
  s=document.getElementById('m3c'); if(s) M3.c=parseInt(s.value,10);
  var a=M3.a, b=M3.b, c=M3.c, ls, rs, lv, rv, note;
  if(M3.mode==='com'){
    ls = par(a)+' + '+par(b); rs = par(b)+' + '+par(a); lv=a+b; rv=b+a;
    note = L({es:'Suma: intercambiar el orden no cambia el resultado.', en:'Addition: swapping the order does not change the result.'});
  } else if(M3.mode==='res'){
    ls = par(a)+' − '+par(b); rs = par(b)+' − '+par(a); lv=a-b; rv=b-a;
    note = L({es:'Resta: intenta encontrar valores donde los dos lados coincidan.', en:'Subtraction: try to find values where both sides agree.'});
  } else if(M3.mode==='aso'){
    ls = '('+par(a)+' × '+par(b)+') × '+par(c); rs = par(a)+' × ('+par(b)+' × '+par(c)+')';
    lv=(a*b)*c; rv=a*(b*c);
    note = L({es:'Multiplicación: mover el paréntesis no cambia el producto.', en:'Multiplication: moving the parentheses does not change the product.'});
  } else {
    ls = par(a)+' × ('+par(b)+' + '+par(c)+')'; rs = par(a)+' × '+par(b)+' + '+par(a)+' × '+par(c);
    lv=a*(b+c); rv=a*b+a*c;
    note = L({es:'El factor se reparte entre los dos términos del paréntesis.', en:'The factor spreads over both terms inside the parentheses.'});
  }
  var e;
  e=document.getElementById('m3ls'); if(e) e.innerHTML = ls+'<b>'+numStr(lv)+'</b>';
  e=document.getElementById('m3rs'); if(e) e.innerHTML = rs+'<b>'+numStr(rv)+'</b>';
  e=document.getElementById('m3sign'); if(e) e.textContent = (lv===rv) ? '=' : '≠';
  e=document.getElementById('m3av'); if(e) e.textContent = numStr(M3.a);
  e=document.getElementById('m3bv'); if(e) e.textContent = numStr(M3.b);
  e=document.getElementById('m3cv'); if(e) e.textContent = numStr(M3.c);
  if(lv===rv){
    M3.hit[M3.mode] = true;
    var extra = (M3.mode==='res') ? L({es:' Los dos lados solo coinciden cuando a = b. Cambia los valores para ver que en general la resta no se puede reordenar.', en:' Both sides only agree when a = b. Change the values to see that in general subtraction cannot be freely reordered.'}) : ' '+note;
    setFb('m3fb', L({es:'✓ Los dos lados valen '+numStr(lv)+'. Sigue probando con otros valores para confirmar.', en:'✓ Both sides equal '+numStr(lv)+'. Keep testing with other values to confirm.'}) + extra, 'good');
  } else {
    setFb('m3fb', L({es:'✗ El lado izquierdo vale '+numStr(lv)+' y el derecho vale '+numStr(rv)+' — son distintos. Esto ya demuestra que la propiedad no vale aquí. ', en:'✗ The left side is '+numStr(lv)+' and the right side is '+numStr(rv)+' — they differ. This already shows the property does not hold here. '}) + note, 'warn');
  }
}

/* ═════════ WIDGET 4: constructor de pasos ═════════ */
var M4 = { round:0, step:0, tries:0, done:false, rng:null, steps:[], val:0 };
function m4NewRound(){
  var r = M4.rng, T = M4.round % 3;
  var a,b,c,d,e,P,Q,S,D;
  var wMul = L({es:'Las multiplicaciones y divisiones se resuelven antes que las sumas y restas.', en:'Multiplication and division come before addition and subtraction.'});
  var wPar = L({es:'Primero se resuelve lo que está dentro del paréntesis.', en:'Whatever is inside the parentheses is resolved first.'});
  var wLtr = L({es:'Cuando solo quedan sumas y restas, se avanza de izquierda a derecha.', en:'When only additions and subtractions are left, work from left to right.'});
  if(T===0){
    a = 4+Math.floor(r()*9); b = 3+Math.floor(r()*4); c = 2+Math.floor(r()*4); d = 2+Math.floor(r()*7);
    P = b*c; Q = a+P;
    M4.steps = [
      { expr:a+' + '+b+' × '+c+' − '+d,
        chips:[ {lbl:L({es:'la suma '+a+' + '+b, en:'the sum '+a+' + '+b}), why:wMul},
                {lbl:L({es:'el producto '+b+' × '+c, en:'the product '+b+' × '+c}), ok:true},
                {lbl:L({es:'la resta '+c+' − '+d, en:'the difference '+c+' − '+d}), why:wMul} ] },
      { expr:a+' + '+P+' − '+d,
        chips:[ {lbl:L({es:'la suma '+a+' + '+P, en:'the sum '+a+' + '+P}), ok:true},
                {lbl:L({es:'la resta '+P+' − '+d, en:'the difference '+P+' − '+d}), why:wLtr} ] },
      { expr:Q+' − '+d,
        chips:[ {lbl:L({es:'la resta '+Q+' − '+d, en:'the difference '+Q+' − '+d}), ok:true} ] }
    ];
    M4.val = Q-d;
  } else if(T===1){
    a = 3+Math.floor(r()*6); b = 2+Math.floor(r()*5); c = 2+Math.floor(r()*3); d = 3+Math.floor(r()*10);
    S = a+b; P = S*c;
    M4.steps = [
      { expr:'('+a+' + '+b+') × '+c+' − '+d,
        chips:[ {lbl:L({es:'la suma dentro del paréntesis', en:'the sum inside the parentheses'}), ok:true},
                {lbl:L({es:'la multiplicación por '+c, en:'the multiplication by '+c}), why:wPar},
                {lbl:L({es:'la resta de '+d, en:'the subtraction of '+d}), why:wPar} ] },
      { expr:S+' × '+c+' − '+d,
        chips:[ {lbl:L({es:'el producto '+S+' × '+c, en:'the product '+S+' × '+c}), ok:true},
                {lbl:L({es:'la resta de '+d, en:'the subtraction of '+d}), why:wMul} ] },
      { expr:P+' − '+d,
        chips:[ {lbl:L({es:'la resta '+P+' − '+d, en:'the difference '+P+' − '+d}), ok:true} ] }
    ];
    M4.val = P-d;
  } else {
    a = 12+Math.floor(r()*13); b = 2+Math.floor(r()*3); c = 6+Math.floor(r()*5); d = 2+Math.floor(r()*4);
    D = c-d; P = b*D;
    M4.steps = [
      { expr:a+' − '+b+' × ('+c+' − '+d+')',
        chips:[ {lbl:L({es:'la resta dentro del paréntesis', en:'the subtraction inside the parentheses'}), ok:true},
                {lbl:L({es:'la multiplicación por '+b, en:'the multiplication by '+b}), why:wPar},
                {lbl:L({es:'la resta que empieza en '+a, en:'the subtraction starting at '+a}), why:wPar} ] },
      { expr:a+' − '+b+' × '+D,
        chips:[ {lbl:L({es:'el producto '+b+' × '+D, en:'the product '+b+' × '+D}), ok:true},
                {lbl:L({es:'la resta que empieza en '+a, en:'the subtraction starting at '+a}), why:wMul} ] },
      { expr:a+' − '+P,
        chips:[ {lbl:L({es:'la resta '+a+' − '+P, en:'the difference '+a+' − '+P}), ok:true} ] }
    ];
    M4.val = a-P;
  }
  M4.step = 0; M4.tries = 0;
  m4Render();
  setFb('m4fb', L({ es:'Empieza: elige cuál operación se resuelve primero.', en:'Start: choose which operation is resolved first.'}));
}
function m4Render(){
  var st = M4.steps[M4.step];
  var e=document.getElementById('m4expr');
  if(e) e.textContent = st ? st.expr : numStr(M4.val);
  var box=document.getElementById('m4chips');
  if(box){
    var h='';
    if(st){ for(var i=0;i<st.chips.length;i++) h += '<button class="mbtn" onclick="m4Tap('+i+')">'+st.chips[i].lbl+'</button>'; }
    box.innerHTML = h;
  }
  var rd=document.getElementById('m4round');
  if(rd) rd.textContent = L({es:'Ronda '+(Math.min(M4.round,2)+1)+' de 3 · paso '+(M4.step+1), en:'Round '+(Math.min(M4.round,2)+1)+' of 3 · step '+(M4.step+1)});
}
function m4Advance(){
  M4.step++; M4.tries = 0;
  if(M4.step >= M4.steps.length){
    var v = M4.val;
    M4.round++;
    if(M4.round >= 3){
      M4.done = true;
      var e=document.getElementById('m4expr'); if(e) e.textContent = numStr(v);
      var box=document.getElementById('m4chips'); if(box) box.innerHTML='';
      var instr=document.getElementById('m4instr'); if(instr) instr.style.display='none';
      setFb('m4fb', L({ es:'Resultado: '+numStr(v)+'. Tres expresiones ordenadas: paréntesis primero, luego productos y cocientes, y al final sumas y restas.',
                        en:'Result: '+numStr(v)+'. Three expressions ordered: parentheses first, then products and quotients, and finally additions and subtractions.'}), 'good');
      var rd=document.getElementById('m4round'); if(rd) rd.textContent='';
      return;
    }
    setFb('m4fb', L({ es:'Resultado: '+numStr(v)+'. Llega otra expresión.', en:'Result: '+numStr(v)+'. Another expression is coming.'}), 'good');
    setTimeout(m4NewRound, 900);
    return;
  }
  m4Render();
  setFb('m4fb', L({ es:'Correcto. La expresión se acortó. ¿Cuál es el siguiente paso?', en:'Correct. The expression got shorter. What comes next?'}), 'good');
}
function m4Tap(i){
  if(M4.done) return;
  var st = M4.steps[M4.step]; if(!st) return;
  var ch = st.chips[i];
  if(ch.ok){ m4Advance(); return; }
  M4.tries++;
  if(M4.tries >= 3){
    var ok=null;
    for(var k=0;k<st.chips.length;k++) if(st.chips[k].ok) ok=st.chips[k];
    setFb('m4fb', L({ es:'El paso correcto era '+ok.lbl+'. ', en:'The right step was '+ok.lbl+'. '}) + ch.why, 'warn');
    setTimeout(m4Advance, 1500);
    return;
  }
  setFb('m4fb', ch.why + L({es:' Vuelve a intentarlo.', en:' Try again.'}), 'warn');
}
function m4Reset(){
  if(M4.done) return;
  M4.step = 0; M4.tries = 0;
  m4Render();
  setFb('m4fb', L({ es:'Expresión reiniciada. Empieza otra vez por el primer paso.', en:'Expression reset. Start again from the first step.'}));
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){

  /* ─── apertura ─── */
  addSection(
    '<div class="stag">'+L({es:'Punto de partida',en:'Starting point'})+'</div>'+
    '<h2>'+L({es:'Cuatro operaciones, dos parejas',en:'Four operations, two pairs'})+'</h2>'+
    '<p>'+L({es:'Sumar y restar recorren la misma calle en direcciones opuestas. Multiplicar y dividir también. Cuando una operación te lleva de un número a otro, su inversa te devuelve al punto de partida, y eso sirve para encontrar datos que no aparecen a la vista.',
                en:'Adding and subtracting travel the same road in opposite directions. So do multiplying and dividing. When one operation takes you from one number to another, its inverse brings you back to the start, and that is how you recover data that is not in plain sight.'})+'</p>'+
    '<p>'+L({es:'En este recorrido vas a saltar sobre la recta numérica con números positivos y negativos, vas a poner tres propiedades a prueba con tus propios valores y vas a ordenar los pasos de cálculos con paréntesis.',
                en:'In this walkthrough you will jump along the number line with positive and negative numbers, put three properties to the test with your own values, and order the steps of calculations with parentheses.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Pareja 1',en:'Pair 1'})+'</div><div class="rform">+ ⇄ −</div><div class="rnote">'+L({es:'una deshace a la otra',en:'each one undoes the other'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Pareja 2',en:'Pair 2'})+'</div><div class="rform">× ⇄ ÷</div><div class="rnote">'+L({es:'una deshace a la otra',en:'each one undoes the other'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Propiedades',en:'Properties'})+'</div><div class="rform">a + b = b + a</div><div class="rnote">'+L({es:'no todas valen para toda operación',en:'not all of them hold for every operation'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Jerarquía',en:'Order'})+'</div><div class="rform">( ) → × ÷ → + −</div><div class="rnote">'+L({es:'el orden decide el resultado',en:'the order decides the result'})+'</div></div>'+

      var m = 4+Math.floor(rng()*5), x = 10+10*Math.floor(rng()*3), d = 3+Math.floor(rng()*6);
      var corr2 = L({es:'Distributiva de la multiplicación sobre la suma', en:'Distributive property of multiplication over addition'});
      var opts2 = [ corr2,
        L({es:'Conmutativa de la multiplicación', en:'Commutative property of multiplication'}),
        L({es:'Asociativa de la multiplicación', en:'Associative property of multiplication'}),
        L({es:'Conmutativa de la suma', en:'Commutative property of addition'}) ];
      cfg = {
        title: L({es:'¿Qué propiedad usó?', en:'Which property was used?'}),
        questionText: L({es:'Un estudiante escribió la igualdad de abajo en su cuaderno y asegura que es válida para cualquier terna de números. ¿Cuál propiedad está usando?',
                         en:'A student wrote the equality below in their notebook and claims it is valid for any three numbers. Which property are they using?'}),
        fn: m+' × ('+x+' + '+d+') = '+m+' × '+x+' + '+m+' × '+d,
        hint: L({es:'Observa que el factor de fuera aparece dos veces del lado derecho, una con cada término del paréntesis.',
                 en:'Notice that the outside factor appears twice on the right side, once with each term inside the parentheses.'}),
        explanation: L({es:'El factor '+m+' se repartió entre los dos términos del paréntesis, y eso es exactamente lo que describe la propiedad distributiva de la multiplicación sobre la suma.',
                        en:'The factor '+m+' was spread over both terms inside the parentheses, and that is exactly what the distributive property of multiplication over addition describes.'}),
        options:opts2, correct:corr2, showWork:false
      };
    }
    addProblem(rng, cfg);
  })();

  /* ─── P6 ─── */
  (function(){
    var cfg, v = Math.floor(rng()*2);
    var m = 4+Math.floor(rng()*5), x = pick([20,30,40,50], rng), d = 2+Math.floor(rng()*7);
    if(v===0){
      var ans = m*(x-d);
      var o = numOptions(ans, [m*x-d, m*x+m*d, m*(x+d)]);
      cfg = {
        title: L({es:'Multiplicar una diferencia', en:'Multiplying a difference'}),
        questionText: L({es:'Calcula el resultado de la siguiente expresión.', en:'Work out the result of the following expression.'}),
        fn: m+' × ('+x+' − '+d+')',
        hint: L({es:'Puedes resolver primero el paréntesis, o bien repartir el factor entre los dos términos y restar los dos productos: las dos rutas dan lo mismo.',
                 en:'You can solve the parentheses first, or spread the factor over both terms and subtract the two products: both routes give the same value.'}),
        explanation: L({es:'Repartiendo el factor: '+m+' × '+x+' − '+m+' × '+d+' = '+(m*x)+' − '+(m*d)+' = '+numStr(ans),
                        en:'Spreading the factor: '+m+' × '+x+' − '+m+' × '+d+' = '+(m*x)+' − '+(m*d)+' = '+numStr(ans)}),
        options:o.options, correct:o.correct, showWork:true
      };
    } else {
      var ans2 = -m*(x-d);
      var o2 = numOptions(ans2, [m*(x-d), -m*x+d, -(m*x+m*d)]);
      cfg = {
        title: L({es:'Un factor negativo por una diferencia', en:'A negative factor times a difference'}),
        questionText: L({es:'Calcula el resultado de la siguiente expresión.', en:'Work out the result of the following expression.'}),
        fn: '−'+m+' × ('+x+' − '+d+')',
        hint: L({es:'Resuelve el paréntesis y después decide el signo del producto comparando los signos de los dos factores.',
                 en:'Solve the parentheses and then decide the sign of the product by comparing the signs of the two factors.'}),
        explanation: L({es:'El paréntesis vale '+(x-d)+', y un factor negativo por un número positivo da un producto negativo: '+par(-m)+' × '+(x-d)+' = '+numStr(ans2),
                        en:'The parentheses give '+(x-d)+', and a negative factor times a positive number gives a negative product: '+par(-m)+' × '+(x-d)+' = '+numStr(ans2)}),
        options:o2.options, correct:o2.correct, showWork:true
      };
    }
    addProblem(rng, cfg);
  })();

  /* ─── CONCEPTO 4 ─── */
  addSection(
    '<div class="stag">'+L({es:'Concepto 4',en:'Concept 4'})+'</div>'+
    '<h2>'+L({es:'El orden en que se resuelve',en:'The order things get solved'})+'</h2>'+
    '<p>'+L({es:'Una misma cadena de números puede dar resultados distintos según el orden en que se opere, así que existe un acuerdo único: primero lo que está dentro de los símbolos de agrupación, después las multiplicaciones y divisiones de izquierda a derecha, y al final las sumas y restas, también de izquierda a derecha.',
                en:'The same chain of numbers can give different results depending on the order you operate, so there is a single agreement: first whatever sits inside the grouping symbols, then multiplications and divisions from left to right, and finally additions and subtractions, also from left to right.'})+'</p>'+
    '<p>'+L({es:'Los paréntesis son el único recurso que permite alterar ese acuerdo, y por eso cambiarlos de lugar cambia el resultado. Cada paso reduce la expresión a una más corta hasta dejar un solo número.',
                en:'Parentheses are the only tool that lets you override that agreement, which is why moving them changes the result. Each step reduces the expression to a shorter one until a single number is left.'})+'</p>'
  );

  addSection(
    '<div class="gcrd">'+
      '<div class="mstage">'+L({es:'Constructor de pasos',en:'Step builder'})+'</div>'+
      '<div style="font-size:.84rem;color:var(--text2);margin-bottom:.4rem">'+
        L({es:'Esta es la expresión a calcular:',en:'This is the expression to calculate:'})+'</div>'+
      '<div class="mexpr big" id="m4expr"></div>'+
      '<div style="font-size:.84rem;font-weight:600;color:var(--green-dark);margin:.55rem 0 .3rem" id="m4instr">'+
        L({es:'Toca la operación que se debe resolver primero:',en:'Tap the operation that must be resolved first:'})+'</div>'+
      '<div class="mrow" id="m4chips"></div>'+
      '<div class="mfb" id="m4fb"></div>'+
      '<div class="mrow"><button class="mbtn" onclick="m4Reset()">'+L({es:'Reiniciar expresión',en:'Reset expression'})+'</button></div>'+
      '<div class="mtrack" id="m4round"></div>'+
    '</div>'
  );
  M4 = { round:0, step:0, tries:0, done:false, rng:subRng(rng,'m4'), steps:[], val:0 };
  setTimeout(function(){ m4NewRound(); }, 120);

  /* ─── P7 ─── */
  (function(){
    var cfg, v = Math.floor(rng()*2);
    var a = 5+Math.floor(rng()*10), b = 3+Math.floor(rng()*5), c = 2+Math.floor(rng()*4), d = 2+Math.floor(rng()*9);
    if(v===0){
      var ans = a + b*c - d;
      var o = numOptions(ans, [(a+b)*c-d, a+b*(c-d), a+b*c+d]);
      cfg = {
        title: L({es:'Una cadena sin paréntesis', en:'A chain with no parentheses'}),
        questionText: L({es:'Calcula el resultado de la siguiente expresión.', en:'Work out the result of the following expression.'}),
        fn: a+' + '+b+' × '+c+' − '+d,
        hint: L({es:'Resuelve la multiplicación antes que la suma y la resta, y luego avanza de izquierda a derecha.',
                 en:'Solve the multiplication before the addition and the subtraction, then work from left to right.'}),
        explanation: L({es:'Primero el producto y después las sumas y restas de izquierda a derecha: '+a+' + '+(b*c)+' − '+d+' = '+numStr(ans),
                        en:'First the product and then the additions and subtractions from left to right: '+a+' + '+(b*c)+' − '+d+' = '+numStr(ans)}),
        options:o.options, correct:o.correct, showWork:true
      };
    } else {
      var ans2 = a - b*c + d;
      var o2 = numOptions(ans2, [(a-b)*c+d, a-b*(c+d), a-(b*c+d)]);
      cfg = {
        title: L({es:'Cuando el resultado cruza el cero', en:'When the result crosses zero'}),
        questionText: L({es:'Calcula el resultado de la siguiente expresión.', en:'Work out the result of the following expression.'}),
        fn: a+' − '+b+' × '+c+' + '+d,
        hint: L({es:'La multiplicación se resuelve antes que la resta y la suma; después avanza de izquierda a derecha aunque tengas que pasar del otro lado del cero.',
                 en:'The multiplication is solved before the subtraction and the addition; then work from left to right even if you cross to the other side of zero.'}),
        explanation: L({es:'Primero el producto y después de izquierda a derecha: '+a+' − '+(b*c)+' + '+d+' = '+numStr(ans2),
                        en:'First the product and then left to right: '+a+' − '+(b*c)+' + '+d+' = '+numStr(ans2)}),
        options:o2.options, correct:o2.correct, showWork:true
      };
    }
    addProblem(rng, cfg);
  })();

  /* ─── P8 ─── */
  (function(){
    var cfg, v = Math.floor(rng()*2);
    var a = 10+Math.floor(rng()*15), b = 2+Math.floor(rng()*4), c = 8+Math.floor(rng()*5);
    var e = pick([2,3], rng), k = 2+Math.floor(rng()*3), d = e*k;
    var bc = b-c, prod = bc*d, quo = bc*k;
    if(v===0){
      var ans = a + quo;
      var o = numOptions(ans, [a-quo, (a+b-c)*k, a+prod]);
      cfg = {
        title: L({es:'Paréntesis, producto y cociente', en:'Parentheses, product and quotient'}),
        questionText: L({es:'Calcula el resultado de la siguiente expresión.', en:'Work out the result of the following expression.'}),
        fn: a+' + ('+b+' − '+c+') × '+d+' ÷ '+e,
        hint: L({es:'Empieza por el paréntesis, sigue con la multiplicación y la división en el orden en que aparecen, y deja la suma para el final.',
                 en:'Start with the parentheses, continue with the multiplication and the division in the order they appear, and leave the addition for last.'}),
        explanation: L({es:'El paréntesis vale '+numStr(bc)+'; al multiplicarlo por '+d+' queda '+numStr(prod)+' y al dividirlo entre '+e+' queda '+numStr(quo)+'; sumar ese valor negativo equivale a restar '+Math.abs(quo)+': '+a+' − '+Math.abs(quo)+' = '+numStr(ans),
                        en:'The parentheses give '+numStr(bc)+'; multiplied by '+d+' that becomes '+numStr(prod)+', and divided by '+e+' it becomes '+numStr(quo)+'; adding that negative value is the same as subtracting '+Math.abs(quo)+': '+a+' − '+Math.abs(quo)+' = '+numStr(ans)}),
        options:o.options, correct:o.correct, showWork:true
      };
    } else {
      var ans2 = a - quo;
      var o2 = numOptions(ans2, [a+quo, (a-b+c)*k, a-prod]);
      cfg = {
        title: L({es:'Restar lo que el paréntesis produce', en:'Subtracting what the parentheses produce'}),
        questionText: L({es:'Calcula el resultado de la siguiente expresión.', en:'Work out the result of the following expression.'}),
        fn: a+' − ('+b+' − '+c+') × '+d+' ÷ '+e,
        hint: L({es:'Empieza por el paréntesis, sigue con la multiplicación y la división en el orden en que aparecen, y fíjate en qué pasa al restar un número negativo.',
                 en:'Start with the parentheses, continue with the multiplication and the division in the order they appear, and watch what happens when you subtract a negative number.'}),
        explanation: L({es:'El paréntesis vale '+numStr(bc)+'; al multiplicarlo por '+d+' queda '+numStr(prod)+' y al dividirlo entre '+e+' queda '+numStr(quo)+'; restar ese valor negativo equivale a sumar '+Math.abs(quo)+': '+a+' + '+Math.abs(quo)+' = '+numStr(ans2),
                        en:'The parentheses give '+numStr(bc)+'; multiplied by '+d+' that becomes '+numStr(prod)+', and divided by '+e+' it becomes '+numStr(quo)+'; subtracting that negative value is the same as adding '+Math.abs(quo)+': '+a+' + '+Math.abs(quo)+' = '+numStr(ans2)}),
        options:o2.options, correct:o2.correct, showWork:true
      };
    }
    addProblem(rng, cfg);
  })();

  /* ─── P9 ─── */
  (function(){
    var cfg, v = Math.floor(rng()*2);
    if(v===0){
      var n = 3+Math.floor(rng()*3), p = 60+10*Math.floor(rng()*5), def = 10*(1+Math.floor(rng()*8));
      var s = n*p - def, ans = -def;
      var o = numOptions(ans, [def, s-p, -(def+10)], ' '+L({es:'pesos',en:'pesos'}));
      cfg = {
        title: L({es:'El saldo después de las recargas', en:'The balance after the top-ups'}),
        questionText: L({es:'Ana tenía '+s+' pesos en su tarjeta de transporte. La aplicación le permite seguir viajando aunque la tarjeta quede en números rojos, y ella hizo '+n+' recargas de '+p+' pesos cada una. ¿Cuál es el saldo de la tarjeta de Ana después de esas recargas?',
                         en:'Ana had '+s+' pesos on her transit card. The app lets her keep travelling even if the card goes into the red, and she made '+n+' top-ups of '+p+' pesos each. What is the balance on Ana’s card after those top-ups?'}),
        fn: '',
        hint: L({es:'Averigua primero cuánto suman todas las recargas juntas y compáralo con lo que había; un saldo en números rojos se anota con signo negativo.',
                 en:'First find out how much all the top-ups add up to and compare it with what was there; a balance in the red is written with a negative sign.'}),
        explanation: L({es:'Las '+n+' recargas suman '+(n*p)+' pesos, más que los '+s+' disponibles: '+s+' − '+(n*p)+' = '+numStr(ans),
                        en:'The '+n+' top-ups add up to '+(n*p)+' pesos, more than the '+s+' available: '+s+' − '+(n*p)+' = '+numStr(ans)}),
        options:o.options, correct:o.correct, showWork:true
      };
    } else {
      var f = 2+Math.floor(rng()*8), dwn = f+2+Math.floor(rng()*5), up = 1+Math.floor(rng()*5);
      var ans2 = f - dwn + up;
      var o2 = numOptions(ans2, [f-dwn-up, f+dwn-up, -(f-dwn+up)]);
      cfg = {
        title: L({es:'El elevador y los niveles', en:'The lift and the levels'}),
        questionText: L({es:'En un edificio los niveles bajo la planta baja se anotan con signo negativo y la planta baja es el nivel 0. Un elevador está en el nivel '+f+', baja '+dwn+' niveles y luego sube '+up+'. ¿En qué nivel queda el elevador?',
                         en:'In a building the levels below the ground floor are written with a negative sign and the ground floor is level 0. A lift is at level '+f+', goes down '+dwn+' levels and then up '+up+'. Which level does the lift end on?'}),
        fn: '',
        hint: L({es:'Recorre la recta numérica en el orden en que ocurren los movimientos: primero hacia la izquierda y después hacia la derecha.',
                 en:'Travel the number line in the order the movements happen: first to the left and then to the right.'}),
        explanation: L({es:'Se aplican los dos movimientos en orden: '+f+' − '+dwn+' + '+up+' = '+numStr(ans2),
                        en:'Both movements are applied in order: '+f+' − '+dwn+' + '+up+' = '+numStr(ans2)}),
        options:o2.options, correct:o2.correct, showWork:true
      };
    }
    addProblem(rng, cfg);
  })();

  /* ─── P10 ─── */
  (function(){
    var cfg, v = Math.floor(rng()*2);
    if(v===0){
      var added = 100+10*Math.floor(rng()*15), start = 150+10*Math.floor(rng()*20), now = start+added;
      var o = numOptions(start, [now+added, now, added], ' '+L({es:'litros',en:'litres'}));
      cfg = {
        title: L({es:'El valor inicial del tinaco', en:'The tank’s starting amount'}),
        questionText: L({es:'Un tinaco escolar tenía cierta cantidad de agua al abrir la mañana. Después le agregaron '+added+' litros y el medidor marcó '+now+' litros. ¿Cuántos litros tenía el tinaco al abrir la mañana?',
                         en:'A school water tank held a certain amount of water when the morning began. Then '+added+' litres were added and the gauge read '+now+' litres. How many litres did the tank hold at the start of the morning?'}),
        fn: '',
        hint: L({es:'Se conoce el final y lo que se agregó, pero no el inicio: hay que deshacer la operación que se hizo.',
                 en:'You know the ending amount and what was added, but not the start: you need to undo the operation that was performed.'}),
        explanation: L({es:'Para regresar al valor inicial se deshace la suma con una resta: '+now+' − '+added+' = '+start,
                        en:'To get back to the starting value you undo the addition with a subtraction: '+now+' − '+added+' = '+start}),
        options:o.options, correct:o.correct, showWork:true
      };
    } else {
      var days = 4+Math.floor(rng()*4), per = 8+Math.floor(rng()*12), tot = days*per;
      var o2 = numOptions(per, [tot-days, tot+days, per+days], ' '+L({es:'cajas',en:'boxes'}));
      cfg = {
        title: L({es:'Lo mismo cada día', en:'The same amount each day'}),
        questionText: L({es:'Una papelería vendió el mismo número de cajas de colores cada día durante '+days+' días y al terminar la semana llevaba '+tot+' cajas vendidas. ¿Cuántas cajas vendió cada día?',
                         en:'A stationery shop sold the same number of boxes of coloured pencils each day for '+days+' days, and by the end of the week it had sold '+tot+' boxes. How many boxes did it sell each day?'}),
        fn: '',
        hint: L({es:'El total es la venta diaria repetida '+days+' veces; para recuperar la venta diaria hay que deshacer esa repetición.',
                 en:'The total is the daily sale repeated '+days+' times; to recover the daily sale you must undo that repetition.'}),
        explanation: L({es:'La división deshace la multiplicación: '+tot+' ÷ '+days+' = '+per,
                        en:'Division undoes multiplication: '+tot+' ÷ '+days+' = '+per}),
        options:o2.options, correct:o2.correct, showWork:true
      };
    }
    addProblem(rng, cfg);
  })();
}

</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
