        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Sillas que quedan' : 'Chairs left') + '</div><div class="mnum cs" id="w2cs"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Mesas que quedan' : 'Tables left') + '</div><div class="mnum ps" id="w2cm"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Precio que se despeja' : 'Price that comes out') + '</div><div class="mnum ts" id="w2out"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w2read"></div>' +
      '</div>';
    var s1 = host.querySelector('#w2k1'), s2 = host.querySelector('#w2k2');
    s1.addEventListener('input', function() { state.k1 = parseInt(s1.value, 10); render(); });
    s2.addEventListener('input', function() { state.k2 = parseInt(s2.value, 10); render(); });
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.op = b.getAttribute('data-op');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        render();
      });
    });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · una respuesta, ninguna o infinitas
   Dos cotizaciones de flete sobre el mismo plano. Al igualar las tarifas
   por pieza las rectas quedan paralelas y el cruce desaparece; al igualar
   tambien el cobro fijo las dos rectas se vuelven una sola.
   ════════════════════════════════════════════════════════════════════════ */
function widgetTipos(FC, vC, FS0, vS0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { F: FS0, v: vS0 };
  var XMIN = 0, XMAX = 1200;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var YMAX = 20000;
    var top  = Math.max(FC + vC * XMAX, state.F + state.v * XMAX);
    while (top > YMAX) YMAX += 20000;
    var YMIN = 0;
    var dv = state.v - vC, dF = FC - state.F;
    var q  = dv !== 0 ? dF / dv : null;
    var xt = [{ v: 0, t: '0' }, { v: 300, t: '300' }, { v: 600, t: '600' }, { v: 900, t: '900' }, { v: 1200, t: '1200' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: intN(YMAX / 2000) + ' mil' }, { v: YMAX, t: intN(YMAX / 1000) + ' mil' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'piezas enviadas en el mes' : 'pieces shipped in the month',
      es ? 'cobro, $' : 'charge, $', xt, yt);
    inner += lineSvg(vC, FC, XMIN, XMAX, YMIN, YMAX, 'var(--green)', '2.6');
    inner += lineSvg(state.v, state.F, XMIN, XMAX, YMIN, YMAX, 'var(--gold)', '1.8');
    if (q !== null && q >= XMIN && q <= XMAX) {
      inner += '<circle cx="' + svgNum(mapX(q, XMIN, XMAX)) + '" cy="' + svgNum(mapY(FC + vC * q, YMIN, YMAX)) + '" r="4.5" fill="var(--text)"/>';
    }
    set('#w3svg', svgOpen() + inner + '</svg>');

    set('#w3fl', money(state.F));
    set('#w3vl', money(state.v));
    set('#w3type', (dv === 0 && dF === 0) ? (es ? 'infinitas' : 'infinitely many')
                 : (dv === 0)             ? (es ? 'ninguna' : 'none')
                                          : (es ? 'una sola' : 'exactly one'));
    set('#w3q', (dv === 0) ? (es ? 'no hay' : 'none')
              : (q < 0)    ? (es ? 'fuera del rango' : 'out of range')
                           : intN(Math.round(q)) + (es ? ' piezas' : ' pieces'));
    set('#w3gap', (dv === 0) ? money(Math.abs(dF)) : (es ? 'cambia' : 'it changes'));
    set('#w3eq', (es ? 'Costa cobra ' : 'Costa charges ') + '<span class="ec">' + money(FC) + ' + ' + money(vC) + (es ? ' por pieza' : ' per piece') + '</span>' +
      '<span style="color:var(--text3)"> · </span>' + (es ? 'Sierra cobra ' : 'Sierra charges ') +
      '<span class="ev">' + money(state.F) + ' + ' + money(state.v) + (es ? ' por pieza' : ' per piece') + '</span>');

    var vd = host.querySelector('#w3verd');
    if (vd) {
      if (dv === 0 && dF === 0) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Las dos rectas quedaron encimadas: no son dos cotizaciones distintas, es la misma escrita dos veces.'
                            : 'The two lines lie on top of each other: these are not two different quotes, it is one quote written twice.';
      } else if (dv === 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Las dos rectas quedaron paralelas: por más piezas que se envíen, los dos cobros nunca coinciden.'
                            : 'The two lines came out parallel: however many pieces are shipped, the two charges never meet.';
      } else if (q < 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'El cruce existe pero cae en un número negativo de piezas, así que dentro del rango real una cotización siempre gana.'
                            : 'The crossing exists but falls at a negative number of pieces, so within the real range one quote always wins.';
      } else {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Las dos rectas se cortan en un solo punto: hay un volumen exacto en el que las dos cotizaciones cuestan lo mismo.'
                            : 'The two lines cross at a single point: there is one exact volume at which both quotes cost the same.';
      }
    }

    set('#w3read', (dv === 0 && dF === 0)
      ? (es
        ? '<strong>Lectura de negocio:</strong> las dos cotizaciones son idénticas, así que el sistema tiene infinitas soluciones: cualquier volumen las iguala y comparar deja de tener sentido. En la práctica esto pasa cuando un proveedor manda la misma tarifa en otro formato, por ejemplo por docena en lugar de por pieza, y el comprador cree que está comparando dos ofertas cuando en realidad tiene una sola. Antes de decidir conviene reducir las dos a la misma unidad y ver si de verdad son distintas.'
        : '<strong>Business reading:</strong> the two quotes are identical, so the system has infinitely many solutions: any volume makes them equal and comparing stops meaning anything. In practice this happens when a supplier sends the same rate in a different format, by the dozen instead of by the piece for instance, and the buyer thinks two offers are on the table when there is really only one. Before deciding it pays to reduce both to the same unit and check whether they truly differ.')
      : (dv === 0)
      ? (es
        ? '<strong>Lectura de negocio:</strong> las dos cotizaciones cobran lo mismo por pieza, así que la diferencia entre ellas se queda clavada en ' + money(Math.abs(dF)) + ' para cualquier volumen. El sistema no tiene solución, y eso no es un fracaso del método: es la respuesta. La decisión ya no depende del volumen, la cotización con el cobro fijo más bajo conviene siempre. Cambia la tarifa por pieza aunque sea un peso y verás reaparecer el punto de cruce.'
        : '<strong>Business reading:</strong> both quotes charge the same per piece, so the gap between them stays pinned at ' + money(Math.abs(dF)) + ' at any volume. The system has no solution, and that is not a failure of the method: it is the answer. The decision no longer depends on volume, the quote with the lower fixed charge always wins. Change the per piece rate by even one peso and the crossing point reappears.')
      : (es
        ? '<strong>Lectura de negocio:</strong> las dos cotizaciones se igualan en ' + intN(Math.round(q)) + ' piezas, y ese número es la solución del sistema. Por debajo de ese volumen conviene la que arranca más barato aunque cobre más por pieza; por encima conviene la otra, porque su tarifa por pieza más baja termina compensando su cobro fijo. El punto negro no es un adorno del dibujo: es la frontera que separa dos decisiones distintas, y por eso lo primero que hace un comprador con dos cotizaciones es buscarlo.'
        : '<strong>Business reading:</strong> the two quotes come level at ' + intN(Math.round(q)) + ' pieces, and that number is the solution of the system. Below that volume the quote that starts out cheaper wins even though it charges more per piece; above it the other one wins, because its lower per piece rate eventually makes up for its fixed charge. The black point is not decoration on the drawing: it is the border between two different decisions, which is why the first thing a buyer does with two quotes is look for it.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="tipos-de-solucion">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Una respuesta, ninguna o infinitas' : 'One answer, none, or infinitely many') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Muebles del Pacífico pide cotización a dos fleteras. Costa está fija en ' + money(FC) + ' al mes más ' + money(vC) + ' por pieza, y tú controlas la de Sierra. Ajusta la tarifa por pieza de Sierra hasta dejarla exactamente igual a la de Costa y observa qué le pasa al punto de cruce. Después, sin mover la tarifa, iguala también el cobro fijo. Cada una de esas tres situaciones tiene un nombre y una consecuencia distinta para la decisión de compra.'
          : 'Muebles del Pacífico asks two carriers for a quote. Costa is fixed at ' + money(FC) + ' a month plus ' + money(vC) + ' per piece, and you control the Sierra quote. Set the Sierra per piece rate to match Costa exactly and watch what happens to the crossing point. Then, leaving the rate alone, match the fixed charge as well. Each of those three situations has its own name and its own consequence for the purchasing decision.') + '</div>' +
        '<div class="iw-expr" id="w3eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'Fletes Costa' : 'Fletes Costa') + '</span><span><i class="lg-out"></i>' + (es ? 'Fletes Sierra' : 'Fletes Sierra') + '</span></div>' +
        '<div class="plane" id="w3svg"></div>' +
        '<div class="verdict" id="w3verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Cobro fijo de Sierra' : 'Sierra fixed charge') + ': <span class="cval" id="w3fl"></span></label>' +
          '<input type="range" min="0" max="30000" step="100" id="w3f" value="' + state.F + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Tarifa por pieza de Sierra' : 'Sierra rate per piece') + ': <span class="cval" id="w3vl"></span></label>' +
          '<input type="range" min="10" max="60" step="1" id="w3vs" value="' + state.v + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Soluciones del sistema' : 'Solutions of the system') + '</div><div class="mnum cs" id="w3type"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Volumen de empate' : 'Volume where they tie') + '</div><div class="mnum ps" id="w3q"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Diferencia constante' : 'Constant gap') + '</div><div class="mnum ts" id="w3gap"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    var fs = host.querySelector('#w3f'), vs = host.querySelector('#w3vs');
    fs.addEventListener('input', function() { state.F = parseInt(fs.value, 10); render(); });
    vs.addEventListener('input', function() { state.v = parseInt(vs.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   BUILD LESSON · concepto, herramienta, reactivos, y otra vez
   Todos los numeros salen del rng sembrado, de modo que dos alumnos nunca
   comparten una sola cifra y un mismo alumno nunca repite un intento.
   La guia entera sigue a un negocio: Muebles del Pacifico, un taller de
   Colima que fabrica sillas y mesas para hoteles y restaurantes.
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];
  document.getElementById('lessonBody').innerHTML = '';

  /* ── Concepto 1 · dos condiciones a la vez ── */
  var c1s  = pick([28, 34, 40], rng);
  var c1m  = pick([12, 15, 18], rng);
  var c1ps = pick([450, 520, 600], rng);
  var c1pm = pick([1300, 1500, 1700], rng);
  var c1N  = c1s + c1m;
  var c1R  = c1ps * c1s + c1pm * c1m;
  var c1all = c1ps * c1N;
  var c1gap = c1pm - c1ps;
  var c1ex  = c1R - c1all;
  var w1ps = pick([450, 520, 600], rng);
  var w1pm = pick([1300, 1500, 1700], rng);
  var w1N  = pick([30, 45, 60], rng);
  var w1k  = pick([8, 14, 20], rng);
  var w1R  = w1ps * w1N + w1k * (w1pm - w1ps);
  var p1s  = pick([26, 33, 39], rng);
  var p1m  = pick([11, 14, 17], rng);
  var p1ps = pick([470, 530, 610], rng);
  var p1pm = pick([1280, 1420, 1560], rng);
  var p1N  = p1s + p1m;
  var p1R  = p1ps * p1s + p1pm * p1m;
  var p1d  = pick([3, 4, 6], rng);
  var p1as = p1s + p1d;
  var p1am = p1m - p1d;
  var p1Rp = p1ps * p1as + p1pm * p1am;
  var p1dif = p1R - p1Rp;
  var p2s  = pick([26, 32, 38], rng);
  var p2m  = pick([11, 14, 17], rng);
  var p2ps = pick([460, 540, 620], rng);
  var p2pm = pick([1250, 1450, 1650], rng);
  var p2N  = p2s + p2m;
  var p2R  = p2ps * p2s + p2pm * p2m;
  var p2d  = pick([3, 4, 5], rng);
  var p2mD = Math.round((p2R - p2ps * p2N) / p2pm);
  var p2sD = p2N - p2mD;

  /* ── Concepto 2 · sustitucion ── */
  var c2s  = pick([24, 30, 36], rng);
  var c2m  = pick([9, 12, 15], rng);
  var c2hs = pick([2, 3, 4], rng);
  var c2hm = pick([7, 8, 10], rng);
  var c2N  = c2s + c2m;
  var c2H  = c2hs * c2s + c2hm * c2m;
  var c2all = c2hs * c2N;
  var c2gap = c2hm - c2hs;
  var c2ex  = c2H - c2all;
  var p3s  = pick([25, 31, 37], rng);
  var p3m  = pick([10, 13, 16], rng);
  var p3hs = pick([2, 3, 4], rng);
  var p3hm = pick([7, 9, 10], rng);
  var p3N  = p3s + p3m;
  var p3H  = p3hs * p3s + p3hm * p3m;
  var p3C  = Math.round((p3H - p3hs * p3N) / p3hm);
  var p3D  = p3N - p3C;
  var p4s  = pick([22, 28, 34], rng);
  var p4m  = pick([8, 11, 14], rng);
  var p4hs = pick([2, 3, 4], rng);
  var p4hm = pick([7, 8, 9], rng);
  var p4N  = p4s + p4m;
  var p4H  = p4hs * p4s + p4hm * p4m;
  var p4w  = Math.round((p4H - p4hs * p4N) / p4hm);

  /* ── Concepto 3 · eliminacion ── */
  var c3ps = pick([390, 460, 540], rng);
  var c3pm = pick([1150, 1320, 1480], rng);
  var c3b  = pick([4, 5, 6], rng);
  var c3a1 = pick([6, 8, 9], rng);
  var c3ag = pick([4, 6, 7], rng);
  var c3a2 = c3a1 + c3ag;
  var c3T1 = c3a1 * c3ps + c3b * c3pm;
  var c3T2 = c3a2 * c3ps + c3b * c3pm;
  var c3dT = c3T2 - c3T1;
  var w2ps = pick([420, 480, 560], rng);
  var w2pm = pick([1200, 1350, 1500], rng);
  var w2a1 = pick([3, 4, 5], rng);
  var w2b1 = pick([2, 3], rng);
  var w2a2 = pick([7, 9, 11], rng);
  var w2b2 = w2b1 + pick([3, 5], rng);
  var w2T1 = w2a1 * w2ps + w2b1 * w2pm;
  var w2T2 = w2a2 * w2ps + w2b2 * w2pm;
  var p5ps = pick([410, 480, 550], rng);
  var p5pm = pick([1180, 1350, 1520], rng);
  var p5b  = pick([4, 5, 6], rng);
  var p5a1 = pick([6, 7, 9], rng);
  var p5ag = pick([3, 4, 6], rng);
  var p5a2 = p5a1 + p5ag;
  var p5T1 = p5a1 * p5ps + p5b * p5pm;
  var p5T2 = p5a2 * p5ps + p5b * p5pm;
  var p5c  = Math.round(p5T1 / (p5a1 + p5b));
  var p5d  = Math.round(p5T2 / (p5a2 + p5b));

  /* ── Concepto 4 · una, ninguna o infinitas ── */
  var c4v  = pick([26, 30, 34], rng);
  var c4dv = pick([6, 8, 9], rng);
  var c4vS = c4v + c4dv;
  var c4q  = pick([400, 600, 800], rng);
  var c4dF = c4q * c4dv;
  var c4FS = pick([6000, 8000, 10000], rng);
  var c4FC = c4FS + c4dF;
  var c4t  = pick([250, 450, 950], rng);
  var p6k  = pick([3, 4, 5], rng);
  var p6a  = pick([12, 15, 18], rng);
  var p6b  = pick([5, 6, 8], rng);
  var p6ps = pick([430, 500, 570], rng);
  var p6pm = pick([1220, 1380, 1540], rng);
  var p6T  = p6a * p6ps + p6b * p6pm;

  /* ── Evaluacion final ── */
  var p7a  = pick([18, 22, 26], rng);
  var p7b  = pick([7, 9, 11], rng);
  var p7pa = pick([180, 210, 240], rng);
  var p7pb = pick([520, 580, 650], rng);
  var p7N  = p7a + p7b;
  var p7G  = p7a * p7pa + p7b * p7pb;
  var p8ph = pick([38, 45, 52], rng);
  var p8pj = pick([115, 130, 148], rng);
  var p8h  = pick([10, 14, 18], rng);
  var p8j1 = pick([5, 7, 9], rng);
  var p8jg = pick([4, 6, 8], rng);
  var p8j2 = p8j1 + p8jg;
  var p8T1 = p8h * p8ph + p8j1 * p8pj;
  var p8T2 = p8h * p8ph + p8j2 * p8pj;
  var p8c  = Math.round(p8T1 / (p8h + p8j1));
  var p8d  = Math.round(p8T2 / (p8h + p8j2));
  var p9v  = pick([24, 28, 32], rng);
  var p9F1 = pick([5000, 6500, 8000], rng);
  var p9dF = pick([1200, 1800, 2400], rng);
  var p9F2 = p9F1 + p9dF;
  var p9q  = pick([300, 450, 600], rng);
  var p9w  = Math.round(p9dF / p9v);
  var p10v  = pick([22, 26, 30], rng);
  var p10dv = pick([6, 7, 9], rng);
  var p10vS = p10v + p10dv;
  var p10q  = pick([500, 600, 700], rng);
  var p10FS = pick([5000, 7000, 9000], rng);
  var p10FC = p10FS + p10q * p10dv;
  var p10ex = pick([120, 200, 280], rng);
  var p10Q  = p10q + p10ex;
  var p10w  = Math.round(p10q * p10dv / (p10vS + p10v));

  /* ═══════════════════════ CONCEPTO 1 ═══════════════════════ */
  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>Dos condiciones al mismo tiempo: qué es un sistema y qué resuelve</h2>' +
      '<p>Hay preguntas de negocio que un solo dato no alcanza a contestar. Muebles del Pacífico, un taller de Colima que surte sillas y mesas a hoteles y restaurantes, sabe cuántas piezas salieron del almacén en la semana y sabe cuánto dinero entró a la caja, pero no anotó cuántas piezas fueron de cada tipo. Con el total de piezas se pueden imaginar decenas de repartos distintos, y con el ingreso también. La única forma de quedarse con uno solo es exigir que cumpla las dos condiciones a la vez.</p>' +
      '<p>A eso se le llama <strong>sistema de ecuaciones lineales</strong>: dos o más condiciones que hablan de las mismas cantidades desconocidas y que deben cumplirse simultáneamente. Las cantidades desconocidas se llaman <strong>incógnitas</strong>, y lo primero que hace cualquier persona que resuelve un sistema es nombrarlas con toda precisión. No basta con decir sillas: hay que decir <strong>el número de sillas vendidas en esa semana</strong>. Un nombre vago produce ecuaciones que no significan nada.</p>' +
      '<p>Una <strong>solución</strong> del sistema es una pareja de valores que satisface todas las condiciones al mismo tiempo. Esa palabra, todas, es la que hace todo el trabajo. Una pareja que cuadra con el total de piezas pero no con el ingreso no es una solución a medias: sencillamente no es una solución. Y como cada condición dibuja una recta sobre el plano, la solución del sistema es el punto donde las dos rectas se cruzan.</p>' +
      '<p>Esa lectura gráfica explica de golpe por qué dos datos suelen bastar para dos incógnitas, y por qué un solo dato nunca basta. Una recta contiene infinitos puntos, es decir infinitos repartos posibles; dos rectas que no son paralelas comparten uno solo. Un tercer dato ya no aporta información nueva si es coherente con los otros dos, y produce una contradicción si no lo es. Por eso, en la práctica, la pregunta que un analista se hace frente a un reporte incompleto es siempre la misma: cuántas condiciones independientes tengo, y cuántas incógnitas necesito.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Incógnitas</div><div class="rform">sillas, mesas</div><div class="rnote">Las dos cantidades que faltan.</div></div>' +
        '<div class="rcard"><div class="rname">Condición 1</div><div class="rform">' + intN(c1N) + ' piezas</div><div class="rnote">Lo que salió del almacén.</div></div>' +
        '<div class="rcard"><div class="rname">Condición 2</div><div class="rform">' + money(c1R) + '</div><div class="rnote">Lo que registró la caja.</div></div>' +
        '<div class="rcard"><div class="rname">Solución</div><div class="rform">un solo reparto</div><div class="rnote">Cumple las dos, no una.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> En la semana que se está revisando salieron ' + intN(c1N) + ' piezas entre sillas y mesas, y la caja registró ' + money(c1R) + '. La lista de precios de esa semana era de ' + money(c1ps) + ' por silla y ' + money(c1pm) + ' por mesa. El taller quiere saber cuántas piezas fueron de cada tipo.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Se nombran las incógnitas: el número de sillas vendidas y el número de mesas vendidas en esa semana.<br>' +
      '<strong>Paso 2.</strong> Se escriben las dos condiciones. La primera dice que las sillas y las mesas suman ' + intN(c1N) + ' piezas. La segunda dice que lo cobrado por las sillas más lo cobrado por las mesas suma ' + money(c1R) + '.<br>' +
      '<strong>Paso 3.</strong> Conviene medir la distancia contra un caso extremo. Si las ' + intN(c1N) + ' piezas hubieran sido todas sillas, la caja habría registrado ' + money(c1all) + '.<br>' +
      '<strong>Paso 4.</strong> El registro real supera esa cifra por ' + money(c1ex) + '. Cada vez que una silla se cambia por una mesa el ingreso sube ' + money(c1gap) + ', porque esa es la diferencia entre los dos precios. Entonces el número de mesas es ' + frac(money(c1ex), money(c1gap)) + ' , es decir ' + intN(c1m) + ' mesas.<br>' +
      '<strong>Paso 5.</strong> Con las mesas conocidas, las sillas salen de la primera condición: ' + intN(c1N) + ' piezas menos ' + intN(c1m) + ' mesas dan ' + intN(c1s) + ' sillas.<br>' +
      '<strong>Comprobación.</strong> ' + intN(c1s) + ' sillas y ' + intN(c1m) + ' mesas suman ' + intN(c1N) + ' piezas y producen ' + money(c1R) + '. Las dos condiciones se cumplen, así que la pareja es la solución del sistema.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>Two conditions at once: what a system is and what it settles</h2>' +
      '<p>Some business questions cannot be answered from a single figure. Muebles del Pacífico, a workshop in Colima that supplies chairs and tables to hotels and restaurants, knows how many pieces left the warehouse during the week and knows how much money came into the till, but nobody recorded how many pieces were of each kind. The piece count alone allows dozens of possible splits, and so does the revenue. The only way to be left with one split is to demand that it satisfy both conditions at the same time.</p>' +
      '<p>That is what a <strong>system of linear equations</strong> is: two or more conditions that speak about the same unknown quantities and that must hold simultaneously. The unknown quantities are called <strong>unknowns</strong>, and the first thing anyone solving a system does is name them precisely. Saying chairs is not enough: you have to say <strong>the number of chairs sold that week</strong>. A vague name produces equations that mean nothing.</p>' +
      '<p>A <strong>solution</strong> of the system is a pair of values that satisfies every condition at once. That word, every, does all the work. A pair that matches the piece count but not the revenue is not half a solution: it is simply not a solution. And since each condition draws a line on the plane, the solution of the system is the point where the two lines cross.</p>' +
      '<p>That graphical reading explains at a stroke why two figures are usually enough for two unknowns, and why one figure never is. A line holds infinitely many points, that is, infinitely many possible splits; two lines that are not parallel share exactly one. A third figure adds nothing new if it agrees with the other two, and produces a contradiction if it does not. That is why an analyst facing an incomplete report always asks the same question: how many independent conditions do I have, and how many unknowns do I need to pin down.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Unknowns</div><div class="rform">chairs, tables</div><div class="rnote">The two missing counts.</div></div>' +
        '<div class="rcard"><div class="rname">Condition 1</div><div class="rform">' + intN(c1N) + ' pieces</div><div class="rnote">What left the warehouse.</div></div>' +
        '<div class="rcard"><div class="rname">Condition 2</div><div class="rform">' + money(c1R) + '</div><div class="rnote">What the till recorded.</div></div>' +
        '<div class="rcard"><div class="rname">Solution</div><div class="rform">one single split</div><div class="rnote">It meets both, not one.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> In the week under review ' + intN(c1N) + ' pieces left the warehouse between chairs and tables, and the till recorded ' + money(c1R) + '. The price list that week was ' + money(c1ps) + ' per chair and ' + money(c1pm) + ' per table. The workshop wants to know how many pieces were of each kind.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> Name the unknowns: the number of chairs sold and the number of tables sold that week.<br>' +
      '<strong>Step 2.</strong> Write the two conditions. The first says that chairs and tables add up to ' + intN(c1N) + ' pieces. The second says that what the chairs brought in plus what the tables brought in adds up to ' + money(c1R) + '.<br>' +
      '<strong>Step 3.</strong> It helps to measure the distance from an extreme case. Had all ' + intN(c1N) + ' pieces been chairs, the till would have recorded ' + money(c1all) + '.<br>' +
      '<strong>Step 4.</strong> The real record beats that figure by ' + money(c1ex) + '. Every time a chair is swapped for a table the revenue climbs by ' + money(c1gap) + ', since that is the gap between the two prices. So the number of tables is ' + frac(money(c1ex), money(c1gap)) + ' , that is, ' + intN(c1m) + ' tables.<br>' +
      '<strong>Step 5.</strong> With the tables known, the chairs follow from the first condition: ' + intN(c1N) + ' pieces minus ' + intN(c1m) + ' tables leaves ' + intN(c1s) + ' chairs.<br>' +
      '<strong>Check.</strong> ' + intN(c1s) + ' chairs and ' + intN(c1m) + ' tables add up to ' + intN(c1N) + ' pieces and produce ' + money(c1R) + '. Both conditions hold, so the pair is the solution of the system.</p></div>';
  });

  widgetDosCondiciones(w1ps, w1pm, w1N, w1R);

  /* ── Reactivo 1 · una condicion cumplida no basta ── */
  var o1es = [
    'Cumple la condición de las piezas pero no la del ingreso, así que no es solución del sistema.',
    'Es la solución correcta, porque el número de piezas coincide con el reporte y ese es el dato principal.',
    'Demuestra que el sistema no tiene solución, porque hay un reparto que cumple una condición y falla en la otra.',
    'Es tan válida como cualquier otro reparto que sume el total de piezas, porque el ingreso depende de los precios y no del reparto.'
  ];
  var o1en = [
    'It meets the piece condition but not the revenue one, so it is not a solution of the system.',
    'It is the right answer, because the piece count matches the report and that is the figure that matters.',
    'It proves the system has no solution, since a split can meet one condition and fail the other.',
    'It is as valid as any other split adding up to the total pieces, because revenue depends on the prices and not on the split.'
  ];
  var o1 = shuffleOpts(o1es, o1en, rng);
  addItem({
    title: { es: 'Una condición cumplida no basta', en: 'Meeting one condition is not enough' },
    q: { es: 'Muebles del Pacífico cerró la semana con ' + intN(p1N) + ' piezas vendidas entre sillas y mesas, y la caja registró ' + money(p1R) + '. La lista de precios era de ' + money(p1ps) + ' por silla y ' + money(p1pm) + ' por mesa. Un practicante propone que la semana fue de ' + intN(p1as) + ' sillas y ' + intN(p1am) + ' mesas. ¿Qué se puede afirmar sobre esa propuesta?',
        en: 'Muebles del Pacífico closed the week with ' + intN(p1N) + ' pieces sold between chairs and tables, and the till recorded ' + money(p1R) + '. The price list was ' + money(p1ps) + ' per chair and ' + money(p1pm) + ' per table. A trainee suggests the week was ' + intN(p1as) + ' chairs and ' + intN(p1am) + ' tables. What can be said about that proposal?' },
    hint: { es: 'No hace falta resolver nada: basta con probar la propuesta en las dos condiciones. Cuenta primero las piezas y después valúa el reparto a los precios de lista. Una solución tiene que pasar las dos pruebas.',
            en: 'There is nothing to solve here: just test the proposal against both conditions. Count the pieces first, then price the split at the list prices. A solution has to pass both tests.' },
    opts: { es: o1.es, en: o1.en },
    exp: { es: 'La propuesta suma ' + intN(p1N) + ' piezas, así que la primera condición se cumple. Al valuarla a los precios de lista produce ' + money(p1Rp) + ', que se queda ' + money(p1dif) + ' por debajo de lo que registró la caja, de modo que la segunda condición falla. Una pareja que cumple una sola condición está sobre una de las dos rectas, pero no en el cruce, y el cruce es el único lugar donde vive la solución. La respuesta que la da por buena por coincidir en las piezas trata las dos condiciones como si una fuera principal y la otra secundaria, y en un sistema las dos pesan igual. La que concluye que el sistema no tiene solución confunde una propuesta fallida con una imposibilidad: que este reparto falle no dice nada sobre la existencia del correcto, que sí existe. Y la que afirma que el ingreso no depende del reparto es falsa por construcción, porque la silla y la mesa tienen precios distintos y mover una pieza de un tipo al otro cambia el total en ' + money(p1pm - p1ps) + '.',
           en: 'The proposal adds up to ' + intN(p1N) + ' pieces, so the first condition holds. Priced at the list prices it yields ' + money(p1Rp) + ', which falls ' + money(p1dif) + ' short of what the till recorded, so the second condition fails. A pair that meets only one condition sits on one of the two lines but not at the crossing, and the crossing is the only place the solution lives. The answer that accepts it because the piece count agrees treats one condition as primary and the other as secondary, whereas in a system both carry equal weight. The answer concluding that the system has no solution mistakes a failed guess for an impossibility: this split failing says nothing about whether the right one exists, and it does. And the answer claiming revenue does not depend on the split is false by construction, since chairs and tables carry different prices and moving one piece from one kind to the other shifts the total by ' + money(p1pm - p1ps) + '.' }
  }, o1.correctIdx, false);

  /* ── Reactivo 2 · resolver el reparto de la semana ── */
  var o2es = [
    intN(p2s) + ' sillas y ' + intN(p2m) + ' mesas',
    intN(p2m) + ' sillas y ' + intN(p2s) + ' mesas',
    intN(p2s - p2d) + ' sillas y ' + intN(p2m + p2d) + ' mesas',
    intN(p2sD) + ' sillas y ' + intN(p2mD) + ' mesas'
  ];
  var o2en = [
    intN(p2s) + ' chairs and ' + intN(p2m) + ' tables',
    intN(p2m) + ' chairs and ' + intN(p2s) + ' tables',
    intN(p2s - p2d) + ' chairs and ' + intN(p2m + p2d) + ' tables',
    intN(p2sD) + ' chairs and ' + intN(p2mD) + ' tables'
  ];
  var o2 = shuffleOpts(o2es, o2en, rng);
  addItem({
    title: { es: 'El reparto que cuadra con los dos registros', en: 'The split that matches both records' },
    q: { es: 'En otra semana Muebles del Pacífico entregó ' + intN(p2N) + ' piezas entre sillas y mesas y facturó ' + money(p2R) + '. Ese mes la silla se vendía en ' + money(p2ps) + ' y la mesa en ' + money(p2pm) + '. ¿Cuántas piezas de cada tipo salieron esa semana?',
        en: 'In another week Muebles del Pacífico delivered ' + intN(p2N) + ' pieces between chairs and tables and billed ' + money(p2R) + '. That month chairs sold for ' + money(p2ps) + ' and tables for ' + money(p2pm) + '. How many pieces of each kind went out that week?' },
    hint: { es: 'Imagina primero el caso extremo en que todas las piezas hubieran sido sillas y calcula cuánto habría facturado el taller. La diferencia con lo que realmente facturó se debe por completo a las mesas, y cada mesa aporta la diferencia entre los dos precios.',
            en: 'Start by imagining the extreme case in which every piece had been a chair, and work out what the workshop would have billed. The gap against what it actually billed is due entirely to the tables, and each table contributes the difference between the two prices.' },
    opts: { es: o2.es, en: o2.en },
    exp: { es: 'Si las ' + intN(p2N) + ' piezas hubieran sido sillas, la factura habría sido ' + money(p2ps * p2N) + '. La factura real la supera por ' + money(p2R - p2ps * p2N) + ', y como cada mesa agrega ' + money(p2pm - p2ps) + ' sobre el precio de una silla, hubo ' + intN(p2m) + ' mesas y por lo tanto ' + intN(p2s) + ' sillas. El reparto que anuncia ' + intN(p2m) + ' sillas y ' + intN(p2s) + ' mesas usa los números correctos pero cambia de lugar las dos incógnitas, y valuado a los precios de lista da una factura muy distinta. El reparto de ' + intN(p2s - p2d) + ' sillas y ' + intN(p2m + p2d) + ' mesas también suma las ' + intN(p2N) + ' piezas, pero al mover ' + intN(p2d) + ' piezas hacia el lado caro se pasa de la factura por ' + money(p2d * (p2pm - p2ps)) + ': cumple una condición y falla la otra. Y el reparto de ' + intN(p2sD) + ' sillas y ' + intN(p2mD) + ' mesas sale de repartir el excedente entre el precio completo de la mesa en lugar de repartirlo entre la diferencia de precios, un error que siempre deja demasiado pocas mesas.',
           en: 'Had all ' + intN(p2N) + ' pieces been chairs, the bill would have been ' + money(p2ps * p2N) + '. The real bill beats that by ' + money(p2R - p2ps * p2N) + ', and since each table adds ' + money(p2pm - p2ps) + ' over the price of a chair, there were ' + intN(p2m) + ' tables and therefore ' + intN(p2s) + ' chairs. The split reading ' + intN(p2m) + ' chairs and ' + intN(p2s) + ' tables uses the right numbers but swaps the two unknowns, and priced at the list prices it produces a very different bill. The split of ' + intN(p2s - p2d) + ' chairs and ' + intN(p2m + p2d) + ' tables also adds up to ' + intN(p2N) + ' pieces, but shifting ' + intN(p2d) + ' pieces to the expensive side overshoots the bill by ' + money(p2d * (p2pm - p2ps)) + ': it meets one condition and fails the other. And the split of ' + intN(p2sD) + ' chairs and ' + intN(p2mD) + ' tables comes from dividing the surplus by the full price of a table instead of by the gap between the prices, a slip that always leaves too few tables.' }
  }, o2.correctIdx, true);

  /* ═══════════════════════ CONCEPTO 2 ═══════════════════════ */
  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 2</div>' +
      '<h2>Sustitución: cambiar una incógnita por lo que vale la otra</h2>' +
      '<p>El razonamiento del caso extremo funciona muy bien cuando una de las condiciones es un simple conteo, pero no siempre se tiene esa suerte. El método general que hace lo mismo de forma ordenada se llama <strong>sustitución</strong>, y consiste en dos movimientos: de una de las condiciones se obtiene una incógnita escrita en términos de la otra, y esa expresión se mete en la condición restante. El resultado es una sola ecuación con una sola incógnita, que ya se resuelve sin misterio.</p>' +
      '<p>La parte delicada es elegir bien de dónde partir. Conviene tomar la condición donde una incógnita aparezca sola o con un coeficiente de uno, porque así el paso no introduce fracciones. En los problemas de taller esa condición suele ser la del conteo de piezas: el número de sillas es el total menos el número de mesas. Escrito así, cada vez que aparezca la palabra sillas se puede poner en su lugar esa resta.</p>' +
      '<p>El error más frecuente de la sustitución no está en el álgebra sino en la distribución. Al meter una resta dentro de una multiplicación hay que multiplicar los dos términos de la resta, no solamente el primero. Quien olvida la segunda mitad le atribuye a un producto un tiempo o un dinero que en realidad correspondía al otro, y el resultado sale mal sin que ninguna operación parezca equivocada. Por eso conviene siempre volver a comprobar la pareja encontrada en las dos condiciones originales, no en las intermedias.</p>' +
      '<p>La sustitución también sirve para leer restricciones que no son de dinero. Un taller vive de su capacidad instalada, y las horas de carpintería son un recurso tan limitado como el efectivo. Cuando el gerente conoce las piezas entregadas y las horas trabajadas, tiene exactamente las dos condiciones que necesita para separar la producción por tipo de mueble, y con ello puede estimar cuánto cuesta realmente cada línea antes de aceptar el siguiente pedido.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Paso clave</div><div class="rform">una en función de otra</div><div class="rnote">Se elige la condición más simple.</div></div>' +
        '<div class="rcard"><div class="rname">Horas por silla</div><div class="rform">' + intN(c2hs) + ' h</div><div class="rnote">Carpintería y armado.</div></div>' +
        '<div class="rcard"><div class="rname">Horas por mesa</div><div class="rform">' + intN(c2hm) + ' h</div><div class="rnote">Más grande, más lenta.</div></div>' +
        '<div class="rcard"><div class="rname">Riesgo</div><div class="rform">distribuir mal</div><div class="rnote">Hay que multiplicar los dos términos.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> El taller entregó ' + intN(c2N) + ' piezas y el reloj checador acumuló ' + intN(c2H) + ' horas de carpintería en la semana. Cada silla ocupa ' + intN(c2hs) + ' horas y cada mesa ' + intN(c2hm) + ' horas. El gerente quiere separar la producción por tipo de mueble.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Las incógnitas son el número de sillas y el número de mesas fabricadas en la semana.<br>' +
      '<strong>Paso 2.</strong> La condición del conteo es la más simple, así que de ella se toma el número de sillas como el total de piezas menos el número de mesas.<br>' +
      '<strong>Paso 3.</strong> Esa expresión entra en la condición de las horas. Al distribuir, las ' + intN(c2hs) + ' horas de la silla se aplican al total de piezas y también, con signo contrario, a las mesas: ' + intN(c2hs) + ' horas por las ' + intN(c2N) + ' piezas dan ' + intN(c2all) + ' horas, y a cada mesa le queda la diferencia de ' + intN(c2gap) + ' horas.<br>' +
      '<strong>Paso 4.</strong> El reloj marcó ' + intN(c2H) + ' horas, es decir ' + intN(c2ex) + ' horas más que ese piso. Repartidas entre la diferencia de ' + intN(c2gap) + ' horas por mesa dan ' + frac(intN(c2ex), intN(c2gap)) + ' , o sea ' + intN(c2m) + ' mesas.<br>' +
      '<strong>Paso 5.</strong> Las sillas son ' + intN(c2N) + ' menos ' + intN(c2m) + ', es decir ' + intN(c2s) + '.<br>' +
      '<strong>Comprobación.</strong> ' + intN(c2s) + ' sillas ocupan ' + intN(c2hs * c2s) + ' horas y ' + intN(c2m) + ' mesas ocupan ' + intN(c2hm * c2m) + ' horas, que suman las ' + intN(c2H) + ' horas del reloj. Las piezas también cuadran, así que la pareja resuelve el sistema.</p></div>';
    return '' +
      '<div class="stag">Concept 2</div>' +
      '<h2>Substitution: trading one unknown for what the other is worth</h2>' +
      '<p>The extreme case argument works nicely when one of the conditions is a plain head count, but that luck does not always hold. The general method that does the same job in an orderly way is called <strong>substitution</strong>, and it takes two moves: from one condition you obtain one unknown written in terms of the other, and you drop that expression into the remaining condition. What comes out is a single equation with a single unknown, which then solves itself without mystery.</p>' +
      '<p>The delicate part is choosing where to start. Take the condition in which an unknown stands alone or carries a coefficient of one, because then the step brings in no fractions. In workshop problems that condition is usually the piece count: the number of chairs is the total minus the number of tables. Written that way, wherever the word chairs turns up you can drop that subtraction in its place.</p>' +
      '<p>The commonest slip in substitution is not algebraic but distributive. When a subtraction goes inside a multiplication, both of its terms must be multiplied, not just the first. Anyone who forgets the second half credits one product with time or money that belonged to the other, and the answer comes out wrong without any single operation looking wrong. That is why it always pays to test the pair you found against the original conditions rather than the intermediate ones.</p>' +
      '<p>Substitution also reads restrictions that have nothing to do with money. A workshop lives off its installed capacity, and carpentry hours are as scarce a resource as cash. When the manager knows the pieces delivered and the hours worked, he has exactly the two conditions he needs to split production by product line, and with that he can estimate what each line really costs before accepting the next order.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Key step</div><div class="rform">one in terms of the other</div><div class="rnote">Pick the simplest condition.</div></div>' +
        '<div class="rcard"><div class="rname">Hours per chair</div><div class="rform">' + intN(c2hs) + ' h</div><div class="rnote">Carpentry and assembly.</div></div>' +
        '<div class="rcard"><div class="rname">Hours per table</div><div class="rform">' + intN(c2hm) + ' h</div><div class="rnote">Bigger, so slower.</div></div>' +
        '<div class="rcard"><div class="rname">Risk</div><div class="rform">faulty distribution</div><div class="rnote">Both terms must be multiplied.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> The workshop delivered ' + intN(c2N) + ' pieces and the time clock logged ' + intN(c2H) + ' carpentry hours over the week. Each chair takes ' + intN(c2hs) + ' hours and each table ' + intN(c2hm) + ' hours. The manager wants to split output by product.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> The unknowns are the number of chairs and the number of tables built during the week.<br>' +
      '<strong>Step 2.</strong> The head count condition is the simpler one, so from it take the number of chairs as the total pieces minus the number of tables.<br>' +
      '<strong>Step 3.</strong> That expression goes into the hours condition. On distributing, the ' + intN(c2hs) + ' hours of a chair apply to the whole piece count and also, with the opposite sign, to the tables: ' + intN(c2hs) + ' hours across ' + intN(c2N) + ' pieces give ' + intN(c2all) + ' hours, and each table is left with the difference of ' + intN(c2gap) + ' hours.<br>' +
      '<strong>Step 4.</strong> The clock read ' + intN(c2H) + ' hours, that is ' + intN(c2ex) + ' hours above that floor. Spread over the ' + intN(c2gap) + ' hour difference per table they give ' + frac(intN(c2ex), intN(c2gap)) + ' , that is, ' + intN(c2m) + ' tables.<br>' +

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 3</div>' +
      '<h2>Eliminación: combinar dos registros para que una incógnita desaparezca</h2>' +
      '<p>Hay sistemas donde ninguna incógnita aparece sola y la sustitución obliga a arrastrar fracciones desde el primer renglón. Para esos casos existe el método de <strong>eliminación</strong>, que ataca el problema por otro lado: en lugar de despejar, combina las dos condiciones de modo que una de las incógnitas se cancele sola. La idea es sencilla y muy visual. Si dos pedidos incluyen exactamente la misma cantidad de un producto, al restar uno del otro ese producto desaparece y lo que sobra habla solamente del otro.</p>' +
      '<p>Cuando las cantidades no coinciden de entrada, se fabrica la coincidencia. Multiplicar una condición completa por un número no la altera: un pedido con el triple de piezas cuesta el triple, y sigue siendo una afirmación verdadera sobre los mismos precios unitarios. Multiplicando cada condición por el número adecuado se consigue que una de las incógnitas quede con la misma cantidad en las dos, y entonces la resta la borra. Ese es todo el mecanismo.</p>' +
      '<p>La eliminación resulta especialmente natural cuando las incógnitas son <strong>precios unitarios</strong> que el proveedor no quiso desglosar. Un comprador recibe dos facturas con mezclas distintas de los mismos artículos y solo ve los totales. Cada factura es una condición sobre los dos precios, y combinarlas revela lo que el proveedor no escribió. Es la técnica que sostiene buena parte del análisis de costos de compras en una empresa.</p>' +
      '<p>Conviene notar que sumar también sirve: si una incógnita aparece con signos opuestos en las dos condiciones, sumarlas la cancela. Restar o sumar no es una cuestión de gusto sino de signos, y equivocarse ahí es el tropiezo más común del método. Una vez obtenido el primer precio, el segundo sale sustituyéndolo en cualquiera de las dos condiciones originales, y esa elección libre es una buena oportunidad para comprobar: si las dos condiciones devuelven el mismo segundo precio, la solución es firme.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Idea</div><div class="rform">igualar y restar</div><div class="rnote">Una incógnita se cancela.</div></div>' +
        '<div class="rcard"><div class="rname">Permitido</div><div class="rform">multiplicar todo</div><div class="rnote">La condición sigue siendo cierta.</div></div>' +
        '<div class="rcard"><div class="rname">Diferencia</div><div class="rform">' + money(c3dT) + '</div><div class="rnote">Lo que separa a los dos pedidos.</div></div>' +
        '<div class="rcard"><div class="rname">Riesgo</div><div class="rform">signo equivocado</div><div class="rnote">Restar cuando tocaba sumar.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Un hotel de Manzanillo hizo dos pedidos a Muebles del Pacífico. El primero llevó ' + intN(c3a1) + ' sillas y ' + intN(c3b) + ' mesas por ' + money(c3T1) + '. El segundo llevó ' + intN(c3a2) + ' sillas y otra vez ' + intN(c3b) + ' mesas por ' + money(c3T2) + '. La factura nunca desglosó los precios unitarios y el comprador quiere conocerlos.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> Las incógnitas son el precio de una silla y el precio de una mesa.<br>' +
      '<strong>Paso 2.</strong> Los dos pedidos llevan la misma cantidad de mesas, ' + intN(c3b) + ', así que no hace falta multiplicar nada: la coincidencia ya está.<br>' +
      '<strong>Paso 3.</strong> Al restar el primer pedido del segundo, las mesas se cancelan por completo. La diferencia de ' + money(c3dT) + ' se debe únicamente a las ' + intN(c3ag) + ' sillas de más que llevó el segundo pedido.<br>' +
      '<strong>Paso 4.</strong> Repartida entre esas sillas adicionales, la diferencia da ' + frac(money(c3dT), intN(c3ag)) + ' , es decir ' + money(c3ps) + ' por silla.<br>' +
      '<strong>Paso 5.</strong> Ese precio entra en el primer pedido: las ' + intN(c3a1) + ' sillas valen ' + money(c3a1 * c3ps) + ', y el resto de la factura, ' + money(c3b * c3pm) + ', corresponde a las ' + intN(c3b) + ' mesas, de donde cada mesa cuesta ' + money(c3pm) + '.<br>' +
      '<strong>Comprobación.</strong> Con esos dos precios el segundo pedido da ' + money(c3T2) + ', que es exactamente lo facturado. Los precios unitarios quedaron reconstruidos sin que el proveedor los declarara.</p></div>';
    return '' +
      '<div class="stag">Concept 3</div>' +
      '<h2>Elimination: combining two records so an unknown disappears</h2>' +
      '<p>In some systems no unknown stands alone and substitution forces you to drag fractions along from the very first line. For those cases there is <strong>elimination</strong>, which comes at the problem from another angle: instead of isolating anything, it combines the two conditions so that one unknown cancels itself out. The idea is simple and highly visual. If two orders contain exactly the same quantity of one product, subtracting one from the other makes that product vanish, and what remains speaks only about the other.</p>' +
      '<p>When the quantities do not match to begin with, you manufacture the match. Multiplying a whole condition by a number does not damage it: an order with three times the pieces costs three times as much, and it remains a true statement about the same unit prices. By scaling each condition by a suitable number you can leave one unknown carrying the same quantity in both, and then subtraction wipes it out. That is the entire mechanism.</p>' +
      '<p>Elimination feels especially natural when the unknowns are <strong>unit prices</strong> that the supplier chose not to break down. A buyer receives two invoices with different mixes of the same items and sees only the totals. Each invoice is a condition on the two prices, and combining them reveals what the supplier never wrote. This technique underpins a good part of purchasing cost analysis in any company.</p>' +
      '<p>It is worth noting that adding works too: if an unknown carries opposite signs in the two conditions, adding them cancels it. Subtracting or adding is not a matter of taste but of signs, and getting that wrong is the commonest stumble in the method. Once the first price is out, the second follows by substituting it into either of the original conditions, and that free choice is a good chance to check your work: if both conditions return the same second price, the solution is solid.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Idea</div><div class="rform">match and subtract</div><div class="rnote">One unknown cancels.</div></div>' +
        '<div class="rcard"><div class="rname">Allowed</div><div class="rform">scale the whole line</div><div class="rnote">The condition stays true.</div></div>' +
        '<div class="rcard"><div class="rname">Difference</div><div class="rform">' + money(c3dT) + '</div><div class="rnote">What separates the two orders.</div></div>' +

      '<p><strong>Worked example.</strong> A hotel in Manzanillo placed two orders with Muebles del Pacífico. The first took ' + intN(c3a1) + ' chairs and ' + intN(c3b) + ' tables for ' + money(c3T1) + '. The second took ' + intN(c3a2) + ' chairs and again ' + intN(c3b) + ' tables for ' + money(c3T2) + '. The invoice never broke the unit prices out and the buyer wants to know them.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> The unknowns are the price of one chair and the price of one table.<br>' +
      '<strong>Step 2.</strong> Both orders carry the same number of tables, ' + intN(c3b) + ', so nothing needs scaling: the match is already there.<br>' +
      '<strong>Step 3.</strong> Subtracting the first order from the second cancels the tables entirely. The difference of ' + money(c3dT) + ' is due solely to the ' + intN(c3ag) + ' extra chairs the second order carried.<br>' +
      '<strong>Step 4.</strong> Spread over those extra chairs, the difference gives ' + frac(money(c3dT), intN(c3ag)) + ' , that is, ' + money(c3ps) + ' per chair.<br>' +
      '<strong>Step 5.</strong> That price goes into the first order: the ' + intN(c3a1) + ' chairs are worth ' + money(c3a1 * c3ps) + ', and the rest of the invoice, ' + money(c3b * c3pm) + ', belongs to the ' + intN(c3b) + ' tables, so each table costs ' + money(c3pm) + '.<br>' +
      '<strong>Check.</strong> With those two prices the second order comes to ' + money(c3T2) + ', exactly what was invoiced. The unit prices have been reconstructed without the supplier ever declaring them.</p></div>';
  });

  widgetEliminacion(w2a1, w2b1, w2T1, w2a2, w2b2, w2T2);

  /* ═══════════════════════ CONCEPTO 4 ═══════════════════════ */
  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 4</div>' +
      '<h2>Una respuesta, ninguna o infinitas: los tres desenlaces posibles</h2>' +
      '<p>Hasta aquí todos los sistemas tuvieron una respuesta y solo una. No siempre ocurre, y los otros dos desenlaces no son accidentes ni fallas del método: son información sobre el problema. Un sistema de dos condiciones lineales con dos incógnitas solo puede terminar de tres maneras, y cada una tiene una traducción directa al lenguaje del negocio.</p>' +
      '<p>El caso habitual es la <strong>solución única</strong>: las dos rectas tienen inclinaciones distintas y se cortan en un punto. En una comparación de proveedores eso significa que existe un volumen exacto en el que las dos ofertas cuestan lo mismo, y ese número separa dos decisiones de compra opuestas. Es la respuesta que un comprador busca antes de firmar.</p>' +
      '<p>El segundo caso es el <strong>sistema sin solución</strong>: las dos rectas tienen la misma inclinación pero arrancan en alturas distintas, de modo que son paralelas y jamás se tocan. Traducido al negocio, dos cotizaciones que cobran exactamente lo mismo por pieza y difieren solo en el cargo fijo nunca se igualan: la diferencia entre ellas se queda congelada en el mismo monto para cualquier volumen. Que el sistema no tenga solución es precisamente lo que le dice al comprador que aquí no hay nada que calcular, la más barata lo será siempre.</p>' +
      '<p>El tercer caso son las <strong>infinitas soluciones</strong>: las dos condiciones resultaron ser la misma escrita de otra forma, y sus rectas quedan encimadas. Esto aparece más seguido de lo que parece, sobre todo cuando un proveedor cotiza por docena y el otro por pieza, o cuando un reporte repite un dato ya contenido en otro. El sistema no aporta información suficiente para separar las incógnitas, y la única salida es conseguir un dato realmente nuevo. Reconocer este caso a tiempo evita horas perdidas buscando una respuesta que los datos no contienen.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Se cruzan</div><div class="rform">solución única</div><div class="rnote">Hay un volumen de empate.</div></div>' +
        '<div class="rcard"><div class="rname">Paralelas</div><div class="rform">sin solución</div><div class="rnote">La diferencia nunca se cierra.</div></div>' +

    exp: { es: 'Costa arranca ' + money(p10FC - p10FS) + ' más arriba por su cargo fijo, pero cobra ' + money(p10dv) + ' menos por pieza, de modo que recorta esa desventaja con cada envío y la termina de cerrar en ' + intN(p10q) + ' piezas, donde las dos cobran ' + money(p10FC + p10v * p10q) + '. Como el taller tiene comprometidas ' + intN(p10Q) + ' piezas, el mes queda ' + intN(p10ex) + ' piezas por encima del empate y conviene Costa, que a ese volumen cobra ' + money(p10dv * p10ex) + ' menos que Sierra. La respuesta que se queda con Sierra usa el punto de empate correcto pero invierte la lectura: por encima del cruce manda la tarifa por pieza, no el cargo fijo. La que sitúa el empate en ' + intN(p10w) + ' piezas reparte la diferencia de cargo fijo entre la suma de las dos tarifas en lugar de repartirla entre su diferencia, y por eso adelanta el cruce; llega a la misma recomendación por un camino que falla en cuanto el volumen cae entre las dos cifras. Y la que declara indiferente la elección ignora que las dos rectas se cruzan: precisamente porque se cruzan, hay un lado del punto en el que cada una gana.',
           en: 'Costa starts ' + money(p10FC - p10FS) + ' higher on its fixed charge, but it charges ' + money(p10dv) + ' less per piece, so it eats into that handicap with every shipment and closes it at ' + intN(p10q) + ' pieces, where both charge ' + money(p10FC + p10v * p10q) + '. Since the workshop has ' + intN(p10Q) + ' pieces committed, the month sits ' + intN(p10ex) + ' pieces above the tie and Costa wins, charging ' + money(p10dv * p10ex) + ' less than Sierra at that volume. The answer that picks Sierra uses the right tie point but reads it backwards: above the crossing the rate per piece rules, not the fixed charge. The answer placing the tie at ' + intN(p10w) + ' pieces divides the difference in fixed charge by the sum of the two rates instead of by their difference, which is why it brings the crossing forward; it happens to reach the same recommendation by a route that breaks as soon as the volume falls between the two figures. And the answer calling the choice indifferent ignores that the two lines do cross: precisely because they cross, each one wins on its own side of that point.' }
  }, o10.correctIdx, true);
}

/* ════════════════════════════════════════════════════════════════════════
   LANGUAGE
   Switching rebuilds visible text only. The numbers were drawn once by the
   seeded rng and never change with the language.
   ════════════════════════════════════════════════════════════════════════ */
function applyUIStrings() {
  var set = function(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
  var ph  = function(id, txt) { var e = document.getElementById(id); if (e) e.placeholder = txt; };
  set('wtitle-el',    SCHOOL.guideTitle[LANG]);
  set('wcourse-el',   SCHOOL.courseName[LANG]);
  set('htitle-el',    SCHOOL.guideTitle[LANG]);
  set('lbl-name-el',  t('lbl-name'));
  set('lbl-group-el', t('lbl-group'));
  set('startBtn',     t('btn-start'));
  set('restoreTitle', t('restore-title'));
  set('restoreMsg',   t('restore-msg'));
  set('restoreBtn',   t('btn-restore'));
  set('dismissBtn',   t('btn-dismiss'));
  set('dlBtn',        t('btn-pdf'));
  ph('sName',  t('ph-name'));
  ph('sGroup', t('ph-group'));
  var ll = document.getElementById('logo-left');  if (ll) ll.alt = SCHOOL.logoLeftAlt;
  var lr = document.getElementById('logo-right'); if (lr) lr.alt = SCHOOL.logoRightAlt;
}
/* Rebuilds the visible text of every card without touching the numbers. */
function applyProblemLang() {
  problems.forEach(function(p, i) {
    var card = document.getElementById('pc' + i);
    if (!card || !p.i18n) return;
    p.title = p.i18n.title[LANG];
    p.q     = p.i18n.q[LANG];
    p.hint  = p.i18n.hint[LANG];
    p.exp   = p.i18n.exp[LANG];
    p.opts  = p.i18n.opts[LANG].slice();
    var ti = card.querySelector('.ptitle'); if (ti) ti.textContent = p.title;
    var st = card.querySelector('.pstmt');  if (st) st.innerHTML = p.q;
    var hb = card.querySelector('.hintbox'); if (hb) hb.innerHTML = p.hint;
    var hbtn = card.querySelector('.hintbtn'); if (hbtn) hbtn.textContent = t('btn-hint');
    card.querySelectorAll('.mcopt').forEach(function(o, oi) {
      if (p.opts[oi] !== undefined) o.innerHTML = p.opts[oi];
    });
    var tabs = card.querySelectorAll('.wtab');
    if (tabs.length === 3) {
      tabs[0].textContent = t('tab-draw');
      tabs[1].textContent = t('tab-type');
      tabs[2].textContent = t('tab-photo');
    }
    var tools = card.querySelectorAll('.tbtn2');
    if (tools.length === 3) {
      tools[0].textContent = t('tool-pen');
      tools[1].textContent = t('tool-mark');
      tools[2].textContent = t('tool-erase');
    }
    var clr = card.querySelector('.clrbtn'); if (clr) clr.textContent = t('tool-clear');
    var ta  = card.querySelector('.wtextarea'); if (ta) ta.placeholder = t('ph-work');
    var pzt = card.querySelector('.pztxt'); if (pzt) pzt.textContent = t('ph-photo');
    var lab = card.querySelector('.pbody > div:last-child > div:first-child');
    if (lab) lab.textContent = t('lbl-answer');
    var fb = card.querySelector('.mcfb');
    if (fb && fb.classList.contains('show')) {
      var isOk = (p.studentChoice === p.correctIdx);
      fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + p.exp;
    }
  });
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.documentElement.setAttribute('lang', l);
  var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
  if (be) be.classList.toggle('active', l === 'es');
  if (bn) bn.classList.toggle('active', l === 'en');
  applyUIStrings();
  applySectionLang();
  applyProblemLang();
  widgets.forEach(function(f) { try { f(); } catch(e) {} });
  document.querySelectorAll('#lessonBody .section').forEach(function(s) { s.classList.add('vis'); });
}
(function() {
  try { var stored = localStorage.getItem(LANG_KEY); if (stored === 'es' || stored === 'en') LANG = stored; } catch(e) {}
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.setAttribute('lang', LANG);
    var be = document.getElementById('btn-es'), bn = document.getElementById('btn-en');
    if (be) be.classList.toggle('active', LANG === 'es');
    if (bn) bn.classList.toggle('active', LANG === 'en');
    applyUIStrings();
  });
})();

/* ════════════════════════════════════════════════════════════════════════
   PDF
   ════════════════════════════════════════════════════════════════════════ */
async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = t('pdf-busy');
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;

  /* Flattens the fraction markup into a slash before the tags are stripped,
     so a rational expression stays readable in the printed sheet. */
  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<span class="mf-den">/g, ' / ')
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/’/g, String.fromCharCode(39))
      .replace(/→/g,'->').replace(/−/g,'-').replace(/²/g,'^2')
      .replace(/³/g,'^3').replace(/×/g,'x').replace(/÷/g,'/')
      .replace(/≠/g,'!=').replace(/≤/g,'<=').replace(/≥/g,'>=')
      .replace(/√/g,'sqrt').replace(/π/g,'pi').replace(/…/g,'...')
      .replace(/·/g,'*').replace(/\s+/g,' ').trim();
  }

  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');

  var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
  try { doc.addImage(SCHOOL.logoLeftB64,  fmtL, M,  4.0, 22, 22); } catch(e) {}
  try { doc.addImage(SCHOOL.logoRightB64, fmtR, 48, 4.5, 48, 21); } catch(e) {}

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  doc.setTextColor(240,244,238); doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text(SCHOOL.guideTitle[LANG], M, 49);
  doc.setTextColor(198,214,192); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text(t('pdf-student'), M+4, 79); doc.text(t('pdf-group'), 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' '+t('pdf-score')+' '+total+' '+t('pdf-questions'), PW/2, 131, {align:'center'});

  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text(t('pdf-summary'), M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text(t('pdf-summary2'), M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'v':'x', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text(t('pdf-item')+' '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?t('pdf-ok'):t('pdf-bad'), PW-M-24, sy+6.5);
    sy += 12;
  });

  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SCHOOL.courseName[LANG]+'  ·  '+SCHOOL.guideTitle[LANG], M, 10);
    doc.setTextColor(240,244,238); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-item')+' '+(i+1)+' '+t('pdf-of')+' '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.q);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text(t('pdf-question'), M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.opts[prob.studentChoice]||'') : '';
    var corr   = pdfText(prob.opts[prob.correctIdx]||'');
    var expRaw = pdfText(prob.exp||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize(t('pdf-yours')+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize(t('pdf-key')+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize(t('pdf-sol')+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'v':'x', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
      wy += 11;
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save(SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.textContent = t('btn-pdf');
  btn.disabled  = false;
}
