/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'La pregunta más grande de la biología', en:'The biggest question in biology' }),
    '<p>' + L({
      es:'Cuenta las cosas vivas que caben en una foto de un terreno cualquiera: hierbas de tres o cuatro clases, hormigas, una araña, un pájaro, el moho de una fruta caída. Ahora pregúntate lo que nadie te ha respondido todavía: por qué hay tantas clases distintas, y por qué cada una parece hecha a la medida del sitio donde vive. Durante siglos esa pregunta no tuvo una respuesta que se pudiera poner a prueba.',
      en:'Count the living things that fit in a photo of any patch of ground: herbs of three or four kinds, ants, a spider, a bird, the mould on a fallen fruit. Now ask yourself what nobody has answered for you yet: why are there so many different kinds, and why does each one look made to measure for the place where it lives. For centuries that question had no answer that could be put to the test.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Lo que vas a hacer: ', en:'What you are going to do: ' }) + '</strong>' + L({
      es:'vas a ordenar los pasos de dos viajes que terminaron en la misma idea, a medir picos de un muestreo para ver de cuánto es la variación, a separar lo que un ser vivo hereda de lo que le pasa en la vida, a mover un cursor hasta dejar fuera a las semillas que no caben, y a correr generaciones en una isla para ver qué cambia y qué no.',
      en:'you are going to put in order the steps of two voyages that ended in the same idea, measure beaks from a sample to see how large the variation is, separate what a living thing inherits from what happens to it during life, move a slider until the seeds that do not fit are left out, and run generations on an island to see what changes and what does not.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Dos viajes que terminaron en la misma idea', en:'Two voyages that ended in the same idea' }),
    '<p>' + L({
      es:'Charles Darwin pasó cinco años a bordo de un barco que recorría las costas de Sudamérica. Bajaba a tierra, recogía plantas, insectos, huesos y conchas, y anotaba dónde había encontrado cada cosa. En las islas Galápagos le llamó la atención algo pequeño: aves y tortugas muy parecidas entre sí, pero no idénticas, y con diferencias que iban de una isla a la siguiente. De regreso tardó más de veinte años en ordenar lo que había visto.',
      en:'Charles Darwin spent five years aboard a ship travelling the coasts of South America. He went ashore, collected plants, insects, bones and shells, and wrote down where he had found each thing. In the Galapagos Islands something small caught his attention: birds and tortoises very much alike, yet not identical, with differences that shifted from one island to the next. Back home he took more than twenty years to sort out what he had seen.'
    }) + '</p>' +
    '<p>' + L({
      es:'Al mismo tiempo, y sin saberlo, Alfred Russel Wallace hacía un trabajo parecido en el Amazonas y después en las islas del sudeste de Asia, donde vivió años recolectando ejemplares. Wallace escribió su explicación y se la envió por correo a Darwin, que llevaba dos décadas escribiendo la suya. En mil ochocientos cincuenta y ocho los dos trabajos se leyeron el mismo día ante la comunidad científica de Londres, y al año siguiente Darwin publicó el libro donde reunió las pruebas. Que dos personas separadas por medio mundo, mirando seres vivos distintos, lleguen a lo mismo es la clase de coincidencia que en ciencia pesa mucho.',
      en:'At the same time, and without knowing it, Alfred Russel Wallace was doing similar work in the Amazon and later in the islands of southeast Asia, where he lived for years collecting specimens. Wallace wrote up his explanation and posted it to Darwin, who had spent two decades writing his own. In eighteen fifty eight the two works were read on the same day before the scientific community of London, and the following year Darwin published the book where he gathered the evidence. Two people half a world apart, looking at different living things, arriving at the same result: that is the kind of coincidence that carries a lot of weight in science.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Darwin', en:'Darwin' }), L({ es:'costas y Galápagos', en:'coasts and Galapagos' }), L({ es:'cinco años de viaje, veinte de trabajo', en:'five years travelling, twenty working' })) +
      rcard(L({ es:'Wallace', en:'Wallace' }), L({ es:'Amazonas y sudeste de Asia', en:'Amazon and southeast Asia' }), L({ es:'llegó a lo mismo por su cuenta', en:'got there on his own' })) +
      rcard(L({ es:'1858', en:'1858' }), L({ es:'lectura conjunta', en:'joint reading' }), L({ es:'los dos textos, el mismo día', en:'both texts, the same day' })) +
      rcard(L({ es:'1859', en:'1859' }), L({ es:'el libro', en:'the book' }), L({ es:'las pruebas reunidas y ordenadas', en:'the evidence gathered and ordered' })) +
    '</div>'
  );
  wVoyages(rng, widgetHost(s1, 'w_viajes', 'timeline'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Primer eslabón: dentro de una población nadie es idéntico', en:'First link: inside a population nobody is identical' }),
    '<p>' + L({
      es:'La explicación se arma con cuatro observaciones encadenadas, y ninguna de las cuatro es difícil de comprobar. La primera es la variación: si tomas cualquier grupo de seres vivos de la misma especie y del mismo lugar, y mides algo en cada uno, los números no salen iguales. Las hormigas de un hormiguero no miden todas lo mismo; las semillas de un mismo árbol tienen pesos distintos; los picos de las aves de una isla van de cortos a largos con todos los tamaños intermedios.',
      en:'The explanation is built from four chained observations, and none of the four is hard to check. The first is variation: take any group of living things of the same species from the same place, measure something in each one, and the numbers do not come out equal. The ants of one nest do not all measure the same; the seeds of one tree have different weights; the beaks of the birds on an island run from short to long with every size in between.'
    }) + '</p>' +
    '<p>' + L({
      es:'Conviene no confundir la variación con otras diferencias. Que una hormiga sea distinta de una abeja no es variación: son especies distintas. Que en verano haya más hormigas que en invierno tampoco: es una diferencia entre momentos. La variación es la diferencia entre individuos del mismo grupo, en el mismo sitio y al mismo tiempo, y se nota cuando en vez de mirar por encima te pones a medir.',
      en:'It pays not to confuse variation with other differences. An ant being different from a bee is not variation: they are different species. There being more ants in summer than in winter is not variation either: that is a difference between moments. Variation is the difference between individuals of the same group, in the same place and at the same time, and it shows up when instead of glancing you start measuring.'
    }) + '</p>'
  );
  wMeasure(rng, widgetHost(s2, 'w_muestreo', 'measure'));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Segundo eslabón: parte de esa variación pasa a las crías', en:'Second link: part of that variation passes to the offspring' }),
    '<p>' + L({
      es:'De poco serviría la variación si terminara con cada individuo. El segundo eslabón dice que una parte de esas diferencias se hereda: las crías se parecen a sus padres más de lo que se parecen a cualquier otro miembro de la población. Los hijos de los ratones de pelaje oscuro nacen, en su mayoría, con pelaje oscuro; las semillas de la planta de granos grandes dan plantas de granos grandes.',
      en:'Variation would be of little use if it ended with each individual. The second link says that part of those differences is inherited: offspring resemble their parents more than they resemble any other member of the population. The young of dark furred mice are born, for the most part, with dark fur; the seeds of the large grained plant give large grained plants.'
    }) + '</p>' +
    '<p>' + L({
      es:'Y otra parte no se hereda. Una cicatriz, una pata rota, los músculos que un animal gana de tanto trabajar o el peso que sube en un invierno con mucha comida son cosas que le ocurren al individuo durante su vida y que no viajan a la siguiente generación. La pregunta que separa una cosa de la otra es sencilla: ¿el ser vivo llegó con eso al nacer, o le pasó después?',
      en:'And another part is not inherited. A scar, a broken leg, the muscles an animal builds from hard work or the weight it puts on in a winter with plenty of food are things that happen to the individual during its life and that do not travel to the next generation. The question that tells one from the other is simple: did the living thing arrive with it at birth, or did it happen afterwards?'
    }) + '</p>'
  );
  wInherit(rng, widgetHost(s3, 'w_herencia', 'classify'));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Tercer eslabón: nacen más de los que caben', en:'Third link: more are born than fit' }),
    '<p>' + L({
      es:'Un mezquite suelta cientos de semillas cada temporada, una rana pone cientos de huevos, un pez suelta miles de huevecillos. Si todos llegaran a adultos, en pocos años no cabría nada más en el terreno. Pero el número de mezquites del terreno se mantiene parecido año con año, y eso solo puede significar una cosa: la enorme mayoría de los descendientes no llega a reproducirse.',
      en:'A mesquite drops hundreds of seeds each season, a frog lays hundreds of eggs, a fish releases thousands of tiny eggs. If they all reached adulthood, within a few years nothing else would fit on the ground. Yet the number of mesquites on the ground stays about the same year after year, and that can only mean one thing: the vast majority of the offspring never get to reproduce.'
    }) + '</p>' +
    '<p>' + L({
      es:'El lugar tiene un límite: hay tanta luz, tanta agua, tanto alimento y tanto espacio, y no más. Por eso hay competencia, aunque no se parezca a una pelea: casi siempre es una carrera silenciosa por el hueco con luz, por la semilla que quedó, por el escondite donde el depredador no mira. Quién queda dentro y quién queda fuera no se decide al azar del todo, y ahí entra el cuarto eslabón.',
      en:'The place has a limit: there is only so much light, water, food and space, and no more. That is why there is competition, even if it looks nothing like a fight: it is nearly always a silent race for the gap with light, for the seed still left, for the hiding place the predator does not check. Who stays in and who is left out is not decided purely by chance, and that is where the fourth link comes in.'
    }) + '</p>'
  );
  wSeeds(rng, widgetHost(s4, 'w_semillas', 'slider'));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Cuarto eslabón: la ventaja se cobra en descendencia', en:'Fourth link: the advantage is paid in offspring' }),
    '<p>' + L({
      es:'Si en una población hay variación, si esa variación se hereda y si no todos alcanzan a reproducirse, entonces basta con que una de las variantes dé alguna ventaja en ese ambiente para que sus portadores dejen, en promedio, más crías que los demás. Como la variante se hereda, en la siguiente generación habrá una proporción un poco mayor de individuos que la llevan. Repite eso muchas generaciones y la población entera termina siendo distinta. A eso le llamaron selección natural.',
      en:'If a population has variation, if that variation is inherited and if not all of them get to reproduce, then it is enough for one of the variants to give some advantage in that environment for its carriers to leave, on average, more young than the rest. Since the variant is inherited, in the next generation there will be a slightly larger proportion of individuals carrying it. Repeat that for many generations and the whole population ends up different. They called this natural selection.'
    }) + '</p>' +
    '<p>' + L({
      es:'Aquí está el punto donde casi todo el mundo se equivoca la primera vez: ningún individuo cambia. El ave de pico corto no alarga su pico porque las semillas se pusieron duras, ni el lobo se fabrica un pelaje más espeso porque llegó el frío. Lo que cambia es la proporción de cada variante dentro de la población, y ese cambio solo se ve al comparar generaciones. Con suficiente tiempo, y sobre todo cuando dos poblaciones quedan separadas y siguen caminos distintos, las diferencias se acumulan hasta que ya se trata de especies distintas. Esa es la respuesta al origen de la biodiversidad.',
      en:'Here is the point where nearly everyone slips the first time: no individual changes. The short beaked bird does not lengthen its beak because the seeds turned hard, nor does the wolf manufacture thicker fur because the cold arrived. What changes is the proportion of each variant inside the population, and that change is only visible by comparing generations. With enough time, and above all when two populations are separated and follow different paths, the differences pile up until they are already different species. That is the answer to the origin of biodiversity.'
    }) + '</p>'
  );
  wIsland(rng, widgetHost(s5, 'w_isla', 'simulation'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 6 ══ */
  var s6 = sec(
    L({ es:'Concepto 6', en:'Concept 6' }),
    L({ es:'Una explicación que se sigue construyendo', en:'An explanation that is still being built' }),
    '<p>' + L({
      es:'La explicación tenía un hueco grande y sus autores lo sabían: nadie podía decir cómo pasan las características de una generación a la siguiente. En su tiempo no se conocía el material hereditario ni las reglas de la herencia. Décadas después se describió cómo se heredan las características, y más tarde se aprendió a comparar el material hereditario de dos especies para medir qué tanto se parecen. Ninguno de esos hallazgos tiró la explicación: llenaron el hueco y le dieron precisión.',
      en:'The explanation had a big gap and its authors knew it: nobody could say how characteristics pass from one generation to the next. In their time neither the hereditary material nor the rules of inheritance were known. Decades later it was described how characteristics are inherited, and later still people learned to compare the hereditary material of two species to measure how alike they are. None of those findings knocked the explanation down: they filled the gap and made it precise.'
    }) + '</p>' +
    '<p>' + L({
      es:'Así trabaja la ciencia. Una explicación se sostiene mientras la evidencia la respalde, se ajusta cuando aparece evidencia que no encaja y se cambia por otra cuando ya no alcanza. Darwin y Wallace tampoco pensaban igual en todo y discutieron entre ellos varios puntos. Nada de eso le resta valor a lo que propusieron: hoy es una de las explicaciones mejor sostenidas de toda la biología, y sigue siendo un trabajo abierto.',
      en:'That is how science works. An explanation holds while the evidence backs it, it is adjusted when evidence appears that does not fit, and it is replaced by another when it is no longer enough. Darwin and Wallace did not think alike about everything either and they argued with each other over several points. None of that takes value away from what they proposed: today it is one of the best supported explanations in all of biology, and it is still open work.'
    }) + '</p>'
  );
  wReflect(rng, widgetHost(s6, 'w_cuaderno', 'reflect'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE :: sin explicación previa (Rule 1) ══ */
  sec(
    L({ es:'Para cerrar', en:'To close' }),
    L({ es:'Tú decides', en:'Your call' }),
    '<p>' + L({
      es:'Dos situaciones más, con los cuatro eslabones ya en la mano.',
      en:'Two more situations, with the four links already in hand.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: los dos viajes  (drag-and-drop, sin números)
   Seis fichas revueltas; el alumno las arrastra hasta el orden correcto.
   Sin números de posición: sólo el texto. Comprobar + 3 fallas = reveal.
   ══════════════════════════════════════════════════════════════════════════ */
function wVoyages(rng, host){
  var EV = [
    { es:'Darwin zarpa en un barco que recorrerá durante cinco años las costas de Sudamérica.',
      en:'Darwin sets sail on a ship that will travel the coasts of South America for five years.' },
    { es:'En las islas Galápagos anota diferencias entre aves y tortugas de islas vecinas.',
      en:'In the Galapagos Islands he notes differences between birds and tortoises of neighbouring islands.' },
    { es:'Wallace recolecta durante años en el Amazonas y en las islas del sudeste de Asia.',
      en:'Wallace collects for years in the Amazon and in the islands of southeast Asia.' },
    { es:'Wallace le envía a Darwin un escrito con la misma explicación a la que él había llegado.',
      en:'Wallace posts Darwin a paper with the same explanation he himself had reached.' },
    { es:'Los dos trabajos se leen el mismo día ante la comunidad científica de Londres.',
      en:'Both works are read on the same day before the scientific community of London.' },
    { es:'Darwin publica el libro donde reúne y ordena las pruebas.',
      en:'Darwin publishes the book where he gathers and orders the evidence.' }
  ];
  var order = shuffle([0,1,2,3,4,5], rng);
  var ok0 = true;
  for (var z = 0; z < order.length; z++) if (order[z] !== z) ok0 = false;
  if (ok0) order = [2,0,5,1,3,4];
  var tries = 0, done = false;

  /* inject drag-and-drop CSS once */
  if (!document.getElementById('voyagesDragCSS')) {
    var ds = document.createElement('style');
    ds.id = 'voyagesDragCSS';
    ds.textContent = [
      '.voy-list{display:flex;flex-direction:column;gap:.35rem;margin:.55rem 0 .1rem;user-select:none;}',
      '.voy-chip{border:1.5px solid var(--border);border-radius:9px;padding:.55rem .75rem;',
        'background:var(--surface2);font-size:.82rem;color:var(--text);cursor:grab;',
        'display:flex;gap:.5rem;align-items:flex-start;text-align:left;width:100%;',
        'min-height:44px;transition:box-shadow .12s,opacity .12s;line-height:1.35;}',
      '.voy-chip:active{cursor:grabbing;}',
      '.voy-chip.dragging{opacity:.45;box-shadow:none;}',
      '.voy-chip.drag-over{border-color:var(--gold);background:var(--gold-bg);box-shadow:0 0 0 2px var(--gold);}',
      '.voy-chip.locked{cursor:default;border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}',
      '.voy-drag-handle{font-size:.85rem;color:var(--text3);flex-shrink:0;margin-top:.05rem;}',
    ].join('');
    document.head.appendChild(ds);
  }

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La línea de los dos viajes', en:'The line of the two voyages' }) + '</div>' +
    '<div class="gw-q">' + L({ es:'Arrastra las fichas hasta ordenarlas del primer al último momento.', en:'Drag the cards to put them in order from first to last.' }) + '</div>' +
    '<div class="gw-mini">' + L({
      es:'Agarra una ficha por el ícono ⠿ y suéltala en la posición que crees correcta.',
      en:'Grab a card by the ⠿ icon and drop it in the position you think is correct.'
    }) + '</div>' +
    '<div class="voy-list" id="voyList_' + host.id + '"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elL = document.getElementById('voyList_' + host.id);
  var elK = host.querySelector('[data-r="chk"]');
  var dragSrc = null;

  function render(){
    elL.innerHTML = order.map(function(ei, pos){
      var cls = 'voy-chip' + (done ? ' locked' : '');
      var draggable = done ? '' : ' draggable="true"';
      return '<div class="' + cls + '" data-p="' + pos + '"' + draggable + '>' +
        (!done ? '<span class="voy-drag-handle">⠿</span>' : '<span class="voy-drag-handle">✓</span>') +
        '<span>' + L(EV[ei]) + '</span></div>';
    }).join('');

    if (!done) attachDrag();
  }

  function attachDrag(){
    var chips = elL.querySelectorAll('.voy-chip');
    chips.forEach(function(chip){
      chip.addEventListener('dragstart', function(e){
        dragSrc = chip;
        chip.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', chip.getAttribute('data-p'));
      });
      chip.addEventListener('dragend', function(){
        chip.classList.remove('dragging');
        elL.querySelectorAll('.voy-chip').forEach(function(c){ c.classList.remove('drag-over'); });
      });
      chip.addEventListener('dragover', function(e){
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (chip !== dragSrc) chip.classList.add('drag-over');
      });
      chip.addEventListener('dragleave', function(){
        chip.classList.remove('drag-over');
      });
      chip.addEventListener('drop', function(e){
        e.preventDefault();
        chip.classList.remove('drag-over');
        if (!dragSrc || dragSrc === chip) return;
        var fromPos = parseInt(dragSrc.getAttribute('data-p'), 10);
        var toPos   = parseInt(chip.getAttribute('data-p'), 10);
        /* insert fromPos before/after toPos */
        var moved = order.splice(fromPos, 1)[0];
        var newTo = toPos > fromPos ? toPos - 1 : toPos;
        order.splice(newTo, 0, moved);
        render();
      });
    });

    /* touch drag for mobile */
    var touchItem = null, touchClone = null, touchFromPos = -1;
    chips.forEach(function(chip){
      chip.addEventListener('touchstart', function(e){
        touchFromPos = parseInt(chip.getAttribute('data-p'), 10);
        touchItem = chip;
        var rect = chip.getBoundingClientRect();
        touchClone = chip.cloneNode(true);
        touchClone.style.cssText = 'position:fixed;left:' + rect.left + 'px;top:' + rect.top + 'px;width:' + rect.width + 'px;opacity:.7;pointer-events:none;z-index:9999;border-color:var(--gold);';
        document.body.appendChild(touchClone);
        chip.style.opacity = '0.35';
      }, { passive: true });
      chip.addEventListener('touchmove', function(e){
        if (!touchClone) return;
        var t = e.touches[0];
        touchClone.style.left = (t.clientX - 20) + 'px';
        touchClone.style.top  = (t.clientY - 22) + 'px';
        elL.querySelectorAll('.voy-chip').forEach(function(c){ c.classList.remove('drag-over'); });
        var el = document.elementFromPoint(t.clientX, t.clientY);
        var target = el ? el.closest('.voy-chip') : null;
        if (target && target !== touchItem) target.classList.add('drag-over');
      }, { passive: true });
      chip.addEventListener('touchend', function(e){
        if (touchClone){ document.body.removeChild(touchClone); touchClone = null; }
        if (touchItem) { touchItem.style.opacity = ''; touchItem = null; }
        elL.querySelectorAll('.voy-chip').forEach(function(c){ c.classList.remove('drag-over'); });
        var t = e.changedTouches[0];
        var el = document.elementFromPoint(t.clientX, t.clientY);
        var target = el ? el.closest('.voy-chip') : null;
        if (!target || target === chip) return;
        var toPos = parseInt(target.getAttribute('data-p'), 10);
        var moved = order.splice(touchFromPos, 1)[0];
        var newTo = toPos > touchFromPos ? toPos - 1 : toPos;
        order.splice(newTo, 0, moved);
        render();
      }, { passive: true });
    });
  }

  elK.addEventListener('click', function(){
    if (done) return;
    var bad = -1;
    for (var i = 0; i < order.length; i++) if (order[i] !== i){ bad = i; break; }
    if (bad < 0){
      done = true; render();
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved'; elK.disabled = true;
      say(host, 'good', L({
        es:'Ese es el orden. Fíjate en lo que cuenta: los dos recorridos avanzaron en paralelo durante años sin tocarse, y solo se cruzaron cuando cada uno ya tenía su explicación escrita.',
        en:'That is the order. Notice what it tells you: the two journeys ran in parallel for years without touching, and they only crossed once each one already had his explanation written down.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      order = [0,1,2,3,4,5]; done = true; render();
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved'; elK.disabled = true;
      say(host, 'miss', L({
        es:'Este es el orden real. Léelo de arriba abajo: primero los años de recolección de cada uno, después el escrito que Wallace envía, luego la lectura conjunta y al final el libro con las pruebas.',
        en:'This is the real order. Read it top to bottom: first the years each one spent collecting, then the paper Wallace sends, then the joint reading and finally the book with the evidence.'
      }));
      return;
    }
    say(host, 'warm', L({
      es:'Todavía no está en el orden correcto. Intenta mover alguna ficha y vuelve a comprobar.',
      en:'Not in the right order yet. Try moving a card and check again.'
    }));
  });

  render();
  say(host, '', L({
    es:'Empieza por el momento que no depende de ningún otro para poder ocurrir.',
    en:'Start with the moment that does not depend on any other in order to happen.'
  }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: el muestreo de picos  (rediseño)
   Ocho fichas boca abajo. El alumno las voltea para ver la medida, luego
   arrastra la que considera el pico más largo a un bloque "Más largo" y la
   más corta a "Más corto", y finalmente escribe la diferencia.
   El widget nunca revela cuál es el más largo/corto hasta que el alumno lo
   determina. Tres muestreos (Rule 8).
   ══════════════════════════════════════════════════════════════════════════ */
function wMeasure(rng, host){
  var round = 0, tries = 0, done = false, data = null;
  var placedLong = null, placedShort = null, diffInput = null;

  /* inject CSS once */
  if (!document.getElementById('measureCSS')) {
    var ms = document.createElement('style');
    ms.id = 'measureCSS';
    ms.textContent = [
      '.ms-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin:.55rem 0;}',
      '@media(max-width:500px){.ms-grid{grid-template-columns:repeat(3,1fr);}}',
      '.ms-tile{min-height:56px;padding:.35rem .25rem;border:1.5px solid var(--border);border-radius:8px;',
        'background:var(--surface2);color:var(--text2);font-family:inherit;font-size:.72rem;',
        'line-height:1.25;cursor:pointer;display:flex;flex-direction:column;align-items:center;',
        'justify-content:center;text-align:center;transition:all .14s;user-select:none;}',
      '.ms-tile:hover:not(.flipped):not(.locked){border-color:var(--green);background:var(--green-bg);}',
      '.ms-tile.flipped{background:var(--surface);color:var(--text);cursor:grab;border-color:var(--border);}',
      '.ms-tile.flipped:active{cursor:grabbing;}',
      '.ms-tile.locked{cursor:default;opacity:.55;}',
      '.ms-tile b{display:block;font-family:"IBM Plex Mono",monospace;font-size:.92rem;font-weight:700;}',
      '.ms-zones{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:.7rem 0;}',
      '.ms-zone{min-height:62px;border:2px dashed var(--border);border-radius:10px;',
        'display:flex;flex-direction:column;align-items:center;justify-content:center;',
        'padding:.45rem;text-align:center;transition:border-color .15s,background .15s;',
        'background:var(--surface2);}',
      '.ms-zone.hover-target{border-color:var(--gold);background:var(--gold-bg);}',
      '.ms-zone.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);}',
      '.ms-zone-lbl{font-size:.65rem;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:.25rem;}',
      '.ms-zone-val{font-family:"IBM Plex Mono",monospace;font-size:1rem;font-weight:700;color:var(--ok);}',
      '.ms-diff-row{display:flex;align-items:center;gap:.5rem;margin:.5rem 0;}',
      '.ms-diff-in{width:5ch;padding:.4rem .5rem;border:1.5px solid var(--border);border-radius:7px;',
        'background:var(--surface);color:var(--text);font-family:"IBM Plex Mono",monospace;',
        'font-size:1rem;font-weight:700;text-align:center;}',
      '.ms-diff-in:focus{outline:none;border-color:var(--green);}',
    ].join('');
    document.head.appendChild(ms);
  }

  function buildRound(){
    var base = ri(rng, 8, 11);
    var spread = ri(rng, 4, 7);
    var v = [base, base + spread];
    for (var i = 0; i < 6; i++) v.push(ri(rng, base, base + spread));
    return { base:base, spread:spread, v:shuffle(v, rng), flipped:[], longPlaced:null, shortPlaced:null };
  }

  function buildUI(){
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'El muestreo', en:'The sample' }) + '</div>' +
      '<div class="gw-q" data-r="q"></div>' +
      '<div class="gw-mini">' + L({
        es:'1 · Toca cada ficha para ver la medida del pico. &nbsp;2 · Arrastra la ficha del pico más largo al bloque "Más largo" y la del más corto a "Más corto". &nbsp;3 · Escribe la diferencia.',
        en:'1 · Tap each card to reveal the beak measurement. &nbsp;2 · Drag the card with the longest beak to the "Longest" block and the shortest to "Shortest". &nbsp;3 · Enter the difference.'
      }) + '</div>' +
      '<div class="ms-grid" data-r="grid"></div>' +
      '<div class="ms-zones">' +
        '<div class="ms-zone" id="ms_zone_long_' + host.id + '">' +
          '<div class="ms-zone-lbl">' + L({ es:'Más largo', en:'Longest' }) + '</div>' +
          '<div class="ms-zone-val" data-r="zlong">–</div>' +
        '</div>' +
        '<div class="ms-zone" id="ms_zone_short_' + host.id + '">' +
          '<div class="ms-zone-lbl">' + L({ es:'Más corto', en:'Shortest' }) + '</div>' +
          '<div class="ms-zone-val" data-r="zshort">–</div>' +
        '</div>' +
      '</div>' +
      '<div class="ms-diff-row">' +
        '<span class="steplbl">' + L({ es:'Diferencia:', en:'Difference:' }) + '</span>' +
        '<input class="ms-diff-in" data-r="diffin" type="number" min="0" max="20" placeholder="?">' +
        '<span class="steplbl">mm</span>' +
      '</div>' +
      '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
      '<div class="gw-fb"></div>';

    var elQ = host.querySelector('[data-r="q"]'),
        elG = host.querySelector('[data-r="grid"]'),
        elZL = host.querySelector('[data-r="zlong"]'),
        elZS = host.querySelector('[data-r="zshort"]'),
        elDI = host.querySelector('[data-r="diffin"]'),
        elK  = host.querySelector('[data-r="chk"]');

    var zoneL = document.getElementById('ms_zone_long_'  + host.id);
    var zoneS = document.getElementById('ms_zone_short_' + host.id);

    elQ.textContent = L({
      es:'Muestreo ' + (round + 1) + ' de 3',
      en:'Sample ' + (round + 1) + ' of 3'
    });

    var dragSrcIdx = null;

    function renderGrid(){
      elG.innerHTML = data.v.map(function(mm, i){
        var flipped = data.flipped[i] || data.longPlaced === i || data.shortPlaced === i;
        var locked  = data.longPlaced === i || data.shortPlaced === i;
        var cls = 'ms-tile' + (flipped ? ' flipped' : '') + (locked ? ' locked' : '');
        return '<div class="' + cls + '" data-i="' + i + '" ' +
          (flipped && !locked ? 'draggable="true"' : '') + '>' +
          (flipped ? L({ es:'ave', en:'bird' }) + ' ' + (i+1) + '<b>' + mm + ' mm</b>' :
                     L({ es:'ave', en:'bird' }) + ' ' + (i+1) + '<b>?</b>') +
          '</div>';
      }).join('');

      elG.querySelectorAll('.ms-tile').forEach(function(tile){
        var i = parseInt(tile.getAttribute('data-i'), 10);
        /* flip on click */
        if (!data.flipped[i] && data.longPlaced !== i && data.shortPlaced !== i){
          tile.addEventListener('click', function(){
            data.flipped[i] = true; renderGrid();
          });
        }
        /* drag start */
        if (data.flipped[i] && data.longPlaced !== i && data.shortPlaced !== i){
          tile.addEventListener('dragstart', function(e){
            dragSrcIdx = i;
            tile.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });
          tile.addEventListener('dragend', function(){ tile.classList.remove('dragging'); });
        }
        /* touch drag for mobile */
        if (data.flipped[i] && data.longPlaced !== i && data.shortPlaced !== i){
          var clone = null;
          tile.addEventListener('touchstart', function(){
            dragSrcIdx = i;
            clone = tile.cloneNode(true);
            var r = tile.getBoundingClientRect();
            clone.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;opacity:.65;pointer-events:none;z-index:9999;';
            document.body.appendChild(clone);
            tile.style.opacity = '0.35';
          }, { passive:true });
          tile.addEventListener('touchmove', function(e){
            if (!clone) return;
            var t = e.touches[0];
            clone.style.left = (t.clientX - 30) + 'px';
            clone.style.top  = (t.clientY - 28) + 'px';
            [zoneL, zoneS].forEach(function(z){ z.classList.remove('hover-target'); });
            var el = document.elementFromPoint(t.clientX, t.clientY);
            if (el && el.closest('#ms_zone_long_' + host.id))  zoneL.classList.add('hover-target');
            if (el && el.closest('#ms_zone_short_' + host.id)) zoneS.classList.add('hover-target');
          }, { passive:true });
          tile.addEventListener('touchend', function(e){
            if (clone){ document.body.removeChild(clone); clone = null; }
            tile.style.opacity = '';
            [zoneL, zoneS].forEach(function(z){ z.classList.remove('hover-target'); });
            var t = e.changedTouches[0];
            var el = document.elementFromPoint(t.clientX, t.clientY);
            if (el && el.closest('#ms_zone_long_' + host.id))  placeInZone('long',  dragSrcIdx);
            if (el && el.closest('#ms_zone_short_' + host.id)) placeInZone('short', dragSrcIdx);
          }, { passive:true });
        }
      });

      /* zone drag events */
      [zoneL, zoneS].forEach(function(zone, zi){
        zone.addEventListener('dragover', function(e){
          e.preventDefault(); zone.classList.add('hover-target');
        });
        zone.addEventListener('dragleave', function(){ zone.classList.remove('hover-target'); });
        zone.addEventListener('drop', function(e){
          e.preventDefault(); zone.classList.remove('hover-target');
          placeInZone(zi === 0 ? 'long' : 'short', dragSrcIdx);
        });
      });
    }

    function placeInZone(which, idx){
      if (idx === null || idx === undefined) return;
      var mm = data.v[idx];
      if (which === 'long'){
        if (data.longPlaced !== null){ data.flipped[data.longPlaced] = true; }
        data.longPlaced = idx;
        elZL.textContent = mm + ' mm';
        zoneL.classList.add('filled');
      } else {
        if (data.shortPlaced !== null){ data.flipped[data.shortPlaced] = true; }
        data.shortPlaced = idx;
        elZS.textContent = mm + ' mm';
        zoneS.classList.add('filled');
      }
      renderGrid();
    }

    elK.addEventListener('click', function(){
      if (done) return;
      var realMax = Math.max.apply(null, data.v);
      var realMin = Math.min.apply(null, data.v);
      var allFlipped = data.v.every(function(_, i){ return data.flipped[i] || data.longPlaced === i || data.shortPlaced === i; });
      if (!allFlipped){
        say(host, 'warm', L({ es:'Aún tienes fichas sin voltear. Destápalas todas para poder identificar los extremos.', en:'You still have unflipped cards. Turn them all over before identifying the extremes.' }));
        return;
      }
      if (data.longPlaced === null || data.shortPlaced === null){
        say(host, 'warm', L({ es:'Arrastra la ficha del pico más largo al bloque "Más largo" y la del más corto a "Más corto".', en:'Drag the longest beak card to "Longest" and the shortest to "Shortest".' }));
        return;
      }
      var placedMax = data.v[data.longPlaced];
      var placedMin = data.v[data.shortPlaced];
      var diffVal   = parseInt(elDI.value, 10);
      var longOk    = placedMax === realMax;
      var shortOk   = placedMin === realMin;
      var diffOk    = diffVal === data.spread;
      if (longOk && shortOk && diffOk){
        elK.textContent = L({ es:'Completado', en:'Completed' });
        elK.className = 'gw-btn solved'; elK.disabled = true;
        say(host, 'good', L({
          es:'Correcto. El pico más largo medía ' + realMax + ' mm y el más corto ' + realMin + ' mm, con ' + data.spread + ' mm de diferencia.',
          en:'Correct. The longest beak was ' + realMax + ' mm and the shortest ' + realMin + ' mm, a difference of ' + data.spread + ' mm.'
        }));
        setTimeout(nextRound, 900);
        return;
      }
      tries++;
      if (tries >= 3){
        data.longPlaced  = data.v.indexOf(realMax);
        data.shortPlaced = data.v.indexOf(realMin);
        data.v.forEach(function(_, i){ data.flipped[i] = true; });
        elZL.textContent = realMax + ' mm'; zoneL.classList.add('filled');
        elZS.textContent = realMin + ' mm'; zoneS.classList.add('filled');
        elDI.value = String(data.spread);
        renderGrid();
        elK.textContent = L({ es:'Siguiente', en:'Next' });
        say(host, 'miss', L({
          es:'El pico más largo era ' + realMax + ' mm y el más corto ' + realMin + ' mm, diferencia de ' + data.spread + ' mm. Ninguna de las ocho aves medía igual.',
          en:'The longest beak was ' + realMax + ' mm, the shortest ' + realMin + ' mm, a difference of ' + data.spread + ' mm. None of the eight birds measured the same.'
        }));
        elK.onclick = function(){ nextRound(); };
        return;
      }
      var msg = '';
      if (!longOk)  msg += L({ es:'La ficha que pusiste en "Más largo" no es la mayor. ', en:'The card in "Longest" is not the largest. ' });
      if (!shortOk) msg += L({ es:'La ficha que pusiste en "Más corto" no es la menor. ', en:'The card in "Shortest" is not the smallest. ' });
      if (longOk && shortOk && !diffOk) msg += L({ es:'Los extremos son correctos, pero revisa el cálculo de la diferencia.', en:'The extremes are right, but check the difference calculation.' });
      say(host, 'warm', msg);
    });

    data.flipped = new Array(data.v.length).fill(false);
    renderGrid();
    say(host, '', L({
      es:'Voltea todas las fichas primero; sólo cuando las veas todas podrás identificar los extremos.',
      en:'Flip all cards first; only when you can see all of them can you identify the extremes.'
    }));
  }

  function nextRound(){
    round++;
    if (round >= 3){
      done = true;
      say(host, 'good', L({
        es:'En los tres muestreos, aves de la misma especie y del mismo sitio dieron ocho medidas distintas. Eso es la variación: sin ella no habría nada sobre lo que la selección natural pudiera actuar.',
        en:'In all three samples, birds of the same species from the same place gave eight different measurements. That is variation: without it there would be nothing for natural selection to act on.'
      }));
      return;
    }
    data = buildRound(); tries = 0; placedLong = null; placedShort = null;
    buildUI();
  }

  data = buildRound();
  buildUI();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: lo que viaja a la siguiente generación
   Una característica a la vez, dos cajones. Cada respuesta recibe una
   pregunta que empuja hacia el criterio; a la tercera falla se muestra el
   cajón correcto y se avanza (Rule 8).
   ══════════════════════════════════════════════════════════════════════════ */
function wInherit(rng, host){
  var BINS = [
    { es:'Pasa a las crías', en:'Passes to the offspring' },
    { es:'Se queda en el individuo', en:'Stays with the individual' }
  ];
  var ITEMS = [
    { es:'El color oscuro del pelaje de un ratón de campo', en:'The dark colour of a field mouse coat', bin:0,
      why:{ es:'El ratón ya nació con ese color: es una variante que lleva desde el principio y que sus crías pueden llevar también.',
            en:'The mouse was already born with that colour: it is a variant it carries from the start and one its young can carry too.' } },
    { es:'La cicatriz que le dejó una trampa en la pata', en:'The scar a trap left on its leg', bin:1,
      why:{ es:'La cicatriz apareció durante su vida, por algo que le ocurrió. Sus crías nacen sin ella.',
            en:'The scar appeared during its life, from something that happened to it. Its young are born without it.' } },
    { es:'La forma del pico con la que nace un ave', en:'The beak shape a bird is born with', bin:0,
      why:{ es:'Es una característica con la que el ave llega al mundo, y las crías se parecen a sus padres en ese rasgo.',
            en:'It is a characteristic the bird arrives in the world with, and the young resemble their parents in that trait.' } },
    { es:'Los músculos que un caballo gana de tanto correr', en:'The muscle a horse builds from running so much', bin:1,
      why:{ es:'Los ganó con el uso, después de nacer. El potro no nace con los músculos que su padre entrenó.',
            en:'It built them through use, after being born. The foal is not born with the muscle its father trained.' } },
    { es:'El tamaño de la semilla que produce una planta', en:'The size of the seed a plant produces', bin:0,
      why:{ es:'De las semillas grandes salen, en su mayoría, plantas de semillas grandes: el rasgo viaja a la siguiente generación.',
            en:'Large seeds give, for the most part, plants with large seeds: the trait travels to the next generation.' } },
    { es:'La cola que un lagarto perdió al escapar de un ave', en:'The tail a lizard lost escaping from a bird', bin:1,
      why:{ es:'La perdió huyendo, ya siendo adulto. Sus crías nacen con la cola completa.',
            en:'It lost it while fleeing, already an adult. Its young are born with a complete tail.' } }
  ];
  var seq = shuffle([0,1,2,3,4,5], rng);
  var i = 0, tries = 0, hits = 0, done = false;

  function render(){
    if (done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'Lo que viaja y lo que no', en:'What travels and what does not' }) + '</div>' +
        '<div class="gw-q">' + L({ es:'Terminaste el montón: ', en:'You finished the pile: ' }) + hits + ' / ' + ITEMS.length + '</div>' +
        '<div class="gw-fb good">' + L({
          es:'El criterio siempre fue el mismo: si el ser vivo llegó con eso al nacer puede pasarlo; si le ocurrió después, se queda con él. Solo lo que se hereda puede cambiar una población generación tras generación.',
          en:'The criterion was always the same: if the living thing arrived with it at birth it can pass it on; if it happened afterwards, it stays with it. Only what is inherited can change a population generation after generation.'
        }) + '</div>';
      return;
    }
    var it = ITEMS[seq[i]];
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Lo que viaja y lo que no', en:'What travels and what does not' }) + '</div>' +
      '<div class="gw-q">' + L({ es:'¿Esta característica puede pasar a la siguiente generación?', en:'Can this characteristic pass to the next generation?' }) + '</div>' +
      '<div class="gw-mini">' + (i + 1) + ' / ' + ITEMS.length + '</div>' +
      '<div class="clscard">' + L(it) + '</div>' +
      '<div class="binrow">' +
        BINS.map(function(b, bi){ return '<button class="bin" data-b="' + bi + '">' + L(b) + '</button>'; }).join('') +
      '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelectorAll('.bin').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (waitingNext) return;
        answer(parseInt(btn.getAttribute('data-b'), 10));
      });
    });
  }

  var waitingNext = false;

  function advance(){
    i++; tries = 0; waitingNext = false;
    if (i >= ITEMS.length) done = true;
    render();
  }

  function answer(bi){
    if (waitingNext) return;
    var it = ITEMS[seq[i]];
    if (bi === it.bin){
      hits++;
      waitingNext = true;
      /* show answer + Next button, stay until student is ready */
      var fb = host.querySelector('.gw-fb');
      if (fb){
        fb.className = 'gw-fb good';
        fb.innerHTML = L(it.why) +
          '<br><button class="gw-btn" style="margin-top:.55rem" onclick="(function(){' +
            'var h=document.getElementById(\'' + host.id + '\');' +
            'var e=h.__inheritAdvance;if(e)e();' +
          '})()">' + L({ es:'Siguiente →', en:'Next →' }) + '</button>';
      }
      host.__inheritAdvance = advance;
      return;
    }
    tries++;
    if (tries >= 3){
      waitingNext = true;
      var fb2 = host.querySelector('.gw-fb');
      if (fb2){
        fb2.className = 'gw-fb miss';
        fb2.innerHTML = L({ es:'Iba en: ', en:'It belonged in: ' }) + '<b>' + L(BINS[it.bin]) + '</b>. ' + L(it.why) +
          '<br><button class="gw-btn" style="margin-top:.55rem" onclick="(function(){' +
            'var h=document.getElementById(\'' + host.id + '\');' +
            'var e=h.__inheritAdvance;if(e)e();' +
          '})()">' + L({ es:'Siguiente →', en:'Next →' }) + '</button>';
      }
      host.__inheritAdvance = advance;
      return;
    }
    say(host, 'warm', L({
      es:'Todavía no. Hazte esta pregunta: ¿el ser vivo llegó con esa característica al nacer, o le pasó después?',
      en:'Not yet. Ask yourself this: did the living thing arrive with that characteristic at birth, or did it happen afterwards?'
    }));
  }

  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: más semillas que huecos  (animación de caída)
   El terreno se dibuja en canvas: huecos iluminados fijos, tierra oscura.
   Cada clic en "Soltar semilla" lanza UNA semilla que cae animada desde
   arriba, aterriza en un hueco (verde, brilla) o en tierra seca (marrón,
   se apaga). Contadores en tiempo real. Cuando todos los huecos están llenos
   el alumno ve claramente que la gran mayoría de semillas quedó fuera.
   Tres terrenos. Sin slider, sin matemáticas — pura visualización.
   ══════════════════════════════════════════════════════════════════════════ */
function wSeeds(rng, host){
  var round = 0, done = false;

  /* inject CSS once */
  if (!document.getElementById('seedsAnimCSS')){
    var sc = document.createElement('style');
    sc.id = 'seedsAnimCSS';
    sc.textContent = [
      '.sd-canvas{display:block;width:100%;height:180px;border-radius:10px;border:1px solid var(--border);cursor:pointer;}',
      '.sd-counter{display:flex;gap:.6rem;flex-wrap:wrap;margin:.5rem 0;}',
      '.sd-pill{padding:.3rem .7rem;border-radius:20px;font-size:.78rem;font-weight:600;}',
      '.sd-pill-in{background:var(--ok-bg);color:var(--ok);}',
      '.sd-pill-out{background:var(--bad-bg);color:var(--bad);}',
      '.sd-pill-hole{background:var(--gold-bg);color:var(--text2);}',
    ].join('');
    document.head.appendChild(sc);
  }

  function buildRound(){
    var holes = ri(rng, 5, 9);
    var totalSeeds = holes + ri(rng, 14, 28); /* many more seeds than holes */
    return { holes: holes, totalSeeds: totalSeeds };
  }

  function runRound(){
    var data = buildRound();
    var CV_W = 0, CV_H = 180;
    var HOLE_R = 14; /* hole radius px (logical) */
    var SEED_R = 6;

    /* place holes randomly, no overlap */
    var holePositions = [];
    var attempts = 0;
    while (holePositions.length < data.holes && attempts < 2000){
      attempts++;
      var hx = HOLE_R + 10 + Math.floor(rng() * (300 - 2*(HOLE_R+10)));
      var hy = CV_H - HOLE_R - 8 - Math.floor(rng() * 60);
      var ok2 = true;
      for (var hi = 0; hi < holePositions.length; hi++){
        var dx = holePositions[hi].x - hx, dy = holePositions[hi].y - hy;
        if (Math.sqrt(dx*dx+dy*dy) < HOLE_R*2+6){ ok2 = false; break; }
      }
      if (ok2) holePositions.push({ x:hx, y:hy, filled:false });
    }

    /* state */
    var seedsDropped = 0, seedsIn = 0, seedsOut = 0;
    var animating = false;
    var landedSeeds = []; /* {x,y,in:bool} for redraw */

    /* build UI */
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'El terreno', en:'The ground' }) + '</div>' +
      '<div class="gw-q">' + L({
        es:'Terreno ' + (round+1) + ' de 3 — este suelo tiene <b>' + data.holes + '</b> huecos con luz donde puede germinar una semilla. Las demás caen en tierra seca y no llegan a planta. Suelta semillas una a una y observa qué pasa.',
        en:'Ground ' + (round+1) + ' of 3 — this soil has <b>' + data.holes + '</b> light gaps where a seed can germinate. The rest land on dry ground and never become plants. Drop seeds one by one and watch what happens.'
      }) + '</div>' +
      '<canvas class="sd-canvas" id="sdcv_' + host.id + '"></canvas>' +
      '<div class="sd-counter">' +
        '<span class="sd-pill sd-pill-hole" id="sd_holes_' + host.id + '">⬡ ' + L({es:'Huecos',en:'Gaps'}) + ': ' + data.holes + '</span>' +
        '<span class="sd-pill sd-pill-in"  id="sd_in_'    + host.id + '">↓ ' + L({es:'Adentro',en:'Inside'}) + ': 0</span>' +
        '<span class="sd-pill sd-pill-out" id="sd_out_'   + host.id + '">✗ ' + L({es:'Fuera',en:'Outside'}) + ': 0</span>' +
      '</div>' +
      '<div class="gw-row">' +
        '<button class="gw-btn" id="sd_drop_' + host.id + '">' + L({es:'Soltar una semilla',en:'Drop one seed'}) + '</button>' +
        '<button class="gw-btn" id="sd_many_' + host.id + '">' + L({es:'Soltar 5 de un golpe',en:'Drop 5 at once'}) + '</button>' +
      '</div>' +
      '<div class="gw-fb" id="sd_fb_' + host.id + '"></div>';

    var canvas  = document.getElementById('sdcv_'   + host.id);
    var btnDrop = document.getElementById('sd_drop_' + host.id);
    var btnMany = document.getElementById('sd_many_' + host.id);
    var elIn    = document.getElementById('sd_in_'   + host.id);
    var elOut   = document.getElementById('sd_out_'  + host.id);
    var elFb    = document.getElementById('sd_fb_'   + host.id);

    /* size canvas */
    function sizeCanvas(){
      CV_W = canvas.offsetWidth || 400;
      canvas.width  = CV_W;
      canvas.height = CV_H;
      /* rescale hole x positions to actual width */
      holePositions.forEach(function(h){ h.x = Math.round(h.x / 300 * CV_W); });
    }
    sizeCanvas();

    var ctx = canvas.getContext('2d');

    function drawGround(){
      /* soil background */
      ctx.clearRect(0,0,CV_W,CV_H);
      var grad = ctx.createLinearGradient(0,0,0,CV_H);
      grad.addColorStop(0, '#c8a97a');
      grad.addColorStop(1, '#8b6340');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,CV_W,CV_H);

      /* texture lines */
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.lineWidth = 1;
      for (var yy=12; yy<CV_H; yy+=18){
        ctx.beginPath();
        ctx.moveTo(0,yy); ctx.lineTo(CV_W,yy);
        ctx.stroke();
      }

      /* holes */
      holePositions.forEach(function(h){
        /* dark pit */
        ctx.beginPath();
        ctx.ellipse(h.x, h.y, HOLE_R, HOLE_R*0.55, 0, 0, Math.PI*2);
        ctx.fillStyle = h.filled ? 'rgba(45,106,79,0.35)' : '#1a1206';
        ctx.fill();
        /* light glow if not filled */
        if (!h.filled){
          var glow = ctx.createRadialGradient(h.x, h.y-4, 0, h.x, h.y-4, HOLE_R*0.9);
          glow.addColorStop(0, 'rgba(255,240,160,0.55)');
          glow.addColorStop(1, 'rgba(255,240,160,0)');
          ctx.beginPath();
          ctx.ellipse(h.x, h.y, HOLE_R, HOLE_R*0.55, 0, 0, Math.PI*2);
          ctx.fillStyle = glow;
          ctx.fill();
        }
        /* label */
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = h.filled ? 'rgba(45,106,79,0.9)' : 'rgba(255,240,160,0.85)';
        ctx.fillText(h.filled ? '🌱' : '☀', h.x, h.y+3);
      });

      /* landed seeds */
      landedSeeds.forEach(function(s){
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, SEED_R, SEED_R*0.65, 0, 0, Math.PI*2);
        ctx.fillStyle = s.in ? '#2d6a4f' : '#5a3e1b';
        ctx.fill();
        ctx.strokeStyle = s.in ? '#1a4a2f' : '#3a2810';
        ctx.lineWidth = 1;
        ctx.stroke();
      });
    }

    /* find next unfilled hole near x, or null */
    function nearestHole(sx){
      var best = null, bestD = HOLE_R + 12;
      holePositions.forEach(function(h){
        if (h.filled) return;
        var d = Math.abs(h.x - sx);
        if (d < bestD){ bestD = d; best = h; }
      });
      return best;
    }

    function updateCounters(){
      elIn.innerHTML  = '↓ ' + L({es:'Adentro',en:'Inside'})  + ': <b>' + seedsIn + '</b>';
      elOut.innerHTML = '✗ ' + L({es:'Fuera',en:'Outside'}) + ': <b>' + seedsOut + '</b>';
    }

    function checkComplete(){
      var allFull = holePositions.every(function(h){ return h.filled; });
      if (!allFull && seedsDropped < data.totalSeeds) return;

      btnDrop.disabled = true; btnMany.disabled = true;
      var msg = L({
        es: 'Se soltaron <b>' + seedsDropped + '</b> semillas. Solo <b>' + seedsIn + '</b> encontraron un hueco con luz — las otras <b>' + seedsOut + '</b> cayeron en tierra seca y no llegarán a planta. Eso ocurre cada temporada en casi cualquier especie: nacen muchos más de los que el terreno puede sostener.',
        en: '<b>' + seedsDropped + '</b> seeds dropped. Only <b>' + seedsIn + '</b> found a gap with light — the other <b>' + seedsOut + '</b> landed on dry ground and will never become plants. That happens every season in almost any species: far more are born than the ground can support.'
      });
      elFb.className = 'gw-fb good';
      elFb.innerHTML = msg;

      if (round + 1 < 3){
        var nextBtn = document.createElement('button');
        nextBtn.className = 'gw-btn';
        nextBtn.style.marginTop = '.6rem';
        nextBtn.textContent = L({es:'Siguiente terreno →', en:'Next ground →'});
        nextBtn.onclick = function(){
          round++;
          runRound();
        };
        elFb.appendChild(document.createElement('br'));
        elFb.appendChild(nextBtn);
      } else {
        done = true;
        var doneMsg = document.createElement('p');
        doneMsg.style.marginTop = '.5rem';
        doneMsg.style.fontWeight = '600';
        doneMsg.textContent = L({es:'Tres terrenos, mismo resultado: los huecos son siempre muchos menos que las semillas. Esa escasez de lugar es el motor del tercer eslabón.', en:'Three grounds, same result: gaps are always far fewer than seeds. That scarcity of space is the engine of the third link.'});
        elFb.appendChild(doneMsg);
      }
    }

    /* animate ONE seed drop */
    function dropOneSeed(callback){
      if (animating){ if(callback) callback(); return; }
      animating = true;
      seedsDropped++;

      /* random x start */
      var sx = SEED_R + Math.floor(rng() * (CV_W - SEED_R*2));
      var targetHole = nearestHole(sx);
      var ty, tx, landed = false, inHole = false;
      if (targetHole && Math.abs(targetHole.x - sx) < HOLE_R + 10){
        tx = targetHole.x;
        ty = targetHole.y;
        inHole = true;
      } else {
        tx = sx;
        ty = CV_H - SEED_R - Math.floor(rng() * 20) - 2;
        inHole = false;
      }

      var sy = -SEED_R;
      var speed = 6;
      var wobble = (rng()-0.5)*0.5;

      function frame(){
        sy += speed; sx += wobble; speed += 0.4;
        var arrivedY = sy >= ty - SEED_R;
        if (arrivedY && !landed){
          landed = true;
          if (inHole){
            targetHole.filled = true;
            seedsIn++;
          } else {
            seedsOut++;
          }
          landedSeeds.push({x: inHole ? tx : sx, y: ty, in: inHole});
          updateCounters();
        }
        drawGround();
        if (!arrived){
          /* draw falling seed */
          var curX = inHole ? (sx + (tx - sx) * Math.min(1, sy/ty)) : sx;
          var curY = Math.min(sy, ty);
          ctx.beginPath();
          ctx.ellipse(curX, curY, SEED_R, SEED_R*0.65, 0, 0, Math.PI*2);
          ctx.fillStyle = '#c9a84c';
          ctx.fill();
          ctx.strokeStyle = '#8b6300';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        var arrived = sy > ty + 8;
        if (!arrived){
          requestAnimationFrame(frame);
        } else {
          animating = false;
          checkComplete();
          if (callback) callback();
        }
      }
      requestAnimationFrame(frame);
    }

    btnDrop.addEventListener('click', function(){
      if (done || animating) return;
      if (seedsDropped >= data.totalSeeds){ checkComplete(); return; }
      dropOneSeed(null);
    });

    btnMany.addEventListener('click', function(){
      if (done || animating) return;
      var count = 0;
      function dropNext(){
        if (count >= 5 || seedsDropped >= data.totalSeeds){ checkComplete(); return; }
        count++;
        dropOneSeed(function(){ setTimeout(dropNext, 80); });
      }
      dropNext();
    });

    drawGround();
    updateCounters();
  }

  runRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: generaciones en la isla  (rediseño)
   Flujo claro en 3 fases:
     FASE 1 — ambiente visible, barras de la población visible desde el inicio
     FASE 2 — el alumno elige su predicción
     FASE 3 — corre generaciones una a una; barras se actualizan en vivo
   Al terminar compara predicción con resultado. Puede reiniciar.
   Dos islas con ambientes opuestos. Reveal a la tercera falla (Rule 8).
   ══════════════════════════════════════════════════════════════════════════ */
function wIsland(rng, host){

  /* inject CSS once */
  if (!document.getElementById('islandCSS')){
    var ic = document.createElement('style');
    ic.id = 'islandCSS';
    ic.textContent = [
      '.isl-env{background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 10px 10px 0;',
        'padding:.75rem 1rem;margin:.6rem 0;}',
      '.isl-env-title{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green-dark);',
        'font-weight:700;margin-bottom:.25rem;}',
      '.isl-env-body{font-size:.88rem;color:var(--text2);}',
      '.isl-phase{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);',
        'font-weight:600;margin:.8rem 0 .3rem;}',
      '.isl-bars{margin:.5rem 0;}',
      '.isl-bar-row{display:flex;align-items:center;gap:.5rem;margin:.18rem 0;transition:all .35s;}',
      '.isl-bar-lbl{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--text3);',
        'min-width:4.5ch;text-align:right;flex-shrink:0;}',
      '.isl-bar-track{flex:1;height:14px;background:var(--surface2);border-radius:7px;overflow:hidden;}',
      '.isl-bar-fill{height:100%;background:var(--green);border-radius:7px;transition:width .4s;}',
      '.isl-bar-fill.hi{background:var(--gold);}',
      '.isl-avg-line{border-top:2px dashed var(--gold);margin:.4rem 0 .1rem;position:relative;}',
      '.isl-avg-lbl{position:absolute;right:0;top:-1.1rem;font-size:.68rem;color:var(--gold);',
        'font-weight:600;font-family:"IBM Plex Mono",monospace;}',
      '.isl-pred-row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.35rem 0;}',
      '.isl-stats{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0;}',
      '.isl-stat{background:var(--surface2);border-radius:8px;padding:.35rem .7rem;font-size:.78rem;}',
      '.isl-stat b{font-family:"IBM Plex Mono",monospace;color:var(--green);}',
      '.isl-note{font-size:.76rem;color:var(--text3);font-style:italic;margin-bottom:.4rem;}',
    ].join('');
    document.head.appendChild(ic);
  }

  var ENV = [
    { key:'dura', big:true,
      name:{ es:'Sequía — solo quedan semillas grandes y duras', en:'Drought — only large hard seeds remain' },
      why:{  es:'Abrir una semilla dura exige un pico robusto. Las aves de pico pequeño no logran abrirlas y no se reproducen.',
             en:'Cracking a hard seed needs a powerful beak. Birds with small beaks cannot open them and do not reproduce.' },
      keep: { es:'Los 6 picos más grandes consiguen comer y dejan crías.', en:'The 6 largest beaks get food and leave offspring.' }
    },
    { key:'blanda', big:false,
      name:{ es:'Temporada de lluvias — el suelo se llena de semillas pequeñas', en:'Rainy season — the ground fills with tiny seeds' },
      why:{  es:'Las semillas pequeñas son difíciles de recoger con un pico grande. Las aves de pico chico las recogen mejor.',
             en:'Tiny seeds are hard to pick up with a large beak. Small-beaked birds handle them better.' },
      keep: { es:'Los 6 picos más chicos consiguen comer y dejan crías.', en:'The 6 smallest beaks get food and leave offspring.' }
    }
  ];

  var first = Math.floor(rng() * 2);
  var envSeq = [ENV[first], ENV[1-first]];
  var round = 0, gen = 0, tries = 0, done = false, guessed = -1, settled = false;
  var pop = [], start = [], startMean = 0, startPop = [];

  function newPop(){
    var a = [];
    for (var i = 0; i < 10; i++) a.push(ri(rng, 8, 16));
    return a;
  }
  function mean(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s/a.length; }

  /* ── build the full island UI once per round ── */
  function buildUI(){
    host.innerHTML =
      '<div class="gw-h">' + L({es:'Generaciones en la isla', en:'Generations on the island'}) + '</div>';

    /* step labels */
    var phEnv  = document.createElement('div'); phEnv.className  = 'isl-phase';
    phEnv.textContent = L({es:'① El ambiente de esta isla', en:'① The environment on this island'});
    host.appendChild(phEnv);

    /* environment card */
    var envCard = document.createElement('div'); envCard.className = 'isl-env';
    envCard.innerHTML =
      '<div class="isl-env-title">' + L({es:'Isla', en:'Island'}) + ' ' + (round+1) + ' de 2</div>' +
      '<div class="isl-env-body"><strong>' + L(envSeq[round].name) + '</strong><br>' +
      L(envSeq[round].why) + '</div>';
    host.appendChild(envCard);

    /* note about who survives */
    var note = document.createElement('div'); note.className = 'isl-note';
    note.textContent = L(envSeq[round].keep);
    host.appendChild(note);

    /* step 2 label */
    var phPred = document.createElement('div'); phPred.className = 'isl-phase';
    phPred.textContent = L({es:'② Tu predicción — ¿qué le pasa al tamaño promedio del pico después de 3 generaciones?', en:'② Your prediction — what happens to the average beak size after 3 generations?'});
    host.appendChild(phPred);

    /* prediction buttons */
    var predRow = document.createElement('div'); predRow.className = 'isl-pred-row'; predRow.id = 'isl_pred_'+host.id;
    var LBL = [
      {es:'Sube (picos más grandes)',      en:'Goes up (larger beaks)'},
      {es:'Baja (picos más chicos)',       en:'Goes down (smaller beaks)'},
      {es:'No cambia',                     en:'Stays the same'}
    ];
    LBL.forEach(function(lbl, k){
      var b = document.createElement('button');
      b.className = 'gw-btn' + (guessed===k ? ' on' : '');
      b.textContent = L(lbl);
      b.setAttribute('data-k', k);
      if (settled) b.disabled = true;
      b.addEventListener('click', function(){
        if (settled) return;
        guessed = k;
        predRow.querySelectorAll('.gw-btn').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        fbEl.className = 'gw-fb';
        fbEl.innerHTML = L({es:'Predicción guardada. Ahora usa el botón de abajo para correr las generaciones una a una.', en:'Prediction saved. Now use the button below to run generations one by one.'});
      });
      predRow.appendChild(b);
    });
    host.appendChild(predRow);

    /* step 3 label */
    var phRun = document.createElement('div'); phRun.className = 'isl-phase';
    phRun.textContent = L({es:'③ Corre las generaciones y observa cómo cambia la población', en:'③ Run the generations and watch how the population changes'});
    host.appendChild(phRun);

    /* stats bar */
    var statsRow = document.createElement('div'); statsRow.className = 'isl-stats'; statsRow.id = 'isl_stats_'+host.id;
    host.appendChild(statsRow);

    /* bars legend */
    var legend = document.createElement('div');
    legend.className = 'gw-mini';
    legend.style.marginBottom = '.2rem';
    legend.textContent = L({
      es:'Cada fila = un ave. La barra muestra el tamaño de su pico (más larga = pico más grande). La línea dorada punteada es el promedio actual.',
      en:'Each row = one bird. The bar shows its beak size (longer bar = bigger beak). The dashed gold line is the current average.'
    });
    host.appendChild(legend);

    /* bars container */
    var barsDiv = document.createElement('div'); barsDiv.className = 'isl-bars'; barsDiv.id = 'isl_bars_'+host.id;
    host.appendChild(barsDiv);

    /* run / reset buttons */
    var btnRow = document.createElement('div'); btnRow.className = 'gw-row';
    var stepBtn = document.createElement('button');
    stepBtn.className = 'gw-btn'; stepBtn.id = 'isl_step_'+host.id;
    stepBtn.textContent = L({es:'Pasa una generación (0/3)', en:'Run one generation (0/3)'});
    var rstBtn = document.createElement('button');
    rstBtn.className = 'gw-btn'; rstBtn.id = 'isl_rst_'+host.id;
    rstBtn.textContent = L({es:'Volver al inicio', en:'Back to the start'});
    btnRow.appendChild(stepBtn);
    btnRow.appendChild(rstBtn);
    host.appendChild(btnRow);

    /* feedback */
    var fbEl = document.createElement('div'); fbEl.className = 'gw-fb'; fbEl.id = 'isl_fb_'+host.id;
    host.appendChild(fbEl);

    /* ── render bars ── */
    function renderBars(){
      var statsEl = document.getElementById('isl_stats_'+host.id);
      var barsEl  = document.getElementById('isl_bars_'+host.id);
      var stepEl  = document.getElementById('isl_step_'+host.id);
      if (!statsEl || !barsEl) return;
      var cur = mean(pop);
      var MAX_MM = 18;
      statsEl.innerHTML =
        '<div class="isl-stat">' + L({es:'Generación',en:'Generation'}) + ': <b>' + gen + '/3</b></div>' +
        '<div class="isl-stat">' + L({es:'Promedio ahora',en:'Average now'}) + ': <b>' + cur.toFixed(1) + ' mm</b></div>' +
        '<div class="isl-stat">' + L({es:'Al inicio',en:'At start'}) + ': <b>' + startMean.toFixed(1) + ' mm</b></div>';
      if (stepEl) stepEl.textContent = L({es:'Pasa una generación',en:'Run one generation'}) + ' (' + gen + '/3)';

      var sorted = pop.slice().sort(function(a,b){return a-b;});
      var avgPct = cur / MAX_MM * 100;
      barsEl.innerHTML =
        sorted.map(function(mm, i){
          var pct = mm / MAX_MM * 100;
          var hi  = envSeq[round].big ? (i >= sorted.length - 6) : (i < 6);
          return '<div class="isl-bar-row">' +
            '<div class="isl-bar-lbl">' + mm + ' mm</div>' +
            '<div class="isl-bar-track">' +
              '<div class="isl-bar-fill' + (hi ? ' hi' : '') + '" style="width:' + pct.toFixed(1) + '%"></div>' +
            '</div>' +
          '</div>';
        }).join('') +
        '<div class="isl-avg-line"><span class="isl-avg-lbl">&#x2014; ' + L({es:'promedio',en:'avg'}) + ' ' + cur.toFixed(1) + ' mm</span></div>';
    }

    /* ── step one generation ── */
    function stepGen(){
      var fbEl2 = document.getElementById('isl_fb_'+host.id);
      var stepEl = document.getElementById('isl_step_'+host.id);
      if (!fbEl2) return;
      if (guessed < 0){
        fbEl2.className = 'gw-fb warm';
        fbEl2.textContent = L({es:'Primero elige tu predicción (② arriba), luego corre las generaciones.', en:'First choose your prediction (② above), then run the generations.'});
        return;
      }
      if (settled || gen >= 3) return;
      var env = envSeq[round];
      var sorted2 = pop.slice().sort(function(a,b){return a-b;});
      var keep = env.big ? sorted2.slice(4) : sorted2.slice(0,6);
      var kids = [];
      for (var i=0; i<4; i++){
        var p = keep[ri(rng,0,keep.length-1)] + ri(rng,-1,1);
        kids.push(Math.max(6, Math.min(18, p)));
      }
      pop = keep.concat(kids);
      gen++;
      renderBars();
      if (gen < 3){
        fbEl2.className = 'gw-fb';
        fbEl2.textContent = L({
          es:'Generación ' + gen + '/3 completada. Las aves de color dorado fueron las que comieron y dejaron crías. Mira cómo se mueve el promedio.',
          en:'Generation ' + gen + '/3 done. Gold-coloured bars are the birds that ate and left offspring. Watch the average shift.'
        });
        return;
      }
      /* all 3 generations done */
      settled = true;
      if (stepEl) { stepEl.disabled = true; }
      var d = mean(pop) - startMean;
      var real = d > 0.3 ? 0 : (d < -0.3 ? 1 : 2);

      if (guessed === real){
        fbEl2.className = 'gw-fb good';
        fbEl2.innerHTML = L({
          es:'<strong>Correcto.</strong> El promedio pasó de ' + startMean.toFixed(1) + ' a ' + mean(pop).toFixed(1) + ' mm. Ningún ave alargó ni acortó su pico durante su vida: lo que cambió fue quiénes sobrevivieron y dejaron crías heredando ese tamaño.',
          en:'<strong>Correct.</strong> The average went from ' + startMean.toFixed(1) + ' to ' + mean(pop).toFixed(1) + ' mm. No bird lengthened or shortened its beak during its lifetime: what changed was who survived and passed on that size.'
        });
        if (round === 0){
          setTimeout(function(){ round=1; gen=0; guessed=-1; settled=false; tries=0; pop=newPop(); start=pop.slice(); startMean=mean(pop); buildUI(); }, 2600);
        } else {
          done=true;
          var doneP = document.createElement('p');
          doneP.style.marginTop='.5rem'; doneP.style.fontWeight='600';
          doneP.textContent = L({es:'Dos islas, dos ambientes, dos resultados opuestos con exactamente el mismo mecanismo. La selección actúa sobre la variación que ya existe.', en:'Two islands, two environments, two opposite results with exactly the same mechanism. Selection acts on existing variation.'});
          fbEl2.appendChild(doneP);
        }
        return;
      }
      tries++;
      if (tries >= 3){
        fbEl2.className = 'gw-fb miss';
        fbEl2.innerHTML = L({
          es:'El promedio pasó de ' + startMean.toFixed(1) + ' a ' + mean(pop).toFixed(1) + ' mm — ' + (envSeq[round].big ? 'subió' : 'bajó') + '. Las aves de pico ' + (envSeq[round].big ? 'grande' : 'chico') + ' (en dorado) comieron más y dejaron crías con picos parecidos, empujando el promedio en esa dirección cada generación.',
          en:'The average went from ' + startMean.toFixed(1) + ' to ' + mean(pop).toFixed(1) + ' mm — it ' + (envSeq[round].big ? 'rose' : 'fell') + '. The ' + (envSeq[round].big ? 'large' : 'small') + '-beaked birds (in gold) ate more and left similar offspring, pushing the average that way each generation.'
        });
        if (round === 0){
          setTimeout(function(){ round=1; gen=0; guessed=-1; settled=false; tries=0; pop=newPop(); start=pop.slice(); startMean=mean(pop); buildUI(); }, 3000);
        } else { done=true; }
        return;
      }
      fbEl2.className = 'gw-fb warm';
      fbEl2.innerHTML = L({
        es:'No era esa. Pulsa "Volver al inicio" para reiniciar la misma isla con la misma población, piensa en qué picos dominaron y prueba otra predicción.',
        en:'Not that one. Press "Back to the start" to reset this island with the same population, think about which beaks dominated, and try another prediction.'
      });
    }

    /* ── reset ── */
    function resetRound(){
      pop = start.slice(); gen = 0; settled = false;
      var stepEl2 = document.getElementById('isl_step_'+host.id);
      if (stepEl2) stepEl2.disabled = false;
      var fbEl3 = document.getElementById('isl_fb_'+host.id);
      if (fbEl3){ fbEl3.className='gw-fb'; fbEl3.textContent=''; }
      renderBars();
    }

    /* wire buttons */
    document.getElementById('isl_step_'+host.id).addEventListener('click', stepGen);
    document.getElementById('isl_rst_'+host.id).addEventListener('click', function(){
      if (done) return;
      resetRound();
    });

    /* initial render */
    renderBars();
    fbEl.className = 'gw-fb';
    fbEl.textContent = L({
      es:'Lee el ambiente (①), elige tu predicción (②) y luego corre las generaciones (③) una a una.',
      en:'Read the environment (①), choose your prediction (②), then run the generations (③) one by one.'
    });
  }

  /* start */
  pop = newPop(); start = pop.slice(); startMean = mean(pop);
  buildUI();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 6 :: el cuaderno
   Consigna tomada de una bolsa por la semilla; el alumno responde escribiendo
   o dibujando. Sin veredicto: la devolución es de acompañamiento.
   ══════════════════════════════════════════════════════════════════════════ */
function wReflect(rng, host){
  var PROMPTS = [
    { es:'Elige un ser vivo que puedas ver desde tu casa y describe una característica suya que le sirva en ese lugar. Explica cómo se habría vuelto común en su población.',
      en:'Choose a living thing you can see from your home and describe one of its characteristics that serves it in that place. Explain how it could have become common in its population.' },
    { es:'Dibuja una población con dos variantes y marca qué pasaría con ella si el ambiente cambiara. Señala en tu dibujo dónde está la variación y dónde la herencia.',
      en:'Sketch a population with two variants and mark what would happen to it if the environment changed. Point out in your drawing where the variation is and where the inheritance is.' },
    { es:'Con tus palabras, escribe qué le contestarías a alguien que dice que un animal cambia su cuerpo durante su vida para adaptarse y se lo hereda a sus crías.',
      en:'In your own words, write what you would answer to someone who says an animal changes its body during its life to adapt and passes that on to its young.' },
    { es:'Darwin y Wallace no sabían cómo se heredan las características. Escribe qué otra pregunta te queda a ti sin responder y cómo buscarías información para contestarla.',
      en:'Darwin and Wallace did not know how characteristics are inherited. Write what other question is left unanswered for you and how you would look for information to answer it.' }
  ];
  var chosen = PROMPTS[Math.floor(rng() * PROMPTS.length)];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Tu cuaderno', en:'Your notebook' }) + '</div>' +
    '<div class="reflect-prompt">' + L(chosen) + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" data-r="tt">' + L({ es:'⌨️ Escribir', en:'⌨️ Write' }) + '</button>' +
      '<button class="wtab" data-r="td">' + L({ es:'✏️ Dibujar', en:'✏️ Sketch' }) + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="reflect_type"><textarea class="wtextarea" id="reflectTa" placeholder="' + L({ es:'Tu respuesta...', en:'Your answer...' }) + '"></textarea></div>' +
    '<div class="wpanel" id="reflect_draw">' +
      '<div class="cvwrap">' +
        '<canvas class="dcanvas" id="reflectCv"></canvas>' +
        '<div class="ctoolbar">' +
          '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
          '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
          '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
          '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
          '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
          '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
          '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
          '<button class="clrbtn">' + t('btn-clear') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="save">' + L({ es:'Guardar en el cuaderno', en:'Save to the notebook' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var tt = host.querySelector('[data-r="tt"]'),
      td = host.querySelector('[data-r="td"]'),
      pt = host.querySelector('#reflect_type'),
      pd = host.querySelector('#reflect_draw'),
      cvReady = false;

  tt.addEventListener('click', function(){
    pt.classList.add('active'); pd.classList.remove('active');
    tt.classList.add('active'); td.classList.remove('active');
  });
  td.addEventListener('click', function(){
    pd.classList.add('active'); pt.classList.remove('active');
    td.classList.add('active'); tt.classList.remove('active');
    setTimeout(function(){
      var c = document.getElementById('reflectCv');
      if (c && !cvReady){ cvReady = true; initCanvas(c); }
    }, 60);
  });
  host.querySelector('[data-r="save"]').addEventListener('click', function(){
    say(host, 'good', L({
      es:'Guardado. Aquí no hay una sola respuesta: lo que vale es que tu explicación se apoye en los eslabones que ya trabajaste.',
      en:'Saved. There is no single answer here: what counts is that your explanation rests on the links you have already worked through.'
    }));
  });

  say(host, '', L({
    es:'Tómate el tiempo que necesites y responde con tus palabras.',
    en:'Take the time you need and answer in your own words.'
  }));
}
