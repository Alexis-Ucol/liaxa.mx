      hint:{ es:'Compara qué queda de cada acción una semana después de que la atención pública se mueve a otro tema.',
             en:'Compare what remains of each action a week after public attention moves to another topic.' },
      explanation:{ es:'La continuidad es lo que convierte un compromiso en un resultado. Revisiones con fecha y resultados publicados obligan a rendir cuentas una y otra vez; un evento aislado termina cuando termina la atención, aunque haya sido multitudinario. Las demás opciones atribuyen la diferencia al tamaño del grupo, al tema o a las fotografías, y ninguna de esas explica un año de seguimiento.',
                    en:'Staying power is what turns a commitment into a result. Dated reviews and published results force accountability again and again; an isolated event ends when attention ends, however crowded it was. The other options attribute the difference to group size, topic or photos, and none of those explains a year of follow up.' } }
  ], rng), rng);

  /* ── CONCEPTO 5 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 5','CONCEPT 5'),
    '<h2>' + S('Informar sin dañar','Informing without causing harm') + '</h2>' +
    '<p>' + S('Hoy la mayor parte de la difusión de un reclamo ocurre en pantallas, y ahí la velocidad juega en contra. Un mensaje sin fecha, sin lugar y sin fuente puede recorrer una comunidad entera en una tarde. Si el dato resulta falso, el daño es doble: alcanza a personas concretas que quedaron señaladas y le entrega a quien quiere desacreditar la causa el único argumento que necesita.',
              'Today most of the spreading of a claim happens on screens, and there speed works against you. A message with no date, no place and no source can travel across a whole community in one afternoon. If the datum turns out false, the harm is double: it reaches specific people who were pointed at and it hands whoever wants to discredit the cause the only argument they need.') + '</p>' +
    '<p>' + S('Verificar no es tibieza ni falta de compromiso: es lo que protege el reclamo. Antes de amplificar conviene revisar cuatro cosas: si hay fecha y lugar, si existe una fuente que se pueda consultar, si la persona afectada acepta que su caso se difunda y si el mensaje expone datos personales de alguien. El número de reenvíos y de reacciones no dice nada sobre la verdad de un hecho.',
              'Verifying is not lukewarmness or lack of commitment: it is what protects the claim. Before amplifying it is worth checking four things: whether there is a date and a place, whether a source can be consulted, whether the affected person agrees to their case being shared and whether the message exposes personal data of somebody. The number of forwards and reactions says nothing about the truth of a fact.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Presunción de inocencia: ','Presumption of innocence: ') + '</strong>' +
      S('nadie puede ser tratado como responsable de algo mientras no exista una investigación que lo establezca. Protege también a quien defiende una causa, porque una acusación sin sustento vuelve discutible todo lo demás.',
        'nobody may be treated as responsible for something while no investigation has established it. It also protects whoever defends a cause, because an unsupported accusation makes everything else disputable.') + '</p></div>' +
    buildFiltro(rng));
  vfRender();

  /* ── PROBLEMA 8 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Antes de compartir', en:'Before sharing' }, showWork:false,
      stmt:{ es:'Circula en el grupo de mensajería de la escuela una imagen que afirma que una clínica cercana negó atención a una persona por su origen. El mensaje no indica fecha, lugar exacto ni fuente, y pide compartirlo de inmediato. ¿Cuál es la actuación más responsable?',
             en:'An image circulates in the school messaging group claiming that a nearby clinic denied care to a person because of their origin. The message gives no date, no exact place and no source, and asks to share it immediately. What is the most responsible course of action?' },
      options:{ es:[
        'Buscar fecha, lugar y una fuente que pueda confirmarlo antes de difundirlo, y si el hecho se sostiene, orientar a la persona afectada sobre dónde presentar su queja.',
        'Compartirlo de inmediato con todos los contactos posibles, porque la discriminación es un asunto grave que no admite ninguna demora.',
        'Ignorar el mensaje por completo y pedir a quienes lo reenvían que dejen de usar los grupos escolares para tratar estos temas.',
        'Responder en el grupo señalando por su nombre al personal de la clínica que aparece en la imagen difundida.' ],
        en:[
        'Look for date, place and a source that can confirm it before sharing, and if the fact holds, guide the affected person on where to file a complaint.',
        'Share it immediately with every possible contact, because discrimination is a serious matter that admits no delay whatsoever.',
        'Ignore the message entirely and ask those forwarding it to stop using school groups for these topics.',
        'Answer in the group naming the clinic staff who appear in the shared image.' ] },
      correct:0,
      hint:{ es:'Piensa qué le ocurre a un reclamo verdadero cuando se difunde junto con un dato que resulta falso.',
             en:'Think about what happens to a true claim when it is spread together with a datum that turns out false.' },
      explanation:{ es:'Amplificar sin verificar puede dañar a personas ajenas y, cuando el dato resulta falso, desacredita a quienes sí sufrieron discriminación. Verificar fecha, lugar y fuente, y después acompañar a la persona afectada hacia la vía de queja, defiende el derecho sin producir un daño nuevo. Callar deja el hecho sin atender, y señalar nombres sin comprobación agrega otro daño al primero.',
                    en:'Amplifying without verifying can harm unconnected people and, when the datum turns out false, it discredits those who did suffer discrimination. Verifying date, place and source, and then accompanying the affected person towards the complaint route, defends the right without producing new harm. Staying silent leaves the fact unattended, and naming people without verification adds a second harm to the first.' } },
    { title:{ es:'La prisa y el daño', en:'Haste and harm' }, showWork:false,
      stmt:{ es:'Un colectivo publicó una cifra alarmante sobre casos de discriminación en su municipio. Días después se supo que el dato provenía de otro país y de otro año. ¿Cuál es la consecuencia más seria de ese error para su causa?',
             en:'A collective published an alarming figure about discrimination cases in its town. Days later it emerged that the datum came from another country and another year. What is the most serious consequence of that error for their cause?' },
      options:{ es:[
        'La autoridad y el público pueden usar el error para poner en duda todo el reclamo, incluidos los casos reales que el colectivo sí había documentado.',
        'El colectivo tendrá que dedicar tiempo a redactar una publicación nueva con la cifra que corresponde de verdad a su municipio.',
        'Las personas que compartieron la publicación original perderán seguidores en sus cuentas personales durante las semanas siguientes.',
        'El colectivo deberá cambiar de tema durante un periodo hasta que el público del municipio olvide por completo lo ocurrido.' ],
        en:[
        'The authority and the public can use the error to cast doubt on the whole claim, including the real cases the collective had indeed documented.',
        'The collective will have to spend time writing a new post with the figure that truly corresponds to its town.',
        'The people who shared the original post will lose followers on their personal accounts over the following weeks.',
        'The collective will have to change topic for a while until the public in town completely forgets what happened.' ] },
      correct:0,
      hint:{ es:'Pregúntate qué le ocurre a la evidencia verdadera del colectivo después de que se descubre el error.',
             en:'Ask what happens to the true evidence of the collective after the error is discovered.' },
      explanation:{ es:'Un solo dato falso contamina todo lo demás: quien no quiere responder ya tiene con qué descalificar también los casos documentados con rigor. El costo mayor no es rehacer una publicación ni perder seguidores, sino perder la credibilidad que sostiene el reclamo frente a quien debe responderlo.',
                    en:'A single false datum contaminates everything else: whoever does not want to answer now has grounds to dismiss even the rigorously documented cases. The greater cost is not redoing a post or losing followers, but losing the credibility that sustains the claim before whoever must answer it.' } }
  ], rng), rng);

  /* ── PROBLEMA 9 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Tomar postura con fundamento', en:'Taking a grounded stance' }, showWork:false,
      stmt:{ es:'En un debate escolar sobre un movimiento que exige transporte público accesible, se pide a cada participante fijar su postura. ¿Cuál intervención asume una postura ética fundada en derechos?',
             en:'In a school debate about a movement demanding accessible public transport, each participant is asked to state their position. Which intervention takes an ethical stance grounded in rights?' },
      options:{ es:[
        'Apoyo la demanda porque la falta de unidades accesibles impide a un grupo de personas llegar a la escuela y al trabajo, y el acceso a la educación no puede depender de si alguien logra subir a un autobús.',
        'Apoyo la demanda porque el grupo que la impulsa me parece simpático y ha organizado muy buenas actividades en el municipio durante este año.',
        'No apoyo la demanda porque las unidades accesibles cuestan mucho dinero y el municipio tiene otros gastos que debería atender primero.',
        'No apoyo la demanda porque los movimientos que salen a la calle suelen exagerar la gravedad de los problemas que denuncian.' ],
        en:[
        'I support the demand because the lack of accessible vehicles keeps a group of people from reaching school and work, and access to education cannot depend on whether somebody manages to board a bus.',
        'I support the demand because the group behind it seems likeable to me and has organized very good activities in town during this year.',
        'I do not support the demand because accessible vehicles cost a lot of money and the town has other expenses it should address first.',
        'I do not support the demand because movements that take to the streets tend to exaggerate the seriousness of the problems they denounce.' ] },
      correct:0,
      hint:{ es:'Busca la intervención que nombra el derecho en juego y a quién afecta, en lugar de hablar de simpatías o sospechas.',
             en:'Look for the intervention that names the right at stake and who it affects, instead of speaking about likes or suspicions.' },
      explanation:{ es:'Una postura ética sostiene su juicio en un derecho reconocido y en el efecto concreto sobre personas, y por eso puede discutirse con evidencia. La segunda opción se apoya en la simpatía hacia el grupo, la tercera reduce un derecho a una comparación de gastos sin discutir la obligación que existe, y la cuarta descalifica a quien reclama en lugar de examinar el reclamo.',
                    en:'An ethical stance rests its judgment on a recognized right and on the concrete effect on people, and that is why it can be discussed with evidence. The second option leans on liking the group, the third reduces a right to a comparison of expenses without discussing the existing duty, and the fourth discredits whoever claims instead of examining the claim.' } },
    { title:{ es:'Estar en desacuerdo con fundamento', en:'Disagreeing with grounds' }, showWork:false,
      stmt:{ es:'Un movimiento propone que el ayuntamiento cierre de forma permanente una avenida para instalar un espacio comunitario. Una estudiante no está de acuerdo. ¿Cuál de sus posibles intervenciones expresa un desacuerdo fundado en derechos y no una descalificación?',
             en:'A movement proposes that the town council permanently close an avenue to build a community space. A student disagrees. Which of her possible interventions expresses a disagreement grounded in rights and not a dismissal?' },
      options:{ es:[
        'Comparto el objetivo del espacio comunitario, y señalo que el cierre permanente dejaría sin ruta al transporte que usan tres colonias para llegar al hospital, así que propongo revisar otra ubicación.',
        'No estoy de acuerdo porque quienes proponen el cierre no viven en esa zona de la ciudad y por eso no les corresponde opinar sobre lo que ahí ocurre.',
        'No estoy de acuerdo porque los movimientos siempre piden cosas imposibles y después culpan a la autoridad municipal de los resultados que obtienen.',
        'No estoy de acuerdo porque el ayuntamiento ya tiene demasiados asuntos pendientes como para ocuparse ahora de una propuesta de este tipo.' ],
        en:[
        'I share the goal of the community space, and I point out that the permanent closure would leave without a route the transport three neighborhoods use to reach the hospital, so I propose looking at another location.',
        'I disagree because those proposing the closure do not live in that part of the city and therefore it is not up to them to have an opinion about what happens there.',
        'I disagree because movements always ask for impossible things and then blame the town authority for the results they obtain.',
        'I disagree because the town council already has too many pending matters to deal now with a proposal of this kind.' ] },
      correct:0,
      hint:{ es:'Un desacuerdo fundado nombra a quién afectaría la medida y ofrece una alternativa, en lugar de juzgar a quien propone.',
             en:'A grounded disagreement names who the measure would affect and offers an alternative, instead of judging whoever proposes it.' },
      explanation:{ es:'Estar en desacuerdo con un movimiento es legítimo y también exige fundamento: la primera intervención reconoce el objetivo, nombra el derecho de terceras personas que quedaría afectado, la salud y el traslado de tres colonias, y propone una salida. Las otras tres niegan a alguien el derecho a opinar, generalizan sobre todos los movimientos o apelan a la carga de trabajo de la autoridad.',
                    en:'Disagreeing with a movement is legitimate and also demands grounds: the first intervention acknowledges the goal, names the right of third parties that would be affected, the health and travel of three neighborhoods, and proposes a way out. The other three deny somebody the right to have an opinion, generalize about all movements or appeal to the workload of the authority.' } }
  ], rng), rng);

  /* ── PROBLEMA 10 ────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Cómo saber si la acción funcionó', en:'How to know whether the action worked' }, showWork:false,
      stmt:{ es:'Tres meses después de entregar su petición, un colectivo quiere evaluar si su acción tuvo efecto. ¿Qué indicador muestra realmente un cambio en el ejercicio del derecho reclamado?',
             en:'Three months after delivering its petition, a collective wants to assess whether its action had an effect. Which indicator really shows a change in the exercise of the claimed right?' },
      options:{ es:[
        'Que la escuela emitió por escrito el nuevo horario de uso del comedor y que los estudiantes ya lo utilizan en ese horario todos los días.',
        'Que la publicación del colectivo alcanzó el mayor número de reacciones y comentarios de todo el ciclo escolar en curso.',
        'Que varias autoridades expresaron en una reunión que el tema les parece importante y que merece toda su atención.',
        'Que el colectivo sumó una cantidad considerable de integrantes nuevos después de la entrega de la petición.' ],
        en:[
        'That the school issued the new dining hall schedule in writing and that students already use it at that time every day.',
        'That the post of the collective reached the highest number of reactions and comments of the whole current school year.',
        'That several authorities said at a meeting that the topic seems important to them and deserves all their attention.',
        'That the collective gained a considerable number of new members after the petition was delivered.' ] },
      correct:0,
      hint:{ es:'Distingue entre señales de atención y una modificación comprobable en la vida diaria de las personas.',
             en:'Tell apart signals of attention from a checkable change in the daily life of people.' },
      explanation:{ es:'El resultado de una acción se mide en el ejercicio efectivo del derecho: existe un acto formal y las personas ya viven el cambio. Las reacciones, las expresiones de interés y el crecimiento del grupo son señales útiles de apoyo, pero ninguna demuestra por sí sola que la situación reclamada se haya modificado.',
                    en:'The result of an action is measured in the effective exercise of the right: a formal act exists and people already live the change. Reactions, expressions of interest and the growth of the group are useful signs of support, but none of them proves on its own that the claimed situation has changed.' } },
    { title:{ es:'El seguimiento después del acuerdo', en:'Follow up after the agreement' }, showWork:false,
      stmt:{ es:'La autoridad municipal firmó un acuerdo con un movimiento y se comprometió a instalar alumbrado en seis calles antes de diciembre. ¿Qué debe hacer el movimiento para que ese compromiso no se pierda?',
             en:'The town authority signed an agreement with a movement and committed to installing lighting in six streets before December. What should the movement do so that the commitment is not lost?' },
      options:{ es:[
        'Registrar el estado de cada calle en fechas acordadas y presentar públicamente ese registro ante la autoridad cuando llegue el plazo.',
        'Anunciar el acuerdo como un triunfo del movimiento y dar por concluida la etapa de exigencia frente a la autoridad municipal.',
        'Iniciar de inmediato un reclamo nuevo sobre otro tema para mantener activa la atención del público hacia el movimiento.',
        'Solicitar a la autoridad que sea ella quien informe al final del plazo si el compromiso quedó cumplido en las seis calles.' ],
        en:[
        'Record the state of each street on agreed dates and present that record publicly before the authority when the deadline arrives.',
        'Announce the agreement as a triumph of the movement and consider the stage of demanding before the town authority closed.',
        'Immediately start a new claim on another topic to keep public attention towards the movement active.',
        'Ask the authority itself to report at the end of the deadline whether the commitment was met in the six streets.' ] },
      correct:0,
      hint:{ es:'Piensa en quién conserva la evidencia cuando llega la fecha del compromiso.',
             en:'Think about who keeps the evidence when the date of the commitment arrives.' },
      explanation:{ es:'Un compromiso se sostiene cuando alguien lo verifica de forma independiente y con fechas. Un registro propio permite comparar lo prometido con lo ocurrido y hacerlo público al vencer el plazo. Celebrar y retirarse deja el cumplimiento sin vigilancia, abrir otro frente dispersa el esfuerzo, y dejar la evaluación solo en manos de quien está obligado suprime el control externo.',
                    en:'A commitment holds up when somebody verifies it independently and with dates. A record of your own allows comparing what was promised with what happened and making it public when the deadline arrives. Celebrating and withdrawing leaves compliance unwatched, opening another front scatters the effort, and leaving the assessment only in the hands of the duty bearer removes external oversight.' } }
  ], rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyjbSUYDHwe-0Hl5GnZC6mP3_iKPYnLqeUgbuhxARkW2-keCAAV6sSg0wYWJnJBhY7lUQ/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
