      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      }); wy += 2;
    }
    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  /* Footer on every page */
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+code+'  ·  '+t('pdf-page')+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  /* ── Cross-platform download ─────────────────────────────────────────────
     IMPORTANT: this entire function must remain synchronous (not async).
     Any await before this block would break Safari's user-gesture chain and
     cause window.open / navigator.share to be silently blocked on iOS.

     iOS/iPadOS strategy (in order of preference):
       1. navigator.share({ files }) → native Share Sheet → "Save to Files"
       2. window.open(blobUrl, '_blank') → opens PDF inline in Safari
       3. location.href = blobUrl → same-tab fallback if popup is blocked

     Desktop / Android: standard <a download> click.
     ──────────────────────────────────────────────────────────────────────── */
  var _fn   = SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _blob = doc.output('blob');

  function _restoreBtn() { btn.textContent = t('btn-pdf'); btn.disabled = false; }
  function _openInline(b) {
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }          // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  /* iPadOS 13+ reports platform === 'MacIntel' with touch support */
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    /* Prefer Web Share API with file — triggers "Save to Files" natively */
    var _file = new File([_blob], _fn, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [_file] })) {
      navigator.share({ files: [_file], title: _fn })
        .then(_restoreBtn)
        .catch(function(e) {
          if (e && e.name === 'AbortError') { _restoreBtn(); return; } /* user cancelled */
          _openInline(_blob); _restoreBtn();
        });
      return;   /* button state restored inside the promise callbacks above */
    }
    /* Older iOS without Web Share API — open blob inline */
    _openInline(_blob);
    _restoreBtn();
    return;
  }

  /* Desktop + Android — standard anchor-download */
  var _dlUrl = URL.createObjectURL(_blob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fn;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restoreBtn();

  } catch (err) {
    btn.textContent = t('btn-pdf');
    btn.disabled = false;
  }
}

/* ════════════════════════════════════════════════════════════════════════
   HELPERS · Linear Equations guide
   ════════════════════════════════════════════════════════════════════════ */
/* Feedback helper: cls = 'good' | 'miss' | 'warm' | '' */
function say(host, cls, msg) {
  var e = host.querySelector('.iw-fb');
  if (!e) return;
  e.className = 'iw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}
/* Language helper */
function L(o) { return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
/* Widget host factory */
function widgetHost(kind) {
  var d = document.createElement('div');
  d.className = 'gcrd section';
  d.setAttribute('data-widget', kind);
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

/* ── Show-work engagement gate (Rule 5B): presence check only ── */
function hasWork(i) {
  var dc = document.getElementById('dc' + i);
  var ta = document.getElementById('ta' + i);
  var pp = document.getElementById('pp' + i);
  var drawn = dc && dc.dataset.inked === '1';
  var typed = ta && ta.value.trim().length >= 15;
  var photo = pp && pp.src && pp.src.indexOf('data:') === 0;
  return !!(drawn || typed || photo);
}

/* ── number / money formatting (U+2212 for negatives) ── */
function neg(s) { return String(s).replace(/-/g, '\u2212'); }
function num(x, dp) {
  dp = (dp === undefined) ? 2 : dp;
  var r = Math.round(x * Math.pow(10, dp)) / Math.pow(10, dp);
  return neg(r.toLocaleString('en-US', { maximumFractionDigits: dp }));
}
function money(x) {
  var r = Math.round(x * 100) / 100, a = Math.abs(r);
  var s = a.toLocaleString('en-US', { minimumFractionDigits: (a % 1 === 0 ? 0 : 2), maximumFractionDigits: 2 });
  return (r < 0 ? '\u2212' : '') + '$' + s;
}
function fix2(x) { return (Math.round(x * 100) / 100).toFixed(2); }
function rint(rng, lo, hi, step) { step = step || 1; var n = Math.floor((hi - lo) / step) + 1; return lo + step * Math.floor(rng() * n); }
function parseNum(v) { var x = parseFloat(String(v).replace(',', '.')); return x; }
/* stacked fraction markup (Rule 12) */
function fr(n, d) { return '<span class="mf-outer"><span class="mf-num">' + n + '</span><span class="mf-den">' + d + '</span></span>'; }
/* keep option values distinct (first entry, the correct answer, never moves) */
function distinctNums(arr, bump) {
  var seen = {};
  return arr.map(function(v, i) {
    var x = v, g = 0;
    while (seen[num(x, 2)] && g < 12) { x += bump; g++; }
    seen[num(x, 2)] = 1;
    return x;
  });
}

/* ── exact fractions for the balance widget ── */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
function F(n, d) { d = (d === undefined) ? 1 : d; if (d < 0) { n = -n; d = -d; } var g = gcd(n, d); return [n / g, d / g]; }
function Fadd(p, q) { return F(p[0] * q[1] + q[0] * p[1], p[1] * q[1]); }
function Fmul(p, q) { return F(p[0] * q[0], p[1] * q[1]); }
function Fdiv(p, q) { return F(p[0] * q[1], p[1] * q[0]); }
function Fneg(p) { return F(-p[0], p[1]); }
function Fval(p) { return p[0] / p[1]; }
function Fstr(p) {
  if (p[1] === 1) return neg(String(p[0]));
  return (p[0] < 0 ? '\u2212' : '') + fr(Math.abs(p[0]), p[1]);
}
function leftHTML(co, k) {
  var s;
  if (co[0] === co[1]) s = 'x';
  else if (co[0] === -co[1]) s = '\u2212x';
  else if (co[1] === 1) s = neg(co[0]) + 'x';
  else s = (co[0] < 0 ? '\u2212' : '') + fr(Math.abs(co[0]), co[1]) + 'x';
  if (k[0] !== 0) s += (k[0] < 0 ? ' \u2212 ' : ' + ') + Fstr(F(Math.abs(k[0]), k[1]));
  return s;
}

/* ── add one graded problem card (options[0] is always the correct answer) ── */
function addProblem(o, rng) {
  var raw = o.opts.map(function(x) { return (typeof x === 'string') ? { es: x, en: x } : x; });
  var sh = shuffleOpts(raw.map(function(r) { return r.es; }), raw.map(function(r) { return r.en; }), rng);
  problems.push({
    i18n: { title: o.title, q: o.q, hint: o.hint, exp: o.exp, opts: { es: sh.es, en: sh.en } },
    title: o.title[LANG], questionText: o.q[LANG], options: sh[LANG].slice(), correctIdx: sh.correctIdx,
    explanation: o.exp[LANG], hint: o.hint[LANG], showWork: !!o.showWork, fn: o.fn || '',
    studentChoice: null, pendingChoice: null
  });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}
/* add a concept section that re-renders on language switch */
function addSec(es, en) {
  addSection(function(lg) { return lg === 'es' ? es : en; });
}

/* keep typed values when a widget re-renders on theme/language toggle */
function refreshWidget(host, render) {
  var snap = {};
  host.querySelectorAll('input[id], select[id]').forEach(function(e) { snap[e.id] = e.value; });
  render();
  Object.keys(snap).forEach(function(id) {
    var e = host.querySelector('#' + id);
    if (e && snap[id] !== '' && e.type !== 'range') { e.value = snap[id]; try { e.dispatchEvent(new Event('input')); } catch (x) {} }
  });
}

/* ════════════════════════════════════════════════════════════════════════
   W1 · BALANCE SOLVER  (Mode B · 5 rounds · data-widget="balance")
   ════════════════════════════════════════════════════════════════════════ */
function mkBalRound(form, rng) {
  var a, b, c, x0, co, k, ctx;
  if (form === 'add') {
    a = pick([3, 4, 5, 6, 7, 8, 9, 12], rng); x0 = rint(rng, 15, 90); b = rint(rng, 40, 480, 10); c = a * x0 + b;
    co = F(a, 1); k = F(b, 1);
    ctx = pick([
      { es: 'El costo mensual de producir <em>x</em> unidades es ' + a + 'x + ' + b + ' dólares. Con un presupuesto de ' + money(c) + ', ¿cuántas unidades se pueden producir?',
        en: 'The monthly cost of producing <em>x</em> units is ' + a + 'x + ' + b + ' dollars. With a budget of ' + money(c) + ', how many units can be produced?' },
      { es: 'Un consultor cobra ' + money(b) + ' por apertura de proyecto más ' + money(a) + ' por hora. El cliente pagó ' + money(c) + ' en total. ¿Cuántas horas <em>x</em> se facturaron?',
        en: 'A consultant charges ' + money(b) + ' to open a project plus ' + money(a) + ' per hour. The client paid ' + money(c) + ' in total. How many hours <em>x</em> were billed?' }
    ], rng);
  } else if (form === 'sub') {
    a = pick([8, 9, 12, 15, 18, 20, 24, 25], rng); x0 = rint(rng, 120, 400, 10); b = rint(rng, 500, 3000, 100); c = a * x0 - b;
    co = F(a, 1); k = F(-b, 1);
    ctx = pick([
      { es: 'Una tienda gana ' + money(a) + ' por unidad vendida y paga ' + money(b) + ' de costos fijos al mes. Su utilidad es ' + a + 'x − ' + num(b) + '. ¿Cuántas unidades <em>x</em> producen una utilidad de ' + money(c) + '?',
        en: 'A shop earns ' + money(a) + ' per unit sold and pays ' + money(b) + ' in fixed monthly costs. Its profit is ' + a + 'x − ' + num(b) + '. How many units <em>x</em> give a profit of ' + money(c) + '?' },
      { es: 'Un evento cobra ' + money(a) + ' por boleto y paga ' + money(b) + ' de renta del recinto. Después de la renta quedaron ' + money(c) + '. ¿Cuántos boletos <em>x</em> se vendieron?',
        en: 'An event charges ' + money(a) + ' per ticket and pays ' + money(b) + ' venue rental. After the rental, ' + money(c) + ' remained. How many tickets <em>x</em> were sold?' }
    ], rng);
  } else if (form === 'div') {
    a = pick([2, 3, 4, 5, 8], rng); x0 = a * rint(rng, 12, 60); b = rint(rng, 20, 300, 10); c = x0 / a + b;
    co = F(1, a); k = F(b, 1);
    ctx = {
      es: 'Un agente de ventas recibe la ' + (a === 2 ? 'mitad' : 'fracción ' + fr(1, a)) + ' de las ventas del mes <em>x</em> más un bono fijo de ' + money(b) + '. Su pago fue ' + money(c) + '. ¿Cuáles fueron las ventas?',
      en: 'A sales agent receives ' + (a === 2 ? 'one half' : 'one ' + ['', '', '', 'third', 'quarter', 'fifth', '', '', 'eighth'][a]) + ' of the month\'s sales <em>x</em> plus a fixed bonus of ' + money(b) + '. Pay was ' + money(c) + '. What were the sales?'
    };
  } else {
    a = pick([2, 3, 4, 5], rng); x0 = a * rint(rng, 20, 80); b = rint(rng, 10, Math.min(150, x0 / a - 5), 10); c = x0 / a - b;
    co = F(1, a); k = F(-b, 1);
    ctx = {
      es: 'Un proyecto genera ganancias <em>x</em> que se reparten en partes iguales entre ' + a + ' socios. Cada socio paga ' + money(b) + ' de cuotas y le quedan ' + money(c) + ' netos. ¿Cuánto fue la ganancia total <em>x</em>?',
      en: 'A project earns <em>x</em> in profit, split equally among ' + a + ' partners. Each partner pays ' + money(b) + ' in fees and keeps ' + money(c) + ' net. What was the total profit <em>x</em>?'
    };
  }
  return { form: form, co: co, k: k, c: F(c, 1), x0: x0, ctx: ctx };
}

function wBalance(rng, host) {
  var forms = ['add', 'sub', 'div', 'sub', 'subdiv'];
  var R = forms.map(function(f) { return mkBalRound(f, rng); });
  var st = { i: 0, cur: null, hist: [], miss: 0, verified: false, vmiss: 0, done: false, msg: null };

  function initRound() {
    var r = R[st.i];
    st.cur = { co: r.co.slice(), k: r.k.slice(), rt: r.c.slice() };
    st.hist = []; st.miss = 0; st.verified = false; st.vmiss = 0; st.msg = null;
  }
  initRound();

  function isIso(c) { return c.co[0] === 1 && c.co[1] === 1 && c.k[0] === 0; }
  function opWords(op, nf) {
    var n = Fstr(nf);
    if (op === 'add') return L({ es: 'Sumar ' + n + ' a ambos lados', en: 'Add ' + n + ' to both sides' });
    if (op === 'sub') return L({ es: 'Restar ' + n + ' a ambos lados', en: 'Subtract ' + n + ' from both sides' });
    if (op === 'mul') return L({ es: 'Multiplicar ambos lados por ' + n, en: 'Multiply both sides by ' + n });
    return L({ es: 'Dividir ambos lados entre ' + n, en: 'Divide both sides by ' + n });
  }
  function applyOp(c, op, nf) {
    if (op === 'add') return { co: c.co, k: Fadd(c.k, nf), rt: Fadd(c.rt, nf) };
    if (op === 'sub') { var m = Fneg(nf); return { co: c.co, k: Fadd(c.k, m), rt: Fadd(c.rt, m) }; }
    if (op === 'mul') return { co: Fmul(c.co, nf), k: Fmul(c.k, nf), rt: Fmul(c.rt, nf) };
    return { co: Fdiv(c.co, nf), k: Fdiv(c.k, nf), rt: Fdiv(c.rt, nf) };
  }

  function render() {
    var title = '<span class="iw-title">' + L({ es: 'Balanza de ecuaciones', en: 'Equation balance' }) + '</span>';
    if (st.done) {
      host.innerHTML = '<div class="iw-head">' + title + '</div><div class="iw-fb good">✓ ' +
        L({ es: 'Resolviste y verificaste cinco ecuaciones. Observa que el orden de las operaciones inversas cambia la aritmética intermedia, pero nunca la solución.',
            en: 'You solved and verified five equations. Notice that the order of the inverse operations changes the intermediate arithmetic but never the solution.' }) + '</div>';
      return;
    }
    var r = R[st.i], c = st.cur, iso = isIso(c);
    var h = '<div class="iw-head"><span class="iw-tag">' + L({ es: 'Ronda', en: 'Round' }) + ' ' + (st.i + 1) + '/' + R.length + '</span>' + title + '</div>';
    h += '<div class="iw-sub">' + L({
      es: 'Cada movimiento se aplica a ambos lados. Elige una operación y un número, escribe en qué se convierte el lado derecho (redondea a 2 decimales si hace falta) y presiona Aplicar. Aísla <em>x</em> y luego verifica la solución en la ecuación original. Puedes deshacer movimientos.',
      en: 'Every move is applied to both sides. Choose an operation and a number, type what the right side becomes (round to 2 decimals if needed) and press Apply. Isolate <em>x</em>, then verify the solution in the original equation. You can undo moves.' }) + '</div>';
    h += '<div class="scenario-box">' + L(r.ctx) + '</div>';
    h += '<div class="bal" id="bal"><div class="bal-pan">' + leftHTML(c.co, c.k) + '</div><div class="bal-mid">=</div><div class="bal-pan">' + Fstr(c.rt) + '</div></div>';
    if (st.hist.length) {
      h += '<div class="hist">' + st.hist.map(function(s, n) { return '<div>' + (n + 1) + '. ' + s.txt + '</div>'; }).join('') + '</div>';
    }
    if (!iso && !st.verified) {
      h += '<div class="frow">' +
        '<select class="wsel" id="bOp"><option value="add">' + L({ es: 'Sumar', en: 'Add' }) + '</option><option value="sub">' + L({ es: 'Restar', en: 'Subtract' }) + '</option><option value="mul">' + L({ es: 'Multiplicar por', en: 'Multiply by' }) + '</option><option value="div">' + L({ es: 'Dividir entre', en: 'Divide by' }) + '</option></select>' +
        '<input class="wnum" id="bN" type="number" step="any" placeholder="n">' +
        '<span>' + L({ es: 'lado derecho pasa a:', en: 'right side becomes:' }) + '</span>' +
        '<input class="wnum" id="bR" type="number" step="any" placeholder="?">' +
        '<button class="verify-btn" id="bApply" style="margin-top:0">' + L({ es: 'Aplicar', en: 'Apply' }) + '</button>' +
        '<button class="ghost-btn" id="bUndo" style="margin-top:0">' + L({ es: 'Deshacer', en: 'Undo' }) + '</button></div>';
    } else if (iso && !st.verified) {
      h += '<div class="scenario-box" style="border-left-color:var(--green)">' + L({ es: 'Aislaste la variable: <strong>x = ' + Fstr(c.rt) + '</strong>. Ahora sustituye este valor en la ecuación <strong>original</strong> y evalúa cada lado por separado.', en: 'You isolated the variable: <strong>x = ' + Fstr(c.rt) + '</strong>. Now substitute this value into the <strong>original</strong> equation and evaluate each side separately.' }) + '</div>' +
        '<div class="frow"><label>' + L({ es: 'Lado izquierdo original: ', en: 'Original left side: ' }) + '<strong>' + leftHTML(r.co, r.k) + '</strong> ' + L({ es: 'evaluado en x', en: 'evaluated at x' }) + '</label><input class="wnum" id="bL" type="number" step="any" placeholder="?"></div>' +
        '<div class="frow"><label>' + L({ es: 'Lado derecho original', en: 'Original right side' }) + '</label><input class="wnum" id="bRt" type="number" step="any" placeholder="?"></div>' +
        '<button class="verify-btn" id="bVfy">' + L({ es: 'Verificar', en: 'Check' }) + '</button>' +
        '<button class="ghost-btn" id="bUndo" style="margin-left:.5rem">' + L({ es: 'Deshacer', en: 'Undo' }) + '</button>';
    } else {
      h += '<button class="verify-btn" id="bNext">' + (st.i + 1 >= R.length ? L({ es: 'Terminar', en: 'Finish' }) : L({ es: 'Siguiente ronda', en: 'Next round' })) + '</button>';
    }
    h += '<div class="iw-fb"></div>';
    host.innerHTML = h;
    if (st.msg) say(host, st.msg.cls, st.msg.html);

    var ap = host.querySelector('#bApply');
    if (ap) ap.onclick = onApply;
    var un = host.querySelector('#bUndo');
    if (un) un.onclick = function() {
      if (!st.hist.length) return;
      var last = st.hist.pop(); st.cur = last.prev; st.miss = 0; st.msg = null; render();
    };
    var vf = host.querySelector('#bVfy');
    if (vf) vf.onclick = onVerify;
    var nx = host.querySelector('#bNext');
    if (nx) nx.onclick = function() { st.i++; if (st.i >= R.length) st.done = true; else initRound(); render(); };
  }

  function onApply() {
    var op = host.querySelector('#bOp').value;
    var nv = parseNum(host.querySelector('#bN').value), typed = parseNum(host.querySelector('#bR').value);
    if (isNaN(nv) || isNaN(typed)) { say(host, 'warm', L({ es: 'Elige una operación, escribe el número y el nuevo valor del lado derecho.', en: 'Choose an operation, enter the number and the new right-hand value.' })); return; }
    if ((op === 'div' || op === 'mul') && nv === 0) { say(host, 'warm', L({ es: 'Multiplicar o dividir entre cero destruye la ecuación. Elige otro número.', en: 'Multiplying or dividing by zero destroys the equation. Choose another number.' })); return; }
    if (nv === 0) { say(host, 'warm', L({ es: 'Sumar o restar cero no cambia nada. Elige otro número.', en: 'Adding or subtracting zero changes nothing. Choose another number.' })); return; }
    var nf = F(Math.round(nv * 100), 100), c = st.cur, nc = applyOp(c, op, nf);
    var exp = Fval(nc.rt);
    if (Math.abs(typed - exp) > 0.011) {
      st.miss++;
      if (st.miss >= 3) {
        host.querySelector('#bR').value = Math.round(exp * 100) / 100;
        say(host, 'warm', L({ es: 'El lado derecho pasa a ' + Fstr(nc.rt) + ': hay que aplicar la misma operación al valor anterior (' + Fstr(c.rt) + '). Presiona Aplicar para continuar.', en: 'The right side becomes ' + Fstr(nc.rt) + ': apply the same operation to the previous value (' + Fstr(c.rt) + '). Press Apply to continue.' }));
        st.miss = 2; /* next Apply with the revealed value will pass */
      } else {
        say(host, 'miss', L({ es: 'Antes de este movimiento el lado derecho valía ' + Fstr(c.rt) + '. Aplica "' + opWords(op, nf) + '" a ese valor y vuelve a intentar.', en: 'Before this move the right side was ' + Fstr(c.rt) + '. Apply "' + opWords(op, nf) + '" to that value and try again.' }));
      }
      return;
    }
    st.hist.push({ prev: c, txt: opWords(op, nf) + ' &rarr; ' + leftHTML(nc.co, nc.k) + ' = ' + Fstr(nc.rt) });
    st.cur = nc; st.miss = 0;
    var msg;
    if (isIso(nc)) msg = { cls: 'good', html: '✓ ' + L({ es: 'La variable quedó aislada. Falta la parte que más se omite: verificar en la ecuación original.', en: 'The variable is isolated. What remains is the step most often skipped: verifying in the original equation.' }) };
    else if (nc.k[0] === 0) msg = { cls: 'good', html: '✓ ' + L({ es: 'El término constante desapareció del lado izquierdo. Ahora solo queda deshacer la operación aplicada a x.', en: 'The constant term is gone from the left side. Now only the operation applied to x remains to be undone.' }) };
    else if (op === 'div' || op === 'mul') msg = { cls: 'warm', html: L({ es: 'Movimiento válido. Fíjate en la aritmética: dividir primero hace que las constantes se vuelvan fracciones. ¿Qué operación se aplicó a x en último lugar?', en: 'Valid move. Notice the arithmetic: dividing first turns the constants into fractions. Which operation was applied to x last?' }) };
    else msg = { cls: 'warm', html: L({ es: 'Movimiento válido, pero no acerca la variable al aislamiento. Piensa en deshacer primero la última operación aplicada a x.', en: 'Valid move, but it does not bring the variable closer to isolation. Think about undoing the last operation applied to x first.' }) };
    st.msg = msg;
    render();
    var b = host.querySelector('#bal'); if (b) { b.classList.add('wob'); setTimeout(function() { b.classList.remove('wob'); }, 550); }
  }

  function onVerify() {
    var r = R[st.i], x = Fval(st.cur.rt);
    var eL = Fval(r.co) * x + Fval(r.k), eR = Fval(r.c);
    var iL = host.querySelector('#bL'), iR = host.querySelector('#bRt');
    var vL = parseNum(iL.value), vR = parseNum(iR.value);
    if (isNaN(vL) || isNaN(vR)) { say(host, 'warm', L({ es: 'Completa ambos lados antes de verificar.', en: 'Fill in both sides before checking.' })); return; }
    var okL = Math.abs(vL - eL) <= 0.011, okR = Math.abs(vR - eR) <= 0.011;
    iL.classList.toggle('ok', okL); iL.classList.toggle('bad', !okL);
    iR.classList.toggle('ok', okR); iR.classList.toggle('bad', !okR);
    if (okL && okR) {
      st.verified = true;
      st.msg = { cls: 'good', html: '✓ ' + L({ es: 'Ambos lados valen ' + num(eR) + ' cuando x = ' + Fstr(st.cur.rt) + '. Una solución debe satisfacer la ecuación original; esta sustitución detecta cualquier error aritmético entre la primera línea y la última.', en: 'Both sides equal ' + num(eR) + ' when x = ' + Fstr(st.cur.rt) + '. A solution must satisfy the original equation; this substitution catches any arithmetic slip between the first line and the last.' }) };
      render();
    } else {
      st.vmiss++;
      if (st.vmiss >= 3) {
        iL.value = Math.round(eL * 100) / 100; iR.value = Math.round(eR * 100) / 100;
        iL.classList.add('ok'); iL.classList.remove('bad'); iR.classList.add('ok'); iR.classList.remove('bad');
        say(host, 'warm', L({ es: 'Al sustituir x = ' + Fstr(st.cur.rt) + ' en el lado izquierdo original obtienes ' + num(eL) + ' y el lado derecho vale ' + num(eR) + '. Multiplica primero y suma o resta después.', en: 'Substituting x = ' + Fstr(st.cur.rt) + ' into the original left side gives ' + num(eL) + ' and the right side is ' + num(eR) + '. Multiply first, then add or subtract.' }));
        st.verified = true; st.msg = null;
        var vb = host.querySelector('#bVfy'); if (vb) vb.disabled = true;
        var nb = document.createElement('button'); nb.className = 'verify-btn'; nb.style.marginLeft = '.5rem';
        nb.textContent = (st.i + 1 >= R.length) ? L({ es: 'Terminar', en: 'Finish' }) : L({ es: 'Siguiente ronda', en: 'Next round' });
        nb.onclick = function() { st.i++; if (st.i >= R.length) st.done = true; else initRound(); render(); };
        host.appendChild(nb);
      } else {
        say(host, 'miss', L({ es: (okL ? '' : 'El lado izquierdo no coincide con tu sustitución: calcula coeficiente por x y luego suma o resta la constante. ') + (okR ? '' : 'Revisa el lado derecho: ¿qué número aparece a la derecha del signo igual en el enunciado original?'), en: (okL ? '' : 'The left side does not match your substitution: compute coefficient times x, then add or subtract the constant. ') + (okR ? '' : 'Check the right side: which number sits right of the equal sign in the original statement?') }));
      }
    }
  }
  widgets.push(function(){ refreshWidget(host, render); }); render();
}

/* ════════════════════════════════════════════════════════════════════════
   W2 · ERROR HUNT  (Mode C · 8 items · data-widget="error-hunt")
   mkEHItem(family, variant, rng) → { ctx, lines[4], err, why, fix, orig }
   ════════════════════════════════════════════════════════════════════════ */
function mkEHItem(fam, variant, rng) {
  var it = {};
  if (fam === 'lin') {
    var a = rint(rng, 6, 14), c = rint(rng, 2, a - 2), x0 = rint(rng, 4, 30), b = rint(rng, 10, 90, 5);
    var d = (a - c) * x0 + b, k = a - c, m = d - b;
    var nm = pick([
      { es: 'empaque', en: 'packaging' }, { es: 'mensajería', en: 'courier' }, { es: 'impresión', en: 'printing' }
    ], rng);
    it.ctx = {
      es: 'Dos proveedores de ' + nm.es + ' tienen costos totales de ' + a + 'x + ' + b + ' (proveedor A) y ' + c + 'x + ' + d + ' (proveedor B) para <em>x</em> pedidos. Un analista busca el volumen donde ambos costos coinciden.',
      en: 'Two ' + nm.en + ' suppliers have total costs of ' + a + 'x + ' + b + ' (supplier A) and ' + c + 'x + ' + d + ' (supplier B) for <em>x</em> orders. An analyst looks for the volume where both costs are equal.'
    };
    it.orig = a + 'x + ' + b + ' = ' + c + 'x + ' + d;
    var L2ok = a + 'x − ' + c + 'x = ' + d + ' − ' + b, L3ok = k + 'x = ' + m, L4ok = 'x = ' + fr(m, k);
    if (variant === 'v2a') {
      it.lines = [it.orig, a + 'x − ' + c + 'x = ' + d + ' + ' + b, k + 'x = ' + (d + b), 'x = ' + fr(d + b, k)];
      it.err = 2; it.fix = L2ok;
      it.why = { es: 'Para eliminar ' + b + ' del lado izquierdo se resta ' + b + ' en ambos lados, así que el lado derecho queda ' + d + ' − ' + b + ', no ' + d + ' + ' + b + '.', en: 'To remove ' + b + ' from the left side you subtract ' + b + ' from both sides, so the right side becomes ' + d + ' − ' + b + ', not ' + d + ' + ' + b + '.' };
    } else if (variant === 'v2b') {
      it.lines = [it.orig, a + 'x + ' + c + 'x = ' + d + ' − ' + b, (a + c) + 'x = ' + m, 'x = ' + fr(m, a + c)];
      it.err = 2; it.fix = L2ok;
      it.why = { es: 'Para quitar ' + c + 'x del lado derecho hay que restar ' + c + 'x en ambos lados: queda ' + a + 'x − ' + c + 'x, no ' + a + 'x + ' + c + 'x.', en: 'To remove ' + c + 'x from the right side you subtract ' + c + 'x from both sides: this gives ' + a + 'x − ' + c + 'x, not ' + a + 'x + ' + c + 'x.' };
    } else if (variant === 'v3') {
      it.lines = [it.orig, L2ok, '(' + c + ' − ' + a + ')x = ' + m, 'x = ' + fr(m, neg(c - a))];
      it.err = 3; it.fix = L3ok;
      it.why = { es: 'Al combinar términos semejantes el coeficiente es ' + a + ' − ' + c + ' = ' + k + ', en ese orden. Invertir la resta cambia el signo de la solución.', en: 'When combining like terms the coefficient is ' + a + ' − ' + c + ' = ' + k + ', in that order. Reversing the subtraction flips the sign of the solution.' };
    } else {
      it.lines = [it.orig, L2ok, L3ok, 'x = ' + fr(k, m)];
      it.err = 4; it.fix = L4ok;
      it.why = { es: 'Se divide ambos lados entre el coeficiente de x: x = ' + m + ' ÷ ' + k + '. Escribirlo al revés da el recíproco.', en: 'Divide both sides by the coefficient of x: x = ' + m + ' ÷ ' + k + '. Writing it upside down gives the reciprocal.' };
    }
  } else if (fam === 'dec') {
    var rA = pick([15, 20, 25, 30], rng), delta = pick([5, 10, 15], rng), rB = rA + delta;
    var xd = pick([80, 100, 120, 150, 200, 250], rng), fB = pick([12.5, 18, 22.5, 30], rng);
    var fA = Math.round((fB + delta * xd / 100) * 100) / 100;
    var FA = Math.round(fA * 100), FB = Math.round(fB * 100), DD = FA - FB;
    var nm2 = pick([{ es: 'almacenamiento en la nube (GB)', en: 'cloud storage (GB)' }, { es: 'planes de datos (GB)', en: 'data plans (GB)' }], rng);
    it.ctx = {
      es: 'Dos planes de ' + nm2.es + ': el plan A cobra $' + num(fA) + ' fijos más $' + fix2(rA / 100) + ' por unidad y el plan B cobra $' + num(fB) + ' fijos más $' + fix2(rB / 100) + ' por unidad. Se busca el uso <em>x</em> donde cuestan lo mismo.',
      en: 'Two ' + nm2.en + ' plans: plan A charges $' + num(fA) + ' fixed plus $' + fix2(rA / 100) + ' per unit and plan B charges $' + num(fB) + ' fixed plus $' + fix2(rB / 100) + ' per unit. The analyst looks for the usage <em>x</em> where they cost the same.'
    };
    it.orig = fix2(rA / 100) + 'x + ' + num(fA) + ' = ' + fix2(rB / 100) + 'x + ' + num(fB);
    var L2d = rA + 'x + ' + num(FA) + ' = ' + rB + 'x + ' + num(FB), L3d = num(DD) + ' = ' + delta + 'x', L4d = 'x = ' + fr(num(DD), delta);
    if (variant === 'd2') {
      it.lines = [it.orig, rA + 'x + ' + num(fA) + ' = ' + rB + 'x + ' + num(fB), num(fA - fB) + ' = ' + delta + 'x', 'x = ' + fr(num(fA - fB), delta)];
      it.err = 2; it.fix = L2d;
      it.why = { es: 'Multiplicar por 100 debe afectar cada término, constantes incluidas. Aquí las constantes quedaron sin escalar y la ecuación cambió.', en: 'Multiplying by 100 must affect every term, constants included. Here the constants were left unscaled and the equation changed.' };
    } else {
      it.lines = [it.orig, L2d, L3d, 'x = ' + fr(num(DD), rA)];
      it.err = 4; it.fix = L4d;
      it.why = { es: 'Tras reunir términos el coeficiente de x es ' + rB + ' − ' + rA + ' = ' + delta + '; se divide entre ' + delta + ', no entre ' + rA + '.', en: 'After collecting terms the coefficient of x is ' + rB + ' − ' + rA + ' = ' + delta + '; divide by ' + delta + ', not by ' + rA + '.' };
    }
  } else {
    var pr = pick([[2, 3], [2, 5], [3, 4], [3, 5], [4, 5]], rng), fa = pr[0], fb = pr[1], t = rint(rng, 1, 4);
    var ab = fa * fb, f1 = rint(rng, 20, 60), f2 = f1 + (fb - fa) * t, kk = fb - fa, MM = ab * (f2 - f1);
    it.ctx = {
      es: 'Dos esquemas de compensación: el A paga ' + fr(1, fa) + ' de las ventas <em>x</em> más $' + f1 + ' y el B paga ' + fr(1, fb) + ' de las ventas más $' + f2 + '. Se busca el nivel de ventas donde ambos pagan igual.',
      en: 'Two compensation schemes: scheme A pays ' + fr(1, fa) + ' of sales <em>x</em> plus $' + f1 + ' and scheme B pays ' + fr(1, fb) + ' of sales plus $' + f2 + '. The analyst looks for the sales level where both pay the same.'
    };
    it.orig = fr('x', fa) + ' + ' + f1 + ' = ' + fr('x', fb) + ' + ' + f2;
    var L2f = fb + 'x + ' + (ab * f1) + ' = ' + fa + 'x + ' + (ab * f2), L3f = kk + 'x = ' + MM, L4f = 'x = ' + fr(MM, kk);
    if (variant === 'f2') {
      it.lines = [it.orig, fb + 'x + ' + f1 + ' = ' + fa + 'x + ' + (ab * f2), kk + 'x = ' + (ab * f2 - f1), 'x = ' + fr(ab * f2 - f1, kk)];
      it.err = 2; it.fix = L2f;
      it.why = { es: 'Multiplicar por ' + ab + ' para eliminar denominadores debe aplicarse a todos los términos, incluida la constante ' + f1 + '.', en: 'Multiplying by ' + ab + ' to clear denominators must be applied to every term, including the constant ' + f1 + '.' };
    } else {
      it.lines = [it.orig, L2f, kk + 'x = ' + (ab * f2 + ab * f1), 'x = ' + fr(ab * f2 + ab * f1, kk)];
      it.err = 3; it.fix = L3f;
      it.why = { es: 'Al restar ' + (ab * f1) + ' en ambos lados el lado derecho queda ' + (ab * f2) + ' − ' + (ab * f1) + ', no una suma.', en: 'Subtracting ' + (ab * f1) + ' from both sides leaves ' + (ab * f2) + ' − ' + (ab * f1) + ' on the right, not a sum.' };
    }
  }
  return it;
}

function wErrorHunt(rng, host) {
  var specs = [['lin', 'v2a'], ['lin', 'v2b'], ['lin', 'v3'], ['lin', 'v4'], ['dec', 'd2'], ['dec', 'd4'], ['fra', 'f2'], ['fra', 'f3']];
  var items = shuffle(specs, rng).map(function(s) { return mkEHItem(s[0], s[1], rng); });
  var st = { i: 0, miss: 0, solved: false, done: false };

  function render() {
    var title = '<span class="iw-title">' + L({ es: 'Caza de errores', en: 'Error hunt' }) + '</span>';
    if (st.done) {
      host.innerHTML = '<div class="iw-head">' + title + '</div><div class="iw-fb good">✓ ' + L({ es: 'Auditaste ocho soluciones ajenas. Los errores más comunes fueron cambiar un signo al mover un término y olvidar que multiplicar por un factor afecta cada término, constantes incluidas.', en: 'You audited eight solutions written by others. The most common errors were flipping a sign when moving a term and forgetting that multiplying by a factor affects every term, constants included.' }) + '</div>';
      return;
    }
    var it = items[st.i];
    var h = '<div class="iw-head"><span class="iw-tag">' + L({ es: 'Caso', en: 'Case' }) + ' ' + (st.i + 1) + '/' + items.length + '</span>' + title + '</div>';
    h += '<div class="iw-sub">' + L({ es: 'Un analista resolvió la ecuación en cuatro líneas y cometió exactamente un error. Las líneas siguientes heredan ese error. Toca la <strong>primera</strong> línea donde ocurre el error.', en: 'An analyst solved the equation in four lines and made exactly one mistake. The later lines inherit that mistake. Tap the <strong>first</strong> line where the mistake happens.' }) + '</div>';
    h += '<div class="scenario-box">' + L(it.ctx) + '</div>';
    h += it.lines.map(function(ln, n) { return '<button class="eh-line" data-n="' + (n + 1) + '"><span class="eh-n">' + (n + 1) + '</span><span>' + ln + '</span></button>'; }).join('');
    h += '<div class="iw-fb"></div>';
    host.innerHTML = h;
    st.solved = false; st.miss = 0;
    host.querySelectorAll('.eh-line').forEach(function(btn) {
      btn.onclick = function() {
        if (st.solved) return;
        var n = parseInt(btn.getAttribute('data-n'), 10);
        if (n === it.err) { solve(btn, false); return; }
        st.miss++;
        btn.classList.add('wrong'); setTimeout(function() { btn.classList.remove('wrong'); }, 800);
        if (st.miss >= 3) {
          var rb = host.querySelector('.eh-line[data-n="' + it.err + '"]'); solve(rb, true); return;
        }
        var m;
        if (n === 1) m = { es: 'La línea 1 solo enuncia el problema y no puede contener el error.', en: 'Line 1 only states the problem, so it cannot contain the error.' };
        else if (n < it.err) m = { es: 'Esa línea sí se sigue correctamente de la anterior. Revisa las líneas posteriores.', en: 'That line does follow correctly from the one before it. Look at the later lines.' };
        else m = { es: 'Esa línea hereda un error anterior, pero el primer error ocurre antes. Compara cada línea con la anterior.', en: 'That line inherits an earlier mistake, but the first error happens before it. Compare each line with the previous one.' };
        say(host, 'miss', L(m));
      };
    });
  }
  function solve(btn, revealed) {
    var it = items[st.i];
    st.solved = true;
    btn.classList.add('right');
    var pre = revealed ? L({ es: 'El primer error está en la línea ' + it.err + '. ', en: 'The first error is on line ' + it.err + '. ' }) : '✓ ';
    say(host, revealed ? 'warm' : 'good', pre + L(it.why) + ' ' + L({ es: 'Línea correcta:', en: 'Correct line:' }) + ' <span style="font-family:\'IBM Plex Mono\',monospace">' + it.fix + '</span>');
    var nb = document.createElement('button'); nb.className = 'verify-btn';
    nb.textContent = (st.i + 1 >= items.length) ? L({ es: 'Terminar', en: 'Finish' }) : L({ es: 'Siguiente caso', en: 'Next case' });
    nb.onclick = function() { st.i++; if (st.i >= items.length) st.done = true; render(); };
    host.appendChild(nb);
  }
  widgets.push(function(){ refreshWidget(host, render); }); render();
}

/* ════════════════════════════════════════════════════════════════════════
   W3 · MIXTURE MIXER  (Mode B · 5 rounds · data-widget="mixture")
   Equation shape: va·x + vb·(n − x) = V   →   (va − vb)x = V − vb·n
   ════════════════════════════════════════════════════════════════════════ */
function mkMix(kind, rng) {
  var o = { kind: kind };
  if (kind === 'candy') {
    var nm = pick([
      { A: { es: 'caramelos', en: 'caramels' }, B: { es: 'cremas', en: 'cremes' }, pk: { es: 'caja', en: 'box' }, pkA: { es: 'una', en: 'a' }, it: { es: 'piezas', en: 'pieces' } },
      { A: { es: 'almendras', en: 'almonds' }, B: { es: 'cacahuates', en: 'peanuts' }, pk: { es: 'bolsa', en: 'bag' }, pkA: { es: 'una', en: 'a' }, it: { es: 'piezas', en: 'pieces' } }
    ], rng);
    var n = pick([24, 30, 36, 40, 48], rng), a = pick([20, 25, 30], rng) / 100, b = a + pick([15, 20, 25], rng) / 100;
    var x0 = rint(rng, 8, n - 8, 2), cost = Math.round((a * x0 + b * (n - x0)) * 100) / 100, T = pick([2, 2.5, 3, 3.5, 4], rng);
    var P = Math.round((cost + T) * 100) / 100;
    o.n = n; o.va = a; o.vb = b; o.x0 = x0; o.V = cost; o.tol2 = 0.011;
    o.aName = nm.A; o.unit = nm.it;
    o.ctx = {
      es: 'Una ' + nm.pk.es + ' se vende en ' + money(P) + ' y contiene ' + n + ' piezas. Producir cada pieza de ' + nm.A.es + ' cuesta ' + money(a) + ' y cada pieza de ' + nm.B.es + ' cuesta ' + money(b) + '. ¿Cuántas piezas de ' + nm.A.es + ' debe llevar cada ' + nm.pk.es + ' para ganar ' + money(T) + ' por ' + nm.pk.es + '?',

function wMixture(rng, host) {

      host.innerHTML = '<div class="iw-head">' + title + '</div><div class="iw-fb good">✓ ' + L({ es: 'Resolviste cinco mezclas distintas con la misma estructura: definir x, escribir la otra cantidad como total − x, plantear la ecuación y simplificar.', en: 'You solved five different mixtures that share one structure: define x, write the other quantity as total − x, set up the equation and simplify.' }) + '</div>';

    host.querySelectorAll('.opt-btn').forEach(function(btn) {
      btn.onclick = function() {
        if (st.solved) return;
        var n = parseInt(btn.getAttribute('data-n'), 10);
        if (it.opts[n].ok) { finish(btn, false); return; }
        st.miss++;
        btn.classList.add('wrong'); btn.disabled = true;
        if (st.miss >= 3) {
          var idx = it.opts.map(function(o) { return o.ok; }).indexOf(true);
          finish(host.querySelector('.opt-btn[data-n="' + idx + '"]'), true); return;
        }
        say(host, 'miss', L({ es: 'Esa expresión no se obtiene al deshacer las operaciones en orden inverso. Pregúntate qué se le hizo a ' + p.v + ' al final y prueba con números sencillos.', en: 'That expression does not come from undoing the operations in reverse order. Ask what was done to ' + p.v + ' last, and test with simple numbers.' }));
      };
    });
  }
  function finish(btn, revealed) {
    var p = items[st.i].p;
    st.solved = true; btn.classList.add('right');
    host.querySelectorAll('.opt-btn').forEach(function(b) { b.disabled = true; });
    say(host, revealed ? 'warm' : 'good', (revealed ? '' : '✓ ') + L(p.why));
    var nb = document.createElement('button'); nb.className = 'verify-btn';
    nb.textContent = (st.i + 1 >= items.length) ? L({ es: 'Terminar', en: 'Finish' }) : L({ es: 'Siguiente fórmula', en: 'Next formula' });
    nb.onclick = function() { st.i++; if (st.i >= items.length) st.done = true; render(); };
    host.appendChild(nb);
  }
  widgets.push(function(){ refreshWidget(host, render); }); render();
}

/* ════════════════════════════════════════════════════════════════════════
   W5 · CONTRACT CASE  (Mode B · 4 rounds · data-widget="contract-case")
   Cost A = fA + uA·q   Cost B = fB + uB·q   (A: higher fee, lower unit price)
   ════════════════════════════════════════════════════════════════════════ */
function mkContract(dir, rng) {
  var fB = pick([0, 1500, 2000, 3000], rng), uA = rint(rng, 6, 18), d = pick([2, 3, 4, 5], rng), uB = uA + d;
  var qx = pick([100, 150, 200, 250, 300, 400], rng), fA = fB + d * qx;
  var step = pick([50, 100], rng), Qf = qx + dir * step;
  if (Qf <= 0) { Qf = qx + step; }
  var nm = pick([
    { es: 'transporte de carga', en: 'freight transport' }, { es: 'empaque', en: 'packaging' },
    { es: 'impresión de catálogos', en: 'catalogue printing' }, { es: 'hospedaje de servidores', en: 'server hosting' }
  ], rng);
  return { fA: fA, uA: uA, fB: fB, uB: uB, qx: qx, Qf: Qf, cA: fA + uA * Qf, cB: fB + uB * Qf, nm: nm, better: (fA + uA * Qf) < (fB + uB * Qf) ? 'A' : 'B' };
}

function niceCeil(v) {
  var p = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)), m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}

function wContract(rng, host) {
  var dirs = shuffle([1, -1, 1, -1], rng);
  var R = dirs.map(function(dr) { return mkContract(dr, rng); });
  var st = { i: 0, miss: 0, done: false, choice: null, solved: false, mark: 0 };

  function render() {
    var title = '<span class="iw-title">' + L({ es: 'Caso de contratos', en: 'Contract case' }) + '</span>';
    if (st.done) {
      host.innerHTML = '<div class="iw-head">' + title + '</div><div class="iw-fb good">✓ ' + L({ es: 'Comparaste cuatro pares de contratos. Recuerda: el punto de cruce solo dice dónde empatan; la decisión depende de dónde cae tu volumen pronosticado y de qué tan confiable es ese pronóstico.', en: 'You compared four pairs of contracts. Remember: the crossover only says where they tie; the decision depends on where your forecast volume falls and how reliable that forecast is.' }) + '</div>';
      return;
    }
    var r = R[st.i];
    var maxQ = Math.max(2 * r.qx, r.Qf + 50);
    var h = '<div class="iw-head"><span class="iw-tag">' + L({ es: 'Caso', en: 'Case' }) + ' ' + (st.i + 1) + '/' + R.length + '</span>' + title + '</div>';
    h += '<div class="iw-sub">' + L({ es: 'Predice primero: ¿en qué volumen se cruzan los costos? Calcula en papel el cruce y los costos al volumen pronosticado, y elige el contrato conveniente. La gráfica muestra las rectas, pero los costos solo se revelan al verificar.', en: 'Predict first: at what volume do the costs cross? Compute the crossover and the costs at the forecast volume on paper, then choose the better contract. The chart shows the lines, but costs are only revealed when you check.' }) + '</div>';
    h += '<div class="scenario-box">' + L({
      es: 'Cotización de ' + r.nm.es + ' con dos contratos. <strong>Contrato A:</strong> cuota fija de ' + money(r.fA) + ' más ' + money(r.uA) + ' por unidad. <strong>Contrato B:</strong> cuota fija de ' + money(r.fB) + ' más ' + money(r.uB) + ' por unidad. Volumen pronosticado: <strong>' + num(r.Qf) + ' unidades</strong>.',
      en: 'Quotes for ' + r.nm.en + ' under two contracts. <strong>Contract A:</strong> fixed fee of ' + money(r.fA) + ' plus ' + money(r.uA) + ' per unit. <strong>Contract B:</strong> fixed fee of ' + money(r.fB) + ' plus ' + money(r.uB) + ' per unit. Forecast volume: <strong>' + num(r.Qf) + ' units</strong>.' }) + '</div>';
    h += '<canvas class="iw-canvas" id="ctCv"></canvas>';
    h += '<div class="frow"><label>' + L({ es: 'Volumen a explorar en la gráfica (unidades)', en: 'Volume to explore on the chart (units)' }) + '</label><input type="range" id="ctSl" min="0" max="' + maxQ + '" step="10" value="' + r.Qf + '" style="flex:1 1 200px;accent-color:var(--green)"><span id="ctSv" class="cval">' + num(r.Qf) + '</span></div>';
    h += '<div class="frow"><label>1. ' + L({ es: 'Volumen de cruce q* (unidades)', en: 'Crossover volume q* (units)' }) + '</label><input class="wnum" id="ct1" type="number" step="any" placeholder="?"></div>';
    h += '<div class="frow"><label>2. ' + L({ es: 'Costo total del contrato A al volumen pronosticado ($)', en: 'Total cost of contract A at the forecast volume ($)' }) + '</label><input class="wnum" id="ct2" type="number" step="any" placeholder="?"></div>';
    h += '<div class="frow"><label>3. ' + L({ es: 'Costo total del contrato B al volumen pronosticado ($)', en: 'Total cost of contract B at the forecast volume ($)' }) + '</label><input class="wnum" id="ct3" type="number" step="any" placeholder="?"></div>';
    h += '<div class="frow"><label>4. ' + L({ es: 'Contrato recomendado', en: 'Recommended contract' }) + '</label>' +
      '<button class="opt-btn' + (st.choice === 'A' ? ' on' : '') + '" data-c="A" style="min-height:44px;width:120px">A</button>' +
      '<button class="opt-btn' + (st.choice === 'B' ? ' on' : '') + '" data-c="B" style="min-height:44px;width:120px">B</button></div>';
    h += '<button class="verify-btn" id="ctVfy">' + L({ es: 'Verificar', en: 'Check' }) + '</button>';
    h += '<div class="iw-fb"></div>';
    host.innerHTML = h;
    st.solved = false; st.miss = 0;
    var cv = host.querySelector('#ctCv'), sl = host.querySelector('#ctSl');
    function draw(showX) {
      var g = fitCanvas(cv, 210), ctx = g.ctx, W = g.w, H = g.h, pal = palette();
      var ox = 58, oy = H - 34, rp = 14, tp = 14;
      var maxY = Math.max(r.fA + r.uA * maxQ, r.fB + r.uB * maxQ), ys = niceCeil(maxY / 4), ymax = ys * Math.ceil(maxY / ys);
      var xs = Math.ceil(maxQ / 8 / 50) * 50;
      function px(q) { return ox + q * (W - ox - rp) / maxQ; }
      function py(y) { return oy - y * (oy - tp) / ymax; }
      ctx.font = '10px IBM Plex Sans,sans-serif'; ctx.lineWidth = 0.7;
      for (var q = 0; q <= maxQ; q += xs) {
        ctx.strokeStyle = pal.border; ctx.beginPath(); ctx.moveTo(px(q), tp); ctx.lineTo(px(q), oy); ctx.stroke();
        ctx.fillStyle = pal.text3; ctx.textAlign = 'center'; ctx.fillText(q, px(q), oy + 13);
      }
      for (var y = 0; y <= ymax + 1; y += ys) {
        ctx.strokeStyle = pal.border; ctx.beginPath(); ctx.moveTo(ox, py(y)); ctx.lineTo(W - rp, py(y)); ctx.stroke();
        ctx.fillStyle = pal.text3; ctx.textAlign = 'right'; ctx.fillText('$' + num(y, 0), ox - 5, py(y) + 3);
      }
      ctx.fillStyle = pal.text3; ctx.textAlign = 'center'; ctx.fillText(L({ es: 'Unidades', en: 'Units' }), ox + (W - ox - rp) / 2, oy + 27);
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = pal.green; ctx.beginPath(); ctx.moveTo(px(0), py(r.fA)); ctx.lineTo(px(maxQ), py(r.fA + r.uA * maxQ)); ctx.stroke();
      ctx.strokeStyle = pal.bad;   ctx.beginPath(); ctx.moveTo(px(0), py(r.fB)); ctx.lineTo(px(maxQ), py(r.fB + r.uB * maxQ)); ctx.stroke();
      ctx.font = '600 11px IBM Plex Sans,sans-serif'; ctx.textAlign = 'left';
      var yEA = r.fA + r.uA * maxQ, yEB = r.fB + r.uB * maxQ, aTop = yEA >= yEB;
      ctx.fillStyle = pal.green; ctx.fillText(L({ es: 'Contrato A', en: 'Contract A' }), px(maxQ) - 68, py(yEA) + (aTop ? -7 : 16));
      ctx.fillStyle = pal.bad;   ctx.fillText(L({ es: 'Contrato B', en: 'Contract B' }), px(maxQ) - 68, py(yEB) + (aTop ? 16 : -7));
      var qv = parseInt(sl.value, 10);
      ctx.strokeStyle = pal.gold; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(px(qv), tp); ctx.lineTo(px(qv), oy); ctx.stroke(); ctx.setLineDash([]);
      if (showX) {
        ctx.fillStyle = pal.gold; ctx.beginPath(); ctx.arc(px(r.qx), py(r.fB + r.uB * r.qx), 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = pal.text; ctx.font = '600 11px IBM Plex Sans,sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('q* = ' + r.qx, px(r.qx) + 9, py(r.fB + r.uB * r.qx) - 8);
      }
    }
    sl.oninput = function() { host.querySelector('#ctSv').textContent = num(parseInt(sl.value, 10)); draw(st.solved); };
    host.querySelectorAll('[data-c]').forEach(function(b) {
      b.onclick = function() { st.choice = b.getAttribute('data-c'); host.querySelectorAll('[data-c]').forEach(function(x) { x.classList.toggle('on', x === b); }); };
    });
    host.querySelector('#ctVfy').onclick = verify;
    st.draw = draw;
    setTimeout(function() { draw(false); }, 60);
  }

  function verify() {
    var r = R[st.i];
    var els = ['ct1', 'ct2', 'ct3'].map(function(id) { return host.querySelector('#' + id); });
    var vals = els.map(function(e) { return parseNum(e.value); }), exp = [r.qx, r.cA, r.cB];
    if (vals.some(function(v) { return isNaN(v); }) || !st.choice) { say(host, 'warm', L({ es: 'Completa los tres cálculos y elige un contrato antes de verificar.', en: 'Complete the three calculations and choose a contract before checking.' })); return; }
    var oks = vals.map(function(v, i) { return Math.abs(v - exp[i]) <= 0.51; });
    var okC = (st.choice === r.better);
    els.forEach(function(e, i) { e.classList.toggle('ok', oks[i]); e.classList.toggle('bad', !oks[i]); });
    if (oks.every(Boolean) && okC) { done(false); return; }
    st.miss++;
    if (st.miss >= 3) { els.forEach(function(e, i) { e.value = exp[i]; e.classList.add('ok'); e.classList.remove('bad'); }); st.choice = r.better; host.querySelectorAll('[data-c]').forEach(function(x) { x.classList.toggle('on', x.getAttribute('data-c') === r.better); }); done(true); return; }
    var bad = [];
    if (!oks[0]) bad.push(L({ es: 'el cruce (iguala fija A + variable A · q con fija B + variable B · q y prueba tu q* en ambos costos)', en: 'the crossover (set fee A + unit A · q equal to fee B + unit B · q and test your q* in both costs)' }));
    if (!oks[1]) bad.push(L({ es: 'el costo de A (cuota fija más precio unitario por volumen)', en: 'the cost of A (fixed fee plus unit price times volume)' }));
    if (!oks[2]) bad.push(L({ es: 'el costo de B', en: 'the cost of B' }));
    if (!okC) bad.push(L({ es: 'la recomendación (compara los dos costos al volumen pronosticado)', en: 'the recommendation (compare the two costs at the forecast volume)' }));
    say(host, 'miss', L({ es: 'Revisa: ', en: 'Review: ' }) + bad.join('; ') + '.');
  }

  function done(revealed) {
    var r = R[st.i], other = r.better === 'A' ? 'B' : 'A', save = Math.abs(r.cA - r.cB);
    st.solved = true;
    host.querySelector('#ctVfy').disabled = true;
    if (st.draw) st.draw(true);
    say(host, revealed ? 'warm' : 'good', (revealed ? '' : '✓ ') + L({
      es: 'El cruce es q* = ' + num(r.qx) + ' unidades. Al volumen pronosticado de ' + num(r.Qf) + ', A cuesta ' + money(r.cA) + ' y B cuesta ' + money(r.cB) + ', por lo que conviene el contrato ' + r.better + ', con un ahorro de ' + money(save) + ' frente al contrato ' + other + '. ' + (r.Qf > r.qx ? 'Por encima del cruce gana el contrato de menor costo unitario.' : 'Por debajo del cruce gana el contrato de menor cuota fija.'),
      en: 'The crossover is q* = ' + num(r.qx) + ' units. At the forecast volume of ' + num(r.Qf) + ', A costs ' + money(r.cA) + ' and B costs ' + money(r.cB) + ', so contract ' + r.better + ' is better, saving ' + money(save) + ' versus contract ' + other + '. ' + (r.Qf > r.qx ? 'Above the crossover the contract with the lower unit cost wins.' : 'Below the crossover the contract with the lower fixed fee wins.') }));
    var nb = document.createElement('button'); nb.className = 'verify-btn'; nb.style.marginLeft = '.5rem';
    nb.textContent = (st.i + 1 >= R.length) ? L({ es: 'Terminar', en: 'Finish' }) : L({ es: 'Siguiente caso', en: 'Next case' });
    nb.onclick = function() { st.i++; st.choice = null; if (st.i >= R.length) st.done = true; render(); };
    host.appendChild(nb);
  }
  widgets.push(function(){ refreshWidget(host, render); });
  render();
}

/* ════════════════════════════════════════════════════════════════════════
   buildLesson(rng)
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  /*
   * CONCEPT ARC
   * topic        : Linear Equations in One Variable: from Solving to Business Decisions
   * prerequisite : The student can evaluate a linear function y = mx + b and read slope and intercept.
   * sequence     :
   *   1. Solving ax + b = c by undoing operations in reverse order, then verifying by substitution
   *   2. Variables on both sides: collecting x, clearing decimals and fractions
   *   3. Translating a business story into an equation (define x, total minus x, reverse percent, mixtures)
   *   4. Rearranging formulas: solving for any letter with the same inverse-operation logic
   *   5. Break-even and contract decisions: chaining equations, crossover versus forecast volume
   * why_this_order: Solving must be secure before both-sides algebra, and both are needed before the student can
   *   build equations from stories; formulas are stories with letters; and decisions require all four skills at once.
   * time_audit   : reading ~10.8m (1510 words / 140 wpm) + widgets ~56.6m (balance 5 rounds ~13.8m, error hunt 8 items ~6.0m, mixture 5 rounds ~18.3m, rearrange 10 items ~5.8m, contract 4 rounds ~12.7m) + problems ~18.0m (8 gated x 120s, 2 conceptual x 60s) = ~85.4m (target 70-90m)
   */
  /* ═══════════════ CONCEPT 1 ═══════════════ */
  var a1 = rint(rng, 4, 9), x1 = rint(rng, 12, 60), b1 = rint(rng, 50, 400, 10), V1 = a1 * x1 + b1;
  var m1 = rint(rng, 12, 30), z1 = rint(rng, 20, 90), F1 = rint(rng, 300, 1500, 100), T1 = m1 * z1 - F1;
  addSec(
    '<div class="stag">Concepto 1 de 5</div><h2>Deshacer lo que se le hizo a x</h2>' +
    '<p>En la sesión de funciones lineales usaste <strong>y = mx + b</strong> para calcular una salida a partir de una entrada. En los negocios la pregunta suele ir al revés: se conoce la salida (un presupuesto, una meta de utilidad) y se necesita la entrada. Esa pregunta inversa es una <strong>ecuación lineal</strong>: una igualdad en la que la incógnita aparece con exponente 1 y cuyo conjunto solución es un único valor.</p>' +
    '<p>El método es el de las <strong>operaciones inversas</strong>: a x se le aplicaron operaciones en cierto orden (primero multiplicar, luego sumar); para aislarla se deshacen en el orden contrario. Dos reglas sostienen todo el proceso: lo que se hace a un lado se hace al otro, y una solución solo se acepta después de <strong>sustituirla en la ecuación original</strong>. Un error de signo produce respuestas que parecen razonables pero no pasan esa prueba.</p>' +
    '<div class="callout"><p><strong>Idea central.</strong> Si una ecuación tiene la forma ax + b = c, entonces la última operación aplicada a x fue sumar b, así que se deshace primero: ax = c − b, y después x = ' + fr('c − b', 'a') + '.</p></div>' +
    '<div class="wex"><div class="wex-t">Ejemplo resuelto 1: presupuesto de producción</div>' +
    '<p>El costo mensual de producir x unidades es ' + a1 + 'x + ' + b1 + ' dólares. Con un presupuesto de ' + money(V1) + ', ¿cuántas unidades se pueden producir?</p>' +
    '<ol><li>Plantear: ' + a1 + 'x + ' + b1 + ' = ' + V1 + '.</li>' +
    '<li>Deshacer la suma (restar ' + b1 + ' en ambos lados): ' + a1 + 'x = ' + V1 + ' − ' + b1 + ' = ' + (V1 - b1) + '.</li>' +
    '<li>Deshacer la multiplicación (dividir entre ' + a1 + '): x = ' + fr(V1 - b1, a1) + ' = ' + x1 + '.</li>' +
    '<li>Verificar: ' + a1 + '(' + x1 + ') + ' + b1 + ' = ' + (a1 * x1) + ' + ' + b1 + ' = ' + V1 + '. ✓</li></ol></div>' +
    '<div class="wex"><div class="wex-t">Ejemplo resuelto 2: meta de utilidad</div>' +
    '<p class="tryit">Resuélvelo primero en papel y después abre la solución.</p>' +
    '<p>La utilidad mensual de un negocio es ' + m1 + 'x − ' + num(F1) + ' dólares, donde x son las unidades vendidas. ¿Cuántas unidades producen una utilidad de ' + money(T1) + '?</p>' +
    '<details><summary>Ver solución</summary><ol><li>' + m1 + 'x − ' + num(F1) + ' = ' + num(T1) + '.</li><li>Sumar ' + num(F1) + ' en ambos lados: ' + m1 + 'x = ' + num(T1 + F1) + '.</li><li>Dividir entre ' + m1 + ': x = ' + z1 + ' unidades.</li><li>Verificar: ' + m1 + '(' + z1 + ') − ' + num(F1) + ' = ' + num(m1 * z1) + ' − ' + num(F1) + ' = ' + num(T1) + '. ✓</li></ol></details></div>',
    '<div class="stag">Concept 1 of 5</div><h2>Undoing what was done to x</h2>' +
    '<p>In the linear functions session you used <strong>y = mx + b</strong> to compute an output from an input. In business the question often runs the other way: the output is known (a budget, a profit goal) and the input is what you need. That reverse question is a <strong>linear equation</strong>: an equality in which the unknown appears to the first power and the solution set is a single value.</p>' +
    '<p>The method is <strong>inverse operations</strong>: x had operations applied to it in some order (first multiply, then add); to isolate it you undo them in the opposite order. Two rules hold the whole process together: whatever you do to one side you do to the other, and a solution is only accepted after you <strong>substitute it into the original equation</strong>. A sign slip produces answers that look reasonable but fail that test.</p>' +
    '<div class="callout"><p><strong>Key idea.</strong> If an equation has the form ax + b = c, the last operation applied to x was adding b, so it is undone first: ax = c − b, and then x = ' + fr('c − b', 'a') + '.</p></div>' +
    '<div class="wex"><div class="wex-t">Worked example 1: production budget</div>' +
    '<p>The monthly cost of producing x units is ' + a1 + 'x + ' + b1 + ' dollars. With a budget of ' + money(V1) + ', how many units can be produced?</p>' +
    '<ol><li>Set up: ' + a1 + 'x + ' + b1 + ' = ' + V1 + '.</li>' +
    '<li>Undo the addition (subtract ' + b1 + ' from both sides): ' + a1 + 'x = ' + V1 + ' − ' + b1 + ' = ' + (V1 - b1) + '.</li>' +
    '<li>Undo the multiplication (divide by ' + a1 + '): x = ' + fr(V1 - b1, a1) + ' = ' + x1 + '.</li>' +
    '<li>Verify: ' + a1 + '(' + x1 + ') + ' + b1 + ' = ' + (a1 * x1) + ' + ' + b1 + ' = ' + V1 + '. ✓</li></ol></div>' +
    '<div class="wex"><div class="wex-t">Worked example 2: profit goal</div>' +
    '<p class="tryit">Solve it on paper first, then open the solution.</p>' +
    '<p>A business earns a monthly profit of ' + m1 + 'x − ' + num(F1) + ' dollars, where x is units sold. How many units give a profit of ' + money(T1) + '?</p>' +
    '<details><summary>Show solution</summary><ol><li>' + m1 + 'x − ' + num(F1) + ' = ' + num(T1) + '.</li><li>Add ' + num(F1) + ' to both sides: ' + m1 + 'x = ' + num(T1 + F1) + '.</li><li>Divide by ' + m1 + ': x = ' + z1 + ' units.</li><li>Verify: ' + m1 + '(' + z1 + ') − ' + num(F1) + ' = ' + num(m1 * z1) + ' − ' + num(F1) + ' = ' + num(T1) + '. ✓</li></ol></details></div>'
  );
  wBalance(rng, widgetHost('balance'));

  var pa = rint(rng, 8, 16), px = rint(rng, 18, 70), pf = rint(rng, 120, 480, 10), pT = pa * px + pf;
  var o1 = distinctNums([px, (pT + pf) / pa, pT / pa, pT - pf - pa], 1);
  var ctx1 = pick([
    { es: 'Un servicio de mensajería cobra ' + money(pf) + ' de cuota de apertura más ' + money(pa) + ' por kilómetro recorrido. El cliente pagó en total ' + money(pT) + '. ¿Cuántos kilómetros se recorrieron?', en: 'A courier service charges ' + money(pf) + ' as an opening fee plus ' + money(pa) + ' per kilometre travelled. The client paid ' + money(pT) + ' in total. How many kilometres were travelled?' },
    { es: 'Una agencia cobra ' + money(pf) + ' de honorarios de arranque más ' + money(pa) + ' por hora de asesoría. La factura total fue de ' + money(pT) + '. ¿Cuántas horas se facturaron?', en: 'An agency charges ' + money(pf) + ' as a start-up fee plus ' + money(pa) + ' per hour of advice. The total invoice was ' + money(pT) + '. How many hours were billed?' }
  ], rng);
  addProblem({

    '<p>Dos patrones aparecen constantemente. El primero es el <strong>porcentaje inverso</strong>: si un precio final S resulta de aplicar un descuento del r%, el precio original P cumple (1 − r)P = S; dividir S entre r es un error frecuente. El segundo es la <strong>mezcla</strong>: cuando un total n se reparte entre dos tipos, si x es la cantidad de un tipo entonces la del otro es <strong>n − x</strong>. Aunque hay dos cantidades desconocidas, con esta sustitución queda una sola ecuación con una sola variable.</p>' +

    '<div class="stag">Concept 3 of 5</div><h2>From a story to an equation</h2>' +
    '<p>Solving equations that are already written is only half the craft; an analyst receives <em>stories</em>, not equations. So, building on collecting terms and isolating variables, the missing prior skill is now needed: translating a situation into symbols. The procedure has five steps: <strong>define</strong> the unknown with units, <strong>express</strong> the other quantities in terms of it, <strong>set up</strong> the equality, <strong>solve</strong>, and <strong>check that the answer makes sense</strong> (is it a whole number when it must be? is it positive?).</p>' +
    '<p>Two patterns appear constantly. The first is the <strong>reverse percent</strong>: if a final price S results from a discount of r%, the original price P satisfies (1 − r)P = S; dividing S by r is a frequent mistake. The second is the <strong>mixture</strong>: when a total n is split between two types, if x is the amount of one type then the other is <strong>n − x</strong>. Although two quantities are unknown, this substitution leaves one equation in one variable.</p>' +

    '<div class="stag">Concepto 4 de 5</div><h2>Despejar fórmulas</h2>' +
    '<p>Las historias del concepto anterior producían ecuaciones con números; en finanzas y economía los modelos se guardan como <strong>fórmulas con letras</strong>, y se necesita la fórmula resuelta para una letra distinta según la pregunta del día. Despejar una variable no es un tema nuevo: es el mismo método de operaciones inversas, pero las constantes ahora son símbolos y la respuesta es una expresión.</p>' +
    '<p>La pauta es identificar <strong>la última operación aplicada a la letra buscada y deshacerla primero</strong>. En A = P(1 + rt), la letra t está dentro de un paréntesis que a su vez multiplica a P; por eso primero se divide entre P, luego se resta 1 y al final se divide entre r. Cuando la letra buscada aparece en dos términos, como en A = P + Prt, se <strong>factoriza</strong> para que aparezca una sola vez. Y como siempre, la comprobación es numérica: sustituye valores sencillos en la fórmula original y en la despejada, y ambas deben coincidir.</p>' +

  );
  wRearrange(rng, widgetHost('rearrange'));

  var P4b = pick([2500, 4000, 6000, 9000], rng), r4b = pick([4, 5, 6, 8], rng), t4b = pick([2, 3, 4, 5], rng), A4b = P4b * (1 + r4b * t4b / 100);
  var oT = distinctNums([t4b, A4b / (P4b * r4b / 100), (A4b - P4b) / (r4b / 100), (A4b + P4b) / (P4b * r4b / 100)], 1);
  addProblem({
    title: { es: 'Plazo de una inversión', en: 'Term of an investment' },
    q: { es: 'Un fondo paga interés simple a una tasa anual de ' + r4b + '%. Una inversión inicial de ' + money(P4b) + ' se convirtió en ' + money(A4b) + '. ¿Cuántos años estuvo invertida?', en: 'A fund pays simple interest at an annual rate of ' + r4b + '%. An initial investment of ' + money(P4b) + ' grew to ' + money(A4b) + '. For how many years was it invested?' },
    showWork: true, fn: 'A = P(1 + rt)',
    hint: { es: 'Despeja t en la fórmula antes de sustituir: deshaz primero lo que multiplica al paréntesis.', en: 'Solve the formula for t before substituting: undo what multiplies the bracket first.' },
    exp: { es: 'De A = P(1 + rt): t = ' + fr('A − P', 'P r') + ' = ' + fr(num(A4b - P4b), num(P4b) + ' × ' + fix2(r4b / 100)) + ' = ' + t4b + ' años. Omitir la resta de P da un valor mucho mayor.', en: 'From A = P(1 + rt): t = ' + fr('A − P', 'P r') + ' = ' + fr(num(A4b - P4b), num(P4b) + ' × ' + fix2(r4b / 100)) + ' = ' + t4b + ' years. Skipping the subtraction of P gives a much larger value.' },
    opts: oT.map(function(v) { return num(v, 2); })
  }, rng);

  /* ═══════════════ CONCEPT 5 ═══════════════ */
  var p5 = rint(rng, 40, 90, 5), v5 = rint(rng, 15, p5 - 15, 5), F5 = rint(rng, 3000, 12000, 1000), be = 0;
  var mg5 = p5 - v5; F5 = mg5 * rint(rng, 120, 400, 20); be = F5 / mg5;
  var cf = rint(rng, 6, 16), cd = pick([2, 3, 4], rng), cq = pick([150, 200, 250, 300], rng), cfB = pick([0, 2000, 3000], rng), cfA = cfB + cd * cq, cQ = cq + pick([100, 150], rng);
  addSec(
    '<div class="stag">Concepto 5 de 5</div><h2>Punto de equilibrio y decisión</h2>' +
    '<p>Ya sabes plantear ecuaciones, resolverlas y despejar cualquier letra; el último paso es encadenar esas habilidades para <strong>decidir</strong>. Un modelo lineal de costo, C = F + vq, y uno de ingreso, R = pq, son las funciones lineales de la sesión anterior; igualarlas es resolver una ecuación con q en ambos lados. La solución, <strong>q* = ' + fr('F', 'p − v') + '</strong>, es el punto de equilibrio: por debajo hay pérdida y por encima hay utilidad.</p>' +
    '<p>El mismo razonamiento compara <strong>dos contratos</strong>. Si el contrato A tiene cuota fija mayor pero precio unitario menor que el B, sus rectas de costo se cruzan en un volumen de cruce q*. Debajo del cruce conviene el de menor cuota fija; encima, el de menor precio unitario. El cruce solo separa las zonas: la decisión depende de en qué lado cae el <strong>volumen pronosticado</strong> y de qué tan confiable es ese pronóstico. Un cruce cercano al pronóstico es una señal de riesgo, porque un error moderado invierte la recomendación.</p>' +
    '<div class="wex"><div class="wex-t">Ejemplo resuelto 1: equilibrio</div><p>Un producto se vende a ' + money(p5) + ', cuesta ' + money(v5) + ' de costo variable por unidad y hay ' + money(F5) + ' de costos fijos.</p>' +
    '<ol><li>Igualar ingreso y costo: ' + p5 + 'q = ' + num(F5) + ' + ' + v5 + 'q.</li><li>Restar ' + v5 + 'q: ' + mg5 + 'q = ' + num(F5) + '.</li><li>Dividir: q* = ' + num(be) + ' unidades.</li></ol></div>' +
    '<div class="wex"><div class="wex-t">Ejemplo resuelto 2: dos contratos</div><p>El contrato A cuesta ' + money(cfA) + ' fijos más ' + money(cf) + ' por unidad y el B cuesta ' + money(cfB) + ' fijos más ' + money(cf + cd) + ' por unidad. El volumen pronosticado es ' + num(cQ) + ' unidades.</p>' +
    '<ol><li>Cruce: ' + cf + 'q + ' + num(cfA) + ' = ' + (cf + cd) + 'q + ' + num(cfB) + ', de donde ' + cd + 'q = ' + num(cfA - cfB) + ' y q* = ' + cq + '.</li><li>El pronóstico (' + num(cQ) + ') está por encima del cruce, así que conviene el contrato de menor precio unitario, el A.</li><li>Verificar: A = ' + money(cfA + cf * cQ) + ' y B = ' + money(cfB + (cf + cd) * cQ) + '. ✓</li></ol></div>',
    '<div class="stag">Concept 5 of 5</div><h2>Break-even and decision making</h2>' +
    '<p>You can now set up equations, solve them and rearrange any letter; the last step is to chain those skills in order to <strong>decide</strong>. A linear cost model, C = F + vq, and a revenue model, R = pq, are the linear functions from the previous session; equating them means solving an equation with q on both sides. The solution, <strong>q* = ' + fr('F', 'p − v') + '</strong>, is the break-even point: below it there is a loss and above it a profit.</p>' +
    '<p>The same reasoning compares <strong>two contracts</strong>. If contract A has a higher fixed fee but a lower unit price than B, their cost lines cross at a crossover volume q*. Below the crossover the contract with the lower fixed fee is better; above it, the one with the lower unit price. The crossover only separates the zones: the decision depends on which side the <strong>forecast volume</strong> falls and how reliable that forecast is. A crossover close to the forecast is a warning sign, because a moderate forecasting error reverses the recommendation.</p>' +
    '<div class="wex"><div class="wex-t">Worked example 1: break-even</div><p>A product sells for ' + money(p5) + ', has a variable cost of ' + money(v5) + ' per unit and ' + money(F5) + ' in fixed costs.</p>' +
    '<ol><li>Equate revenue and cost: ' + p5 + 'q = ' + num(F5) + ' + ' + v5 + 'q.</li><li>Subtract ' + v5 + 'q: ' + mg5 + 'q = ' + num(F5) + '.</li><li>Divide: q* = ' + num(be) + ' units.</li></ol></div>' +
    '<div class="wex"><div class="wex-t">Worked example 2: two contracts</div><p>Contract A costs ' + money(cfA) + ' fixed plus ' + money(cf) + ' per unit and contract B costs ' + money(cfB) + ' fixed plus ' + money(cf + cd) + ' per unit. The forecast volume is ' + num(cQ) + ' units.</p>' +
    '<ol><li>Crossover: ' + cf + 'q + ' + num(cfA) + ' = ' + (cf + cd) + 'q + ' + num(cfB) + ', so ' + cd + 'q = ' + num(cfA - cfB) + ' and q* = ' + cq + '.</li><li>The forecast (' + num(cQ) + ') is above the crossover, so the contract with the lower unit price, A, is better.</li><li>Verify: A = ' + money(cfA + cf * cQ) + ' and B = ' + money(cfB + (cf + cd) * cQ) + '. ✓</li></ol></div>'
  );
  wContract(rng, widgetHost('contract-case'));

  var pp5 = rint(rng, 40, 80, 5), vv5 = rint(rng, 15, pp5 - 15, 5), mm5 = pp5 - vv5, FF5 = rint(rng, 3000, 9000, 500), tp5 = pick([2000, 3000, 4000, 5000], rng);
  var qq5 = (tp5 + FF5) / mm5;
  if (qq5 !== Math.round(qq5)) { FF5 = mm5 * rint(rng, 100, 300, 10) - tp5; qq5 = (tp5 + FF5) / mm5; }
  var oB = distinctNums([qq5, (FF5 - tp5) / mm5, (tp5 + FF5) / pp5, FF5 / mm5], 1);
  addProblem({
    title: { es: 'Volumen para una utilidad meta', en: 'Volume for a profit target' },
    q: { es: 'Un producto se vende a ' + money(pp5) + ' y su costo variable es ' + money(vv5) + ' por unidad. Los costos fijos son ' + money(FF5) + ' y la dirección quiere una utilidad de ' + money(tp5) + '. ¿Cuántas unidades deben venderse?', en: 'A product sells for ' + money(pp5) + ' and its variable cost is ' + money(vv5) + ' per unit. Fixed costs are ' + money(FF5) + ' and management wants a profit of ' + money(tp5) + '. How many units must be sold?' },
    showWork: true,
    hint: { es: 'La utilidad es ingreso menos costo total. Plantea esa igualdad con la meta y despeja el volumen.', en: 'Profit is revenue minus total cost. Set that equal to the target and solve for the volume.' },
    exp: { es: 'Utilidad = ' + pp5 + 'q − (' + num(FF5) + ' + ' + vv5 + 'q) = ' + num(tp5) + ', entonces ' + mm5 + 'q = ' + num(tp5 + FF5) + ' y q = ' + num(qq5) + '. Con ' + num(FF5 / mm5, 2) + ' unidades solo se cubren los costos fijos (equilibrio).', en: 'Profit = ' + pp5 + 'q − (' + num(FF5) + ' + ' + vv5 + 'q) = ' + num(tp5) + ', so ' + mm5 + 'q = ' + num(tp5 + FF5) + ' and q = ' + num(qq5) + '. With ' + num(FF5 / mm5, 2) + ' units only the fixed costs are covered (break-even).' },
    opts: oB.map(function(v) { return num(v, 2); })
  }, rng);

  /* ═══════════════ FINAL ASSESSMENT ═══════════════ */
  addSec(
    '<div class="stag">Evaluación final</div><h2>Integra todo lo aprendido</h2><p>Las cinco situaciones siguientes mezclan porcentajes, errores de procedimiento, contratos e interpretación. Trabaja cada una en papel y verifica tus soluciones por sustitución antes de responder.</p>',
    '<div class="stag">Final assessment</div><h2>Put it all together</h2><p>The five situations below mix percentages, procedural errors, contracts and interpretation. Work each one on paper and verify your solutions by substitution before answering.</p>'
  );

  /* P6 · reverse percent with tax */
  var tx = pick([16, 8, 10], rng), Pnet = pick([250, 400, 500, 750, 1200, 1500], rng), Pgross = Pnet * (1 + tx / 100);
  var o6 = distinctNums([Pnet, Pgross * (1 - tx / 100), Pgross - tx, Pgross / (1 - tx / 100)], 1);
  addProblem({
    title: { es: 'Precio antes de impuesto', en: 'Price before tax' },
    q: { es: 'Una factura con IVA del ' + tx + '% incluido suma ' + money(Pgross) + '. ¿Cuál era el precio antes de impuesto?', en: 'An invoice with ' + tx + '% VAT included totals ' + money(Pgross) + '. What was the price before tax?' },
    showWork: true,
    hint: { es: 'El total es el precio base más el impuesto calculado sobre ese mismo precio base. Llama P al precio base.', en: 'The total is the base price plus the tax computed on that same base price. Call the base price P.' },
    exp: { es: 'P + ' + fix2(tx / 100) + 'P = ' + fix2(Pgross) + ', luego ' + fix2(1 + tx / 100) + 'P = ' + fix2(Pgross) + ' y P = ' + money(Pnet) + '. Restar el ' + tx + '% del total trata el impuesto como si se hubiera calculado sobre el total.', en: 'P + ' + fix2(tx / 100) + 'P = ' + fix2(Pgross) + ', so ' + fix2(1 + tx / 100) + 'P = ' + fix2(Pgross) + ' and P = ' + money(Pnet) + '. Removing ' + tx + '% of the total treats the tax as if it had been computed on the total.' },
    opts: o6.map(function(v) { return money(v); })
  }, rng);

  /* P7 · spot the error (conceptual) */
  var ehv = pick([['lin', 'v2a'], ['lin', 'v2b'], ['lin', 'v3'], ['lin', 'v4']], rng), ehi = mkEHItem(ehv[0], ehv[1], rng);
  var linesHtml = ehi.lines.map(function(ln, n) { return '<span class="pfn" style="font-size:.9rem;margin-top:.3rem">' + (n + 1) + '. ' + ln + '</span>'; }).join('');
  var errOpts = [{ es: 'Línea ' + ehi.err, en: 'Line ' + ehi.err }];
  [2, 3, 4].forEach(function(n) { if (n !== ehi.err) errOpts.push({ es: 'Línea ' + n, en: 'Line ' + n }); });
  errOpts.push({ es: 'Ninguna línea contiene un error', en: 'No line contains an error' });
  errOpts = errOpts.slice(0, 4);
  addProblem({
    title: { es: 'Auditoría de una solución', en: 'Auditing a solution' },
    q: { es: ehi.ctx.es + ' Su solución fue:' + linesHtml + '<br>¿En qué línea aparece por primera vez un error?', en: ehi.ctx.en + ' Their solution was:' + linesHtml + '<br>On which line does an error first appear?' },
    showWork: false,
    hint: { es: 'Compara cada línea con la anterior: ¿se obtuvo aplicando la misma operación a ambos lados?', en: 'Compare each line with the previous one: was it obtained by applying the same operation to both sides?' },
    exp: { es: 'El error aparece en la línea ' + ehi.err + '. ' + ehi.why.es + ' La línea correcta es ' + ehi.fix + '.', en: 'The error appears on line ' + ehi.err + '. ' + ehi.why.en + ' The correct line is ' + ehi.fix + '.' },
    opts: errOpts
  }, rng);

  /* P8 · contract choice */
  var ct = mkContract(pick([1, -1], rng), rng), ctSave = Math.abs(ct.cA - ct.cB), ctO = ct.better === 'A' ? 'B' : 'A';
  var sv2 = distinctNums([ctSave, ct.qx * (ct.uB - ct.uA), ctSave + ct.fA - ct.fB + ct.uA, Math.abs(ct.fA - ct.fB)], 10);
  addProblem({
    title: { es: 'Elegir el contrato', en: 'Choosing the contract' },
    q: { es: 'Para ' + ct.nm.es + ', el contrato A cobra ' + money(ct.fA) + ' fijos más ' + money(ct.uA) + ' por unidad y el contrato B cobra ' + money(ct.fB) + ' fijos más ' + money(ct.uB) + ' por unidad. Se pronostican ' + num(ct.Qf) + ' unidades. ¿Qué contrato conviene y cuánto se ahorra frente al otro?', en: 'For ' + ct.nm.en + ', contract A charges ' + money(ct.fA) + ' fixed plus ' + money(ct.uA) + ' per unit and contract B charges ' + money(ct.fB) + ' fixed plus ' + money(ct.uB) + ' per unit. ' + num(ct.Qf) + ' units are forecast. Which contract is better and how much is saved versus the other?' },
    showWork: true,
    hint: { es: 'Calcula el costo total de cada contrato al volumen pronosticado y compara. El cruce te dice qué zona ocupa el pronóstico.', en: 'Compute each contract\'s total cost at the forecast volume and compare. The crossover tells you which zone the forecast is in.' },
    exp: { es: 'A cuesta ' + money(ct.cA) + ' y B cuesta ' + money(ct.cB) + '. Conviene el contrato ' + ct.better + ' y ahorra ' + money(ctSave) + ' frente al ' + ctO + '. El cruce está en ' + num(ct.qx) + ' unidades.', en: 'A costs ' + money(ct.cA) + ' and B costs ' + money(ct.cB) + '. Contract ' + ct.better + ' is better and saves ' + money(ctSave) + ' versus ' + ctO + '. The crossover is at ' + num(ct.qx) + ' units.' },
    opts: [
      { es: 'Contrato ' + ct.better + ', ahorro de ' + money(sv2[0]), en: 'Contract ' + ct.better + ', saving of ' + money(sv2[0]) },
      { es: 'Contrato ' + ctO + ', ahorro de ' + money(sv2[0]), en: 'Contract ' + ctO + ', saving of ' + money(sv2[0]) },
      { es: 'Contrato ' + ct.better + ', ahorro de ' + money(sv2[1]), en: 'Contract ' + ct.better + ', saving of ' + money(sv2[1]) },
      { es: 'Contrato ' + ctO + ', ahorro de ' + money(sv2[3]), en: 'Contract ' + ctO + ', saving of ' + money(sv2[3]) }
    ]
  }, rng);

  /* P9 · interpretation (conceptual) */
  var pm = rint(rng, 12, 30), pF = pm * rint(rng, 150, 400, 10), pq = pF / pm;
  addProblem({
    title: { es: 'Interpretar la solución', en: 'Interpreting the solution' },
    q: { es: 'El modelo de utilidad mensual de una tienda es π = ' + pm + 'q − ' + num(pF) + ', con q en unidades vendidas. Al resolver π = 0 se obtiene q = ' + num(pq) + '. ¿Qué significa este resultado para la tienda?', en: 'A store\'s monthly profit model is π = ' + pm + 'q − ' + num(pF) + ', with q in units sold. Solving π = 0 gives q = ' + num(pq) + '. What does this result mean for the store?' },
    showWork: false,
    hint: { es: 'Piensa en qué representa una utilidad igual a cero y qué pasa con la utilidad cuando q sube o baja de ese valor.', en: 'Think about what a profit of zero represents and what happens to profit when q rises above or falls below that value.' },
    exp: { es: 'Con ' + num(pq) + ' unidades los ingresos igualan a los costos: es el punto de equilibrio. Como la pendiente ' + pm + ' es positiva, vender más genera utilidad y vender menos genera pérdida.', en: 'At ' + num(pq) + ' units revenue equals cost: this is the break-even point. Because the slope ' + pm + ' is positive, selling more produces a profit and selling less produces a loss.' },
    opts: [
      { es: 'Con ' + num(pq) + ' unidades no hay utilidad ni pérdida; arriba de ese volumen hay utilidad', en: 'At ' + num(pq) + ' units there is neither profit nor loss; above that volume there is a profit' },
      { es: 'La tienda obtiene la utilidad máxima posible al vender ' + num(pq) + ' unidades', en: 'The store earns the maximum possible profit by selling ' + num(pq) + ' units' },
      { es: 'Con ' + num(pq) + ' unidades la tienda pierde ' + money(pF) + ', que son sus costos fijos', en: 'At ' + num(pq) + ' units the store loses ' + money(pF) + ', which is its fixed costs' },
      { es: 'Por debajo de ' + num(pq) + ' unidades hay utilidad y por encima hay pérdida', en: 'Below ' + num(pq) + ' units there is a profit and above it there is a loss' }
    ]
  }, rng);

  /* P10 · solve for price */
  var vv10 = rint(rng, 12, 40, 2), q10 = pick([200, 250, 400, 500], rng), mg10 = rint(rng, 5, 20), F10 = mg10 * q10, p10 = vv10 + mg10;
  var o10 = distinctNums([p10, F10 / q10, vv10 + F10 / q10 + vv10, (F10 + vv10) / q10], 1);
  addProblem({
    title: { es: 'Fijar el precio de equilibrio', en: 'Setting the break-even price' },
    q: { es: 'Una empresa proyecta vender ' + num(q10) + ' unidades. Sus costos fijos son ' + money(F10) + ' y el costo variable es ' + money(vv10) + ' por unidad. ¿A qué precio por unidad debe vender para quedar exactamente en el punto de equilibrio?', en: 'A company projects selling ' + num(q10) + ' units. Its fixed costs are ' + money(F10) + ' and the variable cost is ' + money(vv10) + ' per unit. At what price per unit must it sell to break even exactly?' },
    showWork: true,
    hint: { es: 'En equilibrio ingreso = costo total. Plantea la igualdad con el precio como incógnita y despéjalo.', en: 'At break-even revenue = total cost. Set up the equality with price as the unknown and solve for it.' },
    exp: { es: 'pq = F + vq, luego p = v + ' + fr('F', 'q') + ' = ' + vv10 + ' + ' + fr(num(F10), num(q10)) + ' = ' + money(p10) + '. Usar solo ' + fr('F', 'q') + ' cubre los costos fijos pero ignora el costo variable.', en: 'pq = F + vq, so p = v + ' + fr('F', 'q') + ' = ' + vv10 + ' + ' + fr(num(F10), num(q10)) + ' = ' + money(p10) + '. Using only ' + fr('F', 'q') + ' covers fixed costs but ignores the variable cost.' },
    opts: o10.map(function(v) { return money(v); })
  }, rng);
}
