<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desastres Naturales y Humanos: Causas y Efectos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Desastres Naturales y Humanos: Causas y Efectos</div>
    <div class="wcourse" id="wcourse-el">Geografía · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Desastres Naturales y Humanos: Causas y Efectos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c54', primaryDark:'#182a3b', primaryBg:'#eaeef3',
  accent:'#e4243c', accentBg:'#fbdfe2',
  darkPrimary:'#5e85ab', darkPrimaryDark:'#8badce', darkPrimaryBg:'#152331',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {
    var fmtL = SCHOOL.logoLeftB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoLeftB64, fmtL, M, 4, 48, 22); } catch(e) {}
  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('geo1_t05_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

/* ══════════════════════════════════════════════════════════════════════════
   HELPERS DE CONTENIDO
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ return (o && o[LANG] !== undefined) ? o[LANG] : (o ? o.es : ''); }
function ri(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pk(rng, a){ return a[Math.floor(rng() * a.length)]; }
function pickV(rng, V){ return V[Math.floor(rng() * V.length)]; }

function mcSpec(v){
  return { title:L(v.title), q:L(v.q), fn:'', options:L(v.opts), correct:v.ci, hint:L(v.hint), exp:L(v.exp), showWork:false };
}

function say(host, cls, msg){
  var e = host.querySelector('.gw-fb');
  if (!e) return;
  e.className = 'gw-fb' + (cls ? ' ' + cls : '');
  e.innerHTML = msg;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: spec.fn || '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}

    '.ch-item{display:flex;gap:.55rem;align-items:center;padding:.5rem .6rem;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2);margin-bottom:.35rem;cursor:pointer;font-size:.79rem;min-height:44px;transition:all .14s;}',
    '.ch-item.sel{border-color:var(--gold);background:var(--gold-bg);}',
    '.ch-item.ok{border-color:var(--ok);background:var(--ok-bg);}',
    '.ch-n{min-width:23px;height:23px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;}',
    '.sc-steps{display:flex;gap:.4rem;margin:.1rem 0 .7rem;flex-wrap:wrap;}',
    '.sc-p{font-size:.69rem;padding:.28rem .65rem;border-radius:20px;border:1px solid var(--border);color:var(--text3);background:var(--surface2);}',
    '.sc-p.on{background:var(--green);color:#fff;border-color:var(--green);}',
    '.sc-p.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok);}',
    '.lg{display:flex;gap:.7rem;flex-wrap:wrap;font-size:.7rem;color:var(--text3);margin-bottom:.55rem;}',
    '.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:.28rem;vertical-align:middle;}',
    '.lg i.a{background:var(--green-bg);border:1px solid var(--green);}',
    '.lg i.b{background:var(--gold-bg);border:1px solid var(--gold);}',
    '.lg i.c{background:var(--ok-bg);border:1px solid var(--ok);}',
    '.mcopt.pending{background:var(--gold-bg);}',
    '@media (max-width:600px){.gw{padding:.8rem;}.gw-grid{grid-template-columns:1fr;}.cl{grid-template-columns:1fr;}}'
  ].join('');
  document.head.appendChild(s);
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson :: concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'La misma lluvia, dos finales distintos', en:'The same rain, two different endings' }),
    '<p>' + L({
      es:'Imagina dos pueblos separados por veinte minutos de camino. Sobre los dos cae la misma tormenta, durante las mismas horas y con la misma fuerza. En el primero, al día siguiente los charcos se secan y las clases empiezan puntuales. En el segundo, el agua entra a las casas, la carretera queda cortada y varias familias pasan la noche en la escuela. La lluvia no eligió a nadie: fue idéntica en los dos lugares. Lo que cambió fue todo lo demás.',
      en:'Imagine two towns twenty minutes apart. The same storm falls on both, for the same hours and with the same strength. In the first one, the next day the puddles dry up and classes start on time. In the second, water enters the houses, the road is cut off and several families spend the night in the school. The rain chose nobody: it was identical in both places. What changed was everything else.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'un desastre nunca se explica solo con el fenómeno. Se explica con el encuentro entre un fenómeno peligroso y una población que puede resistirlo mucho o muy poco. En esta guía vas a mover ese encuentro con tus propias manos, vas a separar lo que produce la naturaleza de lo que producimos nosotros, y vas a descubrir por qué la prevención empieza mucho antes de que el cielo se nuble.',
      en:'a disaster is never explained by the phenomenon alone. It is explained by the meeting between a dangerous phenomenon and a population that can resist it a lot or very little. In this guide you will move that meeting with your own hands, you will separate what nature produces from what we produce, and you will discover why prevention starts long before the sky clouds over.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 :: peligro, vulnerabilidad, riesgo, desastre ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Cuatro palabras que no significan lo mismo', en:'Four words that do not mean the same thing' }),
    '<p>' + L({
      es:'En las noticias suelen usarse como sinónimos, pero conviene separarlas. Un fenómeno perturbador o peligro es el suceso que puede causar daño: un sismo, un huracán, una fuga de gas. Existe aunque no haya nadie cerca. La vulnerabilidad es el conjunto de condiciones que hacen que una población sufra más daño del necesario: casas frágiles, calles sin drenaje, familias sin ahorro, gente que nunca supo qué hacer. El riesgo es la probabilidad de que ese peligro produzca daños en ese lugar concreto, y depende de los dos factores a la vez.',
      en:'In the news they are often used as synonyms, but it is worth separating them. A disturbing phenomenon or hazard is the event that can cause harm: an earthquake, a hurricane, a gas leak. It exists even if nobody is nearby. Vulnerability is the set of conditions that make a population suffer more damage than necessary: fragile houses, streets with no drainage, families with no savings, people who never learned what to do. Risk is the probability that the hazard produces damage in that specific place, and it depends on both factors at once.'
    }) + '</p>' +
    '<p>' + L({
      es:'El desastre es lo que ocurre cuando el riesgo se cumple y los daños superan la capacidad de la comunidad para responder por sí sola. Por eso un sismo intenso en el fondo del océano no es un desastre y una lluvia moderada sobre una colonia construida en un cauce sí puede serlo. Hay una consecuencia que vale la pena guardar: no podemos apagar un huracán ni detener una placa tectónica, pero la vulnerabilidad sí la construimos y sí la podemos reducir.',
      en:'A disaster is what happens when the risk comes true and the damage exceeds the ability of the community to respond on its own. That is why an intense earthquake at the bottom of the ocean is not a disaster and a moderate rain over a neighbourhood built in a riverbed can be one. There is a consequence worth keeping: we cannot switch off a hurricane or stop a tectonic plate, but vulnerability is built by us and it can be reduced by us.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Peligro', en:'Hazard' }), L({ es:'el fenómeno', en:'the phenomenon' }), L({ es:'puede ocurrir aunque no haya nadie cerca', en:'it can occur even with nobody nearby' })) +
      rcard(L({ es:'Exposición', en:'Exposure' }), L({ es:'estar en el lugar', en:'being in the place' }), L({ es:'personas y bienes dentro del alcance del fenómeno', en:'people and property within reach of the phenomenon' })) +
      rcard(L({ es:'Vulnerabilidad', en:'Vulnerability' }), L({ es:'las condiciones', en:'the conditions' }), L({ es:'lo que hace que el daño sea mayor o menor', en:'what makes the damage larger or smaller' })) +
      rcard(L({ es:'Riesgo', en:'Risk' }), L({ es:'peligro con vulnerabilidad', en:'hazard with vulnerability' }), L({ es:'si uno de los dos vale cero, no hay riesgo', en:'if either one is zero, there is no risk' })) +
    '</div>'
  );
  w1(rng, widgetHost(s1, 'w_mezcla'));
  addProblem(rng, mkP1(rng));

  /* ══ CONCEPTO 2 :: origen natural, humano y mixto ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'¿De dónde viene el peligro?', en:'Where does the hazard come from?' }),
    '<p>' + L({
      es:'Los fenómenos que pueden provocar un desastre se agrupan por su origen. Los de origen natural se dividen sobre todo en dos familias. Los geológicos nacen del interior o de la superficie sólida del planeta: sismos, erupciones volcánicas, deslaves, hundimientos del terreno y tsunamis. Los hidrometeorológicos nacen del agua y de la atmósfera: huracanes, lluvias extremas, inundaciones, sequías, heladas, granizadas y tornados. Ninguno de los dos grupos se puede evitar; los dos se pueden anticipar en distinto grado.',
      en:'The phenomena that can cause a disaster are grouped by their origin. Those of natural origin fall mainly into two families. Geological ones come from the interior or the solid surface of the planet: earthquakes, volcanic eruptions, landslides, ground subsidence and tsunamis. Hydrometeorological ones come from water and the atmosphere: hurricanes, extreme rains, floods, droughts, frosts, hailstorms and tornadoes. Neither group can be avoided; both can be anticipated to different degrees.'
    }) + '</p>' +
    '<p>' + L({
      es:'Otros peligros nacen directamente de la actividad humana. Los químicos y tecnológicos aparecen cuando falla algo que nosotros construimos: un incendio en una bodega, una fuga en un ducto, un derrame durante un traslado. Los sanitarios tienen que ver con la contaminación del agua, del aire o de los alimentos y con la propagación de enfermedades. Los socio organizativos surgen de fallas en la organización de actividades humanas, como una concentración masiva sin salidas suficientes o un accidente en el transporte.',
      en:'Other hazards come directly from human activity. Chemical and technological ones appear when something we built fails: a fire in a warehouse, a leak in a pipeline, a spill during transport. Sanitary ones have to do with contamination of water, air or food and with the spread of disease. Socio organizational ones arise from failures in the organization of human activities, such as a mass gathering without enough exits or a transport accident.'
    }) + '</p>' +
    '<p>' + L({
      es:'Y existe un tercer grupo que suele confundirse: fenómenos naturales agravados por lo que hacemos. La ladera se deslava porque perdió el bosque que sujetaba el suelo. El río se desborda sobre las casas porque las casas se levantaron en su cauce. El terreno se hunde porque se extrajo agua del subsuelo durante décadas. El fenómeno es natural, pero el tamaño del daño lleva firma humana.',
      en:'And there is a third group that is often confused: natural phenomena made worse by what we do. The hillside slides because it lost the forest that held the soil. The river overflows onto the houses because the houses were built in its bed. The ground sinks because water was pumped from below for decades. The phenomenon is natural, but the size of the damage carries a human signature.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Una pista para clasificar sin dudar: pregunta qué habría pasado si nadie hubiera intervenido. Si el fenómeno ocurriría igual, su origen es natural. Si no existiría sin una decisión o una obra humana, su origen es humano. Si ocurriría igual pero con mucho menos daño, estás ante un caso agravado por la actividad humana.',
      en:'A clue to classify without hesitating: ask what would have happened if nobody had intervened. If the phenomenon would occur anyway, its origin is natural. If it would not exist without a human decision or structure, its origin is human. If it would occur anyway but with far less damage, you are looking at a case made worse by human activity.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_origen'));
  addProblem(rng, mkP2(rng));
  addProblem(rng, mkP3(rng));

  /* ══ CONCEPTO 3 :: la vulnerabilidad por dentro ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La vulnerabilidad tiene varias caras', en:'Vulnerability has several faces' }),
    '<p>' + L({
      es:'Cuando decimos que una población es vulnerable no hablamos de una sola cosa. La vulnerabilidad física se refiere al material y al diseño de las construcciones y al lugar donde se levantaron: una casa de lámina en la orilla de un arroyo es físicamente vulnerable. La vulnerabilidad económica tiene que ver con los ingresos, el ahorro y la posibilidad de reponer lo perdido: dos familias con el mismo daño se recuperan a velocidades distintas. La vulnerabilidad social depende de la organización: quién avisa a quién, quién revisa que los vecinos mayores hayan salido. La vulnerabilidad educativa es saber o no saber qué hacer, dónde está la salida y a qué número llamar.',
      en:'When we say that a population is vulnerable we are not talking about a single thing. Physical vulnerability refers to the material and design of buildings and to the place where they were raised: a sheet metal house on the bank of a stream is physically vulnerable. Economic vulnerability has to do with income, savings and the chance to replace what is lost: two families with the same damage recover at different speeds. Social vulnerability depends on organization: who warns whom, who checks that the older neighbours have got out. Educational vulnerability is knowing or not knowing what to do, where the exit is and what number to call.'
    }) + '</p>' +
    '<p>' + L({
      es:'Conviene además no confundir exposición con vulnerabilidad. La exposición dice quién está dentro del alcance del fenómeno; la vulnerabilidad dice en qué condiciones está. Dos escuelas pueden estar igualmente expuestas a un sismo y tener vulnerabilidades muy distintas: una revisó su estructura y ensaya evacuaciones, la otra arrastra grietas antiguas y nunca ha practicado. Por eso, después de un mismo evento, el mapa de daños casi nunca coincide con el mapa del fenómeno: coincide con el mapa de la desigualdad.',
      en:'It is also worth not confusing exposure with vulnerability. Exposure says who is within reach of the phenomenon; vulnerability says in what condition they are. Two schools can be equally exposed to an earthquake and have very different vulnerabilities: one checked its structure and rehearses evacuations, the other carries old cracks and has never practised. That is why, after the same event, the damage map almost never matches the map of the phenomenon: it matches the map of inequality.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Física', en:'Physical' }), L({ es:'materiales y sitio', en:'materials and site' }), L({ es:'cómo y dónde está construido', en:'how and where it is built' })) +
      rcard(L({ es:'Económica', en:'Economic' }), L({ es:'capacidad de reponer', en:'ability to replace' }), L({ es:'ingreso, ahorro, seguro, herramientas de trabajo', en:'income, savings, insurance, work tools' })) +
      rcard(L({ es:'Social', en:'Social' }), L({ es:'organización', en:'organization' }), L({ es:'redes vecinales, acuerdos, quién avisa a quién', en:'neighbourhood networks, agreements, who warns whom' })) +
      rcard(L({ es:'Educativa', en:'Educational' }), L({ es:'saber qué hacer', en:'knowing what to do' }), L({ es:'rutas, señales, simulacros, información confiable', en:'routes, signs, drills, reliable information' })) +
    '</div>'
  );
  w3(rng, widgetHost(s3, 'w_colonias'));
  addProblem(rng, mkP4(rng));
  addProblem(rng, mkP5(rng));

  /* ══ CONCEPTO 4 :: efectos ambientales, sociales y económicos ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Lo que queda después: efectos que se encadenan', en:'What remains afterwards: effects that link together' }),
    '<p>' + L({
      es:'Los efectos de un desastre se ordenan en tres grupos que casi siempre aparecen juntos. Los efectos ambientales recaen sobre la naturaleza: suelos arrastrados, cauces contaminados con residuos, vegetación destruida, playas y manglares modificados. Los efectos sociales recaen sobre las personas y sus servicios: familias que dejan su vivienda, escuelas cerradas durante semanas, centros de salud saturados, comunidades incomunicadas, malestar emocional que dura más que los escombros. Los efectos económicos recaen sobre lo que sostiene el ingreso: viviendas y comercios dañados, cultivos perdidos, caminos y puentes rotos, turismo detenido, un costo de reconstrucción que se paga durante años.',
      en:'The effects of a disaster fall into three groups that almost always appear together. Environmental effects fall on nature: soils washed away, channels polluted with waste, vegetation destroyed, beaches and mangroves altered. Social effects fall on people and their services: families leaving their homes, schools closed for weeks, health centres overwhelmed, communities cut off, emotional strain that lasts longer than the rubble. Economic effects fall on what sustains income: damaged homes and shops, lost crops, broken roads and bridges, tourism stopped, a reconstruction cost paid over years.'
    }) + '</p>' +
    '<p>' + L({
      es:'También conviene separar los efectos inmediatos de los de largo plazo. Lo inmediato se ve en las primeras horas; lo de largo plazo aparece meses después, cuando un suelo salinizado sigue produciendo menos, cuando un comercio no volvió a abrir o cuando una familia que se mudó ya no regresó. Casos recientes ayudan a verlo: el sismo de septiembre de 2017 en el centro y el sur de México dejó viviendas y escuelas fuera de uso durante mucho tiempo; el huracán Otis, que llegó a Acapulco en 2023, dañó a la vez viviendas, servicios y la actividad turística de la que vive la ciudad; las inundaciones de Tabasco en 2020 mantuvieron el agua sobre campos y comunidades durante semanas. En el mundo se repite el patrón: el huracán Katrina en 2005 en la costa del Golfo de Estados Unidos y el terremoto de Haití en 2010 mostraron que los efectos duran más y pesan más donde la vulnerabilidad era mayor desde antes.',
      en:'It is also worth separating immediate effects from long term ones. The immediate shows in the first hours; the long term appears months later, when a salinized soil keeps producing less, when a shop never reopened or when a family that moved away never came back. Recent cases help to see it: the September 2017 earthquake in central and southern Mexico left homes and schools out of use for a long time; hurricane Otis, which reached Acapulco in 2023, damaged homes, services and at the same time the tourism the city lives on; the Tabasco floods of 2020 kept water over fields and communities for weeks. Around the world the pattern repeats: hurricane Katrina in 2005 on the Gulf coast of the United States and the Haiti earthquake in 2010 showed that effects last longer and weigh more where vulnerability was already greater.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Los efectos rara vez llegan solos: se encadenan. Un poste caído deja sin energía una zona; sin energía no hay bombeo de agua ni refrigeración en los comercios; sin agua ni comercio abierto, la vida cotidiana se detiene aunque el viento ya haya pasado. Leer esa cadena es tan importante como contar los daños del primer día.',
      en:'Effects rarely arrive alone: they link together. A fallen post leaves an area without power; without power there is no water pumping and no refrigeration in the shops; without water or open shops, daily life stops even though the wind has already passed. Reading that chain matters as much as counting the damage of the first day.'
    }) + '</p></div>'
  );
  w4(rng, widgetHost(s4, 'w_cadena'));
  addProblem(rng, mkP6(rng));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 :: cultura de prevención ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Antes, durante y después: la cultura de la prevención', en:'Before, during and after: a culture of prevention' }),
    '<p>' + L({
      es:'Gestionar el riesgo no consiste en adivinar el día del próximo fenómeno, porque eso no se puede hacer. Consiste en trabajar sobre lo que sí depende de nosotros, y ese trabajo tiene momentos. Antes se previene y se mitiga: mapas y atlas de riesgo que señalan las zonas expuestas, normas de construcción, obras de drenaje, reforestación de laderas, decisiones sobre dónde se permite construir. También antes se prepara la respuesta: simulacros, señalización de rutas y puntos de reunión, sistemas de alerta, un plan familiar y una mochila con agua, linterna, radio, botiquín y copias de documentos.',
      en:'Managing risk is not about guessing the day of the next phenomenon, because that cannot be done. It is about working on what does depend on us, and that work has stages. Before, we prevent and mitigate: risk maps and atlases that mark exposed zones, building standards, drainage works, replanting of hillsides, decisions about where building is allowed. Also before, the response is prepared: drills, signposted routes and meeting points, alert systems, a family plan and a bag with water, a torch, a radio, a first aid kit and copies of documents.'
    }) + '</p>' +
    '<p>' + L({
      es:'Durante el fenómeno toca la respuesta: mantener la calma, aplicar lo ensayado, evacuar si corresponde, atender a quien necesita ayuda y hacer caso solo de fuentes oficiales. Después llega la recuperación, y ahí se decide algo importante: se puede reconstruir igual que antes, con lo cual la vulnerabilidad regresa intacta, o se puede reconstruir mejor, corrigiendo lo que falló. La alerta sísmica es un buen ejemplo de todo esto: no impide el sismo, pero como la señal viaja más rápido que las ondas, regala segundos que solo sirven si alguien ya ensayó qué hacer con ellos.',
      en:'During the phenomenon comes the response: staying calm, applying what was rehearsed, evacuating if needed, helping those who need it and trusting only official sources. Afterwards comes recovery, and something important is decided there: you can rebuild exactly as before, in which case vulnerability returns untouched, or you can rebuild better, correcting what failed. The seismic alert is a good example of all this: it does not stop the earthquake, but since the signal travels faster than the waves, it gives seconds that are only useful if somebody has already rehearsed what to do with them.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'La prevención no la sostiene un solo actor. Las instituciones de protección civil coordinan, alertan y regulan; los gobiernos locales deciden el uso del suelo y las obras; las escuelas forman y practican; las organizaciones civiles y las brigadas vecinales conocen el terreno palmo a palmo; las familias preparan su plan. Una comunidad organizada convierte a cada vecino en parte del sistema de alerta, y esa es la diferencia entre reaccionar y estar preparado.',
      en:'Prevention is not held up by a single actor. Civil protection institutions coordinate, alert and regulate; local governments decide land use and public works; schools train and practise; civil organizations and neighbourhood brigades know the ground inch by inch; families prepare their plan. An organized community turns every neighbour into part of the alert system, and that is the difference between reacting and being prepared.'
    }) + '</p></div>'
  );
  w5(rng, widgetHost(s5, 'w_momentos'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE :: evaluación final ══ */
  sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Ahora todo junto', en:'Now all together' }),
    '<p>' + L({
      es:'Las dos situaciones siguientes mezclan el origen del fenómeno, la vulnerabilidad de la población y las decisiones de prevención.',
      en:'The following two situations mix the origin of the phenomenon, the vulnerability of the population and prevention decisions.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}
/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: La mezcladora del riesgo
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var LV = [
    { n:{ es:'muy bajo', en:'very low' },   c:'' },
    { n:{ es:'bajo', en:'low' },            c:'l2' },
    { n:{ es:'moderado', en:'moderate' },   c:'l3' },
    { n:{ es:'alto', en:'high' },           c:'l4' },
    { n:{ es:'muy alto', en:'very high' },  c:'l4' }
  ];
  function lvIdx(r){ return r < 8 ? 0 : r < 25 ? 1 : r < 50 ? 2 : r < 75 ? 3 : 4; }
  function pCat(p){
    return p <= 2 ? { es:'leve', en:'mild' } : p <= 5 ? { es:'moderado', en:'moderate' } :
           p <= 7 ? { es:'fuerte', en:'strong' } : { es:'muy intenso', en:'very intense' };
  }
  function vCat(v){
    return v <= 2 ? { es:'muy preparada y con viviendas firmes', en:'well prepared and with solid housing' } :
           v <= 5 ? { es:'con algunas condiciones frágiles', en:'with some fragile conditions' } :
           v <= 7 ? { es:'vulnerable en varios aspectos', en:'vulnerable in several respects' } :
                    { es:'muy vulnerable', en:'very vulnerable' };
  }
  var POOL = [
    { q:{ es:'Deja el tablero en una situación donde el fenómeno sea muy intenso y, aun así, el riesgo quede en nivel bajo.',
          en:'Leave the board in a situation where the phenomenon is very intense and yet the risk stays at a low level.' },
      ok:function(p,v){ return p >= 8 && p * v < 25; }, fix:[9,2],
      why:{ es:'Un fenómeno intenso no obliga a que el riesgo sea alto. Cuando la comunidad está preparada y bien construida, el mismo huracán o el mismo sismo produce daños mucho menores.',
            en:'An intense phenomenon does not force the risk to be high. When the community is prepared and well built, the same hurricane or the same earthquake produces far less damage.' },
      nudge:function(p,v){
        if (p < 8) return { es:'El fenómeno todavía no es intenso: sube la primera barra.', en:'The phenomenon is not intense yet: raise the first bar.' };
        return { es:'Ya tienes un fenómeno intenso. Ahora baja la vulnerabilidad y observa cómo cae el nivel de riesgo.', en:'You already have an intense phenomenon. Now lower vulnerability and watch the risk level drop.' };
      } },
    { q:{ es:'Consigue el riesgo más alto que puedas sin que la intensidad del fenómeno pase de un nivel medio.',
          en:'Reach the highest risk you can without the intensity of the phenomenon going beyond a medium level.' },
      ok:function(p,v){ return p >= 4 && p <= 6 && v >= 9; }, fix:[5,10],
      why:{ es:'Con un fenómeno apenas medio, el riesgo sube mucho si la población es muy vulnerable. Ese es el caso de las lluvias ordinarias que inundan colonias construidas sobre un cauce.',
            en:'With a barely medium phenomenon, risk climbs a lot if the population is very vulnerable. That is the case of ordinary rains flooding neighbourhoods built over a riverbed.' },
      nudge:function(p,v){
        if (p < 4) return { es:'La intensidad quedó demasiado baja: súbela hasta un nivel medio.', en:'Intensity is too low: raise it to a medium level.' };
        if (p > 6) return { es:'Te pasaste de intensidad: bájala hasta un nivel medio.', en:'You went over on intensity: bring it down to a medium level.' };
        return { es:'La intensidad ya es media. Sube la vulnerabilidad casi al tope y mira qué ocurre con el nivel.', en:'Intensity is medium now. Push vulnerability almost to the top and see what happens to the level.' };
      } },
    { q:{ es:'Arma la peor combinación posible: la que deja el riesgo en el nivel más alto de la escala.',
          en:'Build the worst possible combination: the one that leaves risk at the highest level of the scale.' },
      ok:function(p,v){ return p >= 9 && v >= 9; }, fix:[10,10],
      why:{ es:'El riesgo llega a su máximo cuando los dos factores están arriba al mismo tiempo. Por eso las zonas de mayor riesgo son las que suman fenómenos frecuentes e intensos con poblaciones en condiciones frágiles.',

          en:'Bring the risk close to zero without lowering vulnerability, which must remain very high.' },
      ok:function(p,v){ return v >= 8 && p * v < 10; }, fix:[1,9],
      why:{ es:'Sin fenómeno peligroso no hay riesgo, aunque la comunidad sea frágil. El problema es que esa condición no depende de nadie: nadie puede apagar los huracanes. Por eso la prevención trabaja sobre la otra barra.',
            en:'With no dangerous phenomenon there is no risk, even if the community is fragile. The problem is that this condition depends on nobody: nobody can switch hurricanes off. That is why prevention works on the other bar.' },

    '</div>' +
    '<div class="rk"><div class="rk-f" data-r="bar"></div></div>' +
    '<div class="rk-sc"><span>' + L({ es:'sin riesgo', en:'no risk' }) + '</span><span>' + L({ es:'riesgo máximo', en:'maximum risk' }) + '</span></div>' +
    '<div class="gw-num" data-r="lvl"></div>' +
    '<div class="gw-mini" data-r="desc" style="text-align:center"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elP = host.querySelector('[data-r="pv"]'),
      elV = host.querySelector('[data-r="vv"]'),
      slP = host.querySelector('[data-r="ps"]'),
      slV = host.querySelector('[data-r="vs"]'),
      bar = host.querySelector('[data-r="bar"]'),
      elL = host.querySelector('[data-r="lvl"]'),
      elD = host.querySelector('[data-r="desc"]'),
      elK = host.querySelector('[data-r="chk"]');

  function draw(){
    slP.value = p; slV.value = v;
    elP.textContent = p; elV.textContent = v;
    var r = p * v, k = lvIdx(r);

    elQ.textContent = L(R[rd].q);
  }
  function advance(){
    rd++;
    if (rd >= R.length){
      done = true;
      elK.textContent = L({ es:'Completado', en:'Completed' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L({
        es:'Ya viste la regla completa: el riesgo necesita las dos barras. La intensidad del fenómeno no está en nuestras manos, la vulnerabilidad sí.',
        en:'You have seen the whole rule: risk needs both bars. The intensity of the phenomenon is not in our hands, vulnerability is.'
      }));
      return;
    }
    locked = false; tries = 0;
    p = ri(rng, 3, 7); v = ri(rng, 3, 7);
    elK.textContent = L({ es:'Comprobar', en:'Check' });
    elK.className = 'gw-btn';
    say(host, '', L({ es:'Nueva consigna. Ajusta las barras otra vez.', en:'New task. Adjust the bars again.' }));
    draw();
  }
  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (R[rd].ok(p, v)){
      locked = true;
      elK.textContent = (rd === R.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente consigna', en:'Next task' });
      elK.className = 'gw-btn solved';
      say(host, 'good', L(R[rd].why));
      return;
    }
    tries++;
    if (tries >= 3){
      p = R[rd].fix[0]; v = R[rd].fix[1];
      draw();
      locked = true;
      elK.textContent = (rd === R.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente consigna', en:'Next task' });
      elK.className = 'gw-btn solved';
      say(host, 'warm', L({ es:'Así queda la combinación que pedía la consigna. ', en:'This is the combination the task was asking for. ' }) + L(R[rd].why));
      return;
    }
    say(host, 'miss', L(R[rd].nudge(p, v)));
  }
  slP.addEventListener('input', function(){ if (locked || done) { slP.value = p; return; } p = parseInt(slP.value, 10); draw(); });
  slV.addEventListener('input', function(){ if (locked || done) { slV.value = v; return; } v = parseInt(slV.value, 10); draw(); });
  elK.addEventListener('click', check);
  draw();
  say(host, '', L({ es:'Ajusta las barras y comprueba.', en:'Adjust the bars and check.' }));
}

    { t:{ es:'Un accidente en un evento masivo organizado sin salidas suficientes', en:'An accident at a mass event organized without enough exits' },
      w:{ es:'Es un peligro socio organizativo: nace de cómo se planeó la actividad.', en:'It is a socio organizational hazard: it comes from how the activity was planned.' } }
  ];
  var G2 = [
    { t:{ es:'Un deslave en una ladera que fue talada para abrir terrenos de cultivo', en:'A landslide on a hillside cleared to open farmland' },

    { t:{ es:'La inundación de una colonia construida sobre el cauce de un río entubado', en:'The flooding of a neighbourhood built over the bed of a piped river' },

    { t:{ es:'El hundimiento del terreno en una ciudad que extrae agua del subsuelo desde hace décadas', en:'Ground subsidence in a city that has pumped groundwater for decades' },
      w:{ es:'El subsuelo se comprime por sí mismo, pero la extracción sostenida acelera el proceso.', en:'The subsoil compacts on its own, but sustained pumping speeds the process up.' } },
    { t:{ es:'La crecida de un arroyo que arrastra la basura acumulada en su cauce', en:'The rising of a stream carrying the rubbish piled in its bed' },

  ];

  for (i = 0; i < 3; i++){

    var c = shuffle(G2, rng).slice(0, 2).map(function(o){ return { t:o.t, w:o.w, b:2 }; });
    R.push(shuffle(a.concat(b).concat(c), rng));
  }
  var rd = 0, tries = 0, locked = false, done = false;

  host.innerHTML =

  }

  seed(); draw();

}

  }

    elQ.textContent = L(R[rd].n) + '. ' + L({ es:'Deja el daño de la colonia B en nivel bajo usando solo dos medidas.', en:'Bring the damage of neighbourhood B down to a low level using only two measures.' });
    var h = '', i;

      L(R[rd].ms[weak].s) + L({ es:' ayuda poco a evitarlo.', en:' does little to prevent it.' }));
  }
  elK.addEventListener('click', check);
  draw();
  say(host, '', L({ es:'Elige dos medidas y comprueba.', en:'Choose two measures and check.' }));
}

  host.innerHTML =

    '<div class="sc-steps" data-r="steps"></div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-grid" data-r="opts"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk" style="display:none">' + L({ es:'Continuar', en:'Continue' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elS = host.querySelector('[data-r="steps"]'),
      elQ = host.querySelector('[data-r="q"]'),
      elO = host.querySelector('[data-r="opts"]'),
      elK = host.querySelector('[data-r="chk"]');

  function correctIdx(){
    var m = S.m[st], k;
    for (k = 0; k < m.o.length; k++) if (m.o[k].ok) return k;
    return 0;
  }
  function draw(){
    var h = '', k;
    for (k = 0; k < PH.length; k++)
      h += '<span class="sc-p' + (k === st && !done ? ' on' : (k < st || done ? ' done' : '')) + '">' + L(PH[k]) + '</span>';
    elS.innerHTML = h;
    elQ.textContent = L(S.m[st].q);
    h = '';
    for (k = 0; k < ORD[st].length; k++){
      var oi = ORD[st][k], o = S.m[st].o[oi];
      var cls = 'gw-tile';
      if (locked && o.ok) cls += ' vC good';
      else if (tried.indexOf(oi) >= 0) cls += ' miss';
      h += '<button class="' + cls + '" data-i="' + oi + '"' + (locked || done ? ' disabled' : '') + '>' +
             '<span class="gw-key">' + L(o.t) + '</span></button>';
    }
    elO.innerHTML = h;
    elO.querySelectorAll('.gw-tile').forEach(function(el){
      el.addEventListener('click', function(){ choose(parseInt(el.dataset.i, 10)); });
    });
  }
  function advance(){
    st++;
    if (st >= S.m.length){
      done = true; st = S.m.length - 1;
      elK.style.display = 'none';
      draw();
      say(host, 'good', L({
        es:'Recorriste los tres momentos. La prevención no es una acción suelta: es una cadena de decisiones que empieza mucho antes del fenómeno y sigue cuando ya pasó.',
        en:'You have gone through the three stages. Prevention is not a single action: it is a chain of decisions that starts long before the phenomenon and continues once it has passed.'
      }));
      return;
    }
    locked = false; tries = 0; tried = [];
    elK.style.display = 'none';
    draw();
    say(host, '', L({ es:'Nuevo momento de la misma historia.', en:'A new stage of the same story.' }));
  }
  function choose(oi){
    if (locked || done) return;
    var o = S.m[st].o[oi];
    if (o.ok){
      locked = true;
      elK.style.display = '';
      elK.textContent = (st === S.m.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente momento', en:'Next stage' });
      draw();
      say(host, 'good', L(S.m[st].why));
      return;
    }
    if (tried.indexOf(oi) < 0) tried.push(oi);
    tries++;
    if (tries >= 3){
      locked = true;
      elK.style.display = '';
      elK.textContent = (st === S.m.length - 1) ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente momento', en:'Next stage' });
      draw();
      say(host, 'warm', L({ es:'Esta era la decisión que correspondía. ', en:'This was the right decision. ' }) + L(S.m[st].why));
      return;
    }
    draw();
    say(host, 'miss', L(o.f) + L({ es:' Intenta con otra decisión.', en:' Try another decision.' }));
  }
  elK.addEventListener('click', advance);
  draw();
  say(host, '', L({ es:'Elige qué hacer en este momento de la historia.', en:'Choose what to do at this stage of the story.' }));
}
