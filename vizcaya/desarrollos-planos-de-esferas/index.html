              'Work out what part of the cylinder the sphere fills and subtract it from the whole, which counts as one.'),
      explanation: L('El cilindro mide π r² × 2r = 2π r³ y la esfera mide ' + frac(4, 3) + 'π r³, es decir ' + frac(2, 3) + ' del cilindro. Lo que sobra es 1 − ' + frac(2, 3) + ' = ' + frac(1, 3) + '.',
                     'The cylinder measures π r² × 2r = 2π r³ and the sphere measures ' + frac(4, 3) + 'π r³, that is ' + frac(2, 3) + ' of the cylinder. What is left over is 1 − ' + frac(2, 3) + ' = ' + frac(1, 3) + '.'),
      options: o5b, correct: o5b[0], showWork: true
    }, rng);
  }

  /* ── Problema 6 ── */
  var r6 = pick([3, 4, 5, 6], rng);
  var p6v = Math.floor(rng() * 2);
  if (p6v === 0){
    var vE6 = 4 * PIV * r6 * r6 * r6 / 3;
    var o6 = [n2(vE6 / 2) + ' cm³', n2(vE6 / 3) + ' cm³', n2(2 * vE6) + ' cm³', n2(3 * vE6 / 4) + ' cm³'];
    pushProb({
      title: L('Del volumen de la esfera al del cono', 'From the sphere volume to the cone volume'),
      questionText: L('Una esfera y un cono tienen el mismo radio, ' + r6 + ' cm, y la altura del cono es igual al diámetro de la esfera. La esfera tiene un volumen de ' + n2(vE6) + ' cm³. Calcula el volumen del cono.',
                      'A sphere and a cone have the same radius, ' + r6 + ' cm, and the height of the cone equals the diameter of the sphere. The sphere has a volume of ' + n2(vE6) + ' cm³. Calculate the volume of the cone.'),
      fn: 'r = ' + r6 + ' cm · h = ' + (2 * r6) + ' cm · V esfera = ' + n2(vE6) + ' cm³',
      hint: L('Con radio común y altura igual al diámetro, el cono es un tercio del cilindro que los envuelve y la esfera son dos tercios de ese mismo cilindro.',
              'With a shared radius and a height equal to the diameter, the cone is one third of the cylinder that wraps them and the sphere is two thirds of that same cylinder.'),
      explanation: L('El cilindro que envuelve a los dos vale tres conos y también una esfera más un cono, así que la esfera vale dos conos. Entonces el cono es la mitad de la esfera: ' + n2(vE6) + ' ÷ 2 = ' + n2(vE6 / 2) + ' cm³.',
                     'The wrapping cylinder is worth three cones and also one sphere plus one cone, so the sphere is worth two cones. Then the cone is half of the sphere: ' + n2(vE6) + ' ÷ 2 = ' + n2(vE6 / 2) + ' cm³.'),
      options: o6, correct: o6[0], showWork: true
    }, rng);
  } else {
    var vC6 = 2 * PIV * r6 * r6 * r6;
    var o6b = [n2(2 * vC6 / 3) + ' cm³', n2(vC6 / 2) + ' cm³', n2(vC6 / 3) + ' cm³', n2(3 * vC6 / 2) + ' cm³'];
    pushProb({
      title: L('Del volumen del cilindro al de la esfera', 'From the cylinder volume to the sphere volume'),
      questionText: L('Un cilindro de ' + r6 + ' cm de radio y ' + (2 * r6) + ' cm de altura contiene ajustada una esfera del mismo radio. El cilindro tiene un volumen de ' + n2(vC6) + ' cm³. Calcula el volumen de la esfera.',
                      'A cylinder of radius ' + r6 + ' cm and height ' + (2 * r6) + ' cm holds a snugly fitting sphere of the same radius. The cylinder has a volume of ' + n2(vC6) + ' cm³. Calculate the volume of the sphere.'),
      fn: 'r = ' + r6 + ' cm · h = ' + (2 * r6) + ' cm · V cilindro = ' + n2(vC6) + ' cm³',
      hint: L('Cuando la altura del cilindro es igual al diámetro de la esfera, la esfera ocupa dos de cada tres partes del cilindro.',
              'When the height of the cylinder equals the diameter of the sphere, the sphere occupies two out of every three parts of the cylinder.'),
      explanation: L('La esfera ocupa ' + frac(2, 3) + ' del cilindro que la ajusta, así que ' + n2(vC6) + ' × ' + frac(2, 3) + ' = ' + n2(2 * vC6 / 3) + ' cm³.',
                     'The sphere occupies ' + frac(2, 3) + ' of the cylinder that fits it, so ' + n2(vC6) + ' × ' + frac(2, 3) + ' = ' + n2(2 * vC6 / 3) + ' cm³.'),
      options: o6b, correct: o6b[0], showWork: true
    }, rng);
  }

  /* ═════════ CONCEPTO 4 ═════════ */
  addSection(
    '<div class="stag">' + L('La superficie esférica', 'The spherical surface') + '</div>' +
    '<h2>' + L('Cuánta piel tiene una esfera', 'How much skin a sphere has') + '</h2>' +
    '<p>' + L('Aunque la piel de la esfera no se aplana de una pieza, sí se puede medir. Y el resultado es sorprendentemente limpio: equivale a cuatro círculos máximos, esos que se obtienen al cortar la esfera justo por el centro.',
              'Although the skin of the sphere does not flatten in one piece, it can certainly be measured. And the result is surprisingly clean: it equals four great circles, the ones you get by slicing the sphere right through the centre.') + '</p>' +
    '<div class="callout"><p><strong>' + L('El mismo cilindro, otra vez.', 'The same cylinder, again.') + '</strong> ' +
      L('La pared curva del cilindro que envuelve ajustadamente a la esfera se desenrolla en un rectángulo, y ese rectángulo mide exactamente lo mismo que la piel de la esfera. Por eso los husos de un globo terráqueo caben en una hoja rectangular.',
        'The curved wall of the cylinder that snugly wraps the sphere unrolls into a rectangle, and that rectangle measures exactly the same as the skin of the sphere. That is why the gores of a globe fit onto a rectangular sheet.') + '</p></div>' +
    '<p>' + L('Pon los recortes que hagan falta y luego desenrolla la banda para verlo con tus propias medidas.',
              'Lay out as many cut outs as needed and then unroll the band to see it with your own measurements.') + '</p>' +
    m4Html()
  );
  m4Build(rng);
  setTimeout(m4Init, 90);

  /* ── Problema 7 ── */
  var r7 = pick([5, 10, 15, 20], rng);
  var A7 = 4 * PIV * r7 * r7;
  var p7v = Math.floor(rng() * 2);
  if (p7v === 0){
    var o7 = [n2(A7) + ' cm²', n2(A7 / 4) + ' cm²', n2(A7 / 2) + ' cm²', n2(4 * A7) + ' cm²'];
    pushProb({
      title: L('Medir la piel', 'Measuring the skin'),
      questionText: L('Calcula el área de la superficie de una esfera de ' + r7 + ' cm de radio. Usa π ≈ 3.1416.',
                      'Calculate the surface area of a sphere of radius ' + r7 + ' cm. Use π ≈ 3.1416.'),
      fn: 'r = ' + r7 + ' cm · π ≈ 3.1416',
      hint: L('La superficie de una esfera equivale a cuatro círculos de su ecuador, y el área de un círculo es π por el radio al cuadrado.',
              'The surface of a sphere equals four circles of its equator, and the area of a circle is π times the radius squared.'),
      explanation: L('Un círculo máximo mide 3.1416 × ' + r7 + '² = ' + n2(A7 / 4) + ' cm², y la esfera vale cuatro de ellos: 4 × ' + n2(A7 / 4) + ' = ' + n2(A7) + ' cm².',
                     'One great circle measures 3.1416 × ' + r7 + '² = ' + n2(A7 / 4) + ' cm², and the sphere is worth four of them: 4 × ' + n2(A7 / 4) + ' = ' + n2(A7) + ' cm².'),
      options: o7, correct: o7[0], showWork: true
    }, rng);
  } else {
    var o7b = [r7 + ' cm', (2 * r7) + ' cm', (r7 + 3) + ' cm', (r7 - 2) + ' cm'];
    pushProb({
      title: L('De la piel al radio', 'From the skin to the radius'),
      questionText: L('La superficie de una esfera mide ' + n2(A7) + ' cm². Calcula su radio. Usa π ≈ 3.1416.',
                      'The surface of a sphere measures ' + n2(A7) + ' cm². Calculate its radius. Use π ≈ 3.1416.'),
      fn: 'A = ' + n2(A7) + ' cm² · π ≈ 3.1416',
      hint: L('La superficie vale cuatro veces π por el radio al cuadrado. Deshaz esas operaciones en orden inverso: divide primero y saca la raíz cuadrada al final.',
              'The surface is four times π times the radius squared. Undo those operations in reverse order: divide first and take the square root at the end.'),
      explanation: L('Al dividir, ' + n2(A7) + ' ÷ (4 × 3.1416) = ' + (r7 * r7) + ', que es el radio al cuadrado. La raíz cuadrada de ' + (r7 * r7) + ' = ' + r7 + ' cm.',
                     'Dividing, ' + n2(A7) + ' ÷ (4 × 3.1416) = ' + (r7 * r7) + ', which is the radius squared. The square root of ' + (r7 * r7) + ' = ' + r7 + ' cm.'),
      options: o7b, correct: o7b[0], showWork: true
    }, rng);
  }

  /* ── Problema 8 ── */
  var p8v = Math.floor(rng() * 2);
  if (p8v === 0){
    var o8 = [
      L('Son iguales', 'They are equal'),
      L('La de la esfera es el doble de la pared del cilindro', 'The sphere one is twice the cylinder wall'),
      L('La de la esfera es dos tercios de la pared del cilindro', 'The sphere one is two thirds of the cylinder wall'),
      L('La de la esfera es la mitad de la pared del cilindro', 'The sphere one is half of the cylinder wall')
    ];
    pushProb({
      title: L('La esfera contra su envoltura', 'The sphere against its wrapper'),
      questionText: L('Una esfera está encerrada justo dentro de un cilindro que la toca a lo largo de todo su ecuador y en los dos polos. ¿Cómo se compara la superficie de la esfera con la superficie de la pared curva del cilindro?',
                      'A sphere is enclosed exactly inside a cylinder that touches it all along its equator and at both poles. How does the surface of the sphere compare with the surface of the curved wall of the cylinder?'),
      hint: L('La pared curva se desenrolla en un rectángulo: uno de sus lados es la circunferencia del ecuador, 2π r, y el otro es la altura del cilindro. Compara ese producto con cuatro veces π r².',
              'The curved wall unrolls into a rectangle: one side is the equator circumference, 2π r, and the other is the height of the cylinder. Compare that product with four times π r².'),
      explanation: L('La altura del cilindro es 2r, así que su pared desenrollada mide 2π r × 2r = 4π r². La esfera mide también 4π r², de modo que las dos superficies coinciden.',
                     'The height of the cylinder is 2r, so its unrolled wall measures 2π r × 2r = 4π r². The sphere also measures 4π r², so the two surfaces coincide.'),
      options: o8, correct: o8[0], showWork: false
    }, rng);
  } else {
    var r8 = pick([6, 8, 9], rng);
    var A8 = 4 * PIV * r8 * r8;
    var o8b = [n2(A8) + ' cm²', n2(A8 / 2) + ' cm²', n2(2 * A8) + ' cm²', n2(A8 / 4) + ' cm²'];
    pushProb({
      title: L('La esfera contra su envoltura', 'The sphere against its wrapper'),
      questionText: L('La pared curva de un cilindro que envuelve ajustadamente a una esfera de ' + r8 + ' cm de radio mide ' + n2(A8) + ' cm². ¿Cuánto mide la superficie de esa esfera?',
                      'The curved wall of a cylinder that snugly wraps a sphere of radius ' + r8 + ' cm measures ' + n2(A8) + ' cm². How much does the surface of that sphere measure?'),
      hint: L('Desenrolla mentalmente la pared: queda un rectángulo de 2π r por 2r, es decir 4π r². Compara ese valor con lo que mide la piel de la esfera.',
              'Unroll the wall in your head: it leaves a rectangle of 2π r by 2r, that is 4π r². Compare that value with what the skin of the sphere measures.'),
      explanation: L('La pared desenrollada mide 2π r × 2r = 4π r², que es justo la superficie de la esfera. Por eso la esfera mide los mismos ' + n2(A8) + ' cm².',
                     'The unrolled wall measures 2π r × 2r = 4π r², which is exactly the surface of the sphere. That is why the sphere measures the same ' + n2(A8) + ' cm².'),
      options: o8b, correct: o8b[0], showWork: false
    }, rng);
  }

  /* ═════════ CIERRE ═════════ */
  addSection(
    '<div class="stag">' + L('Cierre', 'Closing') + '</div>' +
    '<h2>' + L('Dos situaciones para resolver', 'Two situations to solve') + '</h2>'
  );

  /* ── Problema 9 ── */
  var r9 = pick([15, 30], rng);
  var cyl9 = 2 * PIV * r9 * r9 * r9;
  var esf9 = 4 * PIV * r9 * r9 * r9 / 3;
  var o9 = [(2 * r9 / 3) + ' cm', r9 + ' cm', (r9 / 3) + ' cm', (4 * r9 / 3) + ' cm'];
  pushProb({
    title: L('El agua que se pierde', 'The water that is lost'),
    questionText: L('Un depósito cilíndrico de ' + r9 + ' cm de radio y ' + (2 * r9) + ' cm de altura está lleno de agua hasta el borde. Se sumerge por completo una bola de acero de ' + r9 + ' cm de radio, que entra justa, y toda el agua que se desborda se pierde. Después se saca la bola. ¿Qué altura alcanza el agua que queda en el depósito? Usa π ≈ 3.1416.',
                    'A cylindrical tank of radius ' + r9 + ' cm and height ' + (2 * r9) + ' cm is full of water to the brim. A steel ball of radius ' + r9 + ' cm, which fits exactly, is fully submerged, and all the water that overflows is lost. The ball is then taken out. What height does the water left in the tank reach? Use π ≈ 3.1416.'),
    hint: L('El agua perdida es exactamente la que ocupaba la bola. Resta ese volumen al del depósito y reparte lo que queda sobre la base circular para saber hasta dónde sube.',
            'The lost water is exactly the amount the ball took up. Subtract that volume from the tank and spread what is left over the circular base to find how high it rises.'),
    explanation: L('El depósito guarda 3.1416 × ' + r9 + '² × ' + (2 * r9) + ' = ' + n2(cyl9) + ' cm³ y la bola desplaza ' + frac(4, 3) + ' × 3.1416 × ' + r9 + '³ = ' + n2(esf9) + ' cm³. Quedan ' + n2(cyl9) + ' − ' + n2(esf9) + ' = ' + n2(cyl9 - esf9) + ' cm³ sobre una base de 3.1416 × ' + r9 + '² = ' + n2(PIV * r9 * r9) + ' cm², así que el agua sube ' + n2(cyl9 - esf9) + ' ÷ ' + n2(PIV * r9 * r9) + ' = ' + (2 * r9 / 3) + ' cm.',
                   'The tank holds 3.1416 × ' + r9 + '² × ' + (2 * r9) + ' = ' + n2(cyl9) + ' cm³ and the ball displaces ' + frac(4, 3) + ' × 3.1416 × ' + r9 + '³ = ' + n2(esf9) + ' cm³. That leaves ' + n2(cyl9) + ' − ' + n2(esf9) + ' = ' + n2(cyl9 - esf9) + ' cm³ over a base of 3.1416 × ' + r9 + '² = ' + n2(PIV * r9 * r9) + ' cm², so the water rises ' + n2(cyl9 - esf9) + ' ÷ ' + n2(PIV * r9 * r9) + ' = ' + (2 * r9 / 3) + ' cm.'),
    options: o9, correct: o9[0], showWork: true
  }, rng);

  /* ── Problema 10 ── */
  var r10 = pick([5, 10, 15], rng);
  var cyl10 = 2 * PIV * r10 * r10 * r10;
  var esf10 = 4 * PIV * r10 * r10 * r10 / 3;
  var air10 = cyl10 - esf10;
  var o10 = [n2(air10) + ' cm³', n2(esf10) + ' cm³', n2(cyl10) + ' cm³', n2(air10 / 2) + ' cm³'];
  pushProb({
    title: L('El aire de la caja', 'The air in the box'),
    questionText: L('Una pelota esférica de ' + r10 + ' cm de radio se guarda en una caja cilíndrica que la ajusta por completo: la caja tiene el mismo radio y su altura es igual al diámetro de la pelota. ¿Qué volumen de aire queda atrapado entre la pelota y la caja? Usa π ≈ 3.1416.',
                    'A spherical ball of radius ' + r10 + ' cm is kept in a cylindrical box that fits it completely: the box has the same radius and its height equals the diameter of the ball. What volume of air is trapped between the ball and the box? Use π ≈ 3.1416.'),
    hint: L('Calcula por separado lo que cabe en la caja y lo que ocupa la pelota; el aire es lo que sobra entre esos dos valores.',
            'Work out separately what fits in the box and what the ball takes up; the air is what is left between those two values.'),
    explanation: L('La caja mide 3.1416 × ' + r10 + '² × ' + (2 * r10) + ' = ' + n2(cyl10) + ' cm³ y la pelota mide ' + frac(4, 3) + ' × 3.1416 × ' + r10 + '³ = ' + n2(esf10) + ' cm³. El aire atrapado es la diferencia: ' + n2(cyl10) + ' − ' + n2(esf10) + ' = ' + n2(air10) + ' cm³.',
                   'The box measures 3.1416 × ' + r10 + '² × ' + (2 * r10) + ' = ' + n2(cyl10) + ' cm³ and the ball measures ' + frac(4, 3) + ' × 3.1416 × ' + r10 + '³ = ' + n2(esf10) + ' cm³. The trapped air is the difference: ' + n2(cyl10) + ' − ' + n2(esf10) + ' = ' + n2(air10) + ' cm³.'),
    options: o10, correct: o10[0], showWork: true
  }, rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Desarrollos Planos de Esferas';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
