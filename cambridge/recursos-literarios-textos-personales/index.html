<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursos Literarios en Textos Descriptivos Personales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Recursos Literarios en Textos Descriptivos Personales</div>
    <div class="wcourse" id="wcourse-el">Español · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Recursos Literarios en Textos Descriptivos Personales</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#c0202a', primaryDark:'#490a0e', primaryBg:'#f6e7e8',
  accent:'#f5c800', accentBg:'#fff8db',
  darkPrimary:'#c94049', darkPrimaryDark:'#e97179', darkPrimaryBg:'#3b0a0e',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────
  if (SCHOOL.logoLeftB64)  { try { doc.addImage(SCHOOL.logoLeftB64,  'PNG', M,   4, 48, 22); } catch(e){} }
  if (SCHOOL.logoRightB64) { try { doc.addImage(SCHOOL.logoRightB64, 'PNG', 130, 4, 48, 22); } catch(e){} }
  // ─────────────────────────────────────────────────────────────────────────

  // LIAXA logo — right side of white strip
  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('LIAXA', lx+10, ly+6.8);

  // Guide title + date inside the blue band
  doc.setTextColor(232,238,247); doc.setFontSize(19); doc.setFont('helvetica','bold');
  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(dateStr, M, 59);

  // ── Student info card (name + group only — código goes to footer) ──
  doc.setFillColor(237,240,245); doc.roundedRect(M,72,TW,20,3,3,'F');
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
  doc.text('ALUMNO', M+4, 79); doc.text('GRUPO', 130, 79);
  doc.setTextColor(20,24,32); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text(name, M+4, 87); doc.text(group, 130, 87);

  // ── Score box ──
  var sc = pct>=70?[26,106,74]:pct>=50?[224,123,26]:[176,48,16];
  doc.setFillColor(255,255,255); doc.roundedRect(M,100,TW,34,4,4,'F');
  doc.setDrawColor(sc[0],sc[1],sc[2]); doc.setLineWidth(0.8);
  doc.roundedRect(M,100,TW,34,4,4,'S');
  doc.setTextColor(sc[0],sc[1],sc[2]); doc.setFontSize(40); doc.setFont('helvetica','bold');
  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
  doc.text(correctCount+' correcta(s) de '+total+' preguntas', PW/2, 131, {align:'center'});

  // ── Problem summary table ──
  doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
  doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.rect(M,142,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS', M+4, 148);
  var sy = 154;
  problems.forEach(function(prob, i) {
    if (sy + 12 > PH - 15) {
      doc.addPage(); sy = 20;
      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp3_t05_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

   Recursos Literarios en Textos Descriptivos Personales
   ================================================ */
function buildLesson(rng) {
  var ES   = (LANG === 'es');
  var host = document.getElementById('lessonBody');
  problems.length = 0;
  host.innerHTML = '';
  injectWidgetCSS();

  /* ───────── micro helpers ───────── */
  function T(a, b) { return ES ? a : b; }
  function L(o)    { return ES ? o.es : o.en; }
  function qs(o)   { return '«' + o.es + '»'; }
  function qe(o)   { return '“' + o.en + '”'; }
  function Q(o)    { return ES ? qs(o) : qe(o); }
  function QO(o)   { return { es: qs(o), en: qe(o) }; }

  function sec(tag, title, html) {
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
    host.appendChild(d);
  }
  function widgetBox(id, kind) {
    var w = document.createElement('div');
    w.className = 'iwcard section';
    w.id = id;
    w.setAttribute('data-widget', kind);
    host.appendChild(w);
    return w;
  }
  function perm(n) {
    var a = [], i;
    for (i = 0; i < n; i++) a.push(i);
    a = shuffle(a, rng);
    if (a.every(function (v, k) { return v === k; })) { a.push(a.shift()); }

  function textHTML(tx, marks) {
    var out = '', i, j, s, f, ph, at, cls;
    for (i = 0; i < tx.lines.length; i++) {
      s = L(tx.lines[i]);
      if (marks) {
        for (j = 0; j < tx.figs.length; j++) {
          f = tx.figs[j];
          if (f.line !== i) continue;
          ph = L(f.q);
          at = s.indexOf(ph);
          if (at < 0) continue;
          cls = 'xchip' + (marks[j] || '');
          s = s.slice(0, at) + '<span class="' + cls + '" onclick="huTap(' + j + ')">' + ph + '</span>' + s.slice(at + ph.length);
        }
      }
      out += '<span class="dpara">' + s + '</span>';
    }
    return out;
  }
  function textBlock(k) {

  function widgetCaza() {

      for (j = 0; j < TXS[i].figs.length; j++) pool.push({ t:i, i:j });

    var order = shuffle(pool, rng).slice(0, 3);
    var st = { r:0, tries:0, marks:{}, done:false };
    var w = widgetBox('wCaza', 'hunt');

    function curTx() { return TXS[order[st.r].t]; }

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Caza de recursos', 'Resource hunt') + '</div>' +
          '<div class="iw-sub">' + T('Recorriste las tres marcas de esta ronda dentro de los textos.',
                                     'You worked through the three marks of this round inside the texts.') + '</div>' +
          '<div class="iw-fb">' + (fb || '') + '</div>';
        return;
      }
      var tp = REC[curTx().figs[order[st.r].i].type];
      w.innerHTML =
        '<div class="iw-tag">' + T('Caza de recursos', 'Resource hunt') + '</div>' +
        '<div class="iw-sub">' + T('Este texto tiene cinco fragmentos subrayados. Toca aquel en el que el texto ',
                                   'This text has five underlined fragments. Tap the one where the text ') + L(tp.d) + '.</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + order.length + '</div>' +
        '<div class="dtext"><div class="dtitle">' + LBL[order[st.r].t] + ' · ' + ENT[order[st.r].t] + ' · ' + L(curTx().title) + '</div>' +
          textHTML(curTx(), st.marks) + '</div>' +
        '<div class="iw-fb" id="huFb">' + (fb || '') + '</div>';
    }
    function advance(fb) {
      st.r++; st.tries = 0; st.marks = {};
      if (st.r >= order.length) { st.done = true; }
      if (st.done) { paint(''); return; }
      st.locked = true;
      var _fe = document.getElementById('trFb');
      if (_fe) _fe.innerHTML = (fb || '') + '<br><button onclick="trSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.binbtn');
      if (_bs) _bs.forEach(function(b){ b.style.opacity='0.35'; b.style.pointerEvents='none'; });
    }
    window.huTap = function (j) {
      if (st.done) return;
      var tx = curTx(), ti = order[st.r].i;
      var tp = REC[tx.figs[ti].type];
      if (j === ti) {

        advance('<span class="iw-ok">' + Q(tx.figs[j].q) + ': ' + L(tx.figs[j].eff) + '</span>');
        return;

      st.tries++;
      var got = REC[tx.figs[j].type];
      if (st.tries >= 3) {
        st.marks[ti] = ' rev';
        advance(T('El fragmento buscado era ', 'The fragment you were after was ') + Q(tx.figs[ti].q) + ': ' + L(tx.figs[ti].eff));
        return;
      }
      st.marks[j] = ' miss';
      paint(T('Ese fragmento ', 'That fragment ') + L(got.d) + T('. Busca el que ', '. Look for the one that ') + L(tp.d) + '.');
      st.marks[j] = '';
    };
    paint('');

  /* ═════════ WIDGET 3 · del fragmento al vínculo ═════════ */
  function widgetVinculo() {
    var a = shuffle(C.fam.figs, rng).slice(0, 1);
    var b = shuffle(C.esc.figs, rng).slice(0, 1);
    var c = shuffle(C.com.figs, rng).slice(0, 1);
    var extra = shuffle([ C.fam, C.esc, C.com ], rng)[0];
    var pick4 = shuffle(extra.figs, rng);
    var use = a.concat(b, c);
    var k;
    for (k = 0; k < pick4.length; k++) {
      if (use.indexOf(pick4[k]) < 0) { use.push(pick4[k]); break; }
    }
    var lo = perm(use.length), ro = perm(use.length);
    while (ro.every(function (v, i) { return v === lo[i]; })) { ro.push(ro.shift()); }
    var st = { sel:null, done:{}, tries:0, over:false };

    function paint(fb) {
      var left = lo.map(function (i) {

      }).join('');
      var right = ro.map(function (i) {
        var cls = 'mtchip' + (st.done[i] ? ' done' : '');
        return '<button class="' + cls + '" onclick="viR(' + i + ')">' + L(use[i].link) + '</button>';
      }).join('');

        '<div class="iw-sub">' + T('Toca un fragmento y después aquello que ese fragmento deja saber de la relación. Ningún texto declara el vínculo: lo deja dentro de una imagen.',

        '<div class="mtcols">' +
          '<div><div class="mthead">' + T('Fragmento', 'Fragment') + '</div>' + left + '</div>' +
          '<div><div class="mthead">' + T('Lo que deja saber', 'What it lets us know') + '</div>' + right + '</div>' +
        '</div>' +
        '<div class="iw-fb" id="viFb">' + (fb || '') + '</div>';
    }
    function allDone() {
      var i;
      for (i = 0; i < use.length; i++) { if (!st.done[i]) return false; }
      return true;
    }
    window.viL = function (i) {
      if (st.over || st.done[i]) return;
      st.sel = (st.sel === i) ? null : i;

    };
    window.viR = function (i) {
      if (st.over || st.done[i]) return;
      if (st.sel === null) { paint(T('Elige primero un fragmento.', 'Choose a fragment first.')); return; }
      if (st.sel === i) {
        st.done[i] = true; st.sel = null; st.tries = 0;
        if (allDone()) {
          st.over = true;
          paint('<span class="iw-ok">' + T('Las cuatro parejas quedaron completas: en los tres entornos el vínculo se dedujo de una imagen y nunca de una declaración.',
                                           'All four pairs are complete: in the three settings the bond was deduced from an image and never from a declaration.') + '</span>');
          return;
        }
        paint('<span class="iw-ok">' + T('Pareja correcta. Ahí el texto ', 'Correct pair. There the text ') + L(REC[use[i].type].d) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var j = st.sel;
        st.done[j] = true; st.sel = null; st.tries = 0;
        if (allDone()) {
          st.over = true;
          paint(T('El fragmento ', 'The fragment ') + Q(use[j].q) + T(' dejaba saber que ', ' let us know that ') + L(use[j].link) + '.');
          return;
        }
        paint(T('El fragmento ', 'The fragment ') + Q(use[j].q) + T(' dejaba saber que ', ' let us know that ') + L(use[j].link) + '.');
        return;
      }
      paint(T('Todavía no. Pregúntate qué se sabría de esa relación si ese fragmento no estuviera escrito.',
              'Not yet. Ask yourself what would be known about that relationship if that fragment were not written.'));
    };
    paint('');
  }

    window.esTap = function (pos) {

  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: false,

      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

              en:'Compare which groups appear in each version and which ones keep the markers that order the queue in time.' },
      exp: { es:'La versión correcta conserva a los mismos cuatro grupos, pero al quitar las marcas de orden deja de leerse el horario del barrio: lo que era una escala se vuelve una lista.',
             en:'The correct version keeps the same four groups, but by removing the order markers the timetable of the neighbourhood stops being readable: what was a scale becomes a list.' },
      options: [
        { es:'A la esquina llegan trabajadores, estudiantes, abuelas y gente sin prisa a lo largo de la mañana.',
          en:'Workers, students, grandmothers and people in no hurry come to the corner throughout the morning.' },
        { es:'Primero llegan los trabajadores, después los estudiantes, después las abuelas y al final los jubilados.',
          en:'First come the workers, then the students, then the grandmothers and last the retired ones.' },
        { es:'A la esquina llega tanta gente que la fila ya no cabe en la banqueta de la cuadra.',
          en:'So many people come to the corner that the queue no longer fits on the pavement of the block.' },
        { es:'Los trabajadores, los estudiantes y las abuelas llegan como llega el agua a un desagüe.',
          en:'The workers, the students and the grandmothers arrive the way water arrives at a drain.' }
      ],
      ci: 0
    };
  }

  function q9() {
    if (rng() < 0.5) {
      return {
        title: { es:'Dónde se coloca la exageración', en:'Where the exaggeration is placed' },
        q: { es:'El Texto I coloca la medida imposible de la paciencia después de tres enunciados de intensidad moderada. Determina qué consigue con ese orden.',
             en:'Text I places the impossible measure of the patience after three sentences of moderate intensity. Determine what it achieves with that order.' },
        hint: { es:'Imagina el mismo texto con los cuatro enunciados exagerados y pregúntate dónde quedaría entonces lo notable.',
                en:'Imagine the same text with all four sentences exaggerated and ask yourself where the notable part would then be.' },
        exp: { es:'La intensidad se percibe por contraste. Sobre un fondo moderado, la medida imposible destaca y se lee como el punto al que apuntaba el texto; si todo estuviera exagerado, nada lo estaría.',
               en:'Intensity is perceived by contrast. Against a moderate background, the impossible measure stands out and reads as the point the text was aiming at; if everything were exaggerated, nothing would be.' },
        options: [
          { es:'Que la exageración se lea como una medida y no como un exceso, porque contrasta con lo anterior.',
            en:'That the exaggeration reads as a measure and not as an excess, because it contrasts with what came before.' },
          { es:'Que quien lee llegue preparado para la figura y por eso ya no necesite detenerse en ella.',
            en:'That the reader arrives prepared for the figure and therefore no longer needs to stop at it.' },
          { es:'Que el texto reserve para el final la única imagen que describe al abuelo por dentro.',
            en:'That the text saves for the end the only image that describes the grandfather from inside.' },
          { es:'Que los tres enunciados anteriores queden corregidos por la exageración que los sigue.',
            en:'That the three previous sentences end up corrected by the exaggeration that follows them.' }
        ],
        ci: 0
      };
    }
    return {
      title: { es:'Si todo se exagera', en:'If everything is exaggerated' },
      q: { es:'Determina qué le ocurriría al Texto III si sus cinco enunciados estuvieran escritos con la misma intensidad que «no hay una sola casa que no le deba algo».',
           en:'Determine what would happen to Text III if all five of its sentences were written with the same intensity as “there is not a single house that does not owe her something.”' },
      hint: { es:'Piensa la figura como una marca sobre un fondo: pregúntate qué pasa cuando la marca ocupa todo el fondo.',
              en:'Think of the figure as a mark on a background: ask yourself what happens when the mark takes up the whole background.' },
      exp: { es:'Una figura se percibe contra un fondo. Si todo el texto exagera, quien lee deja de notar la exageración y el enunciado que cargaba la deuda del barrio se pierde entre los demás.',
             en:'A figure is perceived against a background. If the whole text exaggerates, the reader stops noticing the exaggeration and the sentence that carried the debt of the neighbourhood gets lost among the rest.' },
      options: [
        { es:'La exageración dejaría de destacar y el texto perdería el punto donde quería concentrar la atención.',
          en:'The exaggeration would stop standing out and the text would lose the point where it wanted to concentrate attention.' },
        { es:'El texto ganaría fuerza, porque cada enunciado sostendría el mismo nivel de emoción de principio a fin.',
          en:'The text would gain force, because every sentence would hold the same level of emotion from beginning to end.' },
        { es:'El texto dejaría de describir la esquina y pasaría a describir los sentimientos de quien escribe.',
          en:'The text would stop describing the corner and would come to describe the feelings of the writer.' },
        { es:'El texto se volvería más breve, porque las figuras dicen en una línea lo que el dato dice en tres.',
          en:'The text would become shorter, because figures say in one line what the plain fact says in three.' }
      ],
      ci: 0
    };
  }

  function q10() {
    if (rng() < 0.5) {
      return {
        title: { es:'Escribir el propio', en:'Writing your own' },
        q: { es:'Vas a escribir un texto descriptivo sobre alguien de tu comunidad y quieres que quien lea termine sabiendo qué le debes a esa persona sin que se lo digas de forma directa. Determina qué decisión sirve a ese propósito.',
             en:'You are going to write a descriptive text about someone in your community and you want the reader to end up knowing what you owe that person without your saying it directly. Determine which decision serves that purpose.' },
        hint: { es:'Recuerda de dónde salía el vínculo en los tres textos que leíste: nunca de una declaración, siempre de algo observable puesto dentro de una figura.',
                en:'Remember where the bond came from in the three texts you read: never from a declaration, always from something observable placed inside a figure.' },
        exp: { es:'En los tres textos la herencia, el refugio y la deuda nunca se declaran: están dentro de una imagen concreta. Describir un objeto o un gesto con la figura adecuada deja que quien lee saque la conclusión, que es justo lo que pedía el propósito.',
               en:'In the three texts the inheritance, the refuge and the debt are never declared: they are inside a concrete image. Describing an object or a gesture with the right figure lets the reader draw the conclusion, which is exactly what the purpose asked for.' },
        options: [
          { es:'Elegir un objeto o un gesto que solo exista por esa persona y describirlo con una imagen que lleve la deuda dentro.',
            en:'Choose an object or a gesture that only exists because of that person and describe it with an image that carries the debt inside.' },
          { es:'Abrir el texto con una definición de la gratitud y desarrollarla con ejemplos tomados de tu barrio.',
            en:'Open the text with a definition of gratitude and develop it with examples taken from your neighbourhood.' },
          { es:'Enumerar las cualidades de esa persona y cerrar con la frase que mejor resuma lo que sientes.',
            en:'List the qualities of that person and close with the sentence that best sums up what you feel.' },
          { es:'Contar el día en que la conociste y ordenar los hechos desde el primero hasta el más reciente.',
            en:'Tell the day you met her and arrange the facts from the first one to the most recent.' }
        ],
        ci: 0
      };
    }
    return {
      title: { es:'Escribir el propio', en:'Writing your own' },
      q: { es:'Vas a escribir un texto descriptivo sobre una persona de tu casa y quieres que quien lea perciba la confianza que hay entre ustedes sin que aparezca la palabra confianza. Determina qué decisión sirve a ese propósito.',
           en:'You are going to write a descriptive text about a person in your home and you want the reader to perceive the trust between you without the word trust appearing. Determine which decision serves that purpose.' },
      hint: { es:'Piensa en la banca del Texto II: el vínculo se volvió visible cuando un lugar diario recibió una imagen.',
              en:'Think of the desk in Text II: the bond became visible when an everyday place received an image.' },
      exp: { es:'La confianza se ve en lo que se repite sin acuerdo previo. Una imagen puesta sobre esa costumbre la vuelve legible sin nombrarla, tal como la banca se vuelve isla sin que nadie diga que las dos están aisladas.',
             en:'Trust shows in what is repeated with no prior agreement. An image placed on that habit makes it legible without naming it, just as the desk turns into an island without anyone saying the two of them are isolated.' },
      options: [
        { es:'Describir una costumbre mínima que se repite entre ustedes y prestarle una imagen que muestre lo que significa.',
          en:'Describe a small habit repeated between you and lend it an image that shows what it means.' },
        { es:'Escoger tres adjetivos precisos para esa persona y sostener cada uno con un recuerdo distinto.',
          en:'Choose three precise adjectives for that person and back each one with a different memory.' },
        { es:'Narrar un desacuerdo grave entre ustedes y explicar después cómo lograron resolverlo.',
          en:'Narrate a serious disagreement between you and then explain how you managed to resolve it.' },
        { es:'Comenzar por el parecido físico entre ustedes y pasar después a los gustos que comparten.',
          en:'Begin with the physical resemblance between you and move afterwards to the tastes you share.' }
      ],
      ci: 0
    };
  }

  function put(spec) {
    addP({
      title: spec.title, q: spec.q, hint: spec.hint, exp: spec.exp,
      options: spec.options, correct: spec.options[spec.ci]
    });
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Describir un vínculo no es hacer un inventario', 'Describing a bond is not making an inventory'),
      '<p>' + T('Si escribes que la cocina tiene una estufa, cuatro sillas y una ventana, quien lee obtiene datos y nada más. Un texto descriptivo personal hace algo distinto: elige qué se mira, con qué palabras se nombra y qué se deja fuera, y en esa elección aparece la relación entre quien escribe y lo descrito. Los recursos literarios son las herramientas de esa elección, y trabajan en tres frentes. Unos entregan una sensación, es decir, aquello que un sentido registra sin que nadie lo interprete: un olor, un peso, una temperatura. Otros entregan una emoción, lo que siente quien escribe frente a esa persona o ese lugar. Otros entregan una idea, una afirmación sobre el vínculo mismo: qué es, qué hace, cuánto pesa. Los tres textos que siguen describen tres entornos distintos, el familiar, el escolar y el comunitario. En ninguno de los tres se declara el vínculo: en los tres se deja ver dentro de una imagen.',
                'If you write that the kitchen has a stove, four chairs and a window, the reader gets facts and nothing else. A personal descriptive text does something different: it chooses what is looked at, with which words it is named and what is left out, and in that choice the relationship between the writer and what is described appears. Literary devices are the tools of that choice, and they work on three fronts. Some deliver a sensation, that is, what a sense registers with nobody interpreting it: a smell, a weight, a temperature. Others deliver an emotion, what the writer feels towards that person or that place. Others deliver an idea, a statement about the bond itself: what it is, what it does, how much it weighs. The three texts that follow describe three different settings: the family one, the school one and the community one. In none of the three is the bond declared: in all three it is left to be seen inside an image.') + '</p>' +
      textBlock(0) + textBlock(1) + textBlock(2) +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('en cada texto pregunta qué se percibe, qué se siente y qué queda afirmado sobre la relación, aunque nadie lo diga con esas palabras.',
          'in each text ask what is perceived, what is felt and what ends up stated about the relationship, even though nobody says it in those words.') + '</p></div>');
  widgetTres();
  put(q1());
  put(q2());

  sec(T('Recursos', 'Devices'),
      T('Las marcas que quedan en la página', 'The marks left on the page'),
      '<p>' + T('Un recurso literario no es un adorno que se agrega al final: es una decisión localizable en la página, y por eso siempre se puede citar. La metáfora afirma que una cosa es otra y traslada de golpe todo lo que asociamos con la segunda. El símil deja la comparación a la vista y presta una experiencia que quien lee ya tuvo. La personificación da conducta humana a lo que no la tiene, y un objeto pasa a parecer que decide. La hipérbole lleva la medida hasta lo imposible y mide así lo que ninguna cifra mediría. La sinestesia cruza dos sentidos dentro de una sola imagen. La anáfora repite el mismo comienzo y convierte una lista en una insistencia. La enumeración acumula elementos hasta llenar el lugar de percepciones. La antítesis enfrenta dos partes opuestas en el mismo enunciado. La gradación las ordena en una escala que avanza. Reconocer la marca es el primer paso; el trabajo verdadero empieza después.',
                'A literary device is not a decoration added at the end: it is a decision locatable on the page, and that is why it can always be quoted. The metaphor states that one thing is another and carries over at once everything we associate with the second. The simile leaves the comparison in sight and lends an experience the reader has already had. Personification gives human behaviour to what has none, and an object starts to look as though it decides. Hyperbole takes the measure to the impossible and so measures what no figure would measure. Synaesthesia crosses two senses inside one single image. Anaphora repeats the same opening and turns a list into an insistence. Enumeration piles up elements until the place is filled with perceptions. Antithesis sets two opposite parts against each other in the same sentence. Gradation arranges them on a scale that advances. Recognising the mark is the first step; the real work begins afterwards.') + '</p>' +
      '<div class="glosslist">' +
        ['metafora','simil','personificacion','hiperbole','sinestesia','anafora','enumeracion','antitesis','gradacion'].map(function (k) {
          return '<div class="gloss"><div class="glossn">' + L(REC[k].n) + '</div><div class="glossd">' + L(REC[k].d) + '</div></div>';
        }).join('') +
      '</div>');
  widgetCaza();
  put(q3());
  put(q4());

  sec(T('Efecto', 'Effect'),
      T('Un recurso vale por lo que deja saber', 'A device is worth what it lets us know'),
      '<p>' + T('Nombrar la figura sirve de poco si no puedes decir qué produce. Ese paso se comprueba con una prueba sencilla: quita el recurso, escribe la misma información en palabras planas y compara lo que queda. Si nada cambia, el recurso estaba de adorno. Si al quitarlo se pierde la prisa, el refugio, la deuda o el frío, entonces el recurso estaba sosteniendo el texto. En una descripción de vínculos esa prueba tiene una consecuencia extra: lo que se pierde casi siempre es la relación misma. El dato sobrevive, la persona sigue ahí, el lugar sigue ahí, pero deja de saberse qué son el uno para el otro. Por eso una lectura atenta no colecciona figuras: sigue lo que cada una deja saber y comprueba si eso era lo que la descripción necesitaba dejar saber.',
                'Naming the figure is of little use if you cannot say what it produces. That step is checked with a simple test: remove the device, write the same information in plain words and compare what is left. If nothing changes, the device was decoration. If removing it loses the rush, the refuge, the debt or the cold, then the device was holding the text up. In a description of bonds that test has an extra consequence: what is lost is almost always the relationship itself. The fact survives, the person is still there, the place is still there, but it stops being known what they are to each other. That is why an attentive reading does not collect figures: it follows what each one lets us know and checks whether that was what the description needed to let us know.') + '</p>');
  widgetVinculo();
  put(q5());
  put(q6());

  sec(T('Construir', 'Building'),
      T('Las tres piezas de una imagen', 'The three pieces of an image'),
      '<p>' + T('Hasta aquí leíste imágenes hechas por otros. Armar una propia exige tres piezas. La primera es el elemento observado, y conviene que sea concreto y del entorno del que hablas: una reja, una voz, unas manos, una banca. La segunda es la operación que lo une a otra cosa: afirmar que es esa cosa, o declarar que se le parece dejando el enlace a la vista, o prestarle una conducta que no le corresponde. La tercera es la imagen que se le presta, y de ella depende qué se traslada: alcance, corte, años de uso, temperatura. Cambiar solo la operación ya cambia el texto, porque decide cuánto queda a cargo de quien lee. Afirmar no admite discusión y obliga a aceptar el traslado completo; comparar propone y deja libre a quien lee para medir hasta dónde llega el parecido.',
                'So far you have read images made by others. Building one of your own requires three pieces. The first is the observed element, and it is best that it be concrete and from the setting you are speaking about: a gate, a voice, a pair of hands, a desk. The second is the operation that joins it to something else: stating that it is that thing, or declaring that it resembles it leaving the link in sight, or lending it a behaviour that does not belong to it. The third is the image lent to it, and on it depends what gets carried over: reach, a cut, years of use, temperature. Changing only the operation already changes the text, because it decides how much is left to the reader. Stating admits no discussion and forces the whole transfer to be accepted; comparing proposes and leaves the reader free to measure how far the resemblance goes.') + '</p>');
  widgetTaller();
  put(q7());
  put(q8());

  sec(T('Intensidad', 'Intensity'),
      T('Una figura se nota contra un fondo', 'A figure shows against a background'),
      '<p>' + T('Entre el dato desnudo y la exageración imposible hay una escala. El dato informa y no deja ver nada. La imagen concreta muestra sin figura: alguien lija una tabla hasta que la veta deja de sentirse. El símil trae una imagen de fuera y muestra el enlace. La hipérbole rompe la medida. Ninguno de esos peldaños es mejor que otro, y el error más común no es elegir mal el recurso sino usar el más alto todo el tiempo. Una descripción escrita entera en el peldaño más intenso cansa y, sobre todo, se apaga: cuando todo exagera, la exageración deja de leerse como tal y el punto que el texto quería marcar se pierde entre los demás. Por eso los textos que leíste sostienen un fondo moderado y reservan la medida imposible para el lugar exacto donde está lo que quieren que recuerdes.',
                'Between the bare fact and the impossible exaggeration there is a scale. The fact informs and lets nothing be seen. The concrete image shows with no figure: someone sands a board until the grain stops being felt. The simile brings an image from outside and shows the link. Hyperbole breaks the measure. None of those steps is better than another, and the most common mistake is not choosing the wrong device but using the highest one all the time. A description written entirely on the most intense step tires the reader and, above all, switches itself off: when everything exaggerates, exaggeration stops reading as such and the point the text wanted to mark gets lost among the rest. That is why the texts you read keep a moderate background and save the impossible measure for the exact place where what they want you to remember is.') + '</p>');
  widgetEscalera();
  put(q9());

  sec(T('Cierre', 'Wrap-up'),
      T('Tu propio texto', 'Your own text'),
      '<p>' + T('Lo que hiciste con estos tres textos es lo mismo que harás al escribir el tuyo, solo que en sentido contrario: aquí partiste de la imagen para encontrar el vínculo, y al escribir partirás del vínculo para elegir la imagen.',
                'What you did with these three texts is the same thing you will do when writing your own, only in the opposite direction: here you started from the image to find the bond, and when writing you will start from the bond to choose the image.') + '</p>');
  widgetCuaderno();
  put(q10());
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Recursos Literarios en Textos Descriptivos Personales';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
