<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desarrollos Planos de Esferas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.mcv { display:block; width:100%; height:260px; touch-action:none; background:var(--surface); }
.mrow { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-top:.7rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.55rem .9rem; font-size:.82rem; cursor:pointer; color:var(--text2); font-family:inherit; min-height:44px; transition:all .14s; }
.mbtn:hover { border-color:var(--green); color:var(--green); }
.mbtn.go { background:var(--green); color:#fff; border-color:var(--green); }
.mbtn.go:hover { background:var(--green-dark); color:#fff; }
.mbtn.warn { border-color:var(--gold); color:var(--gold); }
.mfb { margin-top:.7rem; padding:.6rem .85rem; border-radius:8px; font-size:.84rem; background:var(--surface2); color:var(--text2); border-left:3px solid var(--border); }
.mfb.good { background:var(--ok-bg); color:var(--ok); border-left-color:var(--ok); }
.mfb.near { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.mstat { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.7rem; }
.mtile { background:var(--surface2); border-radius:8px; padding:.55rem .35rem; text-align:center; border:1.5px solid var(--border); }
.mtile.hit { border-color:var(--ok); background:var(--ok-bg); }
.mtile .tl { font-size:.62rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); }
.mtile .tv { font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; color:var(--text); }
.mhead { display:flex; justify-content:space-between; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.4rem; }
.mtitle { font-weight:600; font-size:.95rem; }
.mround { font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.mnote { font-size:.76rem; color:var(--text3); margin-top:.5rem; }
.mhide { display:none; }
@media (max-width:600px){ .mstat { grid-template-columns:1fr 1fr; } .mcv { height:230px; } .mbtn { font-size:.78rem; padding:.5rem .6rem; } }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Desarrollos Planos de Esferas</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Desarrollos Planos de Esferas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>

function getAttemptKey(name, group){ return 'mat3_t05_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

var studentData   = {};

   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'mat3_t05_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'mat3_t05_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {

  var name  = document.getElementById('sName').value.trim();

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  if (SCHOOL.logoLeftB64) {

  }
  if (SCHOOL.logoRightB64) {
    var fmtR = SCHOOL.logoRightB64.indexOf('/9j/') > -1 ? 'JPEG' : 'PNG';
    try { doc.addImage(SCHOOL.logoRightB64, fmtR, 130, 4, 48, 22); } catch(e) {}
  }

  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');

  // Guide title + date inside the blue band

  doc.text(t('wtitle'), M, 49);

  }

  // ── Footer on every page ──

    doc.setPage(p);

    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('mat3_t05_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';

}

var PIV = 3.1416;

function shuffleOpts(opts, correct, rng){

}
function pushProb(spec, rng){

function setFb(id, msg, cls){

function showEl(id, on){ var e = document.getElementById(id); if (e) e.classList.toggle('mhide', !on); }
function cvFit(id){

  var r = cv.getBoundingClientRect();
  var w = Math.max(240, Math.round(r.width));

  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

}

var M1 = null, M2 = null, M3 = null, M4 = null;

/* ================================================
   MANIPULATIVE 1 : Torno de revolución
   The student spins a flat profile around the axis and names the solid.
   Pattern B: 3 figures, directional profile hints, reveal on the 3rd miss.
   ================================================ */
var M1KINDS = ['esfera', 'media', 'cono', 'cilindro'];
function m1Name(k){
  return k === 'esfera'   ? L('una esfera', 'a sphere')
       : k === 'media'    ? L('media esfera', 'a hemisphere')
       : k === 'cono'     ? L('un cono', 'a cone')
       :                    L('un cilindro', 'a cylinder');
}
function m1Figure(k){
  return k === 'esfera'   ? L('un semicírculo girando sobre su diámetro', 'a semicircle spinning about its diameter')
       : k === 'media'    ? L('un cuarto de círculo girando sobre uno de sus radios rectos', 'a quarter circle spinning about one of its straight radii')
       : k === 'cono'     ? L('un triángulo rectángulo girando sobre uno de sus catetos', 'a right triangle spinning about one of its legs')
       :                    L('un rectángulo girando sobre uno de sus lados', 'a rectangle spinning about one of its sides');
}
function m1Trait(k){
  return k === 'esfera'   ? L('el perfil sale del eje, se abre al máximo justo a media altura y se vuelve a cerrar arriba y abajo', 'the profile leaves the axis, opens up to its maximum at mid height and closes again at the top and at the bottom')
       : k === 'media'    ? L('el perfil se cierra en un extremo y termina de golpe con un borde plano en el otro', 'the profile closes at one end and stops abruptly with a flat edge at the other')
       : k === 'cono'     ? L('el perfil es un segmento recto que se aleja del eje de forma pareja, de una punta a un borde ancho', 'the profile is a straight segment moving away from the axis evenly, from a tip to a wide edge')
       :                    L('el perfil se mantiene siempre a la misma distancia del eje, de arriba abajo', 'the profile stays at the same distance from the axis all the way up and down');
}
function m1Build(rng){
  var order = shuffle(M1KINDS, rng).slice(0, 3);
  M1 = { kinds: order, round: 0, tries: 0, done: false, resolved: false, ang: 60 };
}
function m1H(k){ return k === 'media' ? 1 : 2; }
function m1Rad(k, y){
  if (k === 'esfera'){ var d = y - 1; return Math.sqrt(Math.max(0, 1 - d * d)); }
  if (k === 'media'){ var e = 1 - y; return Math.sqrt(Math.max(0, 1 - e * e)); }
  if (k === 'cono'){ return y / 2; }
  return 1;
}
function m1Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Torno de revolución', 'Revolution lathe') + '</div>' +
    '<div class="mround" id="m1r"></div></div>' +
    '<p style="font-size:.86rem">' + L(
      'La figura dorada es plana y está pegada al eje punteado. Mueve el control de giro y observa qué cuerpo va barriendo en el aire. Cuando lo reconozcas, dilo.',
      'The gold figure is flat and attached to the dashed axis. Move the spin control and watch which solid it sweeps out in the air. When you recognise it, say so.') + '</p>' +
    '<div class="cvwrap"><canvas class="mcv" id="m1cv"></canvas></div>' +
    '<div class="cgrid" style="margin-top:.8rem">' +
      '<div class="cg"><label>' + L('Giro', 'Spin') + ': <span class="cval" id="m1lv"></span>°</label>' +
        '<input type="range" id="m1a" min="0" max="360" step="5" oninput="m1Input()"></div>' +
      '<div class="cg"><label>' + L('Figura plana', 'Flat figure') + ': <span class="cval" id="m1lf"></span></label>' +
        '<div class="mnote" id="m1hintline"></div></div>' +
    '</div>' +
    '<div class="mrow">' +
      '<button class="mbtn" onclick="m1Answer(\'esfera\')">' + L('Esfera', 'Sphere') + '</button>' +
      '<button class="mbtn" onclick="m1Answer(\'media\')">' + L('Media esfera', 'Hemisphere') + '</button>' +
      '<button class="mbtn" onclick="m1Answer(\'cono\')">' + L('Cono', 'Cone') + '</button>' +
      '<button class="mbtn" onclick="m1Answer(\'cilindro\')">' + L('Cilindro', 'Cylinder') + '</button>' +
    '</div>' +
    '<div class="mfb" id="m1fb"></div>' +
    '<div class="mrow"><button class="mbtn go mhide" id="m1next" onclick="m1Next()">' + L('Siguiente figura →', 'Next figure →') + '</button></div>' +
  '</div>';
}
function m1Init(){
  var a = document.getElementById('m1a'); if (!a || !M1) return;
  a.value = M1.ang;
  showEl('m1next', false);
  setFb('m1fb', L('Empieza a girar la figura y fíjate en el rastro que deja.', 'Start spinning the figure and watch the trail it leaves behind.'), '');
  m1Input();
}
function m1Input(){
  var a = document.getElementById('m1a'); if (!a || !M1) return;
  M1.ang = parseInt(a.value, 10);
  document.getElementById('m1lv').textContent = M1.ang;
  var lf = document.getElementById('m1lf');
  if (lf) lf.textContent = (M1.round + 1) + ' / 3';
  var rr = document.getElementById('m1r');
  if (rr) rr.textContent = L('Figura ' + (M1.round + 1) + ' de 3', 'Figure ' + (M1.round + 1) + ' of 3');
  var hl = document.getElementById('m1hintline');
  if (hl) hl.textContent = M1.ang < 360
    ? L('Todavía falta vuelta: has barrido ' + Math.round(M1.ang / 3.6) + ' % del cuerpo.', 'Still turning: you have swept ' + Math.round(M1.ang / 3.6) + ' % of the solid.')
    : L('Vuelta completa: el cuerpo está cerrado.', 'Full turn: the solid is closed.');
  m1Draw();
}
function m1Path(ctx, kind, ax, top, s, sx){
  var H = m1H(kind), i, y, r;
  ctx.beginPath();
  ctx.moveTo(ax, top);
  for (i = 0; i <= 44; i++){ y = H * i / 44; r = m1Rad(kind, y) * s * sx; ctx.lineTo(ax + r, top + y * s); }
  ctx.lineTo(ax, top + H * s);
  ctx.closePath();
}
function m1Draw(){
  var f = cvFit('m1cv'); if (!f || !M1) return;
  var ctx = f.ctx, kind = M1.kinds[M1.round], H = m1H(kind);
  var s = Math.min((f.h - 54) / H, (f.w - 90) / 2.4);
  var ax = f.w / 2, top = (f.h - H * s) / 2;
  var th = M1.ang * Math.PI / 180;
  ctx.save(); ctx.strokeStyle = cssv('--text3'); ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ax, top - 20); ctx.lineTo(ax, top + H * s + 20); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.strokeStyle = cssv('--green'); ctx.globalAlpha = 0.4; ctx.lineWidth = 1.3;
  for (var k = 0; k <= 18; k++){
    var y = H * k / 18, r = m1Rad(kind, y) * s;
    if (r < 1.5) continue;
    ctx.beginPath(); ctx.ellipse(ax, top + y * s, r, r * 0.3, 0, 0, Math.max(0.001, th)); ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.9; ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2.4;
  m1Path(ctx, kind, ax, top, s, Math.cos(th)); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.fillStyle = cssv('--gold-bg'); ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2.6;
  m1Path(ctx, kind, ax, top, s, 1); ctx.fill(); ctx.stroke(); ctx.restore();
  cvLabel(ctx, L('figura plana', 'flat figure'), 10, 16, cssv('--gold'));
  cvLabel(ctx, L('rastro del giro', 'trail of the spin'), 10, 33, cssv('--green'));
  cvLabel(ctx, L('eje', 'axis'), ax + 6, top - 14, cssv('--text3'));
}
function m1Answer(k){
  if (!M1 || M1.done || M1.resolved) return;
  var tgt = M1.kinds[M1.round];
  if (k === tgt){
    M1.resolved = true;
    setFb('m1fb', L('¡Eso es! Con ' + m1Figure(tgt) + ' se genera ' + m1Name(tgt) + ', porque ' + m1Trait(tgt) + '.',
                    'That is it. With ' + m1Figure(tgt) + ' you generate ' + m1Name(tgt) + ', because ' + m1Trait(tgt) + '.'), 'good');
    showEl('m1next', true);
    return;
  }
  M1.tries++;
  if (M1.tries >= 3){
    M1.resolved = true;
    setFb('m1fb', L('Era ' + m1Name(tgt) + ': ' + m1Trait(tgt) + '.', 'It was ' + m1Name(tgt) + ': ' + m1Trait(tgt) + '.'), 'near');
    showEl('m1next', true);
    return;
  }
  var msg = L('Todavía no. Para ' + m1Name(k) + ' el perfil tendría que cumplir que ' + m1Trait(k) + ', y aquí no pasa eso. Sigue girando y vuelve a mirar.',
              'Not yet. For ' + m1Name(k) + ' the profile would have to satisfy that ' + m1Trait(k) + ', and that is not what happens here. Keep spinning and look again.');
  setFb('m1fb', msg, 'near');
}
function m1Next(){
  if (!M1) return;
  M1.round++; M1.tries = 0; M1.resolved = false;
  showEl('m1next', false);
  if (M1.round >= 3){
    M1.done = true; M1.round = 2;
    setFb('m1fb', L('Las tres figuras giraron. Solo el semicírculo completo devuelve una esfera entera: sus puntos están todos a la misma distancia del centro del diámetro.',
                    'All three figures have spun. Only the full semicircle gives back a whole sphere: all of its points sit at the same distance from the centre of the diameter.'), 'good');
    return;
  }
  M1.ang = 60;
  var a = document.getElementById('m1a'); if (a) a.value = 60;
  setFb('m1fb', L('Figura nueva. Gírala y decide qué cuerpo aparece.', 'New figure. Spin it and decide which solid appears.'), '');
  m1Input();
}

/* ================================================
   MANIPULATIVE 2 : Mesa de husos
   The gore pattern redraws live as n changes; the student matches a target
   area per gore. Pattern B: 3 rounds, reveal within each round.
   ================================================ */
function m2Build(rng){
  var Rs = [6, 9, 12, 15];
  var ns = shuffle([6, 8, 10, 12, 15, 18, 20, 24], rng).slice(0, 3);
  var rounds = [];
  for (var i = 0; i < 3; i++) rounds.push({ R: Rs[Math.floor(rng() * Rs.length)], n: ns[i] });
  M2 = { rounds: rounds, round: 0, tries: 0, done: false, resolved: false, n: 12 };
}
function m2Cur(){ return M2.rounds[M2.round]; }
function m2Area(R, n){ return 4 * PIV * R * R / n; }
function m2Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Mesa de husos', 'Gore table') + '</div>' +
    '<div class="mround" id="m2r"></div></div>' +
    '<p style="font-size:.86rem">' + L(
      'Aquí está el patrón de papel que envolverá la esfera. El rectángulo total mide siempre lo mismo, pero cambia en cuántas tiras lo cortas. Ajusta el número de husos hasta que cada uno cubra el área que te piden.',
      'Here is the paper pattern that will wrap the sphere. The whole rectangle always measures the same, but you can change how many strips you cut it into. Adjust the number of gores until each one covers the area you are asked for.') + '</p>' +
    '<div class="cvwrap"><canvas class="mcv" id="m2cv"></canvas></div>' +
    '<div class="cgrid" style="margin-top:.8rem">' +
      '<div class="cg"><label>' + L('Número de husos', 'Number of gores') + ': <span class="cval" id="m2lv"></span></label>' +
        '<input type="range" id="m2n" min="4" max="24" step="1" oninput="m2Input()"></div>' +
      '<div class="cg"><label>' + L('Ancho de cada huso en el ecuador', 'Width of each gore at the equator') + ': <span class="cval" id="m2lw"></span> cm</label>' +
        '<div class="mnote" id="m2note"></div></div>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile"><div class="tl">' + L('Radio', 'Radius') + '</div><div class="tv" id="m2tR">·</div></div>' +
      '<div class="mtile" id="m2ta"><div class="tl">' + L('Área de un huso', 'Area of one gore') + '</div><div class="tv" id="m2tv">·</div></div>' +
      '<div class="mtile"><div class="tl">' + L('Objetivo', 'Target') + '</div><div class="tv" id="m2tg">·</div></div>' +
    '</div>' +
    '<div class="mrow"><button class="mbtn go" onclick="m2Check()">' + L('Comprobar el patrón', 'Check the pattern') + '</button>' +
      '<button class="mbtn go mhide" id="m2next" onclick="m2Next()">' + L('Siguiente esfera →', 'Next sphere →') + '</button></div>' +
    '<div class="mfb" id="m2fb"></div>' +
  '</div>';
}
function m2Init(){
  var s = document.getElementById('m2n'); if (!s || !M2) return;
  s.value = M2.n;
  showEl('m2next', false);
  setFb('m2fb', L('Mueve el control y observa cómo cambian las tiras.', 'Move the control and watch how the strips change.'), '');
  m2Input();
}
function m2Input(){
  var s = document.getElementById('m2n'); if (!s || !M2) return;
  M2.n = parseInt(s.value, 10);
  var cur = m2Cur();
  var area = m2Area(cur.R, M2.n), tgt = m2Area(cur.R, cur.n);
  document.getElementById('m2lv').textContent = M2.n;
  document.getElementById('m2lw').textContent = n2(2 * PIV * cur.R / M2.n);
  document.getElementById('m2r').textContent = L('Esfera ' + (M2.round + 1) + ' de 3', 'Sphere ' + (M2.round + 1) + ' of 3');
  document.getElementById('m2tR').textContent = cur.R + ' cm';
  document.getElementById('m2tg').textContent = n2(tgt) + ' cm²';
  var tile = document.getElementById('m2ta'), tv = document.getElementById('m2tv');
  if (Math.abs(area - tgt) < 0.005){ tile.classList.add('hit'); tv.textContent = n2(area) + ' cm² ✓'; }
  else { tile.classList.remove('hit'); tv.textContent = n2(area) + ' cm² ' + (area > tgt ? '▼' : '▲'); }
  var nt = document.getElementById('m2note');
  if (nt) nt.textContent = M2.n >= 16
    ? L('Con tantos husos cada tira casi no se curva: el papel se pega bien.', 'With so many gores each strip barely curves: the paper sits flat.')
    : L('Con pocos husos cada tira se arruga al pegarla sobre la esfera.', 'With few gores each strip wrinkles when glued onto the sphere.');
  m2Draw();
}
function m2Draw(){
  var f = cvFit('m2cv'); if (!f || !M2) return;
  var ctx = f.ctx, n = M2.n;
  var pad = 26;
  var W = f.w - 2 * pad, H = Math.min(f.h - 2 * pad, W * 0.5);
  var left = pad, top = (f.h - H) / 2;
  ctx.save(); ctx.strokeStyle = cssv('--border'); ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.strokeRect(left, top, W, H); ctx.restore();
  ctx.save(); ctx.strokeStyle = cssv('--gold'); ctx.setLineDash([6, 5]); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(left, top + H / 2); ctx.lineTo(left + W, top + H / 2); ctx.stroke(); ctx.restore();
  var gw = W / n, i, j, v, hw;
  for (i = 0; i < n; i++){
    var cx = left + (i + 0.5) * gw;
    ctx.beginPath();
    for (j = 0; j <= 24; j++){ v = -1 + 2 * j / 24; hw = (gw / 2) * Math.cos(v * Math.PI / 2); ctx.lineTo(cx + hw, top + H / 2 + v * H / 2); }
    for (j = 24; j >= 0; j--){ v = -1 + 2 * j / 24; hw = (gw / 2) * Math.cos(v * Math.PI / 2); ctx.lineTo(cx - hw, top + H / 2 + v * H / 2); }
    ctx.closePath();
    ctx.fillStyle = (i % 2 === 0) ? cssv('--green-bg') : cssv('--surface2');
    ctx.fill();
    ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 1.2; ctx.stroke();
  }
  cvLabel(ctx, L('polo', 'pole'), left, top - 10, cssv('--text3'));
  cvLabel(ctx, L('ecuador', 'equator'), left, top + H / 2 - 12, cssv('--gold'));
  cvLabel(ctx, L('polo', 'pole'), left, top + H + 12, cssv('--text3'));
}
function m2Check(){
  if (!M2 || M2.done || M2.resolved) return;
  var cur = m2Cur();
  if (M2.n === cur.n){
    M2.resolved = true;
    setFb('m2fb', L('¡Justo! Con ' + cur.n + ' husos cada tira cubre ' + n2(m2Area(cur.R, cur.n)) + ' cm², es decir la superficie completa repartida en ' + cur.n + ' partes iguales.',
                    'Exactly. With ' + cur.n + ' gores each strip covers ' + n2(m2Area(cur.R, cur.n)) + ' cm², that is the whole surface split into ' + cur.n + ' equal parts.'), 'good');
    showEl('m2next', true);
    return;
  }
  M2.tries++;
  if (M2.tries >= 3){
    M2.resolved = true;
    M2.n = cur.n;
    var s = document.getElementById('m2n'); if (s) s.value = cur.n;
    m2Input();
    setFb('m2fb', L('Eran ' + cur.n + ' husos: la superficie de esta esfera repartida en ' + cur.n + ' partes deja ' + n2(m2Area(cur.R, cur.n)) + ' cm² en cada una.',
                    'It was ' + cur.n + ' gores: the surface of this sphere split into ' + cur.n + ' parts leaves ' + n2(m2Area(cur.R, cur.n)) + ' cm² in each one.'), 'near');
    showEl('m2next', true);
    return;
  }
  var area = m2Area(cur.R, M2.n), tgt = m2Area(cur.R, cur.n);
  setFb('m2fb', area > tgt
    ? L('Cada huso todavía cubre demasiado (' + n2(area) + ' cm² contra ' + n2(tgt) + ' cm²). Reparte la misma superficie entre más tiras.',
        'Each gore still covers too much (' + n2(area) + ' cm² against ' + n2(tgt) + ' cm²). Share the same surface among more strips.')
    : L('Te pasaste de tiras: cada huso se quedó en ' + n2(area) + ' cm² y el objetivo es ' + n2(tgt) + ' cm². Usa menos husos.',
        'You went past: each gore is only ' + n2(area) + ' cm² and the target is ' + n2(tgt) + ' cm². Use fewer gores.'), 'near');
}
function m2Next(){
  if (!M2) return;
  M2.round++; M2.tries = 0; M2.resolved = false;
  showEl('m2next', false);
  if (M2.round >= 3){
    M2.done = true; M2.round = 2;
    setFb('m2fb', L('Tres esferas repartidas. El patrón de husos siempre mide lo mismo en total porque la superficie de la esfera no cambia: solo cambia en cuántas tiras la partes.',
                    'Three spheres shared out. The gore pattern always measures the same in total because the sphere surface does not change: only the number of strips does.'), 'good');
    return;
  }
  M2.n = 12;
  var s = document.getElementById('m2n'); if (s) s.value = 12;
  setFb('m2fb', L('Esfera nueva, objetivo nuevo. Vuelve a ajustar las tiras.', 'New sphere, new target. Adjust the strips again.'), '');
  m2Input();
}

/* ================================================
   MANIPULATIVE 3 : Trasvase de Arquímedes
   Cone / sphere / cylinder of matching radius pour into one another.
   Reversible: the vessel can be emptied at any time. Reveal on the 3rd spill.
   ================================================ */
function m3Build(rng){
  var Rs = [3, 4, 5, 6];
  var order = shuffle(['esfera', 'cilindro', 'cilindro'], rng);
  var rounds = [];
  for (var i = 0; i < 3; i++) rounds.push({ v: order[i], R: Rs[Math.floor(rng() * Rs.length)] });
  M3 = { rounds: rounds, round: 0, tries: 0, done: false, resolved: false, conos: 0, esferas: 0 };
}
function m3Cur(){ return M3.rounds[M3.round]; }
function m3Cap(v){ return v === 'esfera' ? 2 : 3; }
function m3Fill(){ return M3.conos + 2 * M3.esferas; }
function m3Vol(kind, R){
  if (kind === 'cono') return 2 * PIV * R * R * R / 3;
  if (kind === 'esfera') return 4 * PIV * R * R * R / 3;
  return 2 * PIV * R * R * R;
}
function m3CapH(fr){
  var lo = 0, hi = 2, mid, v;
  for (var i = 0; i < 40; i++){ mid = (lo + hi) / 2; v = mid * mid * (3 - mid) / 4; if (v < fr) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function m3Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('Trasvase de Arquímedes', 'Archimedes pouring bench') + '</div>' +
    '<div class="mround" id="m3r"></div></div>' +
    '<p style="font-size:.86rem" id="m3task"></p>' +
    '<div class="cvwrap"><canvas class="mcv" id="m3cv"></canvas></div>' +
    '<div class="mrow">' +
      '<button class="mbtn" onclick="m3Pour(\'cono\')" id="m3bc">' + L('Vaciar un cono', 'Pour one cone') + '</button>' +
      '<button class="mbtn" onclick="m3Pour(\'esfera\')" id="m3be">' + L('Vaciar una esfera', 'Pour one sphere') + '</button>' +
      '<button class="mbtn warn" onclick="m3Reset(true)">' + L('Vaciar el recipiente', 'Empty the vessel') + '</button>' +
    '</div>' +
    '<div class="mstat">' +
      '<div class="mtile"><div class="tl">' + L('Conos vertidos', 'Cones poured') + '</div><div class="tv" id="m3tc">0</div></div>' +
      '<div class="mtile"><div class="tl">' + L('Esferas vertidas', 'Spheres poured') + '</div><div class="tv" id="m3te">0</div></div>' +
      '<div class="mtile" id="m3tf"><div class="tl">' + L('Llenado', 'Filled') + '</div><div class="tv" id="m3tv">0 %</div></div>' +
    '</div>' +
    '<div class="mnote" id="m3note"></div>' +
    '<div class="mfb" id="m3fb"></div>' +
    '<div class="mrow"><button class="mbtn go mhide" id="m3next" onclick="m3Next()">' + L('Siguiente recipiente →', 'Next vessel →') + '</button></div>' +
  '</div>';
}
function m3Init(){
  if (!M3 || !document.getElementById('m3cv')) return;
  showEl('m3next', false);
  m3Reset(false);
}
function m3Ask(){
  var cur = m3Cur();
  var el = document.getElementById('m3task');
  if (el) el.textContent = cur.v === 'esfera'
    ? L('El recipiente es una esfera hueca de radio ' + cur.R + ' cm. El cono que tienes a la mano tiene el mismo radio y su altura es igual al diámetro de la esfera. Llénala exactamente, sin derramar.',
        'The vessel is a hollow sphere of radius ' + cur.R + ' cm. The cone at hand has the same radius and its height equals the diameter of the sphere. Fill it exactly, without spilling.')
    : L('El recipiente es un cilindro de radio ' + cur.R + ' cm y altura igual al diámetro de la esfera. Tienes conos y esferas del mismo radio. Llénalo exactamente, sin derramar.',
        'The vessel is a cylinder of radius ' + cur.R + ' cm and height equal to the diameter of the sphere. You have cones and spheres of the same radius. Fill it exactly, without spilling.');
  var rr = document.getElementById('m3r');
  if (rr) rr.textContent = L('Recipiente ' + (M3.round + 1) + ' de 3', 'Vessel ' + (M3.round + 1) + ' of 3');
  var be = document.getElementById('m3be');
  if (be) be.classList.toggle('mhide', cur.v === 'esfera');
  var nt = document.getElementById('m3note');
  if (nt) nt.textContent = L('Cono: ' + n2(m3Vol('cono', cur.R)) + ' cm³   ·   Esfera: ' + n2(m3Vol('esfera', cur.R)) + ' cm³   ·   Cilindro: ' + n2(m3Vol('cilindro', cur.R)) + ' cm³',
                             'Cone: ' + n2(m3Vol('cono', cur.R)) + ' cm³   ·   Sphere: ' + n2(m3Vol('esfera', cur.R)) + ' cm³   ·   Cylinder: ' + n2(m3Vol('cilindro', cur.R)) + ' cm³');
}
function m3Reset(counts){
  if (!M3) return;
  if (counts && !M3.resolved && !M3.done && m3Fill() > 0){
    M3.tries++;
    if (M3.tries >= 3){ m3Reveal(); return; }
  }
  M3.conos = 0; M3.esferas = 0;
  m3Ask();
  m3Update();
  if (!M3.resolved) setFb('m3fb', L('Recipiente vacío. Empieza a verter.', 'Vessel empty. Start pouring.'), '');
}
function m3Update(){
  if (!M3) return;
  var cur = m3Cur(), cap = m3Cap(cur.v), fill = m3Fill();
  var tc = document.getElementById('m3tc'); if (tc) tc.textContent = M3.conos;
  var te = document.getElementById('m3te'); if (te) te.textContent = M3.esferas;
  var pctv = Math.round(Math.min(fill, cap) / cap * 100);
  var tv = document.getElementById('m3tv'); if (tv) tv.textContent = pctv + ' %';
  var tf = document.getElementById('m3tf'); if (tf) tf.classList.toggle('hit', fill === cap);
  m3Draw();
}
function m3Draw(){
  var f = cvFit('m3cv'); if (!f || !M3) return;
  var ctx = f.ctx, cur = m3Cur(), cap = m3Cap(cur.v);
  var fr = Math.min(1, m3Fill() / cap);
  var r = Math.min((f.h - 46) / 2.5, (f.w - 60) / 3.2);
  var cx = f.w / 2, top = (f.h - 2 * r) / 2 + 6;
  var wat = cssv('--green'), lin = cssv('--text2');
  if (cur.v === 'cilindro'){
    var h = 2 * r * fr, ey = r * 0.26;
    ctx.save();
    ctx.beginPath(); ctx.rect(cx - r, top + 2 * r - h, 2 * r, h);
    ctx.fillStyle = wat; ctx.globalAlpha = 0.28; ctx.fill(); ctx.restore();
    if (fr > 0.001){
      ctx.save(); ctx.beginPath(); ctx.ellipse(cx, top + 2 * r - h, r, ey, 0, 0, 2 * Math.PI);
      ctx.fillStyle = wat; ctx.globalAlpha = 0.55; ctx.fill(); ctx.restore();
    }
    ctx.save(); ctx.strokeStyle = lin; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - r, top); ctx.lineTo(cx - r, top + 2 * r); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + r, top); ctx.lineTo(cx + r, top + 2 * r); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, top + 2 * r, r, ey, 0, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, top, r, ey, 0, 0, 2 * Math.PI); ctx.stroke();
    ctx.restore();
  } else {
    var hh = m3CapH(fr) * r;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, top + r, r, 0, 2 * Math.PI); ctx.clip();
    ctx.beginPath(); ctx.rect(cx - r, top + 2 * r - hh, 2 * r, hh);
    ctx.fillStyle = wat; ctx.globalAlpha = 0.28; ctx.fill();
    ctx.restore();
    if (fr > 0.001 && fr < 0.999){
      var half = Math.sqrt(Math.max(0, r * r - (r - hh) * (r - hh)));
      ctx.save(); ctx.beginPath(); ctx.ellipse(cx, top + 2 * r - hh, half, half * 0.26, 0, 0, 2 * Math.PI);
      ctx.fillStyle = wat; ctx.globalAlpha = 0.55; ctx.fill(); ctx.restore();
    }
    ctx.save(); ctx.strokeStyle = lin; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, top + r, r, 0, 2 * Math.PI); ctx.stroke();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(cx, top + r, r, r * 0.28, 0, 0, 2 * Math.PI); ctx.stroke();
    ctx.restore();
  }
  cvLabel(ctx, cur.v === 'esfera' ? L('esfera hueca', 'hollow sphere') : L('cilindro', 'cylinder'), 10, 16, cssv('--text3'));
  cvLabel(ctx, L('capacidad ', 'capacity ') + n2(m3Vol(cur.v, cur.R)) + ' cm³', 10, 33, cssv('--gold'));
  cvLabel(ctx, L('vertido ', 'poured ') + n2(m3Fill() * m3Vol('cono', cur.R)) + ' cm³', 10, 50, cssv('--green'));
}
function m3Pour(kind){
  if (!M3 || M3.done || M3.resolved) return;
  var cur = m3Cur(), cap = m3Cap(cur.v);
  if (kind === 'esfera' && cur.v === 'esfera') return;
  if (kind === 'cono') M3.conos++; else M3.esferas++;
  var fill = m3Fill();
  m3Update();
  if (fill === cap){
    M3.resolved = true;
    var txt = cur.v === 'esfera'
      ? L('Exacto: dos conos llenan la esfera. El cono se lleva ' + n2(m3Vol('cono', cur.R)) + ' cm³ y la esfera guarda ' + n2(m3Vol('esfera', cur.R)) + ' cm³, el doble.',
          'Exact: two cones fill the sphere. The cone holds ' + n2(m3Vol('cono', cur.R)) + ' cm³ and the sphere holds ' + n2(m3Vol('esfera', cur.R)) + ' cm³, twice as much.')
      : L('Exacto: el cilindro se llenó con ' + n2(m3Vol('cilindro', cur.R)) + ' cm³, que es lo mismo que tres conos, o una esfera más un cono.',
          'Exact: the cylinder took ' + n2(m3Vol('cilindro', cur.R)) + ' cm³, the same as three cones, or one sphere plus one cone.');
    setFb('m3fb', txt, 'good');
    showEl('m3next', true);
    return;
  }
  if (fill > cap){
    M3.tries++;
    if (M3.tries >= 3){ m3Reveal(); return; }
    setFb('m3fb', L('Se derramó: metiste ' + n2(fill * m3Vol('cono', cur.R)) + ' cm³ en un recipiente de ' + n2(m3Vol(cur.v, cur.R)) + ' cm³. Vacía y prueba con menos.',
                    'It spilled: you put in ' + n2(fill * m3Vol('cono', cur.R)) + ' cm³ in a vessel of ' + n2(m3Vol(cur.v, cur.R)) + ' cm³. Empty it and try with less.'), 'near');
    M3.conos = 0; M3.esferas = 0;
    m3Update();
    return;
  }
  setFb('m3fb', L('Vas en ' + Math.round(fill / cap * 100) + ' %. Todavía cabe más.', 'You are at ' + Math.round(fill / cap * 100) + ' %. There is still room.'), '');
}
function m3Reveal(){
  var cur = m3Cur();
  M3.resolved = true;
  if (cur.v === 'esfera'){ M3.conos = 2; M3.esferas = 0; }
  else { M3.conos = 3; M3.esferas = 0; }
  m3Update();
  setFb('m3fb', cur.v === 'esfera'
    ? L('Ahí lo tienes: la esfera cabe en dos conos de ese mismo radio y esa misma altura.', 'There it is: the sphere fits in exactly two cones of that same radius and height.')
    : L('Ahí lo tienes: el cilindro cabe en tres conos de ese mismo radio y esa misma altura.', 'There it is: the cylinder fits in exactly three cones of that same radius and height.'), 'near');
  showEl('m3next', true);
}
function m3Next(){
  if (!M3) return;
  M3.round++; M3.tries = 0; M3.resolved = false;
  showEl('m3next', false);
  if (M3.round >= 3){
    M3.done = true; M3.round = 2;
    setFb('m3fb', L('Cono, esfera y cilindro del mismo radio, con la altura igual al diámetro, se reparten en la proporción 1 a 2 a 3.',
                    'Cone, sphere and cylinder of the same radius, with height equal to the diameter, share the proportion 1 to 2 to 3.'), 'good');
    return;
  }
  m3Reset(false);
}

/* ================================================
   MANIPULATIVE 4 : La piel de la esfera
   Mode A: lay great circles until they add up to the sphere surface.
   Mode B: unroll the lateral band of the circumscribed cylinder, live.
   ================================================ */
function m4Build(rng){
  var Rs = [5, 6, 7, 8, 10];
  M4 = { R: Rs[Math.floor(rng() * Rs.length)], mode: 'circulos', n: 1, tries: 0, done: false, un: 0 };
}
function m4Html(){
  return '<div class="gcrd">' +
    '<div class="mhead"><div class="mtitle">' + L('La piel de la esfera', 'The skin of the sphere') + '</div>' +
    '<div class="mround" id="m4r"></div></div>' +
    '<div class="mtabs">' +
      '<button class="mtab active" id="m4t1" onclick="m4Mode(\'circulos\')">' + L('Círculos máximos', 'Great circles') + '</button>' +
      '<button class="mtab" id="m4t2" onclick="m4Mode(\'banda\')">' + L('Banda del cilindro', 'Cylinder band') + '</button>' +
    '</div>' +
    '<p style="font-size:.86rem" id="m4desc"></p>' +
    '<div class="cvwrap"><canvas class="mcv" id="m4cv"></canvas></div>' +
    '<div id="m4rowA">' +
      '<div class="mrow">' +
        '<button class="mbtn" onclick="m4Add(-1)">' + L('− un círculo', '− one circle') + '</button>' +
        '<button class="mbtn" onclick="m4Add(1)">' + L('+ un círculo', '+ one circle') + '</button>' +
        '<button class="mbtn go" onclick="m4Check()">' + L('Comprobar', 'Check') + '</button>' +
      '</div>' +
      '<div class="mstat">' +
        '<div class="mtile"><div class="tl">' + L('Círculos puestos', 'Circles laid') + '</div><div class="tv" id="m4tn">1</div></div>' +
        '<div class="mtile" id="m4tp"><div class="tl">' + L('Piel cubierta', 'Skin covered') + '</div><div class="tv" id="m4tv">25 %</div></div>' +
        '<div class="mtile"><div class="tl">' + L('Piel total', 'Total skin') + '</div><div class="tv" id="m4ts">·</div></div>' +
      '</div>' +
    '</div>' +
    '<div id="m4rowB" class="mhide">' +
      '<div class="cgrid" style="margin-top:.4rem">' +
        '<div class="cg"><label>' + L('Desenrollar la banda', 'Unroll the band') + ': <span class="cval" id="m4lv">0</span> %</label>' +
          '<input type="range" id="m4u" min="0" max="100" step="1" oninput="m4Input()"></div>' +
        '<div class="cg"><div class="mnote" id="m4bnote"></div></div>' +
      '</div>' +
      '<div class="mstat">' +
        '<div class="mtile"><div class="tl">' + L('Largo de la banda', 'Band length') + '</div><div class="tv" id="m4bw">·</div></div>' +
        '<div class="mtile"><div class="tl">' + L('Alto de la banda', 'Band height') + '</div><div class="tv" id="m4bh">·</div></div>' +
        '<div class="mtile"><div class="tl">' + L('Área de la banda', 'Band area') + '</div><div class="tv" id="m4ba">·</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="mfb" id="m4fb"></div>' +
  '</div>';
}
function m4Init(){
  if (!M4 || !document.getElementById('m4cv')) return;
  var u = document.getElementById('m4u'); if (u) u.value = M4.un;
  m4Mode(M4.mode);
}
function m4Mode(m){
  if (!M4) return;
  M4.mode = m;
  var t1 = document.getElementById('m4t1'), t2 = document.getElementById('m4t2');
  if (t1) t1.classList.toggle('active', m === 'circulos');
  if (t2) t2.classList.toggle('active', m === 'banda');
  showEl('m4rowA', m === 'circulos');
  showEl('m4rowB', m === 'banda');
  var d = document.getElementById('m4desc');
  if (d) d.textContent = m === 'circulos'
    ? L('A la izquierda está la esfera de radio ' + M4.R + ' cm. A la derecha vas poniendo recortes circulares del tamaño de su ecuador. Pon los que hagan falta para cubrir toda la piel de la esfera, ni uno más.',
        'On the left is the sphere of radius ' + M4.R + ' cm. On the right you lay circular cut outs the size of its equator. Lay exactly as many as are needed to cover the whole skin of the sphere, not one more.')
    : L('Ahora la esfera está apretada dentro de un cilindro que la toca por todas partes. Desenrolla la pared curva del cilindro y compárala con la piel de la esfera.',
        'Now the sphere is squeezed inside a cylinder that touches it everywhere. Unroll the curved wall of the cylinder and compare it with the skin of the sphere.');
  var rr = document.getElementById('m4r');
  if (rr) rr.textContent = m === 'circulos' ? L('Recortes', 'Cut outs') : L('Envoltura', 'Wrapper');
  if (m === 'circulos') m4Update(); else m4Input();
}
function m4Add(d){
  if (!M4 || M4.done) return;
  M4.n = Math.max(1, Math.min(6, M4.n + d));
  m4Update();
  setFb('m4fb', L('Llevas ' + (25 * M4.n) + ' % de la piel de la esfera cubierta.', 'You have covered ' + (25 * M4.n) + ' % of the sphere skin.'), '');
}
function m4Update(){
  if (!M4) return;
  var A = 4 * PIV * M4.R * M4.R;
  var tn = document.getElementById('m4tn'); if (tn) tn.textContent = M4.n;
  var tv = document.getElementById('m4tv'); if (tv) tv.textContent = (25 * M4.n) + ' %';
  var ts = document.getElementById('m4ts'); if (ts) ts.textContent = n2(A) + ' cm²';
  var tp = document.getElementById('m4tp'); if (tp) tp.classList.toggle('hit', M4.n === 4);
  m4Draw();
}
function m4Input(){
  if (!M4) return;
  var u = document.getElementById('m4u'); if (!u) return;
  M4.un = parseInt(u.value, 10);
  var R = M4.R;
  document.getElementById('m4lv').textContent = M4.un;
  document.getElementById('m4bw').textContent = n2(2 * PIV * R) + ' cm';
  document.getElementById('m4bh').textContent = (2 * R) + ' cm';
  document.getElementById('m4ba').textContent = n2(4 * PIV * R * R) + ' cm²';
  var bn = document.getElementById('m4bnote');
  if (bn) bn.textContent = M4.un < 100
    ? L('Sigue desenrollando: la banda todavía abraza la esfera.', 'Keep unrolling: the band still hugs the sphere.')
    : L('Banda estirada. Su área coincide con la piel de la esfera.', 'Band stretched out. Its area matches the skin of the sphere.');
  m4Draw();
}
function m4Draw(){
  var f = cvFit('m4cv'); if (!f || !M4) return;
  var ctx = f.ctx, lin = cssv('--text2');
  if (M4.mode === 'circulos'){
    var r = Math.min((f.h - 30) / 2.2, f.w / 6.2);
    var cx = 18 + r, cy = f.h / 2;
    ctx.save(); ctx.strokeStyle = lin; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.3, 0, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.3, r, 0, 0, 2 * Math.PI); ctx.stroke();
    ctx.restore();
    var rr = r * 0.62, gx = cx + r + 26, i;
    for (i = 0; i < M4.n; i++){
      var col = i % 3, row = Math.floor(i / 3);
      var px = gx + rr + col * (2 * rr + 8), py = cy - rr - 6 + row * (2 * rr + 10);
      if (px + rr > f.w - 4) continue;
      ctx.save();
      ctx.beginPath(); ctx.arc(px, py, rr, 0, 2 * Math.PI);
      ctx.fillStyle = cssv('--green-bg'); ctx.fill();
      ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 1.8; ctx.stroke();
      ctx.restore();
    }
    cvLabel(ctx, L('esfera', 'sphere'), 10, 14, cssv('--text3'));
    cvLabel(ctx, L('recortes del tamaño del ecuador', 'cut outs the size of the equator'), gx, 14, cssv('--green'));
  } else {
    var t = M4.un / 100;
    var rB = Math.min((f.h - 46) / 2.4, (f.w - 70) / (2 + 2 * Math.PI));
    var bx = 20, by = (f.h - 2 * rB) / 2 + 4, ccx = bx + rB, ccy = by + rB;
    ctx.save(); ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1.4;
    ctx.strokeRect(bx, by, 2 * rB, 2 * rB);
    ctx.beginPath(); ctx.ellipse(ccx, by, rB, rB * 0.26, 0, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(ccx, by + 2 * rB, rB, rB * 0.26, 0, 0, 2 * Math.PI); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.strokeStyle = lin; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ccx, ccy, rB, 0, 2 * Math.PI); ctx.stroke(); ctx.restore();
    var wFull = 2 * Math.PI * rB;
    var w = t * wFull;
    var rx = bx + 2 * rB + 22;
    if (w > 2){
      ctx.save();
      ctx.beginPath(); ctx.rect(rx, by, Math.min(w, f.w - rx - 8), 2 * rB);
      ctx.fillStyle = cssv('--gold-bg'); ctx.fill();
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 1.8; ctx.stroke();
      ctx.restore();
      cvLabel(ctx, '2 × 3.1416 × ' + M4.R + ' cm', rx + 4, by - 10, cssv('--gold'));
      cvLabel(ctx, (2 * M4.R) + ' cm', rx + 4, by + 2 * rB + 12, cssv('--gold'));
    }
    cvLabel(ctx, L('esfera dentro del cilindro', 'sphere inside the cylinder'), 10, 14, cssv('--text3'));
  }
}
function m4Check(){
  if (!M4 || M4.done) return;
  var A = 4 * PIV * M4.R * M4.R, g = PIV * M4.R * M4.R;
  if (M4.n === 4){
    M4.done = true;
    setFb('m4fb', L('¡Exacto! Cuatro recortes de ' + n2(g) + ' cm² dan ' + n2(A) + ' cm², justo la piel de la esfera de radio ' + M4.R + ' cm.',
                    'Exactly. Four cut outs of ' + n2(g) + ' cm² give ' + n2(A) + ' cm², precisely the skin of the sphere of radius ' + M4.R + ' cm.'), 'good');
    return;
  }
  M4.tries++;

    setFb('m4fb', L('Eran cuatro: la piel de la esfera equivale a cuatro círculos de su ecuador, ' + n2(A) + ' cm² en total.',

    return;
  }
  setFb('m4fb', M4.n < 4
    ? L('Con ' + M4.n + ' recortes cubres ' + (25 * M4.n) + ' % y quedan ' + n2(A - M4.n * g) + ' cm² de esfera al aire. Pon más.',

}
