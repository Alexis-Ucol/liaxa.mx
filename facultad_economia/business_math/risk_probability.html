<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probability and Risk in Business · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_probabilidad.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Probability and Risk in Business</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Probability and Risk in Business</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzIje7cRD7iI77G2-t6LMJEHtvjnwrFOJXsbbLe_4phhI7h9AhjL2HoIil1C-IoEn8T/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',
  darkPrimaryDark: '#7aaae0',
  darkPrimaryBg:   '#0e1e38',
  darkAccent:      '#d4b86a',
  darkAccentBg:    '#241e0e',
  logoLeftB64:  '',

function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 10) / 10).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function dec1(x)   { return x.toFixed(1); }
function dec2(x)   { return x.toFixed(2); }
function dec3(x)   { return x.toFixed(3); }
/* Percentage with one decimal, identical in both languages. */
function pct1(x)   { return (Math.round(x * 1000) / 10).toFixed(1); }
/* Percentage with two decimals, used for option values. */
function pct2(x)   { return (x * 100).toFixed(2) + '%'; }

/* ── THE MODELS THIS GUIDE RUNS ON ────────────────────────────────────────
   Risk in a business is never a feeling, it is a share of cases. Every
   number in this guide comes from four operations on the same idea: count
   the share of a group in which something happens, correct that share when
   two things can happen at once, recount it inside a smaller group once new
   information arrives, and finally weigh money by those shares to decide.
   Everything below is those four. */

/* The share of a group in which something happens. */
function prob(favourable, total) { return total > 0 ? favourable / total : 0; }
/* The opposite case. Everything that is not the event is the complement. */
function complement(p) { return 1 - p; }
/* Two events, one portfolio. Adding two shares counts the overlap twice, so
   the overlap comes out once. This is the addition rule. */
function unionP(pa, pb, pboth) { return pa + pb - pboth; }
/* Nothing at all happens: the complement of the union. */
function neitherP(pa, pb, pboth) { return 1 - unionP(pa, pb, pboth); }
/* Independence is a claim about the world, not a formula: it says that
   knowing B changes nothing about A. Only then does the product hold. */
function jointIndependent(pa, pb) { return pa * pb; }
/* Recounting inside a smaller group: of everything that is B, how much is
   also A. This is the conditional probability. */
function conditional(pboth, pgiven) { return pgiven > 0 ? pboth / pgiven : 0; }
/* At least one event in n independent repetitions: far easier to count the
   single way in which nothing happens and take the opposite. */
function atLeastOne(p, n) { return 1 - Math.pow(1 - p, n); }
/* A screening test on a population: the four boxes any alert system splits
   the world into, in counts rather than in decimals. */
function screen(N, base, sens, falseAlarm) {
  var real   = N * base;
  var clean  = N - real;
  var tp     = real * sens;
  var fn     = real - tp;
  var fp     = clean * falseAlarm;
  var tn     = clean - fp;
  var alerts = tp + fp;
  return {
    N: N, real: real, clean: clean, tp: tp, fn: fn, fp: fp, tn: tn,
    alerts: alerts,
    ppv: alerts > 0 ? tp / alerts : 0,
    alertRate: N > 0 ? alerts / N : 0
  };
}
/* The average result of a decision repeated many times, and the size of the
   swing around that average. The average alone never decides: a business
   that cannot survive the worst branch does not get to repeat the bet. */
function expectedValue(outcomes) {
  var s = 0, i;
  for (i = 0; i < outcomes.length; i++) s += outcomes[i].p * outcomes[i].v;
  return s;
}
function variance(outcomes) {
  var m = expectedValue(outcomes), s = 0, i;
  for (i = 0; i < outcomes.length; i++) s += outcomes[i].p * Math.pow(outcomes[i].v - m, 2);
  return s;
}
function stdev(outcomes) { return Math.sqrt(variance(outcomes)); }
/* Risk per peso of expected return: the only fair way to compare the spread
   of two projects of different size. */
function coefVar(outcomes) {
  var m = expectedValue(outcomes);
  return m !== 0 ? stdev(outcomes) / Math.abs(m) : 0;
}
function lossProb(outcomes) {
  var s = 0, i;
  for (i = 0; i < outcomes.length; i++) if (outcomes[i].v < 0) s += outcomes[i].p;
  return s;
}
function worstCase(outcomes) {
  var w = null, i;
  for (i = 0; i < outcomes.length; i++) if (w === null || outcomes[i].v < w) w = outcomes[i].v;
  return w === null ? 0 : w;
}

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers rendered by fmt, aligned across languages. */
function valOpts(correct, wrongs, fmt, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmt(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(s);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.12 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.37);
  return shuffleOpts(vals, vals, rng);
}
/* Four distinct shares, each written with the wording of the business
   question so the option reads as an answer and not as a bare number. */
function labelledOpts(correct, wrongs, fmtEs, fmtEn, rng) {
  var seen = {}, es = [], en = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var k = Math.round(v * 10000) / 10000;
    if (seen[k]) return;
    seen[k] = 1; es.push(fmtEs(v)); en.push(fmtEn(v));
  }
  add(correct);
  for (var i = 0; i < wrongs.length && es.length < 4; i++) add(wrongs[i]);
  for (var j = 1; es.length < 4 && j < 900; j++) add(correct * (1 + j * 0.11 * (j % 2 ? 1 : -1)));
  return shuffleOpts(es, en, rng);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS
   ════════════════════════════════════════════════════════════════════════ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('pp' + idx);
    img.src = e.target.result;
    img.style.display = 'block';

}

function showResults() {

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  if (kind === 'green') return P.green;
  return P.dark;
}
/* A hundred cases of a business, drawn as a hundred squares. Probability
   stops being an abstraction the moment it is a countable block of clients,
   invoices or transactions on a screen.
     groups  [{ n: how many squares, kind: colour, label: legend text }]     */
function drawCaseGrid(g, groups, caption) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i, j;
  var cols = 10, rows = 10;
  var legendH = 34;
  var side = Math.min((W - 20) / cols, (H - legendH - 16) / rows);
  var gridW = side * cols;
  var x0 = (W - gridW) / 2, y0 = 8;
  var seq = [];
  groups.forEach(function(gr) {
    for (i = 0; i < Math.round(gr.n); i++) seq.push(gr);
  });
  while (seq.length < 100) seq.push({ kind: 'soft', faint: true });
  for (i = 0; i < rows; i++) {
    for (j = 0; j < cols; j++) {
      var cell = seq[i * cols + j];
      if (!cell) continue;
      ctx.save();
      ctx.globalAlpha = cell.faint ? 0.18 : 0.92;
      ctx.fillStyle = kindColor(P, cell.kind);
      var cx = x0 + j * side + 1, cy = y0 + i * side + 1;
      ctx.beginPath();
      ctx.rect(cx, cy, side - 2, side - 2);
      ctx.fill();
      ctx.restore();
    }
  }
  var ly = y0 + rows * side + 13;
  var lx = x0;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  groups.forEach(function(gr) {
    if (!gr.label) return;
    ctx.fillStyle = kindColor(P, gr.kind);
    ctx.fillRect(lx, ly - 7, 9, 9);
    ctx.fillStyle = P.text2;
    ctx.fillText(gr.label, lx + 12, ly + 1);
    lx += 12 + ctx.measureText(gr.label).width + 14;
    if (lx > W - 70) { lx = x0; ly += 13; }
  });
  if (caption) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    ctx.fillText(caption, x0, Math.min(H - 3, ly + 14));
  }
}
/* The same hundred cases stretched into a single bar, so two shares can be
   compared by length instead of by counting squares.
     segs  [{ share: 0..1, kind: colour, label: text }]                      */
function drawShareBar(g, segs, title) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  var padL = 10, padR = 10;
  var barW = W - padL - padR;
  var barY = title ? 34 : 18, barH = 40;
  if (title) {
    ctx.fillStyle = P.text2; ctx.font = '600 10.5px "IBM Plex Sans", sans-serif';
    ctx.fillText(title, padL, 18);
  }
  var x = padL;
  segs.forEach(function(s) {
    var w = Math.max(0, s.share) * barW;
    ctx.save();
    ctx.globalAlpha = s.faint ? 0.25 : 0.9;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(x, barY, w, barH);
    ctx.restore();
    if (w > 30) {
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 10px "IBM Plex Mono", monospace';
      var lab = pct1(s.share) + '%';
      ctx.fillText(lab, x + w / 2 - ctx.measureText(lab).width / 2, barY + barH / 2 + 4);
    }
    x += w;
  });
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.strokeRect(padL, barY, barW, barH);
  var ly = barY + barH + 16, lx = padL;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  segs.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(lx, ly - 7, 9, 9);
    ctx.fillStyle = P.text2;
    ctx.fillText(s.label, lx + 12, ly + 1);
    lx += 12 + ctx.measureText(s.label).width + 14;
    if (lx > W - 80) { lx = padL; ly += 14; }
  });
}
/* Money outcomes as columns above and below a zero line, with the average
   drawn across them. Seeing the average fall between two columns that never
   occur is the whole lesson of expected value.
     bars  [{ v: value, p: probability, kind: colour, label: text }]         */
function drawPayoffChart(g, bars, meanValue, meanLabel) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 56, padR = 12, padT = 22, padB = 34;
  var lo = 0, hi = 0;
  bars.forEach(function(b) { if (b.v < lo) lo = b.v; if (b.v > hi) hi = b.v; });
  if (meanValue < lo) lo = meanValue;
  if (meanValue > hi) hi = meanValue;
  if (hi - lo < 1) hi = lo + 1;
  var pad = (hi - lo) * 0.14;
  lo -= pad; hi += pad;
  function Y(v) { return H - padB - (v - lo) / (hi - lo) * (H - padT - padB); }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = lo + (hi - lo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = money(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  var slot = (W - padL - padR) / Math.max(1, bars.length);
  bars.forEach(function(b, k) {
    var bw = Math.min(slot * 0.52, 52);
    var cx = padL + slot * (k + 0.5);
    var y0 = Y(0), y1 = Y(b.v);
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = kindColor(P, b.kind);
    ctx.fillRect(cx - bw / 2, Math.min(y0, y1), bw, Math.abs(y1 - y0));
    ctx.restore();
    ctx.fillStyle = P.text2; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
    var l1 = b.label || '';
    ctx.fillText(l1, cx - ctx.measureText(l1).width / 2, H - padB + 13);
    var l2 = pct1(b.p) + '%';
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.fillText(l2, cx - ctx.measureText(l2).width / 2, H - padB + 24);
    ctx.fillStyle = kindColor(P, b.kind); ctx.font = '600 9px "IBM Plex Mono", monospace';
    var l3 = money(b.v);
    ctx.fillText(l3, cx - ctx.measureText(l3).width / 2, (b.v >= 0 ? y1 - 4 : y1 + 11));
  });
  ctx.save();
  ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = P.gold; ctx.lineWidth = 2; ctx.setLineDash([7, 4]);
  ctx.beginPath(); ctx.moveTo(padL, Y(meanValue)); ctx.lineTo(W - padR, Y(meanValue)); ctx.stroke();
  ctx.restore();
  if (meanLabel) {
    ctx.fillStyle = P.gold; ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
    var mw = ctx.measureText(meanLabel).width;
    ctx.fillText(meanLabel, W - padR - mw - 2, Math.max(11, Y(meanValue) - 5));
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 10); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · two risks in the same portfolio, and the overlap between them
   ════════════════════════════════════════════════════════════════════════ */
function widgetOverlapRisk(pa0, pb0, ov0) {
  var host = document.createElement('div');

  var state = { view: 'grid', pa: pa0, pb: pb0, ov: ov0 };
  function mount() {

      { id: 'bar',  es: 'La barra de riesgo', en: 'The risk bar' }

          : 'Each little square is one of the hundred credit clients of a distributor. Some pay late, some dispute the invoice, and a few do both. Move the three controls and watch one thing only: the panel works out the portfolio at risk by adding the two percentages and also by counting the actual clients, and the two figures almost never agree. Open the overlap to its largest value and then drop it to zero to see how far the direct sum inflates. Then look at the last box of the panel: it is the percentage of late payers inside the group that disputes. When that figure equals the percentage of late payers in the whole portfolio, knowing that a client disputes tells you nothing new about paying late, and only then are the two risks independent.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Clientes que pagan tarde' : 'Clients who pay late') + ': <span class="cval" id="w1al"></span></label>' +
          '<input type="range" min="5" max="60" step="1" id="w1a" value="' + state.pa + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Clientes que reclaman la factura' : 'Clients who dispute the invoice') + ': <span class="cval" id="w1bl"></span></label>' +
          '<input type="range" min="5" max="45" step="1" id="w1b" value="' + state.pb + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Clientes que hacen las dos cosas' : 'Clients who do both') + ': <span class="cval" id="w1ol"></span></label>' +
          '<input type="range" min="0" max="30" step="1" id="w1o" value="' + state.ov + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Traslape si los riesgos fueran independientes' : 'Overlap if the risks were independent') + ': <span class="cval" id="w1il"></span></label>' +
          '<input type="range" min="0" max="30" step="1" id="w1i" value="0" disabled>' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w1cv"></canvas>' +
        '<div class="dlist" id="w1steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Suma directa de los dos riesgos' : 'Direct sum of the two risks') + '</div><div class="mnum ps" id="w1sum"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Cartera en riesgo contando clientes' : 'Portfolio at risk counting clients') + '</div><div class="mnum cs" id="w1uni"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Clientes contados dos veces' : 'Clients counted twice') + '</div><div class="mnum ts" id="w1dbl"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Cartera sin ningún problema' : 'Portfolio with no problem at all') + '</div><div class="mnum cs" id="w1nei"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Solo pagan tarde' : 'Late payment only') + '</div><div class="mnum ts" id="w1onl"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Morosos dentro de los que reclaman' : 'Late payers inside those who dispute') + '</div><div class="mnum ps" id="w1cnd"></div></div>' +

    host.querySelectorAll('.mtab').forEach(function(b) {

  }
  function update() {
    var es = LANG === 'es';
    var A = state.pa, B = state.pb;
    var O = Math.min(state.ov, Math.min(A, B));
    var pa = A / 100, pb = B / 100, pboth = O / 100;
    var uni  = unionP(pa, pb, pboth);
    var nei  = neitherP(pa, pb, pboth);

        'one of those two appearances is removed and ' + intN(Math.round(uni * 100)) + ' clients are left with some problem  ·  ' +
        'the remaining ' + intN(Math.round(nei * 100)) + ' are the clean portfolio';
    var g = fitCanvas(host.querySelector('#w1cv'), 200);
    var groups = [

      drawCaseGrid(g, groups, es

      drawShareBar(g, [
        { share: onlyA, kind: 'gold',  label: (es ? 'Solo pagan tarde' : 'Late only') },
        { share: pboth, kind: 'bad',   label: (es ? 'Las dos cosas' : 'Both') },
        { share: onlyB, kind: 'green', label: (es ? 'Solo reclaman' : 'Dispute only') },
        { share: nei,   kind: 'soft',  label: (es ? 'Sin problema' : 'No problem'), faint: true }
      ], es ? 'La cartera completa, de extremo a extremo' : 'The whole portfolio, end to end');
    }
    var over = (pa + pb) - uni;
    var dep = Math.abs(cond - pa) < 0.005;
    host.querySelector('#w1read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> sumar los dos porcentajes da ' + pct1(pa + pb) + '%, pero contando clientes la cartera con algún problema es ' + pct1(uni) + '%. La diferencia de ' + pct1(over) + ' puntos son los ' + intN(O) + ' clientes que están en las dos listas y que la suma directa cobra dos veces. ' +
        'Ese error tiene consecuencias caras en un comité de crédito, porque una cartera en riesgo inflada justifica reservas más altas, líneas más chicas y clientes rechazados que sí pagaban. El orden correcto es siempre el mismo: sumar los dos grupos y devolver una vez el traslape. ' +
        (dep
          ? 'Fíjate además en el tablero: hoy el ' + pct1(cond) + '% de los que reclaman paga tarde, prácticamente lo mismo que el ' + pct1(pa) + '% de toda la cartera, así que enterarte de que un cliente reclamó no cambia lo que esperas de su pago. Ese es el significado exacto de que dos riesgos sean independientes.'
          : 'Fíjate además en el tablero: el ' + pct1(cond) + '% de los que reclaman paga tarde, contra ' + pct1(pa) + '% en toda la cartera, así que un reclamo sí es información sobre el pago. Cuando eso pasa los dos riesgos están ligados, y tratarlos como independientes multiplicando porcentajes da una cifra equivocada: el traslape independiente sería ' + pct1(indep) + '% y el real es ' + pct1(pboth) + '%.')
      : '<strong>Business reading:</strong> adding the two percentages gives ' + pct1(pa + pb) + '%, but counting clients the portfolio with some problem is ' + pct1(uni) + '%. The gap of ' + pct1(over) + ' points is the ' + intN(O) + ' clients who sit on both lists and whom the direct sum charges twice. ' +
        'That error is expensive in a credit committee, because an inflated portfolio at risk justifies higher provisions, smaller lines and rejected clients who were paying. The correct order is always the same: add the two groups and give the overlap back once. ' +
        (dep
          ? 'Look at the panel as well: today ' + pct1(cond) + '% of those who dispute pay late, practically the same as the ' + pct1(pa) + '% of the whole portfolio, so learning that a client disputed does not change what you expect of their payment. That is the exact meaning of two risks being independent.'
          : 'Look at the panel as well: ' + pct1(cond) + '% of those who dispute pay late, against ' + pct1(pa) + '% across the whole portfolio, so a dispute is information about payment. When that happens the two risks are linked, and treating them as independent by multiplying percentages gives the wrong figure: the independent overlap would be ' + pct1(indep) + '% and the real one is ' + pct1(pboth) + '%.');
  }
  widgets.push(mount);
  mount();
}

        'The figure almost everybody confuses is this one: how well the system detects a fraud we already know is fraud, and how likely it is that any given alert is fraud, are two different questions with very different answers. The second depends on something the system does not control, namely how rare fraud is in the population: ' + intN(state.base) + ' out of every ten thousand transactions. ' +
        'Out of that comes the operating decision. Raising detection saves frauds but barely clears the queue, because frauds are few. Lowering the false alarm rate is what actually unclogs the team, because it bites into the thousands of clean transactions. And there is a third route that sometimes wins: apply the system only to high risk transactions, where fraud is less rare and an alert is therefore already worth more.';

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · the average of a decision and the spread the average hides
   ════════════════════════════════════════════════════════════════════════ */
function widgetDecisionRisk(p0, hi0, lo0, safe0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { view: 'branches', p: p0, hi: hi0, lo: lo0, safe: safe0 };
  function mount() {
    var es = LANG === 'es';
    var MODES = [
      { id: 'branches', es: 'Los dos finales del proyecto', en: 'The two endings of the project' },
      { id: 'compare',  es: 'Contra la opción segura', en: 'Against the safe option' }
    ];
    var tabs = MODES.map(function(m) {
      return '<button class="mtab' + (m.id === state.view ? ' active' : '') + '" data-m="' + m.id + '">' + m[LANG] + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="gcrd" data-widget="valor-esperado-contra-riesgo">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'El promedio de una decisión y lo que el promedio esconde' : 'The average of a decision and what the average hides') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Una heladería de Colima puede abrir una sucursal en la playa, que va bien o va mal, o quedarse con la ampliación del local actual, que rinde una cifra conocida. Mueve los controles y observa la línea dorada del gráfico: es el valor esperado del proyecto arriesgado, y casi nunca cae encima de una barra, porque es un promedio de resultados que nunca ocurren juntos. Busca ahora la combinación incómoda: acomoda los controles hasta que el proyecto arriesgado tenga un valor esperado más alto que la ampliación segura y al mismo tiempo pierda dinero en su rama mala. Esa es exactamente la decisión que un dueño no toma con el promedio en la mano, sino preguntándose si el negocio sobrevive a la rama mala y cuántas veces va a poder repetir la apuesta.'
          : 'An ice cream shop in Colima can open a branch on the beach, which either does well or does badly, or stay with the expansion of the current store, which returns a known figure. Move the controls and watch the golden line on the chart: it is the expected value of the risky project, and it almost never lands on top of a bar, because it is an average of results that never happen together. Now hunt for the uncomfortable combination: set the controls until the risky project has a higher expected value than the safe expansion and at the same time loses money in its bad branch. That is exactly the decision an owner does not make with the average in hand, but by asking whether the business survives the bad branch and how many times the bet can be repeated.') + '</div>' +
        '<div class="mtabs">' + tabs + '</div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Probabilidad de que la sucursal funcione' : 'Probability that the branch works') + ': <span class="cval" id="w3pl"></span></label>' +
          '<input type="range" min="10" max="90" step="5" id="w3p" value="' + state.p + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Utilidad si funciona' : 'Profit if it works') + ': <span class="cval" id="w3hl"></span></label>' +
          '<input type="range" min="200000" max="2000000" step="50000" id="w3h" value="' + state.hi + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Pérdida si no funciona' : 'Loss if it does not work') + ': <span class="cval" id="w3ll"></span></label>' +
          '<input type="range" min="0" max="1200000" step="50000" id="w3l" value="' + state.lo + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Utilidad segura de la ampliación' : 'Certain profit of the expansion') + ': <span class="cval" id="w3sl"></span></label>' +
          '<input type="range" min="0" max="800000" step="25000" id="w3s" value="' + state.safe + '">' +
        '</div></div>' +
        '<canvas class="iw-canvas" id="w3cv"></canvas>' +
        '<div class="dlist" id="w3steps"></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Valor esperado del proyecto' : 'Expected value of the project') + '</div><div class="mnum cs" id="w3ev"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ventaja sobre la opción segura' : 'Advantage over the safe option') + '</div><div class="mnum ts" id="w3ga"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Desviación estándar del resultado' : 'Standard deviation of the result') + '</div><div class="mnum ps" id="w3sd"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Riesgo por peso esperado' : 'Risk per peso expected') + '</div><div class="mnum ps" id="w3rv"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Probabilidad de perder dinero' : 'Probability of losing money') + '</div><div class="mnum ts" id="w3lp"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Peor resultado posible' : 'Worst possible result') + '</div><div class="mnum ps" id="w3wc"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    host.querySelectorAll('.mtab').forEach(function(b) {
      b.addEventListener('click', function() {
        state.view = b.getAttribute('data-m');
        host.querySelectorAll('.mtab').forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        update();
      });
    });
    host.querySelector('#w3p').addEventListener('input', function() { state.p    = parseInt(this.value, 10); update(); });
    host.querySelector('#w3h').addEventListener('input', function() { state.hi   = parseInt(this.value, 10); update(); });
    host.querySelector('#w3l').addEventListener('input', function() { state.lo   = parseInt(this.value, 10); update(); });
    host.querySelector('#w3s').addEventListener('input', function() { state.safe = parseInt(this.value, 10); update(); });
    update();
  }
  function update() {
    var es = LANG === 'es';
    var p = state.p / 100;
    var outcomes = [
      { p: p,     v: state.hi },
      { p: 1 - p, v: -state.lo }
    ];
    var ev = expectedValue(outcomes);
    var sd = stdev(outcomes);
    var cv = coefVar(outcomes);
    var lp = lossProb(outcomes);
    var wc = worstCase(outcomes);
    host.querySelector('#w3pl').textContent = intN(state.p) + '%';
    host.querySelector('#w3hl').textContent = money(state.hi);
    host.querySelector('#w3ll').textContent = money(state.lo);
    host.querySelector('#w3sl').textContent = money(state.safe);
    host.querySelector('#w3ev').textContent = money(ev);
    host.querySelector('#w3ga').textContent = money(ev - state.safe);
    host.querySelector('#w3sd').textContent = money(sd);
    host.querySelector('#w3rv').textContent = dec2(cv);
    host.querySelector('#w3lp').textContent = pct1(lp) + '%';
    host.querySelector('#w3wc').textContent = money(wc);
    host.querySelector('#w3steps').textContent = es
      ? 'Cada final se pesa por su probabilidad y no por su tamaño  ·  ' +
        'la rama buena aporta ' + money(p * state.hi) + ' y la rama mala resta ' + money((1 - p) * state.lo) + '  ·  ' +
        'lo que queda es el valor esperado de ' + money(ev) + '  ·  ' +
        'la desviación estándar de ' + money(sd) + ' mide qué tan lejos del promedio queda un intento cualquiera'
      : 'Each ending is weighted by its probability and not by its size  ·  ' +
        'the good branch contributes ' + money(p * state.hi) + ' and the bad branch takes away ' + money((1 - p) * state.lo) + '  ·  ' +
        'what remains is the expected value of ' + money(ev) + '  ·  ' +
        'the standard deviation of ' + money(sd) + ' measures how far from the average a single attempt lands';
    var g = fitCanvas(host.querySelector('#w3cv'), 210);
    var bars = [
      { v: state.hi,  p: p,     kind: 'green', label: (es ? 'Funciona' : 'It works') },
      { v: -state.lo, p: 1 - p, kind: 'bad',   label: (es ? 'No funciona' : 'It does not') }
    ];
    if (state.view === 'compare') {
      bars.push({ v: state.safe, p: 1, kind: 'gold', label: (es ? 'Ampliación' : 'Expansion') });
    }
    drawPayoffChart(g, bars, ev, (es ? 'Valor esperado ' : 'Expected value ') + money(ev));
    var better = ev > state.safe;
    var risky  = wc < 0;
    host.querySelector('#w3read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> el proyecto tiene un valor esperado de ' + money(ev) + ' contra los ' + money(state.safe) + ' seguros de la ampliación, es decir ' + (better ? 'una ventaja de ' + money(ev - state.safe) : 'una desventaja de ' + money(state.safe - ev)) + '. Pero ningún dueño va a cobrar ' + money(ev) + ': va a cobrar ' + money(state.hi) + ' o va a perder ' + money(state.lo) + '. El valor esperado es lo que promediaría la decisión si se repitiera muchas veces en las mismas condiciones. ' +
        'Por eso al promedio hay que pegarle siempre una medida de dispersión. La desviación estándar de ' + money(sd) + ' dice qué tanto se aleja del promedio un intento suelto, y el riesgo por peso esperado de ' + dec2(cv) + ' permite comparar este proyecto contra otro de tamaño distinto, cosa que la desviación sola no permite. ' +
        (risky
          ? 'Aquí hay además una probabilidad de ' + pct1(lp) + '% de perder dinero, con un peor caso de ' + money(wc) + '. La pregunta correcta ya no es cuál opción tiene el promedio más alto, sino si la heladería puede pagar ese peor caso sin cerrar. Una empresa que no sobrevive a la rama mala no llega a la siguiente repetición, y el promedio nunca se materializa.'
          : 'Con estos valores ninguna rama pierde dinero, así que la decisión se puede tomar casi con el promedio en la mano. Sube la pérdida de la rama mala y vas a ver cómo cambia el problema: con un peor caso que la empresa no pueda pagar, un valor esperado más alto deja de ser suficiente para decidir.')
      : '<strong>Business reading:</strong> the project has an expected value of ' + money(ev) + ' against the ' + money(state.safe) + ' certain from the expansion, that is ' + (better ? 'an advantage of ' + money(ev - state.safe) : 'a disadvantage of ' + money(state.safe - ev)) + '. But no owner will ever collect ' + money(ev) + ': they will collect ' + money(state.hi) + ' or lose ' + money(state.lo) + '. Expected value is what the decision would average out to if it were repeated many times under the same conditions. ' +
        'That is why an average always has to travel with a measure of spread. The standard deviation of ' + money(sd) + ' says how far a single attempt lands from the average, and the risk per peso expected of ' + dec2(cv) + ' lets you compare this project against another of a different size, which the deviation alone cannot do. ' +
        (risky
          ? 'There is also a ' + pct1(lp) + '% probability of losing money here, with a worst case of ' + money(wc) + '. The right question is no longer which option has the higher average, but whether the ice cream shop can pay that worst case without closing. A company that does not survive the bad branch never reaches the next repetition, and the average never materializes.'
          : 'With these values no branch loses money, so the decision can be taken almost with the average in hand. Raise the loss of the bad branch and you will see the problem change: with a worst case the company cannot pay, a higher expected value stops being enough to decide.');
  }
  widgets.push(mount);
  mount();
}

function frac(a, b) {

/* A compact register of counts, the way an operations report actually
   arrives at a desk. */

  return items.map(function(it) { return it[0] + ' ' + it[1]; }).join('   ·   ');
}

  var c1U    = c1L + c1D - c1B;

  addSection(function(L) {
    var es = L === 'es';

      : caseList([[intN(c1n), 'accounts reviewed'], [intN(c1L), 'paid late'],
                  [intN(c1D), 'with a dispute'], [intN(c1B), 'both things']]);
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>El riesgo no es un presentimiento, es una proporción</h2>' +
      '<p>En una empresa la palabra riesgo se usa todo el tiempo y casi siempre sin número. Un gerente dice que el cliente nuevo es riesgoso, otro dice que el proyecto es seguro, y la junta termina eligiendo la opción que defendió la persona más convincente. La probabilidad existe justo para quitarle esa discusión al carisma. Una <strong>probabilidad</strong> es la proporción de casos en los que ocurre algo dentro de un grupo bien definido, y por eso siempre vale entre cero y uno: es una parte de un todo, nunca una intuición.</p>' +
      '<p>Esa definición obliga a algo que en la práctica se olvida: hay que decir de qué grupo se está hablando. La probabilidad de que un cliente pague tarde no significa nada hasta que se aclara si el grupo son todos los clientes de la empresa, los del giro industrial o los que ya venían con dos atrasos. Cambiar el grupo cambia la cifra, y muchas discusiones de negocio que parecen desacuerdos sobre el riesgo son en realidad dos personas midiendo sobre grupos distintos.</p>' +
      '<p>La primera herramienta de trabajo es el <strong>complemento</strong>. Si la cartera que paga tarde es una proporción conocida, la que paga a tiempo es lo que falta para completar el total. Suena obvio y sin embargo es el atajo más rentable de todo el tema, porque muchas preguntas de negocio son mucho más fáciles de contestar por el lado contrario, sobre todo cuando la pregunta empieza con las palabras al menos uno.</p>' +
      '<p>La segunda es la <strong>regla de la suma</strong>, y ahí está el error caro. Cuando dos problemas pueden ocurrirle al mismo cliente, sumar los dos porcentajes cuenta dos veces a quien tiene los dos, así que hay que devolver el traslape una vez. Solo cuando los dos eventos no pueden coincidir, es decir cuando son <strong>mutuamente excluyentes</strong>, la suma directa es correcta. Vale la pena separar desde ahora dos ideas que suenan parecidas y no lo son: que dos eventos no puedan ocurrir juntos es <strong>exclusión</strong>; que uno no diga nada sobre el otro es <strong>independencia</strong>. De hecho dos eventos excluyentes son lo más dependiente que existe, porque saber que ocurrió uno garantiza que el otro no ocurrió.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Probabilidad</div><div class="rform">P(A) = ' + frac('casos con A', 'casos del grupo') + '</div><div class="rnote">Una parte de un todo, entre 0 y 1.</div></div>' +
        '<div class="rcard"><div class="rname">Complemento</div><div class="rform">P(no A) = 1 − P(A)</div><div class="rnote">Lo que queda del grupo.</div></div>' +
        '<div class="rcard"><div class="rname">Unión</div><div class="rform">P(A o B) = P(A) + P(B) − P(A y B)</div><div class="rnote">El traslape se devuelve una vez.</div></div>' +

    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>Risk is not a hunch, it is a proportion</h2>' +
      '<p>In a company the word risk is used constantly and almost always without a number. One manager says the new client is risky, another says the project is safe, and the meeting ends up choosing whatever the most convincing person defended. Probability exists precisely to take that argument away from charisma. A <strong>probability</strong> is the proportion of cases in which something happens inside a well defined group, and that is why it always sits between zero and one: it is a part of a whole, never an intuition.</p>' +
      '<p>That definition forces something that gets forgotten in practice: you have to say which group you are talking about. The probability that a client pays late means nothing until it is clear whether the group is every client of the company, the industrial accounts, or the ones that already arrived with two delays behind them. Changing the group changes the figure, and many business arguments that look like disagreements about risk are really two people measuring over different groups.</p>' +
      '<p>The first working tool is the <strong>complement</strong>. If the share of the portfolio that pays late is known, the share that pays on time is whatever is left to complete the total. It sounds obvious and yet it is the most profitable shortcut in the whole topic, because many business questions are far easier to answer from the opposite side, above all when the question begins with the words at least one.</p>' +
      '<p>The second is the <strong>addition rule</strong>, and this is where the expensive mistake lives. When two problems can hit the same client, adding the two percentages counts twice whoever has both, so the overlap has to be given back once. Only when the two events cannot coincide, that is when they are <strong>mutually exclusive</strong>, is the direct sum correct. It is worth separating two ideas that sound alike and are not: that two events cannot happen together is <strong>exclusion</strong>; that one says nothing about the other is <strong>independence</strong>. In fact two exclusive events are the most dependent thing there is, because knowing that one happened guarantees that the other did not.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Probability</div><div class="rform">P(A) = ' + frac('cases with A', 'cases in the group') + '</div><div class="rnote">A part of a whole, between 0 and 1.</div></div>' +
        '<div class="rcard"><div class="rname">Complement</div><div class="rform">P(not A) = 1 − P(A)</div><div class="rnote">Whatever is left of the group.</div></div>' +
        '<div class="rcard"><div class="rname">Union</div><div class="rform">P(A or B) = P(A) + P(B) − P(A and B)</div><div class="rnote">The overlap is given back once.</div></div>' +
        '<div class="rcard"><div class="rname">Exclusive</div><div class="rform">P(A and B) = 0</div><div class="rnote">They cannot meet in the same case.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> An electrical supplies distributor audited its credit portfolio for the quarter:</p>' +

  var p1U  = p1L + p1D - p1B;

  var q1i = {

    q: { es: 'Una distribuidora de abarrotes en Colima revisó las ' + intN(p1n) + ' facturas a crédito que emitió el trimestre pasado. De ellas, ' + intN(p1L) + ' se pagaron después de la fecha límite, ' + intN(p1D) + ' llegaron con una aclaración del cliente y ' + intN(p1B) + ' cayeron en las dos situaciones al mismo tiempo. El comité de crédito quiere medir el tamaño de la cartera problemática antes de renovar las líneas. Si se toma una de esas facturas al azar, ¿qué probabilidad hay de que se haya pagado tarde, o haya tenido aclaración, o las dos cosas?',
        en: 'A grocery distributor in Colima reviewed the ' + intN(p1n) + ' credit invoices it issued last quarter. Of those, ' + intN(p1L) + ' were paid after the due date, ' + intN(p1D) + ' arrived with a customer dispute and ' + intN(p1B) + ' fell into both situations at the same time. The credit committee wants to size the problem portfolio before renewing the lines. If one of those invoices is taken at random, what is the probability that it was paid late, or was disputed, or both?' },
    opts: { es: o1.es, en: o1.en },
    hint: { es: 'Dibuja los dos grupos como dos círculos que se enciman y pregúntate en cuántas listas aparece un cliente que tuvo los dos problemas. La respuesta a esa pregunta te dice exactamente qué le sobra a la suma directa.',
            en: 'Draw the two groups as two circles that overlap and ask yourself on how many lists a client with both problems appears. The answer to that question tells you exactly what the direct sum has too much of.' },
    exp: { es: 'Las facturas con algún problema son ' + intN(p1U) + ' de ' + intN(p1n) + ', es decir ' + pct2(p1U / p1n) + '. Se llega a esa cifra sumando los dos grupos y devolviendo una vez las ' + intN(p1B) + ' facturas que estaban contadas en los dos. La opción de ' + pct2((p1L + p1D) / p1n) + ' es la suma directa, que cobra dos veces a esas facturas e infla la cartera en riesgo justo cuando esa cifra va a sostener el nivel de reservas. La de ' + pct2((p1L + p1D - 2 * p1B) / p1n) + ' quita el traslape dos veces y deja fuera a clientes que sí tuvieron problemas, un error simétrico que subestima el riesgo. Y la de ' + pct2(p1B / p1n) + ' responde otra pregunta distinta, la de cuántas facturas tuvieron los dos problemas a la vez, que es el traslape y no la cartera problemática completa.',
           en: 'The invoices with some problem are ' + intN(p1U) + ' out of ' + intN(p1n) + ', that is ' + pct2(p1U / p1n) + '. You get there by adding the two groups and giving back once the ' + intN(p1B) + ' invoices that were counted in both. The option of ' + pct2((p1L + p1D) / p1n) + ' is the direct sum, which charges those invoices twice and inflates the portfolio at risk exactly when that figure is about to support the level of provisions. The one of ' + pct2((p1L + p1D - 2 * p1B) / p1n) + ' removes the overlap twice and leaves out clients who did have problems, a symmetric error that understates the risk. And the one of ' + pct2(p1B / p1n) + ' answers a different question, namely how many invoices had both problems at once, which is the overlap and not the whole problem portfolio.' }
  };
  var d1 = mk(q1i, o1.correctIdx, true);
  problems.push({ i18n: d1.i18n, title: d1.title, questionText: d1.questionText, options: d1.options, correctIdx: d1.correctIdx, explanation: d1.explanation, hint: d1.hint, showWork: true, studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Item 2 ── */
  var o2 = shuffleOpts(
    ['Que sumar los dos porcentajes solo es válido cuando los dos problemas no pueden ocurrirle al mismo embarque, y aquí un embarque puede llegar tarde y dañado a la vez, así que esos embarques quedan contados dos veces.',

      '<h2>Cuando llega información nueva, cambia el grupo</h2>' +
      '<p>Casi ninguna decisión de negocio se toma a ciegas. Antes de aprobar un crédito hay un buró, antes de bloquear una tarjeta hay una alerta, antes de llamar a un cliente hay un historial. Toda esa información no cambia el mundo: cambia el <strong>grupo sobre el que se cuenta</strong>. Eso es exactamente una <strong>probabilidad condicional</strong>, la proporción de casos con cierta característica pero medida solo dentro del subgrupo que ya cumple lo que acabamos de averiguar.</p>' +
      '<p>De esa idea sale la <strong>regla de la multiplicación</strong>. La proporción de casos que cumplen dos condiciones a la vez es la proporción del primer grupo multiplicada por la proporción que dentro de ese grupo cumple la segunda condición. Cuando entrar al subgrupo no mueve la proporción, es decir cuando la condicional es igual a la probabilidad original, los dos eventos son <strong>independientes</strong> y solo entonces basta multiplicar las dos cifras sueltas. La independencia se verifica con datos, no se supone por comodidad, y suponerla mal es una de las formas más caras de equivocarse: si los créditos de una cartera se caen juntos cuando la economía local se enfría, multiplicar probabilidades individuales subestima muchísimo la pérdida del portafolio completo.</p>' +
      '<p>Y ahora el punto que más dinero cuesta en la práctica. Las dos condicionales que se pueden armar con los mismos dos eventos <strong>no son la misma cifra</strong>. La proporción de morosos que traían mala calificación no es la proporción de los que traen mala calificación que terminan morosos. La primera describe a los que ya fallaron; la segunda es la que sirve para decidir a quién aprobar. Confundirlas se llama invertir la condicional, y aparece disfrazada en frases de junta que suenan impecables.</p>' +
