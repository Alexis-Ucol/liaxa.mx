    }),
    exp: L({
      es:'Una superficie negra absorbe casi toda la radiación que recibe, mientras que una clara refleja buena parte; por eso los tubos se pintan de negro. El vidrio deja entrar la radiación y luego atrapa el aire caliente que se formó, cortando la convección hacia afuera. Entre los dos, más energía solar acaba dentro del agua.',
      en:'A black surface absorbs nearly all the radiation it receives, while a light one reflects much of it; that is why the tubes are painted black. The glass lets radiation in and then traps the hot air formed inside, cutting convection to the outside. Between the two, more solar energy ends up inside the water.'
    })
  };
}

function mkP10(rng){
  if (pk(rng, [0, 1]) === 0){
    var casos = [[400,340],[600,510],[750,600],[900,780],[500,425],[800,650]];
    var c = pk(rng, casos), Eg = c[0], Ek = c[1];
    return {
      showWork: true,
      title: L({ es:'La resbaladilla del parque', en:'The slide in the park' }),
      q: L({
        es:'Una niña se lanza por la resbaladilla del parque. Arriba tenía ' + Eg + ' J guardados por la altura y abajo cruza la salida con ' + Ek + ' J de movimiento. ¿Cuánta energía se fue como calor por el roce con la superficie y el aire?',
        en:'A girl goes down the slide in the park. At the top she had ' + Eg + ' J stored by the height and at the bottom she crosses the exit with ' + Ek + ' J of motion. How much energy left as heat through rubbing against the surface and the air?'
      }),
      options: [ (Eg - Ek) + ' J', (Eg + Ek) + ' J', Ek + ' J', Eg + ' J' ],
      correct: 0,
      hint: L({
        es:'Compara lo que la niña llevaba al principio con lo que le quedó al final. Lo que falta no desapareció, cambió de forma.',
        en:'Compare what the girl carried at the start with what she had left at the end. What is missing did not vanish, it changed form.'
      }),
      exp: L({
        es:'Al inicio había ' + Eg + ' J y al final quedan ' + Ek + ' J de movimiento: la diferencia es ' + Eg + ' menos ' + Ek + ' = ' + (Eg - Ek) + ' J. Esa parte calentó un poco la resbaladilla, la ropa y el aire. Sumar las dos cifras contaría dos veces la misma energía.',
        en:'At the start there were ' + Eg + ' J and at the end ' + Ek + ' J of motion remain: the difference is ' + Eg + ' minus ' + Ek + ' = ' + (Eg - Ek) + ' J. That part warmed the slide, the clothes and the air a little. Adding the two figures would count the same energy twice.'
      })
    };
  }
  return {
    showWork: false,
    title: L({ es:'La resbaladilla tibia', en:'The warm slide' }),
    q: L({
      es:'Después de una tarde de uso, la resbaladilla del parque se siente tibia al tocarla y ningún niño vuelve a subir tan alto como la altura de la que se lanzó. ¿Qué conclusión es correcta?',
      en:'After an afternoon of use, the park slide feels warm to the touch and no child ever rises again as high as the height they set off from. What conclusion is correct?'
    }),
    options: [
      L({ es:'Una parte de la energía se convirtió en calor en la resbaladilla, la ropa y el aire, así que el total sigue siendo el mismo aunque ya no esté en forma de movimiento', en:'Part of the energy turned into heat in the slide, the clothes and the air, so the total is still the same even though it is no longer in the form of motion' }),
      L({ es:'Una parte de la energía se destruyó al usarse, y por eso el juego devuelve cada vez menos de lo que recibe', en:'Part of the energy was destroyed by being used, and that is why the ride gives back less and less than it receives' }),
      L({ es:'El rozamiento guardó esa energía dentro de la resbaladilla y la devolverá cuando el juego esté frío otra vez', en:'Friction stored that energy inside the slide and will give it back when the ride is cold again' }),
      L({ es:'La resbaladilla tibia demuestra que apareció calor de la nada, porque nadie le entregó energía al metal', en:'The warm slide shows that heat appeared out of nothing, because nobody delivered energy to the metal' })
    ],
    correct: 0,
    hint: L({
      es:'Haz el balance completo: la resbaladilla, la ropa y el aire también terminaron distintos. Pregúntate si el total cambió o solo cambió de lugar y de forma.',
      en:'Do the full balance: the slide, the clothes and the air also ended up different. Ask whether the total changed or only changed place and form.'
    }),
    exp: L({
      es:'El roce va convirtiendo el movimiento en calor, que se reparte entre la superficie del juego, la ropa y el aire. Por eso nadie regresa a la altura inicial y por eso el metal está tibio. La energía no se destruyó ni quedó en reserva: cambió de forma, y el calor es precisamente una de sus formas.',
      en:'Rubbing keeps turning the movement into heat, which spreads among the surface of the ride, the clothes and the air. That is why nobody returns to the starting height and why the metal is warm. The energy was not destroyed and is not held in reserve: it changed form, and heat is precisely one of its forms.'
    })
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   ARMADO DE LA LECCION
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();
  GW_DRAWS = [];

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Lo que pasa de un cuerpo a otro sin que lo veas', en:'What passes from one body to another without being seen' }),
    '<p>' + L({
      es:'Dejas una cuchara dentro del caldo y a los dos minutos ya no la puedes tomar. Sacas un refresco de la hielera y el vaso se llena de gotitas por fuera. Frotas las manos en una mañana fría y en unos segundos están calientes, sin acercarte a ninguna flama.',
      en:'You leave a spoon inside the broth and two minutes later you cannot pick it up. You take a drink out of the cooler and the glass fills with droplets outside. You rub your hands on a cold morning and in a few seconds they are warm, without going near any flame.'
    }) + '</p>' +
    '<p>' + L({
      es:'En las tres escenas algo se movió de un lugar a otro, aunque no se vea. En esta guía vas a medir ese algo: vas a armar ollas en una estufa, a buscar la temperatura donde dos aguas se ponen de acuerdo, a repartir escenas según el camino que tomó el calor y a calentar un clavo a puros martillazos.',
      en:'In all three scenes something moved from one place to another, even though it cannot be seen. In this guide you will measure that something: you will set up pots on a stove, look for the temperature where two waters agree, sort scenes by the path the heat took and heat a nail with hammer blows alone.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'el calor es energía que pasa de un cuerpo caliente a uno más frío. No es una sustancia guardada dentro de las cosas, es energía en tránsito, y se mide en joules (J) igual que cualquier otra forma de energía. En toda la guía el agua necesita 4.2 kJ por cada kilogramo y por cada grado que sube.',
      en:'heat is energy passing from a hot body to a colder one. It is not a substance stored inside things, it is energy in transit, and it is measured in joules (J) like any other form of energy. Throughout the guide, water needs 4.2 kJ for each kilogram and each degree it rises.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Calor y temperatura no son lo mismo', en:'Heat and temperature are not the same' }),
    '<p>' + L({
      es:'La temperatura dice qué tan agitadas están las partículas de un cuerpo, una por una. El termómetro mide ese nivel de agitación y no le importa si mide una cucharada o una tina llena. El calor es otra cosa: es la energía que pasa de un cuerpo a otro cuando sus temperaturas son distintas.',
      en:'Temperature says how agitated the particles of a body are, one by one. The thermometer measures that level of agitation and does not care whether it measures a spoonful or a full tub. Heat is something else: it is the energy that passes from one body to another when their temperatures differ.'
    }) + '</p>' +
    '<p>' + L({
      es:'Por eso calentar algo cuesta más cuando hay más materia. Cada kilogramo de agua pide sus propios 4.2 kJ por cada grado que quieras subirle. Dos kilogramos piden el doble para la misma marca del termómetro, y subir 20 grados cuesta el doble que subir 10.',
      en:'That is why heating something costs more when there is more matter. Each kilogram of water asks for its own 4.2 kJ for every degree you want it to rise. Two kilograms ask for twice as much to reach the same thermometer reading, and rising 20 degrees costs twice as much as rising 10.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Temperatura', en:'Temperature' }), L({ es:'grado Celsius (°C)', en:'degree Celsius (°C)' }), L({ es:'qué tan agitadas están las partículas', en:'how agitated the particles are' })) +
      rcard(L({ es:'Calor', en:'Heat' }), L({ es:'joule (J), kilojoule (kJ)', en:'joule (J), kilojoule (kJ)' }), L({ es:'energía que pasa del cuerpo caliente al frío', en:'energy passing from the hot body to the cold one' })) +
      rcard(L({ es:'El agua', en:'Water' }), L({ es:'4.2 kJ por kg y por °C', en:'4.2 kJ per kg and per °C' }), L({ es:'lo que cobra por cada kilogramo y cada grado', en:'what it charges for each kilogram and each degree' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En la estufa que sigue tienes los dos deslizadores por separado. Antes de buscar la meta, mueve solo el agua y luego solo los grados, y compara cuánto salta la barra en cada caso.',
      en:'In the stove below you have the two sliders separately. Before hunting for the target, move only the water and then only the degrees, and compare how far the bar jumps in each case.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'gwA', 'heat'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El equilibrio térmico: hasta que los dos marcan lo mismo', en:'Thermal equilibrium: until both read the same' }),
    '<p>' + L({
      es:'Cuando dos cuerpos a distinta temperatura se tocan, el calor siempre sale del más caliente y entra en el más frío. Nunca al revés. El frío no viaja: lo que llamamos frío es simplemente la falta de esa energía.',
      en:'When two bodies at different temperatures touch, heat always leaves the hotter one and enters the colder one. Never the other way round. Cold does not travel: what we call cold is simply the lack of that energy.'
    }) + '</p>' +
    '<p>' + L({
      es:'El paso no se detiene por capricho: se detiene cuando los dos marcan la misma temperatura, porque ya no hay diferencia que empuje al calor. A ese momento se le llama equilibrio térmico. Y si nada escapa hacia afuera, cada joule que sale de uno entra en el otro, así que la porción con más materia se mueve menos grados que la pequeña.',
      en:'The flow does not stop on a whim: it stops when both read the same temperature, because there is no longer a difference pushing the heat. That moment is called thermal equilibrium. And if nothing escapes outwards, every joule leaving one enters the other, so the portion with more matter moves fewer degrees than the small one.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Sentido', en:'Direction' }), L({ es:'de caliente a frío', en:'hot to cold' }), L({ es:'siempre el mismo, nunca al revés', en:'always the same, never the other way' })) +
      rcard(L({ es:'Se detiene', en:'It stops' }), L({ es:'misma temperatura', en:'same temperature' }), L({ es:'sin diferencia no hay paso de calor', en:'with no difference there is no heat flow' })) +
      rcard(L({ es:'Se reparte', en:'It balances' }), L({ es:'lo que sale entra', en:'what leaves, enters' }), L({ es:'el que tiene más materia cambia menos grados', en:'the one with more matter changes fewer degrees' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En el termo que sigue verás dos barras enfrentadas. Mueve el termómetro y busca el punto donde el calor que entrega una porción es exactamente el que recibe la otra.',
      en:'In the flask below you will see two facing bars. Move the thermometer and look for the point where the heat one portion gives up is exactly the heat the other receives.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'gwB', 'balance'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Los tres caminos del calor', en:'The three paths of heat' }),
    '<p>' + L({
      es:'El calor sabe llegar de tres maneras. En la conducción hay contacto: las partículas de la parte caliente empujan a sus vecinas y el calor avanza dentro del material sin que el material viaje. Los metales lo hacen muy rápido; la madera, el plástico y el aire quieto apenas lo hacen, y por eso sirven de aislantes.',
      en:'Heat knows three ways to arrive. In conduction there is contact: the particles of the hot part push their neighbours and the heat advances inside the material without the material travelling. Metals do it very fast; wood, plastic and still air barely do it, which is why they work as insulators.'
    }) + '</p>' +
    '<p>' + L({
      es:'En la convección el propio fluido acarrea el calor: lo caliente se vuelve más ligero y sube, lo frío baja a ocupar su lugar y se arma una corriente que da vueltas. Es lo que ocurre en una olla y en el aire de un cuarto. En la radiación no hace falta nada en medio: la energía viaja como onda y cruza incluso el vacío, que es como el calor del Sol llega hasta aquí.',
      en:'In convection the fluid itself carries the heat: the hot part becomes lighter and rises, the cold part sinks to take its place and a circling current forms. That is what happens in a pot and in the air of a room. In radiation nothing is needed in between: the energy travels as a wave and crosses even vacuum, which is how the heat of the Sun reaches us.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Conducción', en:'Conduction' }), L({ es:'por contacto', en:'by contact' }), L({ es:'el material se queda quieto y el calor avanza en él', en:'the material stays put and the heat advances inside it' })) +
      rcard(L({ es:'Convección', en:'Convection' }), L({ es:'en corrientes', en:'in currents' }), L({ es:'el fluido caliente sube y el frío baja', en:'the hot fluid rises and the cold one sinks' })) +
      rcard(L({ es:'Radiación', en:'Radiation' }), L({ es:'como onda', en:'as a wave' }), L({ es:'no necesita aire ni contacto, cruza el vacío', en:'needs no air and no contact, it crosses vacuum' })) +
    '</div>'
  );
  w3(rng, widgetHost(s3, 'gwC', 'classify'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'El movimiento que termina en calor', en:'The movement that ends as heat' }),
    '<p>' + L({
      es:'El calor no siempre viene de una flama. Un clavo golpeado se calienta, las zapatas de una bicicleta que frena quedan ardiendo, un taladro saca humo de la madera. En todos esos casos había movimiento y ahora hay temperatura.',
      en:'Heat does not always come from a flame. A struck nail heats up, the pads of a braking bicycle end up burning, a drill makes wood smoke. In all those cases there was movement and now there is temperature.'
    }) + '</p>' +
    '<p>' + L({
      es:'Eso es lo que convierte al calor en una forma de energía y no en algo aparte: la energía del movimiento se transforma en calor, joule por joule, sin crearse ni destruirse. Por eso el calor suele ser el destino final de la energía en cualquier máquina real, y por eso al hacer el balance de un choque casi siempre falta algo en el objeto que miramos: se repartió como calor a su alrededor.',
      en:'That is what makes heat a form of energy and not something apart: the energy of motion is transformed into heat, joule by joule, without being created or destroyed. That is why heat is usually the final destination of energy in any real machine, and why when balancing an impact something is nearly always missing in the object we watch: it spread around as heat.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'En el taller que sigue no hay ninguna flama. Cuenta los golpes, vigila el termómetro del clavo y enfríalo cuantas veces necesites.',
      en:'In the workshop below there is no flame at all. Count the blows, watch the nail thermometer and cool it as often as you need.'
    }) + '</p></div>'
  );
  w4(rng, widgetHost(s4, 'gwD', 'friction'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'El calor en la casa y el Sol de la azotea', en:'Heat at home and the Sun on the roof' }),
    '<p>' + L({
      es:'Las decisiones de una casa son decisiones sobre el calor. El mango de la olla es de madera para que la conducción se frene ahí. El termo tiene vacío entre sus paredes para que ni la conducción ni la convección pasen. Un techo alto deja que el aire caliente suba y se aleje de las personas.',
      en:'The decisions of a house are decisions about heat. The pot handle is wood so that conduction is slowed there. The flask has vacuum between its walls so that neither conduction nor convection gets through. A high roof lets the hot air rise and move away from people.'
    }) + '</p>' +
    '<p>' + L({
      es:'Y sobre la azotea está la fuente más grande de todas. El Sol manda energía por radiación a cada casa del pueblo, todos los días, sin cobrar. Un calentador solar solo se encarga de atraparla: tubos oscuros que absorben esa radiación en lugar de reflejarla, y una tapa de vidrio que no deja escapar el aire caliente que se forma debajo.',
      en:'And on the roof there is the largest source of all. The Sun sends energy by radiation to every house in town, every day, free of charge. A solar heater only takes care of catching it: dark tubes that absorb that radiation instead of reflecting it, and a glass lid that does not let the hot air formed underneath escape.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  var s6 = sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Todo junto', en:'Everything together' }),
    '<p>' + L({
      es:'Queda un detalle que las cuentas limpias esconden: en el mundo real las superficies raspan y el aire estorba, así que al hacer el balance de cualquier juego, de cualquier máquina o de cualquier viaje casi siempre falta algo. Ese faltante nunca desaparece. Se va como calor, se reparte alrededor y por eso una resbaladilla muy usada se siente tibia al tocarla.',
      en:'One detail remains that clean calculations hide: in the real world surfaces scrape and the air gets in the way, so when balancing any ride, any machine or any journey something is nearly always missing. That missing part never disappears. It leaves as heat, spreads around, and that is why a well used slide feels warm to the touch.'
    }) + '</p>'
  );
  w5(rng, widgetHost(s6, 'gwE', 'reflect'));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'El Calor como Forma de Energía';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
