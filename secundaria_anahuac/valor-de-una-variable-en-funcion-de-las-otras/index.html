<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valor de una Variable en Función de las Otras</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS: INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.iwrap { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:12px; padding:1.1rem 1.1rem 1.2rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.4rem; }
.iw-goal { font-size:.92rem; color:var(--text); font-weight:600; margin-bottom:.5rem; }
.iw-sub { font-size:.79rem; color:var(--text3); margin-bottom:.75rem; }
.ivcanvas { display:block; width:100%; height:250px; background:var(--surface); }
.iw-read { font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--green-dark); background:var(--green-bg); border-radius:8px; padding:.5rem .7rem; text-align:center; margin-top:.7rem; }
.iw-pad { display:flex; flex-wrap:wrap; gap:.5rem; margin:.7rem 0 .2rem; }
.iw-btn { min-height:44px; padding:.5rem .9rem; border:1.5px solid var(--border); background:var(--surface2); color:var(--text2); border-radius:9px; font-size:.8rem; font-weight:600; cursor:pointer; font-family:inherit; }
.iw-btn:hover { border-color:var(--green); color:var(--green); }
.rverify-btn { margin-top:.85rem; min-height:44px; padding:.55rem 1.25rem; border:none; border-radius:9px; background:var(--green); color:#fff; font-size:.86rem; font-weight:600; cursor:pointer; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.rfb { min-height:1.35rem; margin-top:.6rem; font-size:.85rem; color:var(--text2); }

/* sliders del constructor de cuerpos */
.sl-row { display:flex; align-items:center; gap:.6rem; margin:.4rem 0; }
.sl-row input[type=range] { flex:1; min-width:0; accent-color:var(--green); min-height:34px; }
.sl-name { font-size:.74rem; color:var(--text3); width:58px; flex-shrink:0; }
.sl-val { font-family:'IBM Plex Mono',monospace; font-size:.78rem; font-weight:700; color:var(--green-dark); width:56px; text-align:right; flex-shrink:0; }

/* taller de despeje */
.eqbox { border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); color:var(--text); padding:.9rem .7rem; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:1.02rem; font-weight:600; overflow-x:auto; }
.op-chips { display:flex; flex-wrap:wrap; gap:.5rem; margin:.8rem 0 .2rem; }
.op-chip { border:1.5px solid var(--gold); background:var(--gold-bg); color:var(--text); border-radius:20px; padding:.45rem .9rem; font-size:.79rem; font-family:inherit; cursor:pointer; min-height:40px; }
.op-chip:hover { border-color:var(--green); }
.op-chip.used { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:700; }

/* empareja el despeje */
.mt-cols { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin:.7rem 0 .2rem; }
.mt-col { display:flex; flex-direction:column; gap:.5rem; min-width:0; }
.mt-head { font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text3); font-weight:700; }
.mt-chip { border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); color:var(--text); padding:.6rem .7rem; font-size:.8rem; font-family:inherit; text-align:left; cursor:pointer; min-height:44px; overflow-wrap:break-word; }
.mt-chip:hover { border-color:var(--green); }
.mt-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.mt-chip.done { border-color:var(--ok); background:var(--ok-bg); cursor:default; }
.mt-exp { text-align:center; font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:600; }
.mt-reveal { display:flex; flex-direction:column; gap:.5rem; margin-top:.5rem; }
.mt-pair { display:flex; align-items:center; gap:.7rem; border:1.5px solid var(--ok); background:var(--ok-bg); border-radius:10px; padding:.55rem .7rem; font-family:'IBM Plex Mono',monospace; font-weight:600; }
.mt-pair-txt { font-family:'IBM Plex Sans',sans-serif; font-weight:400; font-size:.78rem; color:var(--text2); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.7rem; font-size:1.05rem; }
.reflect-prompt { font-size:.92rem; color:var(--text2); margin:.4rem 0 .85rem; }
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ivcanvas { height: 230px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
  .ivcanvas { height: 210px; }
  .iwrap { padding: .85rem .8rem 1rem; }
  .mt-cols { grid-template-columns: 1fr; }
  .op-chip { font-size: .75rem; padding: .42rem .7rem; }
  .eqbox { font-size: .92rem; padding: .75rem .5rem; }
  .sl-name { width: 50px; font-size: .7rem; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from the rebrand step -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Eventos Complementarios y Mutuamente Excluyentes</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 2A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Eventos Complementarios y Mutuamente Excluyentes</div>

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  if (!tb) return;
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER: two-tap confirmation (Rule 6)
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm, used by restoreSession and setLang to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

async function generatePDF() {

  btn.textContent = 'Generando PDF...';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG === 'es' ? 'es-MX' : 'en-US', { dateStyle:'long', timeStyle:'short' });

  var att = currentAttempt(name, group);
  var raw = name + '|' + group + '|' + att + '|' + total;
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;

  }

  // ── Footer with verification code on every page ──

  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);

      PW/2, PH-5, {align:'center'});

/* ════════════════════════════════════════════════════════════════════════
   GUIDE CONTENT: geometry helpers, manipulatives and buildLesson
   ════════════════════════════════════════════════════════════════════════ */
var WIDGET_REDRAW = [];
window.redrawWidgets = function(){ WIDGET_REDRAW.forEach(function(f){ try { f(); } catch(e){} }); };

function cssVar(n){ var v=''; try { v = getComputedStyle(document.documentElement).getPropertyValue(n); } catch(e){} return (v||'').trim(); }

function addSection(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
  document.getElementById('lessonBody').appendChild(d);
}

function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length-1; i > 0; i--){ var j = Math.floor(rng()*(i+1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return { opts:a, idx:a.indexOf(correct) };
}

function fitCanvas(cv, hh){
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth || 320;
  cv.width = Math.round(w*dpr); cv.height = Math.round(hh*dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx:ctx, w:w, h:hh };
}

/* stacked fraction (Rule 13: never an inline slash) */
function fx(n, d){
  return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>';
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 1 - Constructor de cuerpos
   Three sliders build a rectangular prism that redraws while the student
   moves them. The round fixes one measurement and a target volume, so the
   student discovers that once two measurements are set, the third one is
   no longer free.
   ══════════════════════════════════════════════════════════════════════ */
function buildCaja(rng){
  var es = (LANG === 'es');
  var POOL = [ {a:4,V:96}, {a:5,V:120}, {a:3,V:72}, {a:6,V:144}, {a:4,V:80}, {a:5,V:150} ];
  var rounds = shuffle(POOL, rng).slice(0,3);
  var st = { L:3, W:2, H:2, r:0, tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','caja');
  wrap.id = 'wCaja';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Constructor de cuerpos':'Solid builder')+'</div>'+
    '<div class="iw-goal" id="cajaGoal"></div>'+
    '<div class="iw-sub">'+(es
      ? 'Mueve las tres barras y observa cómo cambia la caja al momento. El área de la base y el volumen se recalculan solos mientras arrastras.'
      : 'Move the three sliders and watch the box change as you go. The base area and the volume recalculate on their own while you drag.')+'</div>'+
    '<div class="cvwrap"><canvas class="ivcanvas" id="cajaCv"></canvas></div>'+
    '<div class="sl-row"><span class="sl-name">'+(es?'largo':'length')+'</span>'+
      '<input type="range" min="1" max="10" step="1" value="3" id="cajaSL" oninput="cajaSet(\'L\',this.value)">'+
      '<span class="sl-val" id="cajaVL">3 cm</span></div>'+
    '<div class="sl-row"><span class="sl-name">'+(es?'ancho':'width')+'</span>'+
      '<input type="range" min="1" max="10" step="1" value="2" id="cajaSW" oninput="cajaSet(\'W\',this.value)">'+
      '<span class="sl-val" id="cajaVW">2 cm</span></div>'+
    '<div class="sl-row"><span class="sl-name">'+(es?'altura':'height')+'</span>'+
      '<input type="range" min="1" max="10" step="1" value="2" id="cajaSH" oninput="cajaSet(\'H\',this.value)">'+
      '<span class="sl-val" id="cajaVH">2 cm</span></div>'+
    '<div class="iw-read" id="cajaRead"></div>'+
    '<button class="rverify-btn" onclick="cajaCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="cajaFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function cur(){ return rounds[Math.min(st.r, rounds.length-1)]; }

  function solveRound(c){
    var q = c.V / c.a, best = null;
    for (var b = 1; b <= 10; b++){
      if (q % b === 0){
        var h = q / b;
        if (h >= 1 && h <= 10){
          var gap = Math.abs(b - h);
          if (!best || gap < best.gap) best = { b:b, h:h, gap:gap };
        }
      }
    }
    return best || { b:1, h:q };
  }

  function draw(){
    var cv = document.getElementById('cajaCv'); if (!cv) return;
    var f = fitCanvas(cv, cv.clientHeight || 250), ctx = f.ctx, w = f.w, h = f.h;
    ctx.clearRect(0,0,w,h);
    var u = Math.min(24, (w - 96) / (st.L + 0.55*st.W), (h - 60) / (st.H + 0.45*st.W));
    if (!(u > 3)) u = 3;
    var bw = st.L*u, bh = st.H*u, dx = 0.55*st.W*u, dy = -0.45*st.W*u;
    var x0 = Math.max(30, (w - (bw + dx))/2);
    var y0 = (h + bh - dy)/2 - 8;
    var yt = y0 - bh;
    var green = cssVar('--green'), gdark = cssVar('--green-dark'), text3 = cssVar('--text3');
    /* top face */
    ctx.beginPath();
    ctx.moveTo(x0, yt); ctx.lineTo(x0+dx, yt+dy); ctx.lineTo(x0+bw+dx, yt+dy); ctx.lineTo(x0+bw, yt); ctx.closePath();
    ctx.fillStyle = cssVar('--gold-bg'); ctx.fill();
    ctx.strokeStyle = cssVar('--gold'); ctx.lineWidth = 1.8; ctx.stroke();
    /* right face */
    ctx.beginPath();
    ctx.moveTo(x0+bw, yt); ctx.lineTo(x0+bw+dx, yt+dy); ctx.lineTo(x0+bw+dx, y0+dy); ctx.lineTo(x0+bw, y0); ctx.closePath();
    ctx.fillStyle = cssVar('--surface2'); ctx.fill();
    ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = 1.6; ctx.stroke();
    /* front face */
    ctx.beginPath(); ctx.rect(x0, yt, bw, bh);
    ctx.fillStyle = cssVar('--green-bg'); ctx.fill();
    ctx.strokeStyle = green; ctx.lineWidth = 2.2; ctx.stroke();
    /* labels */
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.fillStyle = gdark; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(st.L + ' cm', x0 + bw/2, y0 + 7);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(st.H + ' cm', x0 - 6, yt + bh/2);
    ctx.fillStyle = text3; ctx.textAlign = 'left';
    ctx.fillText(st.W + ' cm', x0 + bw + dx/2 + 6, yt + dy/2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = text3; ctx.font = '11px "IBM Plex Sans", sans-serif';
    ctx.fillText((es?'la cara verde es la base':'the green face is the base'), 6, 6);
  }
  WIDGET_REDRAW.push(draw);

  function goal(){
    var el = document.getElementById('cajaGoal'); if (!el) return;
    if (st.done){ el.innerHTML = (es?'Las tres cajas quedaron armadas.':'All three boxes are built.'); return; }
    var c = cur();
    el.innerHTML = (es?'Caja ':'Box ')+(st.r+1)+(es?' de 3: consigue un volumen de exactamente <b>':' of 3: reach a volume of exactly <b>')+c.V+' cm³</b>'+
      (es?', con el largo fijo en <b>':', with the length parked on <b>')+c.a+' cm</b>.';
  }
  function readout(){
    var el = document.getElementById('cajaRead'); if (!el) return;
    var base = st.L*st.W, vol = base*st.H, tot = 2*(st.L*st.W + st.L*st.H + st.W*st.H);
    el.innerHTML = (es?'base: ':'base: ')+base+' cm²&nbsp;&nbsp;·&nbsp;&nbsp;'+(es?'volumen: ':'volume: ')+vol+
      ' cm³&nbsp;&nbsp;·&nbsp;&nbsp;'+(es?'área total: ':'total area: ')+tot+' cm²';
  }
  function sync(){
    var sl = document.getElementById('cajaSL'), sw = document.getElementById('cajaSW'), sh = document.getElementById('cajaSH');
    if (sl) sl.value = String(st.L);
    if (sw) sw.value = String(st.W);
    if (sh) sh.value = String(st.H);
    var vl = document.getElementById('cajaVL'), vw = document.getElementById('cajaVW'), vh = document.getElementById('cajaVH');
    if (vl) vl.textContent = st.L + ' cm';
    if (vw) vw.textContent = st.W + ' cm';
    if (vh) vh.textContent = st.H + ' cm';
    goal(); readout(); draw();
  }

  window.cajaSet = function(which, v){
    if (st.lock || st.done) return;
    st[which] = parseInt(v, 10) || 1;
    sync();
    var fb = document.getElementById('cajaFb'); if (fb) fb.innerHTML = '';
  };

  window.cajaCheck = function(){
    if (st.lock || st.done) return;
    var c = cur(), fb = document.getElementById('cajaFb'), vol = st.L*st.W*st.H;
    if (st.L === c.a && vol === c.V){
      st.r++; st.tries = 0;
      if (st.r >= rounds.length){
        st.done = true; goal();
        fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">🎉 '+(es
          ? 'Tres cajas exactas. En las tres, el largo y el ancho decidieron por completo cuánto podía medir la altura.'
          : 'Three exact boxes. In all three, the length and the width completely decided how tall the box could be.')+'</span>';
        return;
      }
      st.lock = true;
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es
        ? 'Volumen exacto. Va la siguiente caja.'
        : 'Exact volume. Next box coming.')+'</span>';
      setTimeout(function(){ st.lock = false; st.L = 3; st.W = 2; st.H = 2; var f2 = document.getElementById('cajaFb'); if (f2) f2.innerHTML = ''; sync(); }, 1200);
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var s = solveRound(c);
      st.lock = true; st.L = c.a; st.W = s.b; st.H = s.h; sync();
      fb.innerHTML = (es
        ? 'Así queda: con el largo en '+c.a+' cm y el ancho en '+s.b+' cm, la altura ya no puede elegirse, porque solo '+s.h+' cm completan los '+c.V+' cm³.'
        : 'Here it is: with the length on '+c.a+' cm and the width on '+s.b+' cm, the height can no longer be chosen, because only '+s.h+' cm complete the '+c.V+' cm³.');
      setTimeout(function(){
        st.lock = false; st.tries = 0; st.r++; st.L = 3; st.W = 2; st.H = 2;
        if (st.r >= rounds.length) st.done = true;
        var f3 = document.getElementById('cajaFb'); if (f3) f3.innerHTML = '';
        sync();
      }, 3000);
      return;
    }
    if (st.L !== c.a){
      fb.innerHTML = (es
        ? 'El largo va en '+st.L+' cm y esta caja lo pide en '+c.a+' cm: ese dato no se negocia, acomódalo primero.'
        : 'The length sits at '+st.L+' cm and this box asks for '+c.a+' cm: that measurement is fixed, set it first.');
      return;
    }
    fb.innerHTML = (vol < c.V)
      ? (es ? 'Vas en '+vol+' cm³ y todavía te faltan '+(c.V-vol)+' cm³: sube el ancho o la altura.'
            : 'You are at '+vol+' cm³ and still '+(c.V-vol)+' cm³ short: raise the width or the height.')
      : (es ? 'Vas en '+vol+' cm³ y te pasaste por '+(vol-c.V)+' cm³: baja el ancho o la altura.'
            : 'You are at '+vol+' cm³ and overshot by '+(vol-c.V)+' cm³: lower the width or the height.');
  };

  sync();
  setTimeout(draw, 60);
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 2 - Taller de despeje
   The student taps operations and the equation rewrites itself on screen.
   Every order that is mathematically valid is accepted; an operation that
   does not free the target answers with the reason it fails.
   ══════════════════════════════════════════════════════════════════════ */
function buildDespeje(rng){
  var es = (LANG === 'es');
  var OPS = {
    div_a:  { es:'dividir entre a',        en:'divide by a' },
    div_b:  { es:'dividir entre b',        en:'divide by b' },
    div_2:  { es:'dividir entre 2',        en:'divide by 2' },
    mul_2:  { es:'multiplicar por 2',      en:'multiply by 2' },
    sub_b:  { es:'restar b',               en:'subtract b' },
    add_b:  { es:'sumar b',                en:'add b' },
    div_pi: { es:'dividir entre π',        en:'divide by π' },
    div_r:  { es:'dividir entre r',        en:'divide by r' },
    div_r2: { es:'dividir entre r²',       en:'divide by r²' },
    div_6:  { es:'dividir entre 6',        en:'divide by 6' },
    mul_6:  { es:'multiplicar por 6',      en:'multiply by 6' },
    raiz:   { es:'sacar raíz cuadrada',    en:'take the square root' }
  };
  var POOL = [
    { id:'prisma',
      goal:{ es:'Deja sola la altura <b>c</b> de un prisma rectangular.', en:'Get the height <b>c</b> of a rectangular prism on its own.' },
      map:{ '': 'V = a · b · c',
            'div_a': fx('V','a')+' = b · c',
            'div_b': fx('V','b')+' = a · c',
            'div_a|div_b': fx('V','a · b')+' = c' },
      solved:'div_a|div_b',
      chips:['div_a','div_b','mul_2','add_b'],
      wrong:{ mul_2:{ es:'Aquí no hay ningún 2 estorbando: multiplicar por 2 solo agranda los dos lados y deja a la c igual de acompañada.',
                      en:'There is no 2 in the way here: multiplying by 2 only enlarges both sides and leaves c just as crowded.' },
              add_b:{ es:'La b está multiplicando, no sumando, así que sumarle b a los dos lados no la despega de la c.',
                      en:'The b is multiplying, not adding, so adding b to both sides does not pull it away from c.' } },
      why:{ es:'La altura queda sola cuando se deshacen las dos multiplicaciones que la acompañan, sin importar en qué orden lo hagas.',
            en:'The height stands alone once the two multiplications beside it are undone, no matter which order you use.' } },
    { id:'triangulo',
      goal:{ es:'Deja sola la altura <b>h</b> de un triángulo.', en:'Get the height <b>h</b> of a triangle on its own.' },
      map:{ '': 'A = '+fx('b · h','2'),
            'mul_2': '2 · A = b · h',
            'div_b': fx('A','b')+' = '+fx('h','2'),
            'div_b|mul_2': fx('2 · A','b')+' = h' },
      solved:'div_b|mul_2',
      chips:['mul_2','div_b','div_2','sub_b'],
      wrong:{ div_2:{ es:'Ese lado ya venía partido a la mitad: dividir otra vez entre 2 lo parte de nuevo en lugar de repararlo.',
                      en:'That side was already cut in half: dividing by 2 again cuts it once more instead of repairing it.' },
              sub_b:{ es:'La b multiplica a la altura, y lo que multiplica no se quita restando.',
                      en:'The b multiplies the height, and what multiplies is not removed by subtracting.' } },
      why:{ es:'Primero se repara la mitad y después se retira la base, o al revés: las dos rutas llegan al mismo despeje.',
            en:'First the half is repaired and then the base is removed, or the other way round: both routes reach the same result.' } },
    { id:'cilindro',
      goal:{ es:'Deja sola la altura <b>h</b> de un cilindro.', en:'Get the height <b>h</b> of a cylinder on its own.' },
      map:{ '': 'V = π · r² · h',
            'div_pi': fx('V','π')+' = r² · h',
            'div_r2': fx('V','r²')+' = π · h',
            'div_pi|div_r2': fx('V','π · r²')+' = h' },
      solved:'div_pi|div_r2',
      chips:['div_pi','div_r2','div_r','mul_2'],
      wrong:{ div_r:{ es:'El radio viene elevado al cuadrado, así que quitar una sola r deja todavía otra r pegada a la altura.',
                      en:'The radius comes squared, so removing a single r still leaves another r stuck to the height.' },
              mul_2:{ es:'Ese 2 del exponente no es un factor que puedas cancelar multiplicando: pertenece al radio.',
                      en:'That 2 in the exponent is not a factor you can cancel by multiplying: it belongs to the radius.' } },
      why:{ es:'El área de la base carga a π y al radio al cuadrado, y hasta que los dos se retiran la altura queda libre.',
            en:'The base area carries π and the squared radius, and only once both are removed is the height free.' } },
    { id:'perimetro',
      goal:{ es:'Deja sola la altura <b>h</b> de un rectángulo del que conoces el perímetro.', en:'Get the height <b>h</b> of a rectangle whose perimeter you know on its own.' },
      map:{ '': 'P = 2 · (b + h)',
            'div_2': fx('P','2')+' = b + h',
            'div_2|sub_b': fx('P','2')+' − b = h' },
      solved:'div_2|sub_b',
      chips:['div_2','sub_b','mul_2','div_b'],
      wrong:{ sub_b:{ es:'Mientras el paréntesis siga multiplicado por 2, restar b se lleva una sola b de las dos que hay adentro.',
                      en:'While the bracket is still multiplied by 2, subtracting b only removes one of the two b that live inside.' },
              div_b:{ es:'Dentro del paréntesis la b está sumando, y lo que suma no se retira dividiendo.',
                      en:'Inside the bracket the b is adding, and what adds is not removed by dividing.' },
              mul_2:{ es:'Multiplicar por 2 aleja todavía más a la altura de quedarse sola.',
                      en:'Multiplying by 2 pushes the height even further from standing alone.' } },
      why:{ es:'Primero se deshace la multiplicación que envuelve a todo el paréntesis y solo después se descuenta la base.',
            en:'First the multiplication wrapping the whole bracket is undone and only then is the base taken off.' } },
    { id:'cubo',
      goal:{ es:'Deja sola la arista <b>a</b> de un cubo del que conoces el área total.', en:'Get the edge <b>a</b> of a cube whose total area you know on its own.' },
      map:{ '': 'A = 6 · a²',
            'div_6': fx('A','6')+' = a²',
            'div_6|raiz': '√'+fx('A','6')+' = a' },
      solved:'div_6|raiz',
      chips:['div_6','raiz','mul_6','div_2'],
      wrong:{ raiz:{ es:'La raíz de 6 por a² no reparte bien mientras el 6 siga ahí: quita primero el factor.',
                     en:'The root of 6 times a² does not split cleanly while the 6 is still there: remove the factor first.' },
              mul_6:{ es:'Ese 6 ya multiplica del otro lado, y volver a multiplicar por 6 lo aleja todavía más.',
                      en:'That 6 already multiplies on the other side, and multiplying by 6 again pushes it further away.' },
              div_2:{ es:'Las caras del cubo son seis, no dos, así que el 2 no corresponde a nada de esta figura.',
                      en:'The cube has six faces, not two, so the 2 matches nothing in this figure.' } },
      why:{ es:'Primero se reparte el área entre las seis caras y después se deshace el cuadrado con una raíz.',
            en:'First the area is shared among the six faces and then the square is undone with a root.' } }
  ];
  var rounds = shuffle(POOL, rng).slice(0,3);
  var st = { r:0, applied:[], tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','despeje');
  wrap.id = 'wDesp';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Taller de despeje':'Rearranging workshop')+'</div>'+
    '<div class="iw-goal" id="despGoal"></div>'+
    '<div class="iw-sub">'+(es
      ? 'Cada operación que toques se aplica a los dos lados a la vez y la igualdad se reescribe al instante. Si un paso no te convence, puedes deshacerlo.'
      : 'Every operation you tap is applied to both sides at once and the equality rewrites itself instantly. If a step does not convince you, you can undo it.')+'</div>'+
    '<div class="eqbox" id="despEq"></div>'+
    '<div class="op-chips" id="despChips"></div>'+
    '<div class="iw-pad"><button class="iw-btn" onclick="despUndo()">'+(es?'↩ Deshacer':'↩ Undo')+'</button></div>'+
    '<div class="rfb" id="despFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function cur(){ return rounds[Math.min(st.r, rounds.length-1)]; }
  function keyOf(list){ return list.slice().sort().join('|'); }

  function render(){
    var g = document.getElementById('despGoal'), eq = document.getElementById('despEq'), ch = document.getElementById('despChips');
    if (!g || !eq || !ch) return;
    if (st.done){
      g.innerHTML = (es?'Los tres despejes quedaron listos.':'All three rearrangements are done.');
      eq.innerHTML = (es?'Cada fórmula guarda tantos despejes como letras tiene.':'Every formula holds as many rearrangements as it has letters.');
      ch.innerHTML = '';
      return;
    }
    var c = cur();
    g.innerHTML = (es?'Despeje ':'Rearrangement ')+(st.r+1)+(es?' de 3: ':' of 3: ')+c.goal[LANG];
    eq.innerHTML = c.map[keyOf(st.applied)] || c.map[''];
    ch.innerHTML = c.shownChips.map(function(op){
      var used = st.applied.indexOf(op) >= 0;
      return '<button class="op-chip'+(used?' used':'')+'" onclick="despTap(\''+op+'\')">'+OPS[op][LANG]+'</button>';
    }).join('');
  }

  function startRound(){
    var c = cur();
    if (!c.shownChips) c.shownChips = shuffle(c.chips, rng);
    st.applied = []; st.tries = 0;
    render();
  }

  window.despUndo = function(){
    if (st.lock || st.done) return;
    if (!st.applied.length){
      document.getElementById('despFb').innerHTML = (es?'Todavía no hay pasos que deshacer.':'There are no steps to undo yet.');
      return;
    }
    st.applied.pop(); render();
    document.getElementById('despFb').innerHTML = (es?'Paso retirado. La igualdad regresó a como estaba.':'Step removed. The equality is back the way it was.');
  };

  window.despTap = function(op){
    if (st.lock || st.done) return;
    var c = cur(), fb = document.getElementById('despFb');
    if (st.applied.indexOf(op) >= 0){
      fb.innerHTML = (es?'Esa operación ya está aplicada en los dos lados.':'That operation is already applied on both sides.');
      return;
    }
    var next = st.applied.concat([op]);
    var k = keyOf(next);
    if (c.map[k]){
      st.applied = next; render();
      if (k === c.solved){
        st.lock = true;
        fb.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es?'Despejada. ':'Solved. ')+c.why[LANG]+'</span>';
        setTimeout(function(){
          st.lock = false; st.r++;
          if (st.r >= rounds.length){ st.done = true; render();
            var f4 = document.getElementById('despFb');
            if (f4) f4.innerHTML = '<span style="color:var(--ok);font-weight:700;">🎉 '+(es
              ? 'Tres fórmulas distintas y la misma idea: se deshace lo que acompaña a la letra que quieres sola.'
              : 'Three different formulas and the same idea: you undo whatever keeps company with the letter you want alone.')+'</span>';
            return; }
          document.getElementById('despFb').innerHTML = '';
          startRound();
        }, 2200);
        return;
      }
      fb.innerHTML = (es?'Buen paso. La letra que buscas ya quedó con menos compañía.':'Good step. The letter you want now has less company.');
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.lock = true;
      st.applied = c.solved.split('|'); render();
      fb.innerHTML = (es?'Así se despeja: ':'This is how it comes out: ')+c.why[LANG];
      setTimeout(function(){
        st.lock = false; st.r++;
        if (st.r >= rounds.length){ st.done = true; render(); return; }
        document.getElementById('despFb').innerHTML = '';
        startRound();
      }, 3200);
      return;
    }
    var msg = c.wrong[op];
    fb.innerHTML = msg ? msg[LANG] : (es
      ? 'Esa operación no acerca a la letra a quedarse sola: fíjate en qué la está acompañando ahora mismo.'
      : 'That operation does not bring the letter closer to standing alone: look at what is keeping it company right now.');
  };

  startRound();
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 3 - Empareja el despeje
   A situation on the left, an expression on the right. The student pairs
   them by tapping; a wrong pair answers with the reason it does not fit.
   ══════════════════════════════════════════════════════════════════════ */
function buildMatch(rng){
  var es = (LANG === 'es');
  var POOL = [
    { L:{ es:'Conoces el área A de un rectángulo y su base b, y buscas la altura.',
          en:'You know the area A of a rectangle and its base b, and you want the height.' },
      R: fx('A','b'),
      n:{ es:'En un rectángulo el área es base por altura, así que para regresar a la altura basta con deshacer una multiplicación.',
          en:'In a rectangle the area is base times height, so getting back to the height only means undoing one multiplication.' } },
    { L:{ es:'Conoces el área A de un triángulo y su base b, y buscas la altura.',
          en:'You know the area A of a triangle and its base b, and you want the height.' },
      R: fx('2 · A','b'),
      n:{ es:'El área del triángulo se quedó a la mitad, y al despejar esa mitad tiene que reaparecer arriba.',
          en:'The area of the triangle was halved, and when you rearrange, that half has to reappear on top.' } },
    { L:{ es:'Conoces el volumen V de un prisma y el área B de su base, y buscas la altura.',
          en:'You know the volume V of a prism and the area B of its base, and you want the height.' },
      R: fx('V','B'),
      n:{ es:'El volumen del prisma es el área de la base multiplicada por la altura, y aquí la base ya viene medida de una sola vez.',
          en:'The volume of a prism is the base area times the height, and here the base already arrives measured in one go.' } },
    { L:{ es:'Conoces el perímetro P de un rectángulo y su base b, y buscas la altura.',
          en:'You know the perimeter P of a rectangle and its base b, and you want the height.' },
      R: fx('P','2')+' − b',
      n:{ es:'El perímetro recorre dos bases y dos alturas: primero se toma la mitad de todo y después se descuenta la base.',
          en:'The perimeter walks two bases and two heights: first you take half of everything and then you discount the base.' } },
    { L:{ es:'Conoces el volumen V de un cilindro y su altura h, y buscas el área de su base.',
          en:'You know the volume V of a cylinder and its height h, and you want the area of its base.' },
      R: fx('V','h'),
      n:{ es:'El volumen del cilindro es el área de la base por la altura, sin ningún factor extra que quitar.',
          en:'The volume of a cylinder is the base area times the height, with no extra factor to remove.' } },
    { L:{ es:'Conoces el área total A de un cubo y buscas el área de una de sus caras.',
          en:'You know the total area A of a cube and you want the area of one of its faces.' },
      R: fx('A','6'),
      n:{ es:'El cubo tiene seis caras iguales y todas cargan la misma porción del área total.',
          en:'A cube has six equal faces and all of them carry the same portion of the total area.' } }
  ];
  var items = shuffle(POOL, rng).slice(0,4);
  var st = { lOrder: shuffle(items.map(function(_,i){ return i; }), rng),
             rOrder: shuffle(items.map(function(_,i){ return i; }), rng),
             sel:null, solved:[], tries:0, done:false, revealed:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','match');
  wrap.id = 'wMatch';
  document.getElementById('lessonBody').appendChild(wrap);

  function render(){
    var head = '<div class="iw-tag">'+(es?'Empareja el despeje':'Match the rearrangement')+'</div>'+
      '<div class="iw-goal">'+(es?'Une cada situación con la expresión que entrega la medida que falta.':'Join each situation with the expression that delivers the missing measurement.')+'</div>'+
      '<div class="iw-sub">'+(es
        ? 'Toca primero una situación y después una expresión. Puedes cambiar de opinión antes de decidir: mientras no coincidan, nada se queda fijo.'
        : 'Tap a situation first and then an expression. You can change your mind before deciding: while they do not match, nothing gets locked.')+'</div>';
    if (st.done){
      wrap.innerHTML = head + (st.revealed
        ? '<div class="mt-reveal">'+items.map(function(it){
            return '<div class="mt-pair">'+it.R+'<span class="mt-pair-txt">'+it.L[LANG]+'</span></div>';
          }).join('')+'<div class="rfb">'+(es
            ? 'Así quedan unidas. En todas, la expresión es lo que sobra cuando se retira lo que acompañaba a la medida buscada.'
            : 'This is how they pair up. In all of them, the expression is what remains once whatever accompanied the wanted measurement is removed.')+'</div></div>'
        : '<div class="cls-done">🎉 '+(es
            ? 'Todas emparejadas. Cada expresión salió de despejar la letra que la pregunta pedía.'
            : 'All matched. Every expression came from isolating the letter the question asked for.')+'</div>');
      return;
    }
    var left = st.lOrder.map(function(i){
      var done = st.solved.indexOf(i) >= 0;
      var cls = 'mt-chip'+(done?' done':'')+(st.sel === i ? ' sel' : '');
      return '<button class="'+cls+'" onclick="mtL('+i+')">'+items[i].L[LANG]+'</button>';
    }).join('');
    var right = st.rOrder.map(function(i){
      var done = st.solved.indexOf(i) >= 0;
      return '<button class="mt-chip mt-exp'+(done?' done':'')+'" onclick="mtR('+i+')">'+items[i].R+'</button>';
    }).join('');
    wrap.innerHTML = head +
      '<div class="mt-cols">'+
        '<div class="mt-col"><div class="mt-head">'+(es?'Lo que sabes':'What you know')+'</div>'+left+'</div>'+
        '<div class="mt-col"><div class="mt-head">'+(es?'La medida que falta':'The missing measurement')+'</div>'+right+'</div>'+
      '</div>'+
      '<div class="rfb" id="mtFb"></div>';
  }

  window.mtL = function(i){
    if (st.done || st.solved.indexOf(i) >= 0) return;
    st.sel = (st.sel === i) ? null : i;
    render();
  };
  window.mtR = function(i){
    if (st.done || st.solved.indexOf(i) >= 0) return;
    if (st.sel === null){
      render();
      document.getElementById('mtFb').innerHTML = (es?'Elige primero una situación de la izquierda.':'Choose a situation on the left first.');
      return;
    }
    var chosen = st.sel;
    if (chosen === i){
      st.solved.push(i); st.sel = null;
      if (st.solved.length >= items.length){ st.done = true; render(); return; }
      render();
      document.getElementById('mtFb').innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ '+(es?'Van juntas. ':'They belong together. ')+'</span>'+items[i].n[LANG];
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      items.forEach(function(_, k){ if (st.solved.indexOf(k) < 0) st.solved.push(k); });
      st.done = true; st.revealed = true; render();
      return;
    }
    st.sel = null; render();
    document.getElementById('mtFb').innerHTML = (es?'Todavía no. ':'Not yet. ')+items[chosen].n[LANG];
  };

  render();
}

/* ══════════════════════════════════════════════════════════════════════
   MANIPULATIVE 4 - Cuaderno de la figura
   Open notebook: the student writes or sketches. No verdict, no score.
   ══════════════════════════════════════════════════════════════════════ */
function buildReflect(rng){
  var es = (LANG === 'es');
  var PROMPTS = [
    { es:'Dibuja una caja con forma de prisma y escribe junto a cada arista la letra que usarías para su medida. Después explica con tus palabras cómo obtendrías la altura si te dieran el volumen y el área de la base.',
      en:'Draw a box shaped like a prism and write next to each edge the letter you would use for its measurement. Then explain in your own words how you would obtain the height if you were given the volume and the base area.' },
    { es:'Inventa un envase que deba contener siempre la misma cantidad de líquido y describe qué le pasa a su altura si decides hacerlo más ancho. Apoya tu explicación con un dibujo.',
      en:'Invent a container that must always hold the same amount of liquid and describe what happens to its height if you decide to make it wider. Back your explanation up with a drawing.' },
    { es:'Elige una fórmula de área o de volumen que hayas usado hoy y escribe las tres preguntas distintas que se pueden responder con ella según cuál sea la letra desconocida.',
      en:'Choose an area or volume formula you used today and write the three different questions it can answer depending on which letter is the unknown one.' },
    { es:'Explica a alguien que no estuvo en clase por qué una fórmula con cuatro letras no obliga a conocer las cuatro medidas. Usa un ejemplo dibujado.',
      en:'Explain to someone who was not in class why a formula with four letters does not force you to know all four measurements. Use a drawn example.' }
  ];
  var p = PROMPTS[Math.floor(rng()*PROMPTS.length)];

  var wrap = document.createElement('div');
  wrap.className = 'iwrap section';
  wrap.setAttribute('data-widget','reflect');
  wrap.id = 'wRefl';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Cuaderno de la figura':'Figure notebook')+'</div>'+
    '<div class="iw-sub">'+(es
      ? 'Aquí no hay una sola respuesta buena: importa cómo la sostienes. Puedes corregir cuanto quieras antes de guardar.'
      : 'There is no single good answer here: what matters is how you back it up. You can correct as much as you like before saving.')+'</div>'+
    '<div class="reflect-prompt">'+p[LANG]+'</div>'+
    '<div class="wtabs">'+
      '<button class="wtab active" id="reflTabT" onclick="reflTab(\'type\',this)">'+t('tab-type')+'</button>'+
      '<button class="wtab" id="reflTabD" onclick="reflTab(\'draw\',this)">'+t('tab-draw')+'</button>'+
    '</div>'+
    '<div class="wpanel active" id="refl_type"><textarea class="wtextarea" id="reflTa" placeholder="'+(es?'Tu respuesta':'Your answer')+'"></textarea></div>'+
    '<div class="wpanel" id="refl_draw">'+
      '<div class="cvwrap">'+
        '<canvas class="dcanvas" id="reflCv"></canvas>'+
        '<div class="ctoolbar">'+
          '<button class="tbtn2 bpen on">'+t('btn-pen')+'</button>'+
          '<button class="tbtn2 bmarker">'+t('btn-marker')+'</button>'+
          '<button class="tbtn2 beraser">'+t('btn-eraser')+'</button>'+
          '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>'+
          '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>'+
          '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>'+
          '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>'+
