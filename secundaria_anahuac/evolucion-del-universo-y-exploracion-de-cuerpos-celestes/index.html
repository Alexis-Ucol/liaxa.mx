        en: 'That the Moon takes the same time to spin on itself as to go once around the Earth.' }),
    L({ es: 'Que la Luna no gira sobre sí misma mientras recorre su órbita.',
        en: 'That the Moon does not spin on itself while it covers its orbit.' }),
    L({ es: 'Que la cara que no vemos nunca recibe luz del Sol y por eso permanece invisible.',
        en: 'That the face we do not see never gets light from the Sun and for that reason stays invisible.' }),
    L({ es: 'Que la atracción de la Tierra mantiene a la Luna completamente quieta en su lugar.',
        en: 'That the pull of the Earth keeps the Moon completely still in its place.' })
  ];
  return {
    title: L({ es: 'Siempre la misma cara', en: 'Always the same face' }),
    showWork: false,
    q: L({ es: 'Desde la Tierra se observa siempre la misma cara de la Luna, noche tras noche y mes tras mes. ¿Qué lo explica?',
           en: 'From the Earth the same face of the Moon is always seen, night after night and month after month. What explains it?' }),
    options: o2, correct: o2[0],
    hint: L({ es: 'Si un cuerpo diera la vuelta a otro sin girar sobre sí mismo, a lo largo del recorrido le mostraría todos sus lados.',
              en: 'If a body went around another without spinning on itself, along the journey it would show it all of its sides.' }),
    exp: L({ es: 'La Luna sí gira sobre sí misma, pero emplea en ese giro el mismo tiempo que en recorrer su órbita, de modo que siempre nos presenta la misma cara. La cara oculta recibe luz del Sol igual que la visible.',
             en: 'The Moon does spin on itself, but it spends on that spin the same time as on its orbit, so it always shows us the same face. The hidden face gets light from the Sun just as the visible one does.' })
  };
}

/* ── PROBLEMA 10 · órbitas artificiales alrededor de la Tierra ── */
function mkP10(rng){
  var v = rng() < 0.5 ? 0 : 1;
  if (v === 0) {
    var per = pick([90, 96, 120, 144], rng), lap = 1440 / per;
    var o = [
      L({ es: lap + ' vueltas', en: lap + ' laps' }),
      L({ es: Math.round(lap / 2) + ' vueltas', en: Math.round(lap / 2) + ' laps' }),
      L({ es: (lap * 2) + ' vueltas', en: (lap * 2) + ' laps' }),
      L({ es: per + ' vueltas', en: per + ' laps' })
    ];
    return {
      title: L({ es: 'Vueltas en un día', en: 'Laps in one day' }),
      showWork: true,
      q: L({ es: 'Un satélite artificial en órbita baja completa una vuelta a la Tierra cada ' + per + ' minutos. ¿Cuántas vueltas completas da en un día?',
             en: 'An artificial satellite in low orbit completes one lap around the Earth every ' + per + ' minutes. How many complete laps does it make in one day?' }),
      options: o, correct: o[0],
      hint: L({ es: 'Conviene expresar el día y la vuelta en la misma unidad de tiempo y ver cuántas veces cabe una dentro del otro.',
                en: 'It helps to express the day and the lap in the same unit of time and see how many times one fits inside the other.' }),
      exp: L({ es: 'Un día tiene 1 440 minutos, y 1 440 ÷ ' + per + ' = ' + lap + ', así que el satélite da ' + lap + ' vueltas. Ese ritmo tan rápido es posible porque cerca de la Tierra la atracción es intensa y la órbita es corta.',
               en: 'One day has 1 440 minutes, and 1 440 ÷ ' + per + ' = ' + lap + ', so the satellite makes ' + lap + ' laps. Such a fast rhythm is possible because near the Earth the pull is strong and the orbit is short.' })
    };
  }
  var lp = pick([6, 8, 12], rng), hrs = 24 / lp;
  var o2 = [
    L({ es: hrs + ' horas', en: hrs + ' hours' }),
    L({ es: lp + ' horas', en: lp + ' hours' }),
    L({ es: (hrs * 2) + ' horas', en: (hrs * 2) + ' hours' }),
    L({ es: (hrs / 2) + ' horas', en: (hrs / 2) + ' hours' })
  ];
  return {
    title: L({ es: 'Duración de una vuelta', en: 'Length of one lap' }),
    showWork: true,
    q: L({ es: 'Un satélite artificial da ' + lp + ' vueltas completas a la Tierra a lo largo de un día. ¿Cuánto dura cada vuelta?',
           en: 'An artificial satellite makes ' + lp + ' complete laps around the Earth along one day. How long does each lap last?' }),
    options: o2, correct: o2[0],
    hint: L({ es: 'Todas las vueltas duran lo mismo, así que el tiempo de una sale de repartir la duración del día entre el número de vueltas.',
              en: 'All the laps last the same, so the time of one comes from sharing the length of the day into the number of laps.' }),
    exp: L({ es: '24 ÷ ' + lp + ' = ' + hrs + ', de modo que cada vuelta dura ' + hrs + ' horas. Cuanto más alta es la órbita, más tiempo tarda el satélite en completarla.',
             en: '24 ÷ ' + lp + ' = ' + hrs + ', so each lap lasts ' + hrs + ' hours. The higher the orbit, the longer the satellite takes to complete it.' })
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   buildLesson — concepto, manipulativo, problema, intercalados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){

  sec(
    L({ es: 'Punto de partida', en: 'Starting point' }),
    L({ es: 'Todo lo que sabemos del cielo llegó viajando', en: 'Everything we know of the sky arrived travelling' }),
    '<p>' + L({
      es: 'Nadie ha ido a tocar una galaxia. Ni siquiera hemos salido del vecindario del Sol. Y sin embargo sabemos de qué está hecha una estrella a miles de años luz, a qué rapidez se aparta una galaxia y cuánto pesa un planeta que nunca hemos pisado. Todo eso llegó aquí de una sola manera: viajando en forma de ondas que los telescopios recogen y traducen.',
      en: 'Nobody has gone to touch a galaxy. We have not even left the neighbourhood of the Sun. And yet we know what a star thousands of light years away is made of, how fast a galaxy drifts apart and how heavy a planet we have never set foot on is. All of that arrived here in one single way: travelling as waves that telescopes collect and translate.'
    }) + '</p>' +
    '<p>' + L({
      es: 'En esta guía vas a mover una galaxia por una cinta y ver cómo se corre su luz, a repartir el contenido del Universo entre tres partes hasta dar con el reparto que muestran las mediciones, a sintonizar un telescopio en la banda correcta para cada misión, a lanzar una sonda hasta dejarla en órbita y a colocar la Luna en el punto exacto de su recorrido para conseguir una fase.',
      en: 'In this guide you will move a galaxy along a ribbon and watch how its light shifts, share out the content of the Universe between three parts until you hit the share out that measurements show, tune a telescope to the right band for each mission, launch a probe until it settles into orbit, and place the Moon at the exact point of its journey to get a phase.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es: 'Idea clave: ', en: 'Key idea: ' }) + '</strong>' + L({
      es: 'el Universo tiene una historia y sigue cambiando, y todo lo que averiguamos de él nos llega por dos vías: las ondas que emiten los cuerpos celestes y la gravitación que gobierna sus movimientos.',
      en: 'the Universe has a history and keeps changing, and everything we find out about it reaches us along two paths: the waves the celestial bodies give off and the gravitation that governs their motions.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  sec(
    L({ es: 'Concepto 1', en: 'Concept 1' }),
    L({ es: 'Un Universo que se expande', en: 'A Universe that expands' }),
    '<p>' + L({
      es: 'Cada elemento químico deja en la luz un conjunto de líneas siempre iguales, como una firma. Al comparar la firma del hidrógeno de una galaxia lejana con la misma firma medida en un laboratorio, las líneas no coinciden: aparecen recorridas hacia el lado rojo del espectro. Eso significa que las ondas llegaron estiradas, y las ondas se estiran cuando la fuente y el observador se separan.',
      en: 'Every chemical element leaves in the light a set of always identical lines, like a signature. On comparing the hydrogen signature of a distant galaxy with the same signature measured in a laboratory, the lines do not match: they appear moved towards the red side of the spectrum. That means the waves arrived stretched, and waves stretch when source and observer part.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Lo notable es el patrón: casi todas las galaxias lejanas se apartan, y las que están más lejos se apartan más rápido. No es que huyan de nosotros ni que estemos en el centro. Lo que se estira es el espacio que hay entre ellas, como los puntos pintados sobre una liga que alguien jala por los extremos. Si el espacio hoy es mayor, ayer fue menor, y esa idea llevada hacia atrás lleva a un origen común hace unos 13 800 millones de años. El resplandor frío que quedó de aquella época todavía se detecta hoy como microondas en todas direcciones.',
      en: 'The remarkable thing is the pattern: almost every distant galaxy parts, and the ones farther away part faster. It is not that they flee from us or that we sit at the centre. What stretches is the space between them, like dots painted on a rubber band someone pulls from the ends. If space is bigger today, yesterday it was smaller, and that idea carried backwards leads to a common origin some 13 800 million years ago. The cold glow left over from that time is still detected today as microwaves in every direction.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'En la cinta que sigue puedes mover una galaxia a la distancia que quieras. Abajo verás, al mismo tiempo, la misma línea del hidrógeno medida aquí y medida en esa galaxia: fíjate en cuánto se recorre según lo lejos que la coloques.',
      en: 'On the ribbon below you can move a galaxy to any distance you like. Underneath you will see, at the same time, the same hydrogen line measured here and measured in that galaxy: watch how much it moves depending on how far you place it.'
    }) + '</p></div>'
  );
  wExpansion(rng);
  addProb(mkP1(rng), rng);
  addProb(mkP2(rng), rng);

  /* ══ CONCEPTO 2 ══ */
  sec(
    L({ es: 'Concepto 2', en: 'Concept 2' }),
    L({ es: 'De qué está hecho todo lo que hay', en: 'What everything there is is made of' }),
    '<p>' + L({
      es: 'Las estrellas, los planetas, el gas entre las estrellas y nosotros mismos estamos hechos de materia ordinaria, la que emite o refleja luz y por eso se puede ver. Durante siglos se supuso que eso era todo. Dos observaciones cambiaron el panorama.',
      en: 'Stars, planets, the gas between the stars and ourselves are made of ordinary matter, the kind that gives off or reflects light and therefore can be seen. For centuries it was assumed that this was all there is. Two observations changed the picture.'
    }) + '</p>' +
    '<p>' + L({
      es: 'La primera: en las orillas de muchas galaxias las estrellas giran demasiado rápido para la materia que se ve brillar; hace falta más masa atrayendo, una masa que no emite luz, y se le llamó materia oscura. La segunda: la separación entre galaxias lejanas no solo aumenta, sino que aumenta cada vez más rápido, y como toda materia atrae y frena, se propuso un contenido distinto que separa, la energía oscura. Al sumar las mediciones, la materia que vemos resulta ser una parte diminuta del total.',
      en: 'The first: at the edges of many galaxies the stars turn too fast for the matter seen shining; more mass pulling is needed, a mass that gives off no light, and it was named dark matter. The second: the separation between distant galaxies not only grows, it grows faster and faster, and since all matter pulls and slows, a different content that separates was proposed, dark energy. On adding the measurements up, the matter we see turns out to be a tiny part of the total.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es: 'Materia ordinaria', en: 'Ordinary matter' }), L({ es: 'unas pocas partes', en: 'a few parts' }), L({ es: 'estrellas, planetas, gas y polvo: la parte que emite o refleja luz', en: 'stars, planets, gas and dust: the part that gives off or reflects light' })) +
      rcard(L({ es: 'Materia oscura', en: 'Dark matter' }), L({ es: 'cerca de una cuarta parte', en: 'about a quarter' }), L({ es: 'no emite luz, pero atrae y por eso se nota en el giro de las galaxias', en: 'gives off no light, but pulls and so shows in the turning of galaxies' })) +
      rcard(L({ es: 'Energía oscura', en: 'Dark energy' }), L({ es: 'más de dos tercios', en: 'more than two thirds' }), L({ es: 'no atrae: separa, y por eso la expansión va cada vez más rápido', en: 'does not pull: it separates, and so the expansion goes faster and faster' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es: 'Reparte tú las 100 unidades del contenido del Universo entre esas tres partes. Las tarjetas de arriba te dicen aproximadamente qué le toca a cada una; el tablero te dirá qué tan cerca quedaste.',
      en: 'Share out yourself the 100 units of the content of the Universe between those three parts. The cards above tell you roughly what belongs to each one; the board will tell you how close you got.'
    }) + '</p></div>'
  );
  wComposicion(rng);
  addProb(mkP3(rng), rng);
  addProb(mkP4(rng), rng);

  /* ══ CONCEPTO 3 ══ */
  sec(
    L({ es: 'Concepto 3', en: 'Concept 3' }),
    L({ es: 'Las ondas que traen la información', en: 'The waves that carry the information' }),
    '<p>' + L({
      es: 'La luz visible es solo una franja estrecha de una familia mucho mayor: las ondas electromagnéticas. Todas viajan a la misma rapidez, 300 000 km cada segundo, y se distinguen por su longitud de onda. De las más largas a las más cortas: ondas de radio, microondas, infrarrojo, luz visible, ultravioleta, rayos X y rayos gamma. Cuanto más corta es la onda, más energía transporta.',
      en: 'Visible light is only a narrow strip of a much larger family: electromagnetic waves. They all travel at the same speed, 300 000 km each second, and they differ in their wavelength. From the longest to the shortest: radio waves, microwaves, infrared, visible light, ultraviolet, X rays and gamma rays. The shorter the wave, the more energy it carries.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Cada banda cuenta una parte distinta de la misma historia, porque cada temperatura y cada proceso emiten sobre todo en una zona del espectro. El polvo tibio de una nube brilla en infrarrojo aunque tape la luz visible; el gas ultracaliente que cae hacia un agujero negro brilla en rayos X. Y como esa rapidez es finita, mirar lejos es mirar al pasado: la imagen que recibimos de un objeto salió de él hace tanto tiempo como tarda su luz en llegar.',
      en: 'Each band tells a different part of the same story, because every temperature and every process gives off mostly in one zone of the spectrum. The warm dust of a cloud glows in the infrared even while it blocks visible light; the ultrahot gas falling towards a black hole glows in X rays. And since that speed is finite, looking far is looking into the past: the image we receive of an object left it as long ago as its light takes to arrive.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'El sintonizador de abajo recorre el espectro completo. Se te encargará una misión de observación y tendrás que dejar el telescopio en la banda con la que ese objeto se deja ver.',
      en: 'The tuner below runs along the whole spectrum. You will be given an observing mission and you will have to leave the telescope on the band in which that object lets itself be seen.'
    }) + '</p></div>'
  );
  wEspectro(rng);
  addProb(mkP5(rng), rng);
  addProb(mkP6(rng), rng);

  /* ══ CONCEPTO 4 ══ */
  sec(
    L({ es: 'Concepto 4', en: 'Concept 4' }),
    L({ es: 'La gravitación gobierna el Sistema Solar', en: 'Gravitation governs the Solar System' }),
    '<p>' + L({
      es: 'Dos cuerpos cualesquiera se atraen. Esa atracción crece con la masa de cada uno y se debilita muy rápido con la distancia: al doble de distancia queda en la cuarta parte, al triple en la novena. Por eso el Sol, con la enorme masa que concentra, manda sobre todo el vecindario aunque los planetas estén lejísimos.',
      en: 'Any two bodies pull on each other. That pull grows with the mass of each one and weakens very fast with distance: at twice the distance it drops to a quarter, at three times to a ninth. That is why the Sun, with the enormous mass it concentrates, rules over the whole neighbourhood even though the planets are extremely far.'
    }) + '</p>' +
    '<p>' + L({
      es: 'Un planeta no está quieto sosteniéndose: está cayendo hacia el Sol todo el tiempo, pero avanza de lado con la rapidez justa para que su caída lo lleve siempre a un punto nuevo. Si fuera más lento, la trayectoria se cerraría contra el Sol; si fuera mucho más rápido, escaparía. Además, como la atracción se debilita con la distancia, los planetas lejanos se mueven más despacio y recorren caminos más largos: su año dura muchísimo más.',
      en: 'A planet is not standing still holding itself up: it is falling towards the Sun all the time, but it advances sideways with just the right speed for its fall to always carry it to a new point. If it were slower, the path would close in against the Sun; if it were much faster, it would escape. Besides, as the pull weakens with distance, far planets move more slowly and cover longer paths: their year lasts far longer.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'En el lanzador de abajo eliges la rapidez con la que sueltas una sonda a una altura dada. La trayectoria completa se dibuja al instante: busca la rapidez que la deja girando en un círculo estable.',
      en: 'On the launcher below you choose the speed with which you release a probe at a given height. The whole path is drawn at once: look for the speed that leaves it turning in a steady circle.'
    }) + '</p></div>'
  );
  wOrbita(rng);
  addProb(mkP7(rng), rng);
  addProb(mkP8(rng), rng);

  /* ══ CONCEPTO 5 ══ */
  sec(
    L({ es: 'Concepto 5', en: 'Concept 5' }),
    L({ es: 'La Tierra y su Luna', en: 'The Earth and its Moon' }),
    '<p>' + L({
      es: 'La misma atracción que ata los planetas al Sol ata la Luna a la Tierra. La Luna tarda unos 27 días en recorrer su órbita y exactamente lo mismo en girar sobre sí misma, así que siempre nos muestra la misma cara. La cara oculta no está a oscuras: recibe luz del Sol igual que la visible, solo que nunca queda frente a nosotros.',
      en: 'The same pull that ties the planets to the Sun ties the Moon to the Earth. The Moon takes about 27 days to cover its orbit and exactly the same to spin on itself, so it always shows us the same face. The hidden face is not in darkness: it gets light from the Sun just as the visible one does, it simply never ends up facing us.'
    }) + '</p>' +
    '<p>' + L({
      es: 'El Sol ilumina siempre la mitad de la Luna. Lo que cambia noche tras noche es qué parte de esa mitad iluminada queda a la vista desde aquí, y eso depende únicamente de dónde está la Luna en su recorrido alrededor de la Tierra. De ahí salen las fases, que se repiten en un ciclo de unos 29 días y medio. Esa misma atracción, actuando sobre el agua de los océanos, produce las mareas.',
      en: 'The Sun always lights half of the Moon. What changes night after night is which part of that lit half stays in view from here, and that depends only on where the Moon is along its journey around the Earth. That is where the phases come from, repeating in a cycle of about 29 and a half days. That same pull, acting on the water of the oceans, produces the tides.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es: 'Mueve la Luna por su órbita en el tablero de abajo. A la izquierda verás la escena desde fuera, con la luz del Sol llegando siempre por el mismo lado; a la derecha, el disco tal como se ve desde la Tierra en ese momento.',
      en: 'Move the Moon along its orbit on the board below. On the left you will see the scene from outside, with the light of the Sun always arriving from the same side; on the right, the disc as it looks from the Earth at that moment.'
    }) + '</p></div>'
  );
  wFases(rng);
  addProb(mkP9(rng), rng);

  /* ══ CIERRE ══ */
  sec(
    L({ es: 'Cierre', en: 'Closing' }),
    L({ es: 'Todo junto', en: 'Everything together' }),
    '<p>' + L({
      es: 'Lo que sigue mezcla la gravitación, las órbitas y las señales que viajan, en una situación que ocurre justo encima de nuestras cabezas.',
      en: 'What comes next mixes gravitation, orbits and travelling signals, in a situation happening right above our heads.'
    }) + '</p>'
  );
  addProb(mkP10(rng), rng);
}

/* ══ MANIPULATIVO 1 · CINTA DE GALAXIAS ════════════════════════════════════
   El alumno coloca una galaxia a la distancia que quiera. La flecha de
   alejamiento y las dos tiras de espectro responden al instante: la línea
   observada se recorre hacia el rojo conforme la galaxia se aleja. Tres retos
   con pista direccional y revelado al tercer intento.
   ═══════════════════════════════════════════════════════════════════════════ */
function wExpansion(rng){
  var host = iw('expansion', 'wExpansion');
  var TG = shuffle([1200, 2400, 3600, 4800, 6000], rng).slice(0, 3);
  var st = { d: 60, r: 0, tries: 0, done: false };
  function vel(d){ return d * 20; }
  function tgt(){ return TG[Math.min(st.r, TG.length - 1)]; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Cinta de galaxias', en: 'Galaxy ribbon' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wExpTask"></div>' +
    '<div class="iw-cv"><canvas id="wExpCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Distancia de la galaxia', en: 'Distance of the galaxy' }) + ': <b id="wExpDL"></b> ' +
      L({ es: 'millones de años luz', en: 'million light years' }) + '</label>' +
      '<input type="range" id="wExpD" min="10" max="300" step="10" value="60" oninput="wExpIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Distancia', en: 'Distance' }) + '</div><div class="ro-v" id="wExpRd"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Se aleja a', en: 'Recedes at' }) + '</div><div class="ro-v" id="wExpRv"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Objetivo', en: 'Target' }) + '</div><div class="ro-v" id="wExpRt"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wExpCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wExpFb"></div>';

  function galaxyDot(c, x, y, r, col){
    c.fillStyle = col;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = col; c.lineWidth = 2;
    c.beginPath(); c.ellipse(x, y, r * 2, r * 0.75, -0.45, 0, Math.PI * 2); c.stroke();
  }

  function draw(){
    var cv = document.getElementById('wExpCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 210;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var x0 = 30, x1 = W - 30, v = vel(st.d);
    var gx = x0 + (st.d / 300) * (x1 - x0 - 74);
    c.strokeStyle = CV('--border'); c.lineWidth = 2;
    c.beginPath(); c.moveTo(x0, 54); c.lineTo(x1, 54); c.stroke();
    galaxyDot(c, x0, 54, 9, CV('--green'));
    galaxyDot(c, gx, 54, 8, CV('--gold'));
    var len = 12 + (v / 6000) * 42;
    c.strokeStyle = CV('--bad'); c.fillStyle = CV('--bad'); c.lineWidth = 3;
    c.beginPath(); c.moveTo(gx + 18, 54); c.lineTo(gx + 18 + len, 54); c.stroke();
    c.beginPath(); c.moveTo(gx + 18 + len + 9, 54); c.lineTo(gx + 18 + len, 48); c.lineTo(gx + 18 + len, 60); c.closePath(); c.fill();
    c.fillStyle = CV('--text2'); c.font = '11px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'nosotros', en: 'us' }), x0 - 8, 30);
    c.textAlign = 'center';
    c.fillText(st.d + ' ' + L({ es: 'millones de a.l.', en: 'million l.y.' }), Math.min(gx, W - 62), 80);
    var sx0 = 44, sx1 = W - 44, sy = 112;
    var g = c.createLinearGradient(sx0, 0, sx1, 0);
    g.addColorStop(0, '#3f51b5');
    g.addColorStop(0.5, '#43a047');
    g.addColorStop(1, '#c62828');
    c.fillStyle = g; c.fillRect(sx0, sy, sx1 - sx0, 16);
    c.fillStyle = g; c.fillRect(sx0, sy + 40, sx1 - sx0, 16);
    var pr = sx0 + 0.28 * (sx1 - sx0);
    var po = sx0 + Math.min(0.28 + (v / 6000) * 0.58, 0.96) * (sx1 - sx0);
    c.strokeStyle = CV('--text'); c.lineWidth = 3;
    c.beginPath(); c.moveTo(pr, sy - 3); c.lineTo(pr, sy + 19); c.stroke();
    c.beginPath(); c.moveTo(po, sy + 37); c.lineTo(po, sy + 59); c.stroke();
    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'right';
    c.fillText(L({ es: 'laboratorio', en: 'laboratory' }), sx0 - 6, sy + 12);
    c.fillText(L({ es: 'galaxia', en: 'galaxy' }), sx0 - 6, sy + 52);
    c.textAlign = 'center';
    c.fillText(L({ es: 'ondas cortas', en: 'short waves' }), sx0 + 34, sy + 76);
    c.fillText(L({ es: 'ondas largas', en: 'long waves' }), sx1 - 34, sy + 76);
  }

  function paint(){
    document.getElementById('wExpDL').textContent = st.d;
    document.getElementById('wExpRd').textContent = st.d;
    document.getElementById('wExpRv').textContent = vel(st.d) + ' km/s';
    document.getElementById('wExpRt').textContent = st.done ? L({ es: 'libre', en: 'free' }) : (tgt() + ' km/s');
    document.getElementById('wExpTask').textContent = st.done
      ? L({ es: 'Cinta libre: mueve la galaxia y observa cómo cambian a la vez su rapidez de alejamiento y el corrimiento de la línea.',
            en: 'Free ribbon: move the galaxy and watch how its recession speed and the shift of the line change together.' })
      : L({ es: 'Reto ' + (st.r + 1) + ' de 3: coloca la galaxia a la distancia a la que se aleja de nosotros a ' + tgt() + ' km/s.',
            en: 'Challenge ' + (st.r + 1) + ' of 3: place the galaxy at the distance where it recedes from us at ' + tgt() + ' km/s.' });
    draw();
  }

  window.wExpIn = function(){
    st.d = parseInt(document.getElementById('wExpD').value, 10);
    paint();
  };
  window.wExpCheck = function(){
    var fb = document.getElementById('wExpFb');
    if (st.done){
      fb.textContent = L({ es: 'A ' + st.d + ' millones de años luz la galaxia se aleja a ' + vel(st.d) + ' km/s.',
                           en: 'At ' + st.d + ' million light years the galaxy recedes at ' + vel(st.d) + ' km/s.' });
      return;
    }
    var v = vel(st.d), T = tgt();
    if (v === T){
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres retos resueltos. Ya ves por qué las galaxias más lejanas son también las más corridas al rojo.',
              en: 'All three challenges solved. You can now see why the farthest galaxies are also the most shifted to the red.' })
        : L({ es: 'Justo esa distancia. Fíjate cómo se recorrió la línea de abajo respecto de la de arriba.',
              en: 'Exactly that distance. Notice how the lower line moved compared with the upper one.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.d = T / 20;
      document.getElementById('wExpD').value = st.d;
      var msg = L({ es: 'A ' + (T / 20) + ' millones de años luz la rapidez llega a ' + T + ' km/s, porque cada millón de años luz añade 20 km/s.',
                    en: 'At ' + (T / 20) + ' million light years the speed reaches ' + T + ' km/s, because every million light years adds 20 km/s.' });
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    fb.textContent = (v < T)
      ? L({ es: 'Va a ' + v + ' km/s y se piden ' + T + ' km/s: aleja más la galaxia.',
            en: 'It goes at ' + v + ' km/s and ' + T + ' km/s are asked for: move the galaxy farther.' })
      : L({ es: 'Va a ' + v + ' km/s y se pasa de ' + T + ' km/s: acerca la galaxia.',
            en: 'It goes at ' + v + ' km/s and goes past ' + T + ' km/s: bring the galaxy closer.' });
  };

  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 2 · REPARTO DEL UNIVERSO ═════════════════════════════════
   Tres deslizadores reparten 100 unidades. La barra apilada y la suma
   responden en vivo; la retroalimentación señala cuál parte sobra o falta.
   ═══════════════════════════════════════════════════════════════════════════ */
function wComposicion(rng){
  var host = iw('composicion', 'wComposicion');
  var T = { a: 5, b: 27, c: 68 };
  var st = { a: 10, b: 40, c: 50, tries: 0, done: false };
  var NA = L({ es: 'Materia ordinaria', en: 'Ordinary matter' });
  var NB = L({ es: 'Materia oscura', en: 'Dark matter' });
  var NC = L({ es: 'Energía oscura', en: 'Dark energy' });

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Reparto del Universo', en: 'Share out of the Universe' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wCompTask"></div>' +
    '<div class="iw-cv"><canvas id="wCompCv"></canvas></div>' +
    '<div class="ctrl"><label>' + NA + ': <b id="wCompAL"></b></label>' +
      '<input type="range" id="wCompA" min="0" max="20" step="1" value="10" oninput="wCompIn()"></div>' +
    '<div class="ctrl"><label>' + NB + ': <b id="wCompBL"></b></label>' +
      '<input type="range" id="wCompB" min="0" max="60" step="1" value="40" oninput="wCompIn()"></div>' +
    '<div class="ctrl"><label>' + NC + ': <b id="wCompCL"></b></label>' +
      '<input type="range" id="wCompC" min="0" max="100" step="1" value="50" oninput="wCompIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Suma', en: 'Sum' }) + '</div><div class="ro-v" id="wCompS"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Debe sumar', en: 'Must add to' }) + '</div><div class="ro-v">100</div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Parte visible', en: 'Visible part' }) + '</div><div class="ro-v" id="wCompV"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wCompCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wCompFb"></div>';

  function draw(){
    var cv = document.getElementById('wCompCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 130;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var x0 = 22, x1 = W - 22, bw = x1 - x0, y = 44, h = 36;
    c.fillStyle = CV('--surface2'); c.fillRect(x0, y, bw, h);
    var parts = [[st.a, CV('--green'), NA], [st.b, CV('--text3'), NB], [st.c, CV('--neg'), NC]];
    var cur = x0;
    parts.forEach(function(p){
      var w = Math.max(0, Math.min(bw - (cur - x0), (p[0] / 100) * bw));
      c.fillStyle = p[1]; c.fillRect(cur, y, w, h);
      if (w > 26){
        c.fillStyle = CV('--surface');
        c.font = 'bold 12px IBM Plex Sans, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(String(p[0]), cur + w / 2, y + h / 2);
      }
      cur += w;
    });
    c.strokeStyle = CV('--border'); c.lineWidth = 2;
    c.strokeRect(x0, y, bw, h);
    var sum = st.a + st.b + st.c;
    c.strokeStyle = (sum === 100) ? CV('--ok') : CV('--bad'); c.lineWidth = 3;
    c.beginPath(); c.moveTo(cur, y - 8); c.lineTo(cur, y + h + 8); c.stroke();
    c.fillStyle = CV('--text2'); c.font = '11px IBM Plex Sans, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillText(NA, x0, 24);
    c.textAlign = 'center'; c.fillText(NB, W / 2, 24);
    c.textAlign = 'right'; c.fillText(NC, x1, 24);
    c.textAlign = 'center'; c.fillStyle = CV('--text3');
    c.fillText(L({ es: 'la marca señala dónde acaba tu reparto', en: 'the mark shows where your share out ends' }), W / 2, y + h + 26);
  }

  function paint(){
    document.getElementById('wCompAL').textContent = st.a;
    document.getElementById('wCompBL').textContent = st.b;
    document.getElementById('wCompCL').textContent = st.c;
    document.getElementById('wCompS').textContent = (st.a + st.b + st.c);
    document.getElementById('wCompV').textContent = st.a + ' / 100';
    document.getElementById('wCompTask').textContent = st.done
      ? L({ es: 'Tablero libre: mueve las tres partes y observa qué tan pequeña es la porción que realmente podemos ver.',
            en: 'Free board: move the three parts and see how small the portion we can actually see is.' })
      : L({ es: 'Reparte 100 unidades entre las tres partes de modo que coincidan con lo que muestran las mediciones.',
            en: 'Share out 100 units between the three parts so that they match what the measurements show.' });
    draw();
  }

  window.wCompIn = function(){
    st.a = parseInt(document.getElementById('wCompA').value, 10);
    st.b = parseInt(document.getElementById('wCompB').value, 10);
    st.c = parseInt(document.getElementById('wCompC').value, 10);
    paint();
  };
  window.wCompCheck = function(){
    var fb = document.getElementById('wCompFb');
    if (st.done){
      fb.textContent = L({ es: 'Tu reparto actual suma ' + (st.a + st.b + st.c) + ' unidades.',
                           en: 'Your current share out adds up to ' + (st.a + st.b + st.c) + ' units.' });
      return;
    }
    var sum = st.a + st.b + st.c;
    if (sum !== 100){
      st.tries++;
      if (st.tries < 3){
        fb.textContent = (sum < 100)
          ? L({ es: 'Tu reparto suma ' + sum + ' y el total debe ser 100: falta repartir ' + (100 - sum) + ' unidades.',
                en: 'Your share out adds to ' + sum + ' and the total must be 100: ' + (100 - sum) + ' units are still to be shared.' })
          : L({ es: 'Tu reparto suma ' + sum + ' y el total debe ser 100: sobran ' + (sum - 100) + ' unidades.',
                en: 'Your share out adds to ' + sum + ' and the total must be 100: ' + (sum - 100) + ' units are left over.' });
        return;
      }
    } else {
      var da = Math.abs(st.a - T.a), db = Math.abs(st.b - T.b), dc = Math.abs(st.c - T.c);
      if (da <= 3 && db <= 3 && dc <= 3){
        st.done = true; paint();
        document.getElementById('wCompFb').innerHTML = '<span class="okfb">🎉 ' +
          L({ es: 'Ese es el reparto que muestran las mediciones: la materia que emite luz es apenas una vigésima parte del total.',
              en: 'That is the share out the measurements show: the matter that gives off light is barely a twentieth of the total.' }) + '</span>';
        return;
      }
      st.tries++;
      if (st.tries < 3){
        var worst = (da >= db && da >= dc) ? 'a' : ((db >= dc) ? 'b' : 'c');
        var nom = worst === 'a' ? NA : (worst === 'b' ? NB : NC);
        var cual = worst === 'a' ? st.a : (worst === 'b' ? st.b : st.c);
        var meta = worst === 'a' ? T.a : (worst === 'b' ? T.b : T.c);
        fb.textContent = (cual > meta)
          ? L({ es: 'La suma ya está en 100, pero le diste demasiado a: ' + nom + '. Bájale y compensa con las otras dos.',
                en: 'The sum is already 100, but you gave too much to: ' + nom + '. Lower it and make up with the other two.' })
          : L({ es: 'La suma ya está en 100, pero le diste muy poco a: ' + nom + '. Súbele y compensa con las otras dos.',
                en: 'The sum is already 100, but you gave too little to: ' + nom + '. Raise it and make up with the other two.' });
        return;
      }
    }
    st.a = T.a; st.b = T.b; st.c = T.c;
    document.getElementById('wCompA').value = T.a;
    document.getElementById('wCompB').value = T.b;
    document.getElementById('wCompC').value = T.c;
    st.done = true; paint();
    document.getElementById('wCompFb').textContent =
      L({ es: 'Este es el reparto medido: 5 unidades de materia ordinaria, 27 de materia oscura y 68 de energía oscura. Todo lo que brilla en el cielo cabe en esas 5 unidades.',
          en: 'This is the measured share out: 5 units of ordinary matter, 27 of dark matter and 68 of dark energy. Everything shining in the sky fits inside those 5 units.' });
  };

  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 3 · SINTONIZADOR DEL ESPECTRO ════════════════════════════
   El alumno recorre las siete bandas y lee qué muestra cada una. Tres misiones
   de observación, con pista direccional hacia ondas más largas o más cortas.
   ═══════════════════════════════════════════════════════════════════════════ */
function wEspectro(rng){
  var host = iw('espectro', 'wEspectro');
  var B = [
    { n: L({ es: 'Ondas de radio', en: 'Radio waves' }),
      d: L({ es: 'Las ondas más largas y de menor energía. Se recogen con antenas y atraviesan el polvo sin detenerse.',
             en: 'The longest and least energetic waves. They are collected with antennas and cross dust without stopping.' }) },
    { n: L({ es: 'Microondas', en: 'Microwaves' }),
      d: L({ es: 'Ondas algo más cortas. En esta banda aparece un resplandor muy frío repartido de manera pareja por todo el cielo.',
             en: 'Slightly shorter waves. In this band a very cold glow appears, spread evenly over the whole sky.' }) },
    { n: L({ es: 'Infrarrojo', en: 'Infrared' }),
      d: L({ es: 'La banda del calor. Delata cuerpos tibios como el polvo, y atraviesa nubes que son opacas a la luz visible.',
             en: 'The band of heat. It betrays warm bodies such as dust, and crosses clouds that are opaque to visible light.' }) },
    { n: L({ es: 'Luz visible', en: 'Visible light' }),
      d: L({ es: 'La franja estrecha que percibe el ojo. Muestra la superficie brillante de las estrellas y el color de los planetas.',
             en: 'The narrow strip the eye perceives. It shows the shining surface of stars and the colour of planets.' }) },
    { n: L({ es: 'Ultravioleta', en: 'Ultraviolet' }),
      d: L({ es: 'Más energía que la luz visible. Destaca las estrellas jóvenes muy calientes y el gas que las rodea.',
             en: 'More energy than visible light. It highlights very hot young stars and the gas surrounding them.' }) },
    { n: L({ es: 'Rayos X', en: 'X rays' }),
      d: L({ es: 'Ondas muy cortas emitidas por materia a millones de grados, como la que cae hacia un agujero negro.',
             en: 'Very short waves given off by matter at millions of degrees, such as the one falling towards a black hole.' }) },
    { n: L({ es: 'Rayos gamma', en: 'Gamma rays' }),
      d: L({ es: 'Las ondas más cortas y energéticas del espectro. Aparecen en los estallidos más violentos que se conocen.',
             en: 'The shortest and most energetic waves of the spectrum. They show up in the most violent bursts known.' }) }
  ];
  var M = shuffle([
    { t: L({ es: 'Buscas el resplandor frío que quedó repartido por todo el cielo desde el origen del Universo.',
             en: 'You are after the cold glow left spread over the whole sky since the origin of the Universe.' }), b: 1 },
    { t: L({ es: 'Quieres ver estrellas recién formadas dentro de una nube de polvo que tapa por completo la luz visible.',
             en: 'You want to see newly formed stars inside a dust cloud that completely blocks visible light.' }), b: 2 },
    { t: L({ es: 'Quieres registrar el gas a millones de grados que gira y cae hacia un agujero negro.',
             en: 'You want to record the gas at millions of degrees swirling and falling towards a black hole.' }), b: 5 },
    { t: L({ es: 'Quieres estudiar con una antena los chorros de gas de una galaxia lejana, sin que el polvo te estorbe.',
             en: 'You want to study with an antenna the gas jets of a distant galaxy, without dust getting in the way.' }), b: 0 }
  ], rng).slice(0, 3);
  var st = { i: 3, r: 0, tries: 0, done: false };

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Sintonizador del espectro', en: 'Spectrum tuner' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wEspTask"></div>' +
    '<div class="iw-cv"><canvas id="wEspCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Banda del telescopio', en: 'Telescope band' }) + '</label>' +
      '<input type="range" id="wEspI" min="0" max="6" step="1" value="3" oninput="wEspIn()"></div>' +
    '<div class="cls-card" id="wEspName"></div>' +
    '<div class="rfb" id="wEspDesc"></div>' +
    '<button class="rverify-btn" onclick="wEspCheck()">' + L({ es: 'Observar', en: 'Observe' }) + '</button>' +
    '<div class="rfb" id="wEspFb"></div>';

  function draw(){
    var cv = document.getElementById('wEspCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 96;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var x0 = 18, x1 = W - 18, bw = x1 - x0, y = 34, h = 30, cw = bw / 7;
    var g = c.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, '#7b1fa2');
    g.addColorStop(0.45, '#3f51b5');
    g.addColorStop(0.62, '#43a047');
    g.addColorStop(0.8, '#c62828');
    g.addColorStop(1, '#8d6e63');
    c.fillStyle = g; c.fillRect(x0, y, bw, h);
    c.strokeStyle = CV('--surface'); c.lineWidth = 1;
    for (var k = 1; k < 7; k++){
      c.beginPath(); c.moveTo(x0 + k * cw, y); c.lineTo(x0 + k * cw, y + h); c.stroke();
    }
    var mx = x0 + (6 - st.i) * cw + cw / 2;
    c.strokeStyle = CV('--text'); c.lineWidth = 3;
    c.strokeRect(x0 + (6 - st.i) * cw + 1, y - 4, cw - 2, h + 8);

    c.beginPath(); c.moveTo(mx, y - 8); c.lineTo(mx - 7, y - 18); c.lineTo(mx + 7, y - 18); c.closePath(); c.fill();

    c.textAlign = 'right'; c.fillText(L({ es: 'ondas más largas', en: 'longer waves' }), x1, y + h + 16);
  }

  function paint(){
    document.getElementById('wEspName').textContent = B[st.i].n;
    document.getElementById('wEspDesc').textContent = B[st.i].d;
    document.getElementById('wEspTask').textContent = st.done

      : L({ es: 'Misión ' + (st.r + 1) + ' de 3. ' + M[st.r].t + ' Deja el telescopio en la banda adecuada y observa.',
            en: 'Mission ' + (st.r + 1) + ' of 3. ' + M[st.r].t + ' Leave the telescope on the right band and observe.' });
    draw();
  }

  window.wEspIn = function(){
    st.i = parseInt(document.getElementById('wEspI').value, 10);
    paint();
  };
  window.wEspCheck = function(){
    var fb = document.getElementById('wEspFb');
    if (st.done){ fb.textContent = B[st.i].d; return; }
    var T = M[st.r].b;
    if (st.i === T){
      st.r++; st.tries = 0;
      if (st.r >= M.length) st.done = true;
      paint();
      document.getElementById('wEspFb').innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Las tres misiones cumplidas. Cada objeto se deja ver en la banda que corresponde a su temperatura y a lo que le ocurre.',
              en: 'All three missions accomplished. Each object lets itself be seen in the band that matches its temperature and what happens to it.' })
        : L({ es: 'Banda correcta. Observa cómo cambia lo que se ve al pasar a la banda vecina.',
              en: 'Right band. Watch how what is seen changes when you move to the neighbouring band.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.i = T;
      document.getElementById('wEspI').value = T;
      var msg = L({ es: 'La banda pedida era: ' + B[T].n + '. ' + B[T].d,
                    en: 'The band asked for was: ' + B[T].n + '. ' + B[T].d });
      st.r++; st.tries = 0;
      if (st.r >= M.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    fb.textContent = (st.i < T)
      ? L({ es: 'Estás en ' + B[st.i].n + ', en ondas más largas de lo necesario: muévete hacia ondas más cortas.',
            en: 'You are on ' + B[st.i].n + ', on longer waves than needed: move towards shorter waves.' })
      : L({ es: 'Estás en ' + B[st.i].n + ', en ondas más cortas de lo necesario: muévete hacia ondas más largas.',
            en: 'You are on ' + B[st.i].n + ', on shorter waves than needed: move towards longer waves.' });
  };

  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 4 · LANZADOR ORBITAL ═════════════════════════════════════
   El alumno elige la rapidez de lanzamiento y la trayectoria completa se
   calcula y se dibuja al instante: cae, gira alargado, gira redondo o escapa.
   Tres alturas distintas, pista direccional y revelado al tercer intento.
   ═══════════════════════════════════════════════════════════════════════════ */
function wOrbita(rng){
  var host = iw('orbita', 'wOrbita');
  var GM = 4000;
  var RS = shuffle([60, 85, 110], rng);
  var st = { v: 5, r: 0, tries: 0, done: false };
  function r0(){ return RS[Math.min(st.r, RS.length - 1)]; }
  function vc(r){ return Math.sqrt(GM / r); }

  function sim(v, r){
    var x = r, y = 0, vx = 0, vy = v, dt = 0.04;
    var pts = [[x, y]], rmin = r, rmax = r, crash = false, esc = false;
    for (var i = 0; i < 3600; i++){
      var d = Math.sqrt(x * x + y * y);
      if (d < 20){ crash = true; break; }
      if (d > 3 * r){ esc = true; break; }
      if (d < rmin) rmin = d;
      if (d > rmax) rmax = d;
      var a = -GM / (d * d * d);
      vx += a * x * dt; vy += a * y * dt;
      x += vx * dt; y += vy * dt;
      if (i % 3 === 0) pts.push([x, y]);
    }
    return { pts: pts, crash: crash, esc: esc, rmin: rmin, rmax: rmax };
  }
  function verdict(res, v, r){
    if (res.crash) return 'cae';
    if ((v * v) / 2 - GM / r >= 0) return 'escapa';
    if (res.esc) return 'alta';
    if (res.rmax / res.rmin <= 1.15) return 'ok';
    return (v < vc(r)) ? 'baja' : 'alta';
  }
  function vTxt(k){
    return k === 'cae' ? L({ es: 'cae al planeta', en: 'falls onto the planet' })
      : k === 'escapa' ? L({ es: 'se escapa', en: 'escapes' })
      : k === 'ok' ? L({ es: 'órbita redonda', en: 'round orbit' })
      : L({ es: 'órbita alargada', en: 'stretched orbit' });
  }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Lanzador orbital', en: 'Orbital launcher' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wOrbTask"></div>' +
    '<div class="iw-cv"><canvas id="wOrbCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Rapidez de lanzamiento', en: 'Launch speed' }) + ': <b id="wOrbVL"></b> ' +
      L({ es: 'unidades', en: 'units' }) + '</label>' +
      '<input type="range" id="wOrbV" min="2" max="14" step="0.1" value="5" oninput="wOrbIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Altura de suelta', en: 'Release height' }) + '</div><div class="ro-v" id="wOrbR"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Rapidez', en: 'Speed' }) + '</div><div class="ro-v" id="wOrbVv"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Resultado', en: 'Result' }) + '</div><div class="ro-v" id="wOrbK"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wOrbCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wOrbFb"></div>';

  function draw(){
    var cv = document.getElementById('wOrbCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 250;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var cx = W / 2, cy = H / 2, r = r0();
    var res = sim(st.v, r);
    var lim = Math.max(res.rmax, r);
    var s = Math.min(1, (Math.min(W, H) / 2 - 16) / lim);
    c.strokeStyle = CV('--border'); c.lineWidth = 1;
    c.beginPath(); c.arc(cx, cy, r * s, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = CV('--gold'); c.lineWidth = 2;
    c.beginPath();
    res.pts.forEach(function(p, i){
      var px = cx + p[0] * s, py = cy - p[1] * s;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    });
    c.stroke();
    c.fillStyle = CV('--green');
    c.beginPath(); c.arc(cx, cy, 20 * s, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--bad');
    c.beginPath(); c.arc(cx + r * s, cy, 4.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--text3'); c.font = '11px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'punto de suelta', en: 'release point' }), 8, 16);
    c.textAlign = 'right';
    c.fillText(vTxt(verdict(res, st.v, r)), W - 8, 16);
    return res;
  }

  function paint(){
    document.getElementById('wOrbVL').textContent = num(st.v);
    document.getElementById('wOrbR').textContent = r0();
    document.getElementById('wOrbVv').textContent = num(st.v);
    var res = sim(st.v, r0());
    document.getElementById('wOrbK').textContent = vTxt(verdict(res, st.v, r0()));
    document.getElementById('wOrbTask').textContent = st.done
      ? L({ es: 'Lanzador libre: prueba cualquier rapidez y observa cómo cambia la forma de la trayectoria.',
            en: 'Free launcher: try any speed and watch how the shape of the path changes.' })
      : L({ es: 'Lanzamiento ' + (st.r + 1) + ' de 3, a una altura de ' + r0() + ' unidades: encuentra la rapidez que deja a la sonda girando en un círculo.',
            en: 'Launch ' + (st.r + 1) + ' of 3, at a height of ' + r0() + ' units: find the speed that leaves the probe turning in a circle.' });
    draw();
  }

  window.wOrbIn = function(){
    st.v = parseFloat(document.getElementById('wOrbV').value);
    paint();
  };
  window.wOrbCheck = function(){
    var fb = document.getElementById('wOrbFb');
    var r = r0(), res = sim(st.v, r), k = verdict(res, st.v, r);
    if (st.done){ fb.textContent = L({ es: 'Resultado del lanzamiento: ' + vTxt(k) + '.', en: 'Result of the launch: ' + vTxt(k) + '.' }); return; }
    if (k === 'ok'){
      st.r++; st.tries = 0;
      if (st.r >= RS.length) st.done = true;
      paint();
      document.getElementById('wOrbFb').innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Tres órbitas logradas. Fíjate en que a mayor altura hizo falta menos rapidez: allá la atracción es más débil.',
              en: 'Three orbits achieved. Notice that the higher the release, the less speed was needed: up there the pull is weaker.' })
        : L({ es: 'Órbita estable. Ahora prueba a otra altura y busca de nuevo la rapidez justa.',
              en: 'Stable orbit. Now try another height and look for the right speed again.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      var vv = Math.round(vc(r) * 10) / 10;
      st.v = vv;
      document.getElementById('wOrbV').value = vv;
      var msg = L({ es: 'A una altura de ' + r + ' unidades la rapidez que da un círculo es ' + vv + '. Con menos, la sonda cae hacia el planeta; con mucho más, se marcha sin volver.',
                    en: 'At a height of ' + r + ' units the speed giving a circle is ' + vv + '. With less, the probe falls towards the planet; with much more, it leaves without returning.' });
      st.r++; st.tries = 0;
      if (st.r >= RS.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    fb.textContent =
      k === 'cae' ? L({ es: 'La sonda se estrella: va demasiado lenta para rodear al planeta, súbele a la rapidez.',
                        en: 'The probe crashes: it goes too slowly to go around the planet, raise the speed.' })
    : k === 'escapa' ? L({ es: 'La sonda se marcha sin volver: va demasiado rápida, bájale a la rapidez.',
                          en: 'The probe leaves without returning: it goes too fast, lower the speed.' })
    : k === 'baja' ? L({ es: 'Casi: la trayectoria se hunde hacia el planeta del lado opuesto, súbele un poco a la rapidez.',
                        en: 'Almost: the path dips towards the planet on the far side, raise the speed a little.' })
    : L({ es: 'Casi: la trayectoria se estira hacia afuera del lado opuesto, bájale un poco a la rapidez.',
          en: 'Almost: the path stretches outwards on the far side, lower the speed a little.' });
  };

  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}

/* ══ MANIPULATIVO 5 · TABLERO TIERRA LUNA ══════════════════════════════════
   El alumno mueve la Luna por su órbita. A la izquierda, la escena vista desde
   fuera con la luz del Sol llegando siempre por el mismo lado; a la derecha, el
   disco tal como se ve desde la Tierra. Tres fases pedidas, pista direccional.
   ═══════════════════════════════════════════════════════════════════════════ */
function wFases(rng){
  var host = iw('fases', 'wFases');
  var NM = [
    L({ es: 'Luna nueva', en: 'New moon' }),
    L({ es: 'Creciente delgada', en: 'Waxing crescent' }),
    L({ es: 'Cuarto creciente', en: 'First quarter' }),
    L({ es: 'Gibosa creciente', en: 'Waxing gibbous' }),
    L({ es: 'Luna llena', en: 'Full moon' }),
    L({ es: 'Gibosa menguante', en: 'Waning gibbous' }),
    L({ es: 'Cuarto menguante', en: 'Last quarter' }),
    L({ es: 'Menguante delgada', en: 'Waning crescent' })
  ];
  var DIAS = [0, 4, 7, 11, 15, 18, 22, 26];
  var TG = shuffle([2, 4, 6, 1, 5], rng).slice(0, 3);
  var st = { i: 0, r: 0, tries: 0, done: false };
  function frac(i){ return (1 - Math.cos(i * Math.PI / 4)) / 2; }
  function tgt(){ return TG[Math.min(st.r, TG.length - 1)]; }

  host.innerHTML =
    '<div class="iw-tag">' + L({ es: 'Tablero Tierra y Luna', en: 'Earth and Moon board' }) + '</div>' +
    '<div class="iw-task iw-sub" id="wFasTask"></div>' +
    '<div class="iw-cv"><canvas id="wFasCv"></canvas></div>' +
    '<div class="ctrl"><label>' + L({ es: 'Posición de la Luna en su recorrido', en: 'Position of the Moon along its journey' }) + '</label>' +
      '<input type="range" id="wFasI" min="0" max="7" step="1" value="0" oninput="wFasIn()"></div>' +
    '<div class="readout">' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Fase', en: 'Phase' }) + '</div><div class="ro-v" id="wFasN"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Día del ciclo', en: 'Day of the cycle' }) + '</div><div class="ro-v" id="wFasD"></div></div>' +
      '<div class="ro"><div class="ro-l">' + L({ es: 'Disco iluminado', en: 'Lit disc' }) + '</div><div class="ro-v" id="wFasP"></div></div>' +
    '</div>' +
    '<button class="rverify-btn" onclick="wFasCheck()">' + L({ es: 'Comprobar', en: 'Check' }) + '</button>' +
    '<div class="rfb" id="wFasFb"></div>';

  function disc(c, cx, cy, R, k, litRight){
    c.fillStyle = CV('--surface2');
    c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
    if (k > 0.02){
      c.fillStyle = CV('--gold');
      c.beginPath();
      if (litRight) c.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2);
      else c.arc(cx, cy, R, Math.PI / 2, Math.PI * 1.5);
      c.closePath(); c.fill();
      var w = Math.abs(1 - 2 * k) * R;
      c.fillStyle = (k < 0.5) ? CV('--surface2') : CV('--gold');
      c.beginPath(); c.ellipse(cx, cy, w, R, 0, 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = CV('--border'); c.lineWidth = 2;
    c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.stroke();
  }

  function draw(){
    var cv = document.getElementById('wFasCv'); if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(rect.width || 320), H = 240;
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    var cx = W * 0.34, cy = 124, R = Math.min(66, W * 0.21);
    c.fillStyle = CV('--gold');
    c.beginPath(); c.arc(-6, cy, 26, 0, Math.PI * 2); c.fill();
    c.strokeStyle = CV('--gold'); c.lineWidth = 1.5;
    [-26, 0, 26].forEach(function(dy){
      c.beginPath(); c.moveTo(24, cy + dy); c.lineTo(44, cy + dy); c.stroke();
      c.beginPath(); c.moveTo(44, cy + dy); c.lineTo(38, cy + dy - 4); c.lineTo(38, cy + dy + 4); c.closePath(); c.fill();
    });
    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'left';
    c.fillText(L({ es: 'luz del Sol', en: 'sunlight' }), 6, cy + 48);
    c.strokeStyle = CV('--border'); c.lineWidth = 1;
    c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.stroke();
    c.fillStyle = CV('--neg');
    c.beginPath(); c.arc(cx, cy, 15, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--surface'); c.font = 'bold 9px IBM Plex Sans, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(L({ es: 'Tierra', en: 'Earth' }), cx, cy);
    c.textBaseline = 'alphabetic';
    var a = Math.PI - st.i * Math.PI / 4;
    var mx = cx + R * Math.cos(a), my = cy - R * Math.sin(a);
    c.fillStyle = CV('--surface2');
    c.beginPath(); c.arc(mx, my, 10, 0, Math.PI * 2); c.fill();
    c.fillStyle = CV('--gold');
    c.beginPath(); c.arc(mx, my, 10, Math.PI / 2, Math.PI * 1.5); c.closePath(); c.fill();
    c.strokeStyle = CV('--border'); c.lineWidth = 1.5;
    c.beginPath(); c.arc(mx, my, 10, 0, Math.PI * 2); c.stroke();
    var dx = cx - mx, dy2 = cy - my, dn = Math.sqrt(dx * dx + dy2 * dy2) || 1;
    c.fillStyle = CV('--bad');
    c.beginPath(); c.arc(mx + dx / dn * 5.5, my + dy2 / dn * 5.5, 2.2, 0, Math.PI * 2); c.fill();
    var px = W * 0.79, py = 124, PR = Math.min(40, W * 0.13);
    disc(c, px, py, PR, frac(st.i), st.i <= 4);
    c.fillStyle = CV('--text3'); c.font = '10px IBM Plex Sans, sans-serif'; c.textAlign = 'center';
    c.fillText(L({ es: 'vista desde la Tierra', en: 'seen from the Earth' }), px, py + PR + 18);
    c.fillText(L({ es: 'el punto rojo mira siempre a la Tierra', en: 'the red dot always faces the Earth' }), cx, cy + R + 34);
  }

  function paint(){
    document.getElementById('wFasN').textContent = NM[st.i];
    document.getElementById('wFasD').textContent = DIAS[st.i];
    document.getElementById('wFasP').textContent = Math.round(frac(st.i) * 100) + ' %';
    document.getElementById('wFasTask').textContent = st.done
      ? L({ es: 'Tablero libre: recorre el ciclo completo y observa cómo la mitad iluminada es siempre la misma, aunque desde aquí se vea distinta.',
            en: 'Free board: run through the whole cycle and see how the lit half is always the same, even though from here it looks different.' })
      : L({ es: 'Encargo ' + (st.r + 1) + ' de 3: coloca la Luna en el punto de su recorrido en el que desde la Tierra se ve esta fase: ' + NM[tgt()].toLowerCase() + '.',
            en: 'Task ' + (st.r + 1) + ' of 3: place the Moon at the point of its journey where from the Earth this phase is seen: ' + NM[tgt()].toLowerCase() + '.' });
    draw();
  }

  window.wFasIn = function(){
    st.i = parseInt(document.getElementById('wFasI').value, 10);
    paint();
  };
  window.wFasCheck = function(){
    var fb = document.getElementById('wFasFb');
    if (st.done){
      fb.textContent = L({ es: 'Posición actual: ' + NM[st.i] + ', con ' + Math.round(frac(st.i) * 100) + ' % del disco iluminado.',
                           en: 'Current position: ' + NM[st.i] + ', with ' + Math.round(frac(st.i) * 100) + ' % of the disc lit.' });
      return;
    }
    var T = tgt();
    if (st.i === T){
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      document.getElementById('wFasFb').innerHTML = '<span class="okfb">🎉 ' + (st.done
        ? L({ es: 'Los tres encargos resueltos. La fase depende solo del lugar que ocupa la Luna en su recorrido.',
              en: 'All three tasks solved. The phase depends only on the place the Moon occupies along its journey.' })
        : L({ es: 'Esa es la posición. Fíjate hacia dónde queda la mitad iluminada respecto de la Tierra.',
              en: 'That is the position. Notice where the lit half sits with respect to the Earth.' })) + '</span>';
      return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.i = T;
      document.getElementById('wFasI').value = T;
      var msg = L({ es: 'Aquí se ve esta fase: ' + NM[T].toLowerCase() + ', en el día ' + DIAS[T] + ' del ciclo, con ' + Math.round(frac(T) * 100) + ' % del disco iluminado.',
                    en: 'Here this phase is seen: ' + NM[T].toLowerCase() + ', on day ' + DIAS[T] + ' of the cycle, with ' + Math.round(frac(T) * 100) + ' % of the disc lit.' });
      st.r++; st.tries = 0;
      if (st.r >= TG.length) st.done = true;
      paint();
      fb.textContent = msg;
      return;
    }
    var fwd = ((T - st.i) + 8) % 8;
    fb.textContent = (fwd <= 4)
      ? L({ es: 'Ahora se ve esta fase: ' + NM[st.i].toLowerCase() + ', que no es la pedida: avanza unos días más en el recorrido.',
            en: 'Right now this phase is seen: ' + NM[st.i].toLowerCase() + ', which is not the one asked for: move a few more days along the journey.' })
      : L({ es: 'Ahora se ve esta fase: ' + NM[st.i].toLowerCase() + ', y te pasaste: retrocede unos días en el recorrido.',
            en: 'Right now this phase is seen: ' + NM[st.i].toLowerCase() + ', and you went too far: go back a few days along the journey.' });
  };

  paint();
  setTimeout(draw, 200);
  setTimeout(draw, 800);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyytGUdwxVpgXSHoXM1ISKh036P3GlF1BmF6aVRCR3DLpmtgefG09htw_l5IJW3UwoG/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
