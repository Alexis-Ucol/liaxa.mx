    { t:{ es:'La misma cifra, dos usos', en:'The same figure, two uses' },
      q:{ es:'El agua de un canal registra la misma concentración de una sal disuelta en dos tramos. En el primero se usa para regar hortalizas y en el segundo abastece la toma de una casa. ¿Qué corresponde hacer al analizar esas dos lecturas?',
          en:'The water of a canal records the same concentration of a dissolved salt in two stretches. In the first one it is used to water vegetables and in the second it supplies the intake of a house. What should be done when analysing those two readings?' },
      o:{ es:[ 'Comparar cada lectura con la referencia del uso que se le da al agua en ese tramo, porque el máximo recomendado depende del destino.',
               'Aplicar a los dos tramos la referencia del riego, porque es el uso que aparece primero a lo largo del canal.',
               'Descartar las dos lecturas, porque un mismo canal no puede tener dos usos distintos en el mismo recorrido.',
               'Considerar que ambas cumplen, porque las cifras coinciden y una coincidencia confirma que el agua es apta.' ],
          en:[ 'Compare each reading with the reference of the use given to the water in that stretch, because the recommended maximum depends on the destination.',
               'Apply the irrigation reference to both stretches, because it is the use that appears first along the canal.',
               'Discard both readings, because one canal cannot have two different uses along the same course.',
               'Consider that both comply, because the figures match and a match confirms the water is suitable.' ] },
      c:0,
      h:{ es:'Las cifras son iguales, pero lo que se hace con el agua no lo es. Piensa de qué depende el máximo recomendado.',
          en:'The figures are equal, but what is done with the water is not. Think about what the recommended maximum depends on.' },
      e:{ es:'El valor de referencia se fija para un uso concreto, y el del agua de bebida es más exigente que el del riego. La misma cifra puede quedar dentro del máximo en un tramo y por encima en el otro.',
          en:'The reference value is set for a specific use, and the one for drinking water is stricter than the one for irrigation. The same figure can stay within the maximum in one stretch and above it in the other.' } }

      q:{ es:'En una colonia las lecturas de dióxido de azufre suben todos los días entre las seis y las nueve de la mañana y bajan el resto de la jornada. ¿Qué hipótesis orienta mejor la indagación del grupo?',
          en:'In a neighbourhood the sulfur dioxide readings rise every day between six and nine in the morning and drop for the rest of the day. Which hypothesis better guides the inquiry of the group?' },

               'Que el equipo de la estación se descompone cada mañana y vuelve a funcionar correctamente hacia el mediodía.',
               'Que el valor de referencia del dióxido de azufre cambia durante la mañana y por eso las lecturas parecen altas.',
               'Que la concentración depende del número de personas que respiran en la colonia a esa hora del día.' ],
          en:[ 'That there is a nearby activity operating at those hours and releasing the gas, so it is worth identifying and observing it.',

      h:{ es:'Un patrón que se repite a la misma hora todos los días suele apuntar a algo que también ocurre a la misma hora todos los días.',
          en:'A pattern that repeats at the same hour every day usually points to something that also happens at the same hour every day.' },

    { t:{ es:'Una serie que no se detiene', en:'A series that does not stop' },

          en:'The monthly follow up of a well shows nitrates rising little by little for six months in a row, although they still do not exceed the reference. What conclusion does that series support?' },
      o:{ es:[ 'Que hay un aporte sostenido de nitratos al pozo, y conviene actuar antes de que las lecturas alcancen la referencia.',
               'Que el pozo ya es apto de manera definitiva, porque ninguna de las seis lecturas rebasó la referencia.',
               'Que los nitratos aparecen y desaparecen al azar, de modo que la serie no permite ninguna interpretación.',
               'Que la referencia del pozo quedó mal calculada, porque una serie creciente siempre indica un error de referencia.' ],
          en:[ 'That there is a sustained input of nitrates into the well, and it is worth acting before the readings reach the reference.',
               'That the well is definitively suitable, because none of the six readings exceeded the reference.',
               'That nitrates appear and disappear at random, so the series allows no interpretation at all.',
               'That the reference of the well was badly set, because a rising series always indicates a reference error.' ] },
      c:0,
      h:{ es:'Una serie aporta algo que un dato aislado no puede dar. Pregúntate qué información añade el hecho de que suba mes con mes.',
          en:'A series provides something an isolated figure cannot give. Ask what information is added by the fact that it rises month after month.' },
      e:{ es:'Lo que informa la serie es la tendencia. Un ascenso sostenido indica que algo sigue aportando nitratos, y esperar a que la lectura alcance la referencia deja pasar el momento en que la prevención es más sencilla.',
          en:'What the series reports is the trend. A sustained rise indicates that something keeps adding nitrates, and waiting for the reading to reach the reference lets the moment when prevention is easiest slip by.' } }

function mkP8(rng){

    { t:{ es:'Dos fuentes, un mismo sitio', en:'Two sources, one site' },

          en:'Two sources report the same well: a bulletin records 12 ppm of nitrates in March and a laboratory report records 7 mg/L in November of the same year. What is the right thing to do when systematizing both figures?' },
      o:{ es:[ 'Registrar las dos lecturas con su fecha y su unidad, reconociendo que en agua 1 mg/L equivale a 1 ppm, y tratarlas como dos momentos del seguimiento.',
               'Conservar solo la lectura más alta de las dos, porque representa el peor caso del año y protege mejor a la comunidad.',
               'Descartar las dos lecturas, porque provienen de fuentes de consulta distintas y no pueden aparecer en la misma tabla.',
               'Anotar únicamente la lectura de noviembre, porque es la más reciente y sustituye a la información anterior.' ],
          en:[ 'Record both readings with their date and unit, recognizing that in water 1 mg/L equals 1 ppm, and treat them as two moments of the follow up.',

               'Discard both readings, because they come from different sources and cannot appear in the same table.',

      h:{ es:'Revisa si las dos unidades hablan de la misma proporción y si las fechas distintas impiden o enriquecen la comparación.',
          en:'Check whether the two units speak about the same proportion and whether different dates block or enrich the comparison.' },
      e:{ es:'En agua las dos unidades describen la misma proporción, así que las lecturas son comparables. Las fechas distintas no estorban: son dos momentos del mismo sitio y juntos empiezan a mostrar una tendencia.',

    { t:{ es:'El indicador del proyecto', en:'The indicator of the project' },
      q:{ es:'Una comunidad acuerda cerrar la descarga de un taller hacia el canal y quiere saber más adelante si la medida funcionó. ¿Qué indicador permite responder esa pregunta con evidencia?',
          en:'A community agrees to close the discharge of a workshop into the canal and wants to know later whether the measure worked. Which indicator answers that question with evidence?' },
      o:{ es:[ 'La concentración de la misma sustancia, medida en el mismo punto del canal y con el mismo método, antes y después del cierre.',

               'La cantidad de letreros colocados a la orilla del canal para avisar del acuerdo a los vecinos.',

               'The number of signs placed along the canal to inform the neighbours about the agreement.',
               'The concentration measured in a stream of another region, used as an example of water in good condition.' ] },
      c:0,
      h:{ es:'Un indicador tiene que poder medirse dos veces y cambiar solo por efecto de la medida que se tomó.',
          en:'An indicator has to be measurable twice and change only as an effect of the measure that was taken.' },
      e:{ es:'Para atribuir el cambio a la medida hay que sostener todo lo demás: misma sustancia, mismo punto y mismo método, comparando antes y después. Las otras cifras describen el esfuerzo del grupo, no el estado del canal.',
          en:'To attribute the change to the measure everything else has to be held constant: same substance, same point and same method, comparing before and after. The other figures describe the effort of the group, not the state of the canal.' } }

}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Concentración de Contaminantes (ppm) en Aire, Agua y Suelo';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
