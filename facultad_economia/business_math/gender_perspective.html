<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gender Perspective: Statistics and Data Analysis · Business Math · School of Economics, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/business_math/neg_genero.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-canvas { display:block; width:100%; border-radius:8px; background:var(--surface2); }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (widget toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <div style="font-family:'Crimson Pro',serif;font-size:2rem;font-weight:700;letter-spacing:.06em;color:#1a4a8a;line-height:1;letter-spacing:.28em;text-indent:.28em">ALEXIS</div>
    </div>
    <div class="wtitle" id="wtitle-el">Gender Perspective: Statistics and Data Analysis</div>
    <div class="wcourse" id="wcourse-el">Business Math</div>
    <label class="flabel" for="sName" id="lbl-name-el">Full name</label>
    <input class="finput" id="sName" type="text" placeholder="Your full name" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Group</label>
    <input class="finput" id="sGroup" type="text" placeholder="e.g. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Start</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreTitle">Saved session found</strong><br>
      <span id="restoreMsg">Do you want to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="200" height="48" viewBox="-22 0 160 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo -->
      <img id="hlogo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Gender Perspective: Statistics and Data Analysis</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 120 34" xmlns="http://www.w3.org/2000/svg"><polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="#1a4a8a" stroke-width="2"/><circle cx="22" cy="10" r="2.5" fill="#c9a84c"/><line x1="32" y1="6" x2="32" y2="28" stroke="#c9a84c" stroke-width="2"/><text x="42" y="22" font-family="'Crimson Pro',serif" font-weight="700" letter-spacing="3" fill="#1a4a8a" font-size="16">LIAXA</text></svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn"        id="btn-es" onclick="setLang('es')">ES</button>
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="dlbtn" id="dlBtn" onclick="generatePDF()">Download results as PDF</button>
    </div>
  </div>
</div>

<script>

/* ── Score reporting ─────────────────────────────────────────────────────────
   Sends grade silently to Google Sheet when student finishes.
   Set SCORE_ENDPOINT = '' to disable without breaking anything.
   ──────────────────────────────────────────────────────────────────────────── */
var SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxSJnnHSGtMSBcK4ggFvfN2DtEdTSK_yn57GA0OgOI1kJqHufnIsr5lOGAJZkQro_8G/exec';
/* ════════════════════════════════════════════════════════════════════════
   SCHOOL CONFIG · edit ONLY this block to rebrand for a different school
   ════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:      '#1a4a8a',
  primaryDark:  '#0f2d5a',
  primaryBg:    '#e8edf5',
  accent:       '#c9a84c',
  accentBg:     '#faf3e0',
  pBR: 26,  pBG: 74,  pBB: 138,
  pAR: 201, pAG: 168, pAB: 76,
  darkPrimary:     '#4a7abf',
  darkPrimaryDark: '#7aaae0',
  darkPrimaryBg:   '#0e1e38',
  darkAccent:      '#d4b86a',
  darkAccentBg:    '#241e0e',

function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ── THE MODELS THIS GUIDE RUNS ON ────────────────────────────────────────
   A gender gap is a measurement before it is an argument. Every figure in
   this guide answers a narrow question, and most of the mistakes made with
   these figures come from answering one question with the number that
   belongs to another. The four models below are the ones an analyst
   actually runs on a payroll and on a personnel file.                     */

/* ── The two averages of a payroll ── */
function meanOf(a) {
  if (!a || !a.length) return null;
  var s = 0;
  for (var i = 0; i < a.length; i++) s += a[i];
  return s / a.length;
}
/* The middle salary once everyone is lined up. A handful of very large
   salaries move the mean and leave this one where it was. */
function medianOf(a) {
  if (!a || !a.length) return null;
  var b = a.slice().sort(function(x, y) { return x - y; });
  var m = Math.floor(b.length / 2);
  return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2;
}
/* Every public pay report writes the gap as a share of what men earn, so
   that the figure answers how much of the male average is missing. */
function gapOf(male, female) { return (male === null || male <= 0) ? null : (male - female) / male; }

/* A pay ladder of n posts from the lowest paid to the highest paid, with a
   number of senior posts carrying a premium on top of the ladder, and a
   cut applied to every post of the group that is paid less. */
function payList(n, lo, hi, cut, senior, prem) {
  var out = [], i;
  for (i = 0; i < n; i++) out.push(lo + (hi - lo) * (n === 1 ? 0 : i / (n - 1)) - cut);
  for (i = 0; i < senior && i < n; i++) out[n - 1 - i] += prem;
  return out;
}
function atRank(arr, x) {
  var i = Math.round(x);
  if (i < 0) i = 0;
  if (i > arr.length - 1) i = arr.length - 1;
  return arr[i];
}
var LADDER_LO   = 13000;   /* lowest paid post on the ladder */
var LADDER_HI   = 44000;   /* highest paid post before any senior premium */
var TOP_PREMIUM = 60000;   /* what a senior post pays on top of the ladder */

/* ── A payroll split into job levels ── */
/* Each level carries a pay figure and a headcount for each group. The
   average pay of a group is the weighted average of the level pay, with the
   headcount of that group as the weight. */
function levelMean(levels, key) {
  var num = 0, den = 0;
  levels.forEach(function(L) { num += L[key] * L.pay; den += L[key]; });
  return den > 0 ? num / den : null;
}
/* What is left of the gap when women and men are paid identically in every
   level: pure distribution of posts. */
function structGap(levels) { return gapOf(levelMean(levels, 'm'), levelMean(levels, 'w')); }
/* The two gaps do not add. Being paid a share less inside the level and
   holding a set of posts worth a share less compose one into the other. */
function rawGapOf(levels, same) {
  var s = structGap(levels);
  return s === null ? null : 1 - (1 - same) * (1 - s);
}
function shareIn(levels, idx, key) {
  var tot = 0;
  levels.forEach(function(L) { tot += L[key]; });
  return tot > 0 ? levels[idx][key] / tot : null;
}
/* The share of the raw gap that comes from who holds which post. */
function structShare(levels, same) {
  var r = rawGapOf(levels, same), s = structGap(levels);
  return (r === null || r <= 0) ? null : s / r;
}

/* ── The promotion pipeline ── */
/* At every step women are promoted at rel times the rate of men, so the
   number of women per man multiplies by rel once per step. Nothing else in
   the model changes, which is the point: one modest disadvantage, repeated. */
function shareAfter(s0, rel, steps) {
  if (s0 <= 0) return 0;
  if (s0 >= 1) return 1;
  var odds = s0 / (1 - s0) * Math.pow(rel, steps);
  return odds / (1 + odds);
}
/* Read backwards. The share observed at the top and the share at the door
   together say what the relative rate per step must have been. */
function relFromTop(s0, sTop, steps) {
  if (s0 <= 0 || s0 >= 1 || sTop <= 0 || sTop >= 1 || steps <= 0) return null;
  return Math.pow((sTop / (1 - sTop)) / (s0 / (1 - s0)), 1 / steps);
}
/* How many steps before the share at the door is cut in half. */
function stepsToHalve(s0, rel) {
  if (rel >= 1 || rel <= 0) return null;
  var k = 0, s = s0;
  while (s > s0 / 2 && k < 60) { k++; s = shareAfter(s0, rel, k); }
  return k;
}

/* ── A survey answered by two groups ── */
/* Two independent samples of the same size. The uncertainty of a difference
   is larger than the uncertainty of either share, because both are measured
   with error and the two errors add under the root. */
function seDiff(pw, pm, n) {
  return n <= 0 ? null : Math.sqrt(pw * (1 - pw) / n + pm * (1 - pm) / n);
}
function marginDiff(pw, pm, n, z) { return z * seDiff(pw, pm, n); }
/* Turned around: how many people per group a target margin needs. */
function nForMargin(pw, pm, e, z) {
  return e <= 0 ? null : Math.ceil(z * z * (pw * (1 - pw) + pm * (1 - pm)) / (e * e));
}
/* A verdict written as a phrase rather than as a sign. */
function verdictTxt(diff, m, es) {
  if (Math.abs(diff) <= m) return es ? 'no distinguible de cero' : 'not distinguishable from zero';
  return es ? 'diferencia real' : 'a real difference';
}

/* ════════════════════════════════════════════════════════════════════════
   OPTION BUILDERS · the key is always the first value handed in
   ════════════════════════════════════════════════════════════════════════ */
/* Four distinct numbers, each rendered once per language and kept aligned.
   The key is always the first value handed in. */
function valOpts2(correct, wrongs, fmtEs, fmtEn, rng) {
  var seen = {}, vals = [];
  function add(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    var s = fmtEn(v);
    if (seen[s]) return;
    seen[s] = 1; vals.push(v);
  }
  add(correct);
  for (var i = 0; i < wrongs.length && vals.length < 4; i++) add(wrongs[i]);
  for (var j = 1; vals.length < 4 && j < 900; j++) {
    add(correct * (1 + j * 0.11 * (j % 2 ? 1 : -1)));
  }
  for (var k = 1; vals.length < 4 && k < 900; k++) add(correct + k * 0.41);
  return shuffleOpts(vals.map(fmtEs), vals.map(fmtEn), rng);
}
function valOpts(correct, wrongs, fmt, rng) {
  return valOpts2(correct, wrongs, fmt, fmt, rng);
}

   CANVAS / TABS / PHOTO / HINT / RESULTS
   ════════════════════════════════════════════════════════════════════════ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('pp' + idx);
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('pz' + idx).style.opacity = '0.4';
    saveSession();
  };
  reader.readAsDataURL(input.files[0]);
}
function toggleHint(idx) { document.getElementById('hint' + idx).classList.toggle('show'); }
function showResults() {
  /* ── Silent score reporting ── */
  if (SCORE_ENDPOINT) {
    try {
      fetch(SCORE_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          name:      studentData.name,
          group:     studentData.group,
          correct:   correctCount,
          score:     Math.round(correctCount / problems.length * 100),
          timestamp: new Date().toLocaleString('es-MX'),
          guide:     SCHOOL.guideTitle ? (SCHOOL.guideTitle['es'] || SCHOOL.guideTitle['en'] || '') : document.title.split('·')[0].trim()
        })
      });
    } catch(e) {}
  }

  var rb = document.getElementById('s_results');
  if (!rb) return;
  rb.style.display = 'block';
  setTimeout(function() {
    rb.classList.add('vis');
    rb.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 50);
}

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS PRIMITIVES FOR THE WIDGETS
   ════════════════════════════════════════════════════════════════════════ */
function fitCanvas(cv, h) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(240, cv.clientWidth || cv.parentNode.clientWidth || 300);
  cv.style.height = h + 'px';
  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function palette() {
  return {
    green: cssv('--green'), dark: cssv('--green-dark'), tint: cssv('--green-bg'),
    gold: cssv('--gold'), bad: cssv('--bad'), border: cssv('--border'),
    text: cssv('--text'), text2: cssv('--text2'), text3: cssv('--text3')
  };
}
function kindColor(P, kind) {
  if (kind === 'gold') return P.gold;
  if (kind === 'bad')  return P.bad;
  if (kind === 'tint') return P.tint;
  if (kind === 'soft') return P.text3;
  return P.dark;
}
/* Plots any curve given as a function of one quantity. A share that falls
   as the steps pile up, a margin that shrinks as the sample grows and a gap
   that widens with the structure are all the same picture to this routine.
     opts.marks  points worth naming, such as the share at the top level
     opts.hline  a reference level drawn as a horizontal line
     opts.at     where the company is standing right now                    */
function drawCurveChart(g, xMin, xMax, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h, i;
  var padL = 56, padR = 12, padT = 18, padB = 28;
  opts = opts || {};
  var fmtY  = opts.fmtY || function(v) { return intN(v); };
  var fmtX  = opts.fmtX || function(v) { return intN(v); };
  var STEPS = 140;
  var yLo = null, yHi = null;
  function note(v) {
    if (typeof v !== 'number' || !isFinite(v)) return;
    if (yLo === null || v < yLo) yLo = v;
    if (yHi === null || v > yHi) yHi = v;
  }
  series.forEach(function(s) {
    for (i = 0; i <= STEPS; i++) note(s.f(xMin + (xMax - xMin) * i / STEPS));
  });
  note(opts.yFloor); note(opts.yCeil);
  if (opts.hline) note(opts.hline.y);
  if (opts.asym)  note(opts.asym.y);
  if (yLo === null) { yLo = 0; yHi = 1; }
  if (yHi - yLo < 1e-9) yHi = yLo + 1;
  var pd = (yHi - yLo) * 0.10;
  yLo -= pd; yHi += pd;
  function X(v) { return padL + (v - xMin) / (xMax - xMin) * (W - padL - padR); }
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }
  function Yc(v) { return Math.max(padT - 10, Math.min(H - padB + 10, Y(v))); }

  if (opts.band && opts.band.to > opts.band.from) {
    var b1 = X(Math.max(xMin, opts.band.from)), b2 = X(Math.min(xMax, opts.band.to));
    if (b2 > b1) {
      ctx.save();
      ctx.fillStyle = P.tint;
      ctx.fillRect(b1, padT - 8, b2 - b1, H - padB - padT + 8);
      ctx.restore();
    }
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  if (yLo < 0 && yHi > 0) {
    ctx.save();
    ctx.strokeStyle = P.text3; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();
    ctx.restore();
  }
  if (opts.asym) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.asym.y)); ctx.lineTo(W - padR, Y(opts.asym.y)); ctx.stroke();
    ctx.restore();
    if (opts.asym.label) {
      ctx.fillStyle = P.bad; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      ctx.fillText(opts.asym.label, padL + 4, Math.max(10, Y(opts.asym.y) - 4));
    }
  }
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  series.forEach(function(s) {
    ctx.strokeStyle = kindColor(P, s.kind); ctx.lineWidth = 2.2;
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= STEPS; i++) {
      var xv = xMin + (xMax - xMin) * i / STEPS;
      var yv = s.f(xv);
      if (typeof yv !== 'number' || !isFinite(yv)) { started = false; continue; }
      var px = X(xv), py = Yc(yv);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  });
  (opts.marks || []).forEach(function(m) {
    if (typeof m.x !== 'number' || !isFinite(m.x) || m.x < xMin || m.x > xMax) return;
    var cx = X(m.x), cy = Yc(m.y);
    ctx.save();
    ctx.strokeStyle = kindColor(P, m.kind || 'gold'); ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, H - padB); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = kindColor(P, m.kind || 'gold');
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (m.label) {
      ctx.font = '600 10px "IBM Plex Sans", sans-serif';
      var mw = ctx.measureText(m.label).width;
      ctx.fillText(m.label, Math.min(Math.max(2, cx - mw / 2), W - mw - 2), Math.max(10, cy - 9));
    }
  });
  if (typeof opts.at === 'number' && opts.at >= xMin && opts.at <= xMax) {
    ctx.save();
    ctx.strokeStyle = P.bad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(opts.at), H - padB); ctx.lineTo(X(opts.at), padT - 6); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  [xMin, (xMin + xMax) / 2, xMax].forEach(function(v) {
    var lab = fmtX(v), lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, X(v) - lw / 2), W - lw - 1), H - padB + 13);
  });
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var xl = opts.xLabel;
    ctx.fillText(xl, W - padR - ctx.measureText(xl).width, H - 3);
  }
}
/* Grouped bars for the comparisons that are not curves: pay by level and by
   group, a share level by level, two survey answers side by side.
     series[k].err   half length of the whisker drawn on each bar
     opts.hline      a reference level, such as parity or the company mean  */
function drawBarChart(g, groups, series, opts) {
  var ctx = g.ctx, P = palette(), W = g.w, H = g.h;
  opts = opts || {};
  var padL = 56, padR = 12, padT = 22, padB = 30;
  var fmtY = opts.fmtY || function(v) { return intN(v); };
  var yLo = 0, yHi = 0, i, k;
  series.forEach(function(s) {
    s.vals.forEach(function(v, j) {
      if (typeof v !== 'number' || !isFinite(v)) return;
      var e = (s.err && typeof s.err[j] === 'number') ? s.err[j] : 0;
      if (v + e > yHi) yHi = v + e;
      if (v - e < yLo) yLo = v - e;
    });
  });
  if (opts.hline && opts.hline.y > yHi) yHi = opts.hline.y;
  if (typeof opts.yCeil === 'number' && opts.yCeil > yHi) yHi = opts.yCeil;
  if (yHi - yLo < 1e-9) yHi = yLo + 1;
  yHi += (yHi - yLo) * 0.14;
  function Y(v) { return H - padB - (v - yLo) / (yHi - yLo) * (H - padT - padB); }

  ctx.strokeStyle = P.border; ctx.lineWidth = 1;
  ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Mono", monospace';
  for (i = 0; i <= 3; i++) {
    var gv = yLo + (yHi - yLo) * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, Y(gv)); ctx.lineTo(W - padR, Y(gv)); ctx.stroke();
    var gl = fmtY(gv);
    ctx.fillText(gl, Math.max(1, padL - 4 - ctx.measureText(gl).width), Y(gv) + 3);
  }
  if (opts.hline) {
    ctx.save();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 1.5; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(padL, Y(opts.hline.y)); ctx.lineTo(W - padR, Y(opts.hline.y)); ctx.stroke();
    ctx.restore();
    if (opts.hline.label) {
      ctx.fillStyle = P.gold; ctx.font = '600 9px "IBM Plex Sans", sans-serif';
      var hw = ctx.measureText(opts.hline.label).width;
      ctx.fillText(opts.hline.label, W - padR - hw - 2, Math.max(10, Y(opts.hline.y) - 4));
    }
  }
  var nG = groups.length, nS = series.length;
  var slot = (W - padL - padR) / Math.max(1, nG);
  var bw = Math.max(5, (slot * 0.66) / Math.max(1, nS));
  for (i = 0; i < nG; i++) {
    var cx = padL + slot * (i + 0.5);
    var x0 = cx - (bw * nS) / 2;
    for (k = 0; k < nS; k++) {
      var v = series[k].vals[i];
      if (typeof v !== 'number' || !isFinite(v)) continue;
      var bx = x0 + bw * k;
      ctx.fillStyle = kindColor(P, series[k].kind);
      ctx.fillRect(bx + 1, Y(v), bw - 2, Math.max(1, Y(yLo) - Y(v)));
      var e = (series[k].err && typeof series[k].err[i] === 'number') ? series[k].err[i] : 0;
      if (e > 0) {
        ctx.save();
        ctx.strokeStyle = P.text; ctx.lineWidth = 1.2;
        var mx = bx + bw / 2;
        ctx.beginPath();
        ctx.moveTo(mx, Y(v - e)); ctx.lineTo(mx, Y(v + e));
        ctx.moveTo(mx - 4, Y(v - e)); ctx.lineTo(mx + 4, Y(v - e));
        ctx.moveTo(mx - 4, Y(v + e)); ctx.lineTo(mx + 4, Y(v + e));
        ctx.stroke();
        ctx.restore();
      }
      if (opts.valueLabels) {
        ctx.fillStyle = P.text2; ctx.font = '600 8.5px "IBM Plex Mono", monospace';
        var vl = fmtY(v), vw = ctx.measureText(vl).width;
        ctx.fillText(vl, bx + bw / 2 - vw / 2, Math.max(9, Y(v + e) - 4));
      }
    }
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    var lab = groups[i], lw = ctx.measureText(lab).width;
    ctx.fillText(lab, Math.min(Math.max(1, cx - lw / 2), W - lw - 1), H - padB + 13);
  }
  ctx.strokeStyle = P.border; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT - 8); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();
  var legX = padL + 4;
  ctx.font = '600 9.5px "IBM Plex Sans", sans-serif';
  series.forEach(function(s) {
    if (!s.label) return;
    ctx.fillStyle = kindColor(P, s.kind);
    ctx.fillRect(legX, 9, 9, 3);
    ctx.fillText(s.label, legX + 12, 13);
    legX += 12 + ctx.measureText(s.label).width + 12;
  });
  if (opts.xLabel) {
    ctx.fillStyle = P.text3; ctx.font = '9px "IBM Plex Sans", sans-serif';
    ctx.fillText(opts.xLabel, W - padR - ctx.measureText(opts.xLabel).width, H - 3);
  }
}

/* ════════════════════════════════════════════════════════════════════════

function widgetTwoAverages(n0, d0, nTop0, shareM0) {

          : 'The first view lines the payroll up, from the worst paid post to the best paid one, with one line for each group. The two lines run almost together, separated by the same distance, which is the same post gap, until the senior posts appear and one of the two shoots upward. Start by moving the second control, which separates the pay of one and the same post, and watch both gaps on the panel move together. Then leave that control at zero and move the fourth one, which shares out the senior posts: the mean gap grows without a brake while the median gap stays nailed to zero. That contrast is the whole matter. The second view draws it directly, with the two gaps as a function of how many senior posts remain in the hands of men. One line rises and the other does not move, which is why no company can report a single figure and claim it has reported its gap.') + '</div>' +

    var gMean = gapOf(mm, mw), gMed = gapOf(dm, dw);
    host.querySelector('#a1nl').textContent = intN(state.n);

        'la mediana de los hombres es ' + money(dm) + ' y la de las mujeres ' + money(dw) + ', de donde sale una brecha de ' + pct1(gMed) + '  ·  ' +
        'de los ' + intN(state.nTop) + ' puestos de dirección, ' + intN(P.execM) + ' los ocupan hombres  ·  ' +
        'en el mismo puesto la diferencia es ' + money(state.d)
      : 'The mean for men is ' + money(mm) + ' and for women ' + money(mw) + ', which gives a gap of ' + pct1(gMean) + '  ·  ' +
        'the median for men is ' + money(dm) + ' and for women ' + money(dw) + ', which gives a gap of ' + pct1(gMed) + '  ·  ' +
        'of the ' + intN(state.nTop) + ' senior posts, ' + intN(P.execM) + ' are held by men  ·  ' +
        'in the same post the difference is ' + money(state.d);
    var g = fitCanvas(host.querySelector('#a1cv'), 185);
    if (state.view === 'ladder') {
      drawCurveChart(g, 0, state.n - 1, [
        { f: function(x) { return atRank(P.men, x); }, kind: 'green', label: (es ? 'Hombres' : 'Men') },
        { f: function(x) { return atRank(P.wom, x); }, kind: 'gold', label: (es ? 'Mujeres' : 'Women') }
      ], {
        yFloor: 0, fmtY: function(y) { return money(y); }, fmtX: function(x) { return intN(x + 1); },
        marks: [
          { x: (state.n - 1) / 2, y: dm, label: money(dm), kind: 'soft' },
          { x: (state.n - 1) / 2, y: dw, label: money(dw), kind: 'bad' }

        ' Conviene retener tres cosas antes de leer cualquier informe de nómina. La primera es que las dos cifras son correctas y responden a preguntas distintas: la media dice cuánto cuesta la nómina de cada grupo y la mediana dice cómo le va a la persona típica. La segunda es que la media es la única que sirve para calcular lo que costaría cerrar la brecha, porque el presupuesto se paga en pesos totales y no en posiciones. La tercera es que cuando la brecha de la media es mucho mayor que la de la mediana, el problema que hay que investigar no es el tabulador sino quién llega a los puestos de arriba, que es un asunto de promoción y no de sueldo.'
      : '<strong>Business reading:</strong> this company pays men ' + money(mm) + ' on average and women ' + money(mw) + ', a gap of ' + pct1(gMean) + ', while the person sitting exactly in the middle of each group earns ' + money(dm) + ' and ' + money(dw) + ', a gap of ' + pct1(gMed) + '. ' +

          : 'The distance between the two figures is the interesting part: the mean carries the effect of ' + intN(P.execM) + ' senior posts in the hands of men, and the median does not, because one very large salary is still a single record when what is wanted is the middle one.') +
        ' Three things are worth keeping before reading any payroll report. The first is that both figures are correct and answer different questions: the mean says what the payroll of each group costs, and the median says how the typical person is doing. The second is that the mean is the only one that serves to cost out closing the gap, because a budget is paid in total pesos and not in positions. The third is that when the mean gap is much larger than the median gap, the thing to investigate is not the pay scale but who reaches the posts at the top, which is a promotion matter rather than a pay matter.';
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════

var BASE_PAY = 15000;   /* what the entry level pays */

    var midW = Math.min(state.midW, 100 - topW);
    return [
      { pay: BASE_PAY,     m: 50, w: Math.max(0, 100 - topW - midW) },
      { pay: MID_PAY,      m: 35, w: midW },
      { pay: state.topPay, m: 15, w: topW }
    ];
  }
  function mount() {
    var es = LANG === 'es';

    ];

      '<div class="gcrd" data-widget="descomposicion-de-la-brecha-salarial">' +

        '<div class="iw-sub">' + (es

          : 'This company has one hundred men and one hundred women spread over three levels that pay differently. The first view shows the pay of each level for each group and, in the last pair of bars, the average across the whole company. Run the experiment that teaches the most first: set the third control to zero, so that inside each level exactly the same is paid to everyone, and notice that the company gap does not go to zero. There is no trick in that. The gap that remains is not about pay but about posts, which is why moving the first control, the one that shares out the top level, raises and lowers it at will. Then bring the third control back to a positive value and watch the two gaps combine. The second view draws that combination: the green curve is the gap the company reports and the gold line is the part that belongs to the same post, which stays still because it does not depend on how the levels are shared out.') + '</div>' +

        ' La consecuencia práctica es que las dos cifras piden acciones distintas y ninguna sustituye a la otra. Cerrar la parte del mismo puesto es una revisión de tabulador que se puede hacer en un trimestre y que se verifica con la nómina. Cerrar la parte de la estructura no se resuelve con dinero: exige revisar quién es considerado para las vacantes de arriba y por qué, y sus resultados tardan años en aparecer en el promedio. Una empresa que anuncia paridad salarial mostrando solo la primera cifra no está mintiendo, pero está contestando la pregunta más fácil de las dos.'
      : '<strong>Business reading:</strong> the company would report a gap of ' + pct1(rg) + '. Of that figure, ' + pct1(state.same) + ' belongs to what is underpaid inside one and the same level and ' + pct1(sg) + ' to how the levels are shared out, with the top level ' + pct1(state.topW / (state.topW + 15)) + ' in the hands of women. ' +
        (state.same < 0.005
          ? 'Right now the pay scale is identical for everyone, and a gap remains all the same: everything visible comes from the sharing out of posts.'
          : 'The two parts combine rather than add: a gap of ' + pct1(state.same) + ' inside the level and one of ' + pct1(sg) + ' from structure do not give their exact sum but slightly less, because the second applies to what the first has already reduced.') +

  }
  widgets.push(mount);
  mount();
}

          : 'The first view follows one intake into the company as it climbs from level to level. The first bar is the entry level and each bar after it is what remains once a round of promotions has passed. The gold line marks the share they came in with, so the starting point stays in view. Move the second control, which is the promotion rate of women compared with the rate for men, and set it to a value nobody would call scandalous, say ninety percent: then look at the last bar. The fall is far larger than the disadvantage of any single step, because the disadvantage applies once per level rather than once in total. Raise the number of steps and the same effect gets worse with no change in the rate at all. The second view is the one worth taking to a meeting: it draws the share of the last level for every possible relative rate, and shows that the curve collapses to the left of one far faster than it climbs to the right.') + '</div>' +

      : '<strong>Business reading:</strong> an intake entering at ' + pct1(state.s0) + ' women and moving up at ' + dec2(state.rel) + ' times the rate for men at every promotion reaches the last level at ' + pct1(sTop) + ', that is ' + intN(sTop * state.posts) + ' of the ' + intN(state.posts) + ' top posts. ' +

/* ════════════════════════════════════════════════════════════════════════

          : 'A workplace survey asked the staff whether the promotion criteria look clear to them, and the first view shows the percentage in each group who said yes. Bars on their own mislead, so each one carries its margin of error: the range the answer would fall in if the survey were run again. Leave the size of the survey low and the two ranges overlap so much that the difference between the bars does not hold up. Raise it and watch the whiskers shrink, though not in proportion: four times as many responses are needed to halve the margin, and that is why staff surveys are expensive. The fourth control changes the confidence level and shows a trade that is almost never explained: asking for more confidence does not make the measurement better, it only widens the range. The second view sums it up by drawing the margin of the difference against the number of responses, with the observed difference as a reference line: where the curve crosses it sits the size from which the survey can conclude anything at all.') + '</div>' +

      drawBarChart(g,
        es ? ['Mujeres', 'Hombres'] : ['Women', 'Men'],
        [{ label: (es ? 'Responden que sí' : 'Answer yes'), kind: 'green', vals: [state.pw, state.pm], err: [ew, em] }],
        { fmtY: function(y) { return pct0(y); }, valueLabels: true, yCeil: 1,
          xLabel: (es ? 'con su margen de error' : 'with their margin of error') });
    } else {
      drawCurveChart(g, 100, 3000, [
        { f: function(x) { return marginDiff(state.pw, state.pm, x, z); }, kind: 'green', label: (es ? 'Margen de la diferencia' : 'Margin of the difference') }
      ], {
        at: state.n, yFloor: 0, fmtY: function(y) { return nfD(y * 100, 1); }, fmtX: function(x) { return intN(x); },
        hline: { y: Math.abs(d), label: (es ? 'diferencia observada' : 'observed difference') },
        marks: (need >= 100 && need <= 3000) ? [{ x: need, y: Math.abs(d), label: intN(need), kind: 'bad' }] : [],
        xLabel: (es ? 'encuestas por grupo' : 'responses per group')
      });
    }
    host.querySelector('#d4read').innerHTML = es
      ? '<strong>Lectura de negocio:</strong> la encuesta encontró ' + ptsEs(d) + ' de diferencia y, con ' + intN(state.n) + ' respuestas por grupo, un margen de ' + ptsEs(m) + ' al ' + intN(conf) + ' por ciento de confianza. ' +
        (Math.abs(d) <= m
          ? 'El margen se come la diferencia, de modo que el dato no permite afirmar que los dos grupos respondan distinto, y presentarlo como hallazgo sería un error. Harían falta alrededor de ' + intN(need) + ' respuestas por grupo para que una diferencia de este tamaño se pudiera sostener.'
          : 'La diferencia sobrevive al margen, así que el dato sí sostiene que los dos grupos responden distinto. Eso no dice todavía si la diferencia importa: eso lo decide el negocio, no la estadística.') +
        ' Vale la pena guardar tres advertencias que este tablero deja ver. La primera es que el margen de una diferencia es mayor que el de cada porcentaje por separado, porque ambos se miden con error y los dos errores entran en la cuenta, de modo que dos intervalos que se traslapan un poco no implican necesariamente que la diferencia sea nula. La segunda es que el margen encoge con la raíz del número de respuestas, así que duplicar el presupuesto de la encuesta no reduce el margen a la mitad. La tercera es la más importante en la práctica: toda esta aritmética supone que quien respondió es representativo de la plantilla, y en encuestas de clima laboral esa suposición suele ser más frágil que el margen mismo, porque las personas más incómodas con el tema son también las que responden en distinta proporción.'
      : '<strong>Business reading:</strong> the survey found a difference of ' + ptsEn(d) + ' and, with ' + intN(state.n) + ' responses per group, a margin of ' + ptsEn(m) + ' at ' + intN(conf) + ' percent confidence. ' +
        (Math.abs(d) <= m
          ? 'The margin swallows the difference, so the data do not support a claim that the two groups answer differently, and presenting it as a finding would be an error. Around ' + intN(need) + ' responses per group would be needed for a difference of this size to hold up.'
          : 'The difference survives the margin, so the data do support the claim that the two groups answer differently. That does not yet say whether the difference matters: the business decides that, not the statistics.') +
        ' Three warnings from this panel are worth keeping. The first is that the margin of a difference is larger than the margin of either percentage on its own, because both are measured with error and both errors enter the account, so two ranges that overlap slightly do not necessarily mean the difference is nothing. The second is that the margin shrinks with the root of the number of responses, so doubling the survey budget does not halve the margin. The third matters most in practice: all of this arithmetic assumes that whoever answered is representative of the staff, and in workplace surveys that assumption is usually more fragile than the margin itself, because the people most uncomfortable with the subject are also the ones who answer in a different proportion.';
  }
  widgets.push(mount);
  mount();
}

function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];
  document.getElementById('lessonBody').innerHTML = '';

  /* ── every number in the guide comes from the seeded rng ── */

  var c2top  = pick([35000, 42000, 50000], rng);

  var p4lev  = pick([4, 5, 6], rng);

  /* ═══════════════════════ CONCEPT 1 ═══════════════════════ */
  var c1men = [c1b, c1b + c1s, c1b + 2 * c1s, c1b + 3 * c1s, c1b + 3 * c1s + c1dir];
  var c1wom = [c1b - c1d, c1b + c1s - c1d, c1b + 2 * c1s - c1d, c1b + 3 * c1s - c1d, c1b + 3 * c1s - c1d];
  var c1mm = meanOf(c1men),  c1mw = meanOf(c1wom);
  var c1dm = medianOf(c1men), c1dw = medianOf(c1wom);
  var c1gMean = gapOf(c1mm, c1mw), c1gMed = gapOf(c1dm, c1dw);

  addSection(function(L) {
    var es = L === 'es';
    if (es) return '' +
      '<div class="stag">Concepto 1</div>' +
      '<h2>Una brecha no es un número, es una medición</h2>' +
      '<p>La perspectiva de género aplicada a los datos de una empresa no consiste en tener una opinión sobre la desigualdad, sino en medirla bien. Y medirla bien empieza por aceptar que la frase la brecha salarial de esta empresa no designa una cantidad única: designa varias, calculadas de maneras distintas, que responden a preguntas distintas y que pueden diferir entre sí por un factor de tres sin que ninguna esté mal. Quien no distingue cuál está leyendo termina discutiendo con datos que le dan la razón a todos.</p>' +
      '<p>Conviene fijar primero la convención, porque casi todos los errores de reporte vienen de saltársela. La brecha se escribe como la fracción del sueldo de los hombres que falta en el de las mujeres. Se divide entre el sueldo de los hombres y no entre el de las mujeres ni entre el promedio de ambos, y eso importa: la misma pareja de sueldos produce un número distinto con cada denominador, y los tres circulan en la prensa como si fueran el mismo. Cuando un informe dice que las mujeres ganan un porcentaje del sueldo de los hombres está diciendo lo complementario, no la brecha, y confundir ambas cifras es el error más frecuente de todos.</p>' +
      '<p>Fijada la convención, queda la decisión de fondo: qué promedio usar. La <strong>media</strong> suma todos los sueldos y reparte; la <strong>mediana</strong> ordena a las personas y toma el sueldo de en medio. En una nómina simétrica las dos coinciden, pero ninguna nómina real es simétrica: los sueldos tienen un piso natural y ningún techo, así que unos pocos puestos muy altos jalan la media hacia arriba y dejan la mediana donde estaba. Si esos puestos altos están repartidos de forma desigual entre hombres y mujeres, la brecha de la media se ensancha aunque en cada puesto se pague exactamente lo mismo.</p>' +
      '<p>De ahí que los sistemas de reporte serios exijan las dos cifras, y de ahí que la distancia entre ellas sea el primer diagnóstico gratuito de cualquier análisis. Si las dos brechas se parecen, la diferencia está repartida por toda la nómina y apunta al tabulador. Si la de la media es mucho mayor que la de la mediana, la nómina paga parecido en cada puesto y el problema está en quién ocupa los puestos de arriba, que es un asunto de promoción y no de sueldo. Cada diagnóstico manda a un área distinta de la empresa, así que equivocarse de cifra no es un detalle técnico: es dirigir el presupuesto al lugar equivocado.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">Brecha, por convención</div><div class="rform">' + frac('hombres − mujeres', 'hombres') + '</div><div class="rnote">Siempre sobre el sueldo de ellos.</div></div>' +
        '<div class="rcard"><div class="rname">Media</div><div class="rform">suma ÷ personas</div><div class="rnote">Sensible a los puestos altos.</div></div>' +
        '<div class="rcard"><div class="rname">Mediana</div><div class="rform">el sueldo de en medio</div><div class="rnote">Describe a la persona típica.</div></div>' +
        '<div class="rcard"><div class="rname">Diagnóstico</div><div class="rform">media ≫ mediana</div><div class="rnote">El asunto está arriba, no en el tabulador.</div></div>' +
      '</div>' +
      '<p><strong>Ejemplo resuelto.</strong> Una consultoría en Colima tiene diez personas en nómina, cinco hombres y cinco mujeres. Los sueldos mensuales de ellos son ' + money(c1men[0]) + ', ' + money(c1men[1]) + ', ' + money(c1men[2]) + ', ' + money(c1men[3]) + ' y ' + money(c1men[4]) + ', este último del socio director. Los de ellas son ' + money(c1wom[0]) + ', ' + money(c1wom[1]) + ', ' + money(c1wom[2]) + ', ' + money(c1wom[3]) + ' y ' + money(c1wom[4]) + '. La dirección pide la brecha para su informe anual.</p>' +
      '<div class="callout"><p><strong>Paso 1.</strong> La media de ellos es ' + money(c1mm) + ' y la de ellas ' + money(c1mw) + '. La brecha de la media es de ' + pct1(c1gMean) + '.<br>' +

      '<strong>Paso 3.</strong> Las dos cifras son correctas y difieren por una razón concreta: el sueldo del socio director, ' + money(c1men[4]) + ', entra completo en la media de ellos y ni siquiera se asoma a la mediana, porque para el cálculo de la mediana un sueldo enorme es un dato más de la fila.<br>' +
      '<strong>Paso 4.</strong> La diferencia de sueldo entre personas del mismo escalón es de ' + money(c1d) + ', que sobre el escalón de en medio representa esa brecha de ' + pct1(c1gMed) + '. Todo lo demás hasta ' + pct1(c1gMean) + ' proviene de un solo puesto.<br>' +
      '<strong>Lectura de negocio.</strong> Si la consultoría publica solo ' + pct1(c1gMed) + ' está describiendo a su plantilla típica y ocultando que el puesto mejor pagado no rota; si publica solo ' + pct1(c1gMean) + ' sugiere una desigualdad de tabulador que sus propios datos no sostienen. Las dos cifras juntas, en cambio, dicen algo accionable en una frase: en esta consultoría se paga casi igual por el mismo trabajo y no se llega igual a la dirección.</p></div>';
    return '' +
      '<div class="stag">Concept 1</div>' +
      '<h2>A gap is not a number, it is a measurement</h2>' +
      '<p>A gender perspective applied to company data is not a matter of holding an opinion about inequality; it is a matter of measuring it properly. And measuring it properly starts by accepting that the phrase the pay gap of this company does not name one quantity. It names several, computed in different ways, answering different questions, and capable of differing from one another by a factor of three without any of them being wrong. Anyone who does not know which one is on the page ends up in an argument where the data appear to support everybody.</p>' +
      '<p>The convention comes first, because most reporting errors come from skipping it. The gap is written as the fraction of male pay that is missing from female pay. It is divided by male pay and not by female pay nor by the average of the two, and that matters: the same pair of salaries yields a different number under each denominator, and all three circulate in the press as though they were one figure. When a report says that women earn a percentage of what men earn, it is stating the complement rather than the gap, and confusing those two figures is the most common error of all.</p>' +
      '<p>With the convention fixed, the substantive decision remains: which average to use. The <strong>mean</strong> adds every salary and shares it out; the <strong>median</strong> lines people up and takes the middle salary. In a symmetric payroll the two coincide, but no real payroll is symmetric: pay has a natural floor and no ceiling, so a few very high posts pull the mean upward and leave the median where it was. If those high posts are shared unevenly between women and men, the gap on the mean widens even where every post pays exactly the same to everyone in it.</p>' +
      '<p>That is why serious reporting regimes require both figures, and why the distance between them is the first free diagnosis in any analysis. If the two gaps look alike, the difference is spread across the whole payroll and points at the pay scale. If the one on the mean is much larger than the one on the median, the payroll pays similarly within each post and the matter lies in who holds the posts at the top, which is a promotion question rather than a pay question. Each diagnosis sends the work to a different part of the company, so picking the wrong figure is not a technical detail: it points the budget at the wrong place.</p>' +
      '<div class="rules-grid">' +
        '<div class="rcard"><div class="rname">The gap, by convention</div><div class="rform">' + frac('men − women', 'men') + '</div><div class="rnote">Always over what men are paid.</div></div>' +
        '<div class="rcard"><div class="rname">Mean</div><div class="rform">total ÷ people</div><div class="rnote">Sensitive to the top posts.</div></div>' +
        '<div class="rcard"><div class="rname">Median</div><div class="rform">the middle salary</div><div class="rnote">Describes the typical person.</div></div>' +
        '<div class="rcard"><div class="rname">Diagnosis</div><div class="rform">mean ≫ median</div><div class="rnote">The matter is upstairs, not in the scale.</div></div>' +
      '</div>' +
      '<p><strong>Worked example.</strong> A consultancy in Colima has ten people on the payroll, five men and five women. The monthly salaries of the men are ' + money(c1men[0]) + ', ' + money(c1men[1]) + ', ' + money(c1men[2]) + ', ' + money(c1men[3]) + ' and ' + money(c1men[4]) + ', the last one belonging to the managing partner. Those of the women are ' + money(c1wom[0]) + ', ' + money(c1wom[1]) + ', ' + money(c1wom[2]) + ', ' + money(c1wom[3]) + ' and ' + money(c1wom[4]) + '. Management asks for the gap for the annual report.</p>' +
      '<div class="callout"><p><strong>Step 1.</strong> The mean for the men is ' + money(c1mm) + ' and for the women ' + money(c1mw) + '. The gap on the mean is ' + pct1(c1gMean) + '.<br>' +
      '<strong>Step 2.</strong> With the five salaries of each group lined up, the middle one is ' + money(c1dm) + ' for the men and ' + money(c1dw) + ' for the women. The gap on the median is ' + pct1(c1gMed) + '.<br>' +
      '<strong>Step 3.</strong> Both figures are correct and they differ for a concrete reason: the salary of the managing partner, ' + money(c1men[4]) + ', enters the mean of the men in full and does not even come into view in the median, because for the median an enormous salary is one more record in the line.<br>' +
      '<strong>Step 4.</strong> The pay difference between people on the same rung is ' + money(c1d) + ', which on the middle rung amounts to that gap of ' + pct1(c1gMed) + '. Everything else up to ' + pct1(c1gMean) + ' comes from a single post.<br>' +
      '<strong>Business reading.</strong> If the consultancy publishes only ' + pct1(c1gMed) + ' it is describing its typical staff and hiding the fact that the best paid post does not rotate; if it publishes only ' + pct1(c1gMean) + ' it suggests an inequality of pay scale that its own data do not support. The two figures together, on the other hand, say something actionable in one sentence: in this consultancy the same work is paid almost the same, and the route to the top is not the same.</p></div>';
  });

  widgetTwoAverages(w1n, w1d, w1t, w1s);

  /* ── Item 1 ── */
  var s1raw  = gapOf(p1mM, p1mW);
  var s1pool = (p1mM + p1mW) / 2;
  var o1 = valOpts(s1raw, [p1dif / p1mW, p1mW / p1mM, p1dif / s1pool], pct1, rng);
  var q1i = {
    title: { es: 'El informe anual de la cadena de farmacias', en: 'The annual report of the pharmacy chain' },
    q: { es: 'Una cadena de farmacias en Colima cerró el año con ' + intN(p1nM) + ' hombres y ' + intN(p1nW) + ' mujeres en nómina. El área de recursos humanos calculó el sueldo mensual promedio de cada grupo: ' + money(p1mM) + ' entre los hombres y ' + money(p1mW) + ' entre las mujeres. El informe anual debe reportar la brecha salarial con la convención que usan los reportes públicos, es decir como la parte del sueldo de los hombres que falta en el de las mujeres. ¿Qué cifra debe publicar la empresa?',
        en: 'A pharmacy chain in Colima closed the year with ' + intN(p1nM) + ' men and ' + intN(p1nW) + ' women on the payroll. Human resources worked out the average monthly pay of each group: ' + money(p1mM) + ' among the men and ' + money(p1mW) + ' among the women. The annual report has to state the pay gap under the convention public reports use, that is, as the part of male pay that is missing from female pay. What figure should the company publish?' },
    opts: { es: o1.es, en: o1.en },
    hint: { es: 'Empieza por la diferencia entre los dos promedios, que está en pesos. Para volverla un porcentaje hay que dividirla entre algo, y la convención dice exactamente entre qué: entre el sueldo del grupo que sirve de referencia, no entre el otro ni entre una mezcla de los dos. Fíjate también en que las cifras de personal no entran aquí, porque cada promedio ya se calculó dentro de su propio grupo.',
            en: 'Start from the difference between the two averages, which is in pesos. Turning it into a percentage means dividing it by something, and the convention says exactly by what: by the pay of the group used as the reference, not by the other one and not by a blend of the two. Note as well that the headcounts do not enter here, because each average was already worked out within its own group.' },
    exp: { es: 'La diferencia entre los promedios es ' + money(p1dif) + ', y sobre el sueldo de los hombres representa ' + pct1(s1raw) + ', que es la cifra que pide la convención. La opción de ' + pct1(p1dif / p1mW) + ' divide la misma diferencia entre el sueldo de las mujeres: responde a cuánto tendrían que subir ellas para alcanzarlos, que es una pregunta legítima pero distinta, y siempre da un número mayor. La de ' + pct1(p1mW / p1mM) + ' es la parte del sueldo de los hombres que ellas sí ganan, es decir lo contrario de la brecha; publicar ese número como brecha convertiría una empresa casi equitativa en una empresa escandalosa. Y la de ' + pct1(p1dif / s1pool) + ' divide entre el promedio de los dos sueldos, un denominador que no corresponde a ningún grupo real y que impide comparar la cifra con la de cualquier otra empresa. Conviene notar que los ' + intN(p1nM) + ' hombres y las ' + intN(p1nW) + ' mujeres no intervienen en esta cuenta: harían falta si hubiera que combinar los dos grupos en un solo promedio.',
           en: 'The difference between the averages is ' + money(p1dif) + ', and against male pay it comes to ' + pct1(s1raw) + ', which is the figure the convention asks for. The option of ' + pct1(p1dif / p1mW) + ' divides the same difference by female pay: it answers how much women would have to rise to catch up, a legitimate but different question, and it always gives a larger number. The one of ' + pct1(p1mW / p1mM) + ' is the part of male pay that women do earn, that is, the opposite of the gap; publishing that number as the gap would turn an almost equitable company into a scandalous one. And the one of ' + pct1(p1dif / s1pool) + ' divides by the average of the two salaries, a denominator belonging to no real group and one that makes the figure impossible to compare with any other company. It is worth noting that the ' + intN(p1nM) + ' men and the ' + intN(p1nW) + ' women play no part in this calculation: they would be needed if the two groups had to be combined into a single average.' }
  };
  var d1 = mk(q1i, o1.correctIdx, true);
  problems.push({ i18n: d1.i18n, title: d1.title, questionText: d1.questionText, options: d1.options, correctIdx: d1.correctIdx, explanation: d1.explanation, hint: d1.hint, showWork: true, studentChoice: null, pendingChoice: null });
  buildOneCard(problems[problems.length - 1], problems.length - 1);

  /* ── Item 2 ── */
  var o2 = shuffleOpts(
    ['Que en esta empresa se paga de forma parecida dentro de cada puesto y la diferencia se concentra en quién ocupa los mejor pagados, porque unos pocos sueldos muy altos jalan la media y no mueven la mediana.',
     'Que una de las dos cifras está mal calculada, porque la media y la mediana miden lo mismo y solo pueden separarse tanto si hubo un error en la base de datos.',
     'Que la mediana es la cifra confiable y la media debe descartarse del informe, porque cualquier promedio afectado por valores extremos deja de ser representativo de la plantilla.',
     'Que la empresa paga sueldos distintos a hombres y mujeres que hacen exactamente el mismo trabajo, y que la brecha de la media es la medida correcta de esa diferencia.'],
    ['That this company pays similarly within each post and that the difference is concentrated in who holds the best paid ones, because a few very high salaries pull the mean and leave the median untouched.',
     'That one of the two figures has been miscalculated, because the mean and the median measure the same thing and can only separate this far if the database contains an error.',
     'That the median is the reliable figure and the mean should be dropped from the report, because any average affected by extreme values stops representing the staff.',
     'That the company pays different salaries to women and men doing exactly the same work, and that the gap on the mean is the correct measure of that difference.'], rng);
  var q2i = {
    title: { es: 'Dos cifras en el mismo informe', en: 'Two figures in the same report' },
    q: { es: 'Una empresa de logística en Manzanillo publica su informe de equidad y reporta dos brechas salariales: ' + intN(p2mean) + '% calculada sobre los sueldos medios y ' + intN(p2med) + '% calculada sobre los sueldos medianos. Un integrante del consejo pide que se corrija el documento porque, según él, no puede haber dos brechas distintas en la misma empresa. El área de análisis confirma que ambas cifras salieron de la misma base de datos y que ninguna tiene errores. ¿Qué le dice esa pareja de cifras al consejo?',
        en: 'A logistics company in Manzanillo publishes its equity report and states two pay gaps: ' + intN(p2mean) + '% worked out on mean pay and ' + intN(p2med) + '% worked out on median pay. A board member asks for the document to be corrected because, as he sees it, one company cannot have two different gaps. The analysis team confirms that both figures came from the same database and that neither contains an error. What does that pair of figures tell the board?' },
    opts: { es: o2.es, en: o2.en },
