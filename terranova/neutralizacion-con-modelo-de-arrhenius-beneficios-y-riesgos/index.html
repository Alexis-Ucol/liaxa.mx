      exp:{ es:'El daño en el arroyo lo causan los iones hidrógeno en exceso del residuo. La cal aporta iones hidróxido que se unen a ellos y forman agua, mientras los iones que sobran forman una sal disuelta: los iones agresivos dejaron de existir como tales, y por eso la lectura sube de verdad y no por dilución. Aumentar el volumen con agua sí sería tapar el problema, porque los mismos iones seguirían presentes.',
            en:'The damage in the stream is caused by the excess hydrogen ions of the waste. Lime provides hydroxide ions that join them and form water, while the ions left over form a dissolved salt: the aggressive ions stopped existing as such, and that is why the reading truly rises and not by dilution. Increasing the volume with water would indeed be covering the problem up, because the same ions would still be present.' } },
    { title:{ es:'La pastilla y el estómago', en:'The tablet and the stomach' },
      showWork:true,
      q:{ es:'El jugo del estómago tiene pH ' + ph + ' gracias al ácido clorhídrico que produce. Después de una comida pesada, alguien toma una pastilla con hidróxido de magnesio y el ardor cede. Otra persona propone que sería mejor tomar varias pastillas juntas para quedar protegido todo el día. ¿Qué análisis es correcto?',
          en:'Stomach juice has pH ' + ph + ' thanks to the hydrochloric acid it produces. After a heavy meal, someone takes a tablet with magnesium hydroxide and the burning eases. Another person suggests it would be better to take several tablets at once to stay protected all day. Which analysis is correct?' },
      opts:{ es:['La pastilla neutraliza el ácido de más y forma una sal y agua, pero tomar varias eleva demasiado el pH y estorba la digestión',
                 'La pastilla neutraliza el ácido de más, así que tomar varias juntas protege por más horas sin ninguna consecuencia',
                 'La pastilla recubre la pared del estómago sin reaccionar, de modo que la cantidad tomada no cambia el resultado',
                 'La pastilla elimina para siempre el ácido del estómago, por lo que basta con una sola dosis a la semana'],
             en:['The tablet neutralizes the excess acid and forms a salt and water, but taking several raises the pH too much and hinders digestion',
                 'The tablet neutralizes the excess acid, so taking several at once protects for more hours with no consequence at all',
                 'The tablet coats the stomach wall without reacting, so the amount taken does not change the result',
                 'The tablet removes the stomach acid forever, so a single dose a week is enough'] },
      ci:0,
      hint:{ es:'La dosis correcta es la que empareja al ácido de más; por encima de esa cantidad los iones hidróxido que sobran cambian el medio donde ocurre la digestión.',
             en:'The right dose is the one that pairs up the excess acid; above that amount the leftover hydroxide ions change the medium where digestion happens.' },
      exp:{ es:'El hidróxido de magnesio aporta iones hidróxido que se unen a los iones hidrógeno del jugo gástrico: se forman agua y una sal, y el pH sube hacia un valor tolerable. Pasarse de dosis deja iones hidróxido de sobra, sube el pH más de lo debido y el estómago pierde la acidez que necesita para digerir, además de que el cuerpo repone el ácido en cuanto la comida sigue su curso. Es el mismo criterio de siempre: el beneficio depende de la dosis.',
            en:'Magnesium hydroxide provides hydroxide ions that join the hydrogen ions of the gastric juice: water and a salt form, and the pH rises towards a tolerable value. Going over the dose leaves hydroxide ions to spare, raises the pH more than it should and the stomach loses the acidity it needs to digest, besides which the body replaces the acid as soon as the food goes on its way. It is the usual criterion: the benefit depends on the dose.' } }
  ]);
}

/* ══════════════════════════════════════════════════════════════════════════
   BUILD LESSON - concepto, manipulativo y problemas, intercalados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Dos sustancias que se cancelan y dejan algo nuevo', en:'Two substances that cancel out and leave something new' }),
    '<p>' + L({
      es:'Una pastilla que corta el ardor de estómago, un puñado de cal sobre un suelo que ya no da cosecha, un bidón de residuo que un laboratorio no puede tirar al drenaje y la sal que le pones a la comida tienen algo en común: los cuatro son el resultado de poner juntos un ácido y una base. Cuando eso ocurre, las dos sustancias dejan de comportarse como lo hacían y en su lugar aparecen otras dos.',
      en:'A tablet that stops heartburn, a handful of lime on soil that no longer yields a crop, a drum of waste a laboratory cannot pour down the drain and the salt you put on your food have something in common: all four are the result of putting an acid and a base together. When that happens, the two substances stop behaving as they did and two others appear in their place.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a seguir esa reacción desde el principio: qué suelta cada sustancia al caer al agua, qué se forma cuando esos pedazos se reparten, cuánta base hace falta exactamente para que no sobre nada y qué se puede hacer con todo eso, desde fabricar un fertilizante hasta dejar un residuo en condiciones de desecharse. Al final vas a poder decidir, con argumentos, cuándo conviene usar una de estas sustancias y cuándo el riesgo pesa más que el beneficio.',
      en:'In this guide you will follow that reaction from the beginning: what each substance releases when it falls into water, what forms when those pieces are shared out, how much base is needed exactly so that nothing is left over and what can be done with all of it, from making a fertilizer to leaving a waste fit for disposal. By the end you will be able to decide, with arguments, when one of these substances is worth using and when the risk weighs more than the benefit.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a poder decidir', en:'What you will be able to decide' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'iones que libera cada sustancia', en:'ions each substance releases' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'modelo de Arrhenius', en:'Arrhenius model' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'productos de la neutralización', en:'products of neutralization' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'nombre de la sal', en:'name of the salt' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'punto de equivalencia', en:'equivalence point' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'tratamiento de residuos', en:'waste treatment' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'beneficios y riesgos', en:'benefits and risks' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Lo que cada sustancia suelta al caer al agua', en:'What each substance releases when it falls into water' }),
    '<p>' + L({
      es:'Arrhenius propuso una idea sencilla y muy poderosa: lo que decide el comportamiento de una disolución es la partícula con carga que la sustancia deja libre al disolverse. Si al separarse aparecen iones hidrógeno, la disolución es ácida. Si aparecen iones hidróxido, es básica. Y si al disolverse no queda ninguno de esos dos, la disolución no pertenece a ninguna de las dos familias por más que conduzca la electricidad.',
      en:'Arrhenius put forward a simple and very powerful idea: what decides the behaviour of a solution is the charged particle the substance sets free when it dissolves. If hydrogen ions appear as it splits, the solution is acidic. If hydroxide ions appear, it is basic. And if neither of those two is left when it dissolves, the solution belongs to neither family no matter how well it conducts electricity.'
    }) + '</p>' +
    '<p>' + L({
      es:'La fórmula escrita en la etiqueta anticipa lo que va a ocurrir. El cloruro de hidrógeno se separa en un ion hidrógeno y un ion cloruro; el hidróxido de sodio, en un ion sodio y un ion hidróxido; el hidróxido de calcio, en un ion calcio y sus iones hidróxido. Fíjate en que la sustancia se separa completa y en piezas que se mantienen unidas: del ácido sulfúrico no salen átomos de azufre y de oxígeno por su lado, sino un ion sulfato entero. Esas piezas son las que después van a repartirse.',
      en:'The formula written on the label tells in advance what is going to happen. Hydrogen chloride splits into a hydrogen ion and a chloride ion; sodium hydroxide, into a sodium ion and a hydroxide ion; calcium hydroxide, into a calcium ion and its hydroxide ions. Notice that the substance splits as a whole and into pieces that stay together: out of sulfuric acid, sulfur and oxygen atoms do not come separately, but a whole sulfate ion. Those pieces are the ones that will be shared out later.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Ácido', en:'Acid' }), L({ es:'suelta H<sup>+</sup>', en:'releases H<sup>+</sup>' }), L({ es:'el ion hidrógeno es el que lo define, venga de donde venga', en:'the hydrogen ion is what defines it, wherever it comes from' })) +
      rcard(L({ es:'Base', en:'Base' }), L({ es:'suelta OH<sup>-</sup>', en:'releases OH<sup>-</sup>' }), L({ es:'el grupo OH de la fórmula anticipa el resultado', en:'the OH group in the formula anticipates the result' })) +
      rcard(L({ es:'La otra pieza', en:'The other piece' }), L({ es:'entera', en:'whole' }), L({ es:'el nitrato y el sulfato quedan como una sola pieza con carga', en:'nitrate and sulfate stay as a single charged piece' })) +
      rcard(L({ es:'Ni una ni otra', en:'Neither one' }), L({ es:'sin H<sup>+</sup> ni OH<sup>-</sup>', en:'no H<sup>+</sup> or OH<sup>-</sup>' }), L({ es:'hay iones y conduce, pero la lectura se queda en 7', en:'there are ions and it conducts, but the reading stays at 7' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Conducir la electricidad y ser ácido o básico son dos cosas distintas. Lo primero avisa que hay iones; solo la identidad de esos iones decide la familia.',
      en:'Conducting electricity and being acidic or basic are two different things. The first warns that there are ions; only the identity of those ions decides the family.'
    }) + '</p></div>'
  );
  wDisocia(rng, widgetHost(s1, 'wDisocia', 'disocia'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'El reparto: siempre agua, y una sal con nombre propio', en:'The sharing out: always water, and a salt with its own name' }),
    '<p>' + L({
      es:'Cuando un ácido y una base se mezclan, sobre la mesa quedan cuatro tipos de iones: los dos que aportó el ácido y los dos que aportó la base. El ion hidrógeno y el ion hidróxido se buscan de inmediato y forman agua, que es una sustancia neutra y explica por qué la lectura se acerca a 7. Los dos iones restantes, el metal de la base y la pieza que traía el ácido, se quedan emparejados en la disolución y forman una sal.',
      en:'When an acid and a base mix, four kinds of ions are left on the bench: the two the acid provided and the two the base provided. The hydrogen ion and the hydroxide ion look for each other at once and form water, which is a neutral substance and explains why the reading moves close to 7. The two remaining ions, the metal of the base and the piece the acid brought, stay paired in the solution and form a salt.'
    }) + '</p>' +
    '<p>' + L({
      es:'El agua aparece siempre, sin importar con qué ácido y con qué base se empezó. Lo único que cambia es la sal, y su nombre se lee como un acta de origen: la primera palabra repite al ion que venía del ácido, y la segunda, al metal que venía de la base. Un ácido clorhídrico deja cloruros, uno nítrico deja nitratos y uno sulfúrico deja sulfatos; un hidróxido de sodio pone sodio y uno de calcio pone calcio. Por eso se puede trabajar en los dos sentidos: predecir la sal a partir de los reactivos, o deducir los reactivos a partir de la sal obtenida.',
      en:'Water always appears, whatever acid and whatever base were used at the start. The only thing that changes is the salt, and its name reads like a certificate of origin: the first word repeats the ion that came from the acid, and the second, the metal that came from the base. Hydrochloric acid leaves chlorides, nitric acid leaves nitrates and sulfuric acid leaves sulfates; sodium hydroxide puts in sodium and calcium hydroxide puts in calcium. That is why you can work in both directions: predicting the salt from the reagents, or deducing the reagents from the salt obtained.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'El agua', en:'The water' }), L({ es:'H<sup>+</sup> con OH<sup>-</sup>', en:'H<sup>+</sup> with OH<sup>-</sup>' }), L({ es:'aparece en toda neutralización, sin excepción', en:'it appears in every neutralization, without exception' })) +
      rcard(L({ es:'La sal', en:'The salt' }), L({ es:'metal con la otra pieza', en:'metal with the other piece' }), L({ es:'queda disuelta y se recupera al evaporar el agua', en:'it stays dissolved and is recovered by evaporating the water' })) +
      rcard(L({ es:'Primer nombre', en:'First name' }), L({ es:'lo pone el ácido', en:'set by the acid' }), L({ es:'cloruro, nitrato o sulfato según el ácido usado', en:'chloride, nitrate or sulfate depending on the acid used' })) +
      rcard(L({ es:'Segundo nombre', en:'Second name' }), L({ es:'lo pone la base', en:'set by the base' }), L({ es:'sodio, potasio o calcio según el hidróxido usado', en:'sodium, potassium or calcium depending on the hydroxide used' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Neutralizar no es hacer desaparecer nada. Los iones que hacían agresiva a cada disolución quedan convertidos en agua y en una sal, que son sustancias distintas de las de partida.',
      en:'Neutralizing is not making anything disappear. The ions that made each solution aggressive end up turned into water and into a salt, which are substances different from the starting ones.'
    }) + '</p></div>'
  );
  wEmpareja(rng, widgetHost(s2, 'wEmpareja', 'empareja'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Cuánta base hace falta para que no sobre nada', en:'How much base is needed so that nothing is left over' }),
    '<p>' + L({
      es:'Saber qué se forma no basta: hay que saber cuánto agregar. La neutralización queda completa cuando cada ion hidrógeno del vaso encontró un ion hidróxido, ni uno más ni uno menos. A ese momento se le llama punto de equivalencia, y no depende de los mililitros sino de cuántas unidades de ion aporta cada mililitro. Una base concentrada aporta muchas por mililitro y alcanza con poco volumen; una diluida aporta pocas y hace falta mucho más.',
      en:'Knowing what forms is not enough: you have to know how much to add. Neutralization is complete when every hydrogen ion in the glass has found a hydroxide ion, not one more and not one less. That moment is called the equivalence point, and it does not depend on the millilitres but on how many ion units each millilitre provides. A concentrated base provides many per millilitre and a small volume is enough; a dilute one provides few and much more is needed.'
    }) + '</p>' +
    '<p>' + L({
      es:'En el laboratorio ese punto se busca agregando la base poco a poco, con un indicador que avise. Con fenolftaleína, la mezcla se mantiene incolora mientras sobre ácido y aparece un rosa que ya no se va justo cuando el último ion hidrógeno queda emparejado. Pasarse tiene consecuencias: los iones hidróxido que entran de más se quedan libres, la mezcla se vuelve básica y el resultado ya no sirve si lo que se quería era un producto neutro. Por eso se agrega despacio y se mide.',
      en:'In the laboratory that point is looked for by adding the base little by little, with an indicator that gives warning. With phenolphthalein, the mixture stays colourless while acid is left over and a pink that no longer fades appears just as the last hydrogen ion is paired up. Going past has consequences: the hydroxide ions that come in beyond that stay free, the mixture turns basic and the result is no longer of use if what was wanted was a neutral product. That is why it is added slowly and measured.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Lo que se iguala', en:'What is matched' }), L({ es:'unidades de ion', en:'ion units' }), L({ es:'no los mililitros: dos disoluciones rara vez aportan lo mismo', en:'not the millilitres: two solutions rarely provide the same' })) +
      rcard(L({ es:'Antes del punto', en:'Before the point' }), L({ es:'sobra ácido', en:'acid left over' }), L({ es:'quedan iones hidrógeno sin pareja y la mezcla sigue ácida', en:'hydrogen ions are left unpaired and the mixture stays acidic' })) +
      rcard(L({ es:'En el punto', en:'At the point' }), L({ es:'nada sobra', en:'nothing left over' }), L({ es:'solo quedan la sal disuelta y el agua formada', en:'only the dissolved salt and the water formed are left' })) +
      rcard(L({ es:'Después del punto', en:'After the point' }), L({ es:'sobra base', en:'base left over' }), L({ es:'los iones hidróxido libres suben la lectura por encima de 7', en:'the free hydroxide ions push the reading above 7' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Dos vasos con el mismo volumen pueden pedir cantidades de base muy distintas. La pregunta útil nunca es cuántos mililitros hay, sino cuántas unidades de ion hay dentro de ellos.',
      en:'Two glasses with the same volume can ask for very different amounts of base. The useful question is never how many millilitres there are, but how many ion units are inside them.'
    }) + '</p></div>'
  );
  wTitula(rng, widgetHost(s3, 'wTitula', 'titula'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Neutralizar con un propósito: productos útiles y residuos tratados', en:'Neutralizing with a purpose: useful products and treated waste' }),
    '<p>' + L({
      es:'Esta reacción se usa a propósito todos los días. Una pastilla antiácida lleva una base suave que empareja el ácido de más del estómago. La cal corrige un suelo demasiado ácido y devuelve la parcela al cultivo. Muchas sales que se venden por kilo, desde fertilizantes hasta la sal de mesa, se obtienen mezclando el ácido y la base adecuados y evaporando después el agua. Diseñar la reacción consiste en elegir los reactivos que dejan la sal que se quiere y en detenerse en el punto justo.',
      en:'This reaction is used on purpose every day. An antacid tablet carries a mild base that pairs up the excess acid of the stomach. Lime corrects soil that is too acidic and returns the plot to cultivation. Many salts sold by the kilo, from fertilizers to table salt, are obtained by mixing the right acid and base and then evaporating the water. Designing the reaction means choosing the reagents that leave the salt you want and stopping at the exact point.'
    }) + '</p>' +
    '<p>' + L({
      es:'El otro uso es tratar lo que sobra. Un residuo con una lectura muy baja o muy alta no puede ir al drenaje, porque los iones en exceso atacan las tuberías y matan la vida del cuerpo de agua que lo recibe; por eso las reglas de descarga exigen un intervalo cercano al centro de la escala. El tratamiento consiste en agregar la familia contraria y medir hasta entrar en ese intervalo. Agregar agua no sirve: reparte los mismos iones en más volumen y haría falta multiplicar el volumen por diez para mover una sola unidad.',
      en:'The other use is treating what is left over. A waste with a very low or very high reading cannot go into the drain, because the excess ions attack the pipes and kill the life of the body of water that receives it; that is why discharge rules demand a range close to the centre of the scale. Treatment means adding the opposite family and measuring until the reading enters that range. Adding water is of no use: it spreads the same ions through more volume and the volume would have to be multiplied by ten to move a single unit.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Antiácido', en:'Antacid' }), L({ es:'base suave', en:'mild base' }), L({ es:'empareja el ácido de más y forma una sal y agua', en:'it pairs up the excess acid and forms a salt and water' })) +
      rcard(L({ es:'Suelo ácido', en:'Acidic soil' }), L({ es:'cal', en:'lime' }), L({ es:'sube la lectura del terreno y permite volver a sembrar', en:'it raises the reading of the land and lets sowing start again' })) +
      rcard(L({ es:'Sal a la medida', en:'Salt to measure' }), L({ es:'elegir reactivos', en:'choose the reagents' }), L({ es:'mezclar hasta el punto justo y evaporar el agua', en:'mix to the exact point and evaporate the water' })) +
      rcard(L({ es:'Residuo', en:'Waste' }), L({ es:'familia contraria', en:'opposite family' }), L({ es:'medir hasta entrar en el intervalo permitido de descarga', en:'measure until entering the allowed discharge range' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Diluir y neutralizar no son lo mismo. El agua reparte los iones; solo la familia contraria los transforma en agua y en una sal.',
      en:'Diluting and neutralizing are not the same thing. Water spreads the ions out; only the opposite family turns them into water and into a salt.'
    }) + '</p></div>'
  );
  wResiduos(rng, widgetHost(s4, 'wResiduos', 'residuos'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Lo que resuelven y lo que pueden dañar', en:'What they solve and what they can damage' }),
    '<p>' + L({
      es:'Los beneficios de estas sustancias son enormes y muy visibles: conservan alimentos, fabrican jabones, alivian una molestia, recuperan un suelo, limpian una cocina y permiten devolver agua tratada a un río. Casi todos esos usos dependen, de una forma o de otra, de la reacción que has estado estudiando. Ninguno de ellos es gratuito, porque las mismas propiedades que hacen útil a un producto son las que lo vuelven peligroso.',
      en:'The benefits of these substances are huge and very visible: they preserve food, make soaps, ease a discomfort, recover a soil, clean a kitchen and make it possible to return treated water to a river. Almost all those uses depend, one way or another, on the reaction you have been studying. None of them is free, because the same properties that make a product useful are the ones that make it dangerous.'
    }) + '</p>' +
    '<p>' + L({
      es:'Conviene separar dos clases de riesgo. Está el que cae sobre una persona: una salpicadura de un producto muy alejado del centro de la escala quema la piel y los ojos, y mezclar dos limpiadores distintos puede liberar gases irritantes en un cuarto cerrado, además de gastar en la mezcla los iones que servían para limpiar. Y está el que cae sobre un lugar: la lluvia acidificada por gases de combustión afecta lagos y suelos, y un residuo vertido sin tratar arruina un arroyo completo. Evaluar significa poner beneficio y riesgo lado a lado, con la dosis, el lugar y las condiciones de uso a la vista, y no quedarse con la mitad que conviene al anuncio.',
      en:'It is worth separating two kinds of risk. There is the one that falls on a person: a splash of a product far from the centre of the scale burns skin and eyes, and mixing two different cleaners can release irritating gases in a closed room, besides spending in the mixture the very ions that were meant to clean. And there is the one that falls on a place: rain made acidic by combustion gases affects lakes and soils, and an untreated waste ruins a whole stream. Evaluating means putting benefit and risk side by side, with the dose, the place and the conditions of use in sight, and not keeping only the half that suits the advertisement.'

<script>

    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;

    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
