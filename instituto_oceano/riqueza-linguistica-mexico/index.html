<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riqueza Lingüística de México en la Literatura</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Riqueza Lingüística de México en la Literatura</div>
    <div class="wcourse" id="wcourse-el">Español · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Riqueza Lingüística de México en la Literatura</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#0c6cb4', primaryDark:'#032f50', primaryBg:'#e5f0f8',
  accent:'#9ccce4', accentBg:'#e3f0f7',
  darkPrimary:'#3191d8', darkPrimaryDark:'#64b7f6', darkPrimaryBg:'#052741',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

  document.getElementById('restoreBar').style.display = 'none';

  var att = currentAttempt(name, group);

  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;

    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp1_t06_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

  var C = CORPORA[Math.floor(rng() * CORPORA.length)];

  /* ───────── indexado y render de los textos ───────── */
  function prep(tx) {
    if (tx.figs) return tx;
    var figs = [];
    tx.paras.forEach(function (p) {
      p.forEach(function (ch) { if (ch.r) { ch.id = tx.title.es.slice(0, 3) + figs.length; figs.push(ch); } });
    });
    tx.figs = figs;
    return tx;
  }
  prep(C.t1); prep(C.t2);

  function textHTML(tx, mode, marks) {
    var html = '<div class="dtext"><div class="dtitle">' + L(tx.title) + ' · ' + L(tx.meta) + '</div>';
    tx.paras.forEach(function (p) {
      html += '<span class="dpara">';
      p.forEach(function (ch) {
        var txt = L(ch);
        if (!ch.r) { html += txt; return; }
        if (mode === 'tap') {
          html += '<span class="xchip' + ((marks && marks[ch.id]) ? marks[ch.id] : '') +
                  '" onclick="czTap(\'' + ch.id + '\')">' + txt + '</span>';
        } else {
          html += '<span class="xmark">' + txt + '</span>';
        }
      });
      html += '</span>';
    });
    return html + '</div>';
  }
  function figOf(tx, r) { var out = null; tx.figs.forEach(function (f) { if (f.r === r) out = f; }); return out; }
  function figById(id) {
    var out = null;
    C.t1.figs.concat(C.t2.figs).forEach(function (f) { if (f.id === id) out = f; });
    return out;
  }
  function otherFigs(tx, r, n) {
    return shuffle(tx.figs.filter(function (f) { return f.r !== r; }), rng).slice(0, n);
  }
  function otherNames(r, n) {
    return shuffle(RKEYS.filter(function (k) { return k !== r; }), rng).slice(0, n)
      .map(function (k) { return RASGOS[k].n; });
  }

  function widgetLenguas() {
    var pares = shuffle(LENGUAS, rng).slice(0, 4);
    var izq = shuffle(pares, rng), der = shuffle(pares, rng);
    var st = { sel:null, hechos:{}, tries:0, n:0, done:false };
    var w = widgetBox('wLenguas', 'match');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Cada lengua se nombra a sí misma', 'Each language names itself') + '</div>' +
          '<div class="iw-fb"><span class="iw-ok">' + T('Uniste las cuatro parejas.', 'You joined all four pairs.') + '</span> ' +
          T('Ninguna de estas lenguas se llama a sí misma con una palabra del español.',
            'None of these languages calls itself by a Spanish word.') + '</div>';
        return;
      }
      w.innerHTML =
        '<div class="iw-tag">' + T('Cada lengua se nombra a sí misma', 'Each language names itself') + '</div>' +
        '<div class="iw-sub">' + T('Toca una lengua de la izquierda y luego lo que su nombre significa. Si te equivocas, puedes volver a intentarlo.',
                                   'Tap a language on the left and then what its name means. If you miss, you can try again.') + '</div>' +
        '<div class="iw-prog">' + st.n + ' / ' + pares.length + '</div>' +
        '<div class="mtcols"><div><div class="mthead">' + T('Lengua', 'Language') + '</div>' +
          izq.map(function (p, i) {
            var cls = 'mtchip' + (st.hechos[p.n] ? ' done' : (st.sel === i ? ' sel' : ''));
            return '<button class="' + cls + '" onclick="lgL(' + i + ')">' + p.n + '<br><span style="font-size:.72rem">' + L(p.l) + '</span></button>';
          }).join('') +
        '</div><div><div class="mthead">' + T('Lo que ese nombre dice', 'What that name says') + '</div>' +
          der.map(function (p, i) {
            var cls = 'mtchip' + (st.hechos[p.n] ? ' done' : '');
            return '<button class="' + cls + '" onclick="lgR(' + i + ')">' + L(p.m) + '</button>';
          }).join('') +
        '</div></div>' +
        '<div class="iw-fb">' + (fb || '') + '</div>';
    }
    window.lgL = function (i) {
      if (st.done || st.hechos[izq[i].n]) return;
      st.sel = (st.sel === i) ? null : i;
      st.tries = 0;
      paint('');
    };
    window.lgR = function (i) {
      if (st.done || st.hechos[der[i].n]) return;
      if (st.sel === null) {
        paint(T('Empieza por la columna de la izquierda: elige una lengua.',
                'Start with the left column: choose a language first.'));
        return;
      }
      var a = izq[st.sel], b = der[i];
      if (a === b) {
        st.hechos[a.n] = 1; st.n++; st.sel = null; st.tries = 0;
        if (st.n >= pares.length) { st.done = true; paint(''); return; }
        paint('<span class="iw-ok">' + T('Así es: ', 'That is it: ') + a.n + T(' quiere decir ', ' means ') + L(a.m) +
              T('. Además, ', '. Besides, ') + L(a.z) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.hechos[a.n] = 1; st.n++; st.sel = null; st.tries = 0;
        if (st.n >= pares.length) { st.done = true; paint(''); return; }
        paint(a.n + T(' quiere decir ', ' means ') + L(a.m) + T('. ', '. ') + L(a.z) + '.');
        return;
      }
      paint(T('Todavía no. Esa lengua ', 'Not yet. That language ') + L(a.z) +
            T('. Vuelve a mirar la columna de la derecha con ese dato.', '. Look at the right column again with that in mind.'));
    };
    paint('');
  }

  function widgetCaza() {
    var tx = C.t1;
    var orden = shuffle(RKEYS, rng).slice(0, 4).map(function (k) { return figOf(tx, k); });
    var st = { r:0, tries:0, marks:{}, done:false };
    var w = widgetBox('wCaza', 'hunt');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Caza de rasgos', 'Feature hunt') + '</div>' +
          '<div class="iw-fb"><span class="iw-ok">' + T('Localizaste los cuatro fragmentos de esta ronda.', 'You located all four fragments of this round.') + '</span> ' +
          T('Cada uno hace un trabajo distinto dentro del mismo poema.', 'Each one does a different job inside the same poem.') + '</div>';
        return;
      }
      var buscado = orden[st.r];
      w.innerHTML =
        '<div class="iw-tag">' + T('Caza de rasgos', 'Feature hunt') + '</div>' +
        '<div class="iw-sub">' + T('Toca dentro del poema el fragmento que ', 'Tap inside the poem the fragment that ') +
          L(RASGOS[buscado.r].d) + '.</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + orden.length + '</div>' +
        textHTML(tx, 'tap', st.marks) +
        '<div class="iw-fb">' + (fb || '') + '</div>';
    }
    function avanza(fb) {
      st.r++; st.tries = 0; st.marks = {};
      if (st.r >= orden.length) st.done = true;
      if (st.done) { paint(''); return; }
      st.locked = true;
      var _fe = document.getElementById('cuFb');
      if (_fe) _fe.innerHTML = (fb || '') + '<br><button onclick="clSig()" style="margin-top:.6rem;background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1.2rem;font-size:.84rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit">' + (LANG==='es' ? 'Siguiente →' : 'Next →') + '</button>';
      var _bs = wrap.querySelectorAll('.binbtn');
      if (_bs) _bs.forEach(function(b){ b.style.opacity='0.35'; b.style.pointerEvents='none'; });
    }
    window.czTap = function (id) {
      if (st.done) return;
      var quiero = orden[st.r], toque = figById(id);
      if (!toque) return;
      if (toque.r === quiero.r) {
        st.marks[id] = ' hit';
        avanza('<span class="iw-ok">' + Q(quiero) + ': ' + L(quiero.eff) + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        st.marks[quiero.id] = ' rev';
        avanza(T('El fragmento que buscabas era ', 'The fragment you were after was ') + Q(quiero) + ': ' + L(quiero.eff));
        return;
      }
      st.marks[id] = ' miss';
      paint(T('Ese fragmento ', 'That fragment ') + L(RASGOS[toque.r].d) +
            T('. Busca el que ', '. Look for the one that ') + L(RASGOS[quiero.r].d) + '.');
      st.marks[id] = '';
    };
    paint('');
  }

    var BANCO = [
      { p:'xóchitl', g:{ es:'flor', en:'flower' } },
      { p:'cuícatl', g:{ es:'canto', en:'song' } },
      { p:'atl',     g:{ es:'agua', en:'water' } },
      { p:'tepetl',  g:{ es:'cerro', en:'hill' } },
      { p:'ixtli',   g:{ es:'rostro', en:'face' } },
      { p:'yóllotl', g:{ es:'corazón', en:'heart' } }
    ];
    var METAS = [
      { need:[0, 1],
        t:{ es:'la poesía: eso que se dice con palabras hermosas y además se canta',
            en:'poetry: what is said with beautiful words and is also sung' },
        w:{ es:'La flor, que es lo hermoso, y el canto, que es lo que se oye: juntas nombran la poesía.',
            en:'The flower, which is the beautiful part, and the song, which is what is heard: together they name poetry.' } },
      { need:[2, 3],
        t:{ es:'el pueblo: la comunidad entera, y no el terreno donde está construida',
            en:'the town: the whole community, and not the ground it is built on' },
        w:{ es:'El agua y el cerro son las dos cosas sin las que no hay pueblo: juntas nombran a la comunidad.',
            en:'Water and hill are the two things without which there is no town: together they name the community.' } },
      { need:[4, 5],
        t:{ es:'la persona completa: lo que muestra por fuera y lo que siente por dentro',
            en:'the whole person: what shows on the outside and what is felt inside' },
        w:{ es:'El rostro es lo que se ve y el corazón lo que no se ve: juntos nombran a la persona entera.',
            en:'The face is what is seen and the heart what is not: together they name the entire person.' } }
    ];
    var orden = shuffle([0, 1, 2], rng);
    var st = { r:0, sel:[], tries:0, done:false };
    var w = widgetBox('wDifra', 'build');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Constructor de difrasismos', 'Paired-word builder') + '</div>' +
          '<div class="iw-fb"><span class="iw-ok">' + T('Armaste las tres parejas.', 'You built all three pairs.') + '</span> ' +
          T('En náhuatl, dos palabras juntas alcanzan lo que ninguna de las dos alcanza sola.',
            'In Nahuatl, two words together reach what neither of them reaches alone.') + '</div>';
        return;
      }
      var meta = METAS[orden[st.r]];
      var linea = st.sel.length
        ? st.sel.map(function (i) { return BANCO[i].p + ' (' + L(BANCO[i].g) + ')'; }).join(' + ')
        : T('elige dos palabras', 'choose two words');
      w.innerHTML =
        '<div class="iw-tag">' + T('Constructor de difrasismos', 'Paired-word builder') + '</div>' +
        '<div class="iw-sub">' + T('Elige las dos palabras que, dichas juntas, nombran esto. Puedes cambiarlas las veces que quieras antes de comprobar.',
                                   'Choose the two words that, said together, name this. You can change them as many times as you like before checking.') + '</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + orden.length + '</div>' +
        '<div class="target">' + L(meta.t) + '</div>' +
        '<div class="wordbank">' + BANCO.map(function (b, i) {
          return '<button class="wchip' + (st.sel.indexOf(i) >= 0 ? ' sel' : '') + '" onclick="dfTap(' + i + ')"><b>' + b.p + '</b>' + L(b.g) + '</button>';
        }).join('') + '</div>' +
        '<div class="pairline">' + linea + '</div>' +
        '<button class="iwbtn" onclick="dfCheck()">' + T('Comprobar', 'Check') + '</button>' +
        '<div class="iw-fb">' + (fb || '') + '</div>';
    }
    window.dfTap = function (i) {
      if (st.done) return;
      var k = st.sel.indexOf(i);
      if (k >= 0) st.sel.splice(k, 1);
      else { st.sel.push(i); if (st.sel.length > 2) st.sel.shift(); }
      paint('');
    };
    window.dfCheck = function () {
      if (st.done) return;
      var meta = METAS[orden[st.r]];
      if (st.sel.length < 2) {
        paint(T('Faltan palabras: un difrasismo se arma con dos.', 'Words are missing: a paired-word phrase is built with two.'));
        return;
      }
      var aciertos = st.sel.filter(function (i) { return meta.need.indexOf(i) >= 0; }).length;
      if (aciertos === 2) {
        st.r++; st.sel = []; st.tries = 0;
        if (st.r >= orden.length) { st.done = true; paint(''); return; }
        paint('<span class="iw-ok">' + L(meta.w) + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var sol = BANCO[meta.need[0]].p + ' + ' + BANCO[meta.need[1]].p + ': ' + L(meta.w);
        st.r++; st.sel = []; st.tries = 0;
        if (st.r >= orden.length) { st.done = true; paint(''); return; }
        paint(sol);
        return;
      }
      if (aciertos === 1) {
        paint(T('Una de las dos sirve y la otra no. Quédate con la que sí y busca la que le falta.',
                'One of the two works and the other does not. Keep the one that does and look for the one it needs.'));
      } else {
        paint(T('Ninguna de las dos apunta a eso. Pregúntate qué dos cosas no pueden faltar para que exista lo que se pide.',
                'Neither of the two points there. Ask yourself which two things cannot be missing for the thing asked about to exist.'));
      }
    };
    paint('');
  }

  /* ═════════ WIDGET 4 · la escalera del traductor ═════════ */
  function widgetTraductor() {
    var rondas = C.trad;
    var st = { r:0, v:0, tries:0, done:false };
    var w = widgetBox('wTrad', 'slider');

    function paint(fb) {
      if (st.done) {

          '<div class="iw-fb"><span class="iw-ok">' + T('Revisaste las dos líneas.', 'You went through both lines.') + '</span> ' +
          T('Traducir es elegir: quitar la imagen empobrece, y añadir lo que no está también.',
            'Translating means choosing: dropping the image makes it poorer, and adding what is not there does too.') + '</div>';
        return;
      }
      var ro = rondas[st.r];
      w.innerHTML =
        '<div class="iw-tag">' + T('La escalera del traductor', 'The translator’s ladder') + '</div>' +
        '<div class="iw-sub">' + T('Mueve la escalera hasta la versión que conserva la imagen del original y además se entiende en español. Después comprueba.',
                                   'Move the ladder to the version that keeps the image of the original and can still be understood in Spanish. Then check.') + '</div>' +
        '<div class="iw-prog">' + (st.r + 1) + ' / ' + rondas.length + '</div>' +
        '<div class="escorig">' + T('Línea del poema: ', 'Line from the poem: ') + '<b>' + L(ro.orig) + '</b></div>' +
        '<div class="escticks">' + [0, 1, 2, 3].map(function (i) {
          return '<span class="' + (st.v === i ? 'on' : '') + '">' + T('Versión ', 'Version ') + (i + 1) + '</span>';
        }).join('') + '</div>' +
        '<div class="escrow"><input class="escrange" type="range" min="0" max="3" step="1" value="' + st.v + '" oninput="trSet(this.value)"></div>' +
        '<div class="escfrase">' + L(ro.vers[st.v].f) + '</div>' +
        '<button class="iwbtn" style="margin-top:.7rem" onclick="trCheck()">' + T('Comprobar', 'Check') + '</button>' +
        '<div class="iw-fb">' + (fb || '') + '</div>';
    }
    window.trSet = function (v) { if (st.done) return; st.v = parseInt(v, 10) || 0; paint(''); };
    window.trCheck = function () {
      if (st.done) return;
      var ro = rondas[st.r];
      if (st.v === ro.ok) {
        st.r++; st.v = 0; st.tries = 0;
        if (st.r >= rondas.length) { st.done = true; paint(''); return; }
        paint('<span class="iw-ok">' + L(ro.vers[ro.ok].w) + '</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var sol = T('La versión ', 'Version ') + (ro.ok + 1) + T(' era la buena: ', ' was the good one: ') + L(ro.vers[ro.ok].w);
        st.r++; st.v = 0; st.tries = 0;
        if (st.r >= rondas.length) { st.done = true; paint(''); return; }
        paint(sol);
        return;
      }
      paint(L(ro.vers[st.v].w) + T(' Mueve la escalera y compara otra vez con la línea del poema.',
                                   ' Move the ladder and compare with the line of the poem again.'));
    };
    paint('');
  }

  /* ═════════ WIDGET 5 · clasificador de rasgos ═════════ */
  function widgetClasifica() {
    var fichas = shuffle(C.t1.figs.concat(C.t2.figs), rng).slice(0, 6);
    var st = { i:0, tries:0, hits:0, done:false };
    var w = widgetBox('wClasifica', 'classify');

    function paint(fb) {
      if (st.done) {
        w.innerHTML = '<div class="iw-tag">' + T('Clasificador de rasgos', 'Feature sorter') + '</div>' +
          '<div class="iw-fb"><span class="iw-ok">' + st.hits + ' / ' + fichas.length +
          T(' a la primera.', ' on the first try.') + '</span> ' +
          T('Los mismos rasgos aparecen en poemas de lenguas que no se parecen entre sí.',
            'The same features turn up in poems from languages that do not resemble one another.') + '</div>';
        return;
      }
      var it = fichas[st.i];
      w.innerHTML =
        '<div class="iw-tag">' + T('Clasificador de rasgos', 'Feature sorter') + '</div>' +
        '<div class="iw-sub">' + T('Cada ficha es un fragmento de los dos poemas. Decide qué está haciendo con el lenguaje.',
                                   'Each card is a fragment from the two poems. Decide what it is doing with language.') + '</div>' +
        '<div class="iw-prog">' + (st.i + 1) + ' / ' + fichas.length + '</div>' +
        '<div class="clscard">' + Q(it) + '</div>' +
        '<div class="binrow">' + RKEYS.map(function (k, bi) {
          return '<button class="binbtn" onclick="clPick(' + bi + ')">' + L(RASGOS[k].n) + '</button>';
        }).join('') + '</div>' +
        '<div class="iw-fb">' + (fb || '') + '</div>';
    }
    window.clPick = function (bi) {
      if (st.done || st.locked) return;
      if (st.done) return;
      var it = fichas[st.i], key = RKEYS[bi];
      if (key === it.r) {
        if (st.tries === 0) st.hits++;
        st.tries = 0; st.i++;
        if (st.i >= fichas.length) { st.done = true; paint(''); return; }
        paint('<span class="iw-ok">' + T('Correcto: ahí el poema ', 'Correct: there the poem ') + L(RASGOS[it.r].d) + '.</span>');
        return;
      }
      st.tries++;
      if (st.tries >= 3) {
        var sol = T('Era ', 'It was ') + L(RASGOS[it.r].n).toLowerCase() + ': ' + L(it.eff) + '.';
        st.tries = 0; st.i++;
        if (st.i >= fichas.length) { st.done = true; paint(''); return; }
        paint(sol);
        return;
      }
      paint(T('Todavía no. Un fragmento así ', 'Not yet. A fragment like that ') + L(RASGOS[key].d) +
            T(', y esta ficha hace otra cosa. Léela de nuevo despacio.', ', and this card does something else. Read it again slowly.'));
    };

    window.clSig = function(){
      st.locked = false;
      (typeof paint !== 'undefined' ? paint : render)('');
    };
    paint('');
  }

  function addP(spec) {
    var shuffled = shuffle(spec.options, rng);
    var p = {
      title: L(spec.title),
      questionText: L(spec.q),
      fn: '',
      hint: L(spec.hint),
      explanation: L(spec.exp),
      options: shuffled.map(function (o) { return L(o); }),
      correctIdx: shuffled.indexOf(spec.correct),
      showWork: false,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(p);
    buildOneCard(p, problems.length - 1);
  }

    }
    var oka = { es:'Reunir textos de comunidades distintas, publicar cada uno en su lengua y en español, y anotar de dónde viene y quién lo dice.',
                en:'Gathering texts from different communities, publishing each in its language and in Spanish, and noting where it comes from and who says it.' };
    return {
      title:{ es:'Tu antología', en:'Your anthology' },
      q:{ es:'Vas a armar con tu grupo una antología de textos de varias lenguas del país. Determina qué plan de trabajo deja ver la riqueza lingüística de México.',
          en:'With your group you are going to put together an anthology of texts from several languages of the country. Determine which work plan lets the linguistic richness of Mexico be seen.' },
      hint:{ es:'Recuerda qué te permitió trabajar los poemas de esta guía: tener el original a la vista, saber de dónde venía y quién hablaba en él.',
             en:'Remember what let you work on the poems in this guide: having the original in sight, knowing where it came from and who was speaking in it.' },
      exp:{ es:'Publicar solo traducciones esconde las lenguas, dedicar el libro entero a la más hablada borra a las demás e imitar cómo suenan es inventar. El plan correcto conserva cada lengua a la vista y dice de qué comunidad viene cada texto.',
            en:'Publishing only translations hides the languages, devoting the whole book to the most spoken one erases the rest, and imitating how they sound is inventing. The correct plan keeps every language in sight and says which community each text comes from.' },
      options:[ oka,
        { es:'Reunir solo textos ya traducidos al español, para que el libro se lea rápido y sin tropiezos.',
          en:'Gathering only texts already translated into Spanish, so the book reads fast and without stumbles.' },
        { es:'Elegir la lengua con más hablantes y dedicarle el libro entero, porque así se representa a la mayoría.',
          en:'Choosing the language with the most speakers and devoting the whole book to it, since that represents the majority.' },
        { es:'Escribir tú los textos imitando cómo suenan esas lenguas, y aclararlo en la última página.',
          en:'Writing the texts yourself in imitation of how those languages sound, and saying so on the last page.' } ],
      correct: oka
    };
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Un país que habla en muchas lenguas', 'A country that speaks in many languages'),
      '<p>' + T('En México no se habla una lengua: se hablan decenas. Junto al español conviven 68 lenguas indígenas nacionales, repartidas en 11 familias, y dentro de ellas se cuentan más de 350 variantes, porque una misma lengua toma formas distintas en cada región. A esa lista se suma la Lengua de Señas Mexicana, que no se oye pero se ve, y que tiene su propia gramática. Todas son lenguas completas: ninguna es una versión mal hecha de otra, y llamar «dialecto» a una de ellas para decir que vale menos es un error. Cada una tiene además un nombre propio, el que le dan quienes la hablan, y ese nombre casi siempre dice algo sobre el mundo que esa comunidad mira: la lluvia, las nubes, la verdad de la palabra.',
                'In Mexico one language is not spoken: dozens are. Alongside Spanish there are 68 national indigenous languages, spread over 11 families, and within them more than 350 variants are counted, because one and the same language takes different shapes in each region. To that list add Mexican Sign Language, which is not heard but seen, and which has a grammar of its own. All of them are complete languages: none is a badly made version of another, and calling one of them a “dialect” in order to say it is worth less is a mistake. Each also has its own name, the one its speakers give it, and that name almost always says something about the world that community looks at: the rain, the clouds, the truth of the word.') + '</p>' +
      '<div class="callout"><p><strong>' + T('Fíjate:', 'Notice:') + '</strong> ' +
        T('una lengua no se mide por cuánta gente la habla, sino por lo que puede decir quien la habla.',
          'a language is not measured by how many people speak it, but by what its speakers can say.') + '</p></div>');
  widgetLenguas();
  addP(q1());
  addP(q2());

  sec(T('Los textos', 'The texts'),
      T('Poemas que llegan de dos culturas', 'Poems arriving from two cultures'),
      '<p>' + T('Las lenguas de México no solo se hablan: también se escribe literatura en ellas, y esa literatura se traduce al español para que llegue más lejos. Vas a leer dos poemas venidos de dos culturas distintas. Al leerlos aparecen cinco maneras de trabajar el lenguaje que se repiten en las literaturas de estas lenguas: juntar dos palabras para nombrar una tercera, repetir una frase casi igual como un eco, dejar una palabra sin traducir, sacar la imagen del lugar donde se vive y hablar desde un nosotros en vez de un yo. Los fragmentos marcados con línea punteada son los que vas a trabajar en toda la guía.',
                'The languages of Mexico are not only spoken: literature is written in them too, and that literature is translated into Spanish so it can travel further. You are going to read two poems arriving from two different cultures. As you read, five ways of working language appear that recur in the literatures of these languages: joining two words to name a third, repeating a phrase almost unchanged like an echo, leaving a word untranslated, drawing the image from the place where life happens, and speaking from a we instead of an I. The fragments marked with a dotted line are the ones you will work with all through this guide.') + '</p>' +
      textHTML(C.t1, 'mark', null) +
      textHTML(C.t2, 'mark', null) +
      '<div class="glosslist">' +
        RKEYS.map(function (k) {
          return '<div class="gloss"><div class="glossn">' + L(RASGOS[k].n) + '</div><div class="glossd">' + L(RASGOS[k].d) + '</div></div>';
        }).join('') +
      '</div>');
  widgetCaza();
  addP(q3());
  addP(q4());

  sec(T('Dos palabras, una tercera cosa', 'Two words, a third thing'),
      T('El difrasismo', 'The paired-word phrase'),
      '<p>' + T('En náhuatl hay una manera de decir que no existe igual en español: se dicen dos palabras juntas y las dos, sumadas, nombran una tercera cosa que no está escrita en ninguna de ellas. La más conocida es in xóchitl in cuícatl, la flor y el canto, y no habla de plantas ni de música: nombra la poesía. Funciona porque cada palabra aporta una mitad, lo hermoso y lo que se oye, y la cosa nombrada solo aparece cuando las dos se dicen a la vez. Por eso un difrasismo se rompe si se traduce palabra por palabra: quedan dos cosas sueltas, como una lista, y el tercer sentido se queda en la otra lengua. Los difrasismos no son adivinanzas: son una forma de pensar, y aparecen también en las lenguas mayas y en otras lenguas del país.',
                'In Nahuatl there is a way of saying things that does not exist in the same shape in Spanish: two words are said together, and the two of them added up name a third thing that is written in neither. The best known is in xóchitl in cuícatl, the flower and the song, and it speaks of neither plants nor music: it names poetry. It works because each word brings one half, the beautiful and the heard, and the named thing appears only when both are said at once. That is why a paired-word phrase breaks if it is translated word by word: two loose things are left, like a list, and the third meaning stays behind in the other language. These pairs are not riddles: they are a way of thinking, and they show up in the Mayan languages and other languages of the country too.') + '</p>');
  widgetDifrasismo();
  addP(q5());
  addP(q6());

  sec(T('Pasar de una lengua a otra', 'Moving from one language to another'),
      T('Traducir sin apagar la imagen', 'Translating without switching off the image'),
      '<p>' + T('Traducir no es cambiar cada palabra por su equivalente. Quien traduce toma decisiones todo el tiempo: si conserva una palabra de la lengua original porque nombra algo que en español no tiene nombre, si busca una imagen parecida o si explica de más y apaga el poema. Hay traducciones tan literales que no se entienden y traducciones tan libres que ya cuentan otra cosa. El mismo problema aparece cuando se traduce un poema del japonés o del quechua: lo que hay que salvar no son las palabras una por una, sino lo que el poema hace ver, oír y sentir. La buena traducción es la que deja pasar la imagen sin inventar lo que no estaba.',
                'Translating is not swapping each word for its equivalent. A translator makes decisions all the time: whether to keep a word of the original language because it names something Spanish has no name for, whether to look for a similar image, or whether to over-explain and switch the poem off. There are translations so literal that they cannot be understood and translations so free that they now tell a different story. The same problem shows up when translating a poem from Japanese or from Quechua: what has to be saved is not the words one by one, but what the poem makes you see, hear and feel. A good translation lets the image through without inventing what was never there.') + '</p>');
  widgetTraductor();
  addP(q7());

  sec(T('El eco y el nosotros', 'The echo and the we'),
      T('Rasgos que viajan entre lenguas', 'Features that travel between languages'),
      '<p>' + T('Los dos poemas vienen de lenguas que no se parecen, y aun así comparten maneras de trabajar. El paralelismo, esa frase que vuelve casi igual, viene de una literatura que primero se dijo en voz alta: el eco ayudaba a recordar y marcaba el ritmo. La voz colectiva, ese nosotros que habla por la comunidad, aparece cuando lo que se cuenta no es de una persona sino de un pueblo entero. Y las imágenes salen del sitio: el elote, la ceiba, la neblina, el viento. Reconocer estos rasgos sirve para leer mejor cualquier poema traducido, venga de donde venga.',
                'The two poems come from languages that do not resemble each other, and even so they share ways of working. Parallelism, that phrase which returns almost unchanged, comes from a literature first said aloud: the echo helped memory and marked the rhythm. The collective voice, that we speaking for the community, appears when what is told belongs not to one person but to a whole town. And the images come from the place: the young corn, the ceiba, the mist, the wind. Recognising these features helps you read any translated poem better, wherever it comes from.') + '</p>');
  widgetClasifica();
  addP(q8());

  sec(T('Cierre', 'Wrap-up'),
      T('La lengua sigue viva si se usa', 'A language stays alive if it is used'),
      '<p>' + T('Leíste poemas de dos culturas, seguiste la pista de cinco maneras de decir y viste lo que se gana y lo que se pierde al traducir. Falta lo que sigue: escuchar. En tu escuela, en tu calle o en tu familia hay palabras que vienen de otras lenguas y personas que las hablan todos los días. Reconocer la riqueza lingüística no es aprenderse una lista de nombres: es darle lugar a esas voces cuando aparecen.',
                'You have read poems from two cultures, tracked five ways of saying things and seen what is gained and what is lost in translation. What is left is the next step: listening. In your school, on your street or in your family there are words that come from other languages and people who speak them every day. Recognising linguistic richness is not learning a list of names: it is making room for those voices when they turn up.') + '</p>');
  widgetCuaderno();
  addP(q9());
  addP(q10());
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Riqueza Lingüística de México en la Literatura';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
