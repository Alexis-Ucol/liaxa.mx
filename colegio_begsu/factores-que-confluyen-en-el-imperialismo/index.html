<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factores que Confluyen en el Imperialismo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Factores que Confluyen en el Imperialismo</div>
    <div class="wcourse" id="wcourse-el">Historia · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Factores que Confluyen en el Imperialismo</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.

  var _fname   = 'his3_t04_g03_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

var MANIP = {};
function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function pickVariant(list, rng){ return list[Math.floor(rng()*list.length)]; }
function pickSome(pool, n, rng){
  var rest = pool.slice(), out = [];
  while (out.length < n && rest.length) out.push(rest.splice(Math.floor(rng()*rest.length),1)[0]);
  return out;
}

function m1_check(){

function m5_tap(i){

            en:'Not yet: ' + LCWHAT[d.frag.lines[i].k].en + '. Read the other sentences again. You have ' + (3 - A.tries) + ' tries left.' };

function buildLesson(rng) {
  injectManipStyles();

  /* ── PUNTO DE PARTIDA ───────────────────────── */
  addSection(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Cuando varios factores empujan a la vez', en:'When several factors push at once' }),
    '<p>' + L({ es:'En 1870 los europeos ocupaban en África poco más que puertos y franjas de costa. En 1914 casi todo el continente aparecía repartido entre siete potencias, y algo parecido había sucedido en el sur y el sudeste de Asia y en las islas del Pacífico. Ese cambio, tan rápido que cabe dentro de la vida de una persona, es lo que llamamos imperialismo del siglo XIX.',
               en:'In 1870 Europeans occupied little more than ports and coastal strips in Africa. By 1914 almost the whole continent appeared divided among seven powers, and something similar had happened in South and Southeast Asia and in the Pacific islands. That change, fast enough to fit inside one person lifetime, is what we call 19th century imperialism.' }) + '</p>' +
    '<p>' + L({ es:'Cuando se intenta explicarlo con un solo motivo, siempre queda algo fuera. Si todo fue dinero, no se entiende por qué las potencias conservaron colonias que daban pérdidas. Si todo fue técnica, no se entiende por qué el reparto no comenzó en cuanto existió el barco de vapor. Por eso los historiadores hablan de confluencia: varios procesos distintos, cada uno con su propio ritmo, coinciden en el mismo momento y se refuerzan entre sí.',
               en:'When you try to explain it with a single motive, something is always left out. If it was all money, it is hard to see why the powers kept colonies that ran at a loss. If it was all technology, it is hard to see why the partition did not begin as soon as the steamship existed. That is why historians speak of convergence: several different processes, each with its own pace, coincide at the same moment and reinforce one another.' }) + '</p>' +
    '<p>' + L({ es:'En esta guía vas a separar esos procesos en cuatro familias de factores, seguir cómo se encadenan, ubicarlos en el tiempo y leer un texto de la época buscando en él la huella de cada uno. Distinguirás además dos cosas que suelen confundirse: el motivo, que responde a por qué se quiso, y la condición de posibilidad, que responde a por qué se pudo.',
               en:'In this guide you will separate those processes into four families of factors, follow how they link together, place them in time and read a text of the period looking for the trace of each one. You will also tell apart two things that are often confused: the motive, which answers why it was wanted, and the condition of possibility, which answers why it could be done.' }) + '</p>' +
    '<table class="dtable"><tr><th>' + L({ es:'Familia de factores', en:'Family of factors' }) + '</th><th>' + L({ es:'Pregunta que responde', en:'Question it answers' }) + '</th></tr>' +

    '<tr><td>' + L({ es:'Políticos', en:'Political' }) + '</td><td>' + L({ es:'quién competía y por qué posiciones', en:'who competed and over which positions' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Ideológicos', en:'Ideological' }) + '</td><td>' + L({ es:'cómo se justificaba ante la propia sociedad europea', en:'how it was justified before European society itself' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Técnicos', en:'Technical' }) + '</td><td>' + L({ es:'con qué medios se pudo llevar a cabo', en:'with what means it could be carried out' }) + '</td></tr></table>' +
    '<div class="callout"><p><strong>' + L({ es:'Pregunta guía: ', en:'Guiding question: ' }) + '</strong>' + L({ es:'el interés europeo por los productos de otros continentes era muy anterior, así que la pregunta no es solo por qué ocurrió el reparto, sino por qué ocurrió justo entonces y no doscientos años antes.',
                                                                                                                            en:'European interest in the products of other continents was much older, so the question is not only why the partition happened, but why it happened just then and not two hundred years earlier.' }) + '</p></div>'
  );

  /* ── CONCEPTO 1 :: FACTOR ECONÓMICO ─────────── */
  addSection(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'La fábrica que ya no cabe en su mercado', en:'The factory that no longer fits its market' }),
    '<p>' + L({ es:'La segunda industrialización, con el acero, la química, el petróleo y la electricidad, multiplicó la capacidad de producir de las fábricas europeas. Esa capacidad creció más rápido que la capacidad de compra dentro de Europa: entre 1873 y 1896 los precios industriales bajaron año tras año y las empresas vieron reducirse sus ganancias. Los gobiernos respondieron subiendo aranceles para proteger su mercado interno y buscando mercados nuevos fuera del continente.',
               en:'The second industrialization, with steel, chemistry, oil and electricity, multiplied the productive capacity of European factories. That capacity grew faster than purchasing power inside Europe: between 1873 and 1896 industrial prices fell year after year and firms saw their profits shrink. Governments responded by raising tariffs to protect their home market and by looking for new markets outside the continent.' }) + '</p>' +
    '<p>' + L({ es:'Al mismo tiempo, las nuevas ramas industriales necesitaban materias primas que el clima europeo no daba o que Europa no producía en cantidad suficiente. Un territorio dejaba de ser una curiosidad geográfica y pasaba a ser un almacén y un cliente.',
               en:'At the same time, the new industrial branches needed raw materials that the European climate did not provide or that Europe did not produce in sufficient quantity. A territory stopped being a geographical curiosity and became a warehouse and a customer.' }) + '</p>' +

    '<tr><td>' + L({ es:'Aceite de palma', en:'Palm oil' }) + '</td><td>' + L({ es:'jabón y lubricantes para maquinaria', en:'soap and lubricants for machinery' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Algodón', en:'Cotton' }) + '</td><td>' + L({ es:'hilados y tejidos de la industria textil', en:'yarn and cloth for the textile industry' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Cobre y estaño', en:'Copper and tin' }) + '</td><td>' + L({ es:'conducción eléctrica y envases de conserva', en:'electrical conduction and tinned food containers' }) + '</td></tr></table>' +
    '<p>' + L({ es:'Hubo además un tercer movimiento, menos visible: los bancos y las grandes sociedades acumulaban capital que dentro de Europa ya rendía poco, y empezaron a financiar ferrocarriles, minas y puertos en otros continentes. Ese capital viajaba antes que las tropas, y una vez colocado buscaba protección.',
               en:'There was also a third movement, less visible: banks and large companies were accumulating capital that already yielded little inside Europe, and they began to fund railways, mines and ports on other continents. That capital travelled ahead of the troops, and once placed it looked for protection.' }) + '</p>' +
    '<div class="mzone" id="m1Zone"></div>'
  );
  MANIP.m1 = { rng:rng, round:0, cards:m1_round(rng), sel:null, tries:0, revealed:false, bad:null, done:false,
    msg:{ es:'Empieza por la evidencia que te resulte más clara y ve colocando las demás.', en:'Start with the piece of evidence that seems clearest and place the rest as you go.' } };
  m1_render();

  useVariant(pickVariant(V1(), rng), rng);
  useVariant(pickVariant(V2(), rng), rng);

  /* ── CONCEPTO 2 :: FACTOR TÉCNICO ───────────── */
  addSection(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Lo que hizo posible entrar', en:'What made entering possible' }),
    '<p>' + L({ es:'Hasta mediados del siglo XIX los europeos comerciaban en la costa africana y casi no entraban al interior. No era por falta de interés: los ríos tenían rápidos que impedían remontarlos a vela, la malaria mataba a una parte enorme de cualquier expedición, no existían mapas confiables y en el terreno se enfrentaban a Estados con ejércitos capaces de resistir.',
               en:'Until the middle of the 19th century Europeans traded on the African coast and hardly entered the interior. It was not for lack of interest: the rivers had rapids that made sailing upstream impossible, malaria killed a huge share of any expedition, there were no reliable maps and on the ground they faced States with armies able to resist.' }) + '</p>' +
    '<p>' + L({ es:'En pocas décadas esos obstáculos cambiaron de tamaño. El barco de vapor con casco de hierro remontaba los ríos contra la corriente. El uso preventivo de la quinina redujo de forma drástica la mortalidad europea por malaria. El canal de Suez, abierto en 1869, acortó la ruta hacia Asia; el cable telegráfico submarino permitió enviar una orden y recibir respuesta el mismo día; el ferrocarril sacó la carga del interior hacia los puertos. Y desde la década de 1880 las armas de repetición y las primeras ametralladoras rompieron el equilibrio militar que antes existía sobre el terreno.',
               en:'Within a few decades those obstacles changed size. The iron hulled steamship went up the rivers against the current. The preventive use of quinine sharply cut European deaths from malaria. The Suez canal, opened in 1869, shortened the route to Asia; the underwater telegraph cable made it possible to send an order and get an answer the same day; the railway carried cargo from the interior to the ports. And from the 1880s repeating weapons and the first machine guns broke the military balance that had existed on the ground.' }) + '</p>' +
    '<p>' + L({ es:'Estas herramientas no ordenaron a nadie ocupar nada. Lo que hicieron fue cambiar el precio de la empresa: lo que antes costaba años, muchas vidas y una fortuna, pasó a costar una expedición de unos meses. Por eso conviene tratarlas como condiciones de posibilidad y no como motivos.',
               en:'These tools did not order anyone to occupy anything. What they did was change the price of the enterprise: what used to cost years, many lives and a fortune came to cost an expedition of a few months. That is why it is best to treat them as conditions of possibility and not as motives.' }) + '</p>' +
    '<div class="srcbox">' + L({ es:'Criterio de análisis: pregunta a cada dato si ofrece una razón para querer el territorio o si ofrece la capacidad de tomarlo. La primera respuesta señala un motivo; la segunda, una condición.',
                                 en:'Analytical criterion: ask of each piece of information whether it offers a reason to want the territory or the ability to take it. The first answer points to a motive; the second, to a condition.' }) + '<span class="srcref">' + L({ es:'Criterio usado en esta guía', en:'Criterion used in this guide' }) + '</span></div>' +
    '<div class="mzone" id="m3Zone"></div>'
  );
  var m3ord = pickSome([0,1,2,3], 4, rng);
  MANIP.m3 = { rng:rng, order:m3ord, round:0, step:0, tries:0, revealed:false, miss:null, done:false,
    order2: shuffleIdx(CHAINS[m3ord[0]].links.length, rng),
    msg:{ es:'Busca el hecho que no necesita de ningún otro para ocurrir.', en:'Look for the event that needs no other one in order to happen.' } };
  m3_render();

  useVariant(pickVariant(V3(), rng), rng);
  useVariant(pickVariant(V4(), rng), rng);

  /* ── CONCEPTO 3 :: FACTOR POLÍTICO ──────────── */
  addSection(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'El mapa como tablero entre potencias', en:'The map as a board between powers' }),
    '<p>' + L({ es:'Italia culminó su unificación en 1870 y Alemania se constituyó como imperio en 1871. El sistema europeo, que llevaba siglos con los mismos jugadores, incorporó de golpe dos Estados nuevos que querían ser tratados como iguales. En esos años el nacionalismo asociaba la grandeza de una nación con la extensión de su imperio, y la prensa de gran tiraje convertía cada bandera colocada en el mapa en un asunto de orgullo nacional.',
               en:'Italy completed its unification in 1870 and Germany was constituted as an empire in 1871. The European system, which had kept the same players for centuries, suddenly took in two new States that wanted to be treated as equals. In those years nationalism linked the greatness of a nation to the extent of its empire, and the mass press turned every flag placed on the map into a matter of national pride.' }) + '</p>' +
    '<p>' + L({ es:'A esa competencia por el rango se sumó una geografía muy concreta. Las flotas de vapor necesitaban puertos donde cargar carbón cada cierto tramo, y quien controlaba un estrecho o un canal controlaba una ruta comercial entera. Por eso se disputaron con dureza islas y puertos sin riqueza propia. Y una vez que la carrera empezó, funcionó una lógica de anticipación: ocupar antes de que lo hiciera el vecino, aunque el territorio no fuera rentable de inmediato.',
               en:'To that competition for rank was added a very concrete geography. Steam fleets needed ports to load coal at intervals, and whoever controlled a strait or a canal controlled an entire trade route. That is why islands and ports with no wealth of their own were fiercely disputed. And once the race began, a logic of anticipation set in: occupy before the neighbour does, even if the territory was not immediately profitable.' }) + '</p>' +
    '<p>' + L({ es:'Los roces llegaron pronto. En 1884 los gobiernos europeos se reunieron en Berlín para tratar los asuntos africanos. En 1898 una columna francesa y otra británica se encontraron frente a frente en Fachoda, sobre el Nilo. En 1905 y en 1911 Alemania y Francia se enfrentaron diplomáticamente por Marruecos, con flotas movilizadas y alianzas puestas a prueba.',
               en:'Friction came quickly. In 1884 the European governments met in Berlin to deal with African affairs. In 1898 a French column and a British one came face to face at Fashoda, on the Nile. In 1905 and in 1911 Germany and France clashed diplomatically over Morocco, with fleets mobilized and alliances put to the test.' }) + '</p>' +
    '<div class="mzone" id="m2Zone"></div>'
  );
  MANIP.m2 = { rng:rng, order:pickSome([0,1,2,3], 4, rng), round:0, vals:[50,50,50], tries:0, revealed:false, done:false,
    msg:{ es:'Lee la situación y mueve los deslizadores hasta que la barra represente lo que allí ocurría.', en:'Read the situation and move the sliders until the bar represents what was happening there.' } };
  m2_render();

  useVariant(pickVariant(V5(), rng), rng);
  useVariant(pickVariant(V6(), rng), rng);

  /* ── CONCEPTO 4 :: FACTOR IDEOLÓGICO ────────── */
  addSection(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'El discurso que lo volvió aceptable', en:'The discourse that made it acceptable' }),
    '<p>' + L({ es:'Ningún gobierno gasta durante décadas dinero público en expediciones lejanas sin contar con el apoyo de su propia sociedad. Ese apoyo se construyó con un conjunto de ideas que hoy resulta necesario examinar con cuidado. La principal fue el llamado darwinismo social: tomar conceptos de la biología sobre la competencia entre especies y aplicarlos a las sociedades humanas para ordenarlas en una escala. De ahí salió la idea de una misión civilizadora, difundida en 1899 por un poema inglés que llamaba carga del hombre blanco al dominio colonial.',
               en:'No government spends public money on distant expeditions for decades without the support of its own society. That support was built with a set of ideas that today needs careful examination. The main one was so called social darwinism: taking concepts from biology about competition between species and applying them to human societies in order to rank them on a scale. From there came the idea of a civilizing mission, spread in 1899 by an English poem that called colonial rule the burden of the white man.' }) + '</p>' +
    '<p>' + L({ es:'Los relatos de exploradores, la actividad de las misiones religiosas, la prensa ilustrada y las exposiciones universales llevaron esa imagen del mundo a millones de lectores europeos que nunca saldrían de su país. La expansión dejaba de parecer un negocio y pasaba a presentarse como una tarea que alguien debía cumplir.',
               en:'Explorer accounts, the activity of religious missions, the illustrated press and the world fairs carried that image of the world to millions of European readers who would never leave their country. Expansion stopped looking like a business and came to be presented as a task that someone had to fulfil.' }) + '</p>' +
    '<p>' + L({ es:'No todos lo aceptaron. En los parlamentos europeos hubo diputados que denunciaron el costo humano de las campañas, y a comienzos del siglo XX una amplia campaña internacional documentó el trabajo forzado impuesto a la población del Congo y obligó a cambiar su administración. Hoy sabemos, además, que las jerarquías entre pueblos que sostenía aquel discurso no tenían ninguna base científica.',
               en:'Not everyone accepted it. In European parliaments there were members who denounced the human cost of the campaigns, and in the early 20th century a broad international campaign documented the forced labour imposed on the population of the Congo and forced a change in its administration. Today we also know that the hierarchies between peoples upheld by that discourse had no scientific basis whatsoever.' }) + '</p>' +
    '<div class="srcbox">' + L({ es:'Al leer un documento de la época conviene recordar que en una misma página conviven el interés, la competencia con otra potencia, el medio material disponible y el deber que se declara en público.',
                                 en:'When reading a document of the period it helps to remember that on a single page the interest, the competition with another power, the available material means and the duty declared in public all live together.' }) + '<span class="srcref">' + L({ es:'Criterio de lectura de fuentes', en:'Criterion for reading sources' }) + '</span></div>' +
    '<div class="mzone" id="m5Zone"></div>'
  );
  MANIP.m5 = { order:pickSome([0,1,2,3], 4, rng), asks:pickSome(FAM, 4, rng), round:0, tries:0, revealed:false, miss:null, hit:null, done:false,
    msg:{ es:'Lee las cuatro frases completas antes de decidir cuál responde a la pregunta.', en:'Read all four sentences before deciding which one answers the question.' } };
  m5_render();

  useVariant(pickVariant(V7(), rng), rng);

  /* ── CONCEPTO 5 :: EL REPARTO Y SUS FORMAS ──── */
  addSection(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Reglas para repartir un continente', en:'Rules for dividing a continent' }),
    '<p>' + L({ es:'Entre noviembre de 1884 y febrero de 1885 se reunió en Berlín una conferencia convocada por Bismarck, con catorce delegaciones europeas y la presencia de Estados Unidos. No asistió ninguna autoridad africana. Allí se acordó la libre navegación por los ríos Congo y Níger y, sobre todo, el principio de ocupación efectiva: para que una reclamación fuera reconocida por las demás potencias no bastaba con explorar o firmar un tratado, había que ocupar el territorio y administrarlo. El continente no se repartió en aquella mesa, pero la carrera quedó reglamentada y se aceleró.',
               en:'Between November 1884 and February 1885 a conference called by Bismarck met in Berlin, with fourteen European delegations and the presence of the United States. No African authority attended. There they agreed on free navigation of the Congo and Niger rivers and, above all, on the principle of effective occupation: for a claim to be recognized by the other powers it was not enough to explore or sign a treaty, the territory had to be occupied and administered. The continent was not divided at that table, but the race was given rules and it accelerated.' }) + '</p>' +
    '<p>' + L({ es:'Dominar no significó siempre lo mismo. Según el costo, la resistencia local y el interés en juego, las potencias combinaron distintas fórmulas de control.',
               en:'Ruling did not always mean the same thing. Depending on cost, local resistance and the interest at stake, the powers combined different formulas of control.' }) + '</p>' +
    '<table class="dtable"><tr><th>' + L({ es:'Fórmula', en:'Formula' }) + '</th><th>' + L({ es:'Quién decide en el territorio', en:'Who decides in the territory' }) + '</th></tr>' +
    '<tr><td>' + L({ es:'Colonia de administración directa', en:'Colony under direct administration' }) + '</td><td>' + L({ es:'funcionarios enviados por la metrópoli sustituyen a las autoridades locales', en:'officials sent by the metropolis replace the local authorities' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Protectorado', en:'Protectorate' }) + '</td><td>' + L({ es:'el soberano local conserva su trono, pero un residente europeo controla defensa, finanzas y política exterior', en:'the local sovereign keeps the throne, but a European resident controls defence, finances and foreign policy' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Esfera de influencia', en:'Sphere of influence' }) + '</td><td>' + L({ es:'no hay ocupación, pero las demás potencias aceptan que solo una comercie e invierta allí', en:'there is no occupation, but the other powers accept that only one may trade and invest there' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Concesión a una compañía', en:'Concession to a company' }) + '</td><td>' + L({ es:'una empresa privada administra, cobra y explota el territorio con permiso del Estado', en:'a private firm administers, collects taxes and exploits the territory with State permission' }) + '</td></tr></table>' +
    '<p>' + L({ es:'Hacia 1914 el mapa africano estaba repartido casi por completo: quedaban fuera Liberia y Etiopía, que en 1896 había derrotado en Adua al ejército italiano. Las economías coloniales quedaron orientadas a exportar uno o dos productos hacia la metrópoli, y las fronteras se negociaron en Europa siguiendo meridianos y paralelos. En China, donde no hubo ocupación total, las potencias se repartieron esferas de influencia; la resistencia local llegó a estallar en 1900 en la rebelión de los bóxers.',
               en:'By 1914 the African map was almost entirely divided: Liberia and Ethiopia, which had defeated the Italian army at Adwa in 1896, remained outside. The colonial economies were oriented to exporting one or two products to the metropolis, and the borders were negotiated in Europe following meridians and parallels. In China, where there was no full occupation, the powers shared out spheres of influence; local resistance broke out in 1900 in the Boxer rebellion.' }) + '</p>' +
    '<div class="mzone" id="m4Zone"></div>'
  );
  var m4ord = pickSome([0,1,2,3], 4, rng);
  MANIP.m4 = { rng:rng, order:m4ord, round:0, step:0, tries:0, revealed:false, miss:null, done:false,
    order2: shuffleIdx(TLSETS[m4ord[0]].ev.length, rng),
    msg:{ es:'Empieza por el hecho más antiguo de la lista.', en:'Start with the oldest event on the list.' } };
  m4_render();

  useVariant(pickVariant(V8(), rng), rng);

  /* ── CIERRE ─────────────────────────────────── */
  addSection(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Piensa como historiador', en:'Think like a historian' }),
    '<p>' + L({ es:'Ya tienes las cuatro familias de factores, la diferencia entre motivo y condición, la secuencia de los hechos y las formas que tomó el dominio. Reúne todo eso y decide con criterio propio en las últimas preguntas: no buscan que recuerdes un dato suelto, sino que sostengas una explicación completa.',
               en:'You now have the four families of factors, the difference between motive and condition, the sequence of events and the forms domination took. Bring all of that together and decide with your own judgement in the last questions: they do not ask you to recall a loose fact, but to hold a complete explanation.' }) + '</p>'
  );

  useVariant(pickVariant(V9(), rng), rng);
  useVariant(pickVariant(V10(), rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Factores que Confluyen en el Imperialismo';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
