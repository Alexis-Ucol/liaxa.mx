<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liaxa · Analytics</title>
<style>
:root {
  --bg:       #f6f5f0;
  --surface:  #ffffff;
  --border:   #e2ddd4;
  --text:     #18180f;
  --text2:    #52504a;
  --text3:    #9a9690;
  --navy:     #1B2B52;
  --navy-mid: #2a3d6e;
  --gold:     #E8A020;
  --gold-bg:  #fef7eb;
  --ok:       #2d6a4f;
  --ok-bg:    rgba(45,106,79,.10);
  --shadow:   0 2px 12px rgba(0,0,0,.08);
  --radius:   10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

/* ── LOGIN ── */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--navy); }
.login-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 2.5rem 2rem; width: 100%; max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3); text-align: center;
}
.login-logo { margin-bottom: 1.5rem; }
.login-card h1 { font-size: 1.1rem; color: var(--text2); margin-bottom: 1.5rem; font-weight: 500; }
.login-card input {
  width: 100%; padding: .75rem 1rem; border: 1.5px solid var(--border);
  border-radius: 7px; font-size: 1rem; margin-bottom: 1rem;
  outline: none; transition: border-color .2s;
}
.login-card input:focus { border-color: var(--navy); }
.login-card button {
  width: 100%; padding: .8rem; background: var(--navy); color: #fff;
  border: none; border-radius: 7px; font-size: 1rem; cursor: pointer;
  font-weight: 600; transition: background .2s;
}
.login-card button:hover { background: var(--navy-mid); }
.login-error { color: #c0392b; font-size: .85rem; margin-top: .5rem; display: none; }

/* ── APP ── */
#app { display: none; }

/* ── TOPBAR ── */
.topbar {
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 2rem; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.topbar-brand { display: flex; align-items: center; gap: .75rem; }
.topbar-right { display: flex; align-items: center; gap: 1rem; }
.btn-refresh {
  background: rgba(255,255,255,.12); color: #fff; border: none;
  padding: .4rem .9rem; border-radius: 6px; cursor: pointer; font-size: .85rem;
  transition: background .2s;
}
.btn-refresh:hover { background: rgba(255,255,255,.22); }
.btn-refresh:disabled { opacity: .5; cursor: default; }
.last-updated { font-size: .75rem; opacity: .6; }

/* ── LAYOUT ── */
.container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

/* ── STAT CARDS ── */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem; margin-bottom: 2.5rem;
}
.stat-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 1.5rem 1.75rem; box-shadow: var(--shadow);
  border-top: 4px solid var(--navy);
}
.stat-card.gold { border-top-color: var(--gold); }
.stat-card.ok   { border-top-color: var(--ok); }
.stat-card.accent { border-top-color: #7B5EA7; }
.stat-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text3); margin-bottom: .4rem; }
.stat-value { font-size: 2.4rem; font-weight: 700; color: var(--navy); line-height: 1; }
.stat-card.gold .stat-value   { color: #b07a10; }
.stat-card.ok .stat-value     { color: var(--ok); }
.stat-card.accent .stat-value { color: #7B5EA7; }

/* ── SCHOOL SELECTOR ── */
.selector-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 1.25rem 1.5rem; box-shadow: var(--shadow);
  margin-bottom: 1.5rem;
}
.selector-card label { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text3); margin-bottom: .6rem; font-weight: 600; }
.selector-row { display: flex; gap: .75rem; }
.selector-select {
  width: 100%; padding: .55rem .85rem; border: 1.5px solid var(--border);
  border-radius: 6px; font-size: .95rem; background: var(--bg);
  outline: none; cursor: pointer; transition: border-color .2s;
}
.selector-select:focus { border-color: var(--navy); }

/* ── TABLE ── */
.table-wrap {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; margin-bottom: 1.5rem;
}
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
thead tr { background: var(--navy); color: #fff; }
thead th { padding: .75rem 1rem; text-align: left; font-weight: 600; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--gold-bg); }
tbody td { padding: .75rem 1rem; color: var(--text2); }
tbody td:first-child { font-weight: 600; color: var(--text); }
.badge { display: inline-block; padding: .2rem .6rem; border-radius: 20px; font-size: .75rem; font-weight: 600; }
.badge-navy { background: rgba(27,43,82,.1); color: var(--navy); }
.badge-gold { background: var(--gold-bg); color: #8a5c00; }
.badge-ok   { background: var(--ok-bg); color: var(--ok); }
.badge-purple { background: rgba(123,94,167,.1); color: #7B5EA7; }

/* ── DETAIL PANEL ── */
.detail-panel {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; margin-bottom: 1.5rem;
  border-top: 4px solid var(--navy);
}
.detail-panel-body { padding: 1.25rem 0 0 0; }
.detail-panel-label {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .1em;
  color: var(--text3); font-weight: 600; padding: 0 1rem 1rem 1rem;
}

/* ── LOADING / EMPTY ── */
.loading { text-align: center; padding: 3rem; color: var(--text3); font-size: .9rem; }
.empty   { text-align: center; padding: 2rem; color: var(--text3); font-size: .85rem; }

/* ── FOOTER ── */
.footer { text-align: center; padding: 2rem; color: var(--text3); font-size: .78rem; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .container { padding: 1rem; }
  .topbar { padding: .75rem 1rem; }
  .selector-row { flex-direction: column; }
  thead th:nth-child(4), tbody td:nth-child(4),
  thead th:nth-child(5), tbody td:nth-child(5) { display: none; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="140" height="36" viewBox="0 0 200 52" xmlns="http://www.w3.org/2000/svg">
        <polyline points="0,40 16,24 30,32 48,8" fill="none" stroke="#1B2B52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="48" cy="8" r="6" fill="#E8A020"/>
        <text x="62" y="38" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1B2B52" letter-spacing="2">LIAXA</text>
      </svg>
    </div>
    <h1>Panel de Analytics</h1>
    <input type="password" id="pwd-input" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="tryLogin()">Entrar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand">
      <svg width="90" height="24" viewBox="0 0 200 52" xmlns="http://www.w3.org/2000/svg">
        <polyline points="0,40 16,24 30,32 48,8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="48" cy="8" r="6" fill="#E8A020"/>
        <text x="62" y="38" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#fff" letter-spacing="2">LIAXA</text>
      </svg>
      <div style="font-size:.7rem;opacity:.6;letter-spacing:.08em;text-transform:uppercase;">Analytics</div>
    </div>
    <div class="topbar-right">
      <span class="last-updated" id="last-updated"></span>
      <button class="btn-refresh" id="btn-refresh" onclick="loadAll()">↻ Actualizar</button>
    </div>
  </div>

  <div class="container">

    <!-- Global stat cards -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Escuelas activas</div>
        <div class="stat-value" id="s-schools">—</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-label">Visitas al portal</div>
        <div class="stat-value" id="s-portals">—</div>
      </div>
      <div class="stat-card accent">
        <div class="stat-label">Interacciones</div>
        <div class="stat-value" id="s-sessions">—</div>
      </div>
      <div class="stat-card ok">
        <div class="stat-label">Módulos distintos</div>
        <div class="stat-value" id="s-avgtime">—</div>
      </div>
    </div>

    <!-- School selector -->
    <div class="selector-card">
      <label>Ver escuela</label>
      <select class="selector-select" id="school-select" onchange="onSchoolSelect(this.value)">
        <option value="">— Selecciona una escuela —</option>
        <option value="__todas__">Todas las escuelas</option>
      </select>
    </div>

    <!-- Summary section (hidden until school selected) -->
    <div id="summary-section" style="display:none;">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Escuela</th>
              <th>Visitas portal</th>
              <th>Interacciones</th>
              <th>Guías distintas</th>
              <th>Tiempo prom.</th>
            </tr>
          </thead>
          <tbody id="summary-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- School module detail (hidden until school selected) -->
    <div id="detail-container"></div>

  </div>
  <div class="footer">Liaxa Analytics · uso interno</div>
</div>

<script>
var GAS_URL  = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
var PASSWORD = 'cuyutlan';
var ALL_SUMMARY_ROWS = [];
var ALL_SCHOOLS      = [];

// ── Login ──────────────────────────────────────────────────────────────────
function tryLogin() {
  var val = document.getElementById('pwd-input').value;
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('lx_auth', '1');
    loadAll();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
document.getElementById('pwd-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') tryLogin();
});
if (sessionStorage.getItem('lx_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// ── Data loading ───────────────────────────────────────────────────────────
function loadAll() {
  var btn = document.getElementById('btn-refresh');
  btn.disabled = true; btn.textContent = '…';

  fetch(GAS_URL + '?action=summary')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderGlobalStats(data);
      ALL_SUMMARY_ROWS = data;
      return fetch(GAS_URL + '?action=schools');
    })
    .then(function(r) { return r.json(); })
    .then(function(schools) {
      ALL_SCHOOLS = schools;
      populateSchoolSelect(schools);
      document.getElementById('last-updated').textContent =
        'Actualizado: ' + new Date().toLocaleTimeString('es-MX');
      btn.disabled = false; btn.textContent = '↻ Actualizar';
    })
    .catch(function(err) {
      console.error(err);
      btn.disabled = false; btn.textContent = '↻ Actualizar';
      alert('Error al cargar datos. Verifica la URL del GAS endpoint.');
    });
}

// ── Global stats ───────────────────────────────────────────────────────────
function renderGlobalStats(rows) {
  var totalPortals  = rows.reduce(function(a, r) { return a + r.portal_loads; }, 0);
  var totalSessions = rows.reduce(function(a, r) { return a + r.module_sessions; }, 0);
  var totalModules  = rows.reduce(function(a, r) { return a + r.modules_used; }, 0);
  document.getElementById('s-schools').textContent  = rows.length;
  document.getElementById('s-portals').textContent  = totalPortals;
  document.getElementById('s-sessions').textContent = totalSessions;
  document.getElementById('s-avgtime').textContent  = totalModules;
}

// ── School selector ────────────────────────────────────────────────────────
function populateSchoolSelect(schools) {
  var sel = document.getElementById('school-select');
  var current = sel.value;
  sel.innerHTML = '<option value="">— Selecciona una escuela —</option>' +
    '<option value="__todas__">Todas las escuelas</option>';
  schools.forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    if (s === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

function onSchoolSelect(val) {
  var section  = document.getElementById('summary-section');
  var detail   = document.getElementById('detail-container');
  if (!val) {
    section.style.display = 'none';
    detail.innerHTML = '';
    return;
  }
  section.style.display = 'block';

  if (val === '__todas__') {
    renderSummaryTable(ALL_SUMMARY_ROWS);
    detail.innerHTML = '';
  } else {
    var row = ALL_SUMMARY_ROWS.filter(function(r) { return r.school === val; })[0];
    renderSummaryTable(row ? [row] : []);
    loadSchoolDetail(val);
  }
}

function renderSummaryTable(rows) {
  if (!rows.length) {
    document.getElementById('summary-tbody').innerHTML =
      '<tr><td colspan="5" class="empty">Sin datos todavía.</td></tr>';
    return;
  }
  document.getElementById('summary-tbody').innerHTML = rows.map(function(r) {
    var clickable = rows.length > 1 ? ' onclick="onSchoolSelect(\'' + r.school + '\')" style="cursor:pointer"' : '';
    return '<tr' + clickable + '>' +
      '<td>' + r.school + '</td>' +
      '<td><span class="badge badge-gold">' + r.portal_loads + '</span></td>' +
      '<td><span class="badge badge-purple">' + r.module_sessions + '</span></td>' +
      '<td><span class="badge badge-ok">' + r.modules_used + '</span></td>' +
      '<td>' + fmtTime(r.avg_time_sec) + '</td>' +
      '</tr>';
  }).join('');
}

// ── School detail ──────────────────────────────────────────────────────────
function loadSchoolDetail(school) {
  var detail = document.getElementById('detail-container');
  detail.innerHTML = '<div class="loading">Cargando detalle…</div>';
  fetch(GAS_URL + '?action=school&school=' + encodeURIComponent(school))
    .then(function(r) { return r.json(); })
    .then(renderSchoolDetail)
    .catch(function() {
      detail.innerHTML = '<div class="empty">Error al cargar el detalle.</div>';
    });
}

function renderSchoolDetail(data) {
  var modulesHtml = '';
  if (data.modules && data.modules.length) {
    var rows = data.modules.map(function(m) {
      return '<tr>' +
        '<td>' + (m.module_title || m.module_id) + '</td>' +
        '<td><span class="badge badge-purple">' + m.session_count + '</span></td>' +
        '<td>' + fmtTime(m.avg_time_sec) + '</td>' +
        '<td>' + m.active_days + '</td>' +
        '</tr>';
    }).join('');
    modulesHtml =
      '<div class="table-wrap" style="margin-bottom:0;border-radius:0;box-shadow:none;">' +
      '<table><thead><tr>' +
      '<th>Tema</th><th>Interacciones</th><th>Tiempo prom.</th><th>Días activo</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  } else {
    modulesHtml = '<div class="empty">Sin actividad en módulos todavía.</div>';
  }

  document.getElementById('detail-container').innerHTML =
    '<div class="detail-panel">' +
    '<div class="detail-panel-body">' +
    '<div class="detail-panel-label">Detalle por módulo</div>' +
    modulesHtml +
    '</div></div>';
}

// ── Helpers ────────────────────────────────────────────────────────────────
function fmtTime(sec) {
  if (!sec) return '—';
  if (sec < 60) return sec + 's';
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return m + 'm' + (s ? ' ' + s + 's' : '');
}

if (sessionStorage.getItem('lx_auth') === '1') loadAll();
</script>
</body>
</html>
