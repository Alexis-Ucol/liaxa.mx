<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instituciones que Defienden los Derechos Humanos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ══ MANIPULATIVES (shared shell) ══ */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1.15rem 0; }
.wgt-h { font-family:'Crimson Pro',serif; font-size:1.1rem; font-weight:700; margin-bottom:.2rem; }
.wgt-q { font-size:.82rem; color:var(--text3); margin-bottom:.85rem; }
.wcase { background:var(--surface2); border-radius:8px; padding:.75rem .9rem; font-size:.86rem; color:var(--text); margin-bottom:.6rem; border-left:3px solid var(--green); }
.wsub { font-size:.73rem; color:var(--text3); margin:.65rem 0 .3rem; text-transform:uppercase; letter-spacing:.07em; }
.wmsg { margin-top:.75rem; padding:.62rem .85rem; border-radius:0 8px 8px 0; border-left:3px solid var(--border); background:var(--surface2); color:var(--text2); font-size:.83rem; }
.wmsg.ok   { background:var(--ok-bg);   color:var(--ok);    border-left-color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left-color:var(--gold); }
.wmsg.bad  { background:var(--bad-bg);  color:var(--bad);   border-left-color:var(--bad); }
.wbtn { margin-top:.75rem; margin-right:.4rem; background:var(--green); color:#fff; border:none; border-radius:8px; padding:.55rem 1.1rem; font-size:.83rem; font-weight:600; cursor:pointer; min-height:44px; }
.wbtn:hover { background:var(--green-dark); }
.wbtn.alt { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.55rem; }

/* ══ W1 · BALANZA: RECOMENDACION O SENTENCIA ══ */
.bwrap { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; margin:.6rem 0 .2rem; }
@media(max-width:500px){ .bwrap { grid-template-columns:1fr; } }
.bcol { border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); padding:.55rem; min-height:72px; }
.bcol.left  { border-top:3px solid var(--gold); }
.bcol.right { border-top:3px solid var(--green); }
.bhead { font-size:.73rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; text-align:center; }
.bcount { font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--text2); }
.bitem { border:1.5px solid var(--border); border-radius:9px; background:var(--surface); color:var(--text2); padding:.5rem .65rem; font-size:.79rem; margin-bottom:.38rem; cursor:pointer; min-height:44px; display:flex; align-items:center; transition:all .15s; }
.bitem:hover { border-color:var(--green); }
.bitem.good { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
.bitem.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.btray { margin-top:.35rem; }

/* ══ W2 · MESA DE CASOS ══ */
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:.5rem; margin-top:.35rem; }
@media(max-width:500px){ .tiles { grid-template-columns:1fr; } }
.tile { border:1.5px solid var(--border); border-radius:10px; padding:.55rem .65rem; background:var(--surface2); color:var(--text2); cursor:pointer; min-height:56px; display:flex; flex-direction:column; justify-content:center; gap:.15rem; font-size:.79rem; transition:all .15s; }
.tile:hover { border-color:var(--green); }
.tile.sel  { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.tile.good { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.tile.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.tname { font-weight:600; }
.tmand { font-size:.71rem; color:var(--text3); }
.tile.good .tmand, .tile.miss .tmand { color:inherit; }

/* ══ W3 · CONSTRUCTOR DE LA QUEJA ══ */
.chips { display:flex; flex-direction:column; gap:.45rem; margin:.55rem 0; }
.chip { border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); color:var(--text2); padding:.55rem .7rem; font-size:.8rem; cursor:pointer; min-height:44px; display:flex; align-items:center; gap:.5rem; transition:all .15s; }
.chip:hover { border-color:var(--green); }
.chip.on   { border-color:var(--gold); background:var(--gold-bg); color:var(--text); font-weight:600; }
.chip.good { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.chip.miss { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mtr { margin-top:.6rem; }
.mtrlbl { display:flex; justify-content:space-between; font-size:.74rem; color:var(--text3); margin-bottom:.22rem; }
.mtrtrack { height:14px; border:1px solid var(--border); border-radius:7px; background:var(--surface2); overflow:hidden; }
.mtrfill { height:100%; width:0%; background:var(--bad); transition:width .34s; }
.mtrfill.mid { background:var(--gold); }
.mtrfill.ok  { background:var(--ok); }

/* ══ W4 · ESCALERA DE INSTANCIAS ══ */
.ladder { border-left:3px solid var(--border); margin:.55rem 0 .2rem .5rem; padding-left:.9rem; min-height:2.2rem; }
.lrung { display:flex; align-items:center; gap:.5rem; margin-bottom:.42rem; font-size:.8rem; color:var(--text2); }
.lbadge { background:var(--green); color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700; flex-shrink:0; }
.lbadge.warn { background:var(--gold); }
.step { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .75rem; font-size:.81rem; cursor:pointer; background:var(--surface2); color:var(--text2); margin-bottom:.4rem; min-height:44px; display:flex; align-items:center; transition:all .15s; }
.step:hover { border-color:var(--green); }
.step.used { opacity:.42; pointer-events:none; border-style:dashed; }

/* ══ W5 · FILTRO INTERAMERICANO ══ */
.crit { margin-bottom:.7rem; }
.critq { font-size:.8rem; color:var(--text2); margin-bottom:.3rem; font-weight:600; }
.tri { display:flex; gap:.45rem; flex-wrap:wrap; }
.tribtn { flex:1 1 40%; border:1.5px solid var(--border); border-radius:9px; padding:.5rem .6rem; font-size:.76rem; cursor:pointer; background:var(--surface2); color:var(--text2); min-height:44px; transition:all .15s; }
.tribtn:hover { border-color:var(--green); }
.tribtn.sel { border-color:var(--green); background:var(--green-bg); color:var(--green-dark); font-weight:600; }
.gate { display:flex; align-items:center; gap:.5rem; font-size:.78rem; color:var(--text3); margin-top:.3rem; }
.gdot { width:12px; height:12px; border-radius:50%; background:var(--border); flex-shrink:0; }
.gdot.on  { background:var(--ok); }
.gdot.off { background:var(--bad); }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Instituciones que Defienden los Derechos Humanos</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Instituciones que Defienden los Derechos Humanos</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');
  document.documentElement.setAttribute('lang', l);
  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });
    prev.forEach(function(ch, idx){ if(ch!==null && ch!==undefined) confirmMC(idx, ch); });

      res.style.display='block'; setTimeout(function(){ res.classList.add('vis'); }, 50);
    }
  }
}
/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'fce3_t05_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce3_t05_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce3_t05_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────
  //   When injecting logos, replace the two placeholder lines below with:
  //     var logoLeftB64  = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //     var logoRightB64 = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //   Then uncomment the two doc.addImage() calls.
  //   Left logo  → Facultad / department logo  (x=M,   y=4,  w=48, h=22)
  //   Right logo → University logo             (x=130, y=4,  w=48, h=22)
  // var logoLeftB64  = '{{LOGO_LEFT_B64}}';
  // var logoRightB64 = '{{LOGO_RIGHT_B64}}';
  // doc.addImage(logoLeftB64,  'PNG', M,   4, 48, 22);
  // doc.addImage(logoRightB64, 'PNG', 130, 4, 48, 22);
  // ─────────────────────────────────────────────────────────────────────────

  // LIAXA logo — right side of white strip
  var lx = PW - M - 36;
  var ly = 10;
  doc.setDrawColor(pBR,pBG,pBB); doc.setLineWidth(0.7);
  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);
  doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(11); doc.setFont('helvetica','bold');

  // ── Student info card (name + group only — código goes to footer) ──

  doc.text(name, M+4, 87); doc.text(group, 130, 87);

    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');

    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');

    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);

    var ta = document.getElementById('ta'+i);

      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');

      taLines.slice(0,16).forEach(function(ln) {

      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('fce3_t05_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

function S(es, en){ return LANG === 'es' ? es : en; }

function addSection(tag, html){
  var d = document.createElement('div');

/* Shuffles options (Rule 7) keeping ES/EN aligned, then builds the card inline (Rule 1/5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     false,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ================================================
   WIDGET 1 · BALANZA: RECOMENDACION O SENTENCIA
   Eight acts start in a tray. Each tap moves an act to the left plate, then to
   the right plate, then back to the tray, and the two counters update at once so
   the student sees the balance shift while deciding. Checking answers with how
   many acts sit on the wrong plate and with the trait that separates the two
   vías, never with a bare verdict. Third miss opens both plates (Rule 8, A).
   ================================================ */
var BL = null;
function buildBalanza(rng){
  var bank = [
    { es:'Recibe una queja gratuita, sin abogado y por escrito, teléfono o correo.',
      en:'It receives a free complaint, without a lawyer, in writing, by phone or by email.', side:0 },
    { es:'Termina en un documento público que describe la violación y pide reparar.',
      en:'It ends in a public document that describes the violation and asks for reparation.', side:0 },
    { es:'Pide a la autoridad medidas urgentes mientras investiga el caso.',
      en:'It asks the authority for urgent measures while it investigates the case.', side:0 },
    { es:'Su resultado no se ejecuta por la fuerza, pero la autoridad debe responder por escrito.',
      en:'Its result is not enforced by force, but the authority must answer in writing.', side:0 },
    { es:'Publica informes especiales sobre un problema que se repite en una región.',
      en:'It publishes special reports on a problem that repeats in a region.', side:0 },
    { es:'Puede pedir que la autoridad que rechaza el documento comparezca ante el Congreso.',
      en:'It can ask that the authority rejecting the document appear before Congress.', side:0 },
    { es:'Un juez estudia el acto reclamado y dicta una resolución obligatoria.',
      en:'A judge studies the challenged act and issues a binding resolution.', side:1 },
    { es:'La resolución puede dejar sin efecto el acto de autoridad que se reclamó.',
      en:'The resolution can annul the act of authority that was challenged.', side:1 },
    { es:'El cumplimiento se exige con la fuerza del Estado y hay consecuencias si no se acata.',
      en:'Compliance is demanded with the force of the State and there are consequences if it is not obeyed.', side:1 },
    { es:'El trámite sigue plazos y formas fijadas por la ley procesal.',
      en:'The procedure follows deadlines and forms set by procedural law.', side:1 },
    { es:'La decisión se toma en un juicio con pruebas y con las dos partes presentes.',
      en:'The decision is taken in a trial with evidence and with both parties present.', side:1 },
    { es:'Una sentencia internacional firme ordena al Estado reparar y modificar prácticas.',
      en:'A final international ruling orders the State to repair and to change practices.', side:1 }
  ];
  var soft = shuffle(bank.filter(function(b){ return b.side === 0; }), rng).slice(0,4);
  var hard = shuffle(bank.filter(function(b){ return b.side === 1; }), rng).slice(0,4);
  BL = { items:shuffle(soft.concat(hard), rng), place:[0,0,0,0,0,0,0,0], tries:0, done:false, cls:'',
         msg:{ es:'Toca un acto para moverlo al platillo de la izquierda, otra vez para pasarlo a la derecha y una vez más para devolverlo a la mesa.',
               en:'Tap an act to move it to the left plate, tap again to send it to the right plate and once more to return it to the table.' } };
  return '<div class="wgt" id="blw">' +
    '<div class="wgt-h">' + S('Balanza de las dos vías','Balance of the two routes') + '</div>' +
    '<div class="wgt-q">' + S('Coloca cada acto en el platillo de la vía que le corresponde. Puedes moverlos cuántas veces quieras antes de revisar.','Place each act on the plate of the route it belongs to. You can move them as many times as you want before checking.') + '</div>' +
    '<div class="bwrap">' +
      '<div class="bcol left"><div class="bhead">' + S('Via no jurisdiccional','Non judicial route') + '</div><div id="blleft"></div></div>' +
      '<div class="bcol right"><div class="bhead">' + S('Via jurisdiccional','Judicial route') + '</div><div id="blright"></div></div>' +
    '</div>' +
    '<div class="wsub">' + S('Actos sobre la mesa','Acts on the table') + '</div>' +
    '<div class="btray" id="bltray"></div>' +
    '<div class="wmsg" id="blmsg"></div>' +
    '<button class="wbtn" onclick="blCheck()">' + S('Pesar la balanza','Weigh the balance') + '</button>' +
    '<button class="wbtn alt" onclick="blReset()">' + S('Devolver todo a la mesa','Return everything to the table') + '</button>' +
    '<div class="wprog" id="blprog"></div>' +
  '</div>';
}
function blItemHTML(i){
  var cl = 'bitem';
  if (BL.done) cl += (BL.place[i] === BL.items[i].side + 1) ? ' good' : ' miss';
  return '<div class="' + cl + '" onclick="blTap(' + i + ')">' + BL.items[i][LANG] + '</div>';
}
function blRender(){
  if (!BL || !document.getElementById('bltray')) return;
  var L = '', R = '', T = '', i;
  for (i = 0; i < BL.items.length; i++){
    if (BL.place[i] === 1) L += blItemHTML(i);
    else if (BL.place[i] === 2) R += blItemHTML(i);
    else T += blItemHTML(i);
  }
  document.getElementById('blleft').innerHTML  = L || '<div class="bcount">' + S('platillo vacío','empty plate') + '</div>';
  document.getElementById('blright').innerHTML = R || '<div class="bcount">' + S('platillo vacío','empty plate') + '</div>';
  document.getElementById('bltray').innerHTML  = T || '<div class="bcount">' + S('la mesa quedó despejada','the table is clear') + '</div>';
  var m = document.getElementById('blmsg');
  m.className = 'wmsg' + (BL.cls ? ' ' + BL.cls : '');
  m.innerHTML = BL.msg[LANG];
  var nl = 0, nr = 0;
  for (i = 0; i < BL.place.length; i++){ if (BL.place[i] === 1) nl++; if (BL.place[i] === 2) nr++; }
  document.getElementById('blprog').textContent =
    S('Izquierda: ','Left: ') + nl + S('  ·  derecha: ','  ·  right: ') + nr +
    S('  ·  sobre la mesa: ','  ·  on the table: ') + (BL.items.length - nl - nr);
}
function blTap(i){
  if (!BL || BL.done) return;
  BL.place[i] = (BL.place[i] + 1) % 3;
  BL.cls = '';
  var side = BL.place[i];
  BL.msg = side === 1
    ? { es:'Ese acto queda en la vía no jurisdiccional. Pregúntate si de verdad termina en un documento que la autoridad no puede ser forzada a acatar.',
        en:'That act stays on the non judicial route. Ask yourself whether it really ends in a document the authority cannot be forced to obey.' }
    : side === 2
    ? { es:'Ese acto queda en la vía jurisdiccional. Pregúntate si lo decide una persona juzgadora y si su resultado obliga.',
        en:'That act stays on the judicial route. Ask yourself whether a judge decides it and whether its result is binding.' }
    : { es:'Ese acto vuelve a la mesa. Puedes colocarlo otra vez cuando lo tengas claro.',
        en:'That act returns to the table. You can place it again when it is clear to you.' };
  blRender();
}
function blCheck(){
  if (!BL || BL.done) return;
  var placed = 0, wrong = 0, wsoft = 0, whard = 0, i;
  for (i = 0; i < BL.items.length; i++){
    if (BL.place[i] === 0) continue;
    placed++;
    if (BL.place[i] !== BL.items[i].side + 1){ wrong++; if (BL.items[i].side === 0) wsoft++; else whard++; }
  }
  if (placed === BL.items.length && wrong === 0){
    BL.done = true; BL.cls = 'ok';
    BL.msg = { es:'Balanza equilibrada. La vía no jurisdiccional es abierta, gratuita y rápida, y su fuerza es pública: describe, documenta y exige respuesta. La vía jurisdiccional es mas lenta y formal, y su fuerza es obligatoria. Las dos defienden el mismo derecho con instrumentos distintos.',
               en:'The balance is even. The non judicial route is open, free and fast, and its force is public: it describes, documents and demands an answer. The judicial route is slower and formal, and its force is binding. Both defend the same right with different instruments.' };
  } else if (placed < BL.items.length){
    BL.cls = 'bad';
    BL.msg = { es:'Todavía quedan ' + (BL.items.length - placed) + ' actos sobre la mesa. Coloca cada uno preguntándote quién toma la decisión: un organismo que recomienda o una persona juzgadora que obliga.',
               en:'There are still ' + (BL.items.length - placed) + ' acts on the table. Place each one asking who takes the decision: a body that recommends or a judge who binds.' };
  } else {
    BL.tries++;
    if (BL.tries >= 3){
      BL.done = true; BL.cls = 'warn';
      BL.msg = { es:'Así queda la balanza. Fíjate en el rasgo que separa los dos platillos: a la izquierda nadie ejecuta el resultado por la fuerza, a la derecha si.',
                 en:'This is how the balance stands. Notice the trait that separates the two plates: on the left nobody enforces the result by force, on the right they do.' };
    } else {
      BL.cls = 'bad';
      BL.msg = { es:'Hay ' + wrong + ' actos en el platillo equivocado' +
                   (whard ? ': ' + whard + ' de ellos los decide un juez y obligan, por eso van a la derecha.' : '') +
                   (wsoft ? ' ' + wsoft + ' de ellos terminan en un documento público que no se ejecuta por la fuerza, por eso van a la izquierda.' : '') +
                   ' Muévelos y vuelve a pesar.',
                 en:'There are ' + wrong + ' acts on the wrong plate' +
                   (whard ? ': ' + whard + ' of them are decided by a judge and are binding, so they go to the right.' : '') +
                   (wsoft ? ' ' + wsoft + ' of them end in a public document that is not enforced by force, so they go to the left.' : '') +
                   ' Move them and weigh again.' };
    }
  }
  blRender();
}
function blReset(){
  if (!BL || BL.done) return;
  BL.place = BL.place.map(function(){ return 0; }); BL.cls = '';
  BL.msg = { es:'Mesa despejada. Empieza otra vez por los actos que reconoces con seguridad.',
             en:'Table cleared. Start again with the acts you recognize with certainty.' };
  blRender();
}

/* ================================================
   WIDGET 2 · MESA DE CASOS
   A case arrives at the desk and the student routes it by tapping one of six
   institutions. The tile lights up at once and the desk answers with the mandate
   of the institution chosen and with the detail of the case that decides the
   route, so the feedback points at the criterion instead of grading. Three cases
   per run, reveal inside each case (Rule 8, pattern B).
   ================================================ */
var CS = null;
var CSI = [
  { es:'Comisión estatal de derechos humanos', en:'State human rights commission',
    m:{ es:'quejas contra autoridades del estado o del municipio', en:'complaints against state or municipal authorities' } },
  { es:'Comisión Nacional de los Derechos Humanos', en:'National Human Rights Commission',
    m:{ es:'quejas contra autoridades federales', en:'complaints against federal authorities' } },
  { es:'Consejo Nacional para Prevenir la Discriminación', en:'National Council to Prevent Discrimination',
    m:{ es:'actos de discriminación, incluso de particulares', en:'acts of discrimination, including by private parties' } },
  { es:'Procuraduría de protección de niñas, niños y adolescentes', en:'Office for the protection of children and adolescents',
    m:{ es:'protección especial de personas menores de edad', en:'special protection of people under age' } },
  { es:'Juzgado federal por la vía del amparo', en:'Federal court through the amparo trial',
    m:{ es:'resolución obligatoria contra un acto de autoridad', en:'binding resolution against an act of authority' } },
  { es:'Comisión Interamericana de Derechos Humanos', en:'Inter-American Commission on Human Rights',

];
function buildMesa(rng){
  var cases = [
    { es:'Una patrulla municipal detiene a un joven a la salida de la escuela, lo mantiene una hora en la unidad sin explicarle por qué y lo deja ir sin registro alguno. La familia quiere que el hecho quede documentado y que la corporación reciba una recomendación.',
      en:'A municipal patrol stops a young man outside his school, keeps him in the vehicle for an hour without explaining why and lets him go without any record. The family wants the fact documented and the police corps to receive a recommendation.',
      k:0,
      why:{ es:'la autoridad señalada pertenece a un municipio y el caso no llegó todavía a ningun tribunal.',
            en:'the authority named belongs to a municipality and the case has not yet reached any court.' } },
    { es:'En un hospital que depende de una institución federal de salud, el personal niega atención a una mujer embarazada porque el domicilio de su credencial es de otro estado. Ella quiere presentar una queja gratuita para que se investigue.',
      en:'In a hospital that depends on a federal health institution, the staff denies care to a pregnant woman because the address on her ID is from another state. She wants to file a free complaint so the case is investigated.',
      k:1,
      why:{ es:'quien niega el servicio es personal de una institución federal, y la persona busca una queja gratuita y no un juicio.',

    { es:'La dueña de un local comercial impide la entrada a una familia y le dice, delante de otros clientes, que ahi no atienden a personas que hablan una lengua originaria. No hay ninguna autoridad involucrada en el hecho.',

    { es:'Una niña de once años vive con un familiar que le impide asistir a la escuela y no la lleva a sus consultas médicas. Una vecina busca a quien pueda ordenar medidas de protección inmediatas para ella.',
      en:'An eleven year old girl lives with a relative who prevents her from attending school and does not take her to medical appointments. A neighbor looks for who can order immediate protection measures for her.',
      k:3,
      why:{ es:'la persona afectada es menor de edad y necesita medidas de protección especiales e inmediatas.',

    { es:'Una autoridad ordena demoler la vivienda de una familia en tres días. La familia necesita una resolución que suspenda de inmediato esa orden y que la autoridad esté obligada a acatar.',
      en:'An authority orders the demolition of a family home within three days. The family needs a resolution that immediately suspends that order and that the authority is obliged to obey.',
      k:4,
      why:{ es:'lo que se busca es detener un acto de autoridad con una resolución obligatoria, y eso solo lo dicta una persona juzgadora.',
            en:'what is sought is to stop an act of authority with a binding resolution, and only a judge issues that.' } },
    { es:'Un grupo agotó todas las instancias del país: hubo juicio, sentencia firme y una recomendación incumplida. Hace cuatro meses les notificaron la última resolución y quieren que el caso se revise fuera del país.',
      en:'A group exhausted every instance in the country: there was a trial, a final ruling and an unfulfilled recommendation. Four months ago they were notified of the last resolution and they want the case reviewed outside the country.',
      k:5,
      why:{ es:'ya se agotaron las instancias internas y el reclamo se dirige ahora contra el Estado en su conjunto.',

  ];
  CS = { pool:shuffle(cases, rng).slice(0,3), r:0, sel:-1, tries:0, reveal:false, done:false, cls:'',
         msg:{ es:'Lee el caso, mira el mandato de cada institución y toca la que debe recibirlo. Puedes cambiar de institución antes de turnar.',
               en:'Read the case, look at the mandate of each institution and tap the one that should receive it. You can change institution before sending it.' } };

    '<div class="wgt-q">' + S('Cada institución atiende lo que su mandato le permite atender. Turna cada caso a la que corresponde.','Each institution handles what its mandate allows it to handle. Send each case to the right one.') + '</div>' +

function csRender(){
  if (!CS || !document.getElementById('cstiles')) return;
  var c = CS.pool[CS.r];
  document.getElementById('cscase').innerHTML = c[LANG];
  document.getElementById('cstiles').innerHTML = CSI.map(function(inst, i){

    return '<div class="' + cl + '" onclick="csTap(' + i + ')"><span class="tname">' + inst[LANG] + '</span><span class="tmand">' + inst.m[LANG] + '</span></div>';
  }).join('');

  m.className = 'wmsg' + (CS.cls ? ' ' + CS.cls : '');

    S('Caso ','Case ') + (CS.r + 1) + ' / ' + CS.pool.length +

function csTap(i){
  if (!CS || CS.done || CS.reveal) return;
  CS.sel = (CS.sel === i) ? -1 : i;
  CS.cls = '';
  CS.msg = CS.sel >= 0
    ? { es:'Elegiste una institución cuyo mandato es: ' + CSI[i].m.es + '. Compara ese mandato con lo que el caso describe antes de turnarlo.',
        en:'You chose an institution whose mandate is: ' + CSI[i].m.en + '. Compare that mandate with what the case describes before sending it.' }
    : { es:'Mesa libre otra vez. Vuelve a leer quién comete el acto y qué resultado busca la persona afectada.',
        en:'The desk is free again. Read again who commits the act and what result the affected person seeks.' };
  csRender();
}
function csAct(){
  if (!CS || CS.done) return;
  if (CS.reveal){ csNext(); return; }
  var c = CS.pool[CS.r];
  if (CS.sel < 0){
    CS.cls = 'bad';
    CS.msg = { es:'Todavía no eliges institución. Empieza por identificar quién comete el acto: una autoridad municipal, una federal, una particular o ninguna de ellas.',
               en:'You have not chosen an institution yet. Start by identifying who commits the act: a municipal authority, a federal one, a private party or none of them.' };
    csRender(); return;
  }
  if (CS.sel === c.k){
    CS.reveal = true; CS.cls = 'ok';
    CS.msg = { es:'Turnado correctamente: ' + c.why.es + ' Por eso el caso entra en el mandato de esa institución.',
               en:'Correctly sent: ' + c.why.en + ' That is why the case falls inside the mandate of that institution.' };
  } else {
    CS.tries++;
    if (CS.tries >= 3){
      CS.reveal = true; CS.cls = 'warn';
      CS.msg = { es:'La institución que corresponde queda marcada: ' + c.why.es + ' Un caso mal turnado no se pierde, pero se retrasa, y por eso conviene leer primero el mandato.',
                 en:'The institution that fits is marked: ' + c.why.en + ' A misrouted case is not lost, but it is delayed, and that is why reading the mandate first helps.' };
    } else {
      CS.cls = 'bad';
      CS.msg = { es:'Esa institución atiende ' + CSI[CS.sel].m.es + ', y el caso no encaja ahi. Fíjate en ' + c.why.es + ' Elige otra vez.',
                 en:'That institution handles ' + CSI[CS.sel].m.en + ', and the case does not fit there. Look at ' + c.why.en + ' Choose again.' };
      CS.sel = -1;
    }
  }
  csRender();
}
function csNext(){
  if (CS.r + 1 >= CS.pool.length){
    CS.done = true; CS.reveal = true; CS.cls = 'ok';
    CS.msg = { es:'Mesa despejada. Ninguna institución puede con todo: cada una tiene un mandato escrito que define a quien vigila y que puede hacer. Saber leer ese mandato es el primer paso para exigir con eficacia.',
               en:'The desk is clear. No institution can do everything: each one has a written mandate that defines who it oversees and what it can do. Knowing how to read that mandate is the first step to demand effectively.' };
  } else {
    CS.r++; CS.sel = -1; CS.tries = 0; CS.reveal = false; CS.cls = '';
    CS.msg = { es:'Llega otro caso a la mesa. Vuelve a preguntarte quién comete el acto y qué resultado busca la persona afectada.',
               en:'Another case arrives at the desk. Ask again who commits the act and what result the affected person seeks.' };
  }
  csRender();
}

/* ================================================
   WIDGET 3 · CONSTRUCTOR DE LA QUEJA
   The student builds the file that a commission can actually open. Every tap
   adds or removes an element and the completeness meter moves at once, dropping
   when something that no organism can investigate is added. Checking answers
   with what is still missing, not with a verdict (Rule 8, pattern A).
   ================================================ */
var QJ = null;
function buildQueja(rng){
  var bank = [
    { es:'El nombre de quien presenta la queja y un medio para localizarla.',
      en:'The name of the person filing the complaint and a way to reach them.', need:true,
      clue:{ es:'sin un medio de contacto el organismo no puede pedir más datos ni avisar del resultado',
             en:'without a means of contact the body cannot ask for more details or report the result' } },
    { es:'La narración de los hechos: qué ocurrió, en qué fecha y en qué lugar.',
      en:'The account of the facts: what happened, on what date and in what place.', need:true,
      clue:{ es:'una queja sin hechos concretos no puede investigarse, porque no hay nada que verificar',
             en:'a complaint without concrete facts cannot be investigated, because there is nothing to verify' } },
    { es:'La autoridad o la persona servidora pública señalada, o los datos que permitan identificarla.',
      en:'The authority or public servant named, or the details that allow identifying them.', need:true,
      clue:{ es:'el organismo vigila autoridades, así que necesita saber a cuál se dirige la investigación',
             en:'the body oversees authorities, so it needs to know which one the investigation is aimed at' } },
    { es:'Los documentos, fotografías o testimonios que respalden lo narrado, si se tienen.',
      en:'The documents, photographs or testimonies that support the account, if available.', need:true,
      clue:{ es:'las pruebas disponibles sostienen la investigación desde el primer día',
             en:'the available evidence supports the investigation from the first day' } },
    { es:'La firma o la huella de quien presenta la queja.',
      en:'The signature or fingerprint of the person filing the complaint.', need:true,
      clue:{ es:'la firma es lo que convierte el escrito en una queja formal atribuible a una persona',
             en:'the signature is what turns the writing into a formal complaint attributable to a person' } },
    { es:'Una opinión general sobre si el gobierno del país funciona bien o mal.',
      en:'A general opinion about whether the government of the country works well or badly.', need:false,
      clue:{ es:'una opinión general no señala un hecho ni una autoridad, y no puede investigarse',
             en:'a general opinion points to no fact and no authority, and cannot be investigated' } },
    { es:'Insultos y calificativos dirigidos a la persona servidora pública señalada.',
      en:'Insults and name calling aimed at the public servant named.', need:false,
      clue:{ es:'los calificativos no aportan información sobre el hecho y debilitan el expediente',
             en:'name calling adds no information about the fact and weakens the file' } },
    { es:'El comprobante del pago de una cuota para abrir el expediente.',
      en:'The receipt of a fee paid to open the file.', need:false,
      clue:{ es:'la queja ante estos organismos es gratuita y ese requisito no existe',
             en:'the complaint before these bodies is free and that requirement does not exist' } },
    { es:'La firma de un abogado que represente a la persona afectada.',
      en:'The signature of a lawyer representing the affected person.', need:false,
      clue:{ es:'no se necesita abogado: cualquier persona puede presentar la queja por sí misma',
             en:'no lawyer is needed: any person can file the complaint by themselves' } },
    { es:'Una nota de prensa sobre un caso distinto ocurrido en otro estado.',
      en:'A press clipping about a different case that happened in another state.', need:false,
      clue:{ es:'un caso ajeno no prueba lo que le ocurrió a esta persona',
             en:'an unrelated case does not prove what happened to this person' } }
  ];
  var cases = [
    { es:'Rosalía acudió a una oficina pública a pedir un apoyo al que tiene derecho. El servidor público que la atendió le dijo que no le daría el trámite mientras no fuera acompañada por un hombre de su familia. Rosalía quiere presentar una queja.',
      en:'Rosalia went to a public office to request a support she is entitled to. The public servant who attended her said he would not process it unless she came with a man from her family. Rosalia wants to file a complaint.' },
    { es:'A Emiliano, que usa silla de ruedas, le negaron el acceso a la única ventanilla de una oficina pública porque está en el segundo piso y el elevador lleva meses descompuesto. Nadie le ofreció otra forma de hacer su trámite.',
      en:'Emiliano, who uses a wheelchair, was denied access to the only service window of a public office because it is on the second floor and the elevator has been out of order for months. Nobody offered him another way to complete his procedure.' },
    { es:'En una escuela pública le dijeron a la familia de Tania que no la inscribirían este ciclo porque el personal no sabe cómo trabajar con estudiantes sordos. La familia tiene el oficio con la negativa por escrito.',
      en:'At a public school the family of Tania was told she would not be enrolled this year because the staff does not know how to work with deaf students. The family has the written refusal document.' }
  ];
  var order = shuffle(bank, rng);
  QJ = { items:order, sel:[], tries:0, done:false, cls:'',
         cs:cases[Math.floor(rng() * cases.length)],
         need:order.filter(function(b){ return b.need; }).length,
         msg:{ es:'Toca los elementos que debe llevar el escrito. Toca otra vez para quitarlos: el medidor se mueve contigo.',
               en:'Tap the elements the document must carry. Tap again to remove them: the meter moves with you.' } };
  return '<div class="wgt" id="qjw">' +
    '<div class="wgt-h">' + S('Constructor de la queja','Complaint builder') + '</div>' +
    '<div class="wgt-q">' + S('Arma un escrito que el organismo pueda abrir e investigar.','Build a document that the body can open and investigate.') + '</div>' +
    '<div class="wcase" id="qjcase"></div>' +
    '<div class="chips" id="qjchips"></div>' +
    '<div class="mtr"><div class="mtrlbl"><span id="qjlbl"></span><span id="qjpct"></span></div>' +
      '<div class="mtrtrack"><div class="mtrfill" id="qjfill"></div></div></div>' +
    '<div class="wmsg" id="qjmsg"></div>' +
    '<button class="wbtn" onclick="qjCheck()">' + S('Revisar el escrito','Check the document') + '</button>' +
    '<button class="wbtn alt" onclick="qjReset()">' + S('Empezar de nuevo','Start over') + '</button>' +
  '</div>';

function qjScore(){
  var hit = 0, extra = 0;
  QJ.sel.forEach(function(i){ if (QJ.items[i].need) hit++; else extra++; });
  var v = Math.round((hit - extra) / QJ.need * 100);
  if (v < 0) v = 0; if (v > 100) v = 100;
  return { hit:hit, extra:extra, pct:v };
}
function qjRender(){
  if (!QJ || !document.getElementById('qjchips')) return;
  document.getElementById('qjcase').innerHTML = QJ.cs[LANG];
  document.getElementById('qjchips').innerHTML = QJ.items.map(function(it, i){
    var on = QJ.sel.indexOf(i) >= 0, cl = 'chip';
    if (QJ.done) cl += it.need ? ' good' : (on ? ' miss' : '');
    else if (on) cl += ' on';
    return '<div class="' + cl + '" onclick="qjTap(' + i + ')">' + it[LANG] + '</div>';
  }).join('');
  var sc = qjScore();
  var f = document.getElementById('qjfill');
  f.className = 'mtrfill' + (sc.pct >= 100 ? ' ok' : sc.pct >= 50 ? ' mid' : '');
  f.style.width = sc.pct + '%';
  document.getElementById('qjlbl').textContent = S('Escrito listo para abrirse','Document ready to be opened');
  document.getElementById('qjpct').textContent = sc.pct + '%';
  var m = document.getElementById('qjmsg');
  m.className = 'wmsg' + (QJ.cls ? ' ' + QJ.cls : '');
  m.innerHTML = QJ.msg[LANG];
}
function qjTap(i){
  if (!QJ || QJ.done) return;
  var k = QJ.sel.indexOf(i);
  if (k >= 0) QJ.sel.splice(k, 1); else QJ.sel.push(i);
  var it = QJ.items[i], added = (k < 0);
  QJ.cls = '';
  QJ.msg = added
    ? (it.need
        ? { es:'Ese dato suma: ' + it.clue.es + '.', en:'That detail adds up: ' + it.clue.en + '.' }
        : { es:'El medidor bajó: ' + it.clue.es + '.', en:'The meter dropped: ' + it.clue.en + '.' })
    : { es:'Quitaste ese elemento. Vuelve a leer el caso y decide si el escrito puede sostenerse sin él.',
        en:'You removed that element. Read the case again and decide whether the document can stand without it.' };
  qjRender();
}
function qjCheck(){
  if (!QJ || QJ.done) return;
  var sc = qjScore();
  if (sc.hit === QJ.need && sc.extra === 0){
    QJ.done = true; QJ.cls = 'ok';
    QJ.msg = { es:'Escrito completo. Con estos elementos el organismo puede abrir un expediente, pedir informes a la autoridad señalada y, si el daño continúa, solicitar medidas cautelares mientras investiga. Nada de esto cuesta dinero ni exige abogado.',
               en:'The document is complete. With these elements the body can open a file, request reports from the authority named and, if the harm continues, ask for precautionary measures while it investigates. None of this costs money or requires a lawyer.' };
  } else {
    QJ.tries++;
    if (QJ.tries >= 3){
      QJ.done = true; QJ.cls = 'warn';
      QJ.msg = { es:'Estos son los elementos que sostienen la queja, marcados en el escrito. Los demás no se rechazan por antipáticos: se rechazan porque no dicen quién actuó, qué hizo ni cuándo.',
                 en:'These are the elements that sustain the complaint, marked in the document. The others are not rejected for being unpleasant: they are rejected because they do not say who acted, what they did or when.' };
    } else {
      var miss = null, i;
      for (i = 0; i < QJ.items.length; i++){ if (QJ.items[i].need && QJ.sel.indexOf(i) < 0){ miss = QJ.items[i]; break; } }
      var extraItem = null;
      for (i = 0; i < QJ.sel.length; i++){ if (!QJ.items[QJ.sel[i]].need){ extraItem = QJ.items[QJ.sel[i]]; break; } }
      QJ.cls = 'bad';
      QJ.msg = { es:'El escrito llega al ' + sc.pct + '% y aún no puede abrirse. ' +
                    (miss ? 'Falta un elemento sin el cual la investigación no arranca: ' + miss.clue.es + '. ' : '') +
                    (extraItem ? 'Y sobra algo: ' + extraItem.clue.es + '. ' : '') + 'Ajústalo y vuelve a revisar.',
                 en:'The document reaches ' + sc.pct + '% and still cannot be opened. ' +
                    (miss ? 'One element is missing without which the investigation does not start: ' + miss.clue.en + '. ' : '') +
                    (extraItem ? 'And something is left over: ' + extraItem.clue.en + '. ' : '') + 'Adjust it and check again.' };
    }
  }
  qjRender();
}
function qjReset(){
  if (!QJ || QJ.done) return;
  QJ.sel = []; QJ.cls = '';
  QJ.msg = { es:'Escrito en blanco. Empieza por lo que responde a las preguntas quién, qué, cuándo y dónde.',
             en:'Blank document. Start with what answers the questions who, what, when and where.' };
  qjRender();
}

var ES = null;

function esRender(){

    }
  }

}
function esReset(){
  if (!ES || ES.done) return;
  ES.placed = []; ES.cls = '';

/* ================================================
   WIDGET 5 · FILTRO DEL SISTEMA INTERAMERICANO
