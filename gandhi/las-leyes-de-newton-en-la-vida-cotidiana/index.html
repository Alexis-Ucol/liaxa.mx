  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Tercera ley: las fuerzas siempre vienen de a dos', en:'Third law: forces always come in twos' }),
    '<p>' + L({
      es:'Ninguna fuerza existe sola. Siempre que un cuerpo empuja a otro, el segundo empuja al primero con la misma intensidad y en sentido contrario. A ese conjunto se le llama par de acción y reacción, y sus dos fuerzas ocurren al mismo tiempo, no una después de la otra.',
      en:'No force exists alone. Whenever one body pushes another, the second pushes the first with the same intensity and in the opposite direction. That set is called an action and reaction pair, and its two forces happen at the same time, not one after the other.'
    }) + '</p>' +
    '<p>' + L({
      es:'El detalle que decide todo es sobre quién actúa cada una. Las dos fuerzas del par nunca caen sobre el mismo cuerpo: una actúa sobre el primer cuerpo y la otra sobre el segundo. Por eso no se cancelan entre sí y por eso el mundo sí se mueve.',
      en:'The detail that decides everything is who each one acts on. The two forces of the pair never fall on the same body: one acts on the first body and the other on the second. That is why they do not cancel each other and that is why the world does move.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Nadar', en:'Swimming' }), L({ es:'agua y nadador', en:'water and swimmer' }), L({ es:'la mano empuja el agua hacia atrás y el agua empuja al nadador hacia adelante', en:'the hand pushes the water backwards and the water pushes the swimmer forwards' })) +
      rcard(L({ es:'Caminar', en:'Walking' }), L({ es:'pie y suelo', en:'foot and ground' }), L({ es:'el pie empuja el suelo hacia atrás y el suelo empuja a la persona hacia adelante', en:'the foot pushes the ground backwards and the ground pushes the person forwards' })) +
      rcard(L({ es:'Globo que se desinfla', en:'Deflating balloon' }), L({ es:'globo y aire', en:'balloon and air' }), L({ es:'el globo expulsa aire hacia atrás y el aire empuja al globo hacia adelante', en:'the balloon expels air backwards and the air pushes the balloon forwards' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Una confusión común es pensar que si las dos fuerzas son iguales y opuestas entonces nada puede moverse. Eso solo pasaría si actuaran sobre el mismo cuerpo. Cuando empujas una pared, la pared te empuja a ti: la fuerza que recibe la pared está sobre la pared y la que recibes tú está sobre ti.',
      en:'A common confusion is thinking that if the two forces are equal and opposite then nothing can move. That would only happen if they acted on the same body. When you push a wall, the wall pushes you: the force the wall receives is on the wall and the one you receive is on you.'
    }) + '</p></div>'
  );
  w4(rng, widgetHost(s4, 'w_pares'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'La fricción, la fuerza que casi siempre está', en:'Friction, the force that is almost always there' }),
    '<p>' + L({
      es:'Cuando dos superficies se tocan aparece una fuerza que se opone al deslizamiento entre ellas: la fricción. Siempre apunta en contra del movimiento o del intento de movimiento, y depende de qué tan ásperas son las superficies y de qué tan apretadas están una contra otra.',
      en:'When two surfaces touch, a force appears that opposes sliding between them: friction. It always points against the motion or against the attempt to move, and it depends on how rough the surfaces are and on how tightly they are pressed together.'
    }) + '</p>' +
    '<p>' + L({
      es:'La fricción tiene dos caras. Mientras el objeto no se mueve, la fricción crece justo lo necesario para cancelar el empuje, y por eso un mueble pesado se queda quieto aunque lo empujes. Una vez que el objeto se desliza, la fricción se vuelve más o menos constante y frena el avance.',
      en:'Friction has two faces. While the object does not move, friction grows just enough to cancel the push, and that is why a heavy piece of furniture stays put even though you push it. Once the object slides, friction becomes more or less constant and slows the advance.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Empuje menor que la fricción', en:'Push smaller than friction' }), L({ es:'sigue quieto', en:'stays still' }), L({ es:'las fuerzas se equilibran y no hay cambio de movimiento', en:'the forces balance and there is no change of motion' })) +
      rcard(L({ es:'Empuje igual a la fricción', en:'Push equal to friction' }), L({ es:'rapidez constante', en:'constant speed' }), L({ es:'el objeto ya se desliza y avanza sin ganar ni perder rapidez', en:'the object is already sliding and moves on without gaining or losing speed' })) +
      rcard(L({ es:'Empuje mayor que la fricción', en:'Push greater than friction' }), L({ es:'gana rapidez', en:'gains speed' }), L({ es:'queda fuerza neta a favor del avance y el objeto acelera', en:'net force is left in favour of the advance and the object accelerates' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La fricción no siempre estorba. Sin ella no podrías caminar, los frenos de una bicicleta no servirían de nada y un lápiz se resbalaría de tu mano. Las suelas de goma y las llantas con dibujo existen para tener más fricción, no menos.',
      en:'Friction is not always a nuisance. Without it you could not walk, bicycle brakes would be useless and a pencil would slip out of your hand. Rubber soles and patterned tyres exist to have more friction, not less.'
    }) + '</p></div>'
  );
  w5(rng, widgetHost(s5, 'w_friccion'));
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Poner las leyes a prueba', en:'Putting the laws to the test' }),
    '<p>' + L({
      es:'Una ley de la física no se acepta porque suene razonable, sino porque resiste una prueba bien armada. La última situación pide revisar un experimento sencillo: qué se cambia, qué se deja igual y qué se observa al final.',
      en:'A law of physics is not accepted because it sounds reasonable, but because it survives a well built test. The last situation asks you to review a simple experiment: what is changed, what is kept the same and what is observed at the end.'
    }) + '</p>'
  );
  addProblem(rng, mkP10(rng));
}


/* ══════════════════════════════════════════════════════════════════════════
   Utilidades de dibujo compartidas por los manipulativos
   ══════════════════════════════════════════════════════════════════════════ */
function arrow(ctx, x1, y1, x2, y2, col, w){
  var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1) return;
  var ux = dx / len, uy = dy / len, hd = Math.min(11, len * 0.42);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w || 3;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hd * 0.6, y2 - uy * hd * 0.6); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - ux * hd - uy * hd * 0.5, y2 - uy * hd + ux * hd * 0.5);
  ctx.lineTo(x2 - ux * hd + uy * hd * 0.5, y2 - uy * hd - ux * hd * 0.5);
  ctx.closePath(); ctx.fill();
}
function fitCanvas(cv, ctx, st){
  var r = cv.getBoundingClientRect();
  if (!r.width) return false;
  var w = Math.round(r.width), h = Math.round(r.height);
  var dpr = window.devicePixelRatio || 1;
  if (w !== st.W || h !== st.H){ st.W = w; st.H = h; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  return true;
}
function label(ctx, txt, x, y, col, size, align){
  ctx.fillStyle = col; ctx.font = (size || 10) + 'px "IBM Plex Sans", sans-serif';
  ctx.textAlign = align || 'center'; ctx.fillText(txt, x, y); ctx.textAlign = 'left';
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1  ::  Mesa de fuerzas: dos jalones sobre una caja
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var TASKS = [
    { k:'eq',  task:{ es:'los dos jalones se equilibren, de modo que la caja no cambie su movimiento y ninguno de los dos quede en cero',
                      en:'the two pulls balance, so that the crate does not change its motion and neither of them is left at zero' } },
    { k:'der', task:{ es:'quede una fuerza neta hacia la derecha y la caja se vaya hacia ese lado',
                      en:'a net force to the right is left and the crate moves to that side' } },
    { k:'izq', task:{ es:'quede una fuerza neta hacia la izquierda y la caja se vaya hacia ese lado',
                      en:'a net force to the left is left and the crate moves to that side' } }
  ];
  var R = shuffle(TASKS, rng);
  var rd = 0, tries = 0, locked = false;
  var A0 = ri(rng, 4, 16) * 5, B0 = ri(rng, 4, 16) * 5;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Mesa de fuerzas', en:'Force table' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'jalón izquierdo', en:'left pull' }) + '</span>' +
      '<input type="range" min="0" max="100" step="5" data-r="sa"><span class="gw-val" data-r="va"></span></div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'jalón derecho', en:'right pull' }) + '</span>' +
      '<input type="range" min="0" max="100" step="5" data-r="sb"><span class="gw-val" data-r="vb"></span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'izquierda', en:'left' }) + '</div><div class="gw-cv" data-r="ca"></div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'derecha', en:'right' }) + '</div><div class="gw-cv" data-r="cb"></div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'fuerza neta', en:'net force' }) + '</div><div class="gw-cv" data-r="cn"></div></div>' +
    '</div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var sa = host.querySelector('[data-r="sa"]'), sb = host.querySelector('[data-r="sb"]');
  var va = host.querySelector('[data-r="va"]'), vb = host.querySelector('[data-r="vb"]');
  var ca = host.querySelector('[data-r="ca"]'), cb = host.querySelector('[data-r="cb"]'), cn = host.querySelector('[data-r="cn"]');
  var elT = host.querySelector('[data-r="task"]'), elL = host.querySelector('[data-r="live"]');
  var elC = host.querySelector('[data-r="chk"]'), elN = host.querySelector('[data-r="cnt"]');

  sa.value = A0; sb.value = B0;
  var st = { W:0, H:0 }, bx = 0, last = 0;

  function A(){ return parseInt(sa.value, 10); }
  function B(){ return parseInt(sb.value, 10); }
  function net(){ return B() - A(); }

  function render(){
    var W = st.W, H = st.H, cxp = W / 2 + bx, fy = H - 46, bw = 62, bh = 46;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(10, fy + 4); ctx.lineTo(W - 10, fy + 4); ctx.stroke();
    ctx.fillStyle = cssv('--green-bg'); ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(cxp - bw / 2, fy - bh, bw, bh); ctx.fill(); ctx.stroke();
    label(ctx, L({ es:'caja', en:'crate' }), cxp, fy - bh / 2 + 4, cssv('--green'), 11);
    var sc = 0.9, ay = fy - bh / 2;
    if (A() > 0){
      arrow(ctx, cxp - bw / 2, ay, cxp - bw / 2 - A() * sc, ay, cssv('--gold'), 4);
      label(ctx, A() + ' N', cxp - bw / 2 - A() * sc / 2, ay - 10, cssv('--gold'), 11);
    }
    if (B() > 0){
      arrow(ctx, cxp + bw / 2, ay, cxp + bw / 2 + B() * sc, ay, cssv('--green'), 4);
      label(ctx, B() + ' N', cxp + bw / 2 + B() * sc / 2, ay - 10, cssv('--green'), 11);
    }
    var n = net();
    if (n !== 0){
      var ny = fy - bh - 16;
      arrow(ctx, cxp, ny, cxp + (n > 0 ? 1 : -1) * Math.min(70, Math.abs(n) * sc), ny, cssv('--bad'), 3);
      label(ctx, L({ es:'fuerza neta', en:'net force' }), cxp, ny - 9, cssv('--bad'), 10);
    } else {
      label(ctx, L({ es:'fuerza neta = 0', en:'net force = 0' }), cxp, fy - bh - 18, cssv('--ok'), 11);
    }
  }

  function live(){
    va.textContent = A() + ' N'; vb.textContent = B() + ' N';
    ca.textContent = A() + ' N'; cb.textContent = B() + ' N';
    var n = net();
    cn.textContent = (n === 0 ? '0 N' : Math.abs(n) + ' N');
    elL.innerHTML = n === 0
      ? L({ es:'Los dos jalones se cancelan. La caja no cambia lo que estaba haciendo.', en:'The two pulls cancel out. The crate does not change what it was doing.' })
      : L({ es:'Queda fuerza neta hacia la ', en:'Net force is left towards the ' }) + (n > 0 ? L({ es:'derecha', en:'right' }) : L({ es:'izquierda', en:'left' })) +
        L({ es:'. La caja se mueve hacia ese lado.', en:'. The crate moves to that side.' });
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts;
    if (fitCanvas(cv, ctx, st)){
      bx += net() * 0.0012 * dt;
      var lim = st.W / 2 - 46;
      if (bx > lim) bx = lim;
      if (bx < -lim) bx = -lim;
      render();
    }
    requestAnimationFrame(frame);
  }

  function drawTask(){
    elT.innerHTML = L({ es:'Ajusta los dos jalones para que ', en:'Adjust the two pulls so that ' }) + L(R[rd].task) + '.';
    elN.textContent = L({ es:'situación ', en:'situation ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function ok(){
    var k = R[rd].k, a = A(), b = B();
    if (k === 'eq')  return a === b && a > 0;
    if (k === 'der') return b > a;
    return a > b;
  }

  function nudge(){
    var k = R[rd].k, a = A(), b = B(), n = b - a;
    if (k === 'eq'){
      if (a === 0 && b === 0) return L({ es:'Sin jalones no hay nada que equilibrar. Sube los dos y déjalos del mismo tamaño.', en:'With no pulls there is nothing to balance. Raise both and leave them the same size.' });
      return n > 0
        ? L({ es:'La caja arranca hacia la derecha: ese jalón todavía es el mayor. Bájalo o sube el izquierdo hasta emparejarlos.', en:'The crate starts off to the right: that pull is still the bigger one. Lower it or raise the left one until they match.' })
        : L({ es:'La caja arranca hacia la izquierda: ese jalón todavía es el mayor. Bájalo o sube el derecho hasta emparejarlos.', en:'The crate starts off to the left: that pull is still the bigger one. Lower it or raise the right one until they match.' });
    }
    if (k === 'der'){
      if (n === 0) return L({ es:'Con jalones iguales la fuerza neta vale cero y la caja no arranca. Sube el jalón derecho.', en:'With equal pulls the net force is zero and the crate does not start. Raise the right pull.' });
      return L({ es:'La fuerza neta apunta hacia la izquierda. Sube el jalón derecho o baja el izquierdo.', en:'The net force points to the left. Raise the right pull or lower the left one.' });
    }
    if (n === 0) return L({ es:'Con jalones iguales la fuerza neta vale cero y la caja no arranca. Sube el jalón izquierdo.', en:'With equal pulls the net force is zero and the crate does not start. Raise the left pull.' });
    return L({ es:'La fuerza neta apunta hacia la derecha. Sube el jalón izquierdo o baja el derecho.', en:'The net force points to the right. Raise the left pull or lower the right one.' });
  }

  function reveal(){
    var k = R[rd].k;
    if (k === 'eq'){ sa.value = 60; sb.value = 60; }
    else if (k === 'der'){ sa.value = 30; sb.value = 70; }
    else { sa.value = 70; sb.value = 30; }
    live();
    locked = true;
    say(host, 'warm', L({
      es:'Así queda. La caja obedece a la resta de los dos jalones, no a cada uno por separado: si son iguales el resultado es cero y nada cambia; si uno gana, la caja se va hacia ese lado.',
      en:'This is how it looks. The crate obeys the difference between the two pulls, not each one separately: if they are equal the result is zero and nothing changes; if one wins, the crate goes to that side.'
    }));
    setTimeout(advance, 2600);
  }

  function advance(){
    rd++;
    if (rd >= R.length){
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved'; elC.disabled = true; elN.textContent = '';
      say(host, 'good', L({
        es:'Tres situaciones con la misma caja. Lo que decidió su comportamiento nunca fue el tamaño de un jalón solo, sino el resultado de juntar los dos.',
        en:'Three situations with the same crate. What decided its behaviour was never the size of one pull alone, but the result of putting both together.'
      }));
      return;
    }
    locked = false; tries = 0; bx = 0;
    sa.value = ri(rng, 2, 18) * 5; sb.value = ri(rng, 2, 18) * 5;
    elC.textContent = L({ es:'Comprobar', en:'Check' }); elC.className = 'gw-btn';
    drawTask(); live();
    say(host, '', L({ es:'Nueva situación. Mueve los controles y observa la caja antes de comprobar.', en:'New situation. Move the controls and watch the crate before checking.' }));
  }

  sa.addEventListener('input', function(){ if (!locked) live(); });
  sb.addEventListener('input', function(){ if (!locked) live(); });
  elC.addEventListener('click', function(){
    if (locked) return;
    if (ok()){
      locked = true;
      say(host, 'good', L({ es:'Correcto. La caja responde justo a lo que pedía la situación.', en:'Correct. The crate responds exactly to what the situation asked for.' }));
      setTimeout(advance, 1500);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    say(host, 'miss', nudge());
  });

  drawTask(); live();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2  ::  El camión, el pasajero y la inercia
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var TASKS = [
    { k:'brk', task:{ es:'el pasajero de pie se vaya hacia adelante, hacia el parabrisas', en:'the standing passenger lurches forward, towards the windscreen' } },
    { k:'acc', task:{ es:'el pasajero de pie se recargue hacia atrás, hacia el fondo del camión', en:'the standing passenger leans backwards, towards the back of the bus' } },
    { k:'cst', task:{ es:'el pasajero viaje derecho, sin inclinarse hacia ningún lado, mientras el camión avanza', en:'the passenger travels upright, without leaning to either side, while the bus moves along' } }
  ];
  var R = shuffle(TASKS, rng);
  var rd = 0, tries = 0, locked = false, cur = null;
  var v = ri(rng, 1, 3), lean = 0, leanT = 0, road = 0, last = 0;
  var st = { W:0, H:0 };

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El camión y el pasajero', en:'The bus and the passenger' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs tall" data-r="cvs"></canvas>' +
    '<div class="gw-grid">' +
      '<button class="gw-btn" data-k="acc">' + L({ es:'Arrancar de golpe', en:'Start off sharply' }) + '</button>' +
      '<button class="gw-btn" data-k="cst">' + L({ es:'Avanzar con la misma rapidez', en:'Move at the same speed' }) + '</button>' +
      '<button class="gw-btn" data-k="brk">' + L({ es:'Frenar de golpe', en:'Brake hard' }) + '</button>' +
    '</div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var elT = host.querySelector('[data-r="task"]'), elL = host.querySelector('[data-r="live"]');
  var elC = host.querySelector('[data-r="chk"]'), elN = host.querySelector('[data-r="cnt"]');
  var btns = host.querySelectorAll('.gw-grid .gw-btn');

  function render(){
    var W = st.W, H = st.H, gy = H - 34;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, gy + 16); ctx.lineTo(W, gy + 16); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = cssv('--text3');
    for (var d = -40; d < W + 40; d += 40){
      var x = d - (road % 40);
      ctx.beginPath(); ctx.moveTo(x, gy + 24); ctx.lineTo(x + 18, gy + 24); ctx.stroke();
    }
    var bw = Math.min(W - 40, 300), bx = (W - bw) / 2, by = gy - 96, bh = 96;
    ctx.fillStyle = cssv('--surface'); ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.fill(); ctx.stroke();
    ctx.fillStyle = cssv('--green');
    ctx.beginPath(); ctx.arc(bx + bw * 0.22, gy + 8, 11, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + bw * 0.80, gy + 8, 11, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.rect(bx + bw - 46, by + 12, 34, 30); ctx.stroke();
    label(ctx, L({ es:'frente', en:'front' }), bx + bw - 29, by + 54, cssv('--text3'), 9);
    var px = bx + bw * 0.38, fy2 = by + bh - 6;
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 4; ctx.lineCap = 'round';
    var hx = px + Math.sin(lean) * 46, hy = fy2 - Math.cos(lean) * 46;
    ctx.beginPath(); ctx.moveTo(px, fy2); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = cssv('--gold');
    ctx.beginPath(); ctx.arc(hx, hy - 8, 9, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px - 22, fy2); ctx.lineTo(px - 22, fy2 - 30); ctx.stroke();
    var mw = Math.min(150, W - 40);
    ctx.fillStyle = cssv('--surface2'); ctx.fillRect(12, 12, mw, 12);
    ctx.fillStyle = cssv('--green'); ctx.fillRect(12, 12, mw * Math.max(0, Math.min(1, v / 6)), 12);
    label(ctx, L({ es:'rapidez', en:'speed' }), 12, 36, cssv('--text3'), 10, 'left');
    if (v > 0.05){
      ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1.5;
      for (var m = 0; m < 3; m++){
        var yy = by + 20 + m * 18;
        ctx.beginPath(); ctx.moveTo(bx - 8 - m * 4, yy); ctx.lineTo(bx - 26 - m * 4 - v * 3, yy); ctx.stroke();
      }
    }
  }

  function live(){
    var m;
    if (cur === null) m = { es:'Elige una maniobra del camión y observa qué le pasa al cuerpo del pasajero.', en:'Choose a manoeuvre for the bus and watch what happens to the passenger body.' };
    else if (cur === 'acc') m = { es:'El camión gana rapidez. El cuerpo del pasajero, que traía menos rapidez, se queda atrás y se recarga hacia el fondo.', en:'The bus gains speed. The passenger body, which had less speed, is left behind and leans towards the back.' };
    else if (cur === 'brk') m = { es:'El camión pierde rapidez. El cuerpo del pasajero conserva la rapidez que traía y sigue hacia adelante.', en:'The bus loses speed. The passenger body keeps the speed it had and carries on forwards.' };
    else m = { es:'El camión avanza con la misma rapidez y en línea recta. Nada empuja al pasajero hacia ningún lado y viaja derecho.', en:'The bus moves at the same speed in a straight line. Nothing pushes the passenger to either side and they travel upright.' };
    elL.innerHTML = L(m);
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts;
    if (cur === 'acc'){ v = Math.min(5.5, v + 0.004 * dt); leanT = -0.36; }
    else if (cur === 'brk'){ v = Math.max(0, v - 0.005 * dt); leanT = v > 0.05 ? 0.36 : 0; }
    else if (cur === 'cst'){ leanT = 0; }
    lean += (leanT - lean) * Math.min(1, dt / 220);
    road += v * dt * 0.06;
    if (fitCanvas(cv, ctx, st)) render();
    requestAnimationFrame(frame);
  }

  function drawTask(){
    elT.innerHTML = L({ es:'Elige la maniobra del camión que hace que ', en:'Choose the bus manoeuvre that makes ' }) + L(R[rd].task) + '.';
    elN.textContent = L({ es:'situación ', en:'situation ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function nudge(){
    var want = R[rd].k;
    if (cur === null) return L({ es:'Todavía no eliges ninguna maniobra. Prueba una y observa al pasajero antes de comprobar.', en:'You have not chosen a manoeuvre yet. Try one and watch the passenger before checking.' });
    if (want === 'brk') return L({ es:'Con esa maniobra el pasajero no se va hacia el parabrisas. Piensa en cuál deja al camión más lento que el cuerpo que va dentro.', en:'With that manoeuvre the passenger does not go towards the windscreen. Think about which one leaves the bus slower than the body travelling inside it.' });
    if (want === 'acc') return L({ es:'Con esa maniobra el pasajero no se recarga hacia atrás. Piensa en cuál deja al camión más rápido que el cuerpo que va dentro.', en:'With that manoeuvre the passenger does not lean backwards. Think about which one leaves the bus faster than the body travelling inside it.' });
    return L({ es:'Con esa maniobra la rapidez del camión sí cambia y el pasajero se inclina. Busca la maniobra en la que la rapidez se mantiene igual.', en:'With that manoeuvre the speed of the bus does change and the passenger leans. Look for the manoeuvre in which the speed stays the same.' });
  }

  function setCur(k){
    cur = k;
    if (k === 'cst' && v < 1) v = 2.6;
    btns.forEach(function(b){ b.classList.toggle('on', b.dataset.k === k); });
    live();
  }

  function reveal(){
    setCur(R[rd].k);
    locked = true;
    say(host, 'warm', L({
      es:'Esta era la maniobra. El pasajero nunca recibió un empujón: lo que cambió fue la rapidez del camión, y su cuerpo conservó la que ya traía.',
      en:'This was the manoeuvre. The passenger never received a push: what changed was the speed of the bus, and their body kept the speed it already had.'
    }));
    setTimeout(advance, 2800);
  }

  function advance(){
    rd++;
    if (rd >= R.length){
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved'; elC.disabled = true; elN.textContent = '';
      say(host, 'good', L({
        es:'El pasajero se inclinó solamente cuando la rapidez del camión cambió. Mientras el camión avanzó igual, viajó derecho: eso es la inercia trabajando a la vista.',
        en:'The passenger leaned only when the speed of the bus changed. While the bus kept moving the same, they travelled upright: that is inertia at work in plain sight.'
      }));
      return;
    }
    locked = false; tries = 0; cur = null; v = ri(rng, 1, 3); lean = 0; leanT = 0;
    btns.forEach(function(b){ b.classList.remove('on'); });
    elC.textContent = L({ es:'Comprobar', en:'Check' }); elC.className = 'gw-btn';
    drawTask(); live();
    say(host, '', L({ es:'Nueva situación. Prueba las maniobras que quieras antes de comprobar.', en:'New situation. Try as many manoeuvres as you want before checking.' }));
  }

  btns.forEach(function(b){
    b.addEventListener('click', function(){ if (!locked) setCur(b.dataset.k); });
  });
  elC.addEventListener('click', function(){
    if (locked) return;
    if (cur === R[rd].k){
      locked = true;
      say(host, 'good', L({ es:'Correcto. El pasajero hizo justo lo que pedía la situación.', en:'Correct. The passenger did exactly what the situation asked for.' }));
      setTimeout(advance, 1500);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    say(host, 'miss', nudge());
  });

  drawTask(); live();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3  ::  Carrito de carga: fuerza, masa y aceleracion
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var BANDS = [
    { lo:4.4, hi:6.6, name:{ es:'lenta', en:'slow' } },
    { lo:9.0, hi:11.5, name:{ es:'media', en:'medium' } },
    { lo:17.0, hi:21.0, name:{ es:'alta', en:'high' } },
    { lo:27.0, hi:33.0, name:{ es:'muy alta', en:'very high' } }
  ];
  var R = shuffle(BANDS, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false;
  var st = { W:0, H:0 }, cxp = 0, vel = 0, last = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Carrito de carga', en:'Loaded trolley' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs tall" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'fuerza', en:'force' }) + '</span>' +
      '<input type="range" min="10" max="100" step="5" data-r="sf"><span class="gw-val" data-r="vf"></span></div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'carga', en:'load' }) + '</span>' +
      '<input type="range" min="1" max="10" step="1" data-r="sm"><span class="gw-val" data-r="vm"></span></div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var sf = host.querySelector('[data-r="sf"]'), sm = host.querySelector('[data-r="sm"]');
  var vf = host.querySelector('[data-r="vf"]'), vm = host.querySelector('[data-r="vm"]');
  var elT = host.querySelector('[data-r="task"]'), elL = host.querySelector('[data-r="live"]');
  var elC = host.querySelector('[data-r="chk"]'), elN = host.querySelector('[data-r="cnt"]');

  sf.value = ri(rng, 3, 16) * 5; sm.value = ri(rng, 2, 9);

  function F(){ return parseInt(sf.value, 10); }
  function M(){ return parseInt(sm.value, 10); }
  function acc(){ return F() / M(); }

  function render(){
    var W = st.W, H = st.H, ty = H - 96;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, ty + 10); ctx.lineTo(W, ty + 10); ctx.stroke();
    var m = M(), bw = 30 + m * 5, bh = 16 + m * 4, bx = 40 + cxp;
    ctx.fillStyle = cssv('--green-bg'); ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(bx, ty - bh, bw, bh); ctx.fill(); ctx.stroke();
    ctx.fillStyle = cssv('--green');
    ctx.beginPath(); ctx.arc(bx + 8, ty + 4, 6, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + bw - 8, ty + 4, 6, 0, 6.2832); ctx.fill();
    label(ctx, m + (LANG === 'es' ? ' kg' : ' kg'), bx + bw / 2, ty - bh / 2 + 4, cssv('--green'), 11);
    arrow(ctx, bx - 6, ty - bh / 2, bx - 6 - F() * 0.6, ty - bh / 2, cssv('--gold'), 4);
    label(ctx, F() + ' N', bx - 6 - F() * 0.3, ty - bh / 2 - 10, cssv('--gold'), 11);
    var band = R[rd], a = acc();
    var barY = H - 44, barX = 14, barW = W - 28, top = 36;
    ctx.fillStyle = cssv('--surface'); ctx.fillRect(barX, barY, barW, 16);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, 16);
    var zx = barX + barW * Math.min(1, band.lo / top), zw = barW * Math.min(1, (band.hi - band.lo) / top);
    ctx.fillStyle = cssv('--gold-bg'); ctx.fillRect(zx, barY, zw, 16);
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2; ctx.strokeRect(zx, barY, zw, 16);
    var px = barX + barW * Math.min(1, a / top);
    ctx.fillStyle = (a >= band.lo && a <= band.hi) ? cssv('--ok') : cssv('--green');
    ctx.beginPath(); ctx.moveTo(px, barY - 7); ctx.lineTo(px - 6, barY - 17); ctx.lineTo(px + 6, barY - 17); ctx.closePath(); ctx.fill();
    label(ctx, L({ es:'aceleración del carrito', en:'acceleration of the trolley' }), barX, barY - 22, cssv('--text3'), 10, 'left');
    label(ctx, L({ es:'marca buscada', en:'target mark' }), zx + zw / 2, barY + 30, cssv('--gold'), 10);
  }

  function live(){
    vf.textContent = F() + ' N'; vm.textContent = M() + ' kg';
    var band = R[rd], a = acc();
    var m = (a < band.lo)
      ? { es:'El carrito gana rapidez más despacio que la marca buscada.', en:'The trolley gains speed more slowly than the target mark.' }
      : (a > band.hi
        ? { es:'El carrito gana rapidez más deprisa que la marca buscada.', en:'The trolley gains speed faster than the target mark.' }
        : { es:'La flecha cayó dentro de la marca buscada.', en:'The pointer landed inside the target mark.' });
    elL.innerHTML = L(m);
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts;
    vel += acc() * dt * 0.00018;
    cxp += vel * dt;
    if (fitCanvas(cv, ctx, st)){
      if (cxp > st.W - 40){ cxp = 0; vel = 0; }
      render();
    }
    requestAnimationFrame(frame);
  }

  function drawTask(){
    elT.innerHTML = L({ es:'Mueve la fuerza y la carga hasta que la flecha de la aceleración caiga dentro de la marca ', en:'Move the force and the load until the acceleration pointer lands inside the ' }) + L(R[rd].name) + L({ es:'.', en:' mark.' });
    elN.textContent = L({ es:'situación ', en:'situation ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function nudge(){
    var band = R[rd], a = acc();
    return a < band.lo
      ? L({ es:'Todavía acelera menos de lo buscado. Sube la fuerza o quítale carga al carrito.', en:'It still accelerates less than wanted. Raise the force or take load off the trolley.' })
      : L({ es:'Se pasó: acelera más de lo buscado. Baja la fuerza o ponle más carga al carrito.', en:'It went too far: it accelerates more than wanted. Lower the force or put more load on the trolley.' });
  }

  function reveal(){
    var band = R[rd], f, m, done = false;
    for (m = 1; m <= 10 && !done; m++){
      for (f = 10; f <= 100 && !done; f += 5){
        var a = f / m;
        if (a >= band.lo && a <= band.hi){ sf.value = f; sm.value = m; done = true; }
      }
    }
    live(); locked = true;
    say(host, 'warm', L({
      es:'Con esta pareja la flecha entra en la marca. Fíjate en que hay más de una manera de lograrlo: subir la fuerza y quitar carga empujan la flecha hacia el mismo lado.',
      en:'With this pair the pointer enters the mark. Notice that there is more than one way to do it: raising the force and removing load push the pointer the same way.'
    }));
    setTimeout(advance, 2800);
  }

  function advance(){
    rd++;
    if (rd >= R.length){
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved'; elC.disabled = true; elN.textContent = '';
      say(host, 'good', L({
        es:'La flecha nunca dependió de un solo control. Subir la fuerza y aligerar la carga la mueven hacia la derecha; bajar la fuerza y cargar el carrito la mueven hacia la izquierda.',
        en:'The pointer never depended on a single control. Raising the force and lightening the load move it to the right; lowering the force and loading the trolley move it to the left.'
      }));
      return;
    }
    locked = false; tries = 0; cxp = 0; vel = 0;
    sf.value = ri(rng, 3, 16) * 5; sm.value = ri(rng, 2, 9);
    elC.textContent = L({ es:'Comprobar', en:'Check' }); elC.className = 'gw-btn';
    drawTask(); live();
    say(host, '', L({ es:'Nueva marca. Prueba combinaciones y observa la flecha antes de comprobar.', en:'New mark. Try combinations and watch the pointer before checking.' }));
  }

  sf.addEventListener('input', function(){ if (!locked){ vel = 0; cxp = 0; live(); } });
  sm.addEventListener('input', function(){ if (!locked){ vel = 0; cxp = 0; live(); } });
  elC.addEventListener('click', function(){
    if (locked) return;
    var band = R[rd], a = acc();
    if (a >= band.lo && a <= band.hi){
      locked = true;
      say(host, 'good', L({ es:'Correcto. Esa combinación de fuerza y carga da justo la aceleración buscada.', en:'Correct. That combination of force and load gives exactly the acceleration wanted.' }));
      setTimeout(advance, 1500);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    say(host, 'miss', nudge());
  });

  drawTask(); live();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4  ::  Buscador de pares de accion y reaccion
   ══════════════════════════════════════════════════════════════════════════ */

        { on:'B', dir:-1, t:{ es:'El patinador jala a la patinadora hacia atrás', en:'The first skater pulls the second one backwards' } },
        { on:'B', dir:1,  t:{ es:'El patinador empuja otra vez a la patinadora hacia el frente', en:'The first skater pushes the second one forwards again' } }
      ]
    }
  ];
  var R = shuffle(SIT, rng).slice(0, 3);
  var rd = 0, tries = 0, locked = false, sel = -1, order = [];
  var st = { W:0, H:0 }, last = 0, pulse = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Buscador de pares de fuerzas', en:'Force pair finder' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs" data-r="cvs"></canvas>' +
    '<div class="gw-col" data-r="tiles"></div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var elT = host.querySelector('[data-r="task"]'), elTiles = host.querySelector('[data-r="tiles"]');
  var elL = host.querySelector('[data-r="live"]'), elC = host.querySelector('[data-r="chk"]'), elN = host.querySelector('[data-r="cnt"]');

  function render(){
    var W = st.W, H = st.H, s = R[rd], mid = H / 2 - 6;
    ctx.clearRect(0, 0, W, H);
    var bw = Math.min(108, W * 0.3), ax = W * 0.5 - bw - 34, bx2 = W * 0.5 + 34;
    ctx.fillStyle = cssv('--surface'); ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(ax, mid - 26, bw, 52); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.rect(bx2, mid - 26, bw, 52); ctx.fill(); ctx.stroke();
    label(ctx, L(s.A), ax + bw / 2, mid + 4, cssv('--green'), 12);
    label(ctx, L(s.B), bx2 + bw / 2, mid + 4, cssv('--green'), 12);
    var glow = 1 + 0.12 * Math.sin(pulse);
    arrow(ctx, bx2 - 4, mid - 44, bx2 + 52 * glow, mid - 44, cssv('--gold'), 4);
    label(ctx, L({ es:'acción sobre ', en:'action on ' }) + L(s.B), bx2 + 26, mid - 54, cssv('--gold'), 10);
    if (sel >= 0){

      label(ctx, L({ es:'la que elegiste, sobre ', en:'the one you chose, on ' }) + L(o.on === 'A' ? s.A : s.B), W / 2, y2 + 22, cssv('--green'), 10);
    } else {

  function frame(ts){

    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts; pulse += dt / 320;
    if (fitCanvas(cv, ctx, st)) render();
    requestAnimationFrame(frame);
  }

  function paint(){

  }

  function live(){
    var s = R[rd];
    if (sel < 0){ elL.innerHTML = L({ es:'La flecha de arriba es la acción. Falta la otra mitad del par.', en:'The arrow above is the action. The other half of the pair is missing.' }); return; }
    var o = order[sel];
    elL.innerHTML = o.on === 'B'
      ? L({ es:'Las dos flechas caen sobre el mismo cuerpo: ', en:'Both arrows land on the same body: ' }) + L(s.B) + '.'
      : L({ es:'Las dos flechas caen sobre cuerpos distintos.', en:'The two arrows land on different bodies.' });
  }

  function drawTask(){
    var s = R[rd];
    elT.innerHTML = L(s.act) + ' ' + L({ es:'Elige la otra mitad de ese par de fuerzas.', en:'Choose the other half of that force pair.' });
    order = shuffle(s.opts, rng);
    elTiles.innerHTML = order.map(function(o, i){
      return '<button class="gw-tile" data-i="' + i + '">' + L(o.t) + '</button>';
    }).join('');
    elTiles.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){ if (locked) return; sel = parseInt(b.dataset.i, 10); paint(); live(); });
    });
    elN.textContent = L({ es:'situación ', en:'situation ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function nudge(){
    var s = R[rd], o = order[sel];
    if (sel < 0) return L({ es:'Todavía no eliges ninguna opción. Toca una y mira dónde aparece su flecha.', en:'You have not chosen an option yet. Tap one and see where its arrow appears.' });
    if (o.on === 'B') return L({ es:'Esa fuerza vuelve a actuar sobre ', en:'That force acts again on ' }) + L(s.B) +
      L({ es:', que es justo quien recibe la acción. La otra mitad del par siempre actúa sobre el otro cuerpo.', en:', which is exactly who receives the action. The other half of the pair always acts on the other body.' });
    return L({ es:'Acertaste en quién la recibe, pero tu flecha apunta hacia el mismo lado que la acción. La reacción apunta en sentido contrario.', en:'You got who receives it right, but your arrow points the same way as the action. The reaction points the opposite way.' });
  }

  function reveal(){
    for (var i = 0; i < order.length; i++){ if (order[i].on === 'A' && order[i].dir === -1) sel = i; }
    paint(); live(); locked = true;
    elTiles.querySelectorAll('.gw-tile').forEach(function(b){ b.disabled = true; });
    say(host, 'warm', L({
      es:'Este es el par. Las dos flechas tienen el mismo tamaño y sentidos contrarios, y cada una actúa sobre un cuerpo distinto. Por eso no se cancelan.',
      en:'This is the pair. The two arrows have the same size and opposite directions, and each one acts on a different body. That is why they do not cancel.'
    }));
    setTimeout(advance, 3000);
  }

  function advance(){
    rd++;
    if (rd >= R.length){
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved'; elC.disabled = true; elN.textContent = '';
      elTiles.innerHTML = '';
      say(host, 'good', L({
        es:'En las tres situaciones la reacción cumplió lo mismo: mismo tamaño, sentido contrario y, sobre todo, otro cuerpo distinto del que recibió la acción.',
        en:'In the three situations the reaction met the same conditions: same size, opposite direction and, above all, a different body from the one that received the action.'
      }));
      return;
    }
    locked = false; tries = 0; sel = -1;
    elC.textContent = L({ es:'Comprobar', en:'Check' }); elC.className = 'gw-btn';
    drawTask(); live();
    say(host, '', L({ es:'Nueva situación. Puedes cambiar de opción las veces que quieras antes de comprobar.', en:'New situation. You can change your option as many times as you want before checking.' }));
  }

  elC.addEventListener('click', function(){
    if (locked) return;
    if (sel >= 0 && order[sel].on === 'A' && order[sel].dir === -1){
      locked = true;
      elTiles.querySelectorAll('.gw-tile').forEach(function(b, i){ b.disabled = true; if (i === sel) b.classList.add('fix'); });
      say(host, 'good', L({ es:'Correcto. Mismo tamaño, sentido contrario y sobre el otro cuerpo.', en:'Correct. Same size, opposite direction and on the other body.' }));
      setTimeout(advance, 1600);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    say(host, 'miss', nudge());
  });

  drawTask(); live();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5  ::  Empuje contra friccion en cuatro superficies
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var SURF = [
    { k:'hielo', f:15, n:{ es:'hielo', en:'ice' } },
    { k:'madera', f:35, n:{ es:'madera lisa', en:'smooth wood' } },
    { k:'alfombra', f:60, n:{ es:'alfombra', en:'carpet' } },
    { k:'grava', f:85, n:{ es:'piso rugoso', en:'rough floor' } }
  ];
  var TASKS = [
    { k:'quieta', task:{ es:'la caja siga quieta aunque la estés empujando, sin que el empuje quede en cero', en:'the crate stays still even though you are pushing it, without the push being zero' } },
    { k:'constante', task:{ es:'la caja se deslice sin ganar ni perder rapidez', en:'the crate slides without gaining or losing speed' } },
    { k:'acelera', task:{ es:'la caja se deslice ganando rapidez todo el tiempo', en:'the crate slides gaining speed all the time' } }
  ];
  var R = shuffle(TASKS, rng);
  var rd = 0, tries = 0, locked = false, si = ri(rng, 0, 3);
  var st = { W:0, H:0 }, cxp = 0, vel = 0, last = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Empuje contra fricción', en:'Push against friction' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs" data-r="cvs"></canvas>' +
    '<div class="gw-grid" data-r="surf">' +
      SURF.map(function(s, i){ return '<button class="gw-btn" data-i="' + i + '">' + L(s.n) + '</button>'; }).join('') +
    '</div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'empuje', en:'push' }) + '</span>' +
      '<input type="range" min="0" max="100" step="5" data-r="sp"><span class="gw-val" data-r="vp"></span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'empuje', en:'push' }) + '</div><div class="gw-cv" data-r="c1"></div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'fricción', en:'friction' }) + '</div><div class="gw-cv" data-r="c2"></div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'estado', en:'state' }) + '</div><div class="gw-cv" data-r="c3"></div></div>' +
    '</div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'), ctx = cv.getContext('2d');
  var sp = host.querySelector('[data-r="sp"]'), vp = host.querySelector('[data-r="vp"]');
  var c1 = host.querySelector('[data-r="c1"]'), c2 = host.querySelector('[data-r="c2"]'), c3 = host.querySelector('[data-r="c3"]');
  var elT = host.querySelector('[data-r="task"]'), elL = host.querySelector('[data-r="live"]');
  var elC = host.querySelector('[data-r="chk"]'), elN = host.querySelector('[data-r="cnt"]');
  var sbtns = host.querySelectorAll('[data-r="surf"] .gw-btn');

  sp.value = ri(rng, 2, 18) * 5;

  function P(){ return parseInt(sp.value, 10); }
  function Ff(){ return SURF[si].f; }
  function state(){
    var p = P(), f = Ff();
    if (p < f) return 'quieta';
    if (p === f) return 'constante';
    return 'acelera';
  }

  function render(){
    var W = st.W, H = st.H, fy = H - 44, bw = 58, bh = 44, bx = 30 + cxp;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, fy + 4); ctx.lineTo(W, fy + 4); ctx.stroke();
    ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1.4;
    var step = 10, amp = 2 + Ff() * 0.09;
    ctx.beginPath();
    for (var x = 0; x < W; x += step){
      ctx.moveTo(x, fy + 8);
      ctx.lineTo(x + step * 0.5, fy + 8 + amp);
    }
    ctx.stroke();
    label(ctx, L(SURF[si].n), W - 12, fy + 26, cssv('--text3'), 10, 'right');
    ctx.fillStyle = cssv('--green-bg'); ctx.strokeStyle = cssv('--green'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(bx, fy - bh, bw, bh); ctx.fill(); ctx.stroke();
    var my = fy - bh / 2;
    if (P() > 0){
      arrow(ctx, bx - 4, my, bx - 4 - P() * 0.55, my, cssv('--green'), 4);
      label(ctx, P() + ' N', bx - 4 - P() * 0.28, my - 10, cssv('--green'), 10);
    }
    var fr = Math.min(P(), Ff());
    if (fr > 0){
      arrow(ctx, bx + bw + 4, fy - 10, bx + bw + 4 + fr * 0.55, fy - 10, cssv('--gold'), 4);
      label(ctx, fr + ' N', bx + bw + 4 + fr * 0.28, fy - 20, cssv('--gold'), 10);
    }
    var s = state();
    var txt = s === 'quieta' ? L({ es:'no se mueve', en:'does not move' })
      : (s === 'constante' ? L({ es:'rapidez constante', en:'constant speed' }) : L({ es:'gana rapidez', en:'gains speed' }));
    label(ctx, txt, bx + bw / 2, fy - bh - 10, s === 'acelera' ? cssv('--bad') : cssv('--ok'), 11);
  }

  function live(){
    vp.textContent = P() + ' N';
    c1.textContent = P() + ' N';
    c2.textContent = Math.min(P(), Ff()) + ' N';
    var s = state();
    c3.textContent = s === 'quieta' ? L({ es:'quieta', en:'still' }) : (s === 'constante' ? L({ es:'constante', en:'constant' }) : L({ es:'acelera', en:'speeds up' }));
    var m = s === 'quieta'
      ? { es:'La fricción crece justo lo necesario para cancelar tu empuje, así que las fuerzas se equilibran y la caja no arranca.', en:'Friction grows just enough to cancel your push, so the forces balance and the crate does not start moving.' }
      : (s === 'constante'
        ? { es:'El empuje y la fricción quedaron del mismo tamaño: la caja avanza sin ganar ni perder rapidez.', en:'The push and the friction ended up the same size: the crate moves on without gaining or losing speed.' }
        : { es:'El empuje supera a la fricción y sobra fuerza neta hacia adelante: la caja gana rapidez.', en:'The push beats friction and there is net force left over forwards: the crate gains speed.' });
    elL.innerHTML = L(m);
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts;
    var s = state();
    if (s === 'quieta'){ vel = 0; }
    else if (s === 'constante'){ vel = 0.06; }
    else { vel = Math.min(0.5, vel + (P() - Ff()) * 0.00002 * dt); }
    cxp += vel * dt;
    if (fitCanvas(cv, ctx, st)){
      if (cxp > st.W - 70){ cxp = 0; vel = 0; }
      render();
    }
    requestAnimationFrame(frame);
  }

  function paintSurf(){
    sbtns.forEach(function(b, i){ b.classList.toggle('on', i === si); });
  }

  function drawTask(){
    elT.innerHTML = L({ es:'Elige la superficie y ajusta el empuje para que ', en:'Choose the surface and adjust the push so that ' }) + L(R[rd].task) + '.';
    elN.textContent = L({ es:'situación ', en:'situation ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function nudge(){
    var want = R[rd].k, s = state(), p = P(), f = Ff();
    if (want === 'quieta'){
      if (p === 0) return L({ es:'Con empuje cero no estás empujando nada. Sube el empuje sin llegar a lo que frena esta superficie.', en:'With zero push you are not pushing at all. Raise the push without reaching what this surface holds back.' });
      return L({ es:'Tu empuje ya alcanzó a la fricción de esta superficie y la caja arrancó. Bájalo, o cámbiate a una superficie que frene más.', en:'Your push already matched the friction of this surface and the crate started moving. Lower it, or move to a surface that holds back more.' });
    }
    if (want === 'constante'){
      return s === 'quieta'
        ? L({ es:'Todavía falta: la fricción alcanza a cancelar tu empuje y la caja ni se mueve. Súbelo hasta emparejarlo con lo que frena la superficie.', en:'Not there yet: friction manages to cancel your push and the crate does not even move. Raise it until it matches what the surface holds back.' })
        : L({ es:'Te pasaste: sobra empuje y la caja gana rapidez. Bájalo hasta emparejarlo con lo que frena la superficie.', en:'Too far: there is push left over and the crate gains speed. Lower it until it matches what the surface holds back.' });
    }
    return L({ es:'Con este empuje la caja no llega a ganar rapidez. Súbelo por encima de lo que frena la superficie, o cámbiate a una superficie más resbalosa.', en:'With this push the crate does not manage to gain speed. Raise it above what the surface holds back, or move to a more slippery surface.' });
  }

  function reveal(){
    var want = R[rd].k, f = Ff();
    if (want === 'quieta') sp.value = Math.max(5, f - 15);
    else if (want === 'constante') sp.value = f;
    else sp.value = Math.min(100, f + 20);
    live(); locked = true;
    say(host, 'warm', L({
      es:'Ahí está. Lo que decide el estado de la caja no es el empuje solo, sino cómo se compara con la fricción de la superficie que eligiste.',
      en:'There it is. What decides the state of the crate is not the push alone, but how it compares with the friction of the surface you chose.'
    }));
    setTimeout(advance, 2800);
  }

  function advance(){
    rd++;
    if (rd >= R.length){
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved'; elC.disabled = true; elN.textContent = '';
      say(host, 'good', L({
        es:'La misma caja quedó quieta, avanzó pareja o aceleró sin cambiar de peso. Lo único que cambió fue la comparación entre el empuje y la fricción.',
        en:'The same crate stayed still, moved along evenly or accelerated without changing weight. The only thing that changed was the comparison between the push and the friction.'
      }));
      return;
    }
    locked = false; tries = 0; cxp = 0; vel = 0;
    si = ri(rng, 0, 3); sp.value = ri(rng, 2, 18) * 5;
    paintSurf();
    elC.textContent = L({ es:'Comprobar', en:'Check' }); elC.className = 'gw-btn';
    drawTask(); live();
    say(host, '', L({ es:'Nueva situación. Cambia de superficie y de empuje las veces que quieras antes de comprobar.', en:'New situation. Change surface and push as many times as you want before checking.' }));
  }

  sbtns.forEach(function(b){
    b.addEventListener('click', function(){ if (locked) return; si = parseInt(b.dataset.i, 10); cxp = 0; vel = 0; paintSurf(); live(); });
  });
  sp.addEventListener('input', function(){ if (!locked){ vel = 0; live(); } });
  elC.addEventListener('click', function(){
    if (locked) return;
    var want = R[rd].k, s = state();
    if (s === want && !(want === 'quieta' && P() === 0)){
      locked = true;
      say(host, 'good', L({ es:'Correcto. Esa pareja de empuje y superficie deja a la caja justo como pedía la situación.', en:'Correct. That pair of push and surface leaves the crate exactly as the situation asked.' }));
      setTimeout(advance, 1600);
      return;
    }
    tries++;
    if (tries >= 3){ reveal(); return; }
    say(host, 'miss', nudge());
  });

  paintSurf(); drawTask(); live();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════════════
   PROBLEMAS GRADUADOS  ::  cada ranura tiene su propia bolsa de variantes
   ══════════════════════════════════════════════════════════════════════════ */

      q:{ es:'Dos personas empujan un refrigerador desde lados opuestos con jalones del mismo tamaño y el refrigerador no se mueve ni un centímetro. ¿Cuál de estas descripciones corresponde a lo que ocurre con las fuerzas?',

      options:[

        { es:'Sobre el refrigerador no actúa ninguna fuerza, porque un cuerpo que no se mueve no puede estar recibiendo fuerzas', en:'No force acts on the fridge, because a body that does not move cannot be receiving forces' },
        { es:'Sobre el refrigerador actúa solo la fuerza de la persona más fuerte, y la otra deja de existir mientras el mueble sigue quieto', en:'Only the force of the stronger person acts on the fridge, and the other one stops existing while the appliance stays still' },
        { es:'Sobre el refrigerador actúan las dos fuerzas, pero se anulan porque una de ellas llega un instante después que la otra', en:'Both forces act on the fridge, but they cancel out because one of them arrives an instant after the other' }

      correct:0,
      hint:{ es:'Hay una diferencia entre no tener fuerzas encima y tener fuerzas cuyo resultado da cero. Revisa cuál de las dos situaciones describe a un mueble empujado por ambos lados.',
             en:'There is a difference between having no forces on you and having forces whose result is zero. Check which of the two situations describes an appliance pushed from both sides.' },
      exp:{ es:'Las fuerzas no se apagan por el hecho de que el objeto no se mueva. Las dos personas siguen empujando todo el tiempo, con el mismo tamaño y en sentidos contrarios, y lo que vale cero es el resultado de juntarlas. Con fuerza neta cero el movimiento no cambia, y como el refrigerador estaba quieto, sigue quieto.',
            en:'Forces do not switch off just because the object does not move. Both people keep pushing all the time, with the same size and in opposite directions, and what is zero is the result of putting them together. With zero net force the motion does not change, and since the fridge was still, it stays still.' }
    },
    {
      q:{ es:'Un estudiante observa una lámpara que cuelga inmóvil del techo y afirma: como no se mueve, sobre la lámpara no actúa ninguna fuerza. ¿Cuál corrección conviene hacerle?',
          en:'A student watches a lamp hanging motionless from the ceiling and states: since it does not move, no force acts on the lamp. Which correction is worth making?' },
      options:[
        { es:'Sobre la lámpara actúan al mismo tiempo su peso hacia abajo y el jalón del cable hacia arriba, y está quieta porque se equilibran', en:'The weight downwards and the pull of the cable upwards act on the lamp at the same time, and it is still because they balance' },
        { es:'Sobre la lámpara actúa solo el jalón del cable, y por eso no cae ni sube en ningún momento', en:'Only the pull of the cable acts on the lamp, and that is why it neither falls nor rises at any moment' },
        { es:'Sobre la lámpara actúa solo su peso, que queda guardado en el cable mientras la lámpara permanece quieta', en:'Only its weight acts on the lamp, and it is stored in the cable while the lamp stays still' },
        { es:'Sobre la lámpara dejan de actuar fuerzas apenas termina de balancearse, y por eso queda inmóvil', en:'Forces stop acting on the lamp as soon as it finishes swinging, and that is why it stays motionless' }
      ],
      correct:0,
      hint:{ es:'Piensa qué pasaría con la lámpara si de verdad no actuara nada sobre ella, y qué pasaría si solo actuara una de las dos fuerzas que puedes nombrar.',
             en:'Think what would happen to the lamp if truly nothing acted on it, and what would happen if only one of the two forces you can name acted.' },
      exp:{ es:'Si sobre la lámpara no actuara nada, o si solo actuara el cable, la lámpara subiría o caería. Está inmóvil justamente porque recibe dos fuerzas del mismo tamaño en sentidos contrarios: el peso hacia abajo y el jalón del cable hacia arriba. Estar quieto es señal de fuerza neta cero, no de ausencia de fuerzas.',
            en:'If nothing acted on the lamp, or if only the cable acted, the lamp would rise or fall. It is motionless precisely because it receives two forces of the same size in opposite directions: the weight downwards and the pull of the cable upwards. Being still is a sign of zero net force, not of an absence of forces.' }
    }
  ]);
}

function mkP2(rng){

      options:[
        { es:'El cable jala hacia arriba con el mismo tamaño con que el peso jala hacia abajo, así que la cabina no cambia su rapidez', en:'The cable pulls upwards with the same size as the weight pulls downwards, so the cabin does not change its speed' },
        { es:'El jalón del cable es mayor que el peso durante todo el tramo, porque de otro modo la cabina no podría ir subiendo', en:'The pull of the cable is greater than the weight along the whole stretch, because otherwise the cabin could not be going up' },
        { es:'El peso deja de actuar sobre la cabina mientras esta sube, y vuelve a aparecer cuando se detiene en el piso', en:'The weight stops acting on the cabin while it goes up, and appears again when it stops at the floor' },
        { es:'Las dos fuerzas cambian de tamaño una y otra vez, y ese vaivén es lo que mantiene pareja la rapidez', en:'The two forces change size again and again, and that swinging is what keeps the speed even' }
      ],

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbz210eFtEC9kduZdp_1O9aPwr3-z0tob2zILE8PxXj-Ms6tT3F9VIgH7mRpKwVluogp/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
