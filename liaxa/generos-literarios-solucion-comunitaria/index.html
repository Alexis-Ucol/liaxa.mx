    return {
      title: { es:'Por dónde empezar', en:'Where to begin' },
      q: { es:'Vas a escribir tu propia propuesta literaria para un problema de tu comunidad. Determina qué decisión tienes que tomar antes que ninguna otra.',
           en:'You are going to write your own literary proposal for a problem in your community. Determine which decision you have to make before any other.' },
      hint: { es:'Repasa lo que hiciste en la consola: ahí las piezas no se elegían en cualquier orden, porque una de las tres mandaba sobre las otras dos.',
              en:'Go back over what you did at the console: there the pieces were not chosen in any order, because one of the three governed the other two.' },
      exp: { es:'El género y la estrategia no se eligen por gusto ni por costumbre: se eligen a partir del efecto que se busca. Si no está decidido qué tiene que quedar cambiado en quien recibe el texto, cualquier género parece igual de bueno, y ahí es donde una propuesta se pierde.',
             en:'The genre and the strategy are not chosen by taste or by habit: they are chosen from the effect you are after. If it is not settled what has to be left changed in whoever receives the text, every genre looks equally good, and that is where a proposal gets lost.' },
      options: [GEN.primero.c].concat(GEN.primero.d),
      correct: GEN.primero.c
    };
  }

  function otherEstratKey(key) {
    var ks = shuffle(EKEYS, rng), i;
    for (i = 0; i < ks.length; i++) { if (ks[i] !== key) return ks[i]; }
    return 'estribillo';
  }

  /* ═════════ LA LECCIÓN: concepto, manipulativo, problema ═════════ */

  sec(T('Punto de partida', 'Starting point'),
      T('Un problema que también se escribe', 'A problem that also gets written'),
      '<p>' + T('En ' + L(C.lugar) + ' pasa esto: ' + L(C.problema) + '. Contra un problema así se firman oficios, se levantan censos y se pide una obra, y todo eso hace falta. Pero hay algo que un oficio no consigue: que la gente que vive ahí quiera moverse. Para eso sirve un texto literario. No porque adorne el problema, sino porque puede hacer que quien lo escucha lo vea, lo huela, se reconozca dentro de él o se quede pensando en qué haría en el lugar del que decide. Una propuesta literaria de solución no es un poema bonito sobre la basura: es un texto escrito para producir un efecto preciso en una persona concreta. En este expediente hay cuatro páginas sobre el mismo problema, escritas en géneros distintos. Los fragmentos con línea punteada son los que vas a trabajar en toda la guía.',
                'In ' + L(C.lugar) + ' this is happening: ' + L(C.problema) + '. Against a problem like that, official letters get signed, counts get taken and public works get requested, and all of that is needed. But there is something an official letter cannot do: make the people who live there want to move. That is what a literary text is for. Not because it decorates the problem, but because it can make whoever hears it see it, smell it, recognise themselves inside it or stay thinking about what they would do in the place of the one deciding. A literary proposal of a solution is not a pretty poem about rubbish: it is a text written to produce a precise effect on a specific person. This file holds four pages about the same problem, written in different genres. The fragments with a dotted line are the ones you will work with all through this guide.') + '</p>' +
      textBlock(C.poema,  T('Página I', 'Page I'), false) +
      textBlock(C.micro,  T('Página II', 'Page II'), false) +
      textBlock(C.escena, T('Página III', 'Page III'), true) +
      '<div class="dtext"><div class="dtitle">' + T('Página IV', 'Page IV') + ' · ' +
        T('nota de la comisión vecinal', 'note from the residents’ committee') + '</div><span class="dpara">' +
        L(C.ensayo[0]) + '</span></div>' +
      '<div class="callout"><p><strong>' + T('Al leer:', 'While reading:') + '</strong> ' +
        T('pregúntate, en cada página, a quién le está hablando y qué quiere que esa persona haga después.',
          'ask yourself, on each page, who it is speaking to and what it wants that person to do afterwards.') + '</p></div>');
  widgetGeneros();
  addP(q1());
  addP(q6());

  sec(T('Las estrategias', 'The strategies'),
      T('Seis decisiones de escritura', 'Six writing decisions'),
      '<p>' + T('Dentro de un género, quien escribe todavía tiene que decidir cómo va a trabajar sobre quien lee. A esas decisiones se les llama estrategias creativas, y no son adornos: cada una hace un trabajo distinto y falla de un modo distinto. Puedes hablar desde un nosotros para que nadie quede señalado, prestarle voluntad al problema para que se vea avanzar, repetir una frase para que se aprenda de oído, poner el problema al alcance de los sentidos, darle al que se opone su mejor razón, o cortar el texto antes de la solución. La misma estrategia puede aparecer en un poema, en un relato o en una escena. Lo que cambia es el género que la sostiene.',
                'Inside a genre, the writer still has to decide how they are going to work on the reader. Those decisions are called creative strategies, and they are not ornaments: each does a different job and fails in a different way. You can speak from a we so that nobody is singled out, lend the problem a will so that it is seen advancing, repeat a phrase so that it is learned by ear, put the problem within reach of the senses, give the objector their best reason, or cut the text off before the solution. The same strategy can turn up in a poem, in a story or in a scene. What changes is the genre holding it up.') + '</p>' +
      '<div class="glosslist">' + EKEYS.map(function (k) {
        return '<div class="gloss"><div class="glossn">' + L(ESTRAT[k].n) + '</div><div class="glossd">' + L(ESTRAT[k].d) + '</div></div>';
      }).join('') + '</div>');
  widgetRastreo();
  addP(q2());
  addP(q5());

  sec(T('El efecto', 'The effect'),
      T('Una estrategia se reconoce por lo que hace', 'A strategy is recognised by what it does'),
      '<p>' + T('Saberse los nombres no sirve de gran cosa. Lo que decide si una propuesta funciona es el efecto que produce en quien la recibe, y ese efecto se puede probar: basta con quitar la estrategia y ver qué se cae. Si quitas el nosotros y pones un ellos, el texto se vuelve una acusación y la asamblea se pasa la noche defendiéndose. Si quitas la imagen y pones la palabra «peligroso», quien nunca ha estado ahí sigue sin estar ahí. Si quitas la repetición, nadie se lleva nada a su casa. Por eso conviene leer cada fragmento preguntando qué le hace a quien lo escucha, y no solo cómo se llama.',
                'Knowing the names is not worth much. What decides whether a proposal works is the effect it produces on whoever receives it, and that effect can be tested: just remove the strategy and see what falls down. Take away the we and put in a them, and the text turns into an accusation and the assembly spends the night defending itself. Take away the image and put in the word “dangerous”, and whoever has never been there is still not there. Take away the repetition and nobody carries anything home. That is why it pays to read each fragment asking what it does to whoever hears it, and not only what it is called.') + '</p>');
  widgetEfecto();
  addP(q3());
  addP(q9());

  sec(T('El orden', 'The order'),
      T('Contar por pasos y cortar a tiempo', 'Telling in steps and cutting in time'),
      '<p>' + T('El género narrativo tiene una herramienta que los otros no tienen: el orden. Un relato puede mostrar cómo se llegó hasta aquí, escena por escena, y esa cadena explica más que cualquier acusación, porque deja ver que nadie decidió el problema de golpe. Pero el orden trae consigo una decisión difícil: dónde parar. Un relato que llega hasta el final y resuelve todo deja a quien lo escucha tranquilo y sin nada que hacer. Un relato que se detiene un paso antes deja el último movimiento afuera del papel, y ese movimiento es justamente el que la comunidad tendría que dar.',
                'The narrative genre has a tool the others do not: order. A story can show how things got this far, scene by scene, and that chain explains more than any accusation, because it lets you see that nobody decided the problem in one go. But order brings a hard decision with it: where to stop. A story that runs to the end and resolves everything leaves the listener calm and with nothing to do. A story that stops one step earlier leaves the last move off the page, and that move is exactly the one the community would have to make.') + '</p>');
  widgetSecuencia();
  addP(q8());

  sec(T('La adecuación', 'The fit'),
      T('Qué género para qué propósito', 'Which genre for which purpose'),
      '<p>' + T('Ningún género es mejor que otro: cada uno puede hacer cosas que los demás no. El lírico convoca y se deja repetir, y por eso cierra bien una asamblea. El narrativo ordena los hechos en el tiempo y muestra cómo empezó todo sin señalar a nadie. El dramático obliga a dos posturas a permanecer en la misma sala y a responderse. El argumentativo sostiene una idea con razones verificables, y es el único que sirve donde se decide con criterios. Elegir mal no es un error de gusto: una propuesta lírica entregada en una ventanilla no se lee, y un cuadro de datos leído en la calle no mueve a nadie. La pregunta que ordena todo lo demás es siempre la misma: quién recibe el texto y qué tiene que quedar cambiado en esa persona.',
                'No genre is better than another: each can do things the others cannot. The lyric summons and lets itself be repeated, which is why it closes an assembly well. The narrative orders events in time and shows how it all started without pointing at anyone. The dramatic forces two positions to stay in the same room and answer each other. The argumentative holds up an idea with checkable reasons, and it is the only one that works where decisions are made on criteria. Choosing badly is not an error of taste: a lyric proposal handed in at a public desk goes unread, and a table of figures read out in the street moves nobody. The question that orders everything else is always the same: who receives the text and what has to be left changed in that person.') + '</p>' +
      '<div class="glosslist">' + GKEYS.map(function (k) {
        return '<div class="gloss"><div class="glossn">' + L(GENEROS[k].n) + '</div><div class="glossd">' + L(GENEROS[k].d) +
               '</div><div class="glosss">' + T('Sirve para ', 'Good for ') + L(GENEROS[k].s) + '.</div></div>';
      }).join('') + '</div>');
  widgetConsola();
  addP(q4());
  addP(q7());

  sec(T('Cierre', 'Wrap-up'),
      T('Tu turno de proponer', 'Your turn to propose'),
      '<p>' + T('Ya viste un mismo problema escrito de cuatro maneras, comprobaste qué hace cada estrategia sobre quien la recibe y armaste fichas de propuesta para situaciones distintas. Lo que sigue es hacerlo con un problema tuyo: mirar tu calle, decidir a quién le hablas y elegir la forma que consiga lo que necesitas que ocurra.',
                'You have now seen one and the same problem written in four ways, checked what each strategy does to whoever receives it and built proposal cards for different situations. What comes next is doing it with a problem of your own: looking at your street, deciding who you are speaking to and choosing the shape that achieves what you need to happen.') + '</p>');
  widgetTaller();
  addP(q10());
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Géneros Literarios como Propuesta de Solución Comunitaria';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
