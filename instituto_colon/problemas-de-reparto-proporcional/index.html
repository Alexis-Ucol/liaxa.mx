<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Problemas de Reparto Proporcional</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.wgt-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.5rem 1.1rem; font-size:.83rem; font-weight:600; cursor:pointer; font-family:inherit; min-height:44px; }
.wgt-btn:hover { background:var(--green-dark); }
.wgt-step { background:var(--surface2); border:1.5px solid var(--border); color:var(--text); border-radius:8px; width:44px; height:44px; font-size:1.05rem; cursor:pointer; font-family:inherit; }
.wgt-step:hover { border-color:var(--green); color:var(--green); }
.wgt-fb { margin-top:.6rem; font-size:.84rem; color:var(--text2); min-height:2.4rem; line-height:1.5; }
.wgt-lead { font-size:.86rem; color:var(--text2); margin-bottom:.6rem; }
.wgt-cv { width:100%; display:block; }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Problemas de Reparto Proporcional</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 3° de Secundaria · Funciones</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Problemas de Reparto Proporcional</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'mat3_t03_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }

   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'mat3_t03_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'mat3_t03_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c){ return c !== null; })) ? 'block' : 'none';
}
var answeredCount = 0;
var correctCount  = 0;

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {

  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString(LANG==='es'?'es-MX':'en-US', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text(t('pdf-work'), M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  '+t('pdf-code')+' '+code+'  ·  '+t('pdf-page')+' '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save(SCHOOL.filePrefix + '_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf');
  btn.disabled  = false;
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var body = document.getElementById('lessonBody');
  problems = [];
  body.innerHTML = '';
  var ES = (LANG === 'es');

  /* ── helpers ─────────────────────────────────────────────── */
  function L(o){ return ES ? o.es : o.en; }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function pk(a){ return a[Math.floor(rng()*a.length)]; }
  function tok(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
  function mf(n,d){ return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>'; }
  function tbl(head, rows){
    var h = '<div style="overflow-x:auto;margin:.7rem 0"><table style="width:100%;border-collapse:collapse;font-family:\'IBM Plex Mono\',monospace;font-size:.82rem"><tr>';
    head.forEach(function(c){ h += '<th style="border:1px solid var(--border);padding:.34rem .5rem;background:var(--surface2);color:var(--text2);font-weight:600">'+c+'</th>'; });
    h += '</tr>';
    rows.forEach(function(r){
      h += '<tr>';
      r.forEach(function(c,ci){ h += '<td style="border:1px solid var(--border);padding:.34rem .5rem;text-align:center;color:'+(ci===0?'var(--text2)':'var(--text)')+';background:'+(ci===0?'var(--surface2)':'var(--surface)')+'">'+c+'</td>'; });
      h += '</tr>';
    });
    return h + '</table></div>';
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
    body.appendChild(d);
    return d;
  }
  function opts4(correct, cands){
    var out = [String(correct)];
    for (var i=0; i<cands.length && out.length<4; i++){
      var v = cands[i];
      if (!isFinite(v) || v <= 0) continue;
      if (out.indexOf(String(v)) === -1) out.push(String(v));
    }
    var g = 1;
    while (out.length < 4){
      var e = String(Number(correct) + g*7);
      if (out.indexOf(e) === -1) out.push(e);
      g++;
    }
    return out;
  }
  function addP(p){
    var arr = p.options.slice();
    for (var i=arr.length-1; i>0; i--){ var j=Math.floor(rng()*(i+1)); var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; }
    var prob = {
      title: p.title,
      questionText: p.questionText,
      fn: p.fn || '',
      hint: p.hint,
      explanation: p.explanation,
      options: arr,
      correctIdx: arr.indexOf(String(p.correct)),
      showWork: p.showWork !== false,
      studentChoice: null,
      pendingChoice: null
    };
    problems.push(prob);
    buildOneCard(prob, problems.length - 1);
  }
  function cvSetup(cv, hpx){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 560;
    cv.style.height = hpx + 'px';
    cv.width = Math.round(w*dpr); cv.height = Math.round(hpx*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,hpx);
    return { ctx: ctx, w: w, h: hpx };
  }

  /* ── PARÁMETROS DE LA SEMILLA (números + variante estructural + texto) ── */
  var p1v  = ri(0,1);
  var p1i  = ri(0,2);
  var p1r  = ri(6,9);
  var p1t1 = ri(4,6);
  var p1t2 = p1t1 + ri(4,7);
  var p1q1 = p1r*p1t1;
  var p1q2 = p1r*p1t2;

  var p2v  = ri(0,1);
  var p2k  = ri(3,9);
  var p2x1 = ri(2,4);
  var p2y1 = p2k*p2x1;
  var p2x2 = p2x1 + ri(2,5);
  var p2y2 = p2k*p2x2;

  var p3d  = pk([4,5,8]);
  var p3n  = ri(1,p3d-1);
  var p3u  = 5*ri(6,18);
  var p3T  = p3u*p3d;
  var p3a  = p3u*p3n;

  var p4p  = pk([[2,3],[3,4],[3,5],[2,5],[4,5],[5,7]]);
  var p4i  = ri(0,1);
  var p4s  = p4p[0]+p4p[1];
  var p4u  = 10*ri(5,20);
  var p4T  = p4u*p4s;
  var p4a  = p4u*p4p[0];

  var p5p  = pk([[2,3,5],[3,4,5],[2,3,4],[3,5,7],[2,5,8],[4,5,6]]);
  var p5s  = p5p[0]+p5p[1]+p5p[2];
  var p5u  = 10*ri(4,15);
  var p5T  = p5u*p5s;
  var p5a  = p5u*p5p[2];

  var p6p  = pk([[2,3,7],[1,3,6],[2,4,7],[3,4,8],[1,4,5],[2,5,6]]);
  var p6s  = p6p[0]+p6p[1]+p6p[2];
  var p6u  = 5*ri(6,20);
  var p6T  = p6u*p6s;
  var p6a  = p6u*(p6p[2]-p6p[0]);

  var p7m  = pk([2,3]);
  var p7q  = ri(3,8);
  var p7d  = p7m*p7q;
  var p7w1 = pk([4,5,6]);
  var p7w2 = p7w1*p7m;
  var p7k  = p7w1*p7d;

  var p8p  = pk([[2,3],[3,4],[2,5],[3,5],[4,5]]);
  var p8s  = p8p[0]+p8p[1];
  var p8u  = 10*ri(5,18);
  var p8T  = p8u*p8s;
  var p8a  = p8u*p8p[1];

  var p9s  = ri(6,12);
  var p9u  = 10*ri(4,12);
  var p9T  = p9u*p9s;
  var p9c  = ri(2,p9s-2);
  var p9a  = p9u*p9c;

  var p10p = pk([[3,4,5],[2,3,5],[4,5,6],[2,4,5],[3,5,6]]);
  var p10s = p10p[0]+p10p[1]+p10p[2];
  var p10u = 10*ri(6,20);
  var p10T = p10u*p10s;
  var p10A = p10u*p10p[0];

  /* parámetros de las actividades */
  var m1Ks = shuffle([4,5,6,7,8,9], rng).slice(0,3);
  var m2R  = [];
  for (var z=0; z<3; z++){
    var zp = pk([[2,3],[3,4],[2,5],[3,5],[4,5],[1,4]]);
    var zu = 10*ri(3,12);
    m2R.push({ a:zp[0], b:zp[1], u:zu, T:zu*(zp[0]+zp[1]) });
  }
  var m3p = pk([[2,3,4],[1,3,5],[2,3,5],[3,4,5],[1,2,4],[2,4,5]]);
  var m3s = m3p[0]+m3p[1]+m3p[2];
  var m3u = 5*ri(6,20);
  var m3T = m3u*m3s;
  var m4w = ri(3,9);
  var m4d = ri(3,9);
  var m4k = m4w*m4d;

  var NAMES = ['Ana','Bruno','Carla'];

  /* ══════════════════════════════════════════════════════════
     SECCIÓN 1 — variación de dos cantidades
     ══════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 1',en:'Concept 1'}),
      L({es:'Dos cantidades que cambian juntas',en:'Two quantities that change together'}),
    '<p>'+L({
      es:'Cuando dos cantidades varían de manera directamente proporcional, su cociente no cambia: al dividir cada valor de y entre su valor de x siempre aparece el mismo número. Ese número fijo es la constante de proporcionalidad y se escribe k.',
      en:'When two quantities vary in direct proportion, their quotient never changes: dividing each y value by its x value always gives the same number. That fixed number is the constant of proportionality, written k.'})+'</p>'+
    '<p>'+L({
      es:'La misma relación se puede leer de tres maneras distintas y todas dicen lo mismo.',
      en:'The same relation can be read in three different ways, and all three say the same thing.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Tabla',en:'Table'})+'</div><div class="rform">y ÷ x = k</div><div class="rnote">'+L({es:'el cociente se repite en cada pareja de valores',en:'the quotient repeats in every pair of values'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Gráfica',en:'Graph'})+'</div><div class="rform">'+L({es:'recta por el origen',en:'line through the origin'})+'</div><div class="rnote">'+L({es:'al doble de x le corresponde el doble de y',en:'twice the x gives twice the y'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Regla algebraica',en:'Algebraic rule'})+'</div><div class="rform">y = kx</div><div class="rnote">'+L({es:'con k puedes calcular cualquier valor que falte',en:'with k you can work out any missing value'})+'</div></div>'+
    '</div>'+
    '<div class="callout"><p><strong>'+L({es:'Idea clave:',en:'Key idea:'})+'</strong> '+L({
      es:'basta con conocer una sola pareja de valores para obtener k, y con k se reconstruye la tabla completa y la recta.',
      en:'a single pair of values is enough to get k, and with k you can rebuild the whole table and the line.'})+'</p></div>'+
    '<div class="gcrd">'+
      '<div class="mtabs"><span class="mtab active" id="m1r"></span></div>'+
      '<div class="wgt-lead">'+L({
        es:'Los puntos vienen de una tabla de proporcionalidad directa. Mueve el deslizador hasta que tu recta pase justo por ellos.',
        en:'The dots come from a direct proportion table. Move the slider until your line runs exactly through them.'})+'</div>'+
      '<div id="m1tbl"></div>'+
      '<canvas class="wgt-cv" id="m1cv"></canvas>'+
      '<div class="cgrid" style="margin-top:.8rem">'+
        '<div class="cg"><label>'+L({es:'Valor de k',en:'Value of k'})+': <span class="cval" id="m1v">1</span></label>'+
        '<input type="range" id="m1s" min="1" max="10" step="1" value="1" oninput="m1Move()"></div>'+
        '<div class="cg" style="display:flex;align-items:flex-end"><button class="wgt-btn" style="width:100%" onclick="m1Check()">'+L({es:'Comprobar',en:'Check'})+'</button></div>'+
      '</div>'+
      '<div class="wgt-fb" id="m1f"></div>'+
    '</div>');

  var m1 = { round:0, guess:1, tries:0, lock:false };
  function m1Draw(){
    var cv = document.getElementById('m1cv'); if (!cv || m1.round > 2) return;
    var S = cvSetup(cv, 230), c = S.ctx;
    var padL=34, padB=24, padT=12, padR=10;
    var X = function(x){ return padL + x/6*(S.w-padL-padR); };
    var Y = function(y){ return S.h-padB - y/50*(S.h-padB-padT); };
    c.strokeStyle = tok('--border'); c.lineWidth = 1;
    for (var g=1; g<=6; g++){ c.beginPath(); c.moveTo(X(g),Y(0)); c.lineTo(X(g),Y(50)); c.stroke(); }
    for (var v=10; v<=50; v+=10){ c.beginPath(); c.moveTo(X(0),Y(v)); c.lineTo(X(6),Y(v)); c.stroke(); }
    c.strokeStyle = tok('--text3'); c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(X(0),Y(0)); c.lineTo(X(6),Y(0)); c.moveTo(X(0),Y(0)); c.lineTo(X(0),Y(50)); c.stroke();
    c.fillStyle = tok('--text3'); c.font = '10px IBM Plex Sans';
    for (g=1; g<=6; g++) c.fillText(String(g), X(g)-3, Y(0)+13);
    for (v=10; v<=50; v+=10) c.fillText(String(v), 6, Y(v)+3);
    var kg = m1.guess, xe = Math.min(6, 50/kg);
    c.strokeStyle = tok('--gold'); c.lineWidth = 2.6;
    c.beginPath(); c.moveTo(X(0),Y(0)); c.lineTo(X(xe),Y(kg*xe)); c.stroke();
    var k = m1Ks[m1.round];
    c.fillStyle = tok('--green');
    for (var x=1; x<=5; x++){ c.beginPath(); c.arc(X(x),Y(k*x),4.8,0,6.2832); c.fill(); }
  }
  function m1Render(){
    var r = document.getElementById('m1r'); if (!r) return;
    r.textContent = L({es:'Ronda '+(m1.round+1)+' de 3', en:'Round '+(m1.round+1)+' of 3'});
    var k = m1Ks[m1.round];
    document.getElementById('m1tbl').innerHTML = tbl(['x','1','2','3','4','5'], [['y', k, 2*k, 3*k, 4*k, 5*k]]);
    document.getElementById('m1f').innerHTML = L({
      es:'Cada punto de la gráfica es una pareja de la tabla.',
      en:'Each dot on the graph is one pair from the table.'});
    m1Draw();
  }
  function m1Advance(){
    m1.lock = true;
    setTimeout(function(){
      m1.round++;
      var f = document.getElementById('m1f'); if (!f) return;
      if (m1.round >= 3){
        f.innerHTML = L({
          es:'Tres tablas, tres constantes distintas: en todas, y ÷ x fue siempre el mismo número.',
          en:'Three tables, three different constants: in all of them y ÷ x was always the same number.'});
        var rr = document.getElementById('m1r'); if (rr) rr.textContent = L({es:'Rondas completas',en:'Rounds complete'});
        var cv = document.getElementById('m1cv'); if (cv) cv.style.opacity = '0.55';
        return;
      }
      m1.lock = false; m1.tries = 0; m1.guess = 1;
      var s = document.getElementById('m1s'); if (s) s.value = 1;
      var vv = document.getElementById('m1v'); if (vv) vv.textContent = '1';
      m1Render();
    }, 1700);
  }
  window.m1Move = function(){
    if (m1.lock || m1.round > 2) return;
    m1.guess = parseInt(document.getElementById('m1s').value,10);
    document.getElementById('m1v').textContent = m1.guess;
    m1Draw();
    var k = m1Ks[m1.round], f = document.getElementById('m1f');
    if (m1.guess < k) f.innerHTML = L({es:'Tu recta pasa por debajo de los puntos: sube el valor.',en:'Your line runs below the dots: raise the value.'});
    else if (m1.guess > k) f.innerHTML = L({es:'Tu recta pasa por arriba de los puntos: baja el valor.',en:'Your line runs above the dots: lower the value.'});
    else f.innerHTML = L({es:'La recta toca todos los puntos. Confírmalo.',en:'The line touches every dot. Confirm it.'});
  };
  window.m1Check = function(){
    if (m1.lock || m1.round > 2) return;
    var k = m1Ks[m1.round], f = document.getElementById('m1f');
    if (m1.guess === k){
      f.innerHTML = L({
        es:'Correcto: '+(5*k)+' ÷ 5 = '+k+' y lo mismo pasa con cada pareja, así que la regla es y = '+k+'x.',
        en:'Correct: '+(5*k)+' ÷ 5 = '+k+' and the same happens with every pair, so the rule is y = '+k+'x.'});
      m1Advance();
      return;
    }
    m1.tries++;
    if (m1.tries >= 3){
      document.getElementById('m1s').value = k; m1.guess = k;
      document.getElementById('m1v').textContent = k; m1Draw();
      f.innerHTML = L({
        es:'La constante era '+k+': cada y vale '+k+' veces su x, por eso la regla es y = '+k+'x.',
        en:'The constant was '+k+': each y is '+k+' times its x, so the rule is y = '+k+'x.'});
      m1Advance();
      return;
    }
    f.innerHTML = (m1.guess < k
      ? L({es:'Todavía no: los puntos quedan arriba de tu recta. Sube el valor y vuelve a intentarlo.',en:'Not yet: the dots sit above your line. Raise the value and try again.'})
      : L({es:'Todavía no: los puntos quedan abajo de tu recta. Baja el valor y vuelve a intentarlo.',en:'Not yet: the dots sit below your line. Lower the value and try again.'}));
  };

  /* ── Problema 1 ── */
  var p1pool = [
    { es:{dev:'Una impresora de la escuela trabaja a ritmo constante', vb:'imprime', it:'hojas', many:'¿Cuántas hojas'},
      en:{dev:'A school printer works at a constant rate', vb:'prints', vb0:'print', it:'sheets', many:'How many sheets'} },
    { es:{dev:'Una bomba llena un tinaco con flujo constante', vb:'sube', it:'litros', many:'¿Cuántos litros'},
      en:{dev:'A pump fills a tank at a constant flow', vb:'raises', vb0:'raise', it:'liters', many:'How many liters'} },
    { es:{dev:'Una máquina empacadora trabaja a ritmo constante', vb:'empaca', it:'cajas', many:'¿Cuántas cajas'},
      en:{dev:'A packing machine works at a constant rate', vb:'packs', vb0:'pack', it:'boxes', many:'How many boxes'} }
  ];
  var P1 = p1pool[p1i];
  addP({
    title: L({es:'Ritmo constante',en:'Constant rate'}),
    questionText: (p1v === 0
      ? L({ es: P1.es.dev+': en '+p1t1+' minutos '+P1.es.vb+' '+p1q1+' '+P1.es.it+'. '+P1.es.many+' '+P1.es.vb+' en '+p1t2+' minutos?',
            en: P1.en.dev+': in '+p1t1+' minutes it '+P1.en.vb+' '+p1q1+' '+P1.en.it+'. '+P1.en.many+' does it '+P1.en.vb0+' in '+p1t2+' minutes?' })
      : L({ es: P1.es.dev+': en '+p1t1+' minutos '+P1.es.vb+' '+p1q1+' '+P1.es.it+'. ¿En cuántos minutos '+P1.es.vb+' '+p1q2+' '+P1.es.it+'?',
            en: P1.en.dev+': in '+p1t1+' minutes it '+P1.en.vb+' '+p1q1+' '+P1.en.it+'. In how many minutes does it '+P1.en.vb0+' '+p1q2+' '+P1.en.it+'?' })),
    hint: L({es:'Encuentra primero cuánto corresponde a un solo minuto dividiendo, y usa ese valor como constante.',
             en:'First find how much matches a single minute by dividing, and use that value as the constant.'}),
    explanation: (p1v === 0
      ? L({ es:'En un minuto: '+p1q1+' ÷ '+p1t1+' = '+p1r+'. La regla es y = '+p1r+'x, así que en '+p1t2+' minutos: '+p1r+' × '+p1t2+' = '+p1q2,
            en:'In one minute: '+p1q1+' ÷ '+p1t1+' = '+p1r+'. The rule is y = '+p1r+'x, so in '+p1t2+' minutes: '+p1r+' × '+p1t2+' = '+p1q2 })
      : L({ es:'En un minuto: '+p1q1+' ÷ '+p1t1+' = '+p1r+'. Para llegar a '+p1q2+': '+p1q2+' ÷ '+p1r+' = '+p1t2,
            en:'In one minute: '+p1q1+' ÷ '+p1t1+' = '+p1r+'. To reach '+p1q2+': '+p1q2+' ÷ '+p1r+' = '+p1t2 })),
    options: (p1v === 0

    s += '<line x1="'+gx(0)+'" y1="'+gy(0)+'" x2="'+gx(xmax)+'" y2="'+gy(ymax)+'" stroke="var(--green)" stroke-width="2.4"/>';
    s += '<circle cx="'+gx(p2x1)+'" cy="'+gy(p2y1)+'" r="4.5" fill="var(--gold)"/>';
    s += '<text x="'+(Number(gx(p2x1))+6)+'" y="'+(Number(gy(p2y1))-5)+'" fill="var(--text2)" font-size="9" font-family="IBM Plex Sans">('+p2x1+', '+p2y1+')</text>';
    for (i=2; i<=xmax; i+=2) s += '<text x="'+(Number(gx(i))-4)+'" y="'+(Number(gy(0))+11)+'" fill="var(--text3)" font-size="8" font-family="IBM Plex Sans">'+i+'</text>';
    for (i=2; i<=10; i+=2) s += '<text x="4" y="'+(Number(gy(p2k*i))+3)+'" fill="var(--text3)" font-size="8" font-family="IBM Plex Sans">'+(p2k*i)+'</text>';

      document.getElementById('m3v').textContent = m3u; m3Draw();
      f.innerHTML = L({
        es:'Las partes suman '+m3p[0]+' + '+m3p[1]+' + '+m3p[2]+' = '+m3s+', así que cada parte vale '+m3T+' ÷ '+m3s+' = '+m3u+'.',
        en:'The parts add up to '+m3p[0]+' + '+m3p[1]+' + '+m3p[2]+' = '+m3s+', so each part is worth '+m3T+' ÷ '+m3s+' = '+m3u+'.'});
      m3Advance();
      return;
    }
    f.innerHTML = (m3.u*m3s < m3T
      ? L({es:'Aún no: la barra se queda corta por '+(m3T-m3.u*m3s)+' pesos. Sube el valor de la parte.',
           en:'Not yet: the bar falls short by '+(m3T-m3.u*m3s)+' pesos. Raise the value of one part.'})
      : L({es:'Aún no: la barra se pasa por '+(m3.u*m3s-m3T)+' pesos. Baja el valor de la parte.',
           en:'Not yet: the bar overshoots by '+(m3.u*m3s-m3T)+' pesos. Lower the value of one part.'}));
  };

  /* ── Problema 5 ── */
  addP({
    title: L({es:'Reparto entre tres',en:'Sharing among three'}),
    questionText: L({
      es:'Ana, Bruno y Carla organizaron una venta escolar y aportaron material: Ana '+p5p[0]+' paquetes, Bruno '+p5p[1]+' paquetes y Carla '+p5p[2]+' paquetes. Las ganancias de '+p5T+' pesos se reparten en partes proporcionales a lo que aportó cada quien. ¿Cuántos pesos recibe Carla?',
      en:'Ana, Bruno and Carla ran a school sale and contributed supplies: Ana '+p5p[0]+' packs, Bruno '+p5p[1]+' packs and Carla '+p5p[2]+' packs. The '+p5T+' pesos of profit are split in parts proportional to what each one contributed. How many pesos does Carla receive?'}),
    hint: L({es:'Suma los tres aportes, divide el total entre esa suma para saber cuánto vale un paquete y multiplica por los paquetes de Carla.',
             en:'Add the three contributions, divide the total by that sum to find what one pack is worth, then multiply by Carla’s packs.'}),
    explanation: L({
      es:'Los aportes suman '+p5p[0]+' + '+p5p[1]+' + '+p5p[2]+' = '+p5s+' partes. Cada parte vale '+p5T+' ÷ '+p5s+' = '+p5u+'. Carla recibe '+p5u+' × '+p5p[2]+' = '+p5a,
      en:'The contributions add up to '+p5p[0]+' + '+p5p[1]+' + '+p5p[2]+' = '+p5s+' parts. Each part is worth '+p5T+' ÷ '+p5s+' = '+p5u+'. Carla receives '+p5u+' × '+p5p[2]+' = '+p5a}),
    options: opts4(p5a, [p5u*p5p[0], p5u*p5p[1], Math.round(p5T/3)]),
    correct: p5a,
    showWork: true
  });

  /* ── Problema 6 ── */
  addP({
    title: L({es:'Diferencia entre partes',en:'Difference between shares'}),
    questionText: L({
      es:'Se reparten '+p6T+' litros de pintura entre tres talleres en partes proporcionales al número de muros que pintó cada uno: '+p6p[0]+', '+p6p[1]+' y '+p6p[2]+' muros. ¿Cuántos litros más recibe el taller de '+p6p[2]+' muros que el de '+p6p[0]+' muros?',
      en:'A total of '+p6T+' liters of paint is split among three workshops in parts proportional to the number of walls each one painted: '+p6p[0]+', '+p6p[1]+' and '+p6p[2]+' walls. How many more liters does the workshop with '+p6p[2]+' walls get than the one with '+p6p[0]+' walls?'}),
    hint: L({es:'Encuentra cuántos litros corresponden a un muro y multiplícalo por la diferencia entre los dos números de muros.',
             en:'Find how many liters match one wall and multiply that by the difference between the two wall counts.'}),
    explanation: L({
      es:'Los muros suman '+p6p[0]+' + '+p6p[1]+' + '+p6p[2]+' = '+p6s+' partes y cada parte vale '+p6T+' ÷ '+p6s+' = '+p6u+' litros. La diferencia de partes es '+p6p[2]+' − '+p6p[0]+' = '+(p6p[2]-p6p[0])+', así que '+p6u+' × '+(p6p[2]-p6p[0])+' = '+p6a,
      en:'The walls add up to '+p6p[0]+' + '+p6p[1]+' + '+p6p[2]+' = '+p6s+' parts and each part is worth '+p6T+' ÷ '+p6s+' = '+p6u+' liters. The difference in parts is '+p6p[2]+' − '+p6p[0]+' = '+(p6p[2]-p6p[0])+', so '+p6u+' × '+(p6p[2]-p6p[0])+' = '+p6a}),
    options: opts4(p6a, [p6u*(p6p[2]+p6p[0]), p6u*p6p[2], p6u*(p6p[1]-p6p[0])]),
    correct: p6a,
    showWork: true
  });

  /* ══════════════════════════════════════════════════════════
     SECCIÓN 4 — variación inversa
     ══════════════════════════════════════════════════════════ */
  sec(L({es:'Concepto 4',en:'Concept 4'}),
      L({es:'Cuando más significa menos',en:'When more means less'}),
    '<p>'+L({
      es:'No toda pareja de cantidades varía en el mismo sentido. Si al aumentar x la otra cantidad disminuye de modo que el producto x·y se mantiene fijo, la variación es inversa y se escribe x·y = k. Su gráfica no es una recta: es una curva que se acerca a los ejes sin llegar a tocarlos.',
      en:'Not every pair of quantities moves the same way. If x grows while the other quantity shrinks so that the product x·y stays fixed, the variation is inverse and is written x·y = k. Its graph is not a line: it is a curve that approaches the axes without ever touching them.'})+'</p>'+
    '<div class="rules-grid">'+
      '<div class="rcard"><div class="rname">'+L({es:'Directa',en:'Direct'})+'</div><div class="rform">y ÷ x = k</div><div class="rnote">'+L({es:'si x se duplica, y se duplica',en:'if x doubles, y doubles'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Inversa',en:'Inverse'})+'</div><div class="rform">x · y = k</div><div class="rnote">'+L({es:'si x se duplica, y se reduce a la mitad',en:'if x doubles, y is halved'})+'</div></div>'+
      '<div class="rcard"><div class="rname">'+L({es:'Reparto inverso',en:'Inverse share'})+'</div><div class="rform">a, b → b, a</div><div class="rnote">'+L({es:'repartir inverso a dos números es repartir directo a los mismos números intercambiados',en:'sharing inversely to two numbers is sharing directly to the same numbers swapped'})+'</div></div>'+
    '</div>'+
    '<div class="callout"><p><strong>'+L({es:'Por qué funciona:',en:'Why it works:'})+'</strong> '+L({
      es:'ser inversamente proporcional a 2 y a 3 significa ser proporcional a un medio y a un tercio; al multiplicar ambas fracciones por 6 quedan 3 y 2, los mismos números en orden contrario.',
      en:'being inversely proportional to 2 and 3 means being proportional to one half and one third; multiplying both fractions by 6 leaves 3 and 2, the same numbers in the opposite order.'})+'</p></div>'+
    '<div class="gcrd">'+
      '<div class="wgt-lead">'+L({
        es:'Un trabajo completo equivale a '+m4k+' jornadas de una persona. Mueve el deslizador para armar el equipo que lo termine exactamente en '+m4d+' días, sin gente de sobra.',
        en:'A full job is worth '+m4k+' one-person days. Move the slider to build the team that finishes it in exactly '+m4d+' days, with nobody to spare.'})+'</div>'+
      '<canvas class="wgt-cv" id="m4cv"></canvas>'+
      '<div class="cgrid" style="margin-top:.8rem">'+
        '<div class="cg"><label>'+L({es:'Personas en el equipo',en:'People on the team'})+': <span class="cval" id="m4v">1</span></label>'+
        '<input type="range" id="m4s" min="1" max="12" step="1" value="1" oninput="m4Move()"></div>'+
        '<div class="cg" style="display:flex;align-items:flex-end"><button class="wgt-btn" style="width:100%" onclick="m4Check()">'+L({es:'Comprobar',en:'Check'})+'</button></div>'+
      '</div>'+
      '<div class="wgt-fb" id="m4f"></div>'+
    '</div>');

  var m4 = { w:1, tries:0, lock:false };
  function m4Draw(){
    var cv = document.getElementById('m4cv'); if (!cv) return;
    var S = cvSetup(cv, 220), c = S.ctx;
    var padL=38, padB=26, padT=26, padR=12, xmax=12, ymax=m4k;
    var X = function(x){ return padL + x/xmax*(S.w-padL-padR); };
    var Y = function(y){ return S.h-padB - Math.min(y,ymax)/ymax*(S.h-padB-padT); };
    var g;
    c.strokeStyle = tok('--border'); c.lineWidth = 1;
    for (g=2; g<=12; g+=2){ c.beginPath(); c.moveTo(X(g),Y(0)); c.lineTo(X(g),Y(ymax)); c.stroke(); }
    c.strokeStyle = tok('--text3'); c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(X(0),Y(0)); c.lineTo(X(xmax),Y(0)); c.moveTo(X(0),Y(0)); c.lineTo(X(0),Y(ymax)); c.stroke();
    c.fillStyle = tok('--text3'); c.font = '10px IBM Plex Sans';
    for (g=2; g<=12; g+=2) c.fillText(String(g), X(g)-4, Y(0)+13);
    c.strokeStyle = tok('--bad'); c.lineWidth = 1.6; c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(X(0),Y(m4d)); c.lineTo(X(xmax),Y(m4d)); c.stroke(); c.setLineDash([]);
    c.fillStyle = tok('--bad');
    c.fillText(m4d + L({es:' días',en:' days'}), X(0)+5, Y(m4d)-5);
    c.strokeStyle = tok('--green'); c.lineWidth = 2.6; c.beginPath();
    var first = true;
    for (var w=1; w<=12.001; w+=0.08){
      var d = m4k/w;
      if (d > ymax){ first = true; continue; }
      if (first){ c.moveTo(X(w),Y(d)); first = false; } else c.lineTo(X(w),Y(d));
    }
    c.stroke();
    var dw = m4k/m4.w;
    c.fillStyle = tok('--gold');
    c.beginPath(); c.arc(X(m4.w), Y(Math.min(dw,ymax)), 6, 0, 6.2832); c.fill();
    c.fillStyle = tok('--text'); c.font = '11px IBM Plex Sans';
    c.fillText(m4.w + L({es:' personas · ',en:' people · '}) + (Math.round(dw*10)/10) + L({es:' días',en:' days'}), padL, 16);
  }
  window.m4Move = function(){
    if (m4.lock) return;
    m4.w = parseInt(document.getElementById('m4s').value,10);
    document.getElementById('m4v').textContent = m4.w;
    m4Draw();
    var d = m4k/m4.w, f = document.getElementById('m4f');
    if (d > m4d) f.innerHTML = L({
      es:'Con '+m4.w+' personas el trabajo dura '+(Math.round(d*10)/10)+' días: se pasa de la fecha, hace falta más gente.',
      en:'With '+m4.w+' people the job takes '+(Math.round(d*10)/10)+' days: past the deadline, more people are needed.'});
    else if (d < m4d) f.innerHTML = L({
      es:'Con '+m4.w+' personas termina en '+(Math.round(d*10)/10)+' días: se adelanta, hay gente de sobra en el equipo.',
      en:'With '+m4.w+' people it ends in '+(Math.round(d*10)/10)+' days: too early, the team has people to spare.'});
    else f.innerHTML = L({es:'El equipo termina justo en '+m4d+' días. Confírmalo.',en:'The team finishes in exactly '+m4d+' days. Confirm it.'});
  };
  window.m4Check = function(){
    if (m4.lock) return;
    var f = document.getElementById('m4f');
    if (m4.w === m4w){
      f.innerHTML = L({
        es:'Correcto: '+m4w+' × '+m4d+' = '+m4k+', el producto se mantiene fijo en toda la curva.',
        en:'Correct: '+m4w+' × '+m4d+' = '+m4k+', the product stays fixed all along the curve.'});
      m4.lock = true;
      var cv = document.getElementById('m4cv'); if (cv) cv.style.opacity = '0.65';
      return;
    }
    m4.tries++;
    if (m4.tries >= 3){
      document.getElementById('m4s').value = m4w; m4.w = m4w;
      document.getElementById('m4v').textContent = m4w; m4Draw();
      f.innerHTML = L({
        es:'El equipo era de '+m4w+' personas: '+m4k+' ÷ '+m4d+' = '+m4w+', porque personas por días siempre da '+m4k+'.',
        en:'The team was '+m4w+' people: '+m4k+' ÷ '+m4d+' = '+m4w+', because people times days always gives '+m4k+'.'});
      m4.lock = true;
      var cv2 = document.getElementById('m4cv'); if (cv2) cv2.style.opacity = '0.65';
      return;
    }
    f.innerHTML = (m4k/m4.w > m4d
      ? L({es:'Aún no: ese equipo tarda de más. Agrega personas y comprueba de nuevo.',en:'Not yet: that team takes too long. Add people and check again.'})
      : L({es:'Aún no: ese equipo termina antes de tiempo. Quita personas y comprueba de nuevo.',en:'Not yet: that team finishes too early. Remove people and check again.'}));
  };

  /* ── Problema 7 ── */
  addP({
    title: L({es:'Personas y días',en:'People and days'}),
    questionText: L({
      es:'Un equipo de '+p7w1+' personas termina de pintar una barda en '+p7d+' días, todas trabajando al mismo ritmo. Si el mismo trabajo lo hacen '+p7w2+' personas con ese ritmo, ¿en cuántos días lo terminan?',
      en:'A team of '+p7w1+' people finishes painting a wall in '+p7d+' days, all working at the same rate. If the same job is done by '+p7w2+' people at that rate, in how many days do they finish it?'}),
    hint: L({es:'Multiplica personas por días para obtener el trabajo total y divide ese producto entre el nuevo número de personas.',
             en:'Multiply people by days to get the total work and divide that product by the new number of people.'}),
    explanation: L({
      es:'El trabajo total es '+p7w1+' × '+p7d+' = '+p7k+' jornadas de una persona. Con '+p7w2+' personas: '+p7k+' ÷ '+p7w2+' = '+p7q,
      en:'The total work is '+p7w1+' × '+p7d+' = '+p7k+' one-person days. With '+p7w2+' people: '+p7k+' ÷ '+p7w2+' = '+p7q}),
    options: opts4(p7q, [p7d*p7m, p7d-p7m, p7q+p7m]),
    correct: p7q,
    showWork: true
  });

  /* ── Problema 8 ── */
  addP({
    title: L({es:'Reparto inverso',en:'Inverse share'}),
    questionText: L({
      es:'Un premio de '+p8T+' pesos se reparte entre dos equipos de robótica en partes inversamente proporcionales al tiempo que tardaron en completar la pista: el equipo A tardó '+p8p[0]+' minutos y el equipo B tardó '+p8p[1]+' minutos. ¿Cuántos pesos recibe el equipo A?',
      en:'A prize of '+p8T+' pesos is split between two robotics teams in parts inversely proportional to the time they took to finish the track: team A took '+p8p[0]+' minutes and team B took '+p8p[1]+' minutes. How many pesos does team A receive?'}),
    hint: L({es:'Un reparto inversamente proporcional a dos números es un reparto directamente proporcional a esos mismos números intercambiados.',
             en:'A share inversely proportional to two numbers is a share directly proportional to those same numbers swapped.'}),
    explanation: L({
      es:'Repartir en partes inversamente proporcionales a '+p8p[0]+' y '+p8p[1]+' equivale a repartir en partes proporcionales a '+p8p[1]+' y '+p8p[0]+'. Esas partes suman '+p8s+' y cada una vale '+p8T+' ÷ '+p8s+' = '+p8u+'. El equipo A recibe '+p8u+' × '+p8p[1]+' = '+p8a,
      en:'Sharing in parts inversely proportional to '+p8p[0]+' and '+p8p[1]+' is the same as sharing in parts proportional to '+p8p[1]+' and '+p8p[0]+'. Those parts add up to '+p8s+' and each is worth '+p8T+' ÷ '+p8s+' = '+p8u+'. Team A receives '+p8u+' × '+p8p[1]+' = '+p8a}),
    options: opts4(p8a, [p8u*p8p[0], p8T/2, p8u*(p8p[1]+1)]),
    correct: p8a,
    showWork: true
  });

  /* ══════════════════════════════════════════════════════════
     BLOQUE FINAL
     ══════════════════════════════════════════════════════════ */
  sec(L({es:'Cierre',en:'Wrap-up'}), L({es:'Pon todo junto',en:'Put it all together'}), '');

  /* ── Problema 9 (cálculo directo) ── */
  addP({
    title: L({es:'Cálculo directo',en:'Direct calculation'}),
    questionText: L({es:'Calcula:',en:'Calculate:'}),
    fn: p9T+' ÷ '+p9s+' × '+p9c,
    hint: L({es:'Resuelve de izquierda a derecha: primero la división y después la multiplicación.',
             en:'Work from left to right: division first, then multiplication.'}),
    explanation: L({es:p9T+' ÷ '+p9s+' = '+p9u+', y luego '+p9u+' × '+p9c+' = '+p9a,
                    en:p9T+' ÷ '+p9s+' = '+p9u+', and then '+p9u+' × '+p9c+' = '+p9a}),
    options: opts4(p9a, [p9u*(p9c+1), p9T-p9a, p9u*p9s]),
    correct: p9a,
    showWork: true
  });

  /* ── Problema 10 ── */
  addP({
    title: L({es:'Del reparto al total',en:'From the share to the total'}),
    questionText: L({
      es:'Tres socias reparten la ganancia de un puesto de tortas en partes proporcionales a los paquetes de pan que aportó cada una. La tabla muestra las aportaciones.'+
         tbl([L({es:'Socia',en:'Partner'}),'Ana','Bruno','Carla'],
             [[L({es:'Paquetes',en:'Packs'}), p10p[0], p10p[1], p10p[2]]])+
         'A Ana le tocaron '+p10A+' pesos. ¿De cuántos pesos fue la ganancia total?',
      en:'Three partners split the profit of a sandwich stand in parts proportional to the packs of bread each one contributed. The table shows the contributions.'+
         tbl([L({es:'Socia',en:'Partner'}),'Ana','Bruno','Carla'],
             [[L({es:'Paquetes',en:'Packs'}), p10p[0], p10p[1], p10p[2]]])+
         'Ana received '+p10A+' pesos. How many pesos was the total profit?'}),
    hint: L({es:'Con lo que recibió Ana y sus paquetes obtienes cuánto vale una parte; multiplica ese valor por la suma de todas las partes.',
             en:'Ana’s amount and her packs give you what one part is worth; multiply that value by the sum of all the parts.'}),
    explanation: L({
      es:'Ana aportó '+p10p[0]+' partes, así que cada parte vale '+p10A+' ÷ '+p10p[0]+' = '+p10u+'. Las aportaciones suman '+p10p[0]+' + '+p10p[1]+' + '+p10p[2]+' = '+p10s+' partes, de modo que la ganancia total es '+p10u+' × '+p10s+' = '+p10T,
      en:'Ana contributed '+p10p[0]+' parts, so each part is worth '+p10A+' ÷ '+p10p[0]+' = '+p10u+'. The contributions add up to '+p10p[0]+' + '+p10p[1]+' + '+p10p[2]+' = '+p10s+' parts, so the total profit is '+p10u+' × '+p10s+' = '+p10T}),
    options: opts4(p10T, [p10A*3, p10T-p10A, p10u*(p10s+1)]),
    correct: p10T,
    showWork: true
  });

  /* ── arranque de las actividades (tras el primer render) ── */
  setTimeout(function(){
    m1Render();
    m2Round();
    m3Draw();
    m4Draw();
    var f3 = document.getElementById('m3f');
    if (f3) f3.innerHTML = L({es:'Mueve el deslizador y observa cómo crecen las tres partes a la vez.',en:'Move the slider and watch the three shares grow together.'});
    var f4 = document.getElementById('m4f');
    if (f4) f4.innerHTML = L({es:'Mueve el deslizador y observa cómo cambian los días.',en:'Move the slider and watch the number of days change.'});
  }, 160);
  window.addEventListener('resize', function(){
    if (document.getElementById('m1cv')) { m1Draw(); m3Draw(); m4Draw(); }
  });
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbwoSl0opNALX7IT8O9tk7xZoPU9LbrYvZ-n_p9u3R-pUlwi-rVTTfnYRaiKngnsY1QV/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
