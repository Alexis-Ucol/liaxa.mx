<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelos Atómicos y Estructura de la Materia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:75px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 57px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Modelos Atómicos y Estructura de la Materia</div>
    <div class="wcourse" id="wcourse-el">Física · Segundo de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Modelos Atómicos y Estructura de la Materia</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c54', primaryDark:'#182a3b', primaryBg:'#eaeef3',
  accent:'#e4243c', accentBg:'#fbdfe2',
  darkPrimary:'#5e85ab', darkPrimaryDark:'#8badce', darkPrimaryBg:'#152331',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──

  var lx = PW - M - 36;

  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');
  doc.setDrawColor(pAR,pAG,pAB); doc.setLineWidth(0.7);
  doc.line(lx+8.23, ly+1.54, lx+8.23, ly+7.2);

  // Guide title + date inside the blue band

  doc.text(t('wtitle'), M, 49);
  doc.setTextColor(150,165,200); doc.setFontSize(8); doc.setFont('helvetica','normal');

  // ── Score box ──

  doc.text(pct+'%', PW/2, 124, {align:'center'});
  doc.setTextColor(130,140,160); doc.setFontSize(8.5); doc.setFont('helvetica','normal');

  problems.forEach(function(prob, i) {

      doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
      doc.setFontSize(7); doc.setFont('helvetica','bold');
      doc.rect(M,sy,TW,8,'F'); doc.text('RESUMEN DE PROBLEMAS (continuación)', M+4, sy+6);
      sy += 12;
    }
    var ok = document.getElementById('pc'+i).classList.contains('ok');
    doc.setFillColor(ok?232:255, ok?240:232, ok?232:228);
    doc.roundedRect(M,sy,TW,10,2,2,'F');
    doc.setFillColor(ok?26:176, ok?106:48, ok?74:16);
    doc.circle(M+6, sy+5, 2.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(ok?'✓':'✗', M+4.5, sy+6.5);
    doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Problema '+(i+1)+': '+pdfText(prob.title), M+12, sy+6.5);
    doc.setTextColor(ok?26:176, ok?106:48, ok?74:16);
    doc.text(ok?'Correcto':'Incorrecto', PW-M-24, sy+6.5);
    sy += 12;
  });

  // ── Per-problem pages ──
  for (var i = 0; i < problems.length; i++) {
    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'fis2_t03_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

function sec(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + html;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

function widgetHost(parent, id){
  var d = document.createElement('div');
  d.className = 'gw';
  d.id = id;
  parent.appendChild(d);
  return d;
}

function rcard(name, form, note){
  return '<div class="rcard"><div class="rname">' + name + '</div><div class="rform">' + form + '</div><div class="rnote">' + note + '</div></div>';
}

function addProblem(rng, spec){
  var idx = problems.length;
  var correctVal = spec.options[spec.correct];
  var sh = shuffle(spec.options, rng);
  var prob = {
    title: spec.title,
    questionText: spec.q,
    fn: '',
    hint: spec.hint || '',
    explanation: spec.exp || '',
    options: sh,
    correctIdx: sh.indexOf(correctVal),
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  };
  problems.push(prob);
  buildOneCard(prob, idx);
}


/* ══════════════════════════════════════════════════════════════════════════
   buildLesson  ::  concepto -> manipulativo -> problema, alternados (Rule 1)
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Lo que se ve y lo que no se alcanza a ver', en:'What is seen and what cannot be seen' }),
    '<p>' + L({
      es:'Una cuchara de metal parece una pieza entera y lisa. El agua de un vaso parece un material continuo. El aire de un salón parece no ser nada. Sin embargo, si se pudiera partir un trozo de aluminio por la mitad una y otra vez, ¿ese corte podría repetirse para siempre o llegaría un momento en que ya no quedara nada que partir?',
      en:'A metal spoon looks like one whole smooth piece. The water in a glass looks like a continuous material. The air in a classroom looks like nothing at all. Yet if a piece of aluminium could be cut in half again and again, could that cut be repeated forever, or would a moment arrive when there was nothing left to cut?'
    }) + '</p>' +
    '<p>' + L({
      es:'Esa pregunta lleva siglos abierta y su respuesta ha cambiado varias veces. Cada vez que un experimento mostró algo inesperado, la imagen que se tenía del interior de la materia tuvo que rehacerse.',
      en:'That question has been open for centuries and its answer has changed several times. Every time an experiment showed something unexpected, the picture of the inside of matter had to be redrawn.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'un modelo no es una fotografía del átomo. Es una explicación que se sostiene mientras dé cuenta de lo que se observa, y que se corrige cuando aparece una observación que no encaja.',
      en:'a model is not a photograph of the atom. It is an explanation that holds while it accounts for what is observed, and that gets corrected when an observation appears that does not fit.'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'El modelo de partículas', en:'The particle model' }),
    '<p>' + L({
      es:'El modelo de partículas propone que todo material está formado por partículas muy pequeñas, con espacios entre ellas, y que esas partículas nunca están quietas. La energía que traen determina qué tanto se mueven y qué tan lejos quedan unas de otras.',
      en:'The particle model proposes that every material is made of very small particles, with spaces between them, and that those particles are never still. The energy they carry sets how much they move and how far apart they stay.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Estado sólido', en:'Solid state' }), L({ es:'posiciones fijas', en:'fixed positions' }), L({ es:'las partículas vibran sin cambiar de vecino y el material conserva su forma', en:'particles vibrate without changing neighbours and the material keeps its shape' })) +
      rcard(L({ es:'Estado líquido', en:'Liquid state' }), L({ es:'contacto y deslizamiento', en:'contact and sliding' }), L({ es:'las partículas se tocan pero resbalan, así que el material fluye', en:'particles touch but slide, so the material flows' })) +
      rcard(L({ es:'Estado gaseoso', en:'Gaseous state' }), L({ es:'espacios grandes', en:'large gaps' }), L({ es:'las partículas se separan mucho y se reparten por todo el recipiente', en:'particles separate a lot and spread through the whole container' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Al pasar de un estado a otro la cantidad de partículas no cambia: lo que cambia es su acomodo y su movimiento. Comprimir un material tampoco encoge sus partículas, solo reduce los espacios que hay entre ellas.',
      en:'Moving from one state to another does not change the number of particles: what changes is their arrangement and their movement. Compressing a material does not shrink its particles either, it only reduces the gaps between them.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'w_box'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Cuatro modelos, cuatro sorpresas', en:'Four models, four surprises' }),
    '<p>' + L({
      es:'La idea de átomo no nació terminada. Durante poco más de un siglo se propusieron cuatro imágenes distintas de su interior, y cada una nació porque un hecho nuevo dejó a la anterior sin explicación.',
      en:'The idea of the atom was not born finished. Over a little more than a century, four different pictures of its interior were proposed, and each one appeared because a new fact left the previous one without an explanation.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Esfera indivisible', en:'Indivisible sphere' }), L({ es:'sin partes', en:'no parts' }), L({ es:'el átomo es macizo, igual en todo su interior y no se puede partir', en:'the atom is solid, the same throughout and cannot be split' })) +
      rcard(L({ es:'Esfera con incrustaciones', en:'Sphere with embedded bits' }), L({ es:'partes negativas', en:'negative parts' }), L({ es:'una masa positiva sostiene partículas negativas repartidas dentro de ella', en:'a positive mass holds negative particles spread inside it' })) +
      rcard(L({ es:'Núcleo y vacío', en:'Nucleus and empty space' }), L({ es:'centro diminuto', en:'tiny centre' }), L({ es:'toda la carga positiva se concentra en un centro muy pequeño y el resto es espacio casi vacío', en:'all the positive charge is concentrated in a very small centre and the rest is almost empty space' })) +
      rcard(L({ es:'Niveles de energía', en:'Energy levels' }), L({ es:'órbitas permitidas', en:'allowed orbits' }), L({ es:'los electrones solo pueden ocupar ciertos niveles alrededor del núcleo', en:'electrons can only occupy certain levels around the nucleus' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Ordenar estas cuatro imágenes no es un ejercicio de memoria: cada una necesita que la anterior ya exista. No se puede colocar el electrón dentro del átomo antes de aceptar que el átomo tiene partes, ni asignarle niveles de energía antes de saber que hay un núcleo alrededor del cual girar.',
      en:'Putting these four pictures in order is not a memory exercise: each one needs the previous one to already exist. The electron cannot be placed inside the atom before accepting that the atom has parts, nor can energy levels be assigned to it before knowing there is a nucleus to move around.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'w_time'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Las piezas del átomo y su contabilidad', en:'The pieces of the atom and their bookkeeping' }),
    '<p>' + L({
      es:'El modelo aceptado hoy describe el átomo con tres tipos de partículas. En el núcleo viven los protones, con carga positiva, y los neutrones, sin carga. Alrededor del núcleo se distribuyen los electrones, con carga negativa y una masa muchísimo menor.',
      en:'The model accepted today describes the atom with three kinds of particle. In the nucleus live the protons, with positive charge, and the neutrons, with no charge. Around the nucleus the electrons are distributed, with negative charge and a far smaller mass.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Número atómico', en:'Atomic number' }), 'Z', L({ es:'cuenta los protones del núcleo e identifica al elemento', en:'counts the protons in the nucleus and identifies the element' })) +
      rcard(L({ es:'Número de masa', en:'Mass number' }), 'A = Z + N', L({ es:'suma protones y neutrones, las partículas del núcleo', en:'adds protons and neutrons, the particles of the nucleus' })) +
      rcard(L({ es:'Neutrones', en:'Neutrons' }), 'N = A − Z', L({ es:'lo que queda del número de masa al quitar los protones', en:'what is left of the mass number once the protons are removed' })) +
      rcard(L({ es:'Carga neta', en:'Net charge' }), 'q = p − e', L({ es:'se escribe con signo: positiva si faltan electrones, negativa si sobran', en:'written with a sign: positive if electrons are missing, negative if there are extra ones' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Un átomo neutro tiene tantos electrones como protones y su carga neta es 0. Si pierde electrones queda con carga positiva, y si gana electrones queda con carga negativa. En ambos casos se le llama ion, y su carga siempre se escribe con su signo, como +2 o −1.',
      en:'A neutral atom has as many electrons as protons and its net charge is 0. If it loses electrons it is left with positive charge, and if it gains electrons it is left with negative charge. In both cases it is called an ion, and its charge is always written with its sign, such as +2 or −1.'
    }) + '</p></div>'
  );
  w3(rng, widgetHost(s3, 'w_build'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'El experimento que movió el centro del átomo', en:'The experiment that moved the centre of the atom' }),
    '<p>' + L({
      es:'A una lámina de oro finísima se le dispararon partículas muy pequeñas con carga positiva. Si el átomo fuera una esfera con la carga positiva repartida por todo su volumen, todas las partículas tendrían que salir apenas desviadas, como una piedra que cruza un montón de arena floja.',
      en:'Very small particles with positive charge were fired at an extremely thin gold foil. If the atom were a sphere with its positive charge spread through its whole volume, every particle should come out barely deflected, like a stone crossing a heap of loose sand.'
    }) + '</p>' +
    '<p>' + L({
      es:'Lo que se registró fue distinto: la enorme mayoría de las partículas cruzó casi de frente, unas cuantas salieron desviadas con ángulos grandes y una cantidad muy pequeña regresó hacia atrás. Solo algo diminuto, muy denso y con toda la carga positiva concentrada puede devolver una partícula que venía de frente.',
      en:'What was recorded was different: the vast majority of the particles crossed almost straight through, a few came out deflected at large angles and a very small number came back. Only something tiny, very dense and with all the positive charge concentrated can send back a particle that was coming straight on.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'De ahí salieron dos conclusiones que siguen vigentes: el átomo es casi todo espacio vacío y su carga positiva ocupa un núcleo minúsculo comparado con el tamaño del átomo completo.',
      en:'Two conclusions came out of it that still hold: the atom is almost all empty space and its positive charge occupies a nucleus that is minute compared with the size of the whole atom.'
    }) + '</p></div>'
  );
  w4(rng, widgetHost(s4, 'w_gun'));
  addProblem(rng, mkP7(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Hacia dentro todavía: lo que se sabe hoy', en:'Further inside still: what is known today' }),
    '<p>' + L({
      es:'La historia no se detuvo con el núcleo. En los grandes aceleradores se hacen chocar partículas a velocidades enormes y se estudian los restos de esos choques. Así se encontró que el protón y el neutrón tampoco son piezas únicas: cada uno está formado por partículas más pequeñas llamadas quarks, sostenidas por fuerzas muy intensas.',
      en:'The story did not stop with the nucleus. In large accelerators, particles are made to collide at enormous speeds and the remains of those collisions are studied. That is how it was found that the proton and the neutron are not single pieces either: each one is made of smaller particles called quarks, held together by very intense forces.'
    }) + '</p>' +
    '<p>' + L({
      es:'El modelo actual también cambió la imagen del electrón: en vez de recorrer una órbita marcada, se describe como una nube de probabilidad, una región donde es más o menos probable encontrarlo. Y con instrumentos como el microscopio de efecto túnel se obtienen registros en los que se distinguen átomos individuales sobre una superficie, algo que durante mucho tiempo pareció imposible.',
      en:'The current model also changed the picture of the electron: instead of travelling along a marked orbit, it is described as a probability cloud, a region where it is more or less likely to be found. And with instruments such as the tunnelling microscope, records are obtained in which individual atoms can be told apart on a surface, something that for a long time seemed impossible.'
    }) + '</p>' +
    '<div class="callout"><p>' + L({
      es:'Con ese control fino nació la nanotecnología, que acomoda átomos y moléculas para obtener materiales con propiedades a la medida: superficies que no se ensucian, sensores diminutos, materiales más resistentes con menos masa.',
      en:'That fine control gave rise to nanotechnology, which arranges atoms and molecules to obtain materials with tailored properties: surfaces that do not get dirty, tiny sensors, stronger materials with less mass.'
    }) + '</p></div>'
  );
  w5(rng, widgetHost(s5, 'w_scale'));
  addProblem(rng, mkP8(rng));

  /* ══ CIERRE ══ */
  sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Todo junto', en:'All together' }),
    '<p>' + L({
      es:'Las dos últimas situaciones mezclan la contabilidad de las partículas con la manera en que se construyen las teorías. Anota tus pasos antes de elegir.',
      en:'The last two situations mix the bookkeeping of the particles with the way theories are built. Write down your steps before choosing.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));
  addProblem(rng, mkP10(rng));
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1  ::  Caja de particulas (estados de agregacion)
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var ST = [
    { k:'s', name:{ es:'sólido', en:'solid' },
      task:{ es:'el material conserva su propia forma y sus partículas solo vibran sin cambiar de vecino',
             en:'the material keeps its own shape and its particles only vibrate without changing neighbours' } },
    { k:'l', name:{ es:'líquido', en:'liquid' },
      task:{ es:'el material fluye y toma la forma del recipiente, aunque su volumen casi no cambia al apretarlo',
             en:'the material flows and takes the shape of the container, although its volume hardly changes when squeezed' } },
    { k:'g', name:{ es:'gas', en:'gas' },
      task:{ es:'el material se reparte por todo el recipiente y se puede comprimir hasta ocupar mucho menos espacio',
             en:'the material spreads through the whole container and can be compressed into far less space' } }
  ];
  var LIVE = {
    s:{ es:'Las partículas están en posiciones fijas y solo vibran. El material conserva su forma.',
        en:'The particles sit in fixed positions and only vibrate. The material keeps its shape.' },
    l:{ es:'Las partículas siguen en contacto pero resbalan unas sobre otras. El material fluye.',
        en:'The particles are still in contact but slide over one another. The material flows.' },
    g:{ es:'Las partículas quedaron muy separadas y recorren toda la caja a gran velocidad.',
        en:'The particles are now far apart and travel across the whole box at high speed.' }
  };
  var NUDGE = {
    sl:{ es:'Las partículas todavía no abandonan su lugar. Sube la energía hasta que empiecen a deslizarse sin separarse.',
         en:'The particles still do not leave their places. Raise the energy until they start sliding without separating.' },
    sg:{ es:'Siguen ordenadas y en contacto. Sube mucho más la energía para que se separen y llenen la caja.',
         en:'They are still ordered and in contact. Raise the energy much further so they separate and fill the box.' },
    lg:{ es:'Ya resbalan unas sobre otras, pero siguen tocándose. Sube la energía para que se separen.',
         en:'They already slide over one another, but they still touch. Raise the energy so they separate.' },
    ls:{ es:'Todavía se deslizan y el material fluye. Baja la energía hasta que cada partícula se quede en su lugar.',
         en:'They still slide and the material flows. Lower the energy until each particle stays in its place.' },
    gs:{ es:'Hay demasiado espacio vacío. Baja mucho la energía para que vuelvan a ordenarse en posiciones fijas.',
         en:'There is far too much empty space. Lower the energy a lot so they order themselves in fixed positions again.' },
    gl:{ es:'Hay demasiado espacio vacío. Baja la energía hasta que vuelvan a tocarse, pero sin quedar fijas.',
         en:'There is far too much empty space. Lower the energy until they touch again, but without becoming fixed.' }
  };
  var R = shuffle(ST, rng);
  var rd = 0, tries = 0, locked = false, done = false;
  var E = ri(rng, 8, 92);

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Caja de partículas', en:'Particle box' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'energía', en:'energy' }) + '</span>' +
      '<input type="range" min="0" max="100" step="1" data-r="sl">' +
      '<span class="gw-val" data-r="ev"></span></div>' +
    '<div class="gw-mini" data-r="live"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'),
      ctx = cv.getContext('2d'),
      elS = host.querySelector('[data-r="sl"]'),
      elE = host.querySelector('[data-r="ev"]'),
      elT = host.querySelector('[data-r="task"]'),
      elL = host.querySelector('[data-r="live"]'),
      elC = host.querySelector('[data-r="chk"]'),
      elN = host.querySelector('[data-r="cnt"]');

  elS.value = E;

  var N = 30, P = [], i, W = 0, H = 0, PAD = 18, T = 0, last = 0;
  var dpr = window.devicePixelRatio || 1;
  for (i = 0; i < N; i++){
    var a = rng() * 6.283;
    P.push({ x:0, y:0, vx:Math.cos(a), vy:Math.sin(a), ph:rng() * 6.283 });
  }

  function phase(e){ return e < 34 ? 's' : (e < 68 ? 'l' : 'g'); }

  function lat(k){
    var sx = Math.min((W - 2 * PAD) / 5, 32), sy = Math.min((H - 2 * PAD) / 4, 26);
    var x0 = (W - sx * 5) / 2, y0 = H - PAD - sy * 4;
    return [x0 + (k % 6) * sx, y0 + Math.floor(k / 6) * sy];
  }

  function seedPos(){
    for (var k = 0; k < N; k++){ var p = lat(k); P[k].x = p[0]; P[k].y = p[1]; }
  }

  function fit(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return false;
    var w = Math.round(r.width), h = Math.round(r.height);
    if (w !== W || h !== H){ W = w; H = h; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); seedPos(); }
    return true;
  }

  function step(f){
    var ph = phase(E), k, p, sp, top;
    if (ph === 's'){
      var amp = 0.7 + E * 0.07;
      for (k = 0; k < N; k++){
        p = P[k]; var b = lat(k);
        p.x = b[0] + amp * Math.sin(T * 3.1 + p.ph);
        p.y = b[1] + amp * Math.cos(T * 2.6 + p.ph);
      }
      return;
    }
    sp = ph === 'l' ? 0.45 + (E - 34) * 0.022 : 1.5 + (E - 68) * 0.05;
    top = ph === 'l' ? H * 0.44 : PAD;
    for (k = 0; k < N; k++){
      p = P[k];
      var m = Math.sqrt(p.vx * p.vx + p.vy * p.vy) || 1;
      p.vx = p.vx / m * sp; p.vy = p.vy / m * sp;
      p.x += p.vx * f; p.y += p.vy * f;
      if (p.x < PAD){ p.x = PAD; p.vx = -p.vx; }
      if (p.x > W - PAD){ p.x = W - PAD; p.vx = -p.vx; }
      if (p.y < top){ p.y = top; p.vy = -p.vy; }
      if (p.y > H - PAD){ p.y = H - PAD; p.vy = -p.vy; }
    }
  }

  function render(){
    var ph = phase(E), k, p;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 2;
    ctx.strokeRect(6, 6, W - 12, H - 12);
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 1.5;
    for (k = 0; k < N; k++){
      p = P[k];
      if (ph === 'g'){
        ctx.beginPath(); ctx.moveTo(p.x - p.vx * 5, p.y - p.vy * 5); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
    }
    ctx.fillStyle = cssv('--green');
    for (k = 0; k < N; k++){
      p = P[k];
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, 6.2832); ctx.fill();
    }
  }

  function frame(ts){
    if (!document.body.contains(host)) return;
    if (!last) last = ts;
    var dt = Math.min(45, ts - last); last = ts; T += dt / 1000;
    if (fit()){ step(dt / 16.7); render(); }
    requestAnimationFrame(frame);
  }

  function live(){
    elE.textContent = E;
    elL.innerHTML = L(LIVE[phase(E)]);
  }

  function drawTask(){
    elT.innerHTML = L({ es:'Ajusta la energía hasta que la caja muestre un material en el que ', en:'Adjust the energy until the box shows a material in which ' }) + L(R[rd].task) + '.';
    elN.textContent = L({ es:'situación ', en:'situation ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      elN.textContent = '';
      say(host, 'good', L({
        es:'Tres estados reconocidos con las mismas 30 partículas. Lo único que cambió fue su energía, su acomodo y la distancia entre ellas.',
        en:'Three states recognized with the same 30 particles. The only things that changed were their energy, their arrangement and the distance between them.'
      }));
      return;
    }
    locked = false; tries = 0;
    elC.textContent = L({ es:'Comprobar', en:'Check' });
    elC.className = 'gw-btn';
    drawTask();
    say(host, '', L({ es:'Nueva situación. Mueve la energía y observa la caja antes de comprobar.', en:'New situation. Move the energy and watch the box before checking.' }));
  }

  function close(cls, txt){
    locked = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente situación', en:'Next situation' });
    elC.className = 'gw-btn solved';
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    var tgt = R[rd].k, cur = phase(E);
    if (cur === tgt){
      close('good', L({ es:'Así es: con esa energía el material se comporta como un ', en:'That is it: with that energy the material behaves as a ' }) +
        L(R[rd].name) + '. ' + L(LIVE[tgt]));
      return;
    }
    tries++;
    if (tries >= 3){
      E = tgt === 's' ? 16 : (tgt === 'l' ? 50 : 86);
      elS.value = E; live();
      close('warm', L({ es:'Con esta energía la caja muestra un ', en:'With this energy the box shows a ' }) + L(R[rd].name) + '. ' + L(LIVE[tgt]));
      return;
    }
    say(host, 'miss', L(NUDGE[cur + tgt]));
  }

  elS.addEventListener('input', function(){
    if (done || locked) { elS.value = E; return; }
    E = parseInt(elS.value, 10); live();
  });
  elC.addEventListener('click', check);

  drawTask(); live();
  say(host, '', L({ es:'Mueve la energía de lado a lado: la caja responde al instante y te dice qué hacen las partículas.', en:'Move the energy from side to side: the box responds at once and tells you what the particles are doing.' }));
  requestAnimationFrame(frame);
}

    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +

  var elK = host.querySelector('[data-r="cards"]'),

  function draw(){

  });

}

  function render(){
    ctx.clearRect(0, 0, W, H);
    var cx = W / 2, cy = H / 2, i, k, sh, rad, cap = [2, 8, 8], left = e;

  function check(){

    }
    if (p + n !== d.a){
      say(host, 'miss', L({ es:'El elemento ya es el correcto. El número de masa marca ', en:'The element is already right. The mass number reads ' }) + (p + n) +
        L({ es:' y se pide ', en:' and the target is ' }) + d.a + ': ' +
        (p + n < d.a ? L({ es:'agrega neutrones, que son las partículas del núcleo sin carga.', en:'add neutrons, the particles of the nucleus with no charge.' })
                     : L({ es:'quita neutrones, porque sobran partículas en el núcleo.', en:'remove neutrons, because there are too many particles in the nucleus.' })));
      return;
    }
    say(host, 'miss', L({ es:'El núcleo quedó perfecto. La carga neta va en ', en:'The nucleus is perfect. The net charge stands at ' }) + sgn(p - e) +
      L({ es:' y se pide ', en:' and the target is ' }) + sgn(d.q) + ': ' +
      (p - e < d.q ? L({ es:'quita electrones para que la carga suba.', en:'remove electrons so the charge rises.' })
                   : L({ es:'agrega electrones para que la carga baje.', en:'add electrons so the charge falls.' })));
  }

  host.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-a]');
    if (!b || done || locked) return;
    var a = b.getAttribute('data-a');
    if (a === 'p+' && p < 22) p++;
    if (a === 'p-' && p > 0) p--;
    if (a === 'n+' && n < 24) n++;
    if (a === 'n-' && n > 0) n--;
    if (a === 'e+' && e < 22) e++;
    if (a === 'e-' && e > 0) e--;
    upd();
  });
  host.querySelector('[data-r="chk"]').addEventListener('click', check);

  drawTask(); upd();
  say(host, '', L({ es:'Agrega y quita partículas: los cuatro tableros de arriba se actualizan en cuanto tocas un botón.', en:'Add and remove particles: the four panels above update as soon as you tap a button.' }));
  requestAnimationFrame(frame);
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4  ::  Canon de particulas contra la lamina (Rutherford)
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var K = 6.0 + rng() * 1.2;
  var CH = [
    { ok:function(d){ return d < 15; },
      task:{ es:'Consigue que la partícula salga casi de frente, con una desviación menor a 15 grados', en:'Get the particle to come out almost straight, with a deflection smaller than 15 degrees' },
      why:{ es:'Cuando la trayectoria pasa lejos del núcleo, la partícula casi no siente su empuje y sigue de frente. Eso le ocurre a la enorme mayoría.', en:'When the path passes far from the nucleus, the particle barely feels its push and carries on straight. That happens to the vast majority.' },
      reveal:56 },
    { ok:function(d){ return d >= 30 && d <= 70; },
      task:{ es:'Consigue una desviación intermedia, entre 30 y 70 grados', en:'Get an intermediate deflection, between 30 and 70 degrees' },
      why:{ es:'A media distancia el empuje del núcleo alcanza a torcer la trayectoria sin llegar a devolverla. Estos casos son mucho menos frecuentes.', en:'At middle distance the push of the nucleus manages to bend the path without sending it back. These cases are far less frequent.' },
      reveal:14 },
    { ok:function(d){ return d > 120; },
      task:{ es:'Consigue que la partícula rebote hacia atrás, con más de 120 grados', en:'Get the particle to bounce backwards, with more than 120 degrees' },
      why:{ es:'Solo un choque casi de frente contra algo diminuto, muy denso y con toda la carga positiva concentrada puede regresar la partícula. Por eso el rebote es rarísimo.', en:'Only an almost head-on encounter with something tiny, very dense and with all the positive charge concentrated can send the particle back. That is why the bounce is extremely rare.' },
      reveal:2 }
  ];
  var b = pk(rng, [-62, -50, 50, 62]);
  var rd = 0, tries = 0, locked = false, done = false, shots = 0, near = 0, big = 0, lastD = null;
  var pts = [], idx = 0;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Cañón de partículas', en:'Particle gun' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<canvas class="gw-cvs" data-r="cvs"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'puntería', en:'aim' }) + '</span>' +
      '<input type="range" min="-70" max="70" step="1" data-r="sl">' +
      '<span class="gw-val" data-r="bv"></span></div>' +
    '<div class="gw-mini" data-r="stats"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="fire">' + L({ es:'Disparar', en:'Fire' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('[data-r="cvs"]'),
      ctx = cv.getContext('2d'),
      elS = host.querySelector('[data-r="sl"]'),
      elB = host.querySelector('[data-r="bv"]'),
      elT = host.querySelector('[data-r="task"]'),
      elST = host.querySelector('[data-r="stats"]'),
      elF = host.querySelector('[data-r="fire"]'),
      elN = host.querySelector('[data-r="cnt"]');

  elS.value = b;
  var W = 0, H = 0, dpr = window.devicePixelRatio || 1;

  function fit(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return false;
    var w = Math.round(r.width), h = Math.round(r.height);
    if (w !== W || h !== H){ W = w; H = h; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    return true;
  }

  function defl(bb){
    var ab = Math.abs(bb);
    if (ab < 0.5) return 180;
    return Math.round(2 * Math.atan(K / ab) * 180 / Math.PI * 10) / 10;
  }

  function build(){
    pts = []; idx = 0;
    var cx = W / 2, cy = H / 2, y0 = cy - b * (Math.min(H / 2 - 12, 78) / 70);
    var th = defl(b) * Math.PI / 180, s = b >= 0 ? -1 : 1;
    var dx = Math.cos(th) * (b === 0 ? -1 : 1), dy = Math.sin(th) * s;
    if (b === 0){ dx = -1; dy = 0; } else { dx = Math.cos(th); dy = Math.sin(th) * s; }
    var q = 24, i, t;
    for (i = 0; i <= 34; i++) pts.push([8 + (cx - q - 8) * i / 34, y0]);
    var p0 = [cx - q, y0], pc = [cx, y0], p1 = [cx + dx * q, y0 + dy * q];
    for (i = 1; i <= 18; i++){
      t = i / 18;
      pts.push([(1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * pc[0] + t * t * p1[0],
                (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * pc[1] + t * t * p1[1]]);
    }
    for (i = 1; i <= 40; i++){
      var x = p1[0] + dx * i * 12, y = p1[1] + dy * i * 12;
      if (x < -20 || x > W + 20 || y < -20 || y > H + 20) break;
      pts.push([x, y]);
    }
  }

  function render(){
    ctx.clearRect(0, 0, W, H);
    var cx = W / 2, cy = H / 2, ar = Math.min(H / 2 - 8, 84);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, ar, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = cssv('--text3'); ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(L({ es:'el átomo', en:'the atom' }), cx, cy - ar - 4);
    ctx.fillText(L({ es:'núcleo', en:'nucleus' }), cx + 26, cy + 4);
    ctx.fillStyle = cssv('--bad');
    ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, 6.2832); ctx.fill();
    var y0 = cy - b * (Math.min(H / 2 - 12, 78) / 70);
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(6, y0); ctx.lineTo(W - 6, y0); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(2, y0 - 7, 9, 14);
    if (pts.length){
      ctx.strokeStyle = cssv('--green-dark'); ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      var i, top = Math.max(1, idx);
      for (i = 1; i < top; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
      var c = pts[Math.min(top, pts.length) - 1];
      ctx.fillStyle = cssv('--green'); ctx.beginPath(); ctx.arc(c[0], c[1], 5, 0, 6.2832); ctx.fill();
    }
  }

  function frame(){
    if (!document.body.contains(host)) return;
    if (idx < pts.length) idx += 3;
    if (fit()) render();
    requestAnimationFrame(frame);
  }

  function stats(){
    elB.textContent = Math.abs(b) + L({ es:' del centro', en:' from centre' });
    elST.innerHTML = L({ es:'Disparos: ', en:'Shots: ' }) + shots +
      L({ es:' · casi de frente: ', en:' · almost straight: ' }) + near +
      L({ es:' · desvíos grandes: ', en:' · large deflections: ' }) + big +
      (lastD === null ? '' : L({ es:' · última desviación: ', en:' · last deflection: ' }) + lastD + '°');
  }

  function drawTask(){
    elT.innerHTML = L(CH[rd].task) + '.';
    elN.textContent = L({ es:'reto ', en:'challenge ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elF.textContent = L({ es:'Completado', en:'Completed' });
      elF.className = 'gw-btn solved';
      elN.textContent = '';
      say(host, 'good', L({
        es:'Tres retos logrados. Fíjate en tu propio conteo: los disparos casi de frente son muchísimos y los rebotes, apenas unos cuantos. Esa proporción es la que revela un núcleo diminuto rodeado de espacio casi vacío.',
        en:'Three challenges achieved. Look at your own count: the almost straight shots are very many and the bounces are barely a few. That proportion is what reveals a tiny nucleus surrounded by almost empty space.'
      }));
      return;
    }
    locked = false; tries = 0;
    elF.textContent = L({ es:'Disparar', en:'Fire' });
    elF.className = 'gw-btn';
    drawTask();
    say(host, '', L({ es:'Nuevo reto. Mueve la puntería y vuelve a disparar.', en:'New challenge. Move the aim and fire again.' }));
  }

  function close(cls, txt){
    locked = true;
    elF.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente reto', en:'Next challenge' });
    elF.className = 'gw-btn solved';
    say(host, cls, txt);
  }

  function fire(){
    if (done) return;
    if (locked){ advance(); return; }
    var d = defl(b);
    shots++; lastD = d;
    if (d < 15) near++;
    if (d > 90) big++;
    build(); stats();
    if (CH[rd].ok(d)){
      close('good', L({ es:'Desviación de ', en:'Deflection of ' }) + d + L({ es:' grados. ', en:' degrees. ' }) + L(CH[rd].why));
      return;
    }
    tries++;
    if (tries >= 3){
      b = CH[rd].reveal * (b >= 0 ? 1 : -1);
      elS.value = b; d = defl(b); lastD = d; shots++;
      if (d < 15) near++;
      if (d > 90) big++;
      build(); stats();
      close('warm', L({ es:'Con esta puntería la desviación llega a ', en:'With this aim the deflection reaches ' }) + d + L({ es:' grados. ', en:' degrees. ' }) + L(CH[rd].why));
      return;
    }
    var needBigger = (rd === 0) ? false : (rd === 2 ? d <= 120 : d < 30);
    if (rd === 1 && d > 70) needBigger = false;
    say(host, 'miss', L({ es:'Tu partícula se desvió ', en:'Your particle deflected ' }) + d + L({ es:' grados. ', en:' degrees. ' }) +
      (needBigger ? L({ es:'Acerca la puntería al centro para que el empuje del núcleo sea más fuerte.', en:'Move the aim closer to the centre so the push of the nucleus is stronger.' })
                  : L({ es:'Aleja la puntería del centro para que el empuje del núcleo sea más suave.', en:'Move the aim away from the centre so the push of the nucleus is gentler.' })));
  }

  elS.addEventListener('input', function(){
    if (done || locked){ elS.value = b; return; }
    b = parseInt(elS.value, 10); stats();
  });
  elF.addEventListener('click', fire);

  drawTask(); stats();
  say(host, '', L({ es:'La línea punteada marca por dónde pasará la partícula. Mueve la puntería y dispara cuantas veces quieras.', en:'The dashed line marks where the particle will pass. Move the aim and fire as many times as you like.' }));
  requestAnimationFrame(frame);
}


/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5  ::  Escalera de escalas (de lo visible al quark)
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var RUNG = [
    { s:'10⁻³ m', d:{ es:'se ve a simple vista', en:'visible to the naked eye' } },
    { s:'10⁻⁶ m', d:{ es:'se distingue con un microscopio de la escuela', en:'can be told apart with a school microscope' } },
    { s:'10⁻¹⁰ m', d:{ es:'el tamaño de un átomo completo', en:'the size of a whole atom' } },
    { s:'10⁻¹⁵ m', d:{ es:'el tamaño del núcleo de un átomo', en:'the size of the nucleus of an atom' } },
    { s:'10⁻¹⁸ m', d:{ es:'lo que hay dentro de un protón', en:'what lies inside a proton' } }
  ];
  var OBJ = [
    { r:0, n:{ es:'un grano de arena fina', en:'a grain of fine sand' } },
    { r:1, n:{ es:'una bacteria', en:'a bacterium' } },
    { r:1, n:{ es:'un glóbulo rojo', en:'a red blood cell' } },
    { r:2, n:{ es:'un átomo de hierro', en:'an iron atom' } },
    { r:2, n:{ es:'una molécula de agua', en:'a water molecule' } },
    { r:3, n:{ es:'el núcleo de un átomo de oro', en:'the nucleus of a gold atom' } },
    { r:3, n:{ es:'un protón', en:'a proton' } },
    { r:4, n:{ es:'un quark dentro de un protón', en:'a quark inside a proton' } }
  ];
  var mix = shuffle(OBJ, rng), R = [], used = {}, i;
  for (i = 0; i < mix.length && R.length < 3; i++){
    if (used[mix[i].r]) continue;
    used[mix[i].r] = 1; R.push(mix[i]);
  }
  var rd = 0, tries = 0, sel = null, locked = false, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Escalera de escalas', en:'Ladder of scales' }) + '</div>' +
    '<div class="gw-q" data-r="task"></div>' +
    '<div class="gw-lad" data-r="lad"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<span class="gw-val" data-r="cnt"></span></div>' +
    '<div class="gw-fb"></div>';

  var elL = host.querySelector('[data-r="lad"]'),
      elT = host.querySelector('[data-r="task"]'),
      elC = host.querySelector('[data-r="chk"]'),
      elN = host.querySelector('[data-r="cnt"]');

  function draw(){
    elL.innerHTML = RUNG.map(function(g, i){
      var cls = 'gw-step' + (sel === i ? ' on' : '') + (locked && i === R[rd].r ? ' fix' : '');
      return '<div class="' + cls + '" data-k="' + i + '"><span class="gw-sym">' + g.s + '</span>' +
        '<span class="gw-name">' + L(g.d) + '</span></div>';
    }).join('');
    elT.innerHTML = L({ es:'Coloca ', en:'Place ' }) + L(R[rd].n) + L({ es:' en el escalón que le corresponde.', en:' on the step where it belongs.' });
    elN.textContent = L({ es:'objeto ', en:'object ' }) + (rd + 1) + L({ es:' de 3', en:' of 3' });
  }

  function advance(){
    rd++;
    if (rd >= 3){
      done = true;
      elC.textContent = L({ es:'Completado', en:'Completed' });
      elC.className = 'gw-btn solved';
      elN.textContent = '';
      say(host, 'good', L({
        es:'Tres escalones acertados. Cada peldaño baja varias potencias de diez: por eso hicieron falta instrumentos nuevos para llegar cada vez más adentro de la materia.',
        en:'Three steps right. Each rung drops several powers of ten: that is why new instruments were needed to reach further and further inside matter.'
      }));
      return;
    }
    locked = false; tries = 0; sel = null;
    elC.textContent = L({ es:'Comprobar', en:'Check' });
    elC.className = 'gw-btn';
    draw();
    say(host, '', L({ es:'Nuevo objeto. Elige su escalón.', en:'New object. Choose its step.' }));
  }

  function close(cls, txt){
    locked = true;
    elC.textContent = rd === 2 ? L({ es:'Terminar', en:'Finish' }) : L({ es:'Siguiente objeto', en:'Next object' });
    elC.className = 'gw-btn solved';
    draw();
    say(host, cls, txt);
  }

  function check(){
    if (done) return;
    if (locked){ advance(); return; }
    if (sel === null){
      say(host, 'warm', L({ es:'Toca primero un escalón y después comprueba.', en:'Tap a step first and then check.' }));
      return;
    }
    var g = R[rd].r;
    if (sel === g){
      close('good', L({ es:'Correcto: ', en:'Correct: ' }) + L(R[rd].n) + L({ es:' vive en la escala de ', en:' lives at the scale of ' }) + RUNG[g].s + ', ' + L(RUNG[g].d) + '.');
      return;
    }
    tries++;
    if (tries >= 3){
      sel = g;
      close('warm', L({ es:'Su lugar es la escala de ', en:'Its place is the scale of ' }) + RUNG[g].s + ', ' + L(RUNG[g].d) + '.');
      return;
    }
    var dif = g - sel;
    say(host, 'miss', dif > 0
      ? L({ es:'Te quedaste ', en:'You are ' }) + dif + L({ es:' escalón(es) por encima: ese objeto es todavía más pequeño. Baja en la escalera.', en:' step(s) too high: that object is even smaller. Move down the ladder.' })
      : L({ es:'Te fuiste ', en:'You went ' }) + (-dif) + L({ es:' escalón(es) por debajo: ese objeto es más grande de lo que marcaste. Sube en la escalera.', en:' step(s) too low: that object is bigger than you marked. Move up the ladder.' }));
  }

  elL.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-k]');
    if (!b || done || locked) return;
    sel = parseInt(b.getAttribute('data-k'), 10);
    draw();
    say(host, '', L({ es:'Escalón elegido. Puedes cambiarlo antes de comprobar.', en:'Step chosen. You can change it before checking.' }));
  });
  elC.addEventListener('click', check);

  draw();
  say(host, '', L({ es:'Cada escalón baja varias potencias de diez. Toca el que creas correcto y compruébalo.', en:'Each step drops several powers of ten. Tap the one you think is right and check it.' }));
}
