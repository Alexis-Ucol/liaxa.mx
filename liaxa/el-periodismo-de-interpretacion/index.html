<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Periodismo de Interpretación y la Memoria Colectiva</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; text-align:justify; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">El Periodismo de Interpretación y la Memoria Colectiva</div>
    <div class="wcourse" id="wcourse-el">Español · 3° de Secundaria · Géneros periodísticos y sus recursos</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">El Periodismo de Interpretación y la Memoria Colectiva</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a3a6b', primaryDark:'#0f2444', primaryBg:'#e8edf5',
  accent:'#c9a84c', accentBg:'#f7f1e3',
  darkPrimary:'#4a78bf', darkPrimaryDark:'#7aa2e0', darkPrimaryBg:'#0e1f38',

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_esp3_t01_g01__' + (n + '__' + g).replace(/\s+/g, '_');

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_esp3_t01_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {

        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;

          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'esp3_t01_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

      puentes:[
        { dato:{ es:'El libro de fábrica registra el descenso de la campana el 3 de agosto de 1981.', en:'The parish record book registers the bell coming down on 3 August 1981.' },
          voz:{ es:'Doña Amparo recuerda que la campana bajó «el año del temblor».', en:'Doña Amparo remembers the bell came down «the year of the earthquake».' },
          opts:{ es:['El recuerdo de la vecina no coincide con el libro: el pueblo fechó aquellos años por el temblor, que fue lo que le trastornó la vida a todos.',
                     'La vecina se equivoca porque a esa edad la memoria ya no resulta confiable.',
                     'La campana bajó en 1981, y eso es todo lo que puede decirse del asunto.',
                     'Me parece que el libro de fábrica debería exhibirse en la plaza del pueblo.'],
                 en:['The neighbour recollection does not match the book: the town dated those years by the earthquake, which was what upset everyone life.',
                     'The neighbour is wrong because at that age memory is no longer reliable.',
                     'The bell came down in 1981, and that is all that can be said about it.',
                     'I think the parish record book should be displayed in the town square.'] },
          ok:0,
          why:{ es:'Relaciona el documento con el testimonio y explica el desacuerdo sin descalificar a nadie ni añadir nada que las fuentes no sostengan.',
                en:'It relates the document to the testimony and explains the disagreement without discrediting anyone or adding anything the sources do not support.' } },
        { dato:{ es:'La campana permaneció cuarenta y dos años en la bodega de la parroquia.', en:'The bell stayed forty two years in the parish storeroom.' },
          voz:{ es:'Don Nicolás cuenta que cada año alguien proponía subirla otra vez y el asunto se aplazaba.', en:'Don Nicolás says that every year someone proposed hoisting it back and the matter was postponed.' },
          opts:{ es:['La pieza no se perdió ni se olvidó: el pueblo la mantuvo guardada mientras no encontraba cómo devolverla a la torre.',
                     'La parroquia escondió la campana para que nadie volviera a tocarla.',
                     'La campana estuvo cuarenta y dos años en una bodega de la parroquia.',
                     'Las bodegas son el peor lugar posible para guardar un objeto antiguo.'],
                 en:['The piece was neither lost nor forgotten: the town kept it stored while it could not find how to return it to the tower.',
                     'The parish hid the bell so that nobody would ring it again.',
                     'The bell spent forty two years in a parish storeroom.',
                     'Storerooms are the worst possible place to keep an old object.'] },
          ok:0,
          why:{ es:'Une el dato con la voz y muestra algo que ninguno decía por separado, sin atribuirle a nadie una intención que no está documentada.',
                en:'It joins the fact with the voice and shows something neither said on its own, without attributing to anyone an intention that is not documented.' } },
        { dato:{ es:'El taller de carpintería reconstruyó la viga en once sesiones de trabajo.', en:'The carpentry workshop rebuilt the beam in eleven working sessions.' },
          voz:{ es:'Una madre de familia dice que en esas sesiones se juntaron vecinos que llevaban años sin hablarse.', en:'A mother says that in those sessions neighbours who had not spoken for years came together.' },
          opts:{ es:['La reparación de la viga funcionó además como el trabajo común que volvió a reunir a la calle.',
                     'Sin una escuela cerca, ninguna comunidad es capaz de reparar nada por su cuenta.',
                     'La viga que sostiene la campana se reconstruyó en once sesiones de trabajo.',
                     'Ojalá que el taller de carpintería reciba más apoyo el año próximo.'],
                 en:['Repairing the beam also worked as the shared task that brought the street together again.',
                     'Without a school nearby, no community is able to repair anything on its own.',
                     'The beam that holds the bell was rebuilt in eleven working sessions.',
                     'Hopefully the carpentry workshop will get more support next year.'] },
          ok:0,
          why:{ es:'Explica qué produjo el trabajo además del arreglo, y se queda dentro de lo que el dato y el testimonio permiten afirmar.',
                en:'It explains what the work produced besides the repair, and stays within what the fact and the testimony allow it to claim.' } }
      ],
      fuentes:[
        { claim:{ es:'Quieres establecer en qué año la campana dejó de repicar los domingos.', en:'You want to establish in what year the bell stopped ringing on Sundays.' },
          opts:{ es:['El libro donde la parroquia anotaba cada servicio en el momento en que ocurría','El recuerdo de tres vecinos que vivieran en el pueblo aquellos años','La fotografía de la torre que el taller tomó el día de la reapertura','El acta de la reapertura que el ayuntamiento firmó el mes pasado'],
                 en:['The book where the parish wrote down each service at the moment it happened','The recollection of three neighbours who lived in the town in those years','The photograph of the tower the workshop took on reopening day','The reopening record the town hall signed last month'] },
          ok:0, why:{ es:'Una fecha se fija con el registro llevado mientras ocurrían los hechos; los documentos posteriores hablan de otro suceso.', en:'A date is fixed with the record kept while the events were happening; later documents speak about a different event.' } },
        { claim:{ es:'Quieres contar cómo se vivía la plaza cuando la campana todavía sonaba.', en:'You want to tell what the square was like when the bell still rang.' },
          opts:{ es:['Las entrevistas con quienes crecieron oyéndola desde sus casas','El acta del ayuntamiento que ordenó cerrar la torre al público','El presupuesto de la obra que se ejecutó este año','El plano de la viga que reconstruyó el taller de carpintería'],
                 en:['The interviews with those who grew up hearing it from their homes','The town hall record that ordered the tower closed to the public','The budget of the work carried out this year','The plan of the beam the carpentry workshop rebuilt'] },
          ok:0, why:{ es:'Lo que se busca es una experiencia vivida, y eso solo lo guarda la memoria de quienes estuvieron ahí.', en:'What is sought is a lived experience, and only the memory of those who were there keeps it.' } },
        { claim:{ es:'Quieres comprobar cómo se veía la torre antes de que apareciera la grieta.', en:'You want to check what the tower looked like before the crack appeared.' },
          opts:{ es:['Las fotografías de las fiestas del pueblo que guardan las familias','La bitácora de trabajo del taller de carpintería de este año','El recuerdo del encargado del archivo de la parroquia','La nota que el periódico escolar publicó este mes'],
                 en:['The photographs of the town festivities the families keep','The working log of the carpentry workshop from this year','The recollection of the person in charge of the parish archive','The report the school newspaper published this month'] },
          ok:0, why:{ es:'Para mostrar cómo se veía algo que ya cambió, la imagen tomada entonces es la fuente directa.', en:'To show how something that has already changed used to look, the image taken back then is the direct source.' } }
      ],
      qs:{
        p1:{ title:{ es:'Las tres capas del texto', en:'The three layers of the text' },
          stmt:{ es:'Vuelve al texto que acabas de leer. ¿Cuál de estos enunciados corresponde a la interpretación que construye el reportaje, y no a un hecho verificado ni a una afirmación atribuida a alguien?',
                 en:'Go back to the text you have just read. Which of these statements belongs to the interpretation the report builds, and not to a verified fact or a claim attributed to someone?' },
          options:{ es:['La memoria del lugar no guarda años, guarda sucesos, y los ata unos a otros.',
                        'El libro de fábrica de la parroquia registra la fecha en que bajó la campana.',
                        'Doña Amparo Nájera afirma que la torre se cuarteó el año del temblor.',
                        'La viga que sostiene la campana fue reconstruida por vecinos y por el taller de carpintería.'],
                    en:['The memory of the place does not keep years, it keeps events, and ties them to one another.',
                        'The parish record book registers the date on which the bell came down.',
                        'Doña Amparo Nájera claims the tower cracked the year of the earthquake.',
                        'The beam that holds the bell was rebuilt by neighbours and by the carpentry workshop.'] },
          correct:0,
          hint:{ es:'Revisa enunciado por enunciado y pregúntate quién responde por él: un documento, una persona citada, o el texto mismo.',
                 en:'Go statement by statement and ask yourself who answers for it: a document, a quoted person, or the text itself.' },
          expl:{ es:'Los otros tres pueden rastrearse: dos remiten a algo que el taller comprobó y uno lleva el nombre de quien lo dijo. El primero no está en ningún registro ni en ninguna cita; es el sentido que el reportaje construye después de reunir todo lo demás, y por eso pertenece a la capa de interpretación.',
                 en:'The other three can be traced: two point to something the workshop verified and one carries the name of whoever said it. The first is in no record and in no quotation; it is the meaning the report builds after gathering everything else, and that is why it belongs to the interpretation layer.' } },
        p2:{ title:{ es:'La entrada del texto', en:'The way in' },
          stmt:{ es:'El reportaje no empieza anunciando la reapertura de la torre, sino con doña Amparo contando campanadas en mitad de la plaza. ¿Qué consigue el texto con ese arranque?',
                 en:'The report does not begin by announcing the reopening of the tower, but with doña Amparo counting bell strokes in the middle of the square. What does the text achieve with that opening?' },
          options:{ es:['Muestra en una escena concreta qué significaba el suceso para quienes lo vivieron, antes de explicarlo',
                        'Retrasa la información principal porque el dato del suceso no pudo confirmarse a tiempo',
                        'Sustituye la información del suceso por la impresión personal de quien escribe',
                        'Ordena los hechos del más reciente al más antiguo, como pide el género informativo'],
                    en:['It shows in a concrete scene what the event meant to those who lived it, before explaining it',
                        'It delays the main information because the fact of the event could not be confirmed in time',
                        'It replaces the information about the event with the personal impression of the writer',
                        'It orders the facts from most recent to oldest, as the informative genre requires'] },
          correct:0,
          hint:{ es:'Compara lo que sabe el lector después de esa primera escena con lo que sabría si el texto abriera por el anuncio.',
                 en:'Compare what the reader knows after that first scene with what they would know if the text opened with the announcement.' },
          expl:{ es:'La escena inicial no informa del suceso: lo vuelve significativo. Cuando el segundo párrafo anuncia el regreso de la campana, el lector ya sabe qué se había perdido, y por eso entiende de inmediato por qué esa reapertura importa.',
                 en:'The opening scene does not inform about the event: it makes it meaningful. When the second paragraph announces the return of the bell, the reader already knows what had been lost, and so understands at once why that reopening matters.' } },
        p3:{ title:{ es:'El orden que sostiene el texto', en:'The order that holds the text up' }, showWork:true,
          stmt:{ es:'Un compañero propone reordenar el reportaje para que abra con el párrafo del libro de fábrica y cierre con la escena de la plaza. ¿Qué perdería el texto con ese cambio?',
                 en:'A classmate proposes reordering the report so that it opens with the parish record paragraph and closes with the scene in the square. What would the text lose with that change?' },
          options:{ es:['El documento aparecería antes que los dos recuerdos en desacuerdo, de modo que ya no dirimiría nada',
                        'El reportaje se quedaría sin la fecha en que la campana bajó de la torre',
                        'Los testimonios de los vecinos tendrían que salir del texto para dejarle sitio al documento',
                        'Los hechos quedarían ordenados del más antiguo al más reciente, y ese orden no existe en el periodismo'],
                    en:['The document would appear before the two disagreeing recollections, so it would no longer settle anything',
                        'The report would be left without the date on which the bell came down from the tower',
                        'The testimonies of the neighbours would have to leave the text to make room for the document',
                        'The facts would end up ordered from oldest to most recent, and that order does not exist in journalism'] },
          correct:0,
          hint:{ es:'Un dato de archivo solo resuelve algo cuando el lector ya conoce el desacuerdo que ese dato viene a dirimir.',
                 en:'An archive fact only settles something when the reader already knows the disagreement it comes to settle.' },
          expl:{ es:'Ningún contenido desaparece al mover los párrafos: lo que se pierde es la función de cada uno. El libro de fábrica sirve porque llega después de las dos versiones; colocado al principio sería una fecha más, y la escena final ya no cerraría nada porque el lector todavía no tendría con qué relacionarla.',
                 en:'No content disappears when the paragraphs move: what is lost is the job each one does. The parish book works because it arrives after the two versions; placed at the start it would be one more date, and the final scene would close nothing because the reader would not yet have anything to relate it to.' } },
        p4:{ title:{ es:'El dato de archivo', en:'The archive fact' },
          stmt:{ es:'El taller consultó el libro de fábrica de la parroquia y publicó la fecha que ahí aparece. ¿Qué función cumple ese dato dentro del reportaje?',
                 en:'The workshop consulted the parish record book and published the date that appears there. What job does that fact do within the report?' },
          options:{ es:['Permite comparar dos recuerdos que no coinciden y establecer cuál de las dos fechas se sostiene',
                        'Aporta la opinión del taller sobre cuál de los dos vecinos merece mayor confianza',
                        'Vuelve innecesarios los testimonios, porque un documento dice más que una persona',
                        'Confirma que los dos vecinos recordaban lo mismo y solo lo expresaban con otras palabras'],
                    en:['It allows two recollections that do not match to be compared and settles which of the two dates holds',
                        'It supplies the workshop opinion about which of the two neighbours deserves more trust',
                        'It makes the testimonies unnecessary, because a document says more than a person',
                        'It confirms that both neighbours remembered the same thing and only put it in different words'] },
          correct:0,
          hint:{ es:'Fíjate en qué estaba ocurriendo en el texto justo antes de que apareciera el documento.',
                 en:'Notice what was happening in the text right before the document appeared.' },
          expl:{ es:'El documento entra donde había un desacuerdo y lo dirime sin descalificar a nadie: el reportaje conserva las dos voces y añade la fecha registrada. Por eso el archivo no compite con los testimonios, los ordena.',
                 en:'The document comes in where there was a disagreement and settles it without discrediting anyone: the report keeps both voices and adds the recorded date. That is why the archive does not compete with the testimonies, it arranges them.' } },
        p5:{ title:{ es:'Dos recuerdos que no coinciden', en:'Two recollections that do not match' },
          stmt:{ es:'El reportaje reproduce dos recuerdos que se contradicen y no descarta ninguno de los dos, aunque ya conoce la fecha registrada. ¿Por qué los conserva?',
                 en:'The report reproduces two recollections that contradict each other and discards neither, even though it already knows the recorded date. Why does it keep them?' },
          options:{ es:['Porque el desacuerdo mismo informa: muestra a qué suceso ató cada persona aquella fecha',
                        'Porque el taller no consiguió averiguar cuál de los dos vecinos decía la verdad',
                        'Porque el género obliga a citar a todas las personas entrevistadas, coincidan o no',
                        'Porque ninguno de los dos recuerdos puede comprobarse y por eso quedan al mismo nivel'],
                    en:['Because the disagreement itself informs: it shows which event each person tied that date to',
                        'Because the workshop could not find out which of the two neighbours was telling the truth',
                        'Because the genre requires quoting every person interviewed, whether they agree or not',
                        'Because neither recollection can be checked and so both stay at the same level'] },
          correct:0,
          hint:{ es:'Pregúntate qué se sabría del pueblo si el texto se quedara solamente con la versión que coincide con el documento.',
                 en:'Ask yourself what would be known about the town if the text kept only the version that matches the document.' },
          expl:{ es:'El texto ya sabe qué fecha registró el libro, así que no conserva las dos versiones por duda. Las conserva porque cada una revela qué suceso organizó la vida de esa persona, y eso es justamente lo que el reportaje se propuso explicar.',
                 en:'The text already knows which date the book recorded, so it does not keep both versions out of doubt. It keeps them because each one reveals which event organised that person life, and that is exactly what the report set out to explain.' } },
        p6:{ title:{ es:'Las marcas de atribución', en:'Attribution markers' },
          stmt:{ es:'En el cuarto párrafo, lo que se dice sobre la torre aparece precedido por «Según doña Amparo Nájera» y «De acuerdo con don Nicolás Ibarra». ¿Qué establece esa marca?',
                 en:'In the fourth paragraph, what is said about the tower comes preceded by «Según doña Amparo Nájera» and «De acuerdo con don Nicolás Ibarra». What does that marker establish?' },
          options:{ es:['Que la afirmación queda a nombre de quien la hizo y no de lo que el taller verificó',
                        'Que el taller comprobó esa afirmación y la sostiene como propia',
                        'Que la información procede de un documento oficial consultado en el archivo',
                        'Que la frase se reproduce con palabras distintas de las que se dijeron'],
                    en:['That the claim stands in the name of whoever made it and not of what the workshop verified',
                        'That the workshop verified that claim and holds it as its own',
                        'That the information comes from an official document consulted in the archive',
                        'That the sentence is reproduced with words different from those actually said'] },
          correct:0,
          hint:{ es:'Prueba a leer el párrafo sin esas marcas y observa quién quedaría afirmando cada cosa.',
                 en:'Try reading the paragraph without those markers and see who would be left claiming each thing.' },
          expl:{ es:'Sin esas palabras el reportaje estaría dando por comprobado algo que no comprobó. La marca de atribución traza la frontera entre lo que el texto verificó y lo que una persona sostiene, y gracias a ella el lector sabe siempre a quién puede pedirle cuentas.',
                 en:'Without those words the report would be taking as verified something it did not verify. The attribution marker draws the border between what the text verified and what a person holds, and thanks to it the reader always knows whom to hold responsible.' } },
        p7:{ title:{ es:'Interpretar no es opinar', en:'Interpreting is not giving an opinion' },
          stmt:{ es:'Otro estudiante escribió sobre el mismo suceso: «Creo que devolver la campana fue la mejor decisión que ha tomado este pueblo». ¿En qué se distingue esa frase del cierre del reportaje?',
                 en:'Another student wrote about the same event: «Creo que devolver la campana fue la mejor decisión que ha tomado este pueblo». How does that sentence differ from the closing of the report?' },
          options:{ es:['La frase expresa una preferencia de quien escribe; el cierre explica un sentido que se desprende de los hechos reunidos',
                        'La frase es más breve, y la extensión es lo que separa a los dos géneros',
                        'La frase no menciona la fecha del suceso, y el cierre del reportaje sí la menciona',
                        'La frase aparece firmada, mientras que el cierre del reportaje se publica sin firma'],
                    en:['The sentence expresses a preference of the writer; the closing explains a meaning that follows from the gathered facts',
                        'The sentence is shorter, and length is what separates the two genres',
                        'The sentence does not mention the date of the event, and the closing of the report does',
                        'The sentence appears signed, while the closing of the report is published unsigned'] },
          correct:0,
          hint:{ es:'Pregúntate qué haría falta para discutirle a cada una de las dos frases.',
                 en:'Ask yourself what it would take to argue against each of the two sentences.' },
          expl:{ es:'A la primera solo puede oponérsele otra preferencia, porque no se apoya en nada verificable. Al cierre del reportaje se le puede discutir con los mismos materiales que usó: los antecedentes, las voces y el documento. Interpretar es explicar con lo reunido; opinar es tomar partido.',
                 en:'The first can only be met with another preference, because it rests on nothing verifiable. The closing of the report can be argued with the very materials it used: the background, the voices and the document. Interpreting is explaining with what was gathered; giving an opinion is taking sides.' } },
        p8:{ title:{ es:'La fuente que dirime', en:'The source that settles it' },
          stmt:{ es:'El taller quiere establecer en qué año la campana dejó de repicar los domingos, y las dos personas entrevistadas dan años distintos. ¿Qué fuente resuelve ese desacuerdo?',
                 en:'The workshop wants to establish in what year the bell stopped ringing on Sundays, and the two people interviewed give different years. Which source settles that disagreement?' },
          options:{ es:['El libro donde la parroquia anotaba cada servicio en el momento en que ocurría',
                        'El recuerdo de un tercer vecino que también viviera en el pueblo aquellos años',
                        'La fotografía de la torre que el taller tomó el día de la reapertura',
                        'El acta de la reapertura que el ayuntamiento firmó el mes pasado'],
                    en:['The book where the parish wrote down each service at the moment it happened',
                        'The recollection of a third neighbour who also lived in the town in those years',
                        'The photograph of the tower the workshop took on reopening day',
                        'The reopening record the town hall signed last month'] },
          correct:0,
          hint:{ es:'Busca la fuente que quedó escrita mientras el suceso ocurría, no la que se elaboró después.',
                 en:'Look for the source that was written while the event was happening, not the one produced afterwards.' },
          expl:{ es:'Un tercer recuerdo añade una versión más, pero no arbitra entre las otras dos. La fotografía y el acta son posteriores y hablan de la reapertura, no del momento que se busca fechar. Solo el registro llevado entonces fija esa fecha.',
                 en:'A third recollection adds one more version, but does not arbitrate between the other two. The photograph and the record are later and speak about the reopening, not about the moment being dated. Only the register kept back then fixes that date.' } }
      }
    },
    {
      kick:{ es:'Periódico escolar · Taller de periodismo de tercer grado', en:'School newspaper · Third grade journalism workshop' },
      head:'El andén donde todavía se espera',
      by:{ es:'Reportaje elaborado por el taller de periodismo', en:'Report produced by the journalism workshop' },
      paras:[
        'Los martes por la mañana, don Aurelio Cortés barre el andén de la estación de Santa Cruz aunque por esa vía no pasa un tren de pasajeros desde hace veintinueve años. Barre de la caseta al reloj, siempre en el mismo orden.',
        'El 12 de marzo la vieja estación volvió a abrir sus puertas, ahora como sala de memoria del pueblo. Un grupo de estudiantes y tres familias del barrio reunieron ahí la bitácora de la estación, doscientas cuarenta fotografías y los objetos que cada casa había guardado por su cuenta.',
        'La estación no cerró de un día para otro. Cuando el ramal dejó de dar servicio, cerraron primero los talleres, después la bodega de carga y al final la escuela nocturna donde estudiaban los trabajadores. Varias familias se mudaron a la capital del estado, y el pueblo dejó de medir el día por el paso de los trenes.',
        'Sobre cuándo pasó el último tren de pasajeros, el pueblo no se pone de acuerdo. Según doña Julia Mendoza, ocurrió «el año en que se desbordó el río, porque la gente subió al andén para no mojarse». De acuerdo con don Aurelio Cortés, que trabajó en la caseta de señales, sucedió antes: «Fue el año de la boda de mi hija; el tren se llevó a los padrinos y ya no volvió por esta vía».',
        'La bitácora de la estación, consultada por este taller, tiene su última anotación de servicio de pasajeros con fecha del 9 de noviembre de 1994: dos años antes de la creciente del río y el mismo año de la boda que recuerda don Aurelio. Ninguno de los dos vecinos inventó nada; los dos fecharon el suceso con aquello que en esos años les cambió la vida, y solo uno de esos hechos coincide con el registro.',
        'Lo que volvió a abrir el 12 de marzo no fue solamente un edificio. Un pueblo que había perdido sus talleres, su bodega y su manera de medir el día encontró un lugar donde esas pérdidas están juntas y pueden contarse en orden. El desacuerdo sobre la fecha, que parecía un asunto entre dos vecinos, dejó ver algo más grande: la memoria del lugar no guarda años, guarda sucesos, y los ata unos a otros hasta formar un calendario propio.'
      ],
      capas:[
        { frag:{ es:'La bitácora registra el último servicio de pasajeros el 9 de noviembre de 1994.', en:'The station log registers the last passenger service on 9 November 1994.' }, bin:0,
          why:{ es:'Está tomado de un documento que el taller consultó y que cualquier lector podría volver a revisar.', en:'It is taken from a document the workshop consulted and that any reader could check again.' } },
        { frag:{ es:'Según doña Julia Mendoza, el último tren pasó el año en que se desbordó el río.', en:'According to doña Julia Mendoza, the last train ran the year the river flooded.' }, bin:1,
          why:{ es:'La afirmación va a nombre de quien la dijo: el reportaje la reproduce sin hacerla suya.', en:'The claim goes in the name of whoever said it: the report reproduces it without making it its own.' } },
        { frag:{ es:'La memoria del lugar no guarda años, guarda sucesos, y los ata unos a otros.', en:'The memory of the place does not keep years, it keeps events, and ties them to one another.' }, bin:2,
          why:{ es:'Ningún documento dice esto y nadie lo declaró: es la explicación que el texto construye con lo que reunió.', en:'No document says this and nobody declared it: it is the explanation the text builds with what it gathered.' } },
        { frag:{ es:'Estudiantes y familias del barrio reunieron en la estación la bitácora y doscientas cuarenta fotografías.', en:'Students and families of the neighbourhood gathered the log and two hundred and forty photographs in the station.' }, bin:0,
          why:{ es:'Es un hecho que el taller comprobó y que puede contarse pieza por pieza.', en:'It is a fact the workshop verified and that can be counted piece by piece.' } },
        { frag:{ es:'De acuerdo con don Aurelio Cortés, el último tren pasó el año de la boda de su hija.', en:'According to don Aurelio Cortés, the last train ran the year of the wedding of his daughter.' }, bin:1,
          why:{ es:'La marca de acuerdo con deja la afirmación en manos del señalero, no del reportaje.', en:'The phrase de acuerdo con leaves the claim in the hands of the signalman, not of the report.' } },
        { frag:{ es:'Un pueblo que había perdido su manera de medir el día encontró un lugar donde sus pérdidas pueden contarse en orden.', en:'A town that had lost its way of measuring the day found a place where its losses can be told in order.' }, bin:2,
          why:{ es:'Reúne varios hechos y les da un sentido; ese sentido lo aporta quien escribe a partir de lo verificado.', en:'It gathers several facts and gives them a meaning; the writer supplies that meaning out of what was verified.' } }
      ],
      moves:[
        { es:'Una escena concreta del andén abre el texto', en:'A concrete scene on the platform opens the text' },
        { es:'Se enuncia qué ocurrió, cuándo y quiénes lo hicieron posible', en:'What happened, when and who made it possible is stated' },
