<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energías Renovable y No Renovable en la Comunidad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Energías Renovable y No Renovable en la Comunidad</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Energías Renovable y No Renovable en la Comunidad</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#c0202a', primaryDark:'#490a0e', primaryBg:'#f6e7e8',
  accent:'#f5c800', accentBg:'#fff8db',
  darkPrimary:'#c94049', darkPrimaryDark:'#e97179', darkPrimaryBg:'#3b0a0e',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')

function fitCanvas(c){
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth || 320;
  var h = c.clientHeight || 236;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}

function sunGlyph(ctx, x, y, r, rays, color){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.284); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  for (var i = 0; i < rays; i++){
    var a = (6.284 / rays) * i;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * (r + 3), y + Math.sin(a) * (r + 3));
    ctx.lineTo(x + Math.cos(a) * (r + 10), y + Math.sin(a) * (r + 10));
    ctx.stroke();
  }
}

      }) + '</div>' +
      '<div class="cls-card">' + seq[i][LANG] + '</div>' +
      '<div class="gw-row cls-bins">' +
        '<button class="gw-btn" id="w1b0">' + BINS[0] + '</button>' +
        '<button class="gw-btn" id="w1b1">' + BINS[1] + '</button>' +
      '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelector('#w1b0').onclick = function(){ choose(0); };
    host.querySelector('#w1b1').onclick = function(){ choose(1); };
  }
  function advance(){
    i++; tries = 0;
    if (i >= seq.length) done = true;
    render();
  }
  function choose(b){
    var it = seq[i];
    if (b === it.bin){
      hits++;
      say(host, 'good', L({
        es:'Así es. ' + (it.bin === 0 ? 'Mañana vuelve a estar disponible aunque hoy se aproveche por completo.' : 'Cada kilo que se quema ya no vuelve: lo que hay en el subsuelo se formó durante muchísimo tiempo.'),
        en:'That is right. ' + (it.bin === 0 ? 'Tomorrow it is available again even if all of it is used today.' : 'Every kilo burned is gone: what lies underground took an enormous time to form.')
      }));
      setTimeout(advance, 1100);
      return;
    }
    tries++;
    if (tries >= 3){
      say(host, 'miss', L({
        es: 'Iba en "' + BINS[it.bin] + '". La pregunta que decide es siempre la misma: si hoy la usamos toda, cuánto tarda la naturaleza en volver a ponerla.',
        en: 'It belonged in "' + BINS[it.bin] + '". The deciding question is always the same: if we use it all today, how long does nature take to put it back.'
      }));
      setTimeout(advance, 2400);
      return;
    }
    say(host, 'warm', L({
      es:'Todavía no. No te fijes en si se puede comprar otra vez, sino en cuánto tarda la naturaleza en producirla de nuevo.',
      en:'Not yet. Do not look at whether it can be bought again, but at how long nature takes to produce it again.'
    }));
  }
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: ARMA LA CADENA
   Una cadena de transformaciones del pueblo llega revuelta y el alumno la
   ordena tocando dos pasos para intercambiarlos. La devolución señala el
   primer eslabón que no puede ir donde está; a la tercera se acomoda sola.
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var CHAINS = [
    { name:{ es:'El molino del cerro', en:'The windmill on the hill' },
      steps:[
        { es:'El Sol calienta de forma despareja el aire del valle', en:'The Sun heats the valley air unevenly' },
        { es:'El aire caliente sube y en su lugar entra viento', en:'The warm air rises and wind moves in to take its place' },
        { es:'El viento empuja las aspas del molino', en:'The wind pushes the blades of the windmill' },
        { es:'Las aspas hacen girar el generador', en:'The blades spin the generator' },
        { es:'Las lámparas de la plaza se encienden', en:'The lamps in the plaza light up' }
      ] },
    { name:{ es:'El techo de la tienda', en:'The shop roof' },
      steps:[
        { es:'La luz del Sol llega a las celdas del techo', en:'Sunlight reaches the cells on the roof' },
        { es:'Las celdas entregan corriente eléctrica', en:'The cells deliver electric current' },
        { es:'El inversor prepara esa corriente para los aparatos', en:'The inverter prepares that current for the appliances' },
        { es:'El refrigerador de la tienda se mantiene frío', en:'The shop refrigerator stays cold' }
      ] },
    { name:{ es:'La presa del río', en:'The dam on the river' },
      steps:[
        { es:'La lluvia de la temporada llena el vaso de la presa', en:'The seasonal rain fills the dam reservoir' },
        { es:'El agua baja por el ducto hasta el fondo de la cortina', en:'The water runs down the duct to the foot of the wall' },
        { es:'La turbina gira empujada por el agua', en:'The turbine spins pushed by the water' },
        { es:'El generador convierte ese giro en electricidad', en:'The generator turns that spinning into electricity' },
        { es:'La escuela recibe la energía por la línea', en:'The school receives the energy through the line' }
      ] },
    { name:{ es:'La caldera del ingenio', en:'The sugar mill boiler' },
      steps:[
        { es:'El bagazo seco de la caña se quema en la caldera', en:'The dry cane bagasse is burned in the boiler' },
        { es:'El agua de la caldera se convierte en vapor', en:'The water in the boiler turns into steam' },
        { es:'El vapor empuja los álabes de la turbina', en:'The steam pushes the blades of the turbine' },
        { es:'El generador entrega electricidad al ingenio', en:'The generator delivers electricity to the mill' }
      ] }
  ];
  var ch = pk(rng, CHAINS);
  var n = ch.steps.length;
  var order = shuffle(ch.steps.map(function(_, k){ return k; }), rng);
  var identity = order.every(function(v, k){ return v === k; });
  if (identity) order = order.slice(1).concat(order.slice(0, 1));
  var selPos = null, tries = 0, done = false;

  function render(){
    var chips = order.map(function(si, pos){
      var cls = 'ch-chip' + (selPos === pos ? ' sel' : '') + (done ? ' locked' : '');
      return '<div class="' + cls + '" data-pos="' + pos + '"><span class="ch-num">' + (pos + 1) + '</span>' + ch.steps[si][LANG] + '</div>';
    }).join('');
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'Arma la cadena', en:'Build the chain' }) + '<span class="gw-tag">' + ch.name[LANG] + '</span></div>' +
      '<div class="gw-mini">' + L({
        es:'Los pasos llegaron revueltos. Toca dos para intercambiarlos hasta dejarlos del primero al último, y después comprueba.',
        en:'The steps arrived shuffled. Tap two to swap them until they run from first to last, then check.'
      }) + '</div>' +
      '<div class="ch-list">' + chips + '</div>' +
      '<div class="gw-row"><button class="gw-btn" id="w2k">' + L({ es:'Comprobar la cadena', en:'Check the chain' }) + '</button></div>' +
      '<div class="gw-fb"></div>';
    if (!done){
      Array.prototype.forEach.call(host.querySelectorAll('.ch-chip'), function(el){
        el.onclick = function(){ tap(parseInt(el.getAttribute('data-pos'), 10)); };
      });
      host.querySelector('#w2k').onclick = check;
    } else {
      host.querySelector('#w2k').disabled = true;
      host.querySelector('#w2k').classList.add('solved');
    }
  }
  function tap(pos){
    if (done) return;
    if (selPos === null) selPos = pos;
    else if (selPos === pos) selPos = null;
    else {
      var tmp = order[selPos]; order[selPos] = order[pos]; order[pos] = tmp;
      selPos = null;
    }
    render();
  }
  function check(){
    if (done) return;
    var ok = order.every(function(si, pos){ return si === pos; });
    if (ok){
      done = true; render();
      say(host, 'good', L({
        es:'Cadena armada. Cada eslabón entrega la energía al siguiente en otra forma, y solo el último se alcanza a ver desde la calle.',
        en:'Chain built. Each link hands the energy to the next one in another form, and only the last one is visible from the street.'
      }));
      return;
    }
    tries++;
    if (tries >= 3){
      order = ch.steps.map(function(_, k){ return k; });
      done = true; render();
      say(host, 'miss', L({
        es:'Este es el orden. Fíjate en que cada paso solo puede ocurrir cuando el anterior ya le entregó la energía.',
        en:'This is the order. Notice that each step can only happen once the previous one has handed over the energy.'
      }));
      return;
    }
    var bad = 0;
    while (bad < n && order[bad] === bad) bad++;
    say(host, 'warm', L({
      es:'Todavía no. Revisa el paso que dejaste en el lugar ' + (bad + 1) + ': pregúntate qué tuvo que ocurrir antes para que ese paso sea posible.',
      en:'Not yet. Look at the step you left in place ' + (bad + 1) + ': ask yourself what must have happened before for that step to be possible.'
    }));
  }
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: EL TECHO SOLAR DE LA ESCUELA
   Dos deslizadores: cuántos paneles se instalan y cuántas horas de Sol
   aprovechan. El techo se llena de paneles, el Sol gana rayos y la barra de
   energía del día crece en vivo contra la marca de la meta. Tres metas; la
   devolución dice si falta o sobra y por dónde conviene corregir.
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var PW = 200;
  var metas = shuffle([1600, 2400, 3200, 3600, 4000, 4800, 6000, 8000], rng).slice(0, 3);
  var r = 0, tries = 0, done = false;
  var np = 3, hs = 4;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Techo solar de la escuela', en:'School solar roof' }) + '<span class="gw-tag" id="w3tag"></span></div>' +
    '<div class="gw-q" id="w3q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Cada panel del techo entrega 200 W mientras le pega el Sol. Mueve los dos deslizadores y observa cómo cambia la energía que junta la escuela en un día.',
      en:'Each panel on the roof delivers 200 W while the Sun hits it. Move the two sliders and watch how the energy the school gathers in one day changes.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w3c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Paneles', en:'Panels' }) + '</span><input type="range" id="w3p" min="1" max="10" step="1" value="3"><span class="gw-sv" id="w3pv">3</span></div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Horas de Sol', en:'Hours of Sun' }) + '</span><input type="range" id="w3h" min="2" max="8" step="1" value="4"><span class="gw-sv" id="w3hv">4 h</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Potencia instalada', en:'Installed power' }) + '</div><div class="gw-cv" id="w3o1">600 W</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Horas de Sol', en:'Hours of Sun' }) + '</div><div class="gw-cv" id="w3o2">4 h</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Energía del día', en:'Energy of the day' }) + '</div><div class="gw-cv" id="w3o3">2400 Wh</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w3k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w3c');
  function day(){ return np * PW * hs; }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var roof = H * 0.60;
    sunGlyph(ctx, 34 + (hs - 2) * ((W - 90) / 6), 40, 11, 4 + hs, cssv('--gold'));
    ctx.fillStyle = cssv('--surface');
    ctx.fillRect(18, roof, W - 36, H - roof - 46);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.5;
    ctx.strokeRect(18, roof, W - 36, H - roof - 46);
    ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'left'; ctx.fillStyle = cssv('--text3');
    ctx.fillText(L({ es:'escuela', en:'school' }), 24, roof + 18);
    var pw = Math.min(26, (W - 60) / 10), gap = 3;
    for (var i = 0; i < np; i++){
      var x = 24 + i * (pw + gap);
      ctx.fillStyle = cssv('--green');
      ctx.fillRect(x, roof - 13, pw, 11);
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 1;
      ctx.strokeRect(x, roof - 13, pw, 11);
    }
    var barY = H - 34, barW = W - 36;
    ctx.fillStyle = cssv('--surface');
    ctx.fillRect(18, barY, barW, 18);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    ctx.strokeRect(18, barY, barW, 18);
    var frac = Math.min(day() / 16000, 1);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(18, barY, barW * frac, 18);
    if (!done){
      var mf = Math.min(metas[r] / 16000, 1);
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(18 + barW * mf, barY - 5); ctx.lineTo(18 + barW * mf, barY + 23); ctx.stroke();
    }
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'left';
    ctx.fillText(L({ es:'energía juntada en el día', en:'energy gathered in the day' }), 18, barY - 8);
  }
  regDraw(draw);

  function live(){
    host.querySelector('#w3pv').textContent = String(np);
    host.querySelector('#w3hv').textContent = hs + ' h';
    host.querySelector('#w3o1').textContent = (np * PW) + ' W';
    host.querySelector('#w3o2').textContent = hs + ' h';
    host.querySelector('#w3o3').textContent = day() + ' Wh';
    draw();
    if (done) return;
    var g = metas[r], e = day();
    if (e === g){
      say(host, 'good', L({
        es:'Justo en la meta: ' + g + ' Wh en el día. Confirma con el botón.',
        en:'Right on target: ' + g + ' Wh in the day. Confirm with the button.'
      }));
    } else if (e < g){
      say(host, 'warm', L({
        es:'Vas en ' + e + ' Wh y la meta es ' + g + ' Wh. Falta energía: pon más paneles en el techo o aprovecha más horas de Sol.',
        en:'You are at ' + e + ' Wh and the target is ' + g + ' Wh. Energy is missing: put more panels on the roof or take more hours of Sun.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Vas en ' + e + ' Wh y la meta es ' + g + ' Wh. Te pasaste: quita un panel o cuenta menos horas de Sol.',
        en:'You are at ' + e + ' Wh and the target is ' + g + ' Wh. Too much: remove a panel or count fewer hours of Sun.'
      }));
    }
  }
  function showRound(){
    tries = 0;
    host.querySelector('#w3tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w3q').innerHTML = L({
      es:'Meta: que el techo junte <span class="gw-cv">' + metas[r] + ' Wh</span> en un día de Sol.',
      en:'Goal: make the roof gather <span class="gw-cv">' + metas[r] + ' Wh</span> in one sunny day.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w3tag').textContent = L({ es:'Techo resuelto', en:'Roof solved' });
      host.querySelector('#w3k').disabled = true;
      host.querySelector('#w3k').classList.add('solved');
      say(host, 'good', L({
        es:'Ya lo viste en la barra: la energía del día crece igual si duplicas los paneles que si duplicas las horas de Sol aprovechadas.',
        en:'You saw it on the bar: the energy of the day grows the same whether you double the panels or double the hours of Sun used.'
      }));
      return;
    }
    showRound();
  }
  function solveFor(g){
    for (var hh = 2; hh <= 8; hh++){
      for (var pp = 1; pp <= 10; pp++){
        if (pp * PW * hh === g) return [pp, hh];
      }
    }
    return [3, 4];
  }
  host.querySelector('#w3p').oninput = function(){ np = parseInt(this.value, 10); live(); };
  host.querySelector('#w3h').oninput = function(){ hs = parseInt(this.value, 10); live(); };
  host.querySelector('#w3k').onclick = function(){
    if (done) return;
    var g = metas[r];
    if (day() === g){
      say(host, 'good', L({
        es:'Correcto: ' + np + ' paneles de 200 W con ' + hs + ' horas de Sol dejan ' + g + ' Wh.',
        en:'Correct: ' + np + ' panels of 200 W with ' + hs + ' hours of Sun leave ' + g + ' Wh.'
      }));
      setTimeout(nextRound, 1100);
      return;
    }
    tries++;
    if (tries >= 3){
      var sol = solveFor(g);
      say(host, 'miss', L({
        es:'Una instalación que sirve: ' + sol[0] + ' paneles con ' + sol[1] + ' horas de Sol. La potencia de todos los paneles juntos, sostenida durante esas horas, deja ' + g + ' Wh. Hay otras combinaciones.',
        en:'One installation that works: ' + sol[0] + ' panels with ' + sol[1] + ' hours of Sun. The power of all the panels together, held for those hours, leaves ' + g + ' Wh. There are other combinations.'
      }));
      setTimeout(nextRound, 3000);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: LA CAJA SOLAR
   Un calentador de caja con tres decisiones de diseño: color del interior,
   tapa transparente e inclinación hacia el Sol. Cada cambio se ve al momento
   en la caja dibujada y en el termómetro. Tres metas de calentamiento; la
   devolución apunta a la decisión que falta mover.
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var metas = shuffle([6, 8, 12, 14, 18], rng).slice(0, 3);
  var r = 0, tries = 0, done = false;
  var dark = false, lid = false, tilt = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La caja solar', en:'The solar box' }) + '<span class="gw-tag" id="w4tag"></span></div>' +
    '<div class="gw-q" id="w4q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Adentro de la caja hay un vaso con agua. Cambia una decisión a la vez y mira cuánto sube el termómetro después de una hora al Sol.',
      en:'Inside the box there is a glass of water. Change one decision at a time and watch how far the thermometer rises after one hour in the Sun.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w4c"></canvas>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" id="w4a">' + L({ es:'Interior: blanco', en:'Inside: white' }) + '</button>' +
      '<button class="gw-btn" id="w4b">' + L({ es:'Sin tapa', en:'No cover' }) + '</button>' +
      '<button class="gw-btn" id="w4d">' + L({ es:'Caja plana', en:'Box flat' }) + '</button>' +
    '</div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Temperatura inicial', en:'Starting temperature' }) + '</div><div class="gw-cv">22 °C</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Subida', en:'Rise' }) + '</div><div class="gw-cv" id="w4o2">2 °C</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Temperatura final', en:'Final temperature' }) + '</div><div class="gw-cv" id="w4o3">24 °C</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w4k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w4c');
  function rise(){ return (dark ? 8 : 2) + (lid ? 6 : 0) + (tilt ? 4 : 0); }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    sunGlyph(ctx, 40, 36, 10, 8, cssv('--gold'));
    ctx.save();
    ctx.translate(W * 0.44, H * 0.68);
    if (tilt) ctx.rotate(-0.28);
    var bw = Math.min(150, W * 0.40), bh = 58;
    ctx.fillStyle = dark ? cssv('--text') : cssv('--surface');
    ctx.fillRect(-bw / 2, -bh, bw, bh);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 2;
    ctx.strokeRect(-bw / 2, -bh, bw, bh);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(-13, -32, 26, 28);
    if (lid){
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-bw / 2, -bh); ctx.lineTo(bw / 2, -bh); ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
    for (var i = 0; i < 3; i++){
      var y0 = 52 + i * 12;
      ctx.beginPath(); ctx.moveTo(58, y0); ctx.lineTo(58 + 44, y0 + 32); ctx.stroke();
    }
    var tx = W - 46, ty0 = 34, ty1 = H - 40;
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.5;
    ctx.strokeRect(tx, ty0, 16, ty1 - ty0);
    var frac = Math.min(rise() / 18, 1);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(tx + 2, ty1 - 2 - (ty1 - ty0 - 4) * frac, 12, (ty1 - ty0 - 4) * frac);
    ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = cssv('--text3');
    ctx.fillText('+' + rise(), tx + 8, ty0 - 6);
    ctx.textAlign = 'left';
    ctx.fillText(L({ es:'una hora al Sol', en:'one hour in the Sun' }), 18, H - 12);
  }
  regDraw(draw);

  function labels(){
    host.querySelector('#w4a').textContent = dark ? L({ es:'Interior: negro', en:'Inside: black' }) : L({ es:'Interior: blanco', en:'Inside: white' });
    host.querySelector('#w4b').textContent = lid ? L({ es:'Con tapa transparente', en:'With clear cover' }) : L({ es:'Sin tapa', en:'No cover' });
    host.querySelector('#w4d').textContent = tilt ? L({ es:'Caja inclinada al Sol', en:'Box tilted to the Sun' }) : L({ es:'Caja plana', en:'Box flat' });
    host.querySelector('#w4a').classList.toggle('on', dark);
    host.querySelector('#w4b').classList.toggle('on', lid);
    host.querySelector('#w4d').classList.toggle('on', tilt);
  }
  function live(){
    labels();
    host.querySelector('#w4o2').textContent = rise() + ' °C';
    host.querySelector('#w4o3').textContent = (22 + rise()) + ' °C';
    draw();
    if (done) return;
    var g = metas[r], e = rise();
    if (e === g){
      say(host, 'good', L({
        es:'El agua subió ' + e + ' °C, justo la meta. Confirma con el botón.',
        en:'The water rose ' + e + ' °C, exactly the target. Confirm with the button.'
      }));
    } else if (e < g){
      say(host, 'warm', L({
        es:'El agua subió ' + e + ' °C y la meta es ' + g + ' °C. Falta calentamiento: piensa qué color absorbe más luz, qué hace la tapa con el aire ya caliente y qué gana la caja al mirar de frente al Sol.',
        en:'The water rose ' + e + ' °C and the target is ' + g + ' °C. Not warm enough: think which colour absorbs more light, what the cover does with the already warm air and what the box gains by facing the Sun.'
      }));
    } else {
      say(host, 'warm', L({
        es:'El agua subió ' + e + ' °C y la meta es ' + g + ' °C. Te pasaste: deshaz una de las tres decisiones y observa cuánto baja el termómetro.',
        en:'The water rose ' + e + ' °C and the target is ' + g + ' °C. Too much: undo one of the three decisions and watch how far the thermometer drops.'
      }));
    }
  }
  function showRound(){
    tries = 0;
    host.querySelector('#w4tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w4q').innerHTML = L({
      es:'Meta: que el agua suba <span class="gw-cv">' + metas[r] + ' °C</span> en una hora al Sol.',
      en:'Goal: make the water rise <span class="gw-cv">' + metas[r] + ' °C</span> in one hour in the Sun.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w4tag').textContent = L({ es:'Caja ajustada', en:'Box tuned' });
      host.querySelector('#w4k').disabled = true;
      host.querySelector('#w4k').classList.add('solved');
      say(host, 'good', L({
        es:'Probaste una decisión a la vez y por eso sabes cuánto aporta cada una. Así se ordena un experimento: un cambio, una medida.',
        en:'You tested one decision at a time and that is why you know how much each one contributes. That is how an experiment is arranged: one change, one measurement.'
      }));
      return;
    }
    showRound();
  }
  function solveFor(g){
    var combos = [[false,false,false],[true,false,false],[false,true,false],[false,false,true],
                  [true,true,false],[true,false,true],[false,true,true],[true,true,true]];
    for (var i = 0; i < combos.length; i++){
      var c = combos[i];
      var v = (c[0] ? 8 : 2) + (c[1] ? 6 : 0) + (c[2] ? 4 : 0);
      if (v === g) return c;
    }
    return [true, true, true];
  }
  host.querySelector('#w4a').onclick = function(){ if (!done){ dark = !dark; live(); } };
  host.querySelector('#w4b').onclick = function(){ if (!done){ lid = !lid; live(); } };
  host.querySelector('#w4d').onclick = function(){ if (!done){ tilt = !tilt; live(); } };
  host.querySelector('#w4k').onclick = function(){
    if (done) return;
    var g = metas[r];
    if (rise() === g){
      say(host, 'good', L({
        es:'Correcto: con esa caja el agua sube ' + g + ' °C en una hora.',
        en:'Correct: with that box the water rises ' + g + ' °C in one hour.'
      }));
      setTimeout(nextRound, 1100);
      return;
    }
    tries++;
    if (tries >= 3){
      var s = solveFor(g);
      say(host, 'miss', L({
        es:'Una caja que llega a ' + g + ' °C: interior ' + (s[0] ? 'negro' : 'blanco') + ', ' + (s[1] ? 'con tapa' : 'sin tapa') + ' y ' + (s[2] ? 'inclinada al Sol' : 'plana') + '. El interior oscuro absorbe más luz, la tapa atrapa el aire ya caliente y la inclinación recibe los rayos de frente.',
        en:'A box that reaches ' + g + ' °C: ' + (s[0] ? 'black' : 'white') + ' inside, ' + (s[1] ? 'with cover' : 'no cover') + ' and ' + (s[2] ? 'tilted to the Sun' : 'flat') + '. The dark inside absorbs more light, the cover traps the already warm air and the tilt takes the rays head on.'
      }));
      setTimeout(nextRound, 3200);
      return;
    }
    live();
  };
  showRound();
}

function mkP2(rng){

        en:'In one month the community centre used ' + total + ' kWh of electricity. Of that amount, ' + solar + ' kWh came from the roof panels and the rest arrived through the grid, which is supplied by a gas plant. What percentage of the consumption of the month was of renewable origin?'
      }),
      options: [ pct + ' %', (100 - pct) + ' %', (2 * pct) + ' %', (pct + 5) + ' %' ],
      correct: 0,

      }),
      exp: L({
        es:'De cada ' + total + ' kWh consumidos, ' + solar + ' kWh vinieron del techo solar. Al dividir ' + solar + ' entre ' + total + ' y multiplicar por cien queda ' + pct + ' por ciento renovable; el resto siguió siendo gas.',
        en:'Out of every ' + total + ' kWh used, ' + solar + ' kWh came from the solar roof. Dividing ' + solar + ' by ' + total + ' and multiplying by one hundred gives ' + pct + ' per cent renewable; the rest was still gas.'

function mkP5(rng){

    var P = pk(rng, [150, 200, 250]);
    var N = pk(rng, [4, 5, 6, 8]);
    var h = pk(rng, [4, 5, 6]);
    if (h === N) h = (h === 6 ? 4 : h + 1);
    var E = N * P * h;
    return {
      showWork: true,
      title: L({ es:'El techo de la biblioteca', en:'The library roof' }),
      q: L({
        es:'En el techo de la biblioteca se instalaron ' + N + ' paneles y cada uno entrega ' + P + ' W mientras le pega el Sol. En ese techo el Sol sirve ' + h + ' horas al día. ¿Cuánta energía junta la instalación en un día?',
        en:'On the library roof ' + N + ' panels were installed and each one delivers ' + P + ' W while the Sun hits it. On that roof the Sun is useful for ' + h + ' hours a day. How much energy does the installation gather in one day?'
      }),
      options: [ E + ' Wh', (N * P) + ' Wh', (P * h) + ' Wh', (2 * E) + ' Wh' ],

        es:'Junta primero la potencia de todos los paneles y luego considera durante cuántas horas se mantiene esa potencia.',

        es:'Los ' + N + ' paneles suman ' + (N * P) + ' W. Sostenidos ' + h + ' horas dejan ' + (N * P) + ' por ' + h + ', es decir ' + E + ' Wh en el día.',
        en:'The ' + N + ' panels add up to ' + (N * P) + ' W. Held for ' + h + ' hours they leave ' + (N * P) + ' times ' + h + ', that is ' + E + ' Wh in the day.'
      })

  }
  var P2 = pk(rng, [200, 250]);
  var N2 = pk(rng, [4, 5, 6]);
  var h2 = pk(rng, [4, 5, 6]);
  var need = N2 * P2 * h2;

    }),

      es:'Ninguna fuente entrega la energía ya lista para el aparato que la va a usar. Entre el viento del cerro y la lámpara de la plaza hay una cadena de pasos, y en cada paso la energía cambia de forma: movimiento del aire, giro de un eje, corriente eléctrica, luz.',
      en:'No source hands over energy ready made for the appliance that will use it. Between the wind on the hill and the lamp in the plaza there is a chain of steps, and at each step the energy changes form: motion of the air, spinning of a shaft, electric current, light.'
    }) + '</p>' +
    '<p>' + L({
      es:'La cadena tiene un orden que no se puede alterar: cada eslabón solo ocurre cuando el anterior ya le entregó la energía. Y en cada entrega se queda algo en el camino, casi siempre como calor en los ejes, en los cables o en el aire. Por eso a la salida nunca llega todo lo que entró.',
      en:'The chain has an order that cannot be altered: each link only happens once the previous one has handed over the energy. And at each handover something stays behind along the way, almost always as heat in the shafts, in the cables or in the air. That is why the output is never everything that went in.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Origen', en:'Origin' }), L({ es:'la fuente', en:'the source' }), L({ es:'Sol, viento, agua, combustible o biomasa', en:'Sun, wind, water, fuel or biomass' })) +
      rcard(L({ es:'Transformación', en:'Transformation' }), L({ es:'de una forma a otra', en:'from one form to another' }), L({ es:'movimiento, calor, corriente eléctrica, luz', en:'motion, heat, electric current, light' })) +
      rcard(L({ es:'Lo que se queda', en:'What stays behind' }), L({ es:'calor y ruido', en:'heat and noise' }), L({ es:'nada se pierde, pero no todo llega aprovechado', en:'nothing is lost, but not all of it arrives usable' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La cadena que sigue llegó revuelta. Toca dos pasos para intercambiarlos y guíate por una regla simple: un paso no puede ocurrir si el que le entrega la energía todavía no pasó.',
      en:'The chain below arrived shuffled. Tap two steps to swap them and use one simple rule: a step cannot happen if the one that hands it the energy has not happened yet.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'wB', 'chain'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* CONCEPTO 3 */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Medir lo que se usa y lo que se produce', en:'Measuring what is used and what is produced' }),
    '<p>' + L({
      es:'Para decidir si una fuente renovable alcanza para un lugar hay que medir dos cosas distintas. La potencia dice qué tan rápido entrega o consume energía un aparato en cada instante, y se mide en watts. La energía dice cuánto se juntó o se gastó en total durante un rato, y se mide en watts-hora.',
      en:'To decide whether a renewable source is enough for a place you have to measure two different things. Power says how fast a device delivers or uses energy at each instant, and it is measured in watts. Energy says how much was gathered or spent in total over a stretch of time, and it is measured in watt-hours.'
    }) + '</p>' +
    '<p>' + L({
      es:'Un panel de 200 W no produce siempre lo mismo: entrega esa potencia mientras le pega el Sol, y por eso importa cuántas horas al día le sirve. Lo que se compara con el consumo no es la potencia instalada, sino la energía que se junta en el día. Un techo con muchos paneles y pocas horas de Sol puede quedar igual que uno con pocos paneles y muchas horas.',
      en:'A 200 W panel does not always produce the same: it delivers that power while the Sun hits it, and that is why the hours of useful Sun per day matter. What is compared with consumption is not the installed power, but the energy gathered in the day. A roof with many panels and few hours of Sun can end up the same as one with few panels and many hours.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Potencia', en:'Power' }), L({ es:'watt (W)', en:'watt (W)' }), L({ es:'qué tan rápido se entrega o se consume la energía', en:'how fast the energy is delivered or used' })) +
      rcard(L({ es:'Energía', en:'Energy' }), L({ es:'watt-hora (Wh)', en:'watt-hour (Wh)' }), L({ es:'lo que se junta o se gasta en un tiempo dado', en:'what is gathered or spent in a given time' })) +
      rcard(L({ es:'Kilowatt-hora', en:'Kilowatt-hour' }), L({ es:'1 kWh = 1000 Wh', en:'1 kWh = 1000 Wh' }), L({ es:'la unidad que aparece en el recibo de la luz', en:'the unit that appears on the electricity bill' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En el techo que sigue puedes llegar a la misma meta por dos caminos distintos. Cuando aciertes, prueba a quitar paneles y compensar con horas de Sol.',
      en:'On the roof below you can reach the same target along two different paths. Once you hit it, try removing panels and making up for them with hours of Sun.'
    }) + '</p></div>'
  );
  w3(rng, widgetHost(s3, 'wC', 'solar'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* CONCEPTO 4 */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Experimentar con el Sol: un cambio a la vez', en:'Experimenting with the Sun: one change at a time' }),
    '<p>' + L({
      es:'La energía solar se puede aprovechar sin celdas ni cables: una caja con un vaso de agua adentro, puesta al Sol, calienta el agua. Cuánto la calienta depende de decisiones que se pueden probar en el patio de la escuela: de qué color está el interior, si la caja lleva tapa transparente y si está inclinada hacia el Sol o acostada.',
      en:'Solar energy can be used without cells or cables: a box with a glass of water inside, placed in the Sun, heats the water. How much it heats depends on decisions that can be tested in the school yard: what colour the inside is, whether the box has a clear cover and whether it is tilted towards the Sun or lying flat.'
    }) + '</p>' +
    '<p>' + L({
      es:'Lo difícil no es medir, es poder atribuir el resultado. Si cambias dos cosas a la vez y el agua sube más, no sabrás cuál de las dos ayudó. Por eso un experimento útil cambia una sola cosa y deja todo lo demás igual: la misma cantidad de agua, la misma hora, el mismo termómetro y el mismo rato de exposición.',
      en:'The hard part is not measuring, it is being able to attribute the result. If you change two things at once and the water rises more, you will not know which of the two helped. That is why a useful experiment changes one single thing and leaves everything else the same: the same amount of water, the same time of day, the same thermometer and the same length of exposure.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Lo que cambias', en:'What you change' }), L({ es:'una sola cosa', en:'one single thing' }), L({ es:'el color, la tapa o la inclinación, nunca dos a la vez', en:'the colour, the cover or the tilt, never two at once' })) +
      rcard(L({ es:'Lo que dejas igual', en:'What you keep equal' }), L({ es:'todo lo demás', en:'everything else' }), L({ es:'agua, hora, tamaño de la caja y tiempo al Sol', en:'water, time of day, box size and time in the Sun' })) +
      rcard(L({ es:'Lo que mides', en:'What you measure' }), L({ es:'la subida de temperatura', en:'the temperature rise' }), L({ es:'la diferencia entre la lectura final y la inicial', en:'the difference between the final and the initial reading' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En la caja que sigue, mueve un solo control y anota mentalmente cuánto aporta antes de tocar el siguiente. Esa es la única manera de saber cuál de los tres pesa más.',
      en:'In the box below, move a single control and note mentally how much it contributes before touching the next one. That is the only way to know which of the three weighs most.'
    }) + '</p></div>'
  );
  w4(rng, widgetHost(s4, 'wD', 'experiment'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* CONCEPTO 5 */
  sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Decidir en la comunidad: ventajas y límites', en:'Deciding in the community: advantages and limits' }),
    '<p>' + L({
      es:'Ninguna fuente es perfecta y por eso los pueblos suelen combinarlas. Las renovables no compran combustible ni sueltan humos, pero llegan cuando la naturaleza quiere: el Sol solo de día, el viento a rachas, el río según la temporada de lluvias. A eso se le llama intermitencia y es su límite real.',
      en:'No source is perfect and that is why towns usually combine them. Renewables buy no fuel and release no fumes, but they arrive when nature decides: the Sun only by day, the wind in gusts, the river according to the rainy season. That is called intermittency and it is their real limit.'
    }) + '</p>' +
    '<p>' + L({
      es:'Las no renovables entregan cuando uno lo pide, y por eso siguen encendiendo plantas de emergencia en hospitales y clínicas, pero cuestan combustible cada día y dejan gases en el aire de la comunidad. La salida práctica no suele ser elegir una sola: es producir con renovables cuando se puede y guardar el sobrante en baterías o en la red para las horas en que no hay producción.',
      en:'Non renewables deliver whenever they are asked to, which is why emergency plants are still fired up in hospitals and clinics, but they cost fuel every day and leave gases in the community air. The practical way out is usually not to pick only one: it is to produce with renewables while it is possible and store the surplus in batteries or in the grid for the hours with no production.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));

  /* CIERRE */
  var s6 = sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Todo junto', en:'Everything together' }),
    '<p>' + L({
      es:'Con lo que ya mediste puedes leer tu comunidad completa: de dónde sale cada energía, por qué cadena viaja, cuánta se junta en un día y en qué momento hace falta. Ese es el trabajo que hace cualquiera que decide si a un techo le convienen paneles o si a un pozo le alcanza con el Sol.',
      en:'With what you have measured you can now read your whole community: where each energy comes from, along which chain it travels, how much is gathered in a day and at what moment it is needed. That is the work of anyone deciding whether a roof is worth panels or whether the Sun is enough for a well.'
    }) + '</p>'
  );
  w5(rng, widgetHost(s6, 'wE', 'reflect'));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbztwM8nSIbA895DNHtDQGU9fYXDiK9QpxSCUjnBwP1XkAZtJ2B2eIUOgGHmZz8wVQSx/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
