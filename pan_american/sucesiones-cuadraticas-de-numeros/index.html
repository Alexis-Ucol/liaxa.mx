<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sucesiones Cuadráticas de Números — Matemáticas 2°</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --green:      #1a3a6b;
  --green-dark: #0f2244;
  --green-bg:   #e8edf5;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.65}

/* WELCOME */
#welcomeScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.wcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:2.4rem 2rem;width:100%;max-width:460px;text-align:center;border-top:4px solid var(--gold)}
.wlogos{display:flex;justify-content:center;align-items:center;gap:1.4rem;margin-bottom:1.6rem;padding-bottom:1.6rem;border-bottom:1px solid var(--border)}
.wlogos img{height:50px;width:auto;object-fit:contain}
.wtitle{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.25rem}
.wcourse{font-size:.78rem;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1.6rem}
.flabel{display:block;font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;text-align:left}
.finput{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:.95rem;font-family:inherit;margin-bottom:.9rem;transition:border-color .18s}
.finput:focus{outline:none;border-color:var(--green)}
.sbtn{width:100%;padding:.85rem;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .18s}
.sbtn:hover{background:var(--green-dark)}
.serr{min-height:1.2rem;font-size:.82rem;color:var(--bad);margin-top:.4rem}
.wfoot{margin-top:1rem;font-size:.75rem;color:var(--text3)}

/* RESTORE BAR */
#restoreBar{display:none;background:var(--gold-bg);border:1.5px solid var(--gold);border-radius:10px;padding:.85rem 1.1rem;margin-top:.9rem;font-size:.88rem;color:var(--text)}
#restoreBar strong{color:var(--gold)}
.rbar-btns{display:flex;gap:.6rem;margin-top:.6rem}
.rbtn{padding:.45rem 1rem;border-radius:8px;border:none;font-size:.82rem;font-weight:600;cursor:pointer}
.rbtn-yes{background:var(--green);color:#fff}
.rbtn-yes:hover{background:var(--green-dark)}
.rbtn-no{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

/* LESSON */
#lessonScreen{display:none}
.stickybar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:.55rem 1.2rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hlogos{display:flex;gap:.5rem;align-items:center}
.hlogos img{height:26px;width:auto}
.hsep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.htitle{font-family:'Crimson Pro',serif;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.halexis{flex:1;display:flex;justify-content:center;align-items:center}
.hchip{font-size:.7rem;background:var(--green-bg);color:var(--green-dark);padding:.2rem .65rem;border-radius:20px;white-space:nowrap;flex-shrink:0}
.tbtn{background:none;border:1px solid var(--border);border-radius:7px;padding:.28rem .55rem;cursor:pointer;font-size:.82rem;color:var(--text2);flex-shrink:0}
.progbar{height:3px;background:var(--border);position:sticky;top:47px;z-index:99}
.progfill{height:100%;background:var(--green);width:0%;transition:width .4s}

/* LANG TOGGLE */
.lang-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang-btn{padding:.28rem .7rem;font-size:.72rem;font-weight:600;letter-spacing:.06em;cursor:pointer;border:none;background:none;color:var(--text3);font-family:inherit;transition:all .15s}
.lang-btn.active{background:var(--green);color:#fff}
[data-theme="dark"] .lang-btn.active{background:var(--green-dark)}
/* MINI GAMES */
.game-box{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:1.1rem 1rem;margin:1.1rem 0}
.game-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem}
.game-round{font-size:.78rem;font-weight:600;color:var(--text2)}
.game-dots{display:flex;gap:6px;align-items:center}
.gdot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.gdot.cur{background:var(--green)}
.gdot.done{background:var(--ok)}
.game-seq{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;margin:.7rem 0}
.game-choice{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:.6rem}
.gbtn{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:.55rem 1rem;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--text);font-family:inherit;transition:all .15s}
.gbtn:hover{border-color:var(--green);color:var(--green-dark)}
.game-fb{text-align:center;min-height:1.4rem;margin-top:.6rem;font-size:.85rem;font-weight:600}
.gnext{background:var(--green);color:#fff;border:none;border-radius:6px;padding:.3rem .9rem;font-size:.82rem;cursor:pointer;margin-left:.5rem;font-family:inherit}
/* DIFFERENCE MACHINE */
.dm-label{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:center;margin:.55rem 0 .2rem}
.dm-row{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap}
.dm-cell{font-family:'IBM Plex Mono',monospace;font-weight:700;border-radius:8px;padding:.4rem .7rem;min-width:2.6rem;text-align:center;font-size:.95rem}
.dm-term{background:var(--green-bg);color:var(--green-dark)}
.dm-hidden{background:var(--surface2);border:1.5px dashed var(--border);color:var(--text3);cursor:pointer;transition:all .15s;user-select:none}
.dm-hidden:hover{border-color:var(--gold);color:var(--gold)}
.dm-d1{background:var(--gold-bg);color:var(--gold);filter:brightness(.85)}
[data-theme="dark"] .dm-d1{filter:none}
.dm-d2{background:var(--green);color:#fff}

/* CONTENT */
.lbody{max-width:760px;margin:0 auto;padding:2rem 1.2rem 4rem}
.section{opacity:0;transform:translateY(16px);transition:opacity .48s,transform .48s;margin-bottom:2.8rem}
.section.vis{opacity:1;transform:none}
.stag{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.45rem}
.section h2{font-family:'Crimson Pro',serif;font-size:1.65rem;font-weight:700;margin-bottom:.7rem}
.section p{color:var(--text2);margin-bottom:.8rem}
.callout{background:var(--green-bg);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1rem 0}
.callout strong{color:var(--green-dark)}
.callout p{margin-bottom:0}

/* RULE CARDS */
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.75rem;margin:1.1rem 0}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem;border-top:3px solid var(--green)}
.rname{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.35rem}
.rform{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--green-dark);font-weight:500;margin-bottom:.3rem}
.rnote{font-size:.76rem;color:var(--text3)}

/* SEQ DISPLAY */
.seq-display{display:flex;gap:.6rem;align-items:flex-end;justify-content:center;margin:1.2rem 0;flex-wrap:wrap}
.seq-step{text-align:center}
.seq-label{font-size:.7rem;color:var(--text3);margin-bottom:.3rem;font-family:'IBM Plex Mono',monospace}
.seq-num{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--green-dark);background:var(--green-bg);border-radius:8px;padding:.4rem .8rem;display:inline-block}
.seq-arrow{color:var(--text3);align-self:center;font-size:1.2rem}

/* DIFF TABLE */
.diff-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:1rem 0}
.diff-table th{background:var(--green);color:#fff;padding:.45rem .7rem;text-align:center;font-weight:600;font-size:.75rem}
.diff-table td{padding:.4rem .7rem;text-align:center;border:1px solid var(--border);font-family:'IBM Plex Mono',monospace}
.diff-table tr:nth-child(even) td{background:var(--surface2)}
.diff-row td{color:var(--gold);font-weight:600}
.diff2-row td{color:var(--green-dark);font-weight:700}

/* INTERACTIVE */
.widget-box{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:1.3rem;margin:1rem 0}
.widget-title{font-size:.8rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.9rem}
.input-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}
.input-row input[type=number]{width:90px;padding:.45rem .6rem;border:1.5px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.9rem;font-weight:600;text-align:center}
.input-row input[type=number]:focus{outline:none;border-color:var(--green)}
.check-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:.45rem 1rem;font-size:.82rem;font-weight:600;cursor:pointer}
.check-btn:hover{background:var(--green-dark)}
.widget-fb{font-size:.82rem;min-height:1.4rem;padding:.3rem .5rem;border-radius:6px}
.widget-fb.ok{color:var(--ok);background:var(--ok-bg)}
.widget-fb.bad{color:var(--bad);background:var(--bad-bg)}

/* FORMULA BUILDER */
.formula-display{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--green-dark);background:var(--green-bg);border-radius:8px;padding:.65rem 1rem;margin:.8rem 0;text-align:center}
.coeff-inputs{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin:.7rem 0}
.coeff-group{text-align:center}
.coeff-group label{display:block;font-size:.7rem;color:var(--text3);margin-bottom:.3rem}
.coeff-group input{width:60px;padding:.4rem;border:1.5px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.9rem;font-weight:700;text-align:center}
.coeff-group input:focus{outline:none;border-color:var(--green)}

/* PROBLEM CARDS */
.pcrd{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;margin-bottom:1.3rem;overflow:hidden;transition:border-color .25s}
.pcrd.ok{border-color:var(--ok)}
.pcrd.bad{border-color:var(--bad)}
.phdr{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border)}
.pnum{background:var(--green);color:#fff;width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;flex-shrink:0}
.ptitle{font-weight:600;font-size:.88rem}
.pbody{padding:1rem}
.pstmt{background:var(--surface2);border-radius:8px;padding:.85rem .95rem;margin-bottom:.9rem;font-size:.88rem}
.pfn{display:block;font-family:'IBM Plex Mono',monospace;font-size:.76rem;color:var(--green-dark);margin-top:.45rem;font-weight:500}

/* WORK AREA */
.wtabs{display:flex;gap:.35rem;margin-bottom:.5rem;flex-wrap:wrap}
.wtab{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.26rem .68rem;font-size:.78rem;cursor:pointer;color:var(--text2);transition:all .14s}
.wtab.active,.wtab:hover{background:var(--green);color:#fff;border-color:var(--green)}
.wpanel{display:none}
.wpanel.active{display:block}
.cvwrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.dcanvas{display:block;touch-action:none;cursor:crosshair;width:100%;height:190px}
.ctoolbar{display:flex;align-items:center;gap:.35rem;padding:.35rem .55rem;background:var(--surface2);border-top:1px solid var(--border);flex-wrap:wrap}
.tbtn2{background:none;border:1px solid var(--border);border-radius:5px;padding:.22rem .45rem;font-size:.72rem;cursor:pointer;color:var(--text2)}
.tbtn2.on{background:var(--green);color:#fff;border-color:var(--green)}
.cdot{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.cdot.sel{border-color:var(--gold)}
.clrbtn{background:none;border:1px solid var(--border);border-radius:5px;padding:.22rem .45rem;font-size:.72rem;cursor:pointer;color:var(--bad);margin-left:auto}
.wtextarea{width:100%;min-height:120px;padding:.65rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:.8rem;resize:vertical}
.wtextarea:focus{outline:none;border-color:var(--green)}
.pzone{border:2px dashed var(--border);border-radius:8px;padding:1.4rem;text-align:center;cursor:pointer;position:relative;transition:border-color .18s}
.pzone:hover{border-color:var(--green)}
.pzone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pzicon{font-size:1.7rem;margin-bottom:.35rem}
.pztxt{font-size:.8rem;color:var(--text3)}
.ppreview{display:none;width:100%;border-radius:8px;margin-top:.5rem;max-height:280px;object-fit:contain}

/* HINT */
.hintbtn{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:.28rem .65rem;font-size:.78rem;cursor:pointer;margin-bottom:.45rem}
.hintbox{display:none;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:.65rem .85rem;font-size:.83rem;color:var(--text2)}
.hintbox.show{display:block}

/* MC */
.mcopt.pending{border-color:var(--gold);background:var(--gold-bg)}
.mcopts{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.6rem}
.mcopt{display:flex;align-items:center;gap:.65rem;padding:.65rem .85rem;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:.86rem;transition:all .13s;user-select:none}
.mcopt:hover:not(.dis){border-color:var(--green);background:var(--green-bg)}
.mcopt.dis{cursor:default;pointer-events:none}
.mcopt.sc{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.mcopt.sw{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.mcopt.rc{border-color:var(--ok);background:var(--ok-bg)}
.mcfb{display:none;padding:.65rem .85rem;border-radius:8px;font-size:.83rem;margin-top:.25rem}
.mcfb.show{display:block}
.mcfb.fbok{background:var(--ok-bg);color:var(--ok)}
.mcfb.fbbad{background:var(--bad-bg);color:var(--bad)}

/* MATH FRACTIONS */
.mf-outer{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.1}
.mf-num{border-bottom:1.5px solid var(--text);padding:0 .2em .1em;font-size:.92em;text-align:center}
.mf-den{padding:.1em .2em 0;font-size:.92em;text-align:center}

/* RESULT */
.rpanel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.8rem;text-align:center}
.dlbtn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:.8rem 1.8rem;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .18s}
.dlbtn:hover{background:var(--green-dark)}
.dlbtn:disabled{opacity:.6;cursor:wait}

/* STEP CARDS */
.step-block{background:var(--surface2);border-radius:10px;padding:.9rem 1.1rem;margin:.7rem 0;font-size:.87rem}
.step-num{display:inline-block;background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:.72rem;font-weight:700;margin-right:.55rem;flex-shrink:0}
.step-mono{font-family:'IBM Plex Mono',monospace;color:var(--green-dark);font-weight:500}

/* MOBILE */
@media(max-width:600px){
  .wcard{padding:1.6rem 1.1rem;border-radius:12px}
  .wlogos img{height:38px}
  .wtitle{font-size:1.35rem}
  .htitle{display:none}
  .hlogos img{height:20px}
  .hchip{font-size:.63rem;padding:.15rem .45rem;max-width:110px;overflow:hidden;text-overflow:ellipsis}
  .lbody{padding:1.2rem .7rem 3rem}
  .section h2{font-size:1.3rem}
  .pbody{padding:.75rem}
  .pstmt{font-size:.84rem}
  .mcopt{font-size:.83rem;padding:.58rem .7rem}
  .dcanvas{height:220px}
  .ctoolbar{gap:.25rem}
  .callout{padding:.8rem .9rem}
  .coeff-inputs{gap:.5rem}
}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="logo-left" src="" alt="Institución" style="display:none">
    </div>
    <div class="wtitle" id="wcard-title">Sucesiones Cuadráticas de Números</div>
    <div class="wcourse" id="wcard-course">Matemáticas · 2° Secundaria</div>
    <label class="flabel" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 2A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong>📂 Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>.lbt{font-family:'Crimson Pro',serif;font-weight:700;letter-spacing:.1em;fill:var(--green);font-size:28px}.lbl{stroke:var(--gold);stroke-width:2.5}.lba{fill:var(--gold)}</style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left" src="" alt="Institución" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="sticky-title">Sucesiones Cuadráticas de Números</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>.lht{font-family:'Crimson Pro',serif;font-weight:700;letter-spacing:.08em;fill:var(--green);font-size:16px}.lhl{stroke:var(--gold);stroke-width:2}.lha{fill:var(--gold)}</style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>

function setLang(l){
  LANG=l;
  try{localStorage.setItem(LANG_KEY,l);}catch(e){}
  document.getElementById('btn-es').classList.toggle('active',l==='es');
  document.getElementById('btn-en').classList.toggle('active',l==='en');
  document.documentElement.setAttribute('lang',l);
  applyUIStrings();
  document.getElementById('sticky-title').textContent=SCHOOL.guideTitle[l];
  document.getElementById('wcard-title').textContent=SCHOOL.guideTitle[l];
  document.getElementById('wcard-course').textContent=SCHOOL.courseName[l];
  var dlBtn=document.getElementById('dlBtn');if(dlBtn)dlBtn.innerHTML=t('btn-pdf');
  /* If the lesson is showing, rebuild it with the same seed so all content switches language.
     Preserve answers and student work (drawings, typed text, photos). */
  var lessonVisible=document.getElementById('lessonScreen').style.display==='block';
  if(lessonVisible&&studentData.name){
    saveSession();
    var saved=loadSession(studentData.name,studentData.group);
    var att=currentAttempt(studentData.name,studentData.group);
    answeredCount=0;correctCount=0;
    buildLesson(seededRng(studentData.name+studentData.group+att));
    var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('vis');});},{threshold:0.05});
    document.querySelectorAll('.section').forEach(function(s){obs.observe(s);});
    if(saved){
      if(saved.choices)saved.choices.forEach(function(choice,idx){if(choice!==null&&choice!==undefined)confirmMC(idx,choice);});
      if(answeredCount===problems.length)showResults();
      setTimeout(function(){
        if(saved.drawings){saved.drawings.forEach(function(dataUrl,i){if(!dataUrl)return;var dc=document.getElementById('dc'+i);if(!dc||!dc.width)return;var img=new Image();img.onload=function(){var dpr=window.devicePixelRatio||1;dc.getContext('2d').drawImage(img,0,0,dc.width/dpr,dc.height/dpr);};img.src=dataUrl;});}
        if(saved.texts){saved.texts.forEach(function(text,i){if(!text)return;var ta=document.getElementById('ta'+i);if(ta)ta.value=text;});}
        if(saved.photos){saved.photos.forEach(function(dataUrl,i){if(!dataUrl)return;var pp=document.getElementById('pp'+i);if(!pp)return;pp.src=dataUrl;pp.style.display='block';var pz=document.getElementById('pz'+i);if(pz)pz.style.opacity='0.4';});}
      },300);
    }
  }
}
function applyUIStrings(){
  var nm=document.getElementById('lbl-name-el');if(nm)nm.textContent=t('lbl-name');
  var gr=document.getElementById('lbl-group-el');if(gr)gr.textContent=t('lbl-group');
  var sb=document.getElementById('startBtn');if(sb)sb.textContent=t('btn-start');
  var pb=document.getElementById('dlBtn');if(pb)pb.innerHTML=t('btn-pdf');
  var rm=document.getElementById('restoreMsg');if(rm)rm.textContent=t('restore-msg');
  var rb=document.getElementById('restoreBtn');if(rb)rb.textContent=t('btn-restore');
  var db=document.getElementById('dismissBtn');if(db)db.textContent=t('btn-dismiss');
}

  var k=getAttemptKey(name,group);var n=0;
  try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){}
  n++;try{localStorage.setItem(k,String(n));}catch(e){}return n;
}
function currentAttempt(name,group){
  var k=getAttemptKey(name,group);
  try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;}
}

/* ── RNG ────────────────────────────────────────────────────────── */
function seededRng(seed){
  var s=0;for(var i=0;i<seed.length;i++)s=(Math.imul(31,s)+seed.charCodeAt(i))|0;
  return function(){
    s=(s+0x9e3779b9)|0;var t2=s^(s>>>16);t2=Math.imul(t2,0x21f0aaad);t2^=(t2>>>15);
    t2=Math.imul(t2,0x735a2d97);return((t2^(t2>>>15))>>>0)/4294967296;
  };
}
function shuffle(arr,rng){
  var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;
}
function shuffleOpts(opts,correct,rng){
  var arr=opts.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;}
  return{opts:arr,correctIdx:arr.indexOf(correct)};
}

function saveSession(){
  if(!studentData.name)return;
  var drawings=[],texts=[],photos=[];
  problems.forEach(function(p,i){
    var dc=document.getElementById('dc'+i);
    if(dc&&dc.width){var blank=document.createElement('canvas');blank.width=dc.width;blank.height=dc.height;drawings.push(dc.toDataURL()===blank.toDataURL()?null:dc.toDataURL('image/png'));}

    var pp=document.getElementById('pp'+i);photos.push((pp&&pp.src&&pp.src.indexOf('data:')===0)?pp.src:null);
  });
  var state={name:studentData.name,group:studentData.group,answeredCount:answeredCount,correctCount:correctCount,choices:problems.map(function(p){return p.studentChoice;}),drawings:drawings,texts:texts,photos:photos};

}
function loadSession(name,group){
  var key='mat2_t02_g02__'+(name+'__'+group).replace(/\s+/g,'_');

}

function restoreSession(){
  var name=document.getElementById('sName').value.trim();var group=document.getElementById('sGroup').value.trim();
  var saved=loadSession(name,group);if(!saved)return;
  document.getElementById('restoreBar').style.display='none';
  studentData={name:name,group:group};answeredCount=0;correctCount=0;problems=[];
  var att=currentAttempt(name,group);var rng=seededRng(name+group+att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display='none';
  document.getElementById('lessonScreen').style.display='block';
  document.getElementById('studentChip').textContent=name+' · '+group;
  var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('vis');});},{threshold:0.05});
  document.querySelectorAll('.section').forEach(function(s){obs.observe(s);});
  saved.choices.forEach(function(choice,idx){if(choice!==null&&choice!==undefined)confirmMC(idx,choice);});
  setTimeout(function(){
    if(saved.drawings){saved.drawings.forEach(function(dataUrl,i){if(!dataUrl)return;var dc=document.getElementById('dc'+i);if(!dc||!dc.width)return;var img=new Image();img.onload=function(){var dpr=window.devicePixelRatio||1;dc.getContext('2d').drawImage(img,0,0,dc.width/dpr,dc.height/dpr);};img.src=dataUrl;});}
    if(saved.texts){saved.texts.forEach(function(text,i){if(!text)return;var ta=document.getElementById('ta'+i);if(ta)ta.value=text;});}

  },300);
}

/* ── CANVAS ─────────────────────────────────────────────────────── */
function initCanvas(canvas){
  var dpr=window.devicePixelRatio||1;var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.scale(dpr,dpr);ctx.strokeStyle='#2d5a27';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';
  var drawing=false,lx=0,ly=0;
  var tb=canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e){var r=canvas.getBoundingClientRect();var src=e.touches?e.touches[0]:e;return[src.clientX-r.left,src.clientY-r.top];}
  function onDown(e){e.preventDefault();drawing=true;var p=getPos(e);lx=p[0];ly=p[1];}
  function onMove(e){e.preventDefault();if(!drawing)return;var p=getPos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p[0],p[1]);ctx.stroke();lx=p[0];ly=p[1];}
  function onUp(){drawing=false;saveSession();}
  canvas.addEventListener('mousedown',onDown,{passive:false});canvas.addEventListener('mousemove',onMove,{passive:false});
  canvas.addEventListener('mouseup',onUp);canvas.addEventListener('mouseleave',onUp);
  canvas.addEventListener('touchstart',onDown,{passive:false});canvas.addEventListener('touchmove',onMove,{passive:false});canvas.addEventListener('touchend',onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn){
    btn.addEventListener('click',function(){
      tb.querySelectorAll('.tbtn2').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      if(btn.classList.contains('bpen')){ctx.lineWidth=2;}
      if(btn.classList.contains('bmarker')){ctx.lineWidth=10;ctx.globalAlpha=0.45;}
      if(btn.classList.contains('beraser')){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=20;}
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot){
    dot.addEventListener('click',function(){
      tb.querySelectorAll('.cdot').forEach(function(d){d.classList.remove('sel');});dot.classList.add('sel');
      ctx.strokeStyle=dot.dataset.color;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b){b.classList.remove('on');});tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click',function(){ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);});
}
function switchTab(idx,panel,btn){
  var prefix='wp_'+idx+'_';document.querySelectorAll('[id^="'+prefix+'"]').forEach(function(p){p.classList.remove('active');});
  document.getElementById(prefix+panel).classList.add('active');

/* ── MC (two-tap) ───────────────────────────────────────────────── */
function handleMC(probIdx,chosenIdx){
  var prob=problems[probIdx];if(prob.studentChoice!==null)return;
  var opts=document.querySelectorAll('#pc'+probIdx+' .mcopt');
  if(prob.pendingChoice===chosenIdx){
    prob.studentChoice=chosenIdx;prob.pendingChoice=null;
    var isOk=(chosenIdx===prob.correctIdx);
    opts.forEach(function(o){o.classList.add('dis');o.classList.remove('pending');});
    opts.forEach(function(o,i){if(i===prob.correctIdx)o.classList.add('rc');if(i===chosenIdx&&isOk)o.classList.add('sc');if(i===chosenIdx&&!isOk)o.classList.add('sw');});
    var fb=document.getElementById('fb'+probIdx);
    fb.innerHTML=(isOk?'<strong>✓ '+(LANG==='es'?'¡Correcto!':'Correct!')+'</strong> ':'<strong>✗ '+(LANG==='es'?'Incorrecto.':'Incorrect.')+'</strong> ')+prob.explanation;
    fb.className='mcfb show '+(isOk?'fbok':'fbbad');
    document.getElementById('pc'+probIdx).classList.add(isOk?'ok':'bad');
    if(isOk)correctCount++;answeredCount++;
    document.getElementById('progFill').style.width=(answeredCount/problems.length*100)+'%';
    saveSession();if(answeredCount===problems.length)setTimeout(showResults,700);return;
  }
  prob.pendingChoice=chosenIdx;opts.forEach(function(o){o.classList.remove('pending');});opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx,chosenIdx){
  var prob=problems[probIdx];if(prob.studentChoice!==null)return;
  var opts=document.querySelectorAll('#pc'+probIdx+' .mcopt');
  prob.studentChoice=chosenIdx;prob.pendingChoice=null;
  var isOk=(chosenIdx===prob.correctIdx);
  opts.forEach(function(o){o.classList.add('dis');o.classList.remove('pending');});
  opts.forEach(function(o,i){if(i===prob.correctIdx)o.classList.add('rc');if(i===chosenIdx&&isOk)o.classList.add('sc');if(i===chosenIdx&&!isOk)o.classList.add('sw');});
  var fb=document.getElementById('fb'+probIdx);
  fb.innerHTML=(isOk?'<strong>✓ '+(LANG==='es'?'¡Correcto!':'Correct!')+'</strong> ':'<strong>✗ '+(LANG==='es'?'Incorrecto.':'Incorrect.')+'</strong> ')+prob.explanation;
  fb.className='mcfb show '+(isOk?'fbok':'fbbad');
  document.getElementById('pc'+probIdx).classList.add(isOk?'ok':'bad');
  if(isOk)correctCount++;answeredCount++;
  document.getElementById('progFill').style.width=(answeredCount/problems.length*100)+'%';
}

/* ══════════════════════════════════════════════════════════════
   BUILD LESSON — Sucesiones Cuadráticas de Números
   ══════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  problems=[];
  var body=document.getElementById('lessonBody');
  body.innerHTML='';

  /* === SECTION 1: Reconocer una sucesión cuadrática de números === */
  var s1=document.createElement('div');
  s1.className='section';
  // Pick random starting example
  var ex_a=1+Math.floor(rng()*2);
  var ex_b=2+Math.floor(rng()*3);
  var ex_terms=[];for(var ii=1;ii<=5;ii++)ex_terms.push(ex_a*ii*ii+ex_b*ii);
  var ex_d1=[ex_terms[1]-ex_terms[0],ex_terms[2]-ex_terms[1],ex_terms[3]-ex_terms[2],ex_terms[4]-ex_terms[3]];
  var ex_d2=ex_d1[1]-ex_d1[0];
  s1.innerHTML=
    '<div class="stag">'+(LANG==='es'?'Concepto 1':'Concept 1')+'</div>'+
    '<h2>'+(LANG==='es'?'Reconocer una sucesión cuadrática numérica':'Recognizing a Quadratic Number Sequence')+'</h2>'+
    '<p>'+(LANG==='es'?
      'En esta guía te convertirás en <strong>detective de patrones</strong>: cada sucesión de números esconde una pista secreta en sus diferencias, y tú aprenderás a descubrirla.':
      'In this guide you will become a <strong>pattern detective</strong>: every number sequence hides a secret clue in its differences, and you will learn how to uncover it.'
    )+'</p>'+
    '<p>'+(LANG==='es'?
      'Una sucesión cuadrática de números es aquella cuya regla algebraica contiene un término n², a diferencia de las sucesiones aritméticas que solo tienen n.':
      'A quadratic number sequence is one whose algebraic rule contains an n² term, unlike arithmetic sequences which only have n.'
    )+'</p>'+
    '<p>'+(LANG==='es'?'Ejemplo: observa esta sucesión y sus diferencias:':'Example: observe this sequence and its differences:')+'</p>'+
    '<div class="seq-display">'+
      ex_terms.slice(0,5).map(function(v,i){return '<div class="seq-step"><div class="seq-label">n='+(i+1)+'</div><div class="seq-num">'+v+'</div></div>'+(i<4?'<div class="seq-arrow">→</div>':'');}).join('')+
    '</div>'+
    '<div class="step-block">'+
      '<span class="step-num">1</span> <strong>'+(LANG==='es'?'Primeras diferencias:':'First differences:')+'</strong>'+
      ' <span class="step-mono">'+ex_d1[0]+', '+ex_d1[1]+', '+ex_d1[2]+', '+ex_d1[3]+'</span> '+
      (LANG==='es'?'no son iguales (no es aritmética).':'not equal (not arithmetic).')+
    '</div>'+
    '<div class="step-block">'+
      '<span class="step-num">2</span> <strong>'+(LANG==='es'?'Segundas diferencias:':'Second differences:')+'</strong>'+
      ' <span class="step-mono">'+(ex_d1[1]-ex_d1[0])+', '+(ex_d1[2]-ex_d1[1])+', '+(ex_d1[3]-ex_d1[2])+'</span> '+
      (LANG==='es'?'todas iguales a <strong>'+ex_d2+'</strong>. ¡Es cuadrática!':'all equal to <strong>'+ex_d2+'</strong>. It is quadratic!')+
    '</div>'+
    '<div class="callout"><p>'+(LANG==='es'?
      '<strong>Detector:</strong> 2ª diferencia constante ≠ 0 → cuadrática. El coeficiente del n² es siempre igual a la 2ª diferencia dividida entre 2 (= '+ex_d2+'/2 = '+ex_a+').':
      '<strong>Detector:</strong> Constant 2nd difference ≠ 0 → quadratic. The n² coefficient always equals the 2nd difference divided by 2 (= '+ex_d2+'/2 = '+ex_a+').'
    )+'</p></div>'+
    '<p>'+(LANG==='es'?
      '¿Por qué se llama <strong>cuadrática</strong>? ¡Por los cuadrados! Toca el botón para agregar capas y mira crecer la figura. Pon mucha atención a los números que aparecen entre los términos.':
      'Why is it called <strong>quadratic</strong>? Because of squares! Tap the button to add layers and watch the figure grow. Pay close attention to the numbers that appear between the terms.'
    )+'</p>'+
    '<div class="game-box" id="sqBuilder"></div>'+
    '<p>'+(LANG==='es'?
      'Es tu turno de usar el detector. En este juego te mostraremos tres sucesiones misteriosas: decide si cada una es aritmética o cuadrática.':
      'Now it is your turn to use the detector. In this game we will show you three mystery sequences: decide whether each one is arithmetic or quadratic.'
    )+'</p>'+
    '<div class="game-box" id="clsGame"></div>';
  body.appendChild(s1);
  /* Seeded rounds for the classify game: always a mix of both types */
  var gRounds=[];
  shuffle([true,false,true],rng).forEach(function(q){
    if(q){
      var ga=1+Math.floor(rng()*2),gb=1+Math.floor(rng()*4);
      var gt=[];for(var gi=1;gi<=4;gi++)gt.push(ga*gi*gi+gb*gi);
      gRounds.push({seq:gt,quad:true,d2:2*ga,d1txt:(gt[1]-gt[0])+', '+(gt[2]-gt[1])+', '+(gt[3]-gt[2])});
    }else{
      var gs=1+Math.floor(rng()*6),gd=2+Math.floor(rng()*5);
      var gt2=[];for(var gj=0;gj<4;gj++)gt2.push(gs+gd*gj);
      gRounds.push({seq:gt2,quad:false,d1:gd,d1txt:gd+', '+gd+', '+gd});
    }
  });
  setTimeout(function(){buildClassifyGame('clsGame',gRounds);},80);
  var sqOpts=shuffleOpts(['9','10','11','13'],'11',rng);
  setTimeout(function(){buildSquareBuilder('sqBuilder',sqOpts.opts,sqOpts.correctIdx);},80);

  /* === Difference Machine: hands-on warm-up right before Problem 1 === */
  var sDM=document.createElement('div');
  sDM.className='section';
  var dmA=1+Math.floor(rng()*2),dmB=1+Math.floor(rng()*4);
  var dmTerms=[];for(var di=1;di<=5;di++)dmTerms.push(dmA*di*di+dmB*di);
  sDM.innerHTML=
    '<p>'+(LANG==='es'?
      'Antes de resolver tu primer problema, calienta con la <strong>máquina de diferencias</strong>. Toca cada casilla con <strong>?</strong> para revelar el valor: primero las primeras diferencias y después las segundas. ¿Qué descubrirás al final?':
      'Before solving your first problem, warm up with the <strong>difference machine</strong>. Tap each <strong>?</strong> box to reveal its value: first the first differences and then the second ones. What will you discover at the end?'
    )+'</p>'+
    '<div class="game-box" id="diffMachine"></div>';
  body.appendChild(sDM);
  setTimeout(function(){buildDiffMachine('diffMachine',dmTerms,dmA);},80);

  /* --- Problem 1 --- */

    studentChoice:null,pendingChoice:null
  });
  buildOneCard(problems[7],7);

  /* --- Problem 9 --- */

  var p9a=1+Math.floor(rng()*2);var p9b=2+Math.floor(rng()*3);

    options:s10r.opts,correctIdx:s10r.correctIdx,

var _clsGame={};
function buildClassifyGame(id,rounds){

}
function renderClassifyRound(id){

    '<div class="game-fb" id="'+id+'_fb"></div>';

function checkClassify(id,saidQuad){
  var st=_clsGame[id];if(!st||st.solved[st.round])return;
  var data=st.rounds[st.round];
  var fb=document.getElementById(id+'_fb');if(!fb)return;
  if(saidQuad===data.quad){
    st.solved[st.round]=true;
    var msg=data.quad?
      (LANG==='es'?'✓ ¡Exacto! Las segundas diferencias son constantes ('+data.d2+'): es cuadrática.':'✓ Exactly! The second differences are constant ('+data.d2+'): it is quadratic.'):
      (LANG==='es'?'✓ ¡Exacto! Las primeras diferencias son constantes ('+data.d1+'): es aritmética.':'✓ Exactly! The first differences are constant ('+data.d1+'): it is arithmetic.');

      fb.innerHTML=msg+' <button class="gnext" onclick="_clsNext(\''+id+'\')">'+(LANG==='es'?'Siguiente →':'Next →')+'</button>';
    }else{

      (LANG==='es'?'✗ Revisa: las primeras diferencias ('+data.d1txt+') no son iguales. Calcula las segundas diferencias.':'✗ Check again: the first differences ('+data.d1txt+') are not equal. Compute the second differences.'):
      (LANG==='es'?'✗ Revisa: las primeras diferencias son todas iguales a '+data.d1+'. No hay término n².':'✗ Check again: the first differences are all equal to '+data.d1+'. There is no n² term.');

}
function _clsNext(id){var st=_clsGame[id];if(st&&st.round<2){st.round++;renderClassifyRound(id);}}

/* ── DIFFERENCE MACHINE (tap to reveal) ─────────────────────────── */
var _dmState={};
function buildDiffMachine(id,terms,aCoef){
  if(!document.getElementById(id))return;
  var d1=[],d2=[];
  for(var i=0;i<terms.length-1;i++)d1.push(terms[i+1]-terms[i]);
  for(var j=0;j<d1.length-1;j++)d2.push(d1[j+1]-d1[j]);
  _dmState[id]={terms:terms,d1:d1,d2:d2,a:aCoef,r1:d1.map(function(){return false;}),r2:d2.map(function(){return false;})};
  renderDiffMachine(id);
}
function renderDiffMachine(id){
  var st=_dmState[id];if(!st)return;
  var row0=st.terms.map(function(v){return '<div class="dm-cell dm-term">'+v+'</div>';}).join('');
  var row1=st.d1.map(function(v,i){
    return st.r1[i]?'<div class="dm-cell dm-d1">+'+v+'</div>':'<div class="dm-cell dm-hidden" onclick="dmReveal(\''+id+'\',1,'+i+')">?</div>';
  }).join('');
  var row2=st.d2.map(function(v,i){
    return st.r2[i]?'<div class="dm-cell dm-d2">+'+v+'</div>':'<div class="dm-cell dm-hidden" onclick="dmReveal(\''+id+'\',2,'+i+')">?</div>';
  }).join('');
  document.getElementById(id).innerHTML=
    '<div class="dm-label">'+(LANG==='es'?'Sucesión':'Sequence')+'</div><div class="dm-row">'+row0+'</div>'+
    '<div class="dm-label">'+(LANG==='es'?'1ª diferencias':'1st differences')+'</div><div class="dm-row">'+row1+'</div>'+
    '<div class="dm-label">'+(LANG==='es'?'2ª diferencias':'2nd differences')+'</div><div class="dm-row">'+row2+'</div>'+
    '<div class="game-fb" id="'+id+'_fb"></div>';
  var fb=document.getElementById(id+'_fb');
  if(st.r1.every(function(x){return x;})&&st.r2.every(function(x){return x;})){
    fb.innerHTML='🎉 '+(LANG==='es'?
      '¡Lo lograste! Todas las segundas diferencias valen <strong>'+st.d2[0]+'</strong>: la sucesión es cuadrática y el coeficiente del n² es '+st.d2[0]+'/2 = <strong>'+st.a+'</strong>.':
      'You did it! All second differences equal <strong>'+st.d2[0]+'</strong>: the sequence is quadratic and the n² coefficient is '+st.d2[0]+'/2 = <strong>'+st.a+'</strong>.');
    fb.style.color='var(--ok)';
  }
}
function dmReveal(id,row,idx){
  var st=_dmState[id];if(!st)return;
  if(row===2&&!st.r1.every(function(x){return x;})){
    var fb=document.getElementById(id+'_fb');
    if(fb){fb.textContent=LANG==='es'?'💡 Primero revela todas las primeras diferencias.':'💡 First reveal all the first differences.';fb.style.color='var(--bad)';}
    return;
  }
  if(row===1)st.r1[idx]=true;else st.r2[idx]=true;
  renderDiffMachine(id);
}

/* ── SQUARE BUILDER: la escalera de cuadrados ───────────────────── */
var _sqState={};
function buildSquareBuilder(id,qOpts,qCorrectIdx){
  if(!document.getElementById(id))return;
  _sqState[id]={n:1,max:5,qOpts:qOpts,qCorrect:qCorrectIdx,answered:false};
  renderSquareBuilder(id);
}
function renderSquareBuilder(id){
  var st=_sqState[id];if(!st)return;
  var terms=[],d1=[];
  for(var k=1;k<=st.n;k++)terms.push(k*k);
  for(k=0;k<terms.length-1;k++)d1.push(terms[k+1]-terms[k]);
  var strip=terms.map(function(v,i){return (i>0?'<div class="dm-cell dm-d1">+'+d1[i-1]+'</div>':'')+'<div class="dm-cell dm-term">'+v+'</div>';}).join('');
  var hdr=(LANG==='es'?'Figura n = ':'Figure n = ')+st.n+' · '+st.n+'×'+st.n+' = '+(st.n*st.n)+(LANG==='es'?' piezas':' tiles');
  var mid;
  if(st.n<st.max){
    mid='<div style="text-align:center;margin-top:.7rem"><button class="gbtn" onclick="sqAddLayer(\''+id+'\')">➕ '+(LANG==='es'?'Agregar capa':'Add layer')+'</button></div>';
  }else if(!st.answered){
    var opts=st.qOpts.map(function(o,oi){return '<button class="gbtn" onclick="sqAnswer(\''+id+'\','+oi+')">'+o+'</button>';}).join('');
    mid='<div style="font-size:.86rem;color:var(--text2);text-align:center;margin-top:.7rem">'+(LANG==='es'?
        '¡Figura completa! Ahora, sin construirla: ¿cuántas piezas <strong>nuevas</strong> agregará la capa n = 6?':
        'Figure complete! Now, without building it: how many <strong>new</strong> tiles will layer n = 6 add?')+'</div>'+
      '<div class="game-choice">'+opts+'</div>';
  }else{
    mid='';
  }
  document.getElementById(id).innerHTML=
    '<div class="game-hdr"><div class="game-round">🧱 '+hdr+'</div></div>'+
    '<div style="text-align:center"><canvas id="'+id+'_cvs" width="182" height="182" style="max-width:100%;border-radius:8px"></canvas></div>'+
    '<div class="dm-label">'+(LANG==='es'?'Sucesión de piezas':'Tile sequence')+'</div>'+
    '<div class="dm-row">'+strip+'</div>'+
    mid+
    '<div class="game-fb" id="'+id+'_fb"></div>';
  drawSquareFigure(id);
  var fb=document.getElementById(id+'_fb');
  if(st.answered&&fb){
    fb.innerHTML='🎉 '+(LANG==='es'?
      '¡Exacto! La capa n = 6 añade 2(6) − 1 = <strong>11</strong> piezas. Cada capa en L añade un número impar (3, 5, 7, 9, 11...): por eso las segundas diferencias siempre valen <strong>2</strong>.':
      'Exactly! Layer n = 6 adds 2(6) − 1 = <strong>11</strong> tiles. Each L-shaped layer adds an odd number (3, 5, 7, 9, 11...): that is why the second differences always equal <strong>2</strong>.');
    fb.style.color='var(--ok)';
  }
}
function drawSquareFigure(id){
  var st=_sqState[id];var cvs=document.getElementById(id+'_cvs');if(!st||!cvs)return;
  var ctx=cvs.getContext('2d');
  var cell=32,pad=11;
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cvs.width,cvs.height);
  /* dashed silhouette of the 5x5 target */
  ctx.strokeStyle='#c6ccd8';ctx.setLineDash([4,3]);ctx.lineWidth=1;
  ctx.strokeRect(pad,pad,cell*st.max,cell*st.max);
  ctx.setLineDash([]);
  /* tiles: rows/cols 0..n-1; latest L-layer (max(r,c)==n-1) in gold, rest navy */
  for(var r=0;r<st.n;r++){
    for(var c=0;c<st.n;c++){
      var isNew=(Math.max(r,c)===st.n-1)&&st.n>1;
      ctx.fillStyle=isNew?'#c9a84c':'#1a3a6b';
      ctx.fillRect(pad+c*cell+1.5,pad+r*cell+1.5,cell-3,cell-3);
    }
  }
}
function sqAddLayer(id){
  var st=_sqState[id];if(!st||st.n>=st.max)return;
  st.n++;renderSquareBuilder(id);
}
function sqAnswer(id,oi){
  var st=_sqState[id];if(!st||st.answered)return;
  if(oi===st.qCorrect){
    st.answered=true;renderSquareBuilder(id);
  }else{
    var fb=document.getElementById(id+'_fb');
    if(fb){fb.textContent=LANG==='es'?
      '✗ Cuenta las piezas nuevas de cada capa: 3, 5, 7, 9... ¿qué número sigue?':
      '✗ Count the new tiles of each layer: 3, 5, 7, 9... which number comes next?';
      fb.style.color='var(--bad)';}
  }
}

    '</div>'+
    '<div class="formula-display" id="fDisplay">a<sub>1</sub>=3, a<sub>2</sub>=8, a<sub>3</sub>=15, a<sub>4</sub>=24, a<sub>5</sub>=35</div>'+
    '<div style="font-size:.78rem;color:var(--text3);margin-top:.4rem" id="fDiffInfo">'+(LANG==='es'?'2ª diferencia = 2 = 2×1 (doble del coeficiente a)':'2nd difference = 2 = 2×1 (double the coefficient a)')+'</div>'+
  '</div>';
}
function updateFormulaDisplay(){
  var aEl=document.getElementById('wa');var bEl=document.getElementById('wb');var cEl=document.getElementById('wc');
  if(!aEl)return;
  var a=parseInt(aEl.value)||1;var b=parseInt(bEl.value)||0;var c=parseInt(cEl.value)||0;
  var terms=[];for(var ii=1;ii<=5;ii++)terms.push(a*ii*ii+b*ii+c);
  var d2=2*a;
  var disp=document.getElementById('fDisplay');
  if(disp)disp.innerHTML=terms.map(function(v,i){return 'a<sub>'+(i+1)+'</sub>='+v;}).join(', ');
  var info=document.getElementById('fDiffInfo');
  if(info)info.textContent=(LANG==='es'?'2ª diferencia = '+d2+' = 2×'+a+' (doble del coeficiente a)':'2nd difference = '+d2+' = 2×'+a+' (double the coefficient a)');
}

/* ── nth TERM WIDGET ─────────────────────────────────────────────── */
function buildNthTermWidget(){
  return '<div class="widget-box">'+
    '<div class="widget-title">'+(LANG==='es'?'⚡ Calculadora de término n':'⚡ Term n Calculator')+'</div>'+
    '<p style="font-size:.83rem;color:var(--text2);margin-bottom:.7rem">'+(LANG==='es'?'Fórmula fija: a<sub>n</sub> = 2n² + 3n. Escribe cualquier n y obtén el término instantáneamente:':'Fixed formula: a<sub>n</sub> = 2n² + 3n. Type any n and get the term instantly:')+'</p>'+
    '<div class="input-row">'+
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:.9rem;color:var(--text2)">n =</span>'+
      '<input type="number" id="nInput" value="5" min="1" max="100" oninput="updateNthResult()" style="width:80px">'+
      '<span id="nResult" style="font-family:\'IBM Plex Mono\',monospace;font-size:1rem;font-weight:700;color:var(--green-dark)"></span>'+
    '</div>'+
    '<div id="nSteps" style="font-size:.8rem;color:var(--text3);margin-top:.3rem;font-family:\'IBM Plex Mono\',monospace"></div>'+
  '</div>';
}
function updateNthResult(){
  var nEl=document.getElementById('nInput');if(!nEl)return;
  var n=parseInt(nEl.value)||1;if(n<1)n=1;
  var val=2*n*n+3*n;
  var res=document.getElementById('nResult');
  if(res)res.textContent='→  a_'+n+' = '+val;
  var steps=document.getElementById('nSteps');
  if(steps)steps.textContent='2('+n+')² + 3('+n+') = 2('+(n*n)+') + '+(3*n)+' = '+(2*n*n)+' + '+(3*n)+' = '+val;
}

/* ── PDF ─────────────────────────────────────────────────────────── */
function generatePDF(){
  var btn=document.getElementById('dlBtn');btn.disabled=true;
  btn.innerHTML=LANG==='es'?'⏳ Generando PDF...':'⏳ Generating PDF...';
  try{
    var name=studentData.name||'—';var group=studentData.group||'—';
    var code=name.substring(0,2).toUpperCase()+(group||'').replace(/\s/g,'').toUpperCase()+problems.length+correctCount;

    doc.setDrawColor(pAR,pAG,pAB);doc.setLineWidth(0.6);doc.line(lx+18,ly-2,lx+18,ly+12);
    doc.setTextColor(pBR,pBG,pBB);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text('LIAXA',lx+21,ly+8);
    doc.setTextColor(pAR,pAG,pAB);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.text(courseName,M,39);
    doc.setTextColor(232,238,247);doc.setFontSize(15);doc.setFont('helvetica','bold');doc.text(guideTitle,M,51);
    doc.setFillColor(245,247,250);doc.roundedRect(M,72,TW,20,3,3,'F');
    doc.setTextColor(pBR,pBG,pBB);doc.setFontSize(7);doc.setFont('helvetica','bold');
    doc.text('ALUMNO',M+4,80);doc.text('GRUPO',M+TW/2+4,80);
    doc.setTextColor(20,24,32);doc.setFontSize(9.5);doc.setFont('helvetica','normal');
    doc.text(name,M+4,87);doc.text(group,M+TW/2+4,87);
    var pct=total>0?Math.round(correctCount/total*100):0;
    doc.setFillColor(pBR,pBG,pBB);doc.roundedRect(M,100,TW,34,3,3,'F');
    doc.setTextColor(pAR,pAG,pAB);doc.setFontSize(7.5);doc.setFont('helvetica','bold');
    doc.text(LANG==='es'?'CALIFICACIÓN':'SCORE',M+6,110);
    doc.setTextColor(255,255,255);doc.setFontSize(28);doc.text(correctCount+'/'+total,M+6,130);
    doc.setFontSize(10);doc.text(pct+'%',M+55,130);
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text(LANG==='es'?'respuestas correctas':'correct answers',M+6,138);
    var sy=150;
    doc.setFillColor(pBR,pBG,pBB);doc.rect(M,sy,TW,8,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(7);doc.setFont('helvetica','bold');
    doc.text(LANG==='es'?'RESUMEN DE RESPUESTAS':'ANSWER SUMMARY',M+4,sy+5.5);sy+=10;
    problems.forEach(function(prob,i){

      var ok=prob.studentChoice===prob.correctIdx;
      doc.setFillColor(ok?232:255,ok?240:232,ok?232:228);doc.roundedRect(M,sy,TW,10,2,2,'F');
      doc.setFillColor(ok?26:176,ok?106:48,ok?74:16);doc.circle(M+6,sy+5,2.5,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(7);doc.setFont('helvetica','bold');doc.text(ok?'✓':'✗',M+4.5,sy+6.5);
      doc.setTextColor(20,24,32);doc.setFontSize(8);doc.setFont('helvetica','normal');

      doc.text(ok?(LANG==='es'?'Correcto':'Correct'):(LANG==='es'?'Incorrecto':'Incorrect'),PW-M-24,sy+6.5);

    });

      doc.text(courseName+'  ·  '+guideTitle,M,10);
      doc.setTextColor(232,238,247);doc.setFontSize(10.5);doc.setFont('helvetica','bold');
      doc.text((LANG==='es'?'Problema ':'Problem ')+(i+1)+' de '+total+'  —  '+pdfText(prob.title),M,17);

      doc.setFontSize(8.5);doc.setFont('helvetica','normal');

      doc.setFillColor(237,240,245);doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
      doc.setTextColor(pBR,pBG,pBB);doc.setFontSize(6.5);doc.setFont('helvetica','bold');
      doc.text(LANG==='es'?'PREGUNTA':'QUESTION',M+4,wy+6);

      var qy=wy+12;qLines.forEach(function(ln,li){doc.text(ln,M+4,qy+li*5);});wy+=qBoxH+4;
      var isOk=document.getElementById('pc'+i).classList.contains('ok');
      var chosen=prob.studentChoice!=null?pdfText(prob.options[prob.studentChoice]||'—'):'—';
      var corr=pdfText(prob.options[prob.correctIdx]||'');var expRaw=pdfText(prob.explanation||'');
      doc.setFontSize(8.5);var chLines=doc.splitTextToSize((LANG==='es'?'Alumno: ':'Student: ')+chosen,TW-18);
      doc.setFontSize(8);var coLines=doc.splitTextToSize((LANG==='es'?'Correcto: ':'Correct: ')+corr,TW-18);

      doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text(isOk?'✓':'✗',M+5.2,wy+10.5);
      var ay=wy+7;

      doc.setTextColor(26,106,74);doc.setFontSize(8);doc.setFont('helvetica','normal');coLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5);});

      doc.setTextColor(90,85,80);doc.setFontSize(7.5);exLines.forEach(function(ln,li){doc.text(ln,M+14,ay+li*5);});

      var dc=document.getElementById('dc'+i);
      if(dc){try{var imgD=dc.toDataURL('image/png');var ar=dc.height/dc.width;var iw=TW;var ih=Math.min(iw*ar,68);doc.addImage(imgD,'PNG',M,wy,iw,ih);wy+=ih+4;}catch(e){}}

    }
    var _fn = 'mat2_t02_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';

  }catch(e){alert('Error al generar el PDF: '+e.message);}
  btn.innerHTML=t('btn-pdf');btn.disabled=false;
}

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzLGV15JRTPs9bbSvHRLfgOXeT9oUExDf1AH546WOwq5tYxXSdhX212OWi_bTJfMGx9/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Sucesiones Cuadráticas de Números';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
