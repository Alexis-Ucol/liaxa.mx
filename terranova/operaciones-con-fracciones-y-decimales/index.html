<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operaciones con Fracciones y Decimales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── MANIPULATIVES ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.35rem; }
.iw-sub { font-size:.83rem; color:var(--text2); margin-bottom:.6rem; }
.mexpr { font-family:'IBM Plex Mono',monospace; font-size:1.15rem; font-weight:600; color:var(--green-dark); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.75rem .8rem; text-align:center; overflow-x:auto; white-space:nowrap; }
.mcaret { color:var(--gold); }
.mstate { font-size:.82rem; color:var(--text2); text-align:center; margin-top:.55rem; }
.mstate b { color:var(--green-dark); font-family:'IBM Plex Mono',monospace; }
.mrow { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; margin-top:.65rem; }
.mrow.keys { justify-content:center; gap:.35rem; }
.mbtn { background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:.5rem .8rem; font-size:.85rem; cursor:pointer; color:var(--text); font-family:inherit; min-height:44px; min-width:44px; }
.mbtn:hover { border-color:var(--green); background:var(--green-bg); }
.mbtn.on { background:var(--green); color:var(--green-bg); border-color:var(--green); }
.mbtn.mono { font-family:'IBM Plex Mono',monospace; font-size:1rem; font-weight:600; }
.mbtn.wide { flex:1; min-width:140px; text-align:center; }
.mfb { margin-top:.7rem; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.6rem .8rem; font-size:.83rem; color:var(--text2); min-height:2.6rem; }
.mfb.good { background:var(--ok-bg); border-left-color:var(--ok); color:var(--ok); }
.mfb.warn { background:var(--bad-bg); border-left-color:var(--bad); color:var(--bad); }
.mcanvas { display:block; width:100%; height:250px; touch-action:none; cursor:pointer; }
.mtrack { font-size:.72rem; color:var(--text3); margin-top:.5rem; letter-spacing:.03em; }
.eqbox { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-top:.7rem; }
@media(max-width:520px){ .eqbox { grid-template-columns:1fr; } }
.eqside { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.6rem .5rem; text-align:center; font-size:.78rem; color:var(--text3); }
.eqside b { display:block; font-size:1.05rem; color:var(--green-dark); margin-top:.3rem; font-weight:600; }
.mcard { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.85rem .7rem; text-align:center; font-size:1.05rem; color:var(--text); margin:.55rem 0; }
.mprog { font-size:.72rem; color:var(--text3); letter-spacing:.03em; text-align:center; }
.mf-slash { display:none; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Operaciones con Fracciones y Decimales</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Operaciones con Fracciones y Decimales</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">

/* ── Drawing palette, derived from the school's colours (Rule 16) ─────────
   slots 1-2 : school primary + accent
   slots 3-4 : the two of black/red/blue/green least similar to the school colours
   Falls back to neutral defaults if SCHOOL colours can't be parsed.
   ───────────────────────────────────────────────────────────────────── */
var DRAW_PALETTE = (function () {
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function dist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
  }
  var COMMON = ['#1a1a16', '#c0392b', '#1d4e89', '#1a7a3a'];  /* black, red, blue, green */
  var schoolRGB;
  try {
    schoolRGB = [hex2rgb(SCHOOL.primary), hex2rgb(SCHOOL.accent)];
  } catch (e) {
    return [SCHOOL.primary, SCHOOL.accent, '#1a1a16', '#1d4e89'];
  }
  var scored = COMMON.map(function (c, idx) {
    var rgb = hex2rgb(c);
    var nearest = Math.min(dist(rgb, schoolRGB[0]), dist(rgb, schoolRGB[1]));
    return { c: c, idx: idx, d: nearest };
  });
  scored.sort(function (a, b) { return b.d - a.d; });      /* farthest first */
  var keep = scored.slice(0, 2);
  keep.sort(function (a, b) { return a.idx - b.idx; });    /* restore visual order */
  return [SCHOOL.primary, SCHOOL.accent, keep[0].c, keep[1].c];
})();
function drawDotsHTML() {
  return DRAW_PALETTE.map(function (c, i) {
    return '<div class="cdot' + (i === 0 ? ' sel' : '') + '" data-color="' + c +
           '" style="background:' + c + '"></div>';
  }).join('');
}

function getAttemptKey(name, group){ return 'mat1_t01_g02__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }

var studentData   = {};

function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'mat1_t01_g02__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'mat1_t01_g02__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = DRAW_PALETTE[0];   // matches the first (selected) dot = SCHOOL.primary
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')

    var ay = wy+7;

    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });

    var dc = document.getElementById('dc'+i);

    var ta = document.getElementById('ta'+i);

      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {

      });

    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute (and doc.save() relies on
  //   it), so on iPhone/iPad a plain download fails silently. We branch:
  //     • iOS  → native share sheet (→ "Save to Files"); if unavailable, open
  //              the PDF inline so the student can tap Safari's own Share.
  //     • else → <a download> click (works on desktop + Android).
  //   The whole function runs synchronously off the tap (no await above), which
  //   is what lets iOS accept navigator.share(). Do NOT add an await before this.
  // ──────────────────────────────────────────────────────────────────────────
  var _fname   = 'mat1_t01_g02_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '⬇ &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }   // popup blocked → same tab
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  // iPadOS 13+ reports as "MacIntel" with a touch screen, so test for that too.
  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; } // cancelled
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();   // older iOS: open inline
    return;
  }

  // Desktop + Android: the native download works.
  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ══════════════════════════════════════════════════════════════════════════
   GUIDE CONTENT: mat1_t01_g02
   Fracciones y decimales · 1 de Secundaria
   Convertir fracciones a decimales y decimales a fracciones
   ══════════════════════════════════════════════════════════════════════════ */
function L(o){ if(o===null||o===undefined) return ''; if(typeof o!=='object') return String(o); return (o[LANG]!==undefined?o[LANG]:o.es); }
function ri(r,a,b){ return a + Math.floor(r()*(b-a+1)); }
function q4(x){ return Math.round(x*10000)/10000; }
function cssVar(n){ try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); } catch(e){ return ''; } }
function gcdi(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a||1; }
function mf(n,d){ return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-slash">/</span><span class="mf-den">'+d+'</span></span>'; }
function dstr(x){ var s=(Math.round(x*100000)/100000).toFixed(5); s=s.replace(/0+$/,''); s=s.replace(/\.$/,''); return s; }
function perStr(n,d){ var s=(n/d).toFixed(6); return s.slice(0, s.indexOf('.')+5)+'...'; }
function placeFrac(x){ var s=dstr(x), i=s.indexOf('.'), dec=(i<0?0:s.length-i-1), den=Math.pow(10,dec); return [Math.round(x*den), den]; }
function wrongPlace(x){ var pf=placeFrac(x); return pf[1]>=100 ? [pf[0], pf[1]/10] : [pf[0], pf[1]*10]; }
function placeName(den){ return den===10 ? L({es:'décimos',en:'tenths'}) : (den===100 ? L({es:'centésimos',en:'hundredths'}) : L({es:'milésimos',en:'thousandths'})); }
function subRng(rng, tag){ return seededRng(tag + Math.floor(rng()*1000000)); }
function shuffleOpts(opts, correct, rng){ var a=shuffle(opts,rng); return { options:a, correctIdx:a.indexOf(correct) }; }
function decOptions(correct, cands){
  var out=[dstr(correct)], i, s;
  for(i=0;i<cands.length && out.length<4;i++){ s=dstr(cands[i]); if(out.indexOf(s)<0) out.push(s); }
  var k=1;
  while(out.length<4){
    s=dstr(q4(correct+k/100)); if(out.indexOf(s)<0) out.push(s);
    if(out.length<4){ s=dstr(q4(Math.abs(correct-k/100))); if(out.indexOf(s)<0) out.push(s); }
    k++;
  }
  return { options:out, correct:dstr(correct) };
}
function fracOptions(cn, cd, cands){
  var out=[mf(cn,cd)], i, s;
  for(i=0;i<cands.length && out.length<4;i++){ s=mf(cands[i][0],cands[i][1]); if(out.indexOf(s)<0) out.push(s); }
  var k=2;
  while(out.length<4){ s=mf(cn*k,cd); if(out.indexOf(s)<0) out.push(s); k++; }
  return { options:out, correct:mf(cn,cd) };
}
function txtOptions(correct, others){ return { options:[correct].concat(others), correct:correct }; }

function actv(btn){ var row=btn.parentNode.querySelectorAll('.mbtn'), i; for(i=0;i<row.length;i++) row[i].classList.remove('on'); btn.classList.add('on'); }

/* ═════════ WIDGET 1 · máquina de dividir cifra por cifra ═════════ */
var W1 = { n:3, d:4, digits:[], rem:3, tries:0, round:0, done:false, rng:null };
var W1POOL = [[3,4],[1,8],[3,8],[5,8],[7,8],[1,4],[3,5],[4,5],[9,20],[7,20],[1,2],[7,25]];
function w1Keys(){ var h='', i; for(i=0;i<10;i++) h+='<button class="mbtn mono" onclick="w1Key('+i+')">'+i+'</button>'; return h; }
function w1New(){
  var p = W1POOL[Math.floor(W1.rng()*W1POOL.length)];
  W1.n=p[0]; W1.d=p[1]; W1.digits=[]; W1.rem=p[0]; W1.tries=0;
  w1Render();
  setFb('w1fb', L({es:'La máquina va a repartir '+W1.n+' entre '+W1.d+'. Como '+W1.n+' es menor que '+W1.d+', el resultado arranca en 0 y continúa en los decimales. Toca la cifra que va en el primer lugar.',
                   en:'The machine will share '+W1.n+' among '+W1.d+'. Since '+W1.n+' is smaller than '+W1.d+', the result starts at 0 and continues into the decimals. Tap the digit that goes in the first place.'}));
}
function w1Closed(){ return W1.rem===0 && W1.digits.length>0; }
function w1Render(){
  var host=document.getElementById('w1expr'); if(!host) return;
  host.innerHTML = W1.n+' ÷ '+W1.d+' = 0.'+W1.digits.join('')+(w1Closed()?'':'<span class="mcaret">_</span>');
  var st=document.getElementById('w1state');
  if(st) st.innerHTML = w1Closed()
    ? L({es:'Residuo 0: el reparto cerró exacto.', en:'Remainder 0: the sharing closed exactly.'})
    : L({es:'Ahora hay que repartir <b>'+(W1.rem*10)+'</b> entre <b>'+W1.d+'</b>',
         en:'Now you have to share <b>'+(W1.rem*10)+'</b> among <b>'+W1.d+'</b>'});
  var tr=document.getElementById('w1round');
  if(tr) tr.textContent = L({es:'División '+Math.min(W1.round+1,3)+' de 3', en:'Division '+Math.min(W1.round+1,3)+' of 3'});
}
function w1Key(k){
  if(W1.done || w1Closed()) return;
  var pool=W1.rem*10, exp=Math.floor(pool/W1.d);
  if(k===exp){
    W1.digits.push(k); W1.rem=pool-k*W1.d; W1.tries=0; w1Render();
    if(W1.rem===0){
      setFb('w1fb', L({es:'Cerró exacto: '+W1.n+' ÷ '+W1.d+' = 0.'+W1.digits.join('')+'. Ese es el decimal que le corresponde a la fracción.',
                       en:'It closed exactly: '+W1.n+' ÷ '+W1.d+' = 0.'+W1.digits.join('')+'. That is the decimal matching the fraction.'}), 'good');
    } else {
      setFb('w1fb', L({es:'Bien: '+k+' × '+W1.d+' = '+(k*W1.d)+', y de '+pool+' sobran '+W1.rem+'. Ese residuo se convierte en '+(W1.rem*10)+' del siguiente lugar.',
                       en:'Good: '+k+' × '+W1.d+' = '+(k*W1.d)+', and out of '+pool+' there are '+W1.rem+' left. That remainder turns into '+(W1.rem*10)+' of the next place.'}), 'good');
    }
    return;
  }
  W1.tries++;
  if(W1.tries>=3){
    W1.digits.push(exp); W1.rem=pool-exp*W1.d; W1.tries=0; w1Render();
    setFb('w1fb', L({es:'La cifra que cabía era '+exp+', porque '+exp+' × '+W1.d+' = '+(exp*W1.d)+' y no se pasa de '+pool+'. Ya quedó colocada; observa cómo cambió el residuo.',
                     en:'The digit that fitted was '+exp+', because '+exp+' × '+W1.d+' = '+(exp*W1.d)+' and it does not overshoot '+pool+'. It is placed now; notice how the remainder changed.'}), 'warn');
    return;
  }
  if(k*W1.d>pool){
    setFb('w1fb', L({es:'Con '+k+' te pasas: '+k+' × '+W1.d+' = '+(k*W1.d)+', más que '+pool+'. Prueba una cifra menor.',
                     en:'With '+k+' you overshoot: '+k+' × '+W1.d+' = '+(k*W1.d)+', more than '+pool+'. Try a smaller digit.'}), 'warn');
  } else {
    setFb('w1fb', L({es:'Con '+k+' sobran '+(pool-k*W1.d)+', y ahí todavía cabe otro '+W1.d+'. Prueba una cifra mayor.',
                     en:'With '+k+' there are '+(pool-k*W1.d)+' left, and another '+W1.d+' still fits in there. Try a bigger digit.'}), 'warn');
  }
}
function w1Reset(){
  if(W1.done) return;
  W1.digits=[]; W1.rem=W1.n; W1.tries=0; w1Render();
  setFb('w1fb', L({es:'El reparto volvió al inicio. Toca de nuevo la cifra del primer lugar decimal.',
                   en:'The sharing is back at the start. Tap the digit for the first decimal place again.'}));
}
function w1Next(){
  if(W1.done) return;
  if(W1.round>=2){
    W1.done=true;
    setFb('w1fb', L({es:'Tres repartos completos. En los tres, el residuo se fue convirtiendo en décimos, centésimos y milésimos hasta llegar a cero.',
                     en:'Three complete sharings. In all three, the remainder kept turning into tenths, hundredths and thousandths until it reached zero.'}), 'good');
    return;
  }
  W1.round++; w1New();
}

/* ═════════ WIDGET 2 · amplificador a potencia de 10 ═════════ */
var W2 = { n:7, d:25, m:0, tries:0, round:0, done:false, rng:null };
var W2POOL = [[3,4],[7,25],[9,20],[1,2],[3,5],[11,50],[3,8],[13,20],[1,4],[7,8],[17,20],[9,25]];
var W2MULT = [2,4,5,10,20,25,125];
function w2Mults(){ var h='', i; for(i=0;i<W2MULT.length;i++) h+='<button class="mbtn mono" onclick="w2Pick('+W2MULT[i]+',this)">× '+W2MULT[i]+'</button>'; return h; }
function w2Clear(){ var row=document.getElementById('w2mults'); if(!row) return; var b=row.querySelectorAll('.mbtn'), i; for(i=0;i<b.length;i++) b[i].classList.remove('on'); }
function w2New(){
  var p=W2POOL[Math.floor(W2.rng()*W2POOL.length)];
  W2.n=p[0]; W2.d=p[1]; W2.m=0; W2.tries=0; w2Clear(); w2Render();
  setFb('w2fb', L({es:'Busca el multiplicador que convierte el denominador '+W2.d+' en 10, 100 o 1000. Puedes cambiarlo las veces que quieras.',
                   en:'Look for the multiplier that turns the denominator '+W2.d+' into 10, 100 or 1000. You can change it as many times as you want.'}));
}
function w2Render(){
  var l=document.getElementById('w2left'), r=document.getElementById('w2right');
  if(!l||!r) return;
  l.innerHTML = L({es:'Fracción original',en:'Original fraction'})+'<b>'+mf(W2.n,W2.d)+'</b>';
  if(!W2.m){ r.innerHTML = L({es:'Fracción estirada',en:'Stretched fraction'})+'<b>?</b>'; }
  else {
    var nn=W2.n*W2.m, dd=W2.d*W2.m;
    var extra=(dd===10||dd===100||dd===1000) ? ' = '+dstr(nn/dd) : '';
    r.innerHTML = L({es:'Fracción estirada',en:'Stretched fraction'})+'<b>'+mf(nn,dd)+extra+'</b>';
  }
  var tr=document.getElementById('w2round');
  if(tr) tr.textContent = L({es:'Fracción '+Math.min(W2.round+1,3)+' de 3', en:'Fraction '+Math.min(W2.round+1,3)+' of 3'});
}
function w2Pick(m, btn){
  if(W2.done) return;
  W2.m=m; actv(btn); w2Render();
  var goal=goal10(W2.d), mc=goal/W2.d, dd=W2.d*m;
  if(m===mc){
    setFb('w2fb', L({es:'Justo: '+W2.d+' × '+m+' = '+goal+' y arriba '+W2.n+' × '+m+' = '+(W2.n*m)+'. Una fracción con denominador '+goal+' se lee directo como '+dstr(W2.n/W2.d)+'.',
                     en:'Exactly: '+W2.d+' × '+m+' = '+goal+' and on top '+W2.n+' × '+m+' = '+(W2.n*m)+'. A fraction with denominator '+goal+' reads straight off as '+dstr(W2.n/W2.d)+'.'}), 'good');
    return;
  }
  W2.tries++;
  if(W2.tries>=3){
    W2.m=mc; W2.tries=0; w2Clear(); w2Render();
    setFb('w2fb', L({es:'El multiplicador que faltaba era '+mc+': '+W2.d+' × '+mc+' = '+goal+', así que la fracción vale '+dstr(W2.n/W2.d)+'. Fíjate en cómo el denominador cayó justo en una potencia de 10.',
                     en:'The missing multiplier was '+mc+': '+W2.d+' × '+mc+' = '+goal+', so the fraction is worth '+dstr(W2.n/W2.d)+'. Notice how the denominator landed right on a power of 10.'}), 'warn');
    return;
  }
  setFb('w2fb', L({es:'El denominador quedó en '+dd+', que no es 10 ni 100 ni 1000. '+(dd<goal?'Prueba un multiplicador mayor.':'Prueba un multiplicador menor.'),
                   en:'The denominator became '+dd+', which is not 10 or 100 or 1000. '+(dd<goal?'Try a bigger multiplier.':'Try a smaller multiplier.')}), 'warn');
}
function w2Next(){
  if(W2.done) return;
  if(W2.round>=2){
    W2.done=true;
    setFb('w2fb', L({es:'Tres fracciones estiradas. Cuando el denominador alcanza 10, 100 o 1000, el decimal aparece sin hacer ninguna división.',
                     en:'Three stretched fractions. When the denominator reaches 10, 100 or 1000, the decimal shows up without doing any division.'}), 'good');
    return;
  }
  W2.round++; w2New();
}

/* ═════════ WIDGET 3 · rejilla de 100 casillas ═════════ */
var W3 = { n:7, d:20, cells:35, k:0, tries:0, round:0, done:false, drag:false, rng:null };
var W3POOL = [[7,20],[3,4],[9,20],[3,5],[13,25],[1,4],[17,20],[6,25],[1,2],[11,20],[2,5],[19,20]];
function w3New(){
  var p=W3POOL[Math.floor(W3.rng()*W3POOL.length)];
  W3.n=p[0]; W3.d=p[1]; W3.cells=p[0]*100/p[1]; W3.k=0; W3.tries=0;
  w3Draw(); w3Info();
  setFb('w3fb', L({es:'Pinta en la rejilla la parte que representa '+mf(W3.n,W3.d)+'. Toca una casilla para pintar hasta ahí y toca más atrás para quitar.',
                   en:'Shade on the grid the part that represents '+mf(W3.n,W3.d)+'. Tap a square to shade up to it and tap further back to remove.'}));
}
function w3Info(){
  var e=document.getElementById('w3info');
  if(e) e.innerHTML = L({es:'Pintadas <b>'+W3.k+'</b> de 100 · como fracción '+mf(W3.k,100)+' · como decimal <b>'+dstr(W3.k/100)+'</b>',
                         en:'Shaded <b>'+W3.k+'</b> of 100 · as a fraction '+mf(W3.k,100)+' · as a decimal <b>'+dstr(W3.k/100)+'</b>'});
  var t=document.getElementById('w3target');
  if(t) t.innerHTML = L({es:'Parte que buscas: '+mf(W3.n,W3.d), en:'Part you are aiming for: '+mf(W3.n,W3.d)});
  var tr=document.getElementById('w3round');
  if(tr) tr.textContent = L({es:'Rejilla '+Math.min(W3.round+1,3)+' de 3', en:'Grid '+Math.min(W3.round+1,3)+' of 3'});
}
function w3Draw(){
  var cv=document.getElementById('w3canvas'); if(!cv) return;
  var rc=cv.getBoundingClientRect(); if(rc.width<10) return;
  var dpr=window.devicePixelRatio||1;
  cv.width=rc.width*dpr; cv.height=rc.height*dpr;
  var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  var W=rc.width, H=rc.height; ctx.clearRect(0,0,W,H);
  var cs=Math.floor(Math.min(W,H)/10), ox=Math.floor((W-cs*10)/2), oy=Math.floor((H-cs*10)/2);
  var i, r0, c0, x, y;
  for(i=0;i<100;i++){
    r0=Math.floor(i/10); c0=i%10; x=ox+c0*cs; y=oy+r0*cs;
    ctx.fillStyle = (i<W3.k) ? cssVar('--green') : cssVar('--surface2');
    ctx.fillRect(x,y,cs,cs);
    ctx.strokeStyle = cssVar('--border'); ctx.lineWidth=1;
    ctx.strokeRect(x+0.5,y+0.5,cs-1,cs-1);
  }
}
function w3Idx(cv, e){
  var rc=cv.getBoundingClientRect(), src=e.touches&&e.touches[0]?e.touches[0]:e;
  var cs=Math.min(rc.width,rc.height)/10, ox=(rc.width-cs*10)/2, oy=(rc.height-cs*10)/2;
  var c0=Math.floor((src.clientX-rc.left-ox)/cs), r0=Math.floor((src.clientY-rc.top-oy)/cs);
  if(c0<0||c0>9||r0<0||r0>9) return -1;
  return r0*10+c0;
}
function w3Live(){
  var diff=W3.cells-W3.k;
  if(diff===0){
    setFb('w3fb', L({es:'La parte pintada coincide con la que buscas. Toca Comprobar para cerrarla.',
                     en:'The shaded part matches the one you are aiming for. Tap Check to close it.'}));
  } else if(diff>0){
    setFb('w3fb', L({es:'Todavía te quedas corto: lo pintado vale menos que '+mf(W3.n,W3.d)+'. '+(diff<=5?'Ya casi, agrega unas pocas casillas.':'Agrega bastantes casillas más.'),
                     en:'You are still short: what is shaded is worth less than '+mf(W3.n,W3.d)+'. '+(diff<=5?'Almost there, add a few more squares.':'Add quite a few more squares.')}));
  } else {
    setFb('w3fb', L({es:'Te pasaste: lo pintado vale más que '+mf(W3.n,W3.d)+'. '+(diff>=-5?'Quita solo unas cuantas casillas.':'Quita bastantes casillas.'),
                     en:'You went over: what is shaded is worth more than '+mf(W3.n,W3.d)+'. '+(diff>=-5?'Remove just a few squares.':'Remove quite a few squares.')}));
  }
}
function w3Set(idx){
  if(W3.done||idx<0) return;
  var v=idx+1; if(v===W3.k) v=idx;
  W3.k=v; w3Draw(); w3Info(); w3Live();
}
function w3Paint(idx){
  if(W3.done||idx<0) return;
  W3.k=idx+1; w3Draw(); w3Info(); w3Live();
}
function w3Check(){
  if(W3.done) return;
  var g=gcdi(W3.cells,100);
  if(W3.k===W3.cells){
    setFb('w3fb', L({es:'Exacto: '+W3.cells+' casillas de 100 son '+mf(W3.cells,100)+', que se escribe '+dstr(W3.cells/100)+'. Al dividir arriba y abajo entre '+g+' vuelves a '+mf(W3.n,W3.d)+'.',
                     en:'Exactly: '+W3.cells+' squares out of 100 are '+mf(W3.cells,100)+', written '+dstr(W3.cells/100)+'. Dividing top and bottom by '+g+' takes you back to '+mf(W3.n,W3.d)+'.'}), 'good');
    return;
  }
  W3.tries++;
  if(W3.tries>=3){
    W3.k=W3.cells; W3.tries=0; w3Draw(); w3Info();
    setFb('w3fb', L({es:'Así se ve: '+mf(W3.n,W3.d)+' ocupa '+W3.cells+' casillas, o sea '+mf(W3.cells,100)+' = '+dstr(W3.cells/100)+'. La rejilla ya quedó pintada.',
                     en:'This is how it looks: '+mf(W3.n,W3.d)+' takes '+W3.cells+' squares, that is '+mf(W3.cells,100)+' = '+dstr(W3.cells/100)+'. The grid is shaded now.'}), 'warn');
    return;

}
function w3Next(){
  if(W3.done) return;
  if(W3.round>=2){
    W3.done=true;
    setFb('w3fb', L({es:'Tres rejillas pintadas. Cada casilla es un centésimo, y por eso una rejilla completa se lee igual como fracción y como decimal.',
                     en:'Three grids shaded. Each square is one hundredth, and that is why a full grid reads the same as a fraction and as a decimal.'}), 'good');
    return;
  }
  W3.round++; w3New();
}
function w3Bind(){
  var cv=document.getElementById('w3canvas'); if(!cv) return;
  function down(e){ e.preventDefault(); W3.drag=true; w3Set(w3Idx(cv,e)); }
  function move(e){ if(!W3.drag) return; e.preventDefault(); w3Paint(w3Idx(cv,e)); }
  function up(){ W3.drag=false; }
  cv.addEventListener('mousedown', down, {passive:false});
  cv.addEventListener('mousemove', move, {passive:false});
  cv.addEventListener('mouseup', up);
  cv.addEventListener('mouseleave', up);
  cv.addEventListener('touchstart', down, {passive:false});
  cv.addEventListener('touchmove', move, {passive:false});
  cv.addEventListener('touchend', up);
}

var W4 = { items:[], i:0, tries:0, ok:0, done:false };
var W4EX = [[1,4],[3,5],[7,8],[9,20],[3,25],[1,2],[11,50],[7,20]];
var W4PE = [[1,3],[2,3],[5,6],[1,9],[7,12],[2,11],[1,6],[4,9]];
function w4Build(r){
  var ex=shuffle(W4EX,r).slice(0,3).map(function(p){ return {n:p[0],d:p[1],bin:0}; });
  var pe=shuffle(W4PE,r).slice(0,2).map(function(p){ return {n:p[0],d:p[1],bin:1}; });
  W4.items=shuffle(ex.concat(pe), r); W4.i=0; W4.tries=0; W4.ok=0; W4.done=false;
}
function w4Bins(){ return LANG==='es' ? ['Decimal que termina','Decimal que se repite'] : ['Decimal that ends','Decimal that repeats']; }
function w4Render(){
  var host=document.getElementById('w4body'); if(!host) return;
  if(W4.done){
    host.innerHTML = '<div class="mcard">'+L({es:'Clasificadas las 5 fracciones. Aciertos directos: '+W4.ok+' de 5.',
                                              en:'All 5 fractions classified. Direct hits: '+W4.ok+' of 5.'})+'</div>';
    return;
  }
  var it=W4.items[W4.i], b=w4Bins();
  host.innerHTML =
    '<div class="mprog">'+(W4.i+1)+' / '+W4.items.length+'</div>'+
    '<div class="mcard">'+mf(it.n,it.d)+'</div>'+
    '<div class="mrow">'+
      '<button class="mbtn wide" onclick="w4Pick(0)">'+b[0]+'</button>'+
      '<button class="mbtn wide" onclick="w4Pick(1)">'+b[1]+'</button>'+
    '</div>';
}
function w4Advance(){
  W4.tries=0; W4.i++;
  if(W4.i>=W4.items.length){ W4.done=true; }
  w4Render();
}
function w4Pick(bi){
  if(W4.done) return;
  var it=W4.items[W4.i], g=goal10(it.d), mc=g/it.d;
  if(bi===it.bin){
    W4.ok++;
    if(it.bin===0){
      setFb('w4fb', L({es:'Correcto: '+it.d+' × '+mc+' = '+g+', así que '+mf(it.n,it.d)+' = '+dstr(it.n/it.d)+' y ahí se acaba.',
                       en:'Correct: '+it.d+' × '+mc+' = '+g+', so '+mf(it.n,it.d)+' = '+dstr(it.n/it.d)+' and there it ends.'}), 'good');
    } else {
      setFb('w4fb', L({es:'Correcto: ningún entero convierte '+it.d+' en 10, 100 o 1000, y al dividir aparece '+perStr(it.n,it.d),
                       en:'Correct: no whole number turns '+it.d+' into 10, 100 or 1000, and dividing gives '+perStr(it.n,it.d)}), 'good');
    }
    w4Advance(); return;
  }
  W4.tries++;
  if(W4.tries>=3){
    if(it.bin===0){
      setFb('w4fb', L({es:'Esta termina: '+it.d+' × '+mc+' = '+g+', por eso '+mf(it.n,it.d)+' = '+dstr(it.n/it.d)+'. Pasamos a la siguiente.',
                       en:'This one ends: '+it.d+' × '+mc+' = '+g+', that is why '+mf(it.n,it.d)+' = '+dstr(it.n/it.d)+'. Moving to the next one.'}), 'warn');
    } else {
      setFb('w4fb', L({es:'Esta se repite: '+it.d+' no llega a 10, 100 ni 1000 por multiplicación, y el resultado es '+perStr(it.n,it.d)+' Pasamos a la siguiente.',
                       en:'This one repeats: '+it.d+' never reaches 10, 100 or 1000 by multiplying, and the result is '+perStr(it.n,it.d)+' Moving to the next one.'}), 'warn');
    }
    w4Advance(); return;
  }
  setFb('w4fb', L({es:'Vuelve a intentarlo: prueba a multiplicar '+it.d+' por 2, 4, 5, 20, 25 o 125 y observa si alguno cae justo en 10, 100 o 1000.',
                   en:'Try again: multiply '+it.d+' by 2, 4, 5, 20, 25 or 125 and see whether any of them lands right on 10, 100 or 1000.'}), 'warn');
}

      var aP2=[2.5,3.2,4.6,2.8], a2=aP2[Math.floor(rng()*aP2.length)], resto=q4(a2-fv);
      var o2=decOptions(resto, [q4(a2+fv), q4(a2-Number('0.'+n+d)), q4(a2-fv/10)]);
      cfg={
        title:L({es:'Lo que queda del rollo',en:'What is left of the roll'}),
        questionText:L({es:'De un rollo de cinta de '+dstr(a2)+' m se usaron '+mf(n,d)+' de metro. ¿Cuántos metros de cinta quedan?',
                        en:'From a tape roll of '+dstr(a2)+' m, '+mf(n,d)+' of a meter was used. How many meters of tape are left?'}),
        fn:'',
        hint:L({es:'Escribe la parte usada en la misma forma que la longitud del rollo antes de quitarla, cuidando el lugar que ocupa cada cifra.',
                en:'Write the used part in the same form as the roll length before taking it away, watching the place each digit occupies.'}),
        explanation:L({es:mf(n,d)+' de metro son '+dstr(fv)+' m, y '+dstr(a2)+' − '+dstr(fv)+' = '+dstr(resto)+' m.',
                       en:mf(n,d)+' of a meter is '+dstr(fv)+' m, and '+dstr(a2)+' − '+dstr(fv)+' = '+dstr(resto)+' m.'}),
        options:o2.options, correct:o2.correct, showWork:true
      };
    }
    addProblem(rng, cfg);
  })();

  /* ─── P10 ─── */
  (function(){
    var v=Math.floor(rng()*2), cfg;
    var OK=[[0.6,3,5],[0.25,1,4],[0.7,7,10],[0.75,3,4],[0.2,1,5],[0.35,7,20],[0.125,1,8],[0.5,1,2]];
    var BAD=[[0.08,8,10],[0.4,1,4],[0.05,5,10],[0.3,1,3],[0.9,9,100],[0.15,1,15],[0.06,6,10],[0.24,2,4]];
    function pair(it){ return dstr(it[0])+' = '+mf(it[1],it[2]); }
    if(v===0){
      var b=BAD[Math.floor(rng()*BAD.length)], gs=shuffle(OK,rng).slice(0,3);
      var pf=placeFrac(b[0]), gg=gcdi(pf[0],pf[1]);
      var simp=L({es:(gg>1 ? ', que en su mínima expresión es '+mf(pf[0]/gg,pf[1]/gg) : ''),
                  en:(gg>1 ? ', which in lowest terms is '+mf(pf[0]/gg,pf[1]/gg) : '')});
      var o=txtOptions(pair(b), [pair(gs[0]), pair(gs[1]), pair(gs[2])]);
      cfg={
        title:L({es:'La conversión que falla',en:'The conversion that fails'}),
        questionText:L({es:'Cuatro estudiantes escribieron un decimal y la fracción que creen equivalente. ¿Cuál de estas conversiones está mal hecha?',
                        en:'Four students wrote a decimal and the fraction they believe is equivalent. Which of these conversions is done wrong?'}),
        fn:'',
        hint:L({es:'Convierte cada decimal por tu cuenta antes de decidir, o divide cada fracción y compara el resultado con el decimal escrito a su lado.',
                en:'Convert each decimal on your own before deciding, or divide each fraction and compare the result with the decimal written beside it.'}),
        explanation:L({es:'El decimal '+dstr(b[0])+' equivale a '+mf(pf[0],pf[1])+simp+', y no a '+mf(b[1],b[2])+'. Las otras tres conversiones sí coinciden.',
                       en:'The decimal '+dstr(b[0])+' is equal to '+mf(pf[0],pf[1])+simp+', and not to '+mf(b[1],b[2])+'. The other three conversions do match.'}),
        options:o.options, correct:o.correct, showWork:false
      };
    } else {
      var g2=OK[Math.floor(rng()*OK.length)], bs2=shuffle(BAD,rng).slice(0,3);
      var pf2=placeFrac(g2[0]), gg2=pf2[0]/g2[1];
      var step=L({es:(gg2>1 ? ', y al dividir arriba y abajo entre '+gg2+' queda '+mf(g2[1],g2[2]) : ', que ya está en su mínima expresión'),
                  en:(gg2>1 ? ', and dividing top and bottom by '+gg2+' leaves '+mf(g2[1],g2[2]) : ', which is already in lowest terms')});
      var o2=txtOptions(pair(g2), [pair(bs2[0]), pair(bs2[1]), pair(bs2[2])]);
      cfg={
        title:L({es:'La conversión que sí cuadra',en:'The conversion that does add up'}),
        questionText:L({es:'Cuatro estudiantes escribieron un decimal y la fracción que creen equivalente. ¿Cuál de estas conversiones está bien hecha?',
                        en:'Four students wrote a decimal and the fraction they believe is equivalent. Which of these conversions is done right?'}),
        fn:'',
        hint:L({es:'Fíjate en el último lugar de cada decimal para saber qué denominador le toca, y después revisa si la fracción escrita vale lo mismo.',
                en:'Look at the last place of each decimal to know which denominator belongs to it, and then check whether the written fraction is worth the same.'}),
        explanation:L({es:'El decimal '+dstr(g2[0])+' son '+pf2[0]+' '+placeName(pf2[1])+': '+mf(pf2[0],pf2[1])+step+'. En las otras tres el decimal y la fracción tienen valores distintos.',
                       en:'The decimal '+dstr(g2[0])+' is '+pf2[0]+' '+placeName(pf2[1])+': '+mf(pf2[0],pf2[1])+step+'. In the other three the decimal and the fraction have different values.'}),
        options:o2.options, correct:o2.correct, showWork:false
      };
    }
    addProblem(rng, cfg);
  })();
}
</script>
