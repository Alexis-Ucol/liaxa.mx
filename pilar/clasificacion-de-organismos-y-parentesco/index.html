      en:'Switch the traits on and off as you like. The list below trims itself: only the organisms that meet every active trait stay lit.'
    }) + '</div>' +
    '<div data-r="sw"></div>' +
    '<div class="gw-lbl">' + L({ es:'Quedan en el grupo', en:'Left in the group' }) + ' <span class="cnt" data-r="cnt">0</span></div>' +
    '<div class="pool" data-r="pool"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
      '<button class="gw-btn" data-r="clr">' + L({ es:'Apagar todo', en:'Switch all off' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elS = host.querySelector('[data-r="sw"]'),
      elC = host.querySelector('[data-r="cnt"]'),
      elP = host.querySelector('[data-r="pool"]'),
      bK  = host.querySelector('[data-r="chk"]'),
      bC  = host.querySelector('[data-r="clr"]');

  function active(){ return SW.filter(function(s){ return on[s.k]; }).map(function(s){ return s.k; }); }
  function survives(o){ return active().every(function(k){ return o.f[k] === 1; }); }
  function target(){ return ROUNDS[rd].g; }
  function wanted(){ return ORGS.filter(function(o){ return target().every(function(k){ return o.f[k] === 1; }); }); }

  function render(){
    elQ.innerHTML = L({
      es:'Reto ' + (rd + 1) + ' de 3: deja encendidos solo ' + L(ROUNDS[rd].say) + '.',
      en:'Challenge ' + (rd + 1) + ' of 3: leave lit only ' + L(ROUNDS[rd].say) + '.'
    });
    elS.innerHTML = SW.map(function(s){
      return '<div class="swrow"><span class="swtxt">' + L(s.t) + '</span>' +
        '<button class="sw' + (on[s.k] ? ' on' : '') + '" data-k="' + s.k + '"' + (done ? ' disabled' : '') + '>' +
        (on[s.k] ? L({ es:'activo', en:'on' }) : L({ es:'apagado', en:'off' })) + '</button></div>';
    }).join('');
    elS.querySelectorAll('.sw').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-k');
        on[k] = !on[k];
        render();
        say(host, '', L({
          es:'Ahora quedan ' + ORGS.filter(survives).length + ' organismos en el grupo.',
          en:'Now ' + ORGS.filter(survives).length + ' organisms are left in the group.'
        }));
      });
    });
    var live = ORGS.filter(survives);
    elC.textContent = live.length;
    elP.innerHTML = ORGS.map(function(o){
      return '<span class="chip ' + (survives(o) ? 'live' : 'out') + '">' + L(o.n) + '</span>';
    }).join('');
  }

  function advance(){
    rd++; tries = 0; on = {};
    if (rd >= 3){
      done = true;
      bK.textContent = L({ es:'Completado', en:'Completed' });
      bK.className = 'gw-btn solved'; bK.disabled = true; bC.disabled = true;
      render();
      say(host, 'good', L({
        es:'Cada rasgo que enciendes recorta el grupo. Con uno solo quedan grupos enormes y con dos aparecen conjuntos mucho más parecidos entre sí.',
        en:'Every trait you switch on trims the group. With just one you get enormous groups and with two you get sets that are far more alike.'
      }));
      return;
    }
    render();
    say(host, '', L({ es:'Nuevo reto. Empieza por el rasgo que te parezca más decisivo.', en:'New challenge. Start with the trait that looks most decisive to you.' }));
  }

  bC.addEventListener('click', function(){
    if (done) return;
    on = {}; render();
    say(host, '', L({ es:'Todos los rasgos apagados: el grupo vuelve a tener los diez organismos.', en:'All traits off: the group is back to all ten organisms.' }));
  });

  bK.addEventListener('click', function(){
    if (done) return;
    var live = ORGS.filter(survives).map(function(o){ return L(o.n); }).sort();
    var need = wanted().map(function(o){ return L(o.n); }).sort();
    if (live.join('|') === need.join('|') && active().length > 0){
      say(host, 'good', L({ es:'Ese es exactamente el grupo pedido.', en:'That is exactly the requested group.' }));
      setTimeout(advance, 800);
      return;
    }
    tries++;
    if (tries >= 3){
      on = {}; target().forEach(function(k){ on[k] = true; });
      render();
      say(host, 'miss', L({
        es:'Los rasgos que dejan ese grupo son: ' + target().map(function(k){ return L(SW.filter(function(s){ return s.k === k; })[0].t); }).join(' y ') + '. Quedan ' + need.length + ' organismos.',
        en:'The traits that leave that group are: ' + target().map(function(k){ return L(SW.filter(function(s){ return s.k === k; })[0].t); }).join(' and ') + '. That leaves ' + need.length + ' organisms.'
      }));
      setTimeout(advance, 2600);
      return;
    }
    if (live.length > need.length){
      say(host, 'warm', L({
        es:'Te sobran organismos: quedan ' + live.length + ' y el grupo pedido tiene ' + need.length + '. Enciende un rasgo más para recortar.',
        en:'You have organisms to spare: ' + live.length + ' are left and the requested group has ' + need.length + '. Switch on one more trait to trim it.'
      }));
    } else if (live.length < need.length){
      say(host, 'warm', L({
        es:'Recortaste de más: quedan ' + live.length + ' y el grupo pedido tiene ' + need.length + '. Apaga un rasgo que no haga falta.',
        en:'You trimmed too much: ' + live.length + ' are left and the requested group has ' + need.length + '. Switch off a trait that is not needed.'
      }));
    } else {
      say(host, 'warm', L({
        es:'El número coincide pero no son los mismos organismos. Revisa cuál de los rasgos activos no describe al grupo pedido.',
        en:'The number matches but they are not the same organisms. Check which of the active traits does not describe the requested group.'
      }));
    }
  });

  render();
  say(host, '', L({ es:'Con todo apagado están los diez. Empieza a filtrar.', en:'With everything off all ten are in. Start filtering.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: hasta dónde llega el reparto
   Un reparto ya hecho y cuatro preguntas. El estudiante marca cuáles puede
   responder ese reparto; el marcador se mueve en vivo. Pista direccional
   sobre una pregunta mal marcada; reveal a la tercera falla.
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var POOL = [
    { crit:{ es:'el ambiente donde viven', en:'the environment where they live' },
      grp:{ es:'En el grupo de los que viven en el mar quedaron el tiburón, el delfín y el pulpo.', en:'In the group of those living in the sea we find the shark, the dolphin and the octopus.' },
      qs:[
        { q:{ es:'¿Cuáles enfrentan las mismas condiciones de agua salada?', en:'Which ones face the same salt water conditions?' }, can:1,
          w:{ es:'el reparto se armó justamente por el lugar donde viven', en:'the arrangement was built precisely on where they live' } },
        { q:{ es:'¿Cuál de los tres alimenta a sus crías con leche?', en:'Which of the three feeds its young with milk?' }, can:0,
          w:{ es:'el criterio nunca miró la reproducción', en:'the criterion never looked at reproduction' } },
        { q:{ es:'¿En qué zona habría que buscarlos para estudiarlos?', en:'In which area would you look for them to study them?' }, can:1,
          w:{ es:'esa es exactamente la información que da el criterio', en:'that is exactly the information the criterion gives' } },
        { q:{ es:'¿Cuáles descienden de un antepasado común cercano?', en:'Which ones descend from a close common ancestor?' }, can:0,
          w:{ es:'compartir el mar no dice nada sobre lo que cada uno heredó', en:'sharing the sea says nothing about what each one inherited' } }
      ] },
    { crit:{ es:'si el organismo vuela', en:'whether the organism flies' },
      grp:{ es:'En el grupo de los que vuelan quedaron el murciélago, la mariposa y el gorrión.', en:'In the group of those that fly we find the bat, the butterfly and the sparrow.' },
      qs:[
        { q:{ es:'¿Qué cuerpos se sostienen en el aire y cómo lo logran?', en:'Which bodies hold themselves in the air and how do they manage it?' }, can:1,
          w:{ es:'volar es justo la característica que armó el grupo', en:'flying is precisely the characteristic that built the group' } },
        { q:{ es:'¿Cuáles de ellos nacen de un huevo?', en:'Which of them hatch from an egg?' }, can:0,
          w:{ es:'el criterio no preguntó nada sobre cómo llega el nuevo individuo', en:'the criterion asked nothing about how the new individual arrives' } },
        { q:{ es:'¿Cuáles podrían llegar por el aire a una isla lejana?', en:'Which ones could reach a distant island through the air?' }, can:1,
          w:{ es:'eso se sigue directamente de poder volar', en:'that follows directly from being able to fly' } },
        { q:{ es:'¿Cuáles están emparentados entre sí?', en:'Which of them are related to each other?' }, can:0,
          w:{ es:'volar apareció por separado en cuerpos muy distintos', en:'flying appeared separately in very different bodies' } }
      ] },
    { crit:{ es:'la forma de obtener materia y energía', en:'the way of getting matter and energy' },
      grp:{ es:'Un grupo quedó con el maíz, el alga y el helecho, y el otro con el hongo, la lombriz y el gato.', en:'One group ended up with the maize, the alga and the fern, and the other with the fungus, the earthworm and the cat.' },
      qs:[
        { q:{ es:'¿Cuáles dependen de otros seres vivos para obtener materia?', en:'Which ones depend on other living things to get matter?' }, can:1,
          w:{ es:'esa dependencia es lo que separó los dos grupos', en:'that dependence is what separated the two groups' } },
        { q:{ es:'¿Cuáles viven en el agua y cuáles en tierra firme?', en:'Which ones live in water and which on dry land?' }, can:0,
          w:{ es:'el ambiente quedó fuera del criterio elegido', en:'the environment fell outside the chosen criterion' } },
        { q:{ es:'¿Qué organismos pueden sostener el inicio de una cadena alimentaria?', en:'Which organisms can sustain the start of a food chain?' }, can:1,
          w:{ es:'fabricar el propio alimento es lo que permite sostener ese inicio', en:'making your own food is what allows that start to be sustained' } },
        { q:{ es:'¿Cuáles necesitan dos progenitores para dejar descendencia?', en:'Which ones need two parents to leave descendants?' }, can:0,
          w:{ es:'la reproducción no entró en este reparto', en:'reproduction did not enter this arrangement' } }
      ] }
  ];
  var ROUNDS = shuffle(POOL, rng).slice(0, 2);
  var rd = 0, tries = 0, revealed = false, done = false;
  var mark = [-1,-1,-1,-1];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Hasta dónde llega', en:'How far it reaches' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Marca cada pregunta según puedas o no responderla con ese reparto en la mano. Toca de nuevo para cambiar de opinión.',
      en:'Mark each question according to whether that arrangement lets you answer it. Tap again to change your mind.'
    }) + '</div>' +
    '<div data-r="list"></div>' +
    '<div class="gw-lbl">' + L({ es:'Marcaste como respondibles', en:'You marked as answerable' }) + ' <span class="cnt" data-r="cnt">0</span> ' + L({ es:'de 4', en:'of 4' }) + '</div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="chk">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elL = host.querySelector('[data-r="list"]'),
      elC = host.querySelector('[data-r="cnt"]'),
      bK  = host.querySelector('[data-r="chk"]');

  function R(){ return ROUNDS[rd]; }

  function render(){
    var r = R();
    elQ.innerHTML = L({
      es:'Reparto ' + (rd + 1) + ' de ' + ROUNDS.length + '. Criterio usado: ' + L(r.crit) + '. ' + L(r.grp),
      en:'Arrangement ' + (rd + 1) + ' of ' + ROUNDS.length + '. Criterion used: ' + L(r.crit) + '. ' + L(r.grp)
    });
    elL.innerHTML = r.qs.map(function(o, i){
      var m = mark[i];
      var lbl = m < 0 ? L({ es:'sin marcar', en:'unmarked' }) : (m === 1 ? L({ es:'sí la responde', en:'it does answer it' }) : L({ es:'no la responde', en:'it does not answer it' }));
      var cls = m === 1 ? ' gA' : m === 0 ? ' gB' : '';
      return '<button class="gw-tile' + cls + '" data-i="' + i + '"' + ((revealed || done) ? ' disabled' : '') + '>' +
        '<span class="gw-key">' + L(o.q) + '</span><span class="gw-sub">' + lbl + '</span></button>';
    }).join('');
    elL.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){
        var i = parseInt(b.getAttribute('data-i'), 10);
        mark[i] = mark[i] === -1 ? 1 : (mark[i] === 1 ? 0 : -1);
        render();
      });
    });
    elC.textContent = mark.filter(function(m){ return m === 1; }).length;
  }

  function advance(){
    rd++; tries = 0; revealed = false; mark = [-1,-1,-1,-1];
    if (rd >= ROUNDS.length){
      done = true;
      bK.textContent = L({ es:'Completado', en:'Completed' });
      bK.className = 'gw-btn solved'; bK.disabled = true;
      say(host, 'good', L({
        es:'Ningún reparto respondió las cuatro preguntas. Eso no lo vuelve inútil: lo vuelve útil para unas cosas y mudo para otras, y saber para cuáles es parte del trabajo.',
        en:'No arrangement answered all four questions. That does not make it useless: it makes it useful for some things and silent for others, and knowing which is part of the work.'
      }));
      return;
    }
    bK.textContent = L({ es:'Comprobar', en:'Check' });
    bK.className = 'gw-btn';
    render();
    say(host, '', L({ es:'Otro reparto, otro criterio. Vuelve a medir su alcance.', en:'Another arrangement, another criterion. Measure its reach again.' }));
  }

  bK.addEventListener('click', function(){
    if (done) return;
    if (revealed){ advance(); return; }
    var r = R();
    if (mark.indexOf(-1) >= 0){
      say(host, 'warm', L({ es:'Falta marcar alguna pregunta. Tócala hasta dejarla en sí o en no.', en:'Some question is still unmarked. Tap it until it reads yes or no.' }));
      return;
    }
    var wrong = [];
    r.qs.forEach(function(o, i){ if (mark[i] !== o.can) wrong.push(i); });
    if (wrong.length === 0){
      say(host, 'good', L({ es:'Así es: ese reparto alcanza para dos de las cuatro.', en:'That is it: that arrangement reaches two of the four.' }));
      setTimeout(advance, 850);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      r.qs.forEach(function(o, i){ mark[i] = o.can; });
      render();
      bK.textContent = ROUNDS.length - 1 > rd ? L({ es:'Siguiente', en:'Next' }) : L({ es:'Cerrar', en:'Close' });
      say(host, 'miss', L({
        es:'Las que sí responde son las que dependen del criterio con el que se armaron los grupos; las otras dos piden información que ese criterio nunca miró.',
        en:'The ones it does answer are those that depend on the criterion the groups were built with; the other two ask for information that criterion never looked at.'
      }));
      return;
    }
    var k = wrong[0];
    say(host, 'warm', L({
      es:'Tienes ' + (4 - wrong.length) + ' de 4 bien marcadas. Vuelve a esta: ' + L(r.qs[k].q) + ' Piensa que ' + L(r.qs[k].w) + '.',
      en:'You have ' + (4 - wrong.length) + ' of 4 marked correctly. Go back to this one: ' + L(r.qs[k].q) + ' Consider that ' + L(r.qs[k].w) + '.'
    }));
  });

  render();
  say(host, '', L({ es:'Lee el reparto y decide qué te permite averiguar.', en:'Read the arrangement and decide what it lets you find out.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 5 :: el medidor de parecido
   Tabla de características; al tocar un candidato la fila se compara con la
   del organismo central, se iluminan las coincidencias y la barra se mueve
   en vivo. El estudiante propone al pariente más probable.
   ══════════════════════════════════════════════════════════════════════════ */
function w5(rng, host){
  var POOL = [
    { focal:{ es:'delfín', en:'dolphin' },
      traits:[
        { es:'respira con pulmones', en:'breathes with lungs' },
        { es:'alimenta a las crías con leche', en:'feeds its young with milk' },
        { es:'la cría se desarrolla dentro de la madre', en:'the young develops inside the mother' },
        { es:'tiene esqueleto interno', en:'has an internal skeleton' },
        { es:'vive en el mar', en:'lives in the sea' },
        { es:'cuerpo alargado con aletas', en:'long body with fins' }
      ],
      rows:[
        { n:{ es:'delfín', en:'dolphin' }, v:[1,1,1,1,1,1], focal:true },
        { n:{ es:'tiburón', en:'shark' },  v:[0,0,0,1,1,1] },
        { n:{ es:'vaca', en:'cow' },       v:[1,1,1,1,0,0] },
        { n:{ es:'pulpo', en:'octopus' },  v:[0,0,0,0,1,0] }
      ],
      best:1, // índice dentro de candidatos
      why:{ es:'el delfín y la vaca coinciden en pulmones, leche y desarrollo dentro de la madre, que son características heredadas; con el tiburón solo coincide en lo que impone vivir en el mar', en:'the dolphin and the cow match in lungs, milk and development inside the mother, which are inherited characteristics; with the shark it only matches in what living in the sea imposes' } },
    { focal:{ es:'murciélago', en:'bat' },
      traits:[
        { es:'vuela', en:'flies' },
        { es:'alimenta a las crías con leche', en:'feeds its young with milk' },
        { es:'cuerpo cubierto de pelo', en:'body covered in fur' },
        { es:'la cría se desarrolla dentro de la madre', en:'the young develops inside the mother' },
        { es:'respira con pulmones', en:'breathes with lungs' },
        { es:'tiene esqueleto interno', en:'has an internal skeleton' }
      ],
      rows:[
        { n:{ es:'murciélago', en:'bat' },   v:[1,1,1,1,1,1], focal:true },
        { n:{ es:'gorrión', en:'sparrow' },  v:[1,0,0,0,1,1] },
        { n:{ es:'ratón', en:'mouse' },      v:[0,1,1,1,1,1] },
        { n:{ es:'mariposa', en:'butterfly' },v:[1,0,0,0,0,0] }
      ],
      best:1,
      why:{ es:'el murciélago y el ratón coinciden en leche, pelo y desarrollo dentro de la madre; con el gorrión solo coinciden características que también tiene cualquier animal que vuele', en:'the bat and the mouse match in milk, fur and development inside the mother; with the sparrow they only match characteristics that any flying animal also has' } },
    { focal:{ es:'pingüino', en:'penguin' },
      traits:[
        { es:'pico córneo sin dientes', en:'horny beak with no teeth' },
        { es:'cuerpo cubierto de plumas', en:'body covered in feathers' },
        { es:'nace de un huevo con cascarón', en:'hatches from an egg with a shell' },
        { es:'respira con pulmones', en:'breathes with lungs' },
        { es:'nada y se alimenta en el mar', en:'swims and feeds in the sea' },
        { es:'tiene esqueleto interno', en:'has an internal skeleton' }
      ],
      rows:[
        { n:{ es:'pingüino', en:'penguin' }, v:[1,1,1,1,1,1], focal:true },
        { n:{ es:'foca', en:'seal' },        v:[0,0,0,1,1,1] },
        { n:{ es:'gorrión', en:'sparrow' },  v:[1,1,1,1,0,1] },
        { n:{ es:'atún', en:'tuna' },        v:[0,0,0,0,1,1] }
      ],
      best:2,
      why:{ es:'el pingüino y el gorrión coinciden en pico, plumas y huevo con cascarón, aunque uno nade y el otro vuele; con la foca solo coincide en lo que exige el mar', en:'the penguin and the sparrow match in beak, feathers and shelled egg, even though one swims and the other flies; with the seal it only matches in what the sea demands' } }
  ];
  var ROUNDS = shuffle(POOL, rng);
  var rd = 0, tries = 0, sel = -1, done = false, revealed = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El medidor de parecido', en:'The resemblance meter' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca un candidato para compararlo con el organismo central. Puedes comparar los tres las veces que quieras antes de proponer.',
      en:'Tap a candidate to compare it with the central organism. You can compare all three as often as you like before proposing.'
    }) + '</div>' +
    '<div style="overflow-x:auto"><table class="ttab" data-r="tab"></table></div>' +
    '<div class="gw-lbl">' + L({ es:'Características compartidas', en:'Shared characteristics' }) + ' <span class="cnt" data-r="cnt">0</span></div>' +
    '<div class="meter"><div class="meterf" data-r="bar"></div></div>' +
    '<div class="gw-grid3" data-r="cands"></div>' +
    '<div class="gw-row"><button class="gw-btn" data-r="prop">' + L({ es:'Proponer parentesco', en:'Propose kinship' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elT = host.querySelector('[data-r="tab"]'),
      elC = host.querySelector('[data-r="cnt"]'),
      elB = host.querySelector('[data-r="bar"]'),
      elD = host.querySelector('[data-r="cands"]'),
      bP  = host.querySelector('[data-r="prop"]');

  function R(){ return ROUNDS[rd]; }
  function cands(){ return R().rows.slice(1); }
  function shared(ci){
    var r = R(), f = r.rows[0].v, c = r.rows[ci + 1].v, n = 0;
    for (var i = 0; i < f.length; i++) if (f[i] === 1 && c[i] === 1) n++;
    return n;
  }

  function render(){
    var r = R();
    elQ.innerHTML = L({
      es:'Caso ' + (rd + 1) + ' de 3: ¿quién es el pariente más probable del ' + L(r.focal) + '?',
      en:'Case ' + (rd + 1) + ' of 3: who is the most likely relative of the ' + L(r.focal) + '?'
    });
    var head = '<tr><th class="rn">' + L({ es:'Organismo', en:'Organism' }) + '</th>' +
      r.traits.map(function(t){ return '<th>' + L(t) + '</th>'; }).join('') + '</tr>';
    var body = r.rows.map(function(row, ri){
      var cls = ri === 0 ? ' class="focal"' : (sel === ri - 1 ? ' class="cand"' : '');
      var tds = row.v.map(function(v, i){
        var hit = (sel === ri - 1 && ri > 0 && v === 1 && r.rows[0].v[i] === 1);
        return '<td class="' + (hit ? 'hit ' : '') + (v ? 'yes' : 'no') + '">' + (v ? '✓' : '·') + '</td>';
      }).join('');
      return '<tr' + cls + '><td class="rn">' + L(row.n) + '</td>' + tds + '</tr>';
    }).join('');
    elT.innerHTML = head + body;
    var n = sel >= 0 ? shared(sel) : 0;
    elC.textContent = n + ' / ' + r.traits.length;
    var pctv = Math.round(n / r.traits.length * 100);
    elB.style.width = pctv + '%';
    elB.className = 'meterf' + (pctv >= 66 ? '' : pctv >= 40 ? ' warn' : ' low');
    elD.innerHTML = cands().map(function(c, i){
      return '<button class="gw-tile' + (sel === i ? ' on' : '') + '" data-i="' + i + '"' + ((done || revealed) ? ' disabled' : '') + '>' +
        '<span class="gw-key">' + L(c.n) + '</span><span class="gw-sub">' + L({ es:'comparar', en:'compare' }) + '</span></button>';
    }).join('');
    elD.querySelectorAll('.gw-tile').forEach(function(b){
      b.addEventListener('click', function(){
        sel = parseInt(b.getAttribute('data-i'), 10);
        render();
        var s = shared(sel);
        say(host, '', L({
          es:'El ' + L(cands()[sel].n) + ' comparte ' + s + ' de ' + R().traits.length + ' con el ' + L(R().focal) + '. Compara también los otros antes de decidir.',
          en:'The ' + L(cands()[sel].n) + ' shares ' + s + ' of ' + R().traits.length + ' with the ' + L(R().focal) + '. Compare the others too before deciding.'
        }));
      });
    });
  }

  function advance(){
    rd++; tries = 0; sel = -1; revealed = false;
    if (rd >= ROUNDS.length){
      done = true;
      bP.textContent = L({ es:'Completado', en:'Completed' });
      bP.className = 'gw-btn solved'; bP.disabled = true;
      render();
      say(host, 'good', L({
        es:'En los tres casos el candidato que vive en el mismo lugar no fue el pariente más probable. Lo que pesa es cuántas características heredadas coinciden, no cuánto se parecen por fuera.',
        en:'In all three cases the candidate living in the same place was not the most likely relative. What counts is how many inherited characteristics match, not how alike they look on the outside.'
      }));
      return;
    }
    render();
    say(host, '', L({ es:'Otro organismo central. Vuelve a comparar fila por fila.', en:'Another central organism. Compare row by row again.' }));
  }

  bP.addEventListener('click', function(){
    if (done) return;
    if (revealed){ advance(); return; }
    if (sel < 0){
      say(host, 'warm', L({ es:'Todavía no comparas a nadie. Toca un candidato para ver sus coincidencias.', en:'You have not compared anyone yet. Tap a candidate to see its matches.' }));
      return;
    }
    var r = R();
    if (sel === r.best){
      say(host, 'good', L({ es:'Hipótesis bien sostenida: ' + L(r.why) + '.', en:'Well supported hypothesis: ' + L(r.why) + '.' }));
      setTimeout(advance, 1500);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      sel = r.best;
      render();
      bP.textContent = L({ es:'Siguiente', en:'Next' });
      say(host, 'miss', L({
        es:'El pariente más probable es el ' + L(cands()[r.best].n) + ': ' + L(r.why) + '.',
        en:'The most likely relative is the ' + L(cands()[r.best].n) + ': ' + L(r.why) + '.'
      }));
      return;
    }
    say(host, 'warm', L({
      es:'Ese comparte ' + shared(sel) + ' de ' + r.traits.length + ' y hay otro que comparte ' + shared(r.best) + '. Fíjate en las columnas que hablan de cómo respira y de cómo llegan las crías, no en la de dónde vive.',
      en:'That one shares ' + shared(sel) + ' of ' + r.traits.length + ' and there is another sharing ' + shared(r.best) + '. Look at the columns about how it breathes and how the young arrive, not at the one about where it lives.'
    }));
  });

  render();
  say(host, '', L({ es:'Empieza tocando cualquiera de los tres candidatos.', en:'Start by tapping any of the three candidates.' }));
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 6 :: contrasta con las fuentes
   Cuatro fichas de consulta que se abren una por una; el medidor de apoyo se
   mueve en vivo con cada dato. Con pocas fichas abiertas la decisión correcta
   es seguir consultando; con la mesa completa hay que sostener o descartar.
   ══════════════════════════════════════════════════════════════════════════ */
function w6(rng, host){
  var POOL = [
    { hyp:{ es:'El murciélago y el gorrión son parientes cercanos porque los dos vuelan.', en:'The bat and the sparrow are close relatives because both of them fly.' },
      cards:[
        { s:{ es:'Guía de campo', en:'Field guide' }, d:{ es:'El gorrión tiene el cuerpo cubierto de plumas; el murciélago, de pelo.', en:'The sparrow has a body covered in feathers; the bat, in fur.' }, v:-1 },
        { s:{ es:'Libro de biología', en:'Biology book' }, d:{ es:'El murciélago alimenta a sus crías con leche; el gorrión no lo hace.', en:'The bat feeds its young with milk; the sparrow does not.' }, v:-1 },
        { s:{ es:'Ficha de museo', en:'Museum record' }, d:{ es:'El gorrión nace de un huevo con cascarón; la cría del murciélago se desarrolla dentro de la madre.', en:'The sparrow hatches from a shelled egg; the bat young develops inside the mother.' }, v:-1 },
        { s:{ es:'Registro de campo', en:'Field log' }, d:{ es:'Los dos cazan insectos en el aire al anochecer.', en:'Both of them hunt insects in the air at dusk.' }, v:0 }
      ],
      verdict:'drop',
      why:{ es:'tres fuentes muestran características heredadas que no coinciden y la cuarta solo describe un modo de alimentarse compartido por vivir en el mismo lugar', en:'three sources show inherited characteristics that do not match and the fourth only describes a way of feeding shared because they live in the same place' } },
    { hyp:{ es:'El delfín y el tiburón son parientes cercanos porque tienen cuerpo alargado con aletas.', en:'The dolphin and the shark are close relatives because both have a long body with fins.' },
      cards:[
        { s:{ es:'Libro de biología', en:'Biology book' }, d:{ es:'El delfín sube a la superficie a tomar aire con sus pulmones; el tiburón respira con branquias toda su vida.', en:'The dolphin comes up to the surface to take air with its lungs; the shark breathes with gills all its life.' }, v:-1 },
        { s:{ es:'Ficha de museo', en:'Museum record' }, d:{ es:'La cría del delfín se desarrolla dentro de la madre y se alimenta con leche.', en:'The dolphin young develops inside the mother and feeds on milk.' }, v:-1 },
        { s:{ es:'Guía de campo', en:'Field guide' }, d:{ es:'Los dos nadan rápido en mar abierto y persiguen cardúmenes.', en:'Both swim fast in open sea and chase shoals of fish.' }, v:0 },
        { s:{ es:'Nota de colección', en:'Collection note' }, d:{ es:'La aleta del delfín tiene huesos parecidos a los de un brazo; la del tiburón no.', en:'The dolphin fin has bones similar to those of an arm; the shark fin does not.' }, v:-1 }
      ],
      verdict:'drop',
      why:{ es:'la respiración, el desarrollo de las crías y la estructura interna de la aleta no coinciden, y lo único compartido es la forma que impone nadar rápido', en:'breathing, the development of the young and the internal structure of the fin do not match, and the only shared thing is the shape that swimming fast imposes' } },
    { hyp:{ es:'El maíz y el pino son parientes porque los dos forman semillas de las que nace una planta nueva.', en:'Maize and pine are related because both form seeds from which a new plant is born.' },
      cards:[
        { s:{ es:'Libro de biología', en:'Biology book' }, d:{ es:'En los dos, el nuevo individuo sale de una semilla con reservas de alimento.', en:'In both, the new individual comes out of a seed with food reserves.' }, v:1 },
        { s:{ es:'Ficha de museo', en:'Museum record' }, d:{ es:'Los dos tienen raíz, tallo y hojas con conductos internos que llevan agua desde el suelo.', en:'Both have root, stem and leaves with internal ducts that carry water up from the soil.' }, v:1 },
        { s:{ es:'Guía de campo', en:'Field guide' }, d:{ es:'El maíz crece en clima cálido y el pino en zonas frías de montaña.', en:'Maize grows in warm climates and pine in cold mountain areas.' }, v:0 },
        { s:{ es:'Nota de colección', en:'Collection note' }, d:{ es:'Los dos fabrican su alimento en las hojas usando la luz.', en:'Both make their food in the leaves using light.' }, v:1 }
      ],
      verdict:'keep',
      why:{ es:'las coincidencias están en estructuras internas y en la forma de reproducirse, que son características heredadas, y la única diferencia que aparece es el clima donde vive cada uno', en:'the matches are in internal structures and in the way of reproducing, which are inherited characteristics, and the only difference that shows up is the climate where each one lives' } },
    { hyp:{ es:'El ratón y el murciélago son parientes cercanos porque los dos tienen pelo y alimentan a sus crías con leche.', en:'The mouse and the bat are close relatives because both have fur and feed their young with milk.' },
      cards:[
        { s:{ es:'Ficha de museo', en:'Museum record' }, d:{ es:'En los dos, la cría se desarrolla dentro del cuerpo de la madre.', en:'In both, the young develops inside the mother body.' }, v:1 },
        { s:{ es:'Libro de biología', en:'Biology book' }, d:{ es:'Los huesos del ala del murciélago corresponden a dedos alargados, como los dedos de la pata del ratón.', en:'The bones in the bat wing correspond to elongated fingers, like the fingers in the mouse limb.' }, v:1 },
        { s:{ es:'Guía de campo', en:'Field guide' }, d:{ es:'El murciélago vuela de noche y el ratón camina por el suelo.', en:'The bat flies at night and the mouse walks on the ground.' }, v:0 },
        { s:{ es:'Nota de colección', en:'Collection note' }, d:{ es:'Los dos tienen dientes de varios tipos en la misma mandíbula.', en:'Both have several types of teeth in the same jaw.' }, v:1 }
      ],
      verdict:'keep',
      why:{ es:'las fuentes suman coincidencias en el desarrollo de las crías, en los huesos y en la dentadura, y la diferencia que aparece es solo el modo de desplazarse', en:'the sources add up matches in the development of the young, in the bones and in the teeth, and the difference that shows up is only the way of moving about' } }
  ];
  var ROUNDS = shuffle(POOL, rng).slice(0, 2);
  var rd = 0, tries = 0, done = false, revealed = false;
  var open = [];

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Contrasta con las fuentes', en:'Test it against the sources' }) + '</div>' +
    '<div class="gw-q" data-r="q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca una ficha para leer lo que dice esa fuente. El medidor de abajo se mueve con cada dato que abres.',
      en:'Tap a card to read what that source says. The meter below moves with every piece of data you open.'
    }) + '</div>' +
    '<div class="gw-grid" data-r="cards"></div>' +
    '<div class="gw-lbl">' + L({ es:'Apoyo que reúne la hipótesis', en:'Support the hypothesis has gathered' }) + ' <span class="cnt" data-r="cnt"></span></div>' +
    '<div class="meter"><div class="meterf" data-r="bar"></div></div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" data-r="keep">' + L({ es:'Sostener la hipótesis', en:'Keep the hypothesis' }) + '</button>' +
      '<button class="gw-btn" data-r="drop">' + L({ es:'Descartarla y reformular', en:'Drop it and rethink' }) + '</button>' +
      '<button class="gw-btn" data-r="more">' + L({ es:'Falta consultar más', en:'More consulting needed' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var elQ = host.querySelector('[data-r="q"]'),
      elC = host.querySelector('[data-r="cards"]'),
      elN = host.querySelector('[data-r="cnt"]'),
      elB = host.querySelector('[data-r="bar"]'),
      bKeep = host.querySelector('[data-r="keep"]'),
      bDrop = host.querySelector('[data-r="drop"]'),
      bMore = host.querySelector('[data-r="more"]');

  function R(){ return ROUNDS[rd]; }

  function render(){
    var r = R();
    elQ.innerHTML = L({
      es:'Hipótesis ' + (rd + 1) + ' de ' + ROUNDS.length + ': ' + L(r.hyp),
      en:'Hypothesis ' + (rd + 1) + ' of ' + ROUNDS.length + ': ' + L(r.hyp)
    });
    elC.innerHTML = r.cards.map(function(c, i){
      var isOpen = open.indexOf(i) >= 0;
      return '<div class="card2' + (isOpen ? ' open' : '') + '" data-i="' + i + '">' +
        '<div class="c2t">' + L(c.s) + '</div>' +
        '<div class="c2b">' + (isOpen ? L(c.d) : L({ es:'toca para leer esta fuente', en:'tap to read this source' })) + '</div></div>';
    }).join('');
    elC.querySelectorAll('.card2').forEach(function(d){
      d.addEventListener('click', function(){
        if (done) return;
        var i = parseInt(d.getAttribute('data-i'), 10);
        if (open.indexOf(i) >= 0) return;
        open.push(i);
        render();
        var c = R().cards[i];
        say(host, c.v > 0 ? 'good' : c.v < 0 ? 'warm' : '', L({
          es:c.v > 0 ? 'Ese dato empuja a favor: es una característica heredada que sí coincide.'
            : c.v < 0 ? 'Ese dato empuja en contra: es una característica heredada que no coincide.'
            : 'Ese dato no mueve la balanza: describe el lugar o la costumbre, no algo heredado.',
          en:c.v > 0 ? 'That piece pushes in favour: it is an inherited characteristic that does match.'
            : c.v < 0 ? 'That piece pushes against: it is an inherited characteristic that does not match.'
            : 'That piece does not move the balance: it describes the place or the habit, not something inherited.'
        }));
      });
    });
    var pos = 0, neg = 0;
    open.forEach(function(i){ if (r.cards[i].v > 0) pos++; if (r.cards[i].v < 0) neg++; });
    elN.textContent = pos + ' / ' + (pos + neg);
    var val = (pos + neg) === 0 ? 50 : Math.round(pos / (pos + neg) * 100);
    elB.style.width = val + '%';
    elB.className = 'meterf' + (val >= 66 ? '' : val >= 34 ? ' warn' : ' low');
  }

  function advance(){
    rd++; tries = 0; open = []; revealed = false;
    if (rd >= ROUNDS.length){
      done = true;
      [bKeep, bDrop, bMore].forEach(function(b){ b.disabled = true; });
      bMore.className = 'gw-btn solved';
      bMore.textContent = L({ es:'Completado', en:'Completed' });
      say(host, 'good', L({
        es:'Proponer una hipótesis y luego cambiarla porque las fuentes muestran otra cosa no es un error: así avanza el trabajo de clasificar.',
        en:'Proposing a hypothesis and then changing it because the sources show something else is not a mistake: that is how the work of classifying moves forward.'
      }));
      return;
    }
    render();
    say(host, '', L({ es:'Otra hipótesis sobre la mesa y otras cuatro fichas por abrir.', en:'Another hypothesis on the table and four more cards to open.' }));
  }

  function decide(choice){
    if (done) return;
    if (revealed){ advance(); return; }
    var r = R();
    var right = open.length < 3 ? 'more' : r.verdict;
    if (choice === right){
      if (right === 'more'){
        say(host, 'good', L({
          es:'Buena decisión: con ' + open.length + ' ficha(s) abierta(s) todavía no alcanza. Abre las que faltan y vuelve a decidir.',
          en:'Good call: with ' + open.length + ' card(s) open it is not enough yet. Open the remaining ones and decide again.'
        }));
        return;
      }
      say(host, 'good', L({
        es:(right === 'keep' ? 'La hipótesis se sostiene: ' : 'Bien descartada: ') + L(r.why) + '.',
        en:(right === 'keep' ? 'The hypothesis holds: ' : 'Rightly dropped: ') + L(r.why) + '.'
      }));
      setTimeout(advance, 1800);
      return;
    }
    tries++;
    if (tries >= 3){
      revealed = true;
      r.cards.forEach(function(c, i){ if (open.indexOf(i) < 0) open.push(i); });
      render();
      bMore.textContent = L({ es:'Siguiente', en:'Next' });
      say(host, 'miss', L({
        es:'Con las cuatro fichas abiertas, lo que corresponde es ' + (r.verdict === 'keep' ? 'sostener la hipótesis' : 'descartarla y reformularla') + ': ' + L(r.why) + '.',
        en:'With all four cards open, what fits is ' + (r.verdict === 'keep' ? 'keeping the hypothesis' : 'dropping it and rethinking it') + ': ' + L(r.why) + '.'
      }));
      return;
    }
    if (right === 'more'){
      say(host, 'warm', L({
        es:'Vas muy rápido: solo tienes ' + open.length + ' de 4 fichas abiertas y las que faltan podrían cambiarlo todo.',
        en:'You are going too fast: you only have ' + open.length + ' of 4 cards open and the missing ones could change everything.'
      }));
      return;
    }
    say(host, 'warm', L({
      es:'Vuelve a leer las fichas y separa las que hablan de características heredadas de las que solo describen dónde vive o qué come cada uno.',
      en:'Read the cards again and separate those about inherited characteristics from those that only describe where each one lives or what it eats.'
    }));
  }

  bKeep.addEventListener('click', function(){ decide('keep'); });
  bDrop.addEventListener('click', function(){ decide('drop'); });
  bMore.addEventListener('click', function(){ decide('more'); });

  render();
  say(host, '', L({ es:'Abre la primera ficha que te dé curiosidad.', en:'Open the first card that makes you curious.' }));
}

    { title:{ es:'Leer un reparto', en:'Reading an arrangement' },

             en:['The way of getting matter and energy','The environment where each organism lives','Whether the organism moves about or lives fixed','The size each body reaches'] },
      ci:0,

           en:'Lettuce, alga and fern make their own food; mushroom, snail and fly take matter another living thing already formed. Environment does not work, because the alga lives in water and the lettuce on land while sharing a group; movement does not work either, because the mushroom lives fixed and shares a group with the fly.' } },
    { title:{ es:'Leer un reparto', en:'Reading an arrangement' },
      q:{ es:'Una lámina del laboratorio muestra dos grupos. Grupo A: pino, manzano y maíz. Grupo B: helecho, musgo y hongo del tronco. ¿Con qué criterio se armaron esos dos grupos?',
          en:'A lab chart shows two groups. Group A: pine, apple tree and maize. Group B: fern, moss and fungus on the log. Which criterion were those two groups built with?' },
      opts:{ es:['De qué estructura sale el nuevo individuo','Si el organismo fabrica su propio alimento','Si vive en tierra firme o dentro del agua','La altura que alcanza el organismo adulto'],
             en:['Which structure the new individual comes from','Whether the organism makes its own food','Whether it lives on dry land or in water','The height the adult organism reaches'] },
      ci:0,

      exp:{ es:'Pino, manzano y maíz forman semillas; helecho, musgo y hongo se propagan por esporas. La nutrición no separa esos grupos, porque helecho y musgo fabrican su alimento igual que el pino y quedaron en el otro grupo; todos viven en tierra firme, así que el ambiente tampoco los separa.',
           en:'Pine, apple tree and maize form seeds; fern, moss and fungus spread by spores. Nutrition does not separate those groups, because fern and moss make their own food just like the pine and ended up in the other group; they all live on dry land, so the environment does not separate them either.' } }

/* P2 :: elegir el reparto que sirve para una pregunta */
function mkP2(rng){
  var V = [
    { title:{ es:'El reparto que sirve', en:'The arrangement that works' },
      q:{ es:'Un equipo del huerto escolar quiere saber qué organismos del terreno dependen de otro ser vivo para conseguir materia. Tiene dos repartos ya hechos de los mismos organismos: uno por zonas de sol y de sombra, y otro por la forma de obtener el alimento. ¿Cuál conviene consultar?',
          en:'A school garden team wants to know which organisms in the plot depend on another living thing to get matter. It has two ready made arrangements of the same organisms: one by sunny and shady areas, and one by the way of getting food. Which one is best to consult?' },
      opts:{ es:['El de la forma de obtener el alimento, porque el criterio que lo armó es justo de dónde sale la materia de cada uno','El de zonas de sol y de sombra, porque los organismos de la sombra reciben menos luz para alimentarse','Cualquiera de los dos, porque los dos repartos trabajan con los mismos organismos del terreno','Ninguno de los dos, porque para esa pregunta hace falta un reparto por tamaño de cada organismo'],
             en:['The one by the way of getting food, because the criterion that built it is exactly where each one gets its matter from','The one by sunny and shady areas, because organisms in the shade receive less light to feed themselves','Either of the two, because both arrangements work with the same organisms in the plot','Neither of the two, because that question needs an arrangement by the size of each organism'] },
      ci:0,
      hint:{ es:'Compara la pregunta del equipo con el criterio que armó cada reparto y fíjate cuál de los dos criterios habla de lo mismo.',
             en:'Compare the team question with the criterion that built each arrangement and see which of the two criteria talks about the same thing.' },
      exp:{ es:'Un reparto solo responde preguntas relacionadas con su propio criterio. Depender de otro ser vivo para conseguir materia es exactamente lo que separa a los que fabrican su alimento de los que lo toman ya formado, así que ese es el reparto útil aquí. El de sol y sombra habla del lugar, no del origen de la materia.',
           en:'An arrangement only answers questions related to its own criterion. Depending on another living thing to get matter is exactly what separates those that make their food from those that take it ready formed, so that is the useful arrangement here. The sun and shade one talks about the place, not about where the matter comes from.' } },
    { title:{ es:'El reparto que sirve', en:'The arrangement that works' },
      q:{ es:'En el arroyo, un equipo repartió los organismos con el criterio de si viven fijos o se desplazan, y otro equipo lo hizo según si fabrican o toman su alimento. En el primer reparto el alga quedó junto al hongo; en el segundo quedó junto a la planta acuática. ¿Qué pregunta puede responderse con el segundo reparto y no con el primero?',
          en:'In the stream, one team sorted the organisms by whether they live fixed or move about, and another team did it by whether they make or take their food. In the first arrangement the alga ended up next to the fungus; in the second it ended up next to the water plant. Which question can be answered with the second arrangement and not with the first?' },
      opts:{ es:['Cuáles organismos pueden sostener por sí mismos el inicio de una cadena alimentaria del arroyo','Cuáles organismos quedan atrapados si el nivel del arroyo baja de golpe','Cuáles organismos necesitan sujetarse a las piedras para no ser arrastrados','Cuáles organismos pueden cambiar de lugar cuando la corriente se vuelve fuerte'],
             en:['Which organisms can sustain the start of a stream food chain by themselves','Which organisms get trapped if the stream level drops suddenly','Which organisms need to hold on to stones so as not to be swept away','Which organisms can change place when the current becomes strong'] },
      ci:0,
      hint:{ es:'Tres de las opciones dependen de si el organismo se queda fijo o puede moverse; solo una depende de dónde saca su materia.',
             en:'Three of the options depend on whether the organism stays fixed or can move; only one depends on where it gets its matter from.' },
      exp:{ es:'Sostener el inicio de una cadena alimentaria exige fabricar el alimento a partir de materia sencilla, y eso es justo lo que mira el segundo criterio. Las otras tres preguntas dependen de quedarse fijo o poder desplazarse, que es el criterio del primer reparto.',
           en:'Sustaining the start of a food chain requires making food out of simple matter, and that is exactly what the second criterion looks at. The other three questions depend on staying fixed or being able to move, which is the criterion of the first arrangement.' } }
  ];
  return mcSpec(pk(rng, V));
}

/* P3 :: preguntas útiles dentro de una clave dicotómica */
function mkP3(rng){
  var V = [
    { title:{ es:'El paso de la clave', en:'The key step' },
      q:{ es:'En una clave, la rama de los que toman su alimento ya formado y se desplazan llega a un paso donde falta separar al caracol de jardín de la hormiga. ¿Qué pregunta sirve para ese paso?',
          en:'In a key, the branch of those that take food already formed and move about reaches a step where the garden snail still has to be separated from the ant. Which question works for that step?' },
      opts:{ es:['¿El cuerpo tiene patas articuladas?','¿El organismo se mueve despacio?','¿El organismo sale sobre todo de noche?','¿El organismo es de color café?'],

             en:['By inherited characteristics of nutrition, reproduction and internal structure, because those provide evidence of a common origin','By the environment where each organism lives, because that makes the groups easy to walk through during the exhibition','By the body size of each organism, because that is the characteristic that can be measured most exactly','By the colour of each organism, because that makes them immediately recognisable in the panel photographs'] },

(function(){

    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;

  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
