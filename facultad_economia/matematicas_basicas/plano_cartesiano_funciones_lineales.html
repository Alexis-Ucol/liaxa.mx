<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano Cartesiano y Funciones Lineales · Matemáticas Básicas · Facultad de Economía, Universidad de Colima</title>
<link rel="canonical" href="https://liaxa.mx/facultad_economia/matematicas_basicas/mat_lineales.html">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── fallback only; applyBranding() re-injects from SCHOOL ── */
:root {
  --green:      #4a7c3f;
  --green-dark: #2d5a27;
  --green-bg:   #eaf0e7;
  --gold:       #c9a84c;
  --gold-bg:    #faf3e0;
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #6aaa5f;
  --green-dark: #8ecf82;
  --green-bg:   #1a281a;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--green-bg); color:var(--green-dark); border:1.5px solid var(--green); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; }
#restoreBar strong { color:var(--green-dark); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; object-fit:contain; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; min-width:0; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── LANGUAGE TOGGLE ── */
.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }
.dlist { font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin:.6rem 0; word-break:break-word; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); overflow-x:auto; }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.iw-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.3rem; flex-wrap:wrap; }
.iw-tag { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; }
.iw-title { font-family:'Crimson Pro',serif; font-size:1.08rem; font-weight:700; }
.iw-sub { font-size:.8rem; color:var(--text2); margin-bottom:.85rem; }
.iw-read { margin-top:.85rem; background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.7rem .85rem; font-size:.82rem; color:var(--text2); }
.iw-read strong { color:var(--green-dark); }
.iw-expr { font-family:'IBM Plex Mono',monospace; font-size:1rem; text-align:center; padding:.75rem .6rem; background:var(--surface2); border-radius:8px; margin:.5rem 0; color:var(--text); word-break:break-word; }
.iw-expr .ec { color:var(--green-dark); font-weight:600; }
.iw-expr .ev { color:var(--gold); font-weight:600; }
.iw-note { font-size:.74rem; color:var(--text3); text-align:center; margin-top:-.2rem; margin-bottom:.5rem; }

/* ── COORDINATE PLANE ── */
.plane { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:.35rem; margin:.55rem 0 .2rem; }
.plane svg { display:block; width:100%; height:auto; }
.plane text { font-family:'IBM Plex Mono',monospace; }
.plegend { display:flex; flex-wrap:wrap; gap:.9rem; justify-content:center; font-size:.72rem; color:var(--text3); margin-bottom:.4rem; }
.plegend span i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:.3rem; font-style:normal; }
.lg-in  { background:var(--green); }
.lg-out { background:var(--gold); }
.verdict { text-align:center; font-size:.84rem; font-weight:600; margin-top:.5rem; }
.v-ok  { color:var(--ok); }
.v-bad { color:var(--bad); }

/* ── CHIPS AND TABS ── */
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.3rem .7rem; font-size:.76rem; cursor:pointer; color:var(--text2); transition:all .14s; font-family:inherit; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos { gap: .9rem; }
  .wlogos img { height: 38px; max-width: 42%; }
  .wtitle { font-size: 1.35rem; }
  .stickybar { padding: .5rem .55rem; gap: .38rem; }
  .htitle { display: none; }
  .halexis { display: none; }
  .hsep { display: none; }
  .hlogos { gap: .3rem; }
  .hlogos img { height: 18px; max-width: 60px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .lang-btn { padding: .26rem .48rem; font-size: .68rem; }
  .lbody { padding: 1.2rem .7rem 3rem; max-width: 100%; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .gcrd { padding: .9rem .75rem; }
  .iw-expr { font-size: .86rem; }
  .plegend { gap: .5rem; font-size: .68rem; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ════════════════════ WELCOME ════════════════════ -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <img id="logo-left"  src="" alt="Facultad de Economía" style="display:none">
      <div class="wlogsep" id="wlogsep"></div>
      <img id="logo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Plano Cartesiano y Funciones Lineales</div>
    <div class="wcourse" id="wcourse-el">Matemáticas Básicas</div>
    <label class="flabel" for="sName" id="lbl-name-el">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" for="sGroup" id="lbl-group-el">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar" style="background:var(--green-bg); color:var(--green-dark);">
      <strong id="restoreTitle">Sesión guardada encontrada</strong><br>
      <span id="restoreMsg">¿Deseas continuar donde la dejaste?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Retomar sesión</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Empezar de nuevo</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.9rem">
      <svg width="160" height="52" viewBox="0 0 180 52" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lbt { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.1em; fill:var(--green); font-size:28px; }
          .lbl { stroke:var(--gold); stroke-width:2.5; }
          .lba { fill:var(--gold); }
        </style>
        <polyline points="5,40 14,28 24,33 36,14" fill="none" stroke="var(--green)" stroke-width="3"/>
        <circle cx="36" cy="14" r="4.5" class="lba"/>
        <line x1="52" y1="6" x2="52" y2="46" class="lbl"/>
        <text x="64" y="38" class="lbt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- ════════════════════ LESSON ════════════════════ -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <img id="hlogo-left"  src="" alt="Facultad de Economía" style="display:none">
      <img id="hlogo-right" src="" alt="Universidad de Colima" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle" id="htitle-el">Plano Cartesiano y Funciones Lineales</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg">
        <style>
          .lht { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
          .lhl { stroke:var(--gold); stroke-width:2; }
          .lha { fill:var(--gold); }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" fill="none" stroke="var(--green)" stroke-width="2"/>
        <circle cx="22" cy="10" r="2.5" class="lha"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lhl"/>
        <text x="42" y="22" class="lht">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>

/* ════════════════════════════════════════════════════════════════════════
   ATTEMPT COUNTER + SEEDED RNG
   Fresh numbers on every fresh start; a restored session reuses the seed.
   ════════════════════════════════════════════════════════════════════════ */
function getAttemptKey(name, group) {
  return 'fac_econ_mat__mat_lineales__att__' + (name + '__' + group).replace(/\s+/g, '_');
}
function nextAttempt(name, group) {
  var k = getAttemptKey(name, group), n = 0;
  try { n = parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch(e) {}
  n++;
  try { localStorage.setItem(k, String(n)); } catch(e) {}
  return n;
}
function currentAttempt(name, group) {
  var k = getAttemptKey(name, group);
  try { return parseInt(localStorage.getItem(k) || '1', 10) || 1; } catch(e) { return 1; }
}
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t2 = s ^ (s >>> 16);
    t2 = Math.imul(t2, 0x21f0aaad);
    t2 ^= (t2 >>> 15);
    t2 = Math.imul(t2, 0x735a2d97);
    return ((t2 ^ (t2 >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* Shuffles the four options once and keeps both language versions aligned.
   The key is always the value handed in first. */
function shuffleOpts(rawEs, rawEn, rng) {
  var p = shuffle([0, 1, 2, 3], rng);
  return {
    es: p.map(function(j) { return rawEs[j]; }),
    en: p.map(function(j) { return rawEn[j]; }),
    correctIdx: p.indexOf(0)
  };
}

/* ════════════════════════════════════════════════════════════════════════
   NUMBER AND EXPRESSION HELPERS
   ════════════════════════════════════════════════════════════════════════ */
function nf(x) {
  var neg = x < 0, v = Math.abs(x);
  var s = (Math.round(v * 100) / 100).toString().split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function nfD(x, d) {
  var neg = x < 0, v = Math.abs(x);
  var s = v.toFixed(d).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '−' : '') + s.join('.');
}
function money(v)  { return '$' + nf(Math.round(v)); }
function money2(v) { return '$' + nfD(v, 2); }
function intN(x)   { return nf(Math.round(x)); }
function frac(a, b) {
  return '<span class="mf-outer"><span class="mf-num">' + a + '</span><span class="mf-den">' + b + '</span></span>';
}
/* Writes a term with its sign, so a negative term is always a subtraction. */
function term(coef, varName) {
  if (coef === 0) return '';
  var sign = coef > 0 ? ' + ' : ' − ';
  var abs  = Math.abs(coef);
  return sign + ((abs === 1 && varName) ? '' : intN(abs)) + (varName || '');
}
function pctW(x) { return Math.max(0, Math.min(100, x)) + '%'; }

/* ════════════════════════════════════════════════════════════════════════
   SESSION PERSISTENCE
   ════════════════════════════════════════════════════════════════════════ */
function lsKey() {
  var n = (studentData.name || '').trim(), g = (studentData.group || '').trim();
  return 'fac_econ_mat__mat_lineales__' + (n + '__' + g).replace(/\s+/g, '_');
}
function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}
function loadSession(name, group) {
  var key = 'fac_econ_mat__mat_lineales__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function dismissRestore() { document.getElementById('restoreBar').style.display = 'none'; }
function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  if (!name || !group) { document.getElementById('restoreBar').style.display = 'none'; return; }
  var saved = loadSession(name, group);
  var bar = document.getElementById('restoreBar');
  bar.style.display = (saved && saved.choices && saved.choices.some(function(c) { return c !== null; })) ? 'block' : 'none';
}
function observeSections() {
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
}

function startLesson() {

  var group = document.getElementById('sGroup').value.trim();
  var err   = document.getElementById('startErr');
  if (!name || !group) { err.textContent = t('err-fields'); return; }
  err.textContent = '';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = nextAttempt(name, group);

  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;

}
function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  var rng = seededRng(name + group + att);
  buildLesson(rng);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  observeSections();
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) saved.drawings.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var dc = document.getElementById('dc' + i);
      if (!dc || !dc.width) return;
      var img = new Image();
      img.onload = function() {
        var dpr = window.devicePixelRatio || 1;
        dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
      };
      img.src = dataUrl;
    });
    if (saved.texts) saved.texts.forEach(function(txt, i) {
      if (!txt) return;
      var ta = document.getElementById('ta' + i);
      if (ta) ta.value = txt;
    });
    if (saved.photos) saved.photos.forEach(function(dataUrl, i) {
      if (!dataUrl) return;
      var pp = document.getElementById('pp' + i);
      if (!pp) return;
      pp.src = dataUrl; pp.style.display = 'block';
      var pz = document.getElementById('pz' + i);
      if (pz) pz.style.opacity = '0.4';
    });
  }, 300);
}

/* ════════════════════════════════════════════════════════════════════════
   CANVAS / TABS / PHOTO / HINT / RESULTS

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2d5a27';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e) { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; }
  function onUp() { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}
function switchTab(idx, panel, btn) {
  var prefix = 'wp_' + idx + '_';
  document.querySelectorAll('[id^="' + prefix + '"]').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(prefix + panel).classList.add('active');
  btn.closest('.wtabs').querySelectorAll('.wtab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
function handlePhoto(idx, input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('pp' + idx);

    img.style.display = 'block';
    document.getElementById('pz' + idx).style.opacity = '0.4';
    saveSession();

function toggleHint(idx) { document.getElementById('hint' + idx).classList.toggle('show'); }
function showResults() {
  var rb = document.getElementById('s_results');

/* ════════════════════════════════════════════════════════════════════════
   ANSWER HANDLER · two taps to confirm
   ════════════════════════════════════════════════════════════════════════ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.exp;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (!prob || prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = '<strong>' + (isOk ? t('fb-correct') : t('fb-wrong')) + '</strong> ' + prob.exp;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

      '<div class="hintbox" id="hint' + i + '">' + (prob.hint || '') + '</div>' +
      '<div style="margin-top:.7rem">' +
        '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:.65rem;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin-bottom:.5rem">' + t('lbl-answer') + '</div>' +
        '<div class="mcopts">' + opts + '</div>' +
        '<div class="mcfb" id="fb' + i + '"></div>' +
      '</div>' +
    '</div>';
  document.getElementById('lessonBody').appendChild(card);
  if (prob.showWork) setTimeout(function() { var c = document.getElementById('dc' + i); if (c) initCanvas(c); }, 80);
}

/* ════════════════════════════════════════════════════════════════════════
   SECTION REGISTRY  (concept text is re-rendered on language switch)
   ════════════════════════════════════════════════════════════════════════ */
function addSection(fn) {
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = fn(LANG);
  document.getElementById('lessonBody').appendChild(d);
  sectionDefs.push({ el: d, fn: fn });
}
function applySectionLang() {
  sectionDefs.forEach(function(s) { s.el.innerHTML = s.fn(LANG); });
}

/* ════════════════════════════════════════════════════════════════════════
   ITEM ASSEMBLY
   Each item keeps both languages in i18n. The student always reads one of
   them: q, opts, hint and exp hold the active language and are the only
   fields the cards and the PDF ever touch.
   The runtime gate dumps questionText, options and explanation for external
   review, so those three carry both versions tagged [ES] and [EN]. They are
   an audit surface, never rendered anywhere in the guide.
   ════════════════════════════════════════════════════════════════════════ */
function bothTxt(o) {
  return (o.es === o.en) ? o.es : ('[ES] ' + o.es + '\n[EN] ' + o.en);
}
function bothOpts(o) {
  return o.es.map(function(s, i) {
    return (s === o.en[i]) ? s : ('[ES] ' + s + '   [EN] ' + o.en[i]);
  });
}
function mk(i18n, correctIdx, showWork) {
  return {
    i18n: i18n, correctIdx: correctIdx, showWork: showWork,
    title: i18n.title[LANG],
    q:     i18n.q[LANG],
    hint:  i18n.hint[LANG],
    exp:   i18n.exp[LANG],
    opts:  i18n.opts[LANG].slice(),
    questionText: bothTxt(i18n.q),
    explanation:  bothTxt(i18n.exp),
    options:      bothOpts(i18n.opts)
  };
}
function addItem(i18n, correctIdx, showWork) {
  var d = mk(i18n, correctIdx, showWork);
  problems.push({
    i18n: d.i18n, title: d.title, q: d.q, hint: d.hint, exp: d.exp, opts: d.opts,
    questionText: d.questionText, options: d.options, explanation: d.explanation,
    correctIdx: d.correctIdx, showWork: d.showWork,
    studentChoice: null, pendingChoice: null
  });
  buildOneCard(problems[problems.length - 1], problems.length - 1);
}

/* ════════════════════════════════════════════════════════════════════════
   COORDINATE PLANE PRIMITIVES
   Every widget below draws on the same plane, so the axes, the grid and the
   scale always look the same and the student reads one picture, not three.
   Colours come from the CSS tokens, so the plane follows the theme.
   ════════════════════════════════════════════════════════════════════════ */
var SVW = 340, SVH = 232, SVL = 40, SVR = 12, SVT = 14, SVB = 30;
function mapX(x, xmin, xmax) { return SVL + (x - xmin) / (xmax - xmin) * (SVW - SVL - SVR); }
function mapY(y, ymin, ymax) { return (SVH - SVB) - (y - ymin) / (ymax - ymin) * (SVH - SVB - SVT); }
function svgNum(v) { return (Math.round(v * 10) / 10).toString(); }
function gridSvg(xmin, xmax, ymin, ymax, xlab, ylab, xticks, yticks) {
  var s = '';
  var i, gx, gy;
  for (i = 0; i <= 4; i++) {
    gx = xmin + (xmax - xmin) * i / 4;
    s += '<line x1="' + svgNum(mapX(gx, xmin, xmax)) + '" y1="' + SVT + '" x2="' + svgNum(mapX(gx, xmin, xmax)) + '" y2="' + (SVH - SVB) + '" stroke="var(--border)" stroke-width="0.6"/>';
    gy = ymin + (ymax - ymin) * i / 4;
    s += '<line x1="' + SVL + '" y1="' + svgNum(mapY(gy, ymin, ymax)) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(mapY(gy, ymin, ymax)) + '" stroke="var(--border)" stroke-width="0.6"/>';
  }
  var y0 = mapY(Math.max(ymin, Math.min(ymax, 0)), ymin, ymax);
  var x0 = mapX(Math.max(xmin, Math.min(xmax, 0)), xmin, xmax);
  s += '<line x1="' + SVL + '" y1="' + svgNum(y0) + '" x2="' + (SVW - SVR) + '" y2="' + svgNum(y0) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  s += '<line x1="' + svgNum(x0) + '" y1="' + SVT + '" x2="' + svgNum(x0) + '" y2="' + (SVH - SVB) + '" stroke="var(--text3)" stroke-width="1.3"/>';
  for (i = 0; i < xticks.length; i++) {
    s += '<text x="' + svgNum(mapX(xticks[i].v, xmin, xmax)) + '" y="' + (SVH - SVB + 12) + '" font-size="8" fill="var(--text3)" text-anchor="middle">' + xticks[i].t + '</text>';
  }
  for (i = 0; i < yticks.length; i++) {
    s += '<text x="' + (SVL - 4) + '" y="' + svgNum(mapY(yticks[i].v, ymin, ymax) + 3) + '" font-size="8" fill="var(--text3)" text-anchor="end">' + yticks[i].t + '</text>';
  }
  s += '<text x="' + (SVW - SVR) + '" y="' + (SVH - 4) + '" font-size="8.5" fill="var(--text2)" text-anchor="end">' + xlab + '</text>';
  s += '<text x="2" y="10" font-size="8.5" fill="var(--text2)" text-anchor="start">' + ylab + '</text>';
  return s;
}
function svgOpen() {
  return '<svg viewBox="0 0 ' + SVW + ' ' + SVH + '" xmlns="http://www.w3.org/2000/svg" role="img">';
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 1 · el tablero de puntos
   Un solo dato del mes, colocado sobre el plano. El alumno mueve las dos
   coordenadas por separado y ve que el par ordenado no es un adorno: el
   primer numero dice cuanto se trabajo y el segundo como termino el mes.
   ════════════════════════════════════════════════════════════════════════ */
function widgetTablero(x0, y0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { x: x0, y: y0 };
  var XMIN = -400, XMAX = 1200, YMIN = -30000, YMAX = 30000;

  function render() {
    var es = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var px = mapX(state.x, XMIN, XMAX), py = mapY(state.y, YMIN, YMAX);
    var ox = mapX(0, XMIN, XMAX), oy = mapY(0, YMIN, YMAX);
    var cuad;
    if (state.x > 0 && state.y > 0)      cuad = es ? 'Cuadrante I' : 'Quadrant I';
    else if (state.x < 0 && state.y > 0) cuad = es ? 'Cuadrante II' : 'Quadrant II';
    else if (state.x < 0 && state.y < 0) cuad = es ? 'Cuadrante III' : 'Quadrant III';
    else if (state.x > 0 && state.y < 0) cuad = es ? 'Cuadrante IV' : 'Quadrant IV';
    else                                 cuad = es ? 'Sobre un eje' : 'On an axis';

    var xt = [{ v: XMIN, t: '−400' }, { v: 0, t: '0' }, { v: 600, t: '600' }, { v: XMAX, t: '1200' }];
    var yt = [{ v: YMIN, t: '−30 mil' }, { v: 0, t: '0' }, { v: YMAX, t: '30 mil' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'entregas del mes' : 'deliveries in the month',
      es ? 'resultado, $' : 'result, $', xt, yt);
    inner += '<text x="' + svgNum(ox + 6) + '" y="' + svgNum(SVT + 10) + '" font-size="8" fill="var(--text3)">I</text>';
    inner += '<text x="' + svgNum(ox - 12) + '" y="' + svgNum(SVT + 10) + '" font-size="8" fill="var(--text3)">II</text>';
    inner += '<text x="' + svgNum(ox - 14) + '" y="' + svgNum(SVH - SVB - 4) + '" font-size="8" fill="var(--text3)">III</text>';
    inner += '<text x="' + svgNum(ox + 6) + '" y="' + svgNum(SVH - SVB - 4) + '" font-size="8" fill="var(--text3)">IV</text>';
    inner += '<line x1="' + svgNum(px) + '" y1="' + svgNum(oy) + '" x2="' + svgNum(px) + '" y2="' + svgNum(py) + '" stroke="var(--gold)" stroke-width="1" stroke-dasharray="3 3"/>';
    inner += '<line x1="' + svgNum(ox) + '" y1="' + svgNum(py) + '" x2="' + svgNum(px) + '" y2="' + svgNum(py) + '" stroke="var(--gold)" stroke-width="1" stroke-dasharray="3 3"/>';
    inner += '<circle cx="' + svgNum(px) + '" cy="' + svgNum(py) + '" r="4.5" fill="var(--green)"/>';
    set('#w1svg', svgOpen() + inner + '</svg>');

    set('#w1xl', intN(state.x));
    set('#w1yl', money(state.y));
    set('#w1par', '(<span class="ec">' + intN(state.x) + '</span>, <span class="ev">' + money(state.y) + '</span>)');
    set('#w1cuad', cuad);
    set('#w1res', state.y === 0 ? (es ? 'en ceros' : 'break even') : (state.y > 0 ? (es ? 'ganancia' : 'profit') : (es ? 'pérdida' : 'loss')));

    var vd = host.querySelector('#w1verd');
    if (vd) {
      if (state.x < 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Un mes con entregas negativas no existe: el punto cayó fuera de la parte del plano donde vive el negocio.'
                            : 'A month with negative deliveries does not exist: the point fell outside the part of the plane where the business lives.';
      } else if (state.y < 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Hubo trabajo pero el mes cerró en rojo: por eso el punto queda por debajo del eje horizontal.'
                            : 'There was work but the month closed in the red: that is why the point sits below the horizontal axis.';
      } else if (state.y === 0) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'El punto está justo sobre el eje horizontal: el mes no dejó ganancia ni pérdida.'
                            : 'The point sits right on the horizontal axis: the month left neither profit nor loss.';
      } else {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Hubo trabajo y el mes cerró con ganancia: el punto queda por encima del eje horizontal.'
                            : 'There was work and the month closed with a profit: the point sits above the horizontal axis.';
      }
    }

    set('#w1read', state.x < 0
      ? (es
        ? '<strong>Lectura de negocio:</strong> el plano tiene cuatro cuadrantes, pero Transportes El Volcán solo puede aparecer en dos de ellos. Hacia la izquierda del eje vertical las entregas serían negativas, y eso no significa nada: no se puede desentregar un paquete. Los cuadrantes II y III existen en matemáticas y sirven para otros contextos, por ejemplo una temperatura bajo cero o un mes anterior a la apertura, pero en este tablero son terreno vacío. Regresa la primera coordenada a un valor positivo y observa que el punto vuelve a la mitad del plano donde el negocio sí ocurre.'
        : '<strong>Business reading:</strong> the plane has four quadrants, but Transportes El Volcán can only show up in two of them. To the left of the vertical axis the deliveries would be negative, and that means nothing: a parcel cannot be undelivered. Quadrants II and III exist in mathematics and serve other contexts, a temperature below zero or a month before opening for instance, but on this board they are empty ground. Bring the first coordinate back to a positive value and watch the point return to the half of the plane where the business actually happens.')
      : (es
        ? '<strong>Lectura de negocio:</strong> el par ordenado (' + intN(state.x) + ', ' + money(state.y) + ') resume un mes entero en dos números. El primero cuenta el trabajo hecho, ' + intN(state.x) + ' entregas, y se mide sobre el eje horizontal. El segundo cuenta cómo terminó la caja, ' + money(state.y) + ', y se mide sobre el eje vertical. El orden no es negociable: si se escriben al revés se está diciendo que el mes tuvo ' + money(state.x) + ' de resultado con ' + intN(state.y) + ' entregas, que es otra afirmación por completo. Mueve solo la segunda coordenada y verás que el punto sube o baja sin cambiar el volumen de trabajo: eso es exactamente lo que pasa cuando suben los costos con el mismo número de entregas.'
        : '<strong>Business reading:</strong> the ordered pair (' + intN(state.x) + ', ' + money(state.y) + ') sums up a whole month in two numbers. The first counts the work done, ' + intN(state.x) + ' deliveries, and is measured along the horizontal axis. The second counts how the till ended, ' + money(state.y) + ', and is measured along the vertical axis. The order is not negotiable: writing them the other way round says the month had a result of ' + money(state.x) + ' with ' + intN(state.y) + ' deliveries, which is an entirely different claim. Move only the second coordinate and the point rises or falls without the volume of work changing: that is exactly what happens when costs go up on the same number of deliveries.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="tablero-de-puntos">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Un mes entero convertido en un punto' : 'A whole month turned into a point') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'Transportes El Volcán anota cada mes en un tablero: hacia la derecha las entregas que se hicieron y hacia arriba el resultado en pesos. Mueve las dos coordenadas por separado y observa cómo se desplaza el punto. Vale la pena detenerse en tres lugares: encima del eje horizontal, debajo de él y justo sobre él. Prueba también a llevar las entregas a un valor negativo y pregúntate qué significaría eso para la empresa antes de leer el comentario de abajo.'
          : 'Transportes El Volcán records every month on a board: to the right the deliveries that were made and upwards the result in pesos. Move the two coordinates separately and watch the point travel. It is worth stopping at three places: above the horizontal axis, below it, and right on it. Try taking the deliveries to a negative value as well, and ask yourself what that would mean for the company before reading the comment below.') + '</div>' +
        '<div class="iw-expr" id="w1par"></div>' +
        '<div class="iw-note">' + (es ? 'Primero las entregas, después el resultado' : 'Deliveries first, result second') + '</div>' +
        '<div class="plane" id="w1svg"></div>' +
        '<div class="verdict" id="w1verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Primera coordenada, entregas del mes' : 'First coordinate, deliveries in the month') + ': <span class="cval" id="w1xl"></span></label>' +
          '<input type="range" min="-400" max="1200" step="20" id="w1x" value="' + state.x + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Segunda coordenada, resultado del mes' : 'Second coordinate, result of the month') + ': <span class="cval" id="w1yl"></span></label>' +
          '<input type="range" min="-30000" max="30000" step="1000" id="w1y" value="' + state.y + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Entregas' : 'Deliveries') + '</div><div class="mnum cs" id="w1xl2"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Dónde cae el punto' : 'Where the point falls') + '</div><div class="mnum ps" id="w1cuad"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Cómo cerró el mes' : 'How the month closed') + '</div><div class="mnum ts" id="w1res"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w1read"></div>' +
      '</div>';
    var xs = host.querySelector('#w1x'), ys = host.querySelector('#w1y');
    xs.addEventListener('input', function() { state.x = parseInt(xs.value, 10); render(); syncLabels(); });
    ys.addEventListener('input', function() { state.y = parseInt(ys.value, 10); render(); syncLabels(); });
    render(); syncLabels();
  }
  function syncLabels() {
    var e = host.querySelector('#w1xl2');
    if (e) e.innerHTML = intN(state.x);
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 2 · la recta del pago
   La ordenada al origen y la pendiente dejan de ser dos letras cuando se
   pueden mover por separado: una levanta la recta entera sin inclinarla y
   la otra la inclina sin moverla de donde arranca.
   ════════════════════════════════════════════════════════════════════════ */
function widgetRecta(b0, m0, x0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { b: b0, m: m0, x: x0 };
  var XMIN = 0, XMAX = 160;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var YMAX = 6000;
    var top  = state.b + state.m * XMAX;
    while (top > YMAX) YMAX += 2000;
    var YMIN = 0;
    var yAt  = function(x) { return state.b + state.m * x; };
    var x1 = state.x, x2 = Math.min(XMAX, state.x + 20);
    var xt = [{ v: 0, t: '0' }, { v: 40, t: '40' }, { v: 80, t: '80' }, { v: 120, t: '120' }, { v: 160, t: '160' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: intN(YMAX / 2) }, { v: YMAX, t: intN(YMAX) }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'entregas de la semana' : 'deliveries in the week',
      es ? 'pago, $' : 'pay, $', xt, yt);
    inner += '<line x1="' + svgNum(mapX(XMIN, XMIN, XMAX)) + '" y1="' + svgNum(mapY(yAt(XMIN), YMIN, YMAX)) +
             '" x2="' + svgNum(mapX(XMAX, XMIN, XMAX)) + '" y2="' + svgNum(mapY(yAt(XMAX), YMIN, YMAX)) +
             '" stroke="var(--green)" stroke-width="2.2"/>';
    inner += '<circle cx="' + svgNum(mapX(0, XMIN, XMAX)) + '" cy="' + svgNum(mapY(state.b, YMIN, YMAX)) + '" r="4" fill="var(--gold)"/>';
    if (x2 > x1) {
      inner += '<line x1="' + svgNum(mapX(x1, XMIN, XMAX)) + '" y1="' + svgNum(mapY(yAt(x1), YMIN, YMAX)) +
               '" x2="' + svgNum(mapX(x2, XMIN, XMAX)) + '" y2="' + svgNum(mapY(yAt(x1), YMIN, YMAX)) +
               '" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="4 3"/>';
      inner += '<line x1="' + svgNum(mapX(x2, XMIN, XMAX)) + '" y1="' + svgNum(mapY(yAt(x1), YMIN, YMAX)) +
               '" x2="' + svgNum(mapX(x2, XMIN, XMAX)) + '" y2="' + svgNum(mapY(yAt(x2), YMIN, YMAX)) +
               '" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="4 3"/>';
    }
    inner += '<circle cx="' + svgNum(mapX(x1, XMIN, XMAX)) + '" cy="' + svgNum(mapY(yAt(x1), YMIN, YMAX)) + '" r="4" fill="var(--green)"/>';
    set('#w2svg', svgOpen() + inner + '</svg>');

    set('#w2bl', money(state.b));
    set('#w2ml', money(state.m));
    set('#w2xl', intN(state.x));
    set('#w2eq', (es ? 'pago = ' : 'pay = ') +
      '<span class="ec">' + intN(state.b) + '</span> + <span class="ev">' + intN(state.m) + '</span>' +
      (es ? ' × entregas' : ' × deliveries'));
    set('#w2b0', money(state.b));
    set('#w2mm', money(state.m));
    set('#w2pay', money(yAt(state.x)));

    var vd = host.querySelector('#w2verd');
    if (vd) {
      if (state.m === 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Con pago por entrega en cero la recta queda horizontal: trabajar más no cambia el sueldo.'
                            : 'With zero pay per delivery the line is flat: working more does not change the pay.';
      } else {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Cada entrega adicional levanta el pago ' + money(state.m) + ', y ese salto constante es lo que hace que la gráfica sea una recta.'
                            : 'Every extra delivery lifts the pay by ' + money(state.m) + ', and that constant step is what makes the graph a straight line.';
      }
    }

    set('#w2read', state.m === 0
      ? (es
        ? '<strong>Lectura de negocio:</strong> con la pendiente en cero el repartidor cobra ' + money(state.b) + ' haga las entregas que haga. La recta se vuelve horizontal, que es la manera gráfica de decir que el pago no depende del trabajo. Esa forma de contratar existe, es el sueldo fijo, y tiene una consecuencia clara: la empresa carga con todo el riesgo del volumen. Sube la pendiente aunque sea un peso y observa que la recta se inclina de inmediato, porque desde ese momento parte del pago sí sigue al trabajo.'
        : '<strong>Business reading:</strong> with the slope at zero the driver is paid ' + money(state.b) + ' whatever deliveries are made. The line turns horizontal, which is the graphical way of saying that pay does not depend on work. That kind of contract exists, it is the fixed salary, and it has a clear consequence: the company carries all the volume risk. Raise the slope by even one peso and the line tilts at once, because from that moment part of the pay does follow the work.')
      : (es
        ? '<strong>Lectura de negocio:</strong> los dos números de la recta se leen por separado y significan cosas distintas. La ordenada al origen, ' + money(state.b) + ', es lo que cobra el repartidor en una semana sin una sola entrega, y en la gráfica es el punto dorado sobre el eje vertical. La pendiente, ' + money(state.m) + ', es lo que se agrega por cada entrega, y en la gráfica es la altura que gana el triángulo punteado al avanzar veinte entregas hacia la derecha, ' + money(state.m * 20) + ' repartidos entre esas veinte. Mueve solo la base y verás la recta subir entera sin inclinarse; mueve solo el pago por entrega y verás que gira sin despegarse del punto de arranque. Con ' + intN(state.x) + ' entregas el pago de la semana sale en ' + money(yAt(state.x)) + '.'
        : '<strong>Business reading:</strong> the two numbers of the line are read separately and mean different things. The intercept, ' + money(state.b) + ', is what the driver is paid in a week without a single delivery, and on the graph it is the golden point on the vertical axis. The slope, ' + money(state.m) + ', is what gets added for every delivery, and on the graph it is the height the dotted triangle gains over twenty deliveries to the right, ' + money(state.m * 20) + ' shared out over those twenty. Move only the base and the line rises whole without tilting; move only the pay per delivery and it turns without leaving its starting point. At ' + intN(state.x) + ' deliveries the pay for the week comes to ' + money(yAt(state.x)) + '.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="recta-pendiente-ordenada">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Dónde arranca la recta y cuánto sube' : 'Where the line starts and how fast it rises') + '</span></div>' +
        '<div class="iw-sub">' + (es

          : 'The drivers of Transportes El Volcán are paid a weekly base plus an amount for every delivery. Move the base first and notice that the line rises as a whole without changing its tilt. Then move the pay per delivery and watch the line turn while resting on its starting point. The dotted triangle measures how much the pay rises over twenty deliveries: compare its height with the pay per delivery and look for the relation between the two.') + '</div>' +
        '<div class="iw-expr" id="w2eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'recta del pago' : 'pay line') + '</span><span><i class="lg-out"></i>' + (es ? 'arranque y triángulo de pendiente' : 'start point and slope triangle') + '</span></div>' +
        '<div class="plane" id="w2svg"></div>' +
        '<div class="verdict" id="w2verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Base de la semana' : 'Base for the week') + ': <span class="cval" id="w2bl"></span></label>' +

        '</div><div class="cg">' +
          '<label>' + (es ? 'Pago por entrega' : 'Pay per delivery') + ': <span class="cval" id="w2ml"></span></label>' +
          '<input type="range" min="0" max="40" step="1" id="w2m" value="' + state.m + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Entregas de prueba' : 'Test deliveries') + ': <span class="cval" id="w2xl"></span></label>' +
          '<input type="range" min="0" max="160" step="4" id="w2x" value="' + state.x + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Lo que se lee en la gráfica' : 'What the graph shows') + '</label>' +
          '<div class="iw-note" style="text-align:left;margin:0">' + (es ? 'Punto dorado sobre el eje vertical: la base. Triángulo punteado: la pendiente.' : 'Golden point on the vertical axis: the base. Dotted triangle: the slope.') + '</div>' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Ordenada al origen' : 'Intercept') + '</div><div class="mnum ps" id="w2b0"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Pendiente por entrega' : 'Slope per delivery') + '</div><div class="mnum cs" id="w2mm"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Pago al volumen de prueba' : 'Pay at the test volume') + '</div><div class="mnum ts" id="w2pay"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w2read"></div>' +
      '</div>';
    var bs = host.querySelector('#w2b'), ms = host.querySelector('#w2m'), xs = host.querySelector('#w2x');
    bs.addEventListener('input', function() { state.b = parseInt(bs.value, 10); render(); });
    ms.addEventListener('input', function() { state.m = parseInt(ms.value, 10); render(); });
    xs.addEventListener('input', function() { state.x = parseInt(xs.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   WIDGET 3 · dos rectas sobre el mismo plano
   El ingreso arranca en el origen y el costo arranca arriba, en el gasto
   fijo. Donde se cruzan no hay ni ganancia ni perdida, y la distancia
   vertical entre las dos rectas es la utilidad del mes.
   ════════════════════════════════════════════════════════════════════════ */
function widgetCruce(p0, v0, F0, q0) {
  var host = document.createElement('div');
  host.className = 'section';
  document.getElementById('lessonBody').appendChild(host);
  var state = { p: p0, v: v0, F: F0, q: q0 };
  var XMIN = 0, XMAX = 1400;

  function render() {
    var es  = LANG === 'es';
    var set = function(id, html) { var e = host.querySelector(id); if (e) e.innerHTML = html; };
    var mg  = state.p - state.v;
    var be  = mg > 0 ? state.F / mg : null;
    var ing = function(q) { return state.p * q; };
    var cos = function(q) { return state.F + state.v * q; };
    var YMAX = 40000;
    var top  = Math.max(ing(XMAX), cos(XMAX));
    while (top > YMAX) YMAX += 40000;
    var YMIN = 0;
    var xt = [{ v: 0, t: '0' }, { v: 350, t: '350' }, { v: 700, t: '700' }, { v: 1050, t: '1050' }, { v: 1400, t: '1400' }];
    var yt = [{ v: 0, t: '0' }, { v: YMAX / 2, t: intN(YMAX / 2000) + ' mil' }, { v: YMAX, t: intN(YMAX / 1000) + ' mil' }];
    var inner = gridSvg(XMIN, XMAX, YMIN, YMAX,
      es ? 'entregas del mes' : 'deliveries in the month',
      es ? 'pesos' : 'pesos', xt, yt);
    inner += '<line x1="' + svgNum(mapX(0, XMIN, XMAX)) + '" y1="' + svgNum(mapY(ing(0), YMIN, YMAX)) +
             '" x2="' + svgNum(mapX(XMAX, XMIN, XMAX)) + '" y2="' + svgNum(mapY(ing(XMAX), YMIN, YMAX)) +
             '" stroke="var(--green)" stroke-width="2.2"/>';
    inner += '<line x1="' + svgNum(mapX(0, XMIN, XMAX)) + '" y1="' + svgNum(mapY(cos(0), YMIN, YMAX)) +
             '" x2="' + svgNum(mapX(XMAX, XMIN, XMAX)) + '" y2="' + svgNum(mapY(cos(XMAX), YMIN, YMAX)) +
             '" stroke="var(--gold)" stroke-width="2.2"/>';
    inner += '<line x1="' + svgNum(mapX(state.q, XMIN, XMAX)) + '" y1="' + svgNum(mapY(ing(state.q), YMIN, YMAX)) +
             '" x2="' + svgNum(mapX(state.q, XMIN, XMAX)) + '" y2="' + svgNum(mapY(cos(state.q), YMIN, YMAX)) +
             '" stroke="var(--text3)" stroke-width="1.4" stroke-dasharray="3 3"/>';
    if (be !== null && be <= XMAX) {
      inner += '<circle cx="' + svgNum(mapX(be, XMIN, XMAX)) + '" cy="' + svgNum(mapY(ing(be), YMIN, YMAX)) + '" r="4.5" fill="var(--text)"/>';
    }
    set('#w3svg', svgOpen() + inner + '</svg>');

    set('#w3pl', money(state.p));
    set('#w3vl', money(state.v));
    set('#w3Fl', money(state.F));
    set('#w3ql', intN(state.q));
    set('#w3mg', money(mg));
    set('#w3be', be === null ? (es ? 'no existe' : 'none') : intN(Math.ceil(be)));
    set('#w3ut', money(ing(state.q) - cos(state.q)));
    set('#w3eq', (es ? 'ingreso ' : 'revenue ') + '<span class="ec">' + intN(state.p) + 'q</span>' +
      '<span style="color:var(--text3)"> ' + (es ? 'contra' : 'against') + ' </span>' +
      (es ? 'costo ' : 'cost ') + '<span class="ev">' + intN(state.F) + ' + ' + intN(state.v) + 'q</span>');

    var vd = host.querySelector('#w3verd');
    if (vd) {
      var d = ing(state.q) - cos(state.q);
      if (mg <= 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'Con este precio la recta del ingreso nunca alcanza a la del costo: las dos rectas no se cruzan.'
                            : 'At this price the revenue line never catches the cost line: the two lines do not cross.';
      } else if (d === 0) {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'Las dos rectas se tocan justo aquí: el mes cierra sin ganancia y sin pérdida.'
                            : 'The two lines touch right here: the month closes with no profit and no loss.';
      } else if (d < 0) {
        vd.className = 'verdict v-bad';
        vd.textContent = es ? 'La recta del costo va por encima: a este volumen el mes cierra en rojo.'
                            : 'The cost line runs above: at this volume the month closes in the red.';
      } else {
        vd.className = 'verdict v-ok';
        vd.textContent = es ? 'La recta del ingreso va por encima: a este volumen el mes deja ganancia.'
                            : 'The revenue line runs above: at this volume the month leaves a profit.';
      }
    }

    set('#w3read', mg <= 0
      ? (es
        ? '<strong>Lectura de negocio:</strong> el precio de ' + money(state.p) + ' no llega a cubrir el costo variable de ' + money(state.v) + ', así que cada entrega agrega más costo que ingreso. La recta del costo sube más rápido que la del ingreso y las dos nunca se encuentran dentro del plano. Ningún volumen arregla eso: entregar más solo agranda el hueco, y esa es justamente la lectura que el dueño necesita. Sube el precio por encima del costo variable y verás aparecer el punto de cruce.'
        : '<strong>Business reading:</strong> the price of ' + money(state.p) + ' does not cover the variable cost of ' + money(state.v) + ', so every delivery adds more cost than revenue. The cost line rises faster than the revenue line and the two never meet inside the plane. No volume fixes that: delivering more only widens the gap, and that is exactly the reading the owner needs. Raise the price above the variable cost and the crossing point will appear.')
      : (es
        ? '<strong>Lectura de negocio:</strong> las dos rectas arrancan en lugares distintos. La del ingreso sale del origen, porque sin entregas no entra un peso. La del costo arranca en ' + money(state.F) + ', porque la renta del patio y los seguros se pagan aunque las camionetas no salgan. Como cada entrega deja ' + money(mg) + ' de margen, la distancia entre las dos se va cerrando hasta desaparecer en ' + intN(Math.ceil(be)) + ' entregas: ese punto negro es el equilibrio. A la izquierda de ese punto la recta dorada va arriba y el mes pierde; a la derecha va abajo y el mes gana. Con ' + intN(state.q) + ' entregas la distancia vertical entre las dos rectas es ' + money(ing(state.q) - cos(state.q)) + ', y esa distancia es exactamente el resultado del mes.'
        : '<strong>Business reading:</strong> the two lines start in different places. The revenue one leaves the origin, because without deliveries not a peso comes in. The cost one starts at ' + money(state.F) + ', because the yard rent and the insurance are paid even if the vans never leave. Since every delivery leaves ' + money(mg) + ' of margin, the distance between the two closes until it vanishes at ' + intN(Math.ceil(be)) + ' deliveries: that black point is the break even. To the left of it the golden line runs above and the month loses; to the right it runs below and the month gains. At ' + intN(state.q) + ' deliveries the vertical distance between the two lines is ' + money(ing(state.q) - cos(state.q)) + ', and that distance is exactly the result of the month.'));
  }

  function mount() {
    var es = LANG === 'es';
    host.innerHTML =
      '<div class="gcrd" data-widget="cruce-de-dos-rectas">' +
        '<div class="iw-head"><span class="iw-tag">' + (es ? 'Herramienta' : 'Tool') + '</span>' +
        '<span class="iw-title">' + (es ? 'Dos rectas en el mismo plano y el punto donde se cruzan' : 'Two lines on one plane and the point where they cross') + '</span></div>' +
        '<div class="iw-sub">' + (es
          ? 'La recta verde es el dinero que entra y la dorada el dinero que sale. Mueve el volumen de prueba y observa la línea punteada que une las dos rectas: su largo es el resultado del mes y su lado, arriba o abajo, dice si hubo ganancia o pérdida. Busca el volumen en el que la punteada desaparece y compáralo con el punto de equilibrio que aparece abajo. Después baja el precio hasta dejarlo por debajo del costo variable y observa qué le pasa al cruce.'
          : 'The green line is the money coming in and the golden one the money going out. Move the test volume and watch the dotted segment joining the two lines: its length is the result of the month and its side, above or below, tells whether there was a profit or a loss. Look for the volume at which the dotted segment vanishes and compare it with the break even figure shown below. Then lower the price until it sits under the variable cost and see what happens to the crossing point.') + '</div>' +
        '<div class="iw-expr" id="w3eq"></div>' +
        '<div class="plegend"><span><i class="lg-in"></i>' + (es ? 'ingreso' : 'revenue') + '</span><span><i class="lg-out"></i>' + (es ? 'costo total' : 'total cost') + '</span></div>' +
        '<div class="plane" id="w3svg"></div>' +
        '<div class="verdict" id="w3verd"></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Precio por entrega' : 'Price per delivery') + ': <span class="cval" id="w3pl"></span></label>' +
          '<input type="range" min="40" max="220" step="5" id="w3p" value="' + state.p + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Costo variable por entrega' : 'Variable cost per delivery') + ': <span class="cval" id="w3vl"></span></label>' +
          '<input type="range" min="20" max="140" step="5" id="w3v" value="' + state.v + '">' +
        '</div></div>' +
        '<div class="cgrid"><div class="cg">' +
          '<label>' + (es ? 'Gasto fijo del mes' : 'Fixed expense of the month') + ': <span class="cval" id="w3Fl"></span></label>' +
          '<input type="range" min="10000" max="80000" step="2000" id="w3F" value="' + state.F + '">' +
        '</div><div class="cg">' +
          '<label>' + (es ? 'Volumen de prueba' : 'Test volume') + ': <span class="cval" id="w3ql"></span></label>' +
          '<input type="range" min="0" max="1400" step="20" id="w3q" value="' + state.q + '">' +
        '</div></div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Margen por entrega' : 'Margin per delivery') + '</div><div class="mnum cs" id="w3mg"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Entregas de equilibrio' : 'Break even deliveries') + '</div><div class="mnum ps" id="w3be"></div></div>' +
          '<div class="metric"><div class="mlbl">' + (es ? 'Resultado al volumen de prueba' : 'Result at the test volume') + '</div><div class="mnum ts" id="w3ut"></div></div>' +
        '</div>' +
        '<div class="iw-read" id="w3read"></div>' +
      '</div>';
    var ps = host.querySelector('#w3p'), vs = host.querySelector('#w3v');
    var fs = host.querySelector('#w3F'), qs = host.querySelector('#w3q');
    ps.addEventListener('input', function() { state.p = parseInt(ps.value, 10); render(); });
    vs.addEventListener('input', function() { state.v = parseInt(vs.value, 10); render(); });
    fs.addEventListener('input', function() { state.F = parseInt(fs.value, 10); render(); });
    qs.addEventListener('input', function() { state.q = parseInt(qs.value, 10); render(); });
    render();
  }
  widgets.push(mount);
  mount();
}

/* ════════════════════════════════════════════════════════════════════════
   BUILD LESSON · concepto, herramienta, reactivos, y otra vez
   Todos los numeros salen del rng sembrado, de modo que dos alumnos nunca
   comparten una sola cifra y un mismo alumno nunca repite un intento.
   La guia entera sigue a un negocio: Transportes El Volcan, una empresa
   de reparto de Colima que mueve paquetes por la zona conurbada.
   ════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng) {
  problems = []; sectionDefs = []; widgets = [];
  document.getElementById('lessonBody').innerHTML = '';

  /* ── Concepto 1 · el plano y el par ordenado ── */
  var c1p  = pick([115, 130, 145], rng);
  var c1v  = pick([48, 56, 65], rng);

  var c1r1 = c1m * c1d1;
