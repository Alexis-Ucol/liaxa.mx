<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teselados y Relaciones entre Figuras Geométricas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── INTERACTIVE WIDGETS ── */
.iwrap { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:12px; padding:1.1rem 1.1rem 1.2rem; }
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.4rem; }
.iw-goal { font-size:.92rem; color:var(--text); font-weight:600; margin-bottom:.5rem; }
.iw-sub { font-size:.79rem; color:var(--text3); margin-bottom:.75rem; }
.ivcanvas { display:block; width:100%; height:250px; background:var(--surface); }
.iw-ctrl { display:flex; align-items:center; gap:.6rem; margin:.85rem 0 .5rem; }
.iw-ctrl input[type=range] { flex:1; accent-color:var(--green); min-height:34px; }
.iw-btn { min-width:44px; min-height:44px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text); border-radius:9px; font-size:1.05rem; font-weight:700; cursor:pointer; font-family:inherit; }
.iw-btn:hover { border-color:var(--green); color:var(--green); }
.iw-read { font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--green-dark); background:var(--green-bg); border-radius:8px; padding:.45rem .7rem; text-align:center; }
.rverify-btn { margin-top:.85rem; min-height:44px; padding:.55rem 1.25rem; border:none; border-radius:9px; background:var(--green); color:#fff; font-size:.86rem; font-weight:600; cursor:pointer; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.rfb { min-height:1.35rem; margin-top:.6rem; font-size:.85rem; color:var(--text2); }
.tl-list, .tsl-bins, .tsl-chips { display:flex; flex-wrap:wrap; gap:.5rem; margin:.75rem 0; }
.tl-list { flex-direction:column; }
.tl-chip { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .8rem; cursor:pointer; background:var(--surface2); font-size:.83rem; min-height:44px; display:flex; align-items:center; gap:.55rem; color:var(--text); }
.tl-chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.tl-chip.locked { cursor:default; }
.tl-num { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; }
.tsl-bin { border:1.5px solid var(--border); border-radius:9px; padding:.5rem .75rem; background:var(--surface2); color:var(--text); cursor:pointer; font-size:.8rem; font-family:inherit; min-height:44px; }
.tsl-bin:hover { border-color:var(--green); color:var(--green); }
.tsl-chip { border:1.5px solid var(--gold); background:var(--gold-bg); color:var(--text); border-radius:20px; padding:.4rem .85rem; font-size:.79rem; cursor:pointer; min-height:38px; display:flex; align-items:center; }
.tsl-chip.fixed { border-color:var(--green); background:var(--green-bg); cursor:default; }
.tsl-sum { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem; color:var(--green-dark); text-align:center; margin-top:.45rem; }
.reflect-prompt { font-size:.92rem; color:var(--text2); margin:.4rem 0 .85rem; }
.iw-pad { display:flex; flex-wrap:wrap; gap:.5rem; margin:.85rem 0 .5rem; }
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--text3); text-align:right; }
.cls-card { display:block; text-align:center; font-weight:600; font-size:.95rem; color:var(--text); background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.9rem .7rem; margin:.6rem 0; }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.7rem; font-size:1.05rem; }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--gold-bg); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ivcanvas { height: 230px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
  .iwrap { padding: .85rem .8rem 1rem; }
  .tsl-bin { font-size: .76rem; padding: .45rem .6rem; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from the rebrand step -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Teselados y Relaciones entre Figuras Geométricas</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 2A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Teselados y Relaciones entre Figuras Geométricas</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>

    var ta = document.getElementById('ta' + i);

}

  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  if (!tb) return;
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER: two-tap confirmation (Rule 6)
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm, used by restoreSession and setLang to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)

   GUIDE CONTENT: tessellation helpers, manipulatives and buildLesson

var WIDGET_REDRAW = [];
window.redrawWidgets = function(){ WIDGET_REDRAW.forEach(function(f){ try { f(); } catch(e){} }); };

function cssVar(n){ var v=''; try { v = getComputedStyle(document.documentElement).getPropertyValue(n); } catch(e){} return (v||'').trim(); }

function addSection(tag, title, html){
  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+html;
  document.getElementById('lessonBody').appendChild(d);
}

function shuffleOpts(opts, correct, rng){
  var a = opts.slice();
  for (var i = a.length-1; i > 0; i--){ var j = Math.floor(rng()*(i+1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return { opts:a, idx:a.indexOf(correct) };
}

function permOf(n, rng){
  var a = []; for (var i=0;i<n;i++) a.push(i);
  for (var k=a.length-1;k>0;k--){ var j=Math.floor(rng()*(k+1)); var tmp=a[k]; a[k]=a[j]; a[j]=tmp; }
  var sorted = true; for (var q=0;q<n;q++) if (a[q]!==q) sorted = false;
  if (sorted){ var s=a[0]; a[0]=a[n-1]; a[n-1]=s; }
  return a;
}

function fitCanvas(cv, hh){
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth || 320;
  cv.width = Math.round(w*dpr); cv.height = Math.round(hh*dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx:ctx, w:w, h:hh };
}

/* ── MANIPULATIVE 1: carry one tile onto its copy using slides, turns and flips ── */
function buildMovimientos(rng){
  var es = (LANG === 'es');
  var COLS = 4, ROWS = 2;
  var MOT = [[0.16,0.18],[0.86,0.34],[0.38,0.86]];
  var rounds = [];
  for (var q = 0; q < 3; q++){
    var g = { rot: Math.floor(rng()*4), flip: Math.floor(rng()*2), col: Math.floor(rng()*COLS), row: Math.floor(rng()*ROWS) };
    if (g.rot === 0 && g.flip === 0 && g.col === 0 && g.row === 0) g.col = 2;
    rounds.push(g);
  }
  var st = { r:0, rot:0, flip:0, col:0, row:0, tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap mvwrap section';
  wrap.setAttribute('data-widget', 'movimientos');
  wrap.id = 'movW';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Taller de movimientos':'Movement lab')+'</div>'+
    '<div class="iw-goal" id="mvGoal"></div>'+
    '<div class="iw-sub">'+(es?'La pieza verde es tuya y la punteada es la copia que ya está en el mosaico. Deslízala, gírala o refléjala hasta que las dos coincidan por completo.':'The green tile is yours and the dashed one is the copy already in the mosaic. Slide it, turn it or flip it until the two match exactly.')+'</div>'+
    '<div class="cvwrap"><canvas class="ivcanvas" id="mvCv"></canvas></div>'+
    '<div class="iw-pad">'+
      '<button class="iw-btn" onclick="mvMove(-1,0)">◀</button>'+
      '<button class="iw-btn" onclick="mvMove(1,0)">▶</button>'+
      '<button class="iw-btn" onclick="mvMove(0,-1)">▲</button>'+
      '<button class="iw-btn" onclick="mvMove(0,1)">▼</button>'+
      '<button class="tsl-bin" onclick="mvTurn()">'+(es?'↻ Girar 90°':'↻ Turn 90°')+'</button>'+
      '<button class="tsl-bin" onclick="mvFlip()">'+(es?'⇋ Reflejar':'⇋ Flip')+'</button>'+
    '</div>'+
    '<div class="iw-read" id="mvRead"></div>'+
    '<button class="rverify-btn" onclick="mvCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="mvFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function tp(p, flip, rot){
    var x = p[0], y = p[1];
    if (flip) x = 1 - x;
    for (var k=0;k<rot;k++){ var nx = 1 - y, ny = x; x = nx; y = ny; }
    return [x, y];
  }
  function piece(ctx, ox, oy, cs, flip, rot, fill, stroke, dashed){
    ctx.save();
    if (dashed) ctx.setLineDash([5,4]);
    ctx.beginPath();
    for (var i=0;i<MOT.length;i++){
      var p = tp(MOT[i], flip, rot);
      var X = ox + p[0]*cs, Y = oy + p[1]*cs;
      if (i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.setLineDash([]);
    var d = tp([0.30,0.34], flip, rot);
    ctx.beginPath(); ctx.arc(ox + d[0]*cs, oy + d[1]*cs, Math.max(3, cs*0.07), 0, Math.PI*2);
    ctx.fillStyle = stroke; ctx.fill();
    ctx.restore();
  }
  function draw(){
    var cv = document.getElementById('mvCv'); if (!cv) return;
    var f = fitCanvas(cv, cv.clientHeight || 250), ctx = f.ctx, w = f.w, hh = f.h;
    ctx.clearRect(0,0,w,hh);
    var cs = Math.min((w-14)/COLS, (hh-14)/ROWS);
    var gx = (w - cs*COLS)/2, gy = (hh - cs*ROWS)/2;
    var g = rounds[Math.min(st.r, rounds.length-1)];
    ctx.fillStyle = cssVar('--gold-bg');
    ctx.fillRect(gx + g.col*cs, gy + g.row*cs, cs, cs);
    ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = 1;
    for (var c=0;c<=COLS;c++){ ctx.beginPath(); ctx.moveTo(gx+c*cs, gy); ctx.lineTo(gx+c*cs, gy+ROWS*cs); ctx.stroke(); }
    for (var r2=0;r2<=ROWS;r2++){ ctx.beginPath(); ctx.moveTo(gx, gy+r2*cs); ctx.lineTo(gx+COLS*cs, gy+r2*cs); ctx.stroke(); }
    piece(ctx, gx+g.col*cs, gy+g.row*cs, cs, g.flip, g.rot, cssVar('--gold-bg'), cssVar('--gold'), true);
    piece(ctx, gx+st.col*cs, gy+st.row*cs, cs, st.flip, st.rot, cssVar('--green-bg'), cssVar('--green'), false);
  }
  WIDGET_REDRAW.push(draw);

  function readout(){
    var el = document.getElementById('mvRead'); if (!el) return;
    el.textContent = es
      ? 'Giro acumulado: ' + (st.rot*90) + '°    reflexión: ' + (st.flip ? 'sí' : 'no')
      : 'Total turn: ' + (st.rot*90) + '°    reflection: ' + (st.flip ? 'yes' : 'no');
  }
  function goalText(){
    var el = document.getElementById('mvGoal'); if (!el || st.r >= rounds.length) return;
    el.textContent = es
      ? 'Reto ' + (st.r+1) + ' de 3: lleva tu pieza hasta la copia punteada usando los movimientos.'
      : 'Challenge ' + (st.r+1) + ' of 3: carry your tile onto the dashed copy using the movements.';
  }
  function advance(ms){
    st.lock = true;
    setTimeout(function(){
      st.r++; st.tries = 0;
      var fb = document.getElementById('mvFb');
      if (st.r >= rounds.length){
        st.done = true;
        if (fb) fb.innerHTML = '<span style="color:var(--ok);font-weight:700">'+(es?'Ya puedes generar un mosaico completo repitiendo una sola pieza con estos tres movimientos.':'You can now generate a whole mosaic by repeating a single tile with these three movements.')+'</span>';
        return;
      }
      st.lock = false; st.rot = 0; st.flip = 0; st.col = 0; st.row = 0;
      if (fb) fb.textContent = '';
      goalText(); draw(); readout();
    }, ms);
  }

  window.mvMove = function(dc, dr){
    if (st.lock || st.done) return;
    st.col = Math.max(0, Math.min(COLS-1, st.col + dc));
    st.row = Math.max(0, Math.min(ROWS-1, st.row + dr));
    draw(); readout();
  };
  window.mvTurn = function(){ if (st.lock||st.done) return; st.rot = (st.rot+1) % 4; draw(); readout(); };
  window.mvFlip = function(){ if (st.lock||st.done) return; st.flip = st.flip ? 0 : 1; draw(); readout(); };
  window.mvCheck = function(){
    if (st.lock || st.done) return;
    var g = rounds[st.r], fb = document.getElementById('mvFb');
    var samePos = (st.col === g.col && st.row === g.row);
    var sameOri = (st.rot === g.rot && st.flip === g.flip);
    if (samePos && sameOri){
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700">🎉 '+(es
        ? '¡Las dos piezas coinciden! Por eso todas las copias de un mosaico son iguales entre sí.'
        : 'The two tiles match! That is why every copy in a mosaic is identical to the others.')+'</span>';
      advance(1600); return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.col = g.col; st.row = g.row; st.rot = g.rot; st.flip = g.flip;
      draw(); readout();
      fb.textContent = es
        ? 'Así queda: ' + (g.flip ? 'una reflexión, ' : 'sin reflexión, ') + 'un giro de ' + (g.rot*90) + '° y una traslación hasta esa casilla. Observa que la pieza nunca cambia de tamaño ni de forma.'
        : 'This is how it lands: ' + (g.flip ? 'a reflection, ' : 'no reflection, ') + 'a turn of ' + (g.rot*90) + '° and a slide to that cell. Notice the tile never changes size or shape.';
      advance(2800); return;
    }
    if (!samePos && sameOri){
      var dx = g.col - st.col, dy = g.row - st.row;
      fb.textContent = es
        ? 'La orientación ya es la correcta. Ahora solo deslízala: ' + (dx !== 0 ? Math.abs(dx) + (dx>0?' casilla(s) a la derecha':' casilla(s) a la izquierda') : '') + (dx !== 0 && dy !== 0 ? ' y ' : '') + (dy !== 0 ? Math.abs(dy) + (dy>0?' casilla(s) hacia abajo':' casilla(s) hacia arriba') : '') + '.'
        : 'The orientation is already right. Just slide it: ' + (dx !== 0 ? Math.abs(dx) + (dx>0?' cell(s) right':' cell(s) left') : '') + (dx !== 0 && dy !== 0 ? ' and ' : '') + (dy !== 0 ? Math.abs(dy) + (dy>0?' cell(s) down':' cell(s) up') : '') + '.';
      return;
    }
    if (samePos && st.flip !== g.flip){
      fb.textContent = es
        ? 'Está en la casilla correcta, pero el punto quedó del lado contrario: eso solo se arregla con una reflexión.'
        : 'It is on the right cell, but the dot ended up on the opposite side: only a reflection fixes that.';
      return;
    }
    if (samePos && st.rot !== g.rot){
      fb.textContent = es
        ? 'Está en la casilla correcta, pero apunta hacia otro lado: gírala y vuelve a verificar.'
        : 'It is on the right cell, but it points elsewhere: turn it and check again.';
      return;
    }
    fb.textContent = es
      ? 'Todavía no coincide. Ajusta primero el giro y la reflexión, y al final deslízala hasta la casilla marcada.'
      : 'Not a match yet. Set the turn and the reflection first, then slide it to the marked cell.';
  };

  goalText();
  setTimeout(function(){ draw(); readout(); }, 70);
}

/* ── MANIPULATIVE 2: rebuild the same hexagon out of smaller tiles ── */
function buildDescompone(rng){
  var es = (LANG === 'es');
  var PIECES = [
    { need:6, step:1, es:'triángulos equiláteros', en:'equilateral triangles', es1:'triángulo', en1:'triangle' },
    { need:3, step:2, es:'rombos', en:'rhombi', es1:'rombo', en1:'rhombus' },
    { need:2, step:3, es:'trapecios', en:'trapezoids', es1:'trapecio', en1:'trapezoid' }
  ];
  var rounds = shuffle(PIECES, rng);
  var st = { r:0, n:1, tries:0, lock:false, done:false };

  var wrap = document.createElement('div');
  wrap.className = 'iwrap dcwrap section';
  wrap.setAttribute('data-widget', 'descompone');
  wrap.id = 'descW';
  wrap.innerHTML =
    '<div class="iw-tag">'+(es?'Arma el hexágono':'Build the hexagon')+'</div>'+
    '<div class="iw-goal" id="dcGoal"></div>'+
    '<div class="iw-sub">'+(es?'Agrega o quita piezas y mira cómo se llena el hexágono. Si te pasas, las piezas de más aparecen encimadas.':'Add or remove tiles and watch the hexagon fill up. If you go over, the extra tiles show up piled on top.')+'</div>'+
    '<div class="cvwrap"><canvas class="ivcanvas" id="dcCv"></canvas></div>'+
    '<div class="iw-ctrl">'+
      '<button class="iw-btn" onclick="dcStep(-1)">−</button>'+
      '<input type="range" min="1" max="8" step="1" value="1" id="dcRange" oninput="dcSet(this.value)">'+
      '<button class="iw-btn" onclick="dcStep(1)">+</button>'+
    '</div>'+
    '<div class="iw-read" id="dcRead"></div>'+
    '<button class="rverify-btn" onclick="dcCheck()">'+(es?'Verificar':'Check')+'</button>'+
    '<div class="rfb" id="dcFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);

  function poly(ctx, pts, fill, stroke, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    for (var i=0;i<pts.length;i++){ if (i===0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]); }
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
  function draw(){
    var cv = document.getElementById('dcCv'); if (!cv) return;
    var f = fitCanvas(cv, cv.clientHeight || 250), ctx = f.ctx, w = f.w, hh = f.h;
    ctx.clearRect(0,0,w,hh);
    var g = rounds[Math.min(st.r, rounds.length-1)];
    var cx = w/2, cy = hh/2, R = Math.min(w, hh)/2 - 18;
    function V(i){ var a = (i%6)*Math.PI/3; return [cx + R*Math.cos(a), cy + R*Math.sin(a)]; }
    var hex = []; for (var v=0;v<6;v++) hex.push(V(v));
    poly(ctx, hex, cssVar('--surface2'), cssVar('--border'), 1);
    var cols = [cssVar('--green'), cssVar('--gold'), cssVar('--green-dark')];
    var placed = Math.min(st.n, g.need);
    for (var j=0;j<placed;j++){
      var pts = [[cx,cy]];
      for (var k=0;k<=g.step;k++) pts.push(V(j*g.step + k));
      poly(ctx, pts, cols[j % 3], cssVar('--surface'), 0.75);
    }
    var extra = st.n - g.need;
    for (var e=0;e<extra && e<g.need;e++){
      var pts2 = [[cx,cy]];
      for (var k2=0;k2<=g.step;k2++) pts2.push(V(e*g.step + k2));
      poly(ctx, pts2, cssVar('--bad'), cssVar('--bad'), 0.42);
    }
    ctx.strokeStyle = (st.n > g.need) ? cssVar('--bad') : cssVar('--green');
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (var m=0;m<6;m++){ var p = V(m); if (m===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }
    ctx.closePath(); ctx.stroke();
  }
  WIDGET_REDRAW.push(draw);

  function readout(){
    var el = document.getElementById('dcRead'); if (!el) return;
    var g = rounds[Math.min(st.r, rounds.length-1)];
    el.textContent = es
      ? 'Piezas colocadas: ' + st.n + '    equivalen a ' + (st.n*g.step) + ' de los 6 triángulos del hexágono'
      : 'Tiles placed: ' + st.n + '    equal to ' + (st.n*g.step) + ' of the 6 triangles in the hexagon';
  }
  function goalText(){
    var el = document.getElementById('dcGoal'); if (!el || st.r >= rounds.length) return;
    var g = rounds[st.r];
    el.textContent = es
      ? 'Reto ' + (st.r+1) + ' de 3: cubre el hexágono regular usando solo ' + g.es + ', sin huecos ni traslapes.'
      : 'Challenge ' + (st.r+1) + ' of 3: cover the regular hexagon using only ' + g.en + ', with no gaps and no overlaps.';
  }
  function advance(ms){
    st.lock = true;
    setTimeout(function(){
      st.r++; st.tries = 0;
      var fb = document.getElementById('dcFb');
      if (st.r >= rounds.length){
        st.done = true;
        if (fb) fb.innerHTML = '<span style="color:var(--ok);font-weight:700">'+(es?'Un mismo hexágono cabe en 6, en 3 o en 2 piezas: mientras más grande es la pieza, menos piezas necesitas.':'One and the same hexagon holds 6, 3 or 2 tiles: the bigger the tile, the fewer you need.')+'</span>';
        return;
      }
      st.lock = false; st.n = 1;
      var rg = document.getElementById('dcRange'); if (rg) rg.value = 1;
      if (fb) fb.textContent = '';
      goalText(); draw(); readout();
    }, ms);
  }

  window.dcSet = function(v){ if (st.lock||st.done) return; st.n = Math.max(1, Math.min(8, parseInt(v,10)||1)); draw(); readout(); };
  window.dcStep = function(d){
    if (st.lock||st.done) return;
    st.n = Math.max(1, Math.min(8, st.n + d));
    var rg = document.getElementById('dcRange'); if (rg) rg.value = st.n;
    draw(); readout();
  };
  window.dcCheck = function(){
    if (st.lock||st.done) return;
    var g = rounds[st.r], fb = document.getElementById('dcFb');
    if (st.n === g.need){
      fb.innerHTML = '<span style="color:var(--ok);font-weight:700">🎉 '+(es
        ? '¡Exacto! ' + g.need + ' ' + g.es + ' cubren el hexágono completo.'
        : 'Exactly! ' + g.need + ' ' + g.en + ' cover the whole hexagon.')+'</span>';
      advance(1700); return;
    }
    st.tries++;
    if (st.tries >= 3){
      st.n = g.need;
      var rg = document.getElementById('dcRange'); if (rg) rg.value = st.n;
      draw(); readout();
      fb.textContent = es
        ? 'Cada ' + g.es1 + ' ocupa el lugar de ' + g.step + ' de los 6 triángulos del hexágono, por eso caben ' + g.need + '.'
        : 'Each ' + g.en1 + ' takes the place of ' + g.step + ' of the 6 triangles in the hexagon, so ' + g.need + ' of them fit.';
      advance(2800); return;
    }
    fb.textContent = (st.n < g.need)
      ? (es ? 'Todavía queda hueco: falta cubrir ' + ((g.need-st.n)*g.step) + ' de los 6 triángulos. Agrega piezas.'
            : 'There is still a gap: ' + ((g.need-st.n)*g.step) + ' of the 6 triangles are uncovered. Add tiles.')
      : (es ? 'Te pasaste: sobran ' + (st.n-g.need) + ' pieza(s) y quedarían encimadas. Quita alguna.'
            : 'You went over: ' + (st.n-g.need) + ' extra tile(s) would pile on top. Remove some.');
  };

  goalText();
  setTimeout(function(){ draw(); readout(); }, 70);
}

        }).join('') +'</div>'+
      '<div class="rfb" id="clsFb"></div>';
  }
  function next(ms){
    st.lock = true;
    setTimeout(function(){

  };
  render();
}

/* ── graded problem builder: pushes and renders one card inline (Rule 1/5) ── */
function addProblem(rng, spec){
  var sh = shuffleOpts(spec.options, spec.correct, rng);
  problems.push({
    title: spec.title,
    questionText: spec.q,
    fn: '',
    options: sh.opts,
    correctIdx: sh.idx,
    hint: spec.hint,
    explanation: spec.exp,
    showWork: !!spec.showWork,
    studentChoice: null,
    pendingChoice: null
  });
  var idx = problems.length - 1;
  buildOneCard(problems[idx], idx);
}

    es
    ? '<p>Un teselado se ve complicado, pero casi siempre nace de una sola pieza que se repite. Lo interesante es la relación entre una pieza y su vecina: nunca es una figura nueva, es la misma figura llevada a otro lugar por un movimiento.</p>'+
      '<p>Los movimientos son tres. En la traslación la pieza se desliza en línea recta y conserva su orientación. En el giro la pieza rota alrededor de un punto, muchas veces el punto medio de un lado o un vértice del mosaico. En la reflexión la pieza se voltea respecto de una recta y queda como en un espejo.</p>'+
      '<div class="callout"><p><strong>Lo que nunca cambia:</strong> los tres movimientos conservan la forma y el tamaño. Por eso todas las piezas del mosaico son iguales entre sí y encajan sin huecos.</p></div>'

      '<p>There are three movements. In a translation the tile slides in a straight line and keeps its orientation. In a turn the tile rotates about a point, often the midpoint of a side or a vertex of the mosaic. In a reflection the tile is flipped across a line and ends up mirrored.</p>'+
      '<div class="callout"><p><strong>What never changes:</strong> all three movements preserve shape and size. That is why every tile in the mosaic is identical to the others and they fit with no gaps.</p></div>');

           o:['Una traslación','Una reflexión','Un giro de 90 grados','Un giro de 180 grados'], a:'Una traslación',
           h:'Fíjate en si la pieza cambió de orientación o solamente cambió de lugar.',

    { es:{ t:'La copia que queda en espejo', q:'Marisa coloca la segunda copia de su pieza al otro lado del lado que comparten, de modo que ese lado funciona como un espejo y la copia queda invertida de izquierda a derecha. ¿Qué movimiento aplicó?',
           o:['Una reflexión','Una traslación','Un giro de 90 grados','Un giro de 360 grados'], a:'Una reflexión',
           h:'Piensa cuál de los movimientos deja la pieza invertida de izquierda a derecha.',
           e:'Cuando la pieza queda invertida de izquierda a derecha respecto de una recta, el movimiento es una reflexión. Una traslación o un giro no invierten la pieza de ese modo.' },

           o:['Un giro de 180 grados','Una traslación','Una reflexión','Un giro de 90 grados'], a:'Un giro de 180 grados',

    { es:{ t:'El giro que deja igual al mosaico', q:'En un mosaico de triángulos equiláteros iguales, en cada vértice se juntan seis piezas. Si haces girar todo el mosaico alrededor de uno de esos vértices, ¿cuál es el giro más pequeño que deja el dibujo idéntico a como estaba?',

  ];
  var p2 = P2V[Math.floor(rng()*P2V.length)];
  addProblem(rng, { title:p2[LANG].t, q:p2[LANG].q, hint:p2[LANG].h, exp:p2[LANG].e, options:p2[LANG].o, correct:p2[LANG].a, showWork:true });

  /* ── CONCEPT 2 ───────────────────────────────────────────────── */
  addSection(C + '2',
    es ? 'Piezas que están hechas de otras piezas' : 'Tiles that are made of other tiles',
    (es
    ? '<p>En un mosaico las figuras no solo se acomodan una junto a otra: unas están hechas de otras. Si unes el centro de un hexágono regular con sus seis vértices, aparecen seis triángulos equiláteros iguales. Esa es la relación básica de casi todos los teselados que ves en pisos y azulejos.</p>'+
      '<p>A partir de ahí todo se encadena. Dos de esos triángulos juntos forman un rombo, tres forman un trapecio y los seis vuelven a formar el hexágono. Como las piezas se cubren exactamente, sus áreas se comparan contando triángulos: el rombo vale dos, el trapecio vale tres y el hexágono vale seis.</p>'
    : '<p>In a mosaic the figures do not only sit next to one another: some are made of others. If you join the centre of a regular hexagon to its six vertices, six equal equilateral triangles appear. That is the basic relation behind almost every tessellation you see on floors and tiles.</p>'+

  addSection(C + '3',
    es ? 'Cubrir el plano no es cosa solo de los regulares' : 'Covering the plane is not just for regular figures',
    es
    ? '<p>De los polígonos regulares, muy pocos cubren el plano ellos solos, porque su ángulo interior tiene que caber un número entero de veces en la vuelta. Pero si abandonas la regularidad, la cosa cambia por completo.</p>'+
      '<p>Cualquier triángulo, por raro que sea, cubre el plano. Sus tres ángulos suman media vuelta; al juntar cada ángulo dos veces alrededor de un mismo punto se completa la vuelta entera. Con los cuadriláteros pasa algo parecido: sus cuatro ángulos suman una vuelta completa, así que basta reunir en cada vértice las cuatro esquinas distintas de la pieza. El truco, en ambos casos, es el giro de media vuelta alrededor del punto medio de un lado.</p>'
    : '<p>Among regular polygons very few cover the plane on their own, because their interior angle must fit a whole number of times into the turn. But once you give up regularity, everything changes.</p>'+
      '<p>Any triangle, however odd, covers the plane. Its three angles add up to half a turn; bringing each angle twice around one point completes the whole turn. Something similar happens with quadrilaterals: their four angles add up to a full turn, so it is enough to gather the four different corners of the tile at each vertex. In both cases the trick is the half turn about the midpoint of a side.</p>');

    es
    ? '<p>Para dibujar un mosaico en el cuaderno hay que trazar primero la pieza, y ahí entran la regla y el compás. El dato de partida cambia el trazo: a veces te dan el radio de la circunferencia y a veces te dan directamente el lado de la figura.</p>'+

      '<div class="callout"><p><strong>Del trazo al mosaico:</strong> esos dos trazos dan las dos piezas más útiles. La red de triángulos equiláteros y la de hexágonos regulares son, en el fondo, el mismo dibujo visto de dos maneras.</p></div>'
    : '<p>To draw a mosaic in your notebook you first have to draw the tile, and that is where ruler and compass come in. The starting data changes the construction: sometimes you are given the radius of the circle and sometimes you are given the side of the figure directly.</p>'+
