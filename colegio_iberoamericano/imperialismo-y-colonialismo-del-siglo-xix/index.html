<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imperialismo y Colonialismo del Siglo XIX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Imperialismo y Colonialismo del Siglo XIX</div>
    <div class="wcourse" id="wcourse-el">Historia · 3° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Imperialismo y Colonialismo del Siglo XIX</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#243c84', primaryDark:'#111d43', primaryBg:'#e8ebf5',
  accent:'#e42424', accentBg:'#fbdfdf',
  darkPrimary:'#4e69bb', darkPrimaryDark:'#7d95dd', darkPrimaryBg:'#0f1936',

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'his3_t04_g04__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'his3_t04_g04__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'his3_t04_g04__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

    sy += 12;
  });

    var prob = problems[i];
    doc.addPage();
    var wy = 0;

    doc.setFillColor(pBR,pBG,pBB); doc.rect(0,0,PW,20,'F');
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,3,'F');
    doc.setTextColor(pAR,pAG,pAB); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(t('wcourse')+'  ·  '+t('wtitle'), M, 10);
    doc.setTextColor(232,238,247); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text('Problema '+(i+1)+' de '+total+'  ·  '+pdfText(prob.title), M, 17);
    wy = 25;

    var qRaw = pdfText(prob.questionText);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qLines = doc.splitTextToSize(qRaw, TW-10);
    var qBoxH  = 8 + qLines.length*5 + 3;
    doc.setFillColor(237,240,245); doc.roundedRect(M,wy,TW,qBoxH,2,2,'F');
    doc.setTextColor(pBR,pBG,pBB); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
    doc.text('PREGUNTA', M+4, wy+6);
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    var qy = wy+12;
    qLines.forEach(function(ln,li){ doc.text(ln, M+4, qy+li*5); });
    wy += qBoxH + 4;

    var isOk   = document.getElementById('pc'+i).classList.contains('ok');
    var chosen = prob.studentChoice != null ? pdfText(prob.options[prob.studentChoice]||'-') : '-';
    var corr   = pdfText(prob.options[prob.correctIdx]||'');
    var expRaw = pdfText(prob.explanation||'');
    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);
    doc.setFontSize(8);   var coLines = doc.splitTextToSize('Correcto: '+corr, TW-18);
    doc.setFontSize(7.5); var exLines = doc.splitTextToSize('Solución: '+expRaw, TW-18).slice(0,4);
    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;
    doc.setFillColor(isOk?232:255, isOk?240:232, isOk?232:228);
    doc.roundedRect(M,wy,TW,ansBoxH,2,2,'F');
    doc.setFillColor(isOk?26:176, isOk?106:48, isOk?74:16);
    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;
    doc.setTextColor(20,24,32); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    chLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5.5); });
    ay += chLines.length*5.5 + 3;
    doc.setTextColor(26,106,74); doc.setFontSize(8); doc.setFont('helvetica','normal');
    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    wy += ansBoxH + 5;

    doc.setFillColor(pBR,pBG,pBB); doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.rect(M,wy,TW,8,'F'); doc.text('TRABAJO DEL ALUMNO', M+4, wy+5.5);
    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});
  }

  doc.save('his3_t04_g04_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');
  btn.innerHTML = '⬇ &nbsp;Descargar Resultados PDF';
  btn.disabled  = false;
}

var MANIP = {};
function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function pickVariant(list, rng){ return list[Math.floor(rng()*list.length)]; }
function pickSome(pool, n, rng){
  var rest = pool.slice(), out = [];
  while (out.length < n && rest.length) out.push(rest.splice(Math.floor(rng()*rest.length),1)[0]);
  return out;
}

function d_pick(i){
  var D = MANIP.d;
  if (D.revealed) return;
  D.sel = (D.sel === i) ? null : i; D.bad = null;
  D.msg = D.sel === null ? { es:'Soltaste la pieza. Toma otra cuando quieras.', en:'You put the piece down. Pick up another whenever you want.' }
                         : { es:'Pieza tomada. Ahora toca el platillo que le corresponde.', en:'Piece picked up. Now tap the pan it belongs to.' };
  d_render();
}
function d_back(i){
  var D = MANIP.d;
  if (D.revealed) return;
  D.placed[i] = null; D.sel = null; D.bad = null;
  D.msg = { es:'Regresaste una pieza. Mira cómo la barra vuelve a moverse.', en:'You returned a piece. Watch how the bar moves again.' };
  d_render();
}
function d_drop(p){
  var D = MANIP.d;
  if (D.revealed || D.sel === null) return;
  D.placed[D.sel] = p; D.sel = null; D.bad = null;
  var left = D.placed.filter(function(x){ return x === null; }).length;
  var s = d_weights();
  D.msg = left > 0
    ? { es:'Colocada: ' + L(d_tiltmsg(s)) + '. Te quedan ' + left + ' piezas.', en:'Placed: ' + L(d_tiltmsg(s)) + '. You have ' + left + ' pieces left.' }
    : { es:'Circuito completo y ' + L(d_tiltmsg(s)) + '. Comprueba si cada pieza quedó del lado correcto.', en:'Circuit complete and ' + L(d_tiltmsg(s)) + '. Check whether each piece landed on the right side.' };
  d_render();
}
function d_clear(){
  var D = MANIP.d;
  if (D.revealed) return;
  D.placed = D.placed.map(function(){ return null; });
  D.sel = null; D.bad = null;
  D.msg = { es:'Platillos vacíos y barra nivelada. Vuelve a repartir las piezas.', en:'Empty pans and level bar. Distribute the pieces again.' };
  d_render();
}
function d_reveal(){
  var D = MANIP.d, st = d_case(), i;
  D.revealed = true;
  for (i = 0; i < st.cards.length; i++) D.placed[i] = st.cards[i].k;
  D.bad = null;
  D.msg = { es:'Así queda el circuito. ' + st.close.es, en:'This is how the circuit stands. ' + st.close.en };
  d_render();
  setFB('dfb', L(D.msg), 'warn');
  setTimeout(d_advance, 4400);
}
function d_advance(){
  var D = MANIP.d;
  D.round++;
  if (D.round >= 3) { D.done = true; d_render(); return; }
  D.placed = d_case().cards.map(function(){ return null; });
  D.ord = shuffleIdx(d_case().cards.length, D.rng);
  D.sel = null; D.tries = 0; D.revealed = false; D.bad = null;
  D.msg = { es:'Circuito nuevo. Empieza por la pieza que tengas más clara.', en:'New circuit. Start with the piece you are clearest about.' };
  d_render();
}
function d_check(){
  var D = MANIP.d, st = d_case(), i, wrong = [];
  if (D.revealed) return;
  for (i = 0; i < st.cards.length; i++) {
    if (D.placed[i] === null) {
      D.msg = { es:'Todavía hay piezas fuera de los platillos. Coloca las seis antes de comprobar.', en:'There are still pieces outside the pans. Place all six before checking.' };
      D.bad = null; d_render(); setFB('dfb', L(D.msg), 'warn'); return;
    }
  }
  for (i = 0; i < st.cards.length; i++) if (D.placed[i] !== st.cards[i].k) wrong.push(i);
  if (!wrong.length) {
    D.revealed = true;
    D.msg = { es:'Circuito correcto. ' + st.close.es, en:'Correct circuit. ' + st.close.en };
    d_render(); setFB('dfb', L(D.msg), 'ok');
    setTimeout(d_advance, 3800);
    return;
  }
  D.tries++;
  if (D.tries >= 3) { d_reveal(); return; }
  var w = wrong[0];
  D.bad = wrong.slice();
  D.msg = { es:st.cards[w].nudge.es + ' Esa pieza regresa al montón. Te quedan ' + (3 - D.tries) + ' intentos.',
            en:st.cards[w].nudge.en + ' That piece goes back to the pile. You have ' + (3 - D.tries) + ' tries left.' };
  d_render();
  setFB('dfb', L(D.msg), 'bad');
  setTimeout(function(){ if (!D.revealed) { D.placed[w] = null; D.bad = null; d_render(); setFB('dfb', L(D.msg), 'bad'); } }, 1000);
}

/* ════════════════════════════════════════════════
   buildLesson :: concepto, manipulable, problema
   ════════════════════════════════════════════════ */
function buildLesson(rng) {
  injectManipStyles();

  /* ── PUNTO DE PARTIDA ───────────────────────── */
  addSection(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Un mapa que cambia en cuarenta años', en:'A map that changes in forty years' }),
    '<p>' + L({ es:'Un atlas de 1870 muestra en África puertos europeos, algunas islas y franjas de costa; el interior aparece dibujado a medias. Un atlas de 1914 muestra el mismo continente cubierto de colores, repartido entre siete potencias europeas, con solo dos Estados independientes. En el sur y el sudeste de Asia y en las islas del Pacífico ocurrió algo semejante. Ese vuelco cabe dentro de la vida de una persona.',
               en:'An atlas from 1870 shows European ports in Africa, a few islands and strips of coast; the interior appears half drawn. An atlas from 1914 shows the same continent covered in colours, divided among seven European powers, with only two independent States. In South and Southeast Asia and in the Pacific islands something similar happened. That upheaval fits inside one person lifetime.' }) + '</p>' +
    '<p>' + L({ es:'A ese proceso lo llamamos imperialismo cuando pensamos en la relación de dominio que una potencia establece sobre territorios y pueblos ajenos, y colonialismo cuando pensamos en la forma concreta que toma allí ese dominio: quién gobierna, quién cobra, quién decide qué se produce. No son sinónimos, y distinguirlos ayuda a leer los mapas con más cuidado, porque en muchos lugares hubo dominio sin colonia.',
               en:'We call that process imperialism when we think of the relation of domination a power establishes over territories and peoples that are not its own, and colonialism when we think of the concrete form that domination takes there: who governs, who collects taxes, who decides what is produced. They are not synonyms, and telling them apart helps to read the maps more carefully, because in many places there was domination without a colony.' }) + '</p>' +
    '<p>' + L({ es:'En esta guía vas a hacer cuatro cosas: distinguir los grados de dominio, armar explicaciones completas de por qué ocurrió justo entonces, recorrer el calendario de la carrera colonial y seguir el circuito económico que unía a la colonia con la metrópoli. Al final tendrás que sostener una explicación propia, y para eso conviene tener presente una idea desde ahora: ningún factor aislado alcanza para explicar lo que pasó.',
               en:'In this guide you will do four things: tell apart the degrees of domination, build complete explanations of why it happened just then, travel along the calendar of the colonial race and follow the economic circuit that linked colony and metropolis. At the end you will have to hold an explanation of your own, and for that it helps to keep one idea in mind from now on: no isolated factor is enough to explain what happened.' }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Pregunta guía: ', en:'Guiding question: ' }) + '</strong>' + L({ es:'los productos de África y de Asia interesaban a Europa desde el siglo XVI. La pregunta que sostiene toda la guía no es solo por qué hubo reparto, sino por qué ocurrió entre 1870 y 1914 y no dos siglos antes.',
                                                                                                                          en:'The products of Africa and Asia had interested Europe since the 16th century. The question that holds the whole guide is not only why there was a partition, but why it happened between 1870 and 1914 and not two centuries earlier.' }) + '</p></div>'
  );

  /* ── CONCEPTO 1 :: GRADOS DE DOMINIO ────────── */
  addSection(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Dominar no siempre fue gobernar', en:'To dominate was not always to govern' }),
    '<p>' + L({ es:'Pintar de un color un territorio en el mapa esconde diferencias importantes. Ocupar un territorio, administrarlo y pagar sus gastos costaba mucho dinero, así que las potencias solo lo hacían cuando les convenía o cuando no encontraban otra manera de asegurar lo que buscaban. Cuando bastaba con controlar las decisiones que les importaban, se quedaban con eso y dejaban el resto en manos locales.',
               en:'Painting a territory one colour on the map hides important differences. Occupying a territory, administering it and paying its costs was expensive, so the powers only did it when it suited them or when they found no other way of securing what they were after. When controlling the decisions that mattered to them was enough, they kept to that and left the rest in local hands.' }) + '</p>' +
    '<p>' + L({ es:'Por eso conviene pensar el dominio como una escala. En un extremo está el Estado que decide en su casa y trata con quien quiere. En el otro, el territorio gobernado por funcionarios enviados desde Europa. Entre los dos hay fórmulas intermedias que fueron, de hecho, las más frecuentes.',
               en:'That is why it helps to think of domination as a scale. At one end stands the State that decides in its own house and deals with whoever it wishes. At the other, the territory governed by officials sent from Europe. Between the two lie intermediate formulas that were, in fact, the most frequent.' }) + '</p>' +
    '<table class="dtable"><tr><th>' + L({ es:'Fórmula', en:'Formula' }) + '</th><th>' + L({ es:'Quién decide en el territorio', en:'Who decides in the territory' }) + '</th></tr>' +
    '<tr><td>' + L({ es:'Colonia de administración directa', en:'Colony under direct administration' }) + '</td><td>' + L({ es:'funcionarios nombrados en la metrópoli sustituyen a las autoridades locales y responden ante ella', en:'officials appointed in the metropolis replace the local authorities and answer to it' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Protectorado', en:'Protectorate' }) + '</td><td>' + L({ es:'el soberano local conserva su cargo, pero un residente europeo decide defensa, finanzas y política exterior', en:'the local sovereign keeps the office, but a European resident decides defence, finances and foreign policy' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Esfera de influencia', en:'Sphere of influence' }) + '</td><td>' + L({ es:'no hay ocupación ni funcionarios, pero las demás potencias aceptan que solo una invierta y comercie allí', en:'there is no occupation and no officials, but the other powers accept that only one invests and trades there' }) + '</td></tr>' +
    '<tr><td>' + L({ es:'Concesión a una compañía', en:'Concession to a company' }) + '</td><td>' + L({ es:'una empresa privada administra, cobra y explota el territorio con permiso del Estado que la autoriza', en:'a private firm administers, collects and exploits the territory with permission from the State that authorizes it' }) + '</td></tr></table>' +
    '<p>' + L({ es:'La India británica después de 1858 fue una colonia de administración directa; Marruecos desde 1912 y Egipto en la práctica desde 1882, protectorados; China después de 1897 quedó dividida en esferas de influencia sin dejar de tener gobierno propio; y la cuenca del Congo se administró durante años mediante una concesión. Cuatro situaciones muy distintas caben bajo la misma palabra.',
               en:'British India after 1858 was a colony under direct administration; Morocco from 1912 and Egypt in practice from 1882, protectorates; China after 1897 was divided into spheres of influence without ceasing to have its own government; and the Congo basin was administered for years through a concession. Four very different situations fit under the same word.' }) + '</p>' +
    '<div class="mzone" id="aZone"></div>'
  );
  MANIP.a = { order:pickSome([0,1,2,3,4], 5, rng), round:0, sw:[0,0,0], tries:0, revealed:false, done:false,
    msg:{ es:'Lee el caso y empieza por preguntarte quién gobierna día a día ese territorio.', en:'Read the case and start by asking yourself who governs that territory day to day.' } };
  a_render();

  useVariant(pickVariant(V1(), rng), rng);
  useVariant(pickVariant(V2(), rng), rng);

  /* ── CONCEPTO 2 :: POR QUÉ JUSTO ENTONCES ───── */
  addSection(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Motivo, medio y ocasión', en:'Motive, means and occasion' }),
    '<p>' + L({ es:'Una explicación histórica completa suele necesitar tres piezas. El motivo responde por qué alguien quiso hacer algo. El medio responde con qué pudo hacerlo. La ocasión responde por qué lo hizo en ese momento y no en otro. Cuando falta una pieza, la explicación se tambalea: decir que Europa quería materias primas no basta, porque las quería también dos siglos antes.',
               en:'A complete historical explanation usually needs three pieces. The motive answers why someone wanted to do something. The means answers with what they could do it. The occasion answers why they did it at that moment and not at another. When a piece is missing the explanation wobbles: saying that Europe wanted raw materials is not enough, because it wanted them two centuries earlier as well.' }) + '</p>' +
    '<p>' + L({ es:'Los motivos de estas décadas fueron sobre todo económicos y políticos. La segunda industrialización, con el acero, la química y la electricidad, multiplicó la capacidad de producir; entre 1873 y 1896 los precios industriales cayeron año tras año, las ganancias se estrecharon y las empresas buscaron mercados y materias primas fuera del continente, mientras los bancos colocaban capital en ferrocarriles, minas y puertos lejanos. A la vez, Italia y Alemania culminaron su unificación hacia 1870 y quisieron ser tratadas como grandes potencias, lo que convirtió el mapa en un tablero de prestigio.',
               en:'The motives of these decades were above all economic and political. The second industrialization, with steel, chemistry and electricity, multiplied productive capacity; between 1873 and 1896 industrial prices fell year after year, profits narrowed and firms looked for markets and raw materials outside the continent, while banks placed capital in distant railways, mines and ports. At the same time Italy and Germany completed their unification around 1870 and wanted to be treated as great powers, which turned the map into a board of prestige.' }) + '</p>' +
    '<p>' + L({ es:'Los medios llegaron casi al mismo tiempo. El barco de vapor con casco de hierro remontaba ríos contra la corriente, el ferrocarril sacaba la carga del interior, el cable telegráfico submarino permitía mandar una orden y recibir respuesta el mismo día, y el uso preventivo de la quinina redujo de forma drástica las bajas europeas por malaria. Ninguna de esas herramientas ordenó ocupar nada: lo que hicieron fue abaratar una empresa que antes resultaba ruinosa.',
               en:'The means arrived almost at the same time. The iron hulled steamship went up rivers against the current, the railway carried cargo out of the interior, the underwater telegraph cable made it possible to send an order and get an answer the same day, and the preventive use of quinine sharply cut European losses from malaria. None of those tools ordered anyone to occupy anything: what they did was make cheap an enterprise that had been ruinous.' }) + '</p>' +
    '<div class="srcbox">' + L({ es:'Criterio de análisis: pregunta a cada dato si ofrece una razón para querer el territorio o la capacidad para tomarlo. La primera respuesta señala un motivo; la segunda, una condición de posibilidad.',
                                 en:'Analytical criterion: ask of each piece of information whether it offers a reason to want the territory or the ability to take it. The first answer points to a motive; the second, to a condition of possibility.' }) + '<span class="srcref">' + L({ es:'Criterio usado en esta guía', en:'Criterion used in this guide' }) + '</span></div>' +
    '<div class="mzone" id="bZone"></div>'
  );
  MANIP.b = { rng:rng, order:pickSome([0,1,2], 3, rng), round:0, sel:[null,null,null],
    ord:[shuffleIdx(4, rng), shuffleIdx(4, rng), shuffleIdx(4, rng)], tries:0, revealed:false, miss:null, done:false,
    msg:{ es:'Empieza por la columna que tengas más clara y observa cómo se va escribiendo la frase.', en:'Start with the column you are clearest about and watch the sentence write itself.' } };
  b_render();

  useVariant(pickVariant(V3(), rng), rng);
  useVariant(pickVariant(V4(), rng), rng);

  /* ── CONCEPTO 3 :: EL CALENDARIO DE LA CARRERA ── */
  addSection(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'El calendario de la carrera', en:'The calendar of the race' }),
    '<p>' + L({ es:'La expansión no avanzó a ritmo constante. Durante la primera mitad del siglo XIX hubo movimientos aislados: Francia inició la ocupación de Argelia en 1830 y, tras la rebelión de 1857, el gobierno de Londres asumió en 1858 la administración directa de la India. El interior africano seguía casi intacto para los europeos, que comerciaban en la costa.',
               en:'Expansion did not advance at a constant pace. During the first half of the 19th century there were isolated movements: France began the occupation of Algeria in 1830 and, after the rebellion of 1857, the government in London took over the direct administration of India in 1858. The African interior remained almost untouched by Europeans, who traded on the coast.' }) + '</p>' +
    '<p>' + L({ es:'Después las fechas se apretaron. En 1869 abrió el canal de Suez. En 1876 Leopoldo II organizó una asociación para explorar y ocupar la cuenca del Congo. En 1882 tropas británicas entraron en Egipto. Entre noviembre de 1884 y febrero de 1885 catorce delegaciones europeas se reunieron en Berlín, sin ninguna autoridad africana presente, y acordaron la libre navegación por el Congo y el Níger junto con la regla que las potencias usarían para reconocerse mutuamente las reclamaciones. Desde entonces ninguna quiso llegar tarde.',
               en:'Then the dates crowded together. In 1869 the Suez canal opened. In 1876 Leopold II organized an association to explore and occupy the Congo basin. In 1882 British troops entered Egypt. Between November 1884 and February 1885 fourteen European delegations met in Berlin, with no African authority present, and agreed on free navigation of the Congo and the Niger together with the rule the powers would use to recognize one another claims. From then on none of them wanted to arrive late.' }) + '</p>' +
    '<p>' + L({ es:'Los años finales muestran hasta dónde llegó la tensión. En 1896 Etiopía derrotó en Adua al ejército italiano y conservó su independencia. En 1898 una columna francesa y otra británica se encontraron frente a frente en Fachoda, sobre el Nilo, y la crisis se resolvió por vía diplomática. En 1900 la rebelión de los bóxers enfrentó a las potencias con una amplia resistencia en China. En 1905 y en 1911 Alemania y Francia chocaron por Marruecos con las flotas movilizadas. La carrera colonial estaba tensando el sistema europeo entero.',
               en:'The final years show how far the tension went. In 1896 Ethiopia defeated the Italian army at Adwa and kept its independence. In 1898 a French column and a British one came face to face at Fashoda, on the Nile, and the crisis was settled by diplomacy. In 1900 the Boxer rebellion confronted the powers with a broad resistance in China. In 1905 and in 1911 Germany and France clashed over Morocco with their fleets mobilized. The colonial race was straining the whole European system.' }) + '</p>' +
    '<div class="mzone" id="cZone"></div>'
  );
  MANIP.c = { order:pickSome([0,1,2,3,4], 5, rng), round:0, y:1800, tries:0, revealed:false, done:false,
    msg:{ es:'Mueve la aguja y observa cómo responden la barra y el hecho que aparece debajo.', en:'Move the needle and watch how the bar and the event shown below respond.' } };
  c_render();

  useVariant(pickVariant(V5(), rng), rng);
  useVariant(pickVariant(V6(), rng), rng);

  /* ── CONCEPTO 4 :: EL CIRCUITO COLONIAL ─────── */
  addSection(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Cómo funcionaba por dentro una colonia', en:'How a colony worked from the inside' }),
    '<p>' + L({ es:'Una vez instalado el dominio, la economía del territorio se reorganizó en función de la metrópoli. La colonia se especializó en uno o dos productos sin elaborar, caucho, algodón, cacao, minerales, que salían por el puerto; a cambio recibía manufacturas fabricadas en Europa. Los ferrocarriles se trazaron de la mina o la plantación al puerto, y no entre las regiones del territorio. Los impuestos locales pagaban la administración y las tropas que sostenían ese orden.',
               en:'Once domination was in place, the economy of the territory was reorganized around the metropolis. The colony specialized in one or two unprocessed products, rubber, cotton, cocoa, minerals, which left through the port; in exchange it received manufactures made in Europe. The railways were laid from the mine or the plantation to the port, and not between the regions of the territory. Local taxes paid for the administration and the troops that held that order in place.' }) + '</p>' +
    '<p>' + L({ es:'Ese orden se justificó en Europa con un conjunto de ideas que hoy es necesario examinar con cuidado. La principal fue el llamado darwinismo social, que tomaba conceptos de la biología sobre la competencia entre especies y los aplicaba a las sociedades humanas para ordenarlas en una escala; de allí salió la idea de una misión civilizadora, difundida por la prensa, las exposiciones universales y los relatos de exploradores. Hoy sabemos que esas jerarquías entre pueblos no tienen ninguna base científica.',
               en:'That order was justified in Europe with a set of ideas that today needs careful examination. The main one was so called social darwinism, which took concepts from biology about competition between species and applied them to human societies in order to rank them on a scale; from there came the idea of a civilizing mission, spread by the press, the world fairs and the accounts of explorers. Today we know that those hierarchies between peoples have no scientific basis at all.' }) + '</p>' +
    '<p>' + L({ es:'Tampoco fue un proceso aceptado sin más. Hubo resistencia organizada en casi todo el continente y en Asia, desde los ejércitos que enfrentaron a las columnas europeas hasta las revueltas contra los impuestos y el trabajo obligatorio. En los parlamentos europeos hubo diputados que denunciaron el costo humano de las campañas, y a comienzos del siglo XX una amplia campaña internacional documentó el trabajo forzado impuesto a la población del Congo y obligó a cambiar su administración.',
               en:'Nor was it a process simply accepted. There was organized resistance across almost the whole continent and in Asia, from the armies that faced the European columns to the revolts against taxes and compulsory labour. In European parliaments there were members who denounced the human cost of the campaigns, and in the early 20th century a broad international campaign documented the forced labour imposed on the population of the Congo and forced a change in its administration.' }) + '</p>' +
    '<div class="mzone" id="dZone"></div>'
  );
  MANIP.d = { rng:rng, order:pickSome([0,1,2], 3, rng), round:0, placed:[null,null,null,null,null,null],
    ord:shuffleIdx(6, rng), sel:null, tries:0, revealed:false, bad:null, done:false,
    msg:{ es:'Empieza por la pieza que tengas más clara y mira hacia dónde se inclina la barra.', en:'Start with the piece you are clearest about and watch which way the bar tips.' } };
  d_render();

  useVariant(pickVariant(V7(), rng), rng);
  useVariant(pickVariant(V8(), rng), rng);

  /* ── CIERRE ─────────────────────────────────── */
  addSection(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Piensa como historiador', en:'Think like a historian' }),
    '<p>' + L({ es:'Ya tienes los grados de dominio, la diferencia entre motivo, medio y ocasión, el calendario de la carrera y el circuito económico que unía a la colonia con la metrópoli. Las últimas preguntas no buscan un dato suelto: piden que uses todo eso junto para juzgar afirmaciones sobre el periodo y para decidir qué explicación se sostiene mejor.',
               en:'You now have the degrees of domination, the difference between motive, means and occasion, the calendar of the race and the economic circuit that linked colony and metropolis. The last questions do not ask for a loose fact: they ask you to use all of that together to judge statements about the period and to decide which explanation holds up best.' }) + '</p>'
  );

  useVariant(pickVariant(V9(), rng), rng);
  useVariant(pickVariant(V10(), rng), rng);
}
</script>
</body>
</html>
