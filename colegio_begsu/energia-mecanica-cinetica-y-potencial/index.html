<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energía Mecánica: Cinética y Potencial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Energía Mecánica: Cinética y Potencial</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Energía Mecánica: Cinética y Potencial</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')

var GW_DRAWS = [];
function fitCanvas(c){
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth || 320;
  var h = c.clientHeight || 236;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function regDraw(fn){ GW_DRAWS.push(fn); setTimeout(fn, 140); setTimeout(fn, 520); }

  });
})();

}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: PISTA DE PRUEBAS
   Dos deslizadores: masa del carrito y rapidez con la que cruza la meta.
   El carrito se dibuja más grande con la masa y deja más estelas con la
   rapidez, y la barra de energía crece en vivo. Tres metas de energía; la
   retroalimentación dice hacia dónde mover y recuerda que la rapidez pesa
   mucho más que la masa.
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var metas = shuffle([18, 20, 32, 36, 50, 72, 96, 100, 144, 160], rng).slice(0, 3);
  var r = 0, tries = 0, done = false;
  var m = 4, v = 4;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Pista de pruebas', en:'Test track' }) + '<span class="gw-tag" id="w1tag"></span></div>' +
    '<div class="gw-q" id="w1q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Cambia el carrito y la rapidez con la que cruza la meta. Observa cuál de los dos deslizadores mueve más la barra de energía.',
      en:'Change the cart and the speed at which it crosses the line. Watch which of the two sliders moves the energy bar more.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w1c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Masa', en:'Mass' }) + '</span><input type="range" id="w1m" min="1" max="10" step="1" value="4"><span class="gw-sv" id="w1mv">4 kg</span></div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Rapidez', en:'Speed' }) + '</span><input type="range" id="w1v" min="2" max="12" step="2" value="4"><span class="gw-sv" id="w1vv">4 m/s</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Masa', en:'Mass' }) + '</div><div class="gw-cv" id="w1o1">4 kg</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Rapidez', en:'Speed' }) + '</div><div class="gw-cv" id="w1o2">4 m/s</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Energía de movimiento', en:'Energy of motion' }) + '</div><div class="gw-cv" id="w1o3">32 J</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w1k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w1c');
  function Ec(){ return m * v * v / 2; }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var road = H * 0.56;
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, road); ctx.lineTo(W, road); ctx.stroke();
    // meta
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W - 34, road - 54); ctx.lineTo(W - 34, road); ctx.stroke();
    ctx.font = '10px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = cssv('--gold');
    ctx.fillText(L({ es:'meta', en:'line' }), W - 34, road - 58);
    // carrito
    var bw = 26 + m * 5, bh = 14 + m * 1.6;
    var bx = W - 34 - bw - 8, by = road - bh - 6;
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = cssv('--green-dark');
    ctx.beginPath(); ctx.arc(bx + 10, road - 5, 5, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + bw - 10, road - 5, 5, 0, 6.284); ctx.fill();
    // estelas de rapidez
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
    for (var i = 0; i < v / 2; i++) {
      var sy = by + 4 + (i % 3) * (bh / 3);
      var sl = 10 + i * 6;
      ctx.beginPath(); ctx.moveTo(bx - 6 - i * 4, sy); ctx.lineTo(bx - 6 - i * 4 - sl, sy); ctx.stroke();
    }
    ctx.textAlign = 'left';
    ctx.fillStyle = cssv('--text3');
    ctx.fillText(L({ es:'estelas: qué tan rápido cruza', en:'streaks: how fast it crosses' }), 8, road + 16);
    // barra de energia
    var barY = H - 42, barW = W - 32;
    ctx.fillStyle = cssv('--surface');
    ctx.fillRect(16, barY, barW, 20);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    ctx.strokeRect(16, barY, barW, 20);
    var frac = Math.min(Ec() / 200, 1);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(16, barY, barW * frac, 20);
    // marca de la meta de energia
    if (!done) {
      var mf = Math.min(metas[r] / 200, 1);
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(16 + barW * mf, barY - 5); ctx.lineTo(16 + barW * mf, barY + 25); ctx.stroke();
    }
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'left';
    ctx.fillText(L({ es:'energía de movimiento', en:'energy of motion' }), 16, barY - 8);
  }
  regDraw(draw);

  function live(){
    host.querySelector('#w1mv').textContent = m + ' kg';
    host.querySelector('#w1vv').textContent = v + ' m/s';
    host.querySelector('#w1o1').textContent = m + ' kg';
    host.querySelector('#w1o2').textContent = v + ' m/s';
    host.querySelector('#w1o3').textContent = Ec() + ' J';
    draw();
    if (done) return;
    var g = metas[r], e = Ec();
    if (e === g) {
      say(host, 'good', L({
        es:'Justo en la meta: ' + g + ' J. Confirma con el botón.',
        en:'Right on target: ' + g + ' J. Confirm with the button.'
      }));
    } else if (e < g) {
      say(host, 'warm', L({
        es:'Vas en ' + e + ' J y la meta es ' + g + ' J. Te falta energía: sube la rapidez o carga más el carrito. Prueba primero con la rapidez y compara cuánto salta la barra.',
        en:'You are at ' + e + ' J and the target is ' + g + ' J. You need more energy: raise the speed or load the cart more. Try the speed first and compare how far the bar jumps.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Vas en ' + e + ' J y la meta es ' + g + ' J. Te pasaste: baja la rapidez o aligera el carrito. Fíjate en cuál de los dos deslizadores corrige más rápido.',
        en:'You are at ' + e + ' J and the target is ' + g + ' J. Too much: lower the speed or lighten the cart. Notice which of the two sliders corrects it faster.'
      }));
    }
  }
  function showRound(){
    tries = 0;
    host.querySelector('#w1tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w1q').innerHTML = L({
      es:'Meta: haz que el carrito cruce la línea con <span class="gw-cv">' + metas[r] + ' J</span> de energía de movimiento.',
      en:'Goal: make the cart cross the line with <span class="gw-cv">' + metas[r] + ' J</span> of energy of motion.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w1tag').textContent = L({ es:'Pista dominada', en:'Track mastered' });
      host.querySelector('#w1k').disabled = true;
      host.querySelector('#w1k').classList.add('solved');
      say(host, 'good', L({
        es:'Ya lo viste con la barra: doblar la masa dobla la energía, pero doblar la rapidez la hace cuatro veces mayor.',
        en:'You saw it on the bar: doubling the mass doubles the energy, but doubling the speed makes it four times bigger.'
      }));
      return;
    }
    showRound();
  }
  function solveFor(g){
    for (var vv = 2; vv <= 12; vv += 2){
      for (var mm = 1; mm <= 10; mm++){
        if (mm * vv * vv / 2 === g) return [mm, vv];
      }
    }
    return [4, 4];
  }
  host.querySelector('#w1m').oninput = function(){ m = parseInt(this.value, 10); live(); };
  host.querySelector('#w1v').oninput = function(){ v = parseInt(this.value, 10); live(); };
  host.querySelector('#w1k').onclick = function(){
    if (done) return;
    var g = metas[r];
    if (Ec() === g){
      say(host, 'good', L({
        es:'Correcto: un carrito de ' + m + ' kg que cruza a ' + v + ' m/s lleva ' + g + ' J.',
        en:'Correct: a cart of ' + m + ' kg crossing at ' + v + ' m/s carries ' + g + ' J.'
      }));
      setTimeout(nextRound, 1100);
      return;
    }
    tries++;
    if (tries >= 3){
      var sol = solveFor(g);
      say(host, 'miss', L({
        es:'Una combinación que sirve: ' + sol[0] + ' kg a ' + sol[1] + ' m/s. La mitad de la masa multiplicada por la rapidez al cuadrado deja ' + g + ' J. Hay otras combinaciones.',
        en:'One combination that works: ' + sol[0] + ' kg at ' + sol[1] + ' m/s. Half the mass multiplied by the speed squared leaves ' + g + ' J. There are other combinations.'
      }));
      setTimeout(nextRound, 3000);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: ESCALERA DE LA BODEGA
   A la izquierda un costal ya colocado en cierto peldaño. El alumno toca un
   peldaño para colocar el segundo costal, de otra masa, y busca que los dos
   guarden la misma energía. Cada toque redibuja y compara en vivo.
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var ROUNDS = [
    { m1:2, h1:6, m2:4, h2:3 }, { m1:6, h1:2, m2:3, h2:4 },
    { m1:5, h1:4, m2:2, h2:10 }, { m1:8, h1:3, m2:6, h2:4 },
    { m1:4, h1:6, m2:3, h2:8 }, { m1:10, h1:2, m2:5, h2:4 },
    { m1:3, h1:8, m2:4, h2:6 }, { m1:2, h1:9, m2:6, h2:3 }
  ];
  var rounds = shuffle(ROUNDS, rng).slice(0, 3);
  var r = 0, tries = 0, done = false, pos = 1;

  var steps = '';
  for (var i = 1; i <= 10; i++) steps += '<button class="gw-btn w2s" data-h="' + i + '">' + i + '</button>';

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'Escalera de la bodega', en:'Warehouse ladder' }) + '<span class="gw-tag" id="w2tag"></span></div>' +
    '<div class="gw-q" id="w2q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Toca un peldaño para colocar el segundo costal. Puedes cambiarlo las veces que quieras: los dos marcadores se actualizan al instante.',
      en:'Tap a rung to place the second sack. You can change it as many times as you like: both readings update at once.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w2c"></canvas>' +
    '<div class="gw-row" id="w2steps">' + steps + '</div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Costal ya colocado', en:'Sack already placed' }) + '</div><div class="gw-cv" id="w2a">0 J</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Tu costal', en:'Your sack' }) + '</div><div class="gw-cv" id="w2b">0 J</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Diferencia', en:'Difference' }) + '</div><div class="gw-cv" id="w2d">0 J</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w2k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w2c');
  function cur(){ return rounds[Math.min(r, rounds.length - 1)]; }
  function E1(){ return 10 * cur().m1 * cur().h1; }
  function E2(){ return 10 * cur().m2 * pos; }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var floor = H - 22, top = 16;
    var lvl = function(h){ return floor - (floor - top) * (h / 10); };
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, floor); ctx.lineTo(W, floor); ctx.stroke();
    ctx.font = '10px "IBM Plex Sans", sans-serif';
    for (var h = 1; h <= 10; h++){
      var y = lvl(h);
      ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(28, y); ctx.lineTo(W - 28, y); ctx.stroke();
      ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'right';
      ctx.fillText(h + ' m', 24, y + 3);
    }
    function sack(x, h, mass, color){
      var y = lvl(h);
      var w = 20 + mass * 3.2, hh = 12 + mass * 1.4;
      ctx.fillStyle = color;
      ctx.fillRect(x - w / 2, y - hh, w, hh);
      ctx.fillStyle = cssv('--text2'); ctx.textAlign = 'center';
      ctx.fillText(mass + ' kg', x, y - hh - 5);
    }
    var xa = W * 0.36, xb = W * 0.72;
    sack(xa, cur().h1, cur().m1, cssv('--green-dark'));
    sack(xb, pos, cur().m2, cssv('--gold'));
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'center';
    ctx.fillText(L({ es:'ya colocado', en:'already placed' }), xa, floor + 14);
    ctx.fillText(L({ es:'el tuyo', en:'yours' }), xb, floor + 14);
  }
  regDraw(draw);

  function live(){
    host.querySelector('#w2a').textContent = E1() + ' J';
    host.querySelector('#w2b').textContent = E2() + ' J';
    host.querySelector('#w2d').textContent = Math.abs(E1() - E2()) + ' J';
    host.querySelectorAll('.w2s').forEach(function(b){
      b.classList.toggle('on', parseInt(b.dataset.h, 10) === pos);
    });
    draw();
    if (done) return;
    if (E2() === E1()){
      say(host, 'good', L({
        es:'Los dos guardan ' + E1() + ' J. Confirma con el botón.',
        en:'Both store ' + E1() + ' J. Confirm with the button.'
      }));
    } else if (E2() < E1()){
      say(host, 'warm', L({
        es:'Tu costal guarda ' + E2() + ' J y el otro ' + E1() + ' J: todavía guarda menos, súbelo de peldaño.',
        en:'Your sack stores ' + E2() + ' J and the other one ' + E1() + ' J: it still stores less, move it up a rung.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Tu costal guarda ' + E2() + ' J y el otro ' + E1() + ' J: se pasó, bájalo de peldaño.',
        en:'Your sack stores ' + E2() + ' J and the other one ' + E1() + ' J: too much, move it down a rung.'
      }));
    }
  }
  function showRound(){
    tries = 0; pos = 1;
    host.querySelector('#w2tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w2q').innerHTML = L({
      es:'Un costal de <span class="gw-cv">' + rounds[r].m1 + ' kg</span> ya está en el peldaño de <span class="gw-cv">' + rounds[r].h1 + ' m</span>. Coloca el tuyo, de <span class="gw-cv">' + rounds[r].m2 + ' kg</span>, de modo que guarde la misma energía.',
      en:'A sack of <span class="gw-cv">' + rounds[r].m1 + ' kg</span> is already on the rung at <span class="gw-cv">' + rounds[r].h1 + ' m</span>. Place yours, of <span class="gw-cv">' + rounds[r].m2 + ' kg</span>, so that it stores the same energy.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w2tag').textContent = L({ es:'Bodega ordenada', en:'Warehouse sorted' });
      host.querySelector('#w2k').disabled = true;
      host.querySelector('#w2k').classList.add('solved');
      host.querySelectorAll('.w2s').forEach(function(b){ b.disabled = true; });
      say(host, 'good', L({
        es:'En las tres rondas el costal ligero tuvo que subir más alto: lo que se guarda depende de la masa y de la altura juntas, no de una sola.',
        en:'In all three rounds the light sack had to go higher: what is stored depends on mass and height together, not on one alone.'
      }));
      return;
    }
    showRound();
  }
  host.querySelectorAll('.w2s').forEach(function(b){
    b.onclick = function(){ if (done) return; pos = parseInt(b.dataset.h, 10); live(); };
  });
  host.querySelector('#w2k').onclick = function(){
    if (done) return;
    if (E2() === E1()){
      say(host, 'good', L({
        es:'Correcto: ' + rounds[r].m2 + ' kg a ' + pos + ' m guardan lo mismo que ' + rounds[r].m1 + ' kg a ' + rounds[r].h1 + ' m.',
        en:'Correct: ' + rounds[r].m2 + ' kg at ' + pos + ' m store the same as ' + rounds[r].m1 + ' kg at ' + rounds[r].h1 + ' m.'
      }));
      setTimeout(nextRound, 1200);
      return;
    }
    tries++;
    if (tries >= 3){
      var sol = rounds[r].h2;
      say(host, 'miss', L({
        es:'El peldaño era el de ' + sol + ' m: ahí tu costal guarda ' + (10 * rounds[r].m2 * sol) + ' J, igual que el otro.',
        en:'The rung was the one at ' + sol + ' m: there your sack stores ' + (10 * rounds[r].m2 * sol) + ' J, the same as the other one.'
      }));
      pos = sol; live();
      setTimeout(nextRound, 3000);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: LA CAIDA DEL CLAVADISTA
   Un deslizador mueve al clavadista por la vertical. Dos barras apiladas
   muestran en vivo la energía guardada y la de movimiento; la suma nunca
   cambia. Tres metas sobre la energía de movimiento.
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var m = pk(rng, [1, 2, 4]);
  var H = pk(rng, [10, 20]);
  var Em = 10 * m * H;
  var fr = shuffle([2, 4, 5, 6, 8], rng).slice(0, 3);
  var step = H / 10;
  var y = H, r = 0, tries = 0, done = false;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La caída del clavadista', en:'The diver falling' }) + '<span class="gw-tag" id="w3tag"></span></div>' +
    '<div class="gw-q" id="w3q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Un clavadista de ' + m + ' kg se deja caer desde ' + H + ' m. Mueve el deslizador para verlo en distintos puntos de la caída y vigila la barra: una parte crece justo cuando la otra baja.',
      en:'A diver of ' + m + ' kg drops from ' + H + ' m. Move the slider to see him at different points of the fall and watch the bar: one part grows exactly as the other shrinks.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w3c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Altura', en:'Height' }) + '</span><input type="range" id="w3y" min="0" max="' + H + '" step="' + step + '" value="' + H + '"><span class="gw-sv" id="w3yv">' + H + ' m</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Guardada en la altura', en:'Stored in the height' }) + '</div><div class="gw-cv" id="w3p">0 J</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'De movimiento', en:'Of motion' }) + '</div><div class="gw-cv" id="w3k">0 J</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Suma', en:'Sum' }) + '</div><div class="gw-cv" id="w3t">0 J</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w3b">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w3c');
  function Ep(){ return 10 * m * y; }
  function Ek(){ return Em - Ep(); }
  function meta(){ return Em * fr[r] / 10; }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, Hc = g.h;
    var water = Hc - 26, top = 18;
    var yy = water - (water - top) * (y / H);
    // plataforma y agua
    ctx.fillStyle = cssv('--green-bg');
    ctx.fillRect(0, water, W, Hc - water);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, water); ctx.lineTo(W, water); ctx.stroke();
    ctx.fillStyle = cssv('--green-dark');
    ctx.fillRect(20, top - 6, 54, 6);
    ctx.fillRect(20, top, 6, water - top);
    // clavadista
    var cx = 84;
    ctx.fillStyle = cssv('--gold');
    ctx.beginPath(); ctx.arc(cx, yy - 8, 7, 0, 6.284); ctx.fill();
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, yy - 2); ctx.lineTo(cx, yy + 10); ctx.stroke();
    if (y < H) arrowDown(ctx, cx, yy + 14, yy + 30, 2, cssv('--green'));
    ctx.font = '10px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = cssv('--text3');
    ctx.fillText(y + ' m', cx + 14, yy);
    ctx.fillText(L({ es:'agua', en:'water' }), 8, water + 15);
    // barra apilada
    var bx = W - 74, bw = 40, btop = top, bh = water - top;
    ctx.fillStyle = cssv('--surface');
    ctx.fillRect(bx, btop, bw, bh);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    ctx.strokeRect(bx, btop, bw, bh);
    var hp = bh * (Ep() / Em);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(bx, btop, bw, hp);
    ctx.fillStyle = cssv('--gold');
    ctx.fillRect(bx, btop + hp, bw, bh - hp);
    // meta sobre la barra
    if (!done){
      var hm = bh * (1 - meta() / Em);
      ctx.strokeStyle = cssv('--bad'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bx - 8, btop + hm); ctx.lineTo(bx + bw + 8, btop + hm); ctx.stroke();
    }
    ctx.textAlign = 'center'; ctx.fillStyle = cssv('--text3');
    ctx.fillText(L({ es:'guardada', en:'stored' }), bx + bw / 2, btop - 6);
    ctx.fillText(L({ es:'movimiento', en:'motion' }), bx + bw / 2, water + 15);
  }
  regDraw(draw);

  function live(){
    host.querySelector('#w3yv').textContent = y + ' m';
    host.querySelector('#w3p').textContent = Ep() + ' J';
    host.querySelector('#w3k').textContent = Ek() + ' J';
    host.querySelector('#w3t').textContent = (Ep() + Ek()) + ' J';
    draw();
    if (done) return;
    var g = meta();
    if (Ek() === g){
      say(host, 'good', L({
        es:'Ahí lleva ' + g + ' J de movimiento. Confirma con el botón.',
        en:'There he carries ' + g + ' J of motion. Confirm with the button.'
      }));
    } else if (Ek() < g){
      say(host, 'warm', L({
        es:'Lleva ' + Ek() + ' J de movimiento y la meta es ' + g + ' J: bájalo, todavía le queda demasiada altura guardada.',
        en:'He carries ' + Ek() + ' J of motion and the target is ' + g + ' J: bring him lower, he still has too much height stored.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Lleva ' + Ek() + ' J de movimiento y la meta es ' + g + ' J: súbelo, ya cayó de más. Observa que la suma sigue valiendo ' + Em + ' J.',
        en:'He carries ' + Ek() + ' J of motion and the target is ' + g + ' J: bring him higher, he has fallen too far. Notice the sum is still ' + Em + ' J.'
      }));
    }
  }
  function showRound(){
    tries = 0;
    host.querySelector('#w3tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w3q').innerHTML = L({
      es:'Meta: deja al clavadista en el punto donde su energía de movimiento vale <span class="gw-cv">' + meta() + ' J</span>.',
      en:'Goal: leave the diver at the point where his energy of motion is <span class="gw-cv">' + meta() + ' J</span>.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w3tag').textContent = L({ es:'Caída entendida', en:'Fall understood' });
      host.querySelector('#w3b').disabled = true;
      host.querySelector('#w3b').classList.add('solved');
      say(host, 'good', L({
        es:'La suma se quedó en ' + Em + ' J en cada punto de la caída: la altura no desaparece, se convierte en movimiento.',
        en:'The sum stayed at ' + Em + ' J at every point of the fall: the height does not vanish, it turns into motion.'
      }));
      return;
    }
    showRound();
  }
  host.querySelector('#w3y').oninput = function(){ y = parseFloat(this.value); live(); };
  host.querySelector('#w3b').onclick = function(){
    if (done) return;
    var g = meta();
    if (Ek() === g){
      say(host, 'good', L({
        es:'Correcto: a ' + y + ' m quedan ' + Ep() + ' J guardados y ya se convirtieron ' + g + ' J en movimiento.',
        en:'Correct: at ' + y + ' m there are ' + Ep() + ' J still stored and ' + g + ' J already turned into motion.'
      }));
      setTimeout(nextRound, 1200);
      return;
    }
    tries++;
    if (tries >= 3){
      var sol = H * (1 - fr[r] / 10);
      say(host, 'miss', L({
        es:'Era a ' + sol + ' m: ahí quedan ' + (Em - g) + ' J guardados y los otros ' + g + ' J ya son movimiento.',
        en:'It was at ' + sol + ' m: there ' + (Em - g) + ' J remain stored and the other ' + g + ' J are already motion.'
      }));
      y = sol; host.querySelector('#w3y').value = String(sol); live();
      setTimeout(nextRound, 3000);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: ¿QUE MANDA EN ESTE INSTANTE?
   Escenas de la vida diaria que el alumno reparte en dos cajones. Cada error
   deja volver a intentar con una pista que apunta a lo que hay que mirar;
   a la tercera se muestra el cajón correcto con su razón.
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var BINS = [
    L({ es:'Casi toda en movimiento', en:'Almost all in motion' }),

  var ITEMS = [
    { es:'La bicicleta que acaba de bajar la loma y cruza la calle plana', en:'The bicycle that has just come down the hill and crosses the flat street', bin:0 },

    { es:'El carro de la montaña rusa detenido en la cima antes de la primera bajada', en:'The roller coaster car stopped at the top before the first drop', bin:1 },
    { es:'El agua del río corriendo entre las piedras del tramo de rápidos', en:'The river water running between the stones of the rapids', bin:0 },
    { es:'El columpio justo cuando pasa por el punto más bajo del vaivén', en:'The swing just as it passes the lowest point of its arc', bin:0 },
    { es:'La maceta olvidada en el barandal del tercer piso', en:'The flowerpot left on the third floor railing', bin:1 }
  ];
  var seq = shuffle(ITEMS, rng).slice(0, 6);

  function render(){
    if (done){
      host.innerHTML =

        '<div class="gw-fb good">' + L({
          es:'Escenas repartidas. Lo alto y quieto guarda; lo bajo y veloz ya gastó lo guardado en moverse.',
          en:'Scenes sorted. What is high and still is storing; what is low and fast has already spent what it stored on moving.'
        }) + '</div>';

      '<div class="gw-h">' + L({ es:'¿Qué manda en este instante?', en:'What rules in this instant?' }) + '<span class="gw-tag cls-prog">' + (i + 1) + ' / 6</span></div>' +

      }) + '</div>' +
      '<div class="cls-card">' + seq[i][LANG] + '</div>' +
      '<div class="gw-row cls-bins">' +
        '<button class="gw-btn" id="w4b0">' + BINS[0] + '</button>' +
        '<button class="gw-btn" id="w4b1">' + BINS[1] + '</button>' +
      '</div>' +

  function advance(){
    i++; tries = 0;
    if (i >= seq.length) done = true;

  }
  function pick0(b){
    var it = seq[i];
    if (b === it.bin){
      hits++;
      say(host, 'good', L({
        es:'Sí. ' + (it.bin === 0 ? 'Va rápido y muy cerca del suelo, así que casi nada le queda guardado.' : 'Está arriba y prácticamente quieto, así que casi todo sigue guardado.'),
        en:'Yes. ' + (it.bin === 0 ? 'It moves fast and very close to the ground, so almost nothing is left stored.' : 'It is high up and practically still, so almost everything is still stored.')
      }));
      setTimeout(advance, 1100);
      return;
    }
    tries++;

      say(host, 'miss', L({
        es: 'Iba en "' + BINS[it.bin] + '". Pregúntate siempre dos cosas: qué tan alto está y qué tan rápido va.',
        en: 'It belonged in "' + BINS[it.bin] + '". Always ask two things: how high it is and how fast it goes.'
      }));
      setTimeout(advance, 2400);
      return;
    }
    say(host, 'warm', L({
      es:'Todavía no. Fíjate en la altura de la escena y en si algo se está moviendo rápido o casi detenido.',
      en:'Not yet. Look at how high the scene is and whether something is moving fast or almost stopped.'
    }));
  }
  render();
}

      L({ es:'Se quedó guardada en el cuerpo del niño y volverá a aparecer la próxima vez que suba', en:'It stayed stored in the body of the child and will show up again next time he climbs' }),
      L({ es:'Nunca existió, porque la energía guardada arriba siempre se cuenta por duplicado', en:'It never existed, because the energy stored at the top is always counted twice' })
    ],
    correct: 0,
    hint: L({
      es:'La energía no se destruye, cambia de forma. Piensa en qué se siente al tocar la resbaladilla después de varias bajadas.',
      en:'Energy is not destroyed, it changes form. Think about what you feel when you touch the slide after several rides.'
    }),
    exp: L({
      es:'Faltan ' + (arriba - abajo) + ' J, y esa parte no se perdió: el roce del pantalón contra la lámina y del cuerpo contra el aire la convirtió en calor, que calienta un poco la resbaladilla y el aire de alrededor. Por eso en una superficie rugosa se llega abajo más lento que en una lisa.',
      en:'There are ' + (arriba - abajo) + ' J missing, and that part was not lost: the rubbing of the trousers against the metal and of the body against the air turned it into heat, which slightly warms the slide and the surrounding air. That is why on a rough surface you arrive at the bottom slower than on a smooth one.'
    })
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   LECCION
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();
  GW_DRAWS = [];

  /* ── Apertura ── */
  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Lo que se guarda arriba reaparece abajo', en:'What is stored up there shows up down here' }),
    '<p>' + L({
      es:'Una canica quieta en el borde de la mesa no hace nada, y sin embargo basta un empujón mínimo para que llegue al piso con un golpe seco. Un balón que rueda despacio se detiene con la mano; el mismo balón pateado con fuerza tumba una portería.',
      en:'A marble sitting still on the edge of the table does nothing, and yet the smallest nudge is enough for it to hit the floor with a sharp knock. A ball rolling slowly is stopped with one hand; the same ball kicked hard knocks over a goalpost.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a medir las dos formas de energía que explican esas escenas: la que un cuerpo lleva por moverse y la que guarda por estar alto. Vas a igualar cargas en una escalera, a seguir a un clavadista durante su caída y a decidir en qué punto de un columpio se va más rápido.',
      en:'In this guide you will measure the two forms of energy behind those scenes: the one a body carries by moving and the one it stores by being high up. You will match loads on a ladder, follow a diver during the fall and decide at which point of a swing you go fastest.'
    }) + '</p>' +
    '<div class="callout"><p><strong>' + L({ es:'Idea clave: ', en:'Key idea: ' }) + '</strong>' + L({
      es:'la energía no aparece ni desaparece, cambia de forma. Lo que una piedra guarda mientras está arriba es exactamente lo que lleva de movimiento al llegar abajo. En toda la guía usamos una gravedad de 10 m/s² y medimos la energía en joules (J).',
      en:'energy does not appear or disappear, it changes form. What a stone stores while it is up high is exactly what it carries as motion on arriving at the bottom. Throughout the guide we use a gravity of 10 m/s² and measure energy in joules (J).'
    }) + '</p></div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Energía cinética: la energía de lo que se mueve', en:'Kinetic energy: the energy of what moves' }),
    '<p>' + L({
      es:'Todo cuerpo en movimiento lleva energía consigo, y esa energía es la que puede empujar, abollar o romper cuando el cuerpo se detiene contra algo. Se llama energía cinética y depende de dos cosas: cuánta masa se mueve y qué tan rápido lo hace.',
      en:'Every moving body carries energy with it, and that energy is what can push, dent or break when the body is stopped against something. It is called kinetic energy and it depends on two things: how much mass is moving and how fast it moves.'
    }) + '</p>' +
    '<p>' + L({
      es:'Las dos no pesan igual. La masa entra tal cual: al doble de masa, doble de energía. La rapidez entra elevada al cuadrado, así que al doble de rapidez la energía se hace cuatro veces mayor. Por eso un choque a 60 km/h es mucho más que el doble de grave que uno a 30.',
      en:'The two do not count the same. The mass enters as it is: twice the mass, twice the energy. The speed enters squared, so at twice the speed the energy becomes four times bigger. That is why a crash at 60 km/h is far more than twice as serious as one at 30.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Masa', en:'Mass' }), L({ es:'kilogramo (kg)', en:'kilogram (kg)' }), L({ es:'cuánta materia se está moviendo', en:'how much matter is moving' })) +
      rcard(L({ es:'Rapidez', en:'Speed' }), L({ es:'metro por segundo', en:'metre per second' }), L({ es:'entra al cuadrado, por eso manda en el resultado', en:'enters squared, which is why it rules the result' })) +
      rcard(L({ es:'Energía cinética', en:'Kinetic energy' }), L({ es:'joule (J)', en:'joule (J)' }), L({ es:'la mitad de la masa por la rapidez al cuadrado', en:'half the mass times the speed squared' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En la pista que sigue tienes los dos deslizadores por separado. Antes de buscar la meta, mueve solo uno y luego solo el otro, y compara cuánto salta la barra en cada caso.',
      en:'In the track below you have the two sliders separately. Before hunting for the target, move only one and then only the other, and compare how far the bar jumps in each case.'
    }) + '</p></div>'
  );
  w1(rng, widgetHost(s1, 'gwA', 'kinetic'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Energía potencial gravitatoria: la que se guarda en la altura', en:'Gravitational potential energy: the one stored in the height' }),
    '<p>' + L({
      es:'Subir algo cuesta trabajo, y ese trabajo no se pierde: queda guardado en el objeto mientras siga arriba, listo para volver a aparecer en cuanto lo sueltes. A esa energía guardada por la posición se le llama energía potencial gravitatoria.',
      en:'Lifting something takes work, and that work is not lost: it stays stored in the object while it remains up there, ready to show up again the moment you release it. That energy stored by position is called gravitational potential energy.'
    }) + '</p>' +
    '<p>' + L({
      es:'Depende de la masa, de la gravedad del lugar y de la altura, los tres multiplicándose. Aquí la altura entra tal cual, no al cuadrado, así que el doble de masa a la mitad de altura guarda exactamente lo mismo. Y la altura siempre se mide desde un nivel de referencia que uno elige: el piso del salón, la banqueta, el fondo del pozo.',
      en:'It depends on the mass, on the gravity of the place and on the height, the three of them multiplying. Here the height enters as it is, not squared, so twice the mass at half the height stores exactly the same. And the height is always measured from a reference level that we choose: the classroom floor, the pavement, the bottom of the well.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Masa', en:'Mass' }), L({ es:'kilogramo (kg)', en:'kilogram (kg)' }), L({ es:'cuánta materia se subió', en:'how much matter was lifted' })) +
      rcard(L({ es:'Gravedad', en:'Gravity' }), L({ es:'10 m/s²', en:'10 m/s²' }), L({ es:'el valor que usamos en toda la guía', en:'the value we use throughout the guide' })) +
      rcard(L({ es:'Altura', en:'Height' }), L({ es:'metro (m)', en:'metre (m)' }), L({ es:'siempre contada desde el nivel de referencia elegido', en:'always counted from the chosen reference level' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En la bodega que sigue el costal ligero tendrá que compensar su falta de masa con algo más. Prueba peldaños hasta emparejar los dos marcadores.',
      en:'In the warehouse below the light sack will have to make up for its lack of mass with something else. Try rungs until the two readings match.'
    }) + '</p></div>'
  );
  w2(rng, widgetHost(s2, 'gwB', 'potential'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'Energía mecánica: la suma que no cambia', en:'Mechanical energy: the sum that does not change' }),
    '<p>' + L({
      es:'La energía mecánica de un cuerpo es simplemente la suma de las dos anteriores: lo que lleva por moverse más lo que guarda por su altura. Lo interesante es lo que pasa con esa suma cuando el cuerpo cae, baja una rampa o se columpia.',
      en:'The mechanical energy of a body is simply the sum of the two previous ones: what it carries by moving plus what it stores by its height. The interesting part is what happens to that sum when the body falls, goes down a ramp or swings.'
    }) + '</p>' +
    '<p>' + L({
      es:'Mientras el rozamiento sea despreciable, la suma se mantiene constante aunque cada parte cambie todo el tiempo. Lo que la altura va perdiendo, el movimiento lo va ganando, joule por joule. Ese intercambio es el que explica que una piedra soltada desde más alto llegue con más energía al suelo.',
      en:'As long as friction is negligible, the sum stays constant even though each part changes all the time. What the height loses, the motion gains, joule by joule. That exchange is what explains why a stone released from higher up arrives at the ground with more energy.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Energía mecánica', en:'Mechanical energy' }), L({ es:'la suma de las dos', en:'the sum of the two' }), L({ es:'se calcula punto por punto del recorrido', en:'it is worked out point by point along the path' })) +
      rcard(L({ es:'Se conserva', en:'It is conserved' }), L({ es:'sin rozamiento', en:'without friction' }), L({ es:'el total vale lo mismo arriba, a media caída y abajo', en:'the total is the same at the top, halfway and at the bottom' })) +
      rcard(L({ es:'Se intercambia', en:'It is exchanged' }), L({ es:'altura por movimiento', en:'height for motion' }), L({ es:'lo que baja una parte, sube la otra', en:'what one part loses, the other gains' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'En la caída que sigue, la barra de la derecha está partida en dos colores. Mueve al clavadista y vigila el tercer marcador: es el que no debería moverse nunca.',
      en:'In the fall below, the bar on the right is split into two colours. Move the diver and watch the third reading: that is the one that should never move.'
    }) + '</p></div>'
  );
  w3(rng, widgetHost(s3, 'gwC', 'conservation'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Leer una escena: quién manda en cada instante', en:'Reading a scene: which one rules at each instant' }),
    '<p>' + L({
      es:'Con las dos energías en la mano ya puedes mirar cualquier escena cotidiana y decir en qué forma está la energía en ese momento. Solo hay que hacerse dos preguntas: ¿qué tan alto está?, ¿qué tan rápido va?',
      en:'With the two energies in hand you can now look at any everyday scene and say in which form the energy is at that moment. You only need to ask two questions: how high is it, and how fast is it going?'
    }) + '</p>' +
    '<p>' + L({
      es:'Un columpio en su punto más alto se detiene un instante: ahí casi todo está guardado. El mismo columpio abajo va a su máxima rapidez: ahí casi todo es movimiento. Entre esos dos extremos la energía viaja de una forma a la otra sin cambiar de total, y por eso el vaivén se repite una y otra vez.',
      en:'A swing at its highest point stops for an instant: there almost everything is stored. The same swing at the bottom goes at its greatest speed: there almost everything is motion. Between those two ends the energy travels from one form to the other without changing the total, and that is why the swinging repeats over and over.'
    }) + '</p>'
  );
  w4(rng, widgetHost(s4, 'gwD', 'classify'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'La masa cuenta para la energía, no para la caída', en:'Mass counts for the energy, not for the fall' }),
    '<p>' + L({
      es:'Cuando dos cuerpos caen desde la misma altura, el más pesado llega con más energía: eso es directo, porque guardaba más arriba. Pero de ahí no se sigue que llegue más rápido, y esa confusión es de las más comunes.',
      en:'When two bodies fall from the same height, the heavier one arrives with more energy: that is direct, because it stored more at the top. But it does not follow that it arrives faster, and that confusion is one of the most common.'
    }) + '</p>' +
    '<p>' + L({
      es:'La razón es que la masa aparece en las dos cuentas a la vez: multiplica lo que se guarda arriba y también multiplica lo que cuesta poner el cuerpo en movimiento abajo. Las dos apariciones se compensan, y lo que queda depende solo de la altura de caída. Distinto es preguntar por la energía: ahí la masa sí decide.',
      en:'The reason is that the mass appears in both accounts at once: it multiplies what is stored at the top and it also multiplies what it takes to set the body in motion at the bottom. The two appearances cancel out, and what is left depends only on the height of the fall. Asking about the energy is a different matter: there the mass does decide.'
    }) + '</p>'
  );
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  var s6 = sec(
    L({ es:'Cierre', en:'Closing' }),
    L({ es:'Todo junto', en:'Everything together' }),
    '<p>' + L({
      es:'Queda un detalle que las cuentas limpias esconden: en el mundo real las superficies raspan y el aire estorba, así que casi siempre falta algo al hacer el balance. Ese faltante no se pierde, se va como calor, y por eso una resbaladilla muy usada se siente tibia.',
      en:'One detail remains that clean calculations hide: in the real world surfaces scrape and the air gets in the way, so something is nearly always missing when you balance the accounts. That missing part is not lost, it leaves as heat, and that is why a well used slide feels warm.'
    }) + '</p>'
  );
  w5(rng, widgetHost(s6, 'gwE', 'reflect'));
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Energía Mecánica: Cinética y Potencial';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
