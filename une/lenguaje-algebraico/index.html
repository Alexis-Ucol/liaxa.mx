<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lenguaje Algebraico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Lenguaje Algebraico</div>
    <div class="wcourse" id="wcourse-el">Pensamiento Matemático II · Sem 2</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Lenguaje Algebraico</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        
/* ── GUIDE WIDGETS (lenguaje algebraico) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-sub { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.goalbar b { color:var(--green-dark); font-family:'IBM Plex Mono',monospace; }
.dataline { font-family:'IBM Plex Mono',monospace; font-size:.9rem; color:var(--green-dark); background:var(--surface2); border-radius:8px; padding:.55rem .7rem; margin:.5rem 0; overflow-x:auto; }
.phrasebox { font-size:.95rem; color:var(--text); background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:.6rem .8rem; margin-bottom:.7rem; }

/* traductor de frases */
.slotrow { display:flex; align-items:stretch; gap:.5rem; flex-wrap:wrap; }
.slotbtn { min-width:62px; min-height:52px; padding:.4rem .7rem; border:1.5px solid var(--border); border-radius:10px; background:var(--surface2); color:var(--green-dark); font-family:'IBM Plex Mono',monospace; font-size:1.05rem; font-weight:700; cursor:pointer; text-align:center; }
.slotbtn:hover { border-color:var(--green); }
.slotcap { display:block; font-family:'IBM Plex Sans',sans-serif; font-size:.58rem; font-weight:500; letter-spacing:.07em; text-transform:uppercase; color:var(--text3); margin-top:.15rem; }

/* agrupador de términos */
.cls-prog { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.cls-card { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.9rem; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1.15rem; margin:.6rem 0; color:var(--text); }
.cls-bins { display:flex; gap:.5rem; flex-wrap:wrap; }
.cls-bin { flex:1; min-width:96px; min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:700; cursor:pointer; padding:.5rem; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.cls-done { font-weight:700; color:var(--ok); text-align:center; padding:.6rem; font-size:.95rem; }

/* deslizador y constructor */
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.5rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:130px; accent-color:var(--green); height:34px; }
.klbl { font-size:.78rem; color:var(--text3); min-width:56px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:38px; text-align:right; }
.figwrap { display:flex; align-items:flex-start; gap:.9rem; margin:.7rem 0; flex-wrap:wrap; }
.figrect { border:2px solid var(--green); border-radius:6px; background:var(--green-bg); transition:width .18s, height .18s; }
.figside { font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--green-dark); margin:.25rem 0; }

/* definiciones */
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.reflect-prompt { font-size:.92rem; color:var(--text2); margin:.5rem 0 .8rem; }

@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }
  .cls-bins { flex-direction:column; }
  .klbl { min-width:48px; }
  .slotbtn { min-width:54px; font-size:.95rem; }
  .dataline { font-size:.82rem; }
}

function setLang(l){
  LANG = l;

    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_pm2_t01_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_pm2_t01_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_pm2_t01_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

  for (var i = 0; i < problems.length; i++) {

    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);

    var ansBoxH = 8 + chLines.length*5.5 + coLines.length*5 + exLines.length*5 + 6;

    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;

    ay += chLines.length*5.5 + 3;

    coLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });
    ay += coLines.length*5 + 3;
    doc.setTextColor(90,85,80); doc.setFontSize(7.5);
    exLines.forEach(function(ln,li){ doc.text(ln, M+14, ay+li*5); });

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {

    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');

  doc.save('pm2_t01_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf');

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    if (Object.prototype.toString.call(o) === '[object Array]') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }

  /* ---- escritura matemática (Regla 13) ---- */
  function numTxt(n){ return (n < 0 ? '−' + Math.abs(n) : String(n)); }
  function mono(c, v){
    if (!v) return numTxt(c);
    var a = Math.abs(c);
    if (a === 0) return '0';
    return (c < 0 ? '−' : '') + (a === 1 ? '' : String(a)) + v;
  }
  function poly(ts){
    var out = '', i, c, v;
    for (i=0;i<ts.length;i++){
      c = ts[i][0]; v = ts[i][1];
      if (c === 0) continue;
      if (out === '') out = mono(c, v);
      else out += (c < 0 ? ' − ' : ' + ') + mono(Math.abs(c), v);
    }
    return out === '' ? '0' : out;
  }
  function frac(n, d){
    return '<span class="mf-outer"><span class="mf-num">'+n+'</span><span class="mf-den">'+d+'</span></span>';
  }
  function optsTxt(correct, cands){
    var out = [correct], i, k = 1, f;
    for (i=0;i<cands.length;i++){
      if (out.indexOf(cands[i]) < 0){ out.push(cands[i]); if (out.length === 4) break; }
    }
    while (out.length < 4 && k < 30){
      f = String(correct).replace(/\d+/, function(m){ return String(parseInt(m,10) + k); });
      if (out.indexOf(f) < 0) out.push(f);
      k++;
    }
    while (out.length < 4) out.push(String(correct) + ' + ' + out.length);
    return out;
  }
  function optsNum(correct, cands){
    var out = [numTxt(correct)], i, k = 1, s;
    for (i=0;i<cands.length;i++){
      s = numTxt(cands[i]);
      if (out.indexOf(s) < 0){ out.push(s); if (out.length === 4) break; }
    }
    while (out.length < 4){ s = numTxt(correct + 7*k); if (out.indexOf(s) < 0) out.push(s); k++; }
    return out;
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     VALORES CON SEMILLA (se extraen una sola vez, en orden fijo)
     ============================================================ */
  var VI = Math.floor(rng()*3);
  var V1 = ['x','n','m'][VI];
  var V2 = ['y','p','k'][VI];
  var SQ = V1 + '²';
  var CU = V1 + '³';
  var MULTES = { 2:'doble', 3:'triple', 4:'cuádruple', 5:'quíntuple' };
  var MULTEN = { 2:'twice', 3:'three times', 4:'four times', 5:'five times' };

  var v1 = Math.floor(rng()*2), v2 = Math.floor(rng()*2), v3 = Math.floor(rng()*2);
  var v4 = Math.floor(rng()*2), v5 = Math.floor(rng()*2), v6 = Math.floor(rng()*2);
  var v7 = Math.floor(rng()*2), v8 = Math.floor(rng()*2), v9 = Math.floor(rng()*2);
  var v10 = Math.floor(rng()*2);

  /* manipulativo 1: tres frases */
  var W1 = [];
  (function(){
    var i, a, c, ty;
    for (i=0;i<3;i++){
      a = ri(2,5); c = ri(2,9); ty = Math.floor(rng()*4);
      W1.push({ a:a, c:c, ty:ty, plus:(ty===0 || ty===2),
                kop: shufA([c, c+1, c+3, (c > 2 ? c-2 : c+6)]) });
    }
  })();

  /* manipulativo 2: seis términos por agrupar */
  var W2 = [
    { c: ri(3,7),  p:0 }, { c: -ri(2,6), p:1 }, { c: ri(4,9),  p:2 },
    { c: ri(2,5),  p:0 }, { c: ri(3,8),  p:1 }, { c: -ri(2,7), p:2 }
  ];
  if (W2[1].c + W2[4].c === 0) W2[4].c = W2[4].c + 2;
  if (W2[2].c + W2[5].c === 0) W2[5].c = W2[5].c - 1;
  W2 = shufA(W2);

  /* manipulativo 3: tres objetivos de evaluación */
  var W3 = [];
  (function(){
    var i, a, b, k;
    for (i=0;i<3;i++){
      a = ri(2,5); k = ri(2,8); b = ri(-6,7);
      if (b === 0) b = 3;
      W3.push({ a:a, b:b, k:k, t:a*k + b });
    }
  })();

  /* manipulativo 4: rectángulo objetivo */
  var W4A = ri(2,5), W4B = ri(1,7);

  /* manipulativo 5: prompt de reflexión */
  var W5i = Math.floor(rng()*3);
  var W5e = ri(2,6);

  /* P1 */
  var p1a = ri(2,5), p1b = ri(3,9), p1a2 = ri(2,5), p1b2 = ri(2,7);
  /* P2 */
  var p2p = ri(2,6), p2q = ri(4,12), p2r = ri(25,45), p2s = ri(8,15);
  /* P3 */
  var p3a = ri(3,7), p3b = ri(2,6), p3c = ri(4,9), p3d = ri(2,5), p3e = ri(3,8), p3f = ri(2,7);
  if (p3e === p3b) p3e = p3b + 2;
  if (p3c === p3f) p3f = p3f + 1;
  var p3m = ri(4,8), p3n = ri(3,7), p3p = ri(2,3), p3q = ri(2,6);
  /* P4 */
  var p4a = ri(4,8), p4b = ri(3,9), p4c = ri(2,3), p4d = ri(2,6);
  var p4k = ri(2,4), p4a2 = ri(2,5), p4b2 = ri(3,7), p4m = ri(2,6);
  /* P5 */
  var p5w = Math.floor(rng()*3);
  var p5A = ri(6,9), p5B = ri(2,4), p5C = ri(3,8);
  var p5x = ri(5,9), p5y = ri(2,4), p5z = ri(4,9);
  /* P6 */
  var p6a = ri(2,5), p6b = ri(3,7), p6c = ri(2,9), p6k = ri(2,4);
  var p6p = ri(2,4), p6q = -ri(2,5), p6c1 = ri(2,4), p6c2 = ri(3,6), p6c3 = ri(2,4);
  /* P7 */
  var p7k = ri(3,6), p7T = ri(22,32), p7coef = shufA([2,3,4,5]);
  var p7a = ri(3,6), p7b = ri(2,9);
  /* P8 */
  var p8a1 = ri(2,4), p8b1 = ri(2,7), p8a2 = ri(2,5), p8b2 = ri(2,6), p8b3 = ri(3,8);
  if (p8b1 - p8b2 + p8b3 === 0) p8b3 = p8b3 + 2;
  var p8a = ri(2,5), p8b = ri(2,6), p8e = ri(5,15);
  if (p8e === 4*p8b) p8e = p8e + 3;
  /* P9 */
  var p9m = ri(2,5), p9p = ri(18,28), p9d = ri(3,7), p9f = ri(15,30);
  /* P10 */
  var q1 = ri(3,8), q2 = ri(2,7), q3 = ri(2,6), q4 = ri(3,9);
  var q5 = ri(3,9), q6 = ri(2,6), q7 = ri(4,9);

  /* ============================================================
     CONCEPTO 1
     ============================================================ */
  sec(T({es:'Concepto 1', en:'Concept 1'}),
      T({es:'Del lenguaje común al lenguaje algebraico', en:'From everyday language to algebra'}),
      '<p>'+T({
        es:'El lenguaje algebraico representa con letras las cantidades que cambian o que todavía no se conocen. Esa letra se llama variable y permite convertir un enunciado escrito en palabras en una expresión que después puede operarse, compararse con otra o evaluarse para un valor concreto.',
        en:'Algebraic language uses letters to stand for quantities that change or that are not yet known. Such a letter is called a variable, and it turns a statement written in words into an expression that can later be operated on, compared with another one, or evaluated at a specific value.'
      })+'</p>'+
      '<p>'+T({
        es:'Cada sumando de una expresión es un término. Dentro de un término, el número que multiplica a la variable es el coeficiente y el conjunto de letras con sus exponentes es la parte literal. El término que no lleva variable recibe el nombre de término independiente, y el signo que antecede a un término forma parte de ese término.',
        en:'Each addend of an expression is a term. Inside a term, the number multiplying the variable is the coefficient and the set of letters with their exponents is the literal part. A term carrying no variable is called the independent term, and the sign in front of a term belongs to that term.'
      })+'</p>'+
      '<p>'+T({
        es:'Las palabras del enunciado indican la operación. Aumentado en y más señalan una suma; disminuido en, menos y la diferencia señalan una resta; el doble, el triple y veces señalan un producto; la mitad y la razón señalan un cociente que se escribe como fracción, por ejemplo la mitad de '+V1+' es '+frac(V1,2)+'. El orden de las palabras decide si la operación afecta a un solo término o a toda una suma encerrada entre paréntesis.',
        en:'The words of the statement point to the operation. Increased by and more than signal an addition; decreased by, minus and the difference signal a subtraction; double, triple and times signal a product; half and the ratio signal a quotient written as a fraction, for instance half of '+V1+' is '+frac(V1,2)+'. Word order decides whether the operation affects a single term or a whole sum enclosed in parentheses.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Variable',en:'Variable'})+'</div><div class="deftxt">'+T({es:'Letra que representa una cantidad desconocida o que puede cambiar.',en:'Letter standing for an unknown quantity or one that can change.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Coeficiente',en:'Coefficient'})+'</div><div class="deftxt">'+T({es:'Número que multiplica a la parte literal, con su signo incluido.',en:'Number multiplying the literal part, sign included.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Parte literal',en:'Literal part'})+'</div><div class="deftxt">'+T({es:'Letras del término junto con el exponente de cada una.',en:'The letters of the term together with each of their exponents.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Término independiente',en:'Independent term'})+'</div><div class="deftxt">'+T({es:'Término sin variable; su valor no depende de nada más.',en:'Term with no variable; its value depends on nothing else.'})+'</div></div>'+
      '</div>');

  /* ---- MANIPULATIVO 1: traductor de frases ---- */
  (function(){
    var wrap = widget('translate');
    var COEF = [1,2,3,4,5,6];
    var OPS = ['+','−'];
    var st = { r:0, ci:0, oi:0, ki:0, tries:0, msg:'', done:false, lock:false };
    function d(){ return W1[st.r]; }
    function phrase(q){
      if (q.ty === 0) return T({es:'El '+MULTES[q.a]+' de un número, aumentado en '+q.c+'.', en:cap(MULTEN[q.a])+' a number, increased by '+q.c+'.'});
      if (q.ty === 1) return T({es:'El '+MULTES[q.a]+' de un número, disminuido en '+q.c+'.', en:cap(MULTEN[q.a])+' a number, decreased by '+q.c+'.'});
      if (q.ty === 2) return T({es:q.c+' más el '+MULTES[q.a]+' de un número.', en:q.c+' more than '+MULTEN[q.a]+' a number.'});
      return T({es:'El '+MULTES[q.a]+' de un número, menos '+q.c+'.', en:cap(MULTEN[q.a])+' a number, minus '+q.c+'.'});
    }
    function target(q){ return mono(q.a, V1) + (q.plus ? ' + ' : ' − ') + q.c; }
    function render(){
      var head = '<div class="iw-tag">'+T({es:'Traductor de frases', en:'Phrase translator'})+'</div>';
      if (st.done){
        wrap.innerHTML = head + '<div class="iw-box"><div class="cls-done">🎉 '+
          T({es:'Tres frases llevadas al lenguaje algebraico.', en:'Three phrases carried into algebraic language.'})+'</div></div>';
        return;
      }
      var q = d();
      var prev = mono(COEF[st.ci], V1) + ' ' + OPS[st.oi] + ' ' + q.kop[st.ki];
      wrap.innerHTML = head +
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Frase',en:'Phrase'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-sub">'+T({
            es:'Toca cada botón hasta que la expresión diga exactamente lo mismo que la frase. Puedes cambiarla las veces que quieras antes de comprobar.',
            en:'Tap each button until the expression says exactly what the phrase says. You can change it as many times as you like before checking.'})+'</div>'+
          '<div class="phrasebox">'+phrase(q)+'</div>'+
          '<div class="slotrow">'+
            '<button class="slotbtn" onclick="w1Cyc(0)">'+mono(COEF[st.ci], V1)+'<span class="slotcap">'+T({es:'término',en:'term'})+'</span></button>'+
            '<button class="slotbtn" onclick="w1Cyc(1)">'+OPS[st.oi]+'<span class="slotcap">'+T({es:'signo',en:'sign'})+'</span></button>'+
            '<button class="slotbtn" onclick="w1Cyc(2)">'+q.kop[st.ki]+'<span class="slotcap">'+T({es:'número',en:'number'})+'</span></button>'+
          '</div>'+
          '<div class="dataline">'+T({es:'Tu expresión: ',en:'Your expression: '})+prev+'</div>'+
          '<button class="rverify-btn" onclick="w1Check()">'+T({es:'Comprobar',en:'Check'})+'</button>'+
          '<div class="rfb">'+st.msg+'</div>'+
        '</div>';
    }
    function advance(ms){
      st.lock = true; render();
      setTimeout(function(){
        st.r++; st.tries = 0; st.ci = 0; st.oi = 0; st.ki = 0; st.msg = ''; st.lock = false;
        if (st.r >= 3) st.done = true;
        render();
      }, ms);
    }
    window.w1Cyc = function(which){
      if (st.lock || st.done) return;
      var q = d();
      if (which === 0) st.ci = (st.ci + 1) % COEF.length;
      else if (which === 1) st.oi = (st.oi + 1) % OPS.length;
      else st.ki = (st.ki + 1) % q.kop.length;
      st.msg = '';
      render();
    };
    window.w1Check = function(){

  (function(){

    var st = { r:0, x:0, moves:0, lock:false, done:false };
    function q(){ return W3[st.r]; }
    function valAt(x){ return q().a*x + q().b; }
    function subTxt(x){
      var c = q();
      return c.a + '(' + numTxt(x) + ')' + (c.b < 0 ? ' − ' : ' + ') + Math.abs(c.b) + ' = ' + numTxt(valAt(x));
    }
    function hintFor(x){
      var c = q(), v = valAt(x), s;
      if (v < c.t) s = T({es:'El valor actual queda por debajo del objetivo. Aumenta ', en:'The current value is below the target. Increase '}) + V1 + '.';
      else s = T({es:'El valor actual se pasa del objetivo. Disminuye ', en:'The current value overshoots the target. Decrease '}) + V1 + '.';
      if (st.moves >= 10) s += ' ' + T({es:'Con ', en:'With '}) + V1 + ' = ' + c.k + T({es:' la expresión alcanza el objetivo.', en:' the expression reaches the target.'});
      return s;
    }
    function render(){
      var head = '<div class="iw-tag">'+T({es:'Deslizador de valores', en:'Value slider'})+'</div>';
      if (st.done){
        wrap.innerHTML = head + '<div class="iw-box"><div class="cls-done">🎉 '+
          T({es:'Tres objetivos alcanzados.', en:'Three targets reached.'})+'</div></div>';
        return;
      }
      var c = q();
      wrap.innerHTML = head +
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Objetivo',en:'Target'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="goalbar">'+T({es:'Mueve el deslizador hasta que la expresión valga ', en:'Move the slider until the expression is worth '})+'<b>'+numTxt(c.t)+'</b>.</div>'+
          '<div class="iw-sub">'+T({es:'Cada movimiento sustituye el valor elegido en la expresión y muestra el resultado al instante.',
                                    en:'Every move substitutes the chosen value into the expression and shows the result instantly.'})+'</div>'+
          '<div class="dataline">'+poly([[c.a,V1],[c.b,'']])+'</div>'+
          '<div class="krow"><span class="klbl">'+V1+'</span>'+
            '<input type="range" min="-4" max="12" step="1" value="'+st.x+'" oninput="w3Move(this.value)">'+
            '<span class="kval" id="w3V">'+numTxt(st.x)+'</span></div>'+
          '<div class="dataline" id="w3Out">'+subTxt(st.x)+'</div>'+
          '<div class="rfb" id="w3Fb">'+hintFor(st.x)+'</div>'+
        '</div>';
    }
    window.w3Move = function(raw){
      if (st.done) return;
      var x = parseInt(raw, 10);
      st.x = x;
      var kv = document.getElementById('w3V'), out = document.getElementById('w3Out'), fb = document.getElementById('w3Fb');
      if (kv) kv.textContent = numTxt(x);
      if (out) out.textContent = subTxt(x);
      if (st.lock) return;
      st.moves++;
      if (valAt(x) === q().t){
        st.lock = true;
        if (fb) fb.innerHTML = '<span class="okmsg">🎉 '+T({es:'Objetivo alcanzado.', en:'Target reached.'})+'</span>';
        setTimeout(function(){
          st.r++; st.x = 0; st.moves = 0; st.lock = false;
          if (st.r >= 3) st.done = true;
          render();
        }, 1200);
        return;
      }
      if (fb) fb.textContent = hintFor(x);
    };
    render();
  })();

  (function(){
    var wrap = widget('build');
    var K = 2*(W4A + 1), M = 4 + 2*W4B;
    var st = { a:1, b:0, moves:0, done:false, msg:'' };
    function baseTxt(a){ return poly([[a, V1],[2, '']]); }
    function altTxt(b){ return poly([[1, V1],[b, '']]); }
    function perK(a){ return 2*(a + 1); }
    function perM(b){ return 4 + 2*b; }
    function paint(){
      var eb = document.getElementById('w4Base'), ea = document.getElementById('w4Alt'),
          er = document.getElementById('w4Rect'), ep = document.getElementById('w4P'),
          ka = document.getElementById('w4KA'), kb = document.getElementById('w4KB'),
          fb = document.getElementById('w4Fb');
      if (eb) eb.textContent = T({es:'base: ', en:'base: '}) + baseTxt(st.a);
      if (ea) ea.textContent = T({es:'altura: ', en:'height: '}) + altTxt(st.b);
      if (er){ er.style.width = (66 + st.a*20) + 'px'; er.style.height = (42 + st.b*8) + 'px'; }
      if (ka) ka.textContent = String(st.a);
      if (kb) kb.textContent = String(st.b);
      if (ep) ep.textContent = 'P = 2(' + baseTxt(st.a) + ') + 2(' + altTxt(st.b) + ') = ' + poly([[perK(st.a), V1],[perM(st.b), '']]);
      if (fb){ if (st.msg.indexOf('<') >= 0) fb.innerHTML = st.msg; else fb.textContent = st.msg; }
    }
    function judge(){
      var k = perK(st.a), m = perM(st.b), parts = [];
      if (k === K && m === M){
        st.done = true;
        st.msg = '<span class="okmsg">🎉 '+T({es:'Perímetro conseguido: ', en:'Perimeter matched: '})+poly([[K,V1],[M,'']])+'</span>';
        return;
      }
      if (k < K) parts.push(T({es:'El coeficiente de '+V1+' se queda corto: alarga la base.', en:'The '+V1+' coefficient falls short: make the base longer.'}));
      else if (k > K) parts.push(T({es:'El coeficiente de '+V1+' se pasa: acorta la base.', en:'The '+V1+' coefficient overshoots: make the base shorter.'}));
      else parts.push(T({es:'El coeficiente de '+V1+' ya coincide.', en:'The '+V1+' coefficient already matches.'}));
      if (m < M) parts.push(T({es:'El término independiente se queda corto: aumenta la altura.', en:'The independent term falls short: increase the height.'}));
      else if (m > M) parts.push(T({es:'El término independiente se pasa: reduce la altura.', en:'The independent term overshoots: reduce the height.'}));
      else parts.push(T({es:'El término independiente ya coincide.', en:'The independent term already matches.'}));
      if (st.moves >= 8) parts.push(T({es:'Con base '+baseTxt(W4A)+' y altura '+altTxt(W4B)+' se obtiene el perímetro buscado.',
                                       en:'A base of '+baseTxt(W4A)+' and a height of '+altTxt(W4B)+' give the perimeter you want.'}));
      st.msg = parts.join(' ');
    }
    function render(){
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Constructor de perímetro', en:'Perimeter builder'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="goalbar">'+T({es:'Ajusta el rectángulo hasta que su perímetro reducido sea ', en:'Adjust the rectangle until its reduced perimeter is '})+'<b>'+poly([[K,V1],[M,'']])+'</b>.</div>'+
          '<div class="figwrap">'+
            '<div><div class="figside" id="w4Base"></div>'+
            '<div class="figrect" id="w4Rect"></div>'+
            '<div class="figside" id="w4Alt"></div></div>'+
          '</div>'+
          '<div class="krow"><span class="klbl">'+T({es:'base',en:'base'})+'</span>'+
            '<input type="range" min="1" max="6" step="1" value="'+st.a+'" oninput="w4Set(0,this.value)">'+
            '<span class="kval" id="w4KA"></span></div>'+
          '<div class="krow"><span class="klbl">'+T({es:'altura',en:'height'})+'</span>'+
            '<input type="range" min="0" max="8" step="1" value="'+st.b+'" oninput="w4Set(1,this.value)">'+
            '<span class="kval" id="w4KB"></span></div>'+
          '<div class="dataline" id="w4P"></div>'+
          '<div class="rfb" id="w4Fb"></div>'+
        '</div>';
      paint();
    }
    window.w4Set = function(which, raw){
      if (st.done) return;
      var val = parseInt(raw, 10);
      if (which === 0) st.a = val; else st.b = val;
      st.moves++;
      judge();
      paint();
    };
    judge();
    render();
  })();

  /* ---- P8 ---- */
  (function(){
    var s1 = poly([[p8a1,V1],[p8b1,'']]), s2 = poly([[p8a2,V1],[-p8b2,'']]), s3 = poly([[1,V1],[p8b3,'']]);
    var SC = p8b1 - p8b2 + p8b3, SS = p8a1 + p8a2 + 1;
    var CA = poly([[SS,V1],[SC,'']]);
    var CB = poly([[4*p8a,V1],[p8e - 4*p8b,'']]);
    var V = [
      { q:{es:'Los lados de un triángulo miden '+s1+', '+s2+' y '+s3+' centímetros. Escribe su perímetro reducido.',
           en:'The sides of a triangle measure '+s1+', '+s2+' and '+s3+' centimetres. Write its reduced perimeter.'},
        options: optsTxt(CA, [ poly([[SS,V1],[p8b1+p8b2+p8b3,'']]), poly([[p8a1+p8a2,V1],[SC,'']]), poly([[SS,V1],[p8b1-p8b2-p8b3,'']]) ]),
        correct: CA,
        hint:{es:'Suma los tres lados en una sola expresión y agrupa después: los términos con variable por un lado y los números por otro, respetando el signo del lado que resta.',
              en:'Add the three sides into a single expression and group afterwards: the terms with the variable on one side and the numbers on the other, respecting the sign of the side that subtracts.'},
        exp:{es:'La suma de los tres lados es '+poly([[p8a1,V1],[p8b1,''],[p8a2,V1],[-p8b2,''],[1,V1],[p8b3,'']])+'. Los términos en '+V1+' dan '+mono(SS,V1)+', donde el tercer lado aporta un coeficiente 1, y los números dan '+numTxt(SC)+'. El perímetro es '+CA+' centímetros.',
             en:'The sum of the three sides is '+poly([[p8a1,V1],[p8b1,''],[p8a2,V1],[-p8b2,''],[1,V1],[p8b3,'']])+'. The '+V1+' terms give '+mono(SS,V1)+', where the third side contributes a coefficient of 1, and the numbers give '+numTxt(SC)+'. The perimeter is '+CA+' centimetres.'} },
      { q:{es:'Un cuadrado tiene lados de '+poly([[p8a,V1],[-p8b,'']])+' centímetros y se le añade un listón recto de '+p8e+' centímetros. Escribe la longitud total reducida del contorno junto con el listón.',
           en:'A square has sides of '+poly([[p8a,V1],[-p8b,'']])+' centimetres and a straight ribbon of '+p8e+' centimetres is added to it. Write the reduced total length of the outline together with the ribbon.'},
        options: optsTxt(CB, [ poly([[4*p8a,V1],[p8e-p8b,'']]), poly([[4*p8a,V1],[-(4*p8b+p8e),'']]), poly([[p8a,V1],[p8e-4*p8b,'']]) ]),
        correct: CB,
        hint:{es:'El contorno del cuadrado repite cuatro veces el mismo lado, y ese factor afecta a los dos términos del lado. El listón se agrega al final.',
              en:'The outline of the square repeats the same side four times, and that factor affects both terms of the side. The ribbon is added at the end.'},
        exp:{es:'El contorno vale 4('+poly([[p8a,V1],[-p8b,'']])+'), es decir '+poly([[4*p8a,V1],[-4*p8b,'']])+', porque el factor 4 multiplica también al número. Al agregar el listón los términos independientes se reducen y la longitud total es '+CB+' centímetros.',
             en:'The outline is worth 4('+poly([[p8a,V1],[-p8b,'']])+'), that is '+poly([[4*p8a,V1],[-4*p8b,'']])+', because the factor 4 multiplies the number as well. Adding the ribbon reduces the independent terms and the total length is '+CB+' centimetres.'} }
    ][v8];
    addProb({ title:{es:'Perímetro en lenguaje algebraico', en:'Perimeter in algebraic language'},
      q:V.q, options:V.options, correct:V.correct, hint:V.hint, exp:V.exp, showWork:true });
  })();

  /* ---- MANIPULATIVO 5: reflexión ---- */
  (function(){
    var wrap = widget('reflect');
    var PROMPTS = [
      {es:'Escribe una situación de la vida diaria que se modele con la expresión '+poly([[W5e,V1],[2*W5e,'']])+'. Explica qué representa la variable y qué representa cada término.',
       en:'Write an everyday situation modelled by the expression '+poly([[W5e,V1],[2*W5e,'']])+'. Explain what the variable represents and what each term represents.'},
      {es:'Con tus palabras, explica por qué '+mono(W5e,SQ)+' y '+mono(W5e,V1)+' no pueden reducirse a un solo término. Puedes apoyarte en un dibujo.',
       en:'In your own words, explain why '+mono(W5e,SQ)+' and '+mono(W5e,V1)+' cannot be reduced to a single term. You may support your answer with a sketch.'},
      {es:'Dibuja una figura cuyo perímetro se exprese como '+poly([[2*W5e,V1],[2*W5e+4,'']])+' y anota la medida de cada uno de sus lados.',
       en:'Sketch a figure whose perimeter is expressed as '+poly([[2*W5e,V1],[2*W5e+4,'']])+' and write down the measurement of each of its sides.'}
    ];
    wrap.innerHTML =
      '<div class="iw-tag">'+T({es:'Reflexiona', en:'Reflect'})+'</div>'+
      '<div class="iw-box">'+
        '<div class="reflect-prompt">'+T(PROMPTS[W5i])+'</div>'+
        '<div class="wtabs">'+
          '<button class="wtab active" onclick="reflectTab(\'type\',this)">'+t('tab-type')+'</button>'+
          '<button class="wtab" onclick="reflectTab(\'draw\',this)">'+t('tab-draw')+'</button>'+
        '</div>'+
        '<div class="wpanel active" id="reflect_type"><textarea class="wtextarea" id="reflectTa" placeholder="'+t('ph-work')+'"></textarea></div>'+
        '<div class="wpanel" id="reflect_draw">'+
          '<div class="cvwrap"><canvas class="dcanvas" id="reflectCv"></canvas>'+
            '<div class="ctoolbar">'+
              '<button class="tbtn2 bpen on">'+t('btn-pen')+'</button>'+
              '<button class="tbtn2 bmarker">'+t('btn-marker')+'</button>'+
              '<button class="tbtn2 beraser">'+t('btn-eraser')+'</button>'+
              '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>'+
              '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>'+
              '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>'+
              '<button class="clrbtn">'+t('btn-clear')+'</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<button class="rverify-btn" onclick="reflectSave()">'+T({es:'Guardar', en:'Save'})+'</button>'+
        '<div class="rfb" id="reflectFb"></div>'+
      '</div>';
    window.reflectTab = function(which, btn){
      var names = ['type','draw'], i, el;
      for (i=0;i<names.length;i++){
        el = document.getElementById('reflect_' + names[i]);
        if (el) el.classList.toggle('active', names[i] === which);
      }
      var tabs = wrap.querySelectorAll('.wtab'), j;
      for (j=0;j<tabs.length;j++) tabs[j].classList.remove('active');
      btn.classList.add('active');
      if (which === 'draw') setTimeout(function(){ var c = document.getElementById('reflectCv'); if (c) initCanvas(c); }, 60);
    };
    window.reflectSave = function(){
      var fb = document.getElementById('reflectFb');
      if (fb) fb.innerHTML = '<span class="okmsg">✓ '+T({
        es:'Guardado. Aquí no hay una sola respuesta posible: lo valioso es que la variable y los términos queden bien explicados.',
        en:'Saved. There is no single possible answer here: what matters is that the variable and the terms end up clearly explained.'})+'</span>';
    };
  })();

  /* ---- P9 ---- */
  (function(){
    var CA = poly([[p9m+3, V1],[3, '']]);
    var CB = poly([[p9p-p9d, 'n'],[p9f, '']]);
    var V = [
      { q:{es:'Tres números enteros consecutivos se representan a partir del menor, al que se llama '+V1+'. Escribe la expresión reducida de la suma de los tres, aumentada en el '+MULTES[p9m]+' del menor.',
           en:'Three consecutive integers are represented starting from the smallest one, which is called '+V1+'. Write the reduced expression for the sum of the three, increased by '+MULTEN[p9m]+' the smallest one.'},
        options: optsTxt(CA, [ poly([[p9m+3,V1],[1,'']]), poly([[3,V1],[3+p9m,'']]), poly([[p9m+3,V1]]) ]),
        correct: CA,
        hint:{es:'Si el menor es '+V1+', los que siguen son '+V1+' + 1 y '+V1+' + 2. Escribe la suma completa y agrupa por separado los términos con variable y los números.',
              en:'If the smallest is '+V1+', the next ones are '+V1+' + 1 and '+V1+' + 2. Write the full sum and group the terms with the variable separately from the numbers.'},
        exp:{es:'La suma de los tres consecutivos es '+V1+' + ('+V1+' + 1) + ('+V1+' + 2), que se reduce a '+poly([[3,V1],[3,'']])+'. El '+MULTES[p9m]+' del menor es '+mono(p9m,V1)+', y al agregarlo solo cambian los términos con variable: '+CA+'.',
             en:'The sum of the three consecutive integers is '+V1+' + ('+V1+' + 1) + ('+V1+' + 2), which reduces to '+poly([[3,V1],[3,'']])+'. '+cap(MULTEN[p9m])+' the smallest one is '+mono(p9m,V1)+', and adding it only changes the terms with the variable: '+CA+'.'} },
      { q:{es:'Una papelería vende cuadernos en '+p9p+' pesos cada uno y aplica un descuento de '+p9d+' pesos por cuaderno. Cada compra lleva además un cargo fijo de '+p9f+' pesos. Escribe la expresión reducida del costo de n cuadernos.',
           en:'A stationery shop sells notebooks at '+p9p+' pesos each and applies a discount of '+p9d+' pesos per notebook. Every purchase also carries a fixed charge of '+p9f+' pesos. Write the reduced expression for the cost of n notebooks.'},
        options: optsTxt(CB, [ poly([[p9p,'n'],[p9f-p9d,'']]), poly([[p9p-p9d+p9f,'n']]), poly([[p9p+p9d,'n'],[p9f,'']]) ]),
        correct: CB,
        hint:{es:'El descuento se aplica a cada cuaderno, así que afecta al precio unitario. El cargo fijo se cobra una sola vez por compra.',
              en:'The discount applies to each notebook, so it affects the unit price. The fixed charge is billed once per purchase.'},
        exp:{es:'Cada cuaderno cuesta '+p9p+' − '+p9d+', es decir '+(p9p-p9d)+' pesos, de modo que n cuadernos cuestan '+mono(p9p-p9d,'n')+'. El cargo fijo no depende de la cantidad y se suma como término independiente, así que el costo es '+CB+'.',
             en:'Each notebook costs '+p9p+' − '+p9d+', that is '+(p9p-p9d)+' pesos, so n notebooks cost '+mono(p9p-p9d,'n')+'. The fixed charge does not depend on the quantity and is added as an independent term, so the cost is '+CB+'.'} }
    ][v9];
    addProb({ title:{es:'Modelar y reducir', en:'Modelling and reducing'},
      q:V.q, options:V.options, correct:V.correct, hint:V.hint, exp:V.exp, showWork:true });
  })();

  /* ---- P10 ---- */
  (function(){
    var LP = V1 + '²' + V2;
    var okPair = mono(q1, LP) + ', ' + mono(-q2, LP);
    var E10 = poly([[-q5, CU],[q6, V1],[q7, '']]);
    var V = [
      { q:{es:'Selecciona la pareja formada por términos semejantes.',
           en:'Select the pair made up of like terms.'},
        options: optsTxt(okPair, [
          mono(q3, SQ) + ', ' + mono(q4, CU),
          mono(q3, V1+V2) + ', ' + mono(q4, V1),
          mono(q1, SQ) + ', ' + mono(q2, V2+'²') ]),
        correct: okPair,
        hint:{es:'La comparación se hace letra por letra y exponente por exponente; el coeficiente no interviene en ella.',
              en:'The comparison is made letter by letter and exponent by exponent; the coefficient plays no part in it.'},
        exp:{es:'Los términos '+mono(q1,LP)+' y '+mono(-q2,LP)+' tienen la misma parte literal '+LP+', por eso pueden reducirse a un solo término. En las otras parejas cambia algún exponente o alguna letra, y eso basta para que no sean semejantes aunque se parezcan a simple vista.',
             en:'The terms '+mono(q1,LP)+' and '+mono(-q2,LP)+' share the literal part '+LP+', which is why they can be reduced to a single term. In the other pairs some exponent or some letter changes, and that is enough to keep them from being like terms even though they look similar at a glance.'} },
      { q:{es:'Selecciona la afirmación correcta sobre la expresión '+E10+'.',
           en:'Select the correct statement about the expression '+E10+'.'},
        options:{es:[
          'El coeficiente del primer término es '+numTxt(-q5)+' y su parte literal es '+CU+'.',
          'El coeficiente del primer término es '+q5+', porque el signo pertenece a la operación que lo antecede.',
          'El término independiente es '+numTxt(-q5)+', por ser el que tiene el mayor exponente.',
          'Los tres términos son semejantes, porque todos comparten la misma letra.'],
          en:[
          'The coefficient of the first term is '+numTxt(-q5)+' and its literal part is '+CU+'.',
          'The coefficient of the first term is '+q5+', because the sign belongs to the operation in front of it.',
          'The independent term is '+numTxt(-q5)+', being the one with the largest exponent.',
          'The three terms are like terms, because they all share the same letter.']},
        correct:{es:'El coeficiente del primer término es '+numTxt(-q5)+' y su parte literal es '+CU+'.',
                 en:'The coefficient of the first term is '+numTxt(-q5)+' and its literal part is '+CU+'.'},
        hint:{es:'Revisa tres cosas por separado: a quién pertenece el signo, cuál término carece de variable y qué se necesita para que dos términos sean semejantes.',
              en:'Check three things separately: who owns the sign, which term has no variable, and what is needed for two terms to be like terms.'},
        exp:{es:'El signo forma parte del coeficiente, de modo que el primer término tiene coeficiente '+numTxt(-q5)+' y parte literal '+CU+'. El término independiente es '+q7+', que es el único sin variable, y '+mono(-q5,CU)+' junto con '+mono(q6,V1)+' no son semejantes porque sus exponentes difieren.',
             en:'The sign is part of the coefficient, so the first term has coefficient '+numTxt(-q5)+' and literal part '+CU+'. The independent term is '+q7+', the only one without a variable, and '+mono(-q5,CU)+' together with '+mono(q6,V1)+' are not like terms because their exponents differ.'} }
    ][v10];
    addProb({ title:{es:'Términos y partes literales', en:'Terms and literal parts'},
      q:V.q, options:V.options, correct:V.correct, hint:V.hint, exp:V.exp, showWork:false });
  })();
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbz210eFtEC9kduZdp_1O9aPwr3-z0tob2zILE8PxXj-Ms6tT3F9VIgH7mRpKwVluogp/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
