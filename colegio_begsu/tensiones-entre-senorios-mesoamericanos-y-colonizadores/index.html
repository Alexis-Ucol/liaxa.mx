<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tensiones entre Señoríos Mesoamericanos y Colonizadores</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Tensiones entre Señoríos Mesoamericanos y Colonizadores</div>
    <div class="wcourse" id="wcourse-el">Historia · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">Tensiones entre Señoríos Mesoamericanos y Colonizadores</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#24240c', primaryDark:'#3f3f14', primaryBg:'#f4f4e9',
  accent:'#fcb40c', accentBg:'#fff4db',
  darkPrimary:'#b4b455', darkPrimaryDark:'#d7d783', darkPrimaryBg:'#343412',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();

var MANIP = {};
function L(o){ if(o===null||o===undefined) return ''; if(typeof o==='string') return o; return (o[LANG]!==undefined ? o[LANG] : o.es); }
function shuffleIdx(n, rng){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffleOpts(opts, correctIndex, rng){
  var ord = shuffleIdx(opts.length, rng);
  return { options: ord.map(function(k){ return opts[k]; }), correctIdx: ord.indexOf(correctIndex) };
}
function addProblem(spec, rng){
  var so = shuffleOpts(spec.options, spec.correct, rng);
  var p = { title: spec.title, questionText: spec.questionText, fn: '', hint: spec.hint || '',
            explanation: spec.explanation || '', options: so.options, correctIdx: so.correctIdx,
            showWork: !!spec.showWork, studentChoice: null, pendingChoice: null };
  problems.push(p);
  buildOneCard(p, problems.length - 1);
}

  var d = document.createElement('div');
  d.className = 'section';
  d.innerHTML = '<div class="stag">' + tag + '</div><h2>' + title + '</h2>' + body;
  document.getElementById('lessonBody').appendChild(d);
  return d;
}

/* ── MANIPULABLE A :: el reparto del tributo en la Triple Alianza (3 rondas, Regla 8 patrón B) ── */
var TRCIU = [
  { es:'Tenochtitlan', en:'Tenochtitlan' },
  { es:'Texcoco', en:'Texcoco' },
  { es:'Tlacopan', en:'Tlacopan' }
];
var TRPROV = [
  { es:'la provincia de Tochtepec', en:'the province of Tochtepec' },
  { es:'la provincia de Cuauhnáhuac', en:'the province of Cuauhnahuac' },
  { es:'la provincia de Tepeacac', en:'the province of Tepeacac' },
  { es:'la provincia de Tlapan', en:'the province of Tlapan' },
  { es:'la provincia de Xoconochco', en:'the province of Xoconochco' }
];
var TRPROD = [
  { es:'cargas de mantas de algodón', en:'loads of cotton cloth' },
  { es:'cargas de cacao', en:'loads of cacao' },
  { es:'cargas de maíz', en:'loads of maize' },
  { es:'cargas de plumas y piedras verdes', en:'loads of feathers and green stones' }
];
function mA_build(rng){
  var pv = shuffleIdx(TRPROV.length, rng), pd = shuffleIdx(TRPROD.length, rng), r = [], i;
  for (i = 0; i < 3; i++){
    var u = 3 + Math.floor(rng() * 8);          // 3 a 10 cargas por parte
    r.push({ pv: pv[i], pd: pd[i], u: u, total: 5 * u });
  }
  MANIP.A = { r: r, round: 0, tries: 0, al: [0, 0, 0], done: false, fb: '', fbk: '' };
}
function mA_sum(){ var A = MANIP.A; return A.al[0] + A.al[1] + A.al[2]; }
function mA_render(){
  var A = MANIP.A, z = document.getElementById('mzA');
  if (!z) return;
  if (A.done){
    z.innerHTML = '<div class="mztitle">' + L({ es:'Repartiste el tributo de tres provincias', en:'You shared out the tribute of three provinces' }) + '</div>' +
                  '<div class="mzfb ok">' + A.fb + '</div>';
    return;
  }
  var d = A.r[A.round], i, rows = '', rest = d.total - mA_sum() * d.u;
  for (i = 0; i < 3; i++){
    rows +=
      '<div class="trrow">' +
        '<div class="trname">' + L(TRCIU[i]) + '</div>' +
        '<button class="trb" onclick="mA_add(' + i + ',-1)">−</button>' +
        '<button class="trb" onclick="mA_add(' + i + ',1)">+</button>' +
        '<div class="trtrack"><div class="trfill' + (i === 2 ? ' acc' : '') + '" style="width:' + (A.al[i] * 20) + '%"></div></div>' +
        '<div class="trval">' + (A.al[i] * d.u) + '</div>' +
      '</div>';
  }

  var ev = YEV[D.list[D.round]], diff = D.val - ev.y, adv = false;

  } else {
    D.tries++;
    if (D.tries >= 3){
      D.val = ev.y; D.fbk = 'warn'; adv = true;
      D.fb = L({ es:'El año es ' + ev.y + '. ', en:'The year is ' + ev.y + '. ' }) + L(mD_era(ev.y));
    } else {
      D.fbk = 'bad';
      var far = Math.abs(diff) > 8;
      D.fb = (diff > 0
        ? L({ es:'Te pasaste: regresa el disco hacia atrás', en:'You went too far: turn the dial back' })
        : L({ es:'Te quedaste corto: adelanta el disco', en:'You fell short: turn the dial forward' })) +
        (far ? L({ es:' más de diez años.', en:' by more than ten years.' }) : L({ es:' unos pocos años.', en:' by a few years.' }));
    }
  }
  if (adv){
    D.round++; D.tries = 0;
    if (D.round >= 3){
      D.done = true;
      D.fb = L({ es:'Tres momentos ubicados. Entre el primero y el último de esta línea cambian el gobierno, la religión oficial, el trabajo y la vida diaria de millones de personas.',
                 en:'Three moments placed. Between the first and the last of this line, the government, the official religion, the work and the daily life of millions of people change.' });

  mD_render();
}

  addSection(L({ es:'Concepto 1', en:'Concept 1' }), L({ es:'Cientos de señoríos, no un solo bloque', en:'Hundreds of lordships, not a single bloc' }),
    L({ es:'<p>Hacia 1519, el territorio de lo que hoy es nuestro país no era un imperio con una sola capital y un solo gobierno. Estaba formado por cientos de señoríos, llamados altépetl en náhuatl. Cada uno tenía su gobernante, sus tierras repartidas entre barrios, su mercado, sus fiestas y sus dioses propios. Un señorío podía tener el tamaño de un municipio actual y, aun así, negociaba, se aliaba y peleaba como una unidad política.</p>' +
              '<p>Desde 1428, los señoríos de Tenochtitlan, Texcoco y Tlacopan gobernaban juntos la alianza más poderosa del centro: la Triple Alianza. Su dominio no consistía en enviar funcionarios a gobernar cada provincia, sino en cobrar tributo. El pueblo sometido conservaba a su gobernante y sus costumbres, pero entregaba cargas de mantas, cacao, maíz, plumas y piedras, además de turnos de trabajo y guerreros cuando se le pedían. Lo reunido se repartía en cinco bloques: dos para Tenochtitlan, dos para Texcoco y uno para Tlacopan.</p>' +

          en:'<p>By 1519, the territory of what is today our country was not an empire with a single capital and a single government. It was made up of hundreds of lordships, called altepetl in Nahuatl. Each one had its ruler, its lands divided among neighbourhoods, its market, its festivals and its own gods. A lordship could be the size of a present day municipality and even so it negotiated, formed alliances and fought as a political unit.</p>' +
              '<p>From 1428, the lordships of Tenochtitlan, Texcoco and Tlacopan governed together the most powerful alliance of the centre: the Triple Alliance. Its rule did not consist of sending officials to govern each province, but of collecting tribute. The subjected town kept its ruler and its customs, but handed over loads of cloth, cacao, maize, feathers and stones, as well as turns of labour and warriors when asked. What was collected was divided into five blocks: two for Tenochtitlan, two for Texcoco and one for Tlacopan.</p>' +

               L({ es:'Recibieron de Tenochtitlan la instrucción de atender a cualquier visitante que llegara por la costa', en:'They received instructions from Tenochtitlan to attend to any visitor arriving along the coast' }),
               L({ es:'Ninguno de esos señoríos tenía trato previo con Tenochtitlan ni sabía de su existencia', en:'None of those lordships had prior dealings with Tenochtitlan or knew of its existence' }),

    L({ es:'<p>En febrero de 1519 salió de Cuba una expedición al mando de Hernán Cortés. Tocó primero la isla de Cozumel y luego la costa de Tabasco, donde combatió en Centla en marzo de ese año. Ahí recibió, entre otros regalos, a un grupo de mujeres; una de ellas, Malintzin, hablaba náhuatl y maya. Con Jerónimo de Aguilar, que había aprendido maya durante años de naufragio, se formó una cadena de traducción que permitió negociar en náhuatl con los señoríos del centro. Sin esa cadena, la expedición habría avanzado a ciegas.</p>' +

              '<div class="callout"><p><strong>No fue un choque de un día.</strong> Fueron dos años de marchas, treguas, traiciones y acuerdos, y en cada tramo hubo señoríos decidiendo de qué lado convenía estar.</p></div>',
          en:'<p>In February 1519 an expedition led by Hernan Cortes left Cuba. It first reached the island of Cozumel and then the coast of Tabasco, where it fought at Centla in March of that year. There it received, among other gifts, a group of women; one of them, Malintzin, spoke Nahuatl and Maya. With Jeronimo de Aguilar, who had learned Maya during years of shipwreck, a chain of translation was formed that made it possible to negotiate in Nahuatl with the lordships of the centre. Without that chain, the expedition would have advanced blindly.</p>' +
              '<p>On the Gulf coast the first agreements arrived: the Totonacs of Cempoala, tributaries unhappy with the collection, offered themselves as allies and provided carriers and warriors. In September the expedition entered Tlaxcalan territory, fought for several days and then signed an alliance that would last the whole campaign. In October it passed through Cholula and on 8 November 1519 it entered Tenochtitlan, where Moctezuma II governed.</p>' +
              '<p>The stay in the city ended badly. In 1520 another expedition arrived from Cuba to arrest Cortes, tension broke out in the capital and on the night of 30 June 1520 the foreigners and their allies left Tenochtitlan along the causeways, with heavy losses. That same year an epidemic spread through the region. The campaign was reorganized in Tlaxcala: towns around the lake were subjected, the aqueduct that carried water to the city was cut and thirteen brigantines were built to fight on the water. The siege began in May 1521 and on 13 August the city, defended by Cuauhtemoc, stopped resisting.</p>' +

  addSection(L({ es:'Concepto 3', en:'Concept 3' }), L({ es:'Seis factores sobre la misma mesa', en:'Six factors on the same table' }),
    L({ es:'<p>Preguntar por qué cayó Tenochtitlan con una sola causa lleva a una respuesta falsa. Los historiadores trabajan con varios factores que actuaron a la vez, y ninguno de ellos alcanza por sí solo.</p>' +
              '<p>El factor <strong>político</strong> es el más pesado: la Alianza cobraba tributo sin gobernar de cerca, así que decenas de señoríos tenían motivos para cambiar de bando. El <strong>económico</strong> se le parece: el bloqueo a Tlaxcala y el cobro en las provincias habían dejado deudas de rencor que se cobraron en 1521. El <strong>militar</strong> marca una diferencia de objetivos: la guerra mesoamericana buscaba capturar prisioneros y obligar al tributo, no ocupar el territorio del enemigo ni destruir su ciudad, y frente a un adversario que sí buscaba ocuparlo esa forma de pelear quedaba en desventaja.</p>' +
              '<p>El <strong>tecnológico</strong> se suele exagerar: el acero, las ballestas y las pocas armas de fuego daban ventaja en el choque cercano, y los caballos servían en campo abierto, pero eran pocos y de poco uso en calzadas y canales. Lo que sí resultó decisivo fueron los trece bergantines armados para el lago, porque cortaron el paso de canoas con agua y comida. El <strong>cultural</strong> incluye la cadena de intérpretes, sin la cual no habría habido alianzas. El <strong>religioso</strong> atravesó todo: los dos bandos leyeron los hechos desde su propia fe, y la expedición sostenía que traía el mandato de predicar una nueva religión. Y hay un factor de <strong>salud</strong>: en 1520 se extendió una enfermedad desconocida en la región, para la que no había defensas previas ni tratamiento, y que enfermó al mismo tiempo a gobernantes, guerreros y a quienes sostenían el trabajo y el abasto.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Político</div><div class="rform">Señoríos divididos</div><div class="rnote">tributarios dispuestos a cambiar de bando</div></div>' +
                '<div class="rcard"><div class="rname">Militar</div><div class="rform">Objetivos distintos</div><div class="rnote">capturar y cobrar frente a ocupar</div></div>' +
                '<div class="rcard"><div class="rname">Tecnológico</div><div class="rform">Acero y bergantines</div><div class="rnote">pocas piezas, mucho efecto en el lago</div></div>' +
                '<div class="rcard"><div class="rname">Cultural</div><div class="rform">Intérpretes</div><div class="rnote">sin traducción no hay alianzas</div></div>' +
                '<div class="rcard"><div class="rname">Religioso</div><div class="rform">Dos lecturas</div><div class="rnote">cada bando explicó los hechos con su fe</div></div>' +
                '<div class="rcard"><div class="rname">Salud</div><div class="rform">Epidemia de 1520</div><div class="rnote">enfermedad nueva, sin defensas ni tratamiento</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>Ningún factor por sí solo.</strong> Quita las alianzas, quita los intérpretes o quita los bergantines y el desenlace de 1521 cambia por completo.</p></div>',
          en:'<p>Asking why Tenochtitlan fell with a single cause leads to a false answer. Historians work with several factors that acted at the same time, and none of them is enough on its own.</p>' +
              '<p>The <strong>political</strong> factor is the heaviest: the Alliance collected tribute without governing closely, so dozens of lordships had reasons to change sides. The <strong>economic</strong> one is similar: the blockade of Tlaxcala and the collection in the provinces had left debts of resentment that were settled in 1521. The <strong>military</strong> one marks a difference of aims: Mesoamerican war sought to capture prisoners and impose tribute, not to occupy enemy territory or destroy its city, and against an adversary that did seek to occupy it, that way of fighting was at a disadvantage.</p>' +
              '<p>The <strong>technological</strong> factor is often exaggerated: steel, crossbows and the few firearms gave an advantage in close combat, and horses were useful in open country, but they were few and of little use on causeways and canals. What did prove decisive were the thirteen brigantines built for the lake, because they cut off the movement of canoes carrying water and food. The <strong>cultural</strong> factor includes the chain of interpreters, without which there would have been no alliances. The <strong>religious</strong> one ran through everything: both sides read the events from their own faith, and the expedition claimed it carried a mandate to preach a new religion. And there is a <strong>health</strong> factor: in 1520 a disease unknown in the region spread, for which there were no prior defences and no treatment, and which made rulers, warriors and those who sustained work and supply fall ill at the same time.</p>' +
              '<div class="rules-grid">' +
                '<div class="rcard"><div class="rname">Political</div><div class="rform">Divided lordships</div><div class="rnote">tributaries ready to change sides</div></div>' +
                '<div class="rcard"><div class="rname">Military</div><div class="rform">Different aims</div><div class="rnote">capture and collect against occupy</div></div>' +
                '<div class="rcard"><div class="rname">Technological</div><div class="rform">Steel and brigantines</div><div class="rnote">few pieces, great effect on the lake</div></div>' +
                '<div class="rcard"><div class="rname">Cultural</div><div class="rform">Interpreters</div><div class="rnote">without translation there are no alliances</div></div>' +
                '<div class="rcard"><div class="rname">Religious</div><div class="rform">Two readings</div><div class="rnote">each side explained events with its faith</div></div>' +
                '<div class="rcard"><div class="rname">Health</div><div class="rform">1520 epidemic</div><div class="rnote">a new disease, no defences and no treatment</div></div>' +
              '</div>' +
              '<div class="callout"><p><strong>No factor on its own.</strong> Take away the alliances, take away the interpreters or take away the brigantines and the outcome of 1521 changes completely.</p></div>' }));

  addSection(L({ es:'Concepto 4', en:'Concept 4' }), L({ es:'Una ruptura, y lo que siguió en pie', en:'A rupture, and what remained standing' }),
    L({ es:'<p>El 13 de agosto de 1521 no terminó una batalla: terminó un orden político que llevaba casi un siglo funcionando. Sobre las ruinas de Tenochtitlan se trazó la ciudad de México y desde ahí se organizó un territorio nuevo, la Nueva España, con leyes escritas en otro idioma, otra religión oficial y otras autoridades. En 1524 llegaron los primeros doce frailes franciscanos, encargados de la evangelización; en 1535 llegó el primer virrey; en 1546 se abrieron las minas de plata de Zacatecas y la minería reorganizó rutas, pueblos y trabajo.</p>' +
              '<p>Cambió sobre todo la forma de exigir. El tributo dejó de repartirse entre tres ciudades y pasó a beneficiarios nuevos: encomenderos que recibían el trabajo y las entregas de pueblos enteros, la Corona que cobraba su parte y la Iglesia que sostenía sus obras. Se exigieron productos que antes no se cultivaban, entregas en dinero y turnos obligatorios de trabajo en obras, campos y minas. Muchos pueblos fueron reunidos por orden en asentamientos nuevos, lejos de sus tierras de siempre.</p>' +
              '<p>Y aun así, la ruptura no fue un borrón. El altépetl siguió existiendo con otro nombre, como pueblo de indios con su cabecera, sus tierras comunes y sus autoridades locales; varios gobernantes indígenas conservaron cargos y privilegios, y Tlaxcala obtuvo un trato aparte por su papel en la campaña. Siguieron en pie el maíz y las chinampas, el tianguis, los calendarios agrícolas, las lenguas, los oficios y los nombres de los lugares, que hoy seguimos usando. El orden colonial se levantó sobre pueblos, saberes y trabajo que ya estaban ahí.</p>' +
              '<table class="dtable"><tr><th>' + L({ es:'Antes de 1521', en:'Before 1521' }) + '</th><th>' + L({ es:'Después de 1521', en:'After 1521' }) + '</th></tr>' +
                '<tr><td>' + L({ es:'Tributo repartido entre tres ciudades de la Alianza', en:'Tribute divided among three cities of the Alliance' }) + '</td><td>' + L({ es:'Tributo y trabajo para encomenderos, Corona e Iglesia', en:'Tribute and labour for encomenderos, Crown and Church' }) + '</td></tr>' +
                '<tr><td>' + L({ es:'Cada señorío con su gobernante y sus dioses', en:'Each lordship with its ruler and its gods' }) + '</td><td>' + L({ es:'Pueblos de indios, una religión oficial y frailes en cada región', en:'Indigenous towns, one official religion and friars in each region' }) + '</td></tr>' +
                '<tr><td>' + L({ es:'Guerra para capturar y para cobrar tributo', en:'War to capture and to collect tribute' }) + '</td><td>' + L({ es:'Autoridades nombradas desde una capital y desde Europa', en:'Authorities appointed from a capital and from Europe' }) + '</td></tr></table>' +
              '<div class="callout"><p><strong>Ruptura con continuidades.</strong> Cambiaron el gobierno, la religión oficial y la forma de trabajar; siguieron las lenguas, los cultivos, los mercados y los pueblos.</p></div>',
          en:'<p>On 13 August 1521 a battle did not end: a political order that had worked for almost a century ended. On the ruins of Tenochtitlan the city of Mexico was laid out and from there a new territory was organized, New Spain, with laws written in another language, another official religion and other authorities. In 1524 the first twelve Franciscan friars arrived, in charge of evangelization; in 1535 the first viceroy arrived; in 1546 the silver mines of Zacatecas were opened and mining reorganized routes, towns and labour.</p>' +
              '<p>What changed above all was the way of demanding. Tribute stopped being divided among three cities and went to new beneficiaries: encomenderos who received the labour and the deliveries of whole towns, the Crown that collected its share and the Church that supported its works. Products that had not been grown before were demanded, along with deliveries in money and compulsory turns of labour in building works, fields and mines. Many towns were gathered by order into new settlements, far from the lands they had always held.</p>' +
              '<p>And even so, the rupture was not a blank page. The altepetl went on existing under another name, as an indigenous town with its head settlement, its common lands and its local authorities; several indigenous rulers kept offices and privileges, and Tlaxcala obtained separate treatment for its role in the campaign. Maize and the chinampas remained, along with the tianguis, the farming calendars, the languages, the crafts and the names of places, which we still use today. The colonial order was raised upon towns, knowledge and labour that were already there.</p>' +
              '<table class="dtable"><tr><th>' + L({ es:'Antes de 1521', en:'Before 1521' }) + '</th><th>' + L({ es:'Después de 1521', en:'After 1521' }) + '</th></tr>' +
                '<tr><td>' + L({ es:'Tributo repartido entre tres ciudades de la Alianza', en:'Tribute divided among three cities of the Alliance' }) + '</td><td>' + L({ es:'Tributo y trabajo para encomenderos, Corona e Iglesia', en:'Tribute and labour for encomenderos, Crown and Church' }) + '</td></tr>' +
                '<tr><td>' + L({ es:'Cada señorío con su gobernante y sus dioses', en:'Each lordship with its ruler and its gods' }) + '</td><td>' + L({ es:'Pueblos de indios, una religión oficial y frailes en cada región', en:'Indigenous towns, one official religion and friars in each region' }) + '</td></tr>' +
                '<tr><td>' + L({ es:'Guerra para capturar y para cobrar tributo', en:'War to capture and to collect tribute' }) + '</td><td>' + L({ es:'Autoridades nombradas desde una capital y desde Europa', en:'Authorities appointed from a capital and from Europe' }) + '</td></tr></table>' +
              '<div class="callout"><p><strong>A rupture with continuities.</strong> The government, the official religion and the way of working changed; the languages, the crops, the markets and the towns remained.</p></div>' }));

  addSection(L({ es:'Explora', en:'Explore' }), L({ es:'El disco de los años', en:'The dial of the years' }),
    L({ es:'<p>Gira el disco y observa cómo cambia la descripción de lo que ocurría en la región. Después coloca el año exacto de cada hecho que se te pida.</p>',
        en:'<p>Turn the dial and watch how the description of what was happening in the region changes. Then set the exact year of each fact you are asked about.</p>' }) +
    '<div class="mzone" id="mzD"></div>');
  mD_build(rng); mD_render();

  /* ── PROBLEMA 7 ── */
  addProblem(v7 === 0 ? {
    title: L({ es:'Otro desenlace posible', en:'Another possible outcome' }),
    questionText: L({ es:'Un equipo imagina un desenlace distinto para 1521: los señoríos en tensión con la Triple Alianza no ofrecen guerreros, cargadores ni alimento a la expedición y le cierran los caminos del altiplano. Al articular así los factores, ¿cuál conclusión se sostiene mejor?',
                      en:'A team imagines a different outcome for 1521: the lordships in tension with the Triple Alliance offer no warriors, carriers or food to the expedition and close the roads of the highland to it. Articulating the factors that way, which conclusion holds up best?' }),
    hint: L({ es:'Compara el número de integrantes de la expedición con el de sus aliados y pregúntate quién sostenía el abasto y las marchas.',
              en:'Compare the number of members of the expedition with that of its allies and ask yourself who sustained the supply and the marches.' }),
    explanation: L({ es:'Sin aliados que aportaran combatientes, carga, comida y caminos seguros, la campaña habría tenido enormes dificultades para sostenerse tan lejos de la costa: las armas y los caballos no cubrían esas necesidades.',
                     en:'Without allies providing fighters, transport, food and safe roads, the campaign would have had enormous difficulty sustaining itself so far from the coast: weapons and horses did not cover those needs.' }),
    options: [ L({ es:'Que sin esos apoyos la campaña habría tenido enormes dificultades para sostenerse tierra adentro', en:'That without that support the campaign would have had enormous difficulty sustaining itself inland' }),
               L({ es:'Que el resultado habría sido igual, porque las armas de acero decidían por sí solas', en:'That the result would have been the same, because steel weapons decided on their own' }),
               L({ es:'Que la campaña habría terminado el primer mes por falta de puertos en la costa del Golfo', en:'That the campaign would have ended in the first month for lack of ports on the Gulf coast' }),
               L({ es:'Que la Triple Alianza habría desaparecido igualmente por sus conflictos internos', en:'That the Triple Alliance would have disappeared anyway because of its internal conflicts' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Por qué se llama ruptura', en:'Why it is called a rupture' }),
    questionText: L({ es:'Un equipo sostiene que la Conquista fue un momento de ruptura en la historia de nuestro país. ¿Cuál argumento sostiene mejor esa afirmación?',
                      en:'A team argues that the Conquest was a moment of rupture in the history of our country. Which argument best supports that statement?' }),
    hint: L({ es:'Revisa cuántos aspectos de la vida de la gente se modificaron al mismo tiempo y cuáles siguieron igual.',
              en:'Review how many aspects of the life of the people changed at the same time and which ones stayed the same.' }),
    explanation: L({ es:'Se llama ruptura porque en pocos años cambiaron a la vez el gobierno, la religión oficial, la forma de exigir trabajo y tributo y la vida cotidiana de la mayoría, aunque muchas costumbres y pueblos siguieran en pie.',
                     en:'It is called a rupture because in a few years the government, the official religion, the way of demanding labour and tribute and the daily life of the majority all changed at once, even though many customs and towns remained.' }),
    options: [ L({ es:'Que cambiaron a la vez el gobierno, la religión oficial, el trabajo exigido y la vida diaria', en:'That the government, the official religion, the labour demanded and daily life all changed at once' }),
               L({ es:'Que a partir de 1521 desaparecieron todas las lenguas y las costumbres anteriores', en:'That from 1521 on, all the earlier languages and customs disappeared' }),
               L({ es:'Que los cambios se limitaron a los nombres de las ciudades y de las autoridades', en:'That the changes were limited to the names of the cities and of the authorities' }),
               L({ es:'Que el territorio quedó despoblado y todo tuvo que fundarse desde cero', en:'That the territory was left unpopulated and everything had to be founded from scratch' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ── PROBLEMA 8 ── */
  addProblem(v8 === 0 ? {
    title: L({ es:'Distancia entre dos hechos', en:'Distance between two facts' }),
    questionText: L({ es:'En su cuaderno, un equipo anota dos hechos de este proceso: ' + L(ru.ea) + ', en ' + ru.a + ', y ' + L(ru.eb) + ', en ' + ru.b + '. ¿Cuántos años separan un hecho del otro?',
                      en:'In their notebook, a team writes down two facts of this process: ' + L(ru.ea) + ', in ' + ru.a + ', and ' + L(ru.eb) + ', in ' + ru.b + '. How many years separate one fact from the other?' }),
    hint: L({ es:'Identifica cuál de los dos años es el más reciente antes de operar con ellos.',
              en:'Identify which of the two years is the more recent one before operating with them.' }),
    explanation: L({ es:'El año más reciente es ' + ru.b + ' y el más antiguo es ' + ru.a + ': ' + ru.b + ' - ' + ru.a + ' = ' + rud,
                     en:'The more recent year is ' + ru.b + ' and the older one is ' + ru.a + ': ' + ru.b + ' - ' + ru.a + ' = ' + rud }),
    options: [ rud + L(ANO), (rud + 10) + L(ANO), (rud + 1) + L(ANO), (2 * rud) + L(ANO) ],
    correct: 0, showWork: true
  } : {
    title: L({ es:'La tira del salón', en:'The strip for the classroom' }),
    questionText: L({ es:'Un equipo dibuja una tira del tiempo con una escala de dos centímetros por año. El tramo que va a trazar empieza en ' + ru2.a + ', con ' + L(ru2.ea) + ', y termina en ' + ru2.b + ', con ' + L(ru2.eb) + '. ¿Cuántos centímetros medirá ese tramo?',
                      en:'A team draws a time strip with a scale of two centimeters per year. The stretch they will trace starts in ' + ru2.a + ', with ' + L(ru2.ea) + ', and ends in ' + ru2.b + ', with ' + L(ru2.eb) + '. How many centimeters will that stretch measure?' }),
    hint: L({ es:'Averigua cuántos años abarca el tramo y recuerda cuánto mide cada año en el dibujo.',
              en:'Work out how many years the stretch covers and remember how much each year measures in the drawing.' }),
    explanation: L({ es:'El tramo abarca ' + ru2.b + ' - ' + ru2.a + ' = ' + rud2 + ' años, y a dos centímetros por año mide ' + rud2 + ' x 2 = ' + (2*rud2),
                     en:'The stretch covers ' + ru2.b + ' - ' + ru2.a + ' = ' + rud2 + ' years, and at two centimeters per year it measures ' + rud2 + ' x 2 = ' + (2*rud2) }),
    options: [ (2*rud2) + L(CEN), rud2 + L(CEN), (4*rud2) + L(CEN), (2*rud2 + 10) + L(CEN) ],
    correct: 0, showWork: true
  }, rng);

  /* ── PROBLEMA 9 ── */
  addProblem(v9 === 0 ? {
    title: L({ es:'Revisar la forma de exigir', en:'Reviewing the way of demanding' }),
    questionText: L({ es:'Con el nuevo orden, muchos pueblos quedaron obligados a entregar tributo en productos y en dinero y a dar turnos de trabajo en obras, campos y minas, sin poder negarse. Si revisas esas formas de exacción desde valores como la libertad y la justicia, ¿cuál objeción se sostiene?',
                      en:'Under the new order, many towns were obliged to hand over tribute in goods and in money and to give turns of labour in building works, fields and mines, with no possibility of refusing. If you review those forms of exaction from values such as freedom and justice, which objection holds up?' }),
    hint: L({ es:'Pregúntate quién decidía esas obligaciones, quién las cumplía y si hubo acuerdo entre las dos partes.',
              en:'Ask yourself who decided those obligations, who fulfilled them and whether there was an agreement between the two sides.' }),
    explanation: L({ es:'La objeción central es que el trabajo y las entregas se imponían sin el consentimiento de quienes los cumplían y sin un pago acordado: eso choca con la libertad de decidir y con un reparto justo del esfuerzo.',
                     en:'The central objection is that the labour and the deliveries were imposed without the consent of those who fulfilled them and without an agreed payment: that clashes with the freedom to decide and with a fair sharing of effort.' }),
    options: [ L({ es:'Que el trabajo y las entregas se imponían sin consentimiento de quienes los cumplían ni pago acordado', en:'That the labour and the deliveries were imposed without the consent of those who fulfilled them or an agreed payment' }),
               L({ es:'Que el tributo se cobraba en productos que no se cultivaban en Europa', en:'That the tribute was collected in goods that were not grown in Europe' }),
               L({ es:'Que las entregas se hacían en fechas fijas y no cuando el pueblo podía reunirlas', en:'That the deliveries were made on fixed dates and not when the town could gather them' }),
               L({ es:'Que los pueblos no llevaban un registro escrito de todo lo que entregaban', en:'That the towns did not keep a written record of everything they handed over' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Lo que siguió en pie', en:'What remained standing' }),
    questionText: L({ es:'Después de 1521 siguieron en pie el maíz y las chinampas, los tianguis, las lenguas de la región, los oficios y muchos límites y nombres de los pueblos anteriores. ¿Qué muestra esa continuidad sobre el orden que se construyó entonces?',
                      en:'After 1521 maize and the chinampas remained, along with the tianguis, the languages of the region, the crafts and many boundaries and names of the earlier towns. What does that continuity show about the order that was built then?' }),
    hint: L({ es:'Piensa de dónde salían el alimento, el trabajo y la organización local que el nuevo gobierno necesitaba para funcionar.',
              en:'Think about where the food, the labour and the local organization that the new government needed in order to work came from.' }),
    explanation: L({ es:'Muestra que el orden colonial se levantó sobre pueblos, cultivos y saberes que ya existían, y que dependió de ellos para funcionar: no se instaló en un territorio vacío.',
                     en:'It shows that the colonial order was raised upon towns, crops and knowledge that already existed, and that it depended on them in order to work: it was not installed in an empty territory.' }),
    options: [ L({ es:'Que se levantó sobre pueblos, cultivos y saberes que ya existían y dependió de ellos', en:'That it was raised upon towns, crops and knowledge that already existed and depended on them' }),
               L({ es:'Que el cambio de 1521 no modificó el gobierno ni la religión oficial de la región', en:'That the change of 1521 did not modify the government or the official religion of the region' }),
               L({ es:'Que la población anterior había abandonado la región y dejó atrás sus cultivos', en:'That the earlier population had abandoned the region and left its crops behind' }),
               L({ es:'Que esas costumbres llegaron de Europa y se sumaron después a las locales', en:'That those customs came from Europe and were added later to the local ones' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ── PROBLEMA 10 ── */
  addProblem(v10 === 0 ? {
    title: L({ es:'Dos versiones del mismo hecho', en:'Two versions of the same fact' }),
    questionText: L({ es:'Dos textos explican lo ocurrido en 1521. El primero dice que un grupo de extranjeros venció por sí solo a un imperio; el segundo dice que un conflicto entre señoríos mesoamericanos se resolvió con la participación decisiva de una expedición extranjera. ¿Cuál explicación se sostiene mejor con lo que se sabe de la campaña?',
                      en:'Two texts explain what happened in 1521. The first says that a group of foreigners defeated an empire on its own; the second says that a conflict among Mesoamerican lordships was settled with the decisive participation of a foreign expedition. Which explanation holds up better with what is known about the campaign?' }),
    hint: L({ es:'Recuerda quiénes formaban la mayor parte de la fuerza que sitió la ciudad y qué buscaban esos señoríos.',
              en:'Remember who made up most of the force that besieged the city and what those lordships were after.' }),
    explanation: L({ es:'La segunda, porque decenas de miles de guerreros de señoríos de la región participaron en la campaña por sus propios intereses, y sin ellos el sitio no se habría sostenido.',
                     en:'The second one, because tens of thousands of warriors from lordships of the region took part in the campaign for their own interests, and without them the siege could not have been sustained.' }),
    options: [ L({ es:'La segunda, porque decenas de miles de guerreros de la región participaron por sus propios intereses', en:'The second one, because tens of thousands of warriors from the region took part for their own interests' }),
               L({ es:'La primera, porque las armas y los caballos hacían innecesario cualquier apoyo local', en:'The first one, because weapons and horses made any local support unnecessary' }),
               L({ es:'Ninguna, porque no se conservan registros de lo que ocurrió en esos años', en:'Neither, because no records of what happened in those years survive' }),
               L({ es:'Las dos por igual, porque describen hechos distintos que no se relacionan entre sí', en:'Both equally, because they describe different facts that are unrelated to each other' }) ],
    correct: 0, showWork: false
  } : {
    title: L({ es:'Lo que esperaban los aliados', en:'What the allies expected' }),
    questionText: L({ es:'Los señoríos que apoyaron a la expedición esperaban conservar su autonomía y quedar libres de tributo una vez terminada la campaña. ¿Qué ocurrió con ellos en las décadas siguientes?',
                      en:'The lordships that supported the expedition expected to keep their autonomy and to be free of tribute once the campaign was over. What happened to them in the following decades?' }),
    hint: L({ es:'Considera quién repartía el tributo y el trabajo después de 1521 y si algún señorío quedó fuera de ese reparto.',
              en:'Consider who distributed tribute and labour after 1521 and whether any lordship was left out of that distribution.' }),
    explanation: L({ es:'Quedaron integrados al nuevo orden: algunos, como Tlaxcala, obtuvieron privilegios y reconocimientos, pero en general fueron sujetos a tributo y a trabajo obligatorio como el resto de los pueblos.',
                     en:'They were integrated into the new order: some, such as Tlaxcala, obtained privileges and recognitions, but in general they were subject to tribute and compulsory labour like the rest of the towns.' }),
    options: [ L({ es:'Quedaron integrados al nuevo orden, algunos con privilegios y casi todos con tributo y trabajo obligatorio', en:'They were integrated into the new order, some with privileges and almost all with tribute and compulsory labour' }),
               L({ es:'Fueron reconocidos como reinos independientes con sus propias leyes y su propio ejército', en:'They were recognized as independent kingdoms with their own laws and their own army' }),
               L({ es:'Recibieron el gobierno de las provincias que antes pagaban tributo a la Triple Alianza', en:'They received the government of the provinces that had previously paid tribute to the Triple Alliance' }),
               L({ es:'Abandonaron sus pueblos y se trasladaron a las ciudades fundadas en la costa del Golfo', en:'They abandoned their towns and moved to the cities founded on the Gulf coast' }) ],
    correct: 0, showWork: false
  }, rng);

  /* ══════════ CIERRE ══════════ */
  addSection(L({ es:'Cierre', en:'Closing' }), L({ es:'Un mapa que ya estaba en tensión', en:'A map that was already under strain' }),
    L({ es:'<p>Lo que ocurrió entre 1519 y 1521 no se explica con un solo bando ni con una sola causa. Había cientos de señoríos con cuentas pendientes entre ellos, una alianza que cobraba tributo sin gobernar de cerca, una expedición pequeña que supo leer esas tensiones, un puñado de ventajas técnicas y una enfermedad nueva que llegó en el peor momento. De ese cruce salió una ruptura que cambió el gobierno, la religión oficial y la forma de trabajar de millones de personas, y que dejó en pie lenguas, cultivos y pueblos que todavía reconocemos.</p>' +
              '<div class="callout"><p><strong>Para tu cuaderno.</strong> Elige uno de los seis factores y escribe qué habría cambiado si ese solo factor hubiera faltado. Después subraya la parte de tu respuesta que no puedes comprobar con datos: ahí empieza el trabajo del historiador.</p></div>',
        en:'<p>What happened between 1519 and 1521 cannot be explained with a single side or a single cause. There were hundreds of lordships with unsettled accounts among them, an alliance that collected tribute without governing closely, a small expedition that knew how to read those tensions, a handful of technical advantages and a new disease that arrived at the worst moment. Out of that crossing came a rupture that changed the government, the official religion and the way of working of millions of people, and that left standing languages, crops and towns that we still recognize.</p>' +
              '<div class="callout"><p><strong>For your notebook.</strong> Choose one of the six factors and write what would have changed if that single factor had been missing. Then underline the part of your answer that you cannot check with evidence: that is where the work of the historian begins.</p></div>' }));
}
</script>

<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Tensiones entre Señoríos Mesoamericanos y Colonizadores';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
