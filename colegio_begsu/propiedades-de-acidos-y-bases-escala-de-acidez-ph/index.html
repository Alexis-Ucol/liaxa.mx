                 'Pour the waste down the drain with plenty of water, because once spread out its pH stops mattering'] },
      ci:0,
      hint:{ es:'El residuo tiene exceso de iones hidrógeno, así que necesita la sustancia que aporta el ion contrario, agregada de manera controlada y con medición entre paso y paso.',
             en:'The waste has an excess of hydrogen ions, so it needs the substance that provides the opposite ion, added in a controlled way and with a measurement between one step and the next.' },
      exp:{ es:'El hidróxido de sodio es la única sustancia de la mesa que aporta iones hidróxido para neutralizar al ácido, y hay que agregarla poco a poco porque pasarse llevaría el residuo por encima de 9 y volvería a incumplir la norma. Las tiras dicen cuándo detenerse. El vinagre es ácido y agregar agua reparte el ácido sin eliminarlo.',
            en:'Sodium hydroxide is the only substance on the bench that provides hydroxide ions to neutralize the acid, and it has to be added little by little because overshooting would take the waste above 9 and break the rule again. The strips say when to stop. Vinegar is acidic and adding water spreads the acid out without removing it.' } },
    { title:{ es:'El argumento de la empresa', en:'The argument of the company' },
      showWork:true,
      q:{ es:'Una empresa vierte al río un residuo que marca pH 3 y sostiene que no hay daño porque el río es muy grande y todo se diluye. ¿Cuál es la respuesta mejor fundamentada?',
          en:'A company pours into the river a waste that reads pH 3 and claims there is no harm because the river is very large and everything gets diluted. What is the best founded answer?' },
      opts:{ es:['El residuo es diez mil veces más ácido que el agua neutra y debe neutralizarse antes de verterse: diluir no es tratar',
                 'El residuo es cuatro veces más ácido que el agua neutra, así que basta con verterlo lejos de la orilla',
                 'El residuo solo sería peligroso si su pH fuera mayor que 7, porque las corrosivas son las bases',
                 'El daño depende únicamente del volumen que se vierte y no del valor del pH que trae el residuo'],
             en:['The waste is ten thousand times more acidic than neutral water and has to be neutralized before being poured: diluting is not treating',
                 'The waste is four times more acidic than neutral water, so it is enough to pour it far from the bank',
                 'The waste would only be dangerous if its pH were higher than 7, because the corrosive ones are the bases',
                 'The harm depends only on the volume poured and not on the pH value the waste carries'] },
      ci:0,
      hint:{ es:'Convierte la distancia hasta el 7 en un factor de diez por unidad antes de opinar, y recuerda que la dilución reparte al ácido pero no cambia su naturaleza.',
             en:'Turn the distance to 7 into a factor of ten per unit before giving an opinion, and remember that dilution spreads the acid out but does not change its nature.' },
      exp:{ es:'De pH 3 a pH 7 hay cuatro unidades, y cada una vale un factor de diez: el residuo lleva diez mil veces más iones hidrógeno que el agua neutra. Diluir baja la concentración en el punto de descarga, pero el ácido sigue ahí y afecta a los organismos cercanos, por eso la norma pide neutralizarlo y comprobar el pH antes de verterlo.',
            en:'From pH 3 to pH 7 there are four units, and each one is worth a factor of ten: the waste carries ten thousand times more hydrogen ions than neutral water. Diluting lowers the concentration at the discharge point, but the acid is still there and affects the organisms nearby, which is why the rule asks for it to be neutralized and the pH checked before pouring.' } }
  ]);
}

/* ══════════════════════════════════════════════════════════════════════════
   LECCION
   ══════════════════════════════════════════════════════════════════════════ */
function buildLesson(rng){
  injectGuideCSS();

  sec(
    L({ es:'Punto de partida', en:'Starting point' }),
    L({ es:'Ácidos y bases están en todo lo que tocas', en:'Acids and bases are in everything you touch' }),
    '<p>' + L({
      es:'El limón que exprimes, el refresco que enfrías, el jabón con el que te lavas las manos, el limpiador del baño y la pastilla que alguien toma para el ardor de estómago pertenecen a dos familias de sustancias que se comportan de manera opuesta. Una ataca metales y disuelve el esmalte de los dientes; la otra se siente resbalosa y deshace la grasa. Puestas juntas, en cambio, se anulan.',
      en:'The lemon you squeeze, the soft drink you chill, the soap you wash your hands with, the bathroom cleaner and the tablet someone takes for a burning stomach belong to two families of substances that behave in opposite ways. One attacks metals and dissolves the enamel of teeth; the other feels slippery and breaks down grease. Put together, though, they cancel each other out.'
    }) + '</p>' +
    '<p>' + L({
      es:'En esta guía vas a reconocer a cada familia por sus propiedades, a usar indicadores para identificarlas sin probarlas ni tocarlas, a leer la escala de acidez con el cuidado que exige y a deducir qué se forma cuando un ácido y una base se encuentran. Al final vas a poder mirar la etiqueta de un producto de tu casa y decidir, con argumentos, para qué sirve y qué riesgo tiene.',
      en:'In this guide you will recognize each family by its properties, use indicators to identify them without tasting or touching them, read the acidity scale with the care it demands and deduce what forms when an acid and a base meet. By the end you will be able to look at the label of a product in your home and decide, with arguments, what it is for and what risk it carries.'
    }) + '</p>' +
    '<div class="gw-lbl">' + L({ es:'Lo que vas a poder decidir', en:'What you will be able to decide' }) + '</div>' +
    '<div>' +
      '<span class="gw-chip">' + L({ es:'propiedades de los ácidos', en:'properties of acids' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'propiedades de las bases', en:'properties of bases' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'iones hidrógeno e hidróxido', en:'hydrogen and hydroxide ions' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'indicadores', en:'indicators' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'escala de acidez', en:'acidity scale' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'neutralización', en:'neutralization' }) + '</span>' +
      '<span class="gw-chip">' + L({ es:'beneficios y riesgos', en:'benefits and risks' }) + '</span>' +
    '</div>'
  );

  /* ══ CONCEPTO 1 ══ */
  var s1 = sec(
    L({ es:'Concepto 1', en:'Concept 1' }),
    L({ es:'Dos familias que se delatan por lo que hacen', en:'Two families that give themselves away by what they do' }),
    '<p>' + L({
      es:'Las disoluciones ácidas comparten un grupo de propiedades que se pueden comprobar sin probarlas: tienen sabor agrio, aunque en el laboratorio nunca se prueba nada; atacan varios metales y desprenden un gas ligero; hacen burbujear al mármol y a las cáscaras de huevo, que están hechas de carbonato; y conducen la electricidad. Las disoluciones básicas comparten otro grupo: se sienten resbalosas o jabonosas, disuelven las grasas, tienen sabor amargo y también conducen la electricidad.',
      en:'Acidic solutions share a group of properties that can be checked without tasting them: they taste sour, although in the laboratory nothing is ever tasted; they attack several metals and release a light gas; they make marble and eggshells bubble, which are made of carbonate; and they conduct electricity. Basic solutions share another group: they feel slippery or soapy, they dissolve fats, they taste bitter and they also conduct electricity.'
    }) + '</p>' +
    '<p>' + L({
      es:'Detrás de esas listas hay una sola explicación, propuesta por Arrhenius: lo que decide el comportamiento es el ion que la sustancia suelta al disolverse en agua. Un ácido libera iones hidrógeno; una base libera iones hidróxido. Como en los dos casos quedan partículas con carga moviéndose entre el agua, las dos familias conducen la electricidad, y por eso la conducción avisa que hay iones pero no dice de cuáles se trata. Una disolución neutra, como el agua destilada, no tiene exceso de ninguno de los dos.',
      en:'Behind those lists there is a single explanation, put forward by Arrhenius: what decides the behaviour is the ion the substance releases when it dissolves in water. An acid releases hydrogen ions; a base releases hydroxide ions. Since in both cases there are charged particles moving through the water, both families conduct electricity, and that is why conduction warns that there are ions but does not say which ones. A neutral solution, such as distilled water, has no excess of either of the two.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Ácido', en:'Acid' }), L({ es:'libera H<sup>+</sup>', en:'releases H<sup>+</sup>' }), L({ es:'ataca metales y carbonatos, sabor agrio', en:'attacks metals and carbonates, sour taste' })) +
      rcard(L({ es:'Base', en:'Base' }), L({ es:'libera OH<sup>-</sup>', en:'releases OH<sup>-</sup>' }), L({ es:'tacto resbaloso, disuelve grasas, sabor amargo', en:'slippery feel, dissolves fats, bitter taste' })) +
      rcard(L({ es:'Conducción', en:'Conduction' }), L({ es:'hay iones', en:'there are ions' }), L({ es:'avisa que hay iones, no dice de qué tipo', en:'it warns that there are ions, not which type' })) +
      rcard(L({ es:'Neutra', en:'Neutral' }), L({ es:'sin exceso', en:'no excess' }), L({ es:'ni un ion ni el otro predomina, como en el agua destilada', en:'neither ion prevails, as in distilled water' })) +
    '</div>' +
    '<div class="callout"><p><strong>' + L({ es:'Seguridad primero: ', en:'Safety first: ' }) + '</strong>' + L({
      es:'el sabor y el tacto sirven para describir a estas sustancias, nunca para identificarlas. En el laboratorio y en casa se reconocen con pruebas indirectas.',
      en:'taste and touch are useful for describing these substances, never for identifying them. In the laboratory and at home they are recognized with indirect tests.'
    }) + '</p></div>'
  );
  wPropiedades(rng, widgetHost(s1, 'wPropiedades', 'clasifica'));
  addProblem(rng, mkP1(rng));
  addProblem(rng, mkP2(rng));

  /* ══ CONCEPTO 2 ══ */
  var s2 = sec(
    L({ es:'Concepto 2', en:'Concept 2' }),
    L({ es:'Indicadores: sustancias que responden con color', en:'Indicators: substances that answer with colour' }),
    '<p>' + L({
      es:'Un indicador es una sustancia que cambia de color según el medio en el que se encuentra, y por eso permite identificar a un ácido o a una base sin probar ni tocar nada. El papel tornasol azul se vuelve rojo en medio ácido y se queda igual en los demás casos. El papel tornasol rojo se vuelve azul en medio básico y se queda igual en los demás. La fenolftaleína es incolora y se tiñe de rosa intenso solo cuando hay iones hidróxido en exceso.',
      en:'An indicator is a substance that changes colour according to the medium it is in, and that is why it allows an acid or a base to be identified without tasting or touching anything. Blue litmus paper turns red in an acidic medium and stays the same in the other cases. Red litmus paper turns blue in a basic medium and stays the same in the others. Phenolphthalein is colourless and turns deep pink only when there are hydroxide ions in excess.'
    }) + '</p>' +
    '<p>' + L({
      es:'El extracto de col morada es el indicador casero más útil porque responde con una secuencia completa de colores: rosa del lado ácido, violeta en el centro, verde del lado básico y amarillo cuando la basicidad es muy alta. Esa secuencia es lo que hace la diferencia. Los indicadores de dos respuestas dejan siempre dos casos juntos: un tubo incoloro con fenolftaleína puede ser ácido o neutro, y un papel tornasol azul sin cambio puede venir de una muestra neutra o de una básica. Por eso, cuando la pregunta tiene tres respuestas posibles, hace falta un indicador que también distinga tres.',
      en:'Red cabbage extract is the most useful homemade indicator because it answers with a complete sequence of colours: pink on the acidic side, violet in the centre, green on the basic side and yellow when the basicity is very high. That sequence is what makes the difference. Two answer indicators always leave two cases together: a colourless tube with phenolphthalein can be acidic or neutral, and an unchanged blue litmus paper can come from a neutral sample or a basic one. That is why, when the question has three possible answers, an indicator that also distinguishes three is needed.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Tornasol azul', en:'Blue litmus' }), L({ es:'rojo con ácido', en:'red with acid' }), L({ es:'sin cambio en lo neutro y en lo básico', en:'unchanged in neutral and basic media' })) +
      rcard(L({ es:'Tornasol rojo', en:'Red litmus' }), L({ es:'azul con base', en:'blue with base' }), L({ es:'sin cambio en lo neutro y en lo ácido', en:'unchanged in neutral and acidic media' })) +
      rcard(L({ es:'Fenolftaleína', en:'Phenolphthalein' }), L({ es:'rosa con base', en:'pink with base' }), L({ es:'incolora en lo ácido y en lo neutro por igual', en:'colourless in acidic and neutral media alike' })) +
      rcard(L({ es:'Col morada', en:'Red cabbage' }), L({ es:'rosa, violeta, verde', en:'pink, violet, green' }), L({ es:'la única que separa los tres casos de una vez', en:'the only one that separates the three cases at once' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Un color por sí solo no es una conclusión: hay que saber qué respuestas puede dar el indicador que se usó antes de decidir qué significa la que se obtuvo.',
      en:'A colour on its own is not a conclusion: you have to know which answers the indicator you used can give before deciding what the one you got means.'
    }) + '</p></div>'
  );
  wIndicador(rng, widgetHost(s2, 'wIndicador', 'indicador'));
  addProblem(rng, mkP3(rng));
  addProblem(rng, mkP4(rng));

  /* ══ CONCEPTO 3 ══ */
  var s3 = sec(
    L({ es:'Concepto 3', en:'Concept 3' }),
    L({ es:'La escala de acidez mide cuánto, no solo cuál', en:'The acidity scale measures how much, not only which' }),
    '<p>' + L({
      es:'Los indicadores dicen de qué lado está una disolución, pero no qué tan lejos. Para eso existe la escala de acidez, que va de 0 a 14. El 7 es el punto neutro, donde están el agua destilada y el agua pura. Por debajo de 7 la disolución es ácida, y mientras más se acerca a 0 más iones hidrógeno tiene. Por encima de 7 es básica, y mientras más se acerca a 14 más iones hidróxido tiene. Se mide con tiras de indicador universal, que dan un color por cada intervalo, o con un medidor digital, que da el número directo.',
      en:'Indicators say which side a solution is on, but not how far. That is what the acidity scale is for, and it runs from 0 to 14. The 7 is the neutral point, where distilled water and pure water sit. Below 7 the solution is acidic, and the closer it gets to 0 the more hydrogen ions it has. Above 7 it is basic, and the closer it gets to 14 the more hydroxide ions it has. It is measured with universal indicator strips, which give one colour per range, or with a digital meter, which gives the number directly.'
    }) + '</p>' +
    '<p>' + L({
      es:'Hay un detalle que cambia por completo la lectura de la escala: los saltos no son parejos. Cada unidad que se baja multiplica por diez la concentración de iones hidrógeno. Un refresco de pH 3 no es un poco más ácido que un jugo de naranja de pH 4: es diez veces más ácido, y cien veces más que un café de pH 5. Por eso agregar agua a un ácido sube su valor de a poco, porque diluir diez veces solo mueve una unidad, y por más agua que se agregue el valor se acerca a 7 sin cruzarlo.',
      en:'There is one detail that completely changes how the scale is read: the steps are not even. Each unit you go down multiplies the concentration of hydrogen ions by ten. A soft drink at pH 3 is not a little more acidic than an orange juice at pH 4: it is ten times more acidic, and one hundred times more than a coffee at pH 5. That is why adding water to an acid raises its value slowly, because diluting ten times only moves it one unit, and no matter how much water is added the value gets closer to 7 without crossing it.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'De 0 a 7', en:'From 0 to 7' }), L({ es:'zona ácida', en:'acidic zone' }), L({ es:'mientras menor es el número, más iones hidrógeno hay', en:'the lower the number, the more hydrogen ions there are' })) +
      rcard(L({ es:'El 7', en:'The 7' }), L({ es:'punto neutro', en:'neutral point' }), L({ es:'ni un ion ni el otro predomina', en:'neither ion prevails' })) +
      rcard(L({ es:'De 7 a 14', en:'From 7 to 14' }), L({ es:'zona básica', en:'basic zone' }), L({ es:'mientras mayor es el número, más iones hidróxido hay', en:'the higher the number, the more hydroxide ions there are' })) +
      rcard(L({ es:'Cada unidad', en:'Each unit' }), L({ es:'factor de diez', en:'factor of ten' }), L({ es:'un salto vale diez veces, dos saltos valen cien', en:'one step is worth ten times, two steps are worth one hundred' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Una diferencia de dos unidades parece pequeña escrita como número, pero significa cien veces más iones hidrógeno. En esta escala nunca se restan los valores para medir el cambio.',
      en:'A difference of two units looks small written as a number, but it means one hundred times more hydrogen ions. On this scale the values are never subtracted to measure the change.'
    }) + '</p></div>'
  );
  wEscala(rng, widgetHost(s3, 'wEscala', 'escala'));
  addProblem(rng, mkP5(rng));
  addProblem(rng, mkP6(rng));

  /* ══ CONCEPTO 4 ══ */
  var s4 = sec(
    L({ es:'Concepto 4', en:'Concept 4' }),
    L({ es:'Cuando un ácido y una base se encuentran', en:'When an acid and a base meet' }),
    '<p>' + L({
      es:'Si se mezclan cantidades equivalentes de un ácido y de una base ocurre una neutralización. En el modelo de Arrhenius se explica con los iones que cada uno aportó: el ion hidrógeno del ácido y el ion hidróxido de la base se unen y forman agua. Los iones que quedan sueltos, el del metal que traía la base y el que acompañaba al ácido, se emparejan y forman una sal. Por eso el resultado se resume así: un ácido y una base producen una sal y agua, y el valor de la escala se acerca a 7.',
      en:'If equivalent amounts of an acid and a base are mixed, a neutralization happens. In the Arrhenius model it is explained with the ions each one provided: the hydrogen ion of the acid and the hydroxide ion of the base join and form water. The ions left loose, the one of the metal the base brought and the one that came with the acid, pair up and form a salt. That is why the result is summed up like this: an acid and a base produce a salt and water, and the value on the scale moves closer to 7.'
    }) + '</p>' +
    '<p>' + L({
      es:'Deducir los productos es entonces un ejercicio de emparejar cargas opuestas. Del ácido clorhídrico salen iones hidrógeno y iones cloruro; del hidróxido de sodio salen iones sodio e iones hidróxido; el resultado es cloruro de sodio, la sal de mesa, junto con agua. Ese mismo reparto explica situaciones cotidianas: una pastilla antiácida neutraliza el exceso de ácido del estómago, el bicarbonato se usa sobre un derrame de ácido en el piso y la cal corrige un suelo demasiado ácido para sembrar.',
      en:'Deducing the products is then an exercise in pairing opposite charges. Out of hydrochloric acid come hydrogen ions and chloride ions; out of sodium hydroxide come sodium ions and hydroxide ions; the result is sodium chloride, table salt, together with water. That same sharing out explains everyday situations: an antacid tablet neutralizes the excess of stomach acid, baking soda is used on an acid spill on the floor and lime corrects soil that is too acidic for planting.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'El agua', en:'The water' }), L({ es:'H<sup>+</sup> con OH<sup>-</sup>', en:'H<sup>+</sup> with OH<sup>-</sup>' }), L({ es:'siempre aparece, sin importar qué ácido y qué base sean', en:'it always appears, whatever the acid and the base are' })) +
      rcard(L({ es:'La sal', en:'The salt' }), L({ es:'los iones restantes', en:'the remaining ions' }), L({ es:'el metal de la base con el ion que traía el ácido', en:'the metal of the base with the ion the acid brought' })) +
      rcard(L({ es:'La escala', en:'The scale' }), L({ es:'se acerca a 7', en:'it moves towards 7' }), L({ es:'baja el exceso del ion que predominaba', en:'the excess of the prevailing ion goes down' })) +
      rcard(L({ es:'En la vida diaria', en:'In daily life' }), L({ es:'antiácidos y derrames', en:'antacids and spills' }), L({ es:'aliviar la acidez, tratar un derrame, corregir un suelo', en:'relieving acidity, treating a spill, correcting a soil' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'Neutralizar no es hacer desaparecer: las sustancias de partida se transforman en otras dos, y una de ellas siempre es agua.',
      en:'Neutralizing is not making things disappear: the starting substances turn into two others, and one of them is always water.'
    }) + '</p></div>'
  );
  wNeutraliza(rng, widgetHost(s4, 'wNeutraliza', 'neutraliza'));
  addProblem(rng, mkP7(rng));
  addProblem(rng, mkP8(rng));

  /* ══ CONCEPTO 5 ══ */
  var s5 = sec(
    L({ es:'Concepto 5', en:'Concept 5' }),
    L({ es:'Lo que estas sustancias resuelven y lo que pueden dañar', en:'What these substances solve and what they can damage' }),
    '<p>' + L({
      es:'Los ácidos y las bases sostienen buena parte de la vida diaria. El vinagre conserva alimentos, el jugo gástrico digiere lo que comemos, los limpiadores básicos deshacen la grasa de la cocina, los jabones se fabrican con una base, la cal corrige suelos ácidos y las plantas de tratamiento ajustan el pH del agua antes de devolverla a un río. Casi ninguna de esas aplicaciones sería posible sin la reacción de neutralización, que también sirve para tratar residuos antes de desecharlos.',
      en:'Acids and bases hold up a good part of daily life. Vinegar preserves food, gastric juice digests what we eat, basic cleaners break down kitchen grease, soaps are made with a base, lime corrects acidic soils and treatment plants adjust the pH of water before returning it to a river. Almost none of those applications would be possible without the neutralization reaction, which is also used to treat waste before disposing of it.'
    }) + '</p>' +
    '<p>' + L({
      es:'Los riesgos vienen de las mismas propiedades que las hacen útiles. Una disolución muy alejada del 7, en cualquiera de los dos sentidos, es corrosiva y quema la piel y los ojos: un destapacaños es tan peligroso como un ácido de batería. Mezclar productos de limpieza distintos puede liberar gases tóxicos en un cuarto cerrado. Y a mayor escala, los gases de las combustiones acidifican la lluvia y con ella lagos y suelos, mientras que un residuo ácido vertido sin tratar daña la vida del río que lo recibe. Leer la etiqueta, no mezclar productos, usar guantes y neutralizar antes de desechar son decisiones que dependen de entender esta química.',
      en:'The risks come from the same properties that make them useful. A solution far from 7, in either direction, is corrosive and burns skin and eyes: a drain cleaner is as dangerous as battery acid. Mixing different cleaning products can release toxic gases in a closed room. And on a larger scale, the gases from burning make rain acidic and with it lakes and soils, while an acidic waste poured out untreated damages the life of the river that receives it. Reading the label, not mixing products, wearing gloves and neutralizing before disposing are decisions that depend on understanding this chemistry.'
    }) + '</p>' +
    '<div class="rules-grid">' +
      rcard(L({ es:'Beneficio', en:'Benefit' }), L({ es:'salud y alimentos', en:'health and food' }), L({ es:'antiácidos, conservación con vinagre, digestión', en:'antacids, preserving with vinegar, digestion' })) +
      rcard(L({ es:'Beneficio', en:'Benefit' }), L({ es:'limpieza y campo', en:'cleaning and farming' }), L({ es:'jabones, limpiadores, corrección de suelos con cal', en:'soaps, cleaners, correcting soils with lime' })) +
      rcard(L({ es:'Riesgo', en:'Risk' }), L({ es:'en casa', en:'at home' }), L({ es:'quemaduras y gases tóxicos al mezclar productos', en:'burns and toxic gases when products are mixed' })) +
      rcard(L({ es:'Riesgo', en:'Risk' }), L({ es:'en el ambiente', en:'in the environment' }), L({ es:'lluvia ácida y residuos vertidos sin neutralizar', en:'acid rain and waste poured out without neutralizing' })) +
    '</div>' +
    '<div class="callout"><p>' + L({
      es:'La misma sustancia que resuelve un problema en la dosis correcta provoca otro fuera de ella. Evaluar un producto es comparar para qué sirve con qué puede dañar y en qué condiciones.',
      en:'The same substance that solves a problem at the right dose causes another one outside it. Weighing up a product means comparing what it is for with what it can damage and under which conditions.'
    }) + '</p></div>'
  );
  wCuaderno(rng, widgetHost(s5, 'wCuaderno', 'reflect'));
  addProblem(rng, mkP9(rng));

  /* ══ CIERRE ══ */
  addProblem(rng, mkP10(rng));
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Propiedades de Ácidos y Bases; Escala de Acidez (pH)';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
