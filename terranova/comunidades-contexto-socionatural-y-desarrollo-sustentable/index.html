<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunidades, Contexto Socionatural y Desarrollo Sustentable</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── INTERACTIVE WIDGETS ── */
.wgt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.1rem; margin:1rem 0; }
.wgt-h { font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--text3); margin-bottom:.55rem; font-weight:600; }
.wtask { background:var(--green-bg); border-radius:8px; padding:.6rem .85rem; font-size:.88rem; color:var(--text); margin:.6rem 0 .2rem; }
.wmsg { margin-top:.7rem; font-size:.83rem; padding:.6rem .8rem; border-radius:8px; background:var(--surface2); color:var(--text2); }
.wmsg.ok { background:var(--ok-bg); color:var(--ok); }
.wmsg.warn { background:var(--gold-bg); color:var(--text2); border-left:3px solid var(--gold); }
.wprog { font-size:.72rem; color:var(--text3); margin-top:.45rem; letter-spacing:.04em; }
.wbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:.5rem 1rem; font-size:.8rem; cursor:pointer; color:var(--text2); margin-top:.65rem; min-height:44px; font-family:inherit; }
.wbtn:hover { border-color:var(--green); color:var(--green); }
.cvbox { border:1px solid var(--border); border-radius:10px; background:var(--surface2); overflow:hidden; margin-bottom:.8rem; }
.wcv { display:block; width:100%; height:auto; }
.flowcols { display:flex; gap:.6rem; margin:.7rem 0 .2rem; }
.flowcol { flex:1; border:1.5px dashed var(--border); border-radius:10px; padding:.5rem; min-height:82px; }
.flowcol h4 { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; font-weight:600; }
.flowchip { background:var(--green-bg); border-radius:6px; padding:.3rem .45rem; font-size:.73rem; color:var(--text2); margin-bottom:.3rem; }
.cls-card { border:1.5px solid var(--border); border-radius:9px; background:var(--surface2); padding:.7rem .85rem; font-size:.86rem; font-weight:600; text-align:center; margin:.7rem 0; }
.cls-bins { display:flex; flex-wrap:wrap; gap:.5rem; }
.cls-bin { flex:1; min-width:135px; min-height:44px; border:1.5px solid var(--border); border-radius:9px; background:var(--surface); padding:.55rem .8rem; font-size:.83rem; font-family:inherit; color:var(--text2); cursor:pointer; transition:all .14s; }
.cls-bin:hover { border-color:var(--green); color:var(--green); }
.chiplist { display:flex; flex-direction:column; gap:.5rem; margin:.7rem 0 .2rem; }
.chip { border:1.5px solid var(--border); border-radius:9px; padding:.55rem .8rem; background:var(--surface2); cursor:pointer; font-size:.85rem; min-height:44px; display:flex; align-items:center; gap:.6rem; transition:all .14s; }
.chip:hover { border-color:var(--green); }
.chip.sel { border-color:var(--gold); background:var(--gold-bg); }
.chip.locked { cursor:default; }
.chip-n { font-family:'IBM Plex Mono',monospace; color:var(--text3); font-weight:700; font-size:.78rem; }
.reflect-prompt { font-size:.92rem; margin:.5rem 0 .8rem; color:var(--text2); }
@media (max-width:600px){
  .cls-bin { min-width:110px; font-size:.79rem; }
  .flowcols { flex-direction:column; }
  .cgrid { grid-template-columns:1fr; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Comunidades, Contexto Socionatural y Desarrollo Sustentable</div>
    <div class="wcourse" id="wcourse-el">Formación Cívica y Ética · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">

function getAttemptKey(name, group){ return 'fce1_t08_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }

var studentData   = {};

function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'fce1_t08_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'fce1_t08_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }
    if (saved.photos) {
      saved.photos.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var pp = document.getElementById('pp' + i);
        if (!pp) return;
        pp.src = dataUrl; pp.style.display = 'block';
        var pz = document.getElementById('pz' + i);
        if (pz) pz.style.opacity = '0.4';
      });
    }
  }, 300);
}

function dismissRestore() {
  document.getElementById('restoreBar').style.display = 'none';
}

function checkForSavedSession() {
  var name  = document.getElementById('sName').value.trim();

}

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {
  var btn = document.getElementById('dlBtn');
  btn.textContent = 'Generando PDF…';
  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line
  doc.setFillColor(255,255,255); doc.rect(0,2,PW,26,'F');                               // white logo strip
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,28,PW,2,'F');  // bottom accent line
  doc.setFillColor(pBR,pBG,pBB); doc.rect(0,30,PW,34,'F');       // blue header band

  // ── PDF LOGO INJECTION BLOCK ─────────────────────────────────────────────
  //   When injecting logos, replace the two placeholder lines below with:
  //     var logoLeftB64  = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML
  //     var logoRightB64 = 'data:image/png;base64,...';   // from LOGOS_MASTER.HTML

  doc.lines([[2.57-1.03,4.63-6.17],[4.11-2.57,5.14-4.63],[5.66-4.11,2.57-5.14]], lx+1.03, ly+6.17);
  doc.setFillColor(pAR,pAG,pAB); doc.circle(lx+5.66, ly+2.57, 0.9, 'F');

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'fce1_t08_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;

}

/* Baraja las opciones (Rule 7) manteniendo alineadas las dos lenguas y arma la
   tarjeta en el momento, junto al concepto que la prepara (Rule 1 / Rule 5). */
function addProblem(v, rng){
  var n = v.options.es.length, idx = [], k;
  for (k = 0; k < n; k++) idx.push(k);
  for (k = n - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp;
  }
  var langOpts = (LANG === 'es') ? v.options.es : v.options.en;
  var prob = {
    title:        v.title[LANG],
    questionText: v.stmt[LANG],
    fn:           '',
    hint:         v.hint[LANG],
    explanation:  v.explanation[LANG],
    options:      idx.map(function(o){ return langOpts[o]; }),
    correctIdx:   idx.indexOf(v.correct),
    showWork:     !!v.showWork,
    studentChoice:null, pendingChoice:null
  };
  problems.push(prob);
  buildOneCard(prob, problems.length - 1);
}

/* ================================================
   WIDGET 1 - LO QUE ENTRA Y LO QUE SALE
   Cada tarjeta se coloca en una de las dos columnas del flujo. Las aciertos se
   quedan a la vista y el flujo de la comunidad se va dibujando solo. Si falla,
   la pista apunta hacia el lado correcto; al tercer intento se revela.
   ================================================ */
var FLJ = null;

function fljBins(){
  return S(['Entra: la comunidad lo toma del entorno', 'Sale: la comunidad lo devuelve al entorno'],
           ['In: the community takes it from its surroundings', 'Out: the community gives it back to its surroundings']);
}

function fljPool(){
  return [
    { es:'El agua del manantial que llega por manguera hasta las casas',
      en:'The spring water that reaches the houses through a hose',
      bin:0,
      why:{ es:'Sale del manantial y entra a la comunidad: es de lo que la comunidad toma para vivir.',
            en:'It leaves the spring and enters the community: it is part of what the community takes in order to live.' } },
    { es:'El agua jabonosa de los lavaderos que corre hasta el arroyo',
      en:'The soapy water from the washing sinks that runs down to the stream',
      bin:1,
      why:{ es:'Sale de las casas y termina en el arroyo: es de lo que la comunidad devuelve.',
            en:'It leaves the houses and ends up in the stream: it is part of what the community gives back.' } },
    { es:'La leña seca que se junta en el monte para cocinar',
      en:'The dry firewood collected in the woodland for cooking',
      bin:0,
      why:{ es:'El monte la produce y la comunidad la recoge: entra.',
            en:'The woodland produces it and the community picks it up: it comes in.' } },
    { es:'El humo de la basura que se quema en el traspatio',
      en:'The smoke from rubbish burnt in the backyard',
      bin:1,
      why:{ es:'Lo produce la comunidad y se va al aire de todos: sale.',
            en:'The community produces it and it goes into the air everyone breathes: it goes out.' } },
    { es:'El maíz que se levanta de la milpa en la cosecha',
      en:'The maize gathered from the field at harvest time',
      bin:0,
      why:{ es:'La tierra y la lluvia lo hacen crecer y la comunidad lo recoge: entra.',
            en:'The soil and the rain make it grow and the community gathers it: it comes in.' } },
    { es:'Los restos de comida que se amontonan y se vuelven composta',
      en:'The food scraps that pile up and turn into compost',
      bin:1,
      why:{ es:'Salen de las cocinas hacia el suelo. Devolver no siempre daña: esto vuelve como abono.',
            en:'They leave the kitchens and go into the soil. Giving back is not always damage: this returns as fertiliser.' } }
  ];
}

function buildFlujo(rng){
  FLJ = { pool: fljPool(), order: shuffle([0,1,2,3,4,5], rng), i:0, tries:0,
          placed:[[],[]], done:false,
          msg: S('Empieza por la tarjeta de arriba.', 'Start with the card above.'), msgCls:'' };
  addWidget('classify', 'wFlujo', '');
  fljRender();
}

function fljRender(){
  var w = document.getElementById('wFlujo');
  if (!w || !FLJ) return;
  var bins = fljBins();
  var cols = '<div class="flowcols">' + bins.map(function(b, bi){
      var chips = FLJ.placed[bi].map(function(txt){ return '<div class="flowchip">' + txt + '</div>'; }).join('');
      return '<div class="flowcol"><h4>' + b + '</h4>' + chips + '</div>';
    }).join('') + '</div>';
  var body;
  if (FLJ.done) {
    body = '<div class="cls-card">' + S('Las dos columnas ocurren todos los días, al mismo tiempo.',
                                        'Both columns happen every single day, at the same time.') + '</div>';
  } else {
    var it = FLJ.pool[FLJ.order[FLJ.i]];
    body = '<div class="cls-card">' + it[LANG] + '</div>' +
      '<div class="cls-bins">' + bins.map(function(b, bi){
        return '<button class="cls-bin" onclick="fljPick(' + bi + ')">' + b + '</button>'; }).join('') + '</div>' +
      '<div class="wprog">' + (FLJ.i + 1) + ' / ' + FLJ.pool.length + '</div>';
  }
  w.innerHTML =
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('Lo que entra y lo que sale', 'What comes in and what goes out') + '</div>' +
      '<div class="wtask iw-sub">' + S('Coloca cada cosa del lado que le toca. Lo que aciertes se queda a la vista en su columna.',
                                       'Put each item on the side where it belongs. What you get right stays visible in its column.') + '</div>' +
      cols + body +
      '<div class="wmsg ' + FLJ.msgCls + '">' + FLJ.msg + '</div>' +
    '</div>';
}

window.fljPick = function(bi){
  if (!FLJ || FLJ.done) return;
  var it = FLJ.pool[FLJ.order[FLJ.i]];
  if (bi === it.bin) {
    FLJ.placed[bi].push(it[LANG]);
    FLJ.tries = 0; FLJ.msgCls = 'ok';
    FLJ.msg = '✓ ' + it.why[LANG];
    FLJ.i++;
    if (FLJ.i >= FLJ.pool.length) {
      FLJ.done = true;
      FLJ.msg = '🎉 ' + S('Ya está el flujo completo: de un lado lo que el entorno le da a la comunidad, del otro lo que la comunidad le regresa.',
                                    'The flow is complete: on one side what the surroundings give the community, on the other what the community sends back.');
    }
  } else {
    FLJ.tries++;
    if (FLJ.tries >= 3) {
      FLJ.placed[it.bin].push(it[LANG]);
      FLJ.msgCls = 'warn';
      FLJ.msg = S('Va del lado de ', 'It belongs on the side of ') + fljBins()[it.bin] + '. ' + it.why[LANG];
      FLJ.tries = 0; FLJ.i++;
      if (FLJ.i >= FLJ.pool.length) FLJ.done = true;
    } else {
      FLJ.msgCls = 'warn';
      FLJ.msg = S('Todavía no. Pregúntate hacia dónde va: ¿llega a la comunidad desde el entorno, o sale de la comunidad hacia el entorno?',
                  'Not yet. Ask which way it travels: does it reach the community from its surroundings, or leave the community towards them?');
    }
  }
  fljRender();
};

/* ================================================
   WIDGET 2 - EL PULSO DE LA COMUNIDAD
   Tres perillas mueven en vivo el dibujo del lugar y tres medidores. El paisaje
   pierde árboles, el arroyo adelgaza y el tiradero crece mientras se mueve cada
   control. El mensaje dice hacia qué lado corregir hasta dejar los tres en verde.
   ================================================ */
var SIM = null;

function simPal(){
  return {
    cielo:  cvar('--surface2', '#f0ede6'),
    linea:  cvar('--border',   '#ddd8cc'),
    agua:   cvar('--green',    '#1a4a8a'),
    hoja:   cvar('--ok',       '#2d6a4f'),
    tierra: cvar('--text3',    '#7a7468'),
    alerta: cvar('--bad',      '#8b2500'),
    casa:   cvar('--gold',     '#c9a84c')
  };
}

function simClamp(x){ return Math.max(0, Math.min(100, Math.round(x))); }

function buildSim(rng){
  SIM = { w: 60 + Math.floor(rng() * 110), t: Math.floor(rng() * 45), r: Math.floor(rng() * 55) };
  SIM.w = SIM.w - (SIM.w % 5);
  SIM.r = SIM.r - (SIM.r % 5);
  addWidget('balance', 'wSim',
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('El pulso de la comunidad', 'The pulse of the community') + '</div>' +
      '<div class="wtask iw-sub">' + S('Mueve las tres perillas y mira el dibujo. Busca dejar los tres medidores por arriba de 60 al mismo tiempo.',
                                       'Move the three controls and watch the drawing. Try to leave all three meters above 60 at the same time.') + '</div>' +
      '<div class="cvbox"><canvas class="wcv" id="simCv" width="640" height="200"></canvas></div>' +
      '<div class="cgrid">' +
        '<div class="cg"><label>' + S('Agua sacada del pozo por familia al día', 'Water drawn from the well per family each day') +
          ': <span class="cval" id="simWv"></span></label>' +
          '<input type="range" min="20" max="200" step="5" id="simW" oninput="simSet()"></div>' +
        '<div class="cg"><label>' + S('Árboles cortados al año', 'Trees felled each year') +
          ': <span class="cval" id="simTv"></span></label>' +
          '<input type="range" min="0" max="60" step="1" id="simT" oninput="simSet()"></div>' +
        '<div class="cg"><label>' + S('Residuos que se aprovechan', 'Waste that gets reused') +
          ': <span class="cval" id="simRv"></span></label>' +
          '<input type="range" min="0" max="100" step="5" id="simR" oninput="simSet()"></div>' +
      '</div>' +
      '<div class="metrics">' +
        '<div class="metric"><div class="mlbl">' + S('Entorno', 'Surroundings') + '</div><div class="mnum cs" id="mNat">0</div></div>' +
        '<div class="metric"><div class="mlbl">' + S('Vida de hoy', 'Life today') + '</div><div class="mnum cs" id="mBien">0</div></div>' +
        '<div class="metric"><div class="mlbl">' + S('Alcanza para mañana', 'Enough for tomorrow') + '</div><div class="mnum cs" id="mFut">0</div></div>' +
      '</div>' +
      '<div class="wmsg" id="simMsg"></div>' +
    '</div>');
  document.getElementById('simW').value = SIM.w;
  document.getElementById('simT').value = SIM.t;
  document.getElementById('simR').value = SIM.r;
  simSet();
}

window.simSet = function(){
  var e = document.getElementById('simW');
  if (!e || !SIM) return;
  SIM.w = parseInt(e.value, 10);
  SIM.t = parseInt(document.getElementById('simT').value, 10);
  SIM.r = parseInt(document.getElementById('simR').value, 10);
  document.getElementById('simWv').textContent = SIM.w + ' L';
  document.getElementById('simTv').textContent = SIM.t;
  document.getElementById('simRv').textContent = SIM.r + ' %';

  var nat  = simClamp(100 - (SIM.w - 20) * 0.35 - SIM.t * 1.0 - (100 - SIM.r) * 0.25);
  var bien = simClamp(25 + (SIM.w - 20) * 0.25 + SIM.t * 0.6 + SIM.r * 0.20);
  var fut  = simClamp(Math.min(nat, bien) * 0.7 + Math.max(nat, bien) * 0.3);
  SIM.nat = nat; SIM.bien = bien; SIM.fut = fut;

  var mN = document.getElementById('mNat'), mB = document.getElementById('mBien'), mF = document.getElementById('mFut');
  mN.textContent = nat;  mN.className = 'mnum ' + (nat  >= 60 ? 'cs' : 'ps');
  mB.textContent = bien; mB.className = 'mnum ' + (bien >= 60 ? 'cs' : 'ps');
  mF.textContent = fut;  mF.className = 'mnum ' + (fut  >= 60 ? 'cs' : 'ps');

  var m = document.getElementById('simMsg');
  var out;
  if (nat >= 60 && bien >= 60 && fut >= 60) {
    out = { c:'ok', t: S('🎉 Equilibrio: la gente cubre lo de hoy y el entorno alcanza a reponer lo que se le quita. Así puede seguir muchos años.',
                         '🎉 Balance: people cover what they need today and the surroundings manage to replace what is taken. It can go on for many years.') };
  } else if (nat < 60 && bien < 60) {
    out = { c:'warn', t: S('Los dos lados van cortos. Sube el aprovechamiento de residuos: mejora la vida de hoy sin cobrárselo al entorno.',
                           'Both sides are falling short. Push up the reuse of waste: it improves life today without charging it to the surroundings.') };
  } else if (nat < 60) {
    out = { c:'warn', t: S('El monte y el arroyo se están quedando cortos. Baja el agua que se saca o corta menos árboles.',
                           'The woodland and the stream are falling short. Draw less water or fell fewer trees.') };
  } else if (bien < 60) {
    out = { c:'warn', t: S('El entorno está entero, pero a las familias no les alcanza para hoy. Sube un poco el agua disponible o aprovecha más los residuos.',
                           'The surroundings are intact, but the families cannot cover today. Raise the available water a little or reuse more waste.') };
  } else {
    out = { c:'warn', t: S('Casi: hoy alcanza y el entorno aguanta, pero el margen para quienes vengan después es corto. Afloja un poco la presión.',
                           'Almost: today works and the surroundings hold, but the margin for those who come later is thin. Ease the pressure a little.') };
  }
  m.className = 'wmsg ' + out.c;
  m.textContent = out.t;
  simDraw();
};

function simTree(ctx, x, y, col){
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x, y - 26); ctx.lineTo(x - 9, y - 6); ctx.lineTo(x + 9, y - 6);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(x - 1.5, y - 8, 3, 8);
}

function simStump(ctx, x, y, col){
  ctx.fillStyle = col;
  ctx.globalAlpha = 0.65;
  ctx.fillRect(x - 3, y - 5, 6, 5);
  ctx.globalAlpha = 1;
}

function simDraw(){
  var c = document.getElementById('simCv');
  if (!c || !SIM) return;
  var ctx = c.getContext('2d');
  var W = c.width, H = c.height, p = simPal(), i;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = p.cielo; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = p.tierra; ctx.globalAlpha = 0.16;
  ctx.fillRect(0, H - 52, W, 52);
  ctx.globalAlpha = 1;

  var vivos = Math.max(0, 12 - Math.round(SIM.t / 5));
  for (i = 0; i < 12; i++) {
    var x = 30 + i * ((W - 70) / 11);
    if (i < vivos) simTree(ctx, x, H - 56, p.hoja);
    else simStump(ctx, x, H - 56, p.tierra);
  }

  for (i = 0; i < 4; i++) {
    var hx = 70 + i * 130;
    ctx.fillStyle = p.casa; ctx.globalAlpha = 0.8;
    ctx.fillRect(hx, H - 46, 26, 16);
    ctx.beginPath(); ctx.moveTo(hx - 4, H - 46); ctx.lineTo(hx + 13, H - 58); ctx.lineTo(hx + 30, H - 46);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  var ancho = Math.max(2, 17 - (SIM.w - 20) / 180 * 14);
  ctx.fillStyle = p.agua; ctx.globalAlpha = 0.8;
  ctx.fillRect(0, H - 22, W, ancho);
  ctx.globalAlpha = 1;

  var mont = Math.round((100 - SIM.r) / 100 * 9);
  for (i = 0; i < mont; i++) {
    ctx.fillStyle = p.alerta; ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.arc(W - 40 - i * 13, H - 30 - (i % 2) * 7, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.strokeStyle = p.linea; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H - 52); ctx.lineTo(W, H - 52); ctx.stroke();
}

/* ================================================
   WIDGET 3 - LOS PASOS DE UN PROYECTO
   El estudiante toca dos pasos para intercambiarlos hasta dejarlos en el orden
   en que una comunidad los hace. La pista senala el primer paso fuera de lugar.
   ================================================ */
var SEQ = null;

function seqSteps(){
  return [
    { es:'Mirar el problema en el lugar donde ocurre y anotar lo que se ve',
      en:'Look at the problem where it happens and write down what can be seen' },
    { es:'Reunir datos y escuchar a las familias que dependen de ese recurso',
      en:'Gather data and listen to the families who depend on that resource' },
    { es:'Llevar la propuesta a la asamblea y discutirla con todo el mundo',
      en:'Take the proposal to the assembly and discuss it with everyone' },
    { es:'Acordar por escrito las reglas y repartir las tareas',
      en:'Agree the rules in writing and share out the tasks' },
    { es:'Poner en marcha lo acordado',
      en:'Put what was agreed into practice' },
    { es:'Revisar los resultados y corregir lo que no funcionó',
      en:'Review the results and fix what did not work' }
  ];
}

function buildSeq(rng){
  var ord = shuffle([0,1,2,3,4,5], rng);
  var ya = true;
  for (var k = 0; k < ord.length; k++) { if (ord[k] !== k) { ya = false; break; } }
  if (ya) { var tmp = ord[0]; ord[0] = ord[5]; ord[5] = tmp; }
  SEQ = { steps: seqSteps(), order: ord, sel:null, tries:0, done:false,
          msg: S('Toca dos pasos para intercambiarlos de lugar.', 'Tap two steps to swap their places.'), msgCls:'' };
  addWidget('timeline', 'wPasos', '');
  seqRender();
}

function seqRender(){
  var w = document.getElementById('wPasos');
  if (!w || !SEQ) return;
  var chips = SEQ.order.map(function(si, pos){
    var cls = 'chip' + (SEQ.sel === pos ? ' sel' : '') + (SEQ.done ? ' locked' : '');
    return '<div class="' + cls + '" onclick="seqTap(' + pos + ')"><span class="chip-n">' + (pos + 1) + '</span>' +
           SEQ.steps[si][LANG] + '</div>';
  }).join('');
  w.innerHTML =
    '<div class="wgt">' +
      '<div class="wgt-h iw-tag">' + S('Los pasos de un proyecto', 'The steps of a project') + '</div>' +
      '<div class="wtask iw-sub">' + S('Ordena del primer paso al último lo que hace una comunidad que decide actuar.',
                                       'Put in order, from first to last, what a community does when it decides to act.') + '</div>' +
      '<div class="chiplist">' + chips + '</div>' +
      (SEQ.done ? '' : '<button class="wbtn" onclick="seqCheck()">' + S('Revisar el orden', 'Check the order') + '</button>') +
      '<div class="wmsg ' + SEQ.msgCls + '">' + SEQ.msg + '</div>' +
    '</div>';
}

window.seqTap = function(pos){
  if (!SEQ || SEQ.done) return;
  if (SEQ.sel === null) { SEQ.sel = pos; }
  else if (SEQ.sel === pos) { SEQ.sel = null; }
  else {
    var t = SEQ.order[SEQ.sel]; SEQ.order[SEQ.sel] = SEQ.order[pos]; SEQ.order[pos] = t;
    SEQ.sel = null;
  }
  seqRender();
};

window.seqCheck = function(){
  if (!SEQ || SEQ.done) return;
  var ok = true, primerFallo = -1;
  for (var k = 0; k < SEQ.order.length; k++) {
    if (SEQ.order[k] !== k) { ok = false; if (primerFallo < 0) primerFallo = k; }
  }
  if (ok) {
    SEQ.done = true; SEQ.msgCls = 'ok';
    SEQ.msg = '🎉 ' + S('Ese es el orden. Cada paso hace posible el siguiente: sin datos no hay propuesta que discutir, y sin reglas repartidas no hay quién revise después.',
                                  'That is the order. Each step makes the next one possible: with no data there is no proposal to discuss, and with no shared out rules there is nobody to review it later.');
    seqRender(); return;
  }
  SEQ.tries++;
  if (SEQ.tries >= 3) {
    SEQ.order = [0,1,2,3,4,5]; SEQ.done = true; SEQ.msgCls = 'warn';
    SEQ.msg = S('Este es el orden. Fíjate en que mirar y preguntar van antes de proponer, y en que revisar va al final, cuando ya hay resultados que mirar.',
                'This is the order. Notice that looking and asking come before proposing, and that reviewing comes last, when there are results to look at.');
    seqRender(); return;
  }
  SEQ.msgCls = 'warn';
  SEQ.msg = S('Todavía no. Mira el paso número ' + (primerFallo + 1) + ': ¿va antes o después de lo que tiene arriba?',
              'Not yet. Look at step number ' + (primerFallo + 1) + ': does it come before or after what sits above it?');
  seqRender();
};

window.refTab = function(which, btn){

/* ================================================
   buildLesson: concepto, manipulativo y problema, en ese orden y sin batches.
   ================================================ */
function buildLesson(rng) {
  problems = []; answeredCount = 0; correctCount = 0;
  document.getElementById('lessonBody').innerHTML = '';
  var pf = document.getElementById('progFill'); if (pf) pf.style.width = '0%';

  /* ── CONCEPTO 1 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 1', 'CONCEPT 1'),
    '<h2>' + S('La comunidad y el lugar donde vive', 'A community and the place where it lives') + '</h2>' +
    '<p>' + S('Una comunidad es un grupo de personas que comparte un lugar, unos trabajos y unos acuerdos: un barrio, un pueblo, una escuela. Ese lugar no es un decorado detrás de la gente. Tiene agua, suelo, aire, plantas y animales, y de ahí sale casi todo lo que la comunidad usa cada día.',
              'A community is a group of people who share a place, some kinds of work and some agreements: a neighbourhood, a village, a school. That place is not scenery behind the people. It has water, soil, air, plants and animals, and almost everything the community uses each day comes from there.') + '</p>' +
    '<p>' + S('A todo eso junto, lo natural y lo social de un mismo sitio, se le llama contexto socionatural. Todos los días la comunidad toma algo del entorno y todos los días le devuelve algo. Los dos flujos existen siempre; lo que cambia de una comunidad a otra es cuánto se toma y qué se devuelve.',
              'All of that together, the natural and the social side of one place, is called the socionatural context. Every day the community takes something from its surroundings and every day it gives something back. Both flows always exist; what changes from one community to another is how much is taken and what is returned.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Comunidad', 'Community') + '</div><div class="rform">' + S('gente, trabajo y acuerdos', 'people, work and agreements') + '</div><div class="rnote">' + S('Comparten un lugar y una manera de vivir en él.', 'They share a place and a way of living in it.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Entorno', 'Surroundings') + '</div><div class="rform">' + S('agua, suelo, aire, seres vivos', 'water, soil, air, living things') + '</div><div class="rnote">' + S('De ahí sale el alimento, el agua y el material.', 'Food, water and materials come from there.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Toma', 'Takes') + '</div><div class="rform">' + S('lo que entra a la comunidad', 'what comes into the community') + '</div><div class="rnote">' + S('Agua, leña, tierra fértil, alimento, materiales.', 'Water, firewood, fertile soil, food, materials.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Devuelve', 'Gives back') + '</div><div class="rform">' + S('lo que sale de la comunidad', 'what leaves the community') + '</div><div class="rnote">' + S('Agua usada, humo, basura, restos, abono.', 'Used water, smoke, rubbish, scraps, compost.') + '</div></div>' +
    '</div>' +
    '<div class="callout"><p><strong>' + S('Lo que está en juego: ', 'What is at stake: ') + '</strong>' +
      S('cuando cambia el agua, el suelo o el monte, cambian también el trabajo, la comida y hasta las fiestas de la gente. No son dos historias separadas: son la misma historia contada por sus dos lados.',
        'when the water, the soil or the woodland changes, so do the work, the food and even the festivals of the people. These are not two separate stories: they are one story told from both sides.') + '</p></div>');

  buildFlujo(rng);

  /* ── PROBLEMA 1 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Lo que se fue con el arroyo', en:'What went away with the stream' }, showWork:false,
      stmt:{ es:'En una comunidad el arroyo bajaba con fuerza todo el año: movía el molino, servía para regar las milpas y a la orilla se hacía cada verano la fiesta del agua. Después de varias temporadas de lluvia escasa y de pozos nuevos abiertos más arriba, el arroyo baja apenas un hilo. El molino cerró, las milpas se riegan con cubetas y la fiesta se dejó de hacer. ¿Qué muestra mejor este caso?',
             en:'In one community the stream ran strong all year: it turned the mill, it watered the maize fields and every summer the water festival was held on its bank. After several seasons of scarce rain and new wells opened further upstream, the stream is down to a trickle. The mill closed, the fields are watered with buckets and the festival is no longer held. What does this case show best?' },
      options:{ es:[
        'Que el trabajo, la comida y las fiestas de la comunidad se sostienen en su entorno natural, y cambian cuando ese entorno cambia',

        'Que la comunidad se equivocó al asentarse junto a un arroyo y lo que le corresponde ahora es mudarse a otro sitio',
        'Que la fiesta se dejó de hacer por falta de interés de la gente, y el nivel del arroyo no tuvo que ver con esa decisión'],
        en:[
        'That the work, the food and the festivals of the community rest on its natural surroundings, and change when those surroundings change',
        'That the natural surroundings and the life of the community are separate matters: what happens to the stream does not explain what happens to the mill',
        'That the community made a mistake in settling next to a stream and what it should do now is move somewhere else',
        'That the festival stopped for lack of interest among the people, and the level of the stream had nothing to do with that decision'] },
      correct:0,
      hint:{ es:'Haz dos listas: qué cambió en el agua y qué cambió en la vida diaria. Luego fíjate si una lista explica a la otra.',
             en:'Make two lists: what changed in the water and what changed in daily life. Then check whether one list explains the other.' },
      explanation:{ es:'El molino, el riego y la fiesta no eran tres costumbres sueltas: las tres se sostenían en el mismo arroyo, y las tres cayeron cuando bajó el caudal. A eso apunta la idea de contexto socionatural: lo natural y lo social de un mismo lugar están amarrados, de modo que un cambio de un lado se siente del otro.',
                    en:'The mill, the watering and the festival were not three loose customs: all three rested on the same stream, and all three fell when the flow dropped. That is what the socionatural context points at: the natural and the social sides of one place are tied together, so a change on one side is felt on the other.' } },
    { title:{ es:'El manglar y las lanchas', en:'The mangrove and the boats' }, showWork:false,
      stmt:{ es:'En un puerto pequeño, el manglar de la orilla era el sitio donde los peces chicos crecían antes de salir al mar. Para ganar espacio de estacionamiento se rellenó buena parte del manglar. Dos temporadas después las lanchas regresan casi vacías, varias familias dejaron la pesca y la cooperativa que vendía el pescado se deshizo. ¿Qué muestra mejor este caso?',
             en:'In a small port, the mangrove on the shore was the place where young fish grew before heading out to sea. To gain parking space, a good part of the mangrove was filled in. Two seasons later the boats come back almost empty, several families have left fishing and the cooperative that sold the catch broke up. What does this case show best?' },
      options:{ es:[
        'Que el trabajo y la organización de la gente dependen de lo que ocurre en su entorno natural, aunque el efecto se note temporadas después',

        'Que la cooperativa se deshizo por desacuerdos entre las familias, y el manglar no influyó en la cantidad de peces'],
        en:[

        'That the catch dropped by chance and filling in the mangrove is a separate matter, unrelated to the empty boats',

      explanation:{ es:'El manglar no era un terreno vacío: era el sitio donde se criaban los peces que después llenaban las lanchas. Al rellenarlo se cortó ese eslabón, y con él cayeron la pesca, el ingreso y la organización que vivía de ella. El efecto llegó dos temporadas más tarde, y por eso es fácil creer que son asuntos separados.',
                    en:'The mangrove was not an empty plot: it was where the fish that later filled the boats were reared. Filling it in cut that link, and with it fell the catch, the income and the organisation that lived on it. The effect arrived two seasons later, which is why it is easy to believe these are separate matters.' } }

  /* ── CONCEPTO 2 ─────────────────────────────────────────────── */
  addSection(S('CONCEPTO 2', 'CONCEPT 2'),
    '<h2>' + S('El ritmo: lo que se usa y lo que alcanza a reponerse', 'The pace: what is used and what manages to grow back') + '</h2>' +
    '<p>' + S('Muchas cosas del entorno se renuevan solas: la lluvia vuelve a llenar el pozo, el monte vuelve a crecer, los peces vuelven a reproducirse. Pero cada una se repone a su propio ritmo, y ese ritmo no se puede apurar.',
              'Many things in the surroundings renew themselves: rain fills the well again, the woodland grows back, the fish breed again. But each one is replaced at its own pace, and that pace cannot be hurried.') + '</p>' +
    '<p>' + S('Mientras se toma menos de lo que se repone, el recurso se mantiene y puede durar generaciones. Cuando se toma más, la reserva empieza a bajar aunque el primer año no se note nada: el pozo sigue dando agua y el monte sigue teniendo árboles. El aviso llega tarde, y por eso conviene mirar el ritmo y no solo el resultado de hoy.',
              'While less is taken than is replaced, the resource holds and can last for generations. When more is taken, the store starts to shrink even though nothing shows in the first year: the well still gives water and the woodland still has trees. The warning arrives late, which is why it pays to watch the pace and not just the result of today.') + '</p>' +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Se repone', 'Replacement') + '</div><div class="rform">' + S('lo que vuelve cada año', 'what returns each year') + '</div><div class="rnote">' + S('La lluvia que entra al pozo, el monte que rebrota.', 'The rain entering the well, the woodland growing back.') + '</div></div>' +

        'Sacar 400 mil litros al año y perforar el pozo más hondo cuando el nivel empiece a bajar',

                    en:'About 300 thousand litres enter the well each year. If 250 thousand are drawn, a margin is left and the level holds. The other three options take as much or more than comes in: a second well into the same table shares the same water between two mouths, drilling deeper only reaches water that is not replaced either, and taking 500 thousand litres within a few months is still more than the rain gives back in a whole year.' } },
    { title:{ es:'La leña del monte comunal', en:'Firewood from the common woodland' }, showWork:true,
      stmt:{ es:'El monte comunal repone por su cuenta alrededor de 200 cargas de leña al año. La asamblea discute cuatro maneras de aprovecharlo. ¿Cuál puede sostenerse durante muchos años sin que el monte se vaya quedando pelón?',

        'Collect 200 loads a year and also fell the young trees that get in the way of the path',
        'Collect 300 loads a year and plant one new tree for every ten loads taken out',

      correct:0,
      hint:{ es:'Compara lo que el monte repone en un año con lo que se saca en ese mismo año.',

  /* ── PROBLEMA 3 ─────────────────────────────────────────────── */
  addProblem(pick([
    { title:{ es:'Tres años buenos', en:'Three good years' }, showWork:false,
      stmt:{ es:'Durante los tres primeros años con la red nueva, la cooperativa sacó más pescado que nunca y concluyó que el arrecife aguantaba bien ese ritmo. Al cuarto año la pesca se vino abajo. ¿Qué falló en ese razonamiento?',

                    en:'Landing a lot is easy while a store remains: the first years spend what had piled up, not what the reef replaces. That is why the daily result is no measure. The signal that matters is the comparison between what is taken and what manages to breed, and that signal arrives late when only the catch is watched.' } },

      stmt:{ es:'Un grupo de familias aumentó el número de vacas en el mismo potrero y durante dos años obtuvo más leche que antes. Al tercer año el pasto ya no alcanzaba a rebrotar y hubo que comprar forraje. ¿Qué falló en el razonamiento inicial?',
             en:'A group of families put more cows on the same paddock and for two years got more milk than before. In the third year the grass could no longer grow back and fodder had to be bought. What was wrong with the original reasoning?' },
      options:{ es:[
        'Que se midió el resultado por la leche de cada año y no por el tiempo que el pasto necesita para volver a crecer',
        'Que las vacas que se sumaron eran de una raza que da menos leche que las que ya estaban en el potrero',
        'Que el forraje comprado salió más caro de lo previsto, y ese gasto fue lo que arruinó las cuentas del grupo',
        'Que el potrero debió repartirse en partes iguales entre las familias desde el primer año para evitar discusiones'],
        en:[
        'That the result was measured by the milk of each year and not by the time the grass needs to grow back',
        'That the cows added were of a breed that gives less milk than the ones already on the paddock',
        'That the fodder bought turned out dearer than expected, and that expense is what ruined the accounts of the group',
        'That the paddock should have been split into equal parts among the families from the first year to avoid arguments'] },
      correct:0,
      hint:{ es:'Fíjate en qué se midió para decir que la decisión iba bien, y en qué no se midió.',
             en:'Look at what was measured to say the decision was going well, and at what was not measured.' },
      explanation:{ es:'Más vacas en el mismo potrero dan más leche mientras haya pasto acumulado. Lo que no se midió fue el ritmo del pasto: si se come más rápido de lo que rebrota, la reserva baja hasta que ya no hay de dónde. La leche del año se veía bien justamente mientras el potrero se estaba gastando.',
                    en:'More cows on the same paddock give more milk while there is grass built up. What was not measured was the pace of the grass: if it is eaten faster than it regrows, the store falls until there is nothing left. The yearly milk looked good precisely while the paddock was being used up.' } }
  ], rng), rng);

  addSection(S('CONCEPTO 3', 'CONCEPT 3'),
    '<h2>' + S('Desarrollo sustentable: hoy, sin quitarle a mañana', 'Sustainable development: today, without taking from tomorrow') + '</h2>' +
    '<p>' + S('Desarrollo sustentable quiere decir cubrir lo que la gente necesita hoy sin dejar sin recurso a quienes vengan después. No es dejar el entorno intocado ni renunciar a vivir de él: es usarlo de manera que siga estando ahí.',
              'Sustainable development means covering what people need today without leaving those who come later without resources. It is not about leaving the surroundings untouched nor about giving up living from them: it is about using them in a way that keeps them there.') + '</p>' +
    '<p>' + S('Se apoya en tres lados que tienen que aguantar juntos: que el entorno se mantenga, que la gente viva bien y que haya con qué sostener el trabajo. Si se rompe uno, se cae todo. Un plan que salva el bosque y deja a las familias sin ingreso no dura, porque esas familias buscarán otra salida. Un plan que da ingreso y vacía el río tampoco dura, porque el río se acaba.',
              'It rests on three sides that have to hold together: the surroundings keeping up, people living well, and there being enough to sustain the work. If one breaks, the whole thing falls. A plan that saves the forest and leaves families with no income does not last, because those families will look for another way out. A plan that gives income and empties the river does not last either, because the river runs out.') + '</p>' +
    '<div class="callout"><p><strong>' + S('Una prueba rápida: ', 'A quick test: ') + '</strong>' +
      S('pregunta si lo que se propone podría repetirse igual dentro de veinte años. Si la respuesta es que para entonces ya no quedaría recurso, o que la gente no habría aguantado tanto tiempo así, todavía no es sustentable.',
        'ask whether what is proposed could be repeated the same way twenty years from now. If the answer is that by then no resource would be left, or that people could not have held out that long, it is not sustainable yet.') + '</p></div>');

  addProblem(pick([
    { title:{ es:'Dos maneras de usar el bosque', en:'Two ways of using the woodland' }, showWork:true,
      stmt:{ es:'La comunidad discute dos propuestas para su bosque. La primera: vender este año la madera de todo el bosque y repartir el dinero entre las familias. La segunda: cortar cada año solo la parte que vuelve a crecer, vender esa madera y destinar una parte del dinero a resembrar. ¿Cuál corresponde a un desarrollo sustentable?',
             en:'The community is discussing two proposals for its woodland. The first: sell the timber of the whole woodland this year and share out the money among the families. The second: cut only the part that grows back each year, sell that timber and put part of the money into replanting. Which one amounts to sustainable development?' },
      options:{ es:[
        'La segunda: las familias obtienen ingreso este año y el bosque sigue en pie para quienes vengan después',
        'La primera: deja más dinero de inmediato y con ese dinero la comunidad podrá comprar después otro terreno con bosque',
        'Ninguna de las dos: mientras se corte un solo árbol no puede hablarse de desarrollo sustentable en la comunidad',
        'Las dos por igual: si el dinero se reparte entre todas las familias, cualquiera de las dos decisiones es sustentable'],
        en:[
        'The second: the families get income this year and the woodland is still standing for those who come later',
        'The first: it leaves more money at once and with that money the community will later be able to buy another wooded plot',
        'Neither one: as long as a single tree is cut there can be no talk of sustainable development in the community',
        'Both equally: if the money is shared among all the families, either decision counts as sustainable'] },
      correct:0,
      hint:{ es:'Pregúntate por dos cosas a la vez: si la gente cubre lo de hoy y si queda bosque para quienes vengan después.',
             en:'Ask two things at once: whether people cover what they need today and whether woodland is left for those who come later.' },
      explanation:{ es:'Sustentable no quiere decir no tocar nada, ni tampoco repartir bien el dinero. Quiere decir cubrir lo de hoy sin dejar sin recurso a quienes vienen. Cortar solo lo que vuelve a crecer y resembrar cumple las dos partes; vender todo el bosque cubre un año y deja el terreno sin bosque, y el dinero repartido no repone un bosque que ya no está.',
                    en:'Sustainable does not mean touching nothing, nor sharing the money fairly. It means covering today without leaving those who come after without resources. Cutting only what grows back and replanting meets both halves; selling the whole woodland covers one year and leaves the land bare, and shared money does not replace a woodland that is gone.' } },
    { title:{ es:'Dos maneras de sembrar la ladera', en:'Two ways of sowing the hillside' }, showWork:true,
      stmt:{ es:'Hay dos propuestas para la ladera donde siembra la comunidad. La primera: quitar toda la vegetación para sembrar más superficie y obtener la cosecha más grande posible este año. La segunda: sembrar en franjas, dejar hileras de plantas que sostienen la tierra y sumar el abono de los restos de la cosecha anterior. ¿Cuál corresponde a un desarrollo sustentable?',
             en:'There are two proposals for the hillside where the community sows. The first: strip all the vegetation to sow a larger area and get the biggest possible harvest this year. The second: sow in strips, leave rows of plants that hold the soil in place and add compost from the leftovers of the previous harvest. Which one amounts to sustainable development?' },
      options:{ es:[
        'La segunda: hay cosecha este año y la tierra de la ladera sigue sirviendo para las siembras que vienen',
        'La primera: una cosecha grande deja más alimento y más ingreso, y la tierra se recupera sola con la siguiente lluvia',
        'Ninguna de las dos: cualquier siembra en una ladera termina por arrastrar la tierra hacia la parte baja',
        'Las dos por igual: mientras la cosecha se reparta entre las familias que trabajaron, la decisión es sustentable'],
        en:[
        'The second: there is a harvest this year and the hillside soil still serves for the sowings to come',
        'The first: a big harvest leaves more food and more income, and the soil recovers by itself with the next rain',
        'Neither one: any sowing on a hillside ends up dragging the soil down to the bottom',
        'Both equally: as long as the harvest is shared among the families who worked, the decision is sustainable'] },
      correct:0,
      hint:{ es:'Piensa en qué queda en la ladera después de la cosecha, además de lo que se recoge.',
             en:'Think about what is left on the hillside after the harvest, besides what is gathered.' },
      explanation:{ es:'Quitar toda la vegetación de una ladera deja la tierra suelta: la lluvia se la lleva y la siguiente siembra rinde menos. Sembrar en franjas rinde algo menos este año, pero conserva el suelo que hace posible seguir sembrando. Eso es lo que distingue al desarrollo sustentable: cubre lo de hoy sin gastarse la base de mañana.',
                    en:'Stripping a hillside of vegetation leaves the soil loose: the rain carries it away and the next sowing yields less. Sowing in strips yields a little less this year, but it keeps the soil that makes further sowing possible. That is what marks out sustainable development: it covers today without spending the base of tomorrow.' } }
  ], rng), rng);

  addProblem(pick([
    { title:{ es:'El basurero que se cerró', en:'The dump that was closed' }, showWork:false,

      explanation:{ es:'El basurero enfermaba a la comunidad, así que cerrarlo atiende el entorno y la salud. Pero deja sin ingreso a familias que dependían de ese trabajo, y un acuerdo que quita el sustento a una parte de la comunidad termina por romperse o por volver a abrirse a escondidas. Un programa se sostiene cuando el entorno mejora y la gente afectada tiene de qué vivir.',
                    en:'The dump was making the community ill, so closing it takes care of the surroundings and of health. But it leaves without income families who depended on that work, and an agreement that removes the livelihood of part of the community ends up breaking, or reopening in secret. A programme holds when the surroundings improve and the people affected have something to live on.' } },
    { title:{ es:'La veda de la laguna', en:'The closed season on the lagoon' }, showWork:false,

             en:'So that the fish can recover, fishing in the lagoon is banned for half a year. The families who fish receive no alternative while the ban lasts. By the second month there is already fishing in secret. What best explains what happened?' },
      options:{ es:[
        'Que la medida cuidó a los peces y dejó fuera a la gente que vive de ellos, y por eso no se pudo sostener',

                    en:'The closed season makes sense for the resource: with no rest the fish do not recover. The problem is that the families who eat from the lagoon were asked to stop with nothing to live on meanwhile. When an environmental measure leaves those who depend on the resource without a livelihood, it is broken, and then it does not protect the fish either.' } }
  ], rng), rng);
