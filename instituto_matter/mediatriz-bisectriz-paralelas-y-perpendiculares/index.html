<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mediatriz, Bisectriz, Paralelas y Perpendiculares</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; text-align: justify; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:50px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 38px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }

/* ── GUIDE WIDGETS (mediatriz / bisectriz / paralelas y perpendiculares) ── */
.iw-tag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.4rem; }
.iw-box { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; }
.iw-instr { font-size:.88rem; color:var(--text2); margin-bottom:.7rem; }
.rondas { font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.45rem; }
.rfb { font-size:.84rem; margin-top:.6rem; min-height:1.35rem; color:var(--text2); }
.rfb b { color:var(--green-dark); }
.okmsg { color:var(--ok); font-weight:700; }
.rverify-btn { background:var(--green); color:#fff; border:none; border-radius:8px; padding:.6rem 1.2rem; font-size:.86rem; font-weight:600; cursor:pointer; min-height:44px; margin-top:.7rem; font-family:inherit; }
.rverify-btn:hover { background:var(--green-dark); }
.goalbar { font-size:.83rem; color:var(--text2); background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.45rem .7rem; margin-bottom:.65rem; }
.gcanvas { display:block; width:100%; height:230px; border:1px solid var(--border); border-radius:8px; background:var(--surface); touch-action:manipulation; }
.krow { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }
.krow input[type=range] { flex:1; min-width:150px; accent-color:var(--green); height:34px; }
.kval { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.95rem; color:var(--green); min-width:56px; text-align:right; }
.livelbl { margin-top:.55rem; font-size:.88rem; color:var(--text2); }
.livelbl b { color:var(--green-dark); }
.statline { margin-top:.35rem; font-size:.84rem; color:var(--text3); }
.clsbins { display:grid; grid-template-columns:repeat(2,1fr); gap:.5rem; margin-top:.7rem; }
.clsbin { min-height:44px; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.84rem; font-weight:600; cursor:pointer; font-family:inherit; padding:.4rem; }
.clsbin:hover { border-color:var(--green); color:var(--green); }
.clscard { background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; padding:.85rem; text-align:center; font-weight:600; font-size:.9rem; margin:.55rem 0; color:var(--text); }
.defgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin:1rem 0; }
.defcell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; border-top:3px solid var(--green); }
.defname { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.25rem; }
.deftxt { font-size:.82rem; color:var(--text2); }
.stepslist { margin:.9rem 0 0; padding-left:1.1rem; }
.stepslist li { font-size:.86rem; color:var(--text2); margin-bottom:.35rem; }
@media (max-width:600px) {
  .defgrid { grid-template-columns:1fr; }
  .clsbins { grid-template-columns:1fr; }
  .gcanvas { height:210px; }
}
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">Mediatriz, Bisectriz, Paralelas y Perpendiculares</div>
    <div class="wcourse" id="wcourse-el">Matemáticas · 1° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">

function setLang(l){
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
  var be=document.getElementById('btn-es'); if(be) be.classList.toggle('active', l==='es');
  var bn=document.getElementById('btn-en'); if(bn) bn.classList.toggle('active', l==='en');
  document.documentElement.setAttribute('lang', l);
  applyUIStrings();
  if (studentData.name && document.getElementById('lessonScreen').style.display !== 'none') {
    var prev = problems.map(function(p){ return p.studentChoice; });
    problems = []; answeredCount = 0; correctCount = 0;
    document.getElementById('lessonBody').innerHTML = '';
    var res = document.getElementById('s_results'); res.style.display='none'; res.classList.remove('vis');
    buildLesson(seededRng(studentData.name + studentData.group + currentAttempt(studentData.name, studentData.group)));
    var obs = new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('vis'); }); }, { threshold:0.05 });
    document.querySelectorAll('.section').forEach(function(s){ obs.observe(s); });

/* ── Attempt counter + seed (Rule 4): seed = name+group+attempt ── */
function getAttemptKey(name, group){ return 'liaxa_mat1_t09_g01__att__' + (name+'__'+group).replace(/\s+/g,'_'); }
function nextAttempt(name, group){ var k=getAttemptKey(name,group),n=0; try{n=parseInt(localStorage.getItem(k)||'0',10)||0;}catch(e){} n++; try{localStorage.setItem(k,String(n));}catch(e){} return n; }
function currentAttempt(name, group){ var k=getAttemptKey(name,group); try{return parseInt(localStorage.getItem(k)||'1',10)||1;}catch(e){return 1;} }
/* ================================================
   STATE
   ================================================ */
var studentData   = {};
var problems      = [];

/* ================================================
   SESSION PERSISTENCE  (localStorage)
   ================================================ */
function lsKey() {
  var n = (studentData.name  || '').trim();
  var g = (studentData.group || '').trim();
  return 'liaxa_mat1_t09_g01__' + (n + '__' + g).replace(/\s+/g, '_');
}

function saveSession() {
  if (!studentData.name) return;
  var drawings = [], texts = [], photos = [];
  problems.forEach(function(p, i) {
    var dc = document.getElementById('dc' + i);
    if (dc && dc.width) {
      var blank = document.createElement('canvas');
      blank.width = dc.width; blank.height = dc.height;
      drawings.push(dc.toDataURL() === blank.toDataURL() ? null : dc.toDataURL('image/png'));
    } else { drawings.push(null); }
    var ta = document.getElementById('ta' + i);
    texts.push(ta ? ta.value : '');
    var pp = document.getElementById('pp' + i);
    photos.push((pp && pp.src && pp.src.indexOf('data:') === 0) ? pp.src : null);
  });
  var state = {
    name: studentData.name, group: studentData.group,
    answeredCount: answeredCount, correctCount: correctCount,
    choices: problems.map(function(p) { return p.studentChoice; }),
    drawings: drawings, texts: texts, photos: photos
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch(e) {}
}

function loadSession(name, group) {
  var key = 'liaxa_mat1_t09_g01__' + (name + '__' + group).replace(/\s+/g, '_');
  try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

function restoreSession() {
  var name  = document.getElementById('sName').value.trim();
  var group = document.getElementById('sGroup').value.trim();
  var saved = loadSession(name, group);
  if (!saved) return;
  document.getElementById('restoreBar').style.display = 'none';
  studentData = { name: name, group: group };
  answeredCount = 0; correctCount = 0;
  var att = currentAttempt(name, group);
  buildLesson(seededRng(name + group + att));
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('lessonScreen').style.display  = 'block';
  document.getElementById('studentChip').textContent = name + ' · ' + group;
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('vis'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('.section').forEach(function(s) { obs.observe(s); });
  saved.choices.forEach(function(choice, idx) {
    if (choice !== null && choice !== undefined) confirmMC(idx, choice);
  });
  setTimeout(function() {
    if (saved.drawings) {
      saved.drawings.forEach(function(dataUrl, i) {
        if (!dataUrl) return;
        var dc = document.getElementById('dc' + i);
        if (!dc || !dc.width) return;
        var img = new Image();
        img.onload = function() {
          var dpr = window.devicePixelRatio || 1;
          dc.getContext('2d').drawImage(img, 0, 0, dc.width / dpr, dc.height / dpr);
        };
        img.src = dataUrl;
      });
    }
    if (saved.texts) {
      saved.texts.forEach(function(text, i) {
        if (!text) return;
        var ta = document.getElementById('ta' + i);
        if (ta) ta.value = text;
      });
    }

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);
  fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
  document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
  if (isOk) correctCount++;
  answeredCount++;
  document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
  saveSession();
  if (answeredCount === problems.length) setTimeout(showResults, 700);
}

async function generatePDF() {

  btn.disabled = true;

  var jspdf   = window.jspdf;
  var doc     = new jspdf.jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  var PW      = 215.9;
  var M       = 18;
  var TW      = PW - M * 2;
  var PH      = doc.internal.pageSize.height;
  var name    = studentData.name;
  var group   = studentData.group;
  var total   = problems.length;
  var pct     = Math.round(correctCount / total * 100);
  var dateStr = new Date().toLocaleString('es-MX', { dateStyle:'long', timeStyle:'short' });

  var raw = name + '|' + group + '|' + correctCount + '|' + total + '|' + new Date().toDateString();
  var h = 0;
  for (var ci = 0; ci < raw.length; ci++) h = (Math.imul(31, h) + raw.charCodeAt(ci)) | 0;
  var code = Math.abs(h).toString(36).toUpperCase().slice(0, 8);

  // ── PDF COLORS — INJECTION BLOCK ─────────────────────────────────────────
  //   Match these RGB values to --green and --gold above.
  //   PRIMARY  → pBR, pBG, pBB
  //   ACCENT   → pAR, pAG, pAB
  // ──────────────────────────────────────────────────────────────────────────
  var pBR = SCHOOL.pBR, pBG = SCHOOL.pBG, pBB = SCHOOL.pBB;  // PRIMARY (from SCHOOL, Rule 16)
  var pAR = SCHOOL.pAR, pAG = SCHOOL.pAG, pAB = SCHOOL.pAB;   // ACCENT (from SCHOOL, Rule 16)

  function pdfText(html) {
    if (!html) return '';
    return html
      .replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
      .replace(/&nbsp;/g,' ').replace(/&#[0-9]+;/g,'')
      .replace(/\u2192/g,'->').replace(/\u2212/g,'-').replace(/\u00b2/g,'^2')
      .replace(/\u00b3/g,'^3').replace(/\u00d7/g,'x').replace(/\u00f7/g,'/')
      .replace(/\u2260/g,'!=').replace(/\u2264/g,'<=').replace(/\u2265/g,'>=')
      .replace(/\u221a/g,'sqrt').replace(/\u03c0/g,'pi').replace(/\u2026/g,'...')
      .replace(/\s+/g,' ').trim();
  }

  // ── PORTADA: orange line / white logo strip / orange line / blue band ──
  doc.setFillColor(pAR,pAG,pAB); doc.rect(0,0,PW,2,'F');   // top accent line

    doc.setFontSize(8.5); var chLines = doc.splitTextToSize('Alumno: '+chosen, TW-18);

    doc.circle(M+7, wy+8, 3.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(isOk?'✓':'✗', M+5.2, wy+10.5);
    var ay = wy+7;

    wy += 11;

    var dc = document.getElementById('dc'+i);
    if (dc) {
      try {
        var imgD = dc.toDataURL('image/png');
        var ar   = dc.height / dc.width;
        var iw   = TW;
        var ih   = Math.min(iw * ar, 68);
        doc.addImage(imgD, 'PNG', M, wy, iw, ih);
        wy += ih + 4;
      } catch(e) {}
    }

    var ta = document.getElementById('ta'+i);
    if (ta && ta.value.trim()) {
      if (wy > PH-30) { doc.addPage(); wy = 20; }
      doc.setTextColor(20,24,32); doc.setFontSize(8); doc.setFont('courier','normal');
      var taLines = doc.splitTextToSize(ta.value, TW);
      taLines.slice(0,16).forEach(function(ln) {
        if (wy > PH-15) { doc.addPage(); wy = 20; }
        doc.text(ln, M, wy); wy += 5;
      });
      wy += 2;
    }

    var pp = document.getElementById('pp'+i);
    if (pp && pp.src && pp.src.indexOf('data:') === 0) {
      if (wy > PH-55) { doc.addPage(); wy = 20; }
      try { doc.addImage(pp.src, 'JPEG', M, wy, TW, 68); wy += 72; } catch(e) {}
    }
  }

  // ── Footer on every page ──
  var pages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(pAR,pAG,pAB); doc.rect(0, PH-3, PW, 3, 'F');
    doc.setTextColor(130,140,160); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(name+'  ·  '+group+'  ·  Código: '+code+'  ·  Página '+p+'/'+pages,
      PW/2, PH-5, {align:'center'});

    // ── SAVE / SHARE — iOS-safe download (LIAXA iOS PDF fix, Rule 12) ─────────
  //   iOS Safari ignores the <a download> attribute, so a plain download fails
  //   silently on iPhone/iPad. iOS -> native share sheet (-> "Save to Files"),
  //   with an inline-open fallback; everything else -> <a download> click.
  //   Runs synchronously off the tap so iOS accepts navigator.share().
  var _fname   = 'mat1_t09_g01_' + name.replace(/\s+/g,'_') + '_' + group.replace(/\s+/g,'_') + '.pdf';
  var _pdfBlob = doc.output('blob');

  function _restorePdfBtn(){ btn.innerHTML = '\u2b07 &nbsp;' + t('btn-pdf'); btn.disabled = false; }
  function _openPdfInline(b){
    var u = URL.createObjectURL(b);
    var w = window.open(u, '_blank');
    if (!w) { window.location.href = u; }
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  var _isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (_isIOS) {
    var _pdfFile = new File([_pdfBlob], _fname, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[_pdfFile] })) {
      navigator.share({ files:[_pdfFile], title:_fname })
        .then(_restorePdfBtn)
        .catch(function(e){
          if (e && e.name === 'AbortError') { _restorePdfBtn(); return; }
          _openPdfInline(_pdfBlob); _restorePdfBtn();
        });
      return;
    }
    _openPdfInline(_pdfBlob); _restorePdfBtn();
    return;
  }

  var _dlUrl = URL.createObjectURL(_pdfBlob);
  var _dlA   = document.createElement('a');
  _dlA.href  = _dlUrl; _dlA.download = _fname;
  document.body.appendChild(_dlA); _dlA.click();
  setTimeout(function(){ document.body.removeChild(_dlA); URL.revokeObjectURL(_dlUrl); }, 200);
  _restorePdfBtn();
}

/* ================================================
   buildLesson — OVERRIDE IN EACH GUIDE
   ================================================ */
/* ================================================
   buildLesson: Mediatriz, bisectriz, rectas paralelas y perpendiculares (1°)
   Interleaved: idea -> manipulativo -> problema(s). Cards built inline.
   ================================================ */
function buildLesson(rng) {
  var LB = document.getElementById('lessonBody');
  LB.innerHTML = '';
  problems = [];

  /* ============================================================
     HELPERS
     ============================================================ */
  function T(o){
    if (o === undefined || o === null) return '';
    if (typeof o === 'string' || typeof o === 'number') return o;
    return (o[LANG] !== undefined ? o[LANG] : o.es);
  }
  function ri(a,b){ return a + Math.floor(rng()*(b-a+1)); }
  function shufA(arr){
    var a = arr.slice(), i, j, t;
    for (i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sec(tag, title, html){
    var d = document.createElement('div');
    d.className = 'section';
    d.innerHTML = '<div class="stag">'+tag+'</div><h2>'+title+'</h2>'+(html||'');
    LB.appendChild(d);
    return d;
  }
  function widget(kind){
    var d = document.createElement('div');
    d.className = kind + 'wrap section';
    d.setAttribute('data-widget', kind);
    d.id = 'w' + kind;
    LB.appendChild(d);
    return d;
  }
  function cssv(n){
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(n); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }
  function fitCv(cv){
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 320;
    var h = cv.clientHeight || 210;
    cv.width  = Math.round(w*dpr);
    cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return { ctx:ctx, w:w, h:h };
  }
  function dot(ctx, x, y, r, col){
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  function label(ctx, s, x, y, col, w, h){
    ctx.fillStyle = col;
    ctx.font = '600 14px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s, Math.max(14, Math.min(w-14, x)), Math.max(16, Math.min(h-6, y)));
  }
  function addProb(spec){
    var so  = shufA(T(spec.options));
    var cor = T(spec.correct);
    problems.push({
      title: T(spec.title),
      questionText: T(spec.q),
      fn: '',
      hint: T(spec.hint),
      explanation: T(spec.exp),
      options: so,
      correctIdx: so.indexOf(cor),
      showWork: !!spec.showWork,
      studentChoice: null,
      pendingChoice: null
    });
    buildOneCard(problems[problems.length-1], problems.length-1);
  }

  /* ============================================================
     SEEDED VALUES (drawn once, in a fixed order)
     ============================================================ */
  var v1 = Math.floor(rng()*2), v2 = Math.floor(rng()*2), v3 = Math.floor(rng()*2);
  var v4 = Math.floor(rng()*2), v5 = Math.floor(rng()*2), v6 = Math.floor(rng()*2);
  var v7 = Math.floor(rng()*2), v8 = Math.floor(rng()*2), v9 = Math.floor(rng()*2);
  var v10 = Math.floor(rng()*2);

  var a2  = ri(20,55);          // inclinación base (P2)
  var d2  = ri(20,40);          // diferencia de inclinaciones (P2 variante B)
  var L3  = 2*ri(5,9);          // 10..18 cm  (P3)
  var g4  = ri(1,3);            // cm desde el extremo A (P4 variante B)
  var d5  = ri(6,14);           // cm (P5 variante A)
  var L5  = 4*ri(3,5);          // 12, 16, 20 cm (P5 variante B)
  var m7  = 4*ri(11,42);        // 44..168 grados (P7 variante A)
  var h7  = ri(22,68);          // grados (P7 variante B)
  var m10 = 4*ri(15,30);        // 60..120 grados (P10)

  /* ============================================================
     IDEA 1: rectas paralelas y rectas perpendiculares
     ============================================================ */
  sec(T({es:'Idea 1', en:'Idea 1'}),
      T({es:'Rectas paralelas y rectas perpendiculares', en:'Parallel lines and perpendicular lines'}),
      '<p>'+T({
        es:'Dos rectas dibujadas en la misma hoja pueden cruzarse o no. Si por más que las prolongues nunca llegan a tocarse, y la separación entre ellas es la misma en todos lados, se llaman paralelas. Si se cruzan y en el punto de cruce los cuatro ángulos que aparecen miden 90°, se llaman perpendiculares. Si se cruzan formando ángulos distintos de 90°, se dice que son oblicuas.',
        en:'Two lines drawn on the same sheet may cross or not. If no matter how far you extend them they never touch, and the gap between them is the same everywhere, they are called parallel. If they cross and the four angles at the crossing point all measure 90 degrees, they are called perpendicular. If they cross forming angles other than 90 degrees, they are said to be oblique.'
      })+'</p>'+
      '<p>'+T({
        es:'Para decidir cuál es cuál no hace falta recorrer las rectas hasta el infinito. Basta comparar la inclinación de cada una respecto de una misma referencia, por ejemplo una línea horizontal. Si las dos tienen la misma inclinación, jamás se van a encontrar. Si una está inclinada 90° más que la otra, el cruce ocurre en ángulo recto.',
        en:'To decide which is which you do not need to follow the lines forever. It is enough to compare how much each one is tilted from the same reference, for example a horizontal line. If both have the same tilt, they will never meet. If one is tilted 90 degrees more than the other, the crossing happens at a right angle.'
      })+'</p>'+
      '<div class="defgrid">'+
        '<div class="defcell"><div class="defname">'+T({es:'Paralelas',en:'Parallel'})+'</div><div class="deftxt">'+T({es:'Misma inclinación, nunca se cruzan, distancia constante.',en:'Same tilt, they never cross, constant distance.'})+'</div></div>'+
        '<div class="defcell"><div class="defname">'+T({es:'Perpendiculares',en:'Perpendicular'})+'</div><div class="deftxt">'+T({es:'Se cruzan y los cuatro ángulos del cruce miden 90°.',en:'They cross and the four angles at the crossing measure 90 degrees.'})+'</div></div>'+
      '</div>'+
      '<div class="callout"><p>'+T({
        es:'La escuadra sirve para comprobar sin transportador: si su esquina de 90° encaja exacta en el cruce, las rectas son perpendiculares.',
        en:'A set square lets you check without a protractor: if its 90 degree corner fits exactly at the crossing, the lines are perpendicular.'
      })+'</p></div>');

  /* ---- MANIPULATIVO 1: gira la recta ---- */
  (function(){
    var wrap = widget('rectas');
    var TG = shufA(['par','per','per']);
    var BS = [ri(8,32), ri(100,138), ri(52,78)];
    var st = { r:0, ang:0, tries:0, done:false, lock:false, fb:'' };

    function base(){ return BS[st.r]; }
    function norm(x){ x = x % 180; if (x < 0) x += 180; return x; }
    function target(){ return TG[st.r] === 'par' ? norm(base()) : norm(base()+90); }
    function betw(a,b){ var d = norm(a-b); return d > 90 ? 180-d : d; }
    function delta(){ var d = norm(st.ang - target()); if (d > 90) d -= 180; return d; }
    function startAng(){ return norm(target() + (st.r % 2 === 0 ? 37 : -43)); }

    function draw(){
      var cv = document.getElementById('raCv'); if (!cv) return;
      var g = fitCv(cv), ctx = g.ctx, w = g.w, h = g.h;
      var cx = w/2, cy = h/2;
      var colR = cssv('--green'), colS = cssv('--gold'), txt = cssv('--text'), sub = cssv('--text3'), bd = cssv('--border');
      var b = base(), m = st.ang;
      var br = b*Math.PI/180, mr = m*Math.PI/180;
      var ux = Math.cos(br), uy = -Math.sin(br);
      var vx = Math.cos(mr), vy = -Math.sin(mr);
      var off = 44;
      var qx = cx + off*Math.sin(mr), qy = cy + off*Math.cos(mr);

      ctx.strokeStyle = bd; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(w,cy); ctx.stroke();

      ctx.lineCap = 'round';
      ctx.strokeStyle = colR; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(cx-ux*900, cy-uy*900); ctx.lineTo(cx+ux*900, cy+uy*900); ctx.stroke();
      ctx.strokeStyle = colS; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(qx-vx*900, qy-vy*900); ctx.lineTo(qx+vx*900, qy+vy*900); ctx.stroke();

      var det = (-ux*vy) + (vx*uy);
      var ang = betw(b,m);
      if (Math.abs(det) > 0.0001) {
        var tt = ((qx-cx)*(-vy) - (-vx)*(qy-cy)) / det;
        var ix = cx + ux*tt, iy = cy + uy*tt;
        if (ix > 24 && ix < w-24 && iy > 24 && iy < h-24) {
          if (ang === 90) {
            ctx.strokeStyle = sub; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ix+ux*16, iy+uy*16);
            ctx.lineTo(ix+ux*16+vx*16, iy+uy*16+vy*16);
            ctx.lineTo(ix+vx*16, iy+vy*16);
            ctx.stroke();
          } else {
            ctx.strokeStyle = sub; ctx.lineWidth = 1.8;
            var a1 = -b*Math.PI/180, a2 = -m*Math.PI/180;
            ctx.beginPath(); ctx.arc(ix, iy, 24, Math.min(a1,a2), Math.max(a1,a2)); ctx.stroke();
          }
          label(ctx, ang+'°', ix+34, iy-14, sub, w, h);
        }
      } else if (ang === 0) {
        ctx.strokeStyle = sub; ctx.lineWidth = 1.6;
        ctx.setLineDash([4,3]);
        var k, px, py;
        for (k=-1;k<=1;k+=2){
          px = cx + ux*70*k; py = cy + uy*70*k;
          ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.sin(mr)*off, py+Math.cos(mr)*off); ctx.stroke();
        }
        ctx.setLineDash([]);
      }
      label(ctx, 'r', cx+ux*112, cy+uy*112-6, txt, w, h);
      label(ctx, 's', qx+vx*112, qy+vy*112-6, txt, w, h);
    }

    function updLbl(){
      var e = document.getElementById('raVal'); if (e) e.textContent = betw(base(), st.ang)+'°';
      var s = document.getElementById('raSv'); if (s) s.textContent = st.ang+'°';
    }
    function goalTxt(){
      return TG[st.r] === 'par'
        ? T({es:'Deja la recta s paralela a la recta r.', en:'Make line s parallel to line r.'})
        : T({es:'Deja la recta s perpendicular a la recta r.', en:'Make line s perpendicular to line r.'});
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Gira la recta', en:'Turn the line'})+'</div>'+
          '<div class="iw-box"><div class="rfb">'+st.fb+'</div></div>';
        return;
      }
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Gira la recta', en:'Turn the line'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+T({es:'Ronda',en:'Round'})+' '+(st.r+1)+' / 3</div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'Mueve el control para girar la recta s y observa qué le pasa al punto donde cruza a r.',
            en:'Move the control to turn line s and watch what happens to the point where it crosses r.'
          })+'</div>'+
          '<div class="goalbar">'+goalTxt()+'</div>'+
          '<canvas class="gcanvas" id="raCv"></canvas>'+
          '<div class="krow"><input type="range" min="0" max="179" value="'+st.ang+'" oninput="raSlide(this.value)"><span class="kval" id="raSv">'+st.ang+'°</span></div>'+
          '<div class="livelbl">'+T({es:'Ángulo entre r y s: ', en:'Angle between r and s: '})+'<b id="raVal">'+betw(base(),st.ang)+'°</b></div>'+
          '<button class="rverify-btn" onclick="raChk()">'+T({es:'Verificar',en:'Check'})+'</button>'+
          '<div class="rfb" id="raFb">'+st.fb+'</div>'+
        '</div>';
      draw();
    }
    function adv(ms){
      st.lock = true;
      setTimeout(function(){
        st.r++; st.tries = 0; st.fb = ''; st.lock = false;
        if (st.r >= 3){
          st.done = true;
          st.fb = '<span class="okmsg">'+T({
            es:'Listo: ya puedes decidir si dos rectas son paralelas o perpendiculares comparando su inclinación.',
            en:'Done: you can now tell whether two lines are parallel or perpendicular by comparing their tilt.'
          })+'</span>';
        } else { st.ang = startAng(); }
        render();
      }, ms);
    }
    window.raSlide = function(val){
      if (st.done || st.lock) return;
      st.ang = parseInt(val,10) || 0;
      draw(); updLbl();
    };
    window.raChk = function(){
      if (st.done || st.lock) return;
      var fb = document.getElementById('raFb'); if (!fb) return;
      var d = delta();
      if (d === 0){
        fb.innerHTML = '<span class="okmsg">'+(TG[st.r]==='par'
          ? T({es:'Correcto: las dos tienen la misma inclinación, el ángulo entre ellas es 0° y ya nunca se cruzan.',
               en:'Correct: both have the same tilt, the angle between them is 0 degrees and they no longer cross.'})
          : T({es:'Correcto: se cruzan formando 90°, así que son perpendiculares.',
               en:'Correct: they cross forming 90 degrees, so they are perpendicular.'}))+'</span>';
        adv(1500); return;
      }
      st.tries++;
      if (st.tries >= 3){
        st.ang = target(); draw(); updLbl();
        fb.innerHTML = TG[st.r]==='par'
          ? T({es:'Así queda: la recta s copió la inclinación de r y el punto de cruce se fue tan lejos que ya no existe.',
               en:'Here it is: line s copied the tilt of r and the crossing point moved so far away that it no longer exists.'})
          : T({es:'Así queda: la inclinación de s es 90° mayor que la de r y el cruce forma un ángulo recto.',
               en:'Here it is: the tilt of s is 90 degrees greater than that of r and the crossing forms a right angle.'});
        adv(2400); return;
      }
      fb.textContent = T({
        es:'Todavía no: te faltan '+Math.abs(d)+'° y el control debe ir hacia la '+(d>0?'izquierda':'derecha')+'.',
        en:'Not yet: you are '+Math.abs(d)+' degrees away and the control has to move to the '+(d>0?'left':'right')+'.'
      });
    };
    st.ang = startAng();
    render();
  })();

  /* ---- PROBLEMA 1 ---- */
  addProb(v1 === 0 ? {
    title:{es:'Dos orillas del patio', en:'Two edges of the schoolyard'},
    q:{es:'En el patio de la escuela, la orilla de la cancha y la barda del fondo se pueden prolongar todo lo que quieras sin llegar a tocarse, y la separación entre ellas es la misma en todos sus puntos. ¿Cómo se llaman dos rectas que se comportan así?',
       en:'In the schoolyard, the edge of the court and the back wall can be extended as far as you like without ever touching, and the gap between them is the same at every point. What are two lines that behave like this called?'},
    options:{es:['Rectas paralelas','Rectas perpendiculares','Rectas oblicuas','Rectas que comparten su punto medio'],
             en:['Parallel lines','Perpendicular lines','Oblique lines','Lines that share their midpoint']},
    correct:{es:'Rectas paralelas', en:'Parallel lines'},
    hint:{es:'Fíjate en qué le pasa a la distancia entre las dos rectas conforme avanzas a lo largo de ellas.',
          en:'Look at what happens to the distance between the two lines as you move along them.'},
    exp:{es:'Nunca se cruzan y conservan siempre la misma separación, así que son paralelas. Las perpendiculares y las oblicuas sí llegan a cruzarse, y se distinguen entre sí por el ángulo del cruce.',
         en:'They never cross and always keep the same gap, so they are parallel. Perpendicular and oblique lines do cross, and they differ from each other in the angle of the crossing.'},
    showWork:false
  } : {
    title:{es:'El cruce de dos calles', en:'Where two streets cross'},
    q:{es:'Dos calles rectas se cruzan y en el cruce quedan formados cuatro ángulos que miden exactamente lo mismo. ¿Cómo son esas dos calles entre sí?',

    var st = { i:0, tries:0, hits:0, done:false, lock:false };

    function reason(bin){
      if (bin === 0) return T({es:'La mediatriz trabaja sobre un segmento: lo cruza en su punto medio a 90° y sus puntos quedan igual de lejos de los dos extremos.',
                               en:'The perpendicular bisector works on a segment: it crosses it at its midpoint at 90 degrees and its points stay equally far from the two endpoints.'});
      if (bin === 1) return T({es:'La bisectriz trabaja sobre un ángulo: lo reparte en dos partes iguales y sus puntos quedan igual de lejos de los dos lados.',
                               en:'The angle bisector works on an angle: it shares it into two equal parts and its points stay equally far from the two sides.'});
      if (bin === 2) return T({es:'Las rectas paralelas nunca se cruzan y conservan siempre la misma distancia.',
                               en:'Parallel lines never cross and always keep the same distance.'});
      return T({es:'Las rectas perpendiculares se cruzan formando ángulos de 90°.',
                en:'Perpendicular lines cross forming 90 degree angles.'});
    }
    function render(){
      if (st.done){
        wrap.innerHTML =
          '<div class="iw-tag">'+T({es:'Clasifica el trazo', en:'Classify the construction'})+'</div>'+
          '<div class="iw-box"><div class="rfb"><span class="okmsg">'+T({
            es:'Listo: '+st.hits+' de '+ITEMS.length+' al primer intento. Ya distingues los cuatro trazos por lo que hacen.',
            en:'Done: '+st.hits+' out of '+ITEMS.length+' on the first try. You can now tell the four constructions apart by what they do.'
          })+'</span></div></div>';
        return;
      }
      var it = ITEMS[st.i];
      wrap.innerHTML =
        '<div class="iw-tag">'+T({es:'Clasifica el trazo', en:'Classify the construction'})+'</div>'+
        '<div class="iw-box">'+
          '<div class="rondas">'+(st.i+1)+' / '+ITEMS.length+'</div>'+
          '<div class="iw-instr iw-sub">'+T({
            es:'Lee la descripción y toca el nombre que le corresponde.',
            en:'Read the description and tap the name it belongs to.'
          })+'</div>'+
          '<div class="clscard">'+it[LANG === 'en' ? 'en' : 'es']+'</div>'+
          '<div class="clsbins">'+BINS[LANG === 'en' ? 'en' : 'es'].map(function(b,bi){
            return '<button class="clsbin" onclick="clPick('+bi+')">'+b+'</button>';
          }).join('')+'</div>'+
          '<div class="rfb" id="clFb"></div>'+
        '</div>';
    }
    function next(ms){
      st.lock = true;
      setTimeout(function(){
        st.i++; st.tries = 0; st.lock = false;
        if (st.i >= ITEMS.length) st.done = true;
        render();
      }, ms);
    }
    window.clPick = function(bi){
      if (st.done || st.lock) return;
      var it = ITEMS[st.i];
      var fb = document.getElementById('clFb'); if (!fb) return;
      if (bi === it.bin){
        if (st.tries === 0) st.hits++;
        fb.innerHTML = '<span class="okmsg">'+T({es:'Correcto. ', en:'Correct. '})+'</span>'+reason(it.bin);
        next(1600); return;
      }
      st.tries++;
      if (st.tries >= 3){
        fb.innerHTML = T({es:'Era ', en:'It was '})+'<b>'+BINS[LANG === 'en' ? 'en' : 'es'][it.bin]+'</b>. '+reason(it.bin);
        next(2600); return;
      }
      fb.textContent = (st.tries === 1)
        ? T({es:'Todavía no. Primero decide si la frase habla de un solo trazo que reparte algo, o de la relación entre dos rectas.',
             en:'Not yet. First decide whether the sentence is about a single construction that shares something, or about the relation between two lines.'})
        : T({es:'Vuelve a intentar. Fíjate si lo que se reparte o se cruza tiene que ver con un segmento, que tiene dos extremos, o con un ángulo, que tiene dos lados.',
             en:'Try again. Look at whether what is being shared or crossed involves a segment, which has two endpoints, or an angle, which has two sides.'});
    };
    render();
  })();

  /* ---- PROBLEMA 8 ---- */
  addProb(v8 === 0 ? {
    title:{es:'Las diagonales del rombo', en:'The diagonals of the rhombus'},
    q:{es:'En un rombo, cada diagonal corta a la otra justo por su punto medio, y además las dos se cruzan formando ángulos de 90°. ¿Qué es entonces una diagonal respecto de la otra?',
       en:'In a rhombus, each diagonal cuts the other exactly at its midpoint, and the two also cross forming 90 degree angles. What is one diagonal with respect to the other?'},
    options:{es:['Es la mediatriz de la otra diagonal',
                 'Es la bisectriz de la otra diagonal',
                 'Es una recta paralela a la otra diagonal',
                 'Es una recta oblicua respecto de la otra diagonal'],
             en:['It is the perpendicular bisector of the other diagonal',
                 'It is the angle bisector of the other diagonal',
                 'It is a line parallel to the other diagonal',
                 'It is an oblique line with respect to the other diagonal']},
    correct:{es:'Es la mediatriz de la otra diagonal', en:'It is the perpendicular bisector of the other diagonal'},
    hint:{es:'Revisa las dos condiciones que se cumplen a la vez en ese cruce.',
          en:'Check the two conditions that hold at the same time at that crossing.'},
    exp:{es:'Una recta que pasa por el punto medio de un segmento y además lo cruza a 90° es su mediatriz, y eso es exactamente lo que hace cada diagonal del rombo con la otra.',
         en:'A line that passes through the midpoint of a segment and also crosses it at 90 degrees is its perpendicular bisector, and that is exactly what each diagonal of the rhombus does to the other.'},
    showWork:false
  } : {
    title:{es:'Los lados del rectángulo', en:'The sides of the rectangle'},
    q:{es:'En un rectángulo ABCD, los lados AB y DC se pueden prolongar sin llegar a tocarse nunca, mientras que los lados AB y AD se cortan formando un ángulo de 90°. ¿Cómo se describen esos dos pares de lados?',
       en:'In a rectangle ABCD, sides AB and DC can be extended without ever touching, while sides AB and AD meet forming a 90 degree angle. How are those two pairs of sides described?'},
    options:{es:['AB y DC son paralelos, y AB y AD son perpendiculares',
                 'AB y DC son perpendiculares, y AB y AD son paralelos',
                 'Los dos pares de lados son paralelos',
                 'Los dos pares de lados son perpendiculares'],
             en:['AB and DC are parallel, and AB and AD are perpendicular',
                 'AB and DC are perpendicular, and AB and AD are parallel',
                 'Both pairs of sides are parallel',
                 'Both pairs of sides are perpendicular']},
    correct:{es:'AB y DC son paralelos, y AB y AD son perpendiculares', en:'AB and DC are parallel, and AB and AD are perpendicular'},
    hint:{es:'Separa los dos casos: uno habla de rectas que no se tocan y el otro del ángulo con el que se cortan.',
          en:'Separate the two cases: one is about lines that never touch and the other about the angle at which they meet.'},
    exp:{es:'Los lados opuestos del rectángulo no se cruzan y guardan la misma distancia, así que son paralelos; los lados consecutivos se cortan a 90°, así que son perpendiculares.',
         en:'The opposite sides of the rectangle never cross and keep the same distance, so they are parallel; the consecutive sides meet at 90 degrees, so they are perpendicular.'},
    showWork:false
  });

  /* ---- PROBLEMA 9 ---- */
  addProb(v9 === 0 ? {
    title:{es:'La fuente del terreno', en:'The fountain in the lot'},
    q:{es:'Un terreno tiene forma de triángulo y se quiere colocar una fuente que quede exactamente a la misma distancia de las tres esquinas. ¿Qué conviene trazar para encontrar ese lugar?',
       en:'A lot has the shape of a triangle and a fountain is to be placed exactly the same distance from the three corners. What is worth drawing to find that spot?'},
    options:{es:['Las mediatrices de los tres lados y su punto de cruce',
                 'Las bisectrices de los tres ángulos y su punto de cruce',
                 'Las paralelas a cada lado que pasan por la esquina opuesta',
                 'Las perpendiculares a un mismo lado trazadas desde cada esquina'],
             en:['The perpendicular bisectors of the three sides and their meeting point',
                 'The bisectors of the three angles and their meeting point',
                 'The parallels to each side through the opposite corner',
                 'The perpendiculars to one same side drawn from each corner']},
    correct:{es:'Las mediatrices de los tres lados y su punto de cruce', en:'The perpendicular bisectors of the three sides and their meeting point'},
    hint:{es:'Aquí hay que igualar distancias a tres puntos, y conviene resolverlo de dos en dos.',
          en:'Here distances to three points must be evened out, and it helps to handle them two at a time.'},
    exp:{es:'La mediatriz de un lado reúne los puntos que están igual de lejos de sus dos esquinas. Al trazar las tres mediatrices, se cortan en un solo punto que cumple esa condición con las tres esquinas a la vez.',
         en:'The perpendicular bisector of a side gathers the points that are equally far from its two corners. Drawing the three of them, they meet at a single point that satisfies the condition for all three corners at once.'},
    showWork:false
  } : {
    title:{es:'La fuente entre las bardas', en:'The fountain between the walls'},
    q:{es:'En un terreno triangular se quiere colocar una fuente redonda que quede exactamente a la misma distancia de las tres bardas que lo rodean. ¿Qué conviene trazar para encontrar ese lugar?',
       en:'In a triangular lot a round fountain is to be placed exactly the same distance from the three walls around it. What is worth drawing to find that spot?'},
    options:{es:['Las bisectrices de los tres ángulos y su punto de cruce',
                 'Las mediatrices de los tres lados y su punto de cruce',
                 'Las paralelas a las tres bardas trazadas a la mitad del terreno',
                 'Las perpendiculares a cada barda trazadas desde la esquina opuesta'],
             en:['The bisectors of the three angles and their meeting point',
                 'The perpendicular bisectors of the three sides and their meeting point',
                 'The parallels to the three walls drawn halfway across the lot',
                 'The perpendiculars to each wall drawn from the opposite corner']},
    correct:{es:'Las bisectrices de los tres ángulos y su punto de cruce', en:'The bisectors of the three angles and their meeting point'},
    hint:{es:'Ahora hay que igualar distancias a tres rectas, no a tres puntos.',
          en:'Now distances to three lines have to be evened out, not to three points.'},
    exp:{es:'La bisectriz de un ángulo reúne los puntos que están igual de lejos de sus dos lados. Al trazar las tres bisectrices, se cortan en un solo punto que queda a la misma distancia de las tres bardas.',
         en:'The bisector of an angle gathers the points that are equally far from its two sides. Drawing the three bisectors, they meet at a single point that is the same distance from the three walls.'},
    showWork:false
  });

  /* ---- PROBLEMA 10 ---- */
  addProb(v10 === 0 ? {
    title:{es:'Dos repartos seguidos', en:'Two splits in a row'},
    q:{es:'El ángulo POQ mide '+m10+'°. Se traza su bisectriz OR y después se traza OS, la bisectriz del ángulo POR. ¿Cuánto mide el ángulo POS?',
       en:'Angle POQ measures '+m10+' degrees. Its bisector OR is drawn, and then OS, the bisector of angle POR, is drawn. How big is angle POS?'},
    options:{es:[(m10/4)+'°', (m10/2)+'°', (3*m10/4)+'°', (m10/2+10)+'°'],
             en:[(m10/4)+'°', (m10/2)+'°', (3*m10/4)+'°', (m10/2+10)+'°']},
    correct:{es:(m10/4)+'°', en:(m10/4)+'°'},
    hint:{es:'Resuelve por pasos: primero cuánto queda después del primer reparto y luego qué le hace el segundo.',
          en:'Work in steps: first how much is left after the first split and then what the second one does to it.'},
    exp:{es:'La primera bisectriz deja dos ángulos de '+(m10/2)+'°. La segunda reparte a POR en dos partes iguales, así que POS mide '+(m10/4)+'°.',
         en:'The first bisector leaves two angles of '+(m10/2)+' degrees. The second one shares POR into two equal parts, so POS measures '+(m10/4)+' degrees.'},
    showWork:true
  } : {
    title:{es:'Lo que queda del otro lado', en:'What is left on the other side'},
    q:{es:'El ángulo POQ mide '+m10+'°. OR es su bisectriz y OS es la bisectriz del ángulo POR. ¿Cuánto mide el ángulo SOQ?',
       en:'Angle POQ measures '+m10+' degrees. OR is its bisector and OS is the bisector of angle POR. How big is angle SOQ?'},
    options:{es:[(3*m10/4)+'°', (m10/2)+'°', (m10/4)+'°', m10+'°'],
             en:[(3*m10/4)+'°', (m10/2)+'°', (m10/4)+'°', m10+'°']},
    correct:{es:(3*m10/4)+'°', en:(3*m10/4)+'°'},
    hint:{es:'El ángulo SOQ está formado por dos pedazos: lo que sobra del primer reparto y el ángulo ROQ completo.',
          en:'Angle SOQ is made of two pieces: what is left over from the first split plus the whole angle ROQ.'},
    exp:{es:'OR deja dos ángulos de '+(m10/2)+'°. OS reparte a POR en dos de '+(m10/4)+'°, así que SOQ es '+(m10/4)+'° más '+(m10/2)+'°, es decir '+(3*m10/4)+'°.',
         en:'OR leaves two angles of '+(m10/2)+' degrees. OS shares POR into two of '+(m10/4)+' degrees, so SOQ is '+(m10/4)+' degrees plus '+(m10/2)+' degrees, that is '+(3*m10/4)+' degrees.'},
    showWork:true
  });
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykkuJ_apGq3vALIFd4mr3acu81c7K4OKxW-DZ-i52Ceyl3lOanXMdvbS9SIXPrLQBm/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var moduleTitle = 'Mediatriz, Bisectriz, Paralelas y Perpendiculares';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var elapsed = Math.round((Date.now()-openedAt)/1000);
    var url = GAS_URL+'?action=track&school='+encodeURIComponent(school)+'&event='+encodeURIComponent(ev)+'&module_id='+encodeURIComponent(moduleId)+'&module_title='+encodeURIComponent(moduleTitle)+'&session_id='+encodeURIComponent(sessionId)+'&elapsed_sec='+elapsed;
    var img = new Image();
    img.src = url;
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
