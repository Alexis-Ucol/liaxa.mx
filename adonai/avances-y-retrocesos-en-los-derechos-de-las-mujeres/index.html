  wrap.innerHTML =
    wgtHead(S('El cuaderno del balance', 'The balance notebook'),
            S('Aquí no hay una sola respuesta posible: lo que cuenta es en qué hechos apoyas lo que dices.',
              'There is no single possible answer here: what counts is which facts you lean on.')) +
    '<div class="rf-prompt">' + L(p) + '</div>' +
    '<div class="wtabs">' +
      '<button class="wtab active" onclick="rfTab(\'type\',this)">' + t('tab-type') + '</button>' +
      '<button class="wtab" onclick="rfTab(\'draw\',this)">' + t('tab-draw') + '</button>' +
    '</div>' +
    '<div class="wpanel active" id="rf_type"><textarea class="wtextarea" id="rfTa" placeholder="' + t('ph-work') + '"></textarea></div>' +
    '<div class="wpanel" id="rf_draw">' +
      '<div class="cvwrap">' +
        '<canvas class="dcanvas" id="rfCv"></canvas>' +
        '<div class="ctoolbar">' +
          '<button class="tbtn2 bpen on">' + t('btn-pen') + '</button>' +
          '<button class="tbtn2 bmarker">' + t('btn-marker') + '</button>' +
          '<button class="tbtn2 beraser">' + t('btn-eraser') + '</button>' +
          '<div class="cdot sel" data-color="#0f2d5a" style="background:#0f2d5a"></div>' +
          '<div class="cdot" data-color="#1a1a16" style="background:#1a1a16"></div>' +
          '<div class="cdot" data-color="#8b2500" style="background:#8b2500"></div>' +
          '<div class="cdot" data-color="#1d4e89" style="background:#1d4e89"></div>' +
          '<button class="clrbtn">' + t('btn-clear') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="iw-row"><button class="iw-btn" onclick="rfSave()">' + S('Guardar en el cuaderno', 'Save to the notebook') + '</button></div>' +
    '<div class="iw-fb" id="rfFb"></div>';
  document.getElementById('lessonBody').appendChild(wrap);
}
function rfTab(which, btn){
  ['type', 'draw'].forEach(function(k){
    var el = document.getElementById('rf_' + k);
    if (el) el.classList.toggle('active', k === which);
  });
  var w = document.getElementById('wCuaderno');
  if (w) w.querySelectorAll('.wtab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (which === 'draw') setTimeout(function(){ var c = document.getElementById('rfCv'); if (c && !c.width) initCanvas(c); }, 60);
}
function rfSave(){
  var fb = document.getElementById('rfFb');
  if (!fb) return;
  var ta = document.getElementById('rfTa');
  var few = ta && ta.value.trim().length > 0 && ta.value.trim().length < 40;
  fb.className = 'iw-fb ok';
  fb.innerHTML = '✓ ' + (few ? S('Guardado. Ya tienes el inicio: añade el año y el hecho concreto en el que te apoyas y tu balance quedará mucho más firme.',
                                 'Saved. You have the start: add the year and the concrete fact you lean on and your balance will stand much firmer.')
                             : S('Guardado. Un balance histórico se defiende con fechas y datos comparables, y eso es justo lo que estás practicando.',
                                 'Saved. A historical balance is defended with dates and comparable data, and that is exactly what you are practising.'));
}

/* ================================================
   buildLesson :: concepto, manipulable, problema (Rule 1)
   ================================================ */
function buildLesson(rng) {
  injectGuideStyles();

  /* ══════════ CONCEPTO 1 ══════════ */
  addSection(S('Concepto 1', 'Concept 1'),
    S('Un antes y un después', 'A before and an after'),
    S('<p>La historia de los derechos de las mujeres no es una escalera que solo sube. Hay periodos en los que se reconocen derechos nuevos y periodos en los que se pierden derechos que ya se ejercían. Para no confundir una cosa con la otra, quien investiga coloca frente a frente un antes y un después y hace tres preguntas al par de fechas.</p>' +
      '<p>Si tras el cambio hay más personas que pueden ejercer el derecho, o cubre más situaciones, o resulta más fácil usarlo, hubo un avance. Si ocurre lo contrario, hubo un retroceso, aunque en su momento nadie lo llamara así. Un mismo hecho puede contener las dos cosas a la vez: una reforma que reconoce el voto solo a una parte de las mujeres amplía lo que había y al mismo tiempo deja fuera a la mayoría. Por eso el balance nunca se decide con una palabra suelta, sino comparando dos momentos con datos.</p>',
      '<p>The history of the rights of women is not a staircase that only goes up. There are periods when new rights are recognized and periods when rights already being exercised are lost. So as not to confuse one with the other, researchers place a before and an after side by side and ask the pair of dates three questions.</p>' +
      '<p>If after the change there are more people who can exercise the right, or it covers more situations, or it becomes easier to use, there was an advance. If the opposite happens, there was a setback, even if at the time nobody called it that. One single fact may contain both things at once: a reform recognizing the vote only for part of the women widens what existed and at the same time leaves the majority out. That is why the balance is never settled with a loose word, but by comparing two moments with data.</p>') +
    '<div class="rules-grid">' +
      '<div class="rcard"><div class="rname">' + S('Primera pregunta', 'First question') + '</div><div class="rform">' + S('¿a quiénes alcanza?', 'who does it reach?') + '</div><div class="rnote">' + S('Cuenta cuántas quedan dentro y cuántas fuera antes y después.', 'Count how many are inside and how many outside before and after.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Segunda pregunta', 'Second question') + '</div><div class="rform">' + S('¿hasta dónde llega?', 'how far does it go?') + '</div><div class="rnote">' + S('Un derecho puede valer para un municipio, para un estado o para el país entero.', 'A right may hold for a municipality, for a state or for the whole country.') + '</div></div>' +
      '<div class="rcard"><div class="rname">' + S('Tercera pregunta', 'Third question') + '</div><div class="rform">' + S('¿puede ejercerse?', 'can it be exercised?') + '</div><div class="rnote">' + S('Un derecho reconocido y sin escuela, oficina o protección cerca queda en el papel.', 'A right recognized with no school, office or protection nearby stays on paper.') + '</div></div>' +
    '</div>' +
    trBuild(rng));
  trRender();

  /* ── graded 1 ── */
  addProblem(pickV([
    { title:{ es:'Poner el hecho en la balanza', en:'Putting the fact on the scale' },
      stmt:{ es:'En un país las mujeres votaron en dos elecciones nacionales y algunos años después un nuevo gobierno eliminó ese derecho del texto de la ley. ¿Cómo se describe mejor ese segundo momento?',
             en:'In one country women voted in two national elections and some years later a new government removed that right from the text of the law. How is that second moment best described?' },
      options:{ es:['Un retroceso: un derecho que ya se ejercía dejó de estar reconocido.',
                    'Un avance lento, porque el derecho tardó más de lo previsto en aplicarse.',
                    'Una situación sin cambio, porque la ley anterior seguía escrita en otros textos.',
                    'Un avance parcial, porque el derecho quedó reservado a las mujeres con estudios.'],
                en:['A setback: a right already being exercised stopped being recognized.',
                    'A slow advance, because the right took longer than expected to be applied.',
                    'A situation with no change, because the earlier law was still written in other texts.',
                    'A partial advance, because the right was reserved for women with schooling.'] },
      correct:0,
      hint:{ es:'Compara las dos fechas con la primera pregunta del recuadro: ¿cuántas podían votar antes y cuántas después?',
             en:'Compare the two dates with the first question of the box: how many could vote before and how many after?' },
      explanation:{ es:'Antes del cambio había mujeres votando; después no quedó ninguna, y la razón está escrita en la ley nueva. Ese es exactamente el caso en que el balance entre dos momentos da negativo.',
                    en:'Before the change there were women voting; afterwards none were left, and the reason is written in the new law. That is exactly the case where the balance between two moments comes out negative.' } },
    { title:{ es:'Poner el hecho en la balanza', en:'Putting the fact on the scale' },
      stmt:{ es:'En un país donde ninguna mujer votaba, una reforma reconoce el voto a las mayores de treinta años que cumplan ciertos requisitos de propiedad. ¿Cuál es el balance de esa reforma?',
             en:'In a country where no woman voted, a reform recognizes the vote for those over thirty who meet certain property requirements. What is the balance of that reform?' },
      options:{ es:['Un avance de alcance recortado: votan más mujeres que antes, pero el derecho no llega a todas.',
                    'Un retroceso, porque antes de la reforma no existía ningún requisito de edad ni de propiedad.',
                    'Un cambio sin efecto, porque el número de votantes siguió siendo exactamente el mismo.',
                    'Un avance completo, porque la ley dejó de distinguir entre mujeres y hombres.'],
                en:['An advance with cut back reach: more women vote than before, but the right does not reach all of them.',
                    'A setback, because before the reform there was no age or property requirement at all.',
                    'A change with no effect, because the number of voters remained exactly the same.',
                    'A full advance, because the law stopped distinguishing between women and men.'] },
      correct:0,
      hint:{ es:'Usa dos preguntas a la vez: cuántas votan ahora comparado con antes, y cuántas siguen fuera del padrón.',
             en:'Use two questions at once: how many vote now compared with before, and how many are still off the roll.' },
      explanation:{ es:'El punto de comparación es el país sin ninguna votante, así que el saldo es positivo. Pero el mismo texto que abre la puerta la deja entornada, y por eso la campaña siguió hasta que cayeron la edad y los requisitos.',
                    en:'The point of comparison is the country with no woman voting, so the balance is positive. Yet the same text that opens the door leaves it ajar, and that is why the campaign continued until the age and the requirements fell.' } }
  ], rng), rng);

  /* ── graded 2 ── */
  addProblem(pickV([
    { title:{ es:'Leer una trayectoria', en:'Reading a trajectory' },
      stmt:{ es:'Tres fechas seguidas en Francia: en 1791 se publica una declaración que reclama derechos para las mujeres, en 1793 se prohíben sus clubes políticos y en 1804 un código civil las coloca bajo la autoridad del marido. ¿Qué muestra esa secuencia?',
             en:'Three consecutive dates in France: in 1791 a declaration claiming rights for women is published, in 1793 their political clubs are banned and in 1804 a civil code places them under the authority of the husband. What does that sequence show?' },
      options:{ es:['Que un reclamo puede abrirse paso y ser revertido pocos años después por quienes gobiernan.',
                    'Que los derechos avanzaron sin interrupción durante todo ese periodo.',
                    'Que las mujeres de esos años no llegaron a formular ninguna demanda escrita.',
                    'Que los tres hechos ocurrieron en países distintos y no pueden compararse.'],
                en:['That a claim can make its way and be reversed a few years later by those who govern.',
                    'That rights advanced without interruption throughout that period.',
                    'That the women of those years never formulated any written demand.',
                    'That the three facts happened in different countries and cannot be compared.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Anota las tres fechas en orden y escribe al lado de cada una si más mujeres o menos podían actuar en público después de ella.',
             en:'Write the three dates in order and note beside each one whether more women or fewer could act in public after it.' },
      explanation:{ es:'La declaración amplía lo que se podía reclamar; la prohibición cierra el espacio donde se reclamaba, y el código retira además la capacidad legal. Trece años bastaron para pasar del punto más alto al más bajo, y esa reversión es lo que obliga a estudiar el proceso completo y no solo su inicio.',
                    en:'The declaration widens what could be claimed; the ban closes the space where it was claimed, and the code additionally withdraws legal capacity. Thirteen years were enough to go from the highest point to the lowest, and that reversal is what forces the whole process to be studied and not only its start.' } },
    { title:{ es:'Leer una trayectoria', en:'Reading a trajectory' },
      stmt:{ es:'Un equipo dibuja la trayectoria de los derechos de las mujeres en el siglo XX y le sale una línea con subidas y también con caídas. Un compañero dice que la gráfica está mal hecha porque debería subir siempre. ¿Qué le responderías?',
             en:'A team draws the trajectory of the rights of women in the twentieth century and gets a line with rises and also with falls. A classmate says the graph is badly made because it should always rise. What would you answer him?' },
      options:{ es:['Que las caídas están documentadas: hubo países donde se suprimieron derechos que las mujeres ya ejercían.',
                    'Que la gráfica debe corregirse, porque ningún derecho reconocido se ha perdido nunca.',
                    'Que las caídas corresponden a años sin información y por eso deben borrarse.',
                    'Que una trayectoria histórica no puede representarse con una línea de ningún tipo.'],
                en:['That the falls are documented: there were countries where rights women already exercised were suppressed.',
                    'That the graph must be corrected, because no recognized right has ever been lost.',
                    'That the falls correspond to years without information and should therefore be erased.',
                    'That a historical trajectory cannot be represented with a line of any kind.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Busca en lo que revisaste un año en el que la línea baje y anota qué pasó exactamente en esa fecha.',
             en:'Look in what you reviewed for a year where the line falls and write down what exactly happened at that date.' },
      explanation:{ es:'España reconoció el voto en 1931, las mujeres lo ejercieron y en 1939 un nuevo régimen suprimió esos derechos durante casi cuarenta años. Una línea que solo sube contaría mal la historia y, además, haría creer que lo ganado no necesita defenderse.',
                    en:'Spain recognized the vote in 1931, women exercised it and in 1939 a new regime suppressed those rights for nearly forty years. A line that only rises would tell the history wrongly and, besides, would suggest that what is gained needs no defending.' } }
  ], rng), rng);

  /* ══════════ CONCEPTO 2 ══════════ */
  addSection(S('Concepto 2', 'Concept 2'),
    S('Las tres formas del retroceso', 'The three shapes of a setback'),
    S('<p>Los retrocesos no siempre se anuncian. A veces el derecho se cancela: una autoridad borra del texto legal lo que ya se reconocía, como ocurrió en España después de 1939, cuando las mujeres perdieron derechos civiles y políticos que llevaban años ejerciendo. Otras veces el derecho no se borra, se recorta: sigue reconocido, pero para menos personas o para menos situaciones.</p>' +
      '<p>Y hay una tercera forma, más difícil de ver: el derecho queda intacto en el papel y se vacía en la práctica. Al terminar la Segunda Guerra Mundial, millones de obreras que habían sostenido la industria fueron despedidas para devolver los puestos a los hombres que volvían, sin que ninguna ley se lo prohibiera. En Yucatán, las tres diputadas electas en 1923 dejaron sus cargos al año siguiente entre amenazas, aunque la ley del estado les permitía ocuparlos. Distinguir las tres formas importa porque cada una se combate de manera distinta.</p>',
      '<p>Setbacks do not always announce themselves. Sometimes the right is cancelled: an authority erases from the legal text what was already recognized, as happened in Spain after 1939, when women lost civil and political rights they had exercised for years. Other times the right is not erased but cut back: it remains recognized, yet for fewer people or fewer situations.</p>' +
      '<p>And there is a third shape, harder to see: the right stays intact on paper and is emptied out in practice. When the Second World War ended, millions of women workers who had sustained industry were dismissed to give the posts back to the men returning, without any law forbidding it to them. In Yucatan, the three women elected as deputies in 1923 left their seats the following year amid threats, although the law of the state allowed them to hold them. Telling the three shapes apart matters because each one is fought differently.</p>') +
    rcBuild(rng));
  rcRender();

  /* ── graded 3 ── */
  addProblem(pickV([
    { title:{ es:'Qué se perdió exactamente', en:'What exactly was lost' },
      stmt:{ es:'Al terminar la guerra, las fábricas despidieron a miles de obreras para devolver los puestos a los hombres que regresaban. Ninguna ley prohibía a esas mujeres trabajar. ¿Qué tipo de retroceso ocurrió?',
             en:'When the war ended, the factories dismissed thousands of women workers to give the posts back to the men returning. No law forbade those women to work. What kind of setback occurred?' },
      options:{ es:['El derecho siguió reconocido, pero desaparecieron las condiciones para ejercerlo.',
                    'El derecho fue borrado del texto legal por una autoridad de aquellos años.',
                    'El derecho quedó reducido a ciertas ramas de la industria por una nueva norma.',
                    'No hubo retroceso, porque el empleo de esas mujeres nunca estuvo reconocido.'],
                en:['The right remained recognized, but the conditions to exercise it disappeared.',
                    'The right was erased from the legal text by an authority of those years.',
                    'The right was reduced to certain branches of industry by a new rule.',
                    'There was no setback, because the employment of those women was never recognized.'] },
      correct:0,
      hint:{ es:'Primero revisa si alguien cambió el texto de alguna norma. Si el texto quedó igual, el obstáculo está en otra parte.',
             en:'First check whether anybody changed the text of any rule. If the text stayed the same, the obstacle is somewhere else.' },
      explanation:{ es:'El texto legal no se movió: lo que se retiró fue el empleo, y con él el salario propio y la independencia que traía. Se reconoce por ahí este tipo de retroceso, porque no deja rastro en las leyes y sí en las cifras de trabajo.',
                    en:'The legal text did not move: what was withdrawn was the job, and with it the own wage and the independence it brought. This kind of setback is recognized precisely there, because it leaves no trace in the laws and plenty in the employment figures.' } },
    { title:{ es:'Qué se perdió exactamente', en:'What exactly was lost' },
      stmt:{ es:'Una ley reconoce el voto de las mujeres solo a quienes saben leer y escribir, en un país donde la mayoría de ellas no pudo ir a la escuela. Un compañero afirma que se trata de un avance completo. ¿Qué le responderías?',
             en:'A law recognizes the vote of women only for those who can read and write, in a country where most of them could not go to school. A classmate claims this is a full advance. What would you answer him?' },
      options:{ es:['Que el derecho quedó reconocido con el alcance recortado, porque deja fuera a la mayoría de las mujeres.',
                    'Que no hubo ningún cambio, porque el requisito impide por completo que alguna vote.',
                    'Que fue un retroceso, porque antes de esa ley todas las mujeres del país votaban.',
                    'Que el alcance es completo, porque el requisito se aplica también a los hombres.'],
                en:['That the right was recognized with cut back reach, because it leaves most women out.',
                    'That there was no change at all, because the requirement completely prevents any of them from voting.',
                    'That it was a setback, because before that law all the women of the country voted.',
                    'That the reach is complete, because the requirement applies to men as well.'] },
      correct:0,
      hint:{ es:'Cuenta cuántas quedan dentro y cuántas fuera con ese requisito, y compáralo con la situación anterior.',
             en:'Count how many are inside and how many outside under that requirement, and compare it with the earlier situation.' },
      explanation:{ es:'Hay avance, porque antes no votaba ninguna, y hay recorte, porque el requisito escoge a un grupo pequeño. Un requisito que parece neutro produce un resultado desigual cuando la escuela no llegó por igual a todas, y por eso conviene medir a quiénes deja fuera.',
                    en:'There is an advance, because before none voted, and there is a cut, because the requirement selects a small group. A requirement that looks neutral produces an unequal result when school did not reach everyone alike, and that is why it is worth measuring whom it leaves out.' } }
  ], rng), rng);

  /* ── graded 4 ── */
  addProblem(pickV([
    { title:{ es:'Por qué se pierde lo ganado', en:'Why what is gained is lost' },
      stmt:{ es:'En varios países, derechos que las mujeres ya ejercían desaparecieron poco después de un cambio de régimen. ¿Qué explica mejor que eso pudiera ocurrir?',
             en:'In several countries, rights women were already exercising disappeared shortly after a change of regime. What best explains that this could happen?' },
      options:{ es:['El reconocimiento estaba en leyes que el nuevo gobierno pudo cambiar, y la oposición a esos derechos seguía activa.',
                    'Las mujeres de esos países habían dejado de interesarse por los derechos que ya tenían.',
                    'Los derechos habían sido concedidos por gobiernos extranjeros y caducaban solos con el tiempo.',
                    'Las leyes anteriores nunca llegaron a publicarse y por eso no tenían validez alguna.'],
                en:['The recognition sat in laws the new government could change, and the opposition to those rights was still active.',
                    'The women of those countries had stopped caring about the rights they already had.',
                    'The rights had been granted by foreign governments and expired on their own with time.',
                    'The earlier laws were never published and therefore had no validity at all.'] },
      correct:0,
      hint:{ es:'Piensa en quién tiene la facultad de escribir y borrar leyes, y en qué pasa con quienes se oponían cuando la reforma se aprobó.',
             en:'Think about who has the power to write and erase laws, and what happens to those who opposed when the reform was passed.' },
      explanation:{ es:'Una reforma aprobada no convence a quienes votaron en contra: los deja esperando. Cuando cambia quien gobierna, esa oposición encuentra la puerta abierta, y por eso los derechos se defienden con organización sostenida y no solo con el texto publicado.',
                    en:'A passed reform does not convince those who voted against: it leaves them waiting. When those who govern change, that opposition finds the door open, and that is why rights are defended with sustained organizing and not only with the published text.' } },
    { title:{ es:'Por qué se pierde lo ganado', en:'Why what is gained is lost' },
      stmt:{ es:'En Yucatán las mujeres votaron en las elecciones estatales de 1923 y tres resultaron electas al congreso local; al año siguiente, tras el asesinato del gobernador, dejaron sus cargos entre amenazas. ¿Qué muestra ese episodio?',
             en:'In Yucatan women voted in the state elections of 1923 and three were elected to the local congress; the following year, after the assassination of the governor, they left their seats amid threats. What does that episode show?' },
      options:{ es:['Que el reconocimiento dependía del apoyo de un gobierno y, sin él, el derecho quedó sin poder ejercerse.',
                    'Que la ley del estado nunca había reconocido a las mujeres el derecho de ocupar un cargo.',
                    'Que las electas renunciaron porque el congreso local dejó de sesionar en aquellos años.',
                    'Que el voto de las mujeres se reconoció primero en todo el país y después en el estado.'],
                en:['That the recognition depended on the support of one government and, without it, the right could no longer be exercised.',
                    'That the law of the state had never recognized the right of women to hold office.',
                    'That the elected women resigned because the local congress stopped meeting in those years.',
                    'That the vote of women was recognized first in the whole country and later in the state.'] },
      correct:0,
      hint:{ es:'Pregúntate si cambió el texto legal del estado o si cambió lo que costaba mantenerse en el cargo.',
             en:'Ask whether the legal text of the state changed or whether what it cost to stay in the seat changed.' },
      explanation:{ es:'La disposición estatal siguió existiendo, pero desapareció la protección que hacía posible ocupar la curul. Un derecho sostenido por la voluntad de un gobierno y no por una garantía firme es exactamente el que se vacía cuando ese gobierno cae.',
                    en:'The state provision went on existing, but the protection that made holding the seat possible disappeared. A right sustained by the will of one government and not by a firm guarantee is precisely the one that empties out when that government falls.' } }
  ], rng), rng);

  /* ══════════ CONCEPTO 3 ══════════ */
  addSection(S('Concepto 3', 'Concept 3'),
    S('El avance no llega igual a todas', 'The advance does not reach everyone alike'),
    S('<p>Un mismo año significa cosas distintas según dónde y quién. En México el voto llegó primero a las elecciones del municipio, en 1947, y solo seis años después a las del país entero. Y aun después de 1953, ejercerlo no costaba lo mismo para una mujer de la capital con estudios que para una mujer de una comunidad rural sin escuela cercana, sin acta que la registrara o sin nadie que la atendiera en su lengua.</p>' +
      '<p>Por eso el balance se hace por partes: por región, por edad, por origen y por situación económica. Y por eso mismo no basta con afirmar que algo mejoró o empeoró. Quien investiga necesita un dato que exista en los dos momentos y pueda contarse: cuántas aparecen en el padrón, cuántas terminan la secundaria, cuántas ocupan un cargo, cuánto se les paga por el mismo trabajo. Un discurso o una fotografía dicen mucho sobre su época, pero no miden un cambio.</p>' +
      '<div class="callout"><p><strong>Fíjate: </strong>la primera elección federal en la que las mexicanas aparecieron en el padrón fue la de 1955, dos años después de la reforma. Entre el texto y la práctica siempre hay una distancia que conviene medir.</p></div>',
      '<p>The same year means different things depending on where and who. In Mexico the vote arrived first in municipal elections, in 1947, and only six years later in those of the whole country. And even after 1953, exercising it did not cost the same for a woman of the capital with schooling as for a woman of a rural community with no school nearby, no record registering her and nobody to attend her in her language.</p>' +
      '<p>That is why the balance is made in parts: by region, by age, by origin and by economic situation. And that is also why it is not enough to state that something got better or worse. A researcher needs a datum that exists at both moments and can be counted: how many appear on the roll, how many finish secondary school, how many hold office, how much they are paid for the same work. A speech or a photograph say much about their period, but they do not measure a change.</p>' +
      '<div class="callout"><p><strong>Notice: </strong>the first federal election in which Mexican women appeared on the roll was that of 1955, two years after the reform. Between the text and the practice there is always a distance worth measuring.</p></div>') +
    evBuild(rng));
  evRender();

  /* ── graded 5 ── */
  addProblem(pickV([
    { title:{ es:'El mismo año, distintas vidas', en:'The same year, different lives' },
      stmt:{ es:'En 1955 votaron por primera vez las mexicanas en una elección federal. Una vecina afirma que desde ese día todas participaron en igualdad de condiciones. ¿Qué corrige mejor esa afirmación?',
             en:'In 1955 Mexican women voted for the first time in a federal election. A neighbour claims that from that day all of them took part on equal terms. What best corrects that statement?' },
      options:{ es:['Ejercer el voto dependía de estar registrada, poder trasladarse y contar con información, y eso no estaba repartido igual.',
                    'La reforma solo se aplicó en las ciudades más grandes y las demás quedaron excluidas por ley.',
                    'Las mujeres del campo tenían prohibido acudir a las casillas por una disposición de esos años.',
                    'La afirmación es exacta, porque una ley igual para todas produce siempre resultados iguales.'],
                en:['Casting the vote depended on being registered, being able to travel and having information, and that was not spread evenly.',
                    'The reform was applied only in the largest cities and the rest were excluded by law.',
                    'Women of the countryside were forbidden to go to the polls by a provision of those years.',
                    'The statement is accurate, because a law equal for all always produces equal results.'] },
      correct:0,
      hint:{ es:'Separa el texto de la ley de lo que hacía falta tener a la mano ese día para llegar hasta la casilla.',
             en:'Separate the text of the law from what you needed at hand that day to reach the polling place.' },
      explanation:{ es:'La ley fue la misma para todas, y aun así el resultado fue desigual: registro, distancia, tiempo libre e información no llegaban por igual a cada localidad. Distinguir lo reconocido de lo ejercido es lo que permite ver el avance real.',
                    en:'The law was the same for everyone, and even so the result was unequal: registration, distance, free time and information did not reach every locality alike. Telling the recognized apart from the exercised is what makes the real advance visible.' } },
    { title:{ es:'El mismo año, distintas vidas', en:'The same year, different lives' },
      stmt:{ es:'Entre 1947 y 1953 las mexicanas podían votar en las elecciones del municipio pero no en las del país. ¿Cómo conviene describir ese periodo?',
             en:'Between 1947 and 1953 Mexican women could vote in municipal elections but not in those of the country. How should that period be described?' },
      options:{ es:['Como un avance de alcance limitado, que las organizaciones usaron para exigir el reconocimiento completo.',
                    'Como un retroceso, porque el voto municipal sustituyó a un derecho nacional que ya existía.',
                    'Como un periodo sin cambios, porque el voto municipal no modificó nada de la vida pública.',
                    'Como el reconocimiento completo de la ciudadanía, que solo faltaba publicar en el diario oficial.'],
                en:['As an advance of limited reach, which the organizations used to demand full recognition.',
                    'As a setback, because the municipal vote replaced a national right that already existed.',
                    'As a period without changes, because the municipal vote altered nothing of public life.',
                    'As the full recognition of citizenship, which only needed publishing in the official gazette.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Coloca las dos fechas en una línea y anota en cada una qué elecciones quedaban dentro y cuáles fuera.',
             en:'Place the two dates on a line and note at each one which elections were inside and which outside.' },
      explanation:{ es:'El reconocimiento fue real y sirvió de precedente, pero cubría solo una parte de las elecciones. Ese alcance recortado se volvió el argumento de las campañas siguientes, y seis años después cayó.',
                    en:'The recognition was real and served as a precedent, but it covered only part of the elections. That cut back reach became the argument of the following campaigns, and six years later it fell.' } }
  ], rng), rng);

  /* ── graded 6 ── */
  addProblem(pickV([
    { title:{ es:'Con qué se comprueba', en:'What it is verified with' },
      stmt:{ es:'Un equipo escolar quiere saber si entre 1930 y 1970 avanzó el acceso de las mujeres a la universidad en su estado. ¿Qué información le permite responder con solidez?',
             en:'A school team wants to know whether between 1930 and 1970 the access of women to university advanced in its state. What information allows it to answer solidly?' },
      options:{ es:['El número de mujeres inscritas y tituladas en cada uno de esos dos años, tomado de los registros universitarios.',
                    'Un discurso del rector de 1950 que celebra la presencia de mujeres en las aulas.',
                    'Una fotografía de un grupo de estudiantes tomada a mediados del periodo.',
                    'La opinión actual de los estudiantes sobre cómo era la universidad en aquella época.'],
                en:['The number of women enrolled and graduated in each of those two years, taken from the university records.',
                    'A speech by the rector in 1950 celebrating the presence of women in the classrooms.',
                    'A photograph of a group of students taken in the middle of the period.',
                    'The current opinion of students about what the university was like in that period.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Pregúntate cuál de esas informaciones puede contarse y existe igual en las dos fechas del periodo.',
             en:'Ask which of those pieces of information can be counted and exists alike at both dates of the period.' },
      explanation:{ es:'Comprobar un cambio exige el mismo dato en los dos extremos del periodo. Discursos, fotografías y opiniones aportan contexto y sirven para otras preguntas, pero por sí solos no permiten decir si la cifra subió o bajó.',
                    en:'Verifying a change requires the same datum at both ends of the period. Speeches, photographs and opinions bring context and serve other questions, but on their own they cannot say whether the figure rose or fell.' } },
    { title:{ es:'Con qué se comprueba', en:'What it is verified with' },
      stmt:{ es:'Dos fuentes del mismo año: un informe de gobierno celebra que las mujeres ya ocupan cargos públicos, y la lista de funcionarios de ese año incluye a dos mujeres entre ochenta nombres. ¿Cómo conviene trabajar con ese par?',
             en:'Two sources from the same year: a government report celebrates that women already hold public office, and the list of officials of that year includes two women among eighty names.  How should that pair be handled?' },
      options:{ es:['Comparar las dos y explicar la distancia entre lo que el informe proclama y lo que la lista registra.',
                    'Quedarse con el informe, porque proviene de la autoridad encargada de esos nombramientos.',
                    'Descartar las dos fuentes, porque se contradicen y ninguna resulta confiable.',
                    'Sumar los datos de ambas para obtener el total de mujeres en cargos de ese año.'],
                en:['Compare the two and explain the distance between what the report proclaims and what the list records.',
                    'Keep the report, because it comes from the authority in charge of those appointments.',
                    'Discard both sources, because they contradict each other and neither is reliable.',
                    'Add the data of both to obtain the total of women in office that year.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Anota qué tipo de cosa registra cada fuente: una proclama un resultado y la otra puede contarse nombre por nombre.',
             en:'Note what kind of thing each source records: one proclaims a result and the other can be counted name by name.' },
      explanation:{ es:'La contradicción es el dato más útil de las dos: la lista permite contar y el informe muestra qué quería proyectarse. Comparar ambas es lo que revela la diferencia entre lo dicho y lo ocurrido, y esa diferencia también forma parte del balance.',
                    en:'The contradiction is the most useful finding of the two: the list can be counted and the report shows what was meant to be projected. Comparing them is what reveals the difference between what was said and what happened, and that difference is part of the balance too.' } }
  ], rng), rng);

  /* ══════════ CONCEPTO 4 ══════════ */
  addSection(S('Concepto 4', 'Concept 4'),
    S('Sostener lo ganado', 'Holding on to what is gained'),
    S('<p>Si un derecho puede perderse, la pregunta siguiente es cómo se sostiene. La historia del último siglo deja tres respuestas. La primera es la organización que no se disuelve al ganar: las asociaciones que consiguieron el voto siguieron trabajando después de 1953, porque el reconocimiento no llenó por sí solo los cargos ni las aulas. La segunda es escribir la garantía donde sea más difícil borrarla: en 1974 se reformó la Constitución mexicana para establecer que la mujer y el varón son iguales ante la ley.</p>' +
      '<p>La tercera es medir y volver a medir. En 1975 se celebró en la Ciudad de México la primera conferencia mundial sobre la situación de las mujeres, y desde entonces los países comparan indicadores año con año: escolaridad, empleo, salarios, cargos de representación. Gracias a esas mediciones se supo que, con el voto reconocido desde 1953, la mayoría de los cargos seguía en manos de hombres décadas después; de ahí salieron las reformas que en 2019 establecieron que la mitad de los cargos de los tres poderes correspondan a mujeres. Un avance sostenido no es el que se anuncia, sino el que se puede comprobar.</p>',
      '<p>If a right can be lost, the next question is how it is held. The history of the last century leaves three answers. The first is organizing that does not dissolve upon winning: the associations that obtained the vote kept working after 1953, because recognition alone filled neither the offices nor the classrooms. The second is writing the guarantee where it is hardest to erase: in 1974 the Mexican Constitution was reformed to establish that women and men are equal before the law.</p>' +
      '<p>The third is measuring and measuring again. In 1975 Mexico City hosted the first world conference on the situation of women, and since then countries compare indicators year after year: schooling, employment, wages, seats of representation. Thanks to those measurements it became known that, with the vote recognized since 1953, most offices were still held by men decades later; from there came the reforms that in 2019 established that half of the posts of the three branches of government correspond to women. A sustained advance is not the one that is announced, but the one that can be verified.</p>'));

  /* ── graded 7 ── */
  addProblem(pickV([
    { title:{ es:'Después de ganar', en:'After winning' },
      stmt:{ es:'Las organizaciones de mujeres que consiguieron el reconocimiento del voto en 1953 siguieron reuniéndose y presentando demandas durante las décadas siguientes. ¿Qué explica mejor esa continuidad?',
             en:'The organizations of women that obtained the recognition of the vote in 1953 kept meeting and presenting demands during the following decades. What best explains that continuity?' },
      options:{ es:['Un derecho reconocido puede quedar sin ejercerse o ser recortado, y sostenerlo exige vigilancia y demandas nuevas.',
                    'La reforma de esos años fue anulada poco después y hubo que solicitarla otra vez desde el principio.',
                    'Las organizaciones perdieron su objetivo original y continuaron reuniéndose sin ninguna demanda concreta.',
                    'El reconocimiento obtenido tenía una vigencia de pocos años y debía renovarse periódicamente.'],
                en:['A recognized right can go unexercised or be cut back, and holding it demands vigilance and new demands.',
                    'The reform of those years was annulled soon after and had to be requested again from scratch.',
                    'The organizations lost their original aim and went on meeting without any concrete demand.',
                    'The recognition obtained was valid for a few years only and had to be renewed periodically.'] },
      correct:0,
      hint:{ es:'Recuerda las tres formas del retroceso y pregúntate cuáles siguen siendo posibles aun con la reforma aprobada.',
             en:'Recall the three shapes of a setback and ask which remain possible even with the reform passed.' },
      explanation:{ es:'Con el voto reconocido seguían abiertas dos vías de retroceso: recortar su alcance y dejarlo sin condiciones para ejercerse. La organización permanente es lo que convierte una reforma en un cambio duradero.',
                    en:'With the vote recognized, two routes of setback remained open: cutting its reach and leaving it without the conditions to be exercised. Permanent organizing is what turns a reform into a lasting change.' } },
    { title:{ es:'Después de ganar', en:'After winning' },
      stmt:{ es:'En 2019 se reformó la Constitución mexicana para que la mitad de los cargos de los tres poderes correspondan a mujeres, aunque el derecho a ser electa estaba reconocido desde 1953. ¿Qué problema buscaba resolver esa reforma?',
             en:'In 2019 the Mexican Constitution was reformed so that half of the posts of the three branches of government correspond to women, although the right to be elected had been recognized since 1953. What problem did that reform seek to solve?' },
      options:{ es:['Que el derecho estaba reconocido desde hacía décadas y aun así la mayoría de los cargos seguía en manos de hombres.',
                    'Que la reforma de 1953 había sido derogada y las mujeres habían dejado de poder ser electas.',
                    'Que hasta esa fecha ninguna mujer había ocupado un cargo de elección en el país.',
                    'Que las mujeres electas antes de esa reforma no podían tomar posesión de su cargo.'],
                en:['That the right had been recognized for decades and even so most offices were still held by men.',
                    'That the reform of 1953 had been repealed and women could no longer be elected.',
                    'That until that date no woman had held an elected office in the country.',
                    'That women elected before that reform could not take up their seat.'] },
      correct:0,
      hint:{ es:'Compara lo que decía la ley desde 1953 con lo que mostraban las cifras de cargos ocupados décadas después.',
             en:'Compare what the law said from 1953 on with what the figures of held offices showed decades later.' },
      explanation:{ es:'La medición reveló la distancia entre el derecho reconocido y su ejercicio: las candidaturas, los recursos de campaña y las estructuras partidistas seguían repartidos de manera desigual. La reforma actúa sobre esa distancia, no sobre el reconocimiento, que ya existía.',
                    en:'The measurement revealed the distance between the recognized right and its exercise: candidacies, campaign resources and party structures were still unevenly distributed. The reform acts on that distance, not on the recognition, which already existed.' } }
  ], rng), rng);

  /* ── graded 8 ── */
  addProblem(pickV([
    { title:{ es:'Un balance con datos', en:'A balance with data' },
      stmt:{ es:'Un ayuntamiento quiere saber si en su municipio hubo avance o retroceso para las mujeres en los últimos veinte años. ¿Qué conjunto de información conviene reunir?',
             en:'A town council wants to know whether in its municipality there was advance or setback for women over the last twenty years. What set of information should be gathered?' },
      options:{ es:['Porcentaje de niñas que terminan la secundaria, mujeres en cargos del ayuntamiento y salarios por el mismo trabajo, medidos al inicio y al final del periodo.',
                    'Los discursos pronunciados por las autoridades municipales durante cada uno de esos veinte años.',
                    'Una encuesta aplicada hoy sobre lo que la gente cree que ocurrió durante ese periodo.',
                    'El texto de las leyes nacionales vigentes al terminar el periodo estudiado.'],
                en:['Share of girls finishing secondary school, women in council posts and wages for the same work, measured at the start and at the end of the period.',
                    'The speeches delivered by the municipal authorities during each of those twenty years.',
                    'A survey applied today about what people believe happened during that period.',
                    'The text of the national laws in force at the end of the period studied.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Revisa cada opción con dos exigencias: que el dato pueda contarse y que exista en los dos extremos del periodo.',
             en:'Check each option against two demands: that the datum can be counted and that it exists at both ends of the period.' },
      explanation:{ es:'Tres indicadores medidos en las dos fechas permiten un balance por partes: puede haber avance en la escuela y retroceso en los salarios al mismo tiempo. Los discursos y las creencias actuales no se pueden comparar entre extremos, y el texto legal solo cuenta la mitad de la historia.',
                    en:'Three indicators measured at both dates allow a balance in parts: there may be advance in schooling and setback in wages at the same time. Speeches and present beliefs cannot be compared between ends, and the legal text tells only half the story.' } },
    { title:{ es:'Un balance con datos', en:'A balance with data' },
      stmt:{ es:'Un equipo mide en su municipio dos indicadores entre 2005 y 2025: el porcentaje de mujeres que terminan la secundaria subió, y la diferencia de salario por el mismo trabajo se mantuvo igual. ¿Qué conclusión sostienen esos datos?',
             en:'A team measures two indicators in its municipality between 2005 and 2025: the share of women finishing secondary school rose, and the wage gap for the same work stayed the same. What conclusion do those data support?' },
      options:{ es:['Que hubo avance en la escolaridad y ningún cambio en los salarios, así que el balance debe darse por partes.',
                    'Que el municipio avanzó en todos los aspectos, porque uno de los dos indicadores mejoró.',
                    'Que el municipio retrocedió, porque uno de los dos indicadores no mejoró en veinte años.',
                    'Que los dos indicadores se anulan entre sí y por eso no permiten sacar conclusión alguna.'],
                en:['That there was advance in schooling and no change in wages, so the balance must be given in parts.',
                    'That the municipality advanced in every aspect, because one of the two indicators improved.',
                    'That the municipality fell back, because one of the two indicators did not improve in twenty years.',
                    'That the two indicators cancel each other out and therefore allow no conclusion at all.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Escribe cada indicador con su resultado y resiste la tentación de resumir los dos en una sola palabra.',
             en:'Write each indicator with its result and resist the temptation to sum both up in a single word.' },
      explanation:{ es:'Cada indicador responde por su propio terreno y no se promedian entre sí. Un balance honesto dice dónde hubo avance, dónde no lo hubo y qué quedó sin medir; resumirlo en una palabra escondería justo lo que falta por hacer.',
                    en:'Each indicator answers for its own ground and they are not averaged together. An honest balance says where there was advance, where there was none and what went unmeasured; summing it up in one word would hide exactly what remains to be done.' } }
  ], rng), rng);

  /* ── el cuaderno del balance ── */
  buildReflect(rng);

  /* ══════════ CIERRE ══════════ */
  /* ── graded 9 ── */
  addProblem(pickV([
    { title:{ es:'Corregir una afirmación', en:'Correcting a statement' },
      stmt:{ es:'Un compañero escribe en su cuaderno: los derechos de las mujeres han avanzado siempre, año con año y sin interrupciones. ¿Qué hecho de los que revisaste lo desmiente mejor?',
             en:'A classmate writes in his notebook: the rights of women have always advanced, year after year and without interruption. Which of the facts you reviewed best refutes it?' },
      options:{ es:['Que hubo países donde las mujeres perdieron derechos civiles y políticos que ya ejercían cuando cambió el régimen.',
                    'Que en algunos países el reconocimiento del voto llegó más tarde que en otros.',
                    'Que las primeras demandas escritas aparecieron antes que las primeras reformas legales.',
                    'Que las mujeres tuvieron que organizarse durante décadas para conseguir cada reforma.'],
                en:['That there were countries where women lost civil and political rights they already exercised when the regime changed.',
                    'That in some countries the recognition of the vote arrived later than in others.',
                    'That the first written demands appeared before the first legal reforms.',
                    'That women had to organize for decades to obtain each reform.'] },
      correct:0,
      hint:{ es:'La afirmación dice sin interrupciones. Busca un caso en el que la línea baje, no uno en el que suba despacio.',
             en:'The statement says without interruption. Look for a case where the line falls, not one where it rises slowly.' },
      explanation:{ es:'Las otras tres opciones describen lentitud o desigualdad, y con eso la afirmación podría sostenerse. Solo la pérdida de derechos ya ejercidos, como ocurrió en Francia después de 1793 o en España después de 1939, rompe la idea de un avance continuo.',
                    en:'The other three options describe slowness or inequality, and with those the statement could still hold. Only the loss of rights already exercised, as happened in France after 1793 or in Spain after 1939, breaks the idea of a continuous advance.' } },
    { title:{ es:'Corregir una afirmación', en:'Correcting a statement' },
      stmt:{ es:'Otra afirmación para poner a prueba: como hoy la ley reconoce la igualdad, estudiar los retrocesos del pasado ya no sirve de nada. ¿Qué respuesta la corrige mejor?',
             en:'Another statement to test: since the law today recognizes equality, studying the setbacks of the past is no longer of any use. Which answer best corrects it?' },
      options:{ es:['Conocer cómo se perdieron derechos permite reconocer a tiempo las señales de que uno está dejando de ejercerse.',
                    'El estudio del pasado sirve únicamente para conocer las fechas en que se aprobó cada reforma.',
                    'Los retrocesos del pasado ocurrieron por causas que hoy resultan imposibles de identificar.',
                    'La ley actual reconoce la igualdad y por eso ya no existe distancia entre el texto y la práctica.'],
                en:['Knowing how rights were lost makes it possible to recognize in time the signs that one is ceasing to be exercised.',
                    'The study of the past serves only to learn the dates when each reform was passed.',
                    'The setbacks of the past happened for causes that today are impossible to identify.',
                    'Current law recognizes equality and therefore there is no longer a distance between text and practice.'] },
      correct:0,
      hint:{ es:'Piensa en la tercera forma del retroceso: la que no cambia ninguna ley y por eso pasa desapercibida.',
             en:'Think about the third shape of a setback: the one that changes no law and therefore goes unnoticed.' },
      explanation:{ es:'Los retrocesos más frecuentes hoy no borran textos: recortan alcances o retiran las condiciones para ejercer un derecho. Reconocer esos patrones en el pasado es lo que permite detectarlos cuando vuelven a aparecer.',
                    en:'The most frequent setbacks today do not erase texts: they cut reach or withdraw the conditions to exercise a right. Recognizing those patterns in the past is what makes it possible to detect them when they appear again.' } }
  ], rng), rng);

  /* ── graded 10 ── */
  addProblem(pickV([
    { title:{ es:'Lo que enseña la secuencia', en:'What the sequence teaches' },
      stmt:{ es:'Tres hechos seguidos: en 1931 España reconoce en su Constitución el voto de las mujeres, en 1933 ellas votan en unas elecciones generales y en 1939 un nuevo régimen suprime esos derechos durante casi cuarenta años. ¿Qué enseña esta secuencia sobre la relación entre la ley y los derechos?',
             en:'Three consecutive facts: in 1931 Spain recognizes the vote of women in its Constitution, in 1933 they vote in a general election and in 1939 a new regime suppresses those rights for nearly forty years. What does this sequence teach about the relation between law and rights?' },
      options:{ es:['Que un derecho escrito no queda asegurado para siempre: puede retirarse si cambia quien gobierna y no hay fuerza que lo sostenga.',
                    'Que escribir un derecho en la Constitución no sirve de nada, porque siempre termina retirándose.',
                    'Que los derechos solo se pierden cuando quienes los obtuvieron dejan de estar interesados en ellos.',
                    'Que un derecho ejercido en unas elecciones queda garantizado para todas las elecciones siguientes.'],
                en:['That a written right is not secured forever: it can be withdrawn if those who govern change and no force sustains it.',
                    'That writing a right into the Constitution is useless, because it always ends up withdrawn.',
                    'That rights are lost only when those who obtained them stop being interested in them.',
                    'That a right exercised in one election is guaranteed for every election that follows.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Ordena los tres años y anota junto a cada uno cuántas mujeres podían votar; después fíjate en qué cambió entre el segundo y el tercero.',
             en:'Order the three years and note beside each one how many women could vote; then look at what changed between the second and the third.' },
      explanation:{ es:'Escribir el derecho fue decisivo, porque permitió ejercerlo en 1933, y aun así no bastó cuando cambió el régimen. Las dos conclusiones van juntas: la ley importa y no se defiende sola, por eso la organización y la vigilancia forman parte del mismo proceso.',
                    en:'Writing the right down was decisive, because it made 1933 possible, and even so it was not enough when the regime changed. The two conclusions go together: the law matters and does not defend itself, which is why organizing and vigilance are part of the same process.' } },
    { title:{ es:'Lo que enseña la secuencia', en:'What the sequence teaches' },
      stmt:{ es:'Quieres investigar si en tu localidad hubo avance o retroceso en el trabajo de las mujeres entre 1990 y hoy. ¿Qué plan reúne mejor lo que necesitas?',
             en:'You want to research whether in your town there was advance or setback in the work of women between 1990 and today. Which plan best gathers what you need?' },
      options:{ es:['Comparar las cifras de empleo y salario de las dos fechas y contrastarlas con entrevistas a mujeres que trabajaron en cada momento.',
                    'Reunir los discursos de las autoridades locales pronunciados a lo largo de todo el periodo.',
                    'Preguntar a tu grupo qué imagina que ocurría en la localidad al comenzar el periodo.',
                    'Revisar únicamente las leyes laborales vigentes en el país durante el año más reciente.'],
                en:['Compare the employment and wage figures of the two dates and contrast them with interviews of women who worked at each moment.',
                    'Gather the speeches of the local authorities delivered throughout the whole period.',
                    'Ask your class what they imagine was happening in the town at the start of the period.',
                    'Review only the labour laws in force in the country during the most recent year.'] },
      correct:0,
      showWork:true,
      hint:{ es:'Tu plan necesita dos cosas: un dato comparable en las dos fechas y una voz que explique lo que las cifras no dicen.',
             en:'Your plan needs two things: a datum comparable at both dates and a voice explaining what the figures do not say.' },
      explanation:{ es:'Las cifras permiten decir si subió o bajó, y las entrevistas explican por qué y a costa de qué. Los discursos y las leyes describen intenciones y marcos, y las suposiciones del grupo no son fuente; ninguno de los tres permite comparar los dos extremos del periodo.',
                    en:'The figures make it possible to say whether it rose or fell, and the interviews explain why and at what cost. Speeches and laws describe intentions and frameworks, and the guesses of a class are not a source; none of the three allows the two ends of the period to be compared.' } }
  ], rng), rng);
}
</script>

<!-- LIAXA ANALYTICS -->
<script>
(function(){
  var GAS_URL   = 'https://script.google.com/macros/s/AKfycbyjbSUYDHwe-0Hl5GnZC6mP3_iKPYnLqeUgbuhxARkW2-keCAAV6sSg0wYWJnJBhY7lUQ/exec';
  var school    = (typeof SCHOOL!=='undefined'&&SCHOOL.schoolSlug) ? SCHOOL.schoolSlug : 'unbranded';
  var moduleId  = (typeof SCHOOL!=='undefined'&&SCHOOL.filePrefix)  ? SCHOOL.filePrefix  : 'unknown';
  var sessionId = school+'__'+moduleId+'__'+Math.random().toString(36).slice(2,10);
  var openedAt  = Date.now();
  function send(ev){
    var body = JSON.stringify({school:school,event:ev,module_id:moduleId,
      session_id:sessionId,elapsed_sec:Math.round((Date.now()-openedAt)/1000)});
    if(ev==='module_close'&&navigator.sendBeacon){
      navigator.sendBeacon(GAS_URL,new Blob([body],{type:'application/json'}));
    }else{
      fetch(GAS_URL,{method:'POST',body:body,headers:{'Content-Type':'application/json'},keepalive:true}).catch(function(){});
    }
  }
  send('module_open');
  var hb=null;
  function startHB(){if(hb)return;hb=setInterval(function(){if(!document.hidden)send('heartbeat');},60000);}
  function stopHB(){clearInterval(hb);hb=null;}
  startHB();
  document.addEventListener('visibilitychange',function(){document.hidden?stopHB():startHB();});
  window.addEventListener('pagehide',function(){stopHB();send('module_close');});
  window.addEventListener('beforeunload',function(){send('module_close');});
})();
</script>
</body>
</html>
