<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Calor como Forma de Energía</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS — INJECTION BLOCK ──────────────────────────────────────
   To brand this guide for an institution, change ONLY the 5 lines below.
   Derive from 2 institution colors:
     PRIMARY  = main dark color  (nav, buttons, progress bar, PDF band)
     ACCENT   = highlight color  (tags, hints, PDF stripe, wcard top line)
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --green:      #1a4a8a;   /* PRIMARY      */
  --green-dark: #0f2d5a;   /* PRIMARY dark (darken ~15%)  */
  --green-bg:   #e8edf5;   /* PRIMARY tint (lighten ~85%) */
  --gold:       #c9a84c;   /* ACCENT       */
  --gold-bg:    #faf3e0;   /* ACCENT tint  (lighten ~85%) */
  --bg:         #f8f6f1;
  --surface:    #ffffff;
  --surface2:   #f0ede6;
  --border:     #ddd8cc;
  --text:       #1a1a16;
  --text2:      #4a4640;
  --text3:      #7a7468;
  --ok:         #2d6a4f;
  --ok-bg:      rgba(45,106,79,.10);
  --bad:        #8b2500;
  --bad-bg:     rgba(139,37,0,.08);
  --shadow:     0 4px 20px rgba(0,0,0,.09);
}
[data-theme="dark"] {
  --bg:         #18181a;
  --surface:    #242420;
  --surface2:   #2e2e28;
  --border:     #3a3830;
  --text:       #e8e4da;
  --text2:      #b0aa9e;
  --text3:      #7a7468;
  --shadow:     0 4px 20px rgba(0,0,0,.35);
  --green:      #4a7abf;
  --green-dark: #7aaae0;
  --green-bg:   #0e1e38;
  --gold:       #d4b86a;
  --gold-bg:    #241e0e;
  --ok:         #4a9a6f;
  --ok-bg:      rgba(74,154,111,.12);
  --bad:        #c05030;
  --bad-bg:     rgba(192,80,48,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }

/* ── WELCOME ── */
#welcomeScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
.wcard { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:2.4rem 2rem; width:100%; max-width:460px; text-align:center; border-top:4px solid var(--gold); }
.wlogos { display:flex; justify-content:center; align-items:center; gap:1.4rem; margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.wlogos img { height:100px; width:auto; object-fit:contain; }
.wlogsep { width:1px; height:40px; background:var(--border); flex-shrink:0; }
.wtitle { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.25rem; }
.wcourse { font-size:.78rem; color:var(--text3); letter-spacing:.07em; text-transform:uppercase; margin-bottom:1.6rem; }
.flabel { display:block; font-size:.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; text-align:left; }
.finput { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); font-size:.95rem; font-family:inherit; margin-bottom:.9rem; transition:border-color .18s; }
.finput:focus { outline:none; border-color:var(--green); }
.sbtn { width:100%; padding:.85rem; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:background .18s; }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── RESTORE BAR ── */
#restoreBar { display:none; background:var(--gold-bg); border:1.5px solid var(--gold); border-radius:10px; padding:.85rem 1.1rem; margin-top:.9rem; font-size:.88rem; color:var(--text); }
#restoreBar strong { color:var(--gold); }
.rbar-btns { display:flex; gap:.6rem; margin-top:.6rem; }
.rbtn { padding:.45rem 1rem; border-radius:8px; border:none; font-size:.82rem; font-weight:600; cursor:pointer; }
.rbtn-yes { background:var(--green); color:#fff; }
.rbtn-yes:hover { background:var(--green-dark); }
.rbtn-no  { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.sbtn:hover { background:var(--green-dark); }
.serr { min-height:1.2rem; font-size:.82rem; color:var(--bad); margin-top:.4rem; }
.wfoot { margin-top:1rem; font-size:.75rem; color:var(--text3); }

/* ── LESSON ── */
#lessonScreen { display:none; }
.stickybar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:.55rem 1.2rem; display:flex; align-items:center; gap:.7rem; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.hlogos { display:flex; gap:.5rem; align-items:center; }
.hlogos img { height:26px; width:auto; }
.hsep { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.htitle { font-family:'Crimson Pro',serif; font-size:1rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.halexis { flex:1; display:flex; justify-content:center; align-items:center; }
.hchip { font-size:.7rem; background:var(--green-bg); color:var(--green-dark); padding:.2rem .65rem; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.tbtn { background:none; border:1px solid var(--border); border-radius:7px; padding:.28rem .55rem; cursor:pointer; font-size:.82rem; color:var(--text2); flex-shrink:0; }
.progbar { height:3px; background:var(--border); position:sticky; top:47px; z-index:99; }
.progfill { height:100%; background:var(--green); width:0%; transition:width .4s; }

/* ── CONTENT ── */
.lbody { max-width:760px; margin:0 auto; padding:2rem 1.2rem 4rem; }
.section { opacity:0; transform:translateY(16px); transition:opacity .48s, transform .48s; margin-bottom:2.8rem; }
.section.vis { opacity:1; transform:none; }
.stag { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:.45rem; }
.section h2 { font-family:'Crimson Pro',serif; font-size:1.65rem; font-weight:700; margin-bottom:.7rem; }
.section p { color:var(--text2); margin-bottom:.8rem; }
.callout { background:var(--green-bg); border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:1rem 1.2rem; margin:1rem 0; }
.callout strong { color:var(--green-dark); }
.callout p { margin-bottom:0; }

/* ── RULE CARDS ── */
.rules-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.75rem; margin:1.1rem 0; }
.rcard { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem; border-top:3px solid var(--green); }
.rname { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.35rem; }
.rform { font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--green-dark); font-weight:500; margin-bottom:.3rem; }
.rnote { font-size:.76rem; color:var(--text3); }

/* ── GRAPH CARD ── */
.gcrd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.3rem; margin:.9rem 0; }
.cgrid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.9rem; }
@media(max-width:500px){ .cgrid { grid-template-columns:1fr; } }
.cg label { display:block; font-size:.73rem; color:var(--text3); margin-bottom:.25rem; }
.cg input[type=range] { width:100%; accent-color:var(--green); }
.cval { font-weight:600; color:var(--green); }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.9rem; }
.metric { background:var(--surface2); border-radius:8px; padding:.65rem; text-align:center; }
.mlbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:.15rem; }
.mnum { font-family:'IBM Plex Mono',monospace; font-size:.95rem; font-weight:600; }
.mnum.cs { color:var(--green); }
.mnum.ps { color:var(--gold); }
.mnum.ts { color:var(--text); }

/* ── MODE TABS (graph toggles) ── */
.mtabs { display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap; }
.mtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .7rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.mtab.active, .mtab:hover { background:var(--green); color:#fff; border-color:var(--green); }

/* ── PROBLEM CARDS ── */
.pcrd { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; margin-bottom:1.3rem; overflow:hidden; transition:border-color .25s; }
.pcrd.ok  { border-color:var(--ok); }
.pcrd.bad { border-color:var(--bad); }
.phdr { display:flex; align-items:center; gap:.75rem; padding:.8rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
.pnum { background:var(--green); color:#fff; width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.76rem; font-weight:700; flex-shrink:0; }
.ptitle { font-weight:600; font-size:.88rem; }
.pbody { padding:1rem; }
.pstmt { background:var(--surface2); border-radius:8px; padding:.85rem .95rem; margin-bottom:.9rem; font-size:.88rem; }
.pfn { display:block; font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--green-dark); margin-top:.45rem; font-weight:500; }

/* ── WORK AREA TABS ── */
.wtabs { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
.wtab { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.26rem .68rem; font-size:.78rem; cursor:pointer; color:var(--text2); transition:all .14s; }
.wtab.active, .wtab:hover { background:var(--green); color:#fff; border-color:var(--green); }
.wpanel { display:none; }
.wpanel.active { display:block; }

/* ── CANVAS ── */
.cvwrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }

/* ── MATH FRACTIONS ── */
.mf-outer { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .15em; line-height:1.1; }
.mf-num   { border-bottom:1.5px solid var(--text); padding:0 .2em .1em; font-size:.92em; text-align:center; }
.mf-den   { padding:.1em .2em 0; font-size:.92em; text-align:center; }
.dcanvas { display:block; touch-action:none; cursor:crosshair; width:100%; height:190px; }
.ctoolbar { display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; background:var(--surface2); border-top:1px solid var(--border); flex-wrap:wrap; }
.tbtn2 { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--text2); }
.tbtn2.on { background:var(--green); color:#fff; border-color:var(--green); }
.cdot { width:17px; height:17px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
.cdot.sel { border-color:var(--gold); }
.clrbtn { background:none; border:1px solid var(--border); border-radius:5px; padding:.22rem .45rem; font-size:.72rem; cursor:pointer; color:var(--bad); margin-left:auto; }

/* ── TEXTAREA ── */
.wtextarea { width:100%; min-height:120px; padding:.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.8rem; resize:vertical; }
.wtextarea:focus { outline:none; border-color:var(--green); }

/* ── PHOTO ── */
.pzone { border:2px dashed var(--border); border-radius:8px; padding:1.4rem; text-align:center; cursor:pointer; position:relative; transition:border-color .18s; }
.pzone:hover { border-color:var(--green); }
.pzone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.pzicon { font-size:1.7rem; margin-bottom:.35rem; }
.pztxt { font-size:.8rem; color:var(--text3); }
.ppreview { display:none; width:100%; border-radius:8px; margin-top:.5rem; max-height:280px; object-fit:contain; }

/* ── HINT ── */
.hintbtn { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; padding:.28rem .65rem; font-size:.78rem; cursor:pointer; margin-bottom:.45rem; }
.hintbox { display:none; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:.65rem .85rem; font-size:.83rem; color:var(--text2); }
.hintbox.show { display:block; }

/* ── MC ── */
.mcopt.pending { border-color:var(--gold); background:var(--surface); }
.mcopts { display:flex; flex-direction:column; gap:.45rem; margin-bottom:.6rem; }
.mcopt { display:flex; align-items:center; gap:.65rem; padding:.65rem .85rem; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-size:.86rem; transition:all .13s; user-select:none; }
.mcopt:hover:not(.dis) { border-color:var(--green); background:var(--green-bg); }
.mcopt.dis   { cursor:default; pointer-events:none; }
.mcopt.sc    { border-color:var(--ok);  background:var(--ok-bg);  color:var(--ok); }
.mcopt.sw    { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
.mcopt.rc    { border-color:var(--ok);  background:var(--ok-bg); }
.mcfb { display:none; padding:.65rem .85rem; border-radius:8px; font-size:.83rem; margin-top:.25rem; }
.mcfb.show  { display:block; }
.mcfb.fbok  { background:var(--ok-bg);  color:var(--ok); }
.mcfb.fbbad { background:var(--bad-bg); color:var(--bad); }

/* ── RESULT ── */
.rpanel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.8rem; text-align:center; }
.dlbtn { background:var(--green); color:#fff; border:none; border-radius:10px; padding:.8rem 1.8rem; font-size:.95rem; font-weight:600; cursor:pointer; transition:background .18s; }
.dlbtn:hover { background:var(--green-dark); }
.dlbtn:disabled { opacity:.6; cursor:wait; }
/* ── MOBILE ── */
@media (max-width: 600px) {
  .wcard { padding: 1.6rem 1.1rem; border-radius: 12px; }
  .wlogos img { height: 76px; }
  .wtitle { font-size: 1.35rem; }
  .htitle { display: none; }
  .stickybar { padding: .5rem .6rem; gap: .4rem; }
  .tbtn, .lang-btn { padding: .24rem .45rem; font-size: .72rem; }
  .hlogos img { height: 20px; }
  .hchip { font-size: .63rem; padding: .15rem .45rem; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .lbody { padding: 1.2rem .7rem 3rem; }
  .section h2 { font-size: 1.3rem; }
  .rules-grid { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .pbody { padding: .75rem; }
  .pstmt { font-size: .84rem; }
  .mcopt { font-size: .83rem; padding: .58rem .7rem; }
  .dcanvas { height: 220px; }
  .ctoolbar { gap: .25rem; }
  .callout { padding: .8rem .9rem; }
  .rcard { overflow-x: auto; }
}

.lang-toggle { display:flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.lang-btn { padding:.28rem .7rem; font-size:.72rem; font-weight:600; letter-spacing:.06em; cursor:pointer; border:none; background:none; color:var(--text3); font-family:inherit; transition:all .15s; }
.lang-btn.active { background:var(--green); color:#fff; }
[data-theme="dark"] .lang-btn.active { background:var(--green-dark); }
.sc-line { font-size:1.6rem; font-weight:700; color:var(--green-dark); margin-bottom:.3rem; }
</style>
<body>

<!-- WELCOME -->
<div id="welcomeScreen">
  <div class="wcard">
    <div class="wlogos" id="wlogos">
      <!-- LOGO: replace src with base64 from LOGOS_MASTER.HTML -->
      <img id="logo-left" src="" alt="Institution" style="display:none">
    </div>
    <div class="wtitle" id="wtitle-el">El Calor como Forma de Energía</div>
    <div class="wcourse" id="wcourse-el">Física · 2° de Secundaria</div>
    <label class="flabel" id="lbl-name-el" for="sName">Nombre completo</label>
    <input class="finput" id="sName" type="text" placeholder="Tu nombre completo" autocomplete="name" oninput="checkForSavedSession()">
    <label class="flabel" id="lbl-group-el" for="sGroup">Grupo</label>
    <input class="finput" id="sGroup" type="text" placeholder="ej. 3A" autocomplete="off" oninput="checkForSavedSession()">
    <button class="sbtn" id="startBtn" onclick="startLesson()">Comenzar →</button>
    <div class="serr" id="startErr"></div>
    <div id="restoreBar">
      <strong id="restoreMsg">📂 Saved session found</strong><br>
      <span id="restoreSub">Would you like to continue where you left off?</span>
      <div class="rbar-btns">
        <button class="rbtn rbtn-yes" id="restoreBtn" onclick="restoreSession()">Resume session</button>
        <button class="rbtn rbtn-no"  id="dismissBtn" onclick="dismissRestore()">Start over</button>
      </div>
    </div>
    <div class="wfoot" style="display:flex;justify-content:center;align-items:center;padding-top:.5rem">
      <svg width="196" height="48" viewBox="0 0 140 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-wf">
        <style>
          .liaxa-wf .lw-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-wf .lw-acc  { fill:var(--gold); }
          .liaxa-wf .lw-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-wf .lw-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lw-line"/>
        <circle cx="22" cy="10" r="2.5" class="lw-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lw-bar"/>
        <text x="42" y="22" class="lw-txt">LIAXA</text>
      </svg>
    </div>
  </div>
</div>

<!-- LESSON -->
<div id="lessonScreen">
  <div class="stickybar">
    <div class="hlogos">
      <!-- LOGO: single institution logo, mirrors the welcome screen -->
      <img id="hlogo-left"  src="" alt="Institution" style="display:none">
    </div>
    <div class="hsep"></div>
    <div class="htitle">El Calor como Forma de Energía</div>
    <div class="hsep"></div>
    <div class="halexis">
      <svg width="120" height="30" viewBox="0 0 100 34" xmlns="http://www.w3.org/2000/svg" class="liaxa-hdr">
        <style>
          .liaxa-hdr .lh-line { stroke:var(--green); stroke-width:2; fill:none; }
          .liaxa-hdr .lh-acc  { fill:var(--gold); }
          .liaxa-hdr .lh-bar  { stroke:var(--gold); stroke-width:2; }
          .liaxa-hdr .lh-txt  { font-family:'Crimson Pro',serif; font-weight:700; letter-spacing:.08em; fill:var(--green); font-size:16px; }
        </style>
        <polyline points="4,24 10,18 16,20 22,10" class="lh-line"/>
        <circle cx="22" cy="10" r="2.5" class="lh-acc"/>
        <line x1="32" y1="6" x2="32" y2="28" class="lh-bar"/>
        <text x="42" y="22" class="lh-txt">LIAXA</text>
      </svg>
    </div>
    <div class="hchip" id="studentChip"></div>
    <div class="lang-toggle"><button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button><button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button></div>
    <button class="tbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <div class="progbar"><div class="progfill" id="progFill"></div></div>
  <div class="lbody" id="lessonBody"></div>

  <!-- RESULTS SECTION (always in DOM, revealed by showResults) -->
  <div class="section" id="s_results" style="display:none;">
    <div class="sbody" style="text-align:center;padding:2rem 1rem;">
      <button class="sbtn" id="dlBtn" onclick="generatePDF()" style="max-width:280px;margin:0 auto;">⬇ &nbsp;<span id="pdfBtnLbl">Descargar Resultados PDF</span></button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CENTRALIZED SCHOOL CONFIG (Rule 16) — ships UNBRANDED (Rule 11).
   The ONLY rebranding point. build_all.py substitutes these exact fields
   (BRAND_FIELDS / RGB_FIELDS / logo*) downstream; :root/dark stay as fallback.
   Neutral defaults below == the static :root/dark values, so unbranded == no-op.
   ══════════════════════════════════════════════════════════════════════════ */
var SCHOOL = {
  primary:'#1a4a8a', primaryDark:'#0c2547', primaryBg:'#e7edf6',
  accent:'#e07b1a', accentBg:'#fbeddf',
  darkPrimary:'#437bc6', darkPrimaryDark:'#74a5e6', darkPrimaryBg:'#0c203a',

/* ================================================
   SEEDED RNG
   ================================================ */
function seededRng(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (Math.imul(31, s) + seed.charCodeAt(i)) | 0;
  return function() {
    s = (s + 0x9e3779b9) | 0;
    var t = s ^ (s >>> 16);
    t = Math.imul(t, 0x21f0aaad);
    t ^= (t >>> 15);
    t = Math.imul(t, 0x735a2d97);
    return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
  };
}
function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================================================
   CANVAS
   ================================================ */
function initCanvas(canvas) {
  var dpr  = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0f2d5a';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  var drawing = false, lx = 0, ly = 0;
  var tb = canvas.closest('.cvwrap').querySelector('.ctoolbar');
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  }
  function onDown(e)  { e.preventDefault(); drawing = true; var p = getPos(e); lx = p[0]; ly = p[1]; }
  function onMove(e)  { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); lx=p[0]; ly=p[1]; }
  function onUp()     { drawing = false; saveSession(); }
  canvas.addEventListener('mousedown',  onDown, { passive:false });
  canvas.addEventListener('mousemove',  onMove, { passive:false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive:false });
  canvas.addEventListener('touchmove',  onMove, { passive:false });
  canvas.addEventListener('touchend',   onUp);
  tb.querySelectorAll('.tbtn2').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (btn.classList.contains('bpen'))    { ctx.lineWidth = 2; }
      if (btn.classList.contains('bmarker')) { ctx.lineWidth = 10; ctx.globalAlpha = 0.45; }
      if (btn.classList.contains('beraser')) { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 20; }
    });
  });
  tb.querySelectorAll('.cdot').forEach(function(dot) {
    dot.addEventListener('click', function() {
      tb.querySelectorAll('.cdot').forEach(function(d) { d.classList.remove('sel'); });
      dot.classList.add('sel');
      ctx.strokeStyle = dot.dataset.color;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      tb.querySelectorAll('.tbtn2').forEach(function(b) { b.classList.remove('on'); });
      tb.querySelector('.bpen').classList.add('on');
    });
  });
  tb.querySelector('.clrbtn').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  });
}

/* ================================================
   ANSWER HANDLER — two-tap confirmation (Rule 8)
   Prevents accidental answer selection while scrolling on mobile.
   First tap highlights in gold (pending). Second tap on same option confirms.
   ================================================ */
function handleMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');

  // Second tap on same option → confirm
  if (prob.pendingChoice === chosenIdx) {
    prob.studentChoice = chosenIdx;
    prob.pendingChoice = null;
    var isOk = (chosenIdx === prob.correctIdx);
    opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
    opts.forEach(function(o, i) {
      if (i === prob.correctIdx) o.classList.add('rc');
      if (i === chosenIdx && isOk)  o.classList.add('sc');
      if (i === chosenIdx && !isOk) o.classList.add('sw');
    });
    var fb = document.getElementById('fb' + probIdx);
    fb.innerHTML = (isOk ? '<strong>'+t('fb-correct')+'</strong> ' : '<strong>'+t('fb-wrong')+'</strong> ') + prob.explanation;
    fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');
    document.getElementById('pc' + probIdx).classList.add(isOk ? 'ok' : 'bad');
    if (isOk) correctCount++;
    answeredCount++;
    document.getElementById('progFill').style.width = (answeredCount / problems.length * 100) + '%';
    saveSession();
    if (answeredCount === problems.length) setTimeout(showResults, 700);
    return;
  }

  // First tap → highlight as pending, clear any previous pending
  prob.pendingChoice = chosenIdx;
  opts.forEach(function(o) { o.classList.remove('pending'); });
  opts[chosenIdx].classList.add('pending');
}

// Direct confirm — used by restoreSession to bypass two-tap
function confirmMC(probIdx, chosenIdx) {
  var prob = problems[probIdx];
  if (prob.studentChoice !== null) return;
  var opts = document.querySelectorAll('#pc' + probIdx + ' .mcopt');
  prob.studentChoice = chosenIdx;
  prob.pendingChoice = null;
  var isOk = (chosenIdx === prob.correctIdx);
  opts.forEach(function(o) { o.classList.add('dis'); o.classList.remove('pending'); });
  opts.forEach(function(o, i) {
    if (i === prob.correctIdx) o.classList.add('rc');
    if (i === chosenIdx && isOk)  o.classList.add('sc');
    if (i === chosenIdx && !isOk) o.classList.add('sw');
  });
  var fb = document.getElementById('fb' + probIdx);

  fb.className = 'mcfb show ' + (isOk ? 'fbok' : 'fbbad');

}

var GW_DRAWS = [];
function fitCanvas(c){
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth || 320;
  var h = c.clientHeight || 236;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
}
function regDraw(fn){ GW_DRAWS.push(fn); setTimeout(fn, 140); setTimeout(fn, 520); }
(function(){
  var to = null;
  window.addEventListener('resize', function(){
    clearTimeout(to);
    to = setTimeout(function(){ GW_DRAWS.forEach(function(f){ try{ f(); }catch(e){} }); }, 120);

})();

/* Termómetro reutilizable: tubo con bulbo y una columna que sube con frac. */
function thermoDraw(ctx, x, top, h, frac, col){
  var r = 10;
  var f = Math.max(0, Math.min(1, frac));
  ctx.fillStyle = cssv('--surface');
  ctx.fillRect(x - 6, top, 12, h);
  ctx.beginPath(); ctx.arc(x, top + h + r - 2, r, 0, 6.284); ctx.fill();
  ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.5;
  ctx.strokeRect(x - 6, top, 12, h);
  ctx.beginPath(); ctx.arc(x, top + h + r - 2, r, 0, 6.284); ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, top + h + r - 2, r - 3, 0, 6.284); ctx.fill();
  var fh = (h - 4) * f;
  ctx.fillRect(x - 3, top + h - fh, 6, fh);
}
/* Flamas bajo un recipiente. */
function flames(ctx, x0, x1, y, col){
  ctx.fillStyle = col;
  for (var x = x0 + 8; x < x1 - 4; x += 16){
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + 5, y - 14); ctx.lineTo(x + 10, y);
    ctx.closePath(); ctx.fill();
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 1 :: LA OLLA EN LA ESTUFA
   Dos deslizadores: cuánta agua se pone y cuántos grados debe subir. El nivel
   del agua y la columna del termómetro responden al instante, y la barra de
   abajo mide el calor que hay que entregar. Tres metas de energía.
   ══════════════════════════════════════════════════════════════════════════ */
function w1(rng, host){
  var metas = shuffle([42, 84, 126, 168, 210, 252, 336, 420, 630, 840], rng).slice(0, 3);
  var r = 0, tries = 0, done = false;
  var m = 1, dT = 5;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'La olla en la estufa', en:'The pot on the stove' }) + '<span class="gw-tag" id="w1tag"></span></div>' +
    '<div class="gw-q" id="w1q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Cambia cuánta agua pones y cuántos grados quieres que suba. Mira cuál de los dos deslizadores mueve más la barra del calor entregado.',
      en:'Change how much water you put in and how many degrees you want it to rise. Watch which of the two sliders moves the delivered heat bar more.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w1c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Agua', en:'Water' }) + '</span><input type="range" id="w1m" min="1" max="5" step="1" value="1"><span class="gw-sv" id="w1mv">1 kg</span></div>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Sube', en:'Rise' }) + '</span><input type="range" id="w1t" min="5" max="40" step="5" value="5"><span class="gw-sv" id="w1tv">5 °C</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Agua', en:'Water' }) + '</div><div class="gw-cv" id="w1o1">1 kg</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Grados que sube', en:'Degrees it rises' }) + '</div><div class="gw-cv" id="w1o2">5 °C</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Calor entregado', en:'Heat delivered' }) + '</div><div class="gw-cv" id="w1o3">21 kJ</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w1k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w1c');
  function Q(){ return 42 * m * dT / 10; }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var baseY = H - 58;
    var potW = Math.min(140, W * 0.42), potH = 80;
    var px = 22, py = baseY - potH;
    ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(10, baseY); ctx.lineTo(W - 10, baseY); ctx.stroke();
    flames(ctx, px, px + potW, baseY, cssv('--gold'));
    ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 2;
    ctx.strokeRect(px, py, potW, potH);
    var wh = (potH - 8) * (m / 5);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(px + 3, py + potH - 4 - wh, potW - 6, wh);
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'center';
    ctx.fillText(m + ' kg', px + potW / 2, py - 8);
    ctx.fillText(L({ es:'agua', en:'water' }), px + potW / 2, baseY + 16);
    var tx = px + potW + 44;
    thermoDraw(ctx, tx, py + 6, potH - 22, dT / 40, cssv('--bad'));
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'center';
    ctx.fillText('+' + dT + ' °C', tx, py - 8);
    var barY = H - 34, barX = 16, barW = W - 32;
    ctx.fillStyle = cssv('--surface');
    ctx.fillRect(barX, barY, barW, 18);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, 18);
    ctx.fillStyle = cssv('--green');
    ctx.fillRect(barX, barY, barW * Math.min(Q() / 840, 1), 18);
    if (!done){
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 3;
      var mx = barX + barW * Math.min(metas[r] / 840, 1);
      ctx.beginPath(); ctx.moveTo(mx, barY - 5); ctx.lineTo(mx, barY + 23); ctx.stroke();
    }
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'left';
    ctx.fillText(L({ es:'calor entregado', en:'heat delivered' }), barX, barY - 7);
  }
  regDraw(draw);

  function live(){
    host.querySelector('#w1mv').textContent = m + ' kg';
    host.querySelector('#w1tv').textContent = dT + ' °C';
    host.querySelector('#w1o1').textContent = m + ' kg';
    host.querySelector('#w1o2').textContent = dT + ' °C';
    host.querySelector('#w1o3').textContent = Q() + ' kJ';
    draw();
    if (done) return;
    var g = metas[r], q = Q();
    if (q === g){
      say(host, 'good', L({
        es:'Justo en la meta: ' + g + ' kJ. Confirma con el botón.',
        en:'Right on target: ' + g + ' kJ. Confirm with the button.'
      }));
    } else if (q < g){
      say(host, 'warm', L({
        es:'Vas en ' + q + ' kJ y la meta es ' + g + ' kJ. Falta calor: pon más agua o pídele una subida mayor.',
        en:'You are at ' + q + ' kJ and the target is ' + g + ' kJ. Not enough heat: add more water or ask for a bigger rise.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Vas en ' + q + ' kJ y la meta es ' + g + ' kJ. Te pasaste: quita agua o baja los grados que debe subir.',
        en:'You are at ' + q + ' kJ and the target is ' + g + ' kJ. Too much: take out water or lower the degrees it must rise.'
      }));
    }
  }
  function showRound(){
    tries = 0;
    host.querySelector('#w1tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w1q').innerHTML = L({
      es:'Meta: arma una olla que necesite exactamente <span class="gw-cv">' + metas[r] + ' kJ</span> de calor. Cada kilogramo de agua pide 4.2 kJ por cada grado que sube.',
      en:'Goal: set up a pot that needs exactly <span class="gw-cv">' + metas[r] + ' kJ</span> of heat. Each kilogram of water asks for 4.2 kJ per degree it rises.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w1tag').textContent = L({ es:'Olla dominada', en:'Pot mastered' });
      host.querySelector('#w1k').disabled = true;
      host.querySelector('#w1k').classList.add('solved');
      say(host, 'good', L({
        es:'Ya lo viste en la barra: el calor crece igual si duplicas el agua que si duplicas los grados. Los dos datos pesan lo mismo.',
        en:'You saw it on the bar: the heat grows the same whether you double the water or double the degrees. Both figures count equally.'
      }));
      return;
    }
    showRound();
  }
  function solveFor(g){
    for (var mm = 1; mm <= 5; mm++){
      for (var tt = 5; tt <= 40; tt += 5){
        if (42 * mm * tt / 10 === g) return [mm, tt];
      }
    }
    return [1, 5];
  }
  host.querySelector('#w1m').oninput = function(){ m = parseInt(this.value, 10); live(); };
  host.querySelector('#w1t').oninput = function(){ dT = parseInt(this.value, 10); live(); };
  host.querySelector('#w1k').onclick = function(){
    if (done) return;
    var g = metas[r];
    if (Q() === g){
      say(host, 'good', L({
        es:'Correcto: ' + m + ' kg de agua que suben ' + dT + ' °C piden ' + g + ' kJ.',
        en:'Correct: ' + m + ' kg of water rising ' + dT + ' °C ask for ' + g + ' kJ.'
      }));
      setTimeout(nextRound, 1100);
      return;
    }
    tries++;
    if (tries >= 3){
      var sol = solveFor(g);
      say(host, 'miss', L({
        es:'Una combinación que sirve: ' + sol[0] + ' kg subiendo ' + sol[1] + ' °C. Los 4.2 kJ se cobran una vez por cada kilogramo y por cada grado.',
        en:'One combination that works: ' + sol[0] + ' kg rising ' + sol[1] + ' °C. The 4.2 kJ are charged once for each kilogram and each degree.'
      }));
      m = sol[0]; dT = sol[1];
      host.querySelector('#w1m').value = String(m);
      host.querySelector('#w1t').value = String(dT);
      live();
      setTimeout(nextRound, 3000);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 2 :: EL TERMO DE LA MEZCLA
   Se juntan dos porciones de agua a distinta temperatura. El alumno mueve el
   termómetro del termo y ve dos barras enfrentadas: lo que recibe la fría y
   lo que entrega la caliente. La respuesta es el punto donde las barras
   quedan del mismo largo.
   ══════════════════════════════════════════════════════════════════════════ */
function w2(rng, host){
  var ROUNDS = [
    { m1:1, T1:20, m2:1, T2:60, Tf:40 },
    { m1:2, T1:10, m2:2, T2:50, Tf:30 },
    { m1:1, T1:10, m2:3, T2:50, Tf:40 },
    { m1:2, T1:20, m2:4, T2:50, Tf:40 },
    { m1:1, T1:30, m2:1, T2:70, Tf:50 },
    { m1:3, T1:20, m2:1, T2:60, Tf:30 },
    { m1:2, T1:15, m2:2, T2:45, Tf:30 },
    { m1:1, T1:25, m2:4, T2:50, Tf:45 }
  ];
  var rounds = shuffle(ROUNDS, rng).slice(0, 3);
  var r = 0, tries = 0, done = false, guess = rounds[0].T1;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El termo de la mezcla', en:'The mixing flask' }) + '<span class="gw-tag" id="w2tag"></span></div>' +
    '<div class="gw-q" id="w2q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Mueve el termómetro del termo. Las dos barras de abajo miden el calor que recibe el agua fría y el que entrega el agua caliente: busca el punto donde quedan iguales.',
      en:'Move the flask thermometer. The two bars below measure the heat the cold water receives and the heat the hot water gives up: look for the point where they match.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w2c"></canvas>' +
    '<div class="gw-slab"><span class="gw-cl">' + L({ es:'Termómetro', en:'Thermometer' }) + '</span><input type="range" id="w2s" min="0" max="80" step="1" value="' + rounds[0].T1 + '"><span class="gw-sv" id="w2sv">' + rounds[0].T1 + ' °C</span></div>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Recibe la fría', en:'Cold receives' }) + '</div><div class="gw-cv" id="w2a">0 kJ</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Entrega la caliente', en:'Hot gives up' }) + '</div><div class="gw-cv" id="w2b">0 kJ</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Diferencia', en:'Difference' }) + '</div><div class="gw-cv" id="w2d">0 kJ</div></div>' +
    '</div>' +
    '<div class="gw-row"><button class="gw-btn" id="w2k">' + L({ es:'Comprobar', en:'Check' }) + '</button></div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w2c');
  function cur(){ return rounds[Math.min(r, rounds.length - 1)]; }
  function gain(){ return 4.2 * cur().m1 * (guess - cur().T1); }
  function loss(){ return 4.2 * cur().m2 * (cur().T2 - guess); }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var c = cur();
    ctx.font = '10px "IBM Plex Sans", sans-serif';
    var baseY = H - 84;
    function jar(cx, mass, temp, col, lbl){
      var w = 34 + mass * 8, h = 30 + mass * 9;
      ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 1.5;
      ctx.strokeRect(cx - w / 2, baseY - h, w, h);
      ctx.fillStyle = col;
      ctx.fillRect(cx - w / 2 + 3, baseY - h + 6, w - 6, h - 9);
      ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'center';
      ctx.fillText(mass + ' kg · ' + temp + ' °C', cx, baseY - h - 6);
      ctx.fillText(lbl, cx, baseY + 14);
    }
    jar(W * 0.2, c.m1, c.T1, cssv('--green'), L({ es:'fría', en:'cold' }));
    jar(W * 0.5, c.m2, c.T2, cssv('--bad'), L({ es:'caliente', en:'hot' }));
    ctx.strokeStyle = cssv('--text3'); ctx.lineWidth = 2;
    ctx.strokeRect(W * 0.78 - 26, baseY - 76, 52, 76);
    ctx.fillStyle = cssv('--green-bg');
    ctx.fillRect(W * 0.78 - 23, baseY - 72, 46, 69);
    thermoDraw(ctx, W * 0.78, baseY - 66, 46, guess / 80, cssv('--bad'));
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'center';
    ctx.fillText(guess + ' °C', W * 0.78, baseY - 74);
    ctx.fillText(L({ es:'termo', en:'flask' }), W * 0.78, baseY + 14);
    var top = H - 58, bw = W - 120;
    var mx = Math.max(4.2 * c.m2 * (c.T2 - c.T1), 1);
    function bar(y, val, col, lbl){
      ctx.fillStyle = cssv('--surface');
      ctx.fillRect(96, y, bw, 14);
      ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1;
      ctx.strokeRect(96, y, bw, 14);
      ctx.fillStyle = col;
      ctx.fillRect(96, y, bw * Math.max(0, Math.min(val / mx, 1)), 14);
      ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'right';
      ctx.fillText(lbl, 90, y + 11);
    }
    bar(top, gain(), cssv('--green'), L({ es:'recibe', en:'receives' }));
    bar(top + 22, loss(), cssv('--bad'), L({ es:'entrega', en:'gives up' }));
  }
  regDraw(draw);

  function live(){
    var c = cur();
    host.querySelector('#w2sv').textContent = guess + ' °C';
    host.querySelector('#w2a').textContent = kjf(Math.max(gain(), 0)) + ' kJ';
    host.querySelector('#w2b').textContent = kjf(Math.max(loss(), 0)) + ' kJ';
    host.querySelector('#w2d').textContent = kjf(Math.abs(gain() - loss())) + ' kJ';
    draw();
    if (done) return;
    if (guess <= c.T1){
      say(host, 'warm', L({
        es:'Ahí el agua fría no recibiría nada. La mezcla tiene que quedar entre ' + c.T1 + ' °C y ' + c.T2 + ' °C: sube el termómetro.',
        en:'There the cold water would receive nothing. The mix has to land between ' + c.T1 + ' °C and ' + c.T2 + ' °C: raise the thermometer.'
      }));
    } else if (guess >= c.T2){
      say(host, 'warm', L({
        es:'Ahí la mezcla quedaría tan caliente como el agua caliente o más, y eso no puede pasar: baja el termómetro.',
        en:'There the mix would end as hot as the hot water or hotter, and that cannot happen: lower the thermometer.'
      }));
    } else if (guess === c.Tf){
      say(host, 'good', L({
        es:'Las dos barras quedaron del mismo largo: ' + kjf(gain()) + ' kJ de un lado y ' + kjf(loss()) + ' kJ del otro. Confirma con el botón.',
        en:'Both bars are the same length: ' + kjf(gain()) + ' kJ on one side and ' + kjf(loss()) + ' kJ on the other. Confirm with the button.'
      }));
    } else if (gain() < loss()){
      say(host, 'warm', L({
        es:'La caliente entrega ' + kjf(loss()) + ' kJ y la fría solo recibe ' + kjf(gain()) + ' kJ: todavía sobra calor, sube el termómetro.',
        en:'The hot water gives up ' + kjf(loss()) + ' kJ and the cold one only receives ' + kjf(gain()) + ' kJ: there is heat left over, raise the thermometer.'
      }));
    } else {
      say(host, 'warm', L({
        es:'La fría pide ' + kjf(gain()) + ' kJ y la caliente solo entrega ' + kjf(loss()) + ' kJ: no alcanza, baja el termómetro.',
        en:'The cold water asks for ' + kjf(gain()) + ' kJ and the hot one only gives up ' + kjf(loss()) + ' kJ: it is not enough, lower the thermometer.'
      }));
    }
  }
  function showRound(){
    tries = 0; guess = rounds[r].T1;
    host.querySelector('#w2s').value = String(guess);
    host.querySelector('#w2tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w2q').innerHTML = L({
      es:'En el termo se juntan <span class="gw-cv">' + rounds[r].m1 + ' kg</span> de agua a <span class="gw-cv">' + rounds[r].T1 + ' °C</span> con <span class="gw-cv">' + rounds[r].m2 + ' kg</span> a <span class="gw-cv">' + rounds[r].T2 + ' °C</span>. ¿En qué temperatura se quedan las dos?',
      en:'In the flask, <span class="gw-cv">' + rounds[r].m1 + ' kg</span> of water at <span class="gw-cv">' + rounds[r].T1 + ' °C</span> meet <span class="gw-cv">' + rounds[r].m2 + ' kg</span> at <span class="gw-cv">' + rounds[r].T2 + ' °C</span>. What temperature do both settle at?'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w2tag').textContent = L({ es:'Equilibrio logrado', en:'Equilibrium reached' });
      host.querySelector('#w2k').disabled = true;
      host.querySelector('#w2k').classList.add('solved');
      host.querySelector('#w2s').disabled = true;
      say(host, 'good', L({
        es:'En las tres rondas el punto final quedó del lado de la porción con más agua: el calor que sale de una es exactamente el que entra en la otra.',
        en:'In all three rounds the final point landed on the side of the larger portion: the heat leaving one is exactly the heat entering the other.'
      }));
      return;
    }
    showRound();
  }
  host.querySelector('#w2s').oninput = function(){ guess = parseInt(this.value, 10); live(); };
  host.querySelector('#w2k').onclick = function(){
    if (done) return;
    var c = cur();
    if (guess === c.Tf){
      say(host, 'good', L({
        es:'Correcto: las dos porciones se quedan en ' + c.Tf + ' °C.',
        en:'Correct: both portions settle at ' + c.Tf + ' °C.'
      }));
      setTimeout(nextRound, 1200);
      return;
    }
    tries++;
    if (tries >= 3){
      say(host, 'miss', L({
        es:'Era ' + c.Tf + ' °C: ahí la fría recibe ' + kjf(4.2 * c.m1 * (c.Tf - c.T1)) + ' kJ y la caliente entrega esa misma cantidad.',
        en:'It was ' + c.Tf + ' °C: there the cold water receives ' + kjf(4.2 * c.m1 * (c.Tf - c.T1)) + ' kJ and the hot water gives up that same amount.'
      }));
      guess = c.Tf;
      host.querySelector('#w2s').value = String(guess);
      live();
      setTimeout(nextRound, 3000);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 3 :: ¿POR DONDE VIAJA EL CALOR?
   Escenas cotidianas repartidas en tres cajones. Cada fallo deja reintentar
   con una pista que apunta a lo que hay que observar; a la tercera se muestra
   el cajón correcto con su razón.
   ══════════════════════════════════════════════════════════════════════════ */
function w3(rng, host){
  var BINS = [
    L({ es:'Conducción', en:'Conduction' }),
    L({ es:'Convección', en:'Convection' }),
    L({ es:'Radiación', en:'Radiation' })
  ];
  var ITEMS = [
    { es:'La cuchara de metal olvidada dentro de la olla de caldo, que quema al tomarla', en:'The metal spoon left inside the pot of broth, which burns when you pick it up', bin:0 },
    { es:'El humo del comal que sube hacia el techo mientras el aire frío baja por los lados', en:'The smoke from the griddle rising to the ceiling while cold air comes down the sides', bin:1 },
    { es:'El calor del Sol que cruza el espacio vacío y llega al patio de la escuela', en:'The heat of the Sun crossing empty space and reaching the school yard', bin:2 },
    { es:'El agua del fondo de la olla que sube y la de arriba que baja, dando vueltas', en:'The water at the bottom of the pot rising and the water on top going down, circling', bin:1 },
    { es:'La plancha caliente que va calentando la tabla de madera donde está apoyada', en:'The hot iron warming the wooden board it is resting on', bin:0 },
    { es:'La cara que se siente tibia frente a la fogata sin llegar a tocar nada', en:'A face that feels warm in front of the bonfire without touching anything', bin:2 },
    { es:'La varilla de metal que se calienta poco a poco desde la punta metida en el fuego', en:'The metal rod warming little by little from the tip placed in the fire', bin:0 },
    { es:'La mano puesta cerca del foco encendido, que se entibia sin rozarlo', en:'A hand held near the lit bulb, which warms up without brushing it', bin:2 }
  ];
  var seq = shuffle(ITEMS, rng).slice(0, 6);
  var i = 0, tries = 0, hits = 0, done = false;
  var WHY = [
    L({ es:'el calor pasa por contacto directo, de partícula a partícula dentro del material', en:'the heat passes by direct contact, from particle to particle inside the material' }),
    L({ es:'lo caliente sube, lo frío baja y el propio fluido acarrea el calor en esas corrientes', en:'the hot part rises, the cold part sinks and the fluid itself carries the heat in those currents' }),
    L({ es:'el calor viaja como onda y llega sin necesitar aire ni contacto', en:'the heat travels as a wave and arrives without needing air or contact' })
  ];

  function render(){
    if (done){
      host.innerHTML =
        '<div class="gw-h">' + L({ es:'¿Por dónde viaja el calor?', en:'How does the heat travel?' }) + '<span class="gw-tag">' + hits + '/6</span></div>' +
        '<div class="gw-fb good">' + L({
          es:'Escenas repartidas. Si hay contacto, es conducción; si algo circula, es convección; si cruza el aire o el vacío sin tocar nada, es radiación.',
          en:'Scenes sorted. If there is contact, it is conduction; if something circulates, it is convection; if it crosses air or vacuum without touching, it is radiation.'
        }) + '</div>';
      return;
    }
    host.innerHTML =
      '<div class="gw-h">' + L({ es:'¿Por dónde viaja el calor?', en:'How does the heat travel?' }) + '<span class="gw-tag cls-prog">' + (i + 1) + ' / 6</span></div>' +
      '<div class="gw-mini">' + L({
        es:'Lee la escena y elige el cajón donde va. Si no atinas, vuelve a intentar con la pista.',
        en:'Read the scene and choose the box it belongs to. If you miss, try again with the hint.'
      }) + '</div>' +
      '<div class="cls-card">' + seq[i][LANG] + '</div>' +
      '<div class="gw-row cls-bins">' +
        '<button class="gw-btn" id="w3b0">' + BINS[0] + '</button>' +
        '<button class="gw-btn" id="w3b1">' + BINS[1] + '</button>' +
        '<button class="gw-btn" id="w3b2">' + BINS[2] + '</button>' +
      '</div>' +
      '<div class="gw-fb"></div>';
    host.querySelector('#w3b0').onclick = function(){ choose(0); };
    host.querySelector('#w3b1').onclick = function(){ choose(1); };
    host.querySelector('#w3b2').onclick = function(){ choose(2); };
  }
  function advance(){
    i++; tries = 0;
    if (i >= seq.length) done = true;
    render();
  }
  function choose(b){
    var it = seq[i];
    if (b === it.bin){
      hits++;
      say(host, 'good', L({
        es:'Sí, porque ' + WHY[it.bin] + '.',
        en:'Yes, because ' + WHY[it.bin] + '.'
      }));
      setTimeout(advance, 1300);
      return;
    }
    tries++;
    if (tries >= 3){
      say(host, 'miss', L({
        es: 'Iba en "' + BINS[it.bin] + '", porque ' + WHY[it.bin] + '.',
        en: 'It belonged in "' + BINS[it.bin] + '", because ' + WHY[it.bin] + '.'
      }));
      setTimeout(advance, 2600);
      return;
    }
    say(host, 'warm', L({
      es:'Todavía no. Pregúntate si hay dos cosas tocándose, si algo circula moviéndose, o si el calor llega sin tocar nada.',
      en:'Not yet. Ask yourself whether two things are touching, whether something circulates by moving, or whether the heat arrives without touching anything.'
    }));
  }
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   MANIPULATIVO 4 :: EL CLAVO Y EL MARTILLO
   Cada golpe entrega la misma energía al clavo y lo calienta un poco. El
   alumno da martillazos hasta llegar a la meta y puede enfriar el clavo para
   volver a empezar cuantas veces quiera.
   ══════════════════════════════════════════════════════════════════════════ */
function w4(rng, host){
  var Es = shuffle([40, 60, 80], rng);
  var ks = shuffle([3, 4, 5, 6], rng);
  var rounds = [
    { E: Es[0], k: ks[0] },
    { E: Es[1], k: ks[1] },
    { E: Es[2], k: ks[2] }
  ];
  var r = 0, tries = 0, done = false, n = 0;
  var COST = 20;

  host.innerHTML =
    '<div class="gw-h">' + L({ es:'El clavo y el martillo', en:'The nail and the hammer' }) + '<span class="gw-tag" id="w4tag"></span></div>' +
    '<div class="gw-q" id="w4q"></div>' +
    '<div class="gw-mini">' + L({
      es:'Da martillazos y observa el termómetro del clavo. Si te pasas, enfría el clavo y empieza otra vez: puedes repetirlo las veces que quieras.',
      en:'Strike with the hammer and watch the nail thermometer. If you overshoot, cool the nail and start again: you can repeat as often as you like.'
    }) + '</div>' +
    '<canvas class="gw-cvs" id="w4c"></canvas>' +
    '<div class="gw-out">' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Martillazos', en:'Blows' }) + '</div><div class="gw-cv" id="w4o1">0</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Energía entregada', en:'Energy delivered' }) + '</div><div class="gw-cv" id="w4o2">0 J</div></div>' +
      '<div class="gw-cell"><div class="gw-cn">' + L({ es:'Subida del clavo', en:'Nail rise' }) + '</div><div class="gw-cv" id="w4o3">0 °C</div></div>' +
    '</div>' +
    '<div class="gw-row">' +
      '<button class="gw-btn" id="w4h">' + L({ es:'Dar un martillazo', en:'Strike a blow' }) + '</button>' +
      '<button class="gw-btn" id="w4r">' + L({ es:'Enfriar el clavo', en:'Cool the nail' }) + '</button>' +
      '<button class="gw-btn" id="w4k">' + L({ es:'Comprobar', en:'Check' }) + '</button>' +
    '</div>' +
    '<div class="gw-fb"></div>';

  var cv = host.querySelector('#w4c');
  function per(){ return rounds[Math.min(r, 2)].E / COST; }
  function target(){ return rounds[Math.min(r, 2)].k * per(); }
  function rise(){ return n * per(); }

  function draw(){
    var g = fitCanvas(cv), ctx = g.ctx, W = g.w, H = g.h;
    var woodY = H - 54;
    ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.fillStyle = cssv('--surface');
    ctx.fillRect(20, woodY, W - 40, 34);
    ctx.strokeStyle = cssv('--border'); ctx.lineWidth = 1.5;
    ctx.strokeRect(20, woodY, W - 40, 34);
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'left';
    ctx.fillText(L({ es:'madera', en:'wood' }), 26, woodY + 22);
    var nx = W * 0.34;
    var sunk = Math.min(n, 8) * 2;
    var headY = woodY - 62 + sunk;
    var frac = Math.min(rise() / Math.max(target(), 1), 1.4);
    ctx.strokeStyle = frac > 0.05 ? cssv('--bad') : cssv('--text3');
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(nx, headY); ctx.lineTo(nx, woodY + 12); ctx.stroke();
    ctx.fillStyle = frac > 0.05 ? cssv('--bad') : cssv('--text3');
    ctx.fillRect(nx - 11, headY - 6, 22, 7);
    if (frac > 0.05){
      ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
      var rays = Math.min(Math.round(frac * 4), 6);
      for (var i = 0; i < rays; i++){
        var a = -0.9 + i * 0.36;
        ctx.beginPath();
        ctx.moveTo(nx + Math.cos(a) * 18, headY + Math.sin(a) * 18 - 4);
        ctx.lineTo(nx + Math.cos(a) * 27, headY + Math.sin(a) * 27 - 4);
        ctx.stroke();
      }
    }
    ctx.fillStyle = cssv('--green-dark');
    ctx.fillRect(nx - 40, headY - 40, 34, 12);
    ctx.fillRect(nx - 27, headY - 28, 8, 22);
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'center';
    ctx.fillText(L({ es:'clavo', en:'nail' }), nx, woodY + 48);
    var tx = W * 0.76;
    thermoDraw(ctx, tx, 24, H - 100, Math.min(rise() / Math.max(target(), 1), 1), cssv('--bad'));
    ctx.strokeStyle = cssv('--gold'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tx - 16, 26); ctx.lineTo(tx + 16, 26); ctx.stroke();
    ctx.fillStyle = cssv('--text3'); ctx.textAlign = 'center';
    ctx.fillText(L({ es:'meta ', en:'target ' }) + target() + ' °C', tx, 16);
    ctx.fillText('+' + rise() + ' °C', tx, H - 60);
  }
  regDraw(draw);

  function live(){
    host.querySelector('#w4o1').textContent = String(n);
    host.querySelector('#w4o2').textContent = (n * rounds[Math.min(r, 2)].E) + ' J';
    host.querySelector('#w4o3').textContent = rise() + ' °C';
    draw();
    if (done) return;
    var g = target();
    if (rise() === g){
      say(host, 'good', L({
        es:'El clavo está justo en +' + g + ' °C. Confirma con el botón.',
        en:'The nail is right at +' + g + ' °C. Confirm with the button.'
      }));
    } else if (rise() < g){
      say(host, 'warm', L({
        es:'Vas en +' + rise() + ' °C y la meta es +' + g + ' °C: cada golpe deja ' + rounds[r].E + ' J en el clavo, así que falta seguir golpeando.',
        en:'You are at +' + rise() + ' °C and the target is +' + g + ' °C: each blow leaves ' + rounds[r].E + ' J in the nail, so keep striking.'
      }));
    } else {
      say(host, 'warm', L({
        es:'Vas en +' + rise() + ' °C y ya rebasaste la meta de +' + g + ' °C: enfría el clavo y cuenta mejor los golpes.',
        en:'You are at +' + rise() + ' °C and you have passed the target of +' + g + ' °C: cool the nail and count the blows more carefully.'
      }));
    }
  }
  function showRound(){
    tries = 0; n = 0;
    host.querySelector('#w4tag').textContent = L({ es:'Ronda ', en:'Round ' }) + (r + 1) + '/3';
    host.querySelector('#w4q').innerHTML = L({
      es:'Cada martillazo deja <span class="gw-cv">' + rounds[r].E + ' J</span> en el clavo y el clavo sube 1 °C por cada 20 J que recibe. Deja el clavo exactamente <span class="gw-cv">' + target() + ' °C</span> más caliente.',
      en:'Each blow leaves <span class="gw-cv">' + rounds[r].E + ' J</span> in the nail and the nail rises 1 °C for every 20 J it receives. Leave the nail exactly <span class="gw-cv">' + target() + ' °C</span> hotter.'
    });
    live();
  }
  function nextRound(){
    r++;
    if (r >= 3){
      done = true;
      host.querySelector('#w4tag').textContent = L({ es:'Clavo entendido', en:'Nail understood' });
      ['#w4h', '#w4r', '#w4k'].forEach(function(s){ host.querySelector(s).disabled = true; });
      host.querySelector('#w4k').classList.add('solved');
      say(host, 'good', L({
        es:'El martillo nunca tocó una flama y el clavo se calentó igual: la energía del golpe no se perdió, se quedó dentro del clavo como calor.',
        en:'The hammer never touched a flame and the nail heated up anyway: the energy of the blow was not lost, it stayed inside the nail as heat.'
      }));
      return;
    }
    showRound();
  }
  host.querySelector('#w4h').onclick = function(){ if (done) return; n++; live(); };
  host.querySelector('#w4r').onclick = function(){ if (done) return; n = 0; live(); };
  host.querySelector('#w4k').onclick = function(){
    if (done) return;
    var g = target();
    if (rise() === g){
      say(host, 'good', L({
        es:'Correcto: ' + n + ' golpes de ' + rounds[r].E + ' J dejan ' + (n * rounds[r].E) + ' J en el clavo y lo suben ' + g + ' °C.',
        en:'Correct: ' + n + ' blows of ' + rounds[r].E + ' J leave ' + (n * rounds[r].E) + ' J in the nail and raise it ' + g + ' °C.'
      }));
      setTimeout(nextRound, 1200);
      return;
    }
    tries++;
    if (tries >= 3){
      say(host, 'miss', L({
        es:'Eran ' + rounds[r].k + ' martillazos: ' + (rounds[r].k * rounds[r].E) + ' J repartidos entre los 20 J que cuesta cada grado dan ' + g + ' °C.',
        en:'It was ' + rounds[r].k + ' blows: ' + (rounds[r].k * rounds[r].E) + ' J shared over the 20 J each degree costs give ' + g + ' °C.'
      }));
      n = rounds[r].k; live();
      setTimeout(nextRound, 3000);
      return;
    }
    live();
  };
  showRound();
}

/* ══════════════════════════════════════════════════════════════════════════

function mkP1(rng){

      }),

      correct: 0,
      hint: L({
        es:'Saca primero cuántos grados sube el agua, no la marca final del termómetro. Después encadena ese número con los kilogramos y con el dato del agua.',

      }),
      exp: L({
        es:'El agua sube ' + T1 + ' menos ' + T0 + ', o sea ' + dT + ' °C. Multiplica 4.2 × ' + m + ' × ' + dT + ' = ' + Q + ', así que hay que entregarle ' + Q + ' kJ. Usar ' + T1 + ' en lugar de ' + dT + ' cobra un calentamiento que hubiera empezado en cero grados.',
        en:'The water rises ' + T1 + ' minus ' + T0 + ', that is ' + dT + ' °C. Multiply 4.2 × ' + m + ' × ' + dT + ' = ' + Q + ', so ' + Q + ' kJ must be delivered. Using ' + T1 + ' instead of ' + dT + ' charges for a heating that would have started at zero degrees.'
      })

  var c2 = pk(rng, casos2), m2 = c2[0], dT2 = c2[1], T02 = c2[2];

      en:'A heater delivers ' + Q2 + ' kJ of heat to ' + m2 + ' kg of water that were at ' + T02 + ' °C. Water needs 4.2 kJ for each kilogram and for each degree it rises, and nothing is lost outwards. What temperature does the water end at?'
    }),
    options: [ (T02 + dT2) + ' °C', dT2 + ' °C', (T02 + m2 * dT2) + ' °C', (T02 + 42 * dT2 / 10) + ' °C' ],
    correct: 0,
    hint: L({
      es:'Reparte el calor entre los kilogramos y entre lo que cuesta cada grado: eso da la subida. La pregunta no pide la subida, pide dónde queda el termómetro.',
      en:'Share the heat over the kilograms and over what each degree costs: that gives the rise. The question does not ask for the rise, it asks where the thermometer ends up.'
    }),
    exp: L({
      es:'Calentar ' + m2 + ' kg un grado cuesta 4.2 × ' + m2 + ' = ' + (42 * m2 / 10) + ' kJ. Con ' + Q2 + ' kJ alcanza para ' + dT2 + ' grados de subida, y como partió de ' + T02 + ' °C, el agua queda en ' + (T02 + dT2) + ' °C.',
      en:'Heating ' + m2 + ' kg by one degree costs 4.2 × ' + m2 + ' = ' + (42 * m2 / 10) + ' kJ. With ' + Q2 + ' kJ there is enough for a rise of ' + dT2 + ' degrees, and since it started at ' + T02 + ' °C, the water ends at ' + (T02 + dT2) + ' °C.'
    })
